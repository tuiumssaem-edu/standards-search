 진로와 관련된 자신의 고유한 특성을 이해하도록 한다.","n":[],"p":411,"b":2},{"c":"[12직준01-02]","k":"선택","sk":"전문 교과(직업·생활)","s":"직업준비","g":"고등학교 1~3학년","d":"자아 인식","t":"자신의 직업 흥미와 적성, 가치관 등을 이해하여 관련된 진로를 파악한다.","m":"자신에 대한 이해를 바탕으로 자신에게 맞는 진로를 파악하는 데 목적이 있는 성취기준이다. 이를 위해 내면적 자아 요소인 흥미, 성격, 적성, 가치관 등을 파악하여 자신의 진로를 설계하는 데 필요한 정보를 수집하는 것에 주안점을 둔다. 직업 흥미 검사, 직업 적성 검사, 직업 가치관 검사 등의 진로 심리 검사를 활용하여 학생 스스로 진로 개발 단계를 수행하도록 한다.","n":[],"p":411,"b":2},{"c":"[12직준01-03]","k":"선택","sk":"전문 교과(직업·생활)","s":"직업준비","g":"고등학교 1~3학년","d":"자아 인식","t":"자신의 장단점을 탐색하고 분석하여 직업적 역량을 파악한다.","m":"","n":[],"p":411,"b":2},{"c":"[12직준01-04]","k":"선택","sk":"전문 교과(직업·생활)","s":"직업준비","g":"고등학교 1~3학년","d":"자아 인식","t":"적극적인 자기 개발 과정에서 자기주도적인 태도와 자신감을 갖는다.","m":"자기 개발 과정은 취업뿐만 아니라 자신의 삶에 대한 주도적인 태도와 자신감 함양에 도움이 된다. 따라서 자기 개발의 의미와 중요성에 대한 인식을 토대로 계획을 수립하고, 계획 실행 시 고려할 방해 요인을 계획에 반영하면서 지속적인 자기 개발 태도 함양에 주안점을 둔다. 이를 위해 취업에 성공한 사례, 인터뷰 등 실제적인 자료를 함께 활용하도록 한다.","n":[],"p":411,"b":2},{"c":"[12직준01-05]","k":"선택","sk":"전문 교과(직업·생활)","s":"직업준비","g":"고등학교 1~3학년","d":"자아 인식","t":"자신에 대한 종합적인 이해를 바탕으로 진로 정체감을 형성한다.","m":"직업에 대한 자신의 목표, 흥미, 능력에 대한 이해를 바탕으로 한 진로 정체감은 직업인으로서 자신의 가치를 확신하는 것이다. 이 성취기준에서는 자아 인식 영역에서 학습한 내용을 바탕으로 자신의 진로에 대한 청사진을 마련하도록 하는 데 주안점을 둔다. 이를 위해 평소에 추구하는 가치관, 신체적 조건, 성격, 능력 등을 객관적으로 파악할 수 있는 경험을 제공하고 여러 정보를 종합하여 자신의 미래상을 갖도록 한다.","n":[],"p":411,"b":2},{"c":"[12직준02-01]","k":"선택","sk":"전문 교과(직업·생활)","s":"직업준비","g":"고등학교 1~3학년","d":"직업 탐색","t":"직업의 개인적⋅사회적 가치를 인식하고 다양한 직업 탐색 과정에서 희망 직업을 찾는다.","m":"","n":[],"p":412,"b":2},{"c":"[12직준02-02]","k":"선택","sk":"전문 교과(직업·생활)","s":"직업준비","g":"고등학교 1~3학년","d":"직업 탐색","t":"미래의 사회 변화와 그에 따른 직업 세계의 변화를 이해한다.","m":"고용 구조의 변화, 과학 기술의 발전, 기후변화 등 미래의 주요한 사회 변화를 예측하고 그로써 파생되는 직업 세계의 변화를 이해하는 데 목적이 있다. 따라서 세부적인 직업을 탐색하기보다 시대에 따른 직업의 변화 양상을 이해하는 것에 주안점을 둔다. 이를 위해 4차 산업혁명이 가져올 미래 사회 모습을 제시하고 그로 인해 변화될 일자리, 산업, 경제 영역이나 초지능화, 초연결 사회, 공유 경제, 공유 사회 등에 관련한 내용을 다룬다.","n":[],"p":412,"b":2},{"c":"[12직준02-03]","k":"선택","sk":"전문 교과(직업·생활)","s":"직업준비","g":"고등학교 1~3학년","d":"직업 탐색","t":"시대의 흐름에 따라 변화하는 직업을 탐색한다.","m":"","n":[],"p":412,"b":2},{"c":"[12직준02-04]","k":"선택","sk":"전문 교과(직업·생활)","s":"직업준비","g":"고등학교 1~3학년","d":"직업 탐색","t":"미래 사회가 요구하는 직업적 역량을 살펴보고 적절한 대응 방법을 익힌다.","m":"유연한 생각과 다양한 관점으로 미래의 직업 세계 변화를 예측하고 대비할 수 있는 역량을 기르게 하고자 설정하였다. 이에 4차 산업혁명시대 미래인재의 핵심역량에 대한 능력과 자질을 점검하고 성찰하는 과정에서 미래 직업 환경에 대응하는 능력을 함양하는 데 주안점을 둔다. 이를 위해 4차 산업혁명 시대에 필요한 미래 핵심역량인 비판적 사고력, 문제 해결력, 창의력, 의사소통 능력, 협업 능력 등을 알아보고 자신의 능력을 점검⋅강화하여 미래 사회에 대응하는 역량을 높이도록 한다.","n":[],"p":412,"b":2},{"c":"[12직준03-01]","k":"선택","sk":"전문 교과(직업·생활)","s":"직업준비","g":"고등학교 1~3학년","d":"진로 계획","t":"다양한 직업 평가를 바탕으로 자신의 직업적 잠재력과 적성을 파악한다.","m":"표준화된 직업 능력 평가 도구를 사용하여 학생의 객관화된 직업 능력을 파악하는 것에 목적이 있다. 외부 전문가의 도움을 받아 직업 평가를 실시하여 그 결과를 수집하거나, 지역사회 내 취업 가능한 직무의 수행 정도를 상황 평가하여 학생의 직업적 잠재력과 적성을 파악하는 데 중점을 둔다. 이 평가 결과는 학생의 직업적 흥미와 관심도를 파악하기보다는 지역사회 내 취업 가능한 직종에서 학생의 직무 수행 능력, 취업 가능 여부, 안정된 직업생활 유지 가능 여부 등을 파악하는 데에 초점을 둔다.","n":[],"p":413,"b":2},{"c":"[12직준03-02]","k":"선택","sk":"전문 교과(직업·생활)","s":"직업준비","g":"고등학교 1~3학년","d":"진로 계획","t":"다양한 직업 정보를 수집하고, 직업 선택을 위한 내외적 요인을 파악한다.","m":"자신에게 적합한 지역사회 내 직업 정보를 수집하고 이를 바탕으로 직업 선택 요인을 파악하는 데 목적이 있다. 직업 정보는 온오프라인 등 다양한 방법으로 수집하고구체적인 구직 정보에서 실제 지원 가능성이 있는 직업 정보를 선별한다. 선별된 직업 정보를 바탕으로 학생과 직업 선택 요인을 파악하는 데 중점을 둔다. 직업 선택 요인에는 내적 요인과 외적 요인이 있다. 내적 요인이란 개인의 흥미, 능력, 가치관, 교육 기회, 체력, 직업 평가 결과 등을 의미하고, 외적 요인은 직업의 요구 조건, 자격증, 작업 환경, 작업 시간 등을 의미한다. 가급적 지역사회 내의 다양한 직업 정보를 수집하여 직업 선택의 여러 요인을 파악하고 이를 고려하여 직업 선택이 이루어지도록 한다.","n":[],"p":413,"b":2},{"c":"[12직준03-03]","k":"선택","sk":"전문 교과(직업·생활)","s":"직업준비","g":"고등학교 1~3학년","d":"진로 계획","t":"직업 정보와 직업 평가 결과를 바탕으로 진로 목표를 설정하여 진로 계획서를 작성한다.","m":"","n":[],"p":413,"b":2},{"c":"[12직준03-04]","k":"선택","sk":"전문 교과(직업·생활)","s":"직업준비","g":"고등학교 1~3학년","d":"진로 계획","t":"진로 목표를 바탕으로 지역사회 내 직업 전환 서비스와 기관을 알아보고, 직업 전환 서비스 이용 방법을 탐색한다.","m":"","n":[],"p":413,"b":2},{"c":"[12직준03-05]","k":"선택","sk":"전문 교과(직업·생활)","s":"직업준비","g":"고등학교 1~3학년","d":"진로 계획","t":"직업 전환 서비스 등을 활용하여 직무 능력을 기르고, 바람직한 근로 태도와 자세를 익힌다.","m":"직업 전환 서비스 등의 다양한 방법을 활용하여 교내외에서 실제 취업 가능한 직종들을 실습하고 그 결과를 바탕으로 자신에게 적합한 직종에 필요한 직무 능력을 준비하는 데 중점을 둔다. 현장 실습지는 교내의 협조와 외부 기관의 도움을 받아 선정할 수있다. 교내외 현장 실습으로 학생은 자신의 직무 능력과 태도를 파악하고 실제 취업 가능 여부를 가늠하게 될 것이다. 이 성취기준은 직업⋅생활의 ‘직업현장실습’ 과목과 연계하고 필요에 따라 심화 학습이 이루어지도록 한다.","n":[],"p":413,"b":2},{"c":"[12직준03-06]","k":"선택","sk":"전문 교과(직업·생활)","s":"직업준비","g":"고등학교 1~3학년","d":"진로 계획","t":"진로 계획을 지속적으로 수정 보완함으로써 자기주도적인 진로 의사 결정 태도를기른다.","m":"진로 계획을 실현할 수 있는 다양한 직업 전환 서비스 전문 기관을 조사하고이용할 수 있는 구체적 방안을 탐색하는 데 중점을 둔다. 서비스 내용과 방법에 따라 국가 지원 제도와 정책에 대한 정보를 찾고 직업 전환 서비스 제공 기관을 이용하면서 학생의 진로 방향에 맞는 서비스 기관과 제도를 선택하게 한다.","n":[],"p":413,"b":2},{"c":"[12직준04-01]","k":"선택","sk":"전문 교과(직업·생활)","s":"직업준비","g":"고등학교 1~3학년","d":"취업과 창업","t":"온오프라인 등의 다양한 방법으로 취업 정보를 수집한다.","m":"","n":[],"p":415,"b":2},{"c":"[12직준04-02]","k":"선택","sk":"전문 교과(직업·생활)","s":"직업준비","g":"고등학교 1~3학년","d":"취업과 창업","t":"취업에 필요한 서류를 발급 절차에 따라 준비한다.","m":"취업에 필요한 서류들을 살펴보고, 적합한 절차로 발급되는 각종 증빙 서류를 학생 스스로 준비하는 데 목적이 있다. 취업을 위해 필요한 증빙 서류의 종류에는 개인 신분 증빙 자료, 학력 증명, 의료⋅보건 사항 증명, 건강 기록 증명 등이 있다. 직종과 직업에 따라 발급받아야 하는 서류의 종류와 발급 기관, 절차, 발급 소요 시간 등이 상이하므로 구체적인 구직 정보를 바탕으로 증빙 서류를 정확히 확인하여 발급받도록 한다. 최근에는 각종 증빙 서류 발급 절차가 간소화되고 있으므로 온오프라인을 이용한 대면, 비대면 등 다양한 방법을 활용하여 학생이 직접 서류를 발급받도록 한다.","n":[],"p":415,"b":2},{"c":"[12직준04-03]","k":"선택","sk":"전문 교과(직업·생활)","s":"직업준비","g":"고등학교 1~3학년","d":"취업과 창업","t":"취업을 위한 이력서와 자기소개서를 형식에 따라 작성한다.","m":"","n":[],"p":415,"b":2},{"c":"[12직준04-04]","k":"선택","sk":"전문 교과(직업·생활)","s":"직업준비","g":"고등학교 1~3학년","d":"취업과 창업","t":"취업을 위한 면접 시 필요한 요소를 알고, 면접 체험을 바탕으로 적절한 용모, 자세, 대화법 등을 익힌다.","m":"취업을 위한 면접 시 필요한 요소를 알고, 직간접적으로 면접을 체험함으로써 실제 면접 상황에서 능숙하게 대처하는 데 목적을 둔다. 면접에 필요한 요소에는 적절한 용모, 자세와 태도, 대화법 등이 있다. 따라서 면접 상황에 대한 모델링, 시연, 면접 참가 등 실제적인 활동을 바탕으로 면접을 준비하고 태도를 익히는 데 중점을 둔다. 면접은 학생의 취업 성공 여부와 직결되므로, 필요에 따라 반복적이고 집중적으로 지도하여 학생이 면접 상황에 능숙하고 유연하게 대처하도록 한다.","n":[],"p":415,"b":2},{"c":"[12직준04-05]","k":"선택","sk":"전문 교과(직업·생활)","s":"직업준비","g":"고등학교 1~3학년","d":"취업과 창업","t":"창업의 의미와 중요성을 알고 다양한 창업 유형을 파악한다.","m":"학생에게 창업의 개념과 유형을 소개함으로써 자신의 진로 선택이 다양한 영역으로 이루어질 수 있음을 인식하도록 하는 데 목적이 있다. 따라서 창업의 의미와 중요성을 강조하고, 가족과 주변인의 직업을 연계하여 실현 가능한 범위 내에서 1인 창업, 공동 창업, 가족 창업 등 다양한 유형의 창업 내용을 익히도록 한다.","n":[],"p":415,"b":2},{"c":"[12직준04-06]","k":"선택","sk":"전문 교과(직업·생활)","s":"직업준비","g":"고등학교 1~3학년","d":"취업과 창업","t":"주변에서 볼 수 있는 창업 동향을 탐색하고, 창업 정보를 수집한다.","m":"빠르게 변화하는 창업 세계에 대응할 수 있는 창의적인 직종과 기술들을 탐색하고, 성공적인 창업 요건을 판단하는 능력을 기르는 데 주된 목적이 있다. 온오프라인 창업, 무인 시스템 창업 등 다양한 창업 동향에 따른 창의적 직종을 탐색하고, 창업의 성공과 실패 요인을 살펴보는 데 주안점을 둔다. 따라서 학생이 비판적 사고로 창업 정보를 파악하고, 자신에게 필요한 정보를 취사선택하도록 하는 것이 중요하다.","n":[],"p":415,"b":2},{"c":"[12직준04-07]","k":"선택","sk":"전문 교과(직업·생활)","s":"직업준비","g":"고등학교 1~3학년","d":"취업과 창업","t":"창업 전문 기관을 활용하여 창업을 계획하고, 기업가로서 역할과 책임을 인식한다.","m":"학생의 실질적인 창업을 위해 창업 전문 기관의 종류와 서비스 내용, 이용 방법 등을 살펴보고, 창업 방법과 절차를 계획하는 데 목적이 있다. 온오프라인의 창업 환경과 직종에 따라 창업 방법과 절차, 서류 준비 등에는 차이가 있으므로 이를 구분하여 계획하고, 창업을 희망할 때 필요한 정보와 지원을 받도록 창업 전문 기관 이용 방법과 창업 절차를 충분히 이해하는 것이 중요하다. 또한 자신의 사업장에 대한 주인 의식과 경영 관리, 직원 관리 등 기업가로서 역할과 책임을 인식하도록 하는데 초점을 둔다. 상황에 따라 시간을 보충하여 심화 지도 할 수 있고, 필요시 보호자와 함께 창업 전문 기관과 전문가의 도움을 받도록 한다.","n":[],"p":415,"b":2},{"c":"[12안직01-01]","k":"선택","sk":"전문 교과(직업·생활)","s":"안정된 직업생활","g":"고등학교 1~3학년","d":"직업생활의 시작","t":"일과 직업의 의미와 특징을 설명한다.","m":"자신이 생각하는 직업이 자신의 가치관에 맞는지 익히게 하고자 설정하였다. 일과 직업의 의미, 직업의 특징, 일과 직업의 구분 등에 대한 내용을 다룬다. 일은 직업과 같은 의미로 사용되기도 하지만 직업은 일과 구별되는 특징이 있으므로 일과 직업의 의미와 특징을 구분하여 설명하는 데 주안점을 둔다.","n":[],"p":426,"b":2},{"c":"[12안직01-02]","k":"선택","sk":"전문 교과(직업·생활)","s":"안정된 직업생활","g":"고등학교 1~3학년","d":"직업생활의 시작","t":"직업생활이 삶과 밀접한 관계가 있음을 이해한다.","m":"생애 발달에 따라 직업생활이 어떻게 달라지는지 알아보고자 설정하였다. 현재 자신의 삶에서 직업생활 준비와 유지를 위해 무엇을 해야 하는지 탐색하고 실천하는 내용을 다룬다. 직업생활에서 성취감과 보람을 느끼고 사회의 한 구성원인 민주 시민으로 삶을 영위할 수 있음을 파악하는 데 주안점을 둔다.","n":[],"p":426,"b":2},{"c":"[12안직01-03]","k":"선택","sk":"전문 교과(직업·생활)","s":"안정된 직업생활","g":"고등학교 1~3학년","d":"직업생활의 시작","t":"자신의 흥미와 적성에 따른 구체적인 직업 정보를 탐색한다.","m":"다양한 매체로 자신에게 적합한 직업 정보를 탐색하는 능력을 기르게 하고자설정하였다. 올바른 진로를 선택하고 직업생활을 유지하고자 자신의 흥미와 적성을 파악하는 것은 중요하므로 자신의 흥미와 적성에 따른 구체적인 직업 정보를 탐색하는 데 주안점을 둔다.","n":[],"p":426,"b":2},{"c":"[12안직01-04]","k":"선택","sk":"전문 교과(직업·생활)","s":"안정된 직업생활","g":"고등학교 1~3학년","d":"직업생활의 시작","t":"직업의 의의와 가치를 알고 직업생활의 개인적⋅사회적 중요성을 파악한다.","m":"직업의 경제적⋅사회적⋅개인적 측면에서 직업의 의의를 살펴보고 행복한 삶을 위한 일과 직업의 가치를 인식하도록 하고자 설정하였다. 개인적 측면과 사회적 측면에서 바라본 직업생활의 중요성, 그것이 학생의 삶에 미치는 영향 등을 내용으로 다룬다. 직업을 통해 다양한 가치를 실현할 수 있을 뿐만 아니라 삶의 질도 향상할 수 있다는 것을 탐색하는 데 주안점을 둔다.","n":[],"p":426,"b":2},{"c":"[12안직02-01]","k":"선택","sk":"전문 교과(직업·생활)","s":"안정된 직업생활","g":"고등학교 1~3학년","d":"직업생활의 유지","t":"조직의 구조와 체제를 이해하고, 조직 내에서 자신의 역할을 파악한다.","m":"조직의 구조와 체제를 이해하고 조직 내에서 자신의 역할을 파악하게 하고자설정하였다. 조직은 설립 주체나 업종, 규모에 따라 여러 가지 유형으로 분류할 수 있으며, 형태별로 서로 다른 특징이 있으므로 그 속에서 자신의 역할을 정확히 파악할 수 있는 내용을 다룬다. 조직의 한 구성원으로 조직 내 다른 사람들과 상호 작용하도록 하는 데 주안점을 둔다.","n":[],"p":427,"b":2},{"c":"[12안직02-02]","k":"선택","sk":"전문 교과(직업·생활)","s":"안정된 직업생활","g":"고등학교 1~3학년","d":"직업생활의 유지","t":"직업생활과 관련된 법과 사회 제도를 이해한다.","m":"직업생활과 관련된 법과 사회 제도를 이해하게 하고자 설정하였다. 근로 관계법의 종류와 기본원리를 이해하고, 직장생활 중 자신에게 필요한 구체적인 법적 사항을 확인하는 내용 등을 다룬다. 근로 계약서 작성, 근로 시간, 휴게 시간, 휴일, 휴가, 해고, 임금, 퇴직금 등의 제도와 직장생활에 필요한 용어의 의미 등을 정확히 파악하는 능력을 기르는 데 주안점을 둔다.","n":[],"p":427,"b":2},{"c":"[12안직02-03]","k":"선택","sk":"전문 교과(직업·생활)","s":"안정된 직업생활","g":"고등학교 1~3학년","d":"직업생활의 유지","t":"고용 서비스와 관련된 사회 제도의 의미와 특징을 파악하고, 서비스 이용 절차와 방법을 익힌다.","m":"고용 서비스와 관련된 다양한 사회 제도의 특징을 파악하고, 그 절차와 방법을 실행하도록 하고자 설정하였다. 고용 서비스의 기능과 중요성을 탐색하고 고용 보험 제도의 종류별 특징을 이해하는 등의 내용을 다룬다. 고용 서비스의 의미와 내용을 알고 취업했을 경우 가입되는 고용 보험 제도의 종류와 특징을 파악하는 데 주안점을 둔다.","n":[],"p":427,"b":2},{"c":"[12안직02-04]","k":"선택","sk":"전문 교과(직업·생활)","s":"안정된 직업생활","g":"고등학교 1~3학년","d":"직업생활의 유지","t":"직장 내 협력적 대인 관계 형성을 위한 효과적인 대화법을 익힌다.","m":"직업생활을 하면서 직장 내 사람들과 협력적인 대인 관계를 형성하는 대화법을 익히는 데 주안점을 둔다. 일반적인 대화 기술, 경청, 직장 상사와의 대화, 직장 동료와대화 등 상황과 상대에 맞는 대화법을 구체적으로 활용할 능력을 기르도록 한다.","n":[],"p":427,"b":2},{"c":"[12안직02-05]","k":"선택","sk":"전문 교과(직업·생활)","s":"안정된 직업생활","g":"고등학교 1~3학년","d":"직업생활의 유지","t":"협력적인 대인 관계를 바탕으로 직무를 처리하고, 함께 하는 직업생활을 실천한다.","m":"협력적인 대인 관계를 바탕으로 효과적이고 즐겁게 직무를 처리하고 함꼐하는 직업생활을 실천하도록 하는 데 주안점을 둔다. 대인 관계 양식에 대한 이해를 바탕으로 대인 관계를 향상할 주요 방법을 익히도록 한다.","n":[],"p":427,"b":2},{"c":"[12안직02-06]","k":"선택","sk":"전문 교과(직업·생활)","s":"안정된 직업생활","g":"고등학교 1~3학년","d":"직업생활의 유지","t":"자신의 복무를 관리함으로써 직업 윤리를 함양한다.","m":"성공적인 직업생활에 필요한 성실한 태도를 기르기 위해 설정하였다. 시간 엄수, 바른 근무 자세, 근무 예절 등 직업생활 중 지켜야 할 다양한 복무 태도를 다루며 이로써 직업 윤리를 함양하고자 한다. 자신의 복무를 관리하는 방법을 익히는 데 주안점을 둔다.","n":[],"p":427,"b":2},{"c":"[12안직02-07]","k":"선택","sk":"전문 교과(직업·생활)","s":"안정된 직업생활","g":"고등학교 1~3학년","d":"직업생활의 유지","t":"직업생활 중 발생할 수 있는 안전사고의 형태와 원인을 알고 안전사고를 예방한다.","m":"안전사고의 형태와 원인을 알고 그에 따른 대책을 세워 안전사고를 예방하는 데 주안점을 둔다. 업종과 직업에 따라 자주 발생하는 안전사고의 종류가 다르므로 그에 따른 예방 대책을 이해하는 것이 중요하다. 또한 사고가 발생하는 다양한 원인을 알아보고 사전에 안전사고를 예방하는 능력을 기르도록 한다.","n":[],"p":427,"b":2},{"c":"[12안직02-08]","k":"선택","sk":"전문 교과(직업·생활)","s":"안정된 직업생활","g":"고등학교 1~3학년","d":"직업생활의 유지","t":"산업 재해의 개념과 종류를 알고 산업 재해 처리 방법을 설명한다.","m":"산업 재해의 개념과 종류를 파악하고 산업 재해 처리 방법을 익혀 실제 직업생활에 적용하는 데 주안점을 둔다. 또한 산업 안전을 위한 의무 사항을 알아보고 산업 재해 예방 노력에도 관심을 갖도록 한다. 다양한 산업 재해 사례에서 산업 재해를 구체적으로알아보고, 산업 재해가 발생했을 때 산업 재해 처리 방법과 작성 서류 등을 구체적으로 익히도록 한다.","n":[],"p":427,"b":2},{"c":"[12안직02-09]","k":"선택","sk":"전문 교과(직업·생활)","s":"안정된 직업생활","g":"고등학교 1~3학년","d":"직업생활의 유지","t":"급격한 사회 변동 과정에서 발생하는 사회 문제에 따른 직업 윤리의 중요성을 파악한다.","m":"다원화, 개방화, 정보화 등으로 발생하는 현대 사회의 다양한 문제를 파악하고 이에 따른 직업 윤리의 의미와 중요성을 파악하는 데 주안점을 둔다. 직업생활을 위해 고려해야 할 윤리적 사항들을 살펴보고 타인을 배려하는 노력으로 직업 윤리의 중요성을 이해하는 것이 중요하다.","n":[],"p":427,"b":2},{"c":"[12안직02-10]","k":"선택","sk":"전문 교과(직업·생활)","s":"안정된 직업생활","g":"고등학교 1~3학년","d":"직업생활의 유지","t":"직장 내 인권 의식의 중요성을 알고 인권을 존중하는 태도를 갖는다.","m":"직장 내 인권 침해와 극복 사례를 분석해 인권의 중요성을 알고 인권을 존중하는 태도를 갖추어 건강한 직업의식을 함양하는 데 주안점을 둔다. 직업 현장의 부당한 피해 사례를 알아보고 이를 위해 공동체 구성원이 할 수 있는 역할에 관심을 갖도록 한다. 또한 사회적 약자의 기본적 권리를 알아보고 차별과 편견을 극복할 방법을 익히도록 한다.","n":[],"p":427,"b":2},{"c":"[12안직02-11]","k":"선택","sk":"전문 교과(직업·생활)","s":"안정된 직업생활","g":"고등학교 1~3학년","d":"직업생활의 유지","t":"직장 내 괴롭힘 상황 발생 시 효과적으로 대처한다.","m":"직장 내 괴롭힘을 판단하는 요소를 파악하고 직장 내 괴롭힘 상황 발생 시 효과적인 대처법을 기르는 데 주안점을 둔다. 직장 내 괴롭힘과 폭력의 대처 요령을 익히고 자신의 권리를 찾기 위한 다양한 노력에 관심을 갖도록 한다.","n":[],"p":427,"b":2},{"c":"[12안직02-12]","k":"선택","sk":"전문 교과(직업·생활)","s":"안정된 직업생활","g":"고등학교 1~3학년","d":"직업생활의 유지","t":"성을 이유로 차별받지 않는 조직 문화 조성의 중요성을 알고 성 인권을 존중하는 태도를 기른다.","m":"성을 이유로 차별받지 않는 조직 문화 조성의 중요성을 알고 성 인권 존중의 태도를 기르는 데 주안점을 둔다. 성과 관련된 조직 문화에 대해 개인적, 조직적 차원의 진단을 실시하고 균형 있는 조직 문화 조성을 위해 각 조직 구성원의 역할을 탐색하고 이를 실천하는 내용을 다룬다. 또한 직장 내 성희롱⋅성폭력 개념과 유형, 성희롱 예방과 대응 방법을 익히도록 한다.","n":[],"p":427,"b":2},{"c":"[12안직03-01]","k":"선택","sk":"전문 교과(직업·생활)","s":"안정된 직업생활","g":"고등학교 1~3학년","d":"직업 능력 향상","t":"직업생활에서 예산서와 주문서 같은 간단한 업무 문서를 읽고, 필요한 정보를 파악한다.","m":"","n":[],"p":430,"b":2},{"c":"[12안직03-02]","k":"선택","sk":"전문 교과(직업·생활)","s":"안정된 직업생활","g":"고등학교 1~3학년","d":"직업 능력 향상","t":"상사의 지시, 사내 메신저의 업무 전달 내용 등을 파악하여 업무 수행에 반영한다.","m":"","n":[],"p":430,"b":2},{"c":"[12안직03-03]","k":"선택","sk":"전문 교과(직업·생활)","s":"안정된 직업생활","g":"고등학교 1~3학년","d":"직업 능력 향상","t":"업무 상황에서 덧셈과 뺄셈 같은 간단한 사칙연산을 하고, 연산 결과를 검토한다.","m":"이 성취기준은 업무 문서 이해를 돕고 작성에 활용될 기초 연산 능력을 기르게 하고자 설정하였다. 근무 시간표, 주문서 읽기, 주문서 작성하기, 다양한 형태의 계산기나 프로그램 등에 대한 내용을 다룬다. 실생활에서 부딪힐 수 있는 여러 가지 문제를 반복적으로 경험하여 직무와 관련한 사칙연산의 수행 수준을 높이도록 한다.","n":[],"p":430,"b":2},{"c":"[12안직03-04]","k":"선택","sk":"전문 교과(직업·생활)","s":"안정된 직업생활","g":"고등학교 1~3학년","d":"직업 능력 향상","t":"직무 능력을 향상할 수 있는 자원의 종류와 필요성을 알고, 직무 내용에 따라 필요한 자원을 구분한다.","m":"자원 관리는 자원을 확인하고 확보하며 직무의 내용과 작업 환경에 맞게 자원을 구분하고 할당하는 능력을 기르게 하고자 설정하였다. 이를 위해 자신을 둘러싼 자원의 종류와 자원 관리의 중요성을 이해하는 것이 중요하다. 모의 상황, 인턴 등 다양한 환경과 업무에 따라 자신이 활용할 수 있는 자원을 나열하고 적용하도록 한다.","n":[],"p":430,"b":2},{"c":"[12안직03-05]","k":"선택","sk":"전문 교과(직업·생활)","s":"안정된 직업생활","g":"고등학교 1~3학년","d":"직업 능력 향상","t":"직업생활에서 필요한 시간을 확인하고 확보 계획을 세워 업무를 수행한다.","m":"자신의 직무 내용과 주어진 업무 수행에 필요한 시간을 확인하고 확보하여 적절하게 할당하는 것이 중요하다. 시간의 특성과 의미, 시간 관리의 중요성, 시간 낭비 요인 제거, 시간 계획을 포함한 내용을 다룬다. 직장 내 일과표에 따라 업무의 중요도를 나누어 업무를 순차적이고 효율적으로 수행하도록 모의 상황을 조작하여 반복한다.","n":[],"p":430,"b":2},{"c":"[12안직03-06]","k":"선택","sk":"전문 교과(직업·생활)","s":"안정된 직업생활","g":"고등학교 1~3학년","d":"직업 능력 향상","t":"직업생활에서 필요한 예산을 파악하고 예산 활용 계획을 세워 실천한다.","m":"예산 관리는 예산을 확인하고 확보하며 예산 사용 목적과 상황에 따라 예산을 할당하는 것이 중요하다. 예산 관리의 개념, 예산 관리의 중요성, 예산의 구성 요소, 예산 지출 계획 등이 포함되도록 내용을 다룬다.","n":[],"p":430,"b":2},{"c":"[12안직03-07]","k":"선택","sk":"전문 교과(직업·생활)","s":"안정된 직업생활","g":"고등학교 1~3학년","d":"직업 능력 향상","t":"직업생활에서 필요한 물적 자원을 파악하고 확보 방안을 검토⋅계획하여 업무를 수행한다.","m":"물적 자원 관리에서는 물적 자원을 확인하고 확보하여 상황에 맞게 할당하는 것에 초점을 둔다. 물적 자원의 종류와 중요성, 물적 자원 활용의 방해 요인, 물적 자원 관리 과정, 물적 자원 관리 기법 등의 내용을 포함한다.","n":[],"p":430,"b":2},{"c":"[12안직03-08]","k":"선택","sk":"전문 교과(직업·생활)","s":"안정된 직업생활","g":"고등학교 1~3학년","d":"직업 능력 향상","t":"직업생활에서 필요한 인적 자원을 파악하고 활용 방안을 모색하여 업무를 수행한다.","m":"업무 상황과 내용에 따라 필요한 인적 자원을 확인하고, 이를 확보 및 활용하는 것은 중요하다. 따라서 인적 자원 관리에서는 인적 자원의 개념과 중요성, 개인 차원에서 인적 자원 관리 방법, 팀 작업에서 인적 자원 관리 방법이 포함되도록 내용을 다룬다.","n":[],"p":430,"b":2},{"c":"[12안직04-01]","k":"선택","sk":"전문 교과(직업·생활)","s":"안정된 직업생활","g":"고등학교 1~3학년","d":"직업 유지를 위한 자기 개발","t":"자기 개발의 의미와 그 필요성을 인식하고 자신의 현재 상태를 점검한다.","m":"자기 개발 능력의 하위 능력은 자아 인식 능력, 자기 관리 능력, 경력 개발 능력으로 나뉜다. 자기 개발은 요구 확인, 역할과 목표 확인, 조직과 주위 환경의 특성 확인이며 도착점 행동은 자신의 능력을 개발하는 수단을 탐색하고 스스로 직업생활을 유지하는 능력을 기르는 것이다. 따라서 자기 개발의 의미와 중요성을 설명하고 자신의 자기 개발에서 장애 요인은 무엇이며 이를 어떻게 반영할 것인지 고려하는 능력을 기르도록 한다.","n":[],"p":431,"b":2},{"c":"[12안직04-02]","k":"선택","sk":"전문 교과(직업·생활)","s":"안정된 직업생활","g":"고등학교 1~3학년","d":"직업 유지를 위한 자기 개발","t":"직업생활에서 자신의 요구를 파악하고 스스로 역할과 목표를 확인하여 자기 개발 계획을 수립한다.","m":"자신의 역할과 목표를 인식하고 조직과 주위 환경의 특성을 확인하여 자기 개발을 위해 능력을 함양하고 이를 토대로 자기 개발 목표를 세우는 것에 주안점을 둔다. 자신에 대한 바른 인식을 바탕으로 일과 관련된 자신의 특성과 능력을 파악하여 자기 개발의목표를 세우고 실천할 내용을 계획하는 활동을 포함한다.","n":[],"p":431,"b":2},{"c":"[12안직04-03]","k":"선택","sk":"전문 교과(직업·생활)","s":"안정된 직업생활","g":"고등학교 1~3학년","d":"직업 유지를 위한 자기 개발","t":"경력 개발의 의미와 그 중요성을 인식하고 경력 단계별 특징을 확인한다.","m":"경력 개발은 조직과 환경의 특성을 파악하여 자신의 경력을 개발하는 방법을 탐색하는 것에 주안점을 둔다. 경력 개발의 의미와 필요성과 중요성 등의 내용을 포함하며, 경력 단계별 특징에 대해 논의하도록 활동 내용을 구성한다.","n":[],"p":431,"b":2},{"c":"[12안직04-04]","k":"선택","sk":"전문 교과(직업·생활)","s":"안정된 직업생활","g":"고등학교 1~3학년","d":"직업 유지를 위한 자기 개발","t":"직업인으로서 자신의 경력 단계를 확인하고 경력 단계별 계획을 수립한다.","m":"","n":[],"p":431,"b":2},{"c":"[12안직04-05]","k":"선택","sk":"전문 교과(직업·생활)","s":"안정된 직업생활","g":"고등학교 1~3학년","d":"직업 유지를 위한 자기 개발","t":"직업인으로서 자기 관리를 위한 자신의 역할과 목표를 확인하고 이를 실천한다.","m":"직업생활에서 자신의 역할과 목표를 정립하고 이를 위해 단계별로 자기 관리 계획 수립 방법을 탐색하는 것에 주안점을 둔다. 사례와 활동을 바탕으로 과제 수행 우선순위를 정하고 반성과 피드백의 방법을 익히도록 한다.","n":[],"p":431,"b":2},{"c":"[12안직04-06]","k":"선택","sk":"전문 교과(직업·생활)","s":"안정된 직업생활","g":"고등학교 1~3학년","d":"직업 유지를 위한 자기 개발","t":"자기 점검과 관리를 위한 합리적 의사 결정의 의미와 중요성을 인식하고 실천한다.","m":"직업생활과 개인 생활에서 합리적으로 의사 결정을 하여 최적의 대안을 선택하는 방법을 익히는 것에 주안점을 둔다. 합리적인 의사 결정의 의미와 절차를 익히고 사례와 활동을 바탕으로 절차에 따라 스스로 의사를 결정하는 방법을 체득하도록 활동을 구성한다.","n":[],"p":431,"b":2},{"c":"[12안직04-07]","k":"선택","sk":"전문 교과(직업·생활)","s":"안정된 직업생활","g":"고등학교 1~3학년","d":"직업 유지를 위한 자기 개발","t":"일과 삶의 균형을 위해 자신의 내면이나 업무 수행을 관리할 수 있는 자기 관리 방법을찾는다.","m":"자기 관리 능력을 함양하여 직업생활과 관련된 자신의 특성을 발견하고 경험을 반성하도록 하는 데 주안점을 둔다. 단계별 자기 관리 계획을 수립하여 일과 삶의 균형을 맞춰 살아갈 수 있는 역량을 점검하는 내용을 포함한다.","n":[],"p":431,"b":2},{"c":"[12작업Ⅰ01-01]","k":"선택","sk":"전문 교과(직업·생활)","s":"기초작업기술Ⅰ","g":"고등학교 1~3학년","d":"기초 작업 능력의 이해","t":"기초 작업 능력의 의미와 요소를 알고 중요성을 이해한다.","m":"작업 수행을 위한 가장 기본적 요소인 기초 작업 능력의 개념과 중요성을 이해하게 하고자 설정하였다. 기초 작업 능력의 하위 요소는 신체 능력, 인지 능력, 사회성 능력, 정서 능력으로 구성된다. 기초 작업 능력의 개념과 경험한 직무를 연결하면서 구체화하여 이해하도록 한다. 기초 작업 능력은 작업 활동뿐 아니라 일상생활이나 사회생활, 직업생활 중에도 계속 사용되는 필수적인 능력임을 강조한다.","n":[],"p":442,"b":2},{"c":"[12작업Ⅰ01-02]","k":"선택","sk":"전문 교과(직업·생활)","s":"기초작업기술Ⅰ","g":"고등학교 1~3학년","d":"기초 작업 능력의 이해","t":"작업에 필요한 기초 작업 능력을 조사하고 자신의 능력 정도를 파악한다.","m":"작업에 따라 기초 작업 능력이 다르다는 것을 이해하고 현재 자신의 기초 작업 능력 정도를 파악하게 하고자 설정하였다. 작업은 기초 작업 능력 하위 요소 중 하나의 요소만을 필요로 하기보다 두 가지 이상의 요소를 복합적으로 사용하는 경우가 대부분이므로 이를 파악하도록 작업 과정을 분석한다. 작업에서 요구하는 능력과 자신의 기초 작업 능력 정도를 연결지어 보면서 강점과 약점을 파악하도록 한다.","n":[],"p":442,"b":2},{"c":"[12작업Ⅰ01-03]","k":"선택","sk":"전문 교과(직업·생활)","s":"기초작업기술Ⅰ","g":"고등학교 1~3학년","d":"기초 작업 능력의 이해","t":"관심 있는 작업 분야의 기초 작업 능력을 조사하고 능력 향상 계획을 세운다.","m":"관심 있는 작업 분야의 기초 작업 능력을 조사하고 능력 향상을 위한 계획을 세우게 하고자 설정하였다. 수행하고자 하는 작업에서 필요로 하는 능력을 하위 요소인 신체 능력, 인지 능력, 사회성 능력, 정서 능력으로 구분하여 알아봄으로써 작업 행위 탐색에 주안점을 둔다.","n":[],"p":442,"b":2},{"c":"[12작업Ⅰ01-04]","k":"선택","sk":"전문 교과(직업·생활)","s":"기초작업기술Ⅰ","g":"고등학교 1~3학년","d":"기초 작업 능력의 이해","t":"작업 활동에 참여하여 자신의 기초 작업 능력을 향상하고자 노력하는 태도를 기른다.","m":"여러 가지 작업 활동으로 현재 자신의 기초 작업 능력 중 강점과 약점을 파악하고 능력 향상을 위한 노력이 필요함을 인식하는 데 목적이 있다. 현재 자신의 기초 작업 능력을 제대로 파악해서 약점을 보완할 다양한 방법을 찾아보도록 한다. 기초 작업 능력 향상을 위해 꾸준히 노력하는 태도를 기르도록 한다.","n":[],"p":442,"b":2},{"c":"[12작업Ⅰ02-01]","k":"선택","sk":"전문 교과(직업·생활)","s":"기초작업기술Ⅰ","g":"고등학교 1~3학년","d":"분류 작업","t":"생활 속 물건들의 분류 기준을 찾고, 분류 작업의 필요성과 중요성을 설명한다.","m":"생활 속에서 정리되어 있는 물건들의 분류 기준을 찾아보면서 분류의 중요성과 필요성을 이해하게 하고자 설정하였다. 가정, 학교, 지역사회의 다양한 장면에서 볼 수 있는 분류된 물건들을 소재로 하여, 분류가 생활 속에서 어떤 기능을 하는지 자연스럽게 확인하도록 한다.","n":[],"p":443,"b":2},{"c":"[12작업Ⅰ02-02]","k":"선택","sk":"전문 교과(직업·생활)","s":"기초작업기술Ⅰ","g":"고등학교 1~3학년","d":"분류 작업","t":"분류 대상의 특성에 맞는 분류 기준을 찾아 작업물을 분류한다.","m":"분류는 성질이 같은 것끼리 종류별로 나누는 것으로, 이를 위해 분류 대상(작업물)에 관심을 가지고 주의를 기울여 외형을 관찰하는 것이 필요하다. 분류 기준은 상황에 따라 다르게 설정할 수 있으므로 작업물의 특징을 잘 살피고, 어떻게 분류하는 것이 좋은지 기준을 세워 작업물을 분류하는 능력을 기르도록 한다.","n":[],"p":443,"b":2},{"c":"[12작업Ⅰ02-03]","k":"선택","sk":"전문 교과(직업·생활)","s":"기초작업기술Ⅰ","g":"고등학교 1~3학년","d":"분류 작업","t":"바른 작업 자세로 분류 작업을 정확하고 신속하게 수행한다.","m":"바른 자세를 유지하며 다양한 분류 기준에 따라 분류 작업을 정확하고 신속하게 수행하는 데 중점을 둔다. 분류의 기준은 색상, 크기, 모양, 재질 등 다양하게 설정할 수 있으며, 단일 기준 혹은 복합 기준을 제시하여 작업의 난이도를 조절한다. 작업 수행 시 앉아서 작업하기, 서서 작업하기 등 작업 자세에 따라 바른 자세를 유지하며 작업에 집중하고, 작업 능률도 향상되도록 지도한다.","n":[],"p":443,"b":2},{"c":"[12작업Ⅰ03-01]","k":"선택","sk":"전문 교과(직업·생활)","s":"기초작업기술Ⅰ","g":"고등학교 1~3학년","d":"측정 작업","t":"양 개념을 익혀 생활 속 문제를 해결한다.","m":"표준 단위를 학습하기 전 측정 작업을 이해하기 위한 용어의 의미를 알고 측정 작업을 수행하기 위한 개념을 형성하게 하고자 설정하였다. ‘크다-작다’, ‘길다-짧다’, ‘많다-적다’, ‘무겁다-가볍다’와 같은 측정 표현과 ‘더 크다, 더 길다, 더 많다, 더 무겁다’ 또는 ‘가장 크다, 가장 길다, 가장 많다, 가장 무겁다’와 같은 비교 용어를 다룬다. 일상생활의 경험 중 직관적 비교의 문제들을 해결하기 위한 직접 비교의 필요성을 이해하도록 한다.","n":[],"p":444,"b":2},{"c":"[12작업Ⅰ03-02]","k":"선택","sk":"전문 교과(직업·생활)","s":"기초작업기술Ⅰ","g":"고등학교 1~3학년","d":"측정 작업","t":"양의 크기를 나타내는 단위를 익혀 수량을 정확하게 센다.","m":"독립된 개체의 수를 나타내는 이산량을 세는 데 필요한 단위와 수량을 세는 능력을 기르는 데 중점을 둔다. 구체물의 개수를 세고 그에 알맞은 수를 대응하는 활동으로 수 감각을 기르고, 낱개, 몇십, 몇백, 몇천의 단위를 익혀 수에 알맞게 구체물을 모으거나 가르는 내용을 다룬다. 생활 주변의 친숙한 구체물을 활용하여 손가락으로 구체물 짚어 보기, 일대일 대응하기, 수의 보존 개념 익히기 등의 활동들을 학습자 수준에 맞게 경험하도록 한다.","n":[],"p":444,"b":2},{"c":"[12작업Ⅰ03-03]","k":"선택","sk":"전문 교과(직업·생활)","s":"기초작업기술Ⅰ","g":"고등학교 1~3학년","d":"측정 작업","t":"측정 단위를 알고 단위 크기를 비교하여 측정 작업에 활용한다.","m":"구체물의 여러 가지 속성 중 측정 가능한 속성이 있음을 인식하고 양을 측정하는 능력을 기르게 하고자 설정하였다. 길이(㎝), 들이(㎖), 무게(g)의 표준 단위를 이용하여 측정하고 길이(㎝, m, ㎞), 들이(㎖,ℓ), 무게(g, ㎏)의 각 단위 크기를 비교하여 조절하는 내용을 다룬다. 일상생활에서 측정 단위로 나타낸 구체물을 접함으로써 측정 단위를 익숙하게 활용하는 능력을 기르도록 한다.","n":[],"p":444,"b":2},{"c":"[12작업Ⅰ03-04]","k":"선택","sk":"전문 교과(직업·생활)","s":"기초작업기술Ⅰ","g":"고등학교 1~3학년","d":"측정 작업","t":"측정에 필요한 도구를 사용하여 정확하게 측정한다.","m":"조립 작업, 포장 작업, 운반 작업 등에서 물체를 표준 단위로 측정하고 비교하여 작업의 정확성과 효율성을 높이게 하고자 설정하였다. 자를 이용하여 길이 재기, 계량 도구를 이용하여 들이 재기, 저울을 이용하여 무게 재기 등의 내용을 다룬다. 측정에 필요한 알맞은 도구를 사용하여 양을 조절해 정확하게 측정하는 방법을 익히는 데 중점을 둔다.","n":[],"p":444,"b":2},{"c":"[12작업Ⅰ03-05]","k":"선택","sk":"전문 교과(직업·생활)","s":"기초작업기술Ⅰ","g":"고등학교 1~3학년","d":"측정 작업","t":"측정 작업을 정확하고 신속하게 수행하고 문제 상황에 적절히 대응한다.","m":"측정 작업에 집중하며 수행을 반복함으로써 작업 능력의 기본 요소인 정확성과 신속성을 높이는 데 중점을 둔다. 수량, 길이(㎝), 들이(㎖), 무게(g) 측정과 관련한 다양한 모의 작업 상황을 만들어 문제를 해결하는 내용을 다룬다. 일상생활에서 경험할 수 있는 구체물의 측정 단위를 찾아봄으로써 측정 단위에 익숙해지고, 표준 단위를 이용한 측정 활동으로 양감을 기르며, 측정 도구를 적절하게 사용하여 구체물 측정 작업의 정확성과 신속성이 향상되도록 한다.","n":[],"p":444,"b":2},{"c":"[12작업Ⅰ04-01]","k":"선택","sk":"전문 교과(직업·생활)","s":"기초작업기술Ⅰ","g":"고등학교 1~3학년","d":"조립 작업","t":"조립 작업에 쓰이는 재료와 부품, 공구의 이름을 알고 작업을 수행한다.","m":"조립 작업에 쓰이는 재료나 부품, 공구의 이름을 익혀 작업 수행 시 원활한 의사소통 능력을 기르게 하고자 설정하였다. 망치-못, 드라이버-나사못, 스패너-볼트, 너트와 같이 조립 도구와 관련 있는 부속 재료는 함께 제시하도록 한다. 정확한 이름을 사용하면서 작업 환경에 익숙해지도록 하는 과정이 중요하다.","n":[],"p":446,"b":2},{"c":"[12작업Ⅰ04-02]","k":"선택","sk":"전문 교과(직업·생활)","s":"기초작업기술Ⅰ","g":"고등학교 1~3학년","d":"조립 작업","t":"공구의 종류와 특징을 알고 사용법과 관리법을 익혀 안전하게 작업한다.","m":"조립 작업에서 사용하는 공구의 종류와 특징을 알고 사용법과 공구 관리 방법을 익혀 안전사고를 예방하고자 설정하였다. 드라이버, 펜치, 니퍼 등과 같은 수동 공구와 전동 드라이버, 전동 드릴, 전동 타카 등과 같은 전동 공구로 나누어 공구 사용법과 주의사항을 내용으로 다룬다. 공구를 제대로 관리하지 않으면 녹이 슬거나 부품을 분실하는 등 사용 시 겪을 수 있는 어려움이 발생하므로 청결하게 관리하고 정해진 위치에 보관하여 공구가 제 기능을 유지하도록 관리하는 방법을 익힌다. 또한 공구 사용 중 발생할 수 있는 안전사고 예방법을 구체적 사례 중심으로 익히도록 한다.","n":[],"p":446,"b":2},{"c":"[12작업Ⅰ04-03]","k":"선택","sk":"전문 교과(직업·생활)","s":"기초작업기술Ⅰ","g":"고등학교 1~3학년","d":"조립 작업","t":"작업 유형에 맞게 맨손이나 공구를 사용하여 부품을 조립하고 분해한다.","m":"조립 작업 유형에 따라 맨손이나 공구를 적절히 선택하여 사용하는 능력을 기르게 하고자 설정하였다. 상자나 목공품, 생활용품, 장난감 등의 물품을 순서에 맞게 조립하거나 분해하는 과정을 실습하여 작업의 효율성을 높이는 방법을 알아 가는 내용을 다룬다. 공구 사용 시 기능이 유사한 여러 가지 공구 중에서 작업에 가장 적절한 공구를 선택하는 능력을 기르도록 한다.","n":[],"p":446,"b":2},{"c":"[12작업Ⅰ04-04]","k":"선택","sk":"전문 교과(직업·생활)","s":"기초작업기술Ⅰ","g":"고등학교 1~3학년","d":"조립 작업","t":"작업의 효율성을 높이도록 재료나 부품을 적절하게 준비한다.","m":"효율적 작업을 위해 조립 과정에서 사용하는 재료나 부품을 상황에 따라 적절히 준비하는 기능을 기르게 하고자 설정하였다. 작업에 필요한 재료나 부품을 작업 전 미리 준비하거나, 작업 중 부족한 재료나 필요한 부품을 적절한 시기에 채워두어 작업의 흐름이 끊어지지 않고 원활히 이루어지도록 한다.","n":[],"p":446,"b":2},{"c":"[12작업Ⅰ04-05]","k":"선택","sk":"전문 교과(직업·생활)","s":"기초작업기술Ⅰ","g":"고등학교 1~3학년","d":"조립 작업","t":"조립 작업 시 안전에 유의하여 바른 자세로 작업한다.","m":"조립 과정 중에 일어날 수 있는 안전사고에 유의하고 바른 자세를 유지하여 근골격계 질환을 예방하고자 설정하였다. 일어날 수 있는 안전사고와 작업 시 바른 자세에 대한 내용을 다룬다. 조립 작업은 주로 맨손 혹은 공구를 사용하는 작업 형태로 안전사고 위험에 노출되어 있다. 실제 작업 현장은 동일한 자세로 장시간 작업을 해야 하는 상황이므로 바른 자세를 유지하는 능력을 기르도록 한다.","n":[],"p":446,"b":2},{"c":"[12작업Ⅰ04-06]","k":"선택","sk":"전문 교과(직업·생활)","s":"기초작업기술Ⅰ","g":"고등학교 1~3학년","d":"조립 작업","t":"작업 전체 과정을 이해하고 정확성과 신속성 향상을 위해 노력한다.","m":"조립 작업은 대개 순차적으로 이루어지는 조립 작업의 전체 과정에서 작업의 정확성과 신속성의 중요성을 이해하여, 작업 수행에 이를 반영하고자 노력하는 태도를 기르게 하고자 설정하였다. 작업 결과물의 불량 유무를 확인하여 수정 또는 폐기의 방법으로 불량률을 줄이는 방법을 익히는 데 주안점을 둔다. 조립 작업은 단순 작업에서부터 복잡한 작업에 이르기까지 다양하므로 작업 순서를 숙지하고 순차적으로 조립 작업에 임하여 정확도와 작업 속도 모두를 높이도록 한다.","n":[],"p":446,"b":2},{"c":"[12작업Ⅱ01-01]","k":"선택","sk":"전문 교과(직업·생활)","s":"기초작업기술Ⅱ","g":"고등학교 1~3학년","d":"포장 작업","t":"제품 포장의 목적과 기능을 알고 포장의 필요성을 설명한다.","m":"제품을 포장하는 목적과 기능을 다양한 시각에서 살펴보고 포장을 하는 이유로 알아보고자 설정하였다. 제품의 품질과 가치 보호, 취급 시 편리성, 판매 촉진, 정보 전달의 내용 등을 다룬다. 일상생활에서 자주 사용하는 제품의 포장 상태나 재료를 살펴보고 포장의 목적과 기능을 이해하도록 한다.","n":[],"p":457,"b":2},{"c":"[12작업Ⅱ01-02]","k":"선택","sk":"전문 교과(직업·생활)","s":"기초작업기술Ⅱ","g":"고등학교 1~3학년","d":"포장 작업","t":"포장 재료와 도구와 기기의 명칭을 알고 올바른 사용법을 익혀 안전하게 작업한다.","m":"포장 작업에 사용되는 재료, 도구, 기기의 명칭을 익혀 작업 시 의사소통을원활하게 하고, 올바른 사용법을 익혀 안전사고를 예방하는 데 목적이 있다. 포장 작업은 여러 가지 도구와 재료를 사용하기 때문에 그 명칭과 쓰임 등을 기억하고 작업에 알맞게 활용하는 능력이 필요하다. 칼, 가위 등의 기본 도구부터 테이프 절단기, 랩 포장기, 진공 포장기, 비닐 접착기, 밴딩기 등에 이르는 기기의 명칭과 사용법, 주의사항에 관한 내용을 다룬다. 여러 가지 도구와 기기를 사용하는 경우가 많아 사용법이나 주의사항에 대해 충분히 이해하고 안전 의식을 갖는 것이 중요하다.","n":[],"p":457,"b":2},{"c":"[12작업Ⅱ01-03]","k":"선택","sk":"전문 교과(직업·생활)","s":"기초작업기술Ⅱ","g":"고등학교 1~3학년","d":"포장 작업","t":"제품의 특징에 맞는 포장 방법과 재료를 선택하여 포장한다.","m":"제품 포장의 목적에 따라 가장 적절한 포장 방법과 그에 알맞은 재료를 선택하여 작업하는 능력을 기르게 하고자 설정하였다. 낱포장, 속포장, 겉포장과 같은 형태에 따른 포장 방법과 유연 포장, 반강성 포장, 강성 포장과 같은 포장 재질에 따른 포장 방법 등을 내용으로 다룬다. 포장 재질의 특징을 알고 적절한 재료를 선택하여 작업하는 판단력이 중요함을 인식하도록 한다.","n":[],"p":457,"b":2},{"c":"[12작업Ⅱ01-04]","k":"선택","sk":"전문 교과(직업·생활)","s":"기초작업기술Ⅱ","g":"고등학교 1~3학년","d":"포장 작업","t":"포장 재료나 도구의 준비와 조정 등으로 작업 상황에 적합하고 효율적인 방법을찾는다.","m":"포장 작업을 효율적으로 하기 위해 상황에 따른 문제를 해결하는 능력을 기르게 하고자 설정하였다. 제품의 크기나 무게 등에 따라 손이나 팔 등의 신체 일부 혹은 신체 전반을 사용하거나, 도구를 사용하다가 다른 도구로 변경하는 등 효율성을 높이는 방법을 염두에 두며 작업해 보는 과정이 중요하다. 포장 과정에서 사용하는 재료나 도구를 상황에 따라 적절히 수급하며 작업 흐름이 끊어지지 않게 작업 흐름을 잘 살펴보도록 한다. 포장 작업은 혼자 혹은 여럿이 함께 작업하는 형태로 이루어지는데 함께하는 작업에서는 작업의 흐름이 끊어지지 않도록 부족한 재료나 필요한 도구를 챙겨 작업 상황에 적절하게 대처하는 능력을 기르도록 한다.","n":[],"p":457,"b":2},{"c":"[12작업Ⅱ01-05]","k":"선택","sk":"전문 교과(직업·생활)","s":"기초작업기술Ⅱ","g":"고등학교 1~3학년","d":"포장 작업","t":"포장 작업 시 안전에 유의하여 바른 자세로 작업한다.","m":"포장 과정 중에 일어날 수 있는 안전사고에 유의하여 작업하고 바른 자세를 유지하여 근골격계 질환을 예방하고자 설정하였다. 포장 작업 시 일어날 수 있는 안전사고와 작업 시 바른 자세에 대한 내용을 다룬다. 도구나 기기 사용 시 특히 안전에 유의해야 하며 동일한 작업 자세로 장시간 작업에 임해야 하는 경우가 많으므로 바른 자세를 유지하는 방법을 익히도록 한다.","n":[],"p":457,"b":2},{"c":"[12작업Ⅱ01-06]","k":"선택","sk":"전문 교과(직업·생활)","s":"기초작업기술Ⅱ","g":"고등학교 1~3학년","d":"포장 작업","t":"포장 작업 결과를 확인하고 수정하여 완성도를 높이고자 노력한다.","m":"포장 작업 후 결과물을 확인하고 불량 발생 시 대처 능력을 키우고자 설정하였다. 포장 상태를 점검해 불량인 부분을 수정하거나 재포장하는 등의 대처 방법을 다룬다. 포장 작업은 제품의 최종 마무리 단계이므로 작업 완료 후에는 작업 결과물을 확인하여 완성도를 높이도록 해야 한다.","n":[],"p":457,"b":2},{"c":"[12작업Ⅱ02-01]","k":"선택","sk":"전문 교과(직업·생활)","s":"기초작업기술Ⅱ","g":"고등학교 1~3학년","d":"운반 작업","t":"운반의 필요성을 알고 현장에서 안전하게 작업하기 위한 안전 수칙을 지킨다.","m":"일상생활에서 빈번하게 일어나는 물건 운반의 필요성을 알고 작업 시 안전 수칙을 지켜 재해를 예방하는 작업 태도를 기르게 하고자 설정하였다. 운반의 의미, 운반의 필요성, 운반 방법, 운반 작업 시 안전 수칙 등을 다룬다. 다양한 상황에서 물건을 올리고, 이동하고, 놓아두는 운반 작업을 반복하여 직무 수행 기술을 신장하고 동시에 다른 직무 수행에 필요한 기초적인 작업 능력과 태도를 기른다.","n":[],"p":459,"b":2},{"c":"[12작업Ⅱ02-02]","k":"선택","sk":"전문 교과(직업·생활)","s":"기초작업기술Ⅱ","g":"고등학교 1~3학년","d":"운반 작업","t":"물품 취급 기호를 알고 취급 기호에 주의하여 물품을 운반한다.","m":"일반 화물의 유통 과정에서 화물의 보호와 취급자의 안전을 위해 적정한 화물 취급을 지시하는 물품 취급 기호를 알고 취급 기호에 주의하여 물품을 운반하는 능력을 기르게 하고자 설정하였다. 일반 화물의 화물 취급 표시의 호칭, 표지, 내용 알기, 화물에 알맞은 취급 표지 부착하기, 취급 기호에 주의하여 물품 운반하기, 물품 취급 사고의 원인과 예방 등을 다룬다. 생활 주변에서 물품 취급 기호를 찾아보고 시중에 유통되는 화물에 주의를 기울이는 태도를 기르는 데 주안점을 둔다.","n":[],"p":459,"b":2},{"c":"[12작업Ⅱ02-03]","k":"선택","sk":"전문 교과(직업·생활)","s":"기초작업기술Ⅱ","g":"고등학교 1~3학년","d":"운반 작업","t":"안전 의식을 확립하고 이동 거리, 무게, 부피에 알맞은 운반 방법을 익혀 물품을 운반한다.","m":"이동 거리, 무게, 부피에 따라 운반 방법이 다르다는 것을 이해하고 각 상황에 알맞은 운반 방법으로 물품을 안전하게 운반하는 능력을 기르게 하고자 설정하였다. 거리에 따른 운반 방법 알기, 무게에 따른 운반 방법 알기, 부피에 따른 운반 방법 알기, 싣고 내리기, 적재하기 등을 포함한다. 물품이 운반 도중 파손될 수 있으며 운반 도중 허리나 손, 발 등을 다치지 않도록 유의해야 함을 인식하도록 한다.","n":[],"p":459,"b":2},{"c":"[12작업Ⅱ02-04]","k":"선택","sk":"전문 교과(직업·생활)","s":"기초작업기술Ⅱ","g":"고등학교 1~3학년","d":"운반 작업","t":"물품에 알맞은 운반 수단을 선택하여 물품을 배달한다.","m":"일상생활에서 운반의 여러 상황에서 효율적인 운반 수단의 종류를 찾아 물품을 배달하는 능력을 기르게 하고자 설정하였다. 신체를 이용하여 혼자 운반하기, 협동하여 운반하기, 수동 기계 운반 수단의 종류와 특징 알기, 수동 기계 운반 수단 사용하기 등을 포함한다. 생활 주변에서 우리가 경험하고 있는 운반 수단을 선정하여 활용해 보고 성능과 기능이 다양한 운반 수단과 기계를 사용하여 효과적으로 운반하도록 한다.","n":[],"p":459,"b":2},{"c":"[12작업Ⅱ02-05]","k":"선택","sk":"전문 교과(직업·생활)","s":"기초작업기술Ⅱ","g":"고등학교 1~3학년","d":"운반 작업","t":"물품 취급 기호에 알맞게 물품을 취급하여 물품 보관 시스템의 형태에 따라 보관한다.","m":"운반, 취급, 배달하는 과정에서 특별히 주의를 기울여야 할 물품을 취급 기호에 알맞게 물품을 취급하여 물품 보관 시스템의 형태에 따라 보관하게 하고자 설정하였다. 물품 보관의 의미와 기능, 물품 보관의 원칙과 형태, 물품 보관 장소 분류, 물품 적재와 꺼내기 등을 다룬다. 보관은 물품을 물리적으로 보전 관리하는 기술로서 창고의 구조에 따라 보통 창고, 기계식 창고, 자동화 창고로 구분되며, 물품의 보관 형태에 따라 저장 창고, 야적창고, 냉동 창고, 냉장 창고, 정온 창고, 위험물 창고, 간이 창고로 나뉜다. 이와 같이 보관하는 물품 종류, 개수, 물품 보관 기간 등에 적절한 보관의 원칙을 적용하는 물품 보관 시스템을 운용하도록 한다.","n":[],"p":459,"b":2},{"c":"[12작업Ⅱ02-06]","k":"선택","sk":"전문 교과(직업·생활)","s":"기초작업기술Ⅱ","g":"고등학교 1~3학년","d":"운반 작업","t":"물류 운송 과정에 따라 물품을 배달하고 배달 사고에 대처하는 방법을 안다.","m":"일반적으로 수송과 배송으로 나뉘는 물류 운송 과정에 따라 물품을 배달하고 발생할 수 있는 배달 사고에 대처하는 능력을 기르게 하고자 설정하였다. 물류 운송 과정 알기, 분실 사고의 원인과 예방, 지연 배달 사고의 원인과 예방, 오배달 사고와 화물 관리 번호가 없는 화물인 무적 화물 등 화물 사고의 원인과 예방 등을 다룬다. 배달할 물품을고객과 직접 만나 전해 주는 과정에서 배달하는 사람이 지켜야 할 주의사항을 고려하여 배달하는 능력을 기르도록 한다.","n":[],"p":459,"b":2},{"c":"[12작업Ⅱ03-01]","k":"선택","sk":"전문 교과(직업·생활)","s":"기초작업기술Ⅱ","g":"고등학교 1~3학년","d":"작업 실습","t":"모의 작업 실습 시, 작업 지시 내용을 파악하는 방법을 안다.","m":"작업 수행은 통상적으로 수행하는 업무 외에는 지시에 따라 이뤄지므로 지시 내용을 이해하고 그 내용에 따라 알맞게 수행하는 것이 중요하다. 구두 지시, 문서 지시 등 여러 가지 지시 유형을 알아보고, 지시에 따라 수행해야 할 업무의 내용을 잘 파악하는 방법에 관한 내용을 다룬다. 지시에 잘 따르게 경청, 주의 집중, 의사소통 능력을 기르도록 한다.","n":[],"p":460,"b":2},{"c":"[12작업Ⅱ03-02]","k":"선택","sk":"전문 교과(직업·생활)","s":"기초작업기술Ⅱ","g":"고등학교 1~3학년","d":"작업 실습","t":"작업 지시를 이해하고 바른 자세를 갖춰 효율적으로 작업을 수행한다.","m":"자신이 수행해야 할 업무를 정확하게 이해하고, 바른 자세를 유지하며, 정해진 시간 내에 신속, 정확하고 효율적으로 작업을 수행하는 능력을 기르게 하고자 설정하였다. 자신의 작업에 집중하고, 작업 상황에서 주어지는 지시에 능동적인 태도로 임하며, 앉아서 작업하기, 이동하며 작업하기 등 작업 자세를 다양하게 설정하여 일정 시간 바른 자세를 유지하며 작업하는 태도를 기르도록 한다.","n":[],"p":460,"b":2},{"c":"[12작업Ⅱ03-03]","k":"선택","sk":"전문 교과(직업·생활)","s":"기초작업기술Ⅱ","g":"고등학교 1~3학년","d":"작업 실습","t":"조립, 포장, 운반 모의 작업에서 자신의 역할을 바르게 수행한다.","m":"영역별 모의 작업 실습은 실제 작업 현장과 유사한 환경에서 반복 실습으로 작업 수행 능력을 향상하게 하고자 설정되었다. 일상생활 관련 제조품의 조립과 포장 작업, 우편물 전달과 택배 운반, 가정과 학교 내에서 운반 작업 실습 등 다양한 모의 작업 환경을 구성하여 학생이 여러 가지 작업을 경험하고 실습 과정 중 자기 역할을 파악하여 책임감을 가지고 수행하도록 한다.","n":[],"p":460,"b":2},{"c":"[12작업Ⅱ03-04]","k":"선택","sk":"전문 교과(직업·생활)","s":"기초작업기술Ⅱ","g":"고등학교 1~3학년","d":"작업 실습","t":"동료와 협업해 작업의 흐름과 최종 목표를 파악하고, 공동체 의식을 다진다.","m":"조립, 포장, 운반 영역의 모의 작업은 개별 작업이나 작업 단계별로 역할을나누는 협력 작업의 형태로 실시하여 학생이 다양한 형태의 작업 실습을 경험하도록 한다. 협력 작업의 경우, 작업의 전체 흐름을 알고, 그 속에서 자신의 역할을 이해하며, 작업의 최종 목표를 인식하여 자신이 맡은 역할에 책임감을 가지고 임하는 태도를 기르도록 한다. 이와 더불어 협력 작업으로 공동체 의식을 함양하고, 동료와 협력하는 태도를 갖도록 지도한다.","n":[],"p":460,"b":2},{"c":"[12작업Ⅱ03-05]","k":"선택","sk":"전문 교과(직업·생활)","s":"기초작업기술Ⅱ","g":"고등학교 1~3학년","d":"작업 실습","t":"작업 환경별 안전 수칙을 지키며 작업하고, 작업 중에 일어나는 상황에 적절하게 대처한다.","m":"작업 환경별로 다른 안전 수칙을 지키고, 작업 중에 일어나는 여러 가지 상황에 적절한 방법으로 대처하는 능력을 기르게 하고자 설정하였다. 안전 수칙은 작업의 종류, 상황에 따라 다를 수 있으므로, 안전 수칙을 유념하여 작업을 하도록 한다. 위급 상황발생 시 대처 방안을 지도하여 안전사고를 예방하고 신속하고 적절하게 대응하는 능력을 기른다. 작업 중 작업 재료가 소진되거나 업무 지시가 중복해서 주어졌을 때, 작업 실수로 불량이 발생했을 때, 작업을 완료하였을 때 등 학생이 실제 사업체 현장 실습과 취업 상황에서 발생할 수 있는 사례 등에 관한 내용을 다루며, 상황별로 알맞은 대처 방법을 익히도록 한다.","n":[],"p":460,"b":2},{"c":"[12작업Ⅱ03-06]","k":"선택","sk":"전문 교과(직업·생활)","s":"기초작업기술Ⅱ","g":"고등학교 1~3학년","d":"작업 실습","t":"다양한 작업 실습에 참여하여 자신의 직업 적성을 파악한다.","m":"조립, 포장, 운반 영역과 관련한 모의 작업을 하면서 자신이 잘하는 작업, 흥미 있게 참여한 작업, 수행이 어려운 작업 등을 하며 직업적 강점과 약점을 파악하는 데 중점을 둔다. 작업과 관련한 검목표를 활용하여 작업에 대한 흥미, 수행 능력 등을 파악하고 자신의 직업적 강점과 약점을 통찰하여 직업 적성을 이해하고 진로 방향 설계에 활용하는 능력을 기르도록 한다.","n":[],"p":460,"b":2},{"c":"[12작업Ⅱ04-01]","k":"선택","sk":"전문 교과(직업·생활)","s":"기초작업기술Ⅱ","g":"고등학교 1~3학년","d":"작업 환경 관리","t":"청소도구의 종류와 용도를 알고 장소와 상황에 알맞은 청소도구를 선택하여 청소한다.","m":"청소도구의 종류와 용도를 알고 장소와 상황에 알맞은 청소도구를 선택하여 주변 공간을 깨끗하게 정리정돈하고 청소하는 능력을 기르게 하고자 설정하였다. 내부 청소용품의 종류와 용도, 외부 청소용품의 종류와 용도, 집 청소, 사무실 청소, 특수 청소(오염물 지우기, 냄새 제거, 소독과 방역) 등을 다룬다. 온라인에서 얻은 정보를 비판적으로 분석하여 신뢰성 있는 정보를 구별하고 일상적 생활 공간에서 주변을 더욱 깨끗이 하고 쾌적한 생활을 유지하는 데 중점을 둔다.","n":[],"p":462,"b":2},{"c":"[12작업Ⅱ04-02]","k":"선택","sk":"전문 교과(직업·생활)","s":"기초작업기술Ⅱ","g":"고등학교 1~3학년","d":"작업 환경 관리","t":"세정제의 종류와 용도를 알고 상황에 알맞은 세정제를 선택하여 청소한다.","m":"표면에 붙은 이물질을 씻어 내는 데 필요한 세정제의 종류와 용도를 알고 상황에 알맞은 세정제를 선택하여 청소하는 능력을 기르게 하고자 설정하였다. 외부 청소 세정제, 내부 청소 세정제, 화장실 청소 세정제, 특수 청소 세정제, 친환경 세정제 등의 내용을 포함한다. 세정제를 다룰 때 생길 수 있는 안전사고를 예방하기 위해 세정제 전용 용기를 사용하고 마스크, 장갑 등 보호구를 착용하여 세정제를 사용하도록 한다.","n":[],"p":462,"b":2},{"c":"[12작업Ⅱ04-03]","k":"선택","sk":"전문 교과(직업·생활)","s":"기초작업기술Ⅱ","g":"고등학교 1~3학년","d":"작업 환경 관리","t":"재료와 도구를 정리하여 작업 환경을 유지하고 정리정돈하는 생활 습관을 형성한다.","m":"청소 작업에 사용한 재료와 도구를 정리하여 작업 환경을 유지하고 정리정돈하는 생활 습관을 형성하게 하고자 설정하였다. 청소용품 세탁 후 건조하기, 재료와 도구 정리하기, 작업 환경 유지하기 등을 다룬다. 먼지 등의 이물질을 제거한 후 청소 도구함에 청소용품을 보관하고 청결한 주변 환경을 유지하는 생활 태도를 기르도록 한다.","n":[],"p":462,"b":2},{"c":"[12작업Ⅱ04-04]","k":"선택","sk":"전문 교과(직업·생활)","s":"기초작업기술Ⅱ","g":"고등학교 1~3학년","d":"작업 환경 관리","t":"여러 가지 쓰레기를 종류에 따라 분리배출하여 자원 재활용을 실천한다.","m":"청소 후 발생하는 쓰레기를 종류에 따라 분리배출하여 자원 재활용을 실천하는 자세를 기르기 위해 설정하였다. 재활용 쓰레기 분리배출 방법 알기, 쓰레기 분리하여 배출하기, 생활 쓰레기 줄이기 등의 내용을 다룬다. 지방 자치 단체 지침과 다양한 주거 형태에 따라 쓰레기 분리배출 방법이 다를 수 있음을 유의하고 청소 직무를 익혀 직업인으로서 갖추어야 할 소양과 기술을 기르도록 한다.","n":["성취기준은 학생이 거주하는 지역과 주거 형태에 따른 ‘분리 수거 대상 재활용 가능 자원의 품목과 분리배출 요령’을 조사하여 수업에 활용하고, 혼합 재질로 구성된폐기물은 최대한 재질별로 분리하여 배출하는 데 주안점을 둔다."],"p":462,"b":2},{"c":"[12작업Ⅱ04-05]","k":"선택","sk":"전문 교과(직업·생활)","s":"기초작업기술Ⅱ","g":"고등학교 1~3학년","d":"작업 환경 관리","t":"역할을 분담하여 공동으로 청소한다.","m":"공동 청소 작업 시 각자의 역할을 분담하여 책임 의식과 협동심을 기르게 하고자 설정하였다. 집 청소 협업으로 수행하기, 사무실 청소 협업으로 수행하기 등을 포함한다. 학생의 직업적 특성에 알맞은 역할을 제공하여 전체 학생이 개인과 협동 작업에 참여하도록 지도하고, 반복 훈련으로 직무 능력을 향상하는 데 중점을 둔다.","n":[],"p":462,"b":2},{"c":"[12작업Ⅱ04-06]","k":"선택","sk":"전문 교과(직업·생활)","s":"기초작업기술Ⅱ","g":"고등학교 1~3학년","d":"작업 환경 관리","t":"에너지 절약을 실천하여 쾌적한 작업 환경을 유지한다.","m":"청소용품의 에너지 효율성을 높이거나 낭비되는 에너지를 줄여 에너지 절약을 실천함으로써 쾌적한 작업 환경을 유지하게 하고자 설정하였다. 일회용품 사용 줄이기, 에너지 효율 등급이 높은 제품 사용하기, 사용하지 않는 전기 콘센트 뽑기 등을 다룬다. 생활 공간에 대한 소중함을 인식하고 다른 사람들과 공동체 생활을 실천하는 습관을 형성하도록 한다.","n":[],"p":462,"b":2},{"c":"[12정처01-01]","k":"선택","sk":"전문 교과(직업·생활)","s":"정보처리","g":"고등학교 1~3학년","d":"정보와 미래","t":"정보 사회의 특성과 정보 관련 직업의 종류를 조사하여 설명한다.","m":"","n":[],"p":474,"b":2},{"c":"[12정처01-02]","k":"선택","sk":"전문 교과(직업·생활)","s":"정보처리","g":"고등학교 1~3학년","d":"정보와 미래","t":"다양한 인터넷 서비스를 활용하여 필요한 정보를 수집, 분류, 분석한다.","m":"일반적으로 정보를 검색하는 과정은 검색 주제를 선정하고, 인터넷 검색 엔진을 선택하며, 검색식을 작성하여 결과를 출력하는 단계로 이루어진다. 검색식은 다양한 키워드를 적절한 연산자와 조합하여 검색하는 것으로, 구체적인 검색을 가능하게 한다. 다양한 검색 엔진과 검색식을 활용하는 것은 정보를 빠르게 찾는 데 필요한 기술이다. 특수교육 대상 학생이 다양한 인터넷 서비스를 활용하고 이로써 원하는 정보를 획득하도록 한다.","n":["자판을 이용한 검색 활동이 어려운 학생은 음성 검색, 큐아르(QR) 바코드 검색, 렌즈 검색 등을 활용하여 필요한 정보에 접근할 수 있는 별도의 방법을 고안하여 적용한다."],"p":474,"b":2},{"c":"[12정처01-03]","k":"선택","sk":"전문 교과(직업·생활)","s":"정보처리","g":"고등학교 1~3학년","d":"정보와 미래","t":"수집, 분류, 분석한 정보를 관리하고 활용한다.","m":"방대한 정보 속에서 자신에게 필요한 정보를 신속하고 정확하게 찾아내서 활용하는 것은 매우 중요하다. 나에게 필요한 정보를 수집하여 직접 활용하는 것에 주안점을 둔다. 특히 생활 속에서 필요한 정보를 직접 활용해 볼 기회를 제공한다.","n":["단순히 정보를 수집하기보다는 비판적으로 정보를 수집하도록 하는 데 주안점을 둔 성취기준이다. 자신에게 필요한 정보를 수집, 분석, 활용하는 능력은 미래 사회 적응에 필수 요소일 뿐 아니라 이미 ‘정보통신활용’ 등 다른 교과에서 다룬 내용이다. 방대한 정보 속에서 거짓 정보를 찾아내고 걸러내는 능력이 중요하므로 비판적 사고를 기르도록 한다."],"p":474,"b":2},{"c":"[12정처01-04]","k":"선택","sk":"전문 교과(직업·생활)","s":"정보처리","g":"고등학교 1~3학년","d":"정보와 미래","t":"저작권, 개인 정보 등 정보 사용 윤리를 준수하는 방법을 찾고 실천한다.","m":"정보 사용 윤리는 정보를 창작하고 처리하는 과정에서 발생할 수 있는 문제들과 관련된 윤리를 말하며, 개인 정보는 성명, 생일, 주민등록번호, 집 주소, 휴대전화 번호 등으로 개인을 식별할 수 있는 정보를 말한다. 정보를 사용할 때 저작권 등과 같은 관련법을 준수하고, 자신의 개인 정보 보호뿐만 아니라 타인의 개인 정보를 함부로 사용하지 않도록 개인 정보 보호 수칙을 준수하여 정보 사용 윤리 의식을 함양하도록 한다.","n":["관련법을 잘 숙지하지 못한 학생이 타인의 정보를 허락 없이 활용, 공유하거나 자신은 물론 타인의 개인 정보를 유출하는 경우가 있으므로 정보 사용과 개인 정보 관련한 내용을 적법하게 다루도록 내용을 구성한다. 특히 사회 관계망 서비스(SNS) 등에서 타인의 사진, 저작물 등을 함부로 공유하지 않도록 하여야 하며, 원격수업 시에도 타인의 얼굴, 수업 내용 등을 동의 없이 유포하지 않도록 지도한다."],"p":474,"b":2},{"c":"[12정처02-01]","k":"선택","sk":"전문 교과(직업·생활)","s":"정보처리","g":"고등학교 1~3학년","d":"디지털 문해","t":"정보를 처리하기 위한 디지털 기기의 종류를 탐색하고 활용한다.","m":"정보를 처리하는 각종 디지털 기기와 그 사용법은 계속해서 개선되면서 변화하고 사용법 또한 계속 업데이트되고 있다. 필요한 정보를 찾기 위한 디지털 기초 소양을 갖추어 계속 변화하는 디지털 기기를 활용하는 방법을 탐색하고 경험하도록 한다. 특수교육 대상 학생이 정보를 처리할 수 있는 다양한 기기를 스스로 찾는 능력을 기른다.","n":["에서는 특정 기기에 한정하여 지도하기보다는 나에게 필요한 기기를 찾고 그 기기와 관련된 정보를 수집하여 기기 활용 방법을 스스로 찾아내도록 구성한다. 기기의 종류와 소프트웨어는 매우 빠르게 변하고 성능이 향상되고 있으므로, 디지털 기초 소양을 쌓아 빠르게 변화하는 사회에 적응할 수 있는 디지털 역량을 함양하도록 내용을 구성한다."],"p":476,"b":2},{"c":"[12정처02-02]","k":"선택","sk":"전문 교과(직업·생활)","s":"정보처리","g":"고등학교 1~3학년","d":"디지털 문해","t":"소프트웨어와 인공지능 기술이 적용된 사례를 탐색하고 우리 생활에 미치는 영향을 이해한다.","m":"","n":[],"p":476,"b":2},{"c":"[12정처02-03]","k":"선택","sk":"전문 교과(직업·생활)","s":"정보처리","g":"고등학교 1~3학년","d":"디지털 문해","t":"소프트웨어와 인공지능 기술이 활용된 도구를 사용하여 정보를 처리한다.","m":"일상생활에서 소프트웨어와 인공지능이 적용된 사례가 많으며 이를 활용하여 생활 속 다양한 문제와 정보를 처리할 수 있다. 특수교육 대상 학생이 소프트웨어와 인공지능이 적용된 도구로 생활 속 정보를 처리할 기회를 제공하되, 장애 유형과 정도에 따라 언어를 사용하는 기기의 활용에 어려움이 있을 수 있으므로 언어 사용 도구뿐만 아니라 시각적 요소, 텍스트 인식 도구들을 활용하는 다양한 요소를 포함한다.","n":[],"p":476,"b":2},{"c":"[12정처02-04]","k":"선택","sk":"전문 교과(직업·생활)","s":"정보처리","g":"고등학교 1~3학년","d":"디지털 문해","t":"디지털 기술･데이터･콘텐츠･미디어 윤리를 알고 실천한다.","m":"복잡하고 많은 정보 속에서 자신에게 필요한 정보를 올바른 방법으로 활용하는 것은 매우 중요하다. 특히, 디지털 기술･데이터･콘텐츠･미디어를 활용할 때 관련법을 숙지하지 못해 초상권과 저작권을 위반할 수 있다. 초상권, 저작권법에 대해 알고 이를 위반하지 않고 윤리적으로 사용하는 것에 주안점을 둔다. 또한 사회적으로 용인되지 않는 내용의 정보를 저장하거나 유포하는 일이 없도록 내용을 구성한다.","n":["에서는 미디어를 활용할 때 윤리적으로 사용하는 것뿐만 아니라 매체를 비판적으로 인식할 수 있는 내용을 함께 지도한다."],"p":476,"b":2},{"c":"[12정처03-01]","k":"선택","sk":"전문 교과(직업·생활)","s":"정보처리","g":"고등학교 1~3학년","d":"시각디자인","t":"시각디자인의 의미를 알고, 이를 활용한 분야와 관련 직업을 조사한다.","m":"","n":["에서는 [12정처02-04]에서 학습한 디지털 문해력을 바탕으로 다양한 매체를 활용하여 디지털 시각디자인과 관련된 유망 직종을 살펴보도록 한다."],"p":477,"b":2},{"c":"[12정처03-02]","k":"선택","sk":"전문 교과(직업·생활)","s":"정보처리","g":"고등학교 1~3학년","d":"시각디자인","t":"컴퓨터와 스마트 기기의 디자인 프로그램의 기본 기능을 익힌다.","m":"컴퓨터와 스마트 기기의 디자인 프로그램 활용 방법이 유사하게 보이지만 다소 차이가 존재한다. 컴퓨터는 마우스와 키보드를 활용하고 스마트 기기는 손 또는 스마트 펜을 사용하는 것이 다르며 구체적인 프로그램을 사용할 때도 서로 다르다. 특수교육 대상 학생이 컴퓨터와 스마트 기기를 활용해 보고 자신에게 적절한 도구를 활용하여 디자인하도록 프로그램 기본 기능 활용에 주안점을 둔다.","n":[],"p":477,"b":2},{"c":"[12정처03-03]","k":"선택","sk":"전문 교과(직업·생활)","s":"정보처리","g":"고등학교 1~3학년","d":"시각디자인","t":"컴퓨터와 스마트 기기의 디자인 프로그램을 활용하여 이미지 디자인을 제작한다.","m":"시각디자인은 신속하고 정확하게 의미를 전달하는 목적을 지닌 디자인 분야이다. 종류가 다양하고 새로운 개념이 계속 등장하고 있지만, 여기서는 평면 디자인에 해당하는 일러스트레이터와 관련한 각종 이미지 제작을 다룬다. 캐릭터, 웹툰, 상품 이미지 제작 등으로 디자인 프로그램을 활용하는 능력과 창의성 함양에 주안점을 둔다.","n":[],"p":477,"b":2},{"c":"[12정처03-04]","k":"선택","sk":"전문 교과(직업·생활)","s":"정보처리","g":"고등학교 1~3학년","d":"시각디자인","t":"컴퓨터와 스마트 기기의 디자인 프로그램을 활용하여 텍스트 디자인을 제작한다.","m":"문자를 활용한 텍스트 디자인 역시 디자인의 한 분야이다. 직접 손으로 그리는 디자인도 가능하지만, 컴퓨터 또는 디지털 기기의 일러스트레이션 프로그램을 활용하여캘리그라피, 타이포그래피, 레터링 디자인 등도 가능하다. 문자의 형태, 크기, 배치, 색채 등을 고려하여 디자인해 봄으로써 일러스트레이션의 기초 기능을 익히고 창의성을 함양하는 데 주안점을 둔다.","n":[],"p":477,"b":2},{"c":"[12정처03-05]","k":"선택","sk":"전문 교과(직업·생활)","s":"정보처리","g":"고등학교 1~3학년","d":"시각디자인","t":"컴퓨터와 스마트 기기의 디자인 프로그램을 활용하여 이모티콘 디자인을 제작한다.","m":"사회 관계망 서비스(SNS)의 이모티콘 디자인은 다양한 세대에서 각광받고 있다. 그림을 잘 그리지 않아도 신선한 아이디어만으로 이모티콘 시장에 진출이 가능하다. 여기서는 이모티콘 아이디어 내기, 콘티 짜기, 멈춰 있는 이모티콘이나 움직이는 이모티콘 만들기 등으로 일러스트레이션 프로그램의 기초 기능을 익히고 창의성을 함양하는 데 주안점을 둔다.","n":[],"p":477,"b":2},{"c":"[12정처04-01]","k":"선택","sk":"전문 교과(직업·생활)","s":"정보처리","g":"고등학교 1~3학년","d":"영상디자인","t":"영상 제작의 의미를 알고, 이를 활용한 분야와 관련 직업을 조사한다.","m":"영상 제작은 영상 연출부터 촬영, 조명, 음향 제작, 그래픽, 편집, 미술을 포함한다. 영상 제작 과정 전반과 드론 촬영 기법 등 4차 산업과 관련된 영상 제작과정을 함께 살펴보고 관련 직업을 조사하도록 한다. 그중에서도 이러한 과정을 바탕으로 제작된 다양한 개인 미디어 채널을 중점적으로 살펴보고 장애인 제작자가 운영하고 있는 채널을 보며 관련 직업에 관심을 가지도록 내용을 구성한다.","n":["에서는 [12정처02-04]에서 학습한 디지털 문해력를 바탕으로 다양한 매체를 활용하여 디지털 영상디자인과 관련된 유망 직종을 살펴보도록 구성한다."],"p":479,"b":2},{"c":"[12정처04-02]","k":"선택","sk":"전문 교과(직업·생활)","s":"정보처리","g":"고등학교 1~3학년","d":"영상디자인","t":"컴퓨터 영상 편집 프로그램의 기본 기능을 익힌다.","m":"","n":[],"p":479,"b":2},{"c":"[12정처04-03]","k":"선택","sk":"전문 교과(직업·생활)","s":"정보처리","g":"고등학교 1~3학년","d":"영상디자인","t":"스마트 기기의 영상 편집 프로그램의 기본 기능을 익힌다.","m":"","n":[],"p":479,"b":2},{"c":"[12정처04-04]","k":"선택","sk":"전문 교과(직업·생활)","s":"정보처리","g":"고등학교 1~3학년","d":"영상디자인","t":"영상 편집 프로그램을 활용하여 개인 미디어 콘텐츠를 제작한다.","m":"컴퓨터와 스마트 기기의 영상 편집 프로그램을 활용해 자신이 제작하고 싶은콘텐츠를 주제에 맞게 구성, 연출, 촬영, 편집하여 개인 미디어 콘텐츠를 제작한다. 미디어 제작자 중에는 장애인도 많으며, 특히 청각장애의 경우 수어를 활용하여 미디어를 제작하기도 한다. 아이디어를 발산하고, 스토리를 구성하며, 이를 잘 표현하도록 촬영하고 편집하는 과정에서 자신의 생각을 미디어 콘텐츠로 전달하는 기회를 제공한다.","n":[],"p":479,"b":2},{"c":"[12정처05-01]","k":"선택","sk":"전문 교과(직업·생활)","s":"정보처리","g":"고등학교 1~3학년","d":"공유와 협업","t":"온라인 협업의 사례를 살펴보고 협업의 중요성을 설명한다.","m":"여러 사람이 함께하는 작업과 직업생활에서 협업은 매우 중요하다. 분업과 협업을 바탕으로 작업하고 제대로 협업이 이루어져야 작업이 원활하게 진행된다. 직무 이행 과정에서 협업이 왜 중요한지 알고, 이러한 협업이 오프라인 상황뿐만 아니라 온라인 상황에서도 중요해지고 있음을 이해하는 것이 필요하다.","n":[],"p":480,"b":2},{"c":"[12정처05-02]","k":"선택","sk":"전문 교과(직업·생활)","s":"정보처리","g":"고등학교 1~3학년","d":"공유와 협업","t":"다양한 디지털 의사소통을 경험하고 아이디어를 공유한다.","m":"재택근무, 화상 회의 등 직업 환경에서 비대면 업무 처리가 많아지고 있는 상황에서 디지털 의사소통을 경험하도록 한다. 영상통화(회의), 사회 관계망 서비스(SNS), 이메일, 웹하드, 클라우드, 전화, 메신저, 댓글 등의 다양한 디지털 의사소통 방법을 경험하여 타인과 온라인상으로 의사소통하는 방법에 관심을 갖고 경험하는 데 목적이 있다. 아이디어를 주고받으려면 일방향 의사소통이 아닌 쌍방향 의사소통이 중요하므로 영상 통화, 영상 회의, 사회 관계망 서비스(SNS), 이메일, 전화, 메신저, 댓글 등의 다양한 디지털 의사소통 방법으로 타인과 아이디어를 쌍방향으로 주고받는 능력을 기르는 데 주안점을 둔다.","n":[],"p":480,"b":2},{"c":"[12정처05-03]","k":"선택","sk":"전문 교과(직업·생활)","s":"정보처리","g":"고등학교 1~3학년","d":"공유와 협업","t":"자료와 데이터를 공유하여 협업 자료를 제작한다.","m":"오늘날 막대한 양의 데이터를 다루게 되면서 데이터 과학 교과가 독립적으로분리되어 개발될 만큼 데이터의 중요성이 강조되고 있으며, 이러한 데이터는 인공지능의 기초가 되기도 한다. 여기서 정의하는 데이터는 데이터 과학에서 사용되는 빅데이터, 데이터 마이닝, 기계 학습 등에서 활용되는 데이터를 의미하며, 자료는 이와는 별도로 문서 처리(한글, 파워포인트 등), 음성 처리, 화상 처리 등에서 사용되는 자료로 구분하고자 한다. 온라인 협업으로 자료와 데이터를 공유하여 협업 자료를 제작하는 방법을 익히도록 한다.","n":["의 경우 특정 프로그램의 학습보다는 온라인 협업 프로그램의 경험에 목적이있다. 전과 달리 프로그램이 끊임없이 개발되거나 변화되고 있고 온라인 협업의 경우 학교 또는 회사마다 활용하는 프로그램이 상이하므로 한두 개 프로그램의 기능을 익히는 데에 중점을 두기보다는 다양한 온라인 협업 프로그램(온라인 프레젠테이션, 온라인 스프레드 시트, 온라인 설문지, 온라인 롤링 페이퍼 등)을 다양하게 경험하는 데에 목적을 두고 내용을 구성한다."],"p":480,"b":2},{"c":"[12정처05-04]","k":"선택","sk":"전문 교과(직업·생활)","s":"정보처리","g":"고등학교 1~3학년","d":"공유와 협업","t":"공유와 협업을 위한 의사소통 태도를 갖춘다.","m":"","n":[],"p":480,"b":2},{"c":"[12농생01-01]","k":"선택","sk":"전문 교과(직업·생활)","s":"농생명","g":"고등학교 1~3학년","d":"농생명 산업","t":"우리나라 농생명 산업의 현황을 파악하고 농생명 산업의 중요성을 설명한다.","m":"이 성취기준은 우리나라 농생명 산업의 과거부터 현재까지 발전 모습을 살펴보고, 농생명 산업이 가지는 중요성을 설명하는 데 중점을 두었다. 국가통계포털 등 여러 가지 농생명 산업 관련 자료를 검색해 우리나라 농생명 산업 현황을 폭넓게 이해하는 것이 중요하다.","n":[],"p":491,"b":2},{"c":"[12농생01-02]","k":"선택","sk":"전문 교과(직업·생활)","s":"농생명","g":"고등학교 1~3학년","d":"농생명 산업","t":"농생명 산업 분야의 직업 정보를 탐색하고 관련 직업을 조사한다.","m":"","n":[],"p":491,"b":2},{"c":"[12농생01-03]","k":"선택","sk":"전문 교과(직업·생활)","s":"농생명","g":"고등학교 1~3학년","d":"농생명 산업","t":"농생명 산업에 종사하는 직업인에게 어울리는 윤리 의식과 태도를 함양한다.","m":"","n":[],"p":491,"b":2},{"c":"[12농생02-01]","k":"선택","sk":"전문 교과(직업·생활)","s":"농생명","g":"고등학교 1~3학년","d":"식물 자원 관리","t":"식물 자원의 의미와 종류를 알고, 중요성을 설명한다.","m":"","n":[],"p":492,"b":2},{"c":"[12농생02-02]","k":"선택","sk":"전문 교과(직업·생활)","s":"농생명","g":"고등학교 1~3학년","d":"식물 자원 관리","t":"작물의 생육 과정을 설명한다.","m":"","n":[],"p":492,"b":2},{"c":"[12농생02-03]","k":"선택","sk":"전문 교과(직업·생활)","s":"농생명","g":"고등학교 1~3학년","d":"식물 자원 관리","t":"작물에 거름주기와 토양 관리 방법을 익힌다.","m":"","n":[],"p":492,"b":2},{"c":"[12농생02-04]","k":"선택","sk":"전문 교과(직업·생활)","s":"농생명","g":"고등학교 1~3학년","d":"식물 자원 관리","t":"식량 작물의 종류와 특성을 알고 재배한다.","m":"","n":[],"p":492,"b":2},{"c":"[12농생02-05]","k":"선택","sk":"전문 교과(직업·생활)","s":"농생명","g":"고등학교 1~3학년","d":"식물 자원 관리","t":"원예 작물의 종류와 특성을 알고 재배한다.","m":"","n":[],"p":492,"b":2},{"c":"[12농생02-06]","k":"선택","sk":"전문 교과(직업·생활)","s":"농생명","g":"고등학교 1~3학년","d":"식물 자원 관리","t":"수경 재배의 의의와 종류를 알고 재배한다.","m":"이 성취기준은 수경 재배에 대해 이해하고 수경 재배 방법으로 작물을 재배하는 실습을 하는 데 중점을 두어 설정하였다. 수경 재배는 흙을 사용하지 않고 물과 수용성 영양분으로 만든 배양액 속에서 식물을 키우는 재배 방법이다. 수경 재배와 토양 재배 방법을 비교하고 수경 재배의 장점을 이해하면서 수경 재배에 필요한 기술과 기능을 익히도록 한다.","n":[],"p":492,"b":2},{"c":"[12농생02-07]","k":"선택","sk":"전문 교과(직업·생활)","s":"농생명","g":"고등학교 1~3학년","d":"식물 자원 관리","t":"식물 공장의 특징과 종류를 설명한다.","m":"이 성취기준은 식물 공장의 뜻을 알고 실제적인 운영 방법을 실습하는 데 중점을 두어 설정하였다. 식물 공장은 통제된 시설 안에서 빛, 온도, 습도 등 재배 환경을 인위적으로 조성하여 연중 농산물을 공산품처럼 생산하는 시스템을 말한다. 자연광과 인공광을 이용한 식물 공장의 차이를 이해하고, 특성에 맞는 작물과 재배 방법을 익히도록 한다.","n":[],"p":492,"b":2},{"c":"[12농생02-08]","k":"선택","sk":"전문 교과(직업·생활)","s":"농생명","g":"고등학교 1~3학년","d":"식물 자원 관리","t":"농산물 가공의 필요성과 유통 과정을 설명한다.","m":"","n":[],"p":492,"b":2},{"c":"[12농생03-01]","k":"선택","sk":"전문 교과(직업·생활)","s":"농생명","g":"고등학교 1~3학년","d":"동물 자원 관리","t":"동물의 종류와 특성을 알고 동물 산업의 중요성을 설명한다.","m":"","n":[],"p":493,"b":2},{"c":"[12농생03-02]","k":"선택","sk":"전문 교과(직업·생활)","s":"농생명","g":"고등학교 1~3학년","d":"동물 자원 관리","t":"친환경 사육의 필요성을 알고 동물 사육에 적합한 환경을 조성한다.","m":"이 성취기준은 친환경 사육의 필요성과 동물 사육에 적합한 환경을 조성하는 방법을 익히게 하는 데 목적이 있다. 동물의 종류에 따른 적합한 사육 환경에 대한 실제적인 지식을 습득하고, 동물을 사육할 때 발생할 수 있는 다양한 문제점을 파악하여 동물의 특성에 따른 친환경적인 사육이 지구 환경과 동물 복지 차원에서 필요함을 이해하는 것이 중요하다.","n":[],"p":493,"b":2},{"c":"[12농생03-03]","k":"선택","sk":"전문 교과(직업·생활)","s":"농생명","g":"고등학교 1~3학년","d":"동물 자원 관리","t":"축산물 가공 종류를 알고 유통 과정을 익힌다.","m":"","n":[],"p":493,"b":2},{"c":"[12농생03-04]","k":"선택","sk":"전문 교과(직업·생활)","s":"농생명","g":"고등학교 1~3학년","d":"동물 자원 관리","t":"반려동물의 종류와 특성에 적합한 관리 방법을 익힌다.","m":"반려동물의 종류에 따른 양육과 관리 방법에 대한 정보를 찾고 실습과 현장 체험 학습을 바탕으로 관련 지식을 습득하는 데 중점을 둔다. 또한 성숙한 반려동물 문화 조성에 관심을 가지고 반려동물 산업의 다양한 직무를 경험하도록 한다.","n":[],"p":493,"b":2},{"c":"[12농생03-05]","k":"선택","sk":"전문 교과(직업·생활)","s":"농생명","g":"고등학교 1~3학년","d":"동물 자원 관리","t":"반려동물에 대한 생명 존중의 중요성을 알고 책임감을 가진다.","m":"반려동물을 양육하는 가구가 늘어나면서 동물 복지에 대한 관심이 높아지고있는 오늘날의 사회상을 반영하여 반려동물에 대한 생명 존중의 마음가짐을 가지고, 책임감 있게 양육하는 방법을 익히게 하고자 설정하였다. 유기 동물에 대한 사회적 문제, 반려동물 양육을 위해 갖추어야 할 책무 등을 실제적인 사례를 통해 익히도록 한다.","n":[],"p":493,"b":2},{"c":"[12농생04-01]","k":"선택","sk":"전문 교과(직업·생활)","s":"농생명","g":"고등학교 1~3학년","d":"산림 자원 관리","t":"주변의 숲을 찾아 숲을 구성하는 식물을 관찰하고 우리 생활과의 관계를 이해한다.","m":"","n":[],"p":494,"b":2},{"c":"[12농생04-02]","k":"선택","sk":"전문 교과(직업·생활)","s":"농생명","g":"고등학교 1~3학년","d":"산림 자원 관리","t":"숲이 가지는 다양한 기능을 설명한다.","m":"","n":[],"p":494,"b":2},{"c":"[12농생04-03]","k":"선택","sk":"전문 교과(직업·생활)","s":"농생명","g":"고등학교 1~3학년","d":"산림 자원 관리","t":"산림 자원을 관리하는 방법을 익히고 산림 자원 관리에 참여한다.","m":"","n":[],"p":494,"b":2},{"c":"[12농생04-04]","k":"선택","sk":"전문 교과(직업·생활)","s":"농생명","g":"고등학교 1~3학년","d":"산림 자원 관리","t":"산림 자원을 활용한 생산물을 살펴보고 우리 생활에서 적용할 분야를 찾는다.","m":"","n":[],"p":494,"b":2},{"c":"[12농생04-05]","k":"선택","sk":"전문 교과(직업·생활)","s":"농생명","g":"고등학교 1~3학년","d":"산림 자원 관리","t":"산림 보호의 중요성을 알고, 산림 자원을 보호하는 방법을 설명한다.","m":"이 성취기준은 산림 보호의 중요성을 알고, 산림 자원을 보호하는 방법을 습득하는 데 중점을 두어 설정하였다. 숲이 가지는 가치를 살펴 산림 자원의 중요성을 내면화하고 산림 자원 보호를 위해 국가적으로 노력하는 다양한 예를 제시하여 생태환경 보호의 중요성을 인식하도록 한다. 이로써 산림 자원 보호와 생태환경 보호를 일상생활에서 실천할 수 있는 능력을 기르도록 한다.","n":[],"p":494,"b":2},{"c":"[12농생05-01]","k":"선택","sk":"전문 교과(직업·생활)","s":"농생명","g":"고등학교 1~3학년","d":"미래 농생명 산업","t":"친환경 농업의 의미와 중요성을 생활과의 관계 속에서 설명한다.","m":"","n":[],"p":495,"b":2},{"c":"[12농생05-02]","k":"선택","sk":"전문 교과(직업·생활)","s":"농생명","g":"고등학교 1~3학년","d":"미래 농생명 산업","t":"친환경 농업 기술을 적용한 친환경 재배 실습 과정에 참여한다.","m":"","n":[],"p":495,"b":2},{"c":"[12농생05-03]","k":"선택","sk":"전문 교과(직업·생활)","s":"농생명","g":"고등학교 1~3학년","d":"미래 농생명 산업","t":"도시 농업의 다양한 의미와 가치를 알고 필요한 지식과 기술을 습득한다.","m":"","n":[],"p":495,"b":2},{"c":"[12농생05-04]","k":"선택","sk":"전문 교과(직업·생활)","s":"농생명","g":"고등학교 1~3학년","d":"미래 농생명 산업","t":"관광 농업의 의미와 중요성을 이해한다.","m":"","n":[],"p":495,"b":2},{"c":"[12농생05-05]","k":"선택","sk":"전문 교과(직업·생활)","s":"농생명","g":"고등학교 1~3학년","d":"미래 농생명 산업","t":"농생명 산업에 적용되는 과학 기술 분야를 탐색한다.","m":"이 성취기준은 농생명 산업에 적용되는 과학 기술 분야를 분석하고 탐색하며, 미래 사회 농생명 산업에서 과학 기술의 중요한 역할을 인식하는 데 중점을 두어 설정하였다. 과학 기술의 발전으로 인간의 삶과 산업의 구조도 변화되고 있으며 이 변화에 적응하기 위한 준비가 선행되어야 한다는 것을 아는 것은 중요하다. 따라서 농생명 산업과 과학 기술의 발전 모습을 알아보고 지속가능한 삶을 살아가는 데 필요한 역량과 자질을 기르도록 한다.","n":[],"p":495,"b":2},{"c":"[12농생05-06]","k":"선택","sk":"전문 교과(직업·생활)","s":"농생명","g":"고등학교 1~3학년","d":"미래 농생명 산업","t":"미래 농생명 산업의 분야를 조사하고 가치를 인식한다.","m":"","n":[],"p":495,"b":2},{"c":"[12사무01-01]","k":"선택","sk":"전문 교과(직업·생활)","s":"사무지원","g":"고등학교 1~3학년","d":"사무 지원의 이해","t":"사무 지원의 개념과 직무를 이해한다.","m":"사무란 자신이 맡은 업무와 관련된 여러 가지 일을 처리하는 것을 의미하며,사무 지원은 사무를 지원하거나 보조하는 수준에서 수행하는 것을 말한다. 이 성취기준에서는 사무 지원의 개념과 직무에 대한 전반적 이해를 위한 내용을 다룬다.","n":[],"p":505,"b":2},{"c":"[12사무01-02]","k":"선택","sk":"전문 교과(직업·생활)","s":"사무지원","g":"고등학교 1~3학년","d":"사무 지원의 이해","t":"사무 지원의 필요성을 이해하고 다양한 직무에서 사무 지원이 필요한 상황을 파악한다.","m":"사무 지원이 필요한 상황을 파악하는 것은 직장 내 자신의 역할과 직업적 가치를 실현하는 중요한 과정 중 하나이다. 다양한 사무 업무 상황에서 필요한 도움이 무엇인지 파악하고 이에 어울리는 나의 역할을 찾는 것을 중점적으로 다룬다. 이로써 사무 지원 직무 수행에 필요한 능력과 자질을 함양한다.","n":[],"p":505,"b":2},{"c":"[12사무01-03]","k":"선택","sk":"전문 교과(직업·생활)","s":"사무지원","g":"고등학교 1~3학년","d":"사무 지원의 이해","t":"사무 지원 직무의 종류를 이해하여 특정 상황에 필요한 사무 지원 직무를 찾는다.","m":"","n":[],"p":505,"b":2},{"c":"[12사무01-04]","k":"선택","sk":"전문 교과(직업·생활)","s":"사무지원","g":"고등학교 1~3학년","d":"사무 지원의 이해","t":"사무 지원 직무를 효율적으로 수행하는 올바른 자세와 태도를 갖춘다.","m":"이 성취기준은 사무 지원 직무를 바르게 수행하기 위한 자세와 태도를 탐색하기 위해 설정하였고 다양한 사람과 협력적으로 상호 작용하는 태도와 능력을 포함하도록한다. 구체적인 사례를 중심으로 필요한 역할과 태도를 가시화하고 자신의 다양한 상황과 특성을 고려하여 자신의 미래 직업인으로서의 삶에 어울리는 마음가짐과 태도를 익히도록 한다.","n":[],"p":505,"b":2},{"c":"[12사무02-01]","k":"선택","sk":"전문 교과(직업·생활)","s":"사무지원","g":"고등학교 1~3학년","d":"사무 보조 직무","t":"사무용품의 이름과 종류, 용도를 파악한다.","m":"사무 지원 업무 수행 시 사용되는 사무용품을 이해하게 하고자 설정한 성취기준이다. 다양한 사무용품의 이름, 종류와 사무용품의 용도를 연결하여 이해하고, 이를 효율적으로 다루기 위한 능력의 기반을 다지는 데 중점을 둔다. 새로운 사무 지원 용품에 관심을 가지고 다양한 경로를 통해 용도를 파악하는 내용도 함께 다룬다.","n":[],"p":506,"b":2},{"c":"[12사무02-02]","k":"선택","sk":"전문 교과(직업·생활)","s":"사무지원","g":"고등학교 1~3학년","d":"사무 보조 직무","t":"사무용품을 용도에 맞게 안전하고 효율적으로 사용한다.","m":"","n":[],"p":506,"b":2},{"c":"[12사무02-03]","k":"선택","sk":"전문 교과(직업·생활)","s":"사무지원","g":"고등학교 1~3학년","d":"사무 보조 직무","t":"사무기기의 이름과 종류, 용도를 파악한다.","m":"사무 지원 업무 수행 시 사용되는 컴퓨터, 복사기, 팩스, 계산기 등의 사무기기에 대한 전반적인 이해를 돕는 성취기준이다. 사무기기가 제조사와 제품 모델에 따라 모습과 기능이 달라질 수 있음을 인식하고, 해당 기기의 사용 방법을 파악하는 데 중점을 둔다. 제품에 동봉된 사용 설명서를 읽는 방법, 제조사의 누리집에서 사용 설명서에 접근하는 방법 등을 함께 다룬다.","n":[],"p":506,"b":2},{"c":"[12사무02-04]","k":"선택","sk":"전문 교과(직업·생활)","s":"사무지원","g":"고등학교 1~3학년","d":"사무 보조 직무","t":"사무기기의 기능을 알고 안전하고 효율적으로 사용한다.","m":"","n":[],"p":506,"b":2},{"c":"[12사무02-05]","k":"선택","sk":"전문 교과(직업·생활)","s":"사무지원","g":"고등학교 1~3학년","d":"사무 보조 직무","t":"사무실의 보안 절차를 인식하여 따르고, 쾌적한 사무실 환경 유지 방법을 익힌다.","m":"","n":[],"p":506,"b":2},{"c":"[12사무02-06]","k":"선택","sk":"전문 교과(직업·생활)","s":"사무지원","g":"고등학교 1~3학년","d":"사무 보조 직무","t":"문서를 수신, 발신, 작성, 정리하면서 문서를 관리한다.","m":"","n":[],"p":506,"b":2},{"c":"[12사무02-07]","k":"선택","sk":"전문 교과(직업·생활)","s":"사무지원","g":"고등학교 1~3학년","d":"사무 보조 직무","t":"사무 보조 직무의 효율적 수행 방법을 익히고, 수행 과정에서 즐거움을 찾는다.","m":"사무 보조가 필요한 상황을 이해하고 그 상황에서 필요한 직무를 찾아 효율적으로 수행하는 내용을 다룬다. 그 과정에서 즐거움과 보람을 느끼면서 사무 보조 직무에 대한 적극적인 태도와 책임감을 함양하는 데 중점을 두어 지도한다.","n":[],"p":506,"b":2},{"c":"[12사무03-01]","k":"선택","sk":"전문 교과(직업·생활)","s":"사무지원","g":"고등학교 1~3학년","d":"우편 보조 직무","t":"우편물의 종류에 맞는 수신 방법을 익혀 우편물을 수신한다.","m":"","n":[],"p":507,"b":2},{"c":"[12사무03-02]","k":"선택","sk":"전문 교과(직업·생활)","s":"사무지원","g":"고등학교 1~3학년","d":"우편 보조 직무","t":"우편물을 종류에 따라 분류하고 개인과 부서별로 전달한다.","m":"","n":[],"p":507,"b":2},{"c":"[12사무03-03]","k":"선택","sk":"전문 교과(직업·생활)","s":"사무지원","g":"고등학교 1~3학년","d":"우편 보조 직무","t":"우편물의 특성에 맞는 포장 재료와 방법을 파악하고, 우편물을 포장한다.","m":"우편물 포장은 우편물이 잘 보존되어 수취인에게 전달되도록 종이나 상자, 봉투 등에 담거나 싸는 것을 의미한다. 이 성취기준은 우편물 포장에 사용되는 다양한 재료에 대해 알아보고, 우편물과 우편물 전달 목적에 어울리는 재료를 선택하여 포장 순서에 맞게 포장하는 능력을 키우는 데 주안점을 둔다.","n":[],"p":507,"b":2},{"c":"[12사무03-04]","k":"선택","sk":"전문 교과(직업·생활)","s":"사무지원","g":"고등학교 1~3학년","d":"우편 보조 직무","t":"우편물에 어울리는 방법을 선택하여 우편물을 발송한다.","m":"우편물 발송은 우편물에 따라 적절한 방법을 선택하여 우체국이나 택배 업체등을 통해 발송하는 전반적인 내용을 포함한다. 우편물을 발송하는 것은 우편물의 특성에 적합한 발송 방법과 업체를 선택하는 것, 우편물 발송 창구에서 발송 방법 중 하나를 선택하는 것, 택배 발송을 신청해 물품을 발송하는 것 등의 내용으로 구성된다. 우편물 발송은 우편물 종류에 따라 발송하는 방법, 요금에 차이가 있으며, 배송 소요 시간도 서로 다르므로, 우편물의 특성에 적합한 발송 방법과 요금 납부 방법을 선택해 이용하는 구체적이고 실제적인 학습이 되도록 한다.","n":[],"p":507,"b":2},{"c":"[12사무03-05]","k":"선택","sk":"전문 교과(직업·생활)","s":"사무지원","g":"고등학교 1~3학년","d":"우편 보조 직무","t":"우편물에 기록된 개인 정보가 유출되지 않도록 관리한다.","m":"우편물에는 보내는 사람과 받는 사람의 개인 정보가 기재되어 있다. 이러한 개인 정보는 ‘개인정보보호법’ 따라 보호되며 유출되지 않도록 철저히 관리해야 한다. 발송한 우편물의 기록과 수신된 우편물의 개인 정보가 유출되지 않도록 우편물 관리에 중점을둔다.","n":[],"p":507,"b":2},{"c":"[12사무03-06]","k":"선택","sk":"전문 교과(직업·생활)","s":"사무지원","g":"고등학교 1~3학년","d":"우편 보조 직무","t":"우편물 관리 대장을 작성하는 방법을 알고 관리 대장을 작성한다.","m":"우편물 관리 대장은 수신된 우편물을 오염, 훼손, 분실하지 않고 수취인에게 정확하게 전달하기 위해 작성된다. 우편물 관리 대장에 작성해야 할 내용을 수신된 우편물에서 찾아 작성하도록 한다. 우편물이 수취인에게 정확하게 전달될 수 있도록 기록하고 관리하는 능력을 기르는 것에 중점을 둔다.","n":[],"p":507,"b":2},{"c":"[12사무03-07]","k":"선택","sk":"전문 교과(직업·생활)","s":"사무지원","g":"고등학교 1~3학년","d":"우편 보조 직무","t":"우편 보조 직무의 효율적 수행 방법을 익히고 수행 과정에서 즐거움을 찾는다.","m":"","n":[],"p":507,"b":2},{"c":"[12사무04-01]","k":"선택","sk":"전문 교과(직업·생활)","s":"사무지원","g":"고등학교 1~3학년","d":"사서 보조 직무","t":"도서 분류의 필요성을 이해하고, 분류 기준에 따라 도서를 분류한다.","m":"도서 분류는 사서 보조의 중요한 업무 중 하나로, 운영자 측면에서는 자료를효율적으로 관리할 수 있고, 이용자 특면에서는 원하는 책을 쉽게 찾을 수 있게 한다. 도서를 형태 또는 주제별로 분류하고 청구 기호를 참고하여 비슷한 위치에 정리할 도서를 한 곳에 모아두는 내용을 다룬다. 이 성취기준은 학생이 도서 분류 기준을 이해하고 도서를 보고 어떤 기준을 적용할 것인지를 파악하여 기준에 따라 신속하고 정확하게 분류하는 능력을 기르는 데 중점을 둔다.","n":[],"p":509,"b":2},{"c":"[12사무04-02]","k":"선택","sk":"전문 교과(직업·생활)","s":"사무지원","g":"고등학교 1~3학년","d":"사서 보조 직무","t":"도서 등록 방법을 알고, 절차에 따라 도서를 등록한다.","m":"","n":[],"p":509,"b":2},{"c":"[12사무04-03]","k":"선택","sk":"전문 교과(직업·생활)","s":"사무지원","g":"고등학교 1~3학년","d":"사서 보조 직무","t":"청구 기호에 따라 도서를 바르게 정리한다.","m":"청구 기호의 규칙성을 이해하고 청구 기호에 따른 도서 정리 방법을 다루는 성취기준이다. 정리가 필요한 자료를 파악하고, 청구 기호에 따라 분류한 후, 정리할 서가의 위치를 확인한다. 자료를 청구 기호에 따라 정확하게 정리하도록 하는 데 중점을 둔다.","n":[],"p":509,"b":2},{"c":"[12사무04-04]","k":"선택","sk":"전문 교과(직업·생활)","s":"사무지원","g":"고등학교 1~3학년","d":"사서 보조 직무","t":"사용자가 희망하는 도서를 대출하고 반납할 수 있도록 지원한다.","m":"","n":[],"p":509,"b":2},{"c":"[12사무04-05]","k":"선택","sk":"전문 교과(직업·생활)","s":"사무지원","g":"고등학교 1~3학년","d":"사서 보조 직무","t":"도서 관리 시스템을 익혀 사서 보조로서 효율적인 업무 처리 능력을 갖춘다.","m":"도서 관리 시스템은 청구 기호가 부여된 자료를 전산으로 입력하여 자료를 효율적으로 관리하는 시스템을 말한다. 도서 관리 시스템에 등록해야 할 자료의 정보(저자명, 출판사, 출판 연도 등)를 확인하고 정확하게 등록한다. 등록된 정보에 오류가 없는지 확인하고 등록된 자료를 관리하는 능력을 기르는 데 중점을 둔다.","n":[],"p":509,"b":2},{"c":"[12사무04-06]","k":"선택","sk":"전문 교과(직업·생활)","s":"사무지원","g":"고등학교 1~3학년","d":"사서 보조 직무","t":"스마트 도서관에서 필요한 업무를 이해하며 관련 업무를 수행한다.","m":"스마트 도서관은 도서 대출과 반납을 시간에 구애받지 않고 손쉽게 이용하도록 돕는 시스템이다. 이 성취기준은 학생이 스마트 도서관 기기와 자료를 주기적으로 교체, 점검하는 능력을 기를 수 있다.","n":[],"p":509,"b":2},{"c":"[12사무04-07]","k":"선택","sk":"전문 교과(직업·생활)","s":"사무지원","g":"고등학교 1~3학년","d":"사서 보조 직무","t":"사서 보조 직무를 효율적으로 수행함으로써 직무 수행의 즐거움을 느낀다.","m":"","n":[],"p":509,"b":2},{"c":"[12사무05-01]","k":"선택","sk":"전문 교과(직업·생활)","s":"사무지원","g":"고등학교 1~3학년","d":"민원 처리 보조 직무","t":"민원인과의 초기 상담으로 민원인의 요구를 파악한다.","m":"","n":[],"p":510,"b":2},{"c":"[12사무05-02]","k":"선택","sk":"전문 교과(직업·생활)","s":"사무지원","g":"고등학교 1~3학년","d":"민원 처리 보조 직무","t":"민원인의 문제 해결에 필요한 정보를 수집한다.","m":"민원인의 문제를 해결하려면 민원 처리에 필요한 인적사항과 관련 정보를 수집하는 것이 필요하다. 이때 정보는 ‘개인정보보호법’에 따라 합리적이며 타당하게 수집해야 한다. 수집된 정보를 내부 문서와 시스템으로 정리하여 민원 처리를 위한 기초를 다진다.","n":[],"p":510,"b":2},{"c":"[12사무05-03]","k":"선택","sk":"전문 교과(직업·생활)","s":"사무지원","g":"고등학교 1~3학년","d":"민원 처리 보조 직무","t":"민원별 처리 방법을 충분히 익혀 민원 처리 보조로서 효율적인 업무 처리 태도를갖춘다.","m":"","n":[],"p":510,"b":2},{"c":"[12사무05-04]","k":"선택","sk":"전문 교과(직업·생활)","s":"사무지원","g":"고등학교 1~3학년","d":"민원 처리 보조 직무","t":"민원별 신청 방법과 절차를 안내하고, 신청 시 주의사항을 안내한다.","m":"","n":[],"p":510,"b":2},{"c":"[12사무05-05]","k":"선택","sk":"전문 교과(직업·생활)","s":"사무지원","g":"고등학교 1~3학년","d":"민원 처리 보조 직무","t":"민원인에게 필수서류를 안내하고, 접수된 서류를 민원별로 관리한다.","m":"민원의 종류에 따라 민원인이 제출해야 할 다양한 서류들이 있으며 이 서류들을 바탕으로 민원을 처리하게 된다. 민원별로 필요한 서류들의 목록을 파악하여 정리하고, 민원인에게 안내한다. 민원인에게 필요한 서류를 빠짐없이 안내하여 민원 처리 과정이 원활하게 진행되도록 하는 데 중점을 둔다.","n":[],"p":510,"b":2},{"c":"[12사무05-06]","k":"선택","sk":"전문 교과(직업·생활)","s":"사무지원","g":"고등학교 1~3학년","d":"민원 처리 보조 직무","t":"대면⋅비대면 응대에 필요한 예절을 알고, 예의 바른 태도로 민원인을 응대한다.","m":"예의 바른 태도로 민원인을 응대하는 것은 원활한 민원 처리에 도움이 되며응대 과정에서 발생할 수 있는 오해를 줄일 수 있다. 민원인에게 자신의 소속과 신분을 정확하게 밝히고 최대한 예의를 갖춰 응대하도록 지도한다. 응대 과정에 필요한 예절과 민원인과 원활한 대화를 위한 대인 관계 기술을 익히는 데 중점을 둔다.","n":[],"p":510,"b":2},{"c":"[12사무05-07]","k":"선택","sk":"전문 교과(직업·생활)","s":"사무지원","g":"고등학교 1~3학년","d":"민원 처리 보조 직무","t":"민원 처리 보조 직무를 효율적으로 수행함으로써 직무 수행의 즐거움을 느낀다.","m":"","n":[],"p":510,"b":2},{"c":"[12대인01-01]","k":"선택","sk":"전문 교과(직업·생활)","s":"대인서비스","g":"고등학교 1~3학년","d":"대인서비스의 이해","t":"대인서비스 산업의 변화 과정과 전망을 조사하고 분석한다.","m":"","n":[],"p":521,"b":2},{"c":"[12대인01-02]","k":"선택","sk":"전문 교과(직업·생활)","s":"대인서비스","g":"고등학교 1~3학년","d":"대인서비스의 이해","t":"대인서비스 직무영역별 디지털 기기 활용의 필요성을 이해한다.","m":"이 성취기준은 디지털 기기를 통한 협력적 소통 능력을 갖춰 효율적 대인서비스를 제공하게 하고자 설정하였다. 서비스 영역에 따른 각종 디지털 기기의 종류, 서비스제공에 필요한 데이터 관리와 활용 사례 등을 다룬다. 기기나 프로그램의 사용법은 생활 서비스, 공중 보건 서비스, 미용 서비스 실무에서 구체적으로 익힐 것이므로 개괄적인 필요성에 주안점을 둔다.","n":[],"p":521,"b":2},{"c":"[12대인01-03]","k":"선택","sk":"전문 교과(직업·생활)","s":"대인서비스","g":"고등학교 1~3학년","d":"대인서비스의 이해","t":"대인서비스의 영역별 요구되는 직무 능력과 직업 기능을 탐색하고, 갖추어야 할 직업 윤리를 파악한다.","m":"","n":[],"p":521,"b":2},{"c":"[12대인01-04]","k":"선택","sk":"전문 교과(직업·생활)","s":"대인서비스","g":"고등학교 1~3학년","d":"대인서비스의 이해","t":"대인서비스 응대 예절을 익히고 동료, 고객과 상호 작용해야 할 이유를 이해한다.","m":"","n":[],"p":521,"b":2},{"c":"[12대인02-01]","k":"선택","sk":"전문 교과(직업·생활)","s":"대인서비스","g":"고등학교 1~3학년","d":"생활 서비스 실무","t":"생활 편의 증진을 위한 디지털 기기 활용법을 이해하고 주거 생활 서비스 실무 절차를익혀 실무를 실습한다.","m":"이 성취기준은 주거 생활 서비스에 적합한 디지털 기기의 활용법을 이해하고서비스가 제공되는 공간 관리에 적용할 수 있는 구체적 실무를 익히게 하고자 설정하였다. 공간 정리 수납, 청소 대행, 특수 청소(예: 전문 세탁, 세차, 냉장고, 유리창, 커튼 및 블라인드, 장난감), 생활 가전 관리 등을 포함한다. 가정뿐만 아니라 의류 매장이나 마트 등의 상업 시설, 숙박 시설 등에서도 활용될 수 있음을 인식하도록 한다. 또한, 서비스의 특성상 2인 이상이 서비스를 제공하는 경우가 많으므로 동료와 협업하여 실습하는 데 중점을 둔다.","n":[],"p":522,"b":2},{"c":"[12대인02-02]","k":"선택","sk":"전문 교과(직업·생활)","s":"대인서비스","g":"고등학교 1~3학년","d":"생활 서비스 실무","t":"자원 절약과 재활용의 필요성을 이해하고 자원 순환 서비스 실무 절차를 익혀 실무를 실습한다.","m":"이 성취기준은 소비보다 가치를 우위에 두는 사회적 경제를 추구하는 순환 경제 사회로 전환을 위해 자원 순환에 필요한 서비스 직무를 다루고자 설정하였다. 환경 선진국 자원 순환 사례, 자원 순환 서비스 절차, 역물류 관리, 폐기물 분류 실습, 폐기물 재활용과 새활용 실습에 대한 내용을 다룬다. 미래 산업 사회는 편리함보다는 환경의 보전과 자원의 순환을 염두에 두어 발전하고 있으므로 사회적 흐름에 맞추어 변화될 산업과 직무에 관심을 갖도록 한다.","n":[],"p":522,"b":2},{"c":"[12대인02-03]","k":"선택","sk":"전문 교과(직업·생활)","s":"대인서비스","g":"고등학교 1~3학년","d":"생활 서비스 실무","t":"고객 정보를 활용하는 이력 관리 기능을 익혀 고객 만족도 향상을 위한 실무를 실습한다.","m":"이 성취기준은 서비스 제공으로 그치는 것이 아니라 서비스 이력을 정리하고 고객 만족도를 평가하여 더 나은 품질의 서비스를 제공하는 능력을 기르게 하고자 설정하였다. 서비스 이력 관리 기본 내용, 자료 입력 절차, 고객의 만족도 해석, 서비스 개선점 분석 등의 내용을 다룬다. 특수교육 대상 학생의 경우 장애의 정도에 따라 데이터를 분석하는 데 어려움이 있을 수 있으나, 서비스 이력을 누적하여 기록하는 과정이 서비스 품질 개선에 영향을 미친다는 것을 인식하도록 한다.","n":[],"p":522,"b":2},{"c":"[12대인03-01]","k":"선택","sk":"전문 교과(직업·생활)","s":"대인서비스","g":"고등학교 1~3학년","d":"공중 보건 서비스 실무","t":"보편적 건강 증진을 위한 공중 보건 서비스의 필요성과 개인 위생 수칙을 이해한다.","m":"이 성취기준은 모든 사람이 자신의 건강을 유지하는 데 적합한 생활 수준을 보장받도록 사회 제도가 발전해야 함을 전제로 공중 보건 서비스의 필요성을 인식하고 서비스 제공자로서의 기본 자세를 갖추게 하고자 설정하였다. 환경 보건 서비스, 요양 보호 서비스, 의료 위생 관리 서비스를 제공하기 위한 실무자로서 기본적인 개인 위생 수칙을 숙지하는 것이 중요하다.","n":[],"p":523,"b":2},{"c":"[12대인03-02]","k":"선택","sk":"전문 교과(직업·생활)","s":"대인서비스","g":"고등학교 1~3학년","d":"공중 보건 서비스 실무","t":"환경 보건 서비스 제공을 위한 안전 수칙을 확인하고 환경 보건 서비스 실무 절차를 익혀 실무를 실습한다.","m":"이 성취기준은 지역 주민의 건강 증진을 위해 시대와 환경의 요인을 고려하여 대응하는 관련 실무 능력을 기르게 하고자 설정하였다. 환경 위생, 생활 환경 위생 관리, 방역⋅소독 관리, 감염병 예방 관리 등의 내용을 다룬다. 약품을 다루는 직무를 수행하므로 안전 수칙을 지키면서 실무를 익히도록 한다.","n":[],"p":523,"b":2},{"c":"[12대인03-03]","k":"선택","sk":"전문 교과(직업·생활)","s":"대인서비스","g":"고등학교 1~3학년","d":"공중 보건 서비스 실무","t":"돌봄 대상을 존중하는 태도로 요양 보호 서비스 실무 절차를 익혀 실무를 실습한다.","m":"이 성취기준은 요양 보호 서비스 대상에 대한 이해를 바탕으로 상황에 적절한 서비스를 제공하게 하고자 설정하였다. 노인 또는 환자의 건강 상태를 확인하고 신체 활동 지원, 일상생활 지원, 정서 지원, 응급 상황 대처, 시설 환경 관리 서비스 등에 관한 내용을 다룬다. 대상의 상황에 맞게 필요한 도움을 지원하는 데 중점을 둔다.","n":[],"p":523,"b":2},{"c":"[12대인03-04]","k":"선택","sk":"전문 교과(직업·생활)","s":"대인서비스","g":"고등학교 1~3학년","d":"공중 보건 서비스 실무","t":"의료 위생 관리 서비스의 내용을 파악하고 실무 절차를 익혀 실무를 실습한다.","m":"이 성취기준은 국민의 건강한 생활을 위한 공중 보건의 한 영역으로 의료 위생 관리 서비스 직무를 익히게 하고자 설정하였다. 지역사회 보건소, 병의원, 요양시설 등 여러 의료 관련 기관에서 발생하는 폐기물 관리, 의료기기 소독, 의료 보조 기구 소독, 각종 헬스케어 디바이스 등의 위생 관리 서비스 직무를 수행하는 내용을 다룬다. 감염 또는 전염성이 높은 의료 폐기물, 위험한 의료기기와 보조기구를 다루는 경우가 있으므로 관리 지침을 철저히 준수하도록 지도한다.","n":[],"p":523,"b":2},{"c":"[12대인04-01]","k":"선택","sk":"전문 교과(직업·생활)","s":"대인서비스","g":"고등학교 1~3학년","d":"미용 서비스 실무","t":"미용 서비스 제공에 필요한 도구와 제품의 쓰임을 알고 효율적으로 공간을 관리하도록실무 절차를 익혀 실무를 실습한다.","m":"","n":[],"p":524,"b":2},{"c":"[12대인04-02]","k":"선택","sk":"전문 교과(직업·생활)","s":"대인서비스","g":"고등학교 1~3학년","d":"미용 서비스 실무","t":"미용 산업의 특수성을 고려하여 헤어 서비스 보조 실무 절차를 익혀 실무를 실습한다.","m":"이 성취기준은 생산된 상품이 눈에 보이지 않고 표준 상품이 없으며 생산과소비가 동시에 이루어지는 헤어 서비스의 특수성을 다룬다. 이 성취기준은 학생에게 헤어 서비스 실무를 익혀 고객의 요구에 민감하게 반응하면서 적절한 헤어 서비스를 제공하는 기능을 익히게 하는 데 중점을 둔다. 다만 특수교육 대상 학생이 자격을 취득하고 고객의 헤어를 직접 시술하는 일에 취업하는 데에는 현실적인 어려움이 따르므로 보조 실무자로 취업했을 때 수행하게 될 미용 용품 관리, 고객 동선 안내, 고객 물품 보관, 시술 보조 등의 직무를 중심으로 실습하도록 한다.","n":[],"p":524,"b":2},{"c":"[12대인04-03]","k":"선택","sk":"전문 교과(직업·생활)","s":"대인서비스","g":"고등학교 1~3학년","d":"미용 서비스 실무","t":"안전하고 위생적인 손톱 관리 도구 관리 방법과 손톱 관리 서비스 보조 실무 절차를 익혀 실무를 실습한다.","m":"이 성취기준은 손톱 관리 시술 과정을 이해하여 신체에 직접적으로 사용하는 도구와 제품들을 관리하고 실제 시술하는 전문가를 보조함으로써 서비스의 질을 향상할 능력을 기르게 하고자 설정하였다. 손톱 관리 도구 소독, 고객별 도구 관리, 시술 전후 보조 실무, 제품 관리 등의 내용을 포함한다. 날카로운 도구와 화학적 성분을 포함한 제품을 다루어야 하므로 안전에 유의하고 공용으로 사용하는 도구를 철저히 소독하여 감염을 예방하는 데 주안점을 둔다.","n":[],"p":524,"b":2},{"c":"[12대인04-04]","k":"선택","sk":"전문 교과(직업·생활)","s":"대인서비스","g":"고등학교 1~3학년","d":"미용 서비스 실무","t":"아름다움에 대한 개성을 존중하는 태도로 미용 서비스 품질 개선을 위한 고객 정보 데이터 관리 절차를 익혀 실무를 실습한다.","m":"이 성취기준은 미용 서비스 이력을 관리함으로써 시스템의 효율성을 높여 더나은 서비스를 제공하게 하고자 설정하였다. 만족도 높은 서비스를 제공하려면 고객이 지닌 미에 대한 가치와 기준을 고려하는 것이 기본이므로 아름다움에 대하여 고객의 개성을 존중하는 태도가 필요함을 인식하도록 지도하는 데 중점을 둔다. 또한 고객 관리 프로그램을 통한 예약 시스템, 서비스 이력 입력과 조회, 고객 기호 분석에 관한 내용을 다룬다. 프로그램을 완벽하게 숙지하기 어렵더라도 자주 사용되는 프로그램의 기본 기능을 익혀 이력 관리 기록에 대한 기초 작업 능력을 신장하는 데 주안점을 둔다.","n":[],"p":524,"b":2},{"c":"[12외식01-01]","k":"선택","sk":"전문 교과(직업·생활)","s":"외식서비스","g":"고등학교 1~3학년","d":"외식서비스의 이해","t":"외식 산업의 개념과 특성을 알고 관련 직종의 필요성을 파악한다.","m":"","n":[],"p":535,"b":2},{"c":"[12외식01-02]","k":"선택","sk":"전문 교과(직업·생활)","s":"외식서비스","g":"고등학교 1~3학년","d":"외식서비스의 이해","t":"외식 산업의 동향을 알아보고 미래 사회의 변화가 외식 분야에 미치는 영향을 조사한다.","m":"디지털 기기 사용으로 확대되는 비대면 외식서비스의 동향을 탐색하고자 설정하였다. 외식서비스의 동향 조사하기, 무인 안내기, 디지털 기기로 주문 방법 알기, 스마트 스토어 방문하기 등을 다룬다. 빠르게 변화하고 있는 외식서비스 트렌드 변화와 다양성 파악에 중점을 둔다.","n":[],"p":535,"b":2},{"c":"[12외식01-03]","k":"선택","sk":"전문 교과(직업·생활)","s":"외식서비스","g":"고등학교 1~3학년","d":"외식서비스의 이해","t":"외식 산업의 변화에 따른 외식서비스의 직종을 탐색한다.","m":"","n":[],"p":535,"b":2},{"c":"[12외식01-04]","k":"선택","sk":"전문 교과(직업·생활)","s":"외식서비스","g":"고등학교 1~3학년","d":"외식서비스의 이해","t":"외식서비스의 고객 응대 예절을 알아보고, 관련 직업 윤리의 필요성을 이해한다.","m":"외식서비스 종사자로서 직업 윤리에 관한 내용으로 직업인이 갖춰야 할 태도와 자세를 익히게 하고자 설정하였다. 고객 유형, 메뉴 제공, 고객 응대, 위기 상황, 비대면 예약 등 다양한 상황에 맞게 적용되는 고객을 위한 서비스 제공 태도 함양에 중점을 둔다.","n":[],"p":535,"b":2},{"c":"[12외식02-01]","k":"선택","sk":"전문 교과(직업·생활)","s":"외식서비스","g":"고등학교 1~3학년","d":"영업장 실무","t":"영업장에서 상황별 응대 서비스를 알고 예약 처리 방법을 익힌다.","m":"영업장 실무 종사자로서 상황별 응대 서비스를 익히고, 다양한 상황에서 예약 업무를 처리하는 능력을 기르게 하고자 설정하였다. 전화 예약 접수하기, 방문 예약 접수하기, 온라인 예약 접수하기 등을 다룬다. 영업장에 방문하는 고객을 맞이하고 환송하는 서비스 실습에 주안점을 둔다.","n":[],"p":536,"b":2},{"c":"[12외식02-02]","k":"선택","sk":"전문 교과(직업·생활)","s":"외식서비스","g":"고등학교 1~3학년","d":"영업장 실무","t":"기물과 비품의 종류와 취급 요령을 알고 안전하게 다루는 방법을 익힌다.","m":"","n":[],"p":536,"b":2},{"c":"[12외식02-03]","k":"선택","sk":"전문 교과(직업·생활)","s":"외식서비스","g":"고등학교 1~3학년","d":"영업장 실무","t":"대면⋅비대면 상황의 고객 주문 사항을 확인하고 기록하는 방법을 익힌다.","m":"영업장에서 고객의 주문을 받고 식음료를 제공하는 서비스를 실습하는 데 목적이 있다. 메뉴판 제공하기, 디지털 기기 메뉴판 제공하기, 무인 안내기 이용 고객 도와주기, 순서에 맞게 식음료 제공하기 등을 다룬다. 대면⋅비대면 상황의 다양한 예약 처리 과정과 식음료 서비스 절차와 관련된 실습에 주안점을 둔다.","n":[],"p":536,"b":2},{"c":"[12외식02-04]","k":"선택","sk":"전문 교과(직업·생활)","s":"외식서비스","g":"고등학교 1~3학년","d":"영업장 실무","t":"영업장에서 기물과 비품 보관의 중요성을 이해하고 안전하게 보관한다.","m":"","n":[],"p":536,"b":2},{"c":"[12외식02-05]","k":"선택","sk":"전문 교과(직업·생활)","s":"외식서비스","g":"고등학교 1~3학년","d":"영업장 실무","t":"테이블 세팅, 영업장 위생과 안전 관리 방법을 알고 기본적인 매뉴얼을 실습한다.","m":"","n":[],"p":536,"b":2},{"c":"[12외식02-06]","k":"선택","sk":"전문 교과(직업·생활)","s":"외식서비스","g":"고등학교 1~3학년","d":"영업장 실무","t":"고객 응대에 어울리는 용모와 태도를 이해하고 알맞은 화법으로 고객을 대한다.","m":"","n":[],"p":536,"b":2},{"c":"[12외식03-01]","k":"선택","sk":"전문 교과(직업·생활)","s":"외식서비스","g":"고등학교 1~3학년","d":"주방 실무","t":"주방의 종류와 특징을 알아보고, 주방 환경을 탐색한다.","m":"","n":[],"p":537,"b":2},{"c":"[12외식03-02]","k":"선택","sk":"전문 교과(직업·생활)","s":"외식서비스","g":"고등학교 1~3학년","d":"주방 실무","t":"주방 인력의 직책에 따른 직무 내용을 파악하고 역할을 수행한다.","m":"","n":[],"p":537,"b":2},{"c":"[12외식03-03]","k":"선택","sk":"전문 교과(직업·생활)","s":"외식서비스","g":"고등학교 1~3학년","d":"주방 실무","t":"주방별 기기와 기구의 사용법을 파악하여 안전하게 실습한다.","m":"","n":[],"p":537,"b":2},{"c":"[12외식03-04]","k":"선택","sk":"전문 교과(직업·생활)","s":"외식서비스","g":"고등학교 1~3학년","d":"주방 실무","t":"위생 관리 기준을 이해하고 식재료의 전처리, 세척, 보관, 저장 등을 위생적으로 관리한다.","m":"","n":[],"p":537,"b":2},{"c":"[12외식03-05]","k":"선택","sk":"전문 교과(직업·생활)","s":"외식서비스","g":"고등학교 1~3학년","d":"주방 실무","t":"주방에서 안전 수칙과 안전사고별 응급처치 방법을 알아보고 상황별 대처 능력을기른다.","m":"감염병과 위생⋅안전에 대한 고객의 관심도가 증가함에 따라 주방 위생 관리의 중요성을 인식하고 식재료와 주방 기기를 청결하게 관리하는 방법을 실습하고자 설정하였다. 주방 기기의 세척, 살균, 방제 작업과 관리 외 식품 위생법의 기준을 준수하는 태도와 교차 오염, 법규 위반 식품의 처리 등에 대한 책임 있는 태도 등을 다룬다. 안전사고 예방을 위한 다양한 모의 활동과 역할 놀이 등의 실습으로 안전 수칙을 기르도록 한다.","n":[],"p":537,"b":2},{"c":"[12외식04-01]","k":"선택","sk":"전문 교과(직업·생활)","s":"외식서비스","g":"고등학교 1~3학년","d":"식사 서비스","t":"한식, 양식, 중식, 일식의 종류를 알아보고 음식별 특징을 조사한다.","m":"","n":[],"p":538,"b":2},{"c":"[12외식04-02]","k":"선택","sk":"전문 교과(직업·생활)","s":"외식서비스","g":"고등학교 1~3학년","d":"식사 서비스","t":"음식별 조리 방법과 유의점을 알고 음식에 따라 알맞은 상차림 실습을 한다.","m":"여러 가지 음식 종류에 알맞은 식사 서비스를 제공하는 능력을 함양하게 하고자 설정하였다. 음식 종류별 메뉴, 식사 순서, 식사 예절, 서비스 방법이 다르므로 음식 종류에 따른 메뉴의 이름과 특징, 간단한 조리법을 익히고, 상차림 하는 방법을 익히도록 한다.","n":[],"p":538,"b":2},{"c":"[12외식04-03]","k":"선택","sk":"전문 교과(직업·생활)","s":"외식서비스","g":"고등학교 1~3학년","d":"식사 서비스","t":"음식별 테이블 세팅과 식사 순서를 알아보고 알맞게 음식을 제공한다.","m":"","n":[],"p":538,"b":2},{"c":"[12외식04-04]","k":"선택","sk":"전문 교과(직업·생활)","s":"외식서비스","g":"고등학교 1~3학년","d":"식사 서비스","t":"주요리 외 코스 요리, 후식 등의 음식 메뉴의 제공 절차를 알고 서비스 방법을 익힌다.","m":"","n":[],"p":538,"b":2},{"c":"[12외식04-05]","k":"선택","sk":"전문 교과(직업·생활)","s":"외식서비스","g":"고등학교 1~3학년","d":"식사 서비스","t":"음식을 담은 용기별 종류와 특징을 알고 안전하고 위생적으로 관리한다.","m":"","n":[],"p":538,"b":2},{"c":"[12외식04-06]","k":"선택","sk":"전문 교과(직업·생활)","s":"외식서비스","g":"고등학교 1~3학년","d":"식사 서비스","t":"대면⋅비대면 상황에 맞는 음식을 제공하고 관련 시스템을 익힌다.","m":"고객에게 제공되는 대면⋅비대면 서비스 상황, 메뉴 품질, 음식점 환경 등이최적화되어 있는지를 파악하는 역량을 기르게 하고자 설정하였다. 음식점의 차별화된 마케팅 전략, 서비스 제공을 위한 정보 수집과 함께 비대면 서비스의 각 내용이 적용된 플랫폼, 네트워크, 디바이스 기술을 선택하고 활용하는 능력 함양에 중점을 둔다.","n":[],"p":538,"b":2},{"c":"[12외식04-07]","k":"선택","sk":"전문 교과(직업·생활)","s":"외식서비스","g":"고등학교 1~3학년","d":"식사 서비스","t":"한식, 양식, 중식, 일식의 종류별 식사 예절과 서비스 제공 태도의 중요성을 알아보고 올바른 실무 능력을 기른다.","m":"","n":[],"p":538,"b":2},{"c":"[12외식04-08]","k":"선택","sk":"전문 교과(직업·생활)","s":"외식서비스","g":"고등학교 1~3학년","d":"식사 서비스","t":"패스트푸드, 레스토랑, 도시락 등을 취급하는 음식 업체별 고객 응대 태도를 알아보고 올바른 실무 능력을 기른다.","m":"한식, 양식, 중식, 일식 외에도 패스트푸드점과 기타 음식 판매 업체의 고객 응대 태도를 기르게 하고자 설정하였다. 이러한 업체에 따른 기본 서비스 매뉴얼 등을 익히는 것에 중점을 둔다.","n":[],"p":538,"b":2},{"c":"[12외식05-01]","k":"선택","sk":"전문 교과(직업·생활)","s":"외식서비스","g":"고등학교 1~3학년","d":"음료 서비스","t":"음료와 디저트의 종류, 특징을 알아보고 관련 서비스 제공 실무 능력을 탐색한다.","m":"","n":[],"p":540,"b":2},{"c":"[12외식05-02]","k":"선택","sk":"전문 교과(직업·생활)","s":"외식서비스","g":"고등학교 1~3학년","d":"음료 서비스","t":"음료와 과자와 빵 등의 디저트 제조에 필요한 재료를 취급, 보관하는등의 관리 방법을 알아보고 실무 실습을 한다.","m":"","n":[],"p":540,"b":2},{"c":"[12외식05-03]","k":"선택","sk":"전문 교과(직업·생활)","s":"외식서비스","g":"고등학교 1~3학년","d":"음료 서비스","t":"음료와 과자와 빵 등의 디저트 메뉴를 알아보고 안전하고 위생적으로관리하는 태도를 기른다.","m":"","n":[],"p":540,"b":2},{"c":"[12외식05-04]","k":"선택","sk":"전문 교과(직업·생활)","s":"외식서비스","g":"고등학교 1~3학년","d":"음료 서비스","t":"커피 추출 도구와 기기, 음료와 과자, 빵 등의 디저트 제조 도구 취급 및 관리 방법을 알아보고 실습한다.","m":"","n":[],"p":540,"b":2},{"c":"[12외식05-05]","k":"선택","sk":"전문 교과(직업·생활)","s":"외식서비스","g":"고등학교 1~3학년","d":"음료 서비스","t":"대면⋅비대면별 음료와 디저트 제공 방법을 익히고 관련 시스템을 관리하는 방법과 태도를 기른다.","m":"","n":[],"p":540,"b":2},{"c":"[12외식05-06]","k":"선택","sk":"전문 교과(직업·생활)","s":"외식서비스","g":"고등학교 1~3학년","d":"음료 서비스","t":"음료와 디저트 종류별 서비스 제공 방법을 알아보고 관련 서비스 실무 능력과 태도를 기른다.","m":"음료와 디저트를 대면⋅비대면의 상황에서 제공하는 방법을 익히게 하고자 설정하였다. 서비스 제공 시스템을 바탕으로 서비스 각 요소의 기술이 적용된 플랫폼, 네트워크, 디바이스 기술을 익히고 활용하는 능력 함양에 중점을 둔다.","n":[],"p":540,"b":2},{"c":"[12외식05-07]","k":"선택","sk":"전문 교과(직업·생활)","s":"외식서비스","g":"고등학교 1~3학년","d":"음료 서비스","t":"음료와 디저트 메뉴별 알맞은 고객 응대 방법을 익히고 적절한 고객 서비스를 제공한다.","m":"고객을 맞이하여 고객의 필요에 따른 음료 서비스를 제공하고 고객 만족도를향상하게 하고자 설정하였다. 다양한 음료, 디저트의 종류에 따라 고객을 응대하는 내용을 다룬다. 음료 서비스 제공을 위한 테이블 세팅, 음료와 디저트 재료 준비하기, 영업장 점검하기, 음료와 디저트 추천과 주문 받기, 고객 기호와 불편 사항 처리하기 등의 직무 능력을 기르도록 한다.","n":[],"p":540,"b":2},{"c":"[12직실01-01]","k":"선택","sk":"전문 교과(직업·생활)","s":"직업현장실습","g":"고등학교 1~3학년","d":"현장 실습의 이해","t":"현장 실습의 개념과 필요성, 절차를 이해한다.","m":"현장 실습의 개념과 필요성을 인식하도록 하려고 설정하였다. 현장 실습 절차를 다양한 사례로 제시하여 현장 실습 동기를 부여하고, 현장 실습의 과정에 적절히 참여하도록 하는 데 중점을 둔다. 다양한 교내외 현장 실습 자료를 제공하여 학생이 현장 실습을사전에 경험해 보도록 한다.","n":[],"p":550,"b":2},{"c":"[12직실01-02]","k":"선택","sk":"전문 교과(직업·생활)","s":"직업현장실습","g":"고등학교 1~3학년","d":"현장 실습의 이해","t":"근로 중심 현장 실습과 학습 중심 현장 실습의 공통점과 차이점을 파악하여 현장 실습지를 탐색한다.","m":"학생의 취업 역량 강화와 현장 적응력 향상을 위한 학습 중심 현장 실습 과정을 이해하는 것에 중점을 두어 설정하였다. 학습 중심 현장 실습은 현장 실습 유형, 운영 기간, 운영 형태, 현장 실습 계약과 수당, 관련 법령 등에 대한 이해를 바탕으로 학생이 원하는 현장 실습지를 탐색하게 하는 데 주안점을 둔다.","n":[],"p":550,"b":2},{"c":"[12직실01-03]","k":"선택","sk":"전문 교과(직업·생활)","s":"직업현장실습","g":"고등학교 1~3학년","d":"현장 실습의 이해","t":"현장 실습의 직종별 직무를 파악하고 나에게 적합한 현장 실습을 준비한다.","m":"현장 실습이 이루어지는 대표 직종별 직무 기능을 파악하고 자신에게 적합한현장 실습지를 준비하도록 하려고 설정하였다. 포장⋅조립, 세탁, 임가공, 대인서비스, 외식서비스와 같은 다양한 직종에서 요구되는 직무기능을 파악해 자신의 능력과 선호에 따라 실습지를 선택하도록 하는 데 주안점을 둔다. 국가직무능력표준, 한국장애인고용공단 등에서 제시하는 주요 직종과 직무를 다양한 매체를 활용하여 탐색해 보는 기회를 제공한다.","n":[],"p":550,"b":2},{"c":"[12직실01-04]","k":"선택","sk":"전문 교과(직업·생활)","s":"직업현장실습","g":"고등학교 1~3학년","d":"현장 실습의 이해","t":"지역 내 현장 실습 지원 기관을 탐색하여 직종과 직무에 따른 요구를 파악한다.","m":"학생이 직업인으로 생활할 지역 내 현장 실습 지원 기관을 탐색하여 직종이나 직무에 요구되는 직업관을 스스로 확인하고 함양하도록 하려고 설정하였다. 지역 내 현장 실습 지원 기관에서 제공하는 정보를 바탕으로 직종별 이해도를 높이고 요구되는 태도나 직업의식을 포함한 올바른 직업관을 함양하도록 하는 데 주안점을 둔다. 한국 표준 직업 분류 체계를 활용하여 다양한 분야의 직업군을 살펴보도록 하고, 구체적인 예시도 함께 제공한다.","n":[],"p":550,"b":2},{"c":"[12직실01-05]","k":"선택","sk":"전문 교과(직업·생활)","s":"직업현장실습","g":"고등학교 1~3학년","d":"현장 실습의 이해","t":"현장 실습 과정의 중요성을 인식하고 예비 직업인으로서 올바른 태도와 가치관을 가진다.","m":"","n":[],"p":550,"b":2},{"c":"[12직실02-01]","k":"선택","sk":"전문 교과(직업·생활)","s":"직업현장실습","g":"고등학교 1~3학년","d":"현장 실습 준비","t":"흥미와 적성, 개인적 요건을 바탕으로 현장 실습지를 탐색한다.","m":"현장 실습지를 고를 때, 고려할 수 있는 개인적 요인을 이해하도록 하려고 설정하였다. 흥미, 취미, 특기, 적성, 학업 수준, 신체적 특징 등을 바탕으로 학생에게 적합한실습지를 탐색하게 하는 데 주안점을 둔다. 자신의 개인적 요인을 검목표, 자기진술, 면담 등의 방법으로 파악하고 현장 실습지 선택 시 기초 자료로 활용하게 한다.","n":[],"p":551,"b":2},{"c":"[12직실02-02]","k":"선택","sk":"전문 교과(직업·생활)","s":"직업현장실습","g":"고등학교 1~3학년","d":"현장 실습 준비","t":"근로 조건, 임금, 근로 시간, 4대 보험 등의 근로 보호 내용을 알고, 주도적으로 실습 준비에 참여한다.","m":"근로자로서 권리를 보장받기 위한 근로 조건, 임금, 근로 시간, 4대 보험을 이해하게 하고자 설정하였다. 합법적인 현장 실습을 위해 필수적인 근로 보호와 관련한 법률과 서류를 이해하고 숙지하도록 하는 데 주안점을 둔다. 학생이 실제 현장 실습과 취업 중겪을 수 있는 합법⋅불법 사례를 근로기준법, 산업재해보상보험법, 직업교육훈련 촉진법, 현장실습표준협약서, 근로계약서 등의 내용에서 살펴보도록 한다.","n":[],"p":551,"b":2},{"c":"[12직실02-03]","k":"선택","sk":"전문 교과(직업·생활)","s":"직업현장실습","g":"고등학교 1~3학년","d":"현장 실습 준비","t":"이력서와 자기소개서의 중요성을 알고 형식에 맞게 작성한다.","m":"","n":[],"p":551,"b":2},{"c":"[12직실02-04]","k":"선택","sk":"전문 교과(직업·생활)","s":"직업현장실습","g":"고등학교 1~3학년","d":"현장 실습 준비","t":"실습지에 대한 정보를 수집하고 직무 수행에 필요한 자원을 파악하여 현장 실습을 준비한다.","m":"성공적인 현장 실습을 위해 실습지에 대한 정보를 수집하고 직무 수행에 필요한 자원을 파악하는 데 중점을 둔다. 실습지 위치, 출퇴근 방법, 화장실, 작업실 등 물리적인 환경 구조와 직원 조직 구성, 직무 내용을 사전에 수집하고, 직접 정보 수집, 정보 검색 등의 방법으로 실습지에 대한 정보를 확보하여 직무 수행에 필요한 물적 자원을 파악하는 내용을 다룬다. 다양하고 정확한 정보를 사전에 습득하는 것은 직무 수행 능력을 향상시키고 새로운 환경에 대한 두려움을 감소시켜 학생이 주도적이고 적극적인 자세로 현장 실습에 참여하는 데 도움을 준다.","n":[],"p":551,"b":2},{"c":"[12직실02-05]","k":"선택","sk":"전문 교과(직업·생활)","s":"직업현장실습","g":"고등학교 1~3학년","d":"현장 실습 준비","t":"자기주도적으로 현장 실습 지원 서류를 준비하고 작성한다.","m":"입사 또는 현장 실습 지원에 필요한 서류의 종류와 양식은 업체마다 다를 수 있으므로 이를 준비하는 능력을 기르게 하고자 설정하였다. 여러 업체의 공고문에 첨부된 현장 실습 지원 서류를 조사하고, 지원자 스스로 지원 서류를 작성하고 준비하는 과정에서 취업에 대한 자신감을 갖도록 하는 데 주안점을 둔다.","n":[],"p":551,"b":2},{"c":"[12직실02-06]","k":"선택","sk":"전문 교과(직업·생활)","s":"직업현장실습","g":"고등학교 1~3학년","d":"현장 실습 준비","t":"올바른 면접 복장과 태도를 갖추고 모의 면접과 비대면 면접에 주도적으로 참여한다.","m":"면접은 면접자가 선택한 산업체에 취업을 시도하는 과정의 마무리 단계로 취업을 결정짓는 면접 준비 능력을 기르게 하고자 설정하였다. 실제의 면접과 유사한 환경을조성하여 다양한 면접에 효과적으로 대비하도록 하는 데 중점을 둔다. 대면⋅비대면 등 다양한 면접 상황에서 만날 수 있는 문제에 대비하기 위해 현장 녹화 면접, 현장 화상 면접, 녹화 영상 면접 등 구체적인 면접 실습이 이루어지도록 한다.","n":[],"p":551,"b":2},{"c":"[12직실03-01]","k":"선택","sk":"전문 교과(직업·생활)","s":"직업현장실습","g":"고등학교 1~3학년","d":"현장 실습 수행","t":"실습생으로서 근면, 성실의 의무를 이해하고, 출퇴근 기록기를 바르게 사용한다.","m":"현장 실습 기간 중 실습생으로서 성실하고 근면한 태도를 실천하도록 하는 데 주안점을 둔다. 이를 위해 출퇴근 기록, 업무시간 준수 등 업무 준비 과정과 절차를 익히는 것을 내용에 포함한다. 출퇴근 카드 이용, 지문 인식, 번호 입력, 근거리 통신 입력 등 다양한 출퇴근 기록기 사용법과 지참, 조퇴, 결근 등 특기 사항과 기재 요령 작성법을 익히도록 한다.","n":[],"p":553,"b":2},{"c":"[12직실03-02]","k":"선택","sk":"전문 교과(직업·생활)","s":"직업현장실습","g":"고등학교 1~3학년","d":"현장 실습 수행","t":"현장 실습지의 작업 내용을 사전에 파악하고, 작업 상황에 맞는 작업복을 바르게 착용한다.","m":"","n":[],"p":553,"b":2},{"c":"[12직실03-03]","k":"선택","sk":"전문 교과(직업·생활)","s":"직업현장실습","g":"고등학교 1~3학년","d":"현장 실습 수행","t":"업무 준비 과정과 절차를 익혀 원활한 업무 수행을 준비한다.","m":"","n":[],"p":553,"b":2},{"c":"[12직실03-04]","k":"선택","sk":"전문 교과(직업·생활)","s":"직업현장실습","g":"고등학교 1~3학년","d":"현장 실습 수행","t":"작업 지시의 유형과 내용을 파악하여 올바른 태도로 작업을 수행한다.","m":"","n":[],"p":553,"b":2},{"c":"[12직실03-05]","k":"선택","sk":"전문 교과(직업·생활)","s":"직업현장실습","g":"고등학교 1~3학년","d":"현장 실습 수행","t":"실습지에서 대상과 상황에 적절한 의사소통을 하며 원만한 대인 관계를 형성하고 공동작업 능력을 향상한다.","m":"원만하고 안정된 직업생활을 하는 데 필요한 직장 예절을 알고 실천하도록 하고자 설정하였다. 실습지의 다양한 상황에서 요구되는 의사소통을 능력을 키우고 원만한 대인 관계를 형성하고 유지하는 데 필요한 규범을 익히는 데 주안점을 둔다. 특히, 실습현장에서는 단독으로 일하기보다는 함께 작업하는 경우가 많기 때문에, 공동 작업 중 겪을 수 있는 문제를 사례를 바탕으로 경험해 보는 기회를 제공한다.","n":[],"p":553,"b":2},{"c":"[12직실03-06]","k":"선택","sk":"전문 교과(직업·생활)","s":"직업현장실습","g":"고등학교 1~3학년","d":"현장 실습 수행","t":"자신의 작업 성과를 스스로 점검하고 결과를 활용한다.","m":"","n":[],"p":553,"b":2},{"c":"[12직실03-07]","k":"선택","sk":"전문 교과(직업·생활)","s":"직업현장실습","g":"고등학교 1~3학년","d":"현장 실습 수행","t":"청결한 작업 환경의 중요성을 알고, 작업 재료와 도구를 정리하며 작업장을 깨끗하게 청소한다.","m":"일과를 마무리하면서 작업 환경을 정돈하고 자신이 수행한 작업 성과를 점검하는 능력을 기르게 하고자 설정하였다. 현장 실습 일지는 학생이 수행한 업무 내용과 함께 잘한 점과 부족한 점을 평가하여 현장 실습 능력을 향상시키도록 돕는다. 현장 실습 일지는 매일 객관적으로 작성하게 하고, 작업 성과 등을 스스로 점검하는 기회를 제공한다.","n":[],"p":553,"b":2},{"c":"[12직실03-08]","k":"선택","sk":"전문 교과(직업·생활)","s":"직업현장실습","g":"고등학교 1~3학년","d":"현장 실습 수행","t":"실습 일지를 작성하는 과정에서 업무 수행 능력을 향상한다.","m":"","n":[],"p":553,"b":2},{"c":"[12직실04-01]","k":"선택","sk":"전문 교과(직업·생활)","s":"직업현장실습","g":"고등학교 1~3학년","d":"현장 실습 평가","t":"현장 실습 평가의 필요성을 인식하며 스스로 점검하는 태도를 기른다.","m":"현장 실습 평가는 최적의 직업 선택을 돕는 현장 실습 평가에 대한 긍정적 인식을 함양하게 하고자 설정하였다. 현장 실습 평가로 학생은 직업인으로 자신을 객관적으로 파악하고 자신의 부족한 부분을 보완하면서 현장 실습은 결과가 아니라 과정임을 이해하도록 한다. 현장 실습 평가 방법은 보고서, 자기 평가 등 다양한 방법으로 할 수 있으며 평가 과정에 실습자가 참여하는 기회를 제공한다.","n":[],"p":554,"b":2},{"c":"[12직실04-02]","k":"선택","sk":"전문 교과(직업·생활)","s":"직업현장실습","g":"고등학교 1~3학년","d":"현장 실습 평가","t":"현장 실습 보고서의 내용 요소를 알고, 현장 실습 보고서를 주도적으로 작성한다.","m":"현장 실습 보고서 작성은 학생 스스로 현장 실습을 마치고 자기 능력을 객관적으로 점검하고 부족한 부분의 보완 계획을 세우는 과정이다. 자신이 작성한 내용을 확인하고 수정할 부분을 찾아 보완하면서 현장 실습 보고서를 충실히 작성하는 데 주안점을 둔다. 현장 실습 보고서가 기본 생활, 직업생활 태도, 작업 수행 능력 등 구성 요소에 맞게 작성되었는지 점검하도록 한다.","n":[],"p":554,"b":2},{"c":"[12직실04-03]","k":"선택","sk":"전문 교과(직업·생활)","s":"직업현장실습","g":"고등학교 1~3학년","d":"현장 실습 평가","t":"직업 능력 평가로 단점을 인식하고 보완하며 여러 가지 직업에 관한 정보를 습득하여 자신에게 적합한 직업을 탐색한다.","m":"개인의 직업 능력에 기반한 평가로 현장 실습 현장에서 경험한 직무가 자신의 직업 능력에 적합한지를 파악하게 하고자 설정하였다. 직업 평가로 발견된 단점을 보완하고 다양한 진로 정보를 종합하여 자신에게 적합한 직업을 찾도록 하는 데 주안점을 둔다. 일상생활 기능, 직업 기초 기능, 직무 수행 기능, 사회성 기능 영역 등 다양한 측정 기준을 검목표로 점검해 보도록 한다.","n":[],"p":554,"b":2},{"c":"[12직실04-04]","k":"선택","sk":"전문 교과(직업·생활)","s":"직업현장실습","g":"고등학교 1~3학년","d":"현장 실습 평가","t":"현장 실습의 결과를 바탕으로 자신의 직업 적성을 파악하고 희망 직종과 직무에 관한 정보를 종합하여 합리적인 진로 계획을 수립한다.","m":"","n":[],"p":554,"b":2},{"c":"[12직자01-01]","k":"선택","sk":"전문 교과(직업·생활)","s":"직업과 자립","g":"고등학교 1~3학년","d":"자기 탐색","t":"자신의 기본 정보, 흥미, 적성, 성격, 가치관 등 다양한 특성을 알아보고 자신을 긍정적으로 인식한다.","m":"시각중복장애 학생이 장애 특성을 포함해 자기 자신을 이해하여 자신을 긍정적으로 인식하도록 하고자 설정하였다. 자신의 기본 정보, 흥미, 적성, 성격, 가치관 등을 다루며, 장애 특성을 바탕으로 자신이 좋아하는 것과 잘하는 것을 알고 표현함으로써 자아 존중감을 높이게 한다.","n":[],"p":565,"b":2},{"c":"[12직자01-02]","k":"선택","sk":"전문 교과(직업·생활)","s":"직업과 자립","g":"고등학교 1~3학년","d":"자기 탐색","t":"자신의 감각 정보를 이해하고, 직업생활에 필요한 감각 정보의 활용 방안을 스스로 찾는다.","m":"시각중복장애 학생의 잔존 시력을 최대한 활용하고 시각을 제외한 감각을 활용하여 직업생활에 필요한 정보를 탐색하고 직업생활에 적절히 활용할 수 있는 능력을 기르게 하고자 설정하였다. 시각중복장애 학생의 촉각 경험, 청각 경험, 후각 경험, 미각 경험, 대근육과 소근육 활용, 잔존 시력 활용 등을 다룬다. 학생의 감각 기능의 강점은 강화하고 약점은 보완하도록 지속적으로 감각 기능을 활용하는 경험에 주안점을 둔다.","n":[],"p":565,"b":2},{"c":"[12직자01-03]","k":"선택","sk":"전문 교과(직업·생활)","s":"직업과 자립","g":"고등학교 1~3학년","d":"자기 탐색","t":"다양한 직업 능력 평가를 활용하여 자신의 직업 흥미와 적성, 강점과 약점을 확인한다.","m":"다양한 직업 능력 평가를 활용하여 시각중복장애 학생의 직업 흥미와 적성, 직업적 강점과 약점을 확인하고 자신이 선택하는 진로와 직업에 있어 자신의 직업 능력을 알아보고자 설정하였다. 직업흥미검사, 직업적성검사, 사회 성숙도검사와 같은 표준화 검사와비형식적인 검사 등을 활용하는 방법을 주로 다룬다. 다양한 직업 능력 평가 결과를 활용하여 학생의 현재 수준을 교수⋅학습 설계, 평가, 기록에 반영하여 학생이 자신의 현재 수준을 파악하는 능력을 기르도록 한다.","n":[],"p":565,"b":2},{"c":"[12직자01-04]","k":"선택","sk":"전문 교과(직업·생활)","s":"직업과 자립","g":"고등학교 1~3학년","d":"자기 탐색","t":"다양한 직업 정보를 바탕으로 자신의 특성에 맞는 직업을 탐색한다.","m":"다양한 직업 정보를 바탕으로 시각중복장애 학생이 장애 특성과 직업적 요구에 적합한 직업을 탐색하게 하고자 설정하였다. 직업의 필요성과 의미, 가족의 직업, 학교 안의 직업, 직업 탐색하기 등을 다룬다. 시각중복장애 학생의 장애 특성과 교육적 요구를 반영한 직업 정보를 학생 주변 인물의 직업부터 학생의 선호 분야 직업에 이르기까지 다양한 분야를 이해하도록 한다.","n":[],"p":565,"b":2},{"c":"[12직자01-05]","k":"선택","sk":"전문 교과(직업·생활)","s":"직업과 자립","g":"고등학교 1~3학년","d":"자기 탐색","t":"일과 행복의 의미를 알고 미래의 행복한 삶을 계획한다.","m":"졸업생의 진로 현황 파악, 선배 초청 간담회 등을 실시해 졸업 후의 다양한 진로 정보를 수집하고, 자신이 원하는 미래의 모습을 계획하여 행복한 삶을 준비하게 하고자설정하였다. 졸업 이후에 직업 훈련 기관, 평생 교육 기관, 장애인 복지관 등에서 생활하는 학생 사례를 중심으로 다룬다. 다양한 진로를 알아보며 학생을 둘러싼 지역사회, 가정, 개인 삶의 형태가 다양함을 이해하도록 한다.","n":[],"p":565,"b":2},{"c":"[12직자02-01]","k":"선택","sk":"전문 교과(직업·생활)","s":"직업과 자립","g":"고등학교 1~3학년","d":"직업생활 준비","t":"직업생활에 필요한 일상생활 기술을 이해하고 스스로 수행한다.","m":"직업생활에 필요한 자기 관리 기술 중심의 일상생활 기술을 익힘으로써, 자립적인 직업생활을 준비하게 하고자 설정하였다. 식사, 착탈의, 용변 처리, 신체 청결, 주변 정리, 분리배출, 세탁 등 시각중복장애 학생이 직업생활을 준비할 때 스스로 수행해야 하는 일상생활 기술을 익히도록 한다.","n":[],"p":567,"b":2},{"c":"[12직자02-02]","k":"선택","sk":"전문 교과(직업·생활)","s":"직업과 자립","g":"고등학교 1~3학년","d":"직업생활 준비","t":"직업생활에 필요한 이동 기술을 이해하고 스스로 또는 도움을 받아 이동한다.","m":"직업생활에 필요한 실내외 이동 기술을 익히고, 직업 환경과 지역사회 속에서 스스로 이동하거나 다른 사람에게 도움을 받는 안내 보행을 통해 자립적인 직업생활을 준비하게 하고자 설정하였다. 자기보호법, 흰지팡이 사용법, 안내법, 교통수단 이용 등을 다룬다. 시각중복장애 학생이 실내외에서 독립 보행을 수행하거나 지원 서비스를 이용하여 다른 사람에게 안내 보행을 요청하는 방법을 알고 활용하도록 한다.","n":[],"p":567,"b":2},{"c":"[12직자02-03]","k":"선택","sk":"전문 교과(직업·생활)","s":"직업과 자립","g":"고등학교 1~3학년","d":"직업생활 준비","t":"직업생활에 필요한 대인 관계 기술을 이해하고 다른 사람과 친해진다.","m":"직업생활에 필요한 대상별, 상황별 대인 관계 기술을 이해하고, 직업생활과 지역사회 속에서 다른 사람과 원활하게 친해지고 유지하게 하고자 설정하였다. 소중한 가족, 건강한 학교, 함께 만드는 공동체 사회, 상황에 맞는 행동 등을 다룬다. 시각중복장애 학생이 직업생활에서 대면 가능한 상황별, 대상별 대인 관계 기술을 이해하고 다른 사람과 원만하게 지냄으로써 민주시민의 태도를 갖추게 한다.","n":[],"p":567,"b":2},{"c":"[12직자02-04]","k":"선택","sk":"전문 교과(직업·생활)","s":"직업과 자립","g":"고등학교 1~3학년","d":"직업생활 준비","t":"직업생활에 필요한 의사소통 기술을 이해하고 상황에 맞게 협력하며 소통한다.","m":"직업생활에 필요한 의사소통 기술을 이해하고, 직업생활 속에서 타인의 이야기를 경청하거나 질문하여 의사소통할 뿐 아니라, 작업 상황에서 지시를 정확하게 이해하여 수행하고, 지원 서비스를 활용하여 도움을 요청하는 등의 직업생활에 필요한 의사소통 능력을 기르게 하고자 설정하였다. 직업생활에 필요한 의사소통 기술을 기를 수 있도록 경청하기, 질문하기, 지시 따르기, 요청하기 등을 다룬다.","n":[],"p":567,"b":2},{"c":"[12직자02-05]","k":"선택","sk":"전문 교과(직업·생활)","s":"직업과 자립","g":"고등학교 1~3학년","d":"직업생활 준비","t":"작업 환경에서 발생할 수 있는 문제를 인식하고 효율적으로 해결한다.","m":"작업 환경에서 대면할 수 있는 문제 상황에서 문제를 인식하고 효율적으로 해결하는 방법을 이해함으로써 적극적인 직업 태도를 형성하고 문제 해결 능력을 기르게 하고자 설정하였다. 주변 환경 익히기, 생활에서 불편한 점 찾기, 생각 공유하기, 문제 해결하기 등을 다룬다. 작업 환경에서 일어날 수 있는 다양한 문제 상황을 경험해 보고, 문제를 인식하고 해결하는 능력을 기른다.","n":[],"p":567,"b":2},{"c":"[12직자03-01]","k":"선택","sk":"전문 교과(직업·생활)","s":"직업과 자립","g":"고등학교 1~3학년","d":"작업 기술","t":"작업 상황에 맞는 기초 작업 기술을 이해하고 익힌다.","m":"작업에 필요한 기초 기술을 익히고 수행함으로써 시각중복장애 학생이 안정적인 직무 수행 능력을 기르게 하고자 설정하였다. 작업 자세, 작업 안전, 작업 도구, 작업 위생 등의 내용을 다룬다. 시각중복장애 학생이 다양한 기초 작업 기술을 이해하고 수행할 수 있도록 감각 정보를 바탕으로 대⋅소근육 활용 능력을 향상하도록 한다.","n":[],"p":568,"b":2},{"c":"[12직자03-02]","k":"선택","sk":"전문 교과(직업·생활)","s":"직업과 자립","g":"고등학교 1~3학년","d":"작업 기술","t":"서로 다른 부품을 연결하는 직무에 필요한 작업 기초 기술을 익히고, 다양한 작업 상황에 맞는 조립 직무를 수행한다.","m":"서로 다른 부품을 연결하는 작업에 필요한 기본적인 기술과 태도를 익혀 조립 직무를 수행하는 능력을 기르게 하고자 설정하였다. 서로 다른 부품을 사용하여 구별하기, 조이고 풀기, 끼우고 빼기, 공구 사용하기 등을 다룬다. 반복적이고 지속적으로 작업을 수행하며 조립과 관련한 직업 능력을 기르는 데 주안점을 둔다.","n":[],"p":568,"b":2},{"c":"[12직자03-03]","k":"선택","sk":"전문 교과(직업·생활)","s":"직업과 자립","g":"고등학교 1~3학년","d":"작업 기술","t":"도구와 재료를 활용하는 직무에 필요한 작업 기초 기술을 익히고, 다양한 작업 상황에 맞는 포장 직무를 수행한다.","m":"도구와 재료를 활용하는 작업에 필요한 기본적인 기술과 태도를 익혀 포장 직무를 수행하는 능력을 기르게 하고자 설정하였다. 다양한 도구와 재료를 사용하여 분류하기, 붙이기, 자르기, 묶고 풀기 등을 다룬다. 학생의 특성을 기반으로 반복적이고 지속적으로 작업을 수행하며 포장 관련 직업 능력을 기르는 데 중점을 둔다.","n":[],"p":568,"b":2},{"c":"[12직자03-04]","k":"선택","sk":"전문 교과(직업·생활)","s":"직업과 자립","g":"고등학교 1~3학년","d":"작업 기술","t":"물품을 이동하는 직무에 필요한 작업 기초 기술을 익히고, 다양한 작업 상황에 맞는 운반 직무를 수행한다.","m":"물품을 이동하는 작업에 필요한 기본적인 기술과 태도를 익혀 운반 직무를 수행하는 능력을 기르게 하고자 설정하였다. 다양한 크기와 무게의 물품을 사용하여 들기, 쌓기, 나르기, 배달하기, 도구 사용하기 등을 다룬다. 반복적이고 지속적으로 작업을 수행하며 운반과 관련한 직업 능력을 기르도록 한다.","n":[],"p":568,"b":2},{"c":"[12직자03-05]","k":"선택","sk":"전문 교과(직업·생활)","s":"직업과 자립","g":"고등학교 1~3학년","d":"작업 기술","t":"작업 환경과 관련한 직무에 필요한 작업 기초 기술을 익히고, 다양한 작업 상황에 맞는관리 직무를 수행한다.","m":"작업 환경 정리와 관련한 기본적인 기술과 태도를 익혀 관리 직무를 수행하는 능력을 기르게 하고자 설정하였다. 작업 환경 정리와 관리에 필요한 닦기, 쓸기, 복사하기, 파쇄하기, 진열하기 등을 다룬다. 다양한 상황 속에서 반복적이고 지속적으로 작업을 수행하며 관리와 관련한 직업 능력을 향상하도록 한다.","n":[],"p":568,"b":2},{"c":"[12직자03-06]","k":"선택","sk":"전문 교과(직업·생활)","s":"직업과 자립","g":"고등학교 1~3학년","d":"작업 기술","t":"다양한 작업 환경에서 작업의 지속성, 정확성, 신속성을 향상한다.","m":"작업 환경 속에서 시각중복장애 학생이 작업을 반복적으로 수행함으로써 작업의 지속성, 정확성, 신속성을 향상하게 하고자 설정하였다. 작업 능력을 기를 수 있도록 일정한 시간 동안 작업하기, 완성품 검사하기, 주어진 시간에 목표량 달성하기 등을 다룬다. 학생의 수준에 맞게 안전에 유의하여 작업 능력을 향상하도록 한다.","n":[],"p":568,"b":2},{"c":"[12직자03-07]","k":"선택","sk":"전문 교과(직업·생활)","s":"직업과 자립","g":"고등학교 1~3학년","d":"작업 기술","t":"작업장에서 안전하게 작업 규칙을 지키고 바른 자세를 유지한다.","m":"작업장에서 작업 규칙을 지켜 안전사고를 예방하고, 바른 자세로 작업하며 자신감을 기르게 하고자 설정하였다. 바른 자세로 작업하기, 작업장
