.","m":"이 성취기준은 가정, 학교, 지역사회 등의 일상 속 사회적 상황에서 타인의 행동과 감정을 이해하고 공감하는 능력을 함양하기 위해 설정하였다. 다양한 감정 알아보기, 상황에 알맞은 감정과 행동 찾아보기, 다른 사람의 입장 되어보기, 다른 사람이 처한 상황에 적절한 말과 행동 표현하기 등의 내용을 다룬다. 타인을 이해하려는 마음을 갖고 이를 토대로 타인과 상호 작용하는 능력을 기르는 것에 주안점을 둔다.","n":["타인의 행동과 감정에 무관심하거나 예민하게 대응하지 않고 적절한 관심을 두고 반응할 수 있도록 다양한 반응의 예를 시범을 통해 제시한다. 또한 다른 사람의 감정에 공감하여 행동하는 것에 대한 사례를 보여준다."],"p":117,"b":3},{"c":"[9사회03-01]","k":"기본","sk":"","s":"사회","g":"중학교 1~3학년","d":"시민의 삶","t":"우리나라의 자연환경과 인문환경 특징을 파악하고 환경을 소중히 여긴다.","m":"이 성취기준은 우리나라 사람들이 자연환경과 인문환경 속에서 어떻게 살아가고 있는지에 대한 이해를 바탕으로 환경을 소중히 여기는 마음과 이를 실천하는 태도를 기르기 위해 설정하였다. 우리나라 동서남북의 생김새와 특징 확인하기, 농촌·어촌·산지촌의 자연환경 비교하기, 다양한 지역의 자연환경과 인문환경 특징 조사하기, 도시의 환경과 생활 모습 알아보기 등의 내용을 다룬다. 여러 지역의 환경 특성을 살펴보기 위한 답사 활동 등을 통해 환경과 조화를 이루며 살아가는 사람들의 모습에 관심을 가지도록 한다.","n":[],"p":119,"b":3},{"c":"[9사회03-02]","k":"기본","sk":"","s":"사회","g":"중학교 1~3학년","d":"시민의 삶","t":"여러 지역 사람들의 다양한 경제활동 모습을 조사하며 나라의 경제활동에 관심을 가진다.","m":"이 성취기준은 여러 지역의 사람들이 서로 주고받으며 경제활동을 하는 모습을 살펴보고 경제활동의 필요성을 인식하기 위해 설정하였다. 다양한 상품의 원산지 살펴보기, 각 지역의 관광 산업 조사하기, 여러 지역 사람들이 상품과 인적 교류를 통해 상호 의존하는 이유 알아보기 등의 내용을 다룬다. 경제활동이 우리 삶과 밀접한 관련이 있음을 알고 여러 지역이 교류를 통해 상호 의존하는 이유를 설명한다.","n":[],"p":119,"b":3},{"c":"[9사회03-03]","k":"기본","sk":"","s":"사회","g":"중학교 1~3학년","d":"시민의 삶","t":"우리나라의 문화 유적을 살펴보고 우리 역사를 아끼는 마음을 가진다.","m":"이 성취기준은 우리나라 대표 문화 유적의 특징과 가치를 이해하여 우리 문화와 역사를 아끼는 마음을 함양하기 위해 설정하였다. 우리나라 대표 문화 유적 조사하기, 지역의 문화 유적 답사하기, 시대별 대표 문화 유적 살펴보기, 문화 유적을 통한 옛사람들의 생활 모습 조사하기, 문화 유적과 관련된 역사적 사건이나 인물 살펴보기 등의 내용을 다룬다. 문화 유적을 중심으로 역사의 시대적 이해에 대한 기초를 형성하고 우리 역사를 아끼는 마음을 기를 수 있도록 한다.","n":["다른 지역의 문화 유적 관람 등은 [9사회03-04]와 연계한다. 오랜 시간 소장한 학생 혹은 가족의 물건 등을 소개하며 나와 가족의 과거 모습과 물건에 얽힌 이야기를 발표할 수 있다. 이를 통해 문화 유적이 갖는 가치와 의미를 실생활과 연계하여 이해한다. 또한 문화 유적 조사 활동 중 우리나라에 있는 유네스코 세계문화유산을 살펴볼 수 있다. 이 과정에서 세계적으로 보호하는 우리 문화유산의 예술성과 기술성에 대한 자부심을 가질 수 있도록 한다."],"p":119,"b":3},{"c":"[9사회03-04]","k":"기본","sk":"","s":"사회","g":"중학교 1~3학년","d":"시민의 삶","t":"가족, 친구와 함께 여러 가지 문화 활동을 계획하며 참여한다.","m":"이 성취기준은 가족 및 친구와 함께 다양한 문화 활동을 하는 경험을 통하여 여가문화 활동(예: 여행, 관람, 체험)에 적극적으로 참여하고 즐기는 태도를 갖기 위해 설정하였다. 우리 전통이 깃든 문화 활동 체험하기, 가족 및 친구와 함께할 수 있는 문화 활동 알아보기, 우리 지역의 문화 시설 조사하기, 문화 활동 체험 계획하기 등의 내용을 다룬다. 문화 활동 참여를 통해 폭넓은 사회관계 형성의 기회를 얻고 긍정적인 정서를 기르는 데 중점을 둔다.","n":[],"p":119,"b":3},{"c":"[9사회03-05]","k":"기본","sk":"","s":"사회","g":"중학교 1~3학년","d":"시민의 삶","t":"일상에서 민주적 생활 태도를 기르고 실천한다.","m":"이 성취기준은 민주주의의 의미와 중요성을 일상과 연관 지어 파악함으로써 민주주의 가치와 원리를 실천하는 태도를 갖추기 위해 설정하였다. 가정과 학교 속 사례에서 민주적 생활 모습 살펴보기, 민주적 의사 결정 방법 조사하기, 주체적으로 우리 학교와 지역의 문제 해결에 참여하기 등의 내용을 다룬다. 민주주의가 일상에 깊이 자리 잡고 있음을 알고 민주적 생활 태도를 실천하는 능력과 자세를 기르도록 한다.","n":["디지털 공간에서도 민주시민으로서의 공동체 의식, 다른 사람에 대한 존중 등이 필요하다는 것을 알고 올바른 소통 능력과 책임감을 갖는다. 이를 위해 디지털 사회 참여의 사례를 제시하고 다양한 문제 상황(예: 학교폭력, 일상적 혐오 표현)을 해결하는 과정을 통해 디지털 시민성을 함양하도록 지원한다."],"p":119,"b":3},{"c":"[9사회03-06]","k":"기본","sk":"","s":"사회","g":"중학교 1~3학년","d":"시민의 삶","t":"우리 영토를 지켜온 노력을 조사하고 영토와 평화를 소중히 여기는 마음을 가진다.","m":"이 성취기준은 우리 영토의 역사적 특성을 살펴보며 우리 영토의 소중함과 평화 통일의 중요성을 인식하기 위해 설정하였다. 독도의 모습과 역사, 독도를 지켜온 노력 알아보기, 고조선 건국 살펴보기, 우리나라 4대 대첩 조사하기, 6·25 전쟁과 평화 통일의 필요성 알아보기 등의 내용을 다룬다. 우리 영토를 지켜온 조상들의 노력을 알아보며 우리나라에 대한 애정과 평화 통일에 대한 지속적인 관심을 가지도록 한다.","n":["우리나라 영토 수호의 역사적 사건과 관련한 문화유산을 익히기 위해 [9사회03-04]와 연계한다."],"p":119,"b":3},{"c":"[9사회03-07]","k":"기본","sk":"","s":"사회","g":"중학교 1~3학년","d":"시민의 삶","t":"우리 사회가 변화하는 모습을 조사하고 사회 변화에 관심을 가진다.","m":"이 성취기준은 다양한 사회 변화로 달라지는 일상의 모습을 알고, 이로 인해 나타나는 문제와 해결방안에 관심을 두도록 하는 데 목적이 있다. 사회 변화에 따른 생활 모습의 차이 비교하기, 저출산과 고령화로 인한 미래 모습 예측하기, 정보화 및 세계화의 긍정적, 부정적인 영향 알아보기, 인공지능의 발달로 편리해진 생활 모습 살펴보기 등의 내용을 다룬다. 일상 속에서 사회 변화 모습을 발견하고, 사회 변화에 적응하며 대응하려는 태도를 함양하도록 지원한다.","n":["빠르게 변화하는 사회 속에서 형성된 문화가 가져오는 긍정적인 효과 또는 사회적 문제를 각종 자료를 활용하여 조사하거나 비교한다. 또한 다양한 사회 문제에 대한 관심을 통해 문화에 대한 편견이나 차별적 관점을 해소하고 다른 문화를 존중하는 태도를 가질 수 있도록 한다."],"p":119,"b":3},{"c":"[12사회01-01]","k":"기본","sk":"","s":"사회","g":"고등학교 1~3학년","d":"나의 삶","t":"자신의 소중함과 가치를 발견하여 자신을 긍정적으로 인식한다.","m":"이 성취기준은 나에 대한 이해를 바탕으로 긍정적인 자아 개념을 형성하여 자신이 소중하고 가치 있는 존재임을 인식하기 위해 설정하였다. 타인의 다양한 가치를 존중하는 표현하기, 나의 소중함과 가치를 발견하는 칭찬 일기 쓰기, 자기 발전을 위한 실천하기 등의 내용을 다룬다. 자신의 존재를 별도의 조건 없이 긍정적으로 인식하는 데 중점을 두며 이를 통해 자기 발전을 위한 다양한 노력을 실천할 수 있도록 한다.","n":[],"p":122,"b":3},{"c":"[12사회01-02]","k":"기본","sk":"","s":"사회","g":"고등학교 1~3학년","d":"나의 삶","t":"자신의 요구와 권리를 상황에 맞게 표현하며 자기 결정을 생활화한다.","m":"이 성취기준은 요구, 신념, 권리에 대한 이해를 바탕으로 자기 생각에 따라 스스로 삶을 결정하고 권리를 주장하는 주체적인 시민을 기르기 위해 설정하였다. 나의 요구와 권리 주장하기, 권리를 지키는 표현과 태도 연습하기, 나에 대해 스스로 결정하기 등의 내용을 다룬다. 자신의 문제를 스스로 결정하는 태도를 생활화하여 자신의 권리를 옹호하도록 하는 데 중점을 둔다.","n":["자신의 의사를 스스로 표현하거나 선택하기가 어려운 경우 ‘지원적 의사 결정’을 적용하여 자신의 문제에 대해 의사를 표현하고 스스로 결정하는 경험을 반복적으로 하도록 한다. 장애를 이유로 행위능력을 제한하지 않고 필요한 의사 결정을 지원해야 한다는 관점에서(유엔 장애인권리협약 12조) 학생 또한 일상의 여러 가지 의사 결정을 위해 적절한 지원을 활용하는 것은 중요한 권리이다. 따라서 이를 포함하여 장애인을 위한 여러 가지 권리 행사를 [12사회03-05], [12사회03-06]과 연계하여 지도한다."],"p":122,"b":3},{"c":"[12사회02-01]","k":"기본","sk":"","s":"사회","g":"고등학교 1~3학년","d":"관계의 삶","t":"정직하고 성실하게 살아가는 태도를 실천한다.","m":"이 성취기준은 자신의 역할을 정직하고 성실하게 수행하는 것의 의미와 중요성을 알고 다양한 상황에서 올바른 행동을 선택하여 이를 실천하기 위해 설정하였다. 정직하고 성실한 삶의 모습 찾기, 모범 사례와 인물 탐구하기, 정직하고 성실한 삶의 약속 실천하기에 관한 내용을 다룬다. 삶에 필요한 모범적 가치를 익혀 습관화하는 데 중점을 둔다.","n":[],"p":123,"b":3},{"c":"[12사회02-02]","k":"기본","sk":"","s":"사회","g":"고등학교 1~3학년","d":"관계의 삶","t":"다른 사람을 존중하고 배려하며 생명을 소중히 여긴다.","m":"이 성취기준은 주변 사람들과 더불어 살아가는 데 필요한 배려와 존중, 생명을 소중히 여기는 태도를 기르기 위해 설정하였다. 생활 속 존중과 배려의 모습 찾기, 생활 속 작은 나눔 실천하기, 동물 학대 예방을 위한 생명 존중 캠페인 하기 등의 내용을 다룬다. 인간과 동·식물의 생명은 그 자체로 가치가 있는 소중한 존재임을 이해하여 생명이 있는 모든 존재를 존중하고 배려하는 생활 태도를 형성하는 데 중점을 둔다.","n":[],"p":123,"b":3},{"c":"[12사회02-03]","k":"기본","sk":"","s":"사회","g":"고등학교 1~3학년","d":"관계의 삶","t":"다양한 사회적 관계유형에 따른 역할 행동을 일상에서 실천한다.","m":"이 성취기준은 삶의 맥락에서 만나는 다양한 사람들과 긍정적인 관계를 형성하고 유지하는 데 필요한 사회적 역할 행동을 생활 속에서 실천하기 위해 설정하였다. 친구, 직장, 동호회 등 다양한 사회적 관계 조사하기, 상황에 따른 적절한 역할 행동 실천하기, 다양한 사회적 역할 체험하기, 사회 관계망 서비스(SNS)나 온라인 게임 등에서 적절한 역할 행동 실천하기 등의 내용을 다룬다. 다양한 사회적 역할의 경험을 통해 기대되는 사회적 역할 행동을 일상의 다양한 맥락으로 일반화하는 데 중점을 둔다.","n":["온라인 공간(예: 사회 관계망 서비스(SNS), 온라인 게임)에서도 사회적 관계를 형성할 수 있음을 다룬다. 유해 사이트 접속이나 바람직하지 않은 사회적 관계 형성 및 상호 작용에 유의하도록 지도한다."],"p":123,"b":3},{"c":"[12사회02-04]","k":"기본","sk":"","s":"사회","g":"고등학교 1~3학년","d":"관계의 삶","t":"사회적 관계에서의 갈등 상황을 분석하고 서로의 입장을 존중한다.","m":"이 성취기준은 다양한 사회적 관계에서 일어날 수 있는 갈등 상황의 대처 경험을 통해 갈등을 평화롭게 해결하는 방법을 내면화하는 데 목적이 있다. 온라인 공간에서 발생할 수 있는 갈등 상황 조사하기, 갈등을 해결하는 올바른 대화하기, 서로 존중하기 위한 교실 내 규칙 토의하기 등의 내용을 다룬다. 다양한 갈등 상황에서의 대처 방법을 자유롭게 선택하고 이에 따른 결과를 검토하는 활동을 통해 타인에 대한 존중을 일상에서 실천할 수 있도록 하는 데 중점을 둔다.","n":["다양한 갈등 상황에서 다른 사람의 생각이나 의도 등과 같은 마음 상태를 추론하기 어려운 경우에는 사진이나 그림을 보고 표정 인식하기, 상황을 살펴보고 이에 따라 유발되는 정서 인식하기 등의 활동을 충분히 경험하여 다른 사람과의 관계 형성을 위한 기초를 형성하도록 한다."],"p":123,"b":3},{"c":"[12사회03-01]","k":"기본","sk":"","s":"사회","g":"고등학교 1~3학년","d":"시민의 삶","t":"세계 곳곳의 사람들이 환경과 조화를 이루며 살아가는 모습을 파악하고 일상에서 환경친화적 생활 태도를 실천한다.","m":"이 성취기준은 환경에서 일어나는 다양한 문제가 나의 삶에 영향을 미친다는 것을 이해하여 지구 생태계 내에서 조화로운 삶을 살아가기 위한 역량을 갖추는 것을 목적으로 한다. 또한 세계의 다양하고 아름다운 지리의 모습을 우리 삶의 다양한 주제를 중심으로 소개하여 학생들이 자연스럽게 세계의 지리적 특성과 소중함을 이해할 수 있도록 한다. 우리나라 및 세계 여러 나라의 지리적 특징 살펴보기, 지구 곳곳의 다양한 세계 지리 탐색하기, 자연환경과 조화를 이루며 살아가는 모습 조사하기, 기후변화와 환경 위기의 사례 조사하기, 생태환경을 지키기 위한 사람들의 노력 조사하기 등의 내용을 다룬다. 과학과나 창의적 체험활동 등과 연계한 생태체험 활동, 학교 숲 체험, 천연제품 만들기, 친환경 에너지 체험 등을 다양하게 계획하여 환경친화적 생활 태도를 실천할 수 있도록 한다.","n":["인간이 환경과 조화를 이루며 공존하는 삶의 중요성에 대해 이해할 수 있도록 기후변화의 위험성과 환경문제 등에 관해 다양한 사례를 제시하고, 이와 같은 기후 변화를 막기 위해 학교 및 가정에서 내가 할 수 있는 일을 찾아 실천한다. 내가 실천하는 작은 일들이 모여 지속가능한 환경을 만들 수 있고 이는 인간의 삶의 질과 관계되는 중요한 일임을 인식하는 데 중점을 두어 생태전환 교육을 시행한다. 전 지구적 기후위기를 함께 대응해 나가는 세계시민으로서의 모습을 갖추기 위해 [12사회03-08]과 연계한다."],"p":125,"b":3},{"c":"[12사회03-02]","k":"기본","sk":"","s":"사회","g":"고등학교 1~3학년","d":"시민의 삶","t":"사람들의 다양한 경제활동 모습을 분석하며 경제생활 주체로서의 삶의 태도를 지닌다.","m":"이 성취기준은 일상생활 속 경제활동 모습을 탐색하여 직업인으로서 생산 활동을 이해하고 소비자로서 합리적 선택과 소비 능력을 함양하여 경제생활의 주체로 사는 삶을 준비하기 위해 설정하였다. 무역을 통해 다른 나라와 사고파는 물건 조사하기, 나의 미래 경제생활 계획하기, 필요한 물건 합리적으로 선택하고 소비하기 등의 내용을 다룬다. 일상생활에서 친숙하게 접근할 수 있는 경제활동 사례와 실습 기회를 제공하여 자신의 경제활동을 스스로 계획할 수 있도록 지원한다.","n":[],"p":125,"b":3},{"c":"[12사회03-03]","k":"기본","sk":"","s":"사회","g":"고등학교 1~3학년","d":"시민의 삶","t":"우리나라의 문화유산을 조사하고 우리 역사에 자부심을 느낀다.","m":"이 성취기준은 우리나라 각 시대를 살았던 다양한 사람들의 이야기와 그들의 삶을 엿볼 수 있는 문화유산을 중심으로 우리 역사에 관한 관심을 높이고, 우리나라에 대한 자긍심을 높이기 위해 설정하였다. 고조선부터 현대까지의 대표적 문화유산 조사하기, 아름다운 문화유산 체험하기(예: 도자기 만들기, 탈춤 추기), 무형문화유산으로서의 음식 문화 조사하기, 증강현실(AR)로 과학 유산 살펴보기 등을 내용으로 다룬다. 시대별 흐름에 기반을 둔 연대기적 접근보다는 학생의 흥미나 우리 생활과 관련된 주제 사적 접근을 고려하여 학생들이 친숙하게 역사에 다가갈 수 있도록 하는 데 주안점을 둔다.","n":["역사적 상황이나 맥락, 인물의 생각 등을 다차원적으로 이해하고 역사적 상상력을 극대화할 수 있도록 옛 시대를 살았던 인물이 직접 되어보는 추체험 학습을 활용할 수 있다. 감정 이입을 통해 당시를 살았던 조상의 삶에 대해 친숙하게 느끼도록 하며 이를 통해 역사적 사실과 개념도 함께 이해하도록 한다. 문화유산과 역사 이야기를 흥미롭게 이해하도록 다양한 사진, 그림, 멀티미디어, 가상현실(VR) 등의 시청각 자료를 활용하고 지역의 유적지나 역사박물관을 직접 방문하여 학생들이 당시 생활 모습을 상상하게 한다."],"p":125,"b":3},{"c":"[12사회03-04]","k":"기본","sk":"","s":"사회","g":"고등학교 1~3학년","d":"시민의 삶","t":"여러 사람과 다양한 문화 활동을 하며 문화적 소양을 기른다.","m":"이 성취기준은 여러 사람(예: 가족, 친구, 이웃, 종교단체, 동호회, 직장 동료)과 함께하는 다양한 문화 활동을 통해 삶의 질을 향상하며 시민으로서 필요한 문화적 소양을 기르기 위해 설정하였다. 스포츠 경기 관람하기, 국내 여행 계획 세우기, 지역의 문화 시설 조사하기, 가상현실(VR) 기기로 산악 등반 체험하기, 문화공연 및 행사 참여하기 등의 내용을 다룬다. 실제 지역사회에서 할 수 있는 문화 활동을 조사하거나 체험하여 여러 사람과 관계를 맺으며 문화 활동에 참여하는 것이 삶의 질을 높이는 방법임을 이해하도록 한다.","n":["온라인 미술관, 가상현실(VR) 박물관, 온라인 공연, 가상현실(VR)·증강현실(AR)을 활용한 체육 활동 등 비대면을 기반으로 한 다양한 문화 활동을 소개하여 공간의 제약을 넘어 많은 사람과 소통하며 문화적 소양을 기르도록 지원한다."],"p":125,"b":3},{"c":"[12사회03-05]","k":"기본","sk":"","s":"사회","g":"고등학교 1~3학년","d":"시민의 삶","t":"일상에서 사회 규범을 지키며 인권 존중을 실천한다.","m":"이 성취기준은 일상의 다양한 사회 규범을 지키고 다른 사람의 인권을 존중하는 태도를 함양하여 학교 및 지역사회와 같은 공동체에서 함께 살아가도록 하는 데 목적이 있다. 내가 지켜야 할 사회 규범(예: 관습, 종교, 도덕, 법) 알아보기, 인권의 의미와 특성 알아보기, 청소년의 인권 살펴보기, 소수자에 대한 차별이나 혐오 표현 조사하기, 인권을 지키는 법률(예: 장애인차별금지 및 권리구제 등에 관한 법률, 발달장애인 권리보장 및 지원에 관한 법률) 조사하기 등의 내용을 다룬다. 사회 속에서 여러 사람과 함께 살아가기 위해서는 인권을 존중하는 태도를 바탕으로 사회 규범을 지키며 살아가는 것이 중요함을 이해하도록 하는 데 중점을 둔다.","n":[],"p":125,"b":3},{"c":"[12사회03-06]","k":"기본","sk":"","s":"사회","g":"고등학교 1~3학년","d":"시민의 삶","t":"민주주의의 원리를 존중하고 실천하며 민주시민의 소양을 기른다.","m":"이 성취기준은 일상생활 속에서 경험할 수 있는 다양한 민주적 가치를 탐구함으로써 시민 의식을 자연스럽게 내면화하고 이를 통해 민주시민으로서의 성장을 지원하기 위해 설정하였다. 일상 속 시민의 권리와 의무 조사하기, 투표 등 민주적 의사 결정 과정 참여하기, 다양한 미디어에서 표현의 자유 살펴보기, 미디어에 자유롭게 의사 표현하기 등을 주된 내용으로 한다. 개념을 학습하는 것에 치우치지 않도록 유의하며 일상의 다양한 사례를 통해 민주적 생활 태도를 실천하는 시민의 태도를 기르는 데 중점을 둔다. 미디어 문해력과 관련해서는 다양한 의견을 자유롭게 표현하도록 하되 이 과정에서 표현의 자유에 따른 책임을 인식하도록 하고, 각종 미디어의 내용을 비판적으로 수용하는 태도로 확장하도록 한다.","n":["학생이 민주시민으로서 다른 사람의 상황에 공감하고 함께 연대하며 인권과 다양성을 존중하도록 실제적인 사례와 상황을 가정하여 교육한다. 민주주의와 정치 등과 관련한 지식이나 개념 이해에 초점을 두기보다는 민주시민 의식이 실현되는 구체적인 모습과 행동에 초점을 둔다. 장애 정도가 심한 학생이라도 민주시민의 다양한 행동, 선거 참여와 같은 유권자 행동을 학습하는 것은 시민의 권리에 해당하므로 학습 활동에서 제외하지 않도록 유의한다. 유권자 권리 행사를 위하여 ‘지원적 의사 결정’을 활용하는 예를 지도 내용으로 포함한다."],"p":125,"b":3},{"c":"[12사회03-07]","k":"기본","sk":"","s":"사회","g":"고등학교 1~3학년","d":"시민의 삶","t":"영토 주권과 평화와 통일을 위한 우리의 노력을 조사하고 세계 평화를 소중히 여긴다.","m":"이 성취기준은 우리 국토를 지키기 위한 조상들의 모습과 통일을 위한 다양한 노력을 살펴보며 세계 평화의 중요성과 올바른 영토 주권 의식을 형성하기 위해 설정하였다. 외침을 막아낸 역사 조사하기, 독도의 역사와 영유권 분쟁 조사하기, 평화로운 미래를 위한 통일 관련 활동하기(예: 남북한의 다름을 살펴보고 서로 존중하기, 북한 전통 놀이 체험하기, 남북한의 협력 사례 찾아보기, 통일 후 평화로운 세계 상상하기) 등의 내용을 다룬다. 평화로운 미래의 중요성을 인식하게 하고, 단순히 전쟁이 없는 평화가 아니라 각기 다른 사람들이 독립성을 가지고 자유롭게 어울려 사는 것의 소중함을 인식하는 데 중점을 둔다.","n":[],"p":125,"b":3},{"c":"[12사회03-08]","k":"기본","sk":"","s":"사회","g":"고등학교 1~3학년","d":"시민의 삶","t":"세계인이 함께 살아가는 모습을 조사하고 세계시민으로서의 삶의 태도를 가진다.","m":"이 성취기준은 인공지능 시대, 세계인이 함께 사는 초연결 사회 등 새롭게 등장하는 다양한 가치에 공감하고 변화를 능동적으로 수용하는 자세를 기르기 위해 설정하였다. 우리는 이제 지역 주민, 국민, 세계시민이라는 다중적인 지위를 동시에 갖는 시대에 살고 있으며 이에 따른 시민의 자질, 즉 다중 시민성이 필요하다. 이를 위해 인공지능이 바꿔 가는 삶의 모습 살펴보기, 세계 평화와 인권 수호를 위한 캠페인 참여하기, 혐오와 차별에 대처하기, 세계의 빈곤 및 불평등 문제 조사하기 등의 내용을 다룬다. 전 세계적 변화와 발전 모습을 긍정적으로 인식하도록 하며 사회 문제를 해결하는 데 필요한 작은 행동에 동참하도록 하여 세계시민으로 사는 삶의 자세를 갖는데 주안점을 둔다. 또한 글로컬 시민으로서 세계화뿐만 아니라 지역의 다양한 문제에 관심을 두고 지역의 가치를 함께 강조하는 삶의 자세를 갖도록 한다.","n":["인권, 민주시민의 소양, 평화, 기후위기 등은 세계적인 쟁점이므로 [12사회03-01], [12사회03-05], [12사회03-06], [12사회03-07]과 연계한다."],"p":125,"b":3},{"c":"[2수학01-01]","k":"기본","sk":"","s":"수학","g":"초등학교 1~2학년","d":"수와 연산","t":"주변을 탐색하여 방금 전에 보았던 사물을 찾는다.","m":"찾기는 시야에서 인지된 사물을 가림막, 천, 상자 등으로 가리고 다시 해당 사물을 찾게 하는 활동이다. 자신의 시야에 있던 사물이 눈앞에서 가려져서 마치 사라진 것처럼 보여도 실제로는 계속 존재한다고 인식하는 대상 영속성의 개념을 경험하게 한다.","n":[],"p":142,"b":3},{"c":"[2수학01-02]","k":"기본","sk":"","s":"수학","g":"초등학교 1~2학년","d":"수와 연산","t":"제시한 구체물과 같거나 다른 구체물을 찾는다.","m":"변별하기는 교사가 제시한 구체물을 보고 같은 또는 다른 구체물을 찾는 활동이다. 구체물의 색상, 모양, 크기 등을 관찰하고 특징을 파악하여 다른 구체물과 구별하게 한다. 생활 주변의 친숙한 구체물을 활용하되 구체물 간의 차이가 명확하게 드러나는 구체물을 활용하여 변별할 수 있게 함으로써 성공 경험을 제공한다.","n":[],"p":142,"b":3},{"c":"[2수학01-03]","k":"기본","sk":"","s":"수학","g":"초등학교 1~2학년","d":"수와 연산","t":"구체물을 보고 많은 것과 적은 것을 비교한다.","m":"비교하기는 여러 가지 구체물을 두 군데로 나누어 제시하여 학생들이 직관적으로 두 군데 중 어느 쪽이 더 많고 적음을 인지하는 활동이다. 이 활동은 수의 기초 단계에 해당하며 제시된 구체물을 하나씩 세지 않고 눈으로 보았을 때의 수량을 비교한다. 따라서 사용하는 구체물의 크기, 모양, 색상 등을 동일하게 맞추어 제시함으로써 수량의 비교에 집중하게 한다.","n":[],"p":142,"b":3},{"c":"[2수학01-04]","k":"기본","sk":"","s":"수학","g":"초등학교 1~2학년","d":"수와 연산","t":"서로 관계있는 구체물을 찾아 일대일로 짝짓는다.","m":"짝짓기는 구체물과 구체물을 서로 관계있는 것끼리 일대일로 대응하여 짝을 만드는 활동으로써 수 개념과 비교 개념을 형성하기 위한 기초가 되는 활동이다. 제시된 구체물 중에서 똑같은 것을 찾아 일대일로 짝을 짓는 활동을 하여 짝이라는 대응 개념에 익숙하게 한다. 이후 점차 관계있는 양말, 신발과 같이 짝이 있는 구체물과 치약과 칫솔, 책상과 의자와 같이 사용할 때 짝이 되는 구체물 등을 활용하여 서로 연결하여 짝을 만들어 보는 활동으로 확장한다.","n":[],"p":142,"b":3},{"c":"[2수학01-05]","k":"기본","sk":"","s":"수학","g":"초등학교 1~2학년","d":"수와 연산","t":"구체물을 한 가지 기준에 따라 순서대로 배열한다.","m":"순서짓기는 하나의 기준을 가지고 세 가지의 구체물을 순서대로 배열하는 활동이다. 이는 수의 계열과 수의 대소 비교에 바탕이 되는 개념을 형성하는 활동으로써 크기 등의 기준에 따라 구체물을 순서에 맞추어 배열한다.","n":[],"p":142,"b":3},{"c":"[2수학01-06]","k":"기본","sk":"","s":"수학","g":"초등학교 1~2학년","d":"수와 연산","t":"구체물이 있고 없음을 구별하고, 한 개와 여러 개를 구별한다.","m":"학생이 선호하는 구체물을 하나 선정하여 학생의 시야에서 구체물을 보여 주고 가림판 등으로 구체물을 가려서 없는 상황을 제시하여 ‘있다’, ‘없다’의 개념을 반복적으로 경험하게 한다. 다음으로 구체물이 한 개 있을 때와 여러 개가 있을 때를 구별하는 활동을 한다. 이때 구체물의 종류는 같게 제시하고 구체물의 수량을 학생들이 직관적으로 인식할 수 있도록 반복 학습하여 수 개념을 익히게 한다.","n":[],"p":143,"b":3},{"c":"[2수학01-07]","k":"기본","sk":"","s":"수학","g":"초등학교 1~2학년","d":"수와 연산","t":"다섯 개 이하 구체물의 개수를 센다.","m":"하나, 둘, 셋, 넷, 다섯으로 구체물의 개수를 직접 세어 보며 다섯 이하의 개수 세기를 반복적으로 학습한다. 이는 수 세기와 집합수의 기초를 형성하게 한다. 여기서 주의할 점은 학생들이 수 개념을 익히기 전 단계이므로 1, 2, 3, 4, 5와 같은 수 기호를 도입하지는 않는다.","n":[],"p":143,"b":3},{"c":"[2수학01-08]","k":"기본","sk":"","s":"수학","g":"초등학교 1~2학년","d":"수와 연산","t":"배열이 다른 구체물의 개수를 세어 비교한다.","m":"다섯 개 이하의 구체물을 가로로 나란히 놓거나 세로로 나란히 놓아서 개수를 세어 본다. 그 외 다양한 배열 모양을 활용하여 개수 세기를 한다. 또한 배열 간격을 좁게 또는 넓게 하여 세어 본다. 이를 통해 학생들은 수의 보존 개념의 기초를 다진다.","n":[],"p":143,"b":3},{"c":"[2수학01-09]","k":"기본","sk":"","s":"수학","g":"초등학교 1~2학년","d":"수와 연산","t":"다섯 개 이하의 구체물을 양쪽으로 가른다.","m":"생활 주변의 친숙한 다섯 개 이하의 구체물을 활용한 가르기와 모으기 활동을 한다. 이때 구체물은 모양, 크기, 색상 등 특징이 똑같은 구체물을 사용하여 구체물 간의 차이로 인한 혼동을 줄이고 가르기와 모으기 활동 자체에 집중할 수 있게 한다.","n":[],"p":144,"b":3},{"c":"[2수학01-10]","k":"기본","sk":"","s":"수학","g":"초등학교 1~2학년","d":"수와 연산","t":"양쪽의 구체물을 하나로 모은다.","m":"생활 주변의 친숙한 다섯 개 이하의 구체물을 활용한 가르기와 모으기 활동을 한다. 이때 구체물은 모양, 크기, 색상 등 특징이 똑같은 구체물을 사용하여 구체물 간의 차이로 인한 혼동을 줄이고 가르기와 모으기 활동 자체에 집중할 수 있게 한다.","n":[],"p":144,"b":3},{"c":"[2수학01-11]","k":"기본","sk":"","s":"수학","g":"초등학교 1~2학년","d":"수와 연산","t":"화폐의 용도를 알고 구체물 중에서 화폐를 찾는다.","m":"생활 속에서 화폐를 사용하는 다양한 장면을 학생들이 관찰함으로써 화폐의 용도와 필요성을 파악하게 한다. 여러 가지 구체물 중에서 주어진 화폐와 모양, 색상, 크기가 같은 화폐를 찾는 활동을 중심으로 내용을 다룬다. 화폐와 화폐가 아닌 것을 구별하고 이후 활동에 익숙해지면 여러 가지 화폐 중에서 주어진 화폐와 같은 화폐를 찾는 활동으로 확장한다.","n":[],"p":145,"b":3},{"c":"[2수학02-01]","k":"기본","sk":"","s":"수학","g":"초등학교 1~2학년","d":"도형","t":"생활 주변에서 볼 수 있는 사물의 모양을 관찰한다.","m":"생활 주변에서 볼 수 있는 사물의 모양을 살펴보며 그 모양이 각각 다름을 인식하게 한다. 사물을 관찰하면서 크기, 색상, 질감, 모양 등의 속성 중 겉으로 나타나는 생김새나 형태에 초점을 두어 인식하게 한다. 이를 통해 사물의 모양이 저마다 다름을 인식하게 하며, 사물의 여러 모양에 관심과 흥미를 가지게 한다.","n":[],"p":145,"b":3},{"c":"[2수학02-02]","k":"기본","sk":"","s":"수학","g":"초등학교 1~2학년","d":"도형","t":"여러 가지 사물의 모양의 기초적인 특성을 구별한다.","m":"생활 속의 사물에 대한 직접적이고 구체적인 경험을 통하여 여러 가지 모양을 구별하기 위한 기초적인 능력을 기르게 한다. 생활 주변에 있는 다양한 모양의 사물을 여러 가지 감각을 통해 탐색하면서 ‘뾰족하다’, ‘둥글다’, ‘반듯하다’와 같은 사물의 모양에서 찾아볼 수 있는 기초적인 특성을 직관적으로 파악하게 한다.","n":[],"p":145,"b":3},{"c":"[2수학02-03]","k":"기본","sk":"","s":"수학","g":"초등학교 1~2학년","d":"도형","t":"직관적인 비교를 통하여 같은 모양과 다른 모양을 찾는다.","m":"‘뾰족하다’, ‘둥글다’, ‘반듯하다’ 등 사물의 모양에서 찾아볼 수 있는 기초적인 특성을 바탕으로 여러 가지 사물의 모양을 직관적으로 비교하게 한다. 이때 모양에 대한 정확한 개념보다 직관적 방법을 활용하여 모양이 같거나 다른 사물을 찾아보게 한다.","n":[],"p":145,"b":3},{"c":"[2수학02-04]","k":"기본","sk":"","s":"수학","g":"초등학교 1~2학년","d":"도형","t":"주변의 물건을 자유롭게 옮긴다.","m":"공간이라는 개념을 직접 경험을 통해 인식하게 한다. 학생에게 익숙한 위치와 장소에서 여러 가지 물건을 자유롭게 옮기면서 주변을 탐색하게 하고, 점진적으로 학생이 인식할 수 있는 범위를 확장해 나간다.","n":[],"p":146,"b":3},{"c":"[2수학02-05]","k":"기본","sk":"","s":"수학","g":"초등학교 1~2학년","d":"도형","t":"나를 중심으로 앞, 뒤, 옆, 위, 아래를 구별한다.","m":"공간을 인식하는 주체는 자기 자신이며, 자신을 중심으로 공간 관계를 경험한다. 자신을 중심으로 앞, 뒤, 옆, 위, 아래 등을 경험하고 구별하면서 방위에 대한 기초적인 경험을 하게 한다.","n":[],"p":146,"b":3},{"c":"[2수학03-01]","k":"기본","sk":"","s":"수학","g":"초등학교 1~2학년","d":"측정","t":"여러 가지 구체물의 크기, 길이, 무게를 감각적으로 경험한다.","m":"여러 가지 구체물의 표면적인 크기를 관찰하고, 가로와 세로의 길이 차이를 알아보고, 손으로 물체를 들었을 때 서로 다른 느낌이 있다는 것을 경험하게 한다. 이를 통해 구체물에는 여러 가지 속성이 있으며 물체에 따라 서로 다른 감각적 차이가 있다는 것을 자연스럽게 인식하게 한다.","n":[],"p":147,"b":3},{"c":"[2수학03-02]","k":"기본","sk":"","s":"수학","g":"초등학교 1~2학년","d":"측정","t":"구체물 두 개의 크기, 길이를 직관적으로 비교하고 용어로 나타낸다.","m":"구체물 두 개의 크기와 길이를 비교할 때는 구체물의 형태를 직관적으로 관찰하여 비교하게 한다. 직관적으로 변별하기 쉬운 같은 종류의 구체물을 활용하여 크기나 길이를 비교하게 하며, 비교한 구체물의 크기는 ‘크다’와 ‘작다’로, 길이는 ‘길다’와 ‘짧다’와 같은 비교 용어로 구분하여 표현하게 한다.","n":[],"p":147,"b":3},{"c":"[2수학03-03]","k":"기본","sk":"","s":"수학","g":"초등학교 1~2학년","d":"측정","t":"구체물 두 개의 무게를 직관적으로 비교하고 용어로 나타낸다.","m":"구체물 두 개의 무게를 비교할 때는 각각의 구체물을 손으로 들어 보고 느껴지는 감각적 차이를 비교하게 한다. 무게의 차이가 명확하게 다른 구체물을 활용하여 무게를 비교하며, 비교한 구체물의 무게는 ‘무겁다’와 ‘가볍다’와 같은 비교 용어로 구분하여 표현하게 한다.","n":[],"p":147,"b":3},{"c":"[2수학03-04]","k":"기본","sk":"","s":"수학","g":"초등학교 1~2학년","d":"측정","t":"생활 모습을 관찰하여 낮과 밤으로 나타낸다.","m":"가정이나 학교에서 일어나는 일상생활을 관찰하고 낮과 밤이라는 시간의 변화에 따라 생활 모습에 차이가 있다는 것을 알게 한다. 낮과 밤의 활동은 각각 주위 환경, 생활 모습 등의 차이를 통해 구분하고 낮에서 밤, 밤에서 낮으로 반복되며 이어지는 시간의 특성을 탐색하게 한다. 이후 여러 가지 생활 모습을 관찰하며 낮과 밤을 나타내게 한다.","n":[],"p":148,"b":3},{"c":"[2수학03-05]","k":"기본","sk":"","s":"수학","g":"초등학교 1~2학년","d":"측정","t":"시간의 변화에 따른 일상생활의 모습을 관찰하여 전과 후로 구분한다.","m":"일상생활의 관찰을 통해 시간의 변화에 따라 일이 일어나기 전과 후의 달라진 상황이나 모습 등의 차이를 알게 한다. 그리고 일이 일어나기 전과 후의 다른 모습을 비교하고, 변화된 모습을 순차적으로 나타냄으로써 시간의 연속성을 인식하게 한다.","n":[],"p":148,"b":3},{"c":"[2수학04-01]","k":"기본","sk":"","s":"수학","g":"초등학교 1~2학년","d":"규칙성","t":"시각적, 청각적, 운동적 표현을 통해 생활 주변에서 반복되는 규칙을 경험한다.","m":"시각적, 청각적, 운동적 표현활동을 통해 학생에게 생활 주변에서 반복되는 다양한 형태의 규칙을 경험하게 한다. 시각적인 것으로는 옷이나 벽지의 무늬, 포장지의 그림 등이 있고, 청각적인 것으로는 규칙적인 요소가 포함되어 있는 동요, 의성어와 의태어 등이 있다. 또한 반복적인 신체의 움직임은 규칙을 즐겁게 지각할 수 있는 기회를 준다.","n":[],"p":149,"b":3},{"c":"[2수학04-02]","k":"기본","sk":"","s":"수학","g":"초등학교 1~2학년","d":"규칙성","t":"소리와 리듬, 동작 등을 통해 반복되는 규칙을 따라 한다.","m":"소리와 리듬, 동작을 활용하거나 학생에게 쉽고 친숙한 놀이 활동을 통해 규칙적인 표현을 관찰하고 모방하게 한다. 노래 속에서 반복되는 리듬과 몸 움직임, 소리 등을 통해 자연스럽게 반복되는 규칙을 따라 하게 한다. 이때에는 ‘쿵짝쿵짝’이나 ‘쿵쿵짝짝쿵쿵짝짝과’ 같이 단순한 형태의 규칙을 모방하게 한다. 학생은 단순하지만 다양한 형태의 규칙을 따라 해보는 과정을 통해 반복되는 규칙의 즐거움을 찾을 수 있다.","n":[],"p":149,"b":3},{"c":"[2수학05-01]","k":"기본","sk":"","s":"수학","g":"초등학교 1~2학년","d":"자료와 가능성","t":"여러 가지 분류 상황을 경험한다.","m":"일상생활 속 물건이 정리된 모습을 관찰하고, 필요한 물건을 찾아보는 활동을 경험하면서 분류의 편리함과 필요성을 인식하게 한다. 그리고 여러 가지 구체물을 다양한 감각을 통해 탐색하고 크기, 색, 모양 등과 같은 명확한 특성에 따라 일정한 공간에 각각 모으는 활동을 통해 분류 활동을 충분히 경험하게 한다.","n":[],"p":149,"b":3},{"c":"[4수학01-01]","k":"기본","sk":"","s":"수학","g":"초등학교 3~4학년","d":"수와 연산","t":"열 개 이하의 구체물 개수를 센다.","m":"생활 주변의 친숙한 구체물을 활용하여 하나부터 열까지 개수를 세어 보는 활동을 통해 이후 수를 활용한 수 세기의 기초를 형성하게 한다. 개수와 구체물을 일대일로 대응하며 세고 마지막 구체물에 대응하는 개수의 이름이 전체의 개수라는 것을 인지하게 한다.","n":[],"p":150,"b":3},{"c":"[4수학01-02]","k":"기본","sk":"","s":"수학","g":"초등학교 3~4학년","d":"수와 연산","t":"두 모음의 구체물 개수를 비교하고 많고 적음을 표현한다.","m":"열 개 이하인 두 집합을 보고 개수를 비교하여 어느 쪽이 많고 적음을 표현하게 한다. 이때 크기, 모양, 색상 등의 특성이 모두 같은 구체물을 활용하여 구체물의 개수를 세는 데 혼동을 주는 요소를 최소화한다. 개수의 차이가 큰 두 집합을 제시하여 개수의 비교를 경험하게 하고 수의 크기에 대한 기초 개념을 형성하게 한다.","n":[],"p":150,"b":3},{"c":"[4수학01-03]","k":"기본","sk":"","s":"수학","g":"초등학교 3~4학년","d":"수와 연산","t":"9 이하의 수를 읽고 쓴다.","m":"하나부터 열까지의 구체물 개수와 1부터 9까지의 수를 연결하여 구체물 개수에 대응하는 수가 있음을 알게 한다. 수를 읽고 쓰며 한 자리 수를 파악하고, 구체물의 개수와 수의 대응을 통해 수의 크기를 비교한다. 또한 열 개 이하의 구체물을 하나씩 줄이며 구체물이 없을 때는 0으로 표현함을 알고, 생활 속 다양한 상황에서 0이 활용됨을 살펴본다.","n":[],"p":150,"b":3},{"c":"[4수학01-04]","k":"기본","sk":"","s":"수학","g":"초등학교 3~4학년","d":"수와 연산","t":"0의 개념을 알고 0을 읽고 쓴다.","m":"하나부터 열까지의 구체물 개수와 1부터 9까지의 수를 연결하여 구체물 개수에 대응하는 수가 있음을 알게 한다. 수를 읽고 쓰며 한 자리 수를 파악하고, 구체물의 개수와 수의 대응을 통해 수의 크기를 비교한다. 또한 열 개 이하의 구체물을 하나씩 줄이며 구체물이 없을 때는 0으로 표현함을 알고, 생활 속 다양한 상황에서 0이 활용됨을 살펴본다.","n":[],"p":150,"b":3},{"c":"[4수학01-05]","k":"기본","sk":"","s":"수학","g":"초등학교 3~4학년","d":"수와 연산","t":"9 이하의 수 크기를 비교한다.","m":"하나부터 열까지의 구체물 개수와 1부터 9까지의 수를 연결하여 구체물 개수에 대응하는 수가 있음을 알게 한다. 수를 읽고 쓰며 한 자리 수를 파악하고, 구체물의 개수와 수의 대응을 통해 수의 크기를 비교한다. 또한 열 개 이하의 구체물을 하나씩 줄이며 구체물이 없을 때는 0으로 표현함을 알고, 생활 속 다양한 상황에서 0이 활용됨을 살펴본다.","n":[],"p":150,"b":3},{"c":"[4수학01-06]","k":"기본","sk":"","s":"수학","g":"초등학교 3~4학년","d":"수와 연산","t":"구체물의 배열을 순서수로 표현한다.","m":"생활 속에서 순서수가 활용되는 상황을 살펴보고 한 줄로 배열된 구체물의 순서를 순서수로 표현하는 데 중점을 둔다. 일과 시간 중에서 줄서기 등 순서수가 활용되는 여러 장면을 모의로 구성한 후 반복적인 경험을 통해 순서수에 익숙하게 한다.","n":[],"p":150,"b":3},{"c":"[4수학01-07]","k":"기본","sk":"","s":"수학","g":"초등학교 3~4학년","d":"수와 연산","t":"실생활에서 활용되는 한 자리 수의 덧셈과 뺄셈의 의미를 안다.","m":"다양한 생활 속 장면에서 활용되는 한 자리 수의 덧셈과 뺄셈을 보고 덧셈과 뺄셈 상황을 파악하게 한다. 덧셈은 개수가 더 많아지는 것, 뺄셈은 개수가 더 적어지는 것으로 연산의 기초 개념을 형성하게 한다.","n":[],"p":151,"b":3},{"c":"[4수학01-08]","k":"기본","sk":"","s":"수학","g":"초등학교 3~4학년","d":"수와 연산","t":"합이 9 이하인 더하기를 하고 덧셈식으로 나타낸다.","m":"한 자리 수의 덧셈은 구체물과 반 구체물을 활용하여 우선 합이 5 이하가 되는 덧셈부터 시작하여 합이 9 이하인 덧셈까지 단계적인 내용을 다룬다. 한 자리 수의 뺄셈 역시 피감수가 5 이하인 뺄셈을 충분히 학습한 뒤 피감수가 9 이하인 뺄셈을 경험하게 한다. 필요한 경우 계산 도구를 도입한다. 계산기의 필요성과 여러 가지 종류 살펴보기, 숫자와 기호 찾아보기, 계산기 창에 수 나타내기 등의 활동을 중심으로 내용을 다룬다. 계산기 조작에 충분히 익숙해진 후 덧셈과 뺄셈에 계산기를 활용하게 한다.","n":[],"p":151,"b":3},{"c":"[4수학01-09]","k":"기본","sk":"","s":"수학","g":"초등학교 3~4학년","d":"수와 연산","t":"피감수가 9 이하인 빼기를 하고 뺄셈식으로 나타낸다.","m":"한 자리 수의 덧셈은 구체물과 반 구체물을 활용하여 우선 합이 5 이하가 되는 덧셈부터 시작하여 합이 9 이하인 덧셈까지 단계적인 내용을 다룬다. 한 자리 수의 뺄셈 역시 피감수가 5 이하인 뺄셈을 충분히 학습한 뒤 피감수가 9 이하인 뺄셈을 경험하게 한다. 필요한 경우 계산 도구를 도입한다. 계산기의 필요성과 여러 가지 종류 살펴보기, 숫자와 기호 찾아보기, 계산기 창에 수 나타내기 등의 활동을 중심으로 내용을 다룬다. 계산기 조작에 충분히 익숙해진 후 덧셈과 뺄셈에 계산기를 활용하게 한다.","n":[],"p":151,"b":3},{"c":"[4수학01-10]","k":"기본","sk":"","s":"수학","g":"초등학교 3~4학년","d":"수와 연산","t":"0이 있는 덧셈과 뺄셈을 한다.","m":"구체물이 없는 상태가 0인 개념을 다시 복습하고 구체물과 반 구체물을 활용하여 수에 0을 더하거나 빼도 그 결과에 변화가 없음을 인지하게 한다.","n":[],"p":151,"b":3},{"c":"[4수학01-11]","k":"기본","sk":"","s":"수학","g":"초등학교 3~4학년","d":"수와 연산","t":"동전의 액면가를 읽고 크기를 비교한다.","m":"생활 속에서 화폐가 다양하게 사용되고 있는 장면을 제시하여 화폐의 단위에 흥미와 관심을 가지게 한다. 우리나라의 화폐 단위는 ‘원’임을 알고 몇 원으로 표현하게 한다. 백 원과 오백 원 동전의 모양, 크기, 그림, 숫자 등의 특징을 살펴보고 액면가를 파악한다. 또한 주어진 동전을 액면가가 크거나 작은 동전으로 교환하는 경험을 한다.","n":[],"p":152,"b":3},{"c":"[4수학01-12]","k":"기본","sk":"","s":"수학","g":"초등학교 3~4학년","d":"수와 연산","t":"몇백 원짜리 상품과 교환할 수 있는 동전을 찾는다.","m":"시장 놀이 등의 활동을 통해 학생은 백 원 또는 오백 원으로 표시한 상품 가격을 확인하고 알맞은 동전을 제시하는 활동을 하고 이후 몇백 원의 상품과 동전을 교환하는 활동을 반복함으로써 화폐의 실용성과 가치를 인식하게 한다.","n":[],"p":152,"b":3},{"c":"[4수학02-01]","k":"기본","sk":"","s":"수학","g":"초등학교 3~4학년","d":"도형","t":"교실 및 생활 주변에서 볼 수 있는 사물에서 여러 가지 입체 모양을 찾는다.","m":"생활 속 주변 사물의 관찰을 통해 직관적으로 입체 모양을 인식하고 그 특징을 파악하여 기본적인 입체 모양에 친숙한 경험을 갖게 한다. 이때 사물은 학생에게 익숙한 사물을 선정하여 흥미와 관심을 유발한다.","n":[],"p":153,"b":3},{"c":"[4수학02-02]","k":"기본","sk":"","s":"수학","g":"초등학교 3~4학년","d":"도형","t":"상자 모양, 공 모양, 둥근 기둥 모양 등의 여러 가지 입체 모양을 탐색한다.","m":"생활 주변의 다양한 상자 모양, 공 모양, 둥근 기둥 모양을 가진 사물을 제시한다. 입체 모양의 크기와 위치를 다양한 방식으로 파악할 수 있는 여러 가지 실물 자료를 제공한다. 생활 속에 있는 여러 가지 친숙한 사물을 관찰하고 만져 보고 쌓아 보고 굴려 보는 등의 직접적인 조작 경험을 하게 한다. 이를 통하여 입체 모양의 특성을 직관적으로 찾게 한다.","n":[],"p":153,"b":3},{"c":"[4수학02-03]","k":"기본","sk":"","s":"수학","g":"초등학교 3~4학년","d":"도형","t":"직관적인 비교를 통하여 상자 모양, 공 모양, 둥근 기둥 모양을 분류한다.","m":"실생활에서 여러 가지 모양을 찾아보며 상자 모양, 공 모양, 둥근 기둥 모양 등 기본적인 입체 모양을 인식하게 하고, 여러 가지 공통된 특징을 직관적으로 파악하여 같은 모양끼리 모을 수 있게 한다. 그리고 어떻게 모양을 모았는지에 대한 발문을 통하여 학생의 사고 과정을 스스로 표현할 수 있게 한다.","n":[],"p":153,"b":3},{"c":"[4수학02-04]","k":"기본","sk":"","s":"수학","g":"초등학교 3~4학년","d":"도형","t":"여러 가지 입체 모양을 활용하여 모양을 만들거나 꾸민다.","m":"여러 가지 입체 모양을 활용하여 다양한 모양이나 형태를 만들거나 꾸며 본다. 우유갑, 갑 티슈, 캔 등 다양한 입체 모양의 재활용품을 활용하여 디자인이나 활용도를 더해 새로운 모양이나 형태로 물건을 만들 수도 있다. 이를 통하여 우리 주변이 여러 가지 입체 모양으로 구성되어 있음을 알고, 심미성 있는 형태를 만들거나 꾸미면서 도형의 아름다움을 느끼게 한다. 그리고 친구들과 함께 작품을 만들거나 꾸미는 활동을 통해 협동의 즐거움을 느끼게 한다.","n":[],"p":154,"b":3},{"c":"[4수학02-05]","k":"기본","sk":"","s":"수학","g":"초등학교 3~4학년","d":"도형","t":"주변의 물건을 찾거나 옮기면서 위치의 변화를 경험한다.","m":"주변의 물건을 찾거나 옮기면서 위와 아래, 앞과 뒤와 옆, 안과 밖 등의 위치를 경험하게 한다. 위치에 관련된 개념들을 직접 경험을 통하여 직관적으로 경험하게 한다. 이때 특정한 위치에 맞게 물건 옮기기를 지도하기보다 학생이 원하는 곳으로 자유롭게 물건을 옮기면서 기존의 위치에서 다른 곳으로 변화되었음을 인식하게 한다.","n":[],"p":155,"b":3},{"c":"[4수학02-06]","k":"기본","sk":"","s":"수학","g":"초등학교 3~4학년","d":"도형","t":"주변의 물건을 찾거나 옮기면서 방향의 변화를 경험한다.","m":"주변의 물건을 찾거나 옮기면서 오른쪽, 왼쪽 등 자신을 기준으로 한 방향을 경험하게 한다. 생활 주변의 사물 중에서 오른쪽, 왼쪽 등 방향이 표시되어 있는 사물들을 활용하는 모습을 직접 경험하거나 살펴보면서 방향이 생활 속 넓은 범위에 활용되고 있음을 알게 한다.","n":[],"p":155,"b":3},{"c":"[4수학03-01]","k":"기본","sk":"","s":"수학","g":"초등학교 3~4학년","d":"측정","t":"구체물 두세 개의 크기, 길이를 직접 비교하고 용어로 나타낸다.","m":"구체물 두세 개의 크기를 직접 비교하기 위해 나란히 놓거나 한 물체를 다른 물체 위에 겹쳐 놓는 방법 등을 사용하고 길이의 경우 비교하고자 하는 물체의 한쪽 끝을 맞추어 직접 맞대는 방법을 사용한다. 구체물을 직접 비교한 후 크기는 ‘가장 크다’, ‘더 크다’, ‘작다’로, 길이는 ‘가장 길다’, ‘더 길다’, ‘짧다’로 구분하여 표현하게 한다.","n":[],"p":155,"b":3},{"c":"[4수학03-02]","k":"기본","sk":"","s":"수학","g":"초등학교 3~4학년","d":"측정","t":"구체물 두세 개의 무게를 직접 비교하고 용어로 나타낸다.","m":"구체물 두세 개의 무게를 직접 비교하기 위해 물건을 양손으로 동시에 들어 보거나 한 손으로 각각 들어 보고 무게의 느낌을 비교한다. 구체물 두세 개의 무게 차이가 큰 물건에서 점차 무게 차이를 줄여가며 비교하고, 서로 다른 무게는 ‘가장 무겁다’, ‘더 무겁다’, ‘가볍다’로 구분하여 표현하게 한다.","n":[],"p":155,"b":3},{"c":"[4수학03-03]","k":"기본","sk":"","s":"수학","g":"초등학교 3~4학년","d":"측정","t":"하루의 주요 활동을 보고 아침, 점심, 저녁으로 구분한다.","m":"하루 중 변화하는 일상생활 및 주변 환경의 모습을 관찰하고, 나와 가족, 친구의 아침, 점심, 주요 활동 모습을 각각 구분하여 탐색하고 비교하게 한다. 이러한 과정을 통해 하루의 일과 중 특정 장면이나 모습이 일정한 간격을 두고 반복해서 일어나고 있음을 인식하게 하고, 주요 활동이 아침, 점심, 저녁 중 언제 일어나는지 구분할 수 있게 한다.","n":[],"p":156,"b":3},{"c":"[4수학03-04]","k":"기본","sk":"","s":"수학","g":"초등학교 3~4학년","d":"측정","t":"하루의 주요 활동을 아침, 점심, 저녁의 시간 순서대로 나타낸다.","m":"하루 중 일어나는 여러 가지 주요 활동을 관찰하고, 시간에 따라 먼저 일어난 일과 나중에 일어난 일로 구분하게 한다. 그리고 구분된 일은 일정한 시간 간격을 기준으로 아침, 점심, 저녁의 시간 중 언제인지 파악하며 시간 순서에 따라 차례대로 나열하게 한다.","n":[],"p":156,"b":3},{"c":"[4수학04-01]","k":"기본","sk":"","s":"수학","g":"초등학교 3~4학년","d":"규칙성","t":"반복되는 두 가지 물체 배열을 보고 똑같이 배열한다.","m":"단순하게 반복되는 두 가지 구체물의 규칙을 보여 주고 그것을 그대로 똑같이 만들어 보게 한다. 이때에는 다음에 올 것이 무엇인지를 강조하여 지도하기보다는 “지우개와 연필이 반복되고 있어”와 같이 두 가지 물체가 ‘ABAB’의 형태로 반복되고 있다는 것을 알려 준다. 이러한 활동은 학생에게 반복되는 부분이 무엇인지를 인식하게 하고 규칙을 찾는 기초를 형성할 수 있게 한다.","n":[],"p":157,"b":3},{"c":"[4수학04-02]","k":"기본","sk":"","s":"수학","g":"초등학교 3~4학년","d":"규칙성","t":"반복되는 두 가지 물체 배열을 보고, 다음에 올 것을 추측하여 배열한다.","m":"학생에게 두 가지 물체가 반복되는 규칙의 일부분을 보고 다음에 올 규칙을 추측해서 배열해 보게 한다. 이는 규칙을 단순하게 인식하고 따라 하는 수준을 넘어서 다음에 올 것을 예측하는 데 도움이 된다. 또한 다음에 올 것을 추측하여 물체를 배열해 보는 활동은 수학에 대한 흥미를 높이면서 규칙을 찾고 사물의 관계를 파악하는 기초가 된다.","n":[],"p":157,"b":3},{"c":"[4수학04-03]","k":"기본","sk":"","s":"수학","g":"초등학교 3~4학년","d":"규칙성","t":"생활 주변의 두 가지 물체 배열에서 규칙을 찾는다.","m":"학생에게 생활 주변에서 단순하게 반복되는 규칙에 관심을 가지고 알아볼 수 있는 기회를 제공한다. 책상과 의자의 배열, 연필과 지우개의 배열, 흰색과 검정색 바둑돌의 배열 등 학생의 생활 주변에서 자주 볼 수 있는 친숙한 두 가지 물체의 반복되는 배열을 활용한다. 먼저 규칙적인 두 가지 물체의 배열에서 규칙이 있는 것과 없는 것을 구분하게 한 후 규칙을 찾게 한다. 이때에는 반복되는 일정한 부분을 보고 다음에 올 것을 예측하여 ‘규칙이 있다’는 것을 알게 한다.","n":[],"p":157,"b":3},{"c":"[4수학05-01]","k":"기본","sk":"","s":"수학","g":"초등학교 3~4학년","d":"자료와 가능성","t":"두 개의 모음으로 분류된 자료를 보고 한 가지 기준을 찾는다.","m":"두 개의 모음으로 정리된 물건이나 주변의 자료들을 관찰하고 모음별 특징을 비교하며 한 가지 기준을 찾게 한다. 분류의 기준은 분명하게 구별될 수 있는 크기, 색, 모양 등으로 하고 분류의 자료는 실생활 속 구체물로 시작하여 사진이나 그림 등으로 제시하게 한다.","n":[],"p":158,"b":3},{"c":"[4수학05-02]","k":"기본","sk":"","s":"수학","g":"초등학교 3~4학년","d":"자료와 가능성","t":"자료를 한 가지 기준에 따라 두 개의 모음으로 분류한다.","m":"명확한 한 가지 기준(예: 크기, 색, 모양)으로 자료를 두 개의 모음으로 분류하고, 각각의 모음에 들어있는 자료를 관찰하여 자료의 크기, 색, 모양 등의 공통된 특성을 파악하게 한다. 그리고 두 개의 모음에 들어있는 자료의 수를 각각 세어보고 그 결과를 표현하게 한다.","n":[],"p":158,"b":3},{"c":"[6수학01-01]","k":"기본","sk":"","s":"수학","g":"초등학교 5~6학년","d":"수와 연산","t":"10의 개념을 알고, 몇십을 센다.","m":"9보다 1 큰 수가 10임을 알게 한다. 구체물을 세어서 10이 되게 만드는 활동을 반복하여 10의 개념에 익숙해지게 하고 구체물과 반 구체물을 10씩 묶으며 몇십으로 세는 활동을 한다. 십 모형의 수와 낱개의 수를 두 자리 수로 나타내고 자릿값 개념을 형성하여 두 자리 수의 크기를 ‘크다, 작다’로 비교한다.","n":[],"p":159,"b":3},{"c":"[6수학01-02]","k":"기본","sk":"","s":"수학","g":"초등학교 5~6학년","d":"수와 연산","t":"10개의 묶음과 낱개의 수를 두 자리 수로 나타낸다.","m":"9보다 1 큰 수가 10임을 알게 한다. 구체물을 세어서 10이 되게 만드는 활동을 반복하여 10의 개념에 익숙해지게 하고 구체물과 반 구체물을 10씩 묶으며 몇십으로 세는 활동을 한다. 십 모형의 수와 낱개의 수를 두 자리 수로 나타내고 자릿값 개념을 형성하여 두 자리 수의 크기를 ‘크다, 작다’로 비교한다.","n":[],"p":159,"b":3},{"c":"[6수학01-03]","k":"기본","sk":"","s":"수학","g":"초등학교 5~6학년","d":"수와 연산","t":"두 자리 수의 크기를 비교한다.","m":"9보다 1 큰 수가 10임을 알게 한다. 구체물을 세어서 10이 되게 만드는 활동을 반복하여 10의 개념에 익숙해지게 하고 구체물과 반 구체물을 10씩 묶으며 몇십으로 세는 활동을 한다. 십 모형의 수와 낱개의 수를 두 자리 수로 나타내고 자릿값 개념을 형성하여 두 자리 수의 크기를 ‘크다, 작다’로 비교한다.","n":[],"p":159,"b":3},{"c":"[6수학01-04]","k":"기본","sk":"","s":"수학","g":"초등학교 5~6학년","d":"수와 연산","t":"합이 10이 되는 더하기를 하고 덧셈식으로 나타낸다.","m":"합이 10이 되는 더하기는 학생이 10의 보수 관계를 파악하는 데 중점을 두어 지도하며 구체물을 가르고 모으는 활동과 덧셈식으로 반복 학습하게 한다. 10의 보수 개념을 활용하여 피감수가 10인 빼기 역시 구체물과 덧셈식을 통해 반복 학습한다.","n":[],"p":160,"b":3},{"c":"[6수학01-05]","k":"기본","sk":"","s":"수학","g":"초등학교 5~6학년","d":"수와 연산","t":"피감수가 10인 빼기를 하고 뺄셈식으로 나타낸다.","m":"합이 10이 되는 더하기는 학생이 10의 보수 관계를 파악하는 데 중점을 두어 지도하며 구체물을 가르고 모으는 활동과 덧셈식으로 반복 학습하게 한다. 10의 보수 개념을 활용하여 피감수가 10인 빼기 역시 구체물과 덧셈식을 통해 반복 학습한다.","n":[],"p":160,"b":3},{"c":"[6수학01-06]","k":"기본","sk":"","s":"수학","g":"초등학교 5~6학년","d":"수와 연산","t":"실생활에서 활용되는 몇십의 덧셈과 뺄셈의 의미를 안다.","m":"생활 속에서 몇십의 덧셈과 뺄셈이 활용되는 다양한 상황을 살펴보고 받아올림이 없는 (몇십)+(몇십)과 받아내림이 없는 (몇십)-(몇십)에 대한 학생의 흥미와 관심을 높인다.","n":[],"p":160,"b":3},{"c":"[6수학01-07]","k":"기본","sk":"","s":"수학","g":"초등학교 5~6학년","d":"수와 연산","t":"받아올림(내림)이 없는 몇십의 덧셈과 뺄셈을 한다.","m":"받아올림(내림)이 없는 몇십의 덧셈과 뺄셈은 가로식과 세로식을 모두 지도하되 세로식은 자릿값을 맞추어 계산하는 데 특별히 주의를 기울이도록 한다. 필요에 따라 계산 도구를 활용하는 경우 받아올림(내림)이 없는 몇십의 덧셈과 뺄셈의 연산을 체험하는 기능적인 측면에 중점을 두어 지도한다.","n":[],"p":160,"b":3},{"c":"[6수학01-08]","k":"기본","sk":"","s":"수학","g":"초등학교 5~6학년","d":"수와 연산","t":"받아올림(내림)이 없는 몇십의 덧셈, 뺄셈과 관련된 실생활 문제를 해결한다.","m":"받아올림(내림)이 없는 몇십의 덧셈과 뺄셈은 가로식과 세로식을 모두 지도하되 세로식은 자릿값을 맞추어 계산하는 데 특별히 주의를 기울이도록 한다. 필요에 따라 계산 도구를 활용하는 경우 받아올림(내림)이 없는 몇십의 덧셈과 뺄셈의 연산을 체험하는 기능적인 측면에 중점을 두어 지도한다.","n":[],"p":160,"b":3},{"c":"[6수학01-09]","k":"기본","sk":"","s":"수학","g":"초등학교 5~6학년","d":"수와 연산","t":"지폐(천 원, 오천 원, 만 원)의 액면가를 읽고 크기를 비교한다.","m":"천 원, 오천 원, 만 원권 지폐의 모양, 크기, 색깔, 그림, 수 등을 살펴보는 활동을 한다. 각 지폐의 액면가를 읽고 쓰며, 천원으로 교환할 수 있는 물건의 양보다 오천 원, 만 원이 더 많다는 것을 경험하게 하여 액면가의 차이를 알게 한다. 이후 지폐를 액면가가 작거나 큰 지폐로 교환하는 활동을 한다.","n":[],"p":161,"b":3},{"c":"[6수학01-10]","k":"기본","sk":"","s":"수학","g":"초등학교 5~6학년","d":"수와 연산","t":"지폐(천 원, 오천 원, 만 원)를 다른 액면가의 지폐로 교환한다.","m":"천 원, 오천 원, 만 원권 지폐의 모양, 크기, 색깔, 그림, 수 등을 살펴보는 활동을 한다. 각 지폐의 액면가를 읽고 쓰며, 천원으로 교환할 수 있는 물건의 양보다 오천 원, 만 원이 더 많다는 것을 경험하게 하여 액면가의 차이를 알게 한다. 이후 지폐를 액면가가 작거나 큰 지폐로 교환하는 활동을 한다.","n":[],"p":161,"b":3},{"c":"[6수학01-11]","k":"기본","sk":"","s":"수학","g":"초등학교 5~6학년","d":"수와 연산","t":"몇천 원짜리 상품과 교환할 수 있는 지폐를 찾는다.","m":"시장 놀이 등의 활동을 통해 천 원, 오천 원, 만 원의 상품 가격에 알맞은 지폐를 지불하여 물건과 지폐를 교환함으로써 화폐의 가치를 인식하게 한다. 천 원이나 만 원과 같은 지폐의 액면가는 고유 명칭이나 단위로 이해하고 천 원 이상부터 2만 원 미만의 범위에서만 상품 가격을 다룬다.","n":[],"p":161,"b":3},{"c":"[6수학01-12]","k":"기본","sk":"","s":"수학","g":"초등학교 5~6학년","d":"수와 연산","t":"만 몇천 원짜리 상품과 교환할 수 있는 지폐를 찾는다.","m":"시장 놀이 등의 활동을 통해 천 원, 오천 원, 만 원의 상품 가격에 알맞은 지폐를 지불하여 물건과 지폐를 교환함으로써 화폐의 가치를 인식하게 한다. 천 원이나 만 원과 같은 지폐의 액면가는 고유 명칭이나 단위로 이해하고 천 원 이상부터 2만 원 미만의 범위에서만 상품 가격을 다룬다.","n":[],"p":161,"b":3},{"c":"[6수학02-01]","k":"기본","sk":"","s":"수학","g":"초등학교 5~6학년","d":"도형","t":"교실 및 생활 주변의 사물을 관찰하여 여러 가지 평면 모양을 찾는다.","m":"생활 주변의 사물을 관찰하고 사물의 형태 중 일부분에서 평면 모양을 찾게 한다. 주변의 사물은 입체 모양이기 때문에 평면 모양을 찾기 위해서는 입체 모양을 구성하는 일부분인 평면에 초점을 맞추게 한다. 학생에게 익숙한 구체물을 활용하여 모양을 인식하기 위한 여러 가지 활동이 동기화될 수 있게 유도한다.","n":[],"p":162,"b":3},{"c":"[6수학02-02]","k":"기본","sk":"","s":"수학","g":"초등학교 5~6학년","d":"도형","t":"동그라미, 네모, 세모 등의 여러 가지 평면 모양을 탐색한다.","m":"생활 주변 사물에 포함된 평면 모양을 통해 동그라미, 네모, 세모 모양의 특징을 관찰하고, 조작하는 과정을 통하여 각 모양의 특징을 인식하게 한다. 이러한 일련의 활동을 하면서 동그라미, 네모, 세모 모양 등의 여러 가지 평면 모양에 대한 기본적인 이해를 하게 한다.","n":[],"p":162,"b":3},{"c":"[6수학02-03]","k":"기본","sk":"","s":"수학","g":"초등학교 5~6학년","d":"도형","t":"직관적 비교를 통하여 동그라미, 네모, 세모 모양을 분류한다.","m":"생활 주변의 사물에 포함된 평면 모양의 특징을 인식하고, 모양의 생김새나 특징에 따라 공통점을 찾아 직관적으로 비교하여 비슷한 모양끼리 분류하게 한다.","n":[],"p":162,"b":3},{"c":"[6수학02-04]","k":"기본","sk":"","s":"수학","g":"초등학교 5~6학년","d":"도형","t":"동그라미, 네모, 세모 등의 평면 모양을 다양한 방법으로 만들거나 그린다.","m":"평면 모양을 만들거나 그리면서 평면 모양에 대한 이해를 높인다. 동그라미, 네모, 세모 모양을 여러 가지 방법으로 만들거나 그리는 과정을 통하여 여러 가지 평면 모양의 형태를 직관적으로 이해하고 도형의 기초가 되는 모양이 우리 생활에 밀접하게 연관되어 있음을 알게 한다.","n":[],"p":162,"b":3},{"c":"[6수학02-05]","k":"기본","sk":"","s":"수학","g":"초등학교 5~6학년","d":"도형","t":"여러 가지 평면 모양을 활용하여 모양을 만들거나 꾸민다.","m":"동그라미, 네모, 세모 등의 평면 모양을 활용하여 심미성이 있는 형태를 만들거나 꾸미면서 여러 가지 모양의 아름다움을 느낄 수 있게 한다. 친구와 함께 여러 가지 평면 모양을 활용하여 작품을 만들거나 공간을 꾸미는 활동을 통해 함께 학습하는 즐거움을 느끼게 한다.","n":[],"p":162,"b":3},{"c":"[6수학02-06]","k":"기본","sk":"","s":"수학","g":"초등학교 5~6학년","d":"도형","t":"사물의 위치, 방향, 거리를 파악하여 표현한다.","m":"현재 학생 자신이 속해 있는 장소를 중심으로 여러 가지 사물의 위치, 방향, 거리를 경험한다. 다양하고 반복적인 경험을 하면서 자연스럽게 공간과 관련된 개념과 용어를 정확하게 인식할 수 있게 하고, 자신의 위치를 중심으로 떨어져 있는 여러 가지 사물의 위치, 방향, 거리를 알맞은 용어를 사용하여 표현할 수 있게 한다.","n":[],"p":163,"b":3},{"c":"[6수학02-07]","k":"기본","sk":"","s":"수학","g":"초등학교 5~6학년","d":"도형","t":"위치, 방향, 거리에 맞게 물건을 옮긴다.","m":"위치, 방향, 거리에 맞게 물건을 옮겨 보면서 자연스럽게 공간 감각을 익히게 한다. 더불어 실제 생활의 맥락에서 지시에 따라 물건을 옮겨 보며 공간 감각을 실용적으로 활용하게 한다.","n":[],"p":163,"b":3},{"c":"[6수학03-01]","k":"기본","sk":"","s":"수학","g":"초등학교 5~6학년","d":"측정","t":"길이(cm)의 단위를 알고 측정 도구(자 등)를 사용하여 길이를 측정한다.","m":"길이를 나타내는 표준 단위 cm가 표시된 다양한 물건과 상황, 환경 등을 탐색하여 표준 단위 cm를 알게 한다. 자의 사용법을 익혀 여러 가지 생활 속 구체물의 길이를 측정하고 학생이 추측한 구체물의 길이와 실제 길이의 차이를 비교하며 길이에 대한 양적 감각을 익히게 한다.","n":["장애 정도가 심한 학생의 경우 일상생활 속 표준 단위가 표시된 여러 가지 물건을 살펴보고 표준 단위가 우리 생활에서 다양한 방식으로 사용되고 있다는 것을 인식하게 한다. 그리고 물건에 표시된 표준 단위를 나타내는 수치와 표시 내용을 쉽게 파악할 수 있도록 주변과 구분되는 색, 글자의 크기, 진하기 등의 시각 변별 요소와 함께 안내하거나 표준 단위가 표시된 위치에 붙일 수 있는 똑같은 모양의 스티커를 제공하고 붙이게 한다.","길이 활동은 제시된 물체의 한쪽 끝에서 다른 한끝까지의 길이를 일정한 간격의 길이가 주어진 블록, 붙임딱지 등을 사용하는 간접 측정 방식으로 경험하게 한다. 그리고 들이 활동은 일정한 양의 공간이 있는 여러 가지 용기에 물을 부어 끝까지 채워보는 활동을 통해 들이의 개념을 인식하게 하고, 1L가 표시된 여러 가지 용기에 물을 채우는 활동을 통해 용기의 모양이 달라도 같은 양의 물이 들어갈 수 있음을 경험하게 한다."],"p":164,"b":3},{"c":"[6수학03-02]","k":"기본","sk":"","s":"수학","g":"초등학교 5~6학년","d":"측정","t":"들이(L)의 단위를 알고 측정 도구(비커 등)를 사용하여 들이를 측정한다.","m":"들이를 나타내는 표준 단위 L가 사용되는 다양한 물건과 환경 상황을 탐색하여 표준 단위 L를 알게 한다. 여러 가지 물체에 물을 가득 채워 보는 활동을 통해 들이 개념을 이해하고 들이의 측정 도구인 비커의 사용법을 익혀 여러 가지 물체의 들이를 측정하게 한다. 그리고 측정하기 전 자신이 추측한 용기의 들이와 실제 들이와의 차이를 비교하며 들이에 대한 양적 감각을 익히게 한다.","n":["장애 정도가 심한 학생의 경우 일상생활 속 표준 단위가 표시된 여러 가지 물건을 살펴보고 표준 단위가 우리 생활에서 다양한 방식으로 사용되고 있다는 것을 인식하게 한다. 그리고 물건에 표시된 표준 단위를 나타내는 수치와 표시 내용을 쉽게 파악할 수 있도록 주변과 구분되는 색, 글자의 크기, 진하기 등의 시각 변별 요소와 함께 안내하거나 표준 단위가 표시된 위치에 붙일 수 있는 똑같은 모양의 스티커를 제공하고 붙이게 한다.","길이 활동은 제시된 물체의 한쪽 끝에서 다른 한끝까지의 길이를 일정한 간격의 길이가 주어진 블록, 붙임딱지 등을 사용하는 간접 측정 방식으로 경험하게 한다. 그리고 들이 활동은 일정한 양의 공간이 있는 여러 가지 용기에 물을 부어 끝까지 채워보는 활동을 통해 들이의 개념을 인식하게 하고, 1L가 표시된 여러 가지 용기에 물을 채우는 활동을 통해 용기의 모양이 달라도 같은 양의 물이 들어갈 수 있음을 경험하게 한다."],"p":164,"b":3},{"c":"[6수학03-03]","k":"기본","sk":"","s":"수학","g":"초등학교 5~6학년","d":"측정","t":"다양한 형태의 시계를 경험하고 시각을 ‘몇 시’, ‘몇 시 30분’으로 나타낸다.","m":"다양한 형태의 시계를 탐색하여 공통적인 구성 요소를 파악하고 시계에 표시된 내용을 읽는 방법을 익혀 제시된 시각을 정확하게 읽게 한다. 일상생활과 관련된 1시간, 30분 단위의 시각을 시계를 통해 확인하고 같은 시각이 나타난 시계를 찾아보거나 활동에 표시된 시각을 보고 시계를 조작하여 같은 시각으로 나타내는 등 다양한 방식으로 시각을 나타내고 ‘몇 시’, ‘몇 시 30분’으로 표현하게 한다.","n":["장애 정도가 심한 학생의 경우 학생이 쉽게 조작할 수 있는 아날로그 시계와 디지털 시계 모형을 활용하여 시계에 대한 경험을 충분히 제공한다. 아날로그 시계 모형에 제시된 시침, 분침, 수 등의 구성 요소 관찰을 통해 시계의 구조에 대한 이해를 높일 수 있으며, 아날로그 시계의 바늘을 돌려보거나 조작 활동을 통해 시계에 대한 흥미와 관심을 높인다. 그리고 디지털 시계 모형은 교사가 제시한 시각을 보고 똑같은 시각으로 나타내는 활동을 통해 시간의 표현활동에 쉽게 참여하게 한다."],"p":165,"b":3},{"c":"[6수학03-04]","k":"기본","sk":"","s":"수학","g":"초등학교 5~6학년","d":"측정","t":"1일, 1주일을 알고 날짜를 ‘며칠’, ‘무슨 요일’로 나타낸다.","m":"1일은 하루 동안의 시간이라는 것을 알게 하고, 여러 가지 형태의 주간 일정표를 탐색하여 표에 제시된 ‘일’과 ‘요일’ 항목을 파악하게 한다. 주간 일정표의 한 칸은 1일이며, 제시된 내용은 하루의 활동이라는 것을 알게 한다. 일정표의 가장 왼쪽부터 요일을 차례대로 세어보는 활동을 통해 1주일이 7일로 이루어져 있음을 알고, ‘일’과 ‘요일’의 연관성을 통해 일정표에 나타난 특정한 활동이 ‘며칠’, ‘무슨 요일’에 일어났는지 표현하게 한다.","n":["장애 정도가 심한 학생의 경우 주간 일정표를 교사 또는 친구들과 함께 꾸며 보는 활동으로 구성한다. 표에는 월요일부터 일요일까지의 요일 항목을 순차적으로 제시하되 요일별로 색을 다르게 구성하여 직관적 차이를 분명하게 제시한다. 요일별 활동은 제시된 내용을 친구들과 함께 요일별 순서에 따라 반복적, 규칙적, 순차적으로 나타내게 하며 요일의 이름과 순서를 활동 속에서 자연스럽게 익히게 한다."],"p":165,"b":3},{"c":"[6수학04-01]","k":"기본","sk":"","s":"수학","g":"초등학교 5~6학년","d":"규칙성","t":"생활 주변의 두세 가지 물체의 배열에서 규칙을 찾는다.","m":"이전 학년군에서 간단히 반복되는 규칙을 모방하고, 발견하며, 다음에 올 것을예측하게 한 것을 바탕으로 좀 더 복잡한 형태의 규칙을 발견할 수 있게 한다. 물체는 두 가지 혹은 세 가지를 활용하고, 색, 모양, 크기 등 특징이 단순한 물체의 배열에서 규칙을 찾게 한다. 먼저 두세 가지 물체의 배열에서 규칙이 있는 것과 없는 것을 구분하게 한다. 나아가 반복되는 배열의 일정한 부분을 보고 규칙을 찾고, 다음에 올 것을 예측해 보게 한다.","n":[],"p":166,"b":3},{"c":"[6수학04-02]","k":"기본","sk":"","s":"수학","g":"초등학교 5~6학년","d":"규칙성","t":"정해진 규칙에 따라 두세 가지 물체를 배열한다.","m":"정해진 규칙에 따라 두세 가지 물체를 배열하게 한다. 먼저 ‘ABAB’ 형태와 같이 간단한 규칙에서 시작하여, 물체의 개수를 동일하게 늘려 ‘AABBAABB’ 형태, 두 가지 물체의 개수를 서로 다르게 변화시켜 ‘AABAAB’ 형태로 물체를 규칙에 따라 배열하게 한다. 그리고 물체의 종류를 세 가지로 늘려 ‘ABCABC’와 같은 형태로 정해진 규칙에 맞게 물체를 배열하게 한다.","n":[],"p":166,"b":3},{"c":"[6수학04-03]","k":"기본","sk":"","s":"수학","g":"초등학교 5~6학년","d":"규칙성","t":"생활 주변의 두세 가지 무늬의 배열에서 규칙을 찾는다.","m":"구체물을 조작하며 반복되는 물체의 배열에서 규칙을 찾는 활동에서 나아가 반 구체물인 무늬의 배열에서 규칙을 찾을 수 있게 한다. 옷, 포장지, 타일의 무늬 등 생활 주변에서 자주 접하는 규칙적 무늬의 배열을 활용할 수 있다. 먼저 두 가지 규칙적인 무늬의 배열을 활용한 간단한 규칙에서 시작하여 무늬의 배열 형태를 바꾸거나 세 가지로 무늬의 수를 늘려 좀 더 복잡한 형태의 규칙적인 무늬의 배열에서 규칙을 발견할 수 있게 한다.","n":[],"p":166,"b":3},{"c":"[6수학04-04]","k":"기본","sk":"","s":"수학","g":"초등학교 5~6학년","d":"규칙성","t":"여러 가지 모양과 색 등을 활용하여 규칙적인 무늬를 꾸민다.","m":"여러 가지 모양과 색 등을 활용하여 규칙적인 무늬를 꾸미게 한다. 반복되는 무늬의 일정 부분을 보고 규칙을 찾아 무늬를 완성할 수 있게 한다. 이때에는 포장지 꾸미기와 책 표지 꾸미기, 티셔츠 꾸미기와 벽지 꾸미기 등 학생에게 친숙하면서도 실생활과 연관된 활동의 기회를 제공한다. 이러한 활동은 규칙적인 무늬가 주는 아름다움과 수학의 유용성을 인식하게 한다.","n":[],"p":166,"b":3},{"c":"[6수학05-01]","k":"기본","sk":"","s":"수학","g":"초등학교 5~6학년","d":"자료와 가능성","t":"세 개 이상의 모음으로 분류된 자료를 보고 한 가지 기준을 찾는다.","m":"세 개 이상의 모음으로 분류된 자료를 탐색하고 모음별 특징이나 속성을 비교하며 한 가지 기준을 찾게 한다. 분류의 기준은 분명하게 구별될 수 있는 것에서 종류, 쓰임 등으로 확장하고 분류의 자료는 여러 가지 실생활 물건부터 지역사회, 자연 환경 소재 등으로 제시하게 한다.","n":[],"p":167,"b":3},{"c":"[6수학05-02]","k":"기본","sk":"","s":"수학","g":"초등학교 5~6학년","d":"자료와 가능성","t":"자료를 한 가지 기준에 따라 세 개 이상의 모음으로 분류한다.","m":"학생이 정한 한 가지 기준으로 자료를 세 개 이상의 모음으로 분류하고, 각각의 모음에 들어있는 자료를 탐색하여 자료의 쓰임, 용도 등의 공통된 특성을 확인하게 한다. 그리고 세 개 이상의 모음에 들어있는 자료의 수를 각각 세어보고 비교하며 그 결과를 표현하게 한다.","n":[],"p":167,"b":3},{"c":"[6수학05-03]","k":"기본","sk":"","s":"수학","g":"초등학교 5~6학년","d":"자료와 가능성","t":"분류한 자료를 표로 나타낸다.","m":"한 가지 기준에 따라 조사하고 분류한 자료를 표로 정리하여 표의 구성 요소와항목별 자료의 위치를 자연스럽게 파악하게 한다. 그리고 표 양식을 정리하는 방법을 익혀 분류한 자료를 표로 정리하게 하되, 분류된 자료의 수가 늘어나 정리할 자료의 양이 증가하여도 표로 나타내는 방법이 같다는 것을 인식하게 한다.","n":[],"p":168,"b":3},{"c":"[9수학01-01]","k":"기본","sk":"","s":"수학","g":"중학교 1~3학년","d":"수와 연산","t":"100의 개념을 알고, 몇백을 센다.","m":"십 모형을 활용하여 십 모형 10개가 모여 백 모형 하나가 됨을 살펴보며 100 개념을 도입한다. 세 자리 수를 읽고 쓸 때는 100과 10의 묶음과 낱개로 나타내고 위치적 기수법을 바탕으로 수를 이해하도록 한다. 세 자리 수를 반 구체물로 표현하고 서로 다른 수의 크기를 비교한다.","n":[],"p":169,"b":3},{"c":"[9수학01-02]","k":"기본","sk":"","s":"수학","g":"중학교 1~3학년","d":"수와 연산","t":"일, 십, 백의 자릿값을 알고, 세 자리 수를 읽고 쓴다.","m":"십 모형을 활용하여 십 모형 10개가 모여 백 모형 하나가 됨을 살펴보며 100 개념을 도입한다. 세 자리 수를 읽고 쓸 때는 100과 10의 묶음과 낱개로 나타내고 위치적 기수법을 바탕으로 수를 이해하도록 한다. 세 자리 수를 반 구체물로 표현하고 서로 다른 수의 크기를 비교한다.","n":[],"p":169,"b":3},{"c":"[9수학01-03]","k":"기본","sk":"","s":"수학","g":"중학교 1~3학년","d":"수와 연산","t":"세 자리 수의 크기를 비교한다.","m":"십 모형을 활용하여 십 모형 10개가 모여 백 모형 하나가 됨을 살펴보며 100 개념을 도입한다. 세 자리 수를 읽고 쓸 때는 100과 10의 묶음과 낱개로 나타내고 위치적 기수법을 바탕으로 수를 이해하도록 한다. 세 자리 수를 반 구체물로 표현하고 서로 다른 수의 크기를 비교한다.","n":[],"p":169,"b":3},{"c":"[9수학01-04]","k":"기본","sk":"","s":"수학","g":"중학교 1~3학년","d":"수와 연산","t":"실생활에서 활용되는 몇백의 덧셈과 뺄셈의 의미를 안다.","m":"생활 속에서 활용되는 몇백의 덧셈과 뺄셈 연산의 다양한 상황을 살펴봄으로써 이후 받아올림이 없는 (몇백)+(몇백)과 받아내림이 없는 (몇백)-(몇백)에 대한 흥미와 관심을 가지게 한다.","n":[],"p":170,"b":3},{"c":"[9수학01-05]","k":"기본","sk":"","s":"수학","g":"중학교 1~3학년","d":"수와 연산","t":"받아올림(내림)이 없는 몇백의 덧셈과 뺄셈을 한다.","m":"실생활과 관련된 연산 활동 장면을 제시하고 구체물과 반 구체물을 조작하여 연산 문제를 해결해 본다. 가로셈 및 세로셈을 사용하여 식을 세워보고, 계산 도구를 활용하는 경우 덧셈, 뺄셈 연산의 기능적인 측면에 중점을 두어 지도한다.","n":[],"p":170,"b":3},{"c":"[9수학01-06]","k":"기본","sk":"","s":"수학","g":"중학교 1~3학년","d":"수와 연산","t":"받아올림(내림)이 없는 몇백의 덧셈, 뺄셈과 관련된 실생활 문제를 해결한다.","m":"실생활과 관련된 연산 활동 장면을 제시하고 구체물과 반 구체물을 조작하여 연산 문제를 해결해 본다. 가로셈 및 세로셈을 사용하여 식을 세워보고, 계산 도구를 활용하는 경우 덧셈, 뺄셈 연산의 기능적인 측면에 중점을 두어 지도한다.","n":[],"p":170,"b":3},{"c":"[9수학01-07]","k":"기본","sk":"","s":"수학","g":"중학교 1~3학년","d":"수와 연산","t":"받아올림이 있는 한 자리 수의 덧셈을 한다.","m":"받아올림이 있는 (몇)+(몇)은 10의 보수 개념을 바탕으로 10개의 칸이 그려진 그림 등을 활용하여 구체물과 반 구체물을 조작하여 한 자리 수끼리의 덧셈 연산을 충분히 연습하도록 한 뒤 가로식과 세로식을 도입한다.","n":[],"p":170,"b":3},{"c":"[9수학01-08]","k":"기본","sk":"","s":"수학","g":"중학교 1~3학년","d":"수와 연산","t":"실생활에서 활용되는 곱셈의 의미를 안다.","m":"생활 속에서 곱셈이 활용되는 상황을 제시하고 곱셈에 대한 흥미와 관심을 가지는 데 중점을 둔다. 곱셈의 의미는 배의 개념과 동수누가를 통해 다룬다. 곱셈구구는 반복 학습으로 익히게 하되 노래나 놀이를 통해 학생의 흥미를 높인다. 계산 도구를 활용하는 경우 계산기를 조작하여 곱셈을 연산하게 한다.","n":[],"p":170,"b":3},{"c":"[9수학01-09]","k":"기본","sk":"","s":"수학","g":"중학교 1~3학년","d":"수와 연산","t":"곱셈구구의 원리를 알고 1단부터 9단까지 나타낸다.","m":"생활 속에서 곱셈이 활용되는 상황을 제시하고 곱셈에 대한 흥미와 관심을 가지는 데 중점을 둔다. 곱셈의 의미는 배의 개념과 동수누가를 통해 다룬다. 곱셈구구는 반복 학습으로 익히게 하되 노래나 놀이를 통해 학생의 흥미를 높인다. 계산 도구를 활용하는 경우 계산기를 조작하여 곱셈을 연산하게 한다.","n":[],"p":170,"b":3},{"c":"[9수학01-10]","k":"기본","sk":"","s":"수학","g":"중학교 1~3학년","d":"수와 연산","t":"곱셈구구를 활용하여 실생활 문제를 해결한다.","m":"생활 속에서 곱셈이 활용되는 상황을 제시하고 곱셈에 대한 흥미와 관심을 가지는 데 중점을 둔다. 곱셈의 의미는 배의 개념과 동수누가를 통해 다룬다. 곱셈구구는 반복 학습으로 익히게 하되 노래나 놀이를 통해 학생의 흥미를 높인다. 계산 도구를 활용하는 경우 계산기를 조작하여 곱셈을 연산하게 한다.","n":[],"p":170,"b":3},{"c":"[9수학01-11]","k":"기본","sk":"","s":"수학","g":"중학교 1~3학년","d":"수와 연산","t":"지페(오만 원)의 액면가를 읽고 크기를 비교한다.","m":"지폐(오만 원)를 액면가가 작은 지폐로 교환하는 활동을 한다. 시장 놀이나 지역사회 현장 체험 활동을 통해 몇만 몇천 원짜리 상품 가격에 알맞은 지폐를 제시하여 상품과 지폐를 교환함으로써 화폐의 가치를 인식하는 데 중점을 둔다. 오만 원권 지폐의 액면가는 고유 명칭이나 단위로 인식하도록 한다.","n":["장애 정도가 심한 학생의 경우 오만 원권 지폐의 앞 뒷면을 크게 확대한 사진을 통해 색깔과 그림을 살펴보고, 오만 원권 지폐를 상품으로 교환하는 과정을 통해 화폐의 교환 기능과 가치를 알게 한다."],"p":171,"b":3},{"c":"[9수학01-12]","k":"기본","sk":"","s":"수학","g":"중학교 1~3학년","d":"수와 연산","t":"지페(오만 원)를 다른 액면가의 지폐로 교환한다.","m":"지폐(오만 원)를 액면가가 작은 지폐로 교환하는 활동을 한다. 시장 놀이나 지역사회 현장 체험 활동을 통해 몇만 몇천 원짜리 상품 가격에 알맞은 지폐를 제시하여 상품과 지폐를 교환함으로써 화폐의 가치를 인식하는 데 중점을 둔다. 오만 원권 지폐의 액면가는 고유 명칭이나 단위로 인식하도록 한다.","n":["장애 정도가 심한 학생의 경우 오만 원권 지폐의 앞 뒷면을 크게 확대한 사진을 통해 색깔과 그림을 살펴보고, 오만 원권 지폐를 상품으로 교환하는 과정을 통해 화폐의 교환 기능과 가치를 알게 한다."],"p":171,"b":3},{"c":"[9수학01-13]","k":"기본","sk":"","s":"수학","g":"중학교 1~3학년","d":"수와 연산","t":"몇만 몇천 원짜리 상품과 교환할 수 있는 지폐를 찾는다.","m":"지폐(오만 원)를 액면가가 작은 지폐로 교환하는 활동을 한다. 시장 놀이나 지역사회 현장 체험 활동을 통해 몇만 몇천 원짜리 상품 가격에 알맞은 지폐를 제시하여 상품과 지폐를 교환함으로써 화폐의 가치를 인식하는 데 중점을 둔다. 오만 원권 지폐의 액면가는 고유 명칭이나 단위로 인식하도록 한다.","n":["장애 정도가 심한 학생의 경우 오만 원권 지폐의 앞 뒷면을 크게 확대한 사진을 통해 색깔과 그림을 살펴보고, 오만 원권 지폐를 상품으로 교환하는 과정을 통해 화폐의 교환 기능과 가치를 알게 한다."],"p":171,"b":3},{"c":"[9수학01-14]","k":"기본","sk":"","s":"수학","g":"중학교 1~3학년","d":"수와 연산","t":"대용 화폐를 활용하여 상품을 교환한다.","m":"동전과 지폐와 같은 전통적인 화폐뿐만 아니라 현대에 많이 활용되는 대용 화폐를 도입한다. 대표적으로 카드와 연결된 계좌 안에 일정 금액을 사전에 넣어두고 사용할 수 있는 현금 카드의 개념을 알아보고, 현금 카드의 사용 방법을 동영상, 사진, 또는 사용하는 순서도 등을 통해 알아본다. 그 외 상품권이나 쿠폰(예: 바코드 및 QR코드 형태) 등 여러 가지 화폐의 종류와 사용 방법에 대해 살펴본다.","n":["장애 정도가 심한 학생의 경우 대용 화폐(예: 카드)로 전통적인 화폐를 대신하여 상품을 구입할 수 있음을 알게 하고, 실생활에서 직접 여러 가지 대용 화폐를 활용해 보는 경험을 하게 한다. 대용 화폐를 사용하는 순서를 시각화한 순서도 등을 통해 전체 순서를 단계별로 제시한 뒤 학생이 한 단계씩 따라서 활용하게 한다."],"p":171,"b":3},{"c":"[9수학02-01]","k":"기본","sk":"","s":"수학","g":"중학교 1~3학년","d":"도형","t":"사각형, 삼각형, 원을 탐색한다.","m":"생활 주변의 사물에서 사각형, 삼각형, 원을 찾고 예시적 정의를 통하여 사각형, 삼각형, 원을 약속하고 명명한다. 사각형, 삼각형, 원의 모양을 탐색하고 특징을 비교하며 도형과 이름을 연결하게 한다. 학생에게 익숙한 구체물을 학습의 소재로 활용하여 도형이 실제 생활에 깊게 연관되어 있음을 인식하게 한다.","n":[],"p":172,"b":3},{"c":"[9수학02-02]","k":"기본","sk":"","s":"수학","g":"중학교 1~3학년","d":"도형","t":"직관적 비교를 통하여 사각형, 삼각형, 원을 분류한다.","m":"사각형, 삼각형, 원을 찾아 각 도형의 형태에 따라 분류하는 활동을 하면서 사각형, 삼각형, 원의 의미와 특징을 파악하게 한다. 더불어 사각형, 삼각형, 원의 예인 것과 예가 아닌 것을 비교하며 여러 가지 도형을 직관적으로 이해하게 한다. 도형의 종류를 명명하여 지도하는 것을 지양하고 직접적인 조작 활동을 통하여 여러 가지 도형의 형태를 구별하는 데 중점을 둔다.","n":[],"p":172,"b":3},{"c":"[9수학02-03]","k":"기본","sk":"","s":"수학","g":"중학교 1~3학년","d":"도형","t":"사각형, 삼각형, 원의 특성을 이해한다.","m":"사각형, 삼각형, 원을 찾아 각 도형의 형태에 따라 분류하는 활동을 하면서 사각형, 삼각형, 원의 의미와 특징을 파악하게 한다. 더불어 사각형, 삼각형, 원의 예인 것과 예가 아닌 것을 비교하며 여러 가지 도형을 직관적으로 이해하게 한다. 도형의 종류를 명명하여 지도하는 것을 지양하고 직접적인 조작 활동을 통하여 여러 가지 도형의 형태를 구별하는 데 중점을 둔다.","n":[],"p":172,"b":3},{"c":"[9수학02-04]","k":"기본","sk":"","s":"수학","g":"중학교 1~3학년","d":"도형","t":"다양한 방법으로 사각형, 삼각형, 원을 만들거나 그린다.","m":"모양자나 컴퍼스 등과 같이 도형을 그리는 도구를 활용하여 사각형, 삼각형, 원을 그리거나 다양한 방법으로 사각형, 삼각형, 원 등의 평면도형을 완성하며 평면도형에 대한 인식과 감각을 기르게 한다.","n":[],"p":173,"b":3},{"c":"[9수학02-05]","k":"기본","sk":"","s":"수학","g":"중학교 1~3학년","d":"도형","t":"여러 가지 도형을 활용하여 모양을 만들거나 꾸민다.","m":"여러 가지 도형을 활용하여 아름다운 모양이나 형태를 만들거나 꾸미는 활동을 직접 경험하거나 컴퓨터 소프트웨어를 활용하여 도형을 만드는 활동, 친구와 함께 공동의 작품을 만드는 활동 등을 하면서 협동의 즐거움과 도형의 아름다움을 느끼게 한다.","n":[],"p":173,"b":3},{"c":"[9수학02-06]","k":"기본","sk":"","s":"수학","g":"중학교 1~3학년","d":"도형","t":"쌓기나무를 이용하여 자유롭게 늘어놓거나 쌓는다.","m":"쌓기나무를 이용하여 자유롭게 조작하면서 쌓기나무에 익숙해지게 한다. 쌓기나무를 한 줄로 늘어놓거나 높이 쌓아 보는 등 다양한 방식으로 자유롭게 조작하며 쌓기나무의 모양을 알아보고 공간에 대한 흥미와 관심을 가지게 한다.","n":[],"p":173,"b":3},{"c":"[9수학02-07]","k":"기본","sk":"","s":"수학","g":"중학교 1~3학년","d":"도형","t":"입체 모양을 보고 똑같이 쌓기나무로 쌓는다.","m":"쌓기나무로 만든 입체 모양을 보고, 똑같은 모양으로 쌓기나무를 쌓고 쌓기나무와 입체 모양 간의 위치, 방향 등의 관계와 같은 공간에 대한 경험을 통하여 실생활에서 접할 수 있는 공간 문제를 해결할 수 있게 한다.","n":[],"p":173,"b":3},{"c":"[9수학02-08]","k":"기본","sk":"","s":"수학","g":"중학교 1~3학년","d":"도형","t":"쌓기나무로 만든 입체 모양에 사용된 쌓기나무의 개수를 센다.","m":"입체 모양에 사용된 쌓기나무의 개수를 세어 보면서 생활 속 물건의 개수를 세고, 상황에 맞게 쌓고 옮기는 능력을 기르게 한다. 단순히 쌓기나무 개수를 세는 것에 그치지 말고 쌓기나무의 위치를 옮기며 다른 입체 모양을 만들면서 공간 감각을 익히게 한다.","n":[],"p":173,"b":3},{"c":"[9수학03-01]","k":"기본","sk":"","s":"수학","g":"중학교 1~3학년","d":"측정","t":"길이(m)의 단위를 알고 측정 도구(줄자 등)를 사용하여 길이를 측정한다.","m":"표준 단위인 cm와 m가 사용되는 여러 가지 물건과 상황을 알아보고 표준 단위 m를 알게 한다. 이후 표준 단위 m를 측정할 수 있는 줄자 등의 사용법을 익혀 주변 사물의 길이를 측정하되, 1m 구체물의 측정 활동을 충분히 실시하여 1m에 대한 감각을 익힌 후 ‘몇 m’, ‘몇 m, 몇 cm’ 등의 활동으로 확장하며 길이의 양감을 익히게 한다.","n":["장애 정도가 심한 학생의 경우 이전 학년군에서 배운 활동을 활용하여 50cm,10cm 등의 일정한 길이의 끈이나 스티커 등을 반복적으로 붙여 1m의 길이를 경험하게 한다. 그리고 학생의 신체활동을 통해 1m 길이를 나타내거나 비교하게 하고, 가정과 학교 등의 환경에서 1m 길이에 해당하는 물건의 크기와 위치에 대해 알아보는 등 1m에 대한 길이 감각을 경험하게 한다."],"p":174,"b":3},{"c":"[9수학03-02]","k":"기본","sk":"","s":"수학","g":"중학교 1~3학년","d":"측정","t":"무게(kg)의 단위를 알고 측정 도구(저울 등)를 사용하여 무게를 측정한다.","m":"생활 속에서 무게를 나타내는 표준 단위 kg이 사용되는 다양한 물건과 상황을 탐색하여 표준 단위 kg을 알게 한다. 이후 표준 단위 kg을 측정할 수 있는 저울의 사용법을 익혀 물체의 무게를 측정하되, 1kg 구체물의 측정 활동을 충분히 실시하여 1kg에 대한 감각을 익힌 후 ‘몇 kg’등의 활동으로 확장하며 무게의 양감을 익히게 한다.","n":["장애 정도가 심한 학생의 경우 먼저 일상생활 속 물건 중 무게가 1kg에 해당하는 물체를 제시한다. 이와 함께 물체를 한 손이나 양손으로 들어보게 하거나 친구에게 전달하게 하는 등 1kg에 대한 다양한 신체 경험의 기회를 제공한다. 그리고 물건 한 개의 무게가 1kg인 경우와 여러 물건의 합이 1kg인 것을 각각 들어 보고 비교하게 함으로써 물건의 수와 상관없이 일정한 무게 1kg에 대한 무게 감각을 인식하게 한다."],"p":174,"b":3},{"c":"[9수학03-03]","k":"기본","sk":"","s":"수학","g":"중학교 1~3학년","d":"측정","t":"1시간은 60분임을 알고 시간을 ‘몇 분’, ‘몇 시간’으로 나타낸다.","m":"5분, 10분, 30분 단위 일정한 시간이 정해진 놀이 활동을 통해 분 단위 시간을 경험하게 하고, 시계를 보고 1시간은 60분임을 시침과 분침의 이동을 통해 알게 한다. 생활 속 여러 가지 활동의 시작 시각과 끝 시각을 비교하여 활동한 시간을 파악하되, 시간 단위의 변화부터 분 단위의 변화 순서로 구성하고 시침과 분침의 변화를 다양한 방법으로 나타내게 한다.","n":["장애 정도가 심한 학생의 경우 시간 단위 활동은 수업 시간, 점심시간, 쉬는 시간 등 학생에게 자연스럽고 친숙한 상황을 소재로 사용하며 시계 모형을 활용하여 시침의 변화와 함께 색, 크기, 움직임 등의 시각 단서를 충분히 제공하게 한다. 분 단위 활동은 학생의 장애 특성 등을 고려하여 1분, 2분 등의 짧은 시간으로 구성하며 반복적인 활동을 통해 시간을 경험하게 한다."],"p":175,"b":3},{"c":"[9수학03-04]","k":"기본","sk":"","s":"수학","g":"중학교 1~3학년","d":"측정","t":"다양한 형태의 달력을 경험하고 날짜를 ‘몇 월’, ‘몇 월 며칠’로 나타낸다.","m":"다양한 형태의 달력을 탐색하여 구성 요소를 파악하고 달력에 표시된 내용과 날짜 읽는 방법을 익혀 일정을 파악하게 한다. 월별 달력을 관찰하여 1년은 12개월, 1개월은 30일(또는 28일, 31일)로 구성되어 있음을 알게 한다. 그리고 달력에 표시된 행사, 기념일, 공휴일 등의 날짜를 찾아 표시하게 하거나 ‘몇 월’이나 ‘몇 월 며칠’ 등 다양한 방법으로 나타내게 한다.","n":["장애 정도가 심한 학생의 경우 달력을 친구들과 함께 만들고 꾸미는 활동을 통해 달력에 대한 이해와 생활 속 활용 가능성을 경험하게 한다. 달력과 같은 모양의 표 양식을 제공하고 알맞은 항목이나 위치에 수나 문자를 붙이거나 그려 보게 하고, 제작한 달력에서 특정 내용을 찾아 손가락으로 짚어 보거나, 동그라미로 표시하는 등 여러 가지 표현 방법을 활용하게 한다."],"p":175,"b":3},{"c":"[09수학04-01]","k":"기본","sk":"","s":"수학","g":"중학교 1~3학년","d":"규칙성","t":"대응 관계의 의미를 알고 생활 주변에서 대응 관계가 있는 것을 찾는다.","m":"사물을 직접 짝지어 보게 함으로써 대응 관계의 의미를 알게 하고, 생활 주변에서 대응 관계가 있는 것을 찾을 수 있게 한다. 컵 하나에 컵 받침 하나가 필요한 일대일대응에서 시작하여 포장지 한 장에 여러 개의 물건을 넣는 일대다 대응, 농구 경기에서 우리 편의 수와 상대편의 수를 비교하는 다대다 대응 등의 예를 활용할 수 있다. 이는 한 양과 대응하여 변화하는 다른 양의 규칙적 대응 관계를 찾을 수 있게 하는 기초가 된다.","n":[],"p":176,"b":3},{"c":"[09수학04-02]","k":"기본","sk":"","s":"수학","g":"중학교 1~3학년","d":"규칙성","t":"두 양 사이의 대응 관계를 대응표에 나타내고, 규칙을 찾는다.","m":"두 양 사이의 대응 관계를 그림과 수를 활용하여 대응표에 나타내게 한 후 규칙을 찾게 한다. 대응표를 활용하기 전 먼저 구체물을 통한 조작 활동 및 놀이 활동으로 한 양이 변할 때 다른 양이 종속하여 변화하는 것을 직관적으로 인식할 수 있게 한다. 다음으로 두 양 사이의 대응 관계를 간단한 그림을 통해 대응표에 나타내게 하고, 그림을 통한 대응표 활동 후에는 수를 대응표에 표시하게 한 후 대응하는 규칙을 찾게 한다. 이와 함께 주어진 규칙에 따라 하나의 양에 대응하는 다른 양을 찾아 대응표를 완성하게 한다.","n":[],"p":176,"b":3},{"c":"[09수학04-03]","k":"기본","sk":"","s":"수학","g":"중학교 1~3학년","d":"규칙성","t":"한 양이 변할 때 다른 양이 그에 종속하여 변화하는 대응 관계를 추측하고 확인한다.","m":"한 양이 변할 때 다른 양이 그에 종속하여 변화하는 대응 관계를 추측하고 확인하게 한다. 하나의 양이 변화하면 그에 따라 다른 양이 변한다는 것을 이해하게 하고, 이를 통해 하나의 변화하는 양의 값을 알면 주어진 규칙에 의해 대응하는 다른 양의 값을 구할 수 있게 한다. 이러한 활동을 통해 학생은 변화를 가져오는 구성 요소를 파악하고, 미래에 앞으로 일어날 일을 예측하고 변화에 대응할 수 있는 기초를 마련할 수 있다.","n":[],"p":176,"b":3},{"c":"[9수학05-01]","k":"기본","sk":"","s":"수학","g":"중학교 1~3학년","d":"자료와 가능성","t":"두 가지 기준에 따라 자료를 순차적으로 분류한다.","m":"같은 자료의 다양한 분류 상황을 탐색하며 자료는 각각의 기준에 따라 다양한 형태로 분류될 수 있다는 것을 알게 한다. 한 가지 기준으로 분류한 자료에 기준을 추가 제시하여 다시 분류하게 하고, 한 가지 기준으로 분류한 자료와 두 가지 기준으로 분류한 자료의 차이를 비교하게 한다. 분류 기준을 적용할 때는 크기, 색, 모양 등의 명확한 기준을 먼저 적용하고 종류, 쓰임, 용도 등으로 구성하게 한다.","n":[],"p":177,"b":3},{"c":"[9수학05-02]","k":"기본","sk":"","s":"수학","g":"중학교 1~3학년","d":"자료와 가능성","t":"자료를 간단한 그래프로 나타낸다.","m":"간단한 그래프의 소재는 학생들의 관심이나 선호, 요구 등을 고려하여 선정하고 간단한 그래프의 모양, 형태, 내용 등을 탐구하고 조작해 보며 그래프의 구성 요소 및 특징을 파악하게 한다. 그림그래프에 제시된 그림의 크기로 항목별 수량의 많고 적음을 직관적으로 파악하게 하고, 막대그래프에 제시된 막대의 길이로 조사한 항목별 수량과 함께 상대적 크기를 비교하게 한다.","n":[],"p":178,"b":3},{"c":"[9수학05-03]","k":"기본","sk":"","s":"수학","g":"중학교 1~3학년","d":"자료와 가능성","t":"간단한 그래프를 보고 필요한 내용을 찾는다.","m":"여러 가지 그림그래프와 막대그래프를 보고 주제, 항목, 개수 등의 내용 정보를 파악하게 한다. 학생에게 필요한 정보가 포함된 그래프를 선택하여 세부 내용을 찾게 하되, 그림그래프는 특정 항목의 그림을 찾거나 선택하게 하고, 막대그래프는 두 개의 항목 중 더 필요한 것이나 세 개 이상의 항목 중 가장 필요한 것 등의 상대적인 비교 결과를 알게 한다.","n":[],"p":178,"b":3},{"c":"[9수학05-04]","k":"기본","sk":"","s":"수학","g":"중학교 1~3학년","d":"자료와 가능성","t":"놀이로 가능성을 경험한다.","m":"여러 가지 놀이 중 기대할 수 있는 결과의 경우의 수가 2개인 활동으로 시작하며, 어떤 결과가 일어날 것인지 추측해 보고, 일어난 결과와 비교해 보는 활동을 하며 가능성을 인식하게 한다. 이와 함께 놀이에 참여하는 학생이나 도구의 수에 따라 발생할 수 있는 경우의 수가 변할 수 있다는 것을 알게 한다. 그리고 가능성이 커지면 기대하는 일이 자주 나타나고, 가능성이 작아지면 적게 일어난다는 것을 경험하게 한다.","n":[],"p":179,"b":3},{"c":"[12수학01-01]","k":"기본","sk":"","s":"수학","g":"고등학교 1~3학년","d":"수와 연산","t":"1000의 개념을 알고, 몇천을 센다.","m":"백 모형 10묶음이 모여 천 모형 하나가 됨을 살펴보고 1000의 개념을 도입한다. 천씩 묶어서 몇천을 세고, 네 자리 수를 읽고 쓴다. 네 자리 수를 그림으로 나타내어 수의 크기를 비교한다.","n":[],"p":180,"b":3},{"c":"[12수학01-02]","k":"기본","sk":"","s":"수학","g":"고등학교 1~3학년","d":"수와 연산","t":"일, 십, 백, 천의 자릿값을 알고, 네 자리 수를 읽고 쓴다.","m":"백 모형 10묶음이 모여 천 모형 하나가 됨을 살펴보고 1000의 개념을 도입한다. 천씩 묶어서 몇천을 세고, 네 자리 수를 읽고 쓴다. 네 자리 수를 그림으로 나타내어 수의 크기를 비교한다.","n":[],"p":180,"b":3},{"c":"[12수학01-03]","k":"기본","sk":"","s":"수학","g":"고등학교 1~3학년","d":"수와 연산","t":"네 자리 수의 계열을 이해하고, 수의 크기를 비교한다.","m":"백 모형 10묶음이 모여 천 모형 하나가 됨을 살펴보고 1000의 개념을 도입한다. 천씩 묶어서 몇천을 세고, 네 자리 수를 읽고 쓴다. 네 자리 수를 그림으로 나타내어 수의 크기를 비교한다.","n":[],"p":180,"b":3},{"c":"[12수학01-04]","k":"기본","sk":"","s":"수학","g":"고등학교 1~3학년","d":"수와 연산","t":"생활 속의 다양한 명명수를 읽는다.","m":"백 모형 10묶음이 모여 천 모형 하나가 됨을 살펴보고 1000의 개념을 도입한다. 천씩 묶어서 몇천을 세고, 네 자리 수를 읽고 쓴다. 네 자리 수를 그림으로 나타내어 수의 크기를 비교한다. 실생활에서 활용되는 우편 번호, 전화번호, 계좌 번호 등과 같은 다양한 명명수를 제시하고 각 명명수의 특징에 맞게 읽는 방법을 살펴본다.","n":[],"p":180,"b":3},{"c":"[12수학01-05]","k":"기본","sk":"","s":"수학","g":"고등학교 1~3학년","d":"수와 연산","t":"생활 속에서 접하는 여러 가지 수를 찾아 읽는다.","m":"분수, 소수, 음의 정수 등의 여러 가지 수를 개념적으로 접근하기보다는 생활 속에서 여러 가지 수가 상황에 따라 어떻게 활용되는지 파악하게 한다. 피자 자르기, 색 종이띠 자르기 등의 조작 활동을 통해 간단한 분수 또는 소수를 표현하여 수의 크기를 파악하게 한다. 그 외 생활 속에서 분수, 소수, 음의 정수가 적힌 상품이나 상황을 다양하게 찾아보고 경험하게 한다.","n":[],"p":180,"b":3},{"c":"[12수학01-06]","k":"기본","sk":"","s":"수학","g":"고등학교 1~3학년","d":"수와 연산","t":"생활 속에서 접하는 여러 가지 수의 의미를 알고 활용한다.","m":"분수, 소수, 음의 정수 등의 여러 가지 수를 개념적으로 접근하기보다는 생활 속에서 여러 가지 수가 상황에 따라 어떻게 활용되는지 파악하게 한다. 피자 자르기, 색 종이띠 자르기 등의 조작 활동을 통해 간단한 분수 또는 소수를 표현하여 수의 크기를 파악하게 한다. 그 외 생활 속에서 분수, 소수, 음의 정수가 적힌 상품이나 상황을 다양하게 찾아보고 경험하게 한다.","n":[],"p":180,"b":3},{"c":"[12수학01-07]","k":"기본","sk":"","s":"수학","g":"고등학교 1~3학년","d":"수와 연산","t":"실생활에서 활용되는 몇천의 덧셈과 뺄셈의 의미를 안다.","m":"생활 속에서 활용되는 몇천의 덧셈과 뺄셈의 다양한 상황을 살펴봄으로써 이후 받아올림이 없는 (몇천)+(몇천)과 받아내림이 없는 (몇천)-(몇천)에 대한 흥미와 관심을 높인다.","n":[],"p":181,"b":3},{"c":"[12수학01-08]","k":"기본","sk":"","s":"수학","g":"고등학교 1~3학년","d":"수와 연산","t":"받아올림(내림)이 없는 몇천의 덧셈과 뺄셈을 한다.","m":"받아올림(내림)이 없는 몇천의 덧셈과 뺄셈은 실생활과 관련된 장면을 제시하고 천 모형 그림을 활용하여 더하거나 빼서 연산 문제를 해결하는 활동을 하며, 가로식과 세로식을 사용하여 계산하는 경험을 하게 한다. 계산 도구를 활용하는 경우 계산기를 사용하여 네 자리 수의 덧셈과 뺄셈을 연산하는 기능적인 측면에 중점을 두어 지도한다.","n":[],"p":181,"b":3},{"c":"[12수학01-09]","k":"기본","sk":"","s":"수학","g":"고등학교 1~3학년","d":"수와 연산","t":"받아올림(내림)이 없는 몇천의 덧셈, 뺄셈과 관련된 실생활 문제를 해결한다.","m":"받아올림(내림)이 없는 몇천의 덧셈과 뺄셈은 실생활과 관련된 장면을 제시하고 천 모형 그림을 활용하여 더하거나 빼서 연산 문제를 해결하는 활동을 하며, 가로식과 세로식을 사용하여 계산하는 경험을 하게 한다. 계산 도구를 활용하는 경우 계산기를 사용하여 네 자리 수의 덧셈과 뺄셈을 연산하는 기능적인 측면에 중점을 두어 지도한다.","n":[],"p":181,"b":3},{"c":"[12수학01-10]","k":"기본","sk":"","s":"수학","g":"고등학교 1~3학년","d":"수와 연산","t":"받아내림이 있는 (십몇)-(몇)을 한다.","m":"받아내림이 있는 (십몇)-(몇)의 뺄셈은 10의 보수 개념을 활용하여 10개 칸이 그려진 그림 등을 활용하여 반 구체물로 연산을 연습한 뒤 연산이 익숙해지면 가로 및 세로식을 도입하여 연산 문제를 해결하게 한다.","n":[],"p":181,"b":3},{"c":"[12수학01-11]","k":"기본","sk":"","s":"수학","g":"고등학교 1~3학년","d":"수와 연산","t":"실생활에서 활용되는 나눗셈의 의미를 안다.","m":"생활 속의 다양한 상황에서 나눗셈이 사용되는 장면을 살펴보고 나눗셈의 의미와 필요성에 대해 인식하게 한다. 학생이 직접 물건을 똑같이 여러 명에게 나누어 주거나 여러 바구니에 똑같은 수로 나누어 넣는 활동 등을 반복한다. 이를 통해 나머지가 없는 나눗셈의 몫을 구해보는 활동을 경험한다. 또한 계산 도구를 활용하는 경우 계산기를 통해 나눗셈을 연산하는 기능적인 측면에 중점을 둔다.","n":[],"p":181,"b":3},{"c":"[12수학01-12]","k":"기본","sk":"","s":"수학","g":"고등학교 1~3학년","d":"수와 연산","t":"나머지가 없는 나눗셈의 몫을 구한다.","m":"생활 속의 다양한 상황에서 나눗셈이 사용되는 장면을 살펴보고 나눗셈의 의미와 필요성에 대해 인식하게 한다. 학생이 직접 물건을 똑같이 여러 명에게 나누어 주거나 여러 바구니에 똑같은 수로 나누어 넣는 활동 등을 반복한다. 이를 통해 나머지가 없는 나눗셈의 몫을 구해보는 활동을 경험한다. 또한 계산 도구를 활용하는 경우 계산기를 통해 나눗셈을 연산하는 기능적인 측면에 중점을 둔다.","n":[],"p":181,"b":3},{"c":"[12수학01-13]","k":"기본","sk":"","s":"수학","g":"고등학교 1~3학년","d":"수와 연산","t":"나눗셈과 관련된 실생활 문제를 해결한다.","m":"생활 속의 다양한 상황에서 나눗셈이 사용되는 장면을 살펴보고 나눗셈의 의미와 필요성에 대해 인식하게 한다. 학생이 직접 물건을 똑같이 여러 명에게 나누어 주거나 여러 바구니에 똑같은 수로 나누어 넣는 활동 등을 반복한다. 이를 통해 나머지가 없는 나눗셈의 몫을 구해보는 활동을 경험한다. 또한 계산 도구를 활용하는 경우 계산기를 통해 나눗셈을 연산하는 기능적인 측면에 중점을 둔다.","n":[],"p":181,"b":3},{"c":"[12수학01-14]","k":"기본","sk":"","s":"수학","g":"고등학교 1~3학년","d":"수와 연산","t":"실생활의 다양한 상황에서 필요한 화폐를 활용한다.","m":"여가 및 직업생활 등 생활 속 다양한 상황에서 필요한 화폐(예: 현금, 카드)를 활용하는 경험을 제공한다. 무인 상점이나 음식점 또는 극장 등에서 많이 활용되는 무인 안내기를 사용하여 화폐를 지불하는 방법을 영상이나 시각적인 안내를 통해 순서대로 체험하고 지역사회에서 무인 안내기를 통해 여러 가지 화폐를 직접 사용하는 데 중점을 둔다. 또한 교사와 함께 인터넷 쇼핑을 체험하며 생활 속에 다양하게 화폐를 활용할 수 있음을 경험한다.","n":[],"p":182,"b":3},{"c":"[12수학01-15]","k":"기본","sk":"","s":"수학","g":"고등학교 1~3학년","d":"수와 연산","t":"화폐를 관리하여 저축 및 소비생활을 한다.","m":"자신이 가진 화폐를 관리하여 일정 금액 내에서 저축과 소비를 하는 계획을 세우고 실행하게 한다. 용돈 관리장을 작성하여 들어온 용돈을 기입하고 해당 금액으로 정해진 기간 내에서 얼마를 저축하고 얼마를 소비에 사용할 것인지 결정한다. 소비에 사용할 금액으로 어떤 상품을 구입할 것인지 우선순위를 세워 지출하고 저축은 정해진 기간 내에 얼마를 모을 것인지 계획하여 화폐를 관리하는 경험을 하게 한다.","n":[],"p":182,"b":3},{"c":"[12수학02-01]","k":"기본","sk":"","s":"수학","g":"고등학교 1~3학년","d":"도형","t":"주어진 도형으로 무늬를 꾸미거나 모양을 채운다.","m":"주어진 도형을 조합하거나 배열하여 여러 가지 무늬를 만들거나 모양을 채우게 한다. 실생활 속 다양한 벽지나 타일 등에 활용된 무늬나 모양을 찾게 하고, 칠교놀이, 테셀레이션 등 여러 가지 도형을 활용한 활동을 하면서 도형에 관심을 갖고 흥미 있게 참여하게 한다.","n":[],"p":183,"b":3},{"c":"[12수학02-02]","k":"기본","sk":"","s":"수학","g":"고등학교 1~3학년","d":"도형","t":"여러 가지 도형을 활용하여 만들거나 꾸며 실생활에 활용한다.","m":"조건에 구애받지 않고 자유롭게 여러 가지 도형을 활용하여 만들거나 꾸미게 한다. 여러 가지 교구나 도구를 사용하여 도형을 활용한 다양한 모양을 만들거나 꾸밀 수 있다. 도형이 활용된 실생활 물건들을 찾아보거나 나만의 작품 만들기 등을 통해 도형의 아름다움과 실생활 유용성을 인식하게 한다.","n":[],"p":183,"b":3},{"c":"[12수학02-03]","k":"기본","sk":"","s":"수학","g":"고등학교 1~3학년","d":"도형","t":"크기와 모양이 같은 물건을 늘어놓거나 쌓아 공간을 정리한다.","m":"크기와 모양이 같은 물건을 늘어놓거나 쌓아 공간을 정리하게 한다. 일상생활 속에서의 여러 가지 물건 쌓기 활동과 정리 활동을 찾아서 학생들이 스스로 공간을 구성하고 활용하게 한다.","n":[],"p":184,"b":3},{"c":"[12수학02-04]","k":"기본","sk":"","s":"수학","g":"고등학교 1~3학년","d":"도형","t":"크기와 모양이 다른 물건을 늘어놓거나 쌓아 공간을 정리한다.","m":"크기와 모양이 다른 물건들을 늘어놓거나 쌓아 공간을 정리하게 한다. 모양과 크기가 서로 다른 물건을 한정된 공간에 정리하면서 공간을 효율적으로 활용하는 방법을 익히고 실생활에 활용할 수 있게 한다.","n":[],"p":184,"b":3},{"c":"[12수학02-05]","k":"기본","sk":"","s":"수학","g":"고등학교 1~3학년","d":"도형","t":"공간을 활용하는 목적에 맞게 정리한다.","m":"공간이라는 개념이 일상생활의 큰 축을 담당하고 있음을 알고 생활 속에서 공간을 효율적으로 활용하게 한다. 크기와 모양에 관계없이 공간을 활용하는 목적에 따라 정리하게 한다. 사용 목적에 맞게 공간을 효율적으로 정리하고 이를 실제 생활에 적용하여 공간을 활용하는 방법을 익히는 데 주안점을 둔다.","n":[],"p":184,"b":3},{"c":"[12수학03-01]","k":"기본","sk":"","s":"수학","g":"고등학교 1~3학년","d":"측정","t":"길이의 단위를 활용하여 여러 가지 측정 활동에 참여한다.","m":"길이의 표준 단위인 cm, m를 활용하여 직접 측정하기 어려운 두 장소 사이의 거리를 통해 표준 단위 km의 필요성을 알게 한다. 표준 단위 km는 척도 및 거리 측정 기기를 활용하여 간접 측정하며, 가정이나 학교를 기준으로 ‘몇 km’ 거리에 있는 장소를 알아보고, 자주 이용하는 공공기관이나 시설 등의 거리를 측정하여 ‘몇 km 몇 m’, ‘몇 m’ 등으로 표현하게 한다.","n":["장애 정도가 심한 학생의 경우 학생이 쉽게 사용할 수 있는 임의 제작 측정 도구 및 디지털 기기 등을 활용하게 한다. 임의 제작 측정 도구는 표면에 눈금선과 수치를 제시하여 측정 결과를 직관적으로 읽을 수 있게 도움을 제공하고, 디지털 기기는 학생의 선택에 따른 측정 결과를 즉시 확인하여 활동에 대한 흥미와 관심을 높인다.","길이 활동의 경우, 길 찾기 웹사이트를 활용하여 우리 집을 출발점으로 지역사회 내 이용 시설이나 공공기관이 얼마나 멀리 떨어져 있는지 찾아보는 활동으로 진행하되, 디지털 기기의 사용 방법을 장애 특성에 맞게 최소화하여 제시하고 검색 결과는 시각적으로 확인하게 한다."],"p":185,"b":3},{"c":"[12수학03-02]","k":"기본","sk":"","s":"수학","g":"고등학교 1~3학년","d":"측정","t":"들이의 단위를 활용하여 여러 가지 측정 활동에 참여한다.","m":"들이를 나타내는 표준 단위 ‘L’와 ‘mL’가 사용되는 다양한 물건과 환경 상황을 탐색하여 표준 단위 ‘mL’를 알게 하고 비커, 실린더, 계량형 측정 도구의 사용 방법을 익히고 측정하게 한다. 똑같은 들이의 물건을 ‘L’와 ‘mL’단위로 각각 측정해 보며 표준 단위 사이의 관계를 파악하고, 다양한 용기에 들어있는 재료 및 음료수의 양을 측정하며 ‘몇백 mL’,‘몇십 mL’ 등으로 표현하게 한다.","n":["장애 정도가 심한 학생의 경우 학생이 쉽게 사용할 수 있는 임의 제작 측정 도구 및 디지털 기기 등을 활용하게 한다. 임의 제작 측정 도구는 표면에 눈금선과 수치를 제시하여 측정 결과를 직관적으로 읽을 수 있게 도움을 제공하고, 디지털 기기는 학생의 선택에 따른 측정 결과를 즉시 확인하여 활동에 대한 흥미와 관심을 높인다.","들이 활동의 경우, ‘mL’가 표시되어 있는 여러 가지 용기에 물을 끝까지 채워 보는 활동을 통해 들이의 표준 단위 ‘mL’를 경험하게 한다. 그리고 ‘mL’와 ‘L’가 표시된 음료수 용기의 크기와 모양을 직관적으로 비교하게 하고, 1L의 물을 100mL, 500mL 용기에 똑같이 나누어 담는 활동을 통해 표준 단위의 차이를 경험하게 한다."],"p":185,"b":3},{"c":"[12수학03-03]","k":"기본","sk":"","s":"수학","g":"고등학교 1~3학년","d":"측정","t":"무게의 단위를 활용하여 여러 가지 측정 활동에 참여한다.","m":"1kg보다 가벼운 무게를 나타내는 표준 단위 ‘g’이 사용되는 다양한 물건과 상황을 탐색하여 표준 단위 ‘g’을 알게 하고 여러 가지 계량형 저울의 사용 방법을 익히고 측정하게 한다. 똑같은 무게의 물건을 ‘kg’과 ‘g’으로 측정해 보며 표준 단위 사이의 관계를 파악하고, 여러 가지 물건의 무게 측정 활동을 통해 ‘g’에 대한 양적 감각을 익히며 무게의 표준 단위를 활용한 요리, 공예 등의 여러 가지 활동에 참여하게 한다.","n":["장애 정도가 심한 학생의 경우 학생이 쉽게 사용할 수 있는 임의 제작 측정 도구 및 디지털 기기 등을 활용하게 한다. 임의 제작 측정 도구는 표면에 눈금선과 수치를 제시하여 측정 결과를 직관적으로 읽을 수 있게 도움을 제공하고, 디지털 기기는 학생의 선택에 따른 측정 결과를 즉시 확인하여 활동에 대한 흥미와 관심을 높인다.","무게 활동의 경우, 500g, 100g 무게의 여러 가지 물건을 들어 보며 ‘g’에 대한 무게 감각을 경험하게 하고, ‘kg’ 단위의 물체와 ‘g’ 단위의 물체를 양손으로 함께 들어 보며 ‘kg’과 ‘g’의 상대적 무게 차이를 인식하게 한다. 그리고 무게를 경험하는 활동과 함께 전자저울을 사용하여 무게를 측정함으로써 수치의 차이도 함께 확인하게 한다."],"p":185,"b":3},{"c":"[12수학03-04]","k":"기본","sk":"","s":"수학","g":"고등학교 1~3학년","d":"측정","t":"생활 속 활동에 필요한 양을 어림한다.","m":"어림 활동 관련 친숙한 상황이나 표현 등을 탐구하며 제시된 구체물의 길이, 무게, 들이의 양을 예측해 보고 결과를 확인하게 한다. 그리고 가정생활 및 직업 실습 활동 등에 필요한 여러 가지 물체의 양을 알아보고 같은 양의 물체를 찾거나 같은 양만큼 나타내는 활동 결과를 비교하며 어림에 대한 양적 감각을 경험을 통해 익히게 한다.","n":[],"p":185,"b":3},{"c":"[12수학03-05]","k":"기본","sk":"","s":"수학","g":"고등학교 1~3학년","d":"측정","t":"여러 가지 생활 내용을 일일, 주간 계획표에 나타낸다.","m":"생활 속에서 볼 수 있는 여러 가지 일일, 주간 계획표를 보고 각각의 계획표에 나타난 공통적인 특성을 파악하여 계획표 작성 방법을 알게 한다. 하루(평일, 주말)나 일주일 동안 내가 해야 하는 일, 중요한 일 등을 알아보고 시간 순서, 우선순위에 따라 기록하게 한다. 그리고 일일, 주간 계획표를 작성하되, 내용은 개인의 일상적인 생활 내용뿐 아니라 직업생활, 환경 활동 등과 연계하여 범주를 확장한다.","n":[],"p":186,"b":3},{"c":"[12수학03-06]","k":"기본","sk":"","s":"수학","g":"고등학교 1~3학년","d":"측정","t":"여러 가지 생활 계획표를 보고 필요한 일정을 나타낸다.","m":"생활 속 여러 가지 계획표의 내용을 보고 알 수 있는 사실이나 필요한 정보를 찾게 하며 계획표에서 찾은 내용을 일의 순서, 시간, 시각에 따라 정리하고, 자신의 일정표에 기록하게 한다. 그리고 계획표에 정리된 내용을 파악하여 다양하게 활용하는 활동을 통해 시간을 체계적으로 활용하는 능력을 신장시킨다.","n":[],"p":186,"b":3},{"c":"[12수학04-01]","k":"기본","sk":"","s":"수학","g":"고등학교 1~3학년","d":"규칙성","t":"생활 주변의 물체, 무늬, 수 등의 배열에서 규칙을 찾고, 찾은 규칙을 표현한다.","m":"생활 주변의 규칙적인 물체와 무늬의 배열, 엘리베이터의 숫자나 달력의 숫자와 같은 수 배열 등에서 규칙을 찾고, 찾은 규칙을 표현하게 한다. 학생은 물체, 무늬, 수 등의 배열에서 ‘ABAB’와 같이 반복되는 형태의 규칙뿐만 아니라 증가하는 형태의 규칙도 찾을 수 있다. 이와 함께 찾은 규칙에 대해 표현할 기회를 부여하는 것이 필요한데, 규칙에 대한 표현은 규칙성 활동에 중요한 요소이며, 학생들은 교사가 예상한 것과는 다른 규칙을 발견하기도 하기 때문이다.","n":[],"p":187,"b":3},{"c":"[12수학04-02]","k":"기본","sk":"","s":"수학","g":"고등학교 1~3학년","d":"규칙성","t":"규칙적인 물체, 무늬, 수 등을 활용하여 생활 속 문제를 해결한다.","m":"학생에게 규칙적인 물체, 무늬, 수 등을 생활 속 문제 해결에 활용할 수 있게 한다. 학생은 규칙을 정해 물체를 배열하거나 규칙적 무늬를 활용하여 주변 환경을 꾸밀 수 있다. 이와 함께 규칙적인 물체 배열에서 규칙을 파악하여 다음에 필요한 물건의 개수를 추측하여 준비할 수 있다. 그뿐만 아니라 스스로 만든 규칙을 통해 자신이 만든 규칙을 친구가 찾고 다음에 올 것이 무엇인지를 알아맞히게 하는 활동도 할 수 있다.","n":[],"p":187,"b":3},{"c":"[12수학04-03]","k":"기본","sk":"","s":"수학","g":"고등학교 1~3학년","d":"규칙성","t":"대응하는 규칙을 활용하여 생활 속 문제를 해결한다.","m":"대응하는 규칙을 활용하여 생활 속 문제를 해결할 수 있는 기회를 부여한다. 직업생활 장면에서 포장·조립을 반복하거나 일상생활에서 일정 개수의 물건을 반복해서 나누어 주는 것처럼 무언가를 만들거나 조작하는 상황 등에서 대응 관계에 따라 필요한 물건의 개수를 추측하여 준비하게 할 수 있다. 이처럼 규칙에 따라 하나의 변화하는 양에 대응하는 다른 양의 값을 구할 수 있게 하여 생활 속의 다양한 문제를 해결하게 한다.","n":[],"p":187,"b":3},{"c":"[12수학05-01]","k":"기본","sk":"","s":"수학","g":"고등학교 1~3학년","d":"자료와 가능성","t":"여러 가지 기준에 따라 자료를 분류한다.","m":"일상생활 속 여러 가지 물건의 특징을 보고 색과 모양, 크기와 쓰임, 색과 용도 등 두 개 이상의 기준을 함께 고려하여 분류하게 한다. 기준의 설정은 정해진 기준과 함께 학생에게 필요하거나 선호하는 기준을 자신이 정하게 하여 능동적 학습 상황으로 연계해 간다. 분류 활동은 생활 속 물건을 효율적으로 정리하고 쉽게 찾게 하여 분류의 유용성을 실생활에 활용하게 한다.","n":[],"p":188,"b":3},{"c":"[12수학05-02]","k":"기본","sk":"","s":"수학","g":"고등학교 1~3학년","d":"자료와 가능성","t":"생활 속 분류된 자료를 보고 필요한 물건을 찾는다.","m":"가정, 학교, 지역사회 영역으로 분류 상황을 확장하며 정리된 물건을 관찰하여 분류의 속성이나 특징을 파악하고 분류의 기준을 찾아보게 한다. 분류 기준을 파악하면 필요한 물건을 정확하게 찾을 수 있다는 것을 알게 하고 내가 정리한 물건의 분류 기준을 다른 사람에게 전달하여 나와 같은 방식으로 물건을 쉽게 찾을 수 있게 하여 분류의 실생활 활용성을 알게 한다.","n":[],"p":188,"b":3},{"c":"[12수학05-03]","k":"기본","sk":"","s":"수학","g":"고등학교 1~3학년","d":"자료와 가능성","t":"여러 가지 그래프를 경험한다.","m":"여러 가지 선, 띠, 원 모양 그래프의 형태, 내용 등을 탐구하여 그래프의 유형별 특징을 파악하고 그래프에 나타난 생활 정보 관련 디자인 요소를 활용하여 이미지로 전달하는 방식을 알아보게 한다. 그리고 그래프의 내용 소재는 실제 생활에 필요하거나 친구들과 함께 이야기를 나눌 수 있는 관심과 선호, 요구 등을 고려하여 선정한다.","n":[],"p":189,"b":3},{"c":"[12수학05-04]","k":"기본","sk":"","s":"수학","g":"고등학교 1~3학년","d":"자료와 가능성","t":"생활 속 그래프를 보고 필요한 정보를 찾는다.","m":"여러 가지 매체에서 접할 수 있는 여러 가지 그래프 형태를 알고 그래프에 나타나 있는 다양한 정보를 파악하게 한다. 가정 및 지역사회 활동에 필요한 정보를 그래프에서 찾되, 정보의 내용이나 범주에 따라 두 개의 그래프를 활용하게 한다. 그리고 다양하게 제시된 여러 가지 그래프의 시각화 정보를 알아보는 충분한 경험을 통해 필요한 정보를 효율적으로 찾게 한다.","n":[],"p":189,"b":3},{"c":"[12수학05-05]","k":"기본","sk":"","s":"수학","g":"고등학교 1~3학년","d":"자료와 가능성","t":"생활 속에서 여러 가지 가능성을 경험한다.","m":"일상생활과 밀접하게 관련 있는 내용으로 구성하며 앞으로 일어날 일에 대해 예측하는 여러 가지 생활 및 환경 정보를 각종 매체를 통해 찾게 한다. 예측된 정보 중 가능성이 높거나 낮은 경우에 따라 학생이 무엇을 선택하고 준비해야 하는지 알아보고 이후 나타난 결과를 비교하며 생활 속 가능성 정보가 우리에게 주는 실용성을 인식하게 한다.","n":[],"p":190,"b":3},{"c":"[4과학01-01]","k":"기본","sk":"","s":"과학","g":"초등학교 3~4학년","d":"운동과 에너지","t":"자석과 여러 가지 물체를 가까이했을 때 나타나는 현상을 관찰하고, 자석에 붙는 물체와 붙지 않는 물체를 분류한다.","m":"이 성취기준은 교실에서 자석에 붙는 또는 붙지 않는 물체를 찾아보고, 자석과 철로 된 물체 사이에 당기는 힘을 자연스럽게 관찰한다. 이때 자석은 극 표시가 없는 것을 사용하고, 만약 자석에 극 표시가 있다면, 미리 색 테이프나 종이로 감싸 둔다.","n":[],"p":204,"b":3},{"c":"[4과학01-02]","k":"기본","sk":"","s":"과학","g":"초등학교 3~4학년","d":"운동과 에너지","t":"자석과 자석을 가까이했을 때 나타나는 현상을 관찰하고, 자석의 성질에 흥미를 갖는다.","m":"이 성취기준은 두 개의 막대자석을 다양하게 인접시켜 보는 놀이 활동을 반복하여 자석은 같은 극끼리는 밀어내는 힘, 다른 극끼리는 끌어당기는 힘이 작용한다는 것을 관찰한다.","n":[],"p":204,"b":3},{"c":"[4과학01-03]","k":"기본","sk":"","s":"과학","g":"초등학교 3~4학년","d":"운동과 에너지","t":"물체의 차가운 정도와 따뜻한 정도를 다양하게 표현하고, 차갑거나 뜨거운 물체를 다룰 때 주의할 점을 실천한다.","m":"이 성취기준은 감각을 통하여 물체의 차가운 정도와 따뜻한 정도를 느끼고 이를 ‘차갑다’, ‘미지근하다’, ‘따뜻하다’, ‘뜨겁다’ 등의 언어로 표현하고 일상생활에서 차가운 정도와 따뜻한 정도를 나타내기 위해 파란색, 빨간색 등의 색깔도 활용되고 있음을 이해한다. 차가운 정도와 따뜻한 정도를 느끼고 표현할 때는 주변의 친숙한 물체를 활용하고 필요한 경우 차가운 물, 따뜻한 물 등의 물질을 활용한다. 또한 차가운 정도와 따뜻한 정도에 대한 느낌은 절대적인 것이 아니고 사람이나 상황에 따라 다를 수 있으므로 다양한 반응을 허용하도록 한다. 차가운 물체와 뜨거운 물체를 다룰 때 주의해야 점을 알고 안전사고를 예방하며 화상과 같은 안전사고에도 적절히 대처한다. 온도의 개념은 후속 학습 내용에 해당하므로 설명하지 않는다.","n":[],"p":204,"b":3},{"c":"[4과학01-04]","k":"기본","sk":"","s":"과학","g":"초등학교 3~4학년","d":"운동과 에너지","t":"소리가 나는 물체는 떨림이 있음을 알고, 생활 주변의 소리를 듣고 큰 소리와 작은 소리, 높은 소리와 낮은 소리로 구분한다.","m":"이 성취기준은 소리가 발생할 때 나타나는 공통점을 눈으로 직접 볼 수 있는 콘텐츠나 스마트 기기, 실험 등 다양한 활동을 통해 인식한다. 소리의 세기와 높낮이는 개인의 감각에 따라 느끼는 정도가 다를 수 있으므로 소리의 세기와 높낮이에 대한 다양한 반응은 허용한다. 소리가 ‘크다’, ‘작다’를 구분하기 위해 스피커의 음량 조절, 소음측정기나 스마트 기기, 소리의 세기를 나타내는 그림 자료나 표 등을 활용하여 직관적으로 이해하고, 소리가 ‘높다’, ‘낮다’를 구분하기 위해 성악가의 노래를 듣거나 악기를 직접 연주하여 소리의 높낮이를 이해한다. 이와 더불어 소리의 세기와 높낮이의 다른 점에 유의하여 일상생활 속에서 소리나 목소리를 듣고 소리의 세기와 높낮이를 구분하는 활동을 한다. 또한 상황과 장소에 따라 큰 소리를 내야 할 때와 작은 소리를 내야 할 때를 알고 목소리를 조절하여 말하는 능력을 기른다.","n":[],"p":205,"b":3},{"c":"[4과학01-05]","k":"기본","sk":"","s":"과학","g":"초등학교 3~4학년","d":"운동과 에너지","t":"물체를 밀거나 당겼을 때 나타나는 현상을 관찰하여 힘을 이해한다.","m":"이 성취기준은 물체를 밀거나 당기면 물체의 위치, 빠르기, 방향이 변화한다. 책상 또는 의자를 밀거나 당기면 책상 또는 의자의 위치가 변화되는 것을 관찰한다. 이런 활동을 통해 힘이 작용하면 물체의 위치, 빠르기, 방향이 변화한다는 것을 인식하도록 한다. 그네 타기, 공 던지기 등 활동을 통해 힘과 관련된 현상에 흥미를 느끼도록 하는 데 주안점을 둔다. 물체에 접촉하지 않고 작용하는 힘(예: 중력)은 다루지 않는다.","n":[],"p":206,"b":3},{"c":"[4과학01-06]","k":"기본","sk":"","s":"과학","g":"초등학교 3~4학년","d":"운동과 에너지","t":"힘을 받은 물체의 위치 변화를 관찰하여 운동을 이해한다.","m":"이 성취기준은 힘을 받은 물체가 한 위치에서 다른 위치로 이동하는 것을 운동이라고 한다. 물체의 운동은 이동 거리, 속력, 속도, 가속도 등으로 나타낼 수 있다. 여기서는 물체의 이동 거리를 통한 운동만을 다루고, 물체의 속력, 속도, 가속도 등은 다루지 않는다. 다만, 일상생활의 다양한 도구를 통해 운동의 종류가 직선 운동, 회전 운동, 왕복 운동, 진동 운동이 있다는 것을 지도한다.","n":[],"p":206,"b":3},{"c":"[4과학02-01]","k":"기본","sk":"","s":"과학","g":"초등학교 3~4학년","d":"물질","t":"여러 가지 물질로 이루어진 물체를 감각기관을 통해 관찰한다.","m":"이 성취기준은 일상생활에서 볼 수 있는 여러 가지 물체를 시각, 청각, 촉각, 후각을 통하여 직접 느껴 보고 조작하는 활동을 충분히 하여 생활 주변의 물체에 관심을 가지는 데 중점을 둔다. 관찰의 범위를 생활 속 친숙한 물체에서 점차 확대함으로써 자연과 일상생활에 호기심을 갖고 활동에 스스로 참여하는 적극성을 갖는다. 여러 감각을 통한 관찰 시 소재 선정과 안전에 특히 유의한다.","n":[],"p":207,"b":3},{"c":"[4과학02-02]","k":"기본","sk":"","s":"과학","g":"초등학교 3~4학년","d":"물질","t":"생활 주변의 물체를 형태나 종류 등에 따라 분류한다.","m":"이 성취기준은 생활 속 물체를 적극적인 태도로 관찰하고 조작하는 활동을 통하여 다양한 물체가 우리 생활에서 사용되고 있음을 인지하고 물체를 형태와 종류에 따라 분류하는 데 중점을 둔다. 관찰한 내용, 어려운 점을 솔직하게 표현하고 수용하는 과정을 통하여 탐구활동의 결과를 편견 없이 받아들이고 인정하는 태도를 기른다. 학교, 집, 지역사회로 생활영역을 구분하여 물체 분류 활동의 범위를 조절할 수 있다.","n":[],"p":207,"b":3},{"c":"[4과학02-03]","k":"기본","sk":"","s":"과학","g":"초등학교 3~4학년","d":"물질","t":"생활 주변의 물체를 장소와 용도에 따라 분류한다.","m":"이 성취기준은 생활 속 물체의 쓰임과 장소에 따라 물체를 분류하는 활동에 중점을 둔다. 학교 영역의 교실, 운동장, 특별실, 집 영역의 방, 거실, 부엌, 마을 영역의 마트, 놀이터 등 일상생활의 여러 장소에서 물체의 용도를 인식하도록 충분히 관찰하고 조작 활동을 한다. 영역별로 생활을 편리하게 하는 물체들의 용도와 사용 방법을 익히는 활동을 통하여 과학과 기술에 관심을 둔다.","n":[],"p":207,"b":3},{"c":"[4과학02-04]","k":"기본","sk":"","s":"과학","g":"초등학교 3~4학년","d":"물질","t":"생활 주변의 물체를 질감의 특성에 따라 분류한다.","m":"이 성취기준은 여러 가지 물질의 특징 중 질감에 따른 느낌을 자유롭게 표현하고 분류하는 것에 중점을 둔다. 물체를 관찰한 결과를 개방적인 분위기에서 몸짓, 그림, 만들기와 같이 다양하게 표현하는 활동을 통하여 서로의 의견에 귀 기울이는 등 초보적인 수준의 과학적 의사소통 능력과 협동심을 기른다. 용어의 지도보다는 딱딱한 물체, 물렁물렁한 물체, 거친 물체, 부드러운 물체 등 유사한 질감을 가진 물체를 활용한 놀이나 만들기 활동을 통하여 물질의 질감을 인식하고 관찰 결과를 표현한다.","n":[],"p":209,"b":3},{"c":"[4과학03-01]","k":"기본","sk":"","s":"과학","g":"초등학교 3~4학년","d":"생명","t":"우리 몸 각 부위의 생김새와 움직임을 관찰한다.","m":"이 성취기준은 우리 몸을 이루는 각 부위의 명칭을 알고 생김새를 구분하며, 움직임을 파악하는 능력을 기르기 위해 설정하였다. 얼굴 및 각 부위의 위치와 생김새 관찰하기, 팔다리의 위치와 생김새 관찰하기, 신체 각 부위의 움직임 관찰하기 등의 내용을 다룬다. 얼굴, 손이나 팔, 발이나 다리 등의 영역으로부터 눈, 코, 입, 손가락, 발가락 등의 세부적인 영역까지 눈으로 관찰하거나, 손으로 만져 보는 활동을 통하여 신체에 관심을 둔다.","n":[],"p":209,"b":3},{"c":"[4과학03-02]","k":"기본","sk":"","s":"과학","g":"초등학교 3~4학년","d":"생명","t":"여러 가지 동물을 관찰하고 특징을 표현한다.","m":"이 성취기준은 주변에서 볼 수 있는 동물을 관찰하여 특징을 찾아보는 활동을 통해 관찰 대상을 다양하게 표현하는 능력을 기르기 위해 설정하였다. 여러 가지 동물의 생김새를 살펴보고 동물의 움직임과 동물이 내는 소리를 모방하는 놀이 활동 등으로 동물의 특징을 파악한다. 이러한 놀이 과정을 통해 동물이 살아있는 생물이라는 것을 인식한다.","n":["청각장애를 지닌 중복장애 학생의 경우 교육적 요구에 따라 동물 소리 흉내 내기, 동물 움직임 흉내 내기 활동 시 교사의 시범을 보고 활동에 참여한다. 동물 소리 그림책, 동물 소리 자료에서 나오는 소리는 학생들의 보조공학 기구 상황에 알맞게 소리 크기를 조절한다. 지체장애를 지닌 중복장애 학생의 경우 교육적 요구에 따라 동물의 소리, 동물의 움직임 등을 관찰하여 표현하는 활동 시 스위치로 동물 인형 작동하기 등 보조공학 기기를 활용하고 학생이 움직일 수 있는 범위 내에서 움직임을 경험한다."],"p":210,"b":3},{"c":"[4과학03-03]","k":"기본","sk":"","s":"과학","g":"초등학교 3~4학년","d":"생명","t":"여러 가지 식물을 관찰하고 특징을 표현한다.","m":"이 성취기준은 주변에 흔히 볼 수 있는 여러 가지 식물에 관심을 가지고, 식물의 생김새와 특징을 다양한 방식으로 표현하는 능력을 기르기 위해 설정하였다. 다양한 놀이와 관찰을 통하여 잎의 모양, 꽃의 색과 같은 식물의 생김새와 특징을 다양하게 관찰하고 그 특징을 자유롭게 표현한다. 나아가 식물의 구조 중 일부(예: 잎, 꽃, 열매)를 함부로 꺾지 않고 생명을 소중히 여기는 태도를 기른다.","n":[],"p":210,"b":3},{"c":"[4과학03-04]","k":"기본","sk":"","s":"과학","g":"초등학교 3~4학년","d":"생명","t":"생물의 특징을 관찰하고 생물을 소중하게 여기는 태도를 기른다.","m":"이 성취기준은 생물의 특징이 생장하는 것임을 인식하기 위해 설정하였다. 생물과 무생물의 차이점을 관찰하기 위해 생활 주변 환경 속에서 볼 수 있는 것들을 살아있는 것과 살아있지 않는 것으로 분류한다. 생물은 먹이와 공기, 물 등을 통해 성장하는 존재이며 무생물은 먹이와 양분이 필요하지 않음을 강조한다. 생물과 무생물의 용어 자체보다 살아 있는 것의 특징을 이해하는 것이 중요하며, 생명은 한 번 잃으면 다시는 찾을 수 없는 소중한 것임을 이해한다.","n":["지체장애를 지닌 중복장애 학생의 경우 교육적 요구에 따라 내가 기르는 반려동물의 사진을 찍어 성장하는 모습 관찰하기, 학교 내 살아있는 동물에게 먹이 주기, 살아 있는 지렁이와 젤리 지렁이 관찰하기 등으로 성취기준을 재구성하여 적용할 수 있다."],"p":210,"b":3},{"c":"[4과학04-01]","k":"기본","sk":"","s":"과학","g":"초등학교 3~4학년","d":"지구","t":"생활 주변 자연환경의 다양한 모습을 관찰하고, 지구의 자연환경에 흥미를 갖는다.","m":"이 성취기준은 생활 주변 자연환경의 모습을 지도할 때 들판, 산, 강, 바다 등의 시청각 자료를 제시하되 학생 주변에서 쉽게 볼 수 있는 자연환경에서 점차 그 범위를 확장해 사막, 밀림 등 지구의 여러 가지 자연환경에 흥미를 갖고 관찰하는 데에 목적이 있다.","n":[],"p":212,"b":3},{"c":"[4과학04-02]","k":"기본","sk":"","s":"과학","g":"초등학교 3~4학년","d":"지구","t":"지구 모양이 둥글다는 것을 알고, 지구 표면을 구성하는 육지와 바다를 구분한다.","m":"이 성취기준은 지구의, 우주에서 본 지구의 사진 등 여러 자료를 감각기관을 이용해 관찰하여 지구의 모양이 둥글다는 것을 인식한다. 지구 표면은 육지와 바다로 이루어져 있음을 알고 지구의와 지도에서 이를 구분하는 활동을 포함한다.","n":["장애 정도가 심한 학생의 교육적 요구에 따라 해당 성취기준 내용을 바탕으로 지구 전체의 모습을 대신하여 생활 주변 자연환경 및 지표면을 다양한 촉각 자료를 활용하여 평면 위에 구성하는 활동 등으로 성취기준을 재구성하여 적용할 수 있다."],"p":212,"b":3},{"c":"[4과학04-03]","k":"기본","sk":"","s":"과학","g":"초등학교 3~4학년","d":"지구","t":"날씨와 이에 따른 생활 모습을 관찰하고, 날씨가 우리 생활에 중요함을 인식한다.","m":"이 성취기준은 날씨는 학생들이 매일 접하는 자연 현상으로 관찰을 중심으로 한 탐구활동의 좋은 소재가 된다. 날씨와 관련된 바람, 구름, 비, 눈 등을 관찰하는 것을 포함한다. 이를 바탕으로 바람 부는 날, 구름의 양에 따라 맑은 날과 흐린 날, 비 또는 눈 오는 날 등의 날씨를 구분하고 특징을 이해한다. 또한 날씨에 따른 적절한 생활 모습을 알고, 날씨가 우리 생활에 중요함을 인식한다.","n":[],"p":212,"b":3},{"c":"[4과학04-04]","k":"기본","sk":"","s":"과학","g":"초등학교 3~4학년","d":"지구","t":"태양, 달, 별을 관찰하여 낮과 밤하늘의 특징을 구분하고, 하늘 관찰에 흥미를 갖는다.","m":"이 성취기준은 낮 하늘의 태양, 밤하늘의 달과 별의 관찰을 통해 낮과 밤하늘의 특징을 구분하는 데 중점을 둔다. 낮과 밤하늘을 다룰 때 지구의 자전과 같은 운동 개념은 세부적으로 다루지 않는다. 또한 낮하늘의 태양은 자료를 통해 간접적으로 관찰하고, 태양의 열과 에너지 등에 대한 느낌과 태양의 색을 다양하게 표현하도록 한다. 또한 태양, 달, 별의 모형이나 시청각 자료를 활용하여 학생들이 천체 관찰에 흥미와 즐거움을 느끼는 데 주안점을 둔다.","n":[],"p":213,"b":3},{"c":"[6과학01-01]","k":"기본","sk":"","s":"과학","g":"초등학교 5~6학년","d":"운동과 에너지","t":"전기가 통하는 물질과 통하지 않는 물질을 분류하고, 그 특성을 이해한다.","m":"이 성취기준은 교사가 전기회로를 구성한 뒤 여러 가지 물질(예: 금속류, 고무, 플라스틱)을 연결하여 봄으로써 전기가 통하는 물질과 통하지 않는 물질을 분류하도록 지도한다. 특히 이 실험에서는 전기 안전에 유의하여 지도한다.","n":[],"p":214,"b":3},{"c":"[6과학01-02]","k":"기본","sk":"","s":"과학","g":"초등학교 5~6학년","d":"운동과 에너지","t":"물체의 차가운 정도와 따뜻한 정도를 온도로 표현함을 알고, 온도계를 이용하여 물체의 온도를 정확하게 측정한다.","m":"이 성취기준은 차가운 정도와 따뜻한 정도를 ‘차갑다’와 ‘따뜻하다’ 등으로 표현할 때의 불편함을 알고 차가운 정도와 따뜻한 정도를 온도로 표현하는 것이 중요함을 안다. 온도를 정확하게 측정하기 위하여 다양한 온도계가 필요함을 이해하고 생활 주변에서 다양한 온도계와 온도계의 구조를 탐색하여 온도계에 관심을 둔다. 온도를 측정할 때는 소수나 자릿값 등의 어려운 수학 개념을 강조하지 않고 후속 학습 내용인 열의 이동 개념을 설명하지 않도록 유의한다. 또한 냉장고, 오븐, 에어컨 등의 전자 기기나 조리, 재배, 사육 등의 일상생활에서 온도와 온도 측정이 다양하게 활용되고 있음을 이해한다.","n":[],"p":215,"b":3},{"c":"[6과학01-03]","k":"기본","sk":"","s":"과학","g":"초등학교 5~6학년","d":"운동과 에너지","t":"물체를 보기 위해서 빛이 있어야 함을 알고 빛이 직진하는 성질을 관찰하여 흥미를 갖는다.","m":"이 성취기준은 그림자는 빛이 직진하다 물체에 막혀 통과하지 못해 물체 뒷면에 생기는 검은 그늘임을 인식한다. 그림자 만들기 놀이나 그림자 연극 등으로 흥미를 유발하고, 생활 주변에서 그림자가 생기는 곳과 생기지 않는 곳을 관찰하는 활동 중심으로 구성한다. 이때 빛과 물체와의 거리에 따른 그림자의 크기 변화에 관한 내용은 다루지 않고 그림자가 생기는 원리를 적용하여 생활을 편리하게 만든 실제적인 내용도 포함한다.","n":["시각장애를 동반한 학생의 경우 햇빛이 있는 곳과 없는 곳의 차이를 다감각적으로 직접 경험하도록 하고, 빛이 있을 때 그림자가 생기고 빛이 없을 때 그림자가 생기지 않음을 양각 자료를 이용하여 이해를 높인다."],"p":216,"b":3},{"c":"[6과학01-04]","k":"기본","sk":"","s":"과학","g":"초등학교 5~6학년","d":"운동과 에너지","t":"거울에 비친 모습과 실제 모습을 비교하고, 생활 속 여러 가지 거울의 특징을 관찰한다.","m":"이 성취기준은 빛이 직진하다 물체를 만나면 물체의 표면에서 튕겨 나가는 빛의 반사 현상을 거울을 활용한 다양한 놀이를 통해 더 쉽게 이해하도록 한다. 빛의 반사 법칙은 다루지 않고 평면거울, 오목거울, 볼록거울에 비친 물체의 모습을 비교하는 활동을 통해 거울의 종류에 따라 물체의 상이 달라질 수 있음을 이해하는 것이 중요하다. 교통안전을 위해 사용되는 거울, 치과용 거울, 편의점이나 상점 내 보안 거울 등 가정이나 생활 주변에서 이용되는 평면거울과 오목거울, 볼록거울의 예와 쓰임새에 관심을 둔다.","n":["장애 정도가 심한 학생의 교육적 요구에 따라 평면거울에 비친 자신의 모습을 관찰하고 몸단장하기 활동으로 성취기준을 재구성하여 적용할 수 있다. 시각장애를 지닌 중복장애 학생의 경우 언어로 충분히 설명하고 촉각으로 확인할 수 있는 모형 자료나 양각 자료를 이용해 관찰한다. 이때 모형과 실물의 차이가 있을 때 차이점을 설명하여 오개념이 형성되지 않도록 한다."],"p":216,"b":3},{"c":"[6과학01-05]","k":"기본","sk":"","s":"과학","g":"초등학교 5~6학년","d":"운동과 에너지","t":"여러 가지 물체의 운동을 관찰하여 속력을 비교하고, 속력과 관련된 안전 수칙을 알고 교통안전을 실천한다.","m":"이 성취기준은 시간이 지남에 따라 물체의 위치가 변하는 것을 운동이라고 하며 만약 물체의 위치가 변하지 않는다면 그 물체는 정지해 있다는 것을 이해한다. 물체의 운동을 관찰할 때 이동 거리가 같고 걸린 시간이 다른 경우, 걸린 시간이 같고 이동 거리가 다른 경우를 관찰하여 물체의 빠르기를 비교한다. 물체가 일직선상에서 한 방향으로 운동하는 경우만 다루며 속력의 단위 변환이나 속력의 산술적 계산보다는 속력의 뜻과 개념을 이해하는 데 중점을 두어 지도한다. 속력과 관련된 안전 사항에 관해서는 실천적 습관 형성을 위하여 빠른 물체의 위험성을 인식하고 안전띠 착용하기, 횡단보도 안전하게 건너기 등 교통안전에 중점을 두도록 한다.","n":[],"p":217,"b":3},{"c":"[6과학02-01]","k":"기본","sk":"","s":"과학","g":"초등학교 5~6학년","d":"물질","t":"생활 주변의 물체를 물질의 종류에 따라 분류한다.","m":"이 성취기준은 생활 속 물체를 물질의 겉보기 성질과 물질의 종류에 따라 분류하는 능력을 기르는 데 중점을 두며, 필요한 경우 관찰 도구를 활용한다. 물체의 재료 수준에서 금속, 플라스틱, 나무, 고무, 유리, 종이, 가죽 등을 중심으로 물질을 제시하며, 생활 속 다양한 물체를 자유롭게 찾는 활동을 통하여 물체와 물질을 인식하도록 한다. 생활의 편리를 위하여 무분별하게 사용되는 플라스틱 일회용품과 같은 물체들에 대한 인식을 통하여 환경에 대한 자각을 갖도록 지도한다.","n":[],"p":217,"b":3},{"c":"[6과학02-02]","k":"기본","sk":"","s":"과학","g":"초등학교 5~6학년","d":"물질","t":"생활 주변의 물질을 고체, 액체, 기체로 분류한다.","m":"이 성취기준은 일상생활에서 친숙한 고체, 액체, 기체를 찾아보고 물질의 상태에 따라 분류하는 데 중점을 둔다. 고체, 액체, 기체의 성질이 잘 나타나는 물질을 중심으로 분류 활동을 충분히 하여 물질에 대한 오개념이 생성되지 않도록 한다. 물질과 관련된 과학적 사실에 대해 개방성을 가지고 자기 생각을 변경할 수 있는 열린 태도를 보이도록 지도한다.","n":["장애 정도가 심한 학생의 경우 물질의 상태에 따른 특성을 감각기관을 통하여 관찰하고 확인한다. 이를 위해 물 풍선, 헬륨 풍선, 사탕 만들기 등과 같은 과학 놀이 활동을 구성하여 고체, 액체, 기체에 호기심을 가지고 체험하도록 성취기준을 재구성하여 적용할 수 있다. 시각장애를 동반한 학생의 경우 촉각적 모델링, 신체적 안내법 등 촉각 교수 전략을 활용하여 물질을 탐색하도록 한다."],"p":218,"b":3},{"c":"[6과학02-03]","k":"기본","sk":"","s":"과학","g":"초등학교 5~6학년","d":"물질","t":"생활 주변의 고체 물질을 녹여 여러 가지 용액을 만든다.","m":"이 성취기준은 생활 속 친숙한 고체 물질의 용해 과정을 직접 관찰하고, 용해의 결과인 용액을 만들어 보는 데 중점을 둔다. 소금, 설탕, 주스 가루 등 다양한 가루를 물에 녹였을 때의 실험 결과를 간단히 예상하여 보고 실험의 결과를 비교하는 활동을 통하여 용해와 용액에 대한 기본 개념을 이해한다. 실험 과정에서 나타난 색이나 맛과 같은 경험적 증거에 기반하여 기초적이지만 결과를 예측할 수 있도록 지도한다.","n":["장애 정도가 심한 학생의 경우 선호하는 물질을 물에 녹여 보고 실험의 결과에 따라 용액의 색 등이 달라짐을 확인하는 것이 바람직하며, 시각장애를 지닌 중복장애 학생의 경우 실험 시 보조 도구(예: 컴포트 그립, 텀블러, 핸드 블렌더)를 활용하여 실험에 참여한다."],"p":218,"b":3},{"c":"[6과학02-04]","k":"기본","sk":"","s":"과학","g":"초등학교 5~6학년","d":"물질","t":"물에 녹는 물질과 녹지 않는 물질을 분류한다.","m":"이 성취기준은 용매인 물에 용해되는 용질을 찾아보는 활동을 통해 용해의 과정에서 나타나는 현상을 관찰하고 결과를 예측하여 물질을 분류하는 활동에 중점을 둔다. 설탕, 소금, 스티로폼 조각, 멸치 가루 등 다양한 물질을 물에 녹여 보는 과정을 관찰하고 비교하여 용해의 여부에 따라 물에 녹는 물질과 녹지 않는 물질을 분류하도록 한다. 분말 형태의 주스 가루 녹이기 등 용해와 관련된 생활 문제에 적극적으로 참여하며 해결하는 과학적 태도를 기른다.","n":["장애 정도가 심한 학생의 교육적 요구에 따라 물에 녹는 물질과 녹지 않는 물질을 분류하는 것을 대신하여 혼합물에서 용해되지 않는 물질들을 만져보고 용액 속 덩어리나 건더기를 녹이거나 건져 내는 활동 등으로 성취기준을 재구성하여 적용할 수 있다. 시각장애를 지닌 중복장애 학생의 경우 촉각 상징 및 잔존 감각을 활용하여 분류 과정과 결과를 표현한다."],"p":218,"b":3},{"c":"[6과학03-01]","k":"기본","sk":"","s":"과학","g":"초등학교 5~6학년","d":"생명","t":"새끼를 낳는 동물과 알을 낳는 동물의 한살이를 다양하게 표현한다.","m":"이 성취기준은 동물이 새끼로 태어나거나 알에서 부화하여, 자라서 성체가 되면 다시 새끼나 알을 낳고 죽는 한살이 과정을 살펴보는 데 중점을 둔다. 동물들이 어떠한 모습으로 태어나는지, 성장에 따라 겉모습은 어떻게 변화하고 암수의 모습은 어떻게 다른지 분류하고 다양한 방법으로 한살이를 표현한다. 동물의 한살이는 동물에 따라 차이가 있음을 인식하기 위해 반려동물로 기르기가 가능하거나 생활 주변에서 관찰할 수 있는 두 종류 이상의 동물의 한살이를 비교하여 관찰한다.","n":["장애 정도가 심한 학생의 교육적 요구에 따라 한살이를 글, 그림, 사진 등 학생들의 표현 양식에 맞추어 나타내고, 동식물의 그림 또는 사진으로 구성된 의사소통 판을 활용하여 관찰 결과를 의사소통하는 탐구과정을 경험한다."],"p":220,"b":3},{"c":"[6과학03-02]","k":"기본","sk":"","s":"과학","g":"초등학교 5~6학년","d":"생명","t":"식물의 한살이를 다양하게 표현한다.","m":"이 성취기준은 식물이 씨앗에서 싹을 틔워 자라고 꽃을 피우며 열매를 맺어 다시 씨앗을 만드는 한살이 과정을 살펴보는 데 중점을 둔다. 이러한 식물의 한살이 과정을 이해하기 위하여 직접 식물(예: 토마토, 강낭콩, 콩나물, 고추)을 키우면서 관찰한다. 직접 관찰이 어려운 경우 동영상을 활용하되 다양한 방법으로 한살이를 표현하고, 지역사회 환경에 적합한 식물 또는 입체적인 식물 모형을 활용하여 식물의 한살이를 탐구한다.","n":["장애 정도가 심한 학생의 교육적 요구에 따라 한살이를 글, 그림, 사진 등 학생들의 표현 양식에 맞추어 나타내고, 동식물의 그림 또는 사진으로 구성된 의사소통 판을 활용하여 관찰 결과를 의사소통하는 탐구과정을 경험한다.","장애 정도가 심한 학생의 교육적 요구에 따라 식물의 각 기관을 특징별로 분류하는 대신 생활 속에서 먹을 수 있는 잎, 줄기, 꽃 등을 활용한 놀이 하기(예: 채소 도장 찍기, 다양한 표현 재료로 꽃 표현하기, 나뭇잎과 나무 조각을 이용하여 목걸이 만들기)로 성취기준을 체험형 융합 교육으로 재구성하여 적용할 수 있다. 또한 식물의 쓰임새에 대하여 흥미와 관심을 가지고, 식물이 이용되는 예(예: 식물을 이용한 음식)를 살펴볼 수 있다."],"p":220,"b":3},{"c":"[6과학03-03]","k":"기본","sk":"","s":"과학","g":"초등학교 5~6학년","d":"생명","t":"여러 가지 동물의 생활 모습을 분류하고 동물을 소중히 여기는 방법을 실천한다.","m":"이 성취기준은 여러 가지 동물의 특징과 생활 모습을 관찰하여 이들을 다양한 기준(예: 생김새, 먹이)으로 분류하는 활동에 주안점을 둔다. 동물도 인간과 마찬가지로 생장하기 위해 요구되는 조건들이 있음을 인식하고 조건들에 따라 동물을 분류하며, 동물에 대한 흥미와 호기심을 가지는 태도를 지닌다. 또한 생활 주변에 어떤 동물이 살고 있는지 살펴보고 동물을 소중히 여기는 방법을 일상에서 실천한다.","n":["장애 정도가 심한 학생의 교육적 요구에 따라 [4과학03-04]의 성취기준과 연결하여 동물과 식물 모두 생장하는 소중한 존재임을 깨닫고 일상생활에서 동‧식물 보호를 실천할 수 있는 캠페인 활동을 구성하여 성취기준을 재구성할 수 있다."],"p":220,"b":3},{"c":"[6과학03-04]","k":"기본","sk":"","s":"과학","g":"초등학교 5~6학년","d":"생명","t":"여러 가지 식물을 뿌리, 줄기, 잎, 꽃과 열매의 특징에 따라 분류하고 식물을 소중히 여기는 방법을 실천한다.","m":"이 성취기준은 식물의 기본 구조인 뿌리, 줄기, 잎, 꽃과 열매를 관찰하여 생김새에 관심을 가지고, 생김새와 특징에 따라 분류하는 데 주안점을 둔다. 특히, 식물은 성장함에 따라 잎이 커지고 많아지며, 줄기는 굵고 길어진다는 현상에 중점을 둔다. 식물의 외형적인 모습(예: 색, 크기, 굵기)을 관찰하고, 나뭇잎, 풀 등 우리 주변의 많은 식물을 소중히 여기는 방법을 일상에서 실천하는 데 주안점을 둔다.","n":["장애 정도가 심한 학생의 교육적 요구에 따라 [4과학03-04]의 성취기준과 연결하여 동물과 식물 모두 생장하는 소중한 존재임을 깨닫고 일상생활에서 동‧식물 보호를 실천할 수 있는 캠페인 활동을 구성하여 성취기준을 재구성할 수 있다."],"p":220,"b":3},{"c":"[6과학04-01]","k":"기본","sk":"","s":"과학","g":"초등학교 5~6학년","d":"지구","t":"여러 가지 흙의 종류를 관찰하고, 흙의 형성과정을 모형 실험을 통해 이해한다.","m":"이 성취기준은 흙은 입자의 크기와 배합에 따라 수십 가지로 구분될 수 있지만 이 성취기준에서는 모래, 참흙, 진흙을 관찰하도록 한다. 또한 풍화 작용으로 암석이 흙이 되는 과정을 관찰하되, ‘풍화’라는 용어는 도입하지 않는다. 암석이 식물의 뿌리 또는 다른 외부 압력에 의해 부서져 흙이 된다는 것을 시청각 자료 및 실험을 통해 이해한다.","n":["장애 정도가 심한 학생의 교육적 요구에 따라 여러 가지 풍화 작용 중에서 물리적인 외부의 압력에 의한 풍화를 중점적으로 다루며 과자나 굳은 흙덩이를 힘으로 부수어 가루로 만드는 활동 등으로 성취기준을 재구성하여 적용할 수 있다."],"p":221,"b":3},{"c":"[6과학04-02]","k":"기본","sk":"","s":"과학","g":"초등학교 5~6학년","d":"지구","t":"지표가 물과 바람에 의해 변화함을 알고, 지표가 변화하는 여러 모습을 관찰한다.","m":"이 성취기준은 흐르는 물이나 바람에 의해 지표가 침식, 운반, 퇴적되는 과정을 모형이나 관련 영상자료를 통해 관찰한다. 흐르는 물에 의한 지표의 변화로 강가 주변 지형의 특징에 대해 알아보며 체험 학습과 연계한 야외 관찰을 통하여 관심과 이해를 높인다. 또한 사막의 지형을 관찰하여 바람에 의해 지표가 변화하는 모습을 이해한다. 이 성취기준에서는 지표 변화의 주요 요인으로 바람이나 흐르는 물에 의한 변화와 같은 느린 변화를 다루고 홍수나 지진, 화산 등과 같은 급격한 변화는 다루지 않는다.","n":[],"p":221,"b":3},{"c":"[6과학04-03]","k":"기본","sk":"","s":"과학","g":"초등학교 5~6학년","d":"지구","t":"날씨에 영향을 미치는 여러 가지 기상요소를 관찰하고, 우리 생활에 미치는 영향을 안다.","m":"이 성취기준은 기상요소는 기온, 강수량, 습도, 바람을 중심으로 다룬다. 구체적인 기상 요소를 배우기 전 이슬, 안개와 같은 기상 현상을 생활 주변에서 찾는 활동을 통해 살펴본다. 이를 바탕으로 여러 가지 기상요소를 알고 습도, 기온과 같은 기상요소는 우리 생활에 어떠한 영향을 주는지 생활 모습에서 찾아보며 이해하는 데 주안점을 둔다.","n":["장애 정도가 심한 학생의 교육적 요구에 따라, 해당 성취기준 내용을 바탕으로 일기 예보를 확인하는 활동 대신 일기 예보를 듣고 적절하게 우리 생활 속에서 대응하는 방법을 익히는 데 주안점을 둔다. 비가 올 때는 우산을 쓰고 밝은 옷 입기, 눈이 내릴 때는 장갑과 모자 쓰기 등과 같이 생활 중심의 활동을 익히는 내용으로 성취기준을 재구성하여 적용할 수 있다."],"p":222,"b":3},{"c":"[6과학04-04]","k":"기본","sk":"","s":"과학","g":"초등학교 5~6학년","d":"지구","t":"기온, 강수량, 습도, 바람의 측정을 통해 기상요소의 변화를 이해한다.","m":"이 성취기준은 온도계와 습도계를 사용하여 하루 동안의 기온과 습도 변화를 측정하고 관찰한다. 간이 우량계, 간이 풍향 풍속계 만들기 활동을 통해 강우량과 바람을 측정한다. 구름, 비, 눈이 내리는 과정과 원리에 대한 세부적인 내용은 다루지 않는다. 다양한 도구를 통한 측정 활동으로 기상요소의 변화를 이해하는 데 주안점을 둔다.","n":[],"p":222,"b":3},{"c":"[6과학04-05]","k":"기본","sk":"","s":"과학","g":"초등학교 5~6학년","d":"지구","t":"일기 예보를 통해 날씨를 예상하고, 생활 속에서 대응 방법을 조사한다.","m":"이 성취기준은 여러 가지 기상요소를 실생활에서 쉽게 접할 수 있는 소재로 활용한 실험이나 시청각 자료를 통해 탐구한다. 이를 바탕으로 일기 예보를 통해 날씨의 정보를 찾는 방법을 익히도록 한다. 또한 일기 예보를 통해 날씨를 예상하고, 우리 생활에 적절히 대응하는 방법을 조사하고 실천하는 데 주안점을 둔다.","n":[],"p":222,"b":3},{"c":"[6과학04-06]","k":"기본","sk":"","s":"과학","g":"초등학교 5~6학년","d":"지구","t":"인간 활동이 지구 환경에 미치는 영향을 알고, 환경보호를 위해 우리가 할 수 있는 일을 조사하여 실천한다.","m":"이 성취기준은 인간이 땅과 물 등 자연을 이용하는 여러 가지 활동들이 땅, 물, 공기에 미치는 영향을 알아보는 내용을 다룬다. 또한 인간의 활동으로 오염된 땅, 물, 공기가 인간에게 미치는 부정적인 영향을 인식하는 데 주안점을 둔다. 이와 더불어 미세 먼지에 대한 심각성을 인식하고 대처하는 방법에 관한 내용을 다룬다. 특히 환경보호와 관련하여 재활용과 재사용의 개념을 알고 물건을 재사용하거나 쓰레기를 분리 배출하는 방법에 대하여 다룬다. 의약품은 약국에 버리기, 건전지는 수거함에 따로 버리기와 같은 실생활에서 중요한 분리 배출을 직접 체험해 보도록 하는 등의 활동을 통해 지구의 땅과 물, 공기를 보호하는 활동을 일상 속에서 실천한다.","n":[],"p":223,"b":3},{"c":"[9과학01-01]","k":"기본","sk":"","s":"과학","g":"중학교 1~3학년","d":"운동과 에너지","t":"전기로 작동되는 여러 가지 전기기구를 관찰하여 에너지 변환을 이해하고, 전기기구의 편리함을 안다.","m":"이 성취기준은 가정, 학교와 같이 학생이 실제로 생활하는 환경에서 이용되는전기기구만을 대상으로 하고, 전기기구를 관찰함으로써 전기 에너지가 빛 에너지, 소리 에너지, 열 에너지, 운동 에너지 등으로 바뀌어 다양한 전기기구로 사용되는 것을 이해하는 데 중점을 두어 지도한다. 전기기구의 사용법은 다루지 않는다. 전기기구의 사용이 우리 생활을 편리하게 하는 점에 중점을 두어 지도하고, 전기기구에 대해 흥미와 호기심을 갖도록 지도한다.","n":[],"p":224,"b":3},{"c":"[9과학01-02]","k":"기본","sk":"","s":"과학","g":"중학교 1~3학년","d":"운동과 에너지","t":"고체, 액체, 기체에서의 열의 이동을 알고, 열의 이동이 나타나는 일상생활 사례를 관찰한다.","m":"이 성취기준은 다리미로 다림질하는 의복, 주전자에 가열하는 물, 냉방과 난방 등과 같은 실생활의 다양한 사례를 통하여 고체에서의 열의 이동, 액체에서의 열의 이동, 기체에서의 열의 이동을 이해한다. 학생이 열의 이동 개념을 이해하는 것이 중요하므로 전도나 대류 등의 어려운 용어를 강조하지 않도록 유의한다.","n":[],"p":225,"b":3},{"c":"[9과학01-03]","k":"기본","sk":"","s":"과학","g":"중학교 1~3학년","d":"운동과 에너지","t":"실험을 통하여 소리의 발생과 전달 그리고 반사 현상을 관찰한다.","m":"이 성취기준은 실 전화기 실험을 통해 소리가 전달됨을 인식하고, 고체, 액체, 기체의 물질 상태에 따라 소리가 전달되는 현상을 관찰한다. 소리 반사판을 이용하여 소리가 장애물을 만나면 반사되는 현상을 관찰하며, 우리 생활에서 소리가 반사되는 현상을 조사한다. 또한 소리의 전달이나 반사의 정도를 조절하여 일상생활에서 소음을 줄이는 방법을 익힌다.","n":[],"p":225,"b":3},{"c":"[9과학01-04]","k":"기본","sk":"","s":"과학","g":"중학교 1~3학년","d":"운동과 에너지","t":"수평 잡기 활동을 통해 물체의 무게를 비교하고, 여러 가지 무게 측정 방법에 흥미를 갖는다.","m":"이 성취기준은 수평 잡기 놀이를 통하여 수평의 원리를 인식하고 두 물체의 무게를 비교한다. 물체의 무게 측정이 필요한 생활 속 사례를 소개하여 학생에게 무게에 대한 호기심과 흥미를 유발하고 주변의 물체를 들어보고 무게를 어림잡아 보는 활동으로 무게의 개념을 익힌다.","n":[],"p":226,"b":3},{"c":"[9과학01-05]","k":"기본","sk":"","s":"과학","g":"중학교 1~3학년","d":"운동과 에너지","t":"무게를 정확히 측정하려면 저울이 필요함을 알고, 저울을 사용해 무게를 측정하고 비교한다.","m":"이 성취기준은 물체의 무게를 정확하게 알지 못하는 경우 발생할 수 있는 불편함을 알고 무게 측정의 필요성을 인식한다. 물체의 무게를 정확하게 측정하기 위해서는 저울이 필요함을 인식하고 실생활에서 사용되는 체중계, 전자저울 등을 이용하여 쓰임새에 따라 적합한 저울을 선택하여 사용하는 데 중점을 둔다. 이때 질량과 무게를 구분하지 않고 저울 사용법에 유의하며 무게를 측정하고 비교하는 데 주안점을 둔다.","n":[],"p":226,"b":3},{"c":"[9과학02-01]","k":"기본","sk":"","s":"과학","
