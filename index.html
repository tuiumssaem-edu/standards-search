":2},{"c":"[6체03-01]","k":"공통","sk":"","s":"체육(지체장애)","g":"초등학교 5~6학년","d":"표현","t":"표현 활동의 의미와 유형을 파악한다.","m":"은 표현 활동 의미와 유형을 이해하기 위해 설정하였다. 스포츠에서 신체 움직임의 심미성을 다루는 스포츠 표현, 민족의 고유한 전통을 신체 움직임으로 표현한 전통 표현, 자유로운 형식으로 움직임을 표현하는 현대 표현의 유형별로 다양한 작품을 직⋅간접적으로 체험함으로써 기본 동작과 구성 방법의 공통점과 차이점을 중심으로 특징을 파악하도록 한다.","n":[],"p":159,"b":2},{"c":"[6체03-02]","k":"공통","sk":"","s":"체육(지체장애)","g":"초등학교 5~6학년","d":"표현","t":"스포츠 표현에서 움직임 기술을 응용한 기본 동작을 파악하고 표현한다.","m":"는 스포츠 표현의 기본 움직임 기술과 응용 동작을 탐색하고 심미적으로 표현하기 위해 설정하였다. 신체활동의 예술적 아름다움을 추구하는 스포츠 표현의 기본 동작에 적합한 움직임 기술의 응용 동작을 심미적으로 표현하도록 한다.","n":[],"p":159,"b":2},{"c":"[6체03-03]","k":"공통","sk":"","s":"체육(지체장애)","g":"초등학교 5~6학년","d":"표현","t":"스포츠 표현의 기본 동작을 다양하게 구성하여 발표하고 감상한다.","m":"은 스포츠 표현에 적합한 움직임 기술의 응용 동작을 활용하여 작품을 구성하고 표현하기 위해 설정하였다. 스포츠 표현에 적합한 움직임 기술의 응용 동작을 창의적으로 구성하고, 개인 또는 모둠별로 간단한 작품을 만들어 발표하며 작품의 의도와 동작의 심미성을 감상하도록 한다.","n":[],"p":159,"b":2},{"c":"[6체03-04]","k":"공통","sk":"","s":"체육(지체장애)","g":"초등학교 5~6학년","d":"표현","t":"전통 표현에서 움직임 기술을 응용한 기본 동작을 파악하고 표현한다.","m":"는 우리나라와 세계 여러 민족과 지역에서 전해 내려오는 전통 표현에서 기본 움직임 기술을 응용한 동작의 문화적 특징을 파악하고 그 특성을 살려 표현하기 위해 설정하였다. 전통 표현의 기본 동작에 적합한 움직임 기술의 응용 동작을 문화적 특색이 드러나게표현하도록 한다.","n":[],"p":159,"b":2},{"c":"[6체03-05]","k":"공통","sk":"","s":"체육(지체장애)","g":"초등학교 5~6학년","d":"표현","t":"전통 표현의 기본 동작을 다양하게 구성하여 발표하고 감상한다.","m":"는 전통 표현에 적합한 움직임 기술의 응용 동작을 활용하여 작품을 구성하고 표현하기 위해 설정하였다. 다양한 전통 표현에 담긴 역사와 특성을 이해하고 전통 표현의 움직임 기술 응용 동작을 문화적 특성에 따라 구성한다. 개인 또는 모둠별로 간단한 작품을 만들어 발표하며 작품의 의도와 동작이 갖는 전통적 의미를 감상하도록 한다.","n":[],"p":159,"b":2},{"c":"[6체03-06]","k":"공통","sk":"","s":"체육(지체장애)","g":"초등학교 5~6학년","d":"표현","t":"현대 표현에서 움직임 기술을 응용한 기본 동작을 파악하고 표현한다.","m":"은 현대 표현에서 기본 움직임 기술을 응용한 동작의 자유로움이 갖는 특징을 파악하고 창의적으로 표현하기 위해 설정하였다. 기본 동작에 적합한 움직임 기술 응용 동작을 기존의 표현 방법이나 틀에 얽매이지 않고 자유롭고 창의적으로 표현하도록 한다.","n":[],"p":159,"b":2},{"c":"[6체03-07]","k":"공통","sk":"","s":"체육(지체장애)","g":"초등학교 5~6학년","d":"표현","t":"현대 표현의 기본 동작을 다양하게 구성하여 발표하고 감상한다.","m":"은 현대 표현에 적합한 움직임 기술의 응용 동작을 활용하여 작품을 구성하고 표현하기 위해 설정하였다. 현대 표현에 적합한 움직임 기술의 응용 동작을 표현의 주제와 자유로운 흐름을 고려하여 구성한다. 개인 또는 모둠별로 간단한 작품을 만들어 발표하며 작품의 의도를 현대 사회의 문화적 특징과 비교하며 감상하도록 한다.","n":[],"p":159,"b":2},{"c":"[6체03-08]","k":"공통","sk":"","s":"체육(지체장애)","g":"초등학교 5~6학년","d":"표현","t":"다양한 표현 활동 유형을 수용하고, 움직임 표현의 아름다움을 추구한다.","m":"은 다양한 표현 활동 유형을 긍정적으로 수용하고 움직임 표현의 아름다움을 추구하도록 설정하였다. 다양한 표현 유형에 담긴 의미와 표현 특성을 직⋅간접적으로 탐색하며 표현 문화에 대한 이해의 폭을 확장하고 움직임 표현의 아름다움을 추구하도록 한다.","n":[],"p":159,"b":2},{"c":"[6체03-09]","k":"공통","sk":"","s":"체육(지체장애)","g":"초등학교 5~6학년","d":"표현","t":"장애 특성에 맞는 움직임 기술을 탐색하고 이를 여러 유형의 표현 활동에 활용한다.","m":"는 장애 특성에 맞는 움직임 기술을 익혀 스포츠 표현, 전통 표현, 현대 표현의 유형에 맞게 움직임 기술을 적용하게 하고자 설정하였다. 표현 활동의 유형에 맞는 움직임 기술을 적용하여 다양하게 작품을 구성하고 감상하도록 한다.","n":[],"p":159,"b":2},{"c":"[9체01-01]","k":"공통","sk":"","s":"체육(지체장애)","g":"중학교 1~3학년","d":"운동","t":"체력 증진의 의미를 이해하고 원리를 분석한다.","m":"은 체력 증진의 의미와 원리를 이해함으로써 효과적으로 체력 운동을 계획하기 위해 설정하였다. 체력 증진에 작용하는 과부하의 원리, 개별성의 원리, 점진성의 원리 등의개념을 이해하고 분석하도록 한다.","n":[],"p":163,"b":2},{"c":"[9체01-02]","k":"공통","sk":"","s":"체육(지체장애)","g":"중학교 1~3학년","d":"운동","t":"자신의 체력 수준에 맞는 체력 증진 운동을 실천한다.","m":"는 체력 증진 원리에 따라 체력 요소별 운동 방법을 자신의 체력 수준에 적합하게 실천하기 위해 설정하였다. 체력 요소별로 심화된 수준의 체력 운동 방법을 이해하고 실천하도록 한다.","n":[],"p":163,"b":2},{"c":"[9체01-03]","k":"공통","sk":"","s":"체육(지체장애)","g":"중학교 1~3학년","d":"운동","t":"체력 관리의 의미를 이해하고 원리를 분석한다.","m":"은 체력 관리의 의미와 원리를 이해함으로써 효과적으로 자신의 체력 관리 방법을 계획하기 위해 설정하였다. 일상생활에서 체력을 유지하거나 증진하는데 필요한 주 단위의 유산소성 운동, 유연성 운동, 근력 및 근지구력 운동, 좌식 생활 최소화 등 체력 관리의 기본 원리를 이해하고 분석하도록 한다.","n":[],"p":163,"b":2},{"c":"[9체01-04]","k":"공통","sk":"","s":"체육(지체장애)","g":"중학교 1~3학년","d":"운동","t":"자신의 체력을 진단하고 적합한 체력 관리 방법을 실천한다.","m":"는 일상생활에서 체력 관리 원리에 따라 체력 운동을 실천하기 위해 설정하였다. 일상생활에서 스스로 체력을 진단한 후 계획, 실행, 평가의 절차에 따라 체력 관리에 필요한 운동을 습관화하도록 한다.","n":[],"p":163,"b":2},{"c":"[9체01-05]","k":"공통","sk":"","s":"체육(지체장애)","g":"중학교 1~3학년","d":"운동","t":"운동 처방의 의미를 이해하고 원리를 분석한다.","m":"는 운동 처방의 의미와 구성 요소를 이해함으로써 체력 증진 목표와 수준에 따라 맞춤형 운동 처방을 계획하기 위해 설정하였다. 운동 빈도, 운동 강도, 운동 시간, 운동 형태 등의 요소를 이해하고 각 요소가 운동 처방에 어떻게 활용되는지를 이해하고 분석하도록 한다.","n":[],"p":163,"b":2},{"c":"[9체01-06]","k":"공통","sk":"","s":"체육(지체장애)","g":"중학교 1~3학년","d":"운동","t":"자신의 신체 조건이나 체력에 맞게 운동 처방 계획을 수립하고 안전하게 실천한다.","m":"은 운동 처방 원리에 따라 자신의 신체 조건이나 체력에 맞는 맞춤형 운동 처방을 실천하기 위해 설정하였다. 자신의 체격과 체력 발달 수준 검사, 운동 처방 목적 등을 고려하여 내용 설계, 실행, 평가 단계에 맞춰 운동 처방 프로그램을 안전하게 실천하도록 한다.","n":[],"p":163,"b":2},{"c":"[9체01-07]","k":"공통","sk":"","s":"체육(지체장애)","g":"중학교 1~3학년","d":"운동","t":"자신의 체력을 진단하고 체력 증진의 원리와 방법을 적용하여 장애 특성과 신체적 특징에 적합한 운동을 계획하여 스스로 체력을 관리한다.","m":"은 ‘장애학생건강체력평가(PAPS-D)’로 자신의 체력 수준을 정확히 진단하고 이를 토대로 운동 계획을 수립하여 체력을 관리하는 능력을 기르도록 설정하였다. 개별화된 체력 증진의 원리와 방법을 적용하여 스스로 체력을 관리하도록 하고, 지체장애 학생이 자신의 장애와 건강상의 특성을 고려한 운동 계획을 수립하게 함으로써 평생체육의 기초를 마련한다.","n":[],"p":163,"b":2},{"c":"[9체01-08]","k":"공통","sk":"","s":"체육(지체장애)","g":"중학교 1~3학년","d":"운동","t":"신체 건강의 의미를 이해하고 신체 건강 활동의 종류와 특성을 분석한다.","m":"은 신체 건강을 유지하기 위한 활동을 이해함으로써 신체적으로 건강한 생활을 계획하기 위해 설정하였다. 운동 습관, 식이 관리, 약물과 기호품 관리, 질병 예방 등 신체 건강에 영향을 미치는 다양한 활동과 실천 방법, 효과 등을 이해하고 분석하도록 한다.","n":[],"p":163,"b":2},{"c":"[9체01-09]","k":"공통","sk":"","s":"체육(지체장애)","g":"중학교 1~3학년","d":"운동","t":"자신에게 적합한 신체 건강 활동 방법을 실천한다.","m":"는 자신에게 필요한 신체 건강 활동을 실천하기 위해 설정하였다. 걷기, 스트레칭 등의 운동, 바른 자세, 올바른 식생활 및 기호품 관리, 약물 오남용 예방, 질병 예방 활동 등의 건강 활동을 일상생활에서 지속해서 실천하도록 한다.","n":[],"p":163,"b":2},{"c":"[9체01-10]","k":"공통","sk":"","s":"체육(지체장애)","g":"중학교 1~3학년","d":"운동","t":"정신 건강의 의미를 이해하고 정신 건강 활동의 종류와 특성을 분석한다.","m":"은 정신 건강을 유지하기 위한 활동을 이해함으로써 정서적, 심리적으로 건강한 생활을 계획하기 위해 설정하였다. 스트레스 및 감정 조절 등 정신 건강에 영향을 미치는 다양한 활동과 실천 방법 및 효과 등을 이해하고 분석하도록 한다.","n":[],"p":163,"b":2},{"c":"[9체01-11]","k":"공통","sk":"","s":"체육(지체장애)","g":"중학교 1~3학년","d":"운동","t":"자신에게 적합한 정신 건강 활동 방법을 실천한다.","m":"은 자신에게 필요한 정신 건강 활동을 실천하기 위해 설정하였다. 호흡법, 근육 이완법, 요가, 필라테스 등의 건강 활동을 일상생활에서 지속해서 실천하도록 한다.","n":[],"p":163,"b":2},{"c":"[9체01-12]","k":"공통","sk":"","s":"체육(지체장애)","g":"중학교 1~3학년","d":"운동","t":"사회적 건강의 의미를 이해하고 사회적 건강을 위한 활동의 종류와 특성을 분석한다.","m":"는 사회적 건강을 유지하기 위한 활동을 이해함으로써 사회 구성원으로서 건강하고 안전한 생활을 계획하기 위해 설정하였다. 양성평등 및 성 건강, 생활 안전 등 가정, 학교, 지역사회 공동체에서 자신과 타인, 집단의 건강한 생활에 필요한 방법을 이해하고 분석하도록 한다.","n":[],"p":163,"b":2},{"c":"[9체01-13]","k":"공통","sk":"","s":"체육(지체장애)","g":"중학교 1~3학년","d":"운동","t":"사회적으로 적합한 건강 활동 방법을 실천한다.","m":"은 사회 구성원에게 필요한 건강 활동을 실천하기 위해 설정하였다. 양성평등 및성 건강 관련 활동, 생활 안전 활동, 재난⋅재해 예방 및 대처 활동, 응급처치 활동 등을 일상생활에서 지속해서 실천하며 긍정적인 사회적 관계를 형성해 나가도록 한다.","n":[],"p":163,"b":2},{"c":"[9체01-14]","k":"공통","sk":"","s":"체육(지체장애)","g":"중학교 1~3학년","d":"운동","t":"체력 운동을 하며 실천 의지와 인내심을 보이고 자기주도적으로 문제를 해결한다.","m":"는 체력 운동을 지속해서 실천하기 위해 설정하였다. 체력 운동 과정에서 발생할 수 있는 시간적, 공간적 제약과 개인의 의지 등의 문제를 이겨내고 목표와 활동 방법을 주어진 환경에 맞게 수정하여 자기주도적으로 활동을 지속하도록 한다.","n":[],"p":163,"b":2},{"c":"[9체01-15]","k":"공통","sk":"","s":"체육(지체장애)","g":"중학교 1~3학년","d":"운동","t":"건강 활동을 자율적으로 실천하며 자신과 공동체에 대한 안전을 추구한다.","m":"는 건강 활동을 자율적으로 실천하는 능력을 기르기 위해 설정하였다. 자신의 건강뿐만 아니라 타인과의 관계, 사회 전체의 건강한 환경 조성을 위한 바람직한 태도를 실천하도록 한다. 개인의 자율성과 주도성을 바탕으로 공동체의 건강을 위해 타인과 함께 건강하고 안전한 환경을 조성하는 일에 적극적으로 참여하도록 한다.","n":[],"p":163,"b":2},{"c":"[9체02-01]","k":"공통","sk":"","s":"체육(지체장애)","g":"중학교 1~3학년","d":"스포츠","t":"동작형 스포츠의 역사와 특성을 탐색하고 비교한다.","m":"","n":[],"p":166,"b":2},{"c":"[9체02-02]","k":"공통","sk":"","s":"체육(지체장애)","g":"중학교 1~3학년","d":"스포츠","t":"동작형 스포츠의 수행 원리를 적용하여 경기 기능을 수련하고 향상한다.","m":"","n":[],"p":166,"b":2},{"c":"[9체02-03]","k":"공통","sk":"","s":"체육(지체장애)","g":"중학교 1~3학년","d":"스포츠","t":"동작형 스포츠의 경기 방법을 이해하고 경기 전략을 상황에 맞게 활용하며 안전하게 경기한다.","m":"은 동작형 스포츠의 경기 방법을 이해하고, 자신과 팀의 경기 능력, 시설 및 용·기구 등을 파악하여 경기 상황에 맞게 경기 전략을 활용하기 위해 설정하였다. 동작형 스포츠 경기를 수행하며 동작의 완성도에 중점을 두고, 경기 과정에서 공중 동작, 착지 중 낙상 등 운동으로 인한 손상 없이 안전하게 경기하며 사고 발생 시 신속하게 대처하도록 한다.","n":[],"p":166,"b":2},{"c":"[9체02-04]","k":"공통","sk":"","s":"체육(지체장애)","g":"중학교 1~3학년","d":"스포츠","t":"기록형 스포츠의 역사와 특성을 탐색하고 비교한다.","m":"","n":[],"p":166,"b":2},{"c":"[9체02-05]","k":"공통","sk":"","s":"체육(지체장애)","g":"중학교 1~3학년","d":"스포츠","t":"기록형 스포츠의 수행 원리를 적용하여 경기 기능을 수련하고 향상한다.","m":"","n":[],"p":166,"b":2},{"c":"[9체02-06]","k":"공통","sk":"","s":"체육(지체장애)","g":"중학교 1~3학년","d":"스포츠","t":"기록형 스포츠의 경기 방법을 이해하고 경기 전략을 상황에 맞게 활용하며 안전하게 경기한다.","m":"은 기록형 스포츠의 경기 방법을 이해하고, 상대 선수와 팀의 경기 능력, 시설 및 용･기구, 기후 조건 등을 파악하여 경기 상황에 맞게 경기 전략을 활용하기 위해 설정하였다. 기록형 스포츠 경기를 수행하며 기록 향상에 중점을 두고, 경기 과정에서 질주나 착지 중 낙상, 특정 근육의 집중적인 사용 등으로 인한 운동 손상 없이 안전하게 경기하며 사고 발생 시 신속하게 대처하도록 한다.","n":[],"p":166,"b":2},{"c":"[9체02-07]","k":"공통","sk":"","s":"체육(지체장애)","g":"중학교 1~3학년","d":"스포츠","t":"투기형 스포츠의 역사와 특성을 탐색하고 비교한다.","m":"","n":[],"p":167,"b":2},{"c":"[9체02-08]","k":"공통","sk":"","s":"체육(지체장애)","g":"중학교 1~3학년","d":"스포츠","t":"투기형 스포츠의 수행 원리를 적용하여 경기 기능을 수련하고 향상한다.","m":"","n":[],"p":167,"b":2},{"c":"[9체02-09]","k":"공통","sk":"","s":"체육(지체장애)","g":"중학교 1~3학년","d":"스포츠","t":"투기형 스포츠의 경기 방법을 이해하고 경기 전략을 상황에 맞게 활용하며 안전하게 경기한다.","m":"는 투기형 스포츠의 경기 방법을 이해하고, 상대 선수와 팀의 경기 능력, 시설 및 용･기구, 등을 파악하여 공격과 방어에 적합한 경기 전략을 활용하기 위해설정하였다. 투기형 스포츠 경기를 수행하며 상대의 기술에 맞서 겨루는 데 중점을 두고, 경기 과정에서 신체 접촉이나 타격 등으로 인한 운동 손상 없이 안전하게 경기하며 사고 발생 시 신속하게 대처하도록 한다.","n":[],"p":167,"b":2},{"c":"[9체02-10]","k":"공통","sk":"","s":"체육(지체장애)","g":"중학교 1~3학년","d":"스포츠","t":"기술형 스포츠의 경기 기능을 익히고 경기 방법과 전략을 이해한 후 자신의 장애 특성을 고려하여 안전하게 경기한다.","m":"은 기술형 스포츠에 필요한 기초 기능을 익히며 경기 방법과 전략을 이해하고, 자신의 장애 특성과 신체적 특징을 고려하여 안전하게 경기에 참여하기 위해 설정하였다. 스포츠 활동 중 발생할 수 있는 안전사고를 예방하고 안전사고 발생 시 적절히 대처하는 능력을 함양하도록 한다. 기술을 익히고 새로운 기록에 도전하는 데 중점을 둔다.","n":[],"p":167,"b":2},{"c":"[9체02-11]","k":"공통","sk":"","s":"체육(지체장애)","g":"중학교 1~3학년","d":"스포츠","t":"영역형 스포츠의 역사와 특성을 탐색하고 비교한다.","m":"","n":[],"p":167,"b":2},{"c":"[9체02-12]","k":"공통","sk":"","s":"체육(지체장애)","g":"중학교 1~3학년","d":"스포츠","t":"영역형 스포츠의 수행 원리를 적용하여 경기 기능을 수행하고 향상한다.","m":"","n":[],"p":167,"b":2},{"c":"[9체02-13]","k":"공통","sk":"","s":"체육(지체장애)","g":"중학교 1~3학년","d":"스포츠","t":"영역형 스포츠의 경기 방법을 이해하고 경기 전략을 활용하며 안전하게 경기한다.","m":"은 영역형 스포츠의 경기 방법을 이해하고, 공격 및 수비 전략을 선수와 팀의 특성에 맞게 선택하여 경기 상황에서 팀원과 상호 작용하며 상대의 영역에 침범하여 득점할 수 있는 전략을 활용하기 위해 설정하였다. 영역형 스포츠 경기를 수행하며 팀의 전략을 구상하는 데 중점을 두며, 경기 과정에서 상대와의 신체 접촉이나 충돌 등으로 인한 운동 손상 없이 안전하게 경기하며 사고 발생 시 신속하게 대처하도록 한다.","n":[],"p":167,"b":2},{"c":"[9체02-14]","k":"공통","sk":"","s":"체육(지체장애)","g":"중학교 1~3학년","d":"스포츠","t":"필드형 스포츠의 역사와 특성을 탐색하고 비교한다.","m":"","n":[],"p":167,"b":2},{"c":"[9체02-15]","k":"공통","sk":"","s":"체육(지체장애)","g":"중학교 1~3학년","d":"스포츠","t":"필드형 스포츠의 수행 원리를 적용하여 경기 기능을 수행하고 향상한다.","m":"","n":[],"p":167,"b":2},{"c":"[9체02-16]","k":"공통","sk":"","s":"체육(지체장애)","g":"중학교 1~3학년","d":"스포츠","t":"필드형 스포츠의 경기 방법을 이해하고 경기 전략을 활용하며 안전하게 경기한다.","m":"은 필드형 스포츠의 경기 방법을 이해하고, 공격 및 수비 전략을 선수와 팀의 특성에 맞게 선택하여 실제 경기 상황에서 팀원과 상호 작용하며 공을 던지고 받거나 타격하여 득점할 수 있는 전략을 활용하기 위해 설정하였다. 필드형 스포츠 경기를 수행하며 공격과 수비 역할 수행에 중점을 두며, 경기 과정에서 상대와의 신체 접촉이나 용⋅기구와의 충돌 등으로 인한 운동 손상 없이 안전하게 경기하며 사고 발생 시 신속하게 대처하도록 한다.","n":[],"p":167,"b":2},{"c":"[9체02-17]","k":"공통","sk":"","s":"체육(지체장애)","g":"중학교 1~3학년","d":"스포츠","t":"네트형 스포츠의 역사와 특성을 탐색하고 비교한다.","m":"","n":[],"p":167,"b":2},{"c":"[9체02-18]","k":"공통","sk":"","s":"체육(지체장애)","g":"중학교 1~3학년","d":"스포츠","t":"네트형 스포츠의 수행 원리를 적용하여 경기 기능을 수행하고 향상한다.","m":"","n":[],"p":167,"b":2},{"c":"[9체02-19]","k":"공통","sk":"","s":"체육(지체장애)","g":"중학교 1~3학년","d":"스포츠","t":"네트형 스포츠의 경기 방법을 이해하고 경기 전략을 활용하며 안전하게 경기한다.","m":"는 네트형 스포츠의 경기 방법을 이해하고, 단식과 복식, 공격 및 수비 전환 시기 등의 경기 전략을 상황에 맞게 선택하여, 경기 상황에서 상대가 공을 받아넘기지 못하는 경기 전략을 활용하기 위해 설정하였다. 네트형 스포츠 경기를 수행하며 팀원과 호흡하여 공격과 수비를 빠르게 전환하는 데 중점을 두며, 경기 과정에서 구성원이나 용⋅기구와의 충돌, 점프와 착지 등으로 인한 운동 손상 없이 안전하게 경기하며 사고 발생 시 신속하게 대처하도록 한다.","n":[],"p":167,"b":2},{"c":"[9체02-20]","k":"공통","sk":"","s":"체육(지체장애)","g":"중학교 1~3학년","d":"스포츠","t":"전략형 스포츠의 경기 기능을 익히고 경기 방법과 전략을 이해한 후 자신의 장애 특성을 고려하여 안전하게 경기한다.","m":"은 전략형 스포츠에 필요한 기초 기능을 익히며 경기 방법과 전략을 이해하고, 자신의 장애 특성과 신체적 특징을 고려하여 안전하게 경기에 참여하게 하고자 설정하였다. 스포츠 활동 중 발생할 수 있는 안전사고를 예방하고 안전사고 발생 시 적절히 대처하는 능력을 함양하도록 한다. 팀 스포츠 활동에 참여하여 구성원들과 소통하고 승패보다는 스포츠맨십을 익히는데 중점을 둔다.","n":[],"p":167,"b":2},{"c":"[9체02-21]","k":"공통","sk":"","s":"체육(지체장애)","g":"중학교 1~3학년","d":"스포츠","t":"생활환경형 스포츠의 역사와 특성을 탐색하고 비교한다.","m":"","n":[],"p":167,"b":2},{"c":"[9체02-22]","k":"공통","sk":"","s":"체육(지체장애)","g":"중학교 1~3학년","d":"스포츠","t":"생활환경형 스포츠의 수행 원리를 적용하여 기능을 수행하고 향상한다.","m":"","n":[],"p":167,"b":2},{"c":"[9체02-23]","k":"공통","sk":"","s":"체육(지체장애)","g":"중학교 1~3학년","d":"스포츠","t":"생활환경형 스포츠의 활동 방법을 이해하고 활동 전략을 활용하며 안전하게 경기한다.","m":"은 생활환경형 스포츠의 활동 방법을 이해하고 활동 상황에서 생활환경 조건을 고려한 활동 전략을 활용하기 위해 설정하였다. 가정, 집 주변, 지역사회 등의 생활환경에서활동하며 공간, 시설 등의 환경 조건을 파악하는 데 중점을 둔다. 생활환경형 스포츠 실천 과정에서 물리적 환경에 대한 부적응, 환경의 불안정성 등으로 인한 운동 손상 없이 안전하게 활동하며 사고 발생 시 신속하게 대처하도록 한다.","n":[],"p":167,"b":2},{"c":"[9체02-24]","k":"공통","sk":"","s":"체육(지체장애)","g":"중학교 1~3학년","d":"스포츠","t":"자연환경형 스포츠의 역사와 특성을 탐색하고 비교한다.","m":"","n":[],"p":167,"b":2},{"c":"[9체02-25]","k":"공통","sk":"","s":"체육(지체장애)","g":"중학교 1~3학년","d":"스포츠","t":"자연환경형 스포츠의 수행 원리를 적용하여 기능을 수행하고 향상한다.","m":"","n":[],"p":167,"b":2},{"c":"[9체02-26]","k":"공통","sk":"","s":"체육(지체장애)","g":"중학교 1~3학년","d":"스포츠","t":"자연환경형 스포츠의 활동 방법을 이해하고 활동 전략을 활용하며 안전하게 경기한다.","m":"은 자연환경형 스포츠의 활동 방법을 이해하고 활동 상황에서 자연환경과 생태 문화를 고려한 활동 전략을 활용하기 위해 설정하였다. 산, 강이나 바다, 하늘 등의 자연환경에서 활동하며 날씨, 장비 등의 환경 조건을 파악하는 데 중점을 둔다. 자연환경형 스포츠 실천 과정에서 기후나 자연환경의 변화, 용⋅기구의 불안정성 등으로 인한 운동 손상 없이 안전하게 활동하며 사고 발생 시 신속하게 대처하도록 한다.","n":[],"p":167,"b":2},{"c":"[9체02-27]","k":"공통","sk":"","s":"체육(지체장애)","g":"중학교 1~3학년","d":"스포츠","t":"생태형 스포츠의 기능과 활동 방법 및 전략을 이해하고 자신의 장애 특성을 고려하여 안전하게 참여한다.","m":"은 생태형 스포츠의 기초 기능과 활동 방법 및 전략을 익히고, 자신의 장애 특성과 신체적 특징을 고려하여 안전하게 활동에 참여하기 위해 설정하였다. 이 과정에서 다양한 생활환경과 자연환경을 탐색하고 친구, 가족, 지역사회 구성원들과 함께 안전하게 참여하도록 한다.","n":[],"p":167,"b":2},{"c":"[9체02-28]","k":"공통","sk":"","s":"체육(지체장애)","g":"중학교 1~3학년","d":"스포츠","t":"스포츠의 연습과 경기 과정에서 인내심을 발휘하여 적극적으로 도전한다.","m":"은 스포츠의 연습 및 경기 과정의 어려움을 극복함으로써 스포츠에 대한 도전 정신을 기르기 위해 설정하였다. 스포츠 유형별 기능의 연습 및 활동 과정에서 자신 혹은 공동으로 설정한 목표를 달성하기 위해 자기주도적으로 참여하고 인내하며 한계를 극복하도록 한다.","n":[],"p":167,"b":2},{"c":"[9체02-29]","k":"공통","sk":"","s":"체육(지체장애)","g":"중학교 1~3학년","d":"스포츠","t":"스포츠의 연습과 경기 과정에서 구성원 간에 서로 신뢰하며 팀 목표를 달성하기 위해 노력하고 경기 예절을 갖추며 정정당당하게 참여한다.","m":"는 스포츠의 연습 및 경기 과정에서 서로 믿고 정정당당하게 최선을 다하며 도전적인 태도를 기르기 위해 설정하였다. 구성원을 존중하고 팀의 공동 목표를 위해 끝까지 노력하며, 경기에 대한 열정을 갖고 상대와 심판, 관중 앞에서 공정하고 품위 있게 경기하도록 한다.","n":[],"p":167,"b":2},{"c":"[9체02-30]","k":"공통","sk":"","s":"체육(지체장애)","g":"중학교 1~3학년","d":"스포츠","t":"스포츠 환경에 대한 친화적 태도와 지속가능한 스포츠 환경을 만들기 위한 공동체 의식을발휘한다.","m":"은 스포츠 환경에 대한 생태전환적 태도를 기르기 위해 설정하였다. 스포츠의 연습 및 활동 과정에서 여러 환경 문제를 인식하고 구성원과 함께 개선하려는 공동체 의식을 보이며, 스포츠 환경에 대한 친화적인 태도로 활동하도록 한다.","n":[],"p":167,"b":2},{"c":"[9체02-31]","k":"공통","sk":"","s":"체육(지체장애)","g":"중학교 1~3학년","d":"스포츠","t":"좌식 및 휠체어 스포츠의 역사와 특성을 탐색하고 활동 방법과 전략을 익혀 좌식 및 휠체어 스포츠 경기에 참여한다.","m":"은 좌식 및 휠체어 스포츠의 역사와 특성을 탐색하고 경기 방법과 기초 전략을 익혀 경기하기 위해 설정하였다. 자신의 관심과 흥미에 따라 다양한 좌식 및 휠체어 스포츠를 경험하고 여가 활동과 직업생활 영역에서 자신의 잠재력을 계발하도록 한다.","n":[],"p":167,"b":2},{"c":"[9체03-01]","k":"공통","sk":"","s":"체육(지체장애)","g":"중학교 1~3학년","d":"표현","t":"스포츠 표현의 역사와 특성을 탐색하고 비교한다.","m":"","n":[],"p":172,"b":2},{"c":"[9체03-02]","k":"공통","sk":"","s":"체육(지체장애)","g":"중학교 1~3학년","d":"표현","t":"스포츠 표현의 원리를 적용하여 동작을 심미적으로 표현한다.","m":"스포츠 표현의 원리를 적용하여 역동적이고 아름답게 동작을 표현하고 향상하도록 한다.","n":[],"p":172,"b":2},{"c":"[9체03-03]","k":"공통","sk":"","s":"체육(지체장애)","g":"중학교 1~3학년","d":"표현","t":"스포츠 표현의 특성과 원리를 반영한 작품을 창작하고 표현 요소를 고려하여 감상한다.","m":"은 스포츠 표현의 특성과 원리를 반영한 작품을 창작하고 체계적으로 감상하기 위해 설정하였다. 심미적 표현을 강조하는 스포츠 표현의 특성과 원리, 일련의 창작 과정을 고려하여 개인 또는 모둠별로 작품을 창작하고, 주제, 동작, 구성, 음악, 의상 등의 표현 요소를 고려하여 작품을 감상하도록 한다.","n":[],"p":172,"b":2},{"c":"[9체03-04]","k":"공통","sk":"","s":"체육(지체장애)","g":"중학교 1~3학년","d":"표현","t":"전통 표현의 역사와 특성을 탐색하고 비교한다.","m":"","n":[],"p":172,"b":2},{"c":"[9체03-05]","k":"공통","sk":"","s":"체육(지체장애)","g":"중학교 1~3학년","d":"표현","t":"전통 표현의 원리를 적용하여 동작을 심미적으로 표현한다.","m":"는 전통 표현의 원리를 적용하여 동작을 표현하기 위해 설정하였다. 전통 표현의원리를 적용하여 자연스럽고 아름답게 동작을 표현하고 향상하도록 한다.","n":[],"p":172,"b":2},{"c":"[9체03-06]","k":"공통","sk":"","s":"체육(지체장애)","g":"중학교 1~3학년","d":"표현","t":"전통 표현의 특성과 원리를 반영한 작품을 창작하고 표현 요소를 고려하여 감상한다.","m":"은 전통 표현의 특성과 원리를 반영한 작품을 창작하고 체계적으로 감상하기 위해설정하였다. 전형적 표현을 강조하는 전통 표현의 특성과 원리, 일련의 창작 과정을 고려하여 개인 또는 모둠별로 작품을 창작하고, 주제, 동작, 구성, 음악, 의상 등의 표현 요소를 고려하여 작품을 감상하도록 한다.","n":[],"p":172,"b":2},{"c":"[9체03-07]","k":"공통","sk":"","s":"체육(지체장애)","g":"중학교 1~3학년","d":"표현","t":"현대 표현의 역사와 특성을 탐색하고 비교한다.","m":"","n":[],"p":172,"b":2},{"c":"[9체03-08]","k":"공통","sk":"","s":"체육(지체장애)","g":"중학교 1~3학년","d":"표현","t":"현대 표현의 원리를 적용하여 동작을 심미적으로 표현한다.","m":"은 현대 표현의 원리를 적용하여 동작을 표현하기 위해 설정하였다. 현대 표현의원리를 적용하여 자유롭고 아름답게 동작을 표현하고 향상하도록 한다.","n":[],"p":172,"b":2},{"c":"[9체03-09]","k":"공통","sk":"","s":"체육(지체장애)","g":"중학교 1~3학년","d":"표현","t":"현대 표현의 특성과 원리를 반영한 작품을 창작하고 표현 요소를 고려하여 감상한다.","m":"는 현대 표현의 특성과 원리를 반영한 작품을 창작하고 체계적으로 감상하기 위해설정하였다. 창조적 표현을 강조하는 현대 표현의 특성과 원리, 일련의 창작 과정을 고려하여 개인 또는 모둠별로 작품을 창작하고, 주제, 동작, 구성, 음악, 의상 등의 표현 요소를 고려하여 작품을 감상하도록 한다.","n":[],"p":172,"b":2},{"c":"[9체03-10]","k":"공통","sk":"","s":"체육(지체장애)","g":"중학교 1~3학년","d":"표현","t":"움직임을 표현하고 창작하는 과정에서 독창적이고 개방적인 태도를 갖고 표현 활동 작품을 공감하고 비평한다.","m":"은 표현의 동작 수행, 창작, 감상의 전 과정을 통해 창의성과 비판적 능력을 기르기 위해 설정하였다. 동작 수행 및 창작 과정에서 독창성을 추구하고, 다양한 표현 문화를수용하여, 작품 감상을 통해 예술적 표현에 대해 공감하고 비판적으로 바라보려는 태도를 함양하도록 한다.","n":[],"p":172,"b":2},{"c":"[9체03-11]","k":"공통","sk":"","s":"체육(지체장애)","g":"중학교 1~3학년","d":"표현","t":"장애 특성에 따라 표현 활동 유형별 표현 원리를 적용하고 동작을 미적으로 표현한다.","m":"은 지체장애 학생이 자신의 장애 특성을 고려하여 표현 원리를 스포츠 표현, 전통 표현, 현대 표현에 적용하는 능력을 기르게 하고자 설정하였다. 개인은 물론 모둠별로 작품을 창작하는 과정에서 장애 특성 및 신체적 특징을 고려하여 동작을 표현하도록 한다.","n":[],"p":172,"b":2},{"c":"[4미01-01]","k":"공통","sk":"","s":"미술(시각장애)","g":"초등학교 3~4학년","d":"미적 체험","t":"자연물과 인공물을 탐색하는 데 다양한 감각을 활용할 수 있다.","m":"","n":[],"p":191,"b":2},{"c":"[4미01-02]","k":"공통","sk":"","s":"미술(시각장애)","g":"초등학교 3~4학년","d":"미적 체험","t":"주변 대상을 체험하며 떠오른 느낌과 생각을 다양한 방법으로 나타낼 수 있다.","m":"","n":[],"p":191,"b":2},{"c":"[4미01-03]","k":"공통","sk":"","s":"미술(시각장애)","g":"초등학교 3~4학년","d":"미적 체험","t":"미적 탐색에 호기심을 갖고 참여하며 자신의 감각으로 대상의 특징을 이해할 수 있다.","m":"성취기준은 객관적 지식을 적용하거나 고정 관념에 따라 대상을 이해하는 방식에서 벗어나 몸의 다양한 감각으로 직접 대상을 탐색하는 데 호기심을 갖고 참여하며 자신의 감각을 바탕으로 대상의 특징을 이해하는 데 중점을 둔다. 같은 대상이라도 지각하고 반응하는 방식은 학생마다 다를 수 있다. 대상을 지각하며 자연스럽게 떠올린 자신의 감정, 느낌, 생각 등을 나타내고 친구들의 다양한 반응을 접하며 자신만의 고유한 감각을 통해 대상이 지닌 다채로운 특징을 이해한다.","n":[],"p":191,"b":2},{"c":"[4미01-04]","k":"공통","sk":"","s":"미술(시각장애)","g":"초등학교 3~4학년","d":"미적 체험","t":"생활 속에서 활용되는 미술에 관심을 가지고 미술의 특징과 역할을 발견할 수 있다.","m":"","n":[],"p":191,"b":2},{"c":"[4미02-01]","k":"공통","sk":"","s":"미술(시각장애)","g":"초등학교 3~4학년","d":"표현","t":"관찰과 상상으로 아이디어를 떠올려 표현 주제를 구체화할 수 있다.","m":"","n":[],"p":192,"b":2},{"c":"[4미02-02]","k":"공통","sk":"","s":"미술(시각장애)","g":"초등학교 3~4학년","d":"표현","t":"기본적인 표현 재료와 용구의 특성을 이해하고 사용 방법을 익힐 수 있다.","m":"성취기준은 기본적인 표현 재료의 물성을 경험하고 표현 용구의 사용법을 충분히 익히는 활동에 중점을 둔다. 표현 재료와 용구는 단순히 표현 수단을 넘어 그 자체로서 학생들에게 새로운 느낌과 생각을 가지게 한다. 초등학교 3~4학년 수준에서 다룰 수 있는 기본적인 표현 재료에는 종이류(도화지, 색종이, 한지 등), 드로잉 재료(연필, 펜 등), 채색 재료(크레파스, 파스텔, 수채화물감, 아크릴물감, 먹 등), 조소 재료(찰흙, 종이죽, 공예용 철사 등)가 있으며 그 밖에 생활 속에서 익숙하게 다루고 있는 다양한 생활용품 및 디지털 매체를 활용할 수 있다.","n":[],"p":192,"b":2},{"c":"[4미02-03]","k":"공통","sk":"","s":"미술(시각장애)","g":"초등학교 3~4학년","d":"표현","t":"조형 요소의 특징을 자유롭게 탐색하며 주제 표현에 알맞게 활용할 수 있다.","m":"성취기준은 미술 표현에 기초가 되는 조형 요소의 특징을 탐색하고 표현 주제와 연결 지어 조형 요소를 활용하는 데 중점을 둔다. 조형 요소에는 선, 형과 형태, 색, 질감, 양감 등이 있다. 각 조형 요소를 탐색하여 시각적 특징을 발견하고 표현하고자 하는 주제와 어울리는 조형 요소를 찾아 주제 표현에 활용한다.","n":[],"p":192,"b":2},{"c":"[4미02-04]","k":"공통","sk":"","s":"미술(시각장애)","g":"초등학교 3~4학년","d":"표현","t":"표현 의도를 가지고 작품을 제작하며 자기 작품을 소중히 여길 수 있다.","m":"성취기준은 작품 제작을 위한 계획 단계부터 작품을 완성한 후 발표 및 전시에 이르기까지 학생들의 제작 의도와 작품을 대하는 태도에 중점을 둔다. 작품 제작에 분명한 의도를 갖는 것은 주도적으로 작품을 제작하는 바탕이 되어 표현 재료와 용구, 조형 요소의 특징을 탐색하여 작품에 활용하는 일련의 과정을 이끈다. 또한, 자신의 의도에 따라 주도적으로 제작한 작품에는 특별한 의미가 부여되어 작품을 소중히 여기는 태도로 이어질 수 있다.","n":[],"p":192,"b":2},{"c":"[4미02-05]","k":"공통","sk":"","s":"미술(시각장애)","g":"초등학교 3~4학년","d":"표현","t":"미술과 타 교과를 관련지어 주제를 표현하는데 흥미를 가질 수 있다.","m":"","n":[],"p":192,"b":2},{"c":"[4미03-01]","k":"공통","sk":"","s":"미술(시각장애)","g":"초등학교 3~4학년","d":"감상","t":"미술 작품을 자세히 보고 작품과 미술가에 관해 질문할 수 있다.","m":"성취기준은 작품에 대한 교사의 질문이나 조사에 의존하는 감상 방식에서 벗어나 학생들이 작품을 충분히 보고 자신의 느낌과 생각을 바탕으로 질문을 만들어 상호 작용하는 데 중점을 둔다. 질문하기를 통한 감상은 작품과 나누는 대화의 시작이다. 작품 정보를 활용한 질문, 작품의 내용이나 형식에 관한 질문, 작가의 입장이 되어 던지는 질문 등 다양한 질문을 통하여 학생들이 감상에 흥미를 느끼고 감상 관점을 기르도록 한다.","n":[],"p":194,"b":2},{"c":"[4미03-02]","k":"공통","sk":"","s":"미술(시각장애)","g":"초등학교 3~4학년","d":"감상","t":"미술 작품의 특징과 작품에 관한 자신의 느낌과 생각을 설명할 수 있다.","m":"","n":[],"p":194,"b":2},{"c":"[4미03-03]","k":"공통","sk":"","s":"미술(시각장애)","g":"초등학교 3~4학년","d":"감상","t":"미술 문화에 관심을 가지고 전시 및 행사에 참여할 수 있다.","m":"","n":[],"p":194,"b":2},{"c":"[4미03-04]","k":"공통","sk":"","s":"미술(시각장애)","g":"초등학교 3~4학년","d":"감상","t":"작품 감상에 흥미를 가지고 참여하며 작품에 대한 자신의 감상 관점을 존중할 수 있다.","m":"","n":[],"p":194,"b":2},{"c":"[6미01-01]","k":"공통","sk":"","s":"미술(시각장애)","g":"초등학교 5~6학년","d":"미적 체험","t":"다양한 감각과 매체를 활용하여 자신과 대상을 탐색할 수 있다.","m":"","n":[],"p":195,"b":2},{"c":"[6미01-02]","k":"공통","sk":"","s":"미술(시각장애)","g":"초등학교 5~6학년","d":"미적 체험","t":"자신이나 대상에서 찾은 감각적 특징, 느낌, 생각 등을 관련지어 나타낼 수 있다.","m":"성취기준은 자신이나 대상, 그리고 시시각각 변화하는 현상 등 주변 환경을 탐색하며 예민하게 찾은 감각적 특징과 체험 과정에서 떠오른 느낌과 생각을 관련지어 보는 경험에 중점을 둔다. 미술의 특성상 시각적 특징을 우선 다루게 되지만, 보이지 않아도 느낄 수 있는 특징이나 느낌과 상상이 반영된 색, 형, 이미지, 문구, 소리, 움직임 등을 자유롭게 활용한다. 이를 통해 감각이 사고에 미치는 영향뿐만 아니라 자신과 환경 사이의 관계를 이해한다.","n":[],"p":195,"b":2},{"c":"[6미01-03]","k":"공통","sk":"","s":"미술(시각장애)","g":"초등학교 5~6학년","d":"미적 체험","t":"주변 환경에 대한 민감한 태도로 대상과 상호 작용하며 새로운 의미를 발견할 수 있다.","m":"성취기준은 주변 환경 속 대상과 민감하게 상호 작용하며 경험한 느낌과 생각을바탕으로 대상에 이름 붙이기, 자신을 닮은 대상 찾기, 대상을 연결하여 이야기 만들기 등 대상에 의미를 부여하는 활동에 중점을 둔다. 보는 사람, 시간과 장소, 분위기 등에 따라 대상과 다양하게 교감하며 그 과정에서 생성되는 의미를 성찰할 수 있도록 한다. 이를 통해 예술적 사고를 이끄는 대상의 가치를 이해하고 자신과 환경과의 생태전환적 관계를 인식한다.","n":[],"p":195,"b":2},{"c":"[6미01-04]","k":"공통","sk":"","s":"미술(시각장애)","g":"초등학교 5~6학년","d":"미적 체험","t":"이미지가 나타내는 의미를 비판적으로 이해하고 느낌과 생각을 전달하는 데 활용할 수 있다.","m":"","n":[],"p":195,"b":2},{"c":"[6미02-01]","k":"공통","sk":"","s":"미술(시각장애)","g":"초등학교 5~6학년","d":"표현","t":"다양한 방법으로 아이디어를 연결하여 확장된 표현 주제로 발전시킬 수 있다.","m":"","n":[],"p":197,"b":2},{"c":"[6미02-02]","k":"공통","sk":"","s":"미술(시각장애)","g":"초등학교 5~6학년","d":"표현","t":"디지털 매체 등 다양한 표현 재료와 용구를 탐색하여 작품 제작에 활용할 수 있다.","m":"성취기준은 하나의 표현 주제에도 다양한 표현 방식이 있음을 이해하고 학생들이자신의 의도에 따라 표현 재료와 방법을 선택하여 작품을 제작하는 데 중점을 둔다. 표현 주제에 적합한 표현 재료와 용구의 쓰임을 학생 스스로 탐색하고 습득하여 주제가 잘 드러날 수 있도록 적용하게 한다. 특히, 디지털 매체는 신체적 감각과 지각을 확장하는 표현의 도구로써 디지털 매체의 특징과 사용법을 익혀 작품 제작에 효과적으로 활용하게 한다.","n":[],"p":197,"b":2},{"c":"[6미02-03]","k":"공통","sk":"","s":"미술(시각장애)","g":"초등학교 5~6학년","d":"표현","t":"조형 요소의 어울림을 통해 조형 원리를 이해하고 주제 표현에 연결할 수 있다.","m":"","n":[],"p":197,"b":2},{"c":"[6미02-04]","k":"공통","sk":"","s":"미술(시각장애)","g":"초등학교 5~6학년","d":"표현","t":"주제 표현에 의지를 갖고 표현 과정을 돌아보며 작품을 발전시킬 수 있다.","m":"성취기준은 계획 단계를 비롯한 작품 완성의 전 과정에서 주제 표현에 의지를 갖고 표현 방법과 절차를 재고하는 성찰의 태도를 기르는 데 중점을 둔다. 주제 표현의 의지를 갖는 것은 표현 주제를 나타내기 위해 다양한 표현 재료와 용구, 조형 요소와 원리를 작품에 활용하는 일련의 과정을 이끈다. 또한 작품을 주도적으로 돌아보고 보완하며 발전시키는 경험을 통해 학생들은 작품 완성의 기준을 스스로 설정하고 창작에 대한 상위 인지를 활성화한다.","n":[],"p":197,"b":2},{"c":"[6미02-05]","k":"공통","sk":"","s":"미술(시각장애)","g":"초등학교 5~6학년","d":"표현","t":"미술과 타 교과의 내용과 방법을 융합하는 활동을 자유롭게 시도할 수 있다.","m":"","n":[],"p":197,"b":2},{"c":"[6미03-01]","k":"공통","sk":"","s":"미술(시각장애)","g":"초등학교 5~6학년","d":"감상","t":"미술 작품을 작품이 만들어진 시대적, 지역적 배경 등과 연결하여 이해할 수 있다.","m":"","n":[],"p":198,"b":2},{"c":"[6미03-02]","k":"공통","sk":"","s":"미술(시각장애)","g":"초등학교 5~6학년","d":"감상","t":"미술 작품의 내용(소재, 주제 등)과 형식(재료와 용구, 표현 방법, 조형 요소와 원리 등)을분석하여 작품의 특징을 설명할 수 있다.","m":"","n":[],"p":198,"b":2},{"c":"[6미03-03]","k":"공통","sk":"","s":"미술(시각장애)","g":"초등학교 5~6학년","d":"감상","t":"공동체의 미술 문화 활동에 관심을 가지고 참여하며 경험을 공유할 수 있다.","m":"성취기준은 교실 수업이라는 시공간을 확장하여 전시, 지역 축제, 문화 행사 등 학생들이 살아가는 지역사회의 미술 문화에 관심을 가지고 적극적으로 참여함으로써 문화를 향유하는 태도를 생활화하는 데 중점을 둔다. 또한 그 경험을 공유하고 소통함으로써 새로운 문화를 생성해가는 데까지 관심을 확장한다.","n":[],"p":198,"b":2},{"c":"[6미03-04]","k":"공통","sk":"","s":"미술(시각장애)","g":"초등학교 5~6학년","d":"감상","t":"다양한 방법을 활용하여 작품을 감상하며 작품에 관한 서로 다른 관점을 존중할 수 있다.","m":"","n":[],"p":198,"b":2},{"c":"[9미01-01]","k":"공통","sk":"","s":"미술(시각장애)","g":"중학교 1~3학년","d":"미적 체험","t":"감각을 활용하여 대상과 현상을 탐색하고 자신과 환경에 대한 감수성을 확장할 수 있다.","m":"성취기준은 다양한 감각을 활용하여 주변의 대상과 현상을 탐색하고 자신과 자신을 둘러싼 환경에 대한 미적 인식을 통해 감수성을 일깨우는 데 중점을 둔다. 감각을 활용하여 대상과 현상을 탐색하고 상호 작용하여 미적 인식에 이르는 경험을 통해 주변 환경을 포함하여 생태적, 문화적, 사회적 환경까지 새롭게 바라보고 의미를 부여하며 앎을 성찰할 수 있다.","n":[],"p":199,"b":2},{"c":"[9미01-02]","k":"공통","sk":"","s":"미술(시각장애)","g":"중학교 1~3학년","d":"미적 체험","t":"시각 문화의 의미와 역할을 알고 이미지를 비판적으로 해석할 수 있다.","m":"","n":[],"p":199,"b":2},{"c":"[9미01-03]","k":"공통","sk":"","s":"미술(시각장애)","g":"중학교 1~3학년","d":"미적 체험","t":"다양한 문화를 존중하며 이미지를 활용하여 소통할 수 있다.","m":"","n":[],"p":199,"b":2},{"c":"[9미01-04]","k":"공통","sk":"","s":"미술(시각장애)","g":"중학교 1~3학년","d":"미적 체험","t":"삶과 미술의 관계를 이해하고 다양한 분야와의 연결 방안을 모색할 수 있다.","m":"성취기준은 삶 속에서 미술이 어떻게 상호 작용하고 있는지 그 중요성을 인식하는 것으로 출발한다. 인문, 과학, 공학 등 타 분야와 사회 현상에 이르기까지 폭넓게 연결된 미술의 사례를 찾고 자신의 흥미에 맞는 진로나 직업 및 관심 분야와 관련하여 적용 방안을 탐색하는 데 중점을 둔다. 미술과 관련된 직업과 진로를 적극적으로 탐색하고, 자유학기제 진로 탐색 활동, 진로연계교육 등과 연계할 수 있다.","n":[],"p":199,"b":2},{"c":"[9미02-01]","k":"공통","sk":"","s":"미술(시각장애)","g":"중학교 1~3학년","d":"표현","t":"주제를 탐구하고 의도를 반영하여 적합한표현을 계획할 수 있다.","m":"","n":[],"p":200,"b":2},{"c":"[9미02-02]","k":"공통","sk":"","s":"미술(시각장애)","g":"중학교 1~3학년","d":"표현","t":"주도적이고 도전적인 태도로 다양한 미술 표현을 실험하고 작품에 적용할 수 있다.","m":"성취기준은 주제를 효과적으로 시각화하는 방법을 찾기 위해 도전하고 실험하는 태도를 기르는 데 중점을 둔다. 실패를 두려워하거나 익숙한 표현 방법에 안주하지 않고 작품에 적합한 표현 방법과 매체를 주도적으로 탐색하고 활용할 수 있다.","n":[],"p":200,"b":2},{"c":"[9미02-03]","k":"공통","sk":"","s":"미술(시각장애)","g":"중학교 1~3학년","d":"표현","t":"조형 요소와 원리, 표현 재료와 방법, 디지털 매체를 포함한 다양한 매체를 활용하여주제를 효과적으로 표현할 수 있다.","m":"","n":[],"p":200,"b":2},{"c":"[9미02-04]","k":"공통","sk":"","s":"미술(시각장애)","g":"중학교 1~3학년","d":"표현","t":"자신과 타인의 작품을 존중하며, 다양한 방법으로 공유하고 소통할 수 있다.","m":"성취기준은 자신의 작품을 소중히 여기고 타인의 작품을 존중하는 태도를 지니며, 효과적인 방법으로 작품을 공유하고 소통하는 과정을 통해 표현의 가능성을 확장하는 데 중점을 둔다. 미술 표현 과정과 결과물을 교실, 복도, 지역사회 공간, 온라인 공간까지 확장하여 공유하고 발표하며 토론할 수 있다.","n":[],"p":200,"b":2},{"c":"[9미02-05]","k":"공통","sk":"","s":"미술(시각장애)","g":"중학교 1~3학년","d":"표현","t":"미술 표현 과정에서의 경험을 성찰하고 삶의 문제 해결에 활용할 수 있다.","m":"성취기준은 미술 표현 과정에서 마주하는 크고 작은 질문과 답을 찾아 나가는 과정이 가지는 가치를 알고 그 경험을 삶의 다양한 문제에 활용하는 데 중점을 둔다. 표현 주제를 찾고, 계획하고, 실험하고, 제작하고, 타인과 상호 작용하는 전체 과정에서 경험한 지식⋅이해, 과정⋅기능, 가치⋅태도를 삶의 다양한 문제와 연결할 수 있다.","n":[],"p":200,"b":2},{"c":"[9미03-01]","k":"공통","sk":"","s":"미술(시각장애)","g":"중학교 1~3학년","d":"감상","t":"미술의 시대적, 지역적, 사회적 맥락을 이해하고 설명할 수 있다.","m":"","n":[],"p":201,"b":2},{"c":"[9미03-02]","k":"공통","sk":"","s":"미술(시각장애)","g":"중학교 1~3학년","d":"감상","t":"작품의 내용과 형식을 분석하고 미술 용어와 지식을 활용하여 설명할 수 있다.","m":"","n":[],"p":201,"b":2},{"c":"[9미03-03]","k":"공통","sk":"","s":"미술(시각장애)","g":"중학교 1~3학년","d":"감상","t":"다양한 감상 방법과 관점을 활용하여 작품을 해석할 수 있다.","m":"","n":[],"p":201,"b":2},{"c":"[9미03-04]","k":"공통","sk":"","s":"미술(시각장애)","g":"중학교 1~3학년","d":"감상","t":"미술의 다원성에 대한 존중을 바탕으로 미술 감상 경험을 삶과 연결하고 공동체 문화에 기여할 수 있다.","m":"성취기준은 미술의 다원성을 존중하는 태도를 바탕으로 미술 감상 과정과 결과에서 얻은 지식과 경험을 자신의 삶과 연결하여 통찰을 얻고 자신이 속한 공동체가 더 나은문화를 만들어 나가도록 하는 데 중점을 둔다. 미술 작품과 그에 얽힌 다양한 주제에 관해 의견을 나누는 가운데 미술의 가치와 역할을 인식하고 미술을 통해 나와 공동체의 문화를 새롭게 하는 데 기여할 수 있다.","n":[],"p":201,"b":2},{"c":"[6시자01-01]","k":"공통","sk":"","s":"시각장애인 자립생활(초·중)","g":"초등학교 5~6학년","d":"보행","t":"공간을 나타내는 용어를 알고, 공간에서 자신의 위치를 파악한다.","m":"이 성취기준은 환경에서 자신과 사물의 위치를 인식하는 능력을 기르게 하고자설정하였다. 위아래와 좌우, 시계 방향, 동서남북의 방위, 미터, 걸음(보) 등의 거리 단위, 간단한 촉지도 사용 등을 다룬다. 공간⋅위치와 관련된 개념을 사례를 바탕으로 이해하고, 교실, 강당, 운동장, 복도 같은 다양한 공간에서 자신과 사물의 위치를 정확하게 파악하고 표현하도록 한다.","n":[],"p":222,"b":2},{"c":"[6시자01-02]","k":"공통","sk":"","s":"시각장애인 자립생활(초·중)","g":"초등학교 5~6학년","d":"보행","t":"보행 환경에서 랜드마크와 단서를 설정하고 방향정위에 활용한다.","m":"이 성취기준은 방향정위를 위해 랜드마크와 단서를 선정하고 활용하는 능력을 기르게 하고자 설정하였다. 랜드마크와 단서의 개념, 선정 기준, 활용 방법, 잔존 시각과 스마트폰 활용 등을 다룬다. 랜드마크와 단서의 개념과 유형을 사례를 바탕으로 이해하고, 보행 환경에서 주요 이동 구간마다 적절한 랜드마크와 단서를 선정하여 방향정위에 활용하도록 한다.","n":[],"p":222,"b":2},{"c":"[6시자01-03]","k":"공통","sk":"","s":"시각장애인 자립생활(초·중)","g":"초등학교 5~6학년","d":"보행","t":"보행 장소와 상황에 적합한 안내 보행 방법을 선택하여 이동한다.","m":"이 성취기준은 낯선 환경에서 적절한 안내 보행 기술을 사용하는 능력을 기르게 하고자 설정하였다. 안내 보행의 도움 요청과 거절, 안내 보행의 표준 자세, 안내 보행기술의 유형과 자세 등을 다룬다. 안내 보행 기술의 종류와 사용 장소를 사례를 바탕으로 이해하고, 복도, 좁은 통로, 출입문, 계단, 엘리베이터 등 보행 장소에 따라 적합한 안내 보행 기술을 사용하여 이동하도록 한다.","n":[],"p":222,"b":2},{"c":"[6시자01-04]","k":"공통","sk":"","s":"시각장애인 자립생활(초·중)","g":"초등학교 5~6학년","d":"보행","t":"실내 환경에서 적절한 보행 기술을 사용하여 안전하게 이동한다.","m":"이 성취기준은 실내에서 적절한 보행 기술을 사용하여 안전하게 이동하는 능력을 기르게 하고자 설정하였다. 자기 보호법, 떨어진 물건 찾기, 손으로 스쳐 가기, 평행 정렬(서기)과 수직 정렬(서기), 장애물 우회하기, 공간 탐색법의 종류와 방법 등을 다룬다. 실내의 다양한 장소를 이동할 때 벽을 따라 스쳐 가기와 신체 정렬 기술들을 적절히 선택하여 이동하고, 공간 탐색 기술을 사용하여 낯선 공간을 체계적으로 탐색하여 친숙화 하도록 한다.","n":[],"p":222,"b":2},{"c":"[6시자01-05]","k":"공통","sk":"","s":"시각장애인 자립생활(초·중)","g":"초등학교 5~6학년","d":"보행","t":"적응 보행 기구의 기본 사용법을 알고, 친숙한 장소에서 사용하여 이동한다.","m":"이 성취기준은 시각장애 유아와 시각중복장애 학생을 포함하여 흰지팡이 사용이 어려운 학생이 친숙한 환경에서 타인의 도움 없이 스스로 이동하는 능력을 기르게 하고자 설정하였다. 적응 보행 기구의 종류, 구조와 기능, 장애물 탐지 기술, 직선 보행 기술 등을 다룬다. 장애물이 없는 장소에서 적응 보행 기구의 기본 사용법을 먼저 익히고, 학교의 복도, 로비, 교실, 가정과 학교 인근 등 일과 활동을 하는 보행 장소에서 적응 보행 기구를 사용하여 이동하도록 한다.","n":[],"p":222,"b":2},{"c":"[6시자01-06]","k":"공통","sk":"","s":"시각장애인 자립생활(초·중)","g":"초등학교 5~6학년","d":"보행","t":"흰지팡이 기초 기술의 종류를 알고, 보행 장소에 맞는 기술을 선택하여 사용한다.","m":"이 성취기준은 실내외 환경에서 주로 사용하는 흰지팡이 기초 기술을 사용하는 능력을 기르게 하고자 설정하였다. 흰지팡이의 구조와 기능, 선택 절차와 고려 사항, 대각선법, 지면 접촉 유지법, 이점 촉타법 그리고 학교의 복도, 계단, 엘리베이터, 운동장에서의 흰지팡이 사용 등을 다룬다. 흰지팡이 기술의 종류와 사용 장소 사례를 통해 이해하고, 학교의 복도, 로비, 계단, 엘리베이터 등의 장소에서 적합한 흰지팡이 기술을 선택하여 이동하도록 한다.","n":[],"p":222,"b":2},{"c":"[6시자01-07]","k":"공통","sk":"","s":"시각장애인 자립생활(초·중)","g":"초등학교 5~6학년","d":"보행","t":"학교 통학버스와 자가용의 구조를 알고, 안전하게 승하차한다.","m":"이 성취기준은 통학 버스와 자가용을 스스로 안전하게 이용하는 능력을 기르게 하고자 설정하였다. 통학 버스와 자가용의 외부와 내부 구조, 승차 기술, 하차 기술, 승하차 사고 예방 등을 다룬다. 통학 버스와 자가용의 구조와 특징을 이해하고, 가정과 학교에서 통학 버스와 자가용을 독립적으로 안전하게 타고 내리도록 한다.","n":[],"p":222,"b":2},{"c":"[6시자01-08]","k":"공통","sk":"","s":"시각장애인 자립생활(초·중)","g":"초등학교 5~6학년","d":"보행","t":"인도에서 직선 보행과 기준선 보행 기술을 사용하여 이동한다.","m":"이 성취기준은 인도에서 안전하고 효율적으로 이동하는 능력을 기르게 하고자 설정하였다. 청각과 흰지팡이를 활용한 직선 보행 기술, 비어링 교정 기술, 기준선 보행 기술, 방향 전환 기술, 장애물 우회 기술 등을 다룬다. 사람의 통행이 적은 인도에서 직선 및 기준선 보행 기술을 먼저 익히고, 다양한 인도 환경에서 청각과 흰지팡이를 이용하여 직선 이동을 유지하고 잘못된 방향을 수정하며 이동하도록 한다.","n":[],"p":222,"b":2},{"c":"[6시자02-01]","k":"공통","sk":"","s":"시각장애인 자립생활(초·중)","g":"초등학교 5~6학년","d":"일상생활","t":"신체 청결 도구의 종류와 기능을 알고, 신체를 청결하게 관리한다.","m":"이 성취기준은 신체를 청결히 하도록 스스로 씻고 관리하는 능력을 기르게 하고자 설정하였다. 양치질, 세면, 목욕, 손톱과 머리 관리, 대변기와 소변기 사용법 등을 다룬다. 잔존 감각을 사용하여 청결에 필요한 도구와 용품을 탐색하고, 신체 부위에 따라 적절한 도구와 용품을 사용하여 깨끗하게 씻고 관리하도록 한다.","n":[],"p":224,"b":2},{"c":"[6시자02-02]","k":"공통","sk":"","s":"시각장애인 자립생활(초·중)","g":"초등학교 5~6학년","d":"일상생활","t":"이차 성징의 신체 변화를 알고, 생리와 몽정을 적절하게 처리한다.","m":"이 성취기준은 생식기관을 청결하게 관리하는 능력을 기르게 하고자 설정하였다. 여성의 생리, 남성의 몽정, 생리 용품과 도구, 생식기관의 청결 관리 방법 등을 다룬다. 이차 성징으로 인한 신체적 변화를 모형 자료로 살펴보고, 잔존 감각을 활용해 여러 가지 생리용품을 바르게 사용하도록 한다.","n":[],"p":224,"b":2},{"c":"[6시자02-03]","k":"공통","sk":"","s":"시각장애인 자립생활(초·중)","g":"초등학교 5~6학년","d":"일상생활","t":"의복의 종류와 형태를 구별하고, 옷을 바르게 입고 벗는다.","m":"이 성취기준은 의복을 바르게 입고 단정한 옷차림을 유지하는 능력을 기르게 하고자 설정하였다. 의복 종류와 특징, 촉감, 질감, 형태, 색상을 활용한 의복 구분 방법, 의복 종류에 따른 착탈의 방법, 다양한 여밈 장치 등을 다룬다. 잔존 감각을 사용하여 다양한 종류의 의복을 구별하고, 의복의 여밈 장치 종류에 따라 의복을 바르게 입고 벗을 수 있도록 한다.","n":[],"p":224,"b":2},{"c":"[6시자02-04]","k":"공통","sk":"","s":"시각장애인 자립생활(초·중)","g":"초등학교 5~6학년","d":"일상생활","t":"의복을 효율적으로 관리하는 방법을 알고, 의복을 옷장에 정리⋅정돈한다.","m":"이 성취기준은 의복을 정리하고 관리하는 능력을 기르게 하고자 설정하였다. 의복의 종류에 따라 접거나 개는 방법, 의류 정리와 보관 방법, 옷장, 의류 보관함, 서랍장 수납 도구 등을 다룬다. 의복을 정리하고 보관하는 가구의 종류를 조사하고, 잔존 감각과 의복 관련 가구와 도구를 사용하여 의복을 조직적으로 정리⋅정돈하도록 한다.","n":[],"p":224,"b":2},{"c":"[6시자02-05]","k":"공통","sk":"","s":"시각장애인 자립생활(초·중)","g":"초등학교 5~6학년","d":"일상생활","t":"바른 식사 자세와 예절을 알고, 바른 식생활 습관을 실천한다.","m":"이 성취기준은 바른 식생활 자세와 태도를 기르게 하고자 설정하였다. 올바른식사 자세, 상대에 따른 식사 예절, 장소에 따른 식사 규칙 등을 다룬다. 식사할 때의 바른 신체 자세와 예절의 중요성을 사례를 통해 살펴보고, 함께 식사하는 대상과 장소에 따라 적절한 식사 자세와 예절을 갖추어 식사하도록 한다.","n":[],"p":224,"b":2},{"c":"[6시자02-06]","k":"공통","sk":"","s":"시각장애인 자립생활(초·중)","g":"초등학교 5~6학년","d":"일상생활","t":"식사 도구의 종류와 기능을 탐색하고, 음식 종류에 따라 바르게 사용한다.","m":"이 성취기준은 음식 종류에 따라 적절한 식사 도구를 선택하여 사용하는 능력을 기르게 하고자 설정하였다. 수저, 포크, 젓가락, 나이프 같은 식사 도구의 종류와 기능, 식탁에서 음식의 위치 파악, 안전한 주방 이용 등을 다룬다. 음식의 종류에 따라 적절한 식사 도구를 사용하고, 잔존 감각을 사용하여 식탁에서 음식의 위치를 효율적으로 찾아 식사하도록 한다.","n":[],"p":224,"b":2},{"c":"[6시자02-07]","k":"공통","sk":"","s":"시각장애인 자립생활(초·중)","g":"초등학교 5~6학년","d":"일상생활","t":"방을 깨끗하게 청소하고, 개인용품을 정리⋅정돈한다.","m":"이 성취기준은 자신이 생활하는 공간을 청결하게 관리하는 능력을 기르게 하고자 설정하였다. 방 청소 도구의 종류와 용도, 방 청소 기술, 책상과 개인용품 정리⋅정돈 기술 등을 다룬다. 잔존 감각과 청소 도구를 사용하여 자신의 방을 효율적이고 깨끗하게 청소하고, 개인용품을 쉽게 찾아 사용할 수 있게 정리⋅정돈하도록 한다.","n":[],"p":224,"b":2},{"c":"[6시자02-08]","k":"공통","sk":"","s":"시각장애인 자립생활(초·중)","g":"초등학교 5~6학년","d":"일상생활","t":"용돈을 안전하게 관리하고 사용한다.","m":"이 성취기준은 자신의 용돈을 안전하게 관리하고 사용하는 능력을 기르게 하고자 설정하였다. 크기, 질감, 표식을 활용한 동전과 지폐의 구별, 지갑을 이용한 화폐의 정리와 보관, 체크카드 사용 등을 다룬다. 잔존 감각을 사용하여 화폐와 동전을 구별하고, 지갑에 분류⋅보관하여 화폐를 혼동하지 않고 사용하도록 한다.","n":[],"p":224,"b":2},{"c":"[6시자03-01]","k":"공통","sk":"","s":"시각장애인 자립생활(초·중)","g":"초등학교 5~6학년","d":"대인 관계","t":"자신의 신체상에 대한 태도를 분석하고, 긍정적인 신체상을 갖는다.","m":"이 성취기준은 자신의 신체상에 대해 바르고 긍정적인 태도를 기르게 하고자설정하였다. 신체상의 개념, 신체상의 발달, 신체상의 평가, 바른 신체상 정립 등을 다룬다. 자신의 신체 모습과 특성에 대해 느끼는 감정과 태도를 살펴보고, 그러한 감정과 태도가 객관적이고 타당한지를 분석하여 자신에 대해 긍정적으로 인식하도록 한다.","n":[],"p":226,"b":2},{"c":"[6시자03-02]","k":"공통","sk":"","s":"시각장애인 자립생활(초·중)","g":"초등학교 5~6학년","d":"대인 관계","t":"자신의 강점과 바람직한 장애관을 바탕으로 자신을 긍정적으로 인식하고 표현한다.","m":"이 성취기준은 자신을 긍정적으로 평가하고 다른 사람에게 자신과 장애를 긍정적으로 표현하는 능력을 기르게 하고자 설정하였다. 자아 존중감의 개념, 장애 수용 정도, 올바른 자기 인식, 장애관의 유형과 특징, 자신과 장애의 긍정적 표현 방법 등을 다룬다. 자신만의 고유한 개성과 강점을 인식하고, 올바른 장애관을 형성하여 타인에게 자신과 시각장애를 긍정적으로 표현하도록 한다.","n":[],"p":226,"b":2},{"c":"[6시자03-03]","k":"공통","sk":"","s":"시각장애인 자립생활(초·중)","g":"초등학교 5~6학년","d":"대인 관계","t":"바른 자세와 적절한 인사 표현으로 상대방에게 긍정적인 인식을 준다.","m":"이 성취기준은 다른 사람에게 긍정적인 인상을 주는 신체 자세와 인사 표현을사용하는 능력을 기르게 하고자 설정하였다. 바른 자세와 부적절한 자세, 상동 행동, 연령과 상대에 따른 인사 표현과 동작 등을 다룬다. 자신의 잘못된 자세와 행동 습관을 고치고, 연령과 상대에 따라 적절한 인사 표현과 동작을 사용하여 주변 사람에게 긍정적인 인상을 주도록 한다.","n":[],"p":226,"b":2},{"c":"[6시자03-04]","k":"공통","sk":"","s":"시각장애인 자립생활(초·중)","g":"초등학교 5~6학년","d":"대인 관계","t":"다양한 신체 접촉 방법을 알고, 상대에 따라 적절한 신체 접촉을 사용한다.","m":"이 성취기준은 다른 사람과 적절하게 신체를 접촉하면서 관계를 발전시키는 능력을 기르게 하고자 설정하였다. 신체 접촉의 유형과 목적, 허용된 신체 접촉, 금지된 신체 접촉 등을 다룬다. 적절한 신체 접촉과 불쾌감을 주는 신체 접촉을 사례를 통해 살펴보고, 이성과 동성, 상대방과의 친밀도에 따라 적절한 신체 접촉을 사용하도록 한다.","n":[],"p":226,"b":2},{"c":"[6시자03-05]","k":"공통","sk":"","s":"시각장애인 자립생활(초·중)","g":"초등학교 5~6학년","d":"대인 관계","t":"상호 작용을 촉진하는 방법과 표현을 알고, 친구 간의 상호 작용에 사용한다.","m":"이 성취기준은 친구들과 교우 관계를 맺고 상호 작용을 증진하는 능력을 기르게 하고자 설정하였다. 관심 공유하기, 먼저 다가가기, 관계 유지하기, 일대일 상호 작용, 집단 내 상호 작용 등을 다룬다. 사교성이 좋은 사람과 소극적인 사람 간의 교우 관계 방법의차이를 살펴보고, 교우 관계를 시작하고 발전시키는 데 도움이 되는 다양한 표현과 기술을 적극적으로 사용하도록 한다.","n":[],"p":226,"b":2},{"c":"[6시자03-06]","k":"공통","sk":"","s":"시각장애인 자립생활(초·중)","g":"초등학교 5~6학년","d":"대인 관계","t":"대인 간 거리가 주는 느낌과 감정을 알고, 상대에 따라 대인 간 거리를 조절한다.","m":"이 성취기준은 대화할 때 적정 거리를 유지하고 조절하는 능력을 기르게 하고자 설정하였다. 상대와 친밀도에 따른 적정 거리, 상황에 따른 적정 거리, 공간에 따라 달라지는 대화 방법, 청각을 활용한 거리 조절 방법 등을 다룬다. 대화 상대와 상황에 따른 적절한 대인 간 거리를 사례를 통해 살펴보고, 상대방과 상황에 따라 적절한 거리를 조절하는 과정에서 대화 거리가 상대방에게 주는 감정과 느낌을 인식하도록 한다.","n":[],"p":226,"b":2},{"c":"[6시자04-01]","k":"공통","sk":"","s":"시각장애인 자립생활(초·중)","g":"초등학교 5~6학년","d":"감각 활용","t":"생활 주변의 시각 정보를 변별하고, 학습과 생활에 잔존 시각을 활용한다.","m":"이 성취기준은 자신의 잔존 시각을 학습과 생활에 활용하는 태도와 능력을 기르게 하고자 설정하였다. 시각을 활용한 생활 주변의 다양한 물체 탐색, 물체 변별, 물체 확인 등을 다룬다. 가정과 학교에서 시각을 사용하여 물체의 종류, 크기, 형태, 색상, 거리 등을 탐색해 구별하고, 학습과 생활에 필요한 시각 정보를 인식하고 활용하도록 한다.","n":[],"p":228,"b":2},{"c":"[6시자04-02]","k":"공통","sk":"","s":"시각장애인 자립생활(초·중)","g":"초등학교 5~6학년","d":"감각 활용","t":"저시력 기구의 종류와 기능을 탐색하고, 학습과 생활에 기구를 사용한다.","m":"이 성취기준은 자신에게 적합한 저시력 기구를 선택하고 사용하는 능력을 기르게 하고자 설정하였다. 확대경, 독서대, 개인용 보조 조명, 타이포스코프, 아세테이트지 등을 다룬다. 자신에게 도움이 되는 광학 기구와 비광학 기구를 확인하고, 학습과 일상 활동에 필요한 저시력 기구를 선택하여 능숙하게 사용하도록 한다.","n":[],"p":228,"b":2},{"c":"[6시자04-03]","k":"공통","sk":"","s":"시각장애인 자립생활(초·중)","g":"초등학교 5~6학년","d":"감각 활용","t":"자신에게 적합한 읽기와 쓰기 도구를 사용하여 능숙하게 묵자를 읽고 쓴다.","m":"이 성취기준은 묵자를 정확하고 유창하게 읽고 쓰는 능력을 기르게 하고자 설정하였다. 학습 매체 평가, 묵자 읽기와 쓰기의 정확성, 묵자 읽기와 쓰기 유창성, 묵자 읽기와 쓰기 전략 등을 다룬다. 자신에게 적합한 묵자 읽기와 쓰기 매체 및 도구를 확인하고, 다양한 묵자 읽기와 쓰기 전략을 사용하여 정확하고 유창하게 읽고 쓰도록 한다.","n":[],"p":228,"b":2},{"c":"[6시자04-04]","k":"공통","sk":"","s":"시각장애인 자립생활(초·중)","g":"초등학교 5~6학년","d":"감각 활용","t":"생활 주변의 청각 정보를 변별하고, 학습과 생활에 청각을 활용한다.","m":"이 성취기준은 청각을 학습과 생활에 사용하는 태도와 능력을 기르게 하고자 설정하였다. 청각을 활용한 생활 주변의 다양한 소리 탐색, 소리 변별, 소리 확인, 소리의 방향과 거리 추정 등을 다룬다. 가정과 학교에서 청각을 활용해 다양한 소리를 탐색하고 변별하는 과정에서 학습과 생활에 필요한 청각 정보를 인식하고 활용하도록 한다.","n":[],"p":228,"b":2},{"c":"[6시자04-05]","k":"공통","sk":"","s":"시각장애인 자립생활(초·중)","g":"초등학교 5~6학년","d":"감각 활용","t":"기초적인 듣기 기술을 활용해 화자의 이야기를 핵심 어휘로 파악하며 듣는다.","m":"이 성취기준은 다른 사람의 이야기를 듣고 이해하는 데 필요한 듣기 기초 능력을 기르게 하고자 설정하였다. 짧은 이야기 듣기, 핵심 어휘 파악하기, 요약하기, 육하원칙에 따라 기록하기 등을 다룬다. 다른 사람의 짧은 이야기나 오디오 자료를 듣고 핵심 어휘와 내용을 파악하고 요약하여 말하는 과정에서 듣기 기초 기술을 익히도록 한다.","n":[],"p":228,"b":2},{"c":"[6시자04-06]","k":"공통","sk":"","s":"시각장애인 자립생활(초·중)","g":"초등학교 5~6학년","d":"감각 활용","t":"생활 주변의 촉각 정보를 변별하고, 학습과 생활에 촉각을 활용한다.","m":"이 성취기준은 촉각을 학습과 생활에 사용하는 태도와 능력을 기르게 하고자 설정하였다. 촉각을 활용한 생활 주변의 다양한 물체 탐색, 물체 변별, 물체 확인 등을 다룬다. 가정과 학교에서 장난감, 학습 교구, 생활용품 등 다양한 물체의 촉각적 특성을 탐색하고 변별하는 과정에서 학습과 생활에 필요한 촉각 정보를 인식하고 활용하도록 한다.","n":[],"p":228,"b":2},{"c":"[6시자04-07]","k":"공통","sk":"","s":"시각장애인 자립생활(초·중)","g":"초등학교 5~6학년","d":"감각 활용","t":"촉각 탐색 기술을 알고, 학습과 생활에 적절한 기술을 사용한다.","m":"이 성취기준은 촉각 탐색 기술을 효과적으로 사용하는 능력을 기르게 하고자 설정하였다. 양손 탐색, 전체와 부분 탐색, 기준점과 주변 탐색, 도구를 활용한 탐색 등을 다룬다. 여러 가지 촉각 탐색 기술을 사용하여 다양한 사물과 양각 자료를 체계적으로 탐색하는 활동을 통해 촉각을 활용한 탐색 기술을 발달시키도록 한다.","n":[],"p":228,"b":2},{"c":"[6시자05-01]","k":"공통","sk":"","s":"시각장애인 자립생활(초·중)","g":"초등학교 5~6학년","d":"보조공학","t":"점자정보단말기의 구조와 기능을 탐색하고, 자신에게 맞게 환경 설정을 한다.","m":"이 성취기준은 점자정보단말기의 구조를 익히고, 자신의 선호에 따라 사용자 환경을 설정하여 사용하는 능력을 기르게 하고자 설정하였다. 점자정보단말기의 종류와 특징, 점자정보단말기의 구조와 기능, 점자정보단말기의 환경 설정 방법 등을 다룬다. 점자정보단말기의 구조와 기능을 탐색하고, 환경 설정의 변경에 따른 차이를 확인하며 자신에게 맞는 사용자 환경을 설정하여 사용하도록 한다.","n":[],"p":230,"b":2},{"c":"[6시자05-02]","k":"공통","sk":"","s":"시각장애인 자립생활(초·중)","g":"초등학교 5~6학년","d":"보조공학","t":"점자정보단말기를 사용하여 문서를 작성하고 파일을 관리한다.","m":"이 성취기준은 점자정보단말기로 문서를 작성하고 파일을 관리하는 능력을 기르게 하고자 설정하였다. 점자 키보드 연습, 문서 작성, 파일과 폴더 관리 등을 다룬다. 문서 작성 프로그램과 탐색기의 메뉴와 기능을 탐색하고, 간단한 문서를 작성하는 과정에서 문서를 작성하고 파일을 관리하는 기능을 익혀 사용하도록 한다.","n":[],"p":230,"b":2},{"c":"[6시자05-03]","k":"공통","sk":"","s":"시각장애인 자립생활(초·중)","g":"초등학교 5~6학년","d":"보조공학","t":"점자정보단말기를 사용하여 텍스트와 데이지 형식의 도서를 읽고, 음원과 영상을 재생하고 녹음한다.","m":"이 성취기준은 점자정보단말기로 멀티미디어 기능을 사용하고, 독서하는 능력을 기르게 하고자 설정하였다. 독서 관련 메뉴와 기능, 텍스트와 데이지 문서 읽기, 마크 지정, 동영상과 음원 재생, 녹음 방법 등을 다룬다. 텍스트 문서와 데이지 문서를 여러 방식으로 읽어 보고 멀티미디어 앱을 사용하여 음원과 동영상을 재생하고 녹음하는 방법을 익혀 학습과 여가생활에 활용하도록 한다.","n":[],"p":230,"b":2},{"c":"[6시자05-04]","k":"공통","sk":"","s":"시각장애인 자립생활(초·중)","g":"초등학교 5~6학년","d":"보조공학","t":"화면 읽기 프로그램의 구성과 기능을 탐색하고, 자신에게 맞게 환경 설정을 한다.","m":"이 성취기준은 자신의 선호에 맞게 화면 읽기 프로그램의 사용자 환경을 설정하고 컴퓨터의 기초 조작 능력을 기르게 하고자 설정하였다. 화면 읽기 프로그램의 종류와 특징, 화면 읽기 프로그램의 설치와 실행, 환경 설정 방법, 타자 연습 프로그램을 이용한 컴퓨터 키보드 연습 등을 다룬다. 화면 읽기 프로그램의 종류와 특징을 탐색하고, 환경 설정의 변경에 따른 차이를 확인하며 자신에게 맞는 사용자 환경을 설정하여 사용하도록 한다.","n":[],"p":230,"b":2},{"c":"[6시자05-05]","k":"공통","sk":"","s":"시각장애인 자립생활(초·중)","g":"초등학교 5~6학년","d":"보조공학","t":"화면 읽기 프로그램을 이용하여 컴퓨터 운영 체제를 탐색하고 활용한다.","m":"이 성취기준은 화면 읽기 프로그램을 이용해 컴퓨터 운영 체제를 효과적으로 사용하는 능력을 기르게 하고자 설정하였다. 화면 읽기 프로그램과 컴퓨터 운영 체제에서 제공하는 기능키 탐색, 파일 관리, 멀티미디어 활용, 컴퓨터 관리 방법 등을 다룬다. 화면 읽기 프로그램을 이용한 컴퓨터 운영 체제 활용 방법을 익혀 컴퓨터를 효과적으로 관리하도록 한다.","n":[],"p":230,"b":2},{"c":"[6시자05-06]","k":"공통","sk":"","s":"시각장애인 자립생활(초·중)","g":"초등학교 5~6학년","d":"보조공학","t":"화면 읽기 프로그램과 데이지 플레이어를 사용하여 도서를 읽는다.","m":"이 성취기준은 화면 읽기 프로그램과 데이지 플레이어를 활용해 효율적으로 독서하는 능력을 기르게 하고자 설정하였다. 화면 읽기 프로그램과 데이지 플레이어의 기능 비교, 화면 읽기 프로그램과 데이지 플레이어로 텍스트 문서와 데이지 문서 읽기, 마크 설정 등을 다룬다. 화면 읽기 프로그램과 데이지 플레이어의 독서 기능을 사용하여 텍스트 문서와 데이지 도서를 효율적으로 이용하도록 한다.","n":[],"p":230,"b":2},{"c":"[6시자05-07]","k":"공통","sk":"","s":"시각장애인 자립생활(초·중)","g":"초등학교 5~6학년","d":"보조공학","t":"모니터와 키보드의 종류를 탐색하고, 자신의 시력에 맞는 모니터와 키보드를 사용한다.","m":"이 성취기준은 자신의 시력에 맞는 모니터와 키보드를 선택하여 사용하는 능력을 기르게 하고자 설정하였다. 모니터와 키보드의 종류와 기능, 시력 수준과 특성에 따른 모니터의 선정 기준, 자신의 시력을 고려한 모니터 크기, 사용 각도⋅거리⋅높이⋅밝기 같은 환경 설정 등을 다룬다. 종류와 기능이 다양한 모니터와 키보드를 체험하고, 자신의 시력에 맞는 모니터를 선택하여 사용하도록 한다.","n":[],"p":230,"b":2},{"c":"[6시자05-08]","k":"공통","sk":"","s":"시각장애인 자립생활(초·중)","g":"초등학교 5~6학년","d":"보조공학","t":"확대 독서기의 종류와 기능을 탐색하고, 자신의 시력에 맞게 환경 설정을 한다.","m":"이 성취기준은 자신의 시력 특성에 맞게 확대 독서기의 환경을 설정하여 사용하는 능력을 기르게 하고자 설정하였다. 휴대용, 근거리용, 원거리용, 다목적용 확대 독서기의 구조와 기능, 확대 독서기의 확대 배율⋅색상 대비⋅밝기 조절⋅캡쳐 저장 같은 환경 설정 방법 등을 다룬다. 여러 가지 확대 독서기와 환경 설정 기능을 체험하고, 자신의 시력에 맞게 확대 독서기의 환경을 설정하여 사용하도록 한다.","n":[],"p":230,"b":2},{"c":"[6시자05-09]","k":"공통","sk":"","s":"시각장애인 자립생활(초·중)","g":"초등학교 5~6학년","d":"보조공학","t":"화면 확대 프로그램의 종류와 기능을 탐색하고, 자신의 시력에 맞게 환경 설정을 한다.","m":"이 성취기준은 자신의 시력 특성에 맞게 화면 확대 프로그램의 환경을 설정하여 사용하는 능력을 기르게 하고자 설정하였다. 화면 확대 프로그램의 종류와 기능, 화면 확대 프로그램의 설치와 실행, 화면 확대 프로그램의 확대 배율, 색상 대비 등의 환경 설정, 컴퓨터 키보드 연습 등을 다룬다. 화면 확대 프로그램의 종류와 기능을 탐색하고, 환경 설정의 변경에 따른 차이를 확인하며 자신의 시력 특성에 맞게 화면 확대 프로그램의 환경을 설정하여 사용하도록 한다.","n":[],"p":230,"b":2},{"c":"[6시자05-10]","k":"공통","sk":"","s":"시각장애인 자립생활(초·중)","g":"초등학교 5~6학년","d":"보조공학","t":"화면 확대 프로그램을 이용하여 컴퓨터 운영 체제를 탐색하고 활용한다.","m":"이 성취기준은 화면 확대 프로그램으로 컴퓨터의 운영 체제를 효과적으로 사용하는 능력을 기르게 하고자 설정하였다. 화면 확대 프로그램을 활용한 컴퓨터 운영 체제의 파일 관리, 멀티미디어 활용 등을 다룬다. 화면 확대 프로그램을 이용한 컴퓨터 운영 체제 활용 방법을 익혀 컴퓨터를 효과적으로 관리하도록 한다.","n":[],"p":230,"b":2},{"c":"[6시자06-01]","k":"공통","sk":"","s":"시각장애인 자립생활(초·중)","g":"초등학교 5~6학년","d":"여가 활용","t":"퍼즐과 보드게임의 종류를 탐색하고, 또래들과 게임을 즐긴다.","m":"이 성취기준은 또래들이 즐기는 퍼즐과 보드게임을 사용하는 능력을 기르게 하고자 설정하였다. 다양한 입체 퍼즐, 개인⋅단체형 보드게임, 시각장애를 고려한 게임 도구와 규칙 수정 방법 등을 다룬다. 시중에 판매되거나 시각장애인을 위해 별도로 개발된 퍼즐과 보드게임의 종류와 특징을 조사하고, 퍼즐 놀이와 보드게임 방법을 익혀 또래들과 즐기도록 한다.","n":[],"p":232,"b":2},{"c":"[6시자06-02]","k":"공통","sk":"","s":"시각장애인 자립생활(초·중)","g":"초등학교 5~6학년","d":"여가 활용","t":"반려동물의 종류와 관리법을 알고, 반려동물을 돌본다.","m":"이 성취기준은 반려동물을 돌보고 함께 생활하는 능력을 기르게 하고자 설정하였다. 반려동물의 종류, 먹이 급여, 용변 처리, 위생과 용모 관리, 건강관리 방법 등을 다룬다. 반려동물의 종류와 입양 방법을 조사하고, 관심 있는 반려동물이 있는 카페를 방문하여 반려동물을 돌보는 기본적인 방법을 익히도록 한다.","n":[],"p":232,"b":2},{"c":"[6시자06-03]","k":"공통","sk":"","s":"시각장애인 자립생활(초·중)","g":"초등학교 5~6학년","d":"여가 활용","t":"공동체형 놀이의 종류와 규칙을 알고, 또래 놀이에 참여한다.","m":"이 성취기준은 또래들이 즐기는 공동체형 놀이에 참여하는 능력을 기르게 하고자 설정하였다. 얼음땡⋅꼬리잡기⋅숨바꼭질 등 신체를 활용한 놀이, 공기놀이⋅팽이치기⋅다트 게임 등 도구를 활용한 놀이 등을 다룬다. 또래들이 함께 모여 자주 하는 공동체형 놀이를 조사하고, 놀이의 규칙과 방법을 익혀 또래들과 놀이에 참여하도록 한다.","n":[],"p":232,"b":2},{"c":"[6시자06-04]","k":"공통","sk":"","s":"시각장애인 자립생활(초·중)","g":"초등학교 5~6학년","d":"여가 활용","t":"놀이 시설의 종류와 이용 방법을 조사하고, 놀이 시설을 안전하게 이용한다.","m":"이 성취기준은 놀이 시설을 안전하게 이용하는 능력을 기르게 하고자 설정하였다. 놀이터, 놀이공원, 어린이 놀이방 등의 놀이 시설의 이용 방법과 안전 수칙 등을 다룬다. 지역사회에 있는 놀이 시설의 종류를 조사하고, 놀이 시설의 구조와 설비를 직접 탐색하고 이용해 봄으로써 또래들과 놀이 시설을 함께 이용하도록 한다.","n":[],"p":232,"b":2},{"c":"[6시자06-05]","k":"공통","sk":"","s":"시각장애인 자립생활(초·중)","g":"초등학교 5~6학년","d":"여가 활용","t":"도서관과 영화관의 이용 방법을 조사하고, 도서와 영화를 즐긴다.","m":"이 성취기준은 도서관과 영화관을 이용하는 능력을 기르게 하고자 설정하였다. 도서관 이용 방법, 도서 대출과 반납, 공공 도서관의 장애인 서비스, 영화 검색과 예매, 영화 관람 예절, 화면 해설 영화 등을 다룬다. 지역사회에 있는 도서관과 영화관을 조사하고, 도서관과 영화관을 직접 방문하여 이용하는 방법을 익혀 독립적으로 이용하도록 한다.","n":[],"p":232,"b":2},{"c":"[6시자06-06]","k":"공통","sk":"","s":"시각장애인 자립생활(초·중)","g":"초등학교 5~6학년","d":"여가 활용","t":"영상⋅음원 공유 플랫폼의 종류와 이용 방법을 탐색하고, 음원이나 영상을 이용한다.","m":"이 성취기준은 자신이 좋아하는 영상과 음악을 찾아 이용하는 능력을 기르게 하고자 설정하였다. 공유 플랫폼 가입, 검색, 재생, 설정 또는 스마트 기기 관련 앱 설치와 이용, 점자정보단말기를 이용한 노래 가사 검색과 이용 등을 다룬다. 음원이나 영상 공유 플랫폼의 종류와 서비스를 조사하여 관심 있는 플랫폼을 이용하고, 컴퓨터와 스마트 기기를 사용하여 음원과 영상을 즐기도록 한다.","n":[],"p":232,"b":2},{"c":"[6시자07-01]","k":"공통","sk":"","s":"시각장애인 자립생활(초·중)","g":"초등학교 5~6학년","d":"진로 준비","t":"자신의 신체 특성과 강점을 인식하고, 긍정적인 직업 자아상을 갖는다.","m":"이 성취기준은 자신의 특성을 바르게 이해하고 긍정적인 직업 자아상을 기르게 하고자 설정하였다. 자신의 소질과 재능, 강점과 약점, 직업 선택 과정에 시각장애의 영향, 시각장애인의 직업 도전과 성공 사례 등을 다룬다. 자신의 소질 및 강약점을 체계적으로 분석하고, 시각장애를 극복하고 성공적으로 취업한 사례들을 탐색하여 다양한 직업에 도전하는 마음을 갖도록 한다.","n":[],"p":234,"b":2},{"c":"[6시자07-02]","k":"공통","sk":"","s":"시각장애인 자립생활(초·중)","g":"초등학교 5~6학년","d":"진로 준비","t":"일과에서 좋아하는 활동을 조사하고, 관련된 직업을 조사한다.","m":"이 성취기준은 자신이 좋아하는 일과 활동으로 직업 적성에 대한 이해를 높이기 위해 설정하였다. 가정과 학교에서의 일과 활동 조사, 좋아하거나 싫어하는 활동 분석, 일과 활동과 관련된 직업 조사 등을 다룬다. 일과 활동에서 좋아하거나 기피하는 활동들을 분석하고, 좋아하는 일과 활동과 관련된 직업을 조사하는 과정에서 자신의 직업 적성에 대한 이해를 높이도록 한다.","n":[],"p":234,"b":2},{"c":"[6시자07-03]","k":"공통","sk":"","s":"시각장애인 자립생활(초·중)","g":"초등학교 5~6학년","d":"진로 준비","t":"가족 구성원과 주변 사람의 직업을 조사하고, 하는 일을 분석한다.","m":"이 성취기준은 주변 사람의 직업을 탐색해 직업 세계와 직업을 이해하는 능력을 기르게 하고자 설정하였다. 가족 구성원의 직업, 가까운 이웃의 직업, 직업에 따라 하는 일과 시각장애인의 직업 접근성 등을 다룬다. 주변 사람의 직업을 확인하여 인터뷰, 인터넷 검색, 현장 견학 등으로 직업에 대한 정보를 조사하고, 직업별로 하는 일을 이해하며 시각장애인의 직업 수행 가능성을 탐색하도록 한다.","n":[],"p":234,"b":2},{"c":"[6시자07-04]","k":"공통","sk":"","s":"시각장애인 자립생활(초·중)","g":"초등학교 5~6학년","d":"진로 준비","t":"자신의 꿈과 희망을 탐색하고, 관련된 직업을 조사한다.","m":"이 성취기준은 자신이 미래에 하고 싶은 일을 찾고 직업에 관심을 두는 태도를 기르게 하고자 설정하였다. 친구들의 꿈과 희망 직업, 직업 선택 이유, 희망 직업의 시각장애인 접근성 등을 다룬다. 친구들과 미래에 하고 싶은 직업과 하는 일에 대한 정보를 조사하고, 직업별 정보를 공유함으로써 자신과 친구들의 희망 직업을 잘 이해하도록 한다.","n":[],"p":234,"b":2},{"c":"[6시자07-05]","k":"공통","sk":"","s":"시각장애인 자립생활(초·중)","g":"초등학교 5~6학년","d":"진로 준비","t":"직업이 주는 가치와 보람을 알고, 직업 세계에 관심을 갖는다.","m":"이 성취기준은 직업이 삶에 주는 가치를 알고 직업에 관심을 갖는 태도를 기르게 하고자 설정하였다. 직업의 무형과 유형의 가치, 경제적 가치, 개인에 따른 가치, 장애에 따른 가치 등을 다룬다. 직업을 가진 사람들이 직업생활에서 느끼는 가치와 보람을 조사하고 토론하는 과정에서 직업의 중요한 가치를 인식하고 직업 세계에 관심을 높이도록 한다.","n":[],"p":234,"b":2},{"c":"[6시자07-06]","k":"공통","sk":"","s":"시각장애인 자립생활(초·중)","g":"초등학교 5~6학년","d":"진로 준비","t":"개인의 역할과 책임의 중요성을 인식하고, 자신의 역할과 책임을 다하는 태도를 갖는다.","m":"이 성취기준은 가정과 학교, 직장에서 자신의 역할과 책임을 다하는 태도를 기르게 하고자 설정하였다. 역할과 책임의 중요성, 가정과 학교에서의 일과 활동 조사, 자신이 할 수 있는 일과 활동 선정, 직장에서의 역할과 책임의 중요성 등을 다룬다. 가정과 학교에서 자신의 일과 활동에 역할과 책임을 다하고, 직장 생활과 연결 지어 역할과 책임의 중요성을 인식하도록 한다.","n":[],"p":234,"b":2},{"c":"[9시자01-01]","k":"공통","sk":"","s":"시각장애인 자립생활(초·중)","g":"중학교 1~3학년","d":"보행","t":"지역사회를 구성하는 환경 요소를 탐색하고, 방향정위에 환경 정보를 사용한다.","m":"이 성취기준은 지역사회의 환경 정보를 방향정위에 활용하는 능력을 기르게 하고자 설정하였다. 지역사회 환경을 구성하는 장소와 건물, 시설물과 설비, 거주 지역을 나타내는 촉지도 사용, 스마트폰과 망원경을 활용한 환경 정보 확인 등을 다룬다. 잔존 감각을 사용하여 지역사회를 구성하는 주요 시설과 설비를 탐색하고, 지역사회에서 목적지를 찾아가는 데 육교, 지하도, 자전거 도로 같은 환경 정보를 수집하여 활용하도록 한다.","n":[],"p":235,"b":2},{"c":"[9시자01-02]","k":"공통","sk":"","s":"시각장애인 자립생활(초·중)","g":"중학교 1~3학년","d":"보행","t":"방향정위를 위한 5단계 순환 절차에 따라 보행 정보를 분석하여 활용한다.","m":"이 성취기준은 보행 환경의 정보를 체계적으로 분석하여 활용하는 능력을 기르게 하고자 설정하였다. 보행 정보의 지각, 분석, 선별, 계획, 실행 등 5단계 순환 과정 등을 다룬다. 정보의 수집, 분석, 선별, 계획, 실행 5단계 순환 과정을 사례를 통해 이해하고, 5단계 순환 과정을 활용해 목적지까지 올바른 방향을 유지하며 찾아가도록 한다.","n":[],"p":235,"b":2},{"c":"[9시자01-03]","k":"공통","sk":"","s":"시각장애인 자립생활(초·중)","g":"중학교 1~3학년","d":"보행","t":"안내인에게서 보행 환경의 정보를 파악하고, 독립 보행에 활용한다.","m":"이 성취기준은 안내인을 통해 낯선 환경의 정보를 이해하고 독립 보행에 이들 정보를 활용하는 능력을 기르게 하고자 설정하였다. 안내인에게 주변 정보를 질문하는 방법, 잔존 감각으로 주변 정보를 탐색하는 방법, 필요한 보행 정보를 기억하는 전략 등을 다룬다. 지역사회에서 낯선 장소와 환경으로 이동할 때 안내인에게 주변 환경의 정보를 체계적으로 확인하고, 향후 독립 보행을 하여 이들 장소와 환경으로 이동할 때 그 정보를 활용하도록 한다.","n":[],"p":235,"b":2},{"c":"[9시자01-04]","k":"공통","sk":"","s":"시각장애인 자립생활(초·중)","g":"중학교 1~3학년","d":"보행","t":"지역사회 환경에서 적응 보행 기구를 사용하여 안전하게 이동한다.","m":"이 성취기준은 시각중복장애 학생이 실외 환경에서 다른 사람에게 의존하지 않고 독립적으로 이동하는 능력을 기르게 하고자 설정하였다. 적응 보행 기구로 직선 보행, 기준선 보행, 건널목 횡단 등을 다룬다. 장애물이 적고 사람의 통행이 적은 인도에서 적응 보행 기구의 응용 기술을 먼저 익히고, 친숙한 실외 장소에서 적응 보행 기구를 사용하여 인도와 건널목을 안전하게 이동하도록 한다.","n":[],"p":235,"b":2},{"c":"[9시자01-05]","k":"공통","sk":"","s":"시각장애인 자립생활(초·중)","g":"중학교 1~3학년","d":"보행","t":"흰지팡이 응용 기술의 종류를 알고, 보행 장소에 맞게 선택하여 사용한다.","m":"이 성취기준은 다양한 실외 환경에서 흰지팡이 응용 기술들을 적절히 선택하여 사용하는 능력을 기르게 하고자 설정하였다. 흰지팡이의 상태 점검과 수리, 촉타 후 밀기법, 촉타 후 긋기법, 삼점 촉타법 등을 다룬다. 장애물이 적은 장소에서 이점 촉타법, 촉타후 밀기법, 촉타 후 긋기법, 삼점 촉타법의 자세와 기술을 먼저 익히고, 실외 보행 장소와 상황에 따라 적절한 흰지팡이 사용 기술을 선택하여 이동하도록 한다.","n":[],"p":235,"b":2},{"c":"[9시자01-06]","k":"공통","sk":"","s":"시각장애인 자립생활(초·중)","g":"중학교 1~3학년","d":"보행","t":"교통 신호 체계와 교차로의 구조를 알고, 교차로를 안전하게 건넌다.","m":"이 성취기준은 교통 신호 체계를 이해하고 교차로를 안전하게 건너는 능력을 기르게 하고자 설정하였다. 일자형 횡단보도, 티(T)자형 교차로, 십자형 교차로, 섬식 교차로, 원형 교차로의 구조, 횡단 방법과 유의점 등을 다룬다. 다양한 유형의 교차로를 모형 자료를 통해 이해하고, 다양한 교차로에서 교통 신호등과 차량과 행인의 움직임 그리고 음향신호기 등을 종합적으로 이용하여 안전하게 횡단하도록 한다.","n":[],"p":235,"b":2},{"c":"[9시자01-07]","k":"공통","sk":"","s":"시각장애인 자립생활(초·중)","g":"중학교 1~3학년","d":"보행","t":"주택가의 구조와 도로명 주소 체계를 활용해 목적지를 찾아간다.","m":"이 성취기준은 주택가에서 목적지까지 효율적으로 이동하는 능력을 기르게 하고자 설정하였다. 주택가의 구조와 특징, 도로명과 주소 체계, 건물의 번호 체계, 주택가에서 목적지 찾기 등을 다룬다. 우리나라의 도로명과 주소 체계를 모형 자료에서 이해하고, 주택가에서 도로명과 주소 체계를 사용하여 특정 건물을 찾아가도록 한다.","n":[],"p":235,"b":2},{"c":"[9시자01-08]","k":"공통","sk":"","s":"시각장애인 자립생활(초·중)","g":"중학교 1~3학년","d":"보행","t":"날씨 상황에 따라 적절한 보행 방법을 선택하여 안전하게 이동한다.","m":"이 성취기준은 일기 예보와 날씨 상황에 따라 적절한 보행 기술을 사용하여 안전하게 이동하는 능력을 기르게 하고자 설정하였다. 눈이 오는 날, 바람이 부는 날, 비 오는 날의 보행 방법과 유의점 등을 다룬다. 기상 조건에 따른 다양한 사고 사례를 살펴보고, 우리나라의 계절과 날씨 상황에 따른 적합한 보행 기술을 선택하여 이동하도록 한다.","n":[],"p":235,"b":2},{"c":"[9시자02-01]","k":"공통","sk":"","s":"시각장애인 자립생활(초·중)","g":"중학교 1~3학년","d":"일상생활","t":"이⋅미용실 이용 방법을 알고, 외모를 단정하고 어울리게 관리한다.","m":"이 성취기준은 외모를 관리하려고 혼자서 이⋅미용실을 이용하는 능력을 기르게 하고자 설정하였다. 일반적인 이⋅미용실의 구조와 설비, 미용 상품의 종류, 유행하는 머리 모양, 미용사에게 머리 관리 상담 등을 다룬다. 연령과 성별에 따라 유행하는 헤어스타일을 가발을 활용해 살펴보고, 정기적으로 미용실을 이용하여 외모를 단정하고 어울리게 관리하도록 한다.","n":[],"p":237,"b":2},{"c":"[9시자02-02]","k":"공통","sk":"","s":"시각장애인 자립생활(초·중)","g":"중학교 1~3학년","d":"일상생활","t":"질환에 적합한 의료 기관을 이용하고, 약물을 안전하게 복용하고 관리한다.","m":"이 성취기준은 질환에 따라 적절한 의료 기관을 이용하고 약물을 안전하게 복용하는 능력을 기르게 하고자 설정하였다. 질환에 따른 의료 기관 선택, 의료 기관 예약과 이용 절차, 의약품 정보 웹사이트와 앱, 약물 관리와 보관 방법, 약물 복용 방법과 유의점, 의약품 점자 표기 등을 다룬다. 시각장애인을 위한 의약품 점자 안내서와 점자 표기 의약품들을 조사하고, 의약품 정보 앱과 점자 라벨지, 약통을 이용하여 약물을 효율적으로 관리하고 복용하도록 한다.","n":[],"p":237,"b":2},{"c":"[9시자02-03]","k":"공통","sk":"","s":"시각장애인 자립생활(초·중)","g":"중학교 1~3학년","d":"일상생활","t":"다양한 방법으로 의복을 구입하고, 의복을 기능과 기호에 따라 관리한다.","m":"이 성취기준은 다양한 방법으로 의류를 구입하고 관리하는 능력을 기르게 하고자 설정하였다. 의류 브랜드의 종류와 특징, 의류 매장과 온라인에서 의류 구입, 교환, 취소와 환불 방법, 촉각 의류 표시 도구, 색상, 질감, 형태, 부착물을 활용한 의복 구분 등을 다룬다. 남성복, 여성복, 신발 등 다양한 의류 브랜드와 특징을 살펴보고, 자신이 좋아하는 의류 브랜드나 필요한 의류를 스스로 구입하도록 한다.","n":[],"p":237,"b":2},{"c":"[9시자02-04]","k":"공통","sk":"","s":"시각장애인 자립생활(초·중)","g":"중학교 1~3학년","d":"일상생활","t":"손세탁이 필요한 의복과 옷감을 알고, 손으로 깨끗하게 세탁한다.","m":"이 성취기준은 손세탁이 필요한 의복을 깨끗하게 세탁하는 능력을 기르게 하고자 설정하였다. 의복 종류와 오염, 흔들어 빨기, 주물러 빨기, 비벼 빨기, 솔로 빨기 등과 같은 손빨래 방법, 손빨래용 세제와 도구 등을 다룬다. 손세탁이 필요한 의복의 옷감 종류를 사례를 통해 이해하고, 손세탁에 사용되는 세제와 도구를 사용하여 의복의 오염을 제거하도록 한다.","n":[],"p":237,"b":2},{"c":"[9시자02-05]","k":"공통","sk":"","s":"시각장애인 자립생활(초·중)","g":"중학교 1~3학년","d":"일상생활","t":"음식점을 이용하고, 배달 음식을 주문한다.","m":"이 성취기준은 혼자서 음식점을 이용하고 배달 음식을 주문하는 능력을 기르게하고자 설정하였다. 음식점의 종류와 이용 방법, 무인 주문 시스템 사용법, 배달 음식의 유형과 주문 방법, 스마트 기기의 배달 앱 사용 방법 등을 다룬다. 거주 지역에 있는 음식점의 유형을 조사하고, 음식점을 방문하여 이용하거나 배달 음식을 주문하여 식사하도록 한다.","n":[],"p":237,"b":2},{"c":"[9시자02-06]","k":"공통","sk":"","s":"시각장애인 자립생활(초·중)","g":"중학교 1~3학년","d":"일상생활","t":"간단한 조리 기구를 사용하고, 간편식을 안전하게 조리한다.","m":"이 성취기준은 간단한 조리 기구를 사용하여 간편식을 조리하는 능력을 기르게 하고자 설정하였다. 조리 기구와 전기 제품의 종류와 용도, 조작 장치와 사용법, 가공 식품과 밀키트의 종류, 조리 방법, 안전사고 예방과 유의 사항 등을 다룬다. 잔존 감각을 사용하여 조리 기구와 전기 제품을 조작하고, 가공 식품과 밀키트의 종류에 따라 적합한 방법으로 간단한 음식을 조리하도록 한다.","n":[],"p":237,"b":2},{"c":"[9시자02-07]","k":"공통","sk":"","s":"시각장애인 자립생활(초·중)","g":"중학교 1~3학년","d":"일상생활","t":"집안 청소 도구와 청소 방법을 조사하고, 거주 공간을 청결하게 관리한다.","m":"이 성취기준은 자신이 거주하는 집의 공간을 청결하게 관리하는 능력을 기르게 하고자 설정하였다. 다양한 청소용품과 도구, 거실, 화장실, 가구 같은 청소하는 장소와 마감재 등에 따른 청소 방법과 유의점, 쓰레기의 분리 배출 등을 다룬다. 잔존 감각을 사용하여 청소에 필요한 도구와 세척용품을 다루고, 청소하는 공간과 설비에 맞는 청소 도구와 세척 용품을 사용하여 청결하게 관리하도록 한다.","n":[],"p":237,"b":2},{"c":"[9시자02-08]","k":"공통","sk":"","s":"시각장애인 자립생활(초·중)","g":"중학교 1~3학년","d":"일상생활","t":"가전제품의 종류와 기능을 탐색하고, 가전제품을 안전하게 사용하고 관리한다.","m":"이 성취기준은 가전제품을 용도에 맞게 안전하게 사용하고 관리하는 능력을 기르게 하고자 설정하였다. 가전제품의 종류와 기능, 냉방기, 공기 청정기, 에어드레서, 전기청소기 같은 가전제품 사용 방법과 유의점, 가전제품의 청소와 관리 방법, 지역 에이에스 서비스센터 예약과 이용 등을 다룬다. 다양한 가전제품의 구조와 기능을 탐색하고, 잔존 감각을 사용하여 가전제품을 안전하게 조작하고 사용하도록 한다.","n":[],"p":237,"b":2},{"c":"[9시자03-01]","k":"공통","sk":"","s":"시각장애인 자립생활(초·중)","g":"중학교 1~3학년","d":"대인 관계","t":"자신이 선택의 주체임을 인식하고, 합리적인 의사 결정을 한다.","m":"이 성취기준은 다양한 상황에서 독립적이고 합리적으로 의사 결정을 하는 능력을 기르게 하고자 설정하였다. 자기 인식, 상황 인식, 의사 결정 절차와 문제 해결 전략, 의사 결정의 근거와 표현 등을 다룬다. 자기 결정의 적절한 사례와 그렇지 않은 사례를 살펴보고, 자신의 가치 및 선호와 상황을 고려하여 합리적으로 의사 결정을 하고 다른 사람에게 표현하도록 한다.","n":[],"p":240,"b":2},{"c":"[9시자03-02]","k":"공통","sk":"","s":"시각장애인 자립생활(초·중)","g":"중학교 1~3학년","d":"대인 관계","t":"다양한 외모 관리 방법을 탐색하고, 호감을 주는 외모로 관리한다.","m":"이 성취기준은 주변 사람에게 호감을 주는 외모로 관리하는 능력을 기르게 하고자 설정하였다. 연령에 따라 유행하는 외모 관리, 자신에게 어울리는 머리와 의복 스타일, 소품과 액세서리 활용, 시각장애로 인한 눈 외모 관리 등을 다룬다. 자신의 패션, 헤어스타일 등 외모 관리를 평가하고, 또래들에게 긍정적인 이미지와 신뢰감을 주는 외모로 관리하도록 한다.","n":[],"p":240,"b":2},{"c":"[9시자03-03]","k":"공통","sk":"","s":"시각장애인 자립생활(초·중)","g":"중학교 1~3학년","d":"대인 관계","t":"준언어와 비언어 표현 방법을 조사하고, 의사소통에 사용한다.","m":"이 성취기준은 준언어와 비언어를 적절히 사용하여 자신의 의사를 표현하는 능력을 기르게 하고자 설정하였다. 준언어와 비언어를 사용하는 목적, 목소리의 크기⋅속도⋅음색⋅억양 같은 준언어 표현, 몸자세⋅손동작⋅눈 맞춤⋅얼굴 표정 같은 비언어 표현 등을다룬다. 다양한 준언어와 비언어 표현들을 조사하고, 대화 주제와 상황에 따라 적절한 준언어적 표현과 비언어적 표현을 사용하여 자신의 감정과 의사를 명확하게 표현하도록한다.","n":[],"p":240,"b":2},{"c":"[9시자03-04]","k":"공통","sk":"","s":"시각장애인 자립생활(초·중)","g":"중학교 1~3학년","d":"대인 관계","t":"관심과 배려의 중요성을 이해하고, 다른 사람에게 관심을 갖고 배려를 실천한다.","m":"이 성취기준은 다른 사람과의 관계 속에서 관심과 배려를 주고받는 생활 태도를 기르게 하고자 설정하였다. 도움과 배려가 필요한 상황 판단, 도움과 배려를 요청하는 방법, 관심과 배려를 표현하는 방법 등을 다룬다. 시각장애인과 비장애인 간에 도움과 배려가 필요한 상황들을 조사하고, 사회적 상황에서 상호 간에 필요한 배려와 도움을 인식하고 실천하도록 한다.","n":[],"p":240,"b":2},{"c":"[9시자03-05]","k":"공통","sk":"","s":"시각장애인 자립생활(초·중)","g":"중학교 1~3학년","d":"대인 관계","t":"효과적인 대화 기술과 예절을 조사하고, 다른 사람과의 대화에 활용한다.","m":"이 성취기준은 효과적인 대화 기술과 예절을 사용하여 상호 작용하는 능력을 기르게 하고자 설정하였다. 말과 행동의 중요성, 경청하기, 공감하기, 기다리기, 칭찬하기 같은 효과적인 상호 작용 기술의 유형, 호감을 주는 말과 행동, 자신의 대화 습관 평가 등을 다룬다. 자신의 대화 습관을 성찰하고, 대화 상황에 따라 효과적인 상호 작용 기술과 표현을 적절히 선택하여 사용하도록 한다.","n":[],"p":240,"b":2},{"c":"[9시자03-06]","k":"공통","sk":"","s":"시각장애인 자립생활(초·중)","g":"중학교 1~3학년","d":"대인 관계","t":"개인에 따른 관점의 차이를 이해하고, 다른 사람의 생각을 존중하며 대화한다.","m":"이 성취기준은 다른 사람의 생각을 존중하며 대화하는 태도를 기르게 하고자 설정하였다. 타인과의 문제 상황을 정리하는 방법, 타인의 관점을 인지하고 공감하는 방법, 타인의 관점을 존중하여 표현하는 방법 등을 다룬다. 개인마다 생각이나 의견이 다를 수 있음을 이해하고, 서로 관점이 다르더라도 타인의 관점을 이해하고 존중하며 자신의 관점을 표현하도록 한다.","n":[],"p":240,"b":2},{"c":"[9시자04-01]","k":"공통","sk":"","s":"시각장애인 자립생활(초·중)","g":"중학교 1~3학년","d":"감각 활용","t":"자신의 시각 특성을 이해하고, 학습과 생활에 잔존 시각을 적극적으로 사용한다.","m":"이 성취기준은 시각 평가로 자신의 시각 특성을 이해하고 관리하는 능력을 기르게 하고자 설정하였다. 시각 평가의 목적, 시력과 시야, 대비 감도, 조도와 눈부심, 기능적 활동의 시각 활용 능력, 안질환과 예후 등을 다룬다. 시각 평가의 목적과 중요성을 이해하고, 시각 평가에 적극적으로 참여하여 자신의 시기능 수준을 이해하고 시기능의 변화를 확인하도록 한다.","n":[],"p":241,"b":2},{"c":"[9시자04-02]","k":"공통","sk":"","s":"시각장애인 자립생활(초·중)","g":"중학교 1~3학년","d":"감각 활용","t":"시각 기술의 종류를 알고, 학습과 생활에 시각 기술을 사용한다.","m":"이 성취기준은 시각 기술의 종류를 알고 사용하는 능력을 기르게 하고자 설정하였다. 고시, 중심 외 보기, 추시, 추적, 주사 등을 다룬다. 원거리 환경에서 고시, 중심 외 보기, 추시, 주사, 추적 기술을 사용하는 방법을 익혀 학습과 일상 활동에 필요한 시각 기술을 선택하여 효율적으로 사용하도록 한다.","n":[],"p":241,"b":2},{"c":"[9시자04-03]","k":"공통","sk":"","s":"시각장애인 자립생활(초·중)","g":"중학교 1~3학년","d":"감각 활용","t":"구조화된 듣기 기술을 알고, 화자의 이야기를 체계적으로 분석하며 듣는다.","m":"이 성취기준은 다른 사람이 전달하는 정보를 정확하게 분석하여 이해하는 능력을 기르게 하고자 설정하였다. 구조화된 듣기의 개념, 인과 관계 분석, 시간의 경과에 따른내용 분석, 주제와 범주에 따른 분석, 정보의 이해와 요약 등을 다룬다. 다양한 이야기와 정보를 듣고 내용을 구조적으로 분석하는 과정에서 정보를 체계적으로 이해하고, 이를 요약하여 말하도록 한다.","n":[],"p":241,"b":2},{"c":"[9시자04-04]","k":"공통","sk":"","s":"시각장애인 자립생활(초·중)","g":"중학교 1~3학년","d":"감각 활용","t":"기억 전략의 유형과 방법을 알고, 화자의 말과 정보를 정확하게 기억한다.","m":"이 성취기준은 화자가 말한 중요한 정보를 정확하게 기억하는 능력을 기르게 하고자 설정하였다. 핵심 단어와 내용을 조직화하기, 내용을 상호 연결하기, 내용을 이미지화하여 기억하기, 두문자법 사용하기 등을 다룬다. 다양한 주제의 오디오 자료를 듣고, 이야기 주제에 적합한 분석 방법과 기억 전략을 사용하여 화자의 말과 정보를 정확하게 파악하고 기억하도록 한다.","n":[],"p":241,"b":2},{"c":"[9시자04-05]","k":"공통","sk":"","s":"시각장애인 자립생활(초·중)","g":"중학교 1~3학년","d":"감각 활용","t":"양각 자료의 유형에 적합한 촉각 탐색 방법을 사용하여 자료의 내용을 정확하게 파악한다.","m":"이 성취기준은 다양한 양각 자료의 내용을 효과적으로 탐색하고 이해하는 능력을 기르게 하고자 설정하였다. 교과별 양각 자료의 유형, 단순한 양각 자료의 탐색 방법, 복잡한 양각 자료의 탐색 방법 등을 다룬다. 교과 학습에 사용하는 다양한 양각 학습 자료의크기, 형태, 복잡성 등에 따라 적합한 촉각 탐색 기술을 선택하여 양각 자료의 내용을 정확하게 파악하도록 한다.","n":[],"p":241,"b":2},{"c":"[9시자04-06]","k":"공통","sk":"","s":"시각장애인 자립생활(초·중)","g":"중학교 1~3학년","d":"감각 활용","t":"감각기관에 따른 정보 수용의 특징을 알고, 감각 정보를 통합하여 이해한다.","m":"이 성취기준은 감각 정보를 통합적으로 분석하여 이해하는 능력을 기르게 하고자 설정하였다. 잔존 감각을 활용한 정보 수집, 감각 정보의 분석 방법, 감각 정보의 상호 연결, 정보의 통합적 이해 등을 다룬다. 여러 감각기관을 사용하여 다양한 정보를 수집⋅분석하고 통합하는 방법을 익혀 시각 정보에 대한 접근성 제한을 보상하고 정보를 정확하게 이해하도록 한다.","n":[],"p":241,"b":2},{"c":"[9시자05-01]","k":"공통","sk":"","s":"시각장애인 자립생활(초·중)","g":"중학교 1~3학년","d":"보조공학","t":"점자정보단말기에 내장된 앱의 기능을 탐색하고 사용한다.","m":"이 성취기준은 점자정보단말기에 내장된 앱을 사용하는 능력을 기르게 하고자설정하였다. 개인 관리 도구, 보조 프로그램, 유틸리티 등을 다룬다. 점자정보단말기에 내장된 앱의 구조와 기능을 익혀 일상 활동에 따라 필요한 앱을 효과적으로 사용하도록 한다.","n":[],"p":243,"b":2},{"c":"[9시자05-02]","k":"공통","sk":"","s":"시각장애인 자립생활(초·중)","g":"중학교 1~3학년","d":"보조공학","t":"점자정보단말기의 인터넷 기능을 탐색하고 사용한다.","m":"이 성취기준은 점자정보단말기의 인터넷 기능을 사용하는 능력을 기르게 하고자 설정하였다. 컴퓨터 점자의 입력 방법, 인터넷 연결 방법, 웹 브라우저 사용 방법, 정보 검색, 이메일 사용법 등을 다룬다. 점자정보단말기의 인터넷 관련 기능을 익혀 인터넷을 능숙하게 사용하고 필요한 정보를 검색하여 활용하도록 한다.","n":[],"p":243,"b":2},{"c":"[9시자05-03]","k":"공통","sk":"","s":"시각장애인 자립생활(초·중)","g":"중학교 1~3학년","d":"보조공학","t":"점자 라벨러의 구조와 기능을 탐색하고 학습과 생활에 사용한다.","m":"이 성취기준은 학습과 일상생활에 점자 라벨러를 사용하는 능력을 기르게 하고자 설정하였다. 점자 라벨러의 종류와 기능, 점자 라벨러의 글자 입력 및 출력 방법, 라벨지 탈부착 방법 등을 다룬다. 점자 라벨러 사용법을 익혀 학습과 일상생활에 필요한 점자 라벨지를 출력하여 활용하도록 한다.","n":[],"p":243,"b":2},{"c":"[9시자05-04]","k":"공통","sk":"","s":"시각장애인 자립생활(초·중)","g":"중학교 1~3학년","d":"보조공학","t":"화면 읽기 프로그램을 활용해 다양한 문서 작성 프로그램을 사용한다.","m":"이 성취기준은 화면 읽기 프로그램을 활용해 다양한 문서 작성 프로그램을 사용하는 능력을 기르게 하고자 설정하였다. 화면 읽기 프로그램을 이용한 문서 작성, 프레젠테이션, 스프레드시트 작성과 편집 등을 다룬다. 다양한 문서 작성 프로그램을 사용하여 문서를 작성하고 자료를 관리하는 기능을 익혀 문서 작성에 활용하도록 한다.","n":[],"p":243,"b":2},{"c":"[9시자05-05]","k":"공통","sk":"","s":"시각장애인 자립생활(초·중)","g":"중학교 1~3학년","d":"보조공학","t":"화면 읽기 프로그램을 활용해 컴퓨터의 웹 브라우저를 효과적으로 사용한다.","m":"이 성취기준은 화면 읽기 프로그램을 활용해 컴퓨터의 웹 브라우저를 사용하는 능력을 기르게 하고자 설정하였다. 화면 읽기 프로그램의 웹 페이지 관련 설정, 웹 브라우저와 화면 읽기 프로그램의 기능키, 기능키를 활용한 웹 페이지 탐색, 게시물 작성 방법 등을 다룬다. 화면 읽기 프로그램을 활용해 컴퓨터로 웹상의 정보를 효과적으로 탐색하고 사용하도록 한다.","n":[],"p":243,"b":2},{"c":"[9시자05-06]","k":"공통","sk":"","s":"시각장애인 자립생활(초·중)","g":"중학교 1~3학년","d":"보조공학","t":"화면 읽기 프로그램을 활용해 스마트 기기에 내장된 앱의 기능을 탐색하고 사용한다.","m":"이 성취기준은 화면 읽기 프로그램을 활용해 스마트 기기의 인터페이스를 조작하고 내장 앱을 사용하는 능력을 기르게 하고자 설정하였다. 화면 읽기 프로그램의 환경 설정 방법, 스마트 기기 탐색을 위한 제스처와 키보드 단축키, 화면 읽기 프로그램을 활용한 전화, 문자, 설정 같은 내장 앱의 사용법, 스마트 기기 간의 연결과 연결된 스마트 기기를 활용한 정보 확인 방법 등을 다룬다. 화면 읽기 프로그램을 활용해 스마트 기기를 제어하는 방법을 익혀 스마트 기기를 효과적으로 사용하도록 한다.","n":[],"p":243,"b":2},{"c":"[9시자05-07]","k":"공통","sk":"","s":"시각장애인 자립생활(초·중)","g":"중학교 1~3학년","d":"보조공학","t":"광학문자판독기의 기능을 탐색하고 인쇄물을 텍스트 파일로 변환하여 읽는다.","m":"이 성취기준은 광학문자판독기를 활용해 인쇄물을 텍스트 문서로 변환해 사용하는 능력을 기르게 하고자 설정하였다. 광학문자판독기의 개념과 사용 목적, 광학문자판독 소프트웨어와 하드웨어의 종류와 기능, 사용 절차 등을 다룬다. 인쇄물과 그림 파일을 텍스트 문서로 변환하여 읽는 방법을 익혀 학습과 일상생활에 필요한 인쇄자료에 접근하는 데 활용하도록 한다.","n":[],"p":243,"b":2},{"c":"[9시자05-08]","k":"공통","sk":"","s":"시각장애인 자립생활(초·중)","g":"중학교 1~3학년","d":"보조공학","t":"화면 확대 프로그램을 활용해 다양한 문서 작성 프로그램을 사용한다.","m":"이 성취기준은 화면 확대 프로그램을 활용해 다양한 문서 작성 프로그램을 사용하는 능력을 기르게 하고자 설정하였다. 화면 확대 프로그램을 이용한 문서 작성, 프레젠테이션, 스프레드시트 작성과 편집 등을 다룬다. 화면 확대 프로그램을 활용함으로써 다양한 문서 작성 프로그램으로 문서를 작성하고 자료를 관리하는 기능을 익혀 문서 작성에 활용하도록 한다.","n":[],"p":243,"b":2},{"c":"[9시자05-09]","k":"공통","sk":"","s":"시각장애인 자립생활(초·중)","g":"중학교 1~3학년","d":"보조공학","t":"화면 확대 프로그램을 활용해 컴퓨터의 웹 브라우저를 효과적으로 사용한다.","m":"이 성취기준은 화면 확대 프로그램을 활용해 컴퓨터의 웹 브라우저를 사용하는 능력을 기르게 하고자 설정하였다. 웹 브라우저 및 일부 웹 사이트에서 제공하는 저시력인을 위한 접근성 기능 탐색, 화면 확대 프로그램을 사용한 웹 브라우저의 설정, 확대와 축소, 색상 반전을 통한 웹 페이지 탐색, 게시물 작성 등을 다룬다. 화면 확대 프로그램을 활용해 컴퓨터로 웹의 정보를 효과적으로 탐색하고 사용하도록 한다.","n":[],"p":243,"b":2},{"c":"[9시자05-10]","k":"공통","sk":"","s":"시각장애인 자립생활(초·중)","g":"중학교 1~3학년","d":"보조공학","t":"화면 확대 프로그램을 활용해 스마트 기기에 내장된 앱의 기능을 탐색하고 사용한다.","m":"이 성취기준은 화면 확대 프로그램을 활용해 스마트 기기의 인터페이스를 조작하고 내장 앱을 사용하는 능력을 기르게 하고자 설정하였다. 스마트 기기에서 사용할 수 있는 화면 확대 프로그램의 종류와 기능, 화면 확대 프로그램의 실행, 확대 및 축소, 색상 반전, 볼드체 텍스트 설정과 터치 제스처 방법, 전화, 문자, 설정 등의 화면 확대 프로그램을 이용한 내장 앱의 사용법, 스마트 기기끼리 연결하는 방법 및 연결된 스마트 기기를 활용해 정보를 확인하는 방법 등을 다룬다. 화면 확대 프로그램을 활용해 스마트 기기를 제어하는 방법을 익혀 스마트 기기를 효과적으로 사용하도록 한다.","n":[],"p":243,"b":2},{"c":"[9시자06-01]","k":"공통","sk":"","s":"시각장애인 자립생활(초·중)","g":"중학교 1~3학년","d":"여가 활용","t":"취미 활동 유형을 조사하고, 자신에게 맞는 취미를 선택한다.","m":"이 성취기준은 자신의 흥미와 적성에 맞는 취미를 선택하여 즐기는 능력을 기르게 하고자 설정하였다. 다양한 취미 활동 유형과 특징, 취미 활동에 관한 정보 수집, 취미를 선택하는 기준, 취미 관련 교육을 제공하는 기관의 종류와 프로그램의 유형 등을 다룬다. 주변 사람이나 인터넷을 이용해 취미 활동 정보를 수집하고, 다양한 취미 활동을 체험하여 자신에게 맞는 취미 활동을 선택하여 배우도록 한다.","n":[],"p":245,"b":2},{"c":"[9시자06-02]","k":"공통","sk":"","s":"시각장애인 자립생활(초·중)","g":"중학교 1~3학년","d":"여가 활용","t":"개인 블로그를 개설하고, 일상의 기록물을 블로그에 게시한다.","m":"이 성취기준은 글, 사진, 영상을 활용해 일상을 기록하고, 개인 블로그에 게시하는 능력을 기르게 하고자 설정하였다. 일상 기록물의 종류와 매체, 사진 및 영상 촬영 및 관리 방법, 블로그의 개설과 관리, 게시물 작성과 관리 등을 다룬다. 잔존 감각과 보조공학 기기를 활용해 글, 사진, 영상 등의 일상 기록물을 생성하고, 개인 블로그에 기록물을 게시하고 관리하도록 한다.","n":[],"p":245,"b":2},{"c":"[9시자06-03]","k":"공통","sk":"","s":"시각장애인 자립생활(초·중)","g":"중학교 1~3학년","d":"여가 활용","t":"스포츠 경기장과 방송 매체를 조사하고, 다양한 스포츠를 관람한다.","m":"이 성취기준은 스포츠 경기를 경기장과 온라인 방송을 이용하여 관람하는 능력을 기르게 하고자 설정하였다. 경기 정보 검색과 예매 방법, 경기장 구조, 관람 예절, 스포츠 중계 이용 방법, 화면 해설, 원거리용 저시력 기구 활용 등을 다룬다. 지역사회의 스포츠 경기장과 스포츠 중계 채널을 조사하고, 스포츠 경기장을 방문하여 망원경이나 화면 해설을 이용하여 경기를 관람하도록 한다.","n":[],"p":245,"b":2},{"c":"[9시자06-04]","k":"공통","sk":"","s":"시각장애인 자립생활(초·중)","g":"중학교 1~3학년","d":"여가 활용","t":"e-스포츠의 종류와 특징을 조사하고, 다양한 이 스포츠(e-sports)를 즐긴다.","m":"이 성취기준은 또래들이 즐기는 e-스포츠에 참여하고 즐기는 태도와 능력을 기르게 하고자 설정하였다. 개인 또는 단체형 e-스포츠의 종류, 게임 방법, 가상현실(VR) 기기와 콘텐츠, 보조공학 기기의 활용 등을 다룬다. 자신의 시각장애 정도와 접근성을 고려하여 e-스포츠를 선택하고, 보조공학 기기를 활용해 e-스포츠 경기 방법을 익혀 또래들과 e-스포츠를 즐기도록 한다.","n":[],"p":245,"b":2},{"c":"[9시자06-05]","k":"공통","sk":"","s":"시각장애인 자립생활(초·중)","g":"중학교 1~3학년","d":"여가 활용","t":"다양한 대중문화 예술을 체험하고, 자신이 선호하는 분야를 알아본다.","m":"이 성취기준은 다양한 대중문화 예술에 관심을 가지고 이용하는 능력을 기르게 하고자 설정하였다. 음악, 미술, 무용, 연극 같은 문화예술 공연, 축제, 박람회, 전시회 등을 다룬다. 다양한 대중문화 예술의 갈래와 특징을 조사하고 체험하여 자신이 선호하는 대중문화 예술 갈래를 파악하고 즐기도록 한다.","n":[],"p":245,"b":2},{"c":"[9시자06-06]","k":"공통","sk":"","s":"시각장애인 자립생활(초·중)","g":"중학교 1~3학년","d":"여가 활용","t":"전자 도서 서비스 플랫폼과 대체 도서 이용 방법을 조사하고 이용한다.","m":"이 성취기준은 독서를 즐기려고 전자⋅음성 도서와 대체 도서를 이용하는 능력을 기르게 하고자 설정하였다. 유료와 무료로 운영되는 각종 전자⋅음성 도서 플랫폼에 가입하고 이용하는 방법, 그림과 만화에 대한 화면 해설 서비스 이용 방법, 대체 도서 제작 기관과 서비스 유형에 따른 신청 방법 등을 다룬다. 시각장애인이 접근 가능한 전자 및 음성 도서 플랫폼의 유형과 대체 도서 서비스를 조사하고, 유료와 무료로 운영되는 도서 플랫폼에 회원 가입을 하여 이용하도록 한다.","n":[],"p":245,"b":2},{"c":"[9시자07-01]","k":"공통","sk":"","s":"시각장애인 자립생활(초·중)","g":"중학교 1~3학년","d":"진로 준비","t":"직업 평가에 참여하고, 평가 결과를 진로 결정에 활용한다.","m":"이 성취기준은 직업 평가로 자신의 직업 성향과 적성을 객관적으로 이해하는 능력을 기르게 하고자 설정하였다. 직업 카드, MBTI 성격유형검사, 직업흥미검사 등을 다룬다. 직업 평가 결과와 자신의 평소 관심 직업(군)을 상호 비교하고 분석하는 과정에서 자신의 직업 적성과 성향을 이해하도록 한다.","n":[],"p":247,"b":2},{"c":"[9시자07-02]","k":"공통","sk":"","s":"시각장애인 자립생활(초·중)","g":"중학교 1~3학년","d":"진로 준비","t":"친구들과 진로 동아리를 만들고, 진로 활동을 계획하여 실천한다.","m":"이 성취기준은 진로 동아리 활동으로 자신의 진로를 적극적으로 탐색하는 태도를 기르게 하고자 설정하였다. 진로 동아리 구성, 진로 활동 계획 수립, 진로 정보 조사 방법 등을 다룬다. 친구들과 진로 동아리를 만들어 다양한 진로와 직업에 대한 정보를 탐색하고 공유하는 과정에서 자신의 진로를 준비하고 진로 동아리 활동을 즐기도록 한다.","n":[],"p":247,"b":2},{"c":"[9시자07-03]","k":"공통","sk":"","s":"시각장애인 자립생활(초·중)","g":"중학교 1~3학년","d":"진로 준비","t":"시각장애인의 다양한 직업 사례를 조사하고, 성공을 위한 역량을 분석한다.","m":"이 성취기준은 시각장애인의 다양한 직업 사례로 진로 장벽을 이해하고 극복하는 태도와 능력을 기르게 하고자 설정하였다. 시각장애인의 취업 직종 조사, 취업 장벽의 유형 조사, 성공 사례와 성공 요인 분석, 실패 사례와 실패 요인 분석 등을 다룬다. 시각장애인의 다양한 직업 사례를 조사하고 분석하는 과정에서 시각장애가 직업 활동에 미치는 영향을 바르게 이해하고 진로를 준비해 나가도록 한다.","n":[],"p":247,"b":2},{"c":"[9시자07-04]","k":"공통","sk":"","s":"시각장애인 자립생활(초·중)","g":"중학교 1~3학년","d":"진로 준비","t":"우리나라의 직업(군) 분류와 각 직업(군)이 하는 일의 특성을 조사한다.","m":"이 성취기준은 우리나라의 직업(군)과 직업(군)별 일의 특성에 대한 이해를 높이고자 설정하였다. 한국직업표준분류, 한국직업사전, 시각장애인의 주요 취업 직업(군), 직무 분석, 직업(군)별 자격증 종류, 자격증 취득 준비 방법, 시각장애인 자격시험 편의 지원 등을 다룬다. 우리나라의 표준 직업 분류에 따른 직업(군)과 수행하는 직무와 직업 자격증에 대해 조사하고 분석하는 과정에서 직업(군)에 대한 이해를 높이도록 한다.","n":[],"p":247,"b":2},{"c":"[9시자07-05]","k":"공통","sk":"","s":"시각장애인 자립생활(초·중)","g":"중학교 1~3학년","d":"진로 준비","t":"다양한 직무 체험으로 직업 정보를 수집하고, 적성 직업을 탐색한다.","m":"이 성취기준은 직무 체험으로 적성 직업과 시각장애인의 직무 접근성에 대한 이해를 높이기 위해 설정하였다. 직무 체험 직업(군) 선정, 직무 체험 방법, 직무 체험 준비와 시각장애에 대한 고려 사항 등을 다룬다. 교내 실습장, 시각장애인 복지관, 한국장애인고용공단, 사업체 등에서 다양한 직무를 체험하고, 체험 결과를 분석하고 토론하는 과정에서 자신의 직업 적성과 시각장애인의 직무 장벽을 이해하도록 한다.","n":[],"p":247,"b":2},{"c":"[9시자07-06]","k":"공통","sk":"","s":"시각장애인 자립생활(초·중)","g":"중학교 1~3학년","d":"진로 준비","t":"직장 생활에서 지켜야 할 복무 규칙과 작업 태도를 조사하고 실천한다.","m":"이 성취기준은 직장에서 복무 규칙을 준수하며 생활하는 태도를 기르게 하고자 설정하였다. 복무 규칙의 개념, 직업(군)별 복무와 작업 규칙, 시각장애로 인한 동료 관계의 문제와 대처 기술 등을 다룬다. 직장에서의 복무 규칙과 바른 생활 태도를 조사하고 토론하는 과정에서 직장 생활에서의 복무 규칙 준수와 동료 관계의 중요성을 인식하고 실천하도록 한다.","n":[],"p":247,"b":2},{"c":"[9시자07-07]","k":"공통","sk":"","s":"시각장애인 자립생활(초·중)","g":"중학교 1~3학년","d":"진로 준비","t":"기본 작업 도구와 사무기기의 종류와 기능을 탐색하고, 안전하게 사용한다.","m":"이 성취기준은 기본적인 작업 도구와 사무기기를 안전하게 사용하는 능력을 기르게 하고자 설정하였다. 일반적인 작업 도구와 사무기기의 종류, 직업(군)별 특수한 작업도구, 시각장애를 고려한 작업 도구의 수정과 사용 방법 등을 다룬다. 다양한 작업 도구와 사무기기의 종류와 기능을 탐색하고, 잔존 감각을 활용해 작업 도구와 기기를 사용하는 과정에서 작업 도구와 기기를 안전하고 효과적으로 다루도록 한다.","n":[],"p":247,"b":2},{"c":"[6농문01-01]","k":"공통","sk":"","s":"농인의 생활과 문화(초·중)","g":"초등학교 5~6학년","d":"일상생활","t":"다양한 농인 가족의 형태를 알고, 가족 구성원 간에 바람직한 관계를 맺는다.","m":"이 성취기준은 정형화된 핵가족의 이미지에서 벗어나 확대 가족, 노인 가구, 독신 가구, 한 부모 가정, 다문화 가정 등 다양한 가족의 형태에 관심을 두고자 설정하였다. 농인 가족은 농인 구성원이 최소 1명 이상 포함된 가족의 형태를 의미한다. 청인 부모와 농인 자녀, 농인 부모와 농인 자녀, 농인 부모와 청인 자녀 등 다양한 형태가 존재할 수 있다. 이를 가족의 다양성 측면에서 이해하고 가족 구성원 간에 바람직한 관계를 맺는 것이 이 성취기준의 목적이 된다.","n":[],"p":261,"b":2},{"c":"[6농문01-02]","k":"공통","sk":"","s":"농인의 생활과 문화(초·중)","g":"초등학교 5~6학년","d":"일상생활","t":"대인 관계의 중요성을 이해하고 이를 위한 자기 표현 방법과 수용기술을 탐색한다.","m":"","n":[],"p":261,"b":2},{"c":"[6농문01-03]","k":"공통","sk":"","s":"농인의 생활과 문화(초·중)","g":"초등학교 5~6학년","d":"일상생활","t":"농인의 다양한 여가⋅문화활동을 체험하며, 대인 관계의 중요성을 이해한다.","m":"","n":[],"p":261,"b":2},{"c":"[6농문02-01]","k":"공통","sk":"","s":"농인의 생활과 문화(초·중)","g":"초등학교 5~6학년","d":"역사","t":"우리나라 농학교를 살펴보고 우리 지역의 농학교를 직간접적으로 체험한다.","m":"이 성취기준은 우리나라 여러 농학교를 직접 방문하거나 간접적으로 체험함으로써 농역사와 농문화를 이해하여 자신의 삶에 대한 자부심을 가지도록 하는 데 목적이 있다.","n":[],"p":262,"b":2},{"c":"[6농문02-02]","k":"공통","sk":"","s":"농인의 생활과 문화(초·중)","g":"초등학교 5~6학년","d":"역사","t":"우리나라 농사회의 발전에 기여한 역사 속의 농인을 살펴보고 농교육에 대한 올바른 태도를 함양한다.","m":"","n":[],"p":262,"b":2},{"c":"[6농문03-01]","k":"공통","sk":"","s":"농인의 생활과 문화(초·중)","g":"초등학교 5~6학년","d":"정체성","t":"농인을 바라보는 기본적⋅문화적 관점을 알고 나의 강점을 계발한다.","m":"이 성취기준은 초등학교 시기에 경험하는 기본 사회인 가정 및 학교에서 시각적 언어를 바탕으로 살아가는 농인의 삶을 체험하고, 이를 문화적 관점으로 이해하여 자신의 삶을 긍정적으로 바라보고 강점을 계발하는데 목적이 있다.","n":[],"p":262,"b":2},{"c":"[6농문03-02]","k":"공통","sk":"","s":"농인의 생활과 문화(초·중)","g":"초등학교 5~6학년","d":"정체성","t":"청각장애가 농인의 삶에 미치는 영향을 알고 나의 약점을 보완하려 노력한다.","m":"","n":[],"p":262,"b":2},{"c":"[6농문03-03]","k":"공통","sk":"","s":"농인의 생활과 문화(초·중)","g":"초등학교 5~6학년","d":"정체성","t":"문화적 관점을 바탕으로 농인, 청인과 긍정적인 관계를 맺는다.","m":"이 성취기준은 농인과 청인이 서로 차이점을 인정하고, 관계를 맺는 방식과 방법을 사례에서 알아봄으로써 긍정적인 관계를 맺는 역량을 기르게 하고자 선정되었다.","n":[],"p":262,"b":2},{"c":"[6농문04-01]","k":"공통","sk":"","s":"농인의 생활과 문화(초·중)","g":"초등학교 5~6학년","d":"의사소통","t":"다양한 양식의 의사소통 방법에 참여하고 각각의 의사소통 특성을 이해한다.","m":"","n":[],"p":263,"b":2},{"c":"[6농문04-02]","k":"공통","sk":"","s":"농인의 생활과 문화(초·중)","g":"초등학교 5~6학년","d":"의사소통","t":"시각을 통한 의사소통의 특성을 알고, 필담⋅문자 대화의 표현 방법을 익힌다.","m":"이 성취기준은 이중 언어 이중 문화 접근법에 따라 문자 언어 사용의 중요성에강조점이 있다. 학령기는 일상생활에서 의사소통에 필요한 언어 사용을 넘어서 지식 습득에필요한 문자 언어를 숙달해야 하는 중요한 시기이므로 다양한 독서로 문해 능력을 향상하고, 문자 대화로 의사소통하는 방법을 습득하는 것을 목적으로 한다. 문자 대화란 휴대 전화의 문자 메시지 기능이나 컴퓨터의 메신저 프로그램 등을 이용하여 대화하는 방법을 말한다.","n":[],"p":263,"b":2},{"c":"[6농문04-03]","k":"공통","sk":"","s":"농인의 생활과 문화(초·중)","g":"초등학교 5~6학년","d":"의사소통","t":"통역의 필요성을 살펴보고 다양한 방법으로 의사소통을 시도한다.","m":"","n":[],"p":263,"b":2},{"c":"[6농문05-01]","k":"공통","sk":"","s":"농인의 생활과 문화(초·중)","g":"초등학교 5~6학년","d":"예술","t":"농문학의 정의를 알아보고 작품을 보며 농문학을 경험하고 느낌을 표현한다.","m":"이 성취기준은 농문학이 운문과 산문으로 크게 나뉘며 각각의 농문학 갈래에 따라 전달하고자 하는 내용과 표현하는 형식이 다름을 이해하고, 농문학의 여러 장르에서 나타나는 특성과 정의를 이해하며 작품을 경험해 보고 느낌을 표현하는 데 목적이 있다.","n":[],"p":263,"b":2},{"c":"[6농문05-02]","k":"공통","sk":"","s":"농인의 생활과 문화(초·중)","g":"초등학교 5~6학년","d":"예술","t":"농예술의 정의를 알아보고 작품을 보며 농예술을 경험하고 느낌을 표현한다.","m":"","n":[],"p":263,"b":2},{"c":"[6농문05-03]","k":"공통","sk":"","s":"농인의 생활과 문화(초·중)","g":"초등학교 5~6학년","d":"예술","t":"농문학 작품을 경험한 느낌을 바탕으로 올바른 농문학 감상 태도를 지닌다.","m":"이 성취기준은 다양한 생각과 표현 방식을 존중하며 농문학을 경험하고 그 느낌을 공유하며 공감하게 하고자 설정하였다. 농문학을 경험한 느낌 공유하기, 바르게 감상하는 태도 기르기 등을 다룬다.","n":[],"p":263,"b":2},{"c":"[6농문05-04]","k":"공통","sk":"","s":"농인의 생활과 문화(초·중)","g":"초등학교 5~6학년","d":"예술","t":"농예술 작품을 경험한 느낌을 바탕으로 올바른 농예술 감상 태도를 지닌다.","m":"","n":[],"p":263,"b":2},{"c":"[6농문06-01]","k":"공통","sk":"","s":"농인의 생활과 문화(초·중)","g":"초등학교 5~6학년","d":"보조공학","t":"보청기와 인공와우가 무엇인지 알아보고 각자 사용하는 보조공학 기기에 대한 경험을 나눈다.","m":"이 성취기준은 수어를 제1언어로 사용하는 농학생이라 하더라도 잔존 청력과음성 언어로 의사소통하는 방법에 관한 정보와 장단점을 알 기회를 제공하는 데 목적이 있다.","n":[],"p":264,"b":2},{"c":"[6농문06-02]","k":"공통","sk":"","s":"농인의 생활과 문화(초·중)","g":"초등학교 5~6학년","d":"보조공학","t":"시각 활용 보조공학 기기의 종류를 알아보고 생활에 활용한다.","m":"","n":[],"p":264,"b":2},{"c":"[6농문06-03]","k":"공통","sk":"","s":"농인의 생활과 문화(초·중)","g":"초등학교 5~6학년","d":"보조공학","t":"일상생활과 학습 상황에서 보조공학 기기를 체험⋅활용함으로써 가치를 인식한다.","m":"이 성취기준은 일상생활과 학습 상황에서 시각 활용, 청각 활용 보조공학 기기의 활용법과 관리법을 알아보고 직접 체험, 활용하면서 필요성과 중요성에 관심을 두도록 하고자 설정하였다.","n":[],"p":264,"b":2},{"c":"[6농문07-01]","k":"공통","sk":"","s":"농인의 생활과 문화(초·중)","g":"초등학교 5~6학년","d":"복지","t":"학교와 유관 기관에서 하는 농인을 위한 교육 지원의 의미와 유형을 알아보고 다양한 특수교육 지원 서비스를 탐색하여 활용한다.","m":"이 성취기준은 학교와 유관 기관에서 제공되는 다양한 특수교육 관련 서비스를알아보고 자신에게 필요한 서비스를 활용하는 능력을 기르게 하고자 설정하였다. 학교에서 제공되는 교육 지원뿐만 아니라 교육청 등 유관 기관에서 제공되는 다양한 교육 지원의 종류, 치료지원과 상담 등 특수교육 관련 서비스 알고 활용하기 등의 내용을 다룬다. 일상생활에서 자신에게 제공되는 복지 혜택에 관심을 가지고 활용하는 역량을 기르는 것을 목적으로 한다.","n":[],"p":265,"b":2},{"c":"[6농문07-02]","k":"공통","sk":"","s":"농인의 생활과 문화(초·중)","g":"초등학교 5~6학년","d":"복지","t":"장애인 편의시설의 필요성을 인식하고 일상생활에서 장애인을 위한 편의시설을 찾아본다.","m":"이 성취기준은 일상생활을 영위하는 데서 장애인들의 불편함을 알고, 편의시설의 필요성을 인식하도록 하는 데 목적이 있다. 또한 일상생활에서 농인을 위한 편의 시설뿐만 아니라 다른 장애인들을 위한 편의시설도 찾아보는 내용이 포함된다.","n":[],"p":265,"b":2},{"c":"[9농문01-01]","k":"공통","sk":"","s":"농인의 생활과 문화(초·중)","g":"중학교 1~3학년","d":"일상생활","t":"농인 가족 구성원 간 역할의 특성을 이해하여 역할에 따른 책임감을 가진다.","m":"이 성취기준은 농인 구성원이 최소 1명 이상 포함된 농인 가족에게 나타나는의사소통의 어려움과 농인 가족 구성원 간 역할의 특성을 이해하고, 이를 해결할 방법을 여러 예시로 탐색함으로써 역할에 따른 책임감을 가지도록 하여 학생이 자신이 삶의 주인임을 자각하는 데 목적이 있다.","n":[],"p":266,"b":2},{"c":"[9농문01-02]","k":"공통","sk":"","s":"농인의 생활과 문화(초·중)","g":"중학교 1~3학년","d":"일상생활","t":"자기 주장과 공감 기술을 익혀 학교 구성원 간 바람직한 관계를 맺는다.","m":"","n":[],"p":266,"b":2},{"c":"[9농문01-03]","k":"공통","sk":"","s":"농인의 생활과 문화(초·중)","g":"중학교 1~3학년","d":"일상생활","t":"농인의 여가⋅문화활동의 종류를 알고, 지역사회의 여가⋅문화활동에 참여한다.","m":"","n":[],"p":266,"b":2},{"c":"[9농문02-01]","k":"공통","sk":"","s":"농인의 생활과 문화(초·중)","g":"중학교 1~3학년","d":"역사","t":"우리나라 농공동체를 방문하고 농공동체의 모습을 이해한다.","m":"이 성취기준에서 ‘농공동체’는 지역사회 내에 농인들이 이용하는 농아인협회, 청각장애인복지관, 농교회, 농동호회 등을 의미한다. 농공동체를 방문해 농인들을 만나고 농공동체의 모습을 이해하는 데 목적이 있다.","n":[],"p":266,"b":2},{"c":"[9농문02-02]","k":"공통","sk":"","s":"농인의 생활과 문화(초·중)","g":"중학교 1~3학년","d":"역사","t":"다양한 분야에 기여한 우리나라 농인들을 만나 삶을 살펴보고 자부심을 갖는다.","m":"","n":[],"p":266,"b":2},{"c":"[9농문03-01]","k":"공통","sk":"","s":"농인의 생활과 문화(초·중)","g":"중학교 1~3학년","d":"정체성","t":"농인이 일상생활에서 경험하는 불편과 어려움을 병리적 관점과 문화적 관점에서 이해하고, 서로 배려하는 태도를 갖는다.","m":"이 성취기준은 농인이 일상생활에서 경험하는 불편을 다양한 예시로 알아보고,이를 병리적 관점이 아닌 문화적 관점에서 인식하여, 서로 배려하는 태도를 기르게 하고자 설정하였다.","n":[],"p":267,"b":2},{"c":"[9농문03-02]","k":"공통","sk":"","s":"농인의 생활과 문화(초·중)","g":"중학교 1~3학년","d":"정체성","t":"문화적 관점을 바탕으로 나의 도전 과제를 탐색하고, 적절한 해결 방법을 찾는다.","m":"","n":[],"p":267,"b":2},{"c":"[9농문03-03]","k":"공통","sk":"","s":"농인의 생활과 문화(초·중)","g":"중학교 1~3학년","d":"정체성","t":"농인과 청인의 공통점과 차이점을 알고, 서로 존중하는 태도를 갖는다.","m":"이 성취기준은 농인과 청인이 서로 공통점과 차이점을 인정하고 서로 존중함으로써 긍정적인 관계를 맺을 수 있는 역량을 기르게 하고자 설정하였다.","n":[],"p":267,"b":2},{"c":"[9농문04-01]","k":"공통","sk":"","s":"농인의 생활과 문화(초·중)","g":"중학교 1~3학년","d":"의사소통","t":"다양한 의사소통 방법을 활용하여 효과적으로 대화를 시도한다.","m":"","n":[],"p":267,"b":2},{"c":"[9농문04-02]","k":"공통","sk":"","s":"농인의 생활과 문화(초·중)","g":"중학교 1~3학년","d":"의사소통","t":"수어와 문자 언어의 특성을 알고 이를 활용하여 상대방과 올바르게 대화한다.","m":"이 성취기준은 수어와 문자 언어 등 다양한 의사소통 방법의 특성을 알고 이를 활용하여 상대방과 올바르게 대화하는 방법을 익히게 하는 것에 목적이 있다","n":[],"p":267,"b":2},{"c":"[9농문04-03]","k":"공통","sk":"","s":"농인의 생활과 문화(초·중)","g":"중학교 1~3학년","d":"의사소통","t":"통역을 통한 의사소통 방법을 익히고 다양한 환경에서 의사소통 적응 능력을 기른다.","m":"이 성취기준에서 통역을 통한 의사소통 방법은 수어 통역뿐 아니라 문자 통역을 포함한다.","n":[],"p":267,"b":2},{"c":"[9농문05-01]","k":"공통","sk":"","s":"농인의 생활과 문화(초·중)","g":"중학교 1~3학년","d":"예술","t":"농문학과 농예술의 특성을 이해하고, 다양한 작품과 공연을 감상하며 감상평을 공유한다.","m":"","n":[],"p":268,"b":2},{"c":"[9농문05-02]","k":"공통","sk":"","s":"농인의 생활과 문화(초·중)","g":"중학교 1~3학년","d":"예술","t":"농예술과 청사회 예술의 문화적 차이를 이해하고, 고유한 가치를 인식한다.","m":"","n":[],"p":268,"b":2},{"c":"[9농문05-03]","k":"공통","sk":"","s":"농인의 생활과 문화(초·중)","g":"중학교 1~3학년","d":"예술","t":"농예술가(표현하는 이)의 관점에 주목하여 작품과 공연을 감상하고 공감한다.","m":"이 성취기준은 농예술가(표현하는 이)의 관점에서 작품을 이해함과 동시에 감상자의 경험과 생각에 따라 느낌이 다를 수 있음을 인지하고 열린 마음으로 작품을 감상하는 소양을 기르게 하는 데 목적이 있다. 농예술가(표현하는 이)의 관점 이해, 농예술 공연과작품을 감상하고 공감하기 등을 다룬다.","n":[],"p":268,"b":2},{"c":"[9농문05-04]","k":"공통","sk":"","s":"농인의 생활과 문화(초·중)","g":"중학교 1~3학년","d":"예술","t":"농문학 작품과 농예술에서 표현된 감성을 이해하고, 농문학과 농예술 작품의 가치를 인식하는 태도를 가진다.","m":"","n":[],"p":268,"b":2},{"c":"[9농문06-01]","k":"공통","sk":"","s":"농인의 생활과 문화(초·중)","g":"중학교 1~3학년","d":"보조공학","t":"청각 활용 보조공학 기기의 종류와 기능을 알고, 이를 활용하는 최적의 청취 환경을 구성해효과적으로 유지한다.","m":"이 성취기준은 청각 활용 보조공학 기기의 중요성을 알고 최적의 성능을 낼 수 있는 환경을 스스로 인식하여 조절⋅활용하는 능력을 기르게 하는 데 중점을 둔다. 청각 활용 보조공학 기기의 종류와 기능 알기, 최적의 효과를 내어 활용하는 방법 익히기 등을 다룬다.","n":[],"p":269,"b":2},{"c":"[9농문06-02]","k":"공통","sk":"","s":"농인의 생활과 문화(초·중)","g":"중학교 1~3학년","d":"보조공학","t":"시각 활용 보조공학 기술과 기기의 기능을 알아보고 효과적으로 활용한다.","m":"","n":[],"p":269,"b":2},{"c":"[9농문06-03]","k":"공통","sk":"","s":"농인의 생활과 문화(초·중)","g":"중학교 1~3학년","d":"보조공학","t":"정보 접근과 의사소통 과정에서 보조공학 기기를 활용하며, 그 가치와 중요성을 안다.","m":"","n":[],"p":269,"b":2},{"c":"[9농문07-01]","k":"공통","sk":"","s":"농인의 생활과 문화(초·중)","g":"중학교 1~3학년","d":"복지","t":"농인의 진학 지원을 이해하고, 나의 능력과 자질을 탐색하여 적절한 진학 방법과 과정을 탐색한다.","m":"이 성취기준은 중학교에서 고등학교로 진학할 때 필요한 지원을 이해하고 진로와 진학에 지속적으로 관심을 두게 하는 데 목적이 있다. 진학 지원의 종류와 방법 이해하기, 진학 지원을 포함한 농인의 권리를 확보하기 위한 제도와 법률 탐색하기 등을 다룬다.","n":[],"p":269,"b":2},{"c":"[9농문07-02]","k":"공통","sk":"","s":"농인의 생활과 문화(초·중)","g":"중학교 1~3학년","d":"복지","t":"장애인 보조공학 기기 관련 사업을 탐색하고 장애인 의료비 사업의 필요성을 알아본다.","m":"이 성취기준은 장애인 보조공학 기기와 의료비 사업 지원의 범위를 이해하고, 서비스를 이용할 기본 능력을 갖추기 위해 지원 범위와 절차를 스스로 탐색할 수 있는 내용을 담았다.","n":[],"p":269,"b":2},{"c":"[9농문07-03]","k":"공통","sk":"","s":"농인의 생활과 문화(초·중)","g":"중학교 1~3학년","d":"복지","t":"장애인의 일할 권리의 중요성과 가치를 이해하고 내가 할 수 있는 직업을 알아본다.","m":"","n":[],"p":269,"b":2},{"c":"[6점자01-01]","k":"공통","sk":"","s":"점자","g":"초등학교 5~6학년","d":"점자의 기초","t":"여러 가지 사물과 질감의 촉감을 탐색하고 분류한다.","m":"이 성취기준은 여러 가지 사물과 질감 자료를 사용하여 촉지각을 발달시키기 위해 설정하였다. 생활 주변에 있는 사물의 모양과 질감 변별, 종이의 질감 변별, 천 조각의 질감 변별 등을 다룬다. 여러 가지 질감 자료들을 손으로 만져 탐색하고 질감에 따라 짝짓거나 분류하면서 촉지각이 발달하도록 한다.","n":[],"p":286,"b":2},{"c":"[6점자01-02]","k":"공통","sk":"","s":"점자","g":"초등학교 5~6학년","d":"점자의 기초","t":"여러 가지 모양, 선, 점을 지각하고 구별한다.","m":"이 성취기준은 여러 가지 양각 선, 양각 점을 사용하여 촉지각을 발달시키기 위해 설정하였다. 양각 선 도형과 그림의 변별, 여러 가지 종류의 선 따라가기, 다양한 크기와 형태의 점 찾기 등을 다룬다. 여러 가지 종류의 모양, 선, 점을 손으로 지각하여 구별하고, 분류하면서 촉지각과 점자의 점에 대한 인식이 발달하도록 한다. 이 성취기준은 옛 글자의 모음자를 점자로 읽고 쓰는 능력을 기르게 하고자 설정하였다. ‘⋅, ㆎ’, ‘ㆉ, ㆇ, ㆈ, ㆌ, ㆊ, ㆋ’, ‘딴 이(ㅣ)’등의 옛 모음자의 점자 기호와 규정을 다룬다. 다양한 예문을 점자로 읽고 쓰는 과정에서 옛 모음자를 점자로 정확하고 유창하게 읽고 쓰도록 한다.","n":[],"p":286,"b":2},{"c":"[6점자01-03]","k":"공통","sk":"","s":"점자","g":"초등학교 5~6학년","d":"점자의 기초","t":"양각 점의 개수를 세어 보며 1~6까지의 수의 개념을 익힌다.","m":"이 성취기준은 점자의 6점을 학습하는 데 필요한 1~6의 수 개념을 익히게 하고자 설정하였다. 1~6까지의 수 말하기, 구체물 세어 보기, 양각 도형과 그림 세어 보기, 양각 점 세어 보기 등을 다룬다. 다양한 사물과 양각 자료를 이용한 1~6의 수 세기 활동으로 점자의 6점 학습을 위한 수 개념을 익히도록 한다.","n":[],"p":286,"b":2},{"c":"[6점자01-04]","k":"공통","sk":"","s":"점자","g":"초등학교 5~6학년","d":"점자의 기초","t":"점자의 6점의 위치와 번호를 알고, 바른 자세로 6점을 읽는다.","m":"이 성취기준은 바른 점자 읽기 자세로 점칸 내 점 6개의 위치와 점 번호를 익히게 하고자 설정하였다. 오른쪽, 왼쪽, 위, 아래의 위치 개념 익히기, 6점의 위치 말하기, 6점의 번호 말하기, 점자를 읽는 손의 자세와 움직임 등을 다룬다. 다양한 종류의 점자 교구와 점자지에 제시된 점의 위치와 점 번호를 탐색하고, 한 손 점독과 양손 점독의 바른 자세를 익히도록 한다.","n":[],"p":286,"b":2},{"c":"[6점자01-05]","k":"공통","sk":"","s":"점자","g":"초등학교 5~6학년","d":"점자의 기초","t":"다양한 점형을 손으로 지각하고 변별한다.","m":"이 성취기준은 여러 가지 점형을 손으로 지각하여 변별하는 능력을 기르게 하고자 설정하였다. 다양한 점형 지각하기, 점 위치와 번호 확인하기, 점형 변별하기, 같은 점형 찾기 등을 다룬다. 큰 점자나 표준 점자를 사용하여 한 점, 두 점, 세 점, 네 점, 다섯 점으로 구성된 다양한 점형을 손으로 지각하여 같은 점형끼리 짝짓고 분류하면서 점형을 정확하게 변별하도록 한다.","n":[],"p":286,"b":2},{"c":"[6점자01-06]","k":"공통","sk":"","s":"점자","g":"초등학교 5~6학년","d":"점자의 기초","t":"점자 도구의 종류와 구조를 탐색하고, 바르게 사용한다.","m":"이 성취기준은 점자를 읽고 쓰는 다양한 도구를 사용하는 능력을 기르게 하고자 설정하였다. 점자 도구의 종류와 기능, 점자판의 구성과 바른 쓰기 자세, 점자 타자기, 점자정보단말기의 기본 사용법 등을 다룬다. 다양한 점자 도구의 종류와 구조를 탐색하고, 이들 점자 도구로 점자를 쓰고 읽어 보는 방법을 익혀 상황에 따라 적합한 점자 도구를 선택하여 사용하도록 한다.","n":[],"p":286,"b":2},{"c":"[6점자01-07]","k":"공통","sk":"","s":"점자","g":"초등학교 5~6학년","d":"점자의 기초","t":"점자의 6점을 순서대로 쓰고, 점의 위치를 읽고 모방하여 쓴다.","m":"이 성취기준은 점자 도구를 사용하여 6점을 쓰는 능력을 기르게 하고자 설정하였다. 온표를 반복하여 쓰기, 6점을 순서대로 쓰기, 여러 개의 점으로 구성된 점형 쓰기, 모방하여 쓰기 등을 다룬다. 학생에게 적합한 점자 도구를 선택하여 온표 쓰기와 점칸 내 6점 쓰기를 연습한 후, 단순한 점형들을 손으로 지각하고 모방하여 쓰는 과정에서 점자의 6점을 정확하게 쓰도록 한다.","n":[],"p":286,"b":2},{"c":"[6점자02-01]","k":"공통","sk":"","s":"점자","g":"초등학교 5~6학년","d":"한글 점자","t":"모음자의 점자 기호와 규정을 알고, 점자로 읽고 쓴다.","m":"이 성취기준은 한글의 모음자를 점자로 읽고 쓰는 능력을 기르게 하고자 설정하였다. 기본 모음자, 기본 모음자로 이루어진 낱말, 이중 모음자, ‘모음자+ㅖ’의 붙임표 사용, ‘ㅑ, ㅘ, ㅜ, ㅝ 뒤에 ㅐ가 이어 나올 경우’의 붙임표 사용 등의 점자 기호와 규정을 다룬다. 다양한 예문을 점자로 읽고 쓰는 과정에서 모음자를 정확하고 유창하게 읽고 쓰도록 한다.","n":[],"p":288,"b":2},{"c":"[6점자02-02]","k":"공통","sk":"","s":"점자","g":"초등학교 5~6학년","d":"한글 점자","t":"자음자의 점자 기호와 규정을 알고, 점자로 읽고 쓴다.","m":"이 성취기준은 한글의 자음자를 점자로 읽고 쓰는 능력을 기르게 하고자 설정하였다. 초성 자음자, 첫소리에 오는 ‘ㅇ’의 생략, 된소리 표, 초성 자음자와 모음자로 이루어진 낱말, 종성 자음자, 받침에 오는 ‘ㅇ’, 쌍받침과 겹받침 표기, 받침이 있는 낱말 등의 점자 기호와 규정을 다룬다. 다양한 예문을 점자로 읽고 쓰는 과정에서 초성 자음자를 정확하고 유창하게 읽고 쓰도록 한다.","n":[],"p":288,"b":2},{"c":"[6점자02-03]","k":"공통","sk":"","s":"점자","g":"초등학교 5~6학년","d":"한글 점자","t":"숫자의 점자 기호와 규정을 알고, 점자로 읽고 쓴다.","m":"이 성취기준은 다양한 숫자 표현을 점자로 읽고 쓰는 능력을 기르게 하고자 설정하였다. 수표, 숫자 ‘0∼9’, 두 자리 이상의 수 표기, 숫자와 숫자 사이에 쌍점, 붙임표, 자릿점, 가운뎃점, 마침표가 오는 경우, 숫자 다음에 한글이 이어 나오는 경우, 숫자가 붙임표나 물결표로 이어지는 경우 등의 점자 기호와 규정을 다룬다. 다양한 예문을 점자로 읽고 쓰는 과정에서 한글에 사용하는 다양한 숫자 표현을 점자로 정확하고 유창하게 읽고 쓰도록 한다.","n":[],"p":288,"b":2},{"c":"[6점자02-04]","k":"공통","sk":"","s":"점자","g":"초등학교 5~6학년","d":"한글 점자","t":"약자의 점자 기호와 규정을 알고, 점자로 읽고 쓴다.","m":"이 성취기준은 한글 점자를 효율적으로 사용하기 위해 약자를 읽고 쓰는 능력을 기르게 하고자 설정하였다. ‘가’와 ‘사’약자, ‘ㅏ’생략 약자, ‘까, 싸, 껏’의 표기, ‘성, 썽, 정, 쩡, 청’의 표기, ‘ㅏ’를 생략하지 않는 경우 등의 점자 기호와 규정을 다룬다. 다양한 예문을 점자로 읽고 쓰는 과정에서 약자를 사용하는 낱말을 점자로 정확하고 유창하게 읽고 쓰도록 한다.","n":[],"p":288,"b":2},{"c":"[6점자02-05]","k":"공통","sk":"","s":"점자","g":"초등학교 5~6학년","d":"한글 점자","t":"약어의 점자 기호와 규정을 알고, 점자로 읽고 쓴다.","m":"이 성취기준은 한글 점자를 효율적으로 사용하기 위해 약어를 읽고 쓰는 능력을 기르게 하고자 설정하였다. ‘그래서’, ‘그러나’, ‘그러면’, ‘그러므로’, ‘그런데’, ‘그리고’, ‘그리하여’ 등의 점자 기호와 규정을 다룬다. 다양한 예문을 점자로 읽고 쓰는 과정에서 약어가 포함된 문장을 점자로 정확하고 유창하게 읽고 쓰도록 한다.","n":[],"p":288,"b":2},{"c":"[6점자02-06]","k":"공통","sk":"","s":"점자","g":"초등학교 5~6학년","d":"한글 점자","t":"문장 부호와 기타 부호의 점자 기호와 규정을 알고, 점자로 읽고 쓴다.","m":"이 성취기준은 문장 부호와 기타 부호를 점자로 읽고 쓰는 능력을 기르게 하고자 설정하였다. 마침표, 물음표, 느낌표, 쉼표, 별표(*), 위와 같은 표(〃), 긴소리 표(ː), 화폐 단위 등의 점자 기호와 규정을 다룬다. 다양한 예문을 점자로 읽고 쓰는 과정에서 문장 부호와 기타 부호가 포함된 문장을 점자로 정확하고 유창하게 읽고 쓰도록 한다.","n":[],"p":288,"b":2},{"c":"[6점자02-07]","k":"공통","sk":"","s":"점자","g":"초등학교 5~6학년","d":"한글 점자","t":"문장과 문단 쓰기의 점자 규정을 알고, 규정에 맞게 쓴다.","m":"이 성취기준은 한글 점자를 사용하여 문장과 문단을 정확하고 유창하게 읽고 쓰는 능력을 기르게 하고자 설정하였다. 문장과 문단에서 띄어쓰기, 줄 바꿈, 들여쓰기, 내어쓰기 등의 점자 규정을 다룬다. 다양한 예문을 점자로 쓰는 과정에서 한글의 문장과 문단을 규정에 따라 정확하고 유창하게 읽고 쓰도록 한다.","n":[],"p":288,"b":2},{"c":"[6점자02-08]","k":"공통","sk":"","s":"점자","g":"초등학교 5~6학년","d":"한글 점자","t":"여러 종류와 형식의 글을 점자로 정확하고 유창하게 읽고 쓴다.","m":"이 성취기준은 다양한 형식의 글을 유창하게 읽고 쓰는 능력을 기르게 하고자 설정하였다. 일기문, 편지글, 설명하는 글, 표와 도식이 포함된 글 등을 다룬다. 여러 가지 종류와 형식의 글을 점자로 읽고 쓰는 과정에서 점자로 읽고 쓰는 정확성과 속도를 향상하도록 한다.","n":[],"p":288,"b":2},{"c":"[6점자03-01]","k":"공통","sk":"","s":"점자","g":"초등학교 5~6학년","d":"기능적 점자","t":"생활에서 자주 접하는 사물과 사람의 이름을 선정한다.","m":"이 성취기준은 학생이 생활에서 자주 접하는 사물과 사람의 이름을 점자로 사용하는 능력을 기르게 하고자 설정하였다. ‘아’, ‘오’, ‘아이’, ‘우유’, ‘여우’ 같이 모음으로 구성된 사물 이름, ‘하하’, ‘호호’, ‘바나나’, ‘피자’ 같이 자음과 모음으로 구성된 사물의 이름, ‘아빠’, ‘엄마’, ‘나’ 같은 가족의 호칭, 자주 만나는 사람의 이름, 좋아하는 친구 이름 등을 다룬다. 일상생활에서 자주 사용하고 점형을 구별하기 쉽고 학생이 좋아하는 친숙한 사물과 사람의 이름을 선정하여 점자 학습에 흥미를 가지고 사물과 사람의 이름을 점자로 읽고 쓰도록 한다.","n":[],"p":290,"b":2},{"c":"[6점자03-02]","k":"공통","sk":"","s":"점자","g":"초등학교 5~6학년","d":"기능적 점자","t":"생활에서 자주 사용하는 수의 범위를 선정한다.","m":"이 성취기준은 학생이 생활에서 사용하는 숫자를 점자로 사용하는 능력을 기르게 하고자 설정하였다. 자주 사용하거나 좋아하는 수, 엘리베이터 조작 버튼의 숫자, 건물의 층을 나타내는 숫자 등을 다룬다. 일상생활에서 자주 사용하는 숫자와 수의 범위를 선정하여 점자 학습에 흥미를 가지고 숫자를 점자로 읽고 쓰도록 한다.","n":[],"p":290,"b":2},{"c":"[6점자03-03]","k":"공통","sk":"","s":"점자","g":"초등학교 5~6학년","d":"기능적 점자","t":"다양한 크기, 위치, 개수의 점을 탐색하고 점자에 관심을 갖는다.","m":"이 성취기준은 촉각을 사용하여 다양한 점을 지각하고 점자에 흥미와 관심을 갖는 태도를 기르게 하고자 설정하였다. 크기가 다른 점, 위치가 다른 점, 개수가 다른 점, 점선으로 이루어진 모양과 그림, 점자의 6점 놀이, 점형 변별 놀이 등을 다룬다. 다양한 점을 손으로 만져 탐색하고 경험하는 놀이 활동에서 촉각을 통해 점을 지각하고 점자가 6개의 점으로 구성되어 있음을 인식하도록 한다.","n":[],"p":290,"b":2},{"c":"[6점자03-04]","k":"공통","sk":"","s":"점자","g":"초등학교 5~6학년","d":"기능적 점자","t":"점자로 쓰인 낱말을 읽고, 낱말의 의미를 이해한다.","m":"이 성취기준은 생활에서 자주 사용하는 낱말을 점자로 읽고 낱말의 의미를 이해하는 능력을 기르게 하고자 설정하였다. 낱말의 점형 탐색, 낱말의 전체적인 점형의 모양, 길이 같은 특징 인식, 낱말과 온표 점형 구별, 낱말과 관련된 사물 조작이나 활동 등을 다룬다. 낱말의 전체적인 점형의 모양을 손으로 인식하여 읽고, 낱말과 관련된 사물이나 활동을 통해 낱말의 의미를 정확하게 이해하도록 한다.","n":[],"p":290,"b":2},{"c":"[6점자03-05]","k":"공통","sk":"","s":"점자","g":"초등학교 5~6학년","d":"기능적 점자","t":"여러 가지 낱말의 점형을 구별하여 사용한다.","m":"이 성취기준은 여러 개의 친숙한 낱말들을 점자로 구별하는 능력을 기르게 하고자 설정하였다. 점형의 모양이 다른 낱말 변별, 점형의 모양이 비슷한 낱말 변별, 점형이 같은 낱말 짝짓기, 낱말 찾기 등을 다룬다. 낱말들을 손으로 지각하고 변별하는 반복 학습으로 여러 가지 낱말들을 구별하여 읽도록 한다.","n":[],"p":290,"b":2},{"c":"[6점자03-06]","k":"공통","sk":"","s":"점자","g":"초등학교 5~6학년","d":"기능적 점자","t":"적합한 점자 도구를 선택하여 사용한다.","m":"이 성취기준은 자신에게 적합한 점자 도구를 사용하는 능력을 기르게 하고자 설정하였다. 점자 도구의 종류와 사용 경험, 자신에게 적합한 점자 도구 선택, 점자 도구의 기본 사용법, 바른 쓰기 자세 등을 다룬다. 자신에게 적합한 점자 도구의 구조와 기능을 탐색하고, 점자 도구를 바르게 사
