질문을 활용하여 글을 예측하며 읽고 자신의 읽기 과정을 점검한다.","m":"이 성취기준은 글을 읽으며 글에 대한 질문을 만들고 이에 대한 답을 예측하면서 글을 읽는 추론적 읽기 능력을 기르기 위해 설정하였다. 읽기 전이나 읽기 중에 이루어지는 질문을 통해 자신의 배경지식이나 경험을 글과 관련짓기, 배경지식이나 경험을 활성화하여 글의 의미 예측하기, 제목이나 글의 차례, 사진이나 그림 등의 자료를 통해 글의 의미 예측하기, 질문을 통해 단어의 의미, 이어질 내용이나 사건의 전후를 예측하기, 질문을 통해 글을 이해한 정도를 점검하거나 읽기 과정에서 겪는 어려움을 점검하기 등을 학습한다.","n":[],"p":28,"b":2},{"c":"[4국02-04]","k":"공통","sk":"","s":"국어(청각장애)","g":"초등학교 3~4학년","d":"읽기","t":"글에 나타난 사실과 의견을 구분하고 필자와 자신의 의견을 비교한다.","m":"이 성취기준은 글에 나타난 사실과 의견을 구별하고 글쓴이와 자신의 의견을 비교하면서 글쓴이의 의견을 일방적으로 수용하지 않고 글을 비판적으로 읽는 능력을 기르기위해 설정하였다. 글을 읽고 글쓴이의 의견과 객관적 사실을 구별하기, 글쓴이의 의견과 자신의 의견을 비교하기, 글쓴이의 의견에 대한 타당성을 평가하기, 동일한 주제나 상황에 대한 서로 다른 의견 비교하기 등을 학습한다.","n":[],"p":28,"b":2},{"c":"[4국02-05]","k":"공통","sk":"","s":"국어(청각장애)","g":"초등학교 3~4학년","d":"읽기","t":"글이나 자료의 출처가 믿을 만한지 판단한다.","m":"이 성취기준은 도서관이나 인터넷 등을 통해 글이나 자료를 찾아 읽을 때 출처의 신뢰성을 평가하며 읽고 믿을 만한 글이나 자료를 선별하는 능력을 기르기 위해 설정하였다. 글이나 자료의 출처 확인 방법이나 필요성 이해하기, 다양한 매체를 활용하여 글이나 자료 탐색하기, 글이나 자료의 정보 출처 파악하기, 정보 출처의 유형이나 정보의 최신성, 권위나 공신력 등을 고려한 신뢰성 평가하기, 여러 정보를 비교하며 내용의 신뢰성 평가하기 등을 학습한다.","n":[],"p":28,"b":2},{"c":"[4국02-06]","k":"공통","sk":"","s":"국어(청각장애)","g":"초등학교 3~4학년","d":"읽기","t":"바람직한 읽기 습관을 형성하고 읽기에 대한 자신감을 기른다.","m":"","n":[],"p":28,"b":2},{"c":"[4국02-07]","k":"공통","sk":"","s":"국어(청각장애)","g":"초등학교 3~4학년","d":"읽기","t":"글 또는 수어 영상 자료를 보고 주요한 내용을 파악하여 말⋅수어로 표현한다.","m":"이 성취기준은 글을 제시할 때 글의 내용을 그림, 영상, 수어 등 다양한 시각적 자료로도 제공해 주어 청각장애 학생이 글의 내용을 제대로 이해하도록 지원하기 위하여 설정하였다.","n":[],"p":28,"b":2},{"c":"[4국03-01]","k":"공통","sk":"","s":"국어(청각장애)","g":"초등학교 3~4학년","d":"쓰기","t":"중심 문장과 뒷받침 문장을 갖추어 문단을 쓰고, 문장과 문단을 중심으로 고쳐 쓴다.","m":"이 성취기준은 문단을 짜임새 있게 쓰는 능력을 길러 글을 쓰는 과정에서 이를 적용할 수 있도록 하기 위해 설정하였다. 문단의 개념, 문단의 기능과 역할, 중심 문장과 뒷받침 문장의 관계, 중심 문장과 뒷받침 문장을 쓰는 방법, 중심 문장과 뒷받침 문장을 갖추어 문단을 쓰는 방법, 문장과 문단을 중심으로 글을 고쳐 쓰는 방법 등을 학습한다.","n":[],"p":31,"b":2},{"c":"[4국03-02]","k":"공통","sk":"","s":"국어(청각장애)","g":"초등학교 3~4학년","d":"쓰기","t":"절차와 결과가 드러나게 정확한 표현으로 보고하는 글을 쓴다.","m":"이 성취기준은 교과 학습의 기초가 되는 보고하는 글을 쓰는 능력을 기르기 위해 설정하였다. 보고하는 글의 개념, 보고하는 글에 들어가야 할 내용 요소, 절차와 결과가 드러나게 글의 내용을 조직하는 방법, 절차와 결과를 정확하게 표현해야 하는 이유, 정확한 표현으로 보고하는 글 쓰기 등을 학습한다.","n":[],"p":31,"b":2},{"c":"[4국03-03]","k":"공통","sk":"","s":"국어(청각장애)","g":"초등학교 3~4학년","d":"쓰기","t":"대상에 대한 자신의 의견과 그렇게 생각한 이유가 드러나게 글을 쓴다.","m":"이 성취기준은 어떤 대상이나 사실, 문제에 대해 의견을 구체적이고 명료하게 글로 쓰는 능력을 기르기 위해 설정하였다. 의견의 개념, 의견을 제시하는 것이 필요한 이유와 상황, 주제를 고려하여 자신의 의견을 제시하는 방법, 의견에 대한 이유를 드는 방법 등을 학습한다.","n":[],"p":31,"b":2},{"c":"[4국03-04]","k":"공통","sk":"","s":"국어(청각장애)","g":"초등학교 3~4학년","d":"쓰기","t":"목적과 주제를 고려하여 독자에게 마음을 전하는 글을 쓴다.","m":"","n":[],"p":31,"b":2},{"c":"[4국03-05]","k":"공통","sk":"","s":"국어(청각장애)","g":"초등학교 3~4학년","d":"쓰기","t":"자신의 쓰기 과정을 점검하며 쓰기에 자신감을 갖는다.","m":"","n":[],"p":31,"b":2},{"c":"[4국03-06]","k":"공통","sk":"","s":"국어(청각장애)","g":"초등학교 3~4학년","d":"쓰기","t":"자막이나 수어를 포함하는 시각적 영상 자료를 보고 마음을 표현하는 글을 쓴다.","m":"읽은 글에 대해 자신의 마음을 표현하는 글을 쓰려면 글 내용에 대한 정확한파악이 선행되어야 한다. 청각장애 학생의 경우 눈으로 글을 읽는 것만으로는 글의 정확한 내용과 상황, 분위기, 인물의 감정 등을 파악하기가 어려우므로 글 내용을 정확히 파악하기 위해서는 별도의 지원이 필요하다. 이 성취기준은 자막을 동반한 영상, 수어 영상 등으로 제시되는 시각적 영상 자료를 보고 글의 내용을 올바르게 파악한 후 글 내용에 대한 자신의 생각이나 느낌을 문장으로 표현해 보도록 돕기 위해 설정하였다. 교사는 청각장애 학생에게 적절한 어휘를 선택하도록 한 후 문장으로 완성해보도록 기초 문장표현의 기회를 풍부하게 제공한다.","n":[],"p":31,"b":2},{"c":"[4국03-07]","k":"공통","sk":"","s":"국어(청각장애)","g":"초등학교 3~4학년","d":"쓰기","t":"작문 활동 시 이어 주는 말을 적절하게 사용하여 문장을 쓰려는 태도를 함양한다.","m":"이 성취기준은 청각장애 학생이 작문 활동 시 문장 쓰기에서 이어 주는 말의기능을 이해하고 상황에 맞게 사용하도록 유도하기 위해 설정하였다. 이어 주는 말의 필요성과 효과성을 이해하게 하고 자주 사용하는 이어 주는 말을 중심으로 학습할 수 있도록 지도한다.","n":[],"p":31,"b":2},{"c":"[4국04-01]","k":"공통","sk":"","s":"국어(청각장애)","g":"초등학교 3~4학년","d":"문법","t":"단어와 단어 간의 의미 관계를 파악한다.","m":"","n":[],"p":33,"b":2},{"c":"[4국04-02]","k":"공통","sk":"","s":"국어(청각장애)","g":"초등학교 3~4학년","d":"문법","t":"단어를 분류하고 국어사전을 활용하여 능동적인 국어 활동을 한다.","m":"이 성취기준은 단어에 대한 기본적인 이해를 바탕으로 국어사전에서 단어를 찾고 국어사전에 수록된 정보를 활용하여 능동적인 국어생활을 할 수 있는 능력을 기르기 위해 설정하였다. 명사, 동사, 형용사에 대한 기본적인 이해를 바탕으로 하되, 상황에 따라 다양하게 해석되는 단어의 의미를 국어사전에서 찾을 수 있도록 동형이의어와 다의어가 국어사전에 수록된 방식을 이해하고, 동사와 형용사의 기본형과 활용형을 구분할 수 있도록 한다. 또한 국어사전을 통해 단어의 표기, 발음, 품사, 의미, 용례 등 다양한 정보를 확인할 수 있음을 이해하고, 단어의 정확한 발음과 표기를 국어사전에서 찾아 어법에 맞는 국어생활을 할 수 있도록 한다.","n":[],"p":33,"b":2},{"c":"[4국04-03]","k":"공통","sk":"","s":"국어(청각장애)","g":"초등학교 3~4학년","d":"문법","t":"기본적인 문장의 짜임을 이해하고 적절하게 사용한다.","m":"","n":[],"p":33,"b":2},{"c":"[4국04-04]","k":"공통","sk":"","s":"국어(청각장애)","g":"초등학교 3~4학년","d":"문법","t":"글과 담화에 쓰인 높임 표현과 지시⋅접속 표현을 이해하고 상황에 맞게 표현한다.","m":"이 성취기준은 높임 표현과 지시⋅접속 표현이 상황 맥락에 맞는 언어 표현을 선택하거나 글이나 담화를 유기적으로 구성하는 데 필요한 지식임을 이해하고, 글이나 담화에서 높임 표현과 지시⋅접속 표현을 적절히 사용할 수 있는 능력을 기르기 위해 설정하였다. 높임 표현의 기능과 적절한 사용 방식, 앞에 나온 말을 가리키는 지시 표현 및 문장과 문장 등을 연결하는 다양한 접속 표현의 기능과 이러한 표현들의 적절한 사용 방식을 학습한다.","n":[],"p":33,"b":2},{"c":"[4국04-05]","k":"공통","sk":"","s":"국어(청각장애)","g":"초등학교 3~4학년","d":"문법","t":"언어가 의사소통과 관계 형성의 수단임을 이해하고 국어 및 수어를 소중히 여기는 태도를지닌다.","m":"이 성취기준은 말, 글, 수어 등의 언어가 상대방과 소통 및 관계 형성에 필요한 도구임을 이해하고, 우리 말과 글, 수어를 소중히 여기는 태도를 지니게 하기 위해 설정하였다. 언어가 없을 때 불편한 상황을 통해 언어의 필요성을 느끼게 하고, 우리 글이 없어서 오랜 시간 소통에 어려움을 겪었던 과정을 이해하게 함으로써 우리 글의 소중함을 느끼게 한다. 또한 우리 말, 글, 수어를 아껴야 하는 까닭을 생활 속에서 이해하고 실천할 수 있게 지도한다.","n":[],"p":33,"b":2},{"c":"[4국05-01]","k":"공통","sk":"","s":"국어(청각장애)","g":"초등학교 3~4학년","d":"문학","t":"인물과 이야기의 흐름을 중심으로 작품을 감상한다.","m":"이 성취기준은 문학 작품 속 인물의 특성과 서사의 기본 구조를 파악하며 작품을이해하는 능력을 기르기 하기 위해 설정하였다. 이야기를 읽을 때 인물의 성격과 역할을 파악하고, 이를 고려하여 시간적 순서나 인과관계를 생각하며 이야기의 흐름을 파악하는 활동에 중점을 둔다. 나아가 작품 속 다양한 인물의 특성을 고려하면서 이어질 이야기를 상상하여 표현해 봄으로써 작품을 능동적으로 이해하고 감상하게 한다.","n":[],"p":35,"b":2},{"c":"[4국05-02]","k":"공통","sk":"","s":"국어(청각장애)","g":"초등학교 3~4학년","d":"문학","t":"자신의 경험을 바탕으로 작품 속 세계와 현실 세계를 비교하여 작품을 감상한다.","m":"이 성취기준은 작품 속의 세계가 현실 세계를 반영한 것이지만, 허구적 세계로서현실 세계와 구별된다는 점을 인식하며 작품을 감상할 수 있게 하기 위해 설정하였다. 작품 속의 인물⋅정서⋅상황⋅배경⋅분위기⋅사건 등을 이해할 때 학습자 자신의 경험을 바탕으로 경험과 상상, 사실과 허구를 비교하며 생각하게 하고, 허구적으로 표현한 부분에 대한 의견을 나누며 작품을 감상하도록 한다.","n":[],"p":35,"b":2},{"c":"[4국05-03]","k":"공통","sk":"","s":"국어(청각장애)","g":"초등학교 3~4학년","d":"문학","t":"작품을 듣거나 읽고 마음에 드는 작품을 소개한다.","m":"","n":[],"p":35,"b":2},{"c":"[4국05-04]","k":"공통","sk":"","s":"국어(청각장애)","g":"초등학교 3~4학년","d":"문학","t":"감각적 표현에 유의하여 작품을 감상하고, 감각적 표현을 활용하여 자신의 생각이나 감정을 표현한다.","m":"이 성취기준은 문학 표현 방식의 효과와 기능을 이해하며 작품을 감상하고, 자신의 생각이나 느낌을 다양한 방법으로 나타내어 다른 이들과 나누게 하기 위해 설정하였다. 학습자로 하여금 감각적 표현을 통해 작품 속에 형상화된 대상을 생동감 있게 체험하면서 문학의 즐거움을 느끼게 하는 데 중점을 둔다. 또한 자신의 생각과 감정을 효과적으로 전달할 수 있는 감각적 표현을 활용하여 말을 하거나 글을 써 보고 감각적 표현을 사용하였을 때와 그렇지 않을 때의 차이를 비교하게 한다.","n":[],"p":35,"b":2},{"c":"[4국05-05]","k":"공통","sk":"","s":"국어(청각장애)","g":"초등학교 3~4학년","d":"문학","t":"재미나 감동을 느끼며 작품을 즐겨 감상하는 태도를 지닌다.","m":"","n":[],"p":35,"b":2},{"c":"[4국05-06]","k":"공통","sk":"","s":"국어(청각장애)","g":"초등학교 3~4학년","d":"문학","t":"작품의 이야기 흐름을 말⋅글⋅수어 등의 적절한 의사소통 양식으로 표현한다.","m":"이 성취기준은 청각장애 학생에게 문학 작품을 표현할 때, 선호하는 의사소통 방식으로 사건별 흐름에 따라 인물의 행동과 배경의 변화 등을 비교하여 표현하도록 설정하였다. 청각장애 학생이 문학 작품을 이해하도록 자막이 삽입된 극이나 수어 영상 도서를 제공함으로 문학 작품에 관심을 기울이도록 하고, 다양한 의사소통의 표현 방법에 대해 상호 존중하는 태도를 지니도록 함으로 청각장애 학생이 적극적으로 표현하는 태도를 지니게 한다. 또한 전체 작품의 줄거리를 이해하여 주제를 파악하는 데 사건의 흐름 별로 배경과 인물의 행동 변화를 찾아 표현하도록 함으로써, 작품의 전체 내용과 주제를 찾을 수 있도록 한다.","n":[],"p":35,"b":2},{"c":"[4국06-01]","k":"공통","sk":"","s":"국어(청각장애)","g":"초등학교 3~4학년","d":"매체","t":"인터넷에서 학습에 필요한 다양한 자료를 탐색하고 목적에 맞게 자료를 선택한다.","m":"이 성취기준은 다양한 교과 학습 맥락에서 인터넷에 접속하여 다양한 자료에 효과적으로 접근하고 유용한 정보를 선택하여 목적에 맞게 활용할 때 필요한 기초 능력을 기르기 위해 설정하였다. 교사의 안내에 따라 디지털 매체를 통해 지정된 인터넷 공간에 접속하기, 다양한 자료 훑어보기, 자료의 내용 파악하기, 유용한 자료 선택하기 등을 수행하고, 이를 통해 인터넷 접속 방법, 비선형적 자료의 탐색 방법, 목적에 맞는 정보 선택 방법 등을 체계적으로 학습한다.","n":[],"p":37,"b":2},{"c":"[4국06-02]","k":"공통","sk":"","s":"국어(청각장애)","g":"초등학교 3~4학년","d":"매체","t":"매체를 활용하여 간단한 발표 자료를 만든다.","m":"","n":[],"p":37,"b":2},{"c":"[4국06-03]","k":"공통","sk":"","s":"국어(청각장애)","g":"초등학교 3~4학년","d":"매체","t":"매체 소통 윤리를 고려하여 매체 자료를 활용하고 공유한다.","m":"이 성취기준은 매체 기반의 소통에서 지켜야 할 기본적인 윤리를 이해하고 이를 고려하며 매체 자료를 활용하거나 공유할 수 있는 능력을 기르기 위해 설정하였다. 다양한 매체 자료를 활용하거나 공유하는 과정에서 저작권과 초상권 침해, 개인 정보 유출 등의 문제가 발생할 수 있음을 이해한다. 다양한 사례를 통해 매체 이용자로서 소통 윤리를 지키려는 태도를 기르고, 매체 자료를 안전하고 올바르게 활용하고 공유할 수 있는 방법 등을 학습한다.","n":[],"p":37,"b":2},{"c":"[4국06-04]","k":"공통","sk":"","s":"국어(청각장애)","g":"초등학교 3~4학년","d":"매체","t":"인터넷 수어 사전을 활용하여 다양한 어휘를 탐색하고 익힌다.","m":"이 성취기준은 다양한 학습 맥락 속에서 인터넷에 접속하여 여러 가지 수어 어휘를 익히는 능력을 기르기 위해 설정하였다. 다양한 교과 학습 과정에서 학습 내용을 이해하는 데 어휘가 중요하게 작용하므로 인터넷 수어 사전을 활용하여 스스로 어휘를 찾고 익히는 능력을 기르는 것이 필요하다. 인터넷 수어 사전을 활용하는 방법, 학습한 수어 어휘를 익히고, 활용하는 방법 등을 체계적으로 학습한다.","n":[],"p":37,"b":2},{"c":"[6국01-01]","k":"공통","sk":"","s":"국어(청각장애)","g":"초등학교 5~6학년","d":"듣기⋅말하기","t":"대화에서 생략된 내용을 추론하며 듣는다.","m":"","n":[],"p":38,"b":2},{"c":"[6국01-02]","k":"공통","sk":"","s":"국어(청각장애)","g":"초등학교 5~6학년","d":"듣기⋅말하기","t":"주장을 파악하고 이유나 근거가 타당한지 평가하며 듣는다.","m":"","n":[],"p":38,"b":2},{"c":"[6국01-03]","k":"공통","sk":"","s":"국어(청각장애)","g":"초등학교 5~6학년","d":"듣기⋅말하기","t":"주제와 관련하여 궁금한 내용을 질문하며 적극적으로 듣고 말한다.","m":"이 성취기준은 교과 학습 상황을 비롯한 다양한 상황에서 주제와 관련하여 적극적으로 질문하며 구어 의사소통에 참여하는 능력을 기르기 위해 설정하였다. 들은 내용을 확인하거나 명료하게 이해하기 위한 질문, 생략된 내용을 추론하기 위한 질문, 상대의 의도를 파악하기 위한 질문, 다른 사람의 생각과 자신의 생각을 연결하기 위한 질문, 자료에서 제시되지 않은 대안이나 더 많은 정보를 찾기 위한 질문 등 다양한 목적으로 질문 생성하기, 분명한 표현으로 질문하기, 예절을 지켜 질문하기 등을 학습한다.","n":[],"p":38,"b":2},{"c":"[6국01-04]","k":"공통","sk":"","s":"국어(청각장애)","g":"초등학교 5~6학년","d":"듣기⋅말하기","t":"면담의 절차를 이해하고 상대와 매체를 고려하여 면담한다.","m":"이 성취기준은 일련의 절차에 따라 면담을 경험해 봄으로써 정보 수집 등의 목적을 가진 구어 의사소통을 효과적이고 체계적으로 수행하는 능력을 기르기 위해 설정하였다. 면담 준비⋅진행⋅결과 정리 등 면담의 절차 이해하기, 면담의 목적⋅대상⋅주제 등 설정하기, 사전 정보 수집하기, 면담 대상 섭외하기, 목적⋅대상⋅주제에 알맞은 질문 준비하기, 녹음기나 기록용 노트 등 면담에 필요한 매체 준비하기, 준비한 질문을 바탕으로 면담하기, 면담 결과를 발표하거나 글로 써서 보고하기 등을 학습한다. 면담 상대를 배려하여 사전에 약속 시간 정하기, 녹음 여부에 대해 동의 구하기, 민감하거나 불편한 질문은 아닌지 점검하기, 종료 후 감사 표현하기 등 면담 과정에서 지켜야 할 예절도 학습한다.","n":[],"p":38,"b":2},{"c":"[6국01-05]","k":"공통","sk":"","s":"국어(청각장애)","g":"초등학교 5~6학년","d":"듣기⋅말하기","t":"자료를 선별하여 핵심 정보를 중심으로 내용을 구성하고 매체를 활용하여 발표한다.","m":"","n":[],"p":38,"b":2},{"c":"[6국01-06]","k":"공통","sk":"","s":"국어(청각장애)","g":"초등학교 5~6학년","d":"듣기⋅말하기","t":"토의에 협력적으로 참여하며 서로의 의견을 비교하고 조정한다.","m":"","n":[],"p":38,"b":2},{"c":"[6국01-07]","k":"공통","sk":"","s":"국어(청각장애)","g":"초등학교 5~6학년","d":"듣기⋅말하기","t":"절차와 규칙을 지키고 타당한 이유와 근거를 제시하며 토론한다.","m":"이 성취기준은 민주적 의사소통 능력으로서 토론 능력을 기르기 위해 설정하였다. 찬성 또는 반대의 입장에서 주장하는 바에 대한 이유 마련하기, 이유를 뒷받침할 수 있는 객관적인 사실 또는 정보를 활용하여 근거 마련하기, 주장이 가치 있고 실천 가능한지 검토하기, 이유가 주장과 관련이 있는지 검토하기, 이유가 상대에게 받아들여질 수 있는지 검토하기, 근거가 이유와 관련이 있는지 검토하기, 근거로 제시한 자료의 출처가 명확하고 믿을 만한지 검토하기, 상대의 의견을 존중하며 토론하기, 절차와 규칙에 따라 합리적으로 소통하려는 태도 형성하기 등을 학습한다.","n":[],"p":38,"b":2},{"c":"[6국01-08]","k":"공통","sk":"","s":"국어(청각장애)","g":"초등학교 5~6학년","d":"듣기⋅말하기","t":"대화, 토의, 토론, 의견 발표 등의 상황에서 말과 수어를 함께 사용하여 표현하려는 태도를기른다.","m":"이 성취기준은 청각장애 학생이 주 의사소통 양식이 상이한 상대방을 존중하고 배려하여 대화, 토의, 토론, 의견 발표 등의 상황에서 말과 수어를 함께 사용하여 표현하는 능력과 태도를 함양하기 위해 설정하였다. 여러 사람을 상대로 하는 대화, 토의, 토론, 의견 발표의 과정에서 말과 수어를 동시에 사용하여 소통하며 대상과 맥락을 고려하여 공손한 표현을 사용하도록 지도한다. 더불어 자신의 의견, 제안, 주장 등을 전달할 때 다른 사람의 말⋅수어를 잘 듣고⋅보고 상대방의 발표가 끝난 후 청자들을 향해 자신의 의견을 말⋅수어로 함께 표현하여 전달해 보도록 지도한다.","n":[],"p":38,"b":2},{"c":"[6국02-01]","k":"공통","sk":"","s":"국어(청각장애)","g":"초등학교 5~6학년","d":"읽기","t":"글의 구조를 고려하며 주장이나 주제를 파악하고 글 내용을 요약한다.","m":"이 성취기준은 글의 구조를 고려하며 글의 중심 내용을 파악하고 자신의 언어로요약하는 능력을 기르기 위해 설정하였다. 요약하기의 일반 원리를 이해하기, 글의 구조를 시각화한 도해 조직자를 활용하여 글의 구조와 내용 파악하기, 주제나 주장을 파악하기, 글의 중심 내용을 자신의 언어로 재구성하여 요약하기 등을 학습한다.","n":[],"p":41,"b":2},{"c":"[6국02-02]","k":"공통","sk":"","s":"국어(청각장애)","g":"초등학교 5~6학년","d":"읽기","t":"글에서 생략된 내용이나 함축된 표현을 문맥을 고려하여 추론한다.","m":"이 성취기준은 글의 문맥을 고려하여 글에 표면적으로 드러나지 않은 내용을 추론하며 읽는 능력을 기르기 위해 설정하였다. 중요 단어나 문장, 문단 등의 수준에서 의미추측하기, 글의 전체적인 흐름을 고려할 때 글에서 빠진 세부 내용이나 이어질 내용 추측하기, 학습자의 배경지식을 이용하여 함축된 표현이 암시하거나 내포하는 의미 추측하기 등을 학습한다.","n":[],"p":41,"b":2},{"c":"[6국02-03]","k":"공통","sk":"","s":"국어(청각장애)","g":"초등학교 5~6학년","d":"읽기","t":"글이나 자료를 읽고 내용의 타당성과 표현의 적절성을 평가한다.","m":"","n":[],"p":41,"b":2},{"c":"[6국02-04]","k":"공통","sk":"","s":"국어(청각장애)","g":"초등학교 5~6학년","d":"읽기","t":"문제 상황과 관련된 다양한 관점의 글을 읽고 이를 문제 해결에 활용한다.","m":"이 성취기준은 학습자가 직면한 문제를 해결하기 위해 다양한 관점의 글을 찾아 읽고 문제 해결에 필요한 지식이나 정보를 구성하는 창의적 읽기 능력을 기르기 위해 설정하였다. 문제 상황과 관련한 읽기 목적 명료화하기, 문제 상황 해결에 도움을 줄 수 있는 다양한 관점의 글 선정하기, 다양한 관점의 글을 읽고 내용의 타당성과 유용성 평가하기, 문제 해결을 위한 자신만의 창의적인 해결 방안 마련하기 등을 학습한다.","n":[],"p":41,"b":2},{"c":"[6국02-05]","k":"공통","sk":"","s":"국어(청각장애)","g":"초등학교 5~6학년","d":"읽기","t":"긍정적인 읽기 동기를 형성하고 적극적으로 읽기에 참여하는 태도를 기른다.","m":"","n":[],"p":41,"b":2},{"c":"[6국02-06]","k":"공통","sk":"","s":"국어(청각장애)","g":"초등학교 5~6학년","d":"읽기","t":"글의 내용과 어울리는 다양한 시각적 영상 자료를 스스로 찾아 활용하며 글의 내용을 파악한다.","m":"이 성취기준은 글의 내용 파악이 어렵고 글에 대한 배경지식이 부족한 청각장애 학생들에게 자기주도적인 매체 자료 활용 전략으로 글에 대한 접근성을 높이고 글의 내용 이해를 돕고자 설정하였다. 글에 등장하는 인물이나 사건, 글의 주제에 관련된 이미지, 영상, 각종 사전 자료들을 스스로 검색하여 찾아보게 하면, 글 읽기에 대한 흥미도를 높이는 동시에 학생 스스로 글의 내용을 파악하는 역량을 강화할 수 있다.","n":[],"p":41,"b":2},{"c":"[6국03-01]","k":"공통","sk":"","s":"국어(청각장애)","g":"초등학교 5~6학년","d":"쓰기","t":"알맞은 내용을 선정하여 대상의 특성이 나타나게 설명하는 글을 쓴다.","m":"이 성취기준은 설명하는 글을 쓰는 데에 필요한 능력을 기르기 위해 설정하였다.설명하고자 하는 대상의 특성을 드러낼 수 있는 내용을 선정하는 방법, 개념 정의, 부연 상술, 예시, 열거, 인용, 비교와 대조 등을 활용하여 독자가 대상의 특성을 이해하기 쉽게 내용을 구성하고 표현하는 방법, 설명 대상과 설명 방법의 관련성 등을 학습한다. 설명 대상은 인문, 사회, 과학, 예술, 체육 등 교과 내용에서 선정한다.","n":[],"p":43,"b":2},{"c":"[6국03-02]","k":"공통","sk":"","s":"국어(청각장애)","g":"초등학교 5~6학년","d":"쓰기","t":"적절한 근거를 사용하고 인용의 출처를 밝히며 주장하는 글을 쓴다.","m":"이 성취기준은 주장하는 글을 쓰는 데에 필요한 능력과 쓰기 윤리를 준수하며 글을 쓰는 태도를 기르기 위해 설정하였다. 주장하는 글 쓰기의 중요성과 특성, 주장과 이유 및 근거의 개념과 관계, 주장하는 글에 적절한 근거가 필요한 까닭, 역사적 사실, 실험 및 조사 결과, 통계 수치, 전문가의 견해 등을 활용하여 근거 생성하기, 이유와 근거를 활용하여 주장하는 글 쓰기, 인용의 출처를 밝혀야 하는 이유와 기본적인 인용 방법 등을 학습한다.","n":[],"p":43,"b":2},{"c":"[6국03-03]","k":"공통","sk":"","s":"국어(청각장애)","g":"초등학교 5~6학년","d":"쓰기","t":"체험한 일에 대한 감상을 나타내는 글을 쓴다.","m":"","n":[],"p":43,"b":2},{"c":"[6국03-04]","k":"공통","sk":"","s":"국어(청각장애)","g":"초등학교 5~6학년","d":"쓰기","t":"독자와 매체를 고려하여 내용을 생성하고 표현하며 글을 쓴다.","m":"이 성취기준은 글을 쓰는 과정에서 쓰기 목적, 독자와 매체 등과 같은 상황 맥락을 고려하여 내용을 생성하고 표현하는 능력을 기르기 위해 설정하였다. 예상 독자의 개념 이해하기, 독자 고려의 필요성 인식하기, 온라인 대화, 인터넷 게시판 댓글, 전자 우편, 블로그, 휴대전화 문자 메시지 등 다양한 매체의 특성 이해하기, 글의 목적이나 주제에 따라 알맞은 매체와 예상 독자 선정하기, 독자와 매체의 특성을 고려하여 계획 및 내용 생성하기, 독자와 매체의 특성을 고려하여 표현하기 등을 학습한다.","n":[],"p":43,"b":2},{"c":"[6국03-05]","k":"공통","sk":"","s":"국어(청각장애)","g":"초등학교 5~6학년","d":"쓰기","t":"쓰기 과정을 점검⋅조정하며 글을 쓰고, 글 전체를 대상으로 통일성 있게 고쳐 쓴다.","m":"이 성취기준은 필자가 자신의 쓰기 과정을 점검⋅조정하고 그 결과를 바탕으로글을 고쳐 쓰는 능력을 기르기 위해 설정하였다. 글쓰기에서 통일성의 개념과 중요성, 쓰기 과정에 대한 점검과 조정의 필요성, 쓰기 과정의 회귀적 특성, 글에 대한 독자의 반응을 생각하며 고쳐쓰기, 글의 주제와 목적, 예상 독자 등을 고려하여 글의 통일성 점검하기 등을 학습한다.","n":[],"p":43,"b":2},{"c":"[6국03-06]","k":"공통","sk":"","s":"국어(청각장애)","g":"초등학교 5~6학년","d":"쓰기","t":"쓰기에 적극적으로 참여하며 자신의 글을 독자와 공유하는 태도를 지닌다.","m":"","n":[],"p":43,"b":2},{"c":"[6국03-07]","k":"공통","sk":"","s":"국어(청각장애)","g":"초등학교 5~6학년","d":"쓰기","t":"청각장애 학생 특성에 따라 개별화하여 제공된 시각적 영상 자료를 보고 주어진 글의 특성과 내용을 파악하여 글로 표현한다.","m":"이 성취기준은 청각장애 학생이 정보 전달을 목적으로 하는 글, 설득을 목적으로 하는 글, 학습자 자신의 체험을 바탕으로 하는 글 등 다양한 종류의 글을 접하는 상황에서 개별화된 시각적 영상 자료를 지원하여 각 글의 특성과 내용을 정확하게 파악할 수 있도록 돕고, 이해한 내용을 학생 스스로 문장으로 써 보는 활동을 촉진하고자 설정하였다.","n":[],"p":43,"b":2},{"c":"[6국04-01]","k":"공통","sk":"","s":"국어(청각장애)","g":"초등학교 5~6학년","d":"문법","t":"음성 언어 및 문자 언어의 특성을 이해하고 다양한 매체 자료에서 표현 효과를 평가한다.","m":"이 성취기준은 생각을 표현하는 언어 양식으로서 음성 언어와 문자 언어의특성을 이해하고, 매체 자료에서 생성된 음성 언어 및 문자 언어의 표현 효과를 평가하는 능력을 기르기 위해 설정하였다. 음성 언어 및 문자 언어의 특성을 비교하되, 복합양식적 특성을 지니는 다양한 매체 자료에 사용된 언어 양식의 표현 효과를 학습하고, 표현하고자 하는 목적이나 핵심 주제가 같더라도 언어 양식이 다르면 전달되는 내용과 표현 효과가 다를 수 있음을 분석적, 비판적 시각으로 이해하고 평가할 수 있도록 한다.","n":[],"p":46,"b":2},{"c":"[6국04-02]","k":"공통","sk":"","s":"국어(청각장애)","g":"초등학교 5~6학년","d":"문법","t":"표준어와 방언의 기능을 파악하고 언어 공동체와 국어생활과의 관계를 이해한다.","m":"이 성취기준은 국어 화자의 의사소통에서 표준어와 방언이 담당하는 기능이 다르다는 점을 알고, 자신이 속한 언어 공동체 특유의 한국어 변이형들로 인해 자신의 국어생활이 상황에 따라 다양하게 실현됨을 이해하도록 하기 위해 설정하였다. 방언의 형성과 존재 양상을 파악함으로써 지역적 요인에 따라 자연스럽게 한국어에 변이가 일어남을 이해하도록 하고, 이러한 다양성을 아우르는 언어 공동체 규준인 표준어의 개념과 필요성을 함께 다루도록 한다. 또한 의사소통의 공적⋅사적 상황에 따라, 상대방과의 거리감 조절 등 화자의 의도에 따라 표준어와 방언을 선택함으로써 다양한 의사소통 기능이 실현된다는 점을 확인할 수 있도록 한다.","n":[],"p":46,"b":2},{"c":"[6국04-03]","k":"공통","sk":"","s":"국어(청각장애)","g":"초등학교 5~6학년","d":"문법","t":"고유어와 관용 표현의 쓰임과 가치를 이해하고 상황에 맞게 표현한다.","m":"이 성취기준은 고유어와 관용 표현의 쓰임과 가치를 이해하고 국어문화에 대한 관심과 우리말을 소중히 여기는 태도를 고양하기 위해 설정하였다. 한자어, 외래어와 함께 국어 어휘의 일부를 이루는 고유어의 특성과 가치, 고유어에 다양하게 발달해 있는 관용 표현의 특성과 쓰임에 대한 이해에 중점을 두되, 상황과 표현 의도에 따라 어휘를 적절하게 사용하고 외래어의 오･남용 방지 등 국어 순화의 필요성을 자각하며 실천할 수 있도록 한다.","n":[],"p":46,"b":2},{"c":"[6국04-04]","k":"공통","sk":"","s":"국어(청각장애)","g":"초등학교 5~6학년","d":"문법","t":"문장 성분을 이해하고 호응 관계가 올바른 문장을 구성한다.","m":"이 성취기준은 문장을 구성하는 성분들 사이의 호응 관계가 올바르고 자연스러운 문장을 구성하는 데 필요한 능력을 기르기 위해 설정하였다. 문장에서 주어, 목적어, 서술어의 역할, 성분 간의 호응 관계(주어와 서술어의 호응, 목적어와 서술어의 호응)에 대해 학습하고, 이전 학년군의 높임 표현 및 동일 학년군의 시간 표현 성취기준과 연계하여 높임이나 시제의 일치를 함께 학습할 수 있다.","n":[],"p":46,"b":2},{"c":"[6국04-05]","k":"공통","sk":"","s":"국어(청각장애)","g":"초등학교 5~6학년","d":"문법","t":"글과 담화에 쓰인 시간 표현을 이해하고 상황에 맞게 표현한다.","m":"이 성취기준은 효과적인 의사소통을 위해 상황 맥락에 맞게 시간 표현을 사용하는 것의 중요성을 알고 시간을 표현할 때 사용되는 언어 형식을 이해하고 활용하는 능력을 기르기 위해 설정하였다. ‘-았-/-었-, -는-/-ㄴ-, -겠-, -(으)ㄹ 것이-’나 시간 부사 등 글이나 담화에서 과거, 현재, 미래를 표현하는 언어 형식 및 방법을 학습하고, 다양한 상황 맥락에서 시간 표현을 사용한 후 그 적절성을 평가해 보도록 한다.","n":[],"p":46,"b":2},{"c":"[6국04-06]","k":"공통","sk":"","s":"국어(청각장애)","g":"초등학교 5~6학년","d":"문법","t":"글과 담화에 쓰인 단어 및 문장, 띄어쓰기를 민감하게 살펴 바르게 고치는 태도를 지닌다.","m":"","n":[],"p":46,"b":2},{"c":"[6국04-07]","k":"공통","sk":"","s":"국어(청각장애)","g":"초등학교 5~6학년","d":"문법","t":"바른 수어 사용의 필요성을 알고, 수어를 정확하게 사용한다.","m":"이 성취기준은 수어를 바르고 정확하게 사용하는 태도를 기르기 위해 설정하였다. 수어를 바르고 정확하게 사용하는 것은 맥락을 고려하여 적절한 상황에서 사용하고, 정확한 수어 표현을 사용하여 상대방이 쉽고 빠르게 이해할 수 있게 하는 것을 의미한다. 바른 수어 사용의 필요성, 정확한 수어 사용이 이루어지지 않을 때 발생할 수 있는 문제 등을 체험할 수 있게 함으로써 수어를 바르고 정확하게 사용하는 태도를 기른다.","n":[],"p":46,"b":2},{"c":"[6국05-01]","k":"공통","sk":"","s":"국어(청각장애)","g":"초등학교 5~6학년","d":"문학","t":"작가의 의도를 생각하며 작품을 읽는다.","m":"이 성취기준은 작품을 만든 이에 대해 호기심을 가지고 상상함으로써 문학 소통에 더욱 즐겁게 참여하고, 나아가 작가라는 존재를 고려하면서 작품을 수용하는 능력을 기르기 위해 설정하였다. 작가가 작품을 쓰게 된 계기나 상황을 생각하고, 작가의 취지와 의도를 헤아리면서 작품을 더 깊고 넓게 이해할 수 있게 한다. 또한 작가에 대한 관심을 바탕으로 작가의 다른 작품들도 찾아 읽는 태도를 가지며 능동적인 문학 향유자로 성장할 수 있게 한다. 아울러 다양한 상상의 세계를 펼쳐 보이는 창의성을 가진 인간에게 관심을 가짐으로써 학습자도 그러한 창의성을 가진 인간으로 성장하는 계기가 될 수 있게 한다. 다만 작품의 의미는 작가의 의도에 한정되는 것이 아니며, 다양한 독자들의 해석이 더해져서 계속 생성되어 가는 것이라는 점을 함께 생각하며 문학 소통에 적극적으로 참여할 수 있게 한다.","n":[],"p":48,"b":2},{"c":"[6국05-02]","k":"공통","sk":"","s":"국어(청각장애)","g":"초등학교 5~6학년","d":"문학","t":"비유적 표현의 효과에 유의하여 작품을 감상한다.","m":"","n":[],"p":48,"b":2},{"c":"[6국05-03]","k":"공통","sk":"","s":"국어(청각장애)","g":"초등학교 5~6학년","d":"문학","t":"소설이나 극을 읽고 인물, 사건, 배경을 파악한다.","m":"이 성취기준은 작품을 이루는 주요 요소를 중심으로 작품을 분석하고 이해하는 능력을 기르기 위해 설정하였다. 작품 속 인물, 사건, 배경을 파악하고, 각 요소의 기능 및 요소 간 관계를 이해하도록 한다. 예를 들어 인물의 성격과 사건의 전개 과정 간의 관계, 인물의 성격이 사건 전개 과정에 끼치는 영향, 사건의 전개 과정과 배경과의 관련, 배경의 변화에 따른 사건 전개 과정의 변화 등을 파악하여 작품을 깊이 있게 감상한다. 나아가 이러한 요소의 역할이나 관계가 모든 작품에서 동일한 양상으로 나타나는 것이 아니며, 작품에 따라 특정 요소가 두드러지게 부각되기도 하고 요소 간의 관계가 독특하게 형성되기도 한다는 점을 생각하며 작품을 수용하게 한다.","n":[],"p":48,"b":2},{"c":"[6국05-04]","k":"공통","sk":"","s":"국어(청각장애)","g":"초등학교 5~6학년","d":"문학","t":"인상적인 부분을 중심으로 작품에 대한 의견을 나눈다.","m":"이 성취기준은 학습자가 작품에 대한 자신의 생각을 적극적으로 표현하고, 이를 타인과 나눔으로써 보다 주체적인 문학 수용 능력을 기르기 위해 설정하였다. 이를 위해 인상적인 장면을 중심으로 작품에 대한 의견을 나누되, 인상적으로 생각하게 된 이유나 근거를 작품과 연결 지어 설명하도록 한다. 또한 상대방의 수용 경험에도 귀를 기울여 작품에 대한 해석이 다양한 관점에서 이루어질 수 있음을 알고 문학 소통에 즐겁게 참여하도록 한다.","n":[],"p":48,"b":2},{"c":"[6국05-05]","k":"공통","sk":"","s":"국어(청각장애)","g":"초등학교 5~6학년","d":"문학","t":"자신의 경험을 시, 소설, 극, 수필 등 적절한 갈래로 표현한다.","m":"","n":[],"p":48,"b":2},{"c":"[6국05-06]","k":"공통","sk":"","s":"국어(청각장애)","g":"초등학교 5~6학년","d":"문학","t":"작품을 읽고 자신의 삶과 연관 지어 성찰하는 태도를 지닌다.","m":"이 성취기준은 작품을 읽고 성찰하는 과정을 통해 자신을 돌아보는 것은 물론 자신이 속한 공동체의 삶에 대해서도 생각하게 하기 위해 설정하였다. 학습자가 작품을 적극적으로 수용하여 작품에 담긴 가치를 내면화하는 가운데 자신의 삶의 모습을 되돌아보게 한다. 또한 공동체의 다양한 문제를 다룬 작품을 읽을 때에도 먼저 자신의 삶을 돌아보고, 함께 살아가는 삶을 위해 공동체 구성원으로서 가져야 할 바람직한 자세나 태도에 대하여 생각해 보도록 한다.","n":[],"p":48,"b":2},{"c":"[6국05-07]","k":"공통","sk":"","s":"국어(청각장애)","g":"초등학교 5~6학년","d":"문학","t":"말⋅수어 비유 표현으로 동시, 이야기를 창작한다.","m":"이 성취기준은 문학의 생산 측면에서 시 또는 이야기를 스스로 작품을 구상하여 발표하기 위해 설정하였다. 시 또는 이야기 창작은 글로 표현하지 않고 자신이 평소 선호하는 의사소통 방법으로 표현함으로써 작가적 관점에서 창작의 즐거움을 경험할 수 있도록 한다. 나아가 책이나 영상 자료를 통해 경험했던 작품과 또래들의 작품과 비교해 보고 문학 창작에 관심을 기울이도록 한다.","n":[],"p":48,"b":2},{"c":"[6국06-01]","k":"공통","sk":"","s":"국어(청각장애)","g":"초등학교 5~6학년","d":"매체","t":"정보 검색 도구를 활용하여 자신의 목적에 맞는 매체 자료를 찾는다.","m":"이 성취기준은 정보 검색 도구의 특성을 이해하고 적절한 정보 검색 전략을 수립하여 자신의 목적에 맞는 매체 자료를 찾아 활용하는 능력을 향상하기 위해 설정하였다. 정보 유형별로 검색 결과를 제시하는 정보 검색 도구의 기능을 이해한다. 또한 핵심 단어 중심으로 검색이 되는 정보 검색 도구의 특징을 이해하여 자신의 목적에 적합한 검색어를 만들 수 있도록 한다. 인터넷의 특성을 고려하여 정보 검색 과정에서 지속적인 성찰과 점검을 통해 자신의 목적에 부합한 자료 검색 과정이 이루어질 수 있도록 한다.","n":[],"p":50,"b":2},{"c":"[6국06-02]","k":"공통","sk":"","s":"국어(청각장애)","g":"초등학교 5~6학년","d":"매체","t":"수어, 자막이 사용된 뉴스 및 각종 정보 매체 자료의 신뢰성을 평가한다.","m":"이 성취기준은 수어, 자막, 소리 등 다양한 언어 기호가 사용된 뉴스 및 각종 정보 매체의 매체 자료에 대해 신뢰성 측면을 중심으로 평가하는 능력을 기르기 위해 설정하였다. 뉴스 및 각종 정보 매체 자료는 개인과 공동체에 미치는 영향력이 크기 때문에 매체 자료를 수용할 때는 그것이 신뢰할 만한 것인지 평가하는 태도가 중요하다는 점을 이해하도록 한다. 매체 자료의 신뢰성은 생산자가 얼마나 해당 분야에 전문적이고 권위가 있는지, 실제 취재하거나 수집한 근거 자료를 기반으로 생산된 것인지, 근거 자료가 얼마나 정확하고 최신의 것이며 증빙 가능한 것인지 등의 측면에서 평가할 수 있다.","n":[],"p":50,"b":2},{"c":"[6국06-03]","k":"공통","sk":"","s":"국어(청각장애)","g":"초등학교 5~6학년","d":"매체","t":"적합한 양식과 수용자의 반응을 고려하여 복합양식 매체 자료를 제작하고 공유한다.","m":"이 성취기준은 매체 및 매체 자료의 양식과 수용자에게 끼칠 영향을 고려하여 복합양식 자료를 제작하는 능력을 기르기 위해 설정하였다. 의도나 주제를 드러내는 다양한 표현 양식을 이해하고 자신의 목적, 주제, 수용자 반응을 고려하여 이미지가 포함된 글, 카드 뉴스, 발표 자료, 동영상 등의 복합양식 매체 자료를 제작한 다음 이를 공유하여 그 효과성을 점검한다.","n":[],"p":50,"b":2},{"c":"[6국06-04]","k":"공통","sk":"","s":"국어(청각장애)","g":"초등학교 5~6학년","d":"매체","t":"자신의 매체 이용 양상에 대해 성찰한다.","m":"","n":[],"p":50,"b":2},{"c":"[9국01-01]","k":"공통","sk":"","s":"국어(청각장애)","g":"중학교 1~3학년","d":"듣기⋅말하기","t":"화자의 의도와 관점을 추론하며 듣는다.","m":"이 성취기준은 담화의 맥락을 고려하여 담화에서 표면적으로 드러나지 않는 숨겨진 요소를 추론하며 들음으로써 담화의 내용을 깊이 이해하는 능력을 기르기 위해 설정하였다. 일상의 대화 상황에서 상대의 발화 의도 추론하기, 정보 전달이나 설득 등 다양한 목적의 담화에서 여러 가지 정보와 상황 맥락을 고려하여 화자의 숨겨진 의도와 관점, 가치관 추론하기 등을 학습한다.","n":[],"p":52,"b":2},{"c":"[9국01-02]","k":"공통","sk":"","s":"국어(청각장애)","g":"중학교 1~3학년","d":"듣기⋅말하기","t":"설득 전략을 비판적으로 분석하며 듣는다.","m":"","n":[],"p":52,"b":2},{"c":"[9국01-03]","k":"공통","sk":"","s":"국어(청각장애)","g":"중학교 1~3학년","d":"듣기⋅말하기","t":"담화 공동체에 따른 듣기⋅말하기 방식의 다양성을 고려하여 듣고 말한다.","m":"이 성취기준은 개인이 속해 있는 담화 공동체의 듣기⋅말하기 방식이 가진 다양성을 고려하여 구어 의사소통에 참여함으로써 사회⋅문화적 맥락에 맞는 의사소통 능력을 기르기 위해 설정하였다. 듣기⋅말하기 방식에 영향을 미치는 요인으로 세대, 성별, 직업, 지역, 공동체의 관심사나 이해관계, 공동체의 언어문화와 관습 등이 있음을 이해하기, 개인이 속한 집단이나 공동체에 따라 듣기⋅말하기 방식이 다양할 수 있음을 이해하기, 듣기⋅말하기 방식의 다양성에 대한 존중이 긍정적인 관계 형성과 유지에 기여함을 이해하기, 서로 다른 듣기⋅말하기 방식을 이해하고 존중하는 태도 형성하기, 자신의 듣기⋅말하기 방식이 상황 맥락이나 자신이 속한 공동체에 적절한지를 지속적으로 점검하여 개선하기 등을 학습한다.","n":[],"p":52,"b":2},{"c":"[9국01-04]","k":"공통","sk":"","s":"국어(청각장애)","g":"중학교 1~3학년","d":"듣기⋅말하기","t":"상대의 말을 경청하고 상대의 감정과 입장에 공감하는 반응을 보이며 대화한다.","m":"","n":[],"p":52,"b":2},{"c":"[9국01-05]","k":"공통","sk":"","s":"국어(청각장애)","g":"중학교 1~3학년","d":"듣기⋅말하기","t":"면담의 다양한 목적과 상대를 고려하여 질문을 점검하고 효과적으로 면담한다.","m":"이 성취기준은 효과적으로 면담을 수행함으로써 목적과 상대를 고려하는 의사소통 능력을 기르기 위해 설정하였다. 말하기나 글쓰기를 위한 자료 수집, 의사 결정, 상담, 선발 등 다양한 면담 목적과 상대를 고려하여 질문 마련하기, 구조화 면담 또는 반구조화 면담 등 면담 유형에 적절한 면담 수행 계획 세우기, 면담 대상자의 입장이나 반응 등에 따라 면담 질문의 내용이나 순서, 진행 방법 등을 조정하여 면담하기, 면담 중에 추가 질문하기, 면담 후 면담 계획이나 목적에 따라 면담이 원만하게 진행되었는지를 점검하기, 질문의 의도와 답변자의 의도를 고려하여 면담 내용을 정리하기 등을 학습한다.","n":[],"p":52,"b":2},{"c":"[9국01-06]","k":"공통","sk":"","s":"국어(청각장애)","g":"중학교 1~3학년","d":"듣기⋅말하기","t":"다양한 자료를 재구성하여 내용을 체계적으로 조직하고 청중이 이해하기 쉽게 발표한다.","m":"이 성취기준은 말할 내용을 체계적으로 조직하여 청중이 이해하기 쉽게 발표하는 능력을 함양하기 위해 설정하였다. 다양한 자료를 청자가 이해하기 쉬운 방향으로 재구성하기, 발표 내용을 도입부⋅전개부⋅정리부로 나누어 체계적으로 구성하기, 발표 목적이나 대상의 특성에 적절한 설명 방법 활용하기, 청중이 이해하기 쉽게 발표하기, 발표 준비와 실행 과정을 되돌아보고 수행의 적절성 점검하기 등을 학습한다.","n":[],"p":52,"b":2},{"c":"[9국01-07]","k":"공통","sk":"","s":"국어(청각장애)","g":"중학교 1~3학년","d":"듣기⋅말하기","t":"토의에서 다양한 의견을 교환하여 대안을 마련하고 문제를 해결한다.","m":"","n":[],"p":52,"b":2},{"c":"[9국01-08]","k":"공통","sk":"","s":"국어(청각장애)","g":"중학교 1~3학년","d":"듣기⋅말하기","t":"토론에서 반론을 고려하여 타당한 논증을 구성하고 논리적으로 반박한다.","m":"이 성취기준은 합리적이고 민주적 의사 결정을 위한 토론 능력을 기르기 위해 설정하였다. 토론 논제에 대한 찬성과 반대 입장별로 각 입장을 뒷받침하는 이유와 근거 마련하기, 상대방이 제기할 수 있는 반론을 고려하여 논증 구성하기, 주장⋅이유⋅근거⋅반론에 대한 고려 등 논증 구성 요소들이 타당한지 비판적으로 분석하여 반박하기, 논증의 논리적 전개 과정에서 논리적 허점이나 오류가 없는지 분석하여 반박하기 등을 학습한다.","n":[],"p":52,"b":2},{"c":"[9국01-09]","k":"공통","sk":"","s":"국어(청각장애)","g":"중학교 1~3학년","d":"듣기⋅말하기","t":"서로의 감정이나 바라는 바를 진솔하게 표현하면서 갈등을 조정한다.","m":"이 성취기준은 갈등을 조정할 수 있는 대화 방법을 배움으로써 상대방과의 관계를 원만하게 유지할 수 있는 능력을 기르기 위해 설정하였다. 자신의 생각과 감정을 진솔하게 표현하는 것이 왜 중요한지 이해하기, 자신과 상대의 생각과 감정, 욕구 등을 정확히 파악하기, 어떠한 차이로 인해 갈등이 발생하게 되었는지 분석하기, 사건에 대한 주관적 해석을 배제하고 객관적으로 전달하기⋅상황이나 사건에 대한 자신의 감정과 욕구를 진솔하게 표현하기⋅자신이 상대에게 바라는 것이 무엇인지 구체적으로 요청하기 방법을 활용하여 갈등 조정하기, 갈등을 악화시킬 수 있는 표현 경계하기, 상대의 의견과 감정을 존중하기 등을 학습한다.","n":[],"p":52,"b":2},{"c":"[9국01-10]","k":"공통","sk":"","s":"국어(청각장애)","g":"중학교 1~3학년","d":"듣기⋅말하기","t":"언어폭력의 문제점을 성찰하고, 서로를 존중하는 표현을 사용하여 말한다.","m":"","n":[],"p":52,"b":2},{"c":"[9국01-11]","k":"공통","sk":"","s":"국어(청각장애)","g":"중학교 1~3학년","d":"듣기⋅말하기","t":"듣기⋅말하기 과정을 점검하고 듣기⋅말하기의 어려움을 효과적으로 조정한다.","m":"이 성취기준은 듣기⋅말하기 전⋅중⋅후 과정을 점검하고 구어 의사소통 과정에서 발생하는 다양한 어려움을 효과적으로 조정하는 메타 인지 능력을 기르기 위해 설정하였다. 듣기⋅말하기 활동 후에 자신의 듣기⋅말하기 과정이 적절했는지 성찰하기, 듣기⋅말하기 과정에서 부딪히는 어려움 분석하기, 향후의 듣기⋅말하기를 효과적으로 수행하기 위해 조정해야 할 점을 찾아 개선 계획 세워보기, 말하기 불안을 느끼는 상황에서 이를 완화할 수 있는 방법을 연습하고 적용하기 등을 학습한다.","n":[],"p":52,"b":2},{"c":"[9국01-12]","k":"공통","sk":"","s":"국어(청각장애)","g":"중학교 1~3학년","d":"듣기⋅말하기","t":"그림, 영상, 수어 영상 도서 등 다양한 시각적 영상 자료를 보고 자신의 의견이나 주장을 적절한 의사소통 전략을 사용하여 말⋅수어로 표현한다.","m":"이 성취기준은 다양한 시각 자료를 보고 자신의 의견이나 주장을 적절한 의사소통 전략을 사용하여 효과적으로 표현할 수 있도록 하기 위해 설정하였다. 청각장애 학생이자신의 청능 정도와 특성에 따라 선호하는 주 의사소통 양식을 활용하여 자신의 의견, 주장을 자신 있게 표현할 수 있도록 학습한다. 또한 자신이 선택한 주 의사소통 양식의 듣기⋅말하기 방법의 효과적인 사용 방법과 전략을 알아보고, 상황 맥락에 적절한 방법과 전략을 활용하여 내용을 충분히 이해하며 공감적 소통 문화에 적극적으로 참여하는 방법을 학습한다.","n":[],"p":52,"b":2},{"c":"[9국02-01]","k":"공통","sk":"","s":"국어(청각장애)","g":"중학교 1~3학년","d":"읽기","t":"읽기는 사회⋅문화적 맥락에서 의미를 구성하는 과정임을 이해하며 사회적 독서에 참여하고 사회적 독서 문화 형성에 기여한다.","m":"이 성취기준은 읽기가 다양한 사회⋅문화적 맥락에 속한 공동체 구성원들이 상호 작용하며 의미를 구성하는 과정임을 이해하고 사회적 독서 문화 형성에 기여하도록 하기 위해 설정하였다. 독자는 자신이 처한 상황이나 사회⋅문화, 역사적 배경에 따라 의미를 형성해간다. 또한 공동체 구성원들이 구성한 의미를 협력적으로 소통함에 따라 타인의 삶에 대한 이해나 공동체가 지향해야 할 가치를 발견할 수 있다. 사회⋅문화적으로 가치 있는 주제의 글을 선정하여 읽기, 사회⋅문화적 맥락을 고려하여 필자의 의도 파악하기, 독서 토론을 통해 구성원 간의 다양한 의미 교환하기, 사회⋅문화적 맥락에서 새로운 의미 발견하기, 사회적 독서 문화 형성하기 등을 학습한다.","n":[],"p":56,"b":2},{"c":"[9국02-02]","k":"공통","sk":"","s":"국어(청각장애)","g":"중학교 1~3학년","d":"읽기","t":"읽기 목적과 글의 구조를 고려하며 글을 효과적으로 요약한다.","m":"","n":[],"p":56,"b":2},{"c":"[9국02-03]","k":"공통","sk":"","s":"국어(청각장애)","g":"중학교 1~3학년","d":"읽기","t":"독자의 배경지식과 글에 나타난 정보 등을 활용하여 글에 드러나지 않은 의도나 관점을 추론하며 읽는다.","m":"","n":[],"p":56,"b":2},{"c":"[9국02-04]","k":"공통","sk":"","s":"국어(청각장애)","g":"중학교 1~3학년","d":"읽기","t":"복합양식으로 구성된 글과 자료의 내용 타당성과 신뢰성, 표현 방법의 적절성을 평가하며읽는다.","m":"이 성취기준은 복합양식으로 구성된 글과 자료를 내용과 형식의 측면에서 비판적으로 평가하며 읽을 수 있는 능력을 기르기 위해 설정하였다. 다양한 매체 환경에서는 문자 언어로만 이루어진 단일양식뿐만 아니라 문자, 소리, 그림, 사진, 동영상 등 다양한 기호가 함께 어우러진 복합양식의 글이나 자료를 비판적으로 읽을 수 있어야 한다. 단일양식과 복합양식의 글이나 자료 비교하기, 복합양식의 글이나 자료가 작성된 맥락 파악하기, 복합양식으로 구성된 글이나 자료의 내용 타당성과 신뢰성, 표현 방법의 적절성을 평가하며 읽기 등을 학습한다.","n":[],"p":56,"b":2},{"c":"[9국02-05]","k":"공통","sk":"","s":"국어(청각장애)","g":"중학교 1~3학년","d":"읽기","t":"글에 사용된 다양한 설명 방법과 논증 방법을 파악하고, 그 타당성을 평가하며 읽는다.","m":"","n":[],"p":56,"b":2},{"c":"[9국02-06]","k":"공통","sk":"","s":"국어(청각장애)","g":"중학교 1~3학년","d":"읽기","t":"동일한 화제를 다룬 여러 글이나 자료를 주제 통합적으로 읽는다.","m":"이 성취기준은 동일한 화제를 다룬 여러 글이나 자료를 비판적으로 읽고 자신의관점에 따라 의미를 재구성할 수 있는 주제 통합적 읽기 능력을 기르기 위해 설정하였다. 동일한 화제에 대해 서로 다른 관점을 지닌 글을 대조하며 읽거나 비슷한 주제를 담은 다양한 형식을 비교하며 읽으면서, 독자는 편견이나 선입견을 배제하고 합리적으로 판단할 수 있게 된다. 여러 글이나 자료를 비교하며 읽는 과정에서 독자는 화제와 관련된 쟁점에 대한 충분한 이해를 바탕으로 자신의 관점을 세울 수 있다. 관점이나 형식이 다른 다양한 글이나 자료를 비교⋅분석하기, 대상 화제에 대한 자신의 관점 수립하기, 서로 다른 관점과 형식의 글을 자신의 관점을 토대로 통합하기, 자신의 관점에 따라 의미를 구성하고 표현하기 등을 학습한다.","n":[],"p":56,"b":2},{"c":"[9국02-07]","k":"공통","sk":"","s":"국어(청각장애)","g":"중학교 1~3학년","d":"읽기","t":"진로나 관심 분야에 대한 다양한 책이나 자료를 스스로 찾아 읽는다.","m":"이 성취기준은 자신의 진로나 관심 분야에 대한 책이나 자료 등을 스스로 탐색하고 선정하여 읽는 능력을 기르기 위해 설정하였다. 학습자가 다양한 글이나 자료를 자기 선택적으로 읽으며 주체적으로 자신의 진로나 관심 분야를 탐색할 수 있도록 한다. 학습자가 관심을 갖고 있는 진로나 관심 분야를 파악하기, 도서관이나 인터넷 등에서 자신의 진로 탐색이나 관심 분야에 대한 깊이 있는 이해를 위해 적합한 책이나 자료를 탐색하고 선정하기, 필요한 정보를 선별하며 읽기, 진로나 관심 분야가 유사한 학습자 간에 읽기 결과를 공유하기 등을 학습한다.","n":[],"p":56,"b":2},{"c":"[9국02-08]","k":"공통","sk":"","s":"국어(청각장애)","g":"중학교 1~3학년","d":"읽기","t":"자신의 독서 상황과 수준에 맞는 글을 선정하고 읽기 과정을 점검⋅조정하며 읽는다.","m":"","n":[],"p":56,"b":2},{"c":"[9국02-09]","k":"공통","sk":"","s":"국어(청각장애)","g":"중학교 1~3학년","d":"읽기","t":"동일 화제를 다룬 글과 수어 영상 도서 등 다양한 시각적 영상 자료를 통해 자신의 삶과 연관성을 성찰하며 읽는다.","m":"이 성취기준은 독서가 세상을 간접적으로 경험하며 문제를 해결하는 행위임을 이해하고 글에서 파악한 내용과 정보로 자신의 문제를 해결해 나가는 궁극적인 능력을 기르기 위해 설정하였다. 글을 읽다 보면 뜻을 모르는 단어, 어휘, 용어 등이 나오고 그 의미가 모호한 문장도 있는데, 청각장애 학생의 경우 주 의사소통 양식에 따라국어사전, 수어 사전, 백과사전 등의 다양한 사전과 인터넷을 모두 활용하여 의미를 파악해야 하는 경우가 많이 있다. 기본적으로 글의 내용을 정확히 이해하기 위해서 스스로 단어와 관련 자료를 찾고 글의 기본 내용과 정보를 이해하여 읽을 수 있도록 지도하는 것을 바탕으로 하여 글의 내용과 나와의 관련성을 파악하고 문제 상황을 인식⋅문제 해결 과정을 사고하는 것으로써 읽기를 통한 경험의 확장을 이룰 수 있도록 학습한다. 또한 동일 화제에 대한 서로 다른 관점의 글과 자료를 다양하게 접함으로써 다양하고 유연하게 사고하기 등을 학습한다.","n":[],"p":56,"b":2},{"c":"[9국03-01]","k":"공통","sk":"","s":"국어(청각장애)","g":"중학교 1~3학년","d":"쓰기","t":"대상의 특성에 적합한 설명 방법을 활용하여 글을 쓴다.","m":"이 성취기준은 대상의 특성에 적합한 설명 방법을 활용하여 독자가 이해하기 쉬운 글을 쓰는 데에 필요한 능력을 기르기 위해 설정하였다. 대상과 관련한 독자의 배경지식 및 관심 고려하기, 전달하고자 하는 정보의 특성을 고려하여 정의, 인과, 분석, 분류 등의 다양한 설명 방법을 활용하기, 대상의 특성을 효과적으로 전달하기 위한 글의 구조 및 표현 방법 이해하기 등을 학습한다.","n":[],"p":60,"b":2},{"c":"[9국03-02]","k":"공통","sk":"","s":"국어(청각장애)","g":"중학교 1~3학년","d":"쓰기","t":"복수의 자료를 활용하여 다양한 형식으로 정보를 전달하는 글을 쓴다.","m":"이 성취기준은 둘 이상의 자료를 활용하여 다양한 형식으로 보고서나 설명문을 쓰는 데에 필요한 능력을 기르기 위해 설정하였다. 객관적인 정보의 공유와 소통을 위해 다양한 정보를 담고 있는 복수의 자료 활용하기, 정보를 전달하는 글의 내용을 생성하는 과정에서 책, 신문, 인터넷 등 다양한 매체에서 정보 수집하기, 수집한 정보의 중요도 분석하기, 수집한 정보 통합하기, 쓰기 윤리를 지키며 자료 활용하기, 문자 언어와 함께 도표, 그림, 사진 등을 활용하여 다양한 형식으로 정보를 전달하기 등을 학습한다.","n":[],"p":60,"b":2},{"c":"[9국03-03]","k":"공통","sk":"","s":"국어(청각장애)","g":"중학교 1~3학년","d":"쓰기","t":"주장을 뒷받침할 수 있는 타당한 근거를 들고 적절한 표현을 사용하여 주장하는 글을 쓴다.","m":"","n":[],"p":60,"b":2},{"c":"[9국03-04]","k":"공통","sk":"","s":"국어(청각장애)","g":"중학교 1~3학년","d":"쓰기","t":"의견 차이가 있는 사안에 대해 자료를 수집하고 사회⋅문화적 맥락을 고려하며 주장하는 글을 쓴다.","m":"이 성취기준은 의견 차이가 있는 사안이 발생한 상황을 이해하고 쟁점을 분석하여 자신의 주장을 제시하는 글을 쓰는 데에 필요한 능력을 기르기 위해 설정하였다. 의견 차이가 있는 사안 찾기, 쟁점을 분석하고 쟁점에 대한 다양한 의견과 자료를 수집하기, 쟁점에 대한 자신의 관점을 수립하여 주장을 논리적으로 전개하기, 자신의 주장이 사회⋅문화적 맥락 내에서 수용될 수 있도록 제시하기 등을 학습한다.","n":[],"p":60,"b":2},{"c":"[9국03-05]","k":"공통","sk":"","s":"국어(청각장애)","g":"중학교 1~3학년","d":"쓰기","t":"자신의 삶과 경험을 바탕으로 정서를 진솔하게 표현하는 글을 쓴다.","m":"","n":[],"p":60,"b":2},{"c":"[9국03-06]","k":"공통","sk":"","s":"국어(청각장애)","g":"중학교 1~3학년","d":"쓰기","t":"다양한 표현을 활용하여 자신의 생각과 느낌이 드러나는 글을 쓰고 독자와 공유한다.","m":"","n":[],"p":60,"b":2},{"c":"[9국03-07]","k":"공통","sk":"","s":"국어(청각장애)","g":"중학교 1~3학년","d":"쓰기","t":"복합양식 자료를 활용하여 내용을 생성하고 글의 유형을 고려하여 내용을 조직하며 글을 쓴다.","m":"이 성취기준은 글을 쓸 때 복합양식 자료를 활용하여 내용을 생성하고 글의 유형을 고려하여 내용을 조직하는 능력을 기르기 위해 설정하였다. 문자, 소리, 그림, 사진, 동영상 등이 결합된 복합양식 자료의 특징 및 유형 이해하기, 복합양식 자료를 활용하여 내용생성하기, 글의 유형을 고려하여 내용 조직하기 등을 학습한다.","n":[],"p":60,"b":2},{"c":"[9국03-08]","k":"공통","sk":"","s":"국어(청각장애)","g":"중학교 1~3학년","d":"쓰기","t":"쓰기 과정과 전략을 점검⋅조정하며 글을 쓰고, 독자를 고려하여 글을 고쳐 쓴다.","m":"이 성취기준은 쓰기 과정과 전략을 점검⋅조정하며 글을 쓰고 독자를 고려하여 글을 고쳐 쓰는 데에 필요한 능력을 기르기 위해 설정하였다. 독자를 고려하여 글을 고쳐 쓰는 것은 글의 내용 차원, 조직 차원, 표현 차원, 독자와 글을 직접적으로 연결하는 수사적 차원에서 두루 이루어질 필요가 있다. 쓰기 과정과 전략을 점검⋅조정하기, 독자의 지식, 기대나 요구, 태도를 분석하기, 독자 분석의 결과를 반영하여 글을 고쳐쓰기 등을 학습한다.","n":[],"p":60,"b":2},{"c":"[9국03-09]","k":"공통","sk":"","s":"국어(청각장애)","g":"중학교 1~3학년","d":"쓰기","t":"언어 공동체의 구성원인 필자로서 자신에 대해 성찰하며, 윤리적 소통 문화를 형성하는 데에 기여한다.","m":"이 성취기준은 필자가 자신과 자신의 쓰기 과정 및 결과를 성찰하여 언어 공동체의 구성원으로 성장하는 데에 필요한 능력과 태도를 기르기 위해 설정하였다. 필자로서자기 자신이 어떤 사람인지 필자 정체성 성찰하기, 언어 공동체의 개념 이해하기, 윤리적 소통 문화의 특성과 필요성 이해하기, 책임감 있게 글을 쓰는 태도 기르기 등을 학습한다.","n":[],"p":60,"b":2},{"c":"[9국03-10]","k":"공통","sk":"","s":"국어(청각장애)","g":"중학교 1~3학년","d":"쓰기","t":"그림, 영상, 수어 영상 도서 등 다양한 시각적 영상 자료를 보고 자신의 경험과 관련된 글을 쓰고, 독자와 공유한다.","m":"이 성취기준은 시각적 영상 자료에서 제공하는 단서를 더 잘 이해하고 활용할 수 있는 청각장애 학생들의 감각적 특성과 흥미, 집중도를 고려하여 다양한 시각 자료를 활용하여 글을 쓰도록 하기 위해 설정하였다. 인공와우 이식 및 보청기 착용 등을 하여 청각적 재활에 비교적 성공한 학생도 학년에 따라 증가하는 텍스트의 양과 난이도 때문에 국어과 학습에 많은 어려움을 보인다. 그림, 영상, 수어 영상 도서 등의 자료는 내용 및 상황 맥락, 사회⋅문화적 맥락의 이해를 촉진하는 음성언어 정보뿐 아니라 학습 성취수준에 맞는 시각 단서와 자극을 풍부히 제공한다. 주 의사소통 양식의 차이, 학습 수준의 차이 등으로 다양한 학습 수준을 보이는 청각장애 학생은 자신의 경험과 관련하여 상황을 능동적으로 이해하고 다양한 시각 자료를 활용한 글쓰기를 학습한다.","n":[],"p":60,"b":2},{"c":"[9국04-01]","k":"공통","sk":"","s":"국어(청각장애)","g":"중학교 1~3학년","d":"문법","t":"국어의 음운 체계와 문자 체계를 이해하고 국어생활에 활용한다.","m":"이 성취기준은 국어의 음운 체계와 문자 체계를 종합적으로 탐구함으로써, 말소리와 문자의 관련성을 체계적으로 이해하도록 하기 위해 설정하였다. 말소리와 음운의 관계, 음운 체계에 대한 이해를 바탕으로 발음 및 표기를 정확하게 할 수 있도록 한다. 이와관련지어 훈민정음 창제 정신과 원리를 중심으로 국어의 문자 체계를 탐구하고, 디지털⋅정보화 시대에 한글이 지니는 가치 및 발전 방향을 다각도로 탐색하도록 한다.","n":[],"p":63,"b":2},{"c":"[9국04-02]","k":"공통","sk":"","s":"국어(청각장애)","g":"중학교 1~3학년","d":"문법","t":"단어의 짜임을 분석하여 새말 형성의 원리를 이해한다.","m":"","n":[],"p":63,"b":2},{"c":"[9국04-03]","k":"공통","sk":"","s":"국어(청각장애)","g":"중학교 1~3학년","d":"문법","t":"품사의 종류와 특성을 이해하고 국어 자료를 분석한다.","m":"이 성취기준은 품사의 종류와 특성을 이해하고 이를 바탕으로 다양한 국어 자료를 분석할 수 있는 능력을 기르기 위해 설정하였다. 품사 분류를 통해 우리말에 대한 이해의 폭을 넓힘은 물론 품사의 특성을 고려해 정확하고 적절하게 단어를 사용할 수 있도록 한다. 또한, 문장을 단어별로 나누어 문장 안에서의 쓰임을 분석하거나, 글이나 담화에 쓰인 단어의 정확성⋅적절성을 평가하거나, 단어 부류의 빈도나 분포에 따라 글이나 담화의 특성을 간략히 기술하는 등, 품사 지식을 활용해 국어 자료의 특성을 간단히 분석해 봄으로써 품사가 국어 탐구를 위한 기초적이고 유용한 도구임을 이해하도록 한다.","n":[],"p":63,"b":2},{"c":"[9국04-04]","k":"공통","sk":"","s":"국어(청각장애)","g":"중학교 1~3학년","d":"문법","t":"문장의 짜임을 이해하고 표현 효과를 고려하여 문장을 구성한다.","m":"","n":[],"p":63,"b":2},{"c":"[9국04-05]","k":"공통","sk":"","s":"국어(청각장애)","g":"중학교 1~3학년","d":"문법","t":"피동 표현과 인용 표현의 의도와 효과를 분석하고 상황에 맞게 활용한다.","m":"이 성취기준은 피동 표현과 인용 표현을 활용해 의도를 정확하고 적절하게 표현하고, 그 효과를 분석하는 능력을 기르기 위해 설정하였다. 피동 표현과 인용 표현의 형식적 특성과 기능, 표현 효과를 학습하는 데 중점을 둔다. 피동 표현과 인용 표현의 사용을 표현 의도와 관련지어 이해하고, 그 효과를 분석하여 실제 국어생활에서 상황 맥락에 맞게 적절하게 활용할 수 있도록 한다.","n":[],"p":63,"b":2},{"c":"[9국04-06]","k":"공통","sk":"","s":"국어(청각장애)","g":"중학교 1~3학년","d":"문법","t":"한글 맞춤법의 기본 원리와 내용을 이해하고 국어생활에 적용한다.","m":"이 성취기준은 한글 맞춤법의 기본 원리를 이해하여 정확하고 교양 있는 국어생활을 영위하도록 하기 위해 설정하였다. ‘공통국어2’의 한글맞춤법 관련 성취기준에서 내용이 심화⋅연계됨을 고려하여, ‘소리대로 적되 어법에 맞도록 함을 원칙으로 한다.’라는 한글 맞춤법 총칙을 중심으로 한글 맞춤법의 기본 원리를 탐구하는 데 중점을 두고, 음운 변동에 대한 지식을 필요로 하는 한글 맞춤법 조항 등은 다루지 않는다.","n":[],"p":63,"b":2},{"c":"[9국04-07]","k":"공통","sk":"","s":"국어(청각장애)","g":"중학교 1~3학년","d":"문법","t":"세대⋅분야⋅매체에 따른 어휘의 양상과 쓰임을 분석하고 다양한 집단과 사회의 언어에 관용적 태도를 지닌다.","m":"이 성취기준은 세대⋅분야⋅매체에 따라 어휘가 변이되고 팽창하는 양상을 다양한 국어 자료를 바탕으로 탐구하고, 이를 바탕으로 다양한 집단과 사회의 언어에 대해 관용적 태도를 지니도록 하기 위해 설정하였다. 어휘는 언어의 내용을 담는 주요 요소로서, 그 언어가 쓰이는 구체적 맥락과 조건에 따라 다양한 양상으로 변이되고 팽창되는데, 이러한 양상은 세대, 분야, 매체 등의 요인에 따라 청소년어, 노인어, 전문어, 인터넷 언어, 새말 등을 대상으로 분석적으로 탐구될 수 있다. 이들 어휘의 특성과 쓰임, 그리고 이러한 어휘들이 다양하게 변이되고 새롭게 생기는 과정에 대한 탐구를 통해, 이들 어휘를 중심으로 한 언어 실천이 상황적, 사회⋅문화적 맥락을 고려한 사회적 행위임을 이해하고 다양한 집단과 사회의 언어에 대해 관용적 태도를 견지할 수 있도록 한다.","n":[],"p":63,"b":2},{"c":"[9국04-08]","k":"공통","sk":"","s":"국어(청각장애)","g":"중학교 1~3학년","d":"문법","t":"자신과 주변의 다양한 국어 실천 양상을 비판적으로 분석하여 언어와 자아 및 세계 사이의관계를 인식한다.","m":"이 성취기준은 다양한 국어 자료에 대한 분석과 성찰을 통해 언어의 본질과 힘을 인식하고, 언어적 주체로서 능동적인 국어생활을 영위하도록 하기 위해 설정하였다. 욕설이나 부정적 표현 및 말투 등이 개인의 정체성 형성에 미치는 영향을 분석하고, 의도를 제대로 전달하지 못하는 표현, 편견 및 고정 관념을 유발하거나 사실을 왜곡하는 표현, 갈등을 조장하거나 강화하는 표현, 규범과 관습에 적절하지 않은 표현 등이 개인 간 관계 형성 및 언어 공동체에 미치는 영향을 성찰하고 비판하여, 언어가 자아 및 세계를 구성하는 핵심 자원임을 이해하도록 한다.","n":[],"p":63,"b":2},{"c":"[9국04-09]","k":"공통","sk":"","s":"국어(청각장애)","g":"중학교 1~3학년","d":"문법","t":"수어의 문법 요소 표현을 이해하고, 상황에 따라 적절하게 활용한다.","m":"이 성취기준은 수어의 다양한 문법 요소 표현을 이해하고, 일상생활 속에서 적절하게 활용하는 능력을 기르기 위해 설정하였다. 수어는 국어와 문법 요소를 표현하는 방식이 다르므로, 수어의 여러 가지 문법 요소 표현(어순, 종결 표현, 높임 표현, 시제 표현, 부정 표현, 피⋅사동 표현 등) 방식을 익혀 맥락 속에서 정확하고 적절하게 활용할 수 있게 지도한다.","n":[],"p":63,"b":2},{"c":"[9국05-01]","k":"공통","sk":"","s":"국어(청각장애)","g":"중학교 1~3학년","d":"문학","t":"운율, 비유, 상징의 특성과 효과에 유의하며 작품을 감상하고 창작한다.","m":"","n":[],"p":66,"b":2},{"c":"[9국05-02]","k":"공통","sk":"","s":"국어(청각장애)","g":"중학교 1~3학년","d":"문학","t":"갈등의 진행과 해결 과정을 파악하며 작품을 감상한다.","m":"","n":[],"p":66,"b":2},{"c":"[9국05-03]","k":"공통","sk":"","s":"국어(청각장애)","g":"중학교 1~3학년","d":"문학","t":"인간의 성장을 다룬 작품을 읽으며 문학의 가치를 내면화한다.","m":"","n":[],"p":66,"b":2},{"c":"[9국05-04]","k":"공통","sk":"","s":"국어(청각장애)","g":"중학교 1~3학년","d":"문학","t":"보는 이나 말하는 이의 특성과 효과를 파악하며 작품을 감상한다.","m":"이 성취기준은 시의 화자 또는 소설의 시점 및 서술자에 주목하여 작품을 깊이 있게 감상하는 능력을 기르기 위해 설정하였다. 문학 작품에서 누가 보는가, 누가 말하는가에따라 전달하는 내용이나 작품의 분위기가 크게 달라진다. 보는 이나 말하는 이가 누구인지, 어떤 특성을 가지고 있는지를 파악하고, 보는 이나 말하는 이의 특성이 작품 전체의 주제나 분위기에 어떤 효과를 미치는가에 주목하며 작품을 감상하도록 한다.","n":[],"p":66,"b":2},{"c":"[9국05-05]","k":"공통","sk":"","s":"국어(청각장애)","g":"중학교 1~3학년","d":"문학","t":"작품에 반영된 사회⋅문화적 상황을 이해하며 작품을 감상한다.","m":"","n":[],"p":66,"b":2},{"c":"[9국05-06]","k":"공통","sk":"","s":"국어(청각장애)","g":"중학교 1~3학년","d":"문학","t":"자신의 경험을 개성적인 발상과 표현으로 형상화한다.","m":"이 성취기준은 학습자가 문학을 수용하는 데에 그치지 않고 자신의 삶의 경험을 창의적으로 표현하며 문학 문화를 향유할 수 있도록 하기 위해 설정하였다. 학습자로 하여금 여러 작품들의 개성적 발상과 표현을 참고하면서 반어, 역설, 풍자 등 다양한 문학적 표현 방식을 활용하여 자신의 경험을 개성적으로 형상화하도록 한다. 이 과정에서 학습자가 자신의 경험을 성찰하고 새롭게 의미를 부여하며 가치를 찾도록 하는 한편, 실제 작품 생산의 경험을 통해 개성적인 발상 및 표현에 대한 이해를 심화할 수 있도록 한다.","n":[],"p":66,"b":2},{"c":"[9국05-07]","k":"공통","sk":"","s":"국어(청각장애)","g":"중학교 1~3학년","d":"문학","t":"연관성이 있는 다른 작품들과의 관계를 파악하며 작품을 감상한다.","m":"이 성취기준은 작품들 간의 관계에 주목하며 상호텍스트적으로 작품을 감상할 수 있게 하기 위해 설정하였다. 문학 작품은 다른 문학 작품들과의 관계 속에서 그 의미를 구체화하게 된다. 문학 작품에 대한 관계적 이해를 통해 작품에 대한 다층적이고 깊이 있는 해석 능력을 기를 수 있다. 통시적⋅공시적으로 유사한 주제나 형식을 가진 작품들, 서로 영향을 주고받은 작품들을 찾아보고, 작품 간의 공통점 및 차이점, 상호 간의 연관 관계를 파악하며 작품을 감상하도록 한다. 또한 학습자가 스스로 여러 작품 간의 관계를 찾아 새로운 의미 연관성의 맥락을 만들어 볼 수 있도록 한다.","n":[],"p":66,"b":2},{"c":"[9국05-08]","k":"공통","sk":"","s":"국어(청각장애)","g":"중학교 1~3학년","d":"문학","t":"근거를 바탕으로 작품을 해석하고, 다른 해석들과 비교하여 자신의 해석을 평가한다.","m":"이 성취기준은 주체적인 관점에서 작품을 해석하며 평가할 수 있는 능력을 기르게 하기 위해 설정하였다. 작품을 해석할 때는 작품 속의 내용적⋅형식적 근거나 작품 밖의맥락적 근거 등을 토대로 하여 작품을 해석하는 것이 필요하다. 작품 해석은 독자의 지식, 경험, 가치관 등을 바탕으로 이루어지는 과정이기 때문에 독자에 따라 얼마든지 달라질 수 있다. 다만 이때 작품을 잘못 이해하는 오독을 범하지 않으려면 작품 안과 밖의 여러 근거를 바탕으로 작품을 해석해야 한다. 적절한 근거를 들어 작품을 해석하고, 이를 다른 사람들의 해석과 비교하면서 자기 해석의 적절성을 검토하도록 한다.","n":[],"p":66,"b":2},{"c":"[9국05-09]","k":"공통","sk":"","s":"국어(청각장애)","g":"중학교 1~3학년","d":"문학","t":"문학을 통해 타자를 이해하고 공동체의 문제에 참여하는 태도를 지닌다.","m":"이 성취기준은 내가 아닌 다른 사람들, 그리고 다른 존재들을 이해하고, 그들에 공감하는 능력을 기르며, 그들과 어떻게 함께 살아갈 것인가를 공동체의 관점에서 고려하고, 공동체의 현안에 참여하는 태도를 가지게 하기 위해 설정하였다. 타자를 이해하는 능력은 평화로운 공존과 협력적 연대를 위한 핵심적 요인이다. 작품 속 인물들의 생각과 마음을 이해하고 다양한 삶을 간접적으로 체험하도록 함으로써 타자에 대한 이해와 공감의 폭을 넓힐 수 있도록 한다. 또한 가정, 학교, 이웃 사회, 생태환경 등 다양한 공동체의 문제와 그 해결 과정을 담은 작품을 읽고, 학습자가 속한 공동체의 문제에 대한 인식 능력과 실천적 참여 능력을 함양하도록 한다.","n":[],"p":66,"b":2},{"c":"[9국05-10]","k":"공통","sk":"","s":"국어(청각장애)","g":"중학교 1~3학년","d":"문학","t":"작품의 생각과 느낌을 말⋅글⋅수어 등의 적절한 의사소통 양식으로 비교 해석한다.","m":"이 성취기준은 타인 이해와 사회 참여를 돕는 수어 영상 도서 등을 통하여 사회⋅문화적 맥락에서 개성적 발상과 표현을 말⋅글⋅수어 등으로 형상화하도록 설정하였다. 작품을 이해하는 데 있어 독자의 입장뿐만 아니라 타인과 사회⋅문화적 맥락 속에서 작품을 이해하는 태도를 견지하도록 한다. 또한 청각장애 학생의 현상 중심적 사고에서 벗어나 작품 속에서 나의 입장과 더불어 타인의 입장과 사회 공동체가 지니는 가치 등을 유의하여 작품에 대한 느낌을 선호하는 의사소통 방법으로 표현하도록 한다.","n":[],"p":66,"b":2},{"c":"[9국06-01]","k":"공통","sk":"","s":"국어(청각장애)","g":"중학교 1~3학년","d":"매체","t":"대중매체와 개인 인터넷 방송의 특성과 영향력을 비교한다.","m":"","n":[],"p":69,"b":2},{"c":"[9국06-02]","k":"공통","sk":"","s":"국어(청각장애)","g":"중학교 1~3학년","d":"매체","t":"소통 맥락과 수용자 참여 양상을 고려하여 상호 작용적 매체를 분석한다.","m":"이 성취기준은 상호 작용적 매체의 특성을 이해하고 상황 맥락과 사회⋅문화적 맥락에 맞게 소통하는 능력을 기르기 위해 설정하였다. 예를 들어 사회 관계망 서비스(SNS)는 생각, 의견, 관점 등을 비교적 자유롭게 공유할 수 있는 개방적인 공간이며, 학교나 학급의 누리집은 공적인 정보를 공유하는 데 초점을 둔 공간이다. 이처럼 소통 목적, 소통 공간의 특성에 따라 참여자들이 소통하는 방식이 어떻게 달라지는지 다양한 각도에서 분석해 보고 자신의 소통 방식의 적절성에 대해서도 점검해 보도록 한다.","n":[],"p":69,"b":2},{"c":"[9국06-03]","k":"공통","sk":"","s":"국어(청각장애)","g":"중학교 1~3학년","d":"매체","t":"복합양식성을 고려하여 수어나 자막을 사용한 영상 매체 자료를 제작하고 공유한다.","m":"이 성취기준은 영상 매체가 가진 복합양식성을 이해하고, 수어나 자막이 포함된 영상 매체를 제작하는 능력을 기르기 위해 설정하였다. 수어나 자막이 이미지나 영상과 결합하였을 때의 표현 효과를 이해하고, 영상 매체를 제작할 때 수어나 자막의 사용 정도, 사용 효과, 사용 방법 등을 익히게 하고, 직접 수어나 자막이 사용된 영상 매체를 제작하는 연습을 할 수 있도록 한다.","n":[],"p":69,"b":2},{"c":"[9국06-04]","k":"공통","sk":"","s":"국어(청각장애)","g":"중학교 1~3학년","d":"매체","t":"매체 소통에서의 권리와 책임을 이해하고, 수용자의 반응을 고려하며 매체 자료의 제작 과정을 성찰한다.","m":"","n":[],"p":69,"b":2},{"c":"[9국06-05]","k":"공통","sk":"","s":"국어(청각장애)","g":"중학교 1~3학년","d":"매체","t":"매체 자료의 재현 방식을 이해하고 수어나 자막이 사용된 광고나 홍보물을 분석한다.","m":"이 성취기준은 매체 텍스트가 현실을 재현하는 방식을 이해하는 능력을 기르기 위해 설정하였다. 매체 자료는 제작자의 의도와 관점이 반영된 재현물이라는 것에 대한 이해를 바탕으로 다양한 광고나 홍보물을 살펴보며 사건, 쟁점, 인물을 표현하기 위해 어떤 문구나 수어, 자막이나 이미지가 선택되거나 배제되었는지를 탐구하고, 사회상이나 특정 집단에 대해 어떤 고정 관념이 반영되어 있는지 분석하도록 한다.","n":[],"p":69,"b":2},{"c":"[9국06-06]","k":"공통","sk":"","s":"국어(청각장애)","g":"중학교 1~3학년","d":"매체","t":"사회⋅문화적 맥락을 고려하여 매체 자료의 공정성을 평가한다.","m":"이 성취기준은 매체 자료를 공정성의 측면에서 비판적으로 이해하는 능력을 기르기 위해 설정하였다. 타당하고 신뢰성 있는 정보라 하더라도 그것이 의도에 따라 과도하게 반복, 과장, 축소되어 전달되는 경우에는 공정한 매체 자료라고 보기 어렵다. 특정 사건이나 쟁점을 다루는 매체 자료를 비교하고, 그 매체 자료가 생산된 사회⋅문화적 맥락이 어떠한지 파악한다. 그리고 매체 자료가 특정 제품이나 업체를 홍보하고 있지는 않은지, 다양한 주장을 전달하지 않고 특정 입장을 지닌 주장을 전달하면서 한쪽으로 치우쳐 있지는 않은지, 피상적인 사실 전달에 그쳐 특정한 쟁점이나 사건에 대한 진실을 간과하거나 호도하고 있지는 않은지 등을 점검한다.","n":[],"p":69,"b":2},{"c":"[4체01-01]","k":"공통","sk":"","s":"체육(시각장애)","g":"초등학교 3~4학년","d":"운동","t":"운동과 체력의 의미를 이해하고 관계를 파악한다.","m":"은 운동이 신체 변화와 체력 증진에 미치는 영향을 이해하기 위해 설정하였다. 운동과 체력의 의미를 이해하고 운동 전후의 신체 및 체력의 변화와 특성을 파악하여 운동의 중요성을 인식하도록 한다.","n":[],"p":89,"b":2},{"c":"[4체01-02]","k":"공통","sk":"","s":"체육(시각장애)","g":"초등학교 3~4학년","d":"운동","t":"기본 체력운동의 방법과 절차를 익히며 자신의 수준에 맞는 운동을 시도한다.","m":"는 체력 증진을 위한 기본 운동 방법과 절차를 체험하며 자신의 신체 특성과 체력수준에 맞게 운동하기 위해 설정하였다. 준비 운동, 본 운동, 정리 운동의 단계별 목적과 주안점을 파악하면서 운동 방법과 절차를 익히고, 자신의 신체 특성과 체력 수준에 적합한 운동을 선택하여 안전하게 시도하도록 한다.","n":[],"p":89,"b":2},{"c":"[4체01-03]","k":"공통","sk":"","s":"체육(시각장애)","g":"초등학교 3~4학년","d":"운동","t":"자신의 시각 정도와 특성에 적합한 운동을 탐색하여 안전하게 운동을 시도한다.","m":"은 시각장애 학생의 특성에 맞는 운동을 파악하기 위해 설정하였다. 시각장애 정도(전맹, 저시력)와 특성(시각적 경험의 유무, 신체활동의 경험, 원인 질환 등)에 적합한 운동을 파악하고 안전한 환경에서 운동을 시도하도록 한다.","n":[],"p":89,"b":2},{"c":"[4체01-04]","k":"공통","sk":"","s":"체육(시각장애)","g":"초등학교 3~4학년","d":"운동","t":"운동과 건강의 의미를 이해하고 관계를 파악한다.","m":"는 운동과 건강의 관계를 이해하기 위해 설정하였다. 건강의 의미와 운동이 건강을 유지, 증진하는 데 미치는 영향을 탐색하고 운동의 필요성을 파악하도록 한다.","n":[],"p":89,"b":2},{"c":"[4체01-05]","k":"공통","sk":"","s":"체육(시각장애)","g":"초등학교 3~4학년","d":"운동","t":"건강을 위한 바른 생활 습관을 이해하고 생활 속에서 규칙적으로 실천한다.","m":"는 건강을 유지하는 바른 생활 습관을 이해하고 일상생활에서 적극적으로 실천하는 습관을 기르기 위해 설정하였다. 건강한 생활 습관이 신체적 건강뿐만 아니라 정신적, 사회적 건강에도 영향을 미친다는 점을 이해하고, 건강 증진을 위한 생활 태도와 행동을 가정, 학교, 지역사회에서 규칙적으로 실천하도록 한다.","n":[],"p":89,"b":2},{"c":"[4체01-06]","k":"공통","sk":"","s":"체육(시각장애)","g":"초등학교 3~4학년","d":"운동","t":"다양한 감각을 활용하여 자신의 신체적 특징을 탐색한다.","m":"은 시각의 손상으로 인하여 습득하기 어려운 자신의 신체상을 바르게 인식하기 위해 설정하였다. 잔존 시각, 촉각, 청각 등 다양한 감각을 사용하여 자신의 신체를 탐색하고 인식하도록 한다.","n":[],"p":89,"b":2},{"c":"[4체01-07]","k":"공통","sk":"","s":"체육(시각장애)","g":"초등학교 3~4학년","d":"운동","t":"자신의 신체적 특징을 긍정적으로 인식하고 운동 계획을 세워 안전하게 활동한다.","m":"은 기본 체력운동을 통해 자신에게 적합한 운동 계획을 세우고 실천하기 위해 설정하였다. 체격, 체형, 체력 등 개인마다 다른 신체 특성을 긍정적으로 인식하고 자신의 신체 특성에 맞는 운동을 안전하고 효과적으로 수행하도록 한다.","n":[],"p":89,"b":2},{"c":"[4체01-08]","k":"공통","sk":"","s":"체육(시각장애)","g":"초등학교 3~4학년","d":"운동","t":"운동과 건강한 생활 습관 형성에 관심을 갖고 적극적으로 실천한다.","m":"은 운동을 통한 건강한 생활 습관 형성의 의지를 기르기 위해 설정하였다. 자신의운동 및 생활 습관을 점검해 보고, 건강 유지, 증진의 저해 요인을 삼가며, 적절한 운동과 바람직한 생활 태도에 관심을 갖고 적극적으로 실천할 수 있는 의지를 갖도록 한다.","n":[],"p":89,"b":2},{"c":"[4체02-01]","k":"공통","sk":"","s":"체육(시각장애)","g":"초등학교 3~4학년","d":"스포츠","t":"스포츠의 의미와 유형을 파악한다.","m":"은 스포츠의 의미와 유형을 이해하기 위해 설정하였다. 일정한 규칙과 방법에 따라 경기 기술을 수행하고 환경과의 상호 작용을 통해 발달한 스포츠의 개념과 기술형, 전략형, 생태형 스포츠의 유형별 특성을 이해하도록 한다.","n":[],"p":92,"b":2},{"c":"[4체02-02]","k":"공통","sk":"","s":"체육(시각장애)","g":"초등학교 3~4학년","d":"스포츠","t":"기본 움직임 기술의 의미와 종류를 이해하고 스포츠와의 관계를 파악한다.","m":"는 기본 움직임 기술의 의미, 종류(이동 움직임, 비이동 움직임, 조작 움직임)와 특성을 파악하기 위해 설정하였다. 기본 움직임 기술의 종류를 다양하게 탐색하면서 스포츠 활동에 기초가 되는 기본 움직임 기술의 특성과 스포츠 활동 수행과의 관계를 파악하도록 한다.","n":[],"p":92,"b":2},{"c":"[4체02-03]","k":"공통","sk":"","s":"체육(시각장애)","g":"초등학교 3~4학년","d":"스포츠","t":"다양한 감각을 활용하여 기본 움직임 기술을 파악한다.","m":"은 잔존 시각을 포함한 청각, 촉각 등의 다양한 감각을 활용하여 기본 움직임의 의미와 종류를 파악하는 능력을 기르기 위해 설정하였다. 잔존 감각을 활용하여 기본 움직임 기술(이동 움직임, 비이동 움직임, 조작 움직임)을 파악하도록 한다.","n":[],"p":92,"b":2},{"c":"[4체02-04]","k":"공통","sk":"","s":"체육(시각장애)","g":"초등학교 3~4학년","d":"스포츠","t":"움직임 요소에 따른 기본 움직임 기술의 수행 방법을 파악하고 시도한다.","m":"는 움직임 요소의 의미를 이해하고, 기본 움직임 기술을 다양한 상황에서 시도하기 위해 설정하였다. 이동 움직임, 비이동 움직임, 조작 움직임 기술을 단계적으로 익히고, 움직임 요소(신체, 노력, 공간, 관계)에 변화를 주어 안전하고 효과적으로 기본 움직임 기술을 수행하도록 한다.","n":[],"p":92,"b":2},{"c":"[4체02-05]","k":"공통","sk":"","s":"체육(시각장애)","g":"초등학교 3~4학년","d":"스포츠","t":"다양한 감각을 활용하여 복합적인 움직임 기술을 파악한다.","m":"는 잔존 시각을 포함한 청각, 촉각 등의 다양한 감각을 활용하여 복합 움직임 기술의 의미를 파악할 수 있도록 설정하였다. 잔존 감각을 활용하여 기본 움직임의 종류별(이동 기술 내 호핑과 스키핑의 연결 등), 종류 간(조작 기술의 치기와 이동 기술의 달리기를 연결 등)에 다양한 방식으로 연결하여 기본 움직임보다 심화된 복합적인 움직임 기술을 파악하도록 한다.","n":[],"p":92,"b":2},{"c":"[4체02-06]","k":"공통","sk":"","s":"체육(시각장애)","g":"초등학교 3~4학년","d":"스포츠","t":"기본 움직임 기술을 연결한 복합적인 움직임 기술을 파악하고 시도한다.","m":"은 기본 움직임 기술을 연결하여 다양하고 복합적인 움직임 기술을 수행하기 위해 설정하였다. 움직임 기술의 종류별(이동 움직임 기술 내 호핑과 스키핑의 연결 등), 종류 간(조작 움직임 기술의 치기와 이동 움직임 기술의 달리기의 연결 등)에 기본 움직임을 다양한 방식으로 연결하여 기본 움직임보다 심화된 복합적인 움직임 기술을 익히고, 간단한 게임 상황에서 시도하도록 한다.","n":[],"p":92,"b":2},{"c":"[4체02-07]","k":"공통","sk":"","s":"체육(시각장애)","g":"초등학교 3~4학년","d":"스포츠","t":"기술형 스포츠에 적합한 기본 움직임 기술을 파악하고 시도한다.","m":"은 기술형 스포츠 유형에 적합한 움직임 기술을 탐색하고 수행하기 위해 설정하였다. 움직임 기술의 수월성을 겨루는 기술형 스포츠 활동에서 활용되는 다양한 기능과 관련된 움직임 기술의 효과적 수행 방법(앞뒤 구르기, 옆돌기, 전력 달리기, 헤엄치기, 발차기 등)을 익히고, 간단한 게임 상황에서 시도하도록 한다.","n":[],"p":92,"b":2},{"c":"[4체02-08]","k":"공통","sk":"","s":"체육(시각장애)","g":"초등학교 3~4학년","d":"스포츠","t":"전략형 스포츠에 적합한 기본 움직임 기술을 파악하고 시도한다.","m":"은 전략형 스포츠 유형에 적합한 움직임 기술을 탐색하고 수행하기 위해 설정하였다. 움직임 기술과 전략에 따라 승패가 결정되는 전략형 스포츠 활동의 다양한 기능과 관련된 움직임 기술의 효과적 수행 방법(공던지기와 잡기, 공몰기, 공차기와 멈추기, 공치기와 받기, 라켓으로 치기 등)을 익히고, 기본적인 전략을 세워 간단한 게임 상황에서 시도하도록 한다.","n":[],"p":92,"b":2},{"c":"[4체02-09]","k":"공통","sk":"","s":"체육(시각장애)","g":"초등학교 3~4학년","d":"스포츠","t":"생태형 스포츠에 적합한 기본 움직임 기술을 파악하고 시도한다.","m":"는 생태형 스포츠 유형에 적합한 움직임 기술을 탐색하고 수행하기 위해 설정하였다. 생활 주변과 자연환경에서 이루어지는 다양한 생태형 스포츠 활동과 관련된 움직임 기술의 수행 방법(균형 잡고 이동하기, 타고 버티기, 잡고 오르기 등)을 익히고, 간단한 활동 상황에서 안전하게 시도하도록 한다.","n":[],"p":92,"b":2},{"c":"[4체02-10]","k":"공통","sk":"","s":"체육(시각장애)","g":"초등학교 3~4학년","d":"스포츠","t":"시각 정도와 특성을 고려하여 스포츠 유형별 기본 움직임 기술을 파악하고 시도한다.","m":"은 시각장애 정도(전맹, 저시력)와 특성(시각적 경험의 유무, 신체활동의 경험, 원인 질환 등)을 고려하여 유형별 스포츠(기술형, 전략형, 생태형)에 적합한 움직임 기술을 탐색하고 수행할 수 있는 능력을 기르기 위해 설정하였다. 유형별 스포츠 활동에서 활용되는 다양한 기능과 관련된 움직임 기술의 효과적인 수행 방법을 익히고, 간단한 게임 상황에서 기술을 시도하도록 한다.","n":[],"p":92,"b":2},{"c":"[4체02-11]","k":"공통","sk":"","s":"체육(시각장애)","g":"초등학교 3~4학년","d":"스포츠","t":"움직임 기술 수행에 자신감을 갖고 적극적으로 시도한다.","m":"은 기본 움직임 기술의 지속적인 시도를 통해 움직임 기술 수행에 대한 자신감을 기르기 위해 설정하였다. 기본 움직임 기술을 체계적으로 숙달하고, 간단한 규칙을 적용한 활동 상황에서 적극적으로 시도하며 움직임 기술 수행에 대한 자신감을 갖도록 한다.","n":[],"p":92,"b":2},{"c":"[4체02-12]","k":"공통","sk":"","s":"체육(시각장애)","g":"초등학교 3~4학년","d":"스포츠","t":"게임 활동에 최선을 다하고 규칙을 지킨다.","m":"는 게임 활동을 수행하며 정해진 규칙을 지키고 최선을 다하는 태도를 기르기 위해 설정하였다. 다양한 유형의 스포츠 활동에 임하는 마음가짐, 구성원에 대한 태도, 규칙 준수의 필요성, 최선의 가치 등을 실제 활동 과정에서 느끼고 실천하도록 한다.","n":[],"p":92,"b":2},{"c":"[4체02-13]","k":"공통","sk":"","s":"체육(시각장애)","g":"초등학교 3~4학년","d":"스포츠","t":"다양한 스포츠 환경에 개방적인 태도를 갖고 적극적이고 안전하게 스포츠 활동에 참여한다.","m":"은 스포츠 활동을 즐길 수 있는 환경에 개방적인 태도를 갖고 적극적이고 안전하게 활동하는 태도를 기르기 위해 설정하였다. 가정, 학교, 지역사회 체육 시설, 자연환경 등 다양하고 도전적인 스포츠 환경을 적극적으로 수용하고 활용하되, 안전 수칙을 숙지하여 안전사고를 예방하는 태도를 실천하도록 한다.","n":[],"p":92,"b":2},{"c":"[4체03-01]","k":"공통","sk":"","s":"체육(시각장애)","g":"초등학교 3~4학년","d":"표현","t":"표현 활동의 의미와 기본 움직임 기술과의 관계를 파악한다.","m":"은 표현 활동의 의미, 표현 활동과 기본 움직임 기술과의 관계를 이해하기 위해 설정하였다. 표현 활동에서의 움직임 기술과 운동 및 스포츠 영역에서의 움직임 기술의 차이를 이해함으로써 표현 활동에서 움직임 기술의 창의적이고 심미적인 특성을 이해하도록 한다.","n":[],"p":95,"b":2},{"c":"[4체03-02]","k":"공통","sk":"","s":"체육(시각장애)","g":"초등학교 3~4학년","d":"표현","t":"움직임 요소에 따른 기본 움직임 기술의 표현 방법을 파악하고 시도한다.","m":"는 움직임 요소에 따른 다양한 기본 움직임 기술을 학습함으로써 표현 활동의 기본 수행 능력을 기르기 위해 설정하였다. 이동 움직임, 비이동 움직임, 조작 움직임 기술을체험하되 신체, 노력, 공간, 관계 등 움직임 요소의 변화에 따라 기본 움직임 기술을 창의적이고 심미적으로 표현하도록 한다.","n":[],"p":95,"b":2},{"c":"[4체03-03]","k":"공통","sk":"","s":"체육(시각장애)","g":"초등학교 3~4학년","d":"표현","t":"다양한 감각을 활용하여 표현 활동에 필요한 기본 움직임 기술을 체험한다.","m":"은 시각의 결여 또는 제한으로 인하여 습득하기 어려운 표현 활동의 기본 움직임수행 능력을 기르기 위해 설정하였다. 이동, 비이동, 조작 움직임 체험 과정에서 다양한 감각(시각, 청각, 촉각, 평형 감각, 운동 감각 등)을 활용하여 움직임 기술을 체험하도록 한다.","n":[],"p":95,"b":2},{"c":"[4체03-04]","k":"공통","sk":"","s":"체육(시각장애)","g":"초등학교 3~4학년","d":"표현","t":"기본 움직임 기술을 활용하여 사물이나 자연을 모방하여 표현한다.","m":"는 기본 움직임 기술을 활용한 모방 표현 능력을 기르기 위해 설정하였다. 기본 움직임 기술을 활용하여 사물, 인물, 자연 현상 등의 모양과 움직임을 모방하여 표현하는 방법을 탐색하고 그 특징을 살려 표현하도록 한다.","n":[],"p":95,"b":2},{"c":"[4체03-05]","k":"공통","sk":"","s":"체육(시각장애)","g":"초등학교 3~4학년","d":"표현","t":"기본 움직임 기술을 활용하여 느낌이나 생각을 표현한다.","m":"는 기본 움직임 기술을 활용한 추상 표현 능력을 기르기 위해 설정하였다. 기본 움직임 기술을 활용하여 느낌과 생각 등을 동작으로 표현하는 방법을 탐색하고 창의적으로 표현하도록 한다.","n":[],"p":95,"b":2},{"c":"[4체03-06]","k":"공통","sk":"","s":"체육(시각장애)","g":"초등학교 3~4학년","d":"표현","t":"기본 움직임 기술을 리듬에 맞춰 표현한다.","m":"은 기본 움직임 기술을 활용한 리듬 표현 능력을 기르기 위해 설정하였다. 기본 움직임 기술을 활용하여 박자, 강약, 빠르기, 패턴에 맞춰 표현하는 방법을 탐색하고 리듬감을 살려 표현하도록 한다.","n":[],"p":95,"b":2},{"c":"[4체03-07]","k":"공통","sk":"","s":"체육(시각장애)","g":"초등학교 3~4학년","d":"표현","t":"기본 움직임 기술을 도구를 활용하여 표현한다.","m":"은 기본 움직임 기술을 활용한 도구 표현 능력을 기르기 위해 설정하였다. 기본 움직임 기술을 활용하여 줄, 공, 천, 훌라후프 등 도구의 특성을 활용한 표현 방법을 탐색하고 도구의 조작과 움직임을 연결하여 표현하도록 한다.","n":[],"p":95,"b":2},{"c":"[4체03-08]","k":"공통","sk":"","s":"체육(시각장애)","g":"초등학교 3~4학년","d":"표현","t":"움직임의 심미적 표현에 대한 호기심과 감수성을 나타낸다.","m":"은 움직임을 심미적으로 표현하는 것에 대한 호기심과 감수성을 갖도록 설정하였다. 기본 움직임 기술을 아름답게 표현하며 움직임을 심미적으로 표현하는 다양한 자극에 관심을 갖고 운동이나 스포츠 기술과는 다른 감성을 느낄 수 있도록 한다.","n":[],"p":95,"b":2},{"c":"[6체01-01]","k":"공통","sk":"","s":"체육(시각장애)","g":"초등학교 5~6학년","d":"운동","t":"건강 체력과 운동 체력의 의미와 요소를 파악하고 다양한 운동 방법을 탐색한다.","m":"은 3, 4학년군에서 학습한 기본 운동 방법을 체력 요소별로 구분하여 이해하고 체력 요소별로 다양한 운동 방법을 탐색하기 위해 설정하였다. 체력을 건강 체력과 운동 체력으로 구분하고, 유형별 체력 요소를 이해하며, 학습자 스스로 자신의 수준에 적합한 체력 요소별 운동 방법을 찾도록 한다.","n":[],"p":99,"b":2},{"c":"[6체01-02]","k":"공통","sk":"","s":"체육(시각장애)","g":"초등학교 5~6학년","d":"운동","t":"시각 정도와 특성을 고려하여 건강 체력과 운동 체력을 측정하고 자신의 체력 수준에 맞는 운동을 시도한다.","m":"는 시각장애 정도(전맹, 저시력)와 특성(시각적 경험의 유무, 신체활동의 경험, 원인 질환 등)에 적합한 자신의 건강 체력과 운동 체력 수준을 파악하여 체력을 증진할 수 있는 다양한 운동 방법을 선택하고 실천하기 위해 설정하였다. 시각장애 학생에게 적합한 측정 방법으로 체력 수준을 측정하여 자신의 우수한 체력과 부족한 체력이 무엇인지를 파악하고, 특히 부족한 체력을 기르기 위해 체력 수준에 적합한 운동 방법을 탐색하여 꾸준하게 실천하도록 한다.","n":[],"p":99,"b":2},{"c":"[6체01-03]","k":"공통","sk":"","s":"체육(시각장애)","g":"초등학교 5~6학년","d":"운동","t":"성장 발달의 의미와 특성을 이해하고 운동과의 관계를 파악한다.","m":"은 자신의 성장 발달을 이해하고, 운동이 성장 발달에 미치는 긍정적인 영향을 이해하기 위해 설정하였다. 성장에 따른 신체적, 정서적 변화, 특히 제2차 성징에 대한 이해를 바탕으로 자신의 성장 발달 양상을 긍정적으로 파악하고, 사춘기에 운동이 신체적, 정서적, 사회적 성장 발달에 바람직한 영향을 미친다는 점을 이해하도록 한다.","n":[],"p":99,"b":2},{"c":"[6체01-04]","k":"공통","sk":"","s":"체육(시각장애)","g":"초등학교 5~6학년","d":"운동","t":"시각 정도에 따른 운동 및 생활 속 위험 상황, 성장 발달을 저해하는 생활 방식의 문제점을 파악하고 예방 및 대처 방법을 익혀 안전하게 활동한다.","m":"는 운동과 일상생활에서 발생할 수 있는 다양한 안전사고의 유형과 성장 발달을 저해하는 생활 방식의 문제점을 파악하고 침착하게 대처하기 위해 설정하였다. 시각장애 학생이 운동 시설이나 용⋅기구, 지상⋅수상⋅빙상 등의 다양한 운동 환경에서 발생할 수 있는 안전사고, 건강한 성장 발달에 부정적인 생활 습관(흡연, 음주, 약물 오⋅남용 등), 안전을 위협하는 생활 및 자연 환경을 탐색하며 건강하고 안전한 생활 습관을 실천하도록 한다.","n":[],"p":99,"b":2},{"c":"[6체01-05]","k":"공통","sk":"","s":"체육(시각장애)","g":"초등학교 5~6학년","d":"운동","t":"체력 운동을 끈기 있게 규칙적으로 수행한다.","m":"는 체력 증진에 필요한 끈기와 근면성을 기르기 위해 설정하였다. 단기간에 증진되기 어려운 체력 운동의 특성상, 학습자가 운동 과정에서 쉽게 포기하지 않도록 체력 증진을 저해하는 개인적, 환경적 조건을 탐색하고 극복하면서 체력 운동을 규칙적으로 수행하도록 한다.","n":[],"p":99,"b":2},{"c":"[6체01-06]","k":"공통","sk":"","s":"체육(시각장애)","g":"초등학교 5~6학년","d":"운동","t":"성장과 발달 과정에서 나타나는 신체적, 정서적, 사회적 특성과 차이를 공감하고 위험 상황에 침착하게 대처한다.","m":"은 성장과 발달 과정에서 개인별 차이를 공감하며, 안전을 위협하는 위험 상황에 대처하기 위해 설정하였다. 자신의 신체적, 정서적, 사회적 건강 특성이 다른 사람과 어떤 차이가 있고, 그러한 차이를 공감하는 것이 자신과 공동체에 어떤 영향을 미치는지를 실제 사례를 통해 이해하도록 한다.","n":[],"p":99,"b":2},{"c":"[6체02-01]","k":"공통","sk":"","s":"체육(시각장애)","g":"초등학교 5~6학년","d":"스포츠","t":"기술형 스포츠의 의미와 유형을 파악한다.","m":"은 기술형 스포츠의 의미와 유형을 이해하기 위해 설정하였다. 기술의 수월성을 추구하는 기술형 스포츠의 의미를 이해하고 다양한 환경(지상, 수상, 빙상 등)에서의 움직임 기록 향상을 위한 기록형, 일련의 절차와 방법이 정해진 움직임을 정확하게 수행하는 동작형, 상대방의 신체적 기량과 겨루는 투기형으로 구분하여 유형별 움직임의 세부 특성을 파악하도록 한다.","n":[],"p":102,"b":2},{"c":"[6체02-02]","k":"공통","sk":"","s":"체육(시각장애)","g":"초등학교 5~6학년","d":"스포츠","t":"기술형 스포츠 유형별로 기본 움직임 기술을 응용한 기본 기능을 파악하고 수행한다.","m":"는 기록형, 동작형, 투기형 스포츠에서 기본 움직임 기술을 응용한 기본 기능을 효과적으로 활용하기 위해 설정하였다. 속도와 거리, 정확성에 도전하는 기록형 스포츠의 기본 기능(도움닫기 하여 멀리뛰기, 목표물에 정확히 던지기 등), 절차와 방법이 정해진 움직임을 수행하는 동작형 스포츠의 기본 기능(손 짚고 옆돌기, 다리 벌려 뛰어넘기 등), 상대방과 신체적 기술을 겨루는 투기형 스포츠의 기본 기능(발차기, 다리 걸기 등)을 게임 상황에 맞게 효율적으로 수행하도록 한다.","n":[],"p":102,"b":2},{"c":"[6체02-03]","k":"공통","sk":"","s":"체육(시각장애)","g":"초등학교 5~6학년","d":"스포츠","t":"기술형 스포츠 유형별 활동 방법을 파악하고 기본 전략을 게임 활동에서 수행한다.","m":"은 기록형, 동작형, 투기형 스포츠의 활동 방법과 기본 전략을 활용하기 위해 설정하였다. 기록형, 동작형, 투기형 스포츠를 변형한 게임 활동의 경기 방법을 이해하고, 기록 측정과 분석, 동작 수행의 점검과 분석, 자신과 상대의 기량 확인과 분석 등 기술형 스포츠의 기본 전략을 파악하고 수행하도록 한다.","n":[],"p":102,"b":2},{"c":"[6체02-04]","k":"공통","sk":"","s":"체육(시각장애)","g":"초등학교 5~6학년","d":"스포츠","t":"시각 정도와 특성에 적합한 기술형 스포츠 활동 방법과 기본 전략을 알고 적용한다.","m":"는 시각장애 정도와 특성에 적합한 기록형, 동작형, 투기형 스포츠의 활동 방법과 기본 전략을 활용하는 능력을 기르기 위해 설정하였다. 기록형, 동작형, 투기형 게임을 변형한 활동에 시각장애 학생이 참여할 수 있도록 경기 방법 및 기본 전략을 조정하여 게임에 적용하도록 한다.","n":[],"p":102,"b":2},{"c":"[6체02-05]","k":"공통","sk":"","s":"체육(시각장애)","g":"초등학교 5~6학년","d":"스포츠","t":"전략형 스포츠의 의미와 유형을 파악한다.","m":"는 전략형 스포츠의 의미와 유형을 이해하기 위해 설정하였다. 움직임 기능 수행 능력과 전략에 따라 승패가 결정되는 전략형 스포츠의 의미를 이해하고 스포츠의 유형을 상대 영역으로 이동하여 정해진 지점으로 공을 보내 득점하는 영역형, 동일 공간에서 공격과 수비를 번갈아 하며 정해진 구역을 돌아 점수를 얻는 필드형, 네트 너머에 있는 상대 영역에 공을 보내 넘기지 못하게 하여 득점하는 네트형으로 구분하여 각각의 세부 특성을 파악하도록 한다.","n":[],"p":102,"b":2},{"c":"[6체02-06]","k":"공통","sk":"","s":"체육(시각장애)","g":"초등학교 5~6학년","d":"스포츠","t":"전략형 스포츠 유형별로 기본 움직임 기술을 응용한 기본 기능을 파악하고 수행한다.","m":"은 영역형, 필드형, 네트형 스포츠에서 기본 움직임 기술을 응용한 기본 기능을 효과적으로 활용하기 위해 설정하였다. 패스, 드리블, 슛 등과 같은 영역형 스포츠의 기본 기능, 포구, 송구, 타격, 주루 등과 같은 필드형 스포츠의 기본 기능, 서브, 리시브, 토스, 스트로크(스매싱) 등과 같은 네트형 스포츠의 기본 기능을 변형게임이나 뉴스포츠 수준의 게임 상황에 맞게 효율적으로 수행하도록 한다.","n":[],"p":102,"b":2},{"c":"[6체02-07]","k":"공통","sk":"","s":"체육(시각장애)","g":"초등학교 5~6학년","d":"스포츠","t":"전략형 스포츠 유형별 활동 방법을 파악하고 기본 전략을 게임 활동에서 수행한다.","m":"은 영역형, 필드형, 네트형 스포츠의 활동 방법과 기본 전략을 활용하기 위해 설정하였다. 영역형, 필드형, 네트형 스포츠를 변형한 게임이나 뉴스포츠와 같은 게임 활동에참여하며 경기 방법을 파악하고, 공간 만들기, 공간 차단하기, 골 넣기와 막기, 빈 곳으로 공 치기, 구역과 역할 나누어 수비하기, 빈 곳으로 공 넘기기, 유기적으로 역할 분담하기 등 전략형 스포츠의 기본 전략을 파악하고 수행하도록 한다.","n":[],"p":102,"b":2},{"c":"[6체02-08]","k":"공통","sk":"","s":"체육(시각장애)","g":"초등학교 5~6학년","d":"스포츠","t":"시각 정도와 특성에 적합한 전략형 스포츠 활동 방법과 기본 전략을 알고 적용한다.","m":"은 시각장애 정도와 특성에 적합한 영역형, 필드형, 네트형 스포츠의 활동 방법과 기본 전략을 활용하는 능력을 기르기 위해 설정하였다. 영역형, 필드형, 네트형 게임을 변형한 활동에 시각장애 학생이 참여할 수 있도록 경기 방법 및 기본 전략을 조정하여 게임에 적용하도록 한다.","n":[],"p":102,"b":2},{"c":"[6체02-09]","k":"공통","sk":"","s":"체육(시각장애)","g":"초등학교 5~6학년","d":"스포츠","t":"생태형 스포츠의 의미와 유형을 파악한다.","m":"는 생태형 스포츠의 의미와 유형을 이해하기 위해 설정하였다. 다양한 환경 맥락에 따라 활동 특성이 나타나는 생태형 스포츠의 의미에 관한 이해를 바탕으로 생활 주변의 환경을 이용하여 활동하는 생활환경형, 자연환경과 상호 작용하며 활동하는 자연환경형으로 구분하여 유형별 세부 특성을 파악하도록 한다.","n":[],"p":102,"b":2},{"c":"[6체02-10]","k":"공통","sk":"","s":"체육(시각장애)","g":"초등학교 5~6학년","d":"스포츠","t":"생태형 스포츠 유형별로 기본 움직임 기술을 응용한 기본 기능을 파악하고 수행한다.","m":"은 생활환경형, 자연환경형 스포츠에서 기본 움직임 기술을 응용한 기본 기능을 효과적으로 활용하기 위해 설정하였다. 주변 생활환경에서 할 수 있는 골프형 게임, 디스크형 게임, 자전거 타기, 롤러스케이팅, 클라이밍 활동, 민속놀이 등과 자연환경에서 체험할 수 있는 등산 활동, 캠핑 활동, 수상 활동, 설상 활동 등 생태형 스포츠의 기본 기능을 익혀 주변의 다양한 활동 상황에 맞게 환경친화적으로 수행하도록 한다.","n":[],"p":102,"b":2},{"c":"[6체02-11]","k":"공통","sk":"","s":"체육(시각장애)","g":"초등학교 5~6학년","d":"스포츠","t":"생태형 스포츠 유형별 활동 방법을 파악하고 기본 전략을 게임 활동에서 수행한다.","m":"은 생활환경형, 자연환경형 스포츠의 활동 방법과 기본 전략을 활용하기 위해 설정하였다. 생활환경형, 자연환경형 스포츠를 변형한 게임이나 뉴스포츠 수준의 활동에 참여하며 활동 방법을 파악하고 스포츠 환경에 적합한 활동의 선정과 장비 사용, 안전하고 환경친화적인 활동과 정리 등 생태형 스포츠의 기본 활동 방법과 전략을 파악하고 수행하도록 한다.","n":[],"p":102,"b":2},{"c":"[6체02-12]","k":"공통","sk":"","s":"체육(시각장애)","g":"초등학교 5~6학년","d":"스포츠","t":"시각 정도와 특성에 적합한 생태형 스포츠 활동 방법과 기본 전략을 알고 적용한다.","m":"는 시각장애 정도와 특성에 적합한 생활환경형, 자연환경형 스포츠의 활동 방법과 기본 전략을 활용하는 능력을 기르기 위해 설정하였다. 생활환경형, 자연환경형 게임을 변형한 활동에 시각장애 학생이 참여할 수 있도록 조정된 활동 방법 및 기본 전략을 적용하도록 한다.","n":[],"p":102,"b":2},{"c":"[6체02-13]","k":"공통","sk":"","s":"체육(시각장애)","g":"초등학교 5~6학년","d":"스포츠","t":"스포츠 활동에 참여하며 목표를 달성하기 위한 의지를 실천하고 상대의 기술을 인정한다.","m":"은 스포츠 활동에 참여하며 목표 달성을 위한 의지와 상대 기술을 인정하는 태도를 기르기 위해 설정하였다. 스스로 목표를 설정하고 책임감 있게 꾸준히 실천하도록 하며, 함께 참여하는 상대 팀과 구성원의 우수한 기술을 인정하고 배우는 태도를 실천하도록 한다.","n":[],"p":102,"b":2},{"c":"[6체02-14]","k":"공통","sk":"","s":"체육(시각장애)","g":"초등학교 5~6학년","d":"스포츠","t":"스포츠 활동에 참여하며 팀원과 협력하고 구성원을 배려한다.","m":"는 스포츠에 참여하며 팀원과 협력하고 구성원을 배려하는 태도를 기르기 위해 설정하였다. 민주적인 의사 결정을 통해 역할을 분담하고 전략을 수립하는 등 팀원과의 협력을 강조하며, 기능 수행에 어려움을 겪는 학습자를 도와주고 배려함으로써 팀의 활동 성과를 공유하도록 한다.","n":[],"p":102,"b":2},{"c":"[6체02-15]","k":"공통","sk":"","s":"체육(시각장애)","g":"초등학교 5~6학년","d":"스포츠","t":"스포츠 활동에 참여하며 환경을 아끼고 감사하는 태도를 실천한다.","m":"는 스포츠 활동 환경을 아끼고 감사하는 태도를 기르기 위해 설정하였다. 주변의다양한 스포츠 시설 및 용⋅기구 현황을 탐색하고 이를 적극적으로 활용하면서 학교 및 지역사회가 제공하는 스포츠 복지의 중요성을 이해하도록 한다. 또한 스포츠 환경을 아끼고 보존함으로써 지속해서 혜택을 누릴 수 있다는 점에 감사함을 느낄 수 있도록 한다.","n":[],"p":102,"b":2},{"c":"[6체03-01]","k":"공통","sk":"","s":"체육(시각장애)","g":"초등학교 5~6학년","d":"표현","t":"표현 활동의 의미와 유형을 파악한다.","m":"은 표현 활동 의미와 유형을 이해하기 위해 설정하였다. 스포츠에서 신체 움직임의 심미성을 다루는 스포츠 표현, 민족의 고유한 전통을 신체 움직임으로 표현한 전통 표현, 자유로운 형식으로 움직임을 표현하는 현대 표현의 유형별로 다양한 작품을 직⋅간접적으로 체험함으로써 기본 동작과 구성 방법의 공통점과 차이점을 중심으로 특징을 파악하도록 한다.","n":[],"p":106,"b":2},{"c":"[6체03-02]","k":"공통","sk":"","s":"체육(시각장애)","g":"초등학교 5~6학년","d":"표현","t":"스포츠 표현에서 움직임 기술을 응용한 기본 동작을 파악하고 표현한다.","m":"는 스포츠 표현의 기본 움직임 기술과 응용 동작을 탐색하고 심미적으로 표현하기 위해 설정하였다. 신체활동의 예술적 아름다움을 추구하는 스포츠 표현의 기본 동작에 적합한 움직임 기술의 응용 동작을 심미적으로 표현하도록 한다.","n":[],"p":106,"b":2},{"c":"[6체03-03]","k":"공통","sk":"","s":"체육(시각장애)","g":"초등학교 5~6학년","d":"표현","t":"스포츠 표현의 기본 동작을 다양하게 구성하여 발표하고 감상한다.","m":"은 스포츠 표현에 적합한 움직임 기술의 응용 동작을 활용하여 작품을 구성하고 표현하기 위해 설정하였다. 스포츠 표현에 적합한 움직임 기술의 응용 동작을 창의적으로 구성하고, 개인 또는 모둠별로 간단한 작품을 만들어 발표하며 작품의 의도와 동작의 심미성을 감상하도록 한다.","n":[],"p":106,"b":2},{"c":"[6체03-04]","k":"공통","sk":"","s":"체육(시각장애)","g":"초등학교 5~6학년","d":"표현","t":"전통 표현에서 움직임 기술을 응용한 기본 동작을 파악하고 표현한다.","m":"는 우리나라와 세계 여러 민족과 지역에서 전해 내려오는 전통 표현에서 기본 움직임 기술을 응용한 동작의 문화적 특징을 파악하고 그 특성을 살려 표현하기 위해 설정하였다. 전통 표현의 기본 동작에 적합한 움직임 기술의 응용 동작을 문화적 특색이 드러나게 표현하도록 한다.","n":[],"p":106,"b":2},{"c":"[6체03-05]","k":"공통","sk":"","s":"체육(시각장애)","g":"초등학교 5~6학년","d":"표현","t":"전통 표현의 기본 동작을 다양하게 구성하여 발표하고 감상한다.","m":"는 전통 표현에 적합한 움직임 기술의 응용 동작을 활용하여 작품을 구성하고 표현하기 위해 설정하였다. 다양한 전통 표현에 담긴 역사와 특성을 이해하고 전통 표현의 움직임 기술 응용 동작을 문화적 특성에 따라 구성한다. 개인 또는 모둠별로 간단한 작품을 만들어 발표하며 작품의 의도와 동작이 갖는 전통적 의미를 감상하도록 한다.","n":[],"p":106,"b":2},{"c":"[6체03-06]","k":"공통","sk":"","s":"체육(시각장애)","g":"초등학교 5~6학년","d":"표현","t":"현대 표현에서 움직임 기술을 응용한 기본 동작을 파악하고 표현한다.","m":"은 현대 표현에서 기본 움직임 기술을 응용한 동작의 자유로움이 갖는 특징을 파악하고 창의적으로 표현하기 위해 설정하였다. 기본 동작에 적합한 움직임 기술 응용 동작을 기존의 표현 방법이나 틀에 얽매이지 않고 자유롭고 창의적으로 표현하도록 한다.","n":[],"p":106,"b":2},{"c":"[6체03-07]","k":"공통","sk":"","s":"체육(시각장애)","g":"초등학교 5~6학년","d":"표현","t":"현대 표현의 기본 동작을 다양하게 구성하여 발표하고 감상한다.","m":"은 현대 표현에 적합한 움직임 기술의 응용 동작을 활용하여 작품을 구성하고 표현하기 위해 설정하였다. 현대 표현에 적합한 움직임 기술의 응용 동작을 표현의 주제와 자유로운 흐름을 고려하여 구성한다. 개인 또는 모둠별로 간단한 작품을 만들어 발표하며 작품의 의도를 현대 사회의 문화적 특징과 비교하며 감상하도록 한다.","n":[],"p":106,"b":2},{"c":"[6체03-08]","k":"공통","sk":"","s":"체육(시각장애)","g":"초등학교 5~6학년","d":"표현","t":"다양한 감각을 활용하여 유형별 표현 활동의 응용 동작을 탐색하고 시도한다.","m":"은 시각장애 학생이 기본 움직임 수행 능력을 바탕으로 스포츠 표현, 전통 표현, 현대 표현의 응용 동작을 수행하기 위해 설정하였다. 유형별 표현 활동의 응용 동작을 수행하는 과정에서 잔존 감각을 활용하여 기본 및 복합 움직임 기술을 탐색하고, 이를 적극적으로 시도하여 표현 능력을 향상하도록 한다.","n":[],"p":106,"b":2},{"c":"[6체03-09]","k":"공통","sk":"","s":"체육(시각장애)","g":"초등학교 5~6학년","d":"표현","t":"다양한 표현 활동 유형을 수용하고, 움직임 표현의 아름다움을 추구한다.","m":"는 다양한 표현 활동 유형을 긍정적으로 수용하고 움직임 표현의 아름다움을 추구하도록 설정하였다. 다양한 표현 유형에 담긴 의미와 표현 특성을 직⋅간접적으로 탐색하며 표현 문화에 대한 이해의 폭을 확장하고 움직임 표현의 아름다움을 추구하도록 한다.","n":[],"p":106,"b":2},{"c":"[9체01-01]","k":"공통","sk":"","s":"체육(시각장애)","g":"중학교 1~3학년","d":"운동","t":"체력 증진의 의미를 이해하고 원리를 분석한다.","m":"은 체력 증진의 의미와 원리를 이해함으로써 효과적으로 체력 운동을 계획하기 위해 설정하였다. 체력 증진에 작용하는 과부하의 원리, 개별성의 원리, 점진성의 원리 등의 개념을 이해하고 분석하도록 한다.","n":[],"p":110,"b":2},{"c":"[9체01-02]","k":"공통","sk":"","s":"체육(시각장애)","g":"중학교 1~3학년","d":"운동","t":"자신의 체력 수준에 맞는 체력 증진 운동을 실천한다.","m":"는 체력 증진 원리에 따라 체력 요소별 운동 방법을 자신의 체력 수준에 적합하게실천하기 위해 설정하였다. 체력 요소별로 심화된 수준의 체력 운동 방법을 이해하고 실천하도록 한다.","n":[],"p":110,"b":2},{"c":"[9체01-03]","k":"공통","sk":"","s":"체육(시각장애)","g":"중학교 1~3학년","d":"운동","t":"자신의 장애 정도를 고려한 체력 증진 운동 방법을 실천한다.","m":"은 자신의 시각장애 정도(전맹, 저시력)에 적합한 체력 증진 운동 방법을 파악하고 실천할 수 있도록 설정하였다. 자신의 장애 정도에 적합한 운동을 선택하는 과정에서 잔존 감각을 활용하여 체력 요소별 운동 방법을 습득하고 안전하게 체력 운동을 수행하도록 한다.","n":[],"p":110,"b":2},{"c":"[9체01-04]","k":"공통","sk":"","s":"체육(시각장애)","g":"중학교 1~3학년","d":"운동","t":"체력 관리의 의미를 이해하고 원리를 분석한다.","m":"는 체력 관리의 의미와 원리를 이해함으로써 효과적으로 자신의 체력 관리 방법을계획하기 위해 설정하였다. 일상생활에서 체력을 유지하거나 증진하는데 필요한 주 단위의 유산소성 운동, 유연성 운동, 근력 및 근지구력 운동, 좌식 생활 최소화 등 체력 관리의 기본 원리를 이해하고 분석하도록 한다.","n":[],"p":110,"b":2},{"c":"[9체01-05]","k":"공통","sk":"","s":"체육(시각장애)","g":"중학교 1~3학년","d":"운동","t":"자신의 체력을 진단하고 적합한 체력 관리 방법을 실천한다.","m":"는 일상생활에서 체력 관리 원리에 따라 체력 운동을 실천하기 위해 설정하였다. 일상생활에서 스스로 체력을 진단한 후 계획, 실행, 평가의 절차에 따라 체력 관리에 필요한 운동을 습관화하도록 한다.","n":[],"p":110,"b":2},{"c":"[9체01-06]","k":"공통","sk":"","s":"체육(시각장애)","g":"중학교 1~3학년","d":"운동","t":"운동 처방의 의미를 이해하고 원리를 분석한다.","m":"은 운동 처방의 의미와 구성 요소를 이해함으로써 체력 증진 목표와 수준에 따라맞춤형 운동 처방을 계획하기 위해 설정하였다. 운동 빈도, 운동 강도, 운동 시간, 운동 형태 등의 요소를 이해하고 각 요소가 운동 처방에 어떻게 활용되는지를 이해하고 분석하도록 한다.","n":[],"p":110,"b":2},{"c":"[9체01-07]","k":"공통","sk":"","s":"체육(시각장애)","g":"중학교 1~3학년","d":"운동","t":"자신의 신체 조건이나 체력에 맞게 운동 처방 계획을 수립하고 안전하게 실천한다.","m":"은 운동 처방 원리에 따라 자신의 신체 조건이나 체력에 맞는 맞춤형 운동 처방을 실천하기 위해 설정하였다. 자신의 체격과 체력 발달 수준 검사, 운동 처방 목적 등을 고려하여 내용 설계, 실행, 평가 단계에 맞춰 운동 처방 프로그램을 안전하게 실천하도록 한다.","n":[],"p":110,"b":2},{"c":"[9체01-08]","k":"공통","sk":"","s":"체육(시각장애)","g":"중학교 1~3학년","d":"운동","t":"신체 건강의 의미를 이해하고 신체 건강 활동의 종류와 특성을 분석한다.","m":"은 신체 건강을 유지하기 위한 활동을 이해함으로써 신체적으로 건강한 생활을 계획하기 위해 설정하였다. 운동 습관, 식이 관리, 약물과 기호품 관리, 질병 예방 등 신체 건강에 영향을 미치는 다양한 활동과 실천 방법, 효과 등을 이해하고 분석하도록 한다.","n":[],"p":110,"b":2},{"c":"[9체01-09]","k":"공통","sk":"","s":"체육(시각장애)","g":"중학교 1~3학년","d":"운동","t":"자신에게 적합한 신체 건강 활동 방법을 실천한다.","m":"는 자신에게 필요한 신체 건강 활동을 실천하기 위해 설정하였다. 걷기, 스트레칭 등의 운동, 바른 자세, 올바른 식생활 및 기호품 관리, 약물 오남용 예방, 질병 예방 활동 등의 건강 활동을 일상생활에서 지속해서 실천하도록 한다.","n":[],"p":110,"b":2},{"c":"[9체01-10]","k":"공통","sk":"","s":"체육(시각장애)","g":"중학교 1~3학년","d":"운동","t":"정신 건강의 의미를 이해하고 정신 건강 활동의 종류와 특성을 분석한다.","m":"은 정신 건강을 유지하기 위한 활동을 이해함으로써 정서적, 심리적으로 건강한 생활을 계획하기 위해 설정하였다. 스트레스 및 감정 조절 등 정신 건강에 영향을 미치는 다양한 활동과 실천 방법 및 효과 등을 이해하고 분석하도록 한다.","n":[],"p":110,"b":2},{"c":"[9체01-11]","k":"공통","sk":"","s":"체육(시각장애)","g":"중학교 1~3학년","d":"운동","t":"자신에게 적합한 정신 건강 활동 방법을 실천한다.","m":"은 자신에게 필요한 정신 건강 활동을 실천하기 위해 설정하였다. 호흡법, 근육 이완법, 요가, 필라테스 등의 건강 활동을 일상생활에서 지속해서 실천하도록 한다.","n":[],"p":110,"b":2},{"c":"[9체01-12]","k":"공통","sk":"","s":"체육(시각장애)","g":"중학교 1~3학년","d":"운동","t":"사회적 건강의 의미를 이해하고 사회적 건강을 위한 활동의 종류와 특성을 분석한다.","m":"는 사회적 건강을 유지하기 위한 활동을 이해함으로써 사회 구성원으로서 건강하고 안전한 생활을 계획하기 위해 설정하였다. 양성평등 및 성 건강, 생활 안전 등 가정, 학교, 지역사회 공동체에서 자신과 타인, 집단의 건강한 생활에 필요한 방법을 이해하고 분석하도록 한다.","n":[],"p":110,"b":2},{"c":"[9체01-13]","k":"공통","sk":"","s":"체육(시각장애)","g":"중학교 1~3학년","d":"운동","t":"사회적으로 적합한 건강 활동 방법을 실천한다.","m":"은 사회 구성원에게 필요한 건강 활동을 실천하기 위해 설정하였다. 양성평등 및 성 건강 관련 활동, 생활 안전 활동, 재난⋅재해 예방 및 대처 활동, 응급처치 활동 등을 일상생활에서 지속해서 실천하며 긍정적인 사회적 관계를 형성해 나가도록 한다.","n":[],"p":110,"b":2},{"c":"[9체01-14]","k":"공통","sk":"","s":"체육(시각장애)","g":"중학교 1~3학년","d":"운동","t":"체력 운동을 하며 실천 의지와 인내심을 보이고 자기주도적으로 문제를 해결한다.","m":"는 체력 운동을 지속해서 실천하기 위해 설정하였다. 체력 운동 과정에서 발생할 수 있는 시간적, 공간적 제약과 개인의 의지 등의 문제를 이겨내고 목표와 활동 방법을 주어진 환경에 맞게 수정하여 자기주도적으로 활동을 지속하도록 한다.","n":[],"p":110,"b":2},{"c":"[9체01-15]","k":"공통","sk":"","s":"체육(시각장애)","g":"중학교 1~3학년","d":"운동","t":"건강 활동을 자율적으로 실천하며 자신과 공동체에 대한 안전을 추구한다.","m":"는 건강 활동을 자율적으로 실천하는 능력을 기르기 위해 설정하였다. 자신의 건강뿐만 아니라 타인과의 관계, 사회 전체의 건강한 환경 조성을 위한 바람직한 태도를 실천하도록 한다. 개인의 자율성과 주도성을 바탕으로 공동체의 건강을 위해 타인과 함께 건강하고 안전한 환경을 조성하는 일에 적극적으로 참여하도록 한다.","n":[],"p":110,"b":2},{"c":"[9체02-01]","k":"공통","sk":"","s":"체육(시각장애)","g":"중학교 1~3학년","d":"스포츠","t":"동작형 스포츠의 역사와 특성을 탐색하고 비교한다.","m":"","n":[],"p":113,"b":2},{"c":"[9체02-02]","k":"공통","sk":"","s":"체육(시각장애)","g":"중학교 1~3학년","d":"스포츠","t":"동작형 스포츠의 수행 원리를 적용하여 경기 기능을 수련하고 향상한다.","m":"","n":[],"p":113,"b":2},{"c":"[9체02-03]","k":"공통","sk":"","s":"체육(시각장애)","g":"중학교 1~3학년","d":"스포츠","t":"동작형 스포츠의 경기 방법을 이해하고 경기 전략을 상황에 맞게 활용하며 안전하게 경기한다.","m":"은 동작형 스포츠의 경기 방법을 이해하고, 자신과 팀의 경기 능력, 시설 및 용·기구 등을 파악하여 경기 상황에 맞게 경기 전략을 활용하기 위해 설정하였다. 동작형 스포츠 경기를 수행하며 동작의 완성도에 중점을 두고, 경기 과정에서 공중 동작, 착지 중 낙상 등 운동으로 인한 손상 없이 안전하게 경기하며 사고 발생 시 신속하게 대처하도록 한다.","n":[],"p":113,"b":2},{"c":"[9체02-04]","k":"공통","sk":"","s":"체육(시각장애)","g":"중학교 1~3학년","d":"스포츠","t":"시각 정도와 특성에 적합한 동작형 스포츠의 유형별 경기 기능, 경기 방법 및 전략을 익히고, 안전하게 경기한다.","m":"는 시각장애 정도와 특성에 적합한 동작형 스포츠의 경기 기능, 경기 방법 및 전략을 활용하여 실제 경기 상황에서 안전하게 경기를 수행하는 능력을 기르기 위해 설정하였다. 시각장애 학생이 동작형 스포츠 활동에 효과적으로 참여할 수 있도록 경기 기능 및 경기 방법을 수정하거나 조정하고 이를 경기에서 효과적으로 적용할 수 있도록 반복적으로 학습하도록 한다.","n":[],"p":113,"b":2},{"c":"[9체02-05]","k":"공통","sk":"","s":"체육(시각장애)","g":"중학교 1~3학년","d":"스포츠","t":"기록형 스포츠의 역사와 특성을 탐색하고 비교한다.","m":"","n":[],"p":113,"b":2},{"c":"[9체02-06]","k":"공통","sk":"","s":"체육(시각장애)","g":"중학교 1~3학년","d":"스포츠","t":"기록형 스포츠의 수행 원리를 적용하여 경기 기능을 수련하고 향상한다.","m":"","n":[],"p":113,"b":2},{"c":"[9체02-07]","k":"공통","sk":"","s":"체육(시각장애)","g":"중학교 1~3학년","d":"스포츠","t":"기록형 스포츠의 경기 방법을 이해하고 경기 전략을 상황에 맞게 활용하며 안전하게 경기한다.","m":" 2},{"c":"[9체03-11]","k":"공통","sk":"","s":"체육(시각장애)","g":"중학교 1~3학년","d":"표현","t":"현대 표현의 특성과 원리를 반영한 작품을 창작하고 표현 요소를 고려하여 감상한다.","m":"은 현대 표현의 특성과 원리를 반영한 작품을 창작하고 체계적으로 감상하기 위해설정하였다. 창조적 표현을 강조하는 현대 표현의 특성과 원리, 일련의 창작 과정을 고려하여 개인 또는 모둠별로 작품을 창작하고, 주제, 동작, 구성, 음악, 의상 등의 표현 요소를 고려하여 작품을 감상하도록 한다.","n":[],"p":120,"b":2},{"c":"[9체03-12]","k":"공통","sk":"","s":"체육(시각장애)","g":"중학교 1~3학년","d":"표현","t":"다양한 감각을 활용하여 현대 표현 동작을 시도하고, 작품을 감상한다.","m":"는 시각장애 학생이 현대 표현 동작을 수행하고 감상하는 능력을 기르기 위해 설정하였다. 현대 표현 동작을 익히고 시도하는 과정에서 자신이 선호하는 잔존 감각을 활용하며, 현대 표현의 특성을 고려하여 창작한 작품을 감상하도록 한다.","n":[],"p":120,"b":2},{"c":"[9체03-13]","k":"공통","sk":"","s":"체육(시각장애)","g":"중학교 1~3학년","d":"표현","t":"움직임을 표현하고 창작하는 과정에서 독창적이고 개방적인 태도를 갖고 표현 활동 작품을공감하고 비평한다.","m":"은 표현의 동작 수행, 창작, 감상의 전 과정을 통해 창의성과 비판적 능력을 기르기 위해 설정하였다. 동작 수행 및 창작 과정에서 독창성을 추구하고, 다양한 표현 문화를 수용하여, 작품 감상을 통해 예술적 표현에 대해 공감하고 비판적으로 바라보려는 태도를 함양하도록 한다.","n":[],"p":120,"b":2},{"c":"[4체01-01]","k":"공통","sk":"","s":"체육(지체장애)","g":"초등학교 3~4학년","d":"운동","t":"운동과 체력의 의미를 이해하고 관계를 파악한다.","m":"은 운동이 신체 변화와 체력 증진에 미치는 영향을 이해하기 위해 설정하였다. 운동과 체력의 의미를 이해하고 운동 전후의 신체 및 체력의 변화와 특성을 파악하여 운동의중요성을 인식하도록 한다.","n":[],"p":142,"b":2},{"c":"[4체01-02]","k":"공통","sk":"","s":"체육(지체장애)","g":"초등학교 3~4학년","d":"운동","t":"기본 체력 운동의 방법과 절차를 익히며 자신의 수준에 맞는 운동을 시도한다.","m":"는 체력 증진을 위한 기본 운동 방법과 절차를 체험하며 자신의 신체 특성과 체력 수준에 맞게 운동하기 위해 설정하였다. 준비 운동, 본 운동, 정리 운동의 단계별 목적과 주안점을 파악하면서 운동 방법과 절차를 익히고, 자신의 신체 특성과 체력 수준에 적합한 운동을 선택하여 안전하게 시도하도록 한다. 지체장애 학생도 자신의 신체 특성과 체력 수준을 고려하여 이에 맞는 운동을 선택하고, 체력 운동에 놀이와 게임 요소를 반영하여 재미있게 신체활동을 하도록 한다.","n":[],"p":142,"b":2},{"c":"[4체01-03]","k":"공통","sk":"","s":"체육(지체장애)","g":"초등학교 3~4학년","d":"운동","t":"운동과 건강의 의미를 이해하고 관계를 파악한다.","m":"은 운동과 건강의 관계를 이해하기 위해 설정하였다. 건강의 의미와 운동이 건강을 유지, 증진하는 데 미치는 영향을 탐색하고 운동의 필요성을 파악하여 지체장애 학생이 자신의 건강을 긍정적으로 인식하도록 한다.","n":[],"p":142,"b":2},{"c":"[4체01-04]","k":"공통","sk":"","s":"체육(지체장애)","g":"초등학교 3~4학년","d":"운동","t":"건강을 위한 바른 생활 습관을 이해하고 생활 속에서 규칙적으로 실천한다.","m":"는 건강을 유지하는 바른 생활 습관을 이해하고 일상생활에서 적극적으로 실천하는 습관을 기르기 위해 설정하였다. 건강한 생활 습관이 신체적 건강뿐만 아니라 정신적, 사회적 건강에도 영향을 미친다는 점을 이해하고, 건강 증진을 위한 생활 태도와 행동을 가정, 학교, 지역사회에서 규칙적으로 실천하도록 한다. 좌식 생활을 많이 하는 지체장애 학생의 경우 바른 자세 유지에 필요한 신체활동을 일상생활에서 규칙적으로 하도록 한다.","n":[],"p":142,"b":2},{"c":"[4체01-05]","k":"공통","sk":"","s":"체육(지체장애)","g":"초등학교 3~4학년","d":"운동","t":"자신의 신체적 특징을 긍정적으로 인식하고 적절한 운동 계획을 세워 안전하게 활동한다.","m":"는 기본 체력 운동을 통해 자신에게 적합한 운동 계획을 세우고 실천하기 위해 설정하였다. 체격, 체형, 체력 등 개인마다 다른 신체 특성을 긍정적으로 인식하고 자신의 신체 특성에 맞는 운동을 안전하고 효과적으로 수행하도록 한다.","n":[],"p":142,"b":2},{"c":"[4체01-06]","k":"공통","sk":"","s":"체육(지체장애)","g":"초등학교 3~4학년","d":"운동","t":"운동과 건강한 생활 습관 형성에 관심을 갖고 적극적으로 실천한다.","m":"은 운동을 통한 건강한 생활 습관 형성의 의지를 기르기 위해 설정하였다. 자신의 운동 및 생활 습관을 점검해 보고, 건강 유지, 증진의 저해 요인을 삼가며, 적절한 운동과 바람직한 생활 태도에 관심을 갖고 적극적으로 실천할 수 있는 의지를 갖도록 한다.","n":[],"p":142,"b":2},{"c":"[4체01-07]","k":"공통","sk":"","s":"체육(지체장애)","g":"초등학교 3~4학년","d":"운동","t":"다양한 지체장애의 유형과 신체적 특징을 이해하고 여러 가지 보조기기를 안전하게 사용한다.","m":"은 다양한 지체장애의 유형과 신체적 특징을 이해하고 지체장애 학생이 사용하는 여러 가지 보조기기에 대해 알아보기 위해 설정하였다. 지체장애 학생이 신체활동에 안전하고 즐겁게 참여하는 데 도움이 되는 적절한 보조기기를 선택하고 이를 활용하는 방법을 익히도록 한다.","n":[],"p":142,"b":2},{"c":"[4체01-08]","k":"공통","sk":"","s":"체육(지체장애)","g":"초등학교 3~4학년","d":"운동","t":"건전한 신체상을 확립하고 자신의 신체적 특징에 맞는 방식으로 안전하게 체력 운동을 실시한다.","m":"은 지체장애 학생이 건전한 신체상을 확립하고 이를 기초로 자신의 신체적 특징을 이해한 후 자신에게 맞는 방식으로 안전하게 운동하고 즐거운 경험을 갖기 위해 설정하였다. 객관적인 요인 외에 주관적인 심리적 요인이 신체상을 결정하는 데 영향을 미치므로 지제장애 학생이 자신의 외모, 건강 등을 긍정적으로 인식하도록 한다.","n":[],"p":142,"b":2},{"c":"[4체02-01]","k":"공통","sk":"","s":"체육(지체장애)","g":"초등학교 3~4학년","d":"스포츠","t":"스포츠의 의미와 유형을 파악한다.","m":"은 스포츠의 의미와 유형을 이해하기 위해 설정하였다. 일정한 규칙과 방법에 따라 경기 기술을 수행하고 환경과의 상호 작용을 통해 발달한 스포츠의 개념과 기술형, 전략형, 생태형 스포츠의 유형별 특성을 이해하도록 한다.","n":[],"p":145,"b":2},{"c":"[4체02-02]","k":"공통","sk":"","s":"체육(지체장애)","g":"초등학교 3~4학년","d":"스포츠","t":"기본 움직임 기술의 의미와 종류를 이해하고 스포츠와의 관계를 파악한다.","m":"는 기본 움직임 기술의 의미, 종류(이동 움직임, 비이동 움직임, 조작 움직임)와 특성을 파악하기 위해 설정하였다. 기본 움직임 기술의 종류를 다양하게 탐색하면서 스포츠 활동에 기초가 되는 기본 움직임 기술의 특성과 스포츠 활동 수행과의 관계를 파악하도록 한다.","n":[],"p":145,"b":2},{"c":"[4체02-03]","k":"공통","sk":"","s":"체육(지체장애)","g":"초등학교 3~4학년","d":"스포츠","t":"움직임 요소에 따른 기본 움직임 기술의 수행 방법을 파악하고 시도한다.","m":"은 움직임 요소의 의미를 이해하고, 기본 움직임 기술을 다양한 상황에서 시도하기 위해 설정하였다. 이동 움직임, 비이동 움직임, 조작 움직임 기술을 단계적으로 익히고, 움직임 요소(신체, 노력, 공간, 관계)에 변화를 주어 안전하고 효과적으로 기본 움직임 기술을 수행하도록 한다.","n":[],"p":145,"b":2},{"c":"[4체02-04]","k":"공통","sk":"","s":"체육(지체장애)","g":"초등학교 3~4학년","d":"스포츠","t":"기본 움직임 기술을 연결한 복합적인 움직임 기술을 파악하고 시도한다.","m":"는 기본 움직임 기술을 연결하여 다양하고 복합적인 움직임 기술을 수행하기 위해 설정하였다. 움직임 기술의 종류별(이동 움직임 기술 내 호핑과 스키핑의 연결 등), 종류 간(조작 움직임 기술의 치기와 이동 움직임 기술의 달리기의 연결 등)에 기본 움직임을 다양한 방식으로 연결하여 기본 움직임보다 심화된 복합적인 움직임 기술을 익히고, 간단한 게임 상황에서 시도하도록 한다.","n":[],"p":145,"b":2},{"c":"[4체02-05]","k":"공통","sk":"","s":"체육(지체장애)","g":"초등학교 3~4학년","d":"스포츠","t":"기술형 스포츠에 적합한 기본 움직임 기술을 파악하고 시도한다.","m":"는 기술형 스포츠 유형에 적합한 움직임 기술을 탐색하고 수행하기 위해 설정하였다. 움직임 기술의 수월성을 겨루는 기술형 스포츠 활동에서 활용되는 다양한 기능과 관련된 움직임 기술의 효과적 수행 방법(앞뒤 구르기, 옆돌기, 전력 달리기, 헤엄치기, 발차기 등)을 익히고, 간단한 게임 상황에서 시도하도록 한다.","n":[],"p":145,"b":2},{"c":"[4체02-06]","k":"공통","sk":"","s":"체육(지체장애)","g":"초등학교 3~4학년","d":"스포츠","t":"전략형 스포츠에 적합한 기본 움직임 기술을 파악하고 시도한다.","m":"은 전략형 스포츠 유형에 적합한 움직임 기술을 탐색하고 수행하기 위해 설정하였다. 움직임 기술과 전략에 따라 승패가 결정되는 전략형 스포츠 활동의 다양한 기능과관련된 움직임 기술의 효과적 수행 방법(공던지기와 잡기, 공 몰기, 공차기와 멈추기, 공치기와 받기, 라켓으로 치기 등)을 익히고, 기본적인 전략을 세워 간단한 게임 상황에서 시도하도록 한다.","n":[],"p":145,"b":2},{"c":"[4체02-07]","k":"공통","sk":"","s":"체육(지체장애)","g":"초등학교 3~4학년","d":"스포츠","t":"생태형 스포츠에 적합한 기본 움직임 기술을 파악하고 시도한다.","m":"은 생태형 스포츠 유형에 적합한 움직임 기술을 탐색하고 수행하기 위해 설정하였다. 생활 주변과 자연환경에서 이루어지는 다양한 생태형 스포츠 활동과 관련된 움직임 기술의 수행 방법(균형 잡고 이동하기, 타고 버티기, 잡고 오르기 등)을 익히고, 간단한 활동 상황에서 안전하게 시도하도록 한다.","n":[],"p":145,"b":2},{"c":"[4체02-08]","k":"공통","sk":"","s":"체육(지체장애)","g":"초등학교 3~4학년","d":"스포츠","t":"움직임 기술 수행에 자신감을 갖고 적극적으로 시도한다.","m":"은 기본 움직임 기술의 지속적인 시도를 통해 움직임 기술 수행에 대한 자신감을기르기 위해 설정하였다. 기본 움직임 기술을 체계적으로 숙달하고, 간단한 규칙을 적용한 활동 상황에서 적극적으로 시도하며 움직임 기술 수행에 대한 자신감을 갖도록 한다.","n":[],"p":145,"b":2},{"c":"[4체02-09]","k":"공통","sk":"","s":"체육(지체장애)","g":"초등학교 3~4학년","d":"스포츠","t":"게임 활동에 최선을 다하고 규칙을 지킨다.","m":"는 게임 활동을 수행하며 정해진 규칙을 지키고 최선을 다하는 태도를 기르기 위해 설정하였다. 다양한 유형의 스포츠 활동에 임하는 마음가짐, 구성원에 대한 태도, 규칙 준수의 필요성, 최선의 가치 등을 실제 활동 과정에서 느끼고 실천하도록 한다.","n":[],"p":145,"b":2},{"c":"[4체02-10]","k":"공통","sk":"","s":"체육(지체장애)","g":"초등학교 3~4학년","d":"스포츠","t":"다양한 스포츠 환경에 개방적인 태도를 갖고 적극적이고 안전하게 스포츠 활동에 참여한다.","m":"은 스포츠 활동을 즐길 수 있는 환경에 개방적인 태도를 갖고 적극적이고 안전하게 활동하는 태도를 기르기 위해 설정하였다. 가정, 학교, 지역사회 체육 시설, 자연환경 등 다양하고 도전적인 스포츠 환경을 적극적으로 수용하고 활용하되, 안전 수칙을 숙지하여 안전사고를 예방하는 태도를 실천하도록 한다.","n":[],"p":145,"b":2},{"c":"[4체02-11]","k":"공통","sk":"","s":"체육(지체장애)","g":"초등학교 3~4학년","d":"스포츠","t":"여러 가지 자세에서 수행할 수 있는 기본 움직임 기술을 연습하고 자신감 있는 태도로 수행한다.","m":"은 지체장애 학생이 자신의 장애 특성을 고려하여 눕거나 앉거나 서서 할 수 있는 기본 움직임 기술을 수행하기 위해 설정하였다. 신체적 특징을 고려하여 자신만의 방식으로 기본 움직임 기술을 수행할 때 자신감 있는 태도를 갖도록 한다.","n":[],"p":145,"b":2},{"c":"[4체03-01]","k":"공통","sk":"","s":"체육(지체장애)","g":"초등학교 3~4학년","d":"표현","t":"표현 활동의 의미와 기본 움직임 기술과의 관계를 파악한다.","m":"은 표현 활동의 의미, 표현 활동과 기본 움직임 기술과의 관계를 이해하기 위해 설정하였다. 표현 활동에서의 움직임 기술과 운동 및 스포츠 영역에서의 움직임 기술의 차이를 이해함으로써 표현 활동에서 움직임 기술의 창의적이고 심미적인 특성을 이해하도록 한다.","n":[],"p":148,"b":2},{"c":"[4체03-02]","k":"공통","sk":"","s":"체육(지체장애)","g":"초등학교 3~4학년","d":"표현","t":"움직임 요소에 따른 기본 움직임 기술의 표현 방법을 파악하고 시도한다.","m":"는 움직임 요소에 따른 다양한 기본 움직임 기술을 학습함으로써 표현 활동의 기본 수행 능력을 기르기 위해 설정하였다. 이동 움직임, 비이동 움직임, 조작 움직임 기술을 체험하되 신체, 노력, 공간, 관계 등 움직임 요소의 변화에 따라 기본 움직임 기술을 창의적이고 심미적으로 표현하도록 한다.","n":[],"p":148,"b":2},{"c":"[4체03-03]","k":"공통","sk":"","s":"체육(지체장애)","g":"초등학교 3~4학년","d":"표현","t":"기본 움직임 기술을 활용하여 사물이나 자연을 모방하여 표현한다.","m":"은 기본 움직임 기술을 활용한 모방 표현 능력을 기르기 위해 설정하였다. 기본 움직임 기술을 활용하여 사물, 인물, 자연 현상 등의 모양과 움직임을 모방하여 표현하는 방법을 탐색하고 그 특징을 살려 표현하도록 한다. 지체장애 학생이 사물이나 자연을 모방하여 표현할 때 다양한 표현 방식과 도구를 활용하도록 한다.","n":[],"p":148,"b":2},{"c":"[4체03-04]","k":"공통","sk":"","s":"체육(지체장애)","g":"초등학교 3~4학년","d":"표현","t":"기본 움직임 기술을 활용하여 느낌이나 생각을 표현한다.","m":"는 기본 움직임 기술을 활용한 추상 표현 능력을 기르기 위해 설정하였다. 기본 움직임 기술을 활용하여 느낌과 생각 등을 동작으로 표현하는 방법을 탐색하고 창의적으로 표현하도록 한다.","n":[],"p":148,"b":2},{"c":"[4체03-05]","k":"공통","sk":"","s":"체육(지체장애)","g":"초등학교 3~4학년","d":"표현","t":"기본 움직임 기술을 리듬에 맞춰 표현한다.","m":"는 기본 움직임 기술을 활용한 리듬 표현 능력을 기르기 위해 설정하였다. 기본 움직임 기술을 활용하여 박자, 강약, 빠르기, 패턴에 맞춰 표현하는 방법을 탐색하고 리듬감을 살려 표현하도록 한다.","n":[],"p":148,"b":2},{"c":"[4체03-06]","k":"공통","sk":"","s":"체육(지체장애)","g":"초등학교 3~4학년","d":"표현","t":"기본 움직임 기술을 도구를 활용하여 표현한다.","m":"은 기본 움직임 기술을 활용한 도구 표현 능력을 기르기 위해 설정하였다. 기본 움직임 기술을 활용하여 줄, 공, 천, 훌라후프 등 도구의 특성을 활용한 표현 방법을 탐색하고 도구의 조작과 움직임을 연결하여 표현하도록 한다.","n":[],"p":148,"b":2},{"c":"[4체03-07]","k":"공통","sk":"","s":"체육(지체장애)","g":"초등학교 3~4학년","d":"표현","t":"움직임의 심미적 표현에 대한 호기심과 감수성을 나타낸다.","m":"은 움직임을 심미적으로 표현하는 것에 대한 호기심과 감수성을 갖도록 설정하였다. 기본 움직임 기술을 아름답게 표현하며 움직임을 심미적으로 표현하는 다양한 자극에 관심을 갖고 운동이나 스포츠 기술과는 다른 감성을 느낄 수 있도록 한다.","n":[],"p":148,"b":2},{"c":"[4체03-08]","k":"공통","sk":"","s":"체육(지체장애)","g":"초등학교 3~4학년","d":"표현","t":"장애 특성에 따라 움직일 수 있는 신체 부위를 활용하여 적극적으로 표현한다","m":"은 자신이 움직일 수 있는 신체 부위를 주로 활용하여 단순한 움직임부터 복잡한 움직임, 리듬과 도구를 활용한 움직임까지 수행하게 하고자 설정하였다. 기본 움직임 기술을 심미적 방법으로 탐색하고 창의적 방식으로 활동을 수행하며 적극적인 태도로 표현하도록 한다.","n":[],"p":148,"b":2},{"c":"[6체01-01]","k":"공통","sk":"","s":"체육(지체장애)","g":"초등학교 5~6학년","d":"운동","t":"건강 체력과 운동 체력의 의미와 요소를 파악하고 다양한 운동 방법을 탐색한다.","m":"은 3~4학년군에서 학습한 기본 운동 방법을 체력 요소별로 구분하여 이해하고 체력 요소별로 다양한 운동 방법을 탐색하기 위해 설정하였다. 체력을 건강 체력과 운동 체력으로 구분하고, 유형별 체력 요소를 이해하며, 학습자 스스로 자신의 수준에 적합한 체력 요소별 운동 방법을 찾도록 한다.","n":[],"p":152,"b":2},{"c":"[6체01-02]","k":"공통","sk":"","s":"체육(지체장애)","g":"초등학교 5~6학년","d":"운동","t":"건강 체력과 운동 체력을 측정하고 자신의 체력 수준에 맞는 운동을 시도한다.","m":"는 자신의 건강 체력과 운동 체력 수준을 파악하여 체력을 증진할 수 있는 다양한 운동 방법을 선택하고 실천하기 위해 설정하였다. 자신의 우수한 체력과 부족한 체력이 무엇인지를 파악하고, 특히 부족한 체력을 기르기 위해 체력 수준에 적합한 운동 방법을 탐색하여 꾸준하게 실천하도록 한다. 지체장애 학생은 ‘장애학생건강체력평가(PAPS-D)’로 자신의 체력 수준을 파악하고 장애 특성을 고려한 운동에 참여하도록 한다.","n":[],"p":152,"b":2},{"c":"[6체01-03]","k":"공통","sk":"","s":"체육(지체장애)","g":"초등학교 5~6학년","d":"운동","t":"성장 발달의 의미와 특성을 이해하고 운동과의 관계를 파악한다.","m":"은 자신의 성장 발달을 이해하고, 운동이 성장 발달에 미치는 긍정적인 영향을 이해하기 위해 설정하였다. 성장에 따른 신체적, 정서적 변화, 특히 제2차 성징에 대한 이해를 바탕으로 자신의 성장 발달 양상을 긍정적으로 파악하고, 사춘기에 운동이 신체적, 정서적, 사회적 성장 발달에 바람직한 영향을 미친다는 점을 이해하도록 한다.","n":[],"p":152,"b":2},{"c":"[6체01-04]","k":"공통","sk":"","s":"체육(지체장애)","g":"초등학교 5~6학년","d":"운동","t":"운동 및 생활 속 위험 상황, 성장 발달을 저해하는 생활 방식의 문제점을 파악하고 예방 및 대처 방법을 익혀 안전하게 활동한다.","m":"는 운동과 일상생활에서 발생할 수 있는 다양한 안전사고의 유형과 성장 발달을 저해하는 생활 방식의 문제점을 파악하고 침착하게 대처하기 위해 설정하였다. 운동 시설이나 용⋅기구, 지상⋅수상⋅빙상 등의 다양한 운동 환경에서 발생할 수 있는 안전사고, 건강한 성장 발달에 부정적인 생활 습관(흡연, 음주, 약물 오⋅남용 등), 안전을 위협하는 생활 및 자연 환경을 탐색하며 건강하고 안전한 생활 습관을 실천하도록 한다. 지체장애 학생의 특성과 상황을 고려하여 위험 상황에서 안전하고 신속하게 대피할 수 있도록 대안적인 대처 방법을 익히도록 한다.","n":[],"p":152,"b":2},{"c":"[6체01-05]","k":"공통","sk":"","s":"체육(지체장애)","g":"초등학교 5~6학년","d":"운동","t":"체력 운동을 끈기 있게 규칙적으로 수행한다.","m":"는 체력 증진에 필요한 끈기와 근면성을 기르기 위해 설정하였다. 단기간에 증진되기 어려운 체력 운동의 특성상, 학습자가 운동 과정에서 쉽게 포기하지 않도록 체력 증진을 저해하는 개인적, 환경적 조건을 탐색하고 극복하면서 체력 운동을 규칙적으로 수행하도록 한다.","n":[],"p":152,"b":2},{"c":"[6체01-06]","k":"공통","sk":"","s":"체육(지체장애)","g":"초등학교 5~6학년","d":"운동","t":"성장과 발달 과정에서 나타나는 신체적, 정서적, 사회적 특성과 차이를 공감하고 위험 상황에 침착하게 대처한다.","m":"은 성장과 발달 과정에서 개인별 차이를 공감하며, 안전을 위협하는 위험 상황에 대처하기 위해 설정하였다. 자신의 신체적, 정서적, 사회적 건강 특성이 다른 사람과 어떤 차이가 있고, 그러한 차이를 공감하는 것이 자신과 공동체에 어떤 영향을 미치는지를 실제 사례를 통해 이해하도록 한다.","n":[],"p":152,"b":2},{"c":"[6체01-07]","k":"공통","sk":"","s":"체육(지체장애)","g":"초등학교 5~6학년","d":"운동","t":"일상생활을 할 때와 운동할 때 사용하는 보조기기의 사용 방법을 이해하고 안전하게 관리한다.","m":"은 지체장애 학생이 일상생활을 할 때와 운동할 때 사용하는 보조기기를 안전하게 사용하고 관리하는 능력을 기르게 하고자 설정하였다. 급격히 성장하는 시기이므로 보조기기를 몸에 맞게 조절하고 미끄러짐, 낙상 등의 안전사고가 발생하지 않도록 한다.","n":[],"p":152,"b":2},{"c":"[6체02-01]","k":"공통","sk":"","s":"체육(지체장애)","g":"초등학교 5~6학년","d":"스포츠","t":"기술형 스포츠의 의미와 유형을 파악한다.","m":"은 기술형 스포츠의 의미와 유형을 이해하기 위해 설정하였다. 기술의 수월성을 추구하는 기술형 스포츠의 의미를 이해하고 다양한 환경(지상, 수상, 빙상 등)에서의 움직임 기록 향상을 위한 기록형, 일련의 절차와 방법이 정해진 움직임을 정확하게 수행하는 동작형, 상대방의 신체적 기량과 겨루는 투기형으로 구분하여 유형별 움직임의 세부 특성을 파악하도록 한다.","n":[],"p":155,"b":2},{"c":"[6체02-02]","k":"공통","sk":"","s":"체육(지체장애)","g":"초등학교 5~6학년","d":"스포츠","t":"기술형 스포츠 유형별로 기본 움직임 기술을 응용한 기본 기능을 파악하고 수행한다.","m":"는 기록형, 동작형, 투기형 스포츠에서 기본 움직임 기술을 응용한 기본 기능을 효과적으로 활용하기 위해 설정하였다. 속도와 거리, 정확성에 도전하는 기록형 스포츠의 기본 기능(도움닫기 하여 멀리뛰기, 목표물에 정확히 던지기 등), 절차와 방법이 정해진 움직임을 수행하는 동작형 스포츠의 기본 기능(손 짚고 옆돌기, 다리 벌려 뛰어넘기 등), 상대방과 신체적 기술을 겨루는 투기형 스포츠의 기본 기능(발차기, 다리 걸기 등)을 게임 상황에 맞게 효율적으로 수행하도록 한다.","n":[],"p":155,"b":2},{"c":"[6체02-03]","k":"공통","sk":"","s":"체육(지체장애)","g":"초등학교 5~6학년","d":"스포츠","t":"기술형 스포츠 유형별 활동 방법을 파악하고 기본 전략을 게임 활동에 수행한다.","m":"은 기록형, 동작형, 투기형 스포츠의 활동 방법과 기본 전략을 활용하기 위해 설정하였다. 기록형, 동작형, 투기형 스포츠를 변형한 게임 활동의 경기 방법을 이해하고, 기록 측정과 분석, 동작 수행의 점검과 분석, 자신과 상대의 기량 확인과 분석 등 기술형 스포츠의 기본 전략을 파악하고 수행하도록 한다. 지체장애 학생이 게임 활동에 배제되지 않도록 하고 새로운 기술에 도전하도록 한다.","n":[],"p":155,"b":2},{"c":"[6체02-04]","k":"공통","sk":"","s":"체육(지체장애)","g":"초등학교 5~6학년","d":"스포츠","t":"전략형 스포츠의 의미와 유형을 파악한다.","m":"는 전략형 스포츠의 의미와 유형을 이해하기 위해 설정하였다. 움직임 기능 수행 능력과 전략에 따라 승패가 결정되는 전략형 스포츠의 의미를 이해하고 스포츠의 유형을 상대 영역으로 이동하여 정해진 지점으로 공을 보내 득점하는 영역형, 동일 공간에서 공격과 수비를 번갈아 하며 정해진 구역을 돌아 점수를 얻는 필드형, 네트 너머에 있는 상대 영역에 공을 보내 넘기지 못하게 하여 득점하는 네트형으로 구분하여 각각의 세부 특성을 파악하도록 한다.","n":[],"p":155,"b":2},{"c":"[6체02-05]","k":"공통","sk":"","s":"체육(지체장애)","g":"초등학교 5~6학년","d":"스포츠","t":"전략형 스포츠 유형별로 기본 움직임 기술을 응용한 기본 기능을 파악하고 수행한다.","m":"는 영역형, 필드형, 네트형 스포츠에서 기본 움직임 기술을 응용한 기본 기능을 효과적으로 활용하기 위해 설정하였다. 패스, 드리블, 슛 등과 같은 영역형 스포츠의 기본 기능, 포구, 송구, 타격, 주루 등과 같은 필드형 스포츠의 기본 기능, 서브, 리시브, 토스, 스트로크(스매싱) 등과 같은 네트형 스포츠의 기본 기능을 변형게임이나 뉴스포츠 수준의 게임 상황에 맞게 효율적으로 수행하도록 한다.","n":[],"p":155,"b":2},{"c":"[6체02-06]","k":"공통","sk":"","s":"체육(지체장애)","g":"초등학교 5~6학년","d":"스포츠","t":"전략형 스포츠 유형별 활동 방법을 파악하고 기본 전략을 게임 활동에 수행한다.","m":"은 영역형, 필드형, 네트형 스포츠의 활동 방법과 기본 전략을 활용하기 위해 설정하였다. 영역형, 필드형, 네트형 스포츠를 변형한 게임이나 뉴스포츠와 같은 게임 활동에 참여하며 경기 방법을 파악하고, 공간 만들기, 공간 차단하기, 골 넣기와 막기, 빈 곳으로 공 치기, 구역과 역할 나누어 수비하기, 빈 곳으로 공 넘기기, 유기적으로 역할 분담하기 등 전략형 스포츠의 기본 전략을 파악하고 수행하도록 한다. 지체장애 학생이 게임 활동에 배제되지 않도록 하고 팀 내에서 의미 있는 역할을 수행하도록 한다.","n":[],"p":155,"b":2},{"c":"[6체02-07]","k":"공통","sk":"","s":"체육(지체장애)","g":"초등학교 5~6학년","d":"스포츠","t":"생태형 스포츠의 의미와 유형을 파악한다.","m":"은 생태형 스포츠의 의미와 유형을 이해하기 위해 설정하였다. 다양한 환경 맥락에 따라 활동 특성이 나타나는 생태형 스포츠의 의미에 관한 이해를 바탕으로 생활 주변의 환경을 이용하여 활동하는 생활환경형, 자연환경과 상호 작용하며 활동하는 자연환경형으로구분하여 유형별 세부 특성을 파악하도록 한다.","n":[],"p":155,"b":2},{"c":"[6체02-08]","k":"공통","sk":"","s":"체육(지체장애)","g":"초등학교 5~6학년","d":"스포츠","t":"생태형 스포츠 유형별로 기본 움직임 기술을 응용한 기본 기능을 파악하고 수행한다.","m":"은 생활환경형, 자연환경형 스포츠에서 기본 움직임 기술을 응용한 기본 기능을 효과적으로 활용하기 위해 설정하였다. 주변 생활환경에서 할 수 있는 골프형 게임, 디스크형 게임, 자전거 타기, 롤러스케이팅, 클라이밍 활동, 민속놀이 등과 자연환경에서 체험할 수 있는 등산 활동, 캠핑 활동, 수상 활동, 설상 활동 등 생태형 스포츠의 기본 기능을 익혀 주변의 다양한 활동 상황에 맞게 환경친화적으로 수행하도록 한다.","n":[],"p":155,"b":2},{"c":"[6체02-09]","k":"공통","sk":"","s":"체육(지체장애)","g":"초등학교 5~6학년","d":"스포츠","t":"생태형 스포츠 유형별 활동 방법을 파악하고 기본 전략을 게임 활동에 수행한다.","m":"는 생활환경형, 자연환경형 스포츠의 활동 방법과 기본 전략을 활용하기 위해 설정하였다. 생활환경형, 자연환경형 스포츠를 변형한 게임이나 뉴스포츠 수준의 활동에 참여하며 활동 방법을 파악하고 스포츠 환경에 적합한 활동의 선정과 장비 사용, 안전하고 환경친화적인 활동과 정리 등 생태형 스포츠의 기본 활동 방법과 전략을 파악하고 수행하도록 한다.","n":[],"p":155,"b":2},{"c":"[6체02-10]","k":"공통","sk":"","s":"체육(지체장애)","g":"초등학교 5~6학년","d":"스포츠","t":"스포츠 활동에 참여하며 목표를 달성하기 위한 의지를 실천하고 상대의 기술을 인정한다.","m":"은 스포츠 활동에 참여하며 목표 달성을 위한 의지와 상대 기술을 인정하는 태도를 기르기 위해 설정하였다. 스스로 목표를 설정하고 책임감 있게 꾸준히 실천하도록 하며, 함께 참여하는 상대 팀과 구성원의 우수한 기술을 인정하고 배우는 태도를 실천하도록 한다.","n":[],"p":155,"b":2},{"c":"[6체02-11]","k":"공통","sk":"","s":"체육(지체장애)","g":"초등학교 5~6학년","d":"스포츠","t":"스포츠 활동에 참여하며 팀원과 협력하고 구성원을 배려한다.","m":"은 스포츠에 참여하며 팀원과 협력하고 구성원을 배려하는 태도를 기르기 위해 설정하였다. 민주적인 의사 결정을 통해 역할을 분담하고 전략을 수립하는 등 팀원과의 협력을 강조하며, 기능 수행에 어려움을 겪는 학습자를 도와주고 배려함으로써 팀의 활동 성과를 공유하도록 한다.","n":[],"p":155,"b":2},{"c":"[6체02-12]","k":"공통","sk":"","s":"체육(지체장애)","g":"초등학교 5~6학년","d":"스포츠","t":"스포츠 활동에 참여하며 환경을 아끼고 감사하는 태도를 실천한다.","m":"는 스포츠 활동 환경을 아끼고 감사하는 태도를 기르기 위해 설정하였다. 주변의다양한 스포츠 시설 및 용⋅기구 현황을 탐색하고 이를 적극적으로 활용하면서 학교 및 지역사회가 제공하는 스포츠 복지의 중요성을 이해하도록 한다. 또한 스포츠 환경을 아끼고 보존함으로써 지속해서 혜택을 누릴 수 있다는 점에 감사함을 느낄 수 있도록 한다.","n":[],"p":155,"b":2},{"c":"[6체02-13]","k":"공통","sk":"","s":"체육(지체장애)","g":"초등학교 5~6학년","d":"스포츠","t":"좌식 및 휠체어 스포츠의 유형별 활동 방법과 기본 전략을 익히고 적용하며 자신의 운동 능력을 고려하여 안전하게 참여한다.","m":"은 좌식 및 휠체어 스포츠에 필요한 기초 기능과 효과적인 수행 방법을 익히고 이를 스포츠 활동에 적용하게 하고자 설정하였다. 좌식 및 휠체어 스포츠에 참여하는 과정에서 자신의 운동 능력과 건강상의 특성을 고려하여 안전하게 활동하도록 한다.","n":[],"p":155,"b
