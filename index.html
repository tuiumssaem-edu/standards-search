g":"중학교 1~3학년","d":"물질","t":"물질의 성질을 이용하여 여러 가지 혼합물을 분리한다.","m":"이 성취기준은 간이 정수기를 사용하거나, 물에 뜨는 성질, 증발, 거름 장치를 이용해 액체 혼합물 분리하기, 크기, 무게, 자석에 붙는 성질에 따라 고체 혼합물 분리하기, 밀도, 끓는점, 용해도 등 물질의 성질에 따라 혼합물 분리하기 등의 내용을 다룬다. 일상생활에서 혼합물을 분리하는 방법이 이용되는 다양한 예를 찾아 일상생활에서 혼합물 분리가 자주 이용되고 있음을 이해하고, 여러 가지 혼합물을 적극적인 태도로 분리한다.","n":["이 성취기준은 장애 정도가 심한 학생의 경우 주위에서 혼합물의 상태로 존재하는 다양한 물질을 찾아보고, 일상생활에서 혼합물을 분리하는 다양한 사례를 직접 관찰한다. 또, 학생이 자주 마시거나 사용하는 액체를 활용하여 액체의 색과 향을 직접 관찰한다. 시각장애를 동반한 학생의 경우 색에 대한 언어적 정보, 경사로에 흐르는 액체를 직접 만져보는 촉각적 경험 등을 제공하여 액체의 성질을 다감각적으로 경험한다."],"p":227,"b":3},{"c":"[9과학02-02]","k":"기본","sk":"","s":"과학","g":"중학교 1~3학년","d":"물질","t":"일상생활에서 이용하는 액체의 성질을 조사한다.","m":"이 성취기준은 액체의 색과 향을 관찰하기, 경사로에 액체 흘리기, 여러 가지 모양 틀에 액체 담기, 눈금실린더로 액체의 부피 측정하기 등의 내용을 다룬다. 색, 향과 같은 겉보기 성질에 따라 생활 주변의 액체를 관찰하고, 일상생활에서 액체가 흐르는 모습, 여러 장소의 물의 모양을 살펴본다. 또한, 계량컵, 눈금실린더 등 일상생활에서 부피를 측정하는 기구를 사용하여 액체의 부피를 측정한다.","n":["이 성취기준은 장애 정도가 심한 학생의 교육적 요구에 따라 여러 가지 액체의 색과 향 관찰하기, 계량컵이나 눈금실린더를 이용하여 액체의 부피 측정하기 등으로 성취기준을 재구성하여 적용할 수 있다."],"p":227,"b":3},{"c":"[9과학02-03]","k":"기본","sk":"","s":"과학","g":"중학교 1~3학년","d":"물질","t":"용질의 종류와 물의 온도에 따라 물에 녹는 용질의 양이 달라짐을 비교한다.","m":"이 성취기준은 물의 양과 온도가 같을 때, 용질의 종류에 따라 용질의 녹는 양 비교하기, 물의 양과 용질의 종류가 같을 때, 물의 온도에 따라 용질의 녹는 양 비교하기 등의 내용을 다룬다. 이때 녹는 시간보다 녹는 양에 초점을 두어 학습하는 데 주안점을 둔다. 나아가 물에 녹는 용질의 양에 영향을 미치는 요인을 찾아, 커피 가루나 설탕 등 일상생활에서 사용하는 다양한 물질을 물에 많이 녹이는 방법을 적용한다. 여러 가지 물질을 물에 녹여 봄으로써 끈기를 기를 수 있다.","n":["이 성취기준은 장애 정도가 심한 학생의 경우 물의 온도와 양의 차이를 크게 두어 결과를 명확하게 관찰한다. 혹은 따뜻한 물에 용질 녹이기, 물의 양이 많은 비커에 용질 녹이기 등의 활동으로 성취기준을 재구성하여 적용할 수 있다. 시각장애를 동반한 학생의 경우 따뜻한 물과 차가운 물을 만져보거나, 물의 양이 많은 비커와 적은 비커에 손을 넣어 보는 등 촉각적 경험을 통해 용질을 물에 많이 녹이는 방법을 습득한다."],"p":227,"b":3},{"c":"[9과학02-04]","k":"기본","sk":"","s":"과학","g":"중학교 1~3학년","d":"물질","t":"우리 주변에서 물의 세 가지 상태와 상태 변화의 예를 찾는다.","m":"이 성취기준은 물이 얼 때와 녹을 때의 무게와 부피 변화 관찰하기, 물이 증발할 때와 끓을 때의 변화 관찰하기, 물 끓여 수증기 만들기, 수증기가 응결할 때의 변화 관찰하기 등의 내용을 다룬다. 물의 상태 변화를 끈기 있는 태도로 관찰하고, 일상생활에서 일어나는 물의 상태 변화의 예를 찾으며 물의 상태 변화가 일상생활에서 어떻게 이용되는지 알아본다.","n":["이 성취기준은 장애 정도가 심한 학생의 교육적 요구에 따라 아이스크림 만들기, 음료수 속 얼음이 녹는 모양 관찰하기 등으로 성취기준을 재구성하여 적용할 수 있다. 시각장애를 동반한 학생의 경우 일상생활에서 물의 세 가지 상태를 직접 만져볼 수 있도록 다양한 촉각 자료를 제공하고, 물의 세 가지 상태에 대한 차이점을 언어적 정보와 함께 제공하여 다양하게 경험하도록 한다."],"p":227,"b":3},{"c":"[9과학03-01]","k":"기본","sk":"","s":"과학","g":"중학교 1~3학년","d":"생명","t":"감각기관의 구조와 기능을 관찰한다.","m":"이 성취기준은 외부 자극을 인식하는 감각기관의 구조를 관찰하고 기능을 확인하는 활동을 수행한다. 외부로 드러나는 감각기관뿐만 아니라 기관 내부의 구조를 관찰하고, 역할을 확인하는 내용을 다룬다. 감각기관 내부의 해부학적인 명칭을 강조하기보다는 빛의 양을 조절하는 동공, 귀로 들어온 소리를 진동시키는 고막 등 작동 과정을 중심으로 활동 내용을 구성한다.","n":[],"p":229,"b":3},{"c":"[9과학03-02]","k":"기본","sk":"","s":"과학","g":"중학교 1~3학년","d":"생명","t":"우리 몸을 구성하는 뼈와 근육의 생김새와 기능을 관찰한다.","m":"이 성취기준은 우리 몸을 지탱하는 뼈와 근육의 생김새와 명칭을 익히고 움직임과 기능 관찰하기, 뼈와 근육의 역할 확인하기 등의 내용을 다루며, 이를 통해 건강을 유지하는 생활 방식을 실천한다. 신체 각 기관을 이루거나 보호하는 뼈와 근육의 위치와 생김새를 인체 모형, 그림, 동영상 자료 등을 통하여 간접적으로 관찰하거나 손으로 만져 보는 활동, 뼈와 근육의 역할을 조사하는 활동 등으로 구성한다. 뼈와 근육의 신체 부위별 명칭을 머리뼈, 갈비뼈 등과 같이 다루고 움직임과 역할을 중심으로 내용을 구성하여 어려운 명칭이 사용되지 않도록 유의한다.","n":[],"p":229,"b":3},{"c":"[9과학03-03]","k":"기본","sk":"","s":"과학","g":"중학교 1~3학년","d":"생명","t":"다양한 환경에 서식하는 동물을 관찰하고, 동물의 생김새와 생활 방식이 환경과 관련되어 있음을 인식한다.","m":"이 성취기준은 땅, 물, 나무 위, 사막 등과 같이 다양한 환경에 서식하는 동물의 생김새와 생활 방식 관찰하기, 서식지의 환경이 같은 동물들의 공통적인 특징 조사하기 등의 내용을 다룬다. 동물의 생김새와 생활 방식이 서식지의 환경과 관련이 있음을 탐구하는 과정에서 동물의 다양성을 이해한다.","n":[],"p":230,"b":3},{"c":"[9과학03-04]","k":"기본","sk":"","s":"과학","g":"중학교 1~3학년","d":"생명","t":"다양한 환경에 서식하는 식물을 관찰하고, 식물의 생김새와 생활 방식이 환경과 관련되어 있음을 인식한다.","m":"이 성취기준은 들이나 산, 강이나 연못, 사막 등 다양한 환경에 서식하는 식물의 생김새와 생활 방식 관찰하기, 서식지의 환경이 같은 식물들의 공통적인 특징 조사하기 등의 내용을 다룬다. 식물의 생김새와 생활 방식이 서식지의 환경과 관련이 있음을 탐구하는 과정에서 식물의 다양성을 이해한다.","n":[],"p":230,"b":3},{"c":"[9과학03-05]","k":"기본","sk":"","s":"과학","g":"중학교 1~3학년","d":"생명","t":"식물의 생장에 환경이 중요함을 알고, 실험을 통해 식물의 생장 조건을 찾는다.","m":"이 성취기준은 변인 통제 실험을 통해 환경 조건이 식물의 생장에 미치는 영향을 관찰함으로써 씨가 싹트는 데 필요한 조건, 식물이 자라는 데 필요한 조건 등을 찾는 내용을 다룬다. 실험에서 같게 할 조건, 다르게 할 조건을 구분하고 실험 결과를 예상하고 확인하는 등의 탐구과정을 통해 환경 조건이 식물의 생장에 영향을 미치고 있음을 인식하는 데 주안점을 둔다.","n":["이 성취기준은 장애 정도가 심한 학생의 교육적 요구에 따라 가정과 학교 등 일상생활 환경에서 정해진 시간에 화분에 물 주기 등 식물의 생장 조건을 고려하여 식물을 관리하는 활동 등으로 성취기준을 재구성하여 적용할 수 있다."],"p":230,"b":3},{"c":"[9과학03-06]","k":"기본","sk":"","s":"과학","g":"중학교 1~3학년","d":"생명","t":"생태계를 생물 요소와 비생물 요소로 분류한다.","m":"이 성취기준은 생태계를 구성하는 동물, 식물 등 다양한 생물 요소 인식하기, 생물 요소 중 생산자, 소비자와 분해자의 개념 및 역할 구분하기, 빛･온도･물 등으로 구성된 비생물 환경요소 인식하기, 생물 요소와 비생물 요소 분류하기 등의 내용을 다룬다. 수질 오염·대기 오염·토양 오염 등으로 인한 비생물 환경 요소의 급격한 변화 문제와 해결방안 탐색 등을 통해 생태계 보호에 관심을 둔다.","n":[],"p":231,"b":3},{"c":"[9과학04-01]","k":"기본","sk":"","s":"과학","g":"중학교 1~3학년","d":"지구","t":"육지의 물과 비교하여 바닷물의 특징을 알고, 밀물과 썰물에 따른 바닷가의 모습을 관찰한다.","m":"이 성취기준은 육지의 물과 바닷물을 여러 가지 방법으로 관찰하여 서로 비교하고, 바닷물에서 바람이 세게 불 때와 약하게 불 때 파도의 모습을 시청각 자료 및 모형을 이용한 실험을 통하여 알아본다. 밀물일 때의 바닷가 모습과 썰물일 때의 바닷가 모습을 비교하여 그 현상을 관찰하되 밀물과 썰물이 생기는 원리에 관한 내용은 다루지 않는다.","n":[],"p":232,"b":3},{"c":"[9과학04-02]","k":"기본","sk":"","s":"과학","g":"중학교 1~3학년","d":"지구","t":"바닷물의 작용으로 만들어진 바닷가 주변 지형을 관찰한다.","m":"이 성취기준은 바닷가 주변 지형의 모습을 관찰하는 활동이다. 파도에 의한 침식, 운반과 퇴적을 중심으로 한 지표의 느린 변화에 관한 내용을 다룬다. 체험 학습과 연계한 야외 관찰 활동 또는 시청각 자료를 활용하여 바닷가 주변의 특이한 지형을 관찰하며 바닷물의 어떤 작용으로 인하여 만들어진 지형인지 호기심을 가지고 탐구한다.","n":["장애 정도가 심한 학생의 교육적 요구에 따라, 해당 성취기준 내용을 바탕으로 바닷가 주변 지형의 모습을 대신하여 흐르는 물 또는 파도의 작용으로 땅의 모양이 변화하는 모습을 모형 실험을 통해 시각 및 촉각을 이용하여 관찰하는 활동 등으로 성취기준을 재구성하여 적용할 수 있다."],"p":232,"b":3},{"c":"[9과학04-03]","k":"기본","sk":"","s":"과학","g":"중학교 1~3학년","d":"지구","t":"계절별로 달라지는 날씨의 특징을 알고, 날씨에 따른 생활 모습을 비교한다.","m":"이 성취기준은 계절별로 달라지는 날씨의 특징을 알아보고, 계절별 자연 모습, 옷차림 등 학생들의 생활 속에서 쉽게 발견할 수 있는 내용으로 비교한다. 기후와 계절이 변하는 까닭 등은 다루지 않는다. 학생들이 계절별 날씨의 특징에 관심을 두고 생활 속에서 적절히 대처하는 능력을 기르는 데 주안점을 둔다.","n":["장애 정도가 심한 학생의 교육적 요구에 따라 계절별 날씨의 특징을 비교하는 내용을 대신하여 우리 생활에서 날씨에 적절하게 대처하는 방법으로 계절별 날씨에 어울리는 옷차림과 도구 고르기 등과 같이 생활 중심 활동을 익히는 것으로 성취기준을 재구성하여 적용할 수 있다."],"p":233,"b":3},{"c":"[9과학04-04]","k":"기본","sk":"","s":"과학","g":"중학교 1~3학년","d":"지구","t":"기후변화 현상의 예를 알고, 생활 속에서 대응 방법을 조사한다.","m":"이 성취기준은 기후변화 현상 중 지구 온난화를 중심으로 다룬다. 기후변화 현상의 사례(예: 오존층 파괴, 해수면 상승, 폭염, 집중호우)를 알아보고, 기후변화가 생활에 어떤 영향을 미치는지 조사한다. 또한 지구의 날과 기후변화 주간, 생활 속 탄소중립, 기후변화 센터와의 체험 학습 연계 등을 활용할 수 있다. 기후변화의 예방 및 대처 방법을 탐구하여 생활 속에서 실천하는 능력을 기르는 데 주안점을 둔다.","n":[],"p":233,"b":3},{"c":"[9과학04-05]","k":"기본","sk":"","s":"과학","g":"중학교 1~3학년","d":"지구","t":"자연재해의 피해 사례를 조사하고, 자연재해에 대한 생활 속 대응 방법을 실천한다.","m":"이 성취기준은 기상 지해와 지질 재해 중에서 태풍, 집중호우, 홍수, 폭설, 가뭄 등 기상 재해만을 다룬다. 자연재해에 따른 피해 사례를 관련 서적 또는 인터넷 기사 검색 등을 통하여 조사하고 그 결과를 발표하는 활동을 포함한다. 또한 자연재해 피해를 줄이기 위해 일반 가정, 학교, 야외에서 주의해야 할 내용을 다룬다. 자연재해로 인한 피해를 줄이는 방법에 대하여 친구들과 협업하여 자료를 수집하고 분석한다. 생활 속에서 발생할 수 있는 자연재해의 대처 방법을 숙지하여 학생들이 안전한 생활을 할 수 있도록 하는 데 목적이 있다.","n":[],"p":234,"b":3},{"c":"[12과학01-01]","k":"기본","sk":"","s":"과학","g":"고등학교 1~3학년","d":"운동과 에너지","t":"전기기구를 안전하게 사용하는 방법과 전기를 절약하는 방법을 조사하고 실천한다.","m":"이 성취기준은 전기기구의 안전한 사용법은 위험한 상황과 안전한 상황을 분류하는 활동을 통해 지도하여 전기사고를 예방할 수 있도록 한다. 교사는 학생이 수업 시간에 관찰한 안전하지 않은 상황을 모방하지 않도록 강조하여 지도한다. 나아가 영상을 통해 전기사고의 위험성을 간접적으로 경험하도록 한다. 아울러 전기사고 시의 대처 방법(예: 전류 차단 및 안전 확보, 심폐소생술)을 지도하여 전기 안전에 익숙해지도록 한다.","n":[],"p":235,"b":3},{"c":"[12과학01-02]","k":"기본","sk":"","s":"과학","g":"고등학교 1~3학년","d":"운동과 에너지","t":"열의 이동을 막는 단열의 원리를 알고, 단열을 이용하는 일상생활 사례를 관찰한다.","m":"이 성취기준은 생활 주변에서 쉽게 볼 수 있는 쇠, 나무, 유리, 플라스틱 등을 이용하여 금속과 금속이 아닌 것에서 열의 이동 속도가 다름을 이해한다. 조리 도구의 손잡이, 컵 홀더, 냄비 받침, 아이스박스, 뚝배기, 아이스크림 은박 포장재 등이 금속인지 금속이 아닌지 탐색하고 안전한 생활을 누리거나 따뜻한 것을 따뜻하게, 차가운 것을 차갑게 유지하기 위해 열의 이동을 줄이는 단열이 실생활에 다양하게 활용되고 있음을 이해한다. 감기에 걸리지 않게 체온을 유지하는 방법, 수도가 동파되지 않도록 하는 방법, 방을 따뜻하게 유지하는 방법 등 다양한 문제 상황을 제시하여 효과적인 단열 방법을 생각하고 문제를 해결한다.","n":[],"p":235,"b":3},{"c":"[12과학01-03]","k":"기본","sk":"","s":"과학","g":"고등학교 1~3학년","d":"운동과 에너지","t":"볼록렌즈와 오목렌즈로 물체를 관찰하고, 생활에서 렌즈가 이용되는 예를 조사한다.","m":"이 성취기준은 빛이 한 물질에서 다른 물질로 들어갈 때 경로가 꺾이는 빛의 굴절 현상에 대해 프리즘을 이용하여 흥미를 갖는다. 그리고 볼록렌즈와 오목렌즈에서는 빛의 굴절 현상이 일어나며 이로 인해 물체의 모습이 실제와 다르게 보인다는 사실을 인식한다. 단, 상이 생기는 원리와 물체와 렌즈 사이의 위치 관계에 따른 상의 차이는 다루지 않는다. 볼록렌즈와 오목렌즈로 물체를 관찰하고, 돋보기, 사진기의 렌즈, 안경, 현미경 등 일상생활에서 사용하는 볼록렌즈와 오목렌즈의 다양한 쓰임새에 중점을 두어 탐구한다.","n":[],"p":236,"b":3},{"c":"[12과학01-04]","k":"기본","sk":"","s":"과학","g":"고등학교 1~3학년","d":"운동과 에너지","t":"물체에 중력과 마찰력이 작용하여 나타나는 현상을 관찰하고 그 특성을 이해한다.","m":"이 성취기준은 중력은 질량을 가진 모든 물체 사이에 작용하는 힘이라는 것과 물체의 운동을 방해하는 힘이 마찰력이라는 것을 이해하는 것이 중요하다. 빗면 마찰력 비교 실험과 낙하 실험 등 힘과 관련된 여러 가지 조작 활동을 바탕으로 중력과 마찰력이 작용하여 나타나는 현상을 탐구한다. 나아가 실생활에서 마찰력을 크게 이용하거나 작게 이용하는 경우, 중력을 이용하는 사례를 조사하여 눈에는 보이지 않으나 중력, 마찰력이 우리 생활과 밀접하게 관련되어 있음을 인식한다.","n":[],"p":236,"b":3},{"c":"[12과학02-01]","k":"기본","sk":"","s":"과학","g":"고등학교 1~3학년","d":"물질","t":"여러 가지 기체의 성질을 관찰하고, 일상생활에서 기체가 활용되는 경우를 조사한다.","m":"이 성취기준은 펌프를 이용해 튜브에 바람 넣기, 코끼리 나팔과 피스톤을 당겨 놓은 주사기를 비닐관으로 연결하고 주사기의 피스톤을 밀거나 당기기, 공기가 없는 풍선과 공기를 넣은 풍선의 무게 변화 비교하기 등의 내용을 다룬다. 여러 가지 실험을 통해 기체의 성질을 관찰하고, 공기 외에도 산소와 이산화 탄소, 질소 등의 기체가 일상생활에서 다양하게 활용되는 경우를 조사한다. 여러 가지 기체의 성질을 이해하기 위한 실험에 흥미와 관심을 둔다.","n":["장애 정도가 심한 학생의 교육적 요구에 따라 일상생활에서 기체가 활용되는 다양한 예를 직접 관찰하는 활동을 통해 기체가 우리 주변에 있음을 확인하기 등으로 성취기준을 재구성하여 적용할 수 있다. 시각장애를 동반한 학생의 경우 기체의 성질을 관찰하기 위한 여러 가지 실험 과정에서 교사가 손으로 학생의 행동을 안내하는 신체적 안내법을 활용하여 기체의 성질을 촉각적으로 경험하도록 한다."],"p":237,"b":3},{"c":"[12과학02-02]","k":"기본","sk":"","s":"과학","g":"고등학교 1~3학년","d":"물질","t":"여러 가지 용액의 상대적인 진하기를 비교한다.","m":"이 성취기준은 용매에 녹이는 용질의 양을 조절하거나 용매의 양에 변화를 주며 여러 가지 용액의 진하기를 관찰한다. 용액의 상대적인 진하기를 비교하기 위해 용액의 색 관찰하기, 용액에 물체를 띄워 물체가 뜨는 정도 관찰하기, 비중계, 염도 측정기와 같은 측정 도구 이용하기 등의 내용을 다룬다. 용액의 진하기를 비교하는 실험에 적극적으로 참여하면서 용액의 농도라는 과학적 지식을 습득하고, 실생활 맥락에서 용액의 진하기를 비교한다.","n":["장애 정도가 심한 학생의 경우 생활 주변에서 쉽게 볼 수 있는 용액을 활용해 용액의 진하기를 직접 비교할 기회를 제공하거나, 색깔이 진한 용액 만들기 활동을 통해 용액의 진하기 관찰하기 등으로 성취기준을 재구성하여 적용할 수 있다. 시각장애를 동반한 학생의 경우 색에 대한 언어적 정보를 제공하고, 물체의 뜨는 정도를 촉각적으로 관찰하도록 한다. 측정 도구를 이용할 때, 구체적인 수치에 초점을 두기보다 측정 도구를 이용하는 활동에 대한 신체적 안내법을 충실히 제공한다."],"p":237,"b":3},{"c":"[12과학02-03]","k":"기본","sk":"","s":"과학","g":"고등학교 1~3학년","d":"물질","t":"물이 얼 때, 얼음이 녹을 때의 변화에 따른 무게와 부피를 비교한다.","m":"이 성취기준은 물이 얼 때의 무게와 부피 변화 관찰하기, 얼음이 녹을 때의 무게와 부피 변화 관찰하기 등의 내용을 다룬다. 일상생활에서 물이 얼어 부피가 늘어나는 예와 얼음이 녹아 부피가 줄어드는 예를 찾아보며 관련 내용을 일상생활과 연관 지어 자연스럽게 이해하는 데 중점을 둔다.","n":["장애 정도가 심한 학생의 경우 일상생활에서 물이 얼 때와 얼음이 녹을 때 나타나는 현상을 직접 관찰할 다양한 기회를 제공한다. 시각장애를 지닌 중복장애 학생의 경우 물이 얼 때와 얼음이 녹을 때의 무게와 부피 변화를 관찰하도록 다양한 촉각 자료와 언어적 정보를 충분히 제공한다."],"p":237,"b":3},{"c":"[12과학02-04]","k":"기본","sk":"","s":"과학","g":"고등학교 1~3학년","d":"물질","t":"물질이 연소하기 전과 후의 상태를 비교한다.","m":"이 성취기준은 물질이 산소와 만나 빛과 열을 내면서 타는 현상인 연소 현상을 관찰하기 위해 촛불을 관찰하거나, 종이, 나뭇조각 등 여러 가지 물질을 철판 위에 놓고 가열하여 불꽃을 관찰하는 내용을 다룬다. 나아가 이러한 실험을 통해 탄 물질이 연소 전 물질보다 크기나 양이 줄어들거나, 재가 남는 등 모양이나 상태가 변화한다는 것을 인식한다. 이때 연소 시 생성되는 물질과 같은 개념은 세부적으로 다루지 않으며, 연소에 대한 과학적 원리보다는 연소 현상 자체를 관찰하는 데 중점을 둔다. 불을 사용하는 실험이므로 실험 시 안전 수칙을 잘 지킬 수 있도록 특히 유의한다.","n":[],"p":239,"b":3},{"c":"[12과학02-05]","k":"기본","sk":"","s":"과학","g":"고등학교 1~3학년","d":"물질","t":"연소와 소화 조건을 알고, 소화 방법에 따른 화재 안전을 실천한다.","m":"이 성취기준은 연소와 소화의 조건, 화재의 원인과 예방 방법, 화재 발생 시 안전 대책, 소화기 사용 방법 등의 내용을 다룬다. 다양한 방법으로 촛불을 끄며 소화 현상을 관찰하고, 소화 방법을 연소의 조건과 관련지어 인식한다. 소화에 대한 과학적 이론보다는 생활과 연계해 과학적 사실을 알 수 있도록 하고, 학교 내 소방 설비 찾기, 소화기 사용법 등을 익혀 생활 속에서 화재를 예방하는 태도를 기른다.","n":[],"p":239,"b":3},{"c":"[12과학03-01]","k":"기본","sk":"","s":"과학","g":"고등학교 1~3학년","d":"생명","t":"소화·배설 기관의 구조와 기능을 관찰한다.","m":"이 성취기준은 우리 몸의 건강 유지에 필요한 영양소의 종류 알기, 음식물과 영양소와의 관계 알기, 영양분을 흡수하기 위한 소화 기관, 노폐물을 배출하는 배설 기관의 구조 관찰 및 기능 조사하기 등의 내용을 다룬다. 그림이나 영상 또는 모형을 통한 간접 관찰을 수행하며, 에너지 공급을 위한 이 기관들이 우리 몸의 건강을 유지하는 데 중요함을 인식한다.","n":["장애 정도가 심한 학생의 교육적 요구에 따라 신체 기관의 구조와 기능 관찰을 대신해 학습 내용을 소화·배설, 순환·호흡 기관의 명칭 말하기, 해당 기관의 신체 위치 탐구하기 등으로 성취기준을 재구성하여 적용할 수 있다."],"p":240,"b":3},{"c":"[12과학03-02]","k":"기본","sk":"","s":"과학","g":"고등학교 1~3학년","d":"생명","t":"순환·호흡 기관의 구조와 기능을 관찰한다.","m":"이 성취기준은 혈액이 심장에서 혈관을 통해 인체 각 부위에 영양분과 공기를 전달하고 다시 심장으로 가는 순환 기관 및 폐로 공기를 전달하는 호흡 기관의 구조를 관찰하고 기능을 조사하는 등의 내용을 다룬다. 각 기관의 구조를 나타내는 그림이나 영상 또는 모형 관찰, 호흡 기관의 작동 과정을 실험 장치를 통해 순차적으로 관찰하여 신체 기관의 기능에 관심을 둔다.","n":["장애 정도가 심한 학생의 교육적 요구에 따라 신체 기관의 구조와 기능 관찰을 대신해 학습 내용을 소화·배설, 순환·호흡 기관의 명칭 말하기, 해당 기관의 신체 위치 탐구하기 등으로 성취기준을 재구성하여 적용할 수 있다."],"p":240,"b":3},{"c":"[12과학03-03]","k":"기본","sk":"","s":"과학","g":"고등학교 1~3학년","d":"생명","t":"인간의 탄생과 성장 과정에서 나타나는 신체 변화를 구분한다.","m":"이 성취기준은 태아기 및 유아기·아동기·청소년기·성인기 신체의 변화 모습 구분하기, 성별에 따른 신체 변화 구분하기, 청소년기 특징적인 신체 및 심리적 변화 확인하기 등의 내용을 다룬다. 나이·성별에 따른 신체 변화를 사진이나 동영상 및 인형 등을 통해 관찰하고 비교하여 청소년기의 신체 및 심리 변화가 자연스러운 것임을 인식한다.","n":["장애 정도가 심한 학생의 교육적 요구에 따라 인간의 탄생과 성장 과정에서 나타나는 신체 변화 구분을 대신해 인간의 성장 시기 구분하기, 남녀 신체 특징 구분하기 등으로 성취기준을 재구성하여 적용할 수 있다."],"p":240,"b":3},{"c":"[12과학03-04]","k":"기본","sk":"","s":"과학","g":"고등학교 1~3학년","d":"생명","t":"인간의 유전 현상을 관찰하고 가계도를 이용하여 표현한다.","m":"이 성취기준은 인간의 유전 현상을 이해하기 위해 가족의 닮은 곳 찾기, 인간의 여러 가지 유전 형질 조사하기, 유전 현상을 가계도로 표현하기 등의 내용을 다룬다. 특히 자신과 가족의 형질을 조사해 보며 부모의 특징이 어떻게 자신에게 전달되었는지에 대해 호기심을 가지고 탐구하는 데 주안점을 둔다.","n":[],"p":240,"b":3},{"c":"[12과학03-05]","k":"기본","sk":"","s":"과학","g":"고등학교 1~3학년","d":"생명","t":"식물 각 기관의 구조와 기능을 관찰한다.","m":"이 성취기준은 도구 등을 활용하여 식물 각 기관(예: 뿌리, 줄기, 잎, 꽃)의 구조 관찰하기, 실험을 통해 식물 각 기관의 기능 관찰하기 등의 내용을 다룬다. 식물의 각 기관은 서로 밀접하게 연관되어 있으며 식물의 생장을 위해 유기적으로 작용하고 있음을 인식한다.","n":[],"p":241,"b":3},{"c":"[12과학03-06]","k":"기본","sk":"","s":"과학","g":"고등학교 1~3학년","d":"생명","t":"우리 생활에서 동물과 식물의 특징을 활용한 사례를 조사한다.","m":"이 성취기준은 우리 생활에서 동물과 식물이 가진 구조나 기능 등 특징을 활용한 사례 조사하기, 동물과 식물의 특징을 이용한 생활용품 설계하기 등의 내용을 다룬다. 이를 통해 인간이 삶을 영위하면서 다양한 분야에서 생물을 이용할 뿐만 아니라 생물을 통해 아이디어를 얻고 문제를 해결하고 있음을 인식한다. 이때 학생들이 생활 속에서 인지하고 경험할 수 있는 수준의 내용을 다루도록 유의해야 한다.","n":["장애 정도가 심한 학생의 교육적 요구에 따라 동물과 식물의 특징을 활용하여 만든 생활용품 등을 사용하는 활동 등으로 성취기준을 재구성하여 적용할 수 있다."],"p":241,"b":3},{"c":"[12과학03-07]","k":"기본","sk":"","s":"과학","g":"고등학교 1~3학년","d":"생명","t":"생태계 구성요소가 서로 영향을 미침을 알고, 생태계 보전을 위해 우리가 할 수 있는 일을 조사하여 실천한다.","m":"이 성취기준은 중학교 1~3학년에서 다루는 생물 요소와 비생물 환경 요소의 개념을 확장하여 먹이사슬 및 먹이그물을 이루는 생물 요소 구분하기, 비생물 요소인 빛, 물, 온도 등이 생물에 미치는 영향 확인하기, 생물 요소와 비생물 환경 요소의 상호 관계 탐구하기 등의 내용을 다룬다. 생활 주변 환경오염 사례 및 방송이나 인터넷 등을 활용한 생태계 파괴 사례 조사하기 등의 활동으로 생활 속에서 실천할 수 있는 생태계 보전 방안에 관심을 둔다.","n":[],"p":242,"b":3},{"c":"[12과학04-01]","k":"기본","sk":"","s":"과학","g":"고등학교 1~3학년","d":"지구","t":"지층의 여러 가지 모양을 관찰한다.","m":"이 성취기준은 모형을 이용한 실험을 통하여 지층이 쌓이는 과정을 관찰한다. 또한 겹겹이 쌓인 지층의 두께나 색을 관찰하고, 지층 모형에 힘을 가해 휘어지거나 끊어지는 현상을 관찰하며 습곡과 단층의 생성 원리를 인식하되 습곡과 단층의 용어에 대해서는 다루지 않는다.","n":["장애 정도가 심한 학생의 교육적 요구에 따라 생활 주변의 땅을 파서 흙과 돌이 쌓여 있음을 확인하는 활동 등으로 성취기준을 재구성하여 적용할 수 있다."],"p":243,"b":3},{"c":"[12과학04-02]","k":"기본","sk":"","s":"과학","g":"고등학교 1~3학년","d":"지구","t":"모형을 통하여 화석 생성과정을 관찰하고, 지구의 과거 생물과 환경을 추리한다.","m":"이 성취기준은 옛날에 살았던 생물의 몸체나 흔적이 암석이나 지층 속에 남아있는 것이라는 화석의 개념을 이해하기 쉽도록 시청각 자료를 활용하여 설명한다. 화석의 표본으로 생물의 생김새의 특징이 분명히 드러나는 것을 제시하며 공룡 박물관이나 자연사 박물관의 체험 학습과 연계하여 관심과 이해를 높일 수 있다. 화석의 모습을 관찰하여 화석화된 생물이 살아있을 때의 모습을 추리하는 활동이다.","n":["장애 정도가 심한 학생의 교육적 요구에 따라 생활 주변의 땅을 파서 흙과 돌이 쌓여 있음을 확인하는 활동 등으로 성취기준을 재구성하여 적용할 수 있다."],"p":243,"b":3},{"c":"[12과학04-03]","k":"기본","sk":"","s":"과학","g":"고등학교 1~3학년","d":"지구","t":"화산 활동과 지진으로 인한 지각의 변화를 관찰한다.","m":"이 성취기준은 화산 활동과 지진이 무엇인지 시청각 자료를 활용하여 관찰한다. 화산과 지진의 발생은 판구조론과 관련되나, 학생들에게는 어려운 개념이므로 지구 내부에서 발생하는 힘에 의해 발생한다는 정도로 설명한다.","n":[],"p":243,"b":3},{"c":"[12과학04-04]","k":"기본","sk":"","s":"과학","g":"고등학교 1~3학년","d":"지구","t":"화산 활동과 지진이 우리 생활에 미치는 영향을 알고, 대처 방법을 조사하여 실천한다.","m":"이 성취기준은 화산과 지진의 피해 사례에 대한 조사는 인터넷 기사 검색 등을 활용하고 모의 지진 체험 활동을 통해 지진의 위험성을 인식하고 지진이 발생했을 때 피해를 줄일 수 있는 방법을 탐구하는 데 목적이 있다.","n":[],"p":243,"b":3},{"c":"[12과학04-05]","k":"기본","sk":"","s":"과학","g":"고등학교 1~3학년","d":"지구","t":"달의 특징과 별자리의 여러 모양을 알고, 밤하늘 관찰에 호기심과 즐거움을 느낀다.","m":"이 성취기준은 달은 지구의 자전으로 낮과 밤이 생기는 과정과 관련되어 있지만, 학생들에게는 어려운 개념으로 지구의 자전이라는 용어를 설명하거나 지구의 운동 원리에 집중하지 않는다. 스마트 기기를 통해 달은 둥근 공 모양이며, 달의 표면은 매끈매끈한 면과 울퉁불퉁한 면이 있다는 특징을 이해한다. 지구와 달의 모양과 표면을 중점으로 비교하여 특징을 이해하되, 세부적인 달의 위상 변화에 대한 내용은 다루지 않는다. 또한 별의 정의와 특성은 학생들에게는 어려운 개념으로 이를 탐구하는 것보다는 별과 별자리의 여러 모양을 통해 호기심을 갖고 밤하늘을 관찰하며 천체에 관심을 두는 데 주안점을 둔다. 다양한 별과 별자리, 북극성, 계절별 별자리와 관련된 스토리텔링을 포함하여 활동을 구성한다.","n":[],"p":244,"b":3},{"c":"[6실과01-01]","k":"기본","sk":"","s":"실과","g":"초등학교 5~6학년","d":"기본생활","t":"건강을 위한 식생활의 중요성을 알고, 올바른 식습관을 실천한다.","m":"바른 식생활은 건강한 생활을 위한 기본이 되며, 바른 식사 예절 실천은 개인의 건강뿐만 아니라 타인과의 긍정적 관계 형성을 위해 중요하다. 균형 잡힌 식사, 건강에 이로운 음식, 바른 식사 예절 실천 등의 올바른 식습관과 관련된 내용을 다룬다. 자신의 건강과 성장을 위한 바른 식습관을 형성하고, 바른 식사 예절을 실천하는 것에 중점을 둔다.","n":[],"p":257,"b":3},{"c":"[6실과01-02]","k":"기본","sk":"","s":"실과","g":"초등학교 5~6학년","d":"기본생활","t":"조리 도구를 바르게 사용하여 간단한 음식을 만든다.","m":"스스로 음식을 만들 수 있는 기능을 갖추는 것은 자립적인 가정생활 준비에 도움이 된다. 국자, 주걱 등과 같은 조리 도구의 사용, 간단한 음식 만들기, 뒷정리하기 등 음식 만들기와 관련된 내용을 다룬다. 조리 도구를 바르고 안전하게 사용하여 학생의 능력과 선호에 따른 간단한 음식을 만드는 데 중점을 둔다.","n":[],"p":257,"b":3},{"c":"[6실과01-03]","k":"기본","sk":"","s":"실과","g":"초등학교 5~6학년","d":"기본생활","t":"계절, 상황 등에 알맞은 옷차림을 알고, 단정한 의생활을 실천한다.","m":"단정한 옷차림은 자신의 위생 관리 및 사회적 관계 형성을 위한 중요한 요소이다. 바른 의복 착용, 계절에 맞는 옷차림, 상황에 맞는 옷차림 등의 바른 의생활 실천과 관련된 내용을 다룬다. 바른 의복 착용법을 알고 일상생활에서 계절 및 상황에 따른 올바른 옷차림을 실천하는 데 중점을 둔다.","n":[],"p":257,"b":3},{"c":"[6실과01-04]","k":"기본","sk":"","s":"실과","g":"초등학교 5~6학년","d":"기본생활","t":"세탁 과정을 알고, 간단한 의복을 세탁한다.","m":"깨끗하고 위생적인 의생활을 위해 세탁과정을 익혀 간단한 의복을 세탁할 수 있는 능력이 필요하다. 손세탁 방법과 세탁기를 활용한 세탁과정 알기, 양말, 손수건 등과 같은 간단한 의복 세탁하기 등의 청결한 의복 관리와 관련된 내용을 다룬다. 실습을 통해 다양한 세탁 방법을 알고 간단한 세탁물을 스스로 세탁해 볼 수 있도록 지도한다.","n":[],"p":257,"b":3},{"c":"[6실과01-05]","k":"기본","sk":"","s":"실과","g":"초등학교 5~6학년","d":"기본생활","t":"쾌적한 생활환경의 필요성을 알고, 생활공간을 정리 정돈하며 청소한다.","m":"쾌적한 일상생활을 유지하기 위해서는 생활공간을 정리 및 정돈하고, 청소 하는 방법을 알고 실천하는 것이 필요하다. 쾌적한 생활공간의 중요성 알기, 생활공간 정리, 생활공간 청소 등의 깨끗한 생활공간 관리와 관련된 내용을 다룬다. 교실이나 내 방 등 자신의 생활공간에 대한 소중함을 인식하고 깨끗하게 유지하는 습관을 형성하는 것에 중점을 두어 지도한다.","n":[],"p":257,"b":3},{"c":"[6실과01-06]","k":"기본","sk":"","s":"실과","g":"초등학교 5~6학년","d":"기본생활","t":"환경 보호를 위해 바른 쓰레기 분리배출 습관을 갖는다.","m":"바른 쓰레기 분리배출의 실천은 건강하고 쾌적한 생활 유지 및 환경 보호를 위한 중요한 활동이다. 쓰레기와 재활용품 구분, 올바른 쓰레기 분리배출 방법, 재활용과 환경보호 등 자원순환을 통한 환경 보호 실천과 관련된 내용을 다룬다. 환경의 소중함을 인식하고생활 속에서 발생하는 쓰레기를 바르게 분리배출하는 습관을 기르는 데 중점을 둔다.","n":[],"p":257,"b":3},{"c":"[6실과01-07]","k":"기본","sk":"","s":"실과","g":"초등학교 5~6학년","d":"기본생활","t":"이웃과 더불어 살아가기 위해 지켜야 하는 규칙과 예절을 실천한다.","m":"이웃과 더불어 살아가기 위해서는 이웃을 배려하는 마음을 갖고 이웃과 함께 살아가는 데 필요한 질서와 규칙을 지키는 것이 필요하다. 나와 이웃의 관계, 이웃과 지켜야 할 예절 실천, 마을 공동체 등의 필수적인 주생활 예절과 관련된 내용을 다룬다. 이웃을 배려하는 마음을 갖고 이웃 간 지켜야 할 규칙과 예절을 실천하는 태도를 형성하는 데 중점을 둔다.","n":[],"p":257,"b":3},{"c":"[6실과01-08]","k":"기본","sk":"","s":"실과","g":"초등학교 5~6학년","d":"기본생활","t":"다양한 여가활동을 탐색하고 나에게 맞는 여가생활을 즐긴다.","m":"개인의 자율과 선택에 의해 이루어지는 여가활동은 행복한 삶을 살아가기 위한 기본 요소이다. 여가생활에 대한 개념을 이해하고 신체활동, 보드게임, 이(e)-스포츠 등 가정과 학교에서 즐길 수 있는 다양한 여가활동 탐색을 통해 여가활동의 즐거움을 경험하는 내용을 다룬다. 행복한 삶을 이루기 위한 여가생활의 중요성을 인식하고 자신의 흥미와 상황에 맞는 여가활동을 실천할 수 있도록 지도한다.","n":[],"p":257,"b":3},{"c":"[6실과02-01]","k":"기본","sk":"","s":"실과","g":"초등학교 5~6학년","d":"기술·정보","t":"공구의 올바른 사용 방법을 익혀 용도에 맞게 공구를 사용한다.","m":"일상생활에서 필요한 다양한 공구의 종류와 쓰임을 알고 바르게 사용하는 것은 작업 활동의 기본이 된다. 가위, 테이프 등 다양한 공구 알기, 용도에 맞게 적절한 공구 사용하기 등의 바른 공구 사용에 관련된 내용을 다룬다. 자르는 공구, 붙이는 공구 등 쓰임에 맞는 공구를 안전하게 사용하고, 사용한 공구를 바르게 정리하는 습관과 태도를 기르는 데 중점을 둔다.","n":["적용 시 학생의 특성, 학교 환경 등을 파악하여 학생이 실생활 속에서 쉽게 접할 수 있는 학습 소재 및 재료를 사용하도록 하고, 공구를 활용한 작업 활동 등을 통해 기초적인 공구의 조작 능력 및 작업의 보람을 경험할 수 있도록 한다."],"p":259,"b":3},{"c":"[6실과02-02]","k":"기본","sk":"","s":"실과","g":"초등학교 5~6학년","d":"기술·정보","t":"생활용품을 만드는 활동을 통해 작업의 즐거움과 가치를 경험한다.","m":"공구를 바르게 사용하여 생활용품을 만드는 활동을 통해 작업의 즐거움과 가치를 느낄 수 있도록 한다. 종이, 천, 나무 등 다양한 재료를 사용하여 생활용품 구상하기, 생활용품 만들기 등의 내용을 다룬다. 생활용품을 제작하는 활동을 통해 안전한 공구 사용 방법을 익히고, 작업의 보람과 기쁨을 느낄 수 있도록 지도한다.","n":["적용 시 학생의 특성, 학교 환경 등을 파악하여 학생이 실생활 속에서 쉽게 접할 수 있는 학습 소재 및 재료를 사용하도록 하고, 공구를 활용한 작업 활동 등을 통해 기초적인 공구의 조작 능력 및 작업의 보람을 경험할 수 있도록 한다."],"p":259,"b":3},{"c":"[6실과02-03]","k":"기본","sk":"","s":"실과","g":"초등학교 5~6학년","d":"기술·정보","t":"일상생활을 편리하게 하는 정보통신 기기의 기초적인 기능을 익혀 실생활에서 활용한다.","m":"정보통신 기기의 사용 방법 및 다양한 기능을 익히는 것은 편리한 일상생활을 영위하기 위해 필요한 능력이며 디지털 문해력의 기초가 된다. 스마트폰, 태블릿 컴퓨터 등 정보통신 기기의 기초적인 기능과 사용, 편리한 애플리케이션 활용 등 정보통신 기기의 기초적인 사용 방법에 관한 내용을 다룬다. 정보통신 기기의 주요 활용 사례를 살펴보고, 정보통신 기기의 기초적인 사용 방법 및 일상생활 속에서 활용할 수 있는 편리한 기능을 익히는 데 중점을 둔다.","n":[],"p":259,"b":3},{"c":"[6실과02-04]","k":"기본","sk":"","s":"실과","g":"초등학교 5~6학년","d":"기술·정보","t":"올바른 정보통신 기기 사용 습관을 기르고, 정보통신 예절을 실천한다.","m":"정보통신 기기를 활용할 때 지켜야 할 정보통신 예절을 알고 이를 실천하는 것은 중요하다. 인터넷·스마트폰 과의존 예방, 바른 사이버 언어 사용 등의 정보통신 예절 실천과 관련된 내용을 다룬다. 자신의 인터넷 및 스마트폰의 이용 습관을 살펴봄으로써 인터넷·스마트폰 과의존 예방을 위한 사용 방법을 실천하고, 바른 사이버 언어 사용 등 정보통신 예절을 익힐 수 있도록 지도한다.","n":[],"p":259,"b":3},{"c":"[6실과02-05]","k":"기본","sk":"","s":"실과","g":"초등학교 5~6학년","d":"기술·정보","t":"언플러그드 놀이 활동을 통해 일상생활 속 문제를 절차적 사고로 해결하는 태도를 갖는다.","m":"절차적 사고란 문제를 효율적으로 해결하기 위해 문제를 작은 단위로 나누고, 각각의 문제를 단계별로 처리하는 사고 과정이다. 다양한 언플러그드 놀이 활동을 통해 절차적인 문제 해결 과정을 이해하는 경험은 일상생활의 문제 해결 능력을 기르는 데 기초가 된다. 숫자 정보로 그림 그리기, 규칙에 맞게 목걸이 만들기, 화살표를 놓아 목적지 가기 등 언플러그드 놀이 활동하기, 급식실 이용하기, 등교 준비하기 등 생활 속에서 절차적 사고를 통해 문제 해결하기 등 놀이 기반의 기초적인 알고리즘과 관련된 내용을 다룬다. 언플러그드 놀이 활동을 통해 절차적 사고의 개념을 익히고, 실생활 속에서 일어나는 문제 상황을 절차적 사고를 활용하여 해결해 보는 데 중점을 둔다.","n":[],"p":259,"b":3},{"c":"[6실과03-01]","k":"기본","sk":"","s":"실과","g":"초등학교 5~6학년","d":"생명·안전","t":"생활 속 동물을 돌보는 방법을 익히고, 생명을 존중하는 태도를 기른다.","m":"동물을 돌보고 교감하는 활동은 정서적 안정감과 즐거움을 주며, 생명 존중의 태도를 기를 수 있게 한다. 강아지, 고양이 등 생활 속 동물의 종류와 성장 과정, 돌보는 방법, 사람들을 도와주는 동물 등의 내용을 다룬다. 동물을 돌보는 과정을 직･간접적으로 경험하여 생명을 소중하게 여기는 태도를 기르고, 인간과 동물이 공존하는 다양한 방법을 탐색하는 데 중점을 둔다.","n":[],"p":261,"b":3},{"c":"[6실과03-02]","k":"기본","sk":"","s":"실과","g":"초등학교 5~6학년","d":"생명·안전","t":"생활 속 식물 가꾸기를 통해 자연 친화적 태도를 기른다.","m":"식물을 기르는 활동은 사람들에게 심리적 안정감과 편안함, 즐거움을 제공하여삶을 풍요롭게 한다. 식물이 갖는 중요성과 가치, 식물의 다양한 쓰임새, 식물을 가꾸는 과정과 방법, 식물 활용 방법 등의 내용을 다룬다. 실습 중심의 활동을 통해 체험의 즐거움과 성취감을 느끼게 하고 식물의 재배 과정을 통해 자연 친화적인 태도를 기르는 데 중점을 둔다.","n":[],"p":261,"b":3},{"c":"[6실과03-03]","k":"기본","sk":"","s":"실과","g":"초등학교 5~6학년","d":"생명·안전","t":"가정에서 일어나는 위험 상황을 인식하고, 대처하는 방법을 익혀 안전한 생활 태도를 갖는다.","m":"가정은 학생들이 가장 많은 시간을 보내는 장소이며 안전사고 발생 가능성이 높다. 가정에서 발생하는 안전사고 유형 및 종류, 생활 도구의 안전한 사용 방법, 가정에서의안전사고 예방 및 대처 방법 등을 다룬다. 가정에서 발생할 수 있는 안전사고에 대한 예방 및 대처 방법을 지속적으로 지도하여 안전한 생활 태도를 확립하는 데 중점을 둔다.","n":[],"p":261,"b":3},{"c":"[6실과03-04]","k":"기본","sk":"","s":"실과","g":"초등학교 5~6학년","d":"생명·안전","t":"학교에서 발생할 수 있는 안전사고의 대처 방법을 알고 실천한다.","m":"학교는 많은 인원의 학생들이 함께 생활하기 때문에 안전사고의 발생 빈도가 높은 장소이다. 학교에서 발생하는 안전사고의 유형 및 종류, 안전사고 대처 방법, 교육과정 내 체험및 실습에서의 안전 등을 다룬다. 학교에서 발생하는 안전사고의 발생 빈도를 줄여 안전한 생활을 실천하고 유지하는 데 중점을 둔다.","n":[],"p":261,"b":3},{"c":"[6실과03-05]","k":"기본","sk":"","s":"실과","g":"초등학교 5~6학년","d":"생명·안전","t":"지역사회에서 안전의 중요성을 인식하고 안전사고를 예방하는 습관을 기른다.","m":"지역사회에서 발생할 수 있는 안전사고는 학령기 학생들에게 많은 위험 요소로 작용한다. 이동 수단에서의 안전, 놀이 및 체육 시설 이용에서의 안전, 승강기 및 계단에서의 안전 등의 내용을 다룬다. 장소별 안전사고의 발생률을 낮추기 위해 안전사고 예방 수칙과 대처 방안을 반복 지도하여 습관화하는 데 중점을 둔다.","n":[],"p":261,"b":3},{"c":"[6실과04-01]","k":"기본","sk":"","s":"실과","g":"초등학교 5~6학년","d":"진로 인식","t":"나의 꿈, 좋아하는 것, 잘하는 것 등 자신의 특성을 탐색한다.","m":"자신의 현재 모습을 발견하고 미래의 내 모습을 그려보는 활동은 주변 사람들로부터 자신을 구별하고 이해하는 자아 인식의 기초가 된다. 내가 좋아하는 것과 잘하는 것, 나의 능력과 흥미, 나의 꿈 등의 내용을 다룬다. 내가 좋아하는 것과 잘하는 것을 알아보고 자신의 꿈을 찾아볼 수 있도록 노력하는 데 중점을 둔다.","n":[],"p":262,"b":3},{"c":"[6실과04-02]","k":"기본","sk":"","s":"실과","g":"초등학교 5~6학년","d":"진로 인식","t":"자신의 흥미와 적성을 바탕으로 다양한 직업의 종류를 탐색한다.","m":"자신에 대한 이해를 바탕으로 다양한 직업의 종류를 알아보는 활동은 기초적인 진로 인식을 형성하는 데 중요한 토대가 된다. 다양한 직업의 종류, 주변 사람들이 하는 일, 내가 만나는 사람이 하는 일 등을 다룬다. 평소 생활 속에서 마주하게 되는 다양한 직업의 모습을 살펴보고 진로에 대한 흥미를 높여 자신에게 적합한 진로를 탐색하는 데 중점을 둔다.","n":[],"p":262,"b":3},{"c":"[6실과04-03]","k":"기본","sk":"","s":"실과","g":"초등학교 5~6학년","d":"진로 인식","t":"일의 가치와 소중함을 알고 직업에 대한 긍정적인 태도를 기른다.","m":"초등학교 단계에서 직업에 대한 긍정적인 인식을 형성하는 것은 향후 구체적인 직업관을 형성하는 데 기초가 된다. 일과 직업의 의미 및 중요성, 자신의 꿈 실현을 위한 방법 등의 내용을 다룬다. 다양한 직업의 종류와 특성을 파악하여 직업에 대한 긍정적인 태도를 가질 수 있도록 하는 데 중점을 둔다.","n":[],"p":262,"b":3},{"c":"[6실과04-04]","k":"기본","sk":"","s":"실과","g":"초등학교 5~6학년","d":"진로 인식","t":"진학할 수 있는 중학교 유형을 살펴보고 중학교 선택 과정에 참여한다.","m":"중학교 진학 과정은 물리적 환경 및 신체적, 사회적, 정서적인 측면에서 다양한 변화를 초래하므로 중학교 진학을 위한 다양한 정보가 필요하다. 특수학교와 일반 중학교 내 특수학급의 비교, 내가 희망하는 중학교 등의 내용을 다룬다. 진학 결정에 능동적으로 참여하여 자신의 문제를 스스로 결정해 보는 경험을 함으로써 향후 자신에게 찾아오는 변화를 예측할 수 있도록 하는 데 중점을 둔다.","n":[],"p":262,"b":3},{"c":"[6실과04-05]","k":"기본","sk":"","s":"실과","g":"초등학교 5~6학년","d":"진로 인식","t":"진학에 따른 교육 환경의 변화를 알아보고 진학을 준비한다.","m":"진학은 더 배우기 위해 상급 학교로 가는 것으로 교육 장소의 변화뿐 아니라 교육 전환의 차원에서 다양한 준비가 요구된다. 초등학교 생활과 달라지는 점, 상급학교 생활에 대한 정보, 내가 배울 교과목, 교복 착용, 새로운 친구와 선생님, 진학을 위한 준비 및 나의 태도 등의 내용을 다룬다. 진학 후 학교 생활에 적응하는 데 필요한 요소들을 인식하고 준비할 수 있도록 하는 데 중점을 둔다.","n":[],"p":262,"b":3},{"c":"[9진로01-01]","k":"기본","sk":"","s":"진로와 직업","g":"중학교 1~3학년","d":"자기 인식","t":"자신의 기본 정보를 파악한다.","m":"자신의 기본 정보를 파악하는 것은 자기 이해의 기초이며 사회적 관계 형성의 첫 걸음이다. 이름, 나이, 주소, 생년월일, 연락처, 소속 학교, 가족 사항 등 개인의 기본적정보에 대한 내용을 다룬다. 자신의 인적 사항 등 기본 정보를 기록하거나 발표하는 방법으로다른 사람에게 제시할 수 있도록 한다.","n":[],"p":277,"b":3},{"c":"[9진로01-02]","k":"기본","sk":"","s":"진로와 직업","g":"중학교 1~3학년","d":"자기 인식","t":"흥미, 적성, 장점과 단점, 성격 등 자신의 특성을 파악하여 자신을 소개한다.","m":"미래 설계는 성격, 흥미, 적성 등 개인의 심리적 특성 파악에 기반을 두어 이루어져야 한다. 내가 좋아하는 것과 싫어하는 것, 장점과 단점, 흥미, 관심, 성격, 나의 표현 방식 등의 내용으로 다른 사람에게 나를 소개해 봄으로써 자신을 이해하고 긍정적 자아 개념을 세운다. 각종 심리 검사를 실시하거나 주변의 가까운 사람이 인식하는 자신의 특성을 조사하는 등 다양한 방법과 관점으로 나의 특성을 파악하여 소개하는 데 중점을 둔다.","n":[],"p":277,"b":3},{"c":"[9진로01-03]","k":"기본","sk":"","s":"진로와 직업","g":"중학교 1~3학년","d":"자기 인식","t":"자신의 장점을 부각시키는 방법을 실천하며, 나를 소중히 여기는 마음을 기른다.","m":"자기 이해를 바탕으로 한 자기 개발의 노력은 자아 존중과 주체적인 미래 설계의 기초가 된다. 나에게 있는 장점을 더욱 부각하고, 단점을 보완하는 방법에 대해 고민하고실천 방법을 알아본다. 이 과정에서 단점 보다는 장점에 집중하여 나를 소중히 여기는 마음을지니고 자아 존중감을 향상시키도록 한다.","n":[],"p":277,"b":3},{"c":"[9진로01-04]","k":"기본","sk":"","s":"진로와 직업","g":"중학교 1~3학년","d":"자기 인식","t":"자신의 특성과 관련 있는 진로와 직업 성향을 탐색한다.","m":"앞서 파악한 자신의 특성을 기초로 하여 자신의 진로와 직업 성향을 확인하며 자신의 미래와 하고 싶은 일을 관련지어 본다. 혼자 일하기나 함께 어울려 일하기, 동적인일이나 정적인 일, 반복적이로 계획적인 처리나 자율적 처리 등에서 선호를 파악하고 희망하는직업과 연결하여 자신의 직업 성향을 확인한다. 이와 함께 자신의 희망 직업에서 요구하는 능력, 직무 등을 알아보며 나에게 적합한 직업은 어떠한 공통된 특성이 있는지 확인한다.","n":[],"p":277,"b":3},{"c":"[9진로01-05]","k":"기본","sk":"","s":"진로와 직업","g":"중학교 1~3학년","d":"자기 인식","t":"삶이 변화하는 과정을 이해하고 나의 과거, 현재를 파악하여 미래 모습을 표현한다.","m":"진로의 방향과 직업의 선택은 인생의 연속선상에서 지속적으로 이루어지는 자기 이해와 선택의 과정이다. 이러한 관점에서 삶의 모습 즉, 나의 외모, 환경, 생활 등이 변화할 수밖에 없음을 알고, 자신의 과거·현재 모습을 살펴보며 미래의 모습을 예측하도록 한다. 내가 꿈꾸는 나의 미래 모습을 표현해 보며 무엇을 준비하고 노력해야 할지 확장시킴으로써 미래에 대한 주체적인 태도와 준비하는 자세를 갖는다.","n":[],"p":277,"b":3},{"c":"[9진로02-01]","k":"기본","sk":"","s":"진로와 직업","g":"중학교 1~3학년","d":"직업의 세계","t":"직업의 사회적･경제적 의미를 알고 일에 대한 소중한 마음을 갖는다.","m":"사람들은 직업을 통해 자아를 실현하고 사회 구성원으로서의 역할을 수행하며, 일을 통한 수입으로 일상생활을 유지하고 경제 활동에 참여한다. 직업의 사회적･경제적 의미, 일의 소중함 등 직업의 가치와 의미를 다룬다. 직업의 다양한 의미를 이해하여 직업의 필요성을 알고, 일에 대한 소중함을 깨달아 직업인으로서 역할을 수행하는 계기를 마련할 수 있도록 한다.","n":[],"p":279,"b":3},{"c":"[9진로02-02]","k":"기본","sk":"","s":"진로와 직업","g":"중학교 1~3학년","d":"직업의 세계","t":"직업의 세계에 관심을 가지고 가족, 이웃 등 주변 사람들의 직업에 대하여 탐색한다.","m":"내 주변 사람들의 직업을 살펴보는 것은 다양한 직업의 세계에 관심을 기울이는 첫걸음이다. 다양한 직업의 종류, 주변 사람들의 직업 등을 다룬다. 가족, 이웃이 종사하는 직업을 알아보고 지역사회의 다양한 직업 관련 정보를 조사하고 수집하는 활동을 통해 다양한 직업의 세계에 대한 관심을 가지도록 하는데 강조점을 둔다.","n":[],"p":279,"b":3},{"c":"[9진로02-03]","k":"기본","sk":"","s":"진로와 직업","g":"중학교 1~3학년","d":"직업의 세계","t":"학교 및 지역사회의 직군을 탐색하여 각 직군의 정보를 수집한다.","m":"지적장애 및 자폐성 장애인이 현재 많이 종사하고 있거나 종사할 가능성이 높은 것으로 문헌에서 소개하고 있는 직군은 제조, 청소, 음식, 농수산업, 사무지원, 대인서비스, 예술・스포츠 등이다. 학교 및 지역사회에서의 직군 탐색, 각 직군에서 하는 일, 직군별 정보 수집, 직군별 관련 직종 등의 내용을 다룬다. 학교 및 지역사회에서 접할 수 있는 제조, 청소, 음식, 농수산업, 사무지원, 대인서비스, 예술・스포츠 등의 직군을 찾아보고 정보를 수집하여 다양한 직군에 대한 이해를 높이는 데 중점을 둔다.","n":[],"p":279,"b":3},{"c":"[9진로02-04]","k":"기본","sk":"","s":"진로와 직업","g":"중학교 1~3학년","d":"직업의 세계","t":"직군 체험을 통해 자신의 직업적 흥미나 관심이 있는 직군을 찾는다.","m":"다양한 직군을 탐색하고 체험하는 것은 자신의 직업적 흥미를 발견하는 바탕이 된다. 학교 및 지역사회에서의 직군에 대한 정보수집 및 체험 등의 내용을 다룬다. 학교 및 지역사회에서 체험할 수 있는 직군을 찾아보고 다양한 직군에 대해 직･간접적으로 경험하여자신의 직업적 흥미를 발견하도록 지도한다.","n":[],"p":279,"b":3},{"c":"[9진로03-01]","k":"기본","sk":"","s":"진로와 직업","g":"중학교 1~3학년","d":"작업 기초 능력","t":"직군별 작업 과정의 순서를 익힌다.","m":"여러 가지 직군에서 작업을 수행할 때 필요한 작업 기초 능력을 기르기 위해서는 제조에서부터 청소, 음식, 농수산업, 사무지원, 대인서비스, 예술·스포츠까지 직군별 작업 과정의 순서를 확인해야 한다. 또한 직군별 작업 과정의 순서를 익힌다. 학생의 특성과 관심 등을 고려하여 직군별 작업 과정의 순서에 맞게 작업을 수행할 수 있도록 지도한다.","n":[],"p":280,"b":3},{"c":"[9진로03-02]","k":"기본","sk":"","s":"진로와 직업","g":"중학교 1~3학년","d":"작업 기초 능력","t":"직군에 따라 올바른 방법으로 작업에 참여한다.","m":"직군에 따라 올바른 방법으로 작업함으로써 작업의 정확성과 지속성, 신속성을 향상시키고 직업인으로서 바른 작업 태도를 함양해야 한다. 직군별로 올바른 작업 방법을 알고 수행하기 등의 내용을 다룬다. 직군에 따라 올바른 방법으로 작업 활동에 참여함으로써 바람직한 직업 태도를 기르도록 한다.","n":[],"p":280,"b":3},{"c":"[9진로03-03]","k":"기본","sk":"","s":"진로와 직업","g":"중학교 1~3학년","d":"작업 기초 능력","t":"직군에 적합한 도구를 사용하여 작업의 효율을 높인다.","m":"직군에 따라 사용하는 작업 도구는 다르며, 직업인으로서 이를 효율적으로 활용하여 작업을 온전히 수행할 수 있어야 한다. 직군별로 적합한 작업 도구 활용하기 등의 내용으로 이루어진다. 직군별로 적합한 작업 도구를 효과적으로 사용하여 작업의 능률을 올리고 궁극적으로 직업생활이 잘 유지될 수 있도록 가르친다.","n":[],"p":280,"b":3},{"c":"[9진로03-04]","k":"기본","sk":"","s":"진로와 직업","g":"중학교 1~3학년","d":"작업 기초 능력","t":"직군별 작업 과정에서 안전에 유의한다.","m":"직군별 작업 과정에서 주의를 집중하며 활동에 참여함으로써 사고 발생을 예방하고, 안전하게 수행하는 능력은 직업생활을 유지하는 데 있어 중요한 요소이다. 직군별 작업 과정에서 유의 사항을 알고 실천하기 등의 내용을 다룬다. 직군별로 서로 다른 작업 과정에서 각각 환경적으로 위험한 요인을 줄이고 각종 사고를 대비하여 안전에 유의하는 작업 태도를 기르도록 한다.","n":[],"p":280,"b":3},{"c":"[9진로04-01]","k":"기본","sk":"","s":"진로와 직업","g":"중학교 1~3학년","d":"직업 태도","t":"용모, 복장, 위생, 금전 등에 대한 기본적인 자기 관리 능력을 기른다.","m":"직업생활뿐만 아니라 일상생활에서도 외출하기 전에 가정에서 씻고 준비하는 과정, 구체적으로 용모를 가꾸고 복장을 단정히 하며 위생에 유의하는 등 자기 관리가 요구된다. 적절한 옷차림하기, 몸단장하기, 금전 관리 등의 내용을 다룬다. 이 과정에서 실생활에서부터 자기 관리 능력을 길러 미래 직업인으로서 갖추어야 할 역량을 강화할 수 있도록 한다.","n":[],"p":281,"b":3},{"c":"[9진로04-02]","k":"기본","sk":"","s":"진로와 직업","g":"중학교 1~3학년","d":"직업 태도","t":"등하교, 수업, 점심, 쉬는 시간 등 시간에 대한 관리 능력을 기른다.","m":"약속 시간을 지키고 일의 중요성과 시급성을 구분·진단하여 시간을 효과적으로 관리하는 것은 사회생활에서 필수적인 요소이다. 등하교 시간 지키기, 수업 시간에 학습하기, 점심 시간에 식사하기, 쉬는 시간에 화장실 이용하기 등의 내용을 다룬다. 목적에 맞는 시간 분배를 하면서 규칙적인 생활과 함께 근면성을 기르도록 한다.","n":[],"p":281,"b":3},{"c":"[9진로04-03]","k":"기본","sk":"","s":"진로와 직업","g":"중학교 1~3학년","d":"직업 태도","t":"집에서 학교까지 통학 수단을 활용하여 이동한다.","m":"집에서 직장으로 출퇴근하기에 앞서 집에서 학교까지 상황에 맞는 교통수단을 활용하여 스스로 등하교를 할 수 있어야 한다. 도보로 통학하기, 대중교통 이용하기 등의 내용을 다룬다. 가정과 학교 그리고 지역사회의 익숙한 곳들 사이를 반복적으로 이동하는 훈련을 하여 이동 기술을 습득하고 숙달하여 일반화 및 유지에 이르도록 한다.","n":[],"p":281,"b":3},{"c":"[9진로04-04]","k":"기본","sk":"","s":"진로와 직업","g":"중학교 1~3학년","d":"직업 태도","t":"간단한 지시에 따라 과제를 수행한다.","m":"조직에는 다양한 구성원이 있고, 그 구성원들에게 개별적인 역할과 책임, 과제가 주어진다. 따라서 개개의 구성원들이 이를 수행해야 조직이 원활하게 운영되므로 상사의지시를 따르는 것이 중요하다. 간단한 지시 듣기, 간단한 지시 따르기 등의 내용을 다룬다. 구두와 서면 등의 간단한 지시에 따라 활동해 봄으로써 기본적인 직업 태도를 함양하도록 한다.","n":[],"p":281,"b":3},{"c":"[9진로04-05]","k":"기본","sk":"","s":"진로와 직업","g":"중학교 1~3학년","d":"직업 태도","t":"인사를 하고 예절을 지키며 원만한 대인 관계를 형성한다.","m":"학교나 직장 등 공동체 생활을 하려면 상대방에게 인사를 하고 예절을 지키며 의사소통을 하는 등 원만한 대인 관계를 형성하고 유지할 줄 알아야 한다. 대상과 상황에 적절한 인사하기, 예절 실천하기 등의 내용을 다룬다. 역할 놀이와 모의실험 학습 등 다양한 교수·학습 방법으로 대인 관계 능력을 기르도록 한다.","n":[],"p":281,"b":3},{"c":"[9진로04-06]","k":"기본","sk":"","s":"진로와 직업","g":"중학교 1~3학년","d":"직업 태도","t":"학교에서 요구되는 안전 규칙을 지킨다.","m":"지역사회에서 직업을 가지고 일을 수행할 때 근로 현장에서는 다양한 위험 요소가 존재하므로 사고를 예방하기 위해 학교에서부터 안전 의식 형성의 중요성이 더욱 강조된다. 진로와 직업 교육 및 교내 실습 시 안전 규칙 지키기 등의 내용을 다룬다. 학교에서 규칙을 준수하면서 장기적이고 지속적으로 안전 의식을 형성하고 기를 수 있도록 지도한다.","n":[],"p":281,"b":3},{"c":"[9진로05-01]","k":"기본","sk":"","s":"진로와 직업","g":"중학교 1~3학년","d":"진로 설계","t":"자신의 흥미·적성, 작업 기능, 전환 능력 등의 직업적 잠재력을 파악한다.","m":"자신의 직업적 잠재력을 파악하는 것은 미래를 설계하고 진로를 결정하는 데 중요한 기반이 된다. ‘자기 인식’ 영역과 연계하고 사회 심리 기능, 작업 기능, 신체 능력 등을 평가하여 직업적 잠재력을 파악하는 내용을 다룬다. 발달장애인용 직업흥미검사(NISE-VISIT), 전환능력검사(NISE-TEEMH) 등 다양한 직업평가를 활용하여 자신의 직업 흥미·적성, 작업 기능, 전환 능력 등의 직업적 잠재력을 파악하도록 한다.","n":[],"p":283,"b":3},{"c":"[9진로05-02]","k":"기본","sk":"","s":"진로와 직업","g":"중학교 1~3학년","d":"진로 설계","t":"특수학교, 일반고, 특성화고 등에 대한 진학 정보를 수집한다.","m":"자신의 진로에 적합한 진학 계획을 수립하려면 중학교 졸업 이후에 선택할 수 있는 다양한 교육 경로를 파악하는 과정이 필요하다. 교사와 함께 진학 관련 누리집, 학교 누리집 등에서 특수학교, 일반고, 특성화고 등의 위치, 교육과정, 졸업 후 진로 등의 정보를 수집하는 내용을 다룬다. 학교를 선택할 때에는 자신이 원하는 진로 방향뿐만 아니라 집과 가까운 학교, 교통이 편리한 학교 등 주변 여건도 함께 고려하도록 한다.","n":[],"p":283,"b":3},{"c":"[9진로05-03]","k":"기본","sk":"","s":"진로와 직업","g":"중학교 1~3학년","d":"진로 설계","t":"자신의 특성과 진학 정보를 연계하여 주요 관계자와 함께 진학 의사 결정에 참여한다.","m":"중학교 졸업 후에는 특수학교 또는 일반고나 특성화고의 일반 학급, 특수 학급, 순회 학급에 진학할 수 있다. 고등학교를 선택할 때 고려할 사항을 알아보고 자신의 흥미, 적성, 능력 등 직업 특성과 연계하여 자신의 진로에 가장 적합한 학교를 선택하는 의사 결정에 부모, 교사 등 주요 관계자와 함께 참여하는 내용을 다룬다. 자신의 특성과 진학 정보를 종합적으로 살펴보는 태도를 갖추면서 학교의 지리적 여건, 개인의 특성 등에서 비롯되는 진로 장벽 요인을 다각도로 분석하고 해결 방안을 모색하여 진학 계획을 세우도록 한다.","n":[],"p":283,"b":3},{"c":"[9진로05-04]","k":"기본","sk":"","s":"진로와 직업","g":"중학교 1~3학년","d":"진로 설계","t":"진학 결정에 능동적으로 참여하고 진학 계획을 점검하는 태도를 갖춘다.","m":"고등학교 진학 계획은 미래를 설계하기 위한 중요한 선택이므로 능동적인 자세로 진학 결정에 참여해야 한다. 직업 체험, 직업인 면담 등 적극적인 진로 체험의 장에 학생이 참여하도록 하고 다양한 교육 경로를 탐색하여 적절한 진학 기관을 선택했는지 교사와 함께 점검하기 등 진학 결정과 진학 계획 점검에 관한 내용을 다룬다. 능동적인 자세로 진학 결정에 참여하여 미래의 행복한 삶을 위한 첫걸음을 내디딜 수 있도록 한다.","n":[],"p":283,"b":3},{"c":"[9진로06-01]","k":"기본","sk":"","s":"진로와 직업","g":"중학교 1~3학년","d":"진로 준비","t":"자신이 선택한 고등학교에 대한 위치와 환경 등의 정보를 수집한다.","m":"자신이 진학할 고등학교에 대해 다양한 방법으로 정보를 수집하는 것은 진학 준비의 중요한 과정이다. 위성 지도, 거리 보기 등을 활용해 자신이 진학하고 싶은 고등학교의 위치와 거리, 등하교 방법 등을 확인하고 교사나 부모 등 주요 관계자의 도움을 받아 직접 학교를 방문하여 특별실이나 편의 시설과 같은 교육 환경에 대한 정보를 수집하는 등 고등학교 생활을 준비하는 과정에 참여한다. 학교를 방문할 때에는 견학 절차에 따라 계획을 세우고 예의 바른 태도로 견학하도록 한다.","n":[],"p":284,"b":3},{"c":"[9진로06-02]","k":"기본","sk":"","s":"진로와 직업","g":"중학교 1~3학년","d":"진로 준비","t":"자신이 선택한 고등학교 교육과정의 변화되는 점을 알아보고 준비하는 과정에 참여한다.","m":"고등학교에 진학한 후 변화되는 점을 알아보고 미리 준비하는 것은 고등학교 생활에 성공적으로 적응하기 위해 필요한 과정이다. 교사나 부모 등 주요 관계자의 도움을 받아 자신이 선택한 고등학교의 누리집, 입학 설명회, 선배와의 만남 등의 방법으로 진로와 직업을 포함한 교과, 창의적 체험 활동 등 진학 후 교육과정의 변화되는 점을 알아보고 고등학교 생활을 미리 준비하는 활동에 참여하는 내용을 다룬다. 새로운 친구와 선생님을 만나고 새롭게 변화되는 학교생활에 흥미를 느끼고 관심을 기울일 수 있도록 한다.","n":[],"p":284,"b":3},{"c":"[9진로06-03]","k":"기본","sk":"","s":"진로와 직업","g":"중학교 1~3학년","d":"진로 준비","t":"자신이 선택한 고등학교의 현장실습 유형과 방법을 알아보는 과정에 참여한다.","m":"고등학교를 졸업한 이후의 진로를 결정하거나 취･창업으로 전환하기 위한 준비를 위해 현장실습을 하는 것은 중요하다. 교내 직무체험형 현장실습, 산업체 직무체험형 현장실습, 정부 주도 취업연계형 현장실습 등 교내외 다양한 실습의 유형 중 자신이 선택한 학교에서 실시하는 현장실습을 교사나 부모 등 주요 관계자의 도움을 받아 알아보는 내용을 다룬다. 다양한 직업적 체험과 현장 적응력 제고 등을 위해 학생들이 학교에서 배운 지식과 기술을경험하고 적용하며, 현장실습의 중요성을 인지하여 체계적으로 참여할 수 있도록 안내한다.","n":[],"p":284,"b":3},{"c":"[9진로06-04]","k":"기본","sk":"","s":"진로와 직업","g":"중학교 1~3학년","d":"진로 준비","t":"진로 관련 교내 체험 및 지역사회 기관 탐방 등에 능동적인 자세로 참여한다.","m":"진로를 준비하려면 자신이 선택한 진로에 잘 적응하고 필요한 능력을 키울 수 있도록 도와주는 진로 체험 활동이 필요하다. ‘직업의 세계’ 영역에서 제시한 직군과 연계한 교내 진로 체험 활동을 하거나 지역사회의 다양한 기관을 탐방하면서 진로 정보를 파악하는 등 능동적인 자세로 진로 준비에 참여하는 내용을 다룬다. 다양한 진로 체험 활동으로 자신에게 적합한 진로 방향을 확인하고 필요한 능력을 파악하여 준비할 수 있도록 한다.","n":[],"p":284,"b":3},{"c":"[12진로01-01]","k":"기본","sk":"","s":"진로와 직업","g":"고등학교 1~3학년","d":"자기 인식","t":"자신의 신체적 특성을 파악한다.","m":"개인의 신체적 특성은 진로·직업 선택에 있어 중요 요소가 되며 키, 체중, 힘의 활용 등이 해당된다. 자신의 신체적 특성과 함께 다양한 직군 및 직무에서 요구하는 신체적 능력을 이해하여 나에게 맞는 직업을 알아본다. 실제로 다양한 체력 측정 활동을 하여 자신의 신체적 특성과 활용 능력을 파악할 수 있도록 하며, ‘진로 설계’ 영역의 직업적 특성 평가와 연계하여 지도한다.","n":[],"p":286,"b":3},{"c":"[12진로01-02]","k":"기본","sk":"","s":"진로와 직업","g":"고등학교 1~3학년","d":"자기 인식","t":"자신의 심리·태도적 특성 등을 파악한다.","m":"개인에 대한 다양한 측면의 이해·평가는 올바른 진로 방향 설정과 직업 선택의 기초가 된다. 자신의 성격, 흥미, 적성, 태도, 사회성, 환경 적응 능력 등을 각종 검사 도구를 활용하여 파악하며, ‘진로 설계’ 영역의 직업적 특성 평가와 연계하여 지도한다. 중학교에서 파악한 나의 특성과 비교하며 현재의 자신을 이해하고 발전시키는 기초를 마련한다.","n":[],"p":286,"b":3},{"c":"[12진로01-03]","k":"기본","sk":"","s":"진로와 직업","g":"고등학교 1~3학년","d":"자기 인식","t":"자신의 특성을 직업과 연결하여 강점을 찾고 꿈을 표현한다.","m":"신체, 심리, 태도 등 다양한 측면에서 파악한 나의 특성을 직업과 관련하여 분석하는 과정은 진로 설계의 기반이 된다. 내가 하고 싶은 직업 찾기, 나의 강점을 직업과 연결하기, 나에게 적합한 직무 찾아보기 등의 내용을 다룬다. 나의 직업적 강점을 찾는 데 집중하여 미래에 대한 긍정적 태도를 형성할 수 있도록 한다.","n":[],"p":286,"b":3},{"c":"[12진로01-04]","k":"기본","sk":"","s":"진로와 직업","g":"고등학교 1~3학년","d":"자기 인식","t":"자신의 강점을 발전시키는 방법을 찾아 실천하여 자기개발에 주체적인 자세를 갖춘다.","m":"미래를 위한 주체적 자세와 긍정적 태도는 직업적 자기 개발을 계획하고 실천하는 과정에서 형성된다. 내가 그려본 미래의 모습과 지금의 나, 현재 나의 직업적 강점을 강화하기 위해 가정과 학교에서 할 수 있는 방법 등 실천적 행동과 노력을 위한 내용을 다룬다. 각종 직업 교육 프로그램 및 실습 참여, 체력 증진 등 구체적이고 실천 가능한 방법을 찾아 학생 스스로 참여하고 노력하는 데 지도 중점을 두도록 한다.","n":[],"p":286,"b":3},{"c":"[12진로01-05]","k":"기본","sk":"","s":"진로와 직업","g":"고등학교 1~3학년","d":"자기 인식","t":"졸업 후 삶의 모습을 구체적으로 구상하며 미래에 대한 긍정적 태도를 기른다.","m":"자기 이해와 함께 자기 개발의 실천을 기반으로 한 미래의 설계는 미래에 대한 긍정적 태도를 형성하게 한다. 졸업 후 나의 직업적 꿈과 희망, 가정생활의 형태, 여가생활 등 삶의 모습을 구체적으로 구상해 보고 이를 위한 실천 목록을 명확화하고 실제로 수행하는 과정에서 진로 결정 자기 효능감을 높인다. 의사 결정과 실천을 통한 목표 수행 등 미래를 위한 습관 및 태도의 함양, 배움의 계획·실천으로 보다 적극적이며 능동적인 진로·직업 교육이 이루어지도록 한다.","n":[],"p":286,"b":3},{"c":"[12진로02-01]","k":"기본","sk":"","s":"진로와 직업","g":"고등학교 1~3학년","d":"직업의 세계","t":"직업을 통해 얻을 수 있는 기쁨과 보람을 찾는다.","m":"직업은 개인, 가정, 사회적으로 가치가 있고 사람들은 자신의 일을 통해 기쁨과 보람을 찾는다. 일의 가치, 일을 통한 기쁨과 보람 등 직업을 통해 얻을 수 있는 내용을 다룬다. 직업이 주는 다양한 가치에서 보람을 느끼며 가족 및 사회 구성원으로서 직업인의 역할을 책임감 있게 수행하고 직업인으로서 긍지를 느낄 수 있도록 지도한다.","n":[],"p":288,"b":3},{"c":"[12진로02-02]","k":"기본","sk":"","s":"진로와 직업","g":"고등학교 1~3학년","d":"직업의 세계","t":"미래 사회에 적합한 새로운 직종의 정보를 수집하고 관심을 갖는 태도를 기른다.","m":"미래 변화에 따라 새로운 직업들은 계속 생겨나므로 새로운 직종에 대해 관심을 기울이고 적응력을 키우는 것은 취업 및 직업 유지에 매우 중요한 요소이다. 미래 직업 변화, 새로운 직종과 유망 직종 탐색 등 새로운 직업 정보를 다룬다. 새롭게 개발되는 직종에 관심을 가지고 정보를 수집 및 체험함으로써 새로운 직종에 대한 자신의 직업적 흥미를 발견하는 데 중점을 둔다.","n":[],"p":288,"b":3},{"c":"[12진로02-03]","k":"기본","sk":"","s":"진로와 직업","g":"고등학교 1~3학년","d":"직업의 세계","t":"학교 및 지역사회의 직종을 탐색하여 각 직종에 대한 정보를 수집한다.","m":"문헌에서 지적장애 및 자폐성 장애인이 현재 많이 종사하고 있거나 종사할 가능성이 높은 것으로 소개하고 있는 직종은 조립, 생산, 운송판매, 실내외청소, 세차, 세탁, 패스트푸드, 조리, 음료, 재배, 사육, 수산업, 사무보조, 사서보조, 우체국, 유아보조, 노인장애인 보조, 미용, 음악, 미술, 스포츠 등이다. 학교 및 지역사회에서의 직종 탐색, 각 직종에서 하는 일 등을 다룬다. 자신의 주변에서 다양한 직종을 찾아보고 각 직종에서 하는 일에 대한 정보를 수집하는 활동이 강조된다.","n":[],"p":288,"b":3},{"c":"[12진로02-04]","k":"기본","sk":"","s":"진로와 직업","g":"고등학교 1~3학년","d":"직업의 세계","t":"직종 체험을 통해 흥미나 관심이 있는 직종을 찾는다.","m":"다양한 직종에 대한 탐색과 체험을 통해 자신의 직업적 흥미를 발견하는 것은 졸업 후 자신의 원하는 직업을 선택하는 데 도움이 된다. 학교 및 지역사회에서의 직종 체험, 자신이 흥미 있는 직종에 대한 정보 수집 및 체험 등 직종 관련 체험 및 정보를 다룬다. 학교 및 지역사회에서 다양한 직종을 찾아 체험하고 직・간접 경험을 통해 자신이 흥미와 관심이 있는 직종을 발견하는 데 중점을 둔다.","n":[],"p":288,"b":3},{"c":"[12진로03-01]","k":"기본","sk":"","s":"진로와 직업","g":"고등학교 1~3학년","d":"작업 기초 능력","t":"직종에 따라 작업 단계와 절차를 확인한다.","m":"지역사회에서 여러 가지 직종을 수행하는 데 필요한 작업 기초 능력을 기르기 위해 조립에서부터 스포츠까지 직종별 작업 단계와 절차를 점검하는 것이 필요하다. 직종별 작업 수행과 기기 활용 등의 내용을 다룬다. 학생의 직업적 특성과 흥미, 관심 등을 종합적으로 고려하여 직종별 작업 단계와 절차에 따라 맞춤형으로 점검하여 실제적인 작업 수행에 도움이 될 수 있도록 한다.","n":[],"p":289,"b":3},{"c":"[12진로03-02]","k":"기본","sk":"","s":"진로와 직업","g":"고등학교 1~3학년","d":"작업 기초 능력","t":"직종에 따라 필요한 올바른 작업 기술을 익힌다.","m":"직종에 따라 필요한 작업 기술을 습득하여 숙달함으로써 작업의 정확성과 신속성 그리고 지속성을 향상할 수 있다. 직종별로 필요한 작업 기술을 익히고 실습하기 등의 내용을 다룬다. 지역사회의 다양한 직업 현장에서 자신에게 요구되는 작업을 수행할 때 필요한 직종에 따른 구체적인 작업 기술을 익히도록 한다.","n":[],"p":289,"b":3},{"c":"[12진로03-03]","k":"기본","sk":"","s":"진로와 직업","g":"고등학교 1~3학년","d":"작업 기초 능력","t":"직종에 적합한 기기를 활용하여 작업의 능률을 높인다.","m":"직종에 따라 사용하는 작업 기기는 제각기 다르며, 지역사회의 실제 직업 현장에서는 이를 상황에 맞게 적절히 활용하여 작업을 수행할 수 있어야 한다. 직종에 적합한 작업 기기를 사용하고 관리하기 등의 내용을 다룬다. 직종에 따라 적합한 작업 기기를 효율적으로활용하여 작업의 능률과 지속성을 높일 수 있도록 한다.","n":[],"p":289,"b":3},{"c":"[12진로03-04]","k":"기본","sk":"","s":"진로와 직업","g":"고등학교 1~3학년","d":"작업 기초 능력","t":"직종별 작업 수행 시 필요한 안전한 작업 습관을 기른다.","m":"직종별 작업 과정에서 수많은 위험 요인으로 인해 발생할 수 있는 사고를 예방하고 주의를 기울여 작업을 안전하게 수행하는 능력은 직업생활을 유지하는 데 있어 중요한 요소이다. 직종별 작업 과정에서의 유의 사항을 알고 지키기 등의 내용을 다룬다. 직종별로 서로 다른 작업 과정에서 안전에 유의하는 작업 습관을 기르도록 하여 미래 직업생활을 준비할 수 있도록 한다.","n":[],"p":289,"b":3},{"c":"[12진로04-01]","k":"기본","sk":"","s":"진로와 직업","g":"고등학교 1~3학년","d":"직업 태도","t":"호칭, 역할, 책임, 급여 등에 대한 직업적인 자기 관리 능력을 기른다.","m":"직업인으로서 자신에게 주어진 일에 긍지와 자부심을 가지고 사회적인 역할과 책임을 다하는 것은 타인에게 인정을 받음은 물론이고, 근무 태도 향상에 영향을 미치며 결과적으로 자아실현에 도움이 된다. 직업인의 역할과 책임, 급여 관리 등의 내용을 다룬다. 직업 의식 함양으로 직업적 책무성을 길러 올바른 직업 태도 형성과 함께 성공적인 직업 생활을 준비할 수 있도록 한다.","n":[],"p":290,"b":3},{"c":"[12진로04-02]","k":"기본","sk":"","s":"진로와 직업","g":"고등학교 1~3학년","d":"직업 태도","t":"출퇴근, 근로, 점심, 휴게시간 등 시간에 대한 관리 능력을 기른다.","m":"직장 생활을 성실하게 하기 위해서는 시간을 관리하는 능력이 중요하다. 출퇴근 시간을 지키기, 근로 시간에 집중하기, 점심시간에 식사하기, 휴게 시간에 개인적인 용무 보기 등의 내용을 다룬다. 이를 바탕으로 시간을 지키고 관리하는 능력을 길러 일의 우선순위를 정하고 시간을 효율적으로 활용하는 데 중점을 두어 지도한다.","n":[],"p":290,"b":3},{"c":"[12진로04-03]","k":"기본","sk":"","s":"진로와 직업","g":"고등학교 1~3학년","d":"직업 태도","t":"집에서 직장까지 교통 수단을 활용하여 이동한다.","m":"지역사회에 통합된 구성원으로 살아가려면 가정에서 직장까지 적절한 교통수단을 활용하여 출퇴근할 수 있어야 한다. 목적지까지 길 찾기, 대중교통 환승하기 등의 내용을 다룬다. 직업인으로서 다양한 교통수단을 효율적으로 이용하여 독립적으로 출퇴근할 수 있도록 지도한다.","n":[],"p":290,"b":3},{"c":"[12진로04-04]","k":"기본","sk":"","s":"진로와 직업","g":"고등학교 1~3학년","d":"직업 태도","t":"연속된 지시에 따라 과제를 수행한다.","m":"직장 생활을 성공적으로 하기 위해서는 회사에서 받은 지시를 수행하고 자신에게 주어진 업무를 완수해야 한다. 연속된 작업 지시 수용하기, 연속된 지시 이행하기 등의 내용을 다룬다. 이 과정에서 직장에 적응하는 능력을 길러 궁극적으로 자신과 주변인이 모두 만족하는 행복한 직장 생활을 영위할 수 있도록 한다.","n":[],"p":290,"b":3},{"c":"[12진로04-05]","k":"기본","sk":"","s":"진로와 직업","g":"고등학교 1~3학년","d":"직업 태도","t":"상대와 상황에 따라 적절한 소통을 하고 직장 예절을 지켜 원만한 대인 관계를 유지한다.","m":"직장에서는 생각과 의견이 다양한 사람들이 함께 모여 일하기 때문에 문제 상황과 갈등이 발생할 수 있는데, 이를 줄이려면 직장 예절을 실천해야 한다. 경청과 공감하기, 나의 의견 적절하게 표현하기 등의 내용을 다룬다. 이를 바탕으로 직장에서 소통하는 능력을 길러 결속력을 형성하고 직장의 목표를 함께 달성하는 데 협력할 수 있도록 중점을 두어 지도한다.","n":[],"p":290,"b":3},{"c":"[12진로04-06]","k":"기본","sk":"","s":"진로와 직업","g":"고등학교 1~3학년","d":"직업 태도","t":"직장에서 지켜야 할 안전 수칙을 이해하고 준수한다.","m":"사고는 대부분 부주의와 방심으로 생기기 때문에 사고를 예방하려면 직장에서 안전 수칙을 준수해야 하며, 이를 통해 여러 가지 위험으로부터 자신뿐 아니라 동료를 보호할 수 있다. 안전 수칙 준수하기, 여러 가지 유형의 사고 알아보기 등의 내용을 다룬다. 직장에서 지켜야 할 안전 수칙을 준수하여 언제 일어날지 모르는 각종 사고에 대처할 수 있는 능력을 길러야 한다.","n":[],"p":290,"b":3},{"c":"[12진로05-01]","k":"기본","sk":"","s":"진로와 직업","g":"고등학교 1~3학년","d":"진로 설계","t":"자신의 특성, 진로, 직업 등에 대한 평가 결과를 종합하여 직업 특성을 파악한다.","m":"진로를 설계하려면 가장 먼저 자신을 객관적으로 파악해야 한다. ‘자기 인식’ 영역에서 평가한 내용을 바탕으로 국립특수교육원, 커리어넷, 워크넷에서 전환능력검사, 직업 평가 등을 실시하여 직업 흥미·적성, 작업 기능, 신체 능력 등을 평가한 후 모든 자료를 종합하여자신의 직업 특성을 정리하는 내용을 다룬다. 객관적이고 심층적인 평가 결과를 활용하여 자신의 직업 특성을 파악하는 데 중점을 둔다.","n":[],"p":292,"b":3},{"c":"[12진로05-02]","k":"기본","sk":"","s":"진로와 직업","g":"고등학교 1~3학년","d":"진로 설계","t":"자립생활, 직업생활, 계속교육 등 졸업 후 진로 정보를 수집한다.","m":"자신의 직업 특성과 연계하여 진로를 결정하려면 우선 졸업 이후의 다양한 진로를 탐색하고 정보를 수집하는 절차가 필요하다. 장애인고용공단, 각 지자체의 누리집, 안내 책자 등 다양한 경로로 자립생활, 직업생활, 계속교육을 할 수 있는 기관명, 위치, 하는 일 등을 수집하는 내용을 다룬다. 진로와 관련하여 신뢰할 수 있는 최신 정보를 수집하도록 한다.","n":[],"p":292,"b":3},{"c":"[12진로05-03]","k":"기본","sk":"","s":"진로와 직업","g":"고등학교 1~3학년","d":"진로 설계","t":"자신의 직업 특성과 진로 정보를 연계한 진로 의사 결정에 참여한다.","m":"진로는 자신의 특성과 제반 여건을 종합한 결과를 바탕으로 설계해야 한다. 자립생활, 직업생활, 계속교육을 하려면 필요한 능력이 무엇인지 확인하고 자신의 직업 관련 평가 결과와 연계하여 가장 적합한 진로 방향을 설정하는 데 참여하는 내용을 다룬다. 진로 의사 결정을 할 때 진로 장벽이나 갈등이 무엇인지 파악하여 해결함으로써 합리적인 선택을 할 수 있도록 한다.","n":[],"p":292,"b":3},{"c":"[12진로05-04]","k":"기본","sk":"","s":"진로와 직업","g":"고등학교 1~3학년","d":"진로 설계","t":"지역사회에 적응하고 독립적으로 살아갈 수 있도록 자립생활 계획에 참여한다.","m":"고등학교를 졸업한 후 주간 보호 시설, 공동생활 가정 등 성인생활 지원 기관이나 가정에서 살아가게 될 학생들은 자립생활 기술을 익혀 독립적으로 살아갈 준비를 해야 한다. ‘직업 태도’ 영역과 연계하고 자기 관리, 대중교통 이용, 지역사회 기관 이용 등 자립생활 기술을 어떻게 습득해야 할지 계획하는 내용을 다룬다. 개인생활, 사회생활, 여가생활 측면에서 자신의 능력을 파악하여 가장 중요하고 필요한 기술을 익히도록 계획하는 데 중점을 둔다.","n":[],"p":292,"b":3},{"c":"[12진로05-05]","k":"기본","sk":"","s":"진로와 직업","g":"고등학교 1~3학년","d":"진로 설계","t":"취･창업 정보를 활용한 진로 계획에 참여한다.","m":"고등학교를 졸업한 후 취･창업을 희망하는 학생들은 원하는 분야의 구체적인 정보를 바탕으로 진로 계획을 수립하고 변화에 대응하도록 한다. 취업을 희망하는 학생들은 인터넷이나 일자리 정보지 등을 이용하여 자신이 원하는 취업 관련 기관의 위치, 하는 일, 채용 정보 등의 구체적인 정보를 수집한다. 창업을 희망하는 학생들은 기업가 정신을 함양하고 맞춤형 창업 교육 프로그램에 참여하거나 창업 계획서를 작성해 본다. 실제적인 교내외 현장실습이나 체험 중심의 흥미로운 프로그램으로 학생들의 직업 특성에 맞는 취창업을 지도하도록 한다.","n":[],"p":292,"b":3},{"c":"[12진로05-06]","k":"기본","sk":"","s":"진로와 직업","g":"고등학교 1~3학년","d":"진로 설계","t":"전공과, 대학, 평생교육 기관의 정보를 활용한 진로 계획에 참여한다.","m":"고등학교를 졸업한 후 전공과나 대학 진학 등 계속교육을 희망하는 학생들은 진학을 위한 능력을 향상할 수 있도록 구체적인 진로 계획을 세우는 것이 필요하다. 진학 기관의 입시 정보, 교육과정, 위치 등의 정보를 바탕으로 학생의 적성과 소질에 맞는 교육 기관과 프로그램을 선택하고 준비해야 할 사항을 찾아 계획하는 내용을 다룬다. 학업에 대한 중요성을 인식하고 긍정적 태도로 미래를 준비할 수 있게 진로를 계획하도록 한다.","n":[],"p":292,"b":3},{"c":"[12진로05-07]","k":"기본","sk":"","s":"진로와 직업","g":"고등학교 1~3학년","d":"진로 설계","t":"진로 결정에 능동적으로 참여하고 진로 계획을 점검하는 태도를 기른다.","m":"고등학교를 졸업한 후의 진로 계획은 매우 구체적이고 신중하게 작성해야 한다. 다양한 정보를 종합적으로 살펴보고 자신의 특성에 맞는 진로를 능동적인 자세로 신중하게 선택하여 계획하였는지 확인하는 내용을 다룬다. 진로 계획을 수립할 때 학생의 결정을 존중하며 폭넓은 탐색 과정을 거쳐 현명하게 진로를 선택하고 진로 계획을 점검하는 습관과 태도를 기르도록 한다.","n":[],"p":292,"b":3},{"c":"[12진로06-01]","k":"기본","sk":"","s":"진로와 직업","g":"고등학교 1~3학년","d":"진로 준비","t":"자신이 선택한 지역사회 전환 기관의 이용 정보를 다양한 방법으로 조사한다.","m":"성공적인 성인기 생활을 하기 위해 자신이 선택한 지역사회 전환 기관의 이용 정보를 조사하는 것은 중요한 전환 준비 과정이다. 지역사회 전환 기관의 공고문 살펴보기, 전환을 위한 절차 조사하기 등 지역사회 전환 기관의 이용 정보를 조사하는 내용을 다룬다. 자신이 선택한 진로 기관의 정보와 이용 절차 등을 다양한 방법으로 조사하여 준비해야 할 내용이 무엇인지 파악하는 데 중점을 둔다.","n":[],"p":294,"b":3},{"c":"[12진로06-02]","k":"기본","sk":"","s":"진로와 직업","g":"고등학교 1~3학년","d":"진로 준비","t":"자신이 선택한 지역사회 전환 기관의 서류를 형식에 맞게 작성하고 면접을 준비한다.","m":"자신이 선택한 기관으로 전환하고자 서류와 면접을 준비하는 것은 전환 준비 과정에서 필수적이다. 이력서, 주민등록등본 등 자신이 선택한 지역사회 전환 기관에서 요구하는 다양한 서류의 종류 알기, 형식에 맞게 서류 준비하기, 모의 면접하기 등 서류 작성과 면접 준비에 대한 내용을 다룬다. 현장 체험 활동으로 전환 서류 발급 장소와 방법을 익히고 스스로 서류를 작성할 수 있도록 충분한 기회를 제공하도록 한다.","n":[],"p":294,"b":3},{"c":"[12진로06-03]","k":"기본","sk":"","s":"진로와 직업","g":"고등학교 1~3학년","d":"진로 준비","t":"교내외 현장실습 등으로 지역사회 전환 기관에서 필요한 생활 기능을 익혀 진로를 준비한다.","m":"자립생활, 직업생활, 계속교육 중 자신이 선택한 지역사회 전환 기관에서 요구하는 생활 기능을 익히는 것은 기관에 잘 적응하고 자립생활을 유지하기 위해 반드시 필요하다. 대중교통 이용하기, 금전 관리하기, 여가활동 계획하기 등을 교내외 현장실습으로 익히는 내용을 다룬다. 성인기의 독립적인 생활을 영위하는 데 필요한 기본 생활 기능을 바탕으로 각 전환 기관에서 요구되는 생활 기능을 일반화하고 유지하는 데 중점을 둔다.","n":[],"p":294,"b":3},{"c":"[12진로06-04]","k":"기본","sk":"","s":"진로와 직업","g":"고등학교 1~3학년","d":"진로 준비","t":"교내외 현장실습 등으로 지역사회 전환 기관에서 필요한 직무 기능을 익혀 능동적인 자세로 진로를 준비한다.","m":"자립생활, 직업생활, 계속교육 중 자신이 선택한 지역사회 전환 기관에서 요구하는 직무 기능을 익히는 것은 전환 후 각 기관에 잘 적응하는 데 중요한 요소이다. 자립생활, 직업생활, 계속교육 중 자신이 선택한 전환 기관의 특성에 따라 필요한 직무 기능을 분석하고 교내 직무 체험형 현장실습이나 교외 장애 맞춤 기관 직무 체험형 현장실습 등 다양한 유형의 현장실습으로 직무 기능이 숙련될 수 있도록 학습하는 내용을 다룬다. 학습 중심현장실습으로 실질적인 직무 기능을 익혀 능동적인 자세로 진로를 준비할 수 있도록 한다.","n":[],"p":294,"b":3},{"c":"[4체육01-01]","k":"기본","sk":"","s":"체육","g":"초등학교 3~4학년","d":"운동","t":"체력 운동을 경험하고 운동에 관심을 기울인다.","m":"이 성취기준은 일반적인 체력 운동을 실행하기 전 단계의 학생들이 체력 운동과 관련된 여러 움직임과 활동을 경험할 수 있도록 설정하였다. 신체 부위별 움직임 알기, 물체 들어 올리고 내리기와 당기고 밀기(근력 및 근지구력), 물건 가져오면서 왕복달리기(심폐지구력), 재미있는 동작으로 구성한 스트레칭과 관절 운동(유연성) 등을 다룬다. 초보 형태의 놀이나 활동으로 구성된 체력 운동을 경험하면서 체력을 기르고 체력에 관심을 기울일 수 있도록 한다.","n":["장애 정도가 심한 학생의 움직임을 지도할 때에는 동작 시범과 설명, 그리고 신체적 촉진을 사용하여 최적의 학습이 가능하도록 한다. 뇌병변장애 학생은 관절의 경직도, 근육의 경련, 관절가동범위 등을 유의하고, 스트레칭 동작에서는 신체적으로 교정해 주고 스트레칭의 강도를 교사가 조정하여 실시한다. 시각중복장애 학생의 경우 동작을 그림과 사진으로 제시한 인쇄물 또는 동영상을 확대경으로 확인하거나 교사의 동작을 촉지각하여 학습하도록 한다."],"p":307,"b":3},{"c":"[4체육01-02]","k":"기본","sk":"","s":"체육","g":"초등학교 3~4학년","d":"운동","t":"신체와 주변을 청결하게 관리하고 청결 의식을 기른다.","m":"이 성취기준은 건강 생활을 위한 질병 예방과 자신의 신체와 주변을 청결하게 하는 능력을 기르기 위해 설정하였다. 자신의 몸 깨끗이 관리하기와 가정 및 학교에서 주변 청결하게 하기를 다룬다. 이 과정에서 청결의 의미를 알고 바른 청결 습관을 형성하여 건강한 생활을 할 수 있는 능력을 기르는 데 중점을 둔다.","n":["장애 정도가 심한 학생이 어려움을 보이는 특정 과제(예: 양치질하기)는 학교의 일과 중(예: 점심 식사 직후)에 반복적으로 지도하여 바른 습관이 형성되도록 한다."],"p":308,"b":3},{"c":"[4체육01-03]","k":"기본","sk":"","s":"체육","g":"초등학교 3~4학년","d":"운동","t":"야외활동에서 안전사고를 예방하고 안전 의식을 기른다.","m":"이 성취기준은 건강 생활의 한 요소로 야외활동이나 체육 수업을 할 때 환경을 고려하여 주의할 점을 알고 안전하게 행동하도록 설정하였다. 신체활동에 사용하는 기구, 활동 장소, 날씨 등과 관련하여 주의해야 할 행동을 알고 실천하기를 다룬다. 학습한 안전사고 예방 수칙을 학교와 지역사회 생활에서 실천할 수 있도록 하는 데 중점을 둔다.","n":["장애 정도가 심한 학생은 그림 카드나 영상에서 안전하게 행동하는 것 구별하기, 비디오 모델링이나 모방 학습 등을 학생의 기능 수준에 맞게 사용하여 지도하도록 한다."],"p":308,"b":3},{"c":"[4체육02-01]","k":"기본","sk":"","s":"체육","g":"초등학교 3~4학년","d":"스포츠","t":"달리기와 물 익히기를 경험하고 적극적인 자세로 움직임을 탐색한다.","m":"이 성취기준은 달리기 경험에서 양팔과 양다리를 사용하여 빠르게 이동하는 능력, 물 익히기에서 물속 활동의 공포감을 줄이고 물의 특성을 파악한 후 물속에서 움직이는 능력을 기르기 위해 설정하였다. 달리기 경험은 팔과 다리 흔들기와 짧은 거리 달리기 등으로, 물 익히기는 물 밖과 물 안에서 물에 적응하는 활동으로 구성한다. 달리기와 물 익히기를 경험하는 과정에서 학생들이 흥미를 느끼고 움직임의 특징을 탐색하도록 한다.","n":["장애 정도가 심한 학생이 물을 두려워하는 경우 체계적 둔감법을 적용하여 물에 적응하게 한다. 먼저 교실에서 영상으로 물놀이하는 장면을 시청한 후 수영장 밖에서 물놀이하는 학생들의 모습 관찰하기, 세숫대야에 물을 떠 놓고 손과 얼굴 씻기 및 얼굴 담그기, 수영장 턱에 걸터앉아 발장구 치기, 물 높이가 낮은 수영장에서 이동하기 등의 순서로 활동함으로써 물에 대한 공포감을 줄이고 적응하도록 한다."],"p":309,"b":3},{"c":"[4체육02-02]","k":"기본","sk":"","s":"체육","g":"초등학교 3~4학년","d":"스포츠","t":"움직임 특성을 이해하고 뜀뛰기와 물체 던지기를 경험한다.","m":"이 성취기준은 한 발 또는 양발로 뜀뛰는 동작, 한 손 또는 양손을 사용하여 여러 가지 물체를 던지는 동작을 익히기 위해 설정하였다. 뜀뛰기는 기구를 사용하지 않거나 기구를 사용하여 뜀뛰기, 물체 던지기는 여러 가지 물체를 다양한 높이에서 한 손이나 양손을 사용하여 던지기 등을 다룬다. 뜀뛰기와 물체 던지기를 경험하면서 동작의 다양성과 거리에 대한 개념을 익히는 데 중점을 둔다.","n":["장애 정도가 심한 학생은 기능 수준에 따라 뜀뛰기 거리와 높이를 조정하여 처음에는 짧은 거리나 낮은 높이에서 실시하도록 하고 기능이 향상되면 점차 거리와 높이를 증가시키며 활동하도록 한다."],"p":309,"b":3},{"c":"[4체육02-03]","k":"기본","sk":"","s":"체육","g":"초등학교 3~4학년","d":"스포츠","t":"움직임 특성을 이해하고 이동 및 비이동 움직임을 경험한다.","m":"이 성취기준은 동작 도전 활동에서 활용되는 기본 움직임 능력을 기르기 위해 설정하였다. 연령과 기능 수준에 맞는 비이동 움직임과 이동 움직임을 다룬다. 비이동 움직임과 이동 움직임의 다양성을 파악하고, 음악 요소를 포함하여 활동에 대한 흥미와 동기를 높이는 데 중점을 준다.","n":["장애 정도가 심한 학생은 이동 및 비이동 움직임을 실시할 때 짝이나 교사가 지속적으로 동작을 보여주면서 모방하게 하고, 필요한 경우 신체적 촉진을 받아 학습하는 과정에서 개념을 습득하도록 한다."],"p":309,"b":3},{"c":"[4체육02-04]","k":"기본","sk":"","s":"체육","g":"초등학교 3~4학년","d":"스포츠","t":"물체 조작 움직임을 경험하고 적극적인 자세로 움직임을 탐색한다.","m":"이 성취기준은 여러 가지 물체 조작 움직임 기능을 익히기 위해 설정하였다. 주로 공을 사용하여 던지기, 치기, 차기, 굴리기 등을 다룬다. 공 이외에도 다양한 물체를 사용하여 활동하면서 물체 조작 움직임이 표적에 가까이 물체를 보내는 데 사용된다는 점을 강조한다.","n":["장애 정도가 심한 학생이 물체 조작 움직임을 연습할 때에는 가까운 곳에 표적을 두고 쓰러뜨리게 함으로써 성공 가능성을 증가시키고 활동에 대한 흥미와 활동 참여 동기를 높여 주도록 한다. 특히 시각중복장애 학생은 표적 근처에서 교사의 목소리나 박수 소리, 전자 호각 등의 음향을 제공하여 학생이 표적을 향하여 던지거나 굴리는 활동이 가능하도록 한다. 또한 표적을 맞혔을 때 음향 신호가 발생하여 표적 맞히기 도전이 성공했다는 것을 확인 및 강화 받을 수 있도록 지도한다."],"p":309,"b":3},{"c":"[4체육02-05]","k":"기본","sk":"","s":"체육","g":"초등학교 3~4학년","d":"스포츠","t":"민속 표현의 기본 움직임을 익히고 움직임의 즐거움을 안다.","m":"이 성취기준은 우리나라와 외국 민속 무용에 포함된 기본 움직임을 익히기 위해 설정하였다. 우리나라 민속 무용의 자세와 움직임 모방하기, 외국 민속 무용의 스텝 등을 다룬다. 우리나라와 외국의 민속 무용에서 사용되는 기초 움직임을 반복하여 연습하는 과정에서 음악을 사용하여 활동의 즐거움을 알도록 하는 데 중점을 둔다.","n":["장애 정도가 심한 학생은 특정 움직임을 재구성한 동작으로 실시할 수 있다. 일례로, 외국 민속 무용의 기초 동작인 ‘힐앤토’는 발을 지면에 붙여 실시하고 ‘스키핑 스텝’은 걷기로 재구성하여 수행한다."],"p":310,"b":3},{"c":"[4체육02-06]","k":"기본","sk":"","s":"체육","g":"초등학교 3~4학년","d":"스포츠","t":"움직임 표현의 기본 움직임을 익히고 움직임을 즐기는 태도를 기른다.","m":"이 성취기준은 이동 및 비이동 움직임의 기본 기능을 익히기 위해 설정하였다. 동작 모방하기, 몸으로 숫자와 한글 표현하기, 신체의 한 부위 움직이기, 온몸 움직이기, 방향, 크기 및 높이 다르게 표현하기 등을 다룬다. 동작으로 모방하고 표현하기 활동은 개인별로 자유롭고 다양하게 실시할 수 있다는 것을 알게 하고 활동의 즐거움을 느끼도록 하는 데 중점을 둔다.","n":["장애 정도가 심한 학생이 움직임을 표현할 때에는 동작의 질보다는 표현하려는시도에 초점을 맞추고 강화를 많이 제공하도록 한다."],"p":310,"b":3},{"c":"[4체육02-07]","k":"기본","sk":"","s":"체육","g":"초등학교 3~4학년","d":"스포츠","t":"공 보내기의 기본 움직임 방법을 이해하고 바르게 수행한다.","m":"이 성취기준은 축구, 농구, 플로어볼 등에서 원하는 대상이나 위치로 공을 조작하는 활동의 초보적인 움직임을 경험하도록 설정하였다. 큰 공 차기, 큰 공 던지고 받기, 스틱으로 공치기 등을 다룬다. 기본 움직임을 익히는 단계이므로 동작을 반복하여 연습하도록 하고 기초 수준 움직임의 정확성을 높이는 데 중점을 둔다.","n":["장애 정도가 심한 학생은 공차기에서 디딤발의 위치가 공 뒤에 놓이고, 공받기에서 양손이 아니라 몸으로 받으며, 스틱으로 공치기에서 스틱을 바르게 잡지 않고 치는 오류를 보일 수 있으므로 각각의 오류를 수정해 줌으로써 할 수 있는 한 정확한 동작이 발현되도록 한다."],"p":311,"b":3},{"c":"[4체육02-08]","k":"기본","sk":"","s":"체육","g":"초등학교 3~4학년","d":"스포츠","t":"라켓으로 치기를 경험하고 활동에 흥미를 느낀다.","m":"이 성취기준은 배드민턴의 기본 움직임인 라켓으로 휘두르는 기능을 익히기 위해 설정하였다. 라켓을 사용하여 휘두르는 방법과 치기를 다룬다. 여러 가지 물체나 모양의 라켓을 사용하고 활동의 난이도를 조절하며, 활동하는 과정에서 라켓으로 치기에 흥미를 느끼도록 하는 데 중점을 둔다.","n":["장애 정도가 심한 학생의 라켓 휘두르기 기능 수준에 따라 가장 적절한 촉진을 제공하여 학습하도록 한다. 시각적 촉진(예: 시범, 모델링)으로 수행이 어려운 경우 신체적 촉진(예: 특정 신체를 붙잡고 촉진)을 사용하며, 수행 피드백을 제공할 때에도 신체적 촉진을 통해 움직임을 체득하도록 유도한다."],"p":311,"b":3},{"c":"[4체육02-09]","k":"기본","sk":"","s":"체육","g":"초등학교 3~4학년","d":"스포츠","t":"배트로 치기를 경험하고 활동에 흥미를 느낀다.","m":"이 성취기준은 티볼에서 사용되는 기본 움직임인 배트로 치기 능력을 기르기 위해 설정하였다. 다양한 무게와 재질의 배트로 치기, 여러 크기의 공치기, 티의 높이를 달리하여 치기 등을 다룬다. 티 위의 공을 정확하게 맞힐 수 있도록 동작을 반복하여 연습하고 성공 가능성을 높이는 데 중점을 둔다.","n":["장애 정도가 심한 학생은 티 위의 공을 칠 때 스윙이 거의 없고 배트를 천천히 이동해 공을 가볍게 건드리거나 위에서 아래로 치는 수행을 보일 수 있다. 공과 측면으로 서서 몸통을 비틀고 엉덩이를 빨리 회전시켜서 배트를 휘두르면서 친다는 개념을 알고 수행하도록 하기 위해 필요한 경우 신체적 촉진을 통해 스윙 자세를 수정해 준다. 서서 치기를 할 때 몸의 균형을 잡기 어려운 경우 붙잡아 주고 치기, 의자에 앉아서 치기, 바닥에 누워서 치기로 재구성하여 수행하도록 한다."],"p":311,"b":3},{"c":"[4체육02-10]","k":"기본","sk":"","s":"체육","g":"초등학교 3~4학년","d":"스포츠","t":"실내와 실외에서 바른 자세로 계단 걷기를 하고 주변 환경을 탐색한다.","m":"계단 걷기는 일상의 생활환경에서 가장 기초가 되는 활동으로 활용되기 때문에 선정하였다. 생활환경의 여러 가지 계단 오르고 내려가기를 다룬다. 여러 가지 높이와 형태의 계단을 다양하게 걸어 보도록 하고 바른 자세로 걷기에 중점을 둔다.","n":["평형성이 부족하고 장애 정도가 심한 학생이 계단 걷기를 할 때에는 계단 손잡이를 잡고 활동하거나 짝 또는 교사와 손을 잡고 수행한다. 야외의 계단을 걸을 때에도 낙상을 예방하려면 근접하여 함께 활동하며 움직임을 주시하도록 한다. 또한 체력 수준에 맞춰 오르기의 속도를 조정해야 하며, 계단을 내려오는 방법이 잘못된 경우 무릎에 상해가 발생할 수 있으므로 걷기 자세를 모델링을 하면서 바른 자세로 걷도록 한다."],"p":312,"b":3},{"c":"[4체육02-11]","k":"기본","sk":"","s":"체육","g":"초등학교 3~4학년","d":"스포츠","t":"플로킹하기를 바르게 실행하고 주변 환경에 관심을 기울인다.","m":"플로킹은 걸으면서 쓰레기 줍기를 의미하며, 자연환경에서 걸으면서 환경보호 활동을 동시에 할 수 있도록 설정하였다. 학교나 지역사회에서 쓰레기 줍기를 다룬다. 스스로 또는 친구나 가족 구성원과 함께 활동하는 과정에서 학교뿐 아니라 지역사회를 깨끗이 유지하는 것의 중요성을 알도록 하는 데 중점을 둔다.","n":["장애 정도가 심한 학생의 플로킹하기 활동에서는 활동 방법을 여러 차례 연습시킨 후 학생이 좋아하는 강화물을 사용하여 활동 동기를 부여하는 것이 효과적이다."],"p":312,"b":3},{"c":"[6체육01-01]","k":"기본","sk":"","s":"체육","g":"초등학교 5~6학년","d":"운동","t":"건강 체력과 운동 체력의 운동 자세를 모방하고 주의 집중력을 기른다.","m":"이 성취기준은 실제 체력 운동 자세를 모방하며 실시하는 것을 목표로 설정하였다. 초등학교 5~6학년에서는 근력 및 근지구력, 심폐지구력, 유연성 등의 건강 체력 요소와 순발력, 민첩성, 평형성 등의 운동 체력 요소에 해당하는 운동 모방하기를 다룬다. 학생이 동작을 모방하여 수행하는 과정에서 체력을 향상하고, 주의 집중력을 기르는 데 중점을 둔다.","n":["장애 정도가 심한 학생이 근력 운동을 실시할 때에는 기계 형태의 기구로 안전하게 활동하며, 기능 수준에 따라 색깔별로 강도의 차이가 있는 밴드를 적절히 사용하여 운동하도록 한다."],"p":313,"b":3},{"c":"[6체육01-02]","k":"기본","sk":"","s":"체육","g":"초등학교 5~6학년","d":"운동","t":"질병 예방하기를 실천하고 건강에 관심을 기울인다.","m":"이 성취기준은 아동기의 성장 발달을 해칠 수 있는 질병을 예방하기 위해 설정하였다. 질병 예방은 예방 접종하기, 개인위생 및 몸 깨끗이 하기, 건강식 섭취하기, 자외선 및 미세 먼지 노출 줄이기 등을 다룬다. 가능한 실질적이고 구체적인 활동을 통하여 일상생활에서 질병을 예방하는 행동이 나타나도록 하는 데 중점을 둔다.","n":["장애 정도가 심한 학생은 특히 발달상의 결함이 발생하지 않도록 적절한 양식의 운동과 질병 관리에 힘써야 한다. 또 일상 속 실천 사항을 가정과 연계하여 실시하거나 충분히 연습하도록 한다."],"p":314,"b":3},{"c":"[6체육01-03]","k":"기본","sk":"","s":"체육","g":"초등학교 5~6학년","d":"운동","t":"운동 장비와 시설을 안전하게 사용하고 안전 의식을 기른다.","m":"이 성취기준은 운동에 사용되는 기구나 시설로 인하여 안전사고가 발생하지 않도록 설정하였다. 운동 기구와 장비 및 시설의 명칭 알기, 기구와 시설 바르게 사용하기, 안전사고 예방법을 다룬다. 사진이나 영상 자료를 활용하여 위험한 행동과 안전한 행동을 명확히 구분하는 데 중점을 둔다.","n":["장애 정도가 심한 학생은 구체적이고 실제적인 자료(예: 실물)를 이용하여 안전사고 예방 수칙을 이해하고, 위험 요소를 직접 찾아보며, 실습을 하면서 필요한 기능을 습득하도록 한다."],"p":314,"b":3},{"c":"[6체육02-01]","k":"기본","sk":"","s":"체육","g":"초등학교 5~6학년","d":"스포츠","t":"기초 달리기와 물에서 이동하기의 특성을 이해하고 기능을 익힌다.","m":"이 성취기준은 달리기와 물에서 이동하기 방법과 특징을 알고 가능한 빠르게 수행하는 것을 목표로 설정하였다. 달리기의 기초 활동과 여러 가지 방법으로 물에서 이동하기, 생존수영을 다룬다. 흥미로운 기초 달리기와 물에서 이동하기 활동을 선정하여 활동하는 과정에서 성취감과 더불어 도전하는 태도를 기를 수 있도록 하고 특히, 수중 활동에서는 자신의 생명을 지킬 수 있는 기초 능력을 기르는 데 중점을 둔다.","n":["장애 정도가 심한 학생의 기초 달리기와 물에서 이동하기에서는 학생의 활동에 대한 이해 수준을 파악하는 것이 필요하며, 도전하는 태도와 더불어 참여 정도를 높이는 것에 중점을 두어 지도하도록 한다."],"p":315,"b":3},{"c":"[6체육02-02]","k":"기본","sk":"","s":"체육","g":"초등학교 5~6학년","d":"스포츠","t":"멀리뛰기와 물체 멀리 던지기의 특성을 이해하고 기능을 익힌다.","m":"이 성취기준은 거리 도전의 개념을 알고 수행하도록 설정하였다. 다양한 동작과 방법으로 멀리뛰기와 멀리 던지기 활동을 다룬다. 연습에 따라 기록이 향상되는지가 중요하지만 활동 동기와 도전하는 자세를 증가시키는 데 중점을 둔다.","n":["장애 정도가 심한 학생은 멀리뛰기와 물체 멀리 던지기에서 목표점을 정해 주고 활동하는 것이 효과적이다. 멀리뛰기에서는 착지 지점에 선을 그려 주거나 물체를 두면 그 너머로 뛸 가능성이 높아진다. 공 던지기에서는 잡은 공의 위치를 머리 뒤로 들어 올리지않고 앞 방향으로 뿌리는 형태로 수행하는 경우가 많은데, 이때 시범으로 바른 자세를 보여주고 모방하여 수행하게 하거나 공을 잡은 손을 머리 위로 올리고 팔꿈치를 들어주어야 비교적 바른 수행이 가능하다."],"p":315,"b":3},{"c":"[6체육02-03]","k":"기본","sk":"","s":"체육","g":"초등학교 5~6학년","d":"스포츠","t":"움직임 만들기의 특성을 이해하고 기능을 익힌다.","m":"이 성취기준은 기계 체조의 마루 운동과 평균대, 리듬체조, 그리고 태권도 품새에 사용하는 움직임들을 만들어 수행하는 방법과 활동의 특성을 학습하기 위해 설정하였다.마루 운동의 구르기, 평균대 운동, 리듬체조의 후프와 리본, 태권도의 기초 품새 등을 다룬다.이 활동들을 구성하고 있는 움직임을 하나 이상 연결하여 스스로 표현할 수 있는 능력을 기르는 데 중점을 둔다.","n":["장애 정도가 심한 학생의 활동에서는 목표로 하는 활동이나 최종적인 동작을 처음부터 실시하는 것을 지양하고 유사 활동 중심의 과제 분석을 사용하여 지도한다."],"p":315,"b":3},{"c":"[6체육02-04]","k":"기본","sk":"","s":"체육","g":"초등학교 5~6학년","d":"스포츠","t":"표적을 향해 물체 보내기 활동의 특성을 이해하고 기능을 익힌다.","m":"이 성취기준은 표적이 있는 방향으로 공이나 여러 가지 물체를 던지거나 굴리고 차는 능력을 기르기 위해 설정하였다. 표적을 향해 물체 던지기, 농구공 굴리기, 축구공 차기 등을 다룬다. 쓰러뜨리거나 맞히는 정확성보다는 표적과의 좌우 편차를 줄이는 데 중점을 둔다.","n":["장애 정도가 심한 학생은 던지기, 굴리기, 차기 활동에서 표적과의 거리를 줄이거나 표적의 크기를 증가시켜 성공 가능성을 높이도록 한다."],"p":315,"b":3},{"c":"[6체육02-05]","k":"기본","sk":"","s":"체육","g":"초등학교 5~6학년","d":"스포츠","t":"민속 표현 모방하기 기능을 익히고 관찰하여 모방하는 태도를 기른다.","m":"이 성취기준은 우리나라의 민속 무용과 외국 민속 무용에서 사용하는 움직임의 질을 높이기 위해 설정하였다. 우리나라와 외국 민속 무용의 기본 스텝과 대형 등을 다룬다. 우리나라와 외국 민속 무용의 여러 가지 기본 스텝과 대형을 연습하는 과정을 통하여 무용의 움직임을 상세하게 관찰하고 모방하는 능력을 기르는 데 중점을 둔다.","n":["장애 정도가 심한 학생이 민속 무용의 스텝과 대형을 연습할 때는 짝이나 교사가 손을 잡고 수행하도록 한다."],"p":317,"b":3},{"c":"[6체육02-06]","k":"기본","sk":"","s":"체육","g":"초등학교 5~6학년","d":"스포츠","t":"표현 움직임 모방하기 기능을 익히고 관찰하여 모방하는 태도를 기른다.","m":"이 성취기준은 리듬, 소리나 음악, 대상을 표현하는 움직임을 익히기 위해 설정하였다. 리듬의 변화에 맞춰 움직이기, 소리나 음악을 움직임으로 표현하기, 대상을 움직임으로 표현하기 등을 다룬다. 표현 움직임 모방하기 활동에서는 개념과 느낌을 자유롭게 표현하는 데 중점을 둔다.","n":[],"p":317,"b":3},{"c":"[6체육02-07]","k":"기본","sk":"","s":"체육","g":"초등학교 5~6학년","d":"스포츠","t":"공 주고받기 기능을 익히고 동료와 협동하는 태도를 기른다.","m":"이 성취기준은 축구공, 농구공, 플로어볼 공 등을 주고받는 기능을 익히기 위해 설정하였다. 축구공과 농구공을 사용하여 공 오래 패스하기, 플로어볼 공을 콘 사이로 패스하기 등을 다룬다. 짝과 공 주고받기 활동을 통하여 기능을 익히고 활동에 대한 흥미를 느끼며, 학생들 간에 협동하는 자세를 기르는 데 중점을 둔다.","n":["장애 정도가 심한 학생의 공 주고받기 활동에서는 공의 스피드가 빠르지 않은 폼볼을 사용하는 것이 효과적이다. 또한 교사와 패스를 하거나 벽을 바라보고 활동하게 함으로써 공을 회수하는 거리를 줄이고 활동 시간을 늘릴 수 있도록 한다. 시각중복장애 학생은 소리가 나고 천천히 구르는 시각장애인용 축구공을 사용하여 차기와 치기 활동을 하도록 한다."],"p":317,"b":3},{"c":"[6체육02-08]","k":"기본","sk":"","s":"체육","g":"초등학교 5~6학년","d":"스포츠","t":"라켓으로 쳐서 넘기기 방법을 이해하고 기능을 익힌다.","m":"이 성취기준은 배드민턴의 특성을 파악하고 물체를 네트 너머로 넘기는 기능을 익히기 위해 설정하였다. 풍선이나 솜털 공, 셔틀콕을 쳐서 네트 너머로 넘기기 등을 다룬다. 학생별로 최적의 학습이 가능하도록 하는 물체와 라켓을 선택하여 네트를 넘기는 기능을 높이는 데 중점을 둔다.","n":["장애 정도가 심한 학생이 라켓으로 풍선 치기 수행 능력을 기르기 위해 목이 짧은 라켓이나 면적이 넓은 라켓을 사용하고, 라켓 사용이 어려운 경우 손으로 치도록 한다."],"p":317,"b":3},{"c":"[6체육02-09]","k":"기본","sk":"","s":"체육","g":"초등학교 5~6학년","d":"스포츠","t":"배트로 멀리 치기 방법을 이해하고 기능을 익힌다.","m":"이 성취기준은 티 위에 있는 공을 정확히 쳐서 멀리 보내는 기능을 익히기 위해 설정하였다. 정확한 티볼 치기 자세 익히기를 주로 다룬다. 여러 모양과 크기의 티볼 배트와 공을 사용하여 멀리 치는 기능을 높임으로써 티볼 게임을 수행할 수 있는 기반을 마련하는 데 중점을 둔다.","n":["배트로 멀리 치기 활동에서 장애 정도가 심한 학생의 치기 정확도가 낮은 경우 폭이 넓은 배트나 테니스 라켓으로 치도록 함으로써 정확도를 증가시키고 활동에 대한 흥미를 높이도록 한다."],"p":317,"b":3},{"c":"[6체육02-10]","k":"기본","sk":"","s":"체육","g":"초등학교 5~6학년","d":"스포츠","t":"줄넘기 방법을 알고 기능을 익힌다.","m":"이 성취기준은 학교나 가정과 같은 생활환경에서 건강과 체력을 기르고 생활체육으로 활용하기 위해 설정하였다. 줄을 몸 뒤에서 앞으로 보내기, 줄에 걸리지 않고 넘기, 연속 넘기, 단체 줄넘기 등을 다룬다. 줄을 넘기 위한 여러 가지 기능을 습득하고 연속 줄넘기를 스스로 수행하여 일상생활에서 생활화하는 데 중점을 둔다.","n":["장애 정도가 심한 학생이 연속하여 줄을 넘지 못하는 경우 줄을 몸 뒤에서 앞으로 보낸 후 줄이 정지해 있을 때 한 발씩 걸으면서 넘거나 1회씩 넘기와 같이 성취기준을 재구성하여 적용할 수 있다. 또 활동량에 초점을 맞추는 경우 줄넘기 줄의 가운데를 자른 후 줄의 손잡이를 잡고 제자리에서 뛰며 줄을 돌리는 방법으로 활동하도록 한다."],"p":319,"b":3},{"c":"[6체육02-11]","k":"기본","sk":"","s":"체육","g":"초등학교 5~6학년","d":"스포츠","t":"숲 체험하기 방법을 알고 기능을 익힌다.","m":"이 성취기준은 자연을 탐색하는 태도를 지니고 숲이 제공하는 여러 장점을 경험하도록 설정하였다. 자연에서 얻은 도구를 이용하여 여러 가지 놀이하기, 맨발 걷기, 줄타기와 같은 모험하기 등 신체활동과 관련된 내용을 다룬다. 숲에서 야외 체험 활동을 하는 과정에서 관련 기능을 익히고 자연을 사랑하는 마음을 지니도록 하는 데 중점을 둔다.","n":[],"p":319,"b":3},{"c":"[9체육01-01]","k":"기본","sk":"","s":"체육","g":"중학교 1~3학년","d":"운동","t":"체력 운동 방법을 알고 건강 체력과 운동 체력을 익힌다.","m":"이 성취기준은 초등학교와 달리 구체적인 동작과 기구 등을 활용하여 체력을 기르기 위해 설정하였다. 근력과 근지구력, 심폐지구력. 유연성, 신체 조성 등의 건강 체력 기르기, 순발력, 민첩성, 협응성 등의 운동 체력 기르기, 자신의 체력 수준을 파악하기 위해 체력 검사에 적극적으로 참여하기 등을 다룬다. 꾸준한 체력 운동과 평가 과정에서 학생들이 끈기를 기르고 자신감을 향상할 수 있도록 한다.","n":["장애 정도가 심한 학생의 근력 및 근지구력 운동 시 윗몸 일으키기에서는 자세별 강도가 다르므로(예: 바닥 짚고 일어나기, 바지 잡고 당기며 일어나기 또는 교사가 손으로 당겨 주며 일어나기, 양팔을 펴서 일어나기, 가슴 앞에서 양팔을 엑스(X)자로 하여 일어나기, 양손으로 귀 잡고 일어나기, 머리 뒤에서 양손 깍지 껴 일어나기) 가능한 동작을 찾아 주고 활동을 반복하여 근력과 근지구력이 증가한 경우 다음 단계의 동작으로 점증적으로 이동하며 운동을 실시하도록 한다."],"p":320,"b":3},{"c":"[9체육01-02]","k":"기본","sk":"","s":"체육","g":"중학교 1~3학년","d":"운동","t":"건강한 식습관을 형성하고 바른 식습관을 실천하는 태도를 기른다.","m":"이 성취기준은 건강한 식습관에 필요한 지식을 갖추고 바른 습관을 형성하도록 설정하였다. 편식을 줄이고 과식하지 않기, 가공 식품과 불량 식품 섭취 줄이기, 다양한 음식 골고루 섭취하기, 균형 잡힌 식사하기, 건강에 좋은 음식 섭취하기 등을 다룬다. 건강한 식습관을 형성하기 위해 학교와 가정이 연계하여 지도함으로써 교육 효과를 높이고, 이 과정에서 학생들이 건강한 식습관을 형성하기 위한 실천 의지를 기르는 데 중점을 둔다.","n":["장애 정도가 심한 학생의 식습관 기르기에서는 점심시간을 활용하여 깨끗하게 먹기, 골고루 먹기, 과식하지 않기 등에 초점을 맞추고 습관을 형성할 수 있도록 장기적으로 지도한다."],"p":321,"b":3},{"c":"[9체육01-03]","k":"기본","sk":"","s":"체육","g":"중학교 1~3학년","d":"운동","t":"운동을 하는 과정에서 상해를 예방하고 대처하는 방법을 알고 실행한다.","m":"이 성취기준은 운동 시 발생할 수 있는 상해를 알고 이에 대처하기 위한 지식을 습득하며, 이를 실행하도록 설정하였다. 부상을 예방하기 위한 준비 운동과 활동 규칙 지키기, 운동 상해 대처하기, 심폐소생술, 자동 심장 충격기 사용법 등을 다룬다. 운동 중에 상해가 발생하지 않도록 주의를 기울이는 활동을 사진이나 동영상, 실연으로 학습하고 상해 유형별 처치 방법을 반복하여 익히는 과정에서 실제로 간단한 응급처치를 실시할 수 있는 능력과 상해 예방의 중요성을 알도록 하는 데 중점을 둔다.","n":[],"p":321,"b":3},{"c":"[9체육02-01]","k":"기본","sk":"","s":"체육","g":"중학교 1~3학년","d":"스포츠","t":"빠르게 달리기, 오래달리기, 기초 수영 동작을 익히고 참고 견디는 태도를 기른다.","m":"이 성취기준은 빠르게 달리기, 오래달리기, 기초 수영 동작을 익히도록 설정하였다.다양한 형태의 단거리와 장거리 달리기, 수영의 기초 기능을 다룬다. 흥미로운 활동으로 구성하여학생의 참여 동기와 기능을 향상시키고, 활동 중 낙상이나 익수 등 안전사고를 예방하는 데 중점을 둔다.","n":["장애 정도가 심한 학생이 빠르게 달리기, 오래달리기, 기초 수영 동작 익히기 활동을 잘 수행하려면 놀이와 게임 방법에 대한 이해가 선행되어야 한다. 이를 위해 여러 차례 설명과 시범, 그리고 신체적 촉진을 통해 활동 방법을 익히도록 하고 피드백 과정에서 가능한 정확한 수행을 하면서 도전 의식을 기르도록 유도한다."],"p":322,"b":3},{"c":"[9체육02-02]","k":"기본","sk":"","s":"체육","g":"중학교 1~3학년","d":"스포츠","t":"높이 넘기와 물체 높게 던지기 방법을 알고 기능을 익힌다.","m":"이 성취기준은 높이 넘기와 물체 높이 던지기 기능을 익히도록 설정하였다. 제자리높이뛰기, 뛰어올라 다양한 높이의 물체 손으로 치기 등의 높이뛰기와 여러 가지 물체를 대 너머로 던지기와 높이 던지기 등을 다룬다. 도전 활동의 특성이 반영되도록 기록의 향상 정도를 학생들이 파악하면서 활동하도록 하고, 던지기에서 투사체에 맞아 다치는 안전사고가 발생하지 않도록 하는 데 중점을 둔다.","n":[],"p":322,"b":3},{"c":"[9체육02-03]","k":"기본","sk":"","s":"체육","g":"중학교 1~3학년","d":"스포츠","t":"연속되는 움직임을 이어서 수행하는 방법을 알고 기능을 익힌다.","m":"이 성취기준은 동작 도전의 여러 활동의 동작들을 연속으로 이어서 수행하도록 설정하였다. 마루 운동, 평균대 운동, 그리고 태권도 품새의 동작 등을 연결하여 수행하기를 다룬다. 초등학교와 달리 동작 도전의 각 활동과 자세를 정확하게 수행하는 데 중점을 둔다.","n":["장애 정도가 심한 학생의 활동 동기를 부여하기 위해 매트에서 구르기(예: 보디 볼링) 시 매트 옆에 세워 놓는 볼링핀 대신 좋아하는 강화물을 놓고 구르기를 하여 취득하게 하거나 건드리면 음악이나 불빛이 나오는 전기 장치를 사용하여 활동하는 것도 효과적이다."],"p":322,"b":3},{"c":"[9체육02-04]","k":"기본","sk":"","s":"체육","g":"중학교 1~3학년","d":"스포츠","t":"표적 가까이 보내기 방법을 알고 기능을 익힌다.","m":"이 성취기준은 물체 조작 기술을 다양한 도구에 적용하여 표적 가까이 보내는 기능을 익히도록 설정하였다. 다양한 도구와 물체 조작 기술을 활용하여 표적에 가깝게 보내거나 쓰러뜨리기 등을 다룬다. 표적 도전 활동은 점수를 획득하는 간단한 게임 형태로 진행함으로써 도전 의식을 기르는 데 중점을 둔다.","n":["장애 정도가 심한 학생이 표적 도전 활동을 할 때에는 특정 점수를 획득했거나 도전이 성공했을 경우 강화를 제공하여 활동 동기를 부여하도록 한다."],"p":322,"b":3},{"c":"[9체육02-05]","k":"기본","sk":"","s":"체육","g":"중학교 1~3학년","d":"스포츠","t":"민속 특징 표현하기 방법을 이해하고 기능을 익힌다.","m":"이 성취기준은 우리나라의 민속 무용과 외국의 민속 무용을 알고 각 나라의 문화 특징에 맞게 민속 무용 동작을 표현하도록 설정하였다. 우리나라의 민속 무용으로는 소고춤, 외국의 민속 무용은 펭귄춤 등을 다룬다. 우리나라를 포함하여 외국의 고유한 민속 무용 동작을 가능한 정확히 표현하는 능력을 기르는 데 중점을 둔다.","n":["장애 정도가 심한 학생이 고유한 민속 무용 동작을 표현하기가 어려운 경우 동작의 정확성보다는 동작의 수를 줄여 간단하게 활동하도록 한다."],"p":323,"b":3},{"c":"[9체육02-06]","k":"기본","sk":"","s":"체육","g":"중학교 1~3학년","d":"스포츠","t":"주제 표현하기 기능을 익히고 창의성을 기른다.","m":"이 성취기준은 다양한 대상 표현, 감정 표현, 그리고 주제 표현 능력을 기르기 위해 설정하였다. 대상 표현하기와 주제 표현하기를 다룬다. 주제 표현하기의 질보다는 표현하려고시도하는 노력을 강조하고 이 과정에서 학생들의 창의성을 기르는 데 중점을 둔다.","n":[],"p":323,"b":3},{"c":"[9체육02-07]","k":"기본","sk":"","s":"체육","g":"중학교 1~3학년","d":"스포츠","t":"이동하며 공 주고받기 방법을 알고 기능을 익힌다.","m":"이 성취기준은 축구, 농구, 플로어볼에서 이동하면서 패스, 드리블, 슛하기 기능을 익히도록 설정하였다. 축구, 농구, 플로어볼의 움직임을 이어서 수행하는 방법을 이해하고 연습함으로써 고등학교 단계의 간이 게임을 수행할 수 있는 기초 능력을 기르는 데 중점을 둔다.","n":[],"p":324,"b":3},{"c":"[9체육02-08]","k":"기본","sk":"","s":"체육","g":"중학교 1~3학년","d":"스포츠","t":"라켓으로 쳐서 네트 너머로 넘기기 기능을 익히고 네트형 스포츠 활동의 규칙을 준수한다.","m":"이 성취기준은 배드민턴 게임에 사용되는 기초 기능을 익히도록 설정하였다. 풍선을 이용하여 네트 너머로 주고받기, 교사와 네트 너머로 셔틀콕 주고받기 등을 다룬다. 라켓으로 물체를 쳐서 네트 너머로 주고받기 방법과 규칙을 알고 흥미를 가지고 활동하는 과정을 통하여 고등학교 단계의 간이 게임을 수행할 수 있는 기초 능력을 기르는 데 중점을 둔다.","n":["장애 정도가 심한 학생은 짧은 라켓이나 면적이 넓은 라켓을 이용하여 치거나 2회 이상 쳐서 넘기기 등 방법을 재구성하여 적용할 수 있다,"],"p":324,"b":3},{"c":"[9체육02-09]","k":"기본","sk":"","s":"체육","g":"중학교 1~3학년","d":"스포츠","t":"배트로 치기와 공 처리하기 방법을 알고 기능을 익힌다.","m":"이 성취기준은 티볼의 공격과 수비의 기본 기능을 익히도록 설정하였다. 배트로 치기, 굴러오는 공 잡기, 루로 달리기와 공 던지고 받기 등을 다룬다. 티볼의 공격과 수비의 기본 기능과 규칙을 익힘으로써 고등학교 단계의 간이 게임을 수행할 수 있는 기초 능력을 기르는 데 중점을 둔다.","n":["장애 정도가 심한 학생이 티볼 공을 치고 루로 달릴 때 루까지의 거리를 줄여 주도록 하고, 목표 지점(루)을 잘 인식하지 못하는 경우 짝이나 교사가 손을 잡고 함께 달리도록 한다."],"p":324,"b":3},{"c":"[9체육02-10]","k":"기본","sk":"","s":"체육","g":"중학교 1~3학년","d":"스포츠","t":"인라인스케이팅 방법을 알고 기능을 익힌다.","m":"이 성취기준은 생활환경형 활동 중 하나로 쉽게 익힐 수 있고 일상생활에서 활용 가능성이 높은 인라인스케이팅의 기능을 익히도록 설정하였다. 장비 착용하기, 서기, 넘어지기, 일어서기, 추진하기, 코스 따라 타기, 코너 돌기, 멈추기 등을 다룬다. 학생의 기능 수준별로 난이도를 달리하여 활동하고 가정과 지역사회에서 여가로 즐길 수 있는 능력을 기르는 데 중점을 둔다.","n":["장애 정도가 심한 학생이라도 인라인스케이팅 활동을 할 때에는 장비 착용에서부터 정리하는 것까지 자신이 직접 해야 한다는 것을 인식하도록 지도한다."],"p":325,"b":3},{"c":"[9체육02-11]","k":"기본","sk":"","s":"체육","g":"중학교 1~3학년","d":"스포츠","t":"하이킹하기 기능을 익히고 건전한 여가를 실천하기 위해 노력한다.","m":"이 성취기준은 장비가 거의 필요하지 않고 낮은 고도의 다양한 산이나 들에서 활동하는 하이킹을 생활체육과 평생체육으로 활용하도록 설정하였다. 학교나 지역사회의 하이킹 코스에서 걷기를 다룬다. 쉬운 코스에서 시작한 후 어려운 코스까지 도전하도록 하고 친구와 교사 그리고 가족과 함께 건전한 여가를 즐길 수 있는 능력을 기르는 데 중점을 둔다.","n":[],"p":325,"b":3},{"c":"[12체육01-01]","k":"기본","sk":"","s":"체육","g":"고등학교 1~3학년","d":"운동","t":"체력 운동을 생활화하고 스스로 자신의 건강을 관리하는 습관을 기른다.","m":"이 성취기준은 평생체육에서 가장 기본이 되는 체력 운동을 학교를 졸업한 이후에도 생활화하도록 설정하였다. 학교뿐 아니라 가정과 지역사회의 다양한 장소에서 체력 운동 실시하기, 체중 유지 및 감량하기 등을 다룬다. 가정과 연계하여 체력 운동을 지속할 수 있는 여건을 마련하는 데 중점을 둔다.","n":[],"p":326,"b":3},{"c":"[12체육01-02]","k":"기본","sk":"","s":"체육","g":"고등학교 1~3학년","d":"운동","t":"건강한 생활 습관을 형성하고 유지한다.","m":"이 성취기준은 위생, 식이, 수면, 운동 등으로 건강한 생활을 유지하도록 하기 위해 설정하였다. 청결, 건강한 음식 섭취, 충분한 수면, 운동, 적절한 체중 유지, 충분한 수분 섭취 등을 다룬다. 학교에서는 이에 대한 이해와 교육을 통해 건강한 생활 습관을 형성하도록 지도하고 가정과 연계하여 그 습관을 유지하는 데 중점을 둔다.","n":["장애 정도가 심한 학생의 건강한 생활 습관 형성을 위하여 학교뿐 아니라 대학이나 센터의 체육 교실에서 활동하기, 가족과 함께 운동하기, 주말 산행하기 등 구체적인 실천이 가정에서도 이루어지도록 유도한다."],"p":326,"b":3},{"c":"[12체육01-03]","k":"기본","sk":"","s":"체육","g":"고등학교 1~3학년","d":"운동","t":"안전하게 생활하는 방법을 실천하고 생활 속 안전 수칙을 준수한다.","m":"이 성취기준은 운동 상황뿐 아니라 일상생활에서 겪을 수 있는 여러 가지 위험 요인을 알아보고 안전사고를 예방하며 안전사고에 적절히 대처하기 위해 설정하였다. 운동 시 건강과 안전에 부정적인 영향을 줄 수 있는 자연 환경과 사회 환경을 파악하고 안전 수칙 실천하기 등을 다룬다. 운동 상황과 일상생활의 안전 실천하기 활동을 하면서 학생들의 안전 의식을 높이는 데 중점을 둔다.","n":[],"p":326,"b":3},{"c":"[12체육02-01]","k":"기본","sk":"","s":"체육","g":"고등학교 1~3학년","d":"스포츠","t":"달리기와 수영 간이 게임 기능을 익히고 자신의 한계에 도전한다.","m":"이 성취기준은 육상과 수영 활동에서 기록을 단축하고 자신의 한계에 도전하는 태도를 기르도록 설정하였다. 다양한 형태의 달리기와 수영의 간이 게임을 다룬다. 도전형간이 게임을 통하여 자신의 기록을 파악하고 자신이나 짝의 기록에 도전하는 태도를 기르는 데 중점을 둔다.","n":["장애 정도가 심한 학생이 수중 운동을 할 때에는 익사 사고 예방을 위해 구명조끼나 팔에 부이를 착용하여 활동하도록 한다."],"p":327,"b":3},{"c":"[12체육02-02]","k":"기본","sk":"","s":"체육","g":"고등학교 1~3학년","d":"스포츠","t":"뜀뛰기와 던지기 간이 게임 기능을 익히고 자신의 한계에 도전한다.","m":"이 성취기준은 뜀뛰기와 던지기 간이 게임 기능을 익히도록 설정하였다. 다양한 멀리뛰기, 높이뛰기, 포환던지기, 원반던지기, 창던지기, 해머던지기의 간이 게임을 다룬다. 간이 게임 활동을 하면서 자세의 질을 높이고 기능을 익혀 자신이나 짝의 기록에 도전하는 태도를 기르는 데 중점을 둔다.","n":["장애 정도가 심한 학생 중 원시반사가 있는 경우, 반사가 촉발되는 동작이 발현되지 않도록 주의를 기울이도록 한다."],"p":327,"b":3},{"c":"[12체육02-03]","k":"기본","sk":"","s":"체육","g":"고등학교 1~3학년","d":"스포츠","t":"동작 도전 간이 게임 규칙과 방법을 이해하고 기능을 익힌다.","m":"이 성취기준은 여러 가지 동작 도전 활동의 동작의 질을 높이고 간이 게임을 수행하도록 설정하였다. 마루 운동, 평균대, 후프와 리본 운동, 태권도 품새 등의 동작 도전 간이 게임을 다룬다. 동작 도전 간이 게임의 기능을 익히고 간단한 작품을 만들어 발표해 봄으로써 자신과 짝의 동작을 비교하고 가능한 높은 수준의 동작을 수행하도록 하는 데 중점을 둔다.","n":[],"p":327,"b":3},{"c":"[12체육02-04]","k":"기본","sk":"","s":"체육","g":"고등학교 1~3학년","d":"스포츠","t":"표적 도전 간이 게임 규칙과 방법을 이해하고 기능을 익힌다.","m":"이 성취기준은 표적을 향해 정확히 던지고 굴리는 기능을 익히고 표적 도전 간이 게임을 수행하도록 설정하였다. 다트, 플라잉디스크, 골프, 볼링 등의 표적 도전 간이게임을 다룬다. 여러 가지 표적 도전 활동의 도전하는 횟수가 증가하면서 표적을 맞히거나 쓰러뜨리는 확률을 높이고 자신이나 짝의 기능에 도전하는 태도를 기르는 데 중점을 둔다.","n":[],"p":327,"b":3},{"c":"[12체육02-05]","k":"기본","sk":"","s":"체육","g":"고등학교 1~3학년","d":"스포츠","t":"표현형 스포츠의 발표 및 구성 방법을 알고 민속 표현 작품을 발표하고 감상한다.","m":"이 성취기준은 민속 표현 활동 학습으로 익힌 우리나라와 외국 민속 무용을발표하고 감상하는 능력을 기르도록 설정하였다. 강강술래, 패티케이크 폴카 등의 작품 공연 및 감상으로 이루어진다. 표현과 함께 협동하는 태도와 감상 능력을 강조하도록 한다.","n":["장애 정도가 심한 학생은 민속 표현 발표에서 어려운 동작을 쉬운 동작으로 재구성하고 가능한 적극적으로 참여할 수 있도록 유도한다."],"p":329,"b":3},{"c":"[12체육02-06]","k":"기본","sk":"","s":"체육","g":"고등학교 1~3학년","d":"스포츠","t":"협동 표현 작품을 발표하고 감상하며 동료의 표현을 존중하는 태도를 기른다.","m":"이 성취기준은 친구들과 함께 특정 주제나 소재에 대한 생각과 느낌을 움직임으로 표현하고 감상하는 능력을 기르도록 설정하였다. 도구를 이용하여 감정 표현하기, 학교와 생활 속 이야기를 움직임으로 표현하기와 작품 발표하기, 방송 댄스 등을 다룬다. 발표 과정에서 다른 학생들의 표현 활동에 대한 바람직한 감상 태도와 공감 능력을 기르는 데 중점을 둔다.","n":[],"p":329,"b":3},{"c":"[12체육02-07]","k":"기본","sk":"","s":"체육","g":"고등학교 1~3학년","d":"스포츠","t":"영역형 경쟁 간이 게임 기능을 익히고 모둠 구성원의 단결력을 기른다.","m":"이 성취기준은 축구, 농구, 플로어볼 등 영역형 경쟁 간이 게임 능력을 기르기 위해 설정하였다. 축구와 농구, 플로어볼 등의 다양한 간이 게임을 다룬다. 영역형 경쟁 간이 게임을 수행하면서 스포츠문화를 경험하고 즐기도록 하는 데 중점을 둔다.","n":[],"p":329,"b":3},{"c":"[12체육02-08]","k":"기본","sk":"","s":"체육","g":"고등학교 1~3학년","d":"스포츠","t":"네트형 경쟁 간이 게임의 규칙과 방법을 알고 기능을 익힌다.","m":"이 성취기준은 네트형 경쟁의 배드민턴 간이 게임 능력을 기르기 위해 설정하였다. 풍선 배드민턴 게임, 3회 터치 배드민턴 게임 등을 다룬다. 네트형 경쟁 간이 게임 기능을 길러 친구나 가족과 즐기도록 하는 데 중점을 둔다.","n":["장애 정도가 심한 학생은 배드민턴 간이 게임에서 기능이 좋은 짝이나 교사와 한 모둠이 되어 다른 모둠과 겨루어 볼 수 있다. 또한 이 학생이 포함된 모둠은 치는 횟수를 1회 더 제공하는 방식으로 규칙을 변형하여 게임을 진행하는 것도 필요하다."],"p":329,"b":3},{"c":"[12체육02-09]","k":"기본","sk":"","s":"체육","g":"고등학교 1~3학년","d":"스포츠","t":"필드형 경쟁 간이 게임의 규칙과 방법을 알고 기능을 익힌다.","m":"이 성취기준은 정규 티볼 경기의 간이 게임 능력을 기르기 위해 설정하였다. 투 베이스 티볼, 치고 달리기와 던지고 받기 겨루기 등을 다룬다. 티볼 간이 게임 과정에서 게임의 특성을 이해하고 적극적으로 참여하며, 구성원들과 협동하는 자세를 기르는 데 중점을 둔다.","n":["티볼 간이 게임에서 장애 정도가 심한 학생이 티볼 공을 친 후 루까지 달리는 것이 어려운 경우, 짝이나 교사가 손을 잡고 주루를 하며, 수비 시에는 짝이나 교사가 공을 처리하고 학생이 루로 공을 던지는 방식으로 게임을 진행하도록 한다."],"p":329,"b":3},{"c":"[12체육02-10]","k":"기본","sk":"","s":"체육","g":"고등학교 1~3학년","d":"스포츠","t":"자전거 타기 방법을 이해하고 기능을 익힌다.","m":"이 성취기준은 전환 이후 학생들이 지역사회에서 자전거 타기를 생활화할 수 있는 기능을 습득하고 안전하게 활동하도록 설정하였다. 두발자전거 타기가 주된 활동이며 안전사고 예방을 위한 브레이크 잡기 등을 다룬다. 자신의 기능에 맞는 자전거의 선택과 더불어 다양한 폭의 코스에서 자전거 타기 등을 연습하여 학교와 지역사회에서 안전하고 자신 있게 자전거를 타도록 하는 데 중점을 둔다.","n":["장애 정도가 심한 학생은 필요한 경우 세발자전거를 사용하여 활동하도록 한다. 자전거의 종류와 관계없이 자전거 타기에서 가장 중요한 기능은 위험 상황에서 브레이크를 잘 잡는 능력이므로 충돌이나 낙상에 의한 안전사고를 예방하려면 브레이크 잡기가 완성될 때까지 밀착 지도가 필요하다. 또한 시각중복장애 학생의 경우에는 실제 자전거를 타기 어려우므로 e-스포츠나 가상현실(VR) 기기를 활용하여 자전거를 타는 것으로 성취기준을 재구성하여 적용할 수 있다."],"p":330,"b":3},{"c":"[12체육02-11]","k":"기본","sk":"","s":"체육","g":"고등학교 1~3학년","d":"스포츠","t":"캠핑하기의 기능을 익히고 타인과의 친화력을 기른다.","m":"이 성취기준은 최근 관심과 참여가 증가하고 있는 캠핑을 가족과 함께 즐기기 위한 목적으로 설정하였다. 장비 챙기기, 텐트 치기, 글램핑장 이용하기, 캠핑장 규칙 지키기, 자연환경 지키기 등을 다룬다. 학교에서 이루어지는 캠핑을 비롯하여 가족이나 타인과 함께하는 캠핑에 필요한 것들을 학습하는 과정에서 안전사고에 유의하고 즐겁게 활동하며 친화력을 기르는 데 중점을 둔다.","n":[],"p":330,"b":3},{"c":"[4음악01-01]","k":"기본","sk":"","s":"음악","g":"초등학교 3~4학년","d":"표현","t":"노랫말을 익혀 노래를 듣고 따라 부른다.","m":"이 성취기준은 노랫말을 익히고 운율과 유희를 경험함으로써 일상의 언어생활과 관련된 음악 표현 능력을 기르기 위해 설정하였다. 재미있는 의성어나 의태어가 포함되어 있거나 학생들의 생활 주변 소재를 주제로 한 친근한 노래를 제재로 다룬다. 반복적이고 쉬운 노랫말을 여러 번 듣고 따라 해 봄으로써 언어에 내재한 운율과 리듬을 노래로 익히도록 한다.","n":["장애 정도가 심한 학생은 노랫말 전체가 아닌 반복되는 노랫말을 소재로 음절이나 어절의 주요 모음을 입 모양으로 연습하기, 범창을 들으며 교사나 친구의 입 모양을 따라 하기, 허밍으로 흥얼거리며 노래 듣고 부르기 등으로 성취기준을 재구성하여 적용할 수 있다."],"p":345,"b":3},{"c":"[4음악01-02]","k":"기본","sk":"","s":"음악","g":"초등학교 3~4학년","d":"표현","t":"박에 맞추어 노래를 듣고 따라 부르거나 악기로 연주한다.","m":"이 성취기준은 음악의 요소 중 일정 박이나 기본 박을 경험함으로써 일정하게 흐르는 음악의 특성을 파악하는 능력을 기르기 위해 설정하였다. 박에 맞추어 걷기, 2박, 3박 음악에 맞추어 걷거나 손뼉 치며 노래 부르기, 악기로 박을 치며 노래 부르기 등의 활동을 다룬다. 맥박, 시계 초침 등 생활 주변에서 박과 유사한 요소를 찾아보며 일정한 흐름의 특성을 이해하고 음악에서 박의 흐름을 직관적으로 경험하도록 한다.","n":["음악 요소를 인지하고 표현하는 활동에 어려움이 있는 학생이나 장애 정도가 심한 학생은 음악 요소를 나타내는 소리를 듣고 손짓하기, 끄덕이기, 목소리나 물체, 타악기를 활용하여 응답하기 등 개인에게 적합한 의사소통 방법으로 음악 요소를 경험하고 반응하는 활동으로 성취기준을 재구성하여 적용할 수 있다."],"p":345,"b":3},{"c":"[4음악01-03]","k":"기본","sk":"","s":"음악","g":"초등학교 3~4학년","d":"표현","t":"같은 음과 다른 음을 어울리는 표정이나 몸동작으로 표현한다.","m":"이 성취기준은 높이가 같은 음과 다른 음에 대해 학생들이 이해한 바를 신체를 활용하여 표현할 수 있는 능력을 기르기 위해 설정하였다. 높이가 같은 음과 다른 음을 듣고 허밍으로 따라 하거나, 음높이의 같고 다름을 표정이나 몸동작으로 표현하는 활동을 다룬다. 세밀한 음높이의 차이보다 음정 차가 큰 2~3개의 음으로 음높이의 같고 다름에 집중하여 차이를 구분하고 이를 신체로 자유롭게 나타낼 수 있도록 한다.","n":["음악 요소를 인지하고 표현하는 활동에 어려움이 있는 학생이나 장애 정도가 심한 학생은 음악 요소를 나타내는 소리를 듣고 손짓하기, 끄덕이기, 목소리나 물체, 타악기를 활용하여 응답하기 등 개인에게 적합한 의사소통 방법으로 음악 요소를 경험하고 반응하는 활동으로 성취기준을 재구성하여 적용할 수 있다."],"p":345,"b":3},{"c":"[4음악01-04]","k":"기본","sk":"","s":"음악","g":"초등학교 3~4학년","d":"표현","t":"소리의 셈과 여림, 빠름과 느림을 신체나 물체, 악기로 표현한다.","m":"이 성취기준은 음악의 요소 중 소리의 셈(큼)과 여림(작음), 빠름과 느림을 경험함으로써 소리의 크기를 구별하고, 음악에서 빠르기의 효과를 인식하는 능력을 기르기 위해 설정하였다. 동물, 자연, 물체, 일상생활 등 친근한 범위에서 소리 크기와 빠르기를 감지하고 모방하여 표현하는 활동을 다룬다. 구체적인 셈여림과 빠르기의 종류나 변화를 다루기보다 상대적인 차이를 신체나 물체, 악기로 다양하게 표현해 보도록 한다.","n":["음악 요소를 인지하고 표현하는 활동에 어려움이 있는 학생이나 장애 정도가 심한 학생은 음악 요소를 나타내는 소리를 듣고 손짓하기, 끄덕이기, 목소리나 물체, 타악기를 활용하여 응답하기 등 개인에게 적합한 의사소통 방법으로 음악 요소를 경험하고 반응하는 활동으로 성취기준을 재구성하여 적용할 수 있다."],"p":345,"b":3},{"c":"[4음악01-05]","k":"기본","sk":"","s":"음악","g":"초등학교 3~4학년","d":"표현","t":"신체나 물체, 여러 가지 타악기의 소리를 탐색하며 주변의 소리에 관심을 갖는다.","m":"이 성취기준은 신체나 물체, 여러 가지 타악기 소리를 비롯한 주변의 소리에 대한 감수성을 기르기 위해 설정하였다. 타악기나 물체의 생김새 등을 관찰하고 손뼉치기, 발 구르기, 악기나 물체를 문지르기, 긁기, 두드리기, 흔들기 등 다양한 방법으로 표현하며 소리의 특징을 살펴보는 활동을 다룬다. 정형화된 연주보다는 주변의 소리를 탐색하고 표현하는 활동을 하면서 생활 속에서 음악의 즐거움을 경험하도록 한다.","n":["장애 정도가 심한 학생의 교육적 요구에 따라 주변의 소리 중 음식 만드는 소리, 청소하는 소리, 길거리의 자동차 소리 등 일상생활에서 접하는 익숙한 주변 환경의 소리 상황을 제시하고 소리의 음색을 탐색하는 생활 중심 활동으로 성취기준을 재구성하여 적용할 수 있다."],"p":345,"b":3},{"c":"[4음악01-06]","k":"기본","sk":"","s":"음악","g":"초등학교 3~4학년","d":"표현","t":"노래를 부르거나 악기를 연주하며 친구들과 놀이에 즐겁게 참여한다.","m":"이 성취기준은 노래와 악기 연주 등의 음악 활동을 또래의 놀이 활동과 연계함으로써 학생들의 음악적 감수성과 사회성을 기르기 위해 설정하였다. 노래를 부르거나 악기를 연주하며 할 수 있는 놀이를 알아보고, 놀이 노래 부르기, 노래나 연주에 맞추어 전통이나 현대의 놀이하기 등의 활동을 하도록 한다. 학생들의 수준과 흥미를 고려하여 또래의 놀이 문화 속에서 음악을 풍부하게 즐길 수 있도록 하는 데 중점을 둔다.","n":[],"p":345,"b":3},{"c":"[4음악02-01]","k":"기본","sk":"","s":"음악","g":"초등학교 3~4학년","d":"창작","t":"기초적인 음악 요소를 고려하여 소리를 다르게 바꾼다.","m":"이 성취기준은 소리의 특성을 탐색하고 기초적인 음악 요소를 고려하여 다른 소리로 바꾸어 만드는 능력을 기르기 위해 설정하였다. 기초적인 음악 요소 중 박, 가락, 셈여림, 빠르기를 활용하여 다른 소리로 바꾸기, 신체나 물체, 여러 가지 악기 등의 소리로 바꾸기와 같은 창작 활동을 다룬다. 실생활에서 들을 수 있는 소리를 탐색하여 새로운 소리로 바꾸는 활동 속에서 창작의 즐거움을 경험하도록 하는 데 중점을 둔다.","n":["장애 정도가 심한 학생의 경우 소리에 반응하는 과정을 중심으로 촉진을 통하여 충분한 표현을 반복적으로 경험할 수 있도록 성취기준을 재구성하여 적용할 수 있다."],"p":347,"b":3},{"c":"[4음악02-02]","k":"기본","sk":"","s":"음악","g":"초등학교 3~4학년","d":"창작","t":"주변에서 경험한 다양한 소리를 모방하여 간단한 음악으로 만든다.","m":"이 성취기준은 주변의 소리를 모방하여 다양한 방법으로 음악을 만드는 능력을 기르도록 설정하였다. 기초적인 음악 요소를 고려하여 소리 모방하기, 노랫말의 소리, 노랫말의 리듬, 신체나 물체, 여러 가지 악기, 인공지능 음악 저작 도구를 활용하여 음악 만들기 등의 활동을 다룬다. 소리와 관련된 자기 경험을 바탕으로 주변의 소리를 나타내며 음악을 만드는 즐거움을 경험하도록 하는 데 중점을 둔다.","n":["장애 정도가 심한 학생의 교육적 요구에 따라 주변의 소리를 탐색하고 모방하여 소리를 음악으로 만드는 과정을 중심으로 하여, 학교의 교실이나 복도, 가정에서의 생활 소음, 길거리의 자동차 소리, 사람들이 모이는 장소에서의 여러 가지 소리, 미디어 등에서의 주변 환경의 다양한 소리를 인식하고 경험하도록 하는 일상생활 활동 중심의 성취기준으로 재구성하여 적용할 수 있다."],"p":347,"b":3},{"c":"[4음악02-03]","k":"기본","sk":"","s":"음악","g":"초등학교 3~4학년","d":"창작","t":"자신의 느낌을 음악으로 나타내며 주변 소리에 호기심을 갖는다.","m":"이 성취기준은 자기 경험에 관한 느낌을 음악으로 만들며 주변 소리에 호기심을 가질 수 있도록 설정하였다. 실생활에서 호기심을 가지고 주변 소리 탐색하기, 자신의 느낌이나 감정을 말소리, 노랫말의 리듬, 신체, 물체, 악기, 스마트 기기의 악기 애플리케이션 등 다양한 도구로 만들기, 인공지능 음악 저작 도구를 활용하여 즉흥적으로 만들기 등을 하며 자신의 느낌을 자유롭게 표현해 보는 데 중점을 둔다.","n":["장애 정도가 심한 학생의 교육적 요구에 따라 주변의 소리를 탐색하고 모방하여 소리를 음악으로 만드는 과정을 중심으로 하여, 학교의 교실이나 복도, 가정에서의 생활 소음, 길거리의 자동차 소리, 사람들이 모이는 장소에서의 여러 가지 소리, 미디어 등에서의 주변 환경의 다양한 소리를 인식하고 경험하도록 하는 일상생활 활동 중심의 성취기준으로 재구성하여 적용할 수 있다."],"p":347,"b":3},{"c":"[4음악03-01]","k":"기본","sk":"","s":"음악","g":"초등학교 3~4학년","d":"감상","t":"음악을 듣고 다양한 분위기나 느낌을 신체, 목소리 등으로 반응한다.","m":"이 성취기준은 다양한 분위기와 느낌의 음악을 경험하게 함으로써 음악의 아름다움을 느끼고 음악적 감수성을 일깨우기 위해 설정하였다. 자연의 소리, 생활 주변의 소리, 동물의 소리를 탐색하고, 자연이나 계절에 어울리는 음악을 제재로 다룬다. 음악을 감상하며 기쁨, 슬픔, 놀람, 무서움 등 다양한 음악적 분위기나 느낌을 감지하고 신체와 목소리로 반응해 보는 데 중점을 둔다.","n":["시각중복장애 학생의 경우 스피커 진동을 통해 소리의 크고 작음을 촉지각으로 느낄 수 있게 하며, 청각중복장애 학생의 경우 그림, 상징, 기호 등의 시각 자료 및 영상 자료를 적극적으로 활용한다. 청각중복장애 학생은 다양한 분위기나 느낌의 그림, 사진, 영상 등을 보고 움직임을 흉내 내기, 자신의 느낌을 자유롭게 동작으로 표현하기 등의 활동으로 성취기준을 재구성하여 적용할 수 있다."],"p":349,"b":3},{"c":"[4음악03-02]","k":"기본","sk":"","s":"음악","g":"초등학교 3~4학년","d":"감상","t":"박, 가락, 셈여림, 빠르기 등의 기초적인 음악 요소를 탐색하며 듣는다.","m":"이 성취기준은 기초 음악 요소인 박, 같은/다른 음, 큰/작은 소리, 빠른/느린 음악을 탐색하며 듣고 음악의 흐름을 느끼도록 하기 위해 설정하였다. 단순 듣기에서 확장하여 소리의 변화나 상대적 차이를 표정, 손뼉치기, 걷기, 동작, 춤 등으로 반응하도록 한다. 음악 요소의 변화를 구체적으로 표현하기보다는 차이를 감지하고 표현하도록 하며, 처음에는 교사의 시범을 따라 하다가 점차 자유롭게 표현하도록 하는 데 중점을 둔다.","n":["시각중복장애 학생의 경우 스피커 진동을 통해 소리의 크고 작음을 촉지각으로 느낄 수 있게 하며, 청각중복장애 학생의 경우 그림, 상징, 기호 등의 시각 자료 및 영상 자료를 적극적으로 활용한다. 청각중복장애 학생은 다양한 분위기나 느낌의 그림, 사진, 영상 등을 보고 움직임을 흉내 내기, 자신의 느낌을 자유롭게 동작으로 표현하기 등의 활동으로 성취기준을 재구성하여 적용할 수 있다.","이 성취기준에서는 대조적인 소리의 비교처럼 현저하게 차이를 구별할 수 있는 소리나 음악을 들려준다. 소리의 차이를 시각적으로 보여 주는 그림, 사진, 영상 등의 교수·학습자료를 함께 사용하여 보다 쉽게 소리를 탐색하며 표현할 수 있도록 한다. 같은 곡을 비교하여 들려주고 같은 가락이지만 빠르기에 따라 느낌이 다르다는 것을 경험할 수 있도록 한다."],"p":349,"b":3},{"c":"[4음악03-03]","k":"기본","sk":"","s":"음악","g":"초등학교 3~4학년","d":"감상","t":"가족이나 친구가 좋아하는 음악을 듣고 주변 음악에 관심을 갖는다.","m":"이 성취기준은 주변 사람들이 어떤 음악을 좋아하는지 관심을 기울이고 탐색하며 반응하게 함으로써 음악적 호기심과 사회성을 함양하기 위해 설정하였다.주변 사람들이 좋아하는 음악을 존중하고 개인적인 활동뿐 아니라 가족, 친구와 함께 할 수 있는 활동을 통해 음악으로 공동체와 소통하며 경험을 확장하는 데 중점을 둔다.","n":["감상은 단지 듣기만 하는 수동적 활동에서 벗어나 인터넷, 동영상, 스마트폰 애플리케이션 등을 활용한 다양한 감상 활동으로 확장되도록 한다. 특정 음역이나 악기 소리에 예민한 반응을 보이는 자폐성장애 학생이 있는지 살펴보고, 차음 헤드폰으로 소리 감각을 줄여 준다. 또한 학생의 주의 집중과 흥미 유발을 위해 그림, 영상 등 여러 가지 자료를 음악과 함께 제시하도록 한다."],"p":349,"b":3},{"c":"[4음악03-04]","k":"기본","sk":"","s":"음악","g":"초등학교 3~4학년","d":"감상","t":"내가 좋아하는 음악을 듣고 우리 음악에 흥미를 갖는다.","m":"이 성취기준은 자신이 좋아하는 음악을 듣고 우리 음악에 흥미를 느끼게 하기 위해 설정하였다. 주변에서 접할 수 있는 전래 동요, 민요, 창작 동요, 대중음악 등 우리나라의 음악을 들으며 음악에 맞추어 놀이하거나 신체 표현하기와 같은 활동을 다룬다. 평소 학생이 관심을 가지는 대상을 매개로 하여 음악과 경험을 연관시키고 우리 음악을 즐기는 태도를 지니도록 하는 데 중점을 둔다.","n":["학생이 선호하는 음악은 학생 관찰이나 보호자 면담으로 미리 파악한다. 학생이 선호하는 음악과 관련된 소품이나 자료들을 활용하여 어떤 음악인지 예측하게 하여 학생의 흥미와 반응을 이끌어 낼 수 있도록 감각적 자극을 제공한다."],"p":349,"b":3},{"c":"[6음악01-01]","k":"기본","sk":"","s":"음악","g":"초등학교 5~6학년","d":"표현","t":"말 리듬을 익혀 노래를 듣고 따라 부른다.","m":"이 성취기준은 노랫말과 음악의 리듬 요소가 결합된 말 리듬을 익혀 노래 부르는 활동을 통해 언어와 음악 표현의 이해를 돕기 위해 설정하였다. 말 리듬의 내용, 음악적 특징 등을 고려하여 노래의 의미를 명확히 전달할 수 있도록 따라 말하기, 주고받으며 말하기, 한 소절씩 듣고 따라 부르기 등의 활동을 다룬다. 말 리듬은 학생들의 수준에 따라 제시하되, 노래를 통한 전달과 소통의 즐거움을 경험하도록 하는 데 중점을 둔다.","n":["말 리듬은 언어적 표현과 음악적 표현의 통합적 활동으로, 장애 정도가 심하거나 구어적 표현에 어려움이 있는 학생의 경우 노랫말의 리듬을 신체활동으로 표현하거나 반응하는 것으로 성취기준을 재구성하여 적용할 수 있다."],"p":351,"b":3},{"c":"[6음악01-02]","k":"기본","sk":"","s":"음악","g":"초등학교 5~6학년","d":"표현","t":"장단에 맞추어 노래를 듣고 따라 부르거나 악기로 연주한다.","m":"이 성취기준은 음악의 요소 중 장단을 느끼며 노래를 부르거나 악기를 연주하는 활동으로 우리 음악의 흥겨움을 경험하도록 하기 위해 설정하였다. 경쾌하고 흥겨운 느낌을 지닌 자진모리장단, 세마치장단 등에 따른 전래 동요와 민요를 불러 보고, 장단의 기본 박에 맞추어 소고나 북을 치는 활동 등을 다룬다. 노래, 악기, 신체표현 등을 통합적으로 다룸으로써 장단에 내재한 우리 음악의 특징을 경험하도록 하는 데 중점을 둔다.","n":[],"p":351,"b":3},{"c":"[6음악01-03]","k":"기본","sk":"","s":"음악","g":"초등학교 5~6학년","d":"표현","t":"음의 길고 짧음, 점점 빠르게와 점점 느리게를 다양한 신체 동작으로 표현한다.","m":"이 성취기준은 음악의 요소 중 음의 길고 짧음, 점점 빠르게와 점점 느리게를 경험하여 음악 개념의 차이와 변화를 구별하는 능력을 기르기 위해 설정하였다. 점, 선 등을 활용한 그림 자료로 음 길이와 빠르기의 차이 및 변화를 시각적으로 감지하고, 음악 요소의 특징을 고려하여 다양한 신체 동작으로 표현하는 활동 등을 다룬다. 신체표현을 할 때는 여럿이 함께하는 기회를 주어 표현 부담을 낮추고 음악을 즐기도록 한다.","n":["장애 정도가 심한 학생의 교육적 요구에 따라 음악 요소의 표현 방법을 표정이나 손짓, 신체 동작, 그림이나 색깔 카드, 물체나 악기의 소리로 응답하기 등 개인에게 적합한 의사소통 방법으로 반응하도록 성취기준에 포함되는 활동을 재구성하여 적용할 수 있다."],"p":351,"b":3},{"c":"[6음악01-04]","k":"기본","sk":"","s":"음악","g":"초등학교 5~6학년","d":"표현","t":"음의 높고 낮음, 점점 세게와 점점 여리게의 소리를 악기로 표현한다.","m":"이 성취기준은 음악 요소 중 음의 높고 낮음, 점점 세게와 점점 여리게를 경험함으로써 음높이와 셈여림의 변화를 구별하고 표현하는 능력을 기르기 위해 설정하였다. 높낮이가 다른 음, 크기가 변화하는 소리를 들어 본 경험을 떠올려 보고, 이를 뚜렷하게 나타낸 악곡의 일부를 악기로 표현하도록 한다. 색깔 도형을 활용한 시각 자료를 함께 제시하여 청각으로 감지한 음악 개념의 차이와 변화를 구별하여 표현할 수 있도록 한다.","n":["장애 정도가 심한 학생의 교육적 요구에 따라 음악 요소의 표현 방법을 표정이나 손짓, 신체 동작, 그림이나 색깔 카드, 물체나 악기의 소리로 응답하기 등 개인에게 적합한 의사소통 방법으로 반응하도록 성취기준에 포함되는 활동을 재구성하여 적용할 수 있다."],"p":351,"b":3},{"c":"[6음악01-05]","k":"기본","sk":"","s":"음악","g":"초등학교 5~6학년","d":"표현","t":"선율 및 무선율 타악기의 종류와 소리를 탐색하며 악기 연주에 흥미를 갖는다.","m":"이 성취기준은 무선율 및 선율 타악기 소리에 대한 감수성과 기초 연주 능력을 기르기 위해 설정하였다. 악기의 재료, 연주법에 따른 종류와 음색을 알아보고 악곡의 주요 리듬 연주해 보기, 실로폰, 핸드벨, 터치벨 등 선율 타악기를 활용하여 선율의 일부분이나 몇 개의 음으로 구성된 가락 오스티나토 연주하기 등의 활동을 다룬다. 정확한 주법을 강조하기보다는 악기의 음색과 아름다운 소리를 경험하도록 하는 데 중점을 둔다.","n":["시각장애나 지체중복장애 학생의 경우 학생의 신체적 능력을 고려하여 실물 악기뿐만 아니라 가상악기 애플리케이션을 활용하여 간단한 조작으로도 다양한 악기의 음색을 충분히 경험할 수 있는 기회를 제공하도록 한다."],"p":351,"b":3},{"c":"[6음악01-06]","k":"기본","sk":"","s":"음악","g":"초등학교 5~6학년","d":"표현","t":"노래나 악기 연주로 주변의 행사에 참여함으로써 표현을 통한 자신감을 갖는다.","m":"이 성취기준은 학생들의 음악 활동을 주변과 지역사회로 확장시킴으로써 공동체의 일원으로서 역할을 수행하고 음악으로 자신감과 사회성을 기르기 위해 설정하였다. 가족, 학급, 학교, 지역의 행사 등 연주 활동으로 참여할 수 있는 다양한 기회를 마련하여 연습하고 참여하도록 한다. 활동에 관한 학생들의 참여를 독려할 때는 자율적인 의사와 취향, 수행 능력을 존중하여 음악 활동에 자신감을 가지도록 하는 데 중점을 둔다.","n":["주변 행사에 참여하여 연주할 때에는 연주 규모, 장소, 밀집도 등을 고려하여 사전에 안전 수칙을 숙지할 수 있도록 지도한다. 또한 다른 사람과 함께하는 음악 활동을 경험하며 소통 및 공감을 하는 등 민주시민 교육의 관점에서 포용성과 시민성 발달을 연계할 수 있도록 한다."],"p":351,"b":3},{"c":"[6음악02-01]","k":"기본","sk":"","s":"음악","g":"초등학교 5~6학년","d":"창작","t":"음악 요소를 고려하여 노랫말을 바꾼다.","m":"이 성취기준은 노래에 담긴 음악적 요소와 문학적 요소를 경험하고 노랫말을 바꾸는 능력을 기르기 위해 설정하였다. 음악 요소 중 리듬, 장단, 가락, 셈여림, 빠르기 등을 고려하여 의성어나 의태어 등 재미있는 노랫말 바꾸기, 한 음절이나 어절 등 반복되는 노랫말 바꾸기 등의 활동을 다룬다. 노래 속에 포함된 선율과 노랫말을 경험하고 새로운 노랫말로 바꾸는 시도를 해 보는 데 중점을 둔다.","n":["이 성취기준에서는 음악 요소를 고려하여 노랫말을 다양한 방식으로 바꾸어 보도록 하며, 학생이 새로운 노랫말로 바꾸고 불러 보는 경험을 시도하고 표현해 보는 경험을 반복적으로 충분히 할 수 있는 기회를 제공하여 학습 활동을 촉진한다."],"p":353,"b":3},{"c":"[6음악02-02]","k":"기본","sk":"","s":"음악","g":"초등학교 5~6학년","d":"창작","t":"일상생활 속 장면이나 상황에 대한 느낌을 간단한 음악으로 만든다.","m":"이 성취기준은 일상생활 속에서 자신이 경험한 느낌을 바탕으로 장면이나 상황에 어울리는 소리나 음악을 만드는 능력을 기르기 위해 설정하였다. 생활 속 다양한 장면과 상황 속 자기의 느낌을 신체, 물체, 여러 가지 악기 소리나 음악으로 나타내기, 상황에 어울리는 소리를 탐색하여 다양한 방법으로 소리나 음악 만들기 등의 활동을 다룬다. 자기 경험과 느낌을 음악으로 자유롭고 즐겁게 표현해 보는 데 중점을 둔다.","n":["장애 정도가 심한 학생이 리듬, 장단, 가락, 셈여림, 빠르기 등의 음악 요소를 활용하여 음악을 만들 때 보조공학 기기를 스스로 조작하거나 신체적 또는 언어적인 도움을 받아 조작하여 활동에 참여할 수 있도록 한다. 전자악기 및 인공지능 음악 저작 도구를 활용한 음악 만들기로 개인에게 적합한 방법을 제시하는 것으로 성취기준을 재구성하여 적용할 수 있다."],"p":353,"b":3},{"c":"[6음악02-03]","k":"기본","sk":"","s":"음악","g":"초등학교 5~6학년","d":"창작","t":"자신의 상상을 음악으로 나타내며 창작에 흥미를 갖는다.","m":"이 성취기준은 자신의 상상을 음악으로 만드는 데 흥미를 느낄 수 있도록 설정하였다. 일상생활 속 자신이 경험하거나 경험할 일에 대한 자신의 상상을 음악 요소를 활용하여 신체나 물체, 여러 가지 악기, 스마트 기기, 인공지능 음악 저작 도구 등으로 음악 만들기 등을 다룬다. 다양한 음악적 표현을 바탕으로 자기 스스로 음악을 만드는 창작 활동에 흥미를 느낄 수 있도록 하는 데 중점을 둔다.","n":["장애 정도가 심한 학생이 리듬, 장단, 가락, 셈여림, 빠르기 등의 음악 요소를 활용하여 음악을 만들 때 보조공학 기기를 스스로 조작하거나 신체적 또는 언어적인 도움을 받아 조작하여 활동에 참여할 수 있도록 한다. 전자악기 및 인공지능 음악 저작 도구를 활용한 음악 만들기로 개인에게 적합한 방법을 제시하는 것으로 성취기준을 재구성하여 적용할 수 있다."],"p":353,"b":3},{"c":"[6음악03-01]","k":"기본","sk":"","s":"음악","g":"초등학교 5~6학년","d":"감상","t":"음악을 듣고 느낌이나 상황을 신체, 악기, 그림 등으로 표현한다.","m":"이 성취기준은 음악을 듣고 다양한 느낌이나 상황을 신체, 악기, 그림 등 통합적으로 표현하는 능력을 기르기 위해 설정하였다. 봄, 여름, 가을, 겨울의 계절, 그림이나 사진, 영상 등의 장면을 다양하게 제시하고 이에 어울리는 음악을 표현하는 활동을 다룬다. 느낌과 상황에 어울리는 음악을 듣고 자신의 생각과 느낌을 신체, 악기, 그림 등으로 자유롭게 표현하며 음악적으로 소통하도록 하는 데 중점을 둔다.","n":["장애 정도가 심한 학생이나 발달장애 학생들의 경우 상황이나 장면에 해당하는 음악의 분위기와 느낌에 따라 다양한 질감의 천을 이용하여 학생의 손과 얼굴 등 촉각적인 자극을 함께 느낄 수 있도록 한다. 계절에 관한 음악을 들을 때에는 손 펌프로 바람을, 분무기로 비를, 솜으로 눈 등의 시·촉각적 자극을 주어 대체 경험을 제공한다. 놀이 동요를 활용하여 온몸을 움직이며 음악을 듣고 놀이에 참여할 수 있도록 한다."],"p":354,"b":3},{"c":"[6음악03-02]","k":"기본","sk":"","s":"음악","g":"초등학교 5~6학년","d":"감상","t":"리듬, 장단, 가락, 셈여림, 빠르기 등의 음악 요소를 탐색하며 듣는다.","m":"이 성취기준은 긴/짧은 음, 높은/낮은 음, 점점 커지는/작아지는 음, 점점 빨라지는/느려지는 음을 탐색하여 구별하고 반응하는 능력을 기르기 위해 설정하였다. 음악 요소를 시각 또는 청각적으로 느끼며 몇 개의 단계로 나누어 그림으로 제시하기, 신체 동작으로 표현하기, 악기 연주하기 등 다양한 방법으로 표현하는 활동을 다룬다. 음악 요소를 탐색하고 소리 변화를 표현함으로써 음악의 특징을 익히는 데 중점을 둔다.","n":["지나치게 음악 요소에 집중하여 요소를 강조하기보다는 특징적인 부분을 비교하여 들려주도록 한다. 학생의 흥미와 집중 시간을 고려한 곡을 선정함으로써 감상 활
