동이 즐거운 경험이 되도록 한다. 적당한 길이, 특징적이거나 대비가 잘 드러나는 곡을 감상곡으로 선택한다. 감상곡과 관련된 다양한 구체물을 준비하여 장애 정도가 심한 학생이 물체의 모양을 만져 보고 촉각을 통해 악곡을 충분히 느낄 수 있도록 한다."],"p":354,"b":3},{"c":"[6음악03-03]","k":"기본","sk":"","s":"음악","g":"초등학교 5~6학년","d":"감상","t":"일상생활과 함께하는 음악을 듣고 소리와 음악에 대한 즐거움을 갖는다.","m":"이 성취기준은 일상생활과 함께하는 놀이 중심의 감상을 통해 공동체 역량과 사회성을 증진하기 위해 설정하였다. 놀이를 적용하거나 활동을 중심으로 한 생활 속 다양한 음악 감상을 통해 음악을 생활화하고 즐거움을 느끼도록 한다. 신체나 도구를 활용한 놀이를 바탕으로 다양한 소리나 음악을 체험하도록 하는 데 중점을 둔다.","n":["일상생활 속에서 들을 수 있는 여러 소리를 탐색하고 들을 때 몸을 움직여 보거나 학생이 만든 소리나 악기 소리, 목소리 등을 녹음하여 다시 들려줌으로써 자신이 표현한 소리나 음악의 새로움과 흥미를 경험할 수 있도록 한다."],"p":354,"b":3},{"c":"[6음악03-04]","k":"기본","sk":"","s":"음악","g":"초등학교 5~6학년","d":"감상","t":"일상생활 속 음악을 듣고 다양한 우리 음악에 친숙함을 느낀다.","m":"이 성취기준은 생활 속에서 접할 수 있는 우리 음악을 탐색하며 친숙함을 느끼도록 하기 위해 설정하였다. 대중매체나 기기, 학생들이 좋아하는 게임, 여러 장소 등 생활 속에서 활용되는 전통과 현대의 다양한 우리 음악을 접하도록 한다. 인공지능 콘텐츠를 활용하여 학생의 흥미를 높이고 음악 학습 내에서 디지털 기기의 활용 경험을 제공함으로써 음악의 즐거움을 풍부하게 경험하도록 하는 데 중점을 둔다.","n":["장애 정도가 심한 학생의 교육적 요구와 장애 유형에 따라 일상생활 속 우리 음악을 놀이와 함께 다루는 활동에서 터치 화면을 사용하여 놀이 음악 재생시키기, 놀이에 사용되는 물건이나 주제에 해당하는 그림을 스마트 기기에 담아 선택이나 클릭하기 등으로 성취기준을 재구성하여 적용할 수 있다."],"p":354,"b":3},{"c":"[9음악01-01]","k":"기본","sk":"","s":"음악","g":"중학교 1~3학년","d":"표현","t":"적절한 발성과 목소리 크기를 탐색하여 노래를 부른다.","m":"이 성취기준은 노래를 부르기 위해 적절한 발성과 목소리 크기의 필요성을 경험함으로써 음악에 대한 이해를 넓히고 표현력을 기르기 위해 설정되었다. 노랫말의 발음을 듣고 익히며 학생의 신체적 특성을 고려하여 발성하기에 편안한 자세와 적절한 목소리 크기로 노래를 부른다. 노랫말의 의미를 생각하며 말하듯이 여러 번 발성해 보고, 선율과 함께 표현했을 때에도 노랫말을 잘 전달할 수 있도록 하는 데 중점을 둔다.","n":["청각장애 학생의 경우에는 자신의 목소리의 강도와 세기의 정도를 확인할 수 있는 애플리케이션을 활용하여 적절한 크기의 목소리를 탐색하도록 한다. 장애 정도가 심해 언어 표현을 어려워하는 학생의 경우 직접 노래를 부르기보다는 발성과 목소리 크기가 음악에 미치는 영향을 경험할 수 있도록 다양한 예시를 보거나 듣고 아름다운 소리가 무엇인지 구분하는 것으로 성취기준을 재구성하여 적용할 수 있다."],"p":356,"b":3},{"c":"[9음악01-02]","k":"기본","sk":"","s":"음악","g":"중학교 1~3학년","d":"표현","t":"장단의 구음을 익혀 부르고 악기로 연주한다.","m":"이 성취기준은 음악의 요소 중 장단을 이루는 요소를 익혀 연주하며 우리 음악의 재미를 경험하도록 하기 위해 설정되었다. 국악기 소리를 흉내 내는 말인 구음의 다양한 형태를 알아보고, 소고, 북, 장구 등 타악기의 구음을 익혀 말 장단이나 무릎 장단으로 연습하며 악기로 연주해 보는 등의 활동을 다룬다. 학생들의 음악적 수준에 따라 장단의 형태를 선택하여 우리 음악의 멋을 느껴 보도록 하는 데 중점을 둔다.","n":["장단의 구음을 언어로 표현하는 데 어려움이 있는 경우 국악기의 소리와 그것을 흉내 내어 표현한 다양한 구음을 관련지어 경험해 보고, 구음 기호 중 한 가지를 정하여 신체나 악기로 표현해 보는 것으로 성취기준을 재구성하여 적용할 수 있다."],"p":356,"b":3},{"c":"[9음악01-03]","k":"기본","sk":"","s":"음악","g":"중학교 1~3학년","d":"표현","t":"악곡에서 반복되는 리듬이나 가락의 움직임을 찾아 신체나 악기를 활용하여 표현한다.","m":"이 성취기준은 음악의 요소 중 반복되는 리듬과 가락의 움직임을 경험함으로써 악곡 구성 관련 기본 개념을 익혀 적용하는 능력을 기르기 위해 설정하였다. 악곡에서 반복되는 리듬이나 가락을 찾아 신체로 표현해 보고 해당 부분을 오스티나토로 반복하여 연주해 보는 등의 활동을 다룬다. 음악 요소가 명확하게 드러나는 곡을 제재로 선택하며, 악곡의 난이도나 학생 특성에 따라 시각 자료, 동작을 활용한 활동 등을 제시하도록 한다.","n":["장애 정도가 심한 학생의 교육적 요구에 따라 성취기준에 포함된 음악 요소의 종류를 나누거나 악곡의 범위를 제한적으로 조정하여 제시함으로써 학생에게 적합한 수준으로 학습하도록 성취기준을 재구성하여 적용할 수 있다."],"p":356,"b":3},{"c":"[9음악01-04]","k":"기본","sk":"","s":"음악","g":"중학교 1~3학년","d":"표현","t":"셈여림과 빠르기를 살려 악곡의 일부를 노래로 부르거나 악기로 연주한다.","m":"이 성취기준은 음악의 요소 중 다양한 셈여림과 빠르기를 경험함으로써 음악의 표현적 요소를 익히도록 하기 위해 설정하였다. 다양한 셈여림과 빠르기의 곡을 탐색하고, 여리게/세게 등의 셈여림과 느리게/보통 빠르게/빠르게 등의 빠르기가 잘 드러나는 부분을 노래로 부르거나 연주하는 활동을 다룬다. 다양한 셈여림과 빠르기를 포함한 악곡이나 활동을 제시하여 음악 활동으로 개념을 이해하도록 하는 데 중점을 둔다.","n":["장애 정도가 심한 학생의 교육적 요구에 따라 성취기준에 포함된 음악 요소의 종류를 나누거나 악곡의 범위를 제한적으로 조정하여 제시함으로써 학생에게 적합한 수준으로 학습하도록 성취기준을 재구성하여 적용할 수 있다."],"p":356,"b":3},{"c":"[9음악01-05]","k":"기본","sk":"","s":"음악","g":"중학교 1~3학년","d":"표현","t":"친구들과 가락악기를 연주하며 음악으로 함께하는 태도를 갖는다.","m":"이 성취기준은 다양한 음색과 음역을 가진 가락악기 연주를 통해 소리의 아름다움을 느끼고 다른 사람과 함께 음악 활동을 하는 기쁨을 경험하도록 하기 위해 설정하였다. 선율 타악기, 현악기, 관악기 등의 가락악기의 음색을 탐색하고 연주법을 익혀 자신이 선택한 악기로 함께 연주해 보는 활동 등을 다룬다. 학생의 수행 능력이나 신체 특성에 따라 알맞은 악기를 선택하도록 하고, 협동하고 함께하는 태도의 측면에 중점을 둔다.","n":["장애 정도가 심한 학생의 경우 다른 사람과 동시에 악기 연주를 시작하고 마치는 연주 약속을 신체 동작이나 숫자, 소리 등으로 제시하도록 하고, 학생의 수준에 따라 듣고 따라 연주하거나 악곡을 나누어 이어 연주하는 것 등으로 성취기준을 재구성하여 적용할 수 있다.","친구나 다른 사람과 함께하는 음악 활동이나 다른 사람 앞에서 발표하는 공동의 활동을 통해 구성원의 역할을 다하는 등 민주시민 교육과 연계할 수 있다."],"p":356,"b":3},{"c":"[9음악01-06]","k":"기본","sk":"","s":"음악","g":"중학교 1~3학년","d":"표현","t":"생활 속에서 노래나 악기 연주를 발표하는 활동을 통해 노력과 성취감을 경험한다.","m":"이 성취기준은 노래나 악기 연주 등의 개인적 음악 표현활동을 다른 사람 앞에서 발표하는 공동의 활동으로 연계함으로써 음악 표현을 통한 사회성을 기르기 위해 설정하였다. 자신이 좋아하고 즐기는 악곡과 표현활동을 선택하고 꾸준히 연습하여 대면이나 비대면 상황에서 발표해 보는 활동을 다룬다. 연주 발표를 위해서는 시간과 노력이 필요함을 깨닫고 활동 과정과 결과의 전반에서 성취감을 느끼도록 하는 데 중점을 둔다.","n":["친구나 다른 사람과 함께하는 음악 활동이나 다른 사람 앞에서 발표하는 공동의 활동을 통해 구성원의 역할을 다하는 등 민주시민 교육과 연계할 수 있다."],"p":356,"b":3},{"c":"[9음악02-01]","k":"기본","sk":"","s":"음악","g":"중학교 1~3학년","d":"창작","t":"음악 요소를 활용하여 간단한 리듬으로 이루어진 음악을 만든다.","m":"이 성취기준은 음악 요소에 따른 음악의 특성을 경험하고 음악 요소를 음악 창작에 적용하는 능력을 기르기 위해 설정하였다. 리듬을 활용하여 오스티나토 만들기, 셈여림이나 빠르기에 변화를 주며 리듬 반복하기, 인공지능 음악 저작 도구를 활용한 음악 만들기 등 간단한 리듬을 중심으로 음악 만들기 활동을 다룬다. 음악 요소를 활용한 창작 활동에서 리듬을 중심으로 음악을 만들고 재미를 경험하도록 하는 데 중점을 둔다.","n":["장애 정도가 심한 학생이 눈 깜빡임, 표정, 손짓, 몸동작, 소리 등 비언어적 요소를 사용할 수 있도록 촉진하며 간단한 리듬을 제시하여 개인에게 적합한 방법으로 반응할 수 있도록 하는 것으로 성취기준을 재구성하여 적용할 수 있다."],"p":359,"b":3},{"c":"[9음악02-02]","k":"기본","sk":"","s":"음악","g":"중학교 1~3학년","d":"창작","t":"줄거리를 생각하며 이야기의 일부를 음악으로 만든다.","m":"이 성취기준은 이야기의 내용과 상황적 요소를 바탕으로 음악을 만드는 능력을 기르기 위해 설정하였다. 등장인물, 배경, 사건, 이야기 등에 어울리는 소리를 신체나 물체, 악기로 표현하기, 노래 부르기, 리듬이나 가락으로 만들기, 이야기 일부를 간단한 음악극으로 만들기 등의 활동을 다룬다. 협력하여 음악을 만들며 시민성을 경험하고 이야기와 결합된 음악의 재미를 느끼도록 하는 데 중점을 둔다.","n":["의사소통에 어려움이 있는 경우에는 이야기의 일부를 들려주고 즉흥적으로 즉흥 리듬 치기, 즉흥 가락 붙이기, 악기 소리내기 등으로 음악극을 만들어 가는 과정을 이해하거나 참여하는 것으로 성취기준을 재구성하여 적용할 수 있다."],"p":359,"b":3},{"c":"[9음악02-03]","k":"기본","sk":"","s":"음악","g":"중학교 1~3학년","d":"창작","t":"자신의 상상을 담은 음악을 만들며 새로운 음악을 즐기는 태도를 갖는다.","m":"이 성취기준은 음악을 새롭게 만들어 가며 음악적 상상력을 기르고 음악을 즐기는 태도를 기르기 위해 설정하였다. 일상생활에서 자신이 경험하고 이해한 것, 상상의 세계와 바라는 점들을 자유롭게 떠올려 보고 이를 바탕으로 음악을 만들어 보는 활동을 다룬다. 결과물에 초점을 두기보다는 음악이 만들어지는 과정 자체를 경험하면서 음악의 새로움과 재미를 즐기도록 하는 데 중점을 둔다.","n":["자기 경험과 상상을 음악적으로 표현하는 것을 인공지능 음악 저작 도구를 활용하여 교사나 또래의 도움을 받아 새로운 음악으로 만들어보고 자신이 만든 음악에 반응하도록 하는 활동으로 성취기준을 재구성하여 적용할 수 있다."],"p":359,"b":3},{"c":"[9음악03-01]","k":"기본","sk":"","s":"음악","g":"중학교 1~3학년","d":"감상","t":"음악을 듣고 주제나 장면을 음악으로 표현하거나 이야기한다.","m":"이 성취기준은 음악을 듣고 다양한 주제나 장면을 이야기나 음악으로 표현하며 음악적으로 소통하는 능력을 기르기 위해 설정하였다. 음악 동화, 음악과 동작, 미술이 통합된 음악극, 표제 음악, 오페라, 판소리, 뮤지컬 등을 감상하고 주제를 목소리, 동작, 악기 등으로 표현하거나 이야기하도록 한다. 음악이 표현하는 바가 무엇인지 집중하며 듣고 표현하는 것에 중점을 둔다.","n":["장애 정도가 심한 학생의 손과 팔의 움직임과 관련된 장애 특성과 활동 영역 등을 고려하여 움직일 수 있는 범위 내에서 활용할 수 있는 변형된 악기나 맞춤형 악기를 제공한다. 그 밖에도 보조공학 기기를 지원하여 수업에 참여할 수 있는 환경을 제공하고 성취기준을 재구성하여 적용할 수 있다."],"p":360,"b":3},{"c":"[9음악03-02]","k":"기본","sk":"","s":"음악","g":"중학교 1~3학년","d":"감상","t":"리듬, 장단, 가락, 셈여림, 빠르기 등의 다양한 음악 요소를 떠올리며 듣는다.","m":"이 성취기준은 음악을 들으며 음악의 요소와 개념을 익히도록 하기 위해 설정하였다. 음악을 들으며 일정한 리듬이나 가락을 오스티나토로 반복하여 연주하기 활동을 다룬다. 또한 다양한 리듬, 장단, 가락, 셈여림, 빠르기에 어울리는 장면을 보며 음악을 듣게 하고 신체 동작으로 반응하기, 그림 그리기 등 음악 요소를 떠올리며 들을 수 있도록 하는 데 중점을 둔다.","n":["장애 정도가 심한 학생의 경우에는 운동 범위 내에서 신체를 활용하여 다양한 셈여림을 표현하게 할 수 있다. 또한 학생이 참여할 수 있는 범위 내에서 음악 요소를 조정하여 성취기준을 재구성하여 적용할 수 있다."],"p":360,"b":3},{"c":"[9음악03-03]","k":"기본","sk":"","s":"음악","g":"중학교 1~3학년","d":"감상","t":"공동체의 음악을 들으며 생활 속 행사나 의식에 참여하는 태도를 갖는다.","m":"이 성취기준은 생활 속 공동체의 음악을 경험함으로써 음악을 생활화하는 태도를 기르기 위해 설정하였다. 생일, 결혼식 등 가족 행사, 입학식, 졸업식, 학예회 등 학교 행사, 지역사회의 여러 행사나 축제, 종교 의식, 국가 의식 등에 쓰이는 음악에 관심을 기울이고 음악을 듣도록 한다. 또한 행사나 의식에 참여함으로써 직접 체험할 수 있도록 하는 데 중점을 둔다.","n":["장애 정도가 심한 학생의 손과 팔의 움직임과 관련된 장애 특성과 활동 영역 등을 고려하여 움직일 수 있는 범위 내에서 활용할 수 있는 변형된 악기나 맞춤형 악기를 제공한다. 그 밖에도 보조공학 기기를 지원하여 수업에 참여할 수 있는 환경을 제공하고 성취기준을 재구성하여 적용할 수 있다.","생활 속 행사나 의식에 참여할 때에는 참여 규모, 장소, 밀집도 등을 고려하여 사전에 안전 수칙을 숙지할 수 있도록 지도한다.","행사나 의식에 쓰이는 음악의 장면과 주제 및 이야기 등을 표현한 음악을 제시할 때에는 디지털 매체를 활용한다. 발달장애 학생과 청각장애 학생의 경우 음악과 애니메이션이 결합된 감상 자료나 멀티미디어 자료를 통해 리듬과 음높이의 변화를 다양한 감각으로 체험할 수 있도록 한다. 또한 공동체 내에서의 다양한 음악의 역할을 이해하며 민주시민 교육과 연계할 수 있다."],"p":360,"b":3},{"c":"[9음악03-04]","k":"기본","sk":"","s":"음악","g":"중학교 1~3학년","d":"감상","t":"사회에서 다양하게 활용되는 음악을 들으며 우리나라와 세계의 음악을 즐긴다.","m":"이 성취기준은 우리 사회에서 활용되는 다양한 음악을 알아보고 우리나라와 세계의 음악을 즐기는 태도를 갖추기 위해 설정하였다. 지역사회의 여러 장소나 공간에서 연주되는 음악, 지역에서 전승되는 음악, 상황에 어울리는 배경 음악, 대중매체나 기기 등으로 접하는 세계 음악 등 다양한 음악을 듣도록 한다. 이를 통해 사회에서 음악의 역할과 쓰임을 이해하며 음악의 폭을 넓혀 가는 데 중점을 둔다.","n":["행사나 의식에 쓰이는 음악의 장면과 주제 및 이야기 등을 표현한 음악을 제시할 때에는 디지털 매체를 활용한다. 발달장애 학생과 청각장애 학생의 경우 음악과 애니메이션이 결합된 감상 자료나 멀티미디어 자료를 통해 리듬과 음높이의 변화를 다양한 감각으로 체험할 수 있도록 한다. 또한 공동체 내에서의 다양한 음악의 역할을 이해하며 민주시민 교육과 연계할 수 있다."],"p":360,"b":3},{"c":"[12음악01-01]","k":"기본","sk":"","s":"음악","g":"고등학교 1~3학년","d":"표현","t":"편안한 발성과 호흡으로 노래를 부른다.","m":"이 성취기준은 아름다운 소리를 내기 위한 편안한 발성과 호흡법을 익혀 노래 부르기 능력을 보다 향상하기 위해 설정되었다. 노랫말의 의미를 살려 편안한 발성으로 부르며, 악곡의 프레이즈를 고려한 호흡으로 노래 부르기를 연습하는 활동 등을 다룬다. 좋은 소리를 위해 자세와 발성, 호흡이 필요함을 알되, 학생의 신체적 특성과 능력을 고려하여 연습과 시도 자체에 중점을 둔다.","n":["장애 정도가 심한 학생의 교육적 요구에 따라 구어 표현의 제약이 있는 경우 직접 노래 부르기보다는 말하기나 목소리로 반응하면서 자신에게 편안한 발성과 호흡, 자세 등이 무엇인지 경험해 보는 것으로 성취기준을 재구성하여 적용할 수 있다."],"p":362,"b":3},{"c":"[12음악01-02]","k":"기본","sk":"","s":"음악","g":"고등학교 1~3학년","d":"표현","t":"다양한 장단의 느낌을 살려 노래를 부르거나 악기로 연주한다.","m":"이 성취기준은 음악 요소 중 다양한 장단을 경험함으로써 우리 전통음악의 변화와 다양성을 인식하도록 하기 위해 설정하였다. 느린 장단과 빠른 장단을 비교하여 보고, 장단에 따라 노래의 느낌이 어떻게 달라지는지 민요를 부르거나 장단의 기본 박을 악기로 연주해 보는 활동 등을 다룬다. 장단의 다양성과 변화가 뚜렷하며 친숙한 민요를 선정하여 학생들이 우리 음악의 변화가 주는 재미를 경험하도록 하는 데 중점을 둔다.","n":["학생의 교육적 요구에 따라 음악 요소의 변화와 다양성을 경험하도록 하되, 장애 정도가 심한 학생의 경우 이전 학년군에서 학습한 음악 요소에 대한 이해 정도를 진단해 보고 학생에게 제시할 음악 요소의 개수나 범위를 조정하여 줌으로써 학생 개별 수준에 적합하도록 성취기준을 재구성하여 적용할 수 있다."],"p":362,"b":3},{"c":"[12음악01-03]","k":"기본","sk":"","s":"음악","g":"고등학교 1~3학년","d":"표현","t":"서로 다른 리듬, 같은 가락과 다른 가락을 구별하고 역할을 나누어 표현한다.","m":"이 성취기준은 음악 요소 중 서로 다른 리듬, 같은 가락과 다른 가락을 경험하고 차이를 인식하도록 하기 위해 설정하였다. 마디나 악구 단위로 리듬 치기, 가락선 그리기, 동작이나 그림으로 표현하기 등으로 서로 다른 리듬과 가락을 구별하고 역할을 나누어 악기를 연주하는 활동을 다룬다. 보다 기초적인 요소로 리듬을 먼저 다루고 점차 가락으로 확장하되, 학생의 신체적, 음악적 특성을 고려하여 활동을 구성하도록 한다.","n":["학생의 교육적 요구에 따라 음악 요소의 변화와 다양성을 경험하도록 하되, 장애 정도가 심한 학생의 경우 이전 학년군에서 학습한 음악 요소에 대한 이해 정도를 진단해 보고 학생에게 제시할 음악 요소의 개수나 범위를 조정하여 줌으로써 학생 개별 수준에 적합하도록 성취기준을 재구성하여 적용할 수 있다."],"p":362,"b":3},{"c":"[12음악01-04]","k":"기본","sk":"","s":"음악","g":"고등학교 1~3학년","d":"표현","t":"셈여림과 빠르기에 변화를 주며 함께 노래를 부르거나 악기로 연주한다.","m":"이 성취기준은 음악의 요소 중 셈여림과 빠르기의 변화를 경험함으로써 음악의 표현과 변화의 재미를 인식하도록 하기 위해 설정하였다. 전체적인 셈여림과 빠르기의 변화와 차이를 구별하는 데서 나아가 악곡 내의 부분적인 변화를 신체나 타악기로 표현해 보고, 이를 함께하는 노래나 악기 연주에 적용해 보는 활동을 다룬다. 용어에 대한 이해보다는 다양한 신체적, 감각적 활동을 통한 음악적인 이해에 중점을 둔다.","n":["학생의 교육적 요구에 따라 음악 요소의 변화와 다양성을 경험하도록 하되, 장애 정도가 심한 학생의 경우 이전 학년군에서 학습한 음악 요소에 대한 이해 정도를 진단해 보고 학생에게 제시할 음악 요소의 개수나 범위를 조정하여 줌으로써 학생 개별 수준에 적합하도록 성취기준을 재구성하여 적용할 수 있다."],"p":362,"b":3},{"c":"[12음악01-05]","k":"기본","sk":"","s":"음악","g":"고등학교 1~3학년","d":"표현","t":"다양한 악기 소리의 어울림을 느끼며 다른 사람과 조화를 이루어 연주하는 태도를 갖는다.","m":"이 성취기준은 다양한 소리의 어울림을 느끼는 음악적 감성 능력과 연주 활동을 통한 사회성을 기르기 위해 설정하였다. 타악기, 관악기, 건반악기, 디지털 악기 등 악기가 서로 어우러져 나는 여러 가지 소리의 조합을 경험하고, 연주 과정에서 나와 다른 사람의 소리가 조화를 이루는지 들으며 연주하는 통합적인 활동을 다룬다. 기능이나 연주 결과의 완성도보다는 다른 사람의 소리에 관심을 기울이도록 하는 데 중점을 둔다.","n":["장애 정도가 심한 학생의 경우 자신이 연주하는 악기 소리를 들어 보고, 다른 사람의 연주를 들어 본 뒤 점차 여러 악기의 소리가 함께 조화를 이루며 들리는 소리를 경험하도록 과제를 분리하여 수행하는 것으로 성취기준을 재구성하여 적용할 수 있다."],"p":362,"b":3},{"c":"[12음악01-06]","k":"기본","sk":"","s":"음악","g":"고등학교 1~3학년","d":"표현","t":"생활 속에서 연주를 준비하고 공연하는 활동에 참여함으로써 소통하고 협력하는 태도를 갖는다.","m":"이 성취기준은 노래나 악기 연주를 삶 속에서 생활화하며 음악으로 공동체 내에서 소통하고 협력하는 능력을 기르기 위해 설정하였다. 또래 집단이 좋아하는 음악, 대중매체 속의 음악, 음악이 필요한 상황 등 생활 속의 다양한 음악 활동을 탐색하고 연주를 연습하고 준비하여 공연에 참여해 보도록 한다. 학생들의 관심, 흥미와 재능, 수준에 따라 다양한 역할을 부여하고, 타인과 소통하며 협력하려는 태도에 중점을 둔다.","n":["학생이 음악 공연에 직접 참여할 때에는 공연의 목적, 장소, 규모, 환경 등을 고려하여 사전에 안전 수칙을 숙지할 수 있도록 지도한다."],"p":362,"b":3},{"c":"[12음악02-01]","k":"기본","sk":"","s":"음악","g":"고등학교 1~3학년","d":"창작","t":"음악 요소를 활용하여 간단한 가락으로 구성된 음악을 만든다.","m":"이 성취기준은 음악 요소에 관한 이해와 경험을 바탕으로 한 음악적 특성을 창의적인 음악 활동에 적용하는 능력을 기르기 위해 설정하였다. 가락을 활용하여 오스티나토 만들기, 리듬, 셈여림, 빠르기의 특징과 변화를 활용하여 가락 만들기, 인공지능 음악 저작 도구를 활용한 음악 만들기 등의 활동을 다룬다. 가락을 중심으로 음악을 만들고 음악 요소에 따른 변화의 재미와 즐거움을 경험하도록 하는 데 중점을 둔다.","n":[],"p":364,"b":3},{"c":"[12음악02-02]","k":"기본","sk":"","s":"음악","g":"고등학교 1~3학년","d":"창작","t":"줄거리에 따라 역할을 나누어 음악극을 만든다.","m":"이 성취기준은 이야기의 줄거리를 분석하고 역할을 나누어 음악극으로 만들어 봄으로써 음악을 통한 통합적 경험을 제공하기 위해 설정하였다. 음악극을 만들기 위해서 줄거리에 따라 역할 나누기, 역할 정하기, 연습하기, 발표하기 등의 활동을 다룬다. 등장인물, 사건, 배경 등 이야기의 표현을 음악적 표현과 관련짓고 각자 맡은 역할을 수행하면서 음악을 통해 함께하는 경험을 즐기도록 하는 데 중점을 둔다.","n":["음악극을 위한 역할을 나누어 음악 작품을 만들 때 의사소통에 어려움이 있는 경우에는 해설, 대사, 음악을 모두 녹음 자료로 만든 후에 교사와 또래의 도움을 받아 음악극 전개 순서에 따라 보조공학 기기 및 스마트 기기를 활용하여 반응하는 것으로 성취기준을 재구성하여 적용할 수 있다."],"p":364,"b":3},{"c":"[12음악02-03]","k":"기본","sk":"","s":"음악","g":"고등학교 1~3학년","d":"창작","t":"상상과 의도를 담은 음악 작품을 친구와 협동하여 완성하는 태도를 갖는다.","m":"이 성취기준은 음악 창작의 기초로서의 상상과 의도를 정하여 작품을 완성해 보며 협동하는 태도를 기르기 위해 설정하였다. 음악 작품으로 나타내기 위한 일상의 상상, 표현하고자 하는 의도를 다양한 방법으로 떠올려 보고, 이에 따라 자신의 관심과 흥미를 바탕으로 공동체와 함께 작품으로 완성해 가는 활동을 다룬다. 음악 작품을 만드는 과정과 작품을 통해 성취감을 느끼고 협동하는 태도를 형성하는 데 중점을 둔다.","n":["음악극을 위한 역할을 나누어 음악 작품을 만들 때 의사소통에 어려움이 있는 경우에는 해설, 대사, 음악을 모두 녹음 자료로 만든 후에 교사와 또래의 도움을 받아 음악극 전개 순서에 따라 보조공학 기기 및 스마트 기기를 활용하여 반응하는 것으로 성취기준을 재구성하여 적용할 수 있다."],"p":364,"b":3},{"c":"[12음악03-01]","k":"기본","sk":"","s":"음악","g":"고등학교 1~3학년","d":"감상","t":"음악을 듣고 배경이나 줄거리를 서로 이야기한다.","m":"이 성취기준은 음악을 듣고 배경이나 줄거리를 이해하며 음악적 소통 능력을 키우기 위해 설정하였다. 이미지가 떠오르는 음악, 줄거리가 있는 음악 외에도 오페라, 뮤지컬, 판소리 등 음악을 듣고 특징적인 부분을 따라 해 보기, 흥미로운 배경이나 줄거리를 선택하여 간단하게 표현하기 등의 활동을 다룬다. 학생 수준에 따라 알맞은 그림이나 영상 자료를 제시하여 음악이 표현하는 바를 이해하며 감상하는 데 중점을 둔다.","n":["음악을 듣거나 관련 장면을 보는 과정에서 특수교육 대상 학생에게 나타나는 작은 행동적 요소와 반응을 관찰하여 적절한 지원을 제공한다. 장애 정도가 심한 학생에게는 음악을 듣고 이야기할 때 의사소통 판을 활용하거나 신체 조건에 맞는 여러 가지 형태의 스위치, 음성출력 보완대체의사소통 기기 등을 활용하여 참여할 수 있도록 한다."],"p":365,"b":3},{"c":"[12음악03-02]","k":"기본","sk":"","s":"음악","g":"고등학교 1~3학년","d":"감상","t":"리듬, 장단, 가락, 셈여림, 빠르기 등과 같은 음악 요소의 변화를 구분하며 듣는다.","m":"이 성취기준은 서로 다른 리듬, 같은 가락과 다른 가락, 셈여림과 빠르기의 변화를 통해 음악의 흐름과 새로움을 느끼며 청각을 비롯한 다양한 감각적 능력을 신장시키기 위해 설정하였다. 소리 크기나 빠르기의 변화를 신체나 악기로 표현하기, 다양한 리듬과 장단을 듣고 따라 부르기 등의 활동을 다룬다. 음악 요소의 변화를 시각적, 청각적, 신체적으로 표현해 봄으로써 활동을 하면서 자연스럽게 이해하도록 하는 데 중점을 둔다.","n":["셈여림과 빠르기의 변화는 리듬 청각 자극을 통해 보폭, 속도, 걷기, 균형, 자세, 몸통 조절, 이동 능력, 조작 능력 등 운동 기능과 관련지어 지도한다. 장애 정도가 심한 학생의 경우 셈여림/빠르기의 변화에 맞게 손, 팔, 다리 등을 주물러 주고, 소근육 사용이 가능하다면 쉽게 미끄러지지 않는 재질의 악기를 활용하여 악기를 손으로 만지게 하며, 악기를 한곳에 모아 보게 하는 등으로 성취기준을 재구성하여 적용할 수 있다."],"p":365,"b":3},{"c":"[12음악03-03]","k":"기본","sk":"","s":"음악","g":"고등학교 1~3학년","d":"감상","t":"여러 문화권의 음악을 듣고 다양한 음악에 대한 존중과 예절을 갖춘다.","m":"이 성취기준은 여러 문화권의 음악을 듣고 다양한 음악을 존중하는 태도를 지니며 감상 예절을 익히도록 하기 위해 설정하였다. 여러 문화권의 음악, 세계의 다양한 대중음악이나 민속 음악 등을 듣고 친구들과 함께 이야기 나누는 활동을 다룬다. 또한 음악 공연마다 지켜야 할 서로 다른 감상 방법과 예절이 있음을 알고 이를 지키는 습관을 형성하도록 하는 데 중점을 둔다.","n":["장애 정도가 심한 학생의 경우 스위치를 눌러 음악을 듣거나 소리 나는 장난감을 활용하는 등 다양한 매체를 활용할 수 있도록 한다. 또한 음악을 들을 때 필요한 태도나 적절한 반응 등을 함께 지도한다. 다양한 상황과 관련된 음악을 통해 여러 장르의 음악을 접할 수 있도록 음악의 미적 체험을 제공하고, 매체와 관련된 음악으로 음악에 대한 다양성을 느낄 수 있도록 한다."],"p":365,"b":3},{"c":"[12음악03-04]","k":"기본","sk":"","s":"음악","g":"고등학교 1~3학년","d":"감상","t":"여러 매체에서 활용된 음악을 듣고 다양한 음악의 가치를 인식한다.","m":"이 성취기준은 매체에서 활용되거나 매체를 활용한 음악을 듣고 다양한 음악의 가치를 인식하도록 하기 위해 설정하였다. 국악, 서양음악, 대중음악, 세계음악 등을 소재로, 생활 속에서 다양한 매체, 디지털, 인공지능 등이 활용된 음악회나 공연을 경험해 보도록 한다. 이로써 생활 속에서 음악이 다양한 분야와 연계 융합하여 사용되며 다양한 가치를 지니고 있음을 인식하도록 하는 데 중점을 둔다.","n":["장애 정도가 심한 학생의 경우 스위치를 눌러 음악을 듣거나 소리 나는 장난감을 활용하는 등 다양한 매체를 활용할 수 있도록 한다. 또한 음악을 들을 때 필요한 태도나 적절한 반응 등을 함께 지도한다. 다양한 상황과 관련된 음악을 통해 여러 장르의 음악을 접할 수 있도록 음악의 미적 체험을 제공하고, 매체와 관련된 음악으로 음악에 대한 다양성을 느낄 수 있도록 한다."],"p":365,"b":3},{"c":"[4미술01-01]","k":"기본","sk":"","s":"미술","g":"초등학교 3~4학년","d":"체험","t":"자신의 감각을 확인하고 주변 환경을 탐색한다.","m":"이 성취기준은 신체활동과 감각 놀이를 통해 자신의 감각을 확인하고 주변 환경을 탐색하기 위해 설정하였다. 선 따라 걷기, 오감 체험 놀이하기, 주변의 자연물과 인공물 등을 탐색하기 등을 하면서 자신의 감각을 확인하는 내용을 다룬다. 과학과와 연계하여 오감을 직접 느껴보고 생활 주변의 물체에 관심을 기울이는 활동을 할 수 있다. 통합적인 놀이 및 신체활동과 같은 직접적인 체험을 통해 자신의 감각을 확인하고 탐색하는 것에 주안점을 둔다.","n":[],"p":380,"b":3},{"c":"[4미술01-02]","k":"기본","sk":"","s":"미술","g":"초등학교 3~4학년","d":"체험","t":"나의 얼굴과 몸에 관심을 기울이고 탐색한다.","m":"이 성취기준은 자신의 얼굴과 몸에 관심을 기울이고 미적 특징을 탐색하기 위해 설정하였다. 발 도장의 모양 살피기, 거울에 비친 자신의 얼굴 살펴보기, 머리카락 색깔알아보기 등의 내용을 다룬다. 과학과와 연계하여 신체 각 부위의 명칭을 알고 생김새를 구분하는 활동을 할 수 있다. 자신의 신체에서 선, 색, 모양 등을 탐색하며 기초적인 미적 특징을 찾는 것에 주안점을 둔다.","n":[],"p":380,"b":3},{"c":"[4미술01-03]","k":"기본","sk":"","s":"미술","g":"초등학교 3~4학년","d":"체험","t":"주변 환경과 사람에 흥미와 관심을 가지고 즐겁게 탐색한다.","m":"이 성취기준은 자신과 주변 사람을 포함한 주변 환경의 미적 대상에 흥미와 관심을 갖고 즐겁게 탐색하기 위해 설정하였다. 친구의 얼굴 관찰하기, 동물과 식물의 모습 살펴보기, 학교나 학급의 표지판 살펴보기, 친구와 함께 자연물 탐색하기 등의 내용을 다룬다.탐색의 범위를 나, 너, 우리로 점차 확장해 가며 자신을 둘러싼 사람들과 주변 환경의 관계를이해하는 것에 주안점을 둔다.","n":[],"p":380,"b":3},{"c":"[4미술01-04]","k":"기본","sk":"","s":"미술","g":"초등학교 3~4학년","d":"체험","t":"주변 환경에 대한 생각과 느낌을 몸으로 표현한다.","m":"이 성취기준은 주변 환경에 대해서 느낀 감정과 생각을 몸으로 표현하기 위해 설정하였다. 애벌레의 움직임을 몸으로 표현하기, 나무의 모습을 몸으로 표현하기, 바람개비의 움직임을 몸으로 표현하기 등의 내용을 다룬다. 자연물에서부터 인공적 대상으로 탐색범위를 넓히면서 주변 환경의 아름다움을 느끼고 자신의 생각이나 느낌을 다양한 방법으로 나타내는 것에 주안점을 둔다.","n":["장애 정도가 심하여 몸으로 표현하는 활동에 어려움이 있는 학생은 친구나 교사의 몸동작을 따라 하기, 생각과 느낌을 표정으로 표현하기, 자신의 생각과 느낌을 나타내는 몸동작 골라보기 등으로 성취기준을 재구성하여 적용할 수 있다."],"p":380,"b":3},{"c":"[4미술02-01]","k":"기본","sk":"","s":"미술","g":"초등학교 3~4학년","d":"표현","t":"생활 주변에서 친숙한 소재를 찾아 표현 활동에 즐겁게 참여한다.","m":"이 성취기준은 생활 주변 환경에서 자주 접하는 자연물, 인공물, 사람 등의 소재를 탐색하고 이를 즐겁게 표현하는 활동에 참여하기 위해 설정하였다. 주변의 친숙한 사물이나 소재를 탐색하기, 그리기, 배치하기, 쌓기, 친구와 사진찍기 등의 표현 활동을 다룬다.소재의 선정은 학생들이 즐겁게 참여할 수 있도록 친밀도, 선호도나 흥미 등을 고려하고, 학생이 쉽게 접할 수 있는 소재를 표현하는 과정에서 표현 활동에 즐거움을 느끼는 것에 주안점을 둔다.","n":[],"p":382,"b":3},{"c":"[4미술02-02]","k":"기본","sk":"","s":"미술","g":"초등학교 3~4학년","d":"표현","t":"자신과 주변 환경에 관심을 기울이고 색과 모양을 찾아 표현한다.","m":"이 성취기준은 자신과 주변 환경에 관심을 기울이고 색과 모양을 찾아서 표현하는 능력을 기르고자 설정하였다. 주변 자연물의 색과 모양에 관심 기울이기, 점, 선, 면으로 그리거나 만들기, 손바닥 따라 그리기, 점과 선으로 자신의 얼굴 그리기 등의 내용을 다룬다. 이 성취기준에서는 주변을 자유롭게 탐색하면서 색이나 모양과 같은 기본적인 조형 요소에 관심을 기울이는 것에 주안점을 둔다.","n":["시각중복장애 학생에게는 촉각 자료를 이용한 점, 선, 면 등을 따라 그리기, 종이를 접어 형태 만들기 등으로 성취기준을 재구성하여 적용할 수 있다."],"p":382,"b":3},{"c":"[4미술02-03]","k":"기본","sk":"","s":"미술","g":"초등학교 3~4학년","d":"표현","t":"주변의 표현 재료와 용구로 그리기, 만들기 등의 표현 활동을 경험한다.","m":"이 성취기준은 일상생활 속에서 쉽게 볼 수 있는 그리기, 만들기 등에 사용되는 표현 재료와 용구를 경험하기 위해 설정하였다. 여러 가지 그리기 및 만들기 재료와 용구로 표현하기, 스마트폰이나 스마트 기기 등의 디지털 매체를 활용하여 다양한 표현하기 등의 내용을 다룬다. 학생들이 놀이 활동을 하는 과정에서 주변의 표현 재료와 용구를 사용하고 이에 친숙해지는 것에 주안점을 둔다.","n":["장애 정도가 심하여 주변의 표현 재료와 용구를 활용하기 어려운 학생은 자신이 원하는 표현 용구 찾기, 좋아하는 용구로 놀이하기 등으로 성취기준을 재구성하여 적용할 수 있다."],"p":382,"b":3},{"c":"[4미술02-04]","k":"기본","sk":"","s":"미술","g":"초등학교 3~4학년","d":"표현","t":"주변의 자연환경에서 소재를 찾고 환경을 소중하게 여기는 태도를 지닌다.","m":"이 성취기준은 주변의 자연환경을 살펴보고 그리거나 만드는 활동 등을 하면서환경을 소중하게 여기는 태도를 지니도록 하기 위해 설정하였다. 주변의 자연물과 계절의 변화를 보여 주는 소재를 찾아 그리기, 만들기, 찍기, 반죽하기 등의 내용을 다룬다. 주변의 자연환경을 살펴보고 표현하는 과정에서 환경의 소중함을 느끼는 태도를 지니는 것에 주안점을 둔다.","n":[],"p":382,"b":3},{"c":"[4미술03-01]","k":"기본","sk":"","s":"미술","g":"초등학교 3~4학년","d":"감상","t":"나의 주변 미술 작품에 관심을 기울이고 생활 속 다양한 미술 작품을 찾는다.","m":"이 성취기준은 주변에서 볼 수 있는 미술 작품에 관심을 기울이고 생활 속에서다양한 미술 작품을 찾아보면서 감상에 대한 기초적인 경험을 하기 위해 설정하였다. 자연 풍경 바라보기, 친구의 작품 관찰하기, 사진 찍기, 작품 카드 찾기 등의 직접적 방법과 디지털매체를 활용한 간접적 방법으로 미술을 감상하는 내용을 다룬다. 다양한 자연물, 인공물, 디지털 매체 등을 모두 경험하도록 하되, 오감을 충분히 경험할 수 있는 직접적인 매체를 중심으로 미술 작품을 감상하는 것에 주안점을 둔다.","n":[],"p":383,"b":3},{"c":"[4미술03-02]","k":"기본","sk":"","s":"미술","g":"초등학교 3~4학년","d":"감상","t":"내가 좋아하는 미술 작품을 전시하고 즐기는 태도를 지닌다.","m":"이 성취기준은 자신 또는 친구와 함께 만든 미술 작품을 전시하고, 전시된 작품을 감상하는 과정에서 생활 속 미술 작품을 감상하고 즐기는 경험을 하기 위해 설정하였다. 내가 좋아하는 미술 작품 찾기, 더 좋아하는 미술 작품 찾기, 자신의 작품 소개하기, 학급 게시판이나 복도에 작품 전시하기, 온라인 미술관에 작품 전시하기 등의 내용을 다룬다.생활 속에서 미술 작품을 전시하면서 감상 활동을 즐기는 태도를 지니는 것에 주안점을 둔다.","n":["장애 정도가 심한 학생이 표현 언어로 소통하기가 어려운 경우 몸짓이나 보완대체의사소통 기기 등을 활용한 다양한 의사소통 방법을 사용할 수 있다. 또한 미술 작품에대한 자신의 생각과 느낌을 그림, 소리, 몸짓언어 등으로 나타내기, 자신이 좋아하는 작품을 손으로 가리키기 등으로 성취기준을 재구성하여 적용할 수 있다."],"p":383,"b":3},{"c":"[6미술01-01]","k":"기본","sk":"","s":"미술","g":"초등학교 5~6학년","d":"체험","t":"감각을 활용하여 주변 대상을 탐색할 수 있다.","m":"이 성취기준은 감각을 활용하여 자연물과 인공물을 포함한 주변의 대상을 탐색하기 위해 설정하였다. 이를 위해 시각, 촉각, 청각, 미각, 후각 등의 감각 역할 알기, 감각을 활용하여 주변 대상의 특징을 탐색하기 등의 내용을 다룬다. 감각의 역할을 알고 활용할 수 있도록 특징이 명확한 대상부터 탐색을 시작하여 새로운 안목을 경험하는 것에 주안점을 둔다.","n":[],"p":385,"b":3},{"c":"[6미술01-02]","k":"기본","sk":"","s":"미술","g":"초등학교 5~6학년","d":"체험","t":"주변 대상에 대한 생각과 느낌을 다양한 방법으로 나타낼 수 있다.","m":"이 성취기준은 주변 환경 속 대상을 탐색하고 상호 작용하며 떠오르는 생각이나 느낌을 다양한 방법으로 나타내기 위해 설정하였다. 대상에 대한 생각이나 느낌을 몸으로표현하기, 색이나 모양을 소리나 움직임 등으로 나타내기 등의 내용을 다룬다. 주변의 대상을탐색하고 떠오르는 생각과 느낌을 다양한 방법으로 나타내고 반응하는 것에 주안점을 둔다.","n":[],"p":385,"b":3},{"c":"[6미술01-03]","k":"기본","sk":"","s":"미술","g":"초등학교 5~6학년","d":"체험","t":"주변의 생활환경에서 자주 쓰이는 이미지를 찾는다.","m":"이 성취기준은 생활 속에서 자주 쓰이는 기호나 상징, 캐릭터 등을 찾아보면서생활 속 이미지와 친숙해지기 위해 설정하였다. 화장실과 신호등의 그림 문자(픽토그램), 간판,그림말(이모티콘), 친숙한 캐릭터 등 일상생활에서 자주 사용되는 이미지를 찾아보는 내용을 다루며 국어과의 보완대체의사소통 활용과 연계하여 재구성할 수 있다. 학생이 살아가는 생태환경과 밀접하면서 필수적으로 쓰이는 이미지를 찾고 경험하는 과정에서 소통의 즐거움을 느끼는 것에 주안점을 둔다.","n":["장애 정도가 심하여 일상생활 속에서 기호나 상징을 자발적으로 발견하기 어려운 학생은 학교 환경에서 접할 수 있는 상징과 같은 상징 찾기, 상징이나 기호 색칠하기 등으로 성취기준을 재구성하여 적용할 수 있다."],"p":385,"b":3},{"c":"[6미술01-04]","k":"기본","sk":"","s":"미술","g":"초등학교 5~6학년","d":"체험","t":"집, 교실, 학교 등에서 다양한 생활 속 미술을 발견하고 아름다움을 즐긴다.","m":"이 성취기준은 집, 교실, 학교 등의 다양한 공간에서 생활 속 미술을 발견하고아름다움을 즐기기 위해 설정하였다. 생활 속 미술의 범위는 미술 작품 외에도 생활 공간, 생활 용품 등 시각 문화 전반을 포괄한다. 집과 교실 및 학교 등의 생활 공간을 탐색하기, 계절의 특성에 달라지는 공간의 모습 찾기, 여러 가지 생활 용품 탐색하기 등의 내용을 다룬다. 미술 작품뿐만 아니라 생활 용품과 공간 등 실생활 속에서 쉽게 발견할 수 있는 미술의아름다움을 즐기는 것에 주안점을 둔다.","n":[],"p":385,"b":3},{"c":"[6미술01-05]","k":"기본","sk":"","s":"미술","g":"초등학교 5~6학년","d":"체험","t":"타 교과와 연결된 다양한 미술 활동에 참여한다.","m":"이 성취기준은 다른 교과를 통해 배운 내용과 연결된 미술 활동을 체험하기 위해 설정하였다. 음악 분수를 보며 음악과 미술의 어울림 느끼기, 식물의 구조를 관찰하며 아름다움 느끼기, 친구와 함께 타일 패턴에서 규칙적인 색과 모양 찾기 등 타 교과와 미술을연결하는 내용을 다룬다. 미술이 타 교과와 연결되는 활동에 함께 참여하는 과정에서 학생들이배운 지식을 점차적으로 확장하고 삶에 적용하는 것에 주안점을 둔다.","n":[],"p":385,"b":3},{"c":"[6미술02-01]","k":"기본","sk":"","s":"미술","g":"초등학교 5~6학년","d":"표현","t":"주변 환경과 대상을 관찰하고 흥미로운 주제를 찾아 표현한다.","m":"이 성취기준은 주변 환경과 다양한 대상에 흥미와 관심을 갖고 관찰하며 표현하고 싶은 주제를 찾아 표현 활동을 하기 위해 설정하였다. 주변 사물 관찰하기, 주변 인물관찰하고 표현하기, 자연환경을 관찰하고 표현하고 싶은 주제 찾기, 그리고 싶은 사람이나 사물 찾아 표현하기 등의 내용을 다룬다. 표현 주제는 자신이 좋아하는 것에서부터 시작하여 다양한 것으로 범위를 넓히며 주제를 찾는 과정에서 표현 활동에 흥미를 불러일으킬 수 있도록 한다.","n":[],"p":387,"b":3},{"c":"[6미술02-02]","k":"기본","sk":"","s":"미술","g":"초등학교 5~6학년","d":"표현","t":"기본적인 표현 재료와 용구의 사용법을 익히고 표현 활동에 즐겁게 참여한다.","m":"이 성취기준은 기본적인 표현 재료와 용구를 자연스럽게 접하여 사용법을 익히고 표현 활동에 즐겁게 참여하기 위해 설정하였다. 기본적인 표현 재료(예: 종이류, 조소 재료, 그리기 및 채색 재료, 친숙한 생활 용품)와 용구, 디지털 매체 등을 활용하는 내용을 다룬다. 미술 활동에서 자주 사용되는 표현 재료와 용구를 자연스럽게 경험하고 표현 용구에 익숙해져서 즐겁게 표현하는 것에 주안점을 둔다.","n":[],"p":387,"b":3},{"c":"[6미술02-03]","k":"기본","sk":"","s":"미술","g":"초등학교 5~6학년","d":"표현","t":"기본적인 조형 요소를 사용하여 자신이 표현하고 싶은 것을 그리거나 만든다.","m":"이 성취기준은 점, 선, 면, 색, 명암, 질감 등의 미술 표현에 기본이 되는 조형 요소를 사용하여 자신이 표현하고 싶은 것을 주도적으로 그리거나 만들기 위해 설정하였다. 이를 위해 자신이 선호하는 색으로 형태를 그리거나 만들기, 그림자를 사용하여 명암 표현하기, 점토를 사용하여 질감 표현하기 등의 표현 활동을 다룬다. 여러 가지 표현 활동을 하면서 기본적인 조형 요소를 반복적으로 경험하여 자기주도적인 미술 표현을 하는 데 주안점을 둔다.","n":["움직임이 제한적이거나 협응 능력이 부족한, 장애 정도가 심한 학생의 경우에는 보조공학 기기를 사용하여 그림 그리기, 낙서를 그림으로 변환하는 인공지능 애플리케이션 활용하기 등으로 성취기준을 재구성하여 적용할 수 있다."],"p":387,"b":3},{"c":"[6미술02-04]","k":"기본","sk":"","s":"미술","g":"초등학교 5~6학년","d":"표현","t":"환경 친화적인 재료와 방법으로 작품을 만들며 환경의 소중함을 느낀다.","m":"이 성취기준은 환경 친화적인 재료와 방법으로 작품을 만들고, 환경을 소중히여기는 태도를 지니도록 하기 위해 설정하였다. 자연물이나 재활용품을 사용하여 작품 만들기,테라리엄 만들기, 재생 가능한 재료로 교실 꾸미기, 기존 작품을 재창조하거나 재구성하기 등의 내용을 다룬다. 환경 친화적인 미술 활동을 하면서 환경의 소중함을 알고 생태적 감수성을 높이는 것에 주안점을 둔다.","n":[],"p":387,"b":3},{"c":"[6미술02-05]","k":"기본","sk":"","s":"미술","g":"초등학교 5~6학년","d":"표현","t":"타 교과와 연결된 표현 활동에 흥미를 느낀다.","m":"이 성취기준은 타 교과와 연결된 미술 활동에 참여하며 다양한 경험이 융합되는 표현 활동에 흥미를 유발하기 위해 설정하였다. 악기 만들기, 응원 도구 만들기, 북 아트만들기, 관찰 그림 그리기, 우리 마을 꾸미기 등 미술을 다른 교과와 융합하여 표현하는 내용을 다룬다. 미술이 타 교과와 연결되는 경험을 통해 생활 속에서 미술 표현을 적용하고 표현 범위를 확대하는 것에 주안점을 둔다.","n":[],"p":387,"b":3},{"c":"[6미술03-01]","k":"기본","sk":"","s":"미술","g":"초등학교 5~6학년","d":"감상","t":"생활 속 미술 작품을 자세히 살펴보고 일상생활에서 미술을 즐기는 태도를 지닌다.","m":"이 성취기준은 생활 속 미술 작품을 자세히 살펴보며 형이나 색, 재료 등 작품의 외형적인 특징을 발견하고 미술을 즐기는 태도를 지니게 하기 위해 설정하였다. 주변에서자주 볼 수 있는 작품에 나타난 다양한 모양과 색 찾기, 미술 작품의 소재나 재료 찾아보기, 작품에 대해 질문하거나 이야기 나누기 등의 내용을 다룬다. 미술 작품 감상에 충분한 시간을들여 미술 작품의 특징을 탐색함으로써 학생들이 일상생활 속에서 감상을 즐기는 것에 주안점을 둔다.","n":[],"p":388,"b":3},{"c":"[6미술03-02]","k":"기본","sk":"","s":"미술","g":"초등학교 5~6학년","d":"감상","t":"미술 작품의 특징에 관해 자신의 생각과 느낌을 나눌 수 있다.","m":"이 성취기준은 미술 작품의 특징에 관해 다양한 방법으로 자신의 생각과 느낌을 나누며 감상하기 위해 설정하였다. 미술 작품의 특징적인 색을 찾고 느낌을 표현하기, 작품에 대한 생각과 느낌을 노래로 표현하기, 작품 속 장면을 연극으로 표현하기 등의 내용을다룬다. 미술 작품 감상에 대한 지식을 강조하기보다 자신의 생각이나 느낌을 자유롭게 나누고표현하는 것에 주안점을 둔다.","n":["장애 정도가 심한 학생이 작품에 대한 생각과 느낌을 구어로 표현하기 어려운경우 보완대체의사소통 기기, 신체나 몸짓 등으로 반응하기, 친구가 소개하는 것을 바라보거나듣기 등으로 성취기준을 재구성하여 적용할 수 있다."],"p":388,"b":3},{"c":"[6미술03-03]","k":"기본","sk":"","s":"미술","g":"초등학교 5~6학년","d":"감상","t":"주변의 미술 작품에 흥미와 관심을 가지고 바른 관람 태도로 감상한다.","m":"이 성취기준은 학교나 미술관 등 주변의 미술 작품에 흥미와 관심을 가지고 바른 관람 태도로 감상하기 위해 설정하였다. 친구의 작품을 바른 태도로 감상하기, 자신과 친구의 작품 소중히 여기기, 규칙을 지켜 미술 작품을 감상하기 등의 내용을 다룬다. 미술 작품을 감상하면서 미술 관람에 필요한 규칙을 알고 바른 관람 태도를 지니는 것에 주안점을둔다.","n":[],"p":388,"b":3},{"c":"[9미술01-01]","k":"기본","sk":"","s":"미술","g":"중학교 1~3학년","d":"체험","t":"다양한 감각과 매체를 활용하여 대상과 현상을 탐색할 수 있다.","m":"이 성취기준은 다양한 감각과 매체를 활용하여 대상과 현상의 감각적 특징을 민감하게 탐색하게 하기 위해 설정하였다. 매체 속 대상의 특징 찾기, 증강현실(AR) 속 다양한 대상 탐색하기, 시시각각 변화하는 풍경을 사진으로 찍기 등 다양한 방법으로 대상과 현상을 탐색하는 내용을 다룬다. 초등학교에서 경험한 감각적 체험과 더불어 사진, 영상, 증강현실(AR), 가상현실(VR) 기기 등 디지털 매체를 포함한 다양한 매체를 활용하여 학습자가감각의 확장을 경험하는 것에 주안점을 둔다.","n":[],"p":390,"b":3},{"c":"[9미술01-02]","k":"기본","sk":"","s":"미술","g":"중학교 1~3학년","d":"체험","t":"대상과 현상을 관찰하고 시각적 특징을 찾는다.","m":"이 성취기준은 자신과 대상, 시시각각 변화하는 현상 등을 주의 깊게 관찰하고시각적 특징을 예민하게 발견하게 하기 위해 설정하였다. 자신을 닮은 대상 찾기, 시간에 따라변하는 풍경 보기, 위치 바꾸며 대상 바라보기 등과 같이 시간과 공간의 변화에 따라 달라지는 대상이나 현상의 시각적 특징을 발견하는 내용을 다룬다. 탐색의 범위를 자신으로부터 대상, 현상으로 확장해가며 새로운 시각적 특징을 찾는 것에 주안점을 둔다.","n":[],"p":390,"b":3},{"c":"[9미술01-03]","k":"기본","sk":"","s":"미술","g":"중학교 1~3학년","d":"체험","t":"생활 속 이미지의 의미를 알고 이미지를 활용하여 자신의 생각과 느낌에 대해 타인과 소통한다.","m":"이 성취기준은 생활 속에서 활용되고 있는 이미지의 의미를 이해하고, 이를 활용하여 자신의 생각과 느낌을 표현하기 위해 설정하였다. 디지털 매체를 통해 적절한 그림말(이모티콘)을 선택하여 친구와 소통하기, 픽토그램을 보고 운동 종목 찾기, 안내판을 보고 적절하게 행동하기 등의 내용을 다룬다. 학생이 이미지에 담긴 정보와 의미를 이해하고 생활 속 이미지를 활용해 자신의 생각과 느낌에 대해 타인과 소통하는 것에 주안점을 둔다.","n":["장애 정도가 심한 학생의 경우 사물과 같은 모양의 그림 찾기, 같은 모양의 그림 문자(픽토그램) 찾기, 자신이 원하는 물건이 있는 그림 카드 고르기 등으로 성취기준을 재구성하여 적용할 수 있다."],"p":390,"b":3},{"c":"[9미술01-04]","k":"기본","sk":"","s":"미술","g":"중학교 1~3학년","d":"체험","t":"미술과 연계된 다양한 분야를 살펴보고 다양성을 수용하는 태도를 지닌다.","m":"이 성취기준은 미술과 연계된 다양한 분야를 살펴보면서 사회 현상에 폭넓게 연결된 미술을 경험하고 다양성을 수용하는 태도를 지니도록 하기 위해 설정하였다. 음식을 예쁘게 놓아 보기, 교실에 어울리는 장식품 고르기, 영화나 연극 등을 관람하며 미술 소품 찾아보기 등의 내용을 다룬다. 다양한 분야와 연계된 미술 활동을 체험하는 과정에서 미술이 우리 삶 속의 다양한 분야와 관련 있음을 인식하고 다양성을 이해하고 받아들이는 것에 주안점을 둔다.","n":[],"p":390,"b":3},{"c":"[9미술02-01]","k":"기본","sk":"","s":"미술","g":"중학교 1~3학년","d":"표현","t":"자신이 표현하고 싶은 주제가 잘 드러나는 소재를 찾아 즐겁게 표현한다.","m":"이 성취기준은 자신이 표현하고 싶은 주제가 잘 드러나는 소재를 찾아 즐겁게표현 활동을 하기 위해 설정하였다. 단풍잎을 이용하여 가을풍경 꾸미기, 나를 닮은 동물을 찾아 자화상 그리기, 기분을 나타내는 색을 골라 색칠하기 등의 내용을 다룬다. 주제에 어울리는 소재를 찾을 수 있도록 다양한 소재를 경험하고 즐기는 것에 주안점을 둔다.","n":["장애 정도가 심하여 주제와 소재를 연결하기 어려운 학생은 교사가 주제에 맞는 소재를 제한된 수로 단일하게 제시하여 주제에 맞는 소재를 스스로 선택하는 활동으로 성취기준을 재구성하여 적용할 수 있다."],"p":392,"b":3},{"c":"[9미술02-02]","k":"기본","sk":"","s":"미술","g":"중학교 1~3학년","d":"표현","t":"다양한 표현 재료와 방법의 특징을 살려 자신감 있게 작품을 제작한다.","m":"이 성취기준은 여러 가지 표현 매체를 탐색하고 다양한 표현 재료와 방법의 특징을 살려 자신감 있게 작품을 제작하게 하기 위해 설정하였다. 물감으로 번지는 효과 표현하기, 털실로 질감 표현하기, 입체 재료와 도구로 입체 표현하기, 그리기 애플리케이션을 사용하여 그림말(이모티콘) 만들기, 환경 친화적인 재료를 사용하여 표현하기 등의 내용을 다룬다. 다양한 디지털 매체를 작품 제작에 적극적으로 활용할 수 있도록 하며 여러 가지 표현 재료와 매체를 충분히 경험하고 그 특징을 효과적으로 표현하는 것에 주안점을 둔다.","n":["장애 정도가 심하여 다양한 표현 매체로 표현하는 활동이 어려운 학생은 자신이 선호하는 하나의 매체로 표현하기, 인공지능 애플리케이션 등을 활용하여 낙서를 변환하여 자동 그림 그리기 등으로 성취기준을 재구성하여 적용할 수 있다."],"p":392,"b":3},{"c":"[9미술02-03]","k":"기본","sk":"","s":"미술","g":"중학교 1~3학년","d":"표현","t":"조형 요소의 어울림을 통해 조형 원리에 흥미를 가지고 표현 활동을 한다.","m":"이 성취기준은 점, 선, 면, 색, 명암, 질감, 형태 등의 조형 요소 간의 관계로서 통일, 변화, 강조, 율동, 균형, 대비 등의 조형 원리를 연결하여 흥미를 가지고 미술을 표현하도록 설정하였다. 균형감이 있는 작품을 찾아 모방하기, 색 상환표에서 대비되는 색 찾기, 강조하고 싶은 얼굴 부위를 크게 그려 자화상 그리기 등의 내용을 다룬다. 조형 요소의 어울림을 통해 조형 원리를 자연스럽게 경험하고 이해하는 것에 주안점을 둔다.","n":[],"p":392,"b":3},{"c":"[9미술02-04]","k":"기본","sk":"","s":"미술","g":"중학교 1~3학년","d":"표현","t":"미술을 다양한 분야와 연계하여 표현하고 서로 다른 표현 방법을 수용하는 태도를 지닌다.","m":"이 성취기준은 다양한 분야에서 사용된 미술 작품 표현을 통해 서로 다른 표현방법을 수용하는 능력을 기르게 하고자 설정하였다. 영화 포스터 만들기, 음반 표지 꾸미기, 미래 도시 꾸미기, 뮤직비디오 만들기, 문양 만들기 등의 내용을 다룬다. 이 과정에서 미술이다양한 분야와 연결되어 있음을 알고 융합적 사고를 통해 여러 가지 표현을 수용하는 태도를지니는 것에 주안점을 둔다.","n":[],"p":392,"b":3},{"c":"[9미술03-01]","k":"기본","sk":"","s":"미술","g":"중학교 1~3학년","d":"감상","t":"미술가들의 작품을 감상하고 미술 감상에 흥미와 관심을 가진다.","m":"이 성취기준은 주변에서 접할 수 있는 다양한 미술가들의 작품을 감상하며 미술 감상에 흥미와 관심을 가지게 하기 위해 설정하였다. 학교에서 볼 수 있는 작품의 작가알아보기, 우리 지역의 미술가 작품 감상하기, 세계 여러 나라의 미술가 작품 감상하기 등의 내용을 다룬다. 작품 선정은 학습자의 발달 수준을 고려하되, 여러 미술가들의 작품을 풍부하게 접하도록 하여 미술 감상에 흥미와 관심을 가지게 하는 것에 주안점을 둔다.","n":["장애 정도가 심한 학생은 교사가 제시한 미술가의 작품과 같은 그림 찾기, 두 가지 미술가의 작품 중 좋아하는 작품 가리키기 등으로 성취기준을 재구성하여 적용할 수 있다."],"p":393,"b":3},{"c":"[9미술03-02]","k":"기본","sk":"","s":"미술","g":"중학교 1~3학년","d":"감상","t":"공동체의 미술 문화에 관심을 기울이고 지역사회의 미술 문화 활동에 참여할 수 있다.","m":"이 성취기준은 지역사회의 미술관, 축제, 문화 행사 등 학생들이 살아가는 지역사회의 미술 문화에 관심을 기울이고 미술 문화 활동에 참여하는 태도를 지니도록 하기 위해 설정하였다. 우리 지역의 미술관 관람하기, 지역사회 축제의 미술 작품 찾아보기, 지역사회의 미술 문화 행사 참여하기 등의 내용을 다룬다. 지역사회 미술 문화 활동에 관심을 기울이고 공동체 문화에 참여하는 것에 주안점을 둔다.","n":[],"p":393,"b":3},{"c":"[9미술03-03]","k":"기본","sk":"","s":"미술","g":"중학교 1~3학년","d":"감상","t":"여러 가지 방법으로 미술 작품을 비교하고 미술의 다양성을 수용하는 태도를 지닌다.","m":"이 성취기준은 여러 가지 방법으로 작품을 감상하고 비교하며 미술의 다양성을수용하는 태도를 지니도록 하기 위해 설정하였다. 단독으로 작품 감상하기, 두 개 이상의 작품을 비교하기, 작품을 보고 자신의 생각과 느낌 표현하기, 다양한 시대의 작품 비교하기, 여러 나라의 작품 비교하기 등 여러 가지 방법으로 감상하는 재미를 느끼고 다양성을 수용하는 것에 주안점을 둔다.","n":[],"p":393,"b":3},{"c":"[12미술01-01]","k":"기본","sk":"","s":"미술","g":"고등학교 1~3학년","d":"체험","t":"감각을 활용한 미적 인식을 통해 아름다움을 발견한다.","m":"이 성취기준은 주변의 시각 문화 환경을 감각을 활용하여 탐색하며 미적 인식을 통해 아름다움을 발견하기 위해 설정하였다. 계절의 변화에 따른 자연의 아름다움 발견하기, 교실 속 사물의 색이나 형태의 조화로움 발견하기, 친구의 옷차림에서 어울리는 색 발견하기, 학교 조형물에서 아름다운 요소 찾아보기 등의 내용을 다룬다. 학생들이 다양한 감각을 활용하여 주도적으로 환경을 탐색하는 활동을 통해 감각을 섬세하게 일깨우고 주변 시각 문화 환경을 새롭게 바라보는 미적 인식을 가지는 것에 주안점을 둔다.","n":[],"p":395,"b":3},{"c":"[12미술01-02]","k":"기본","sk":"","s":"미술","g":"고등학교 1~3학년","d":"체험","t":"생활 속 시각 문화를 체험하고 이미지를 활용한다.","m":"이 성취기준은 생활 주변 시각 문화 속에서 다양한 시각 언어와 상징으로 환경과 소통하며 이미지를 활용하는 능력을 기르기 위해 설정하였다. 학생들이 쉽게 접하는 손수 제작물(UCC), 뮤직비디오, 광고 등의 시각 문화 환경을 체험하고 디지털 기기 배경 화면의 아이콘, 메타버스의 아바타, 사회 관계망 서비스(SNS)의 그림말(이모티콘) 등의 이미지를 활용하는 내용을 다룬다. 다양한 디지털 기기의 이미지를 직접 사용하고 활용하면서 시각적 문해력을 기르고, 이를 활용하여 소통하는 능력을 기르는 것에 주안점을 둔다.","n":[],"p":395,"b":3},{"c":"[12미술01-03]","k":"기본","sk":"","s":"미술","g":"고등학교 1~3학년","d":"체험","t":"지역과 시대에 따른 미술 속 아름다움의 요소를 찾고 다양한 생각과 느낌을 존중한다.","m":"이 성취기준은 지역과 시대에 따른 여러 가지 미술 작품에서 아름다움을 찾고 다양한 생각과 느낌을 존중하기 위해 설정하였다. 지역과 시대에 따라 변하는 의복, 공예품, 건축물, 조형물 등에서 조형미 찾아보기, 다양한 나라의 미술 작품 살펴보기 등의 내용을 다룬다. 이 과정에서 미술이 시대와 공간을 넘어서 모든 사람들이 향유하고 즐길 수 있는 문화유산임을 알고 다양한 생각과 느낌을 존중하는 것에 주안점을 둔다.","n":[],"p":395,"b":3},{"c":"[12미술01-04]","k":"기본","sk":"","s":"미술","g":"고등학교 1~3학년","d":"체험","t":"미술과 관련된 다양한 직업을 탐색하고 친구와 협력하는 태도를 지닌다.","m":"이 성취기준은 미술과 관련된 직업을 탐색하고 체험함으로써 다양한 직업에 관심을 기울이고 친구와 함께 협력하는 태도를 기르기 위해 설정하였다. 주변의 시각 문화 환경에는 화가, 삽화가, 웹툰 작가, 사진 작가, 유튜브 제작자, 디자이너, 전문 안내원(도슨트),전시 기획자 등 많은 직업이 관련되어 있음을 알고 협업하여 미술 관련 직업 역할극 하기, 친구와 함께 손수 제작물(UCC) 제작하기 등의 내용을 다룬다. 진로와 직업과 연계하여 다양한 직업 세계를 탐색하도록 하며, 친구와 협력하는 태도를 지니는 것에 주안점을 둔다.","n":["장애 정도가 심한 학생의 교육적 요구에 따라 디지털 기기에서 다양한 아이콘 눌러 보기, 애플리케이션의 이미지 눌러 보기, 다양한 직업 캐릭터 색칠하기 등으로 성취기준을 재구성하여 적용할 수 있다."],"p":395,"b":3},{"c":"[12미술02-01]","k":"기본","sk":"","s":"미술","g":"고등학교 1~3학년","d":"표현","t":"다양한 발상을 통해 소재와 주제를 정하고 창의적인 미술 표현에 도전한다.","m":"이 성취기준은 친숙한 대상에 대해 다양한 방식의 발상을 사용하여 창의적인 작품을 만드는 경험을 하도록 설정하였다. 대상과 현상을 자세히 관찰하기, 우연의 효과 활용하기, 둘 이상의 이미지를 결합하기, 형태와 쓰임을 변형하기 등 다양한 발상의 방식으로 표현하고 싶은 소재와 주제를 이끌어 내어 창의적인 미술 표현에 도전해 보는 내용을 다룬다. 주변의 익숙한 대상이 다양한 방식의 발상을 통해 새로운 작품이 될 수 있음을 알고 다양한 발상법을 경험하는 것에 주안점을 둔다.","n":[],"p":397,"b":3},{"c":"[12미술02-02]","k":"기본","sk":"","s":"미술","g":"고등학교 1~3학년","d":"표현","t":"연상 혹은 상상을 통해 떠오른 주제를 표현하고 자신과 타인의 작품을 존중한다.","m":"이 성취기준은 다양한 소재를 활용하여 연상하거나 상상하기 등을 통해 떠오른 주제를 표현하는 능력과 자신과 타인의 작품을 존중하는 태도를 기르기 위해 설정하였다.사물을 보고 연상되는 그림 그리기, 미래의 내 모습 그리기, 미래의 물건 만들기, 과학 상상화그리기 등의 내용을 다룬다. 학생들이 주제나 내용을 다양하게 연상하거나 상상하여 자유롭게표현하는 것에 주안점을 둔다.","n":[],"p":397,"b":3},{"c":"[12미술02-03]","k":"기본","sk":"","s":"미술","g":"고등학교 1~3학년","d":"표현","t":"다양한 조형 요소와 원리를 활용하여 효과적으로 작품을 제작하고 즐기는 태도를 지닌다.","m":"이 성취기준은 조형 요소와 조형 원리를 활용하여 효과적으로 작품을 제작하고 즐기는 태도를 지니도록 하기 위해 설정하였다. 대비되는 색을 사용하여 경고판 만들기,움직이는 로봇이나 모빌 만들기 등의 내용을 다룬다. 자신의 생각과 느낌을 표현하기 위해 조형 원리를 효과적으로 사용하는 것에 주안점을 둔다.","n":["자신의 생각과 느낌을 조형 요소와 원리로 표현하기 힘든 학생에게는 우연의효과를 이용한 표현하기, 도형을 따라 그리거나 색칠하기로 등으로 성취기준을 재구성하여 적용할 수 있다."],"p":397,"b":3},{"c":"[12미술02-04]","k":"기본","sk":"","s":"미술","g":"고등학교 1~3학년","d":"표현","t":"새로운 표현 재료와 방법, 매체 등을 활용하고 창의적인 표현에 대한 흥미를 갖는다.","m":"이 성취기준은 새로운 표현 재료와 방법, 매체들을 활용하여 시각적 이미지로나타내고 창의적인 표현에 흥미를 갖기 위해 설정하였다. 일상 속 새로운 미술 재료 찾아보기, 인공지능 애플리케이션 이용하기, 디지털 매체로 이미지 만들기 등의 내용을 다룬다. 최신의 미술 재료와 방법, 매체 등을 찾고 창의적인 표현에 흥미를 갖는 것에 주안점을 둔다.","n":[],"p":397,"b":3},{"c":"[12미술02-05]","k":"기본","sk":"","s":"미술","g":"고등학교 1~3학년","d":"표현","t":"미술과 관련된 직업을 알아보고 그와 관련된 미술 표현 활동을 한다.","m":"이 성취기준은 미술과 관련된 다양한 직업을 찾아보고 그와 관련된 다양한 미술 표현 활동을 하기 위해 설정하였다. 사진가가 되어 사진 찍기, 웹툰 작가가 되어 4컷 만화 그리기, 도예가가 되어 생활 용품 만들기 등 미술 관련 직업에서 하는 미술 표현 활동을경험하는 내용을 다룬다. 미술과 관련된 다양한 직업을 알고 표현 활동을 경험하는 것에 주안점을 둔다.","n":[],"p":397,"b":3},{"c":"[12미술03-01]","k":"기본","sk":"","s":"미술","g":"고등학교 1~3학년","d":"감상","t":"여러 지역과 시대적 배경의 미술 작품을 살펴보고 다양성을 존중하는 태도를 지닌다.","m":"이 성취기준은 우리나라의 전통 미술과 현대 미술을 포함한 다양한 지역, 시대, 문화의 미술 작품 등을 비교 감상하면서 문화적 다양성을 존중하는 태도를 지니도록 하기 위해 설정하였다. 우리나라의 전통 미술과 현대 미술 알아보기, 여러 나라 미술 작품 특징 찾기, 작품이 만들어진 시대적 배경 알기 등의 활동을 다룬다. 작품의 특징이나 양식의 차이가 확연히 드러나는 다양한 작품을 제시하여 학생들이 미술 작품에 대한 고정 관념에서 벗어나 다양성을 인식하고 존중하는 태도를 지니는 것에 주안점을 둔다.","n":[],"p":398,"b":3},{"c":"[12미술03-02]","k":"기본","sk":"","s":"미술","g":"고등학교 1~3학년","d":"감상","t":"미술 작품의 특징을 분석하고 미술 감상에 흥미와 관심을 가진다.","m":"이 성취기준은 미술 작품의 내용(소재, 주제 등)과 형식(재료와 용구, 표현 방법, 조형 요소와 원리 등)을 분석하여 작품의 특징을 찾고 미술 감상에 흥미와 관심을 가지기 위해 설정하였다. 색의 배합이나 형태의 특징을 살펴보기, 내용과 형식에 따른 특징 분석하기 등의 내용을 다룬다. 작품에 표현된 소재나 주제, 재료와 용구, 표현 방법, 조형 요소와 원리에 따라 미술 작품의 특징이 달라짐을 알고 미술 감상에 흥미를 느끼도록 하는 것에주안점을 둔다.","n":[],"p":398,"b":3},{"c":"[12미술03-03]","k":"기본","sk":"","s":"미술","g":"고등학교 1~3학년","d":"감상","t":"환경 친화적인 미술 작품을 감상하고 환경을 소중히 여기는 태도를 지닌다.","m":"이 성취기준은 환경 친화적인 미술 작품을 감상하며 환경의 중요성을 알고 소중히 여기는 태도를 지니도록 하기 위해 설정하였다. 자연 속에서 미술적 요소를 감상하기, 생태 미술 작품 감상하기, 재활용품을 이용한 작품 전시하기, 표현과 연계하여 생태환경 그림책이나 만화 그리기 등의 내용을 다룬다. 과학과나 사회과의 환경과 생태계, 기후변화와 환경 위기, 친환경적 소비하기 등과 연계된 생태환경 교육을 할 수 있으며, 환경 친화적인 미술 작품을 감상하고 환경의 소중함과 심미적 가치를 경험하는 것에 주안점을 둔다.","n":[],"p":398,"b":3},{"c":"[9정통01-01]","k":"기본","sk":"","s":"정보통신활용","g":"중학교 1~3학년","d":"정보통신 이해와 기기의 사용","t":"정보통신의 의미를 이해하고, 다양한 형태와 방법으로 제공되는 정보를 살펴본다.","m":"이 성취기준은 정보통신의 의미와 중요성을 이해하고, 변화하는 정보통신 사회에 관심을 기울일 수 있도록 설정하였다. 정보통신의 의미 알기, 다양한 정보 형태 살펴보기, 정보 제공 방법 알기, 정보 전달하기 등의 내용을 다룬다. 일상생활에서 문자, 그림, 소리 등의 정보가 활용되는 예를 찾아보고, 형태에 따라 제공되는 정보 전달 방법에 관심을 갖도록 한다.","n":[],"p":413,"b":3},{"c":"[9정통01-02]","k":"기본","sk":"","s":"정보통신활용","g":"중학교 1~3학년","d":"정보통신 이해와 기기의 사용","t":"다양한 정보통신 기기의 종류를 알고, 기본 기능을 익힌다.","m":"이 성취기준은 일상생활에서 편리하게 사용하는 정보통신 기기를 살펴보고, 기본 기능을 익혀 사용할 수 있는 능력을 기르기 위해 설정하였다. 정보통신 기기의 종류 알기, 기기 선택하기, 기본 기능 익히기 등의 내용을 다룬다. 전화기, 텔레비전, 스마트 기기 등 필요와 목적에 알맞은 기기를 선택하고, 조작 버튼을 찾아 누르며, 사용 기능을 익히도록 한다.","n":["생활 주변에서 다양한 스마트 기기를 체험하고, 스마트 기기 및 주변 장치를 바르게 사용할 수 있도록 한다. 스마트 기기 사용 시간 정하기, 휴식을 취해야 하는 시간과 이유 알기, 스마트 기기 사용 장소와 이용량에 대한 결정 등 건전한 사용을 통해 디지털 민주시민으로서의 역량을 갖추도록 한다."],"p":413,"b":3},{"c":"[9정통01-03]","k":"기본","sk":"","s":"정보통신활용","g":"중학교 1~3학년","d":"정보통신 이해와 기기의 사용","t":"정보통신 기기의 기본 프로그램을 익혀 실생활에서 사용한다.","m":"이 성취기준은 정보통신 기기에 설치되어 있는 기본 프로그램의 사용법을 익혀 실생활에서 유용하게 사용하는 능력을 기르는 데 목적이 있다. 정보통신 기기의 기본 프로그램 살펴보기, 기본 프로그램 사용 방법 익히기, 기본 프로그램 사용하기 등의 내용을 다룬다. 정보통신 기기의 아이콘 익히기, 순서대로 실행하여 전화하기 또는 문자 전송하기, 인터넷 접속하기 등을 직접 체험할 수 있도록 한다.","n":[],"p":413,"b":3},{"c":"[9정통01-04]","k":"기본","sk":"","s":"정보통신활용","g":"중학교 1~3학년","d":"정보통신 이해와 기기의 사용","t":"필요한 정보를 수집하고, 타인과 정보를 주고받는다.","m":"이 성취기준은 필요한 자료를 능동적으로 파악하여 수집하고, 정보통신 매체를 활용하여 실생활에서 다른 사람과 정보를 주고받는 능력을 기르기 위하여 설정하였다. 필요한 정보 수집하기, 정보통신 매체를 이용하여 정보 전달하기 등의 내용을 다룬다. 정보를 음성과 몸짓, 편지 등으로 직접 전달하거나 문자나 동영상으로 전송하기 등 적절한 전달 방법을 찾아 타인과 정보를 주고받도록 한다.","n":["장애 정도가 심한 학생의 경우 표정, 몸짓, 음성 등 다양한 형태로 제공되는 정보 탐색하기, 시청각 매체나 보조공학 기기를 활용하여 정보 수집하기, 보완대체의사소통 기기를 활용하여 정보 주고받기 등으로 성취기준을 재구성하여 적용할 수 있다."],"p":413,"b":3},{"c":"[9정통02-01]","k":"기본","sk":"","s":"정보통신활용","g":"중학교 1~3학년","d":"정보통신 생활과 소프트웨어","t":"컴퓨터의 구성을 이해하고, 컴퓨터의 장치와 기본 기능을 익혀 실생활에서 사용한다.","m":"이 성취기준은 컴퓨터의 구성을 이해하고, 구성 장치와 주변 기기를 살펴보며, 컴퓨터의 기본 기능과 사용법을 익혀 컴퓨터를 효율적으로 사용하는 능력을 기르기 위해 설정하였다. 컴퓨터의 하드웨어와 소프트웨어 이해하기, 컴퓨터의 종류 알기, 컴퓨터 구성 장치 및 주변 기기 조작하기, 컴퓨터의 기본 기능 사용하기 등의 내용을 다룬다. 키보드와 마우스 등의 구성 장치와 프린터 등의 주변 기기를 직접 조작하고, 계산기, 그림판, 메모장 등의 컴퓨터 기본 기능을 사용함으로써 컴퓨터의 유용성과 편리성을 경험하도록 한다.","n":["장애 정도가 심한 학생의 경우 생활 주변에 있는 컴퓨터의 구성 장치 및 주변 기기 찾기, 컴퓨터 구성 장치의 조작 버튼 입력을 통한 변화 살펴보기, 컴퓨터의 기본 사용법을 순서대로 따라 하기 등의 활동을 통해 성취기준을 재구성하여 적용할 수 있다."],"p":415,"b":3},{"c":"[9정통02-02]","k":"기본","sk":"","s":"정보통신활용","g":"중학교 1~3학년","d":"정보통신 생활과 소프트웨어","t":"인터넷 검색을 통해 목적에 따라 필요한 정보를 찾는다.","m":"이 성취기준은 일상생활에서 필요한 정보를 인터넷을 통해 효과적으로 찾는 능력을 기르기 위해 설정하였다. 여러 가지 검색엔진 알기, 정보 검색을 위한 핵심어 선정하기 핵심어로 정보 검색하기 등의 내용을 다룬다. 이 외에도 이미지와 소리 등을 활용하여 상황에 적합한 검색 방법을 선택하여 적용함으로써, 디지털 환경에서 적절한 정보를 찾을 수 있는 디지털 문해력을 기르도록 한다.","n":[],"p":415,"b":3},{"c":"[9정통02-03]","k":"기본","sk":"","s":"정보통신활용","g":"중학교 1~3학년","d":"정보통신 생활과 소프트웨어","t":"순차, 선택, 반복 구조를 통해 문제 해결 과정을 탐색한다.","m":"이 성취기준은 컴퓨팅 사고의 기초인 순차, 선택, 반복 구조의 개념을 이해하고, 효과적으로 문제를 해결하기 위한 절차를 탐색하기 위해 설정하였다. 순서와 차례에 맞게 나열하기, 선택 상황 제시하기, 특정 과제 또는 상황 반복하기 등의 내용을 다룬다. 언플러그드 활동을 통해 순차, 선택, 반복 구조를 이해함으로써 문제 해결 절차를 탐색하도록 한다.","n":[],"p":415,"b":3},{"c":"[9정통02-04]","k":"기본","sk":"","s":"정보통신활용","g":"중학교 1~3학년","d":"정보통신 생활과 소프트웨어","t":"인공지능에 대해 관심을 기울이고, 생활 속 인공지능의 다양한 사례를 탐색한다.","m":"이 성취기준은 생활 속에서 인공지능이 적용된 사례를 찾아 삶의 편리함을 살펴보기 위해 설정하였다. 인공지능 알아보기, 활용 사례 살펴보기, 생활 속 인공지능 기기 찾기 등의 내용을 다룬다. 인공지능 스피커, 스마트 워치 등 다양한 인공지능 기기를 탐색함으로써 인공지능에 대한 관심을 높이도록 한다.","n":["일상생활에서 삶의 편리를 위해 인공지능을 이용한 다양한 사례를 탐색하도록한다. 상황에 따른 인공지능 활용 사례 찾기, 인공지능이 인간에게 주는 편리함 찾아보기 등 미래 사회의 구성원으로서 갖추어야 할 인공지능 이해에 대한 기초 역량을 기르도록 한다."],"p":415,"b":3},{"c":"[9정통03-01]","k":"기본","sk":"","s":"정보통신활용","g":"중학교 1~3학년","d":"정보통신 윤리와 디지털 문화","t":"디지털 공간에서 올바른 예절을 익혀 실천한다.","m":"이 성취기준은 디지털 예절의 필요성을 알고, 디지털 공간에서 올바른 태도와 예절을 실천하는 능력을 기르기 위해 설정하였다. 디지털 공간의 특징 알기, 디지털 예절 알기, 디지털 예절 실천하기 등의 내용을 다룬다. 디지털 공간에서 예절을 지키며 댓글 달기, 예의를 지키며 채팅에 참여하기 등의 실천을 통해 타인과 안전하고 즐겁게 상호 작용 하도록 한다.","n":[],"p":416,"b":3},{"c":"[9정통03-02]","k":"기본","sk":"","s":"정보통신활용","g":"중학교 1~3학년","d":"정보통신 윤리와 디지털 문화","t":"개인 정보 보호의 중요성을 알고, 안전하게 관리하는 습관을 기른다.","m":"이 성취기준은 정보 사회에서 개인 정보의 의미를 알고, 개인 정보 보호의 중요성을 인식하며, 개인 정보를 보호하고 관리하는 능력을 기르기 위해 설정하였다. 개인 정보의 종류 알기, 개인 정보 침해 사례 알기, 개인 정보 관리하기 등의 내용을 다룬다. 비밀번호 설정하기 및 주기적으로 변경하기, 타인에게 개인 정보 제공하지 않기, 생체 인식 정보 활용하기 등의 방법을 통해 개인 정보 보호를 실천하도록 한다.","n":["이름, 나이, 성별 등의 일반 정보, 위치 정보, 신체 정보 등이 개인 정보에 해당됨을 이해하도록 한다. 개인 정보 침해 사례에 따른 대처 방안을 살펴봄으로써 개인 정보의 가치와 개인 정보 보호의 필요성을 인식하도록 한다. 또한 실생활에서 개인 정보 보호를 실천하여 민감한 개인 정보를 안전하게 관리하고, 디지털 사회의 민주시민으로 성장하도록 한다."],"p":416,"b":3},{"c":"[9정통03-03]","k":"기본","sk":"","s":"정보통신활용","g":"중학교 1~3학년","d":"정보통신 윤리와 디지털 문화","t":"가정생활에서 디지털 기술이 적용된 사례를 살펴보고 경험한다.","m":"이 성취기준은 디지털 기술이 주도하는 디지털 문화를 이해하고, 가정에서의 디지털 생활을 경험하기 위해 설정하였다. 가정에서의 디지털 문화 이해하기, 가정에서 사물 인터넷이 적용된 사례 살펴보기, 가정에서 디지털 문화 경험하기 등의 내용을 다룬다. 스마트 기기를 활용한 개인 일정 관리 및 건강 관리, 스마트 가전제품 사용 등 디지털 기술을 가정생활에 적용함으로써 편리함을 경험하고, 삶의 질을 높이도록 한다.","n":["가정에서 디지털 기술이 적용된 스마트 가전제품과 사물 인터넷을 활용하여 전기 에너지 관리, 효율적인 의식주 관리 등 에너지 사용을 최적화하고 자원 사용을 개선하여 생태 친화적인 삶을 살도록 한다."],"p":416,"b":3},{"c":"[9정통03-04]","k":"기본","sk":"","s":"정보통신활용","g":"중학교 1~3학년","d":"정보통신 윤리와 디지털 문화","t":"디지털 환경에서 여가활동을 체험하고, 즐겁게 참여한다.","m":"이 성취기준은 디지털 환경에서 개인의 관심과 흥미에 따라 여가활동을 선택하고 주도적으로 참여하기 위해 설정하였다. 디지털 환경의 다양한 여가활동 탐색하기, 정보통신 기기를 활용하여 여가활동 참여하기, 온라인 여가활동 체험하기 등의 내용을 다룬다. 개인의 선호와 흥미에 따라 온라인 동영상 시청, 가상현실(VR) 게임, 온라인 전시 관람, e-스포츠, 디지털 독서 등의 다양한 여가활동을 체험하고 삶의 즐거움을 느낄 수 있도록 한다.","n":[],"p":416,"b":3},{"c":"[12정통01-01]","k":"기본","sk":"","s":"정보통신활용","g":"고등학교 1~3학년","d":"정보통신 이해와 기기의 사용","t":"정보통신의 발전 과정에 따른 특징을 살펴보고, 미래의 변화에 관심을 기울인다.","m":"이 성취기준은 가정, 학교, 지역사회에서 사용하는 정보통신의 발전 과정을 살펴보고, 미래의 정보통신 변화에 관심을 기울이며, 능동적으로 대처하기 위해 설정하였다. 정보통신 발전 과정 살펴보기, 발전 과정에 따른 정보통신 기기의 특징 살펴보기, 미래 사회의 정보통신 탐색하기 등의 내용을 다룬다. 소리와 몸짓, 문자, 전화, 컴퓨터 통신 기술에서부터 사물 인터넷, 인공지능 등 정보통신 발전이 가져온 삶의 변화에 관심을 갖도록 한다.","n":[],"p":418,"b":3},{"c":"[12정통01-02]","k":"기본","sk":"","s":"정보통신활용","g":"고등학교 1~3학년","d":"정보통신 이해와 기기의 사용","t":"정보통신 기기의 사용법을 익히고, 올바른 관리 방법을 실천한다.","m":"이 성취기준은 실생활에서 정보통신 기기의 올바른 사용 방법과 관리 방법을 익혀 편리한 생활을 영위하는 데 목적이 있다. 자신에게 필요한 정보통신 기기의 입·출력 사용법 익히기, 생활 속에서 정보통신 기기 사용하기, 정보통신 기기 올바르게 관리하기 등의 내용을 다룬다. 일상생활에서 정보통신 기기의 사용 방법을 익혀 사용함으로써 정보통신 기기의 편리한 기능에 익숙해지도록 한다.","n":["장애 정도가 심한 학생의 경우 정보통신 기기를 바르게 켜고 끄기, 사용 후 충전하기, 기기의 안전한 사용을 통해 고장 예방하기, 덮개·거치대·보관함 사용하기 등으로 성취기준을 재구성하여 적용할 수 있다."],"p":418,"b":3},{"c":"[12정통01-03]","k":"기본","sk":"","s":"정보통신활용","g":"고등학교 1~3학년","d":"정보통신 이해와 기기의 사용","t":"정보통신 기기의 응용 프로그램을 선택하여 상황에 맞게 활용한다.","m":"이 성취기준은 자신에게 필요한 각종 응용 프로그램을 정보통신 기기에 설치하고, 상황에 맞게 활용할 수 있도록 하기 위해 설정하였다. 정보통신 기기의 응용 프로그램 탐색하기, 필요한 응용 프로그램 찾기, 응용 프로그램 설치·사용·관리하기 등의 내용을 다룬다. 학생의 관심도가 높고, 쉽게 조작이 가능한 응용 프로그램을 선택하여 다양한 경험과 정보를 얻도록 하고, 일상생활에서 유용하게 사용할 수 있도록 한다.","n":[],"p":418,"b":3},{"c":"[12정통01-04]","k":"기본","sk":"","s":"정보통신활용","g":"고등학교 1~3학년","d":"정보통신 이해와 기기의 사용","t":"필요한 정보를 생산하여 목적에 맞게 활용하고, 유용한 정보를 공유한다.","m":"이 성취기준은 의미 있는 정보를 생산하고, 정보를 활용해 타인과 의사소통할 수 있는 역량을 기르기 위해 설정하였다. 정보 선별하기, 정보 생산하기, 목적에 맞게 정보 사용하기, 정보 공유하기 등의 내용을 다룬다. 유용한 정보를 생산하고, 사회 관계망 서비스(SNS) 등의 네트워크를 활용하여 목적에 따라 필요한 정보를 공유하는 등 디지털 문해력 향상의 기초를 다지도록 한다.","n":["정보를 선별하고 생산하기, 목적에 맞게 정보를 사용하고 공유하는 과정에서 개인의 참여를 중시하고, 자기 결정 및 표현의 자유, 권리 보호 등 민주시민으로서의 역량을 키우는 데 중점을 둔다."],"p":418,"b":3},{"c":"[12정통02-01]","k":"기본","sk":"","s":"정보통신활용","g":"고등학교 1~3학년","d":"정보통신 생활과 소프트웨어","t":"컴퓨팅 시스템의 이해를 바탕으로, 상황과 목적에 적합한 컴퓨터 프로그램을 사용한다.","m":"이 성취기준은 생활 속에서 컴퓨터를 효율적으로 다루고, 컴퓨터 프로그램 사용 능력을 기르기 위해 설정하였다. 컴퓨팅 시스템 이해하기, 문서 작성 프로그램 사용하기, 동영상 제작 프로그램 사용하기, 파일 관리하기 등의 내용을 다룬다. 한글 문서, 프리젠테이션 등 컴퓨터 프로그램을 사용하여 생각과 정보를 목적과 상황에 맞게 적용할 수 있도록 한다.","n":[],"p":420,"b":3},{"c":"[12정통02-02]","k":"기본","sk":"","s":"정보통신활용","g":"고등학교 1~3학년","d":"정보통신 생활과 소프트웨어","t":"인터넷 정보를 수집하여 타인과 소통하고 협력하며 실생활에 활용한다.","m":"이 성취기준은 일상생활에 필요한 다양한 정보를 인터넷을 활용하여 획득하고, 유용하게 사용하도록 하기 위해 설정하였다. 목적에 맞는 유용한 정보 구분하기, 검색한 정보 활용하기, 온라인 협업 도구 사용하기 등의 내용을 다룬다. 교통 및 날씨 정보 활용하기, 온라인 협업 도구를 활용한 소통하기 등 인터넷을 통해 얻은 다양한 정보를 일상생활에서 유용하게 활용하도록 한다.","n":["디지털 환경에서 제공되는 정보를 목적과 상황에 맞게 수집하고, 무분별한 정보 속에서 올바른 정보를 찾기 위해 비판적으로 분석하도록 한다. 디지털 환경에서 타인과 정보 공유 또는 의사 결정 과정에 참여할 때 책임감을 가지고, 협력의 가치를 이해하는 민주시민 역량을 기르도록 한다."],"p":420,"b":3},{"c":"[12정통02-03]","k":"기본","sk":"","s":"정보통신활용","g":"고등학교 1~3학년","d":"정보통신 생활과 소프트웨어","t":"생활 속 다양한 문제 해결 상황을 인식하고, 문제 해결 절차를 구성한다.","m":"이 성취기준은 일상생활에서 발생하는 다양한 문제 해결 상황을 인식하고, 문제 해결을 위해 절차를 구성할 수 있는 능력을 기르기 위해 설정하였다. 생활 속 프로그래밍 찾기, 생활 속 문제 해결 절차 구성하기, 교육용 코딩 프로그램을 활용한 프로그래밍 체험하기 등의 내용을 다룬다. 교육용 코딩 프로그램의 활용을 통해 창의적 문제 해결력 및 컴퓨팅 사고력을 함양하도록 한다.","n":[],"p":420,"b":3},{"c":"[12정통02-04]","k":"기본","sk":"","s":"정보통신활용","g":"고등학교 1~3학년","d":"정보통신 생활과 소프트웨어","t":"일상생활에서 인공지능 기기를 활용하여 생활의 편리함을 경험한다.","m":"이 성취기준은 주변에서 볼 수 있는 인공지능 기기와 서비스를 체험하며, 이를 효과적으로 활용할 수 있는 능력을 기르기 위해 설정하였다. 인공지능 기기 및 서비스 선택하기, 인공지능 기기 및 서비스 사용법 익히기, 인공지능 윤리 알아보기 등의 내용을 다룬다. 인공지능 기반 생활환경에서 인공지능 기기 및 서비스를 효과적으로 사용할 수 있도록 하고, 인공지능의 가치와 활용에 관심을 기울이도록 한다.","n":["인공지능 윤리의 필요성을 이해하고, 인공지능의 문제점과 인공지능을 사용하는 사람이 지켜야 할 윤리 등을 살펴보는 과정을 통해 생활 속에서 인공지능을 책임감 있게 사용할 수 있는 인공지능 활용 소양을 기르도록 한다."],"p":420,"b":3},{"c":"[12정통03-01]","k":"기본","sk":"","s":"정보통신활용","g":"고등학교 1~3학년","d":"정보통신 윤리와 디지털 문화","t":"디지털 윤리를 이해하고, 디지털 공간에서 타인을 존중하고 배려하는 태도를 기른다.","m":"이 성취기준은 디지털 공간에서 지켜야 할 규범을 알고, 디지털 윤리 의식을 함양하여 타인과 상호 존중 하는 태도를 기르기 위해 설정하였다. 디지털 윤리 알기, 디지털 공간에서 윤리 실천하기, 저작권 보호하기 등의 내용을 다룬다. 디지털 공간에서 디지털 윤리의 중요성을 인식하고, 생활 속에서 디지털 윤리를 실천하도록 한다.","n":["디지털 공간에서 자신의 의견을 표현하고, 타인과 의사소통하는 과정에서 디지털 윤리를 지키며, 디지털 사회의 시민으로 책임감을 가지고 민주적인 의사소통을 실천할 수 있는 디지털 문해력을 기르도록 한다."],"p":421,"b":3},{"c":"[12정통03-02]","k":"기본","sk":"","s":"정보통신활용","g":"고등학교 1~3학년","d":"정보통신 윤리와 디지털 문화","t":"디지털 중독 및 디지털 범죄 사례를 살펴보고, 예방하는 방법을 실천한다.","m":"이 성취기준은 디지털 중독 및 디지털 범죄가 우리 삶에 미치는 영향을 알아보고, 이를 예방하는 방법을 실천하기 위해 설정하였다. 디지털 중독 사례 살펴보기, 디지털 범죄의 종류와 예방법 알기, 디지털 범죄 대처하기 등의 내용을 다룬다. 정보 보안 설정 강화하기, 유해 매체 차단하기 등 일상생활에서 디지털 중독 및 디지털 범죄를 예방하도록 한다.","n":[],"p":421,"b":3},{"c":"[12정통03-03]","k":"기본","sk":"","s":"정보통신활용","g":"고등학교 1~3학년","d":"정보통신 윤리와 디지털 문화","t":"지역사회의 다양한 디지털 문화를 경험하고 실생활에 활용한다.","m":"이 성취기준은 지역사회의 디지털 문화에 대한 이해를 바탕으로 디지털 문화를 경험하고 실생활에 활용함으로써 지역사회에서 편리하게 살아가기 위해 설정하였다. 지역사회에서의 디지털 문화 사례 살펴보기, 디지털 문화 체험하기 등의 내용을 다룬다. 온라인 예매하기, 온라인 행정 서비스 이용하기, 무인 단말기 이용하기 등의 체험 활동을 통해 지역사회의 다양한 기관을 시공간의 제약 없이 효율적으로 활용하도록 한다.","n":["장애 정도가 심한 학생의 경우 지역사회에서 자주 접할 수 있는 정보통신 기기 살펴보기, 무인 단말기 활용을 위한 기초 기능 익히기 등으로 성취기준을 재구성하여 적용할 수 있다."],"p":421,"b":3},{"c":"[12정통03-04]","k":"기본","sk":"","s":"정보통신활용","g":"고등학교 1~3학년","d":"정보통신 윤리와 디지털 문화","t":"디지털 사회에서의 다양한 직업을 탐색하고 체험한다.","m":"이 성취기준은 정보통신 기술 발전에 따른 디지털 사회의 다양한 직업을 탐색하고, 디지털 사회의 직업을 체험하는 데 목적이 있다. 디지털 사회에서의 직업의 가치 알기, 직업의 변화 알기, 직업 모의 체험하기 등의 내용을 다룬다. 디지털 사회에서 새롭게 등장하는 다양한 직업 중 자신에게 적합한 직업을 탐색하고 체험해 봄으로써, 미래 사회의 직업에 대한 관심과 이해를 높이도록 한다.","n":["디지털 전환으로 변화된 직업의 의미와 중요성을 이해하고, 새롭게 생겨나거나 사라지는 직업의 종류를 살펴보는 과정을 통해 예비 직업인으로서 디지털 사회 적응에 필요한 기초 소양을 기르도록 한다."],"p":421,"b":3},{"c":"[09생영01-01]","k":"기본","sk":"","s":"생활영어","g":"중학교 1~3학년","d":"듣기･말하기","t":"주변의 소리를 듣고 영어를 식별한다.","m":"학생이 다양한 소리 중에서 영어를 식별함으로써 영어에 대한 관심을 기르기 위해 설정하였다. 주변에서 사용하는 말소리 중 영어와 한국어를 식별하고 자기 주변, 가정, 학교에서 활용하는 알파벳, 낱말, 표현을 반복적으로 듣고 비교함으로써 영어를 식별할 수 있도록 한다.","n":[],"p":433,"b":3},{"c":"[09생영01-02]","k":"기본","sk":"","s":"생활영어","g":"중학교 1~3학년","d":"듣기･말하기","t":"소리를 듣고 알파벳을 식별한다.","m":"알파벳의 이름을 듣고 해당 알파벳을 가리키거나 말하며 식별할 수 있는 능력을 신장시키기 위해 설정하였다. 생활 주변에서 표지판, 위치 안내판, 메뉴판 등에 제시된 알파벳의 이름을 듣고 알파벳이 나타내는 의미를 이해함으로써 실생활과 연계하여 알파벳의 이름을 식별할 수 있도록 한다.","n":[],"p":433,"b":3},{"c":"[09생영01-03]","k":"기본","sk":"","s":"생활영어","g":"중학교 1~3학년","d":"듣기･말하기","t":"알파벳과 낱말의 소리를 듣고 말한다.","m":"각 알파벳의 음가를 듣고 알파벳의 소리에 익숙해지며 알파벳으로 구성된 낱말을 듣고 따라 말하는 능력을 향상시키기 위해 설정하였다. Push, Pull, Open, Close 등과 같이 주변에서 빈번하게 접하는 낱말을 보고 들으며 따라 말하는 과정을 통해 낱말에 익숙해질 수 있도록 한다.","n":[],"p":433,"b":3},{"c":"[09생영01-04]","k":"기본","sk":"","s":"생활영어","g":"중학교 1~3학년","d":"듣기･말하기","t":"개인, 가정, 학교생활에서 사용하는 낱말과 표현을 듣고, 그 의미를 파악한다.","m":"영어의 활용 빈도가 높아짐에 따라 학생이 자신 주변, 가정, 학교에서 사용할 수 있는 낱말과 표현의 의미를 이해하고 활용할 수 있도록 설정하였다. 주변에서 보거나 들을 수 있는 영어 낱말과 표현을 다양한 방법으로 학습하고 활용함으로써 그 의미를 이해할 수 있도록 한다.","n":[],"p":433,"b":3},{"c":"[09생영01-05]","k":"기본","sk":"","s":"생활영어","g":"중학교 1~3학년","d":"듣기･말하기","t":"개인, 가정, 학교생활에서 사용하는 낱말과 표현을 말한다.","m":"개인, 가정, 학교생활에서 사용하는 낱말과 표현의 의미를 이해하고 상황과 맥락에 알맞은 낱말과 표현을 듣고 말할 수 있는 능력을 신장시키기 위해 설정하였다. 사물의 이름과 묻고 답하기, 요청하고 수락하기 등과 같은 표현의 의미를 알고 말하며 적용할 수 있도록 한다.","n":[],"p":433,"b":3},{"c":"[09생영01-06]","k":"기본","sk":"","s":"생활영어","g":"중학교 1~3학년","d":"듣기･말하기","t":"주변에서 사용하는 외래어에 관심을 가지고 듣고 말한다.","m":"주변에서 볼 수 있는 다양한 외래어에 학생이 관심을 가질 수 있도록 설정하였다. 버스, 택시 등 교통수단, 바나나, 토마토 등 과일, 스파게티, 피자 등 음식을 나타내는 외래어의 어원 및 유래를 알고 관심을 가질 수 있도록 한다.","n":[],"p":433,"b":3},{"c":"[09생영01-07]","k":"기본","sk":"","s":"생활영어","g":"중학교 1~3학년","d":"듣기･말하기","t":"다양한 매체를 활용하여 낱말 및 표현을 이해하고 전달한다.","m":"4차 혁명으로 인한 온라인 및 스마트 기기 활용 교육 활성화에 따라 학생이 매체를 활용하여 영어에 대한 접근성을 높이고 상대방에게 전달하고자 하는 표현을 직접 전달하는 능력을 기르기 위해 설정하였다. 일상생활에서 다양한 매체를 활용하여 영어 낱말과 표현의 의미를 직접 확인하고 소통하는 능력을 기를 수 있도록 한다.","n":[],"p":433,"b":3},{"c":"[09생영02-01]","k":"기본","sk":"","s":"생활영어","g":"중학교 1~3학년","d":"읽기","t":"주변에서 사용하는 알파벳을 보고 영어 읽기에 관심을 갖는다.","m":"학생이 알파벳으로 구성된 영어 표기를 통해 기초적인 영어 읽기에 관심을 가지고 영어 학습의 필요성을 인식할 수 있도록 하기 위해 설정하였다. 생활 속에 혼재되어 있는 다양한 언어, 문자, 기호 중 영어로 된 표기가 있음을 확인하고, 알파벳의 모양이 한글 자모와 다름을 인식하여 관심을 가지고 영어를 읽도록 한다.","n":[],"p":435,"b":3},{"c":"[09생영02-02]","k":"기본","sk":"","s":"생활영어","g":"중학교 1~3학년","d":"읽기","t":"알파벳 대문자·소문자를 구별하여 읽고 활용한다.","m":"영어의 가장 기초가 되는 알파벳 대·소문자의 구성을 알고 그 형태를 구별하여 읽기의 기초를 다지기 위해 설정하였으며, 알파벳 대·소문자 형태 구분하기, 알파벳 대·소문자 읽기 등의 내용을 다룬다. 생활 속에서 빈번하게 접하는 알파벳으로 구성된 영어 표기 및 약자를 읽고 의미를 이해하는 기초 능력을 기를 수 있도록 한다.","n":[],"p":435,"b":3},{"c":"[09생영02-03]","k":"기본","sk":"","s":"생활영어","g":"중학교 1~3학년","d":"읽기","t":"개인, 가정, 학교생활에서 사용하는 영어 낱말 및 표현을 읽고 의미를 파악한다.","m":"정보를 표현하고 의미를 전달하기 위한 최소 단위인 낱말과 표현을 읽어 영어로 표기된 정보를 활용할 수 있는 능력을 기르기 위해 설정하였다. 개인, 가정, 학교생활 속에서 쉽게 접할 수 있는 외래어 읽기, 낱말과 표현 읽기, 의미 파악하기 등의 내용을 다룬다. 낱말과 표현을 따라 읽기, 그림과 연결하기 등의 다양한 방식으로 읽고 의미를 파악할 수 있도록 한다.","n":[],"p":435,"b":3},{"c":"[09생영02-04]","k":"기본","sk":"","s":"생활영어","g":"중학교 1~3학년","d":"읽기","t":"다양한 매체를 활용하여 낱말과 표현을 읽고 관련 정보를 이해한다.","m":"영어 학습에 인공지능이 효과적으로 활용됨에 따라 학생이 다양한 매체를 활용하여 영어로 표기된 정보를 이해하는 능력을 기르기 위해 설정하였다. 인공지능 번역기와 애플리케이션 등의 매체 활용하기, 매체를 활용하여 읽고 의미 파악하기 등의 내용을 다룬다. 직접 읽기 뿐 아니라 매체를 활용한 읽기를 통하여 다양한 수준의 학생들이 읽기 활동에 흥미를 가지며 일상생활 속에서 접하는 영어 표기의 의미를 이해할 수 있도록 한다.","n":[],"p":435,"b":3},{"c":"[09생영03-01]","k":"기본","sk":"","s":"생활영어","g":"중학교 1~3학년","d":"쓰기","t":"주변에서 사용하는 알파벳을 보고 영어 쓰기에 관심을 갖는다.","m":"주변에서 흔히 볼 수 있는 알파벳을 보며 대문자ㆍ소문자의 모양과 영어 쓰기에 대한 관심을 이끌어 내기 위해 설정하였다. 우리 주변에는 한글과 다른 문자가 있음을 확인하고, 한글과 형태가 다른 영어문자의 특징을 활용하여 쓰기에 관심을 갖게 한다. 다양한 쓰기 방법을 제시함으로써 영어 알파벳을 익히고자 하는 동기를 이끌어 내도록 한다.","n":[],"p":436,"b":3},{"c":"[09생영03-02]","k":"기본","sk":"","s":"생활영어","g":"중학교 1~3학년","d":"쓰기","t":"알파벳 대문자·소문자를 구별하여 쓴다.","m":"낱말 쓰기의 기초가 되는 알파벳 대·소문자의 형태를 기억하고, 구별하여 쓸 수 있는 기초를 다지기 위해 설정하였다. 알파벳 대문자와 소문자는 명칭은 같으나 형태가 다름을 알게 하고, 다감각을 활용한 다양한 쓰기 방법으로 흥미를 잃지 않도록 하는데 중점을 둔다.","n":[],"p":436,"b":3},{"c":"[09생영03-03]","k":"기본","sk":"","s":"생활영어","g":"중학교 1~3학년","d":"쓰기","t":"개인, 가정, 학교생활에서 사용하는 영어 낱말과 표현을 쓴다.","m":"개인, 가정 학교생활 속에서 쉽게 접할 수 있는 영어 낱말과 표현을 쓰는데 목적이 있다. 리모컨의 on·off 등 친숙한 소재의 생활 속 낱말과 표현 쓰기, 주변에서 볼 수 있는 외래어 쓰기, 매체 활용하여 쓰기 등의 내용을 다룬다. 다양한 수준의 학생에게 따라 쓰기, 보고 쓰기, 완성하기 등 다양한 방법으로 전개하여 유의미한 쓰기 능력을 기르도록 한다.","n":[],"p":436,"b":3},{"c":"[09생영03-04]","k":"기본","sk":"","s":"생활영어","g":"중학교 1~3학년","d":"쓰기","t":"다양한 매체를 활용하여 알파벳과 영어 낱말을 쓴다.","m":"인공지능 시스템이 교육 분야에 적용 및 활용되는 수요가 증가함에 따라 학생이 다양한 매체를 활용하여 영어표현을 쓰는 능력을 기르기 위해 설정하였다. 인공지능 애플리케이션 등의 매체를 활용하여 쓰기 활동에 재미를 느끼고 자기주도적으로 생활 속 영어표현 쓰기에 효과를 높이도록 한다.","n":[],"p":436,"b":3},{"c":"[12생영01-01]","k":"기본","sk":"","s":"생활영어","g":"고등학교 1~3학년","d":"듣기·말하기","t":"실물, 그림, 사진 등과 관련된 낱말·어구·문장을 듣고 말한다.","m":"실물, 그림, 사진 등을 통해 영어표현을 접하면서 영어에 대한 관심과 자신감을 기르기 위해 설정하였다. 학생들이 선호하는 스포츠 종목, 다양한 상황에 따른 감정, 여러 가지 취미, 직업 종류 등을 듣고 말하는 내용을 다룬다. 주제에 따라 다른 교과와 연계하여 지도하면서 학생들의 영어에 대한 접근성을 높이고, 학생들이 보다 쉽게 영어를 받아들이도록 한다.","n":[],"p":438,"b":3},{"c":"[12생영01-02]","k":"기본","sk":"","s":"생활영어","g":"고등학교 1~3학년","d":"듣기·말하기","t":"지역사회, 직업생활 관련 낱말·어구·문장을 듣고 의미를 파악한다.","m":"지역사회, 직업생활 관련 영어를 듣고 말하며 실제 자주 사용하는 영어표현의 의미를 파악하기 위해 설정하였다. 주변에서 볼 수 있는 건물, 자주 이용하는 장소, 직장 내 영어 관련 간단한 영어를 듣고 말하는 내용을 다룬다. 현장 체험 학습, 직업실습, 역할극 등의 체험활동과 모의 상항을 통해 실제 사용 가능한 간단한 영어표현을 익히고 의미를 파악하도록 한다.","n":[],"p":438,"b":3},{"c":"[12생영01-03]","k":"기본","sk":"","s":"생활영어","g":"고등학교 1~3학년","d":"듣기·말하기","t":"다양한 장소·상황·주제에 따른 지시나 설명을 듣고 과제를 수행한다.","m":"사회 관계망 서비스(SNS), 생활용품, 의사소통 시 영어 사용 빈도가 증가하므로 학생들에게 간단한 영어표현 능력을 기르기 위해 설정하였다. 상황에 따라 긴급어, 지시어, 금지어 등 장소에 따라 주문하기, 요청하기, 권유하기, 주제에 따라 묘사하기, 설명하기 등의 내용을 다룬다. 상황･주제･장소에 따른 영어표현을 다양한 장면에서 반복적으로 제시하면서 친숙하게 듣고 말하면서 과제를 수행하도록 한다.","n":[],"p":438,"b":3},{"c":"[12생영01-04]","k":"기본","sk":"","s":"생활영어","g":"고등학교 1~3학년","d":"듣기·말하기","t":"지역사회, 직업생활 관련 주제에 대해 말이나 대화를 한다.","m":"다른 사람과 대화할 때, 경청하는 자세와 적절하게 말하는 능력을 향상시키기 위하여 설정하였다. 일정, 기분·감정어, 장소(위치), 사회 현안(기후위기, 자연 보호, 인공지능, 다문화 등), 권유하기, 격려하기, 사과하기 등의 내용을 다룬다. 직업, 지역사회 관련 다양한 상황을 제시하면서 나와 주변 환경에 관심을 갖고 사회적 상황에 따라 자연스럽게 말이나 대화하도록 한다.","n":["중도중복장애 학생의 교육적 요구에 따라 ‘~말이나 대화한다.’를 ‘~표정이나 몸짓으로 표현한다.’, ‘~대화에 참여한다.’ 등으로 성취기준을 재구성하여 적용할 수 있다."],"p":438,"b":3},{"c":"[12생영01-05]","k":"기본","sk":"","s":"생활영어","g":"고등학교 1~3학년","d":"듣기·말하기","t":"매체를 활용하여 낱말·어구·문장을 듣고 말이나 대화를 한다.","m":"장애 유형이나 특성으로 인해 음성언어 표현이 어려운 학생들을 위해 설정하였다. 매체 바르게 다루기, 매체를 활용하여 영어 표현하기, 매체를 활용하여 대화하기, 말이나 대화하는 바른 태도 함양하기 등의 내용을 다룬다. 보완대체의사소통 기기, 애플리케이션, 스마트폰 내 기능 등을 활용하여 자신의 생각이나 감정을 표현하고, 다른 사람과의 대화 참여에 적극적으로 참여하도록 한다.","n":["중도중복장애 학생의 교육적 요구에 따라 ‘~말이나 대화한다.’를 ‘~표정이나 몸짓으로 표현한다.’, ‘~대화에 참여한다.’ 등으로 성취기준을 재구성하여 적용할 수 있다."],"p":438,"b":3},{"c":"[12생영01-06]","k":"기본","sk":"","s":"생활영어","g":"고등학교 1~3학년","d":"듣기·말하기","t":"여러 나라 문화와 관련 영어표현을 듣고 말한다.","m":"우리나라에 없거나 다른 여러 나라의 문화를 수용하고 존중하는 태도를 함양하기 위해 설정하였다. 일상생활, 직업, 지역사회와 관련 있는 주제로 우리나라에 있는 유사 문화 또는 우리나라에 없는 문화의 내용을 다룬다. 주제에 적합한 역할극, 실습, 다양한 매체 활용 등의 활동이나 체험을 통해 여러 나라의 문화에 대한 흥미와 관심을 가지고 이해하도록 한다.","n":[],"p":438,"b":3},{"c":"[12생영02-01]","k":"기본","sk":"","s":"생활영어","g":"고등학교 1~3학년","d":"읽기","t":"실물ㆍ그림ㆍ사진 등에 있는 낱말·어구·문장을 읽는다.","m":"학생들이 자주 접하는 사물, 그림, 사진 등과 관련한 간단한 낱말, 어구, 문장을 읽음으로써 자기주도적인 읽기 능력의 기초를 마련하기 위해 설정하였다. TV, 컴퓨터, 엘리베이터 등의 실물과 의류 및 스포츠, 음식점, 미디어 콘텐츠(OTT) 등의 그림과 사진 등을 읽을 수 있는 내용을 다룬다. 학생이 자주 접하는 실물ㆍ그림ㆍ사진을 활용하여 영어에 대한 친밀감을 높일 수 있도록 한다.","n":[],"p":440,"b":3},{"c":"[12생영02-02]","k":"기본","sk":"","s":"생활영어","g":"고등학교 1~3학년","d":"읽기","t":"여러 가지 상황에 적합한 낱말·어구·문장을 읽고 의미를 파악한다.","m":"여러 상황에서 자주 사용하는 영어표현을 읽음으로써 협력적 의사소통 능력의 기초를 마련하기 위해 설정하였다. 특정한 장소에서 낱말이나 문장을 읽음으로써 비상구의 위치를 파악하거나, 제품을 설명하는 핵심 낱말이나 두문자어(예: GMO, MSG) 및 간단한 문장을 읽고 정보를 파악할 수 있는 내용을 다룬다. 자신이 속한 장면에서 영어를 읽음으로써 궁극적으로 의사소통에 관심을 갖도록 한다.","n":[],"p":440,"b":3},{"c":"[12생영02-03]","k":"기본","sk":"","s":"생활영어","g":"고등학교 1~3학년","d":"읽기","t":"지역사회, 직업생활에서의 영어표현을 읽고 정보를 활용한다.","m":"자신이 읽은 정보를 활용함으로써 실생활에서의 문제 해결력을 기르기 위해 설정하였다. 지역사회에서 접할 수 있는 시설들이나 지명, 다양한 직업들 및 직업생활에서의 호칭 등과 일상생활 장면의 표현들(멈추다, 시작하다)을 다룬다. 정보를 활용한 문제 해결을 통해 궁극적으로는 영어에 대한 성취감과 활용 능력을 높일 수 있도록 한다.","n":["중도중복장애 학생의 경우 부분 참여의 원리를 적용하여 ‘~따라 읽는다.’, ‘~읽고 활용한다.’를 ‘~표정이나 몸짓으로 읽기자료를 선택한다.’, ‘~스위치를 눌러 읽기 활동에 참여한다.’ 등으로 성취기준을 재구성하여 적용할 수 있다."],"p":440,"b":3},{"c":"[12생영02-04]","k":"기본","sk":"","s":"생활영어","g":"고등학교 1~3학년","d":"읽기","t":"매체를 사용하여 영어표현을 읽고 정보를 활용한다.","m":"다양한 매체를 다루는 능력을 통해 원격수업에 참여하고, 디지털 소양을 기르기 위해 설정하였다. 스마트 기기에 내장되어 있는 읽기 및 부분 번역 기능, 인공지능 번역애플리케이션, 스위치 및 스캐닝 활용하기 등의 내용을 다룬다. 다양한 매체 및 인공지능 기능의 활용은 온오프라인의 연계 및 영어에 대한 관심과 읽기 활동에 자신감을 갖도록 한다.","n":["중도중복장애 학생의 경우 부분 참여의 원리를 적용하여 ‘~따라 읽는다.’, ‘~읽고 활용한다.’를 ‘~표정이나 몸짓으로 읽기자료를 선택한다.’, ‘~스위치를 눌러 읽기 활동에 참여한다.’ 등으로 성취기준을 재구성하여 적용할 수 있다."],"p":440,"b":3},{"c":"[12생영02-05]","k":"기본","sk":"","s":"생활영어","g":"고등학교 1~3학년","d":"읽기","t":"여러 나라의 문화와 관련된 영어표현을 읽는다.","m":"여러 나라와 관련된 낱말·어구·문장 읽기 활동을 통해 문화를 수용하고 존중하는 태도를 함양하기 위해 설정하였다. 영어권 국가의 기념일(예: Easter, Thanksgiving,Christmas)에 먹는 음식, 놀이, 의식 등의 내용을 다룬다. 체험 중심의 흥미로운 활동을 통해 학생이 여러 나라의 다양한 문화에 대해 흥미와 관심을 가지고 이를 이해하고 존중하는 능력을 증진하는 데 중점을 둔다.","n":[],"p":440,"b":3},{"c":"[12생영03-01]","k":"기본","sk":"","s":"생활영어","g":"고등학교 1~3학년","d":"쓰기","t":"실물·그림·사진 등에 있는 낱말·어구·문장을 보고 쓴다.","m":"학생이 실물·그림·사진 등에 포함된 영어표현을 찾아서 보고 쓰는 능력을 기르기 위해 설정하였다. 학생에게 친숙한 지역사회, 직업 등과 관련된 영어표현을 소재로 하여 학생이 낱말·어구·문장을 보고 쓰는 내용을 다룬다. 이를 통해 생활 속 영어에 대한 친근감을 높이고, 영어 쓰기에 대한 자신감을 갖도록 한다.","n":[],"p":441,"b":3},{"c":"[12생영03-02]","k":"기본","sk":"","s":"생활영어","g":"고등학교 1~3학년","d":"쓰기","t":"실물·그림·사진 등을 보고 알맞은 낱말을 넣어 어구와 문장을 완성한다.","m":"학생에게 친숙한 지역사회, 직업생활과 관련된 어구·문장의 완성을 위해 알맞은 낱말을 쓰는 능력을 함양하기 위해 설정하였다. 낱말을 찾아서 보고 쓰기, 철자 일부만 제시된 낱말의 나머지 철자 채우기, 낱말을 넣어 어구와 문장 완성하기 등의 내용을 다룬다. 학생들이 생활 속에서 사용할 수 있는 다양한 어휘를 습득하여 쓸 수 있도록 한다.","n":["중도중복장애 학생의 경우 부분 참여의 원리를 적용하여 ‘~을 완성한다.’, ‘~을 쓴다.’를 ‘~따라 쓴다.’, ‘~스위치를 눌러 쓰기 활동에 참여한다.’ 등으로 성취기준을 재구성하여 적용할 수 있다."],"p":441,"b":3},{"c":"[12생영03-03]","k":"기본","sk":"","s":"생활영어","g":"고등학교 1~3학년","d":"쓰기","t":"지역사회, 직업생활에 적합한 낱말·어구·문장을 쓴다.","m":"지역사회, 직업생활과 관련된 낱말, 어구, 문장을 씀으로써 상황적 맥락을 파악하고 자신의 의사를 표현하는 능력을 함양하기 위하여 설정하였다. 인사하기, 도움 요청하기, 기분·감정, 인물, 일정, 스포츠, 장소, 직업, 지역사회, 여러 나라의 문화 등의 내용을 다룬다. 학생이 생활에서 자주 접할 수 있는 낱말·어구·문장을 쓰는 것에 대한 관심과 자신감을 갖도록 한다.","n":["중도중복장애 학생의 경우 부분 참여의 원리를 적용하여 ‘~을 완성한다.’, ‘~을 쓴다.’를 ‘~따라 쓴다.’, ‘~스위치를 눌러 쓰기 활동에 참여한다.’ 등으로 성취기준을 재구성하여 적용할 수 있다."],"p":441,"b":3},{"c":"[12생영03-04]","k":"기본","sk":"","s":"생활영어","g":"고등학교 1~3학년","d":"쓰기","t":"매체를 활용하여 적합한 낱말·어구·문장을 입력한다.","m":"정보를 습득하거나 원격수업에 참여하기 위하여 학생이 다양한 매체에 영어를 입력하는 능력을 함양하기 위하여 설정하였다. 보완대체의사소통 기기, 스마트 기기, 인공지능 기반의 다양한 매체를 활용하여 낱말, 어구, 문장 입력하는 내용을 다룬다. 다양한 매체 활용 시 학생이 영어 입력에 대한 친숙도를 높이고, 매체를 적극적으로 활용하여 영어를 입력할 수 있도록 한다.","n":[],"p":441,"b":3},{"c":"[12생영03-05]","k":"기본","sk":"","s":"생활영어","g":"고등학교 1~3학년","d":"쓰기","t":"여러 나라의 문화와 관련된 영어표현을 쓴다.","m":"여러 나라의 문화를 수용하고 존중하는 태도를 함양하기 위해 설정하였다. 여러 나라의 문화(예: 기념일, 음식, 놀이)와 관련된 체험활동 중심의 낱말·어구·문장 쓰기, 다양한 매체로 영어 입력하기 등의 내용을 다룬다. 학생이 여러 나라의 다양한 문화에 대한 흥미와 관심을 가지고 이를 이해하는 능력을 증진하는 데 중점을 둔다.","n":[],"p":441,"b":3},{"c":"[9보건01-01]","k":"기본","sk":"","s":"보건","g":"중학교 1~3학년","d":"생활 속 건강 관리","t":"생활 습관이 건강에 미치는 영향을 이해하고 건강한 생활 관리 방법을 실천한다.","m":"건강한 상태와 건강하지 않은 상태를 구별하고 신체적 건강뿐만 아니라 정신적, 사회적 건강의 가치를 인식하여 건강을 유지⋅증진하기 위해 설정하였다. 건강의 의미, 건강의 중요성, 식습관, 운동 습관, 수면 습관 등의 내용을 다룬다. 다양한 건강 평가 도구를 활용하여 자신의 건강 상태와 생활 습관을 점검하고 건강 평가 결과에 따라 건강한 생활 관리 역량을 기르는 데 주안점을 둔다.","n":["장애 정도가 심한 학생이 지닌 생활 습관과 관련된 섭식, 배설, 호흡, 자세 등의 개인적 특성을 고려하여 각 활동을 수행할 때 부분적 참여를 통해 자신의 건강과 생명 유지를 위한 능동적 태도를 기를 수 있도록 성취기준을 재구성하여 적용할 수 있다."],"p":453,"b":3},{"c":"[9보건01-02]","k":"기본","sk":"","s":"보건","g":"중학교 1~3학년","d":"생활 속 건강 관리","t":"개인위생 관리를 생활화하여 질병을 예방한다.","m":"개인적⋅사회적 관점에서 개인위생 관리의 중요성을 인식하고 개인위생 관리를 생활화하여 자신과 공동체의 건강을 유지⋅증진하기 위해 설정하였다. 손 씻기, 세안하기, 목욕하기, 구강 관리하기 등 신체의 청결을 위한 기술과 대소변을 처리하는 신변 처리 기술 등의 내용을 다룬다. 개인위생 관리를 생활화하여 건강한 삶을 영위하는 데 주안점을 둔다.","n":["장애 정도가 심한 학생의 교육적 요구에 따라 깨끗한 신체 구별하기, 개인위생 관리에 필요한 용품 찾기 등으로 성취기준을 재구성할 수 있다."],"p":453,"b":3},{"c":"[9보건01-03]","k":"기본","sk":"","s":"보건","g":"중학교 1~3학년","d":"생활 속 건강 관리","t":"질병의 종류와 증상을 알고 예방과 관리를 위한 생활 수칙을 실천한다.","m":"질병의 종류와 발생 원인을 파악하고 건강 문제 발생 시 자신의 증상을 정확하게 인지하여 관리하는 능력을 기르기 위해 설정하였다. 일상생활에서 자주 발생하는 질병의 종류, 질병 발생 원인과 예방, 증상에 따른 관리 방법 등의 내용을 다룬다. 질병 예방을 위한 생활 수칙을 실천하고 질병 발생 시 올바르게 관리하는 데 주안점을 둔다.","n":["장애 정도가 심한 학생의 교육적 요구를 고려하여 건강 문제 발생 시 비언어적 의사소통 방법 또는 보조공학 기기를 활용하여 증상 표현하기로 성취기준을 재구성하여 적용할 수 있다."],"p":453,"b":3},{"c":"[9보건01-04]","k":"기본","sk":"","s":"보건","g":"중학교 1~3학년","d":"생활 속 건강 관리","t":"감정 조절 기술을 습득하여 상황에 따라 적절하게 감정을 표현한다.","m":"청소년기 감정의 변화를 인식하고 자신과 타인의 감정을 수용하며 감정 조절 기술을 사용하여 자신의 감정을 적절하게 표현함으로써 정신 건강을 도모하기 위해 설정하였다. 감정의 이해와 표현, 감정 조절, 효과적인 의사소통 기술 등의 내용을 다룬다. 대인관계 문제 해결을 위한 의사소통의 중요성을 인식하고 효과적인 의사소통의 특성을 탐색하며 건강 문제 상황에서 문제 해결을 위한 의사소통 방법을 적용하는 데 주안점을 둔다.","n":[],"p":453,"b":3},{"c":"[9보건02-01]","k":"기본","sk":"","s":"보건","g":"중학교 1~3학년","d":"건강한 선택","t":"건강 정보와 자원의 종류 및 특성을 알고 보건 의료 서비스를 적절하게 이용한다.","m":"건강 정보와 자원의 종류 및 특성을 탐색하고 보건 의료 서비스의 이용 방법을 익힘으로써 건강 정보 이해 능력 및 실생활에서의 활용 능력을 향상하기 위해 설정하였다. 건강 정보와 매체, 건강 자원의 종류와 특성, 공공 의료 기관의 종류와 역할, 보건 서비스를 제공하는 단체 및 시설의 종류와 역할, 기관별 이용 방법 등의 내용을 다룬다. 건강을 유지하고 증진하는 데 필요한 정보 접근성, 이해력을 포함한 인지적, 사회적 기술을 획득하여 건강 정보와 자원 활용의 기초를 다지는 데 주안점을 둔다.","n":[],"p":454,"b":3},{"c":"[9보건02-02]","k":"기본","sk":"","s":"보건","g":"중학교 1~3학년","d":"건강한 선택","t":"흡연과 음주의 위험을 인식하고 노출 상황에서 적절하게 대처한다.","m":"청소년기 흡연과 음주가 신체적, 정신적, 사회적 건강에 미치는 영향을 인식하고 금연, 금주를 선택함으로써 스스로 건강을 유지하고 증진할 수 있는 건강 관리 능력을 기르기 위해 설정하였다. 흡연과 음주가 건강에 미치는 영향, 흡연과 음주 권유 시 거절하기, 금연과 금주 다짐하기 등의 내용을 다룬다. 청소년기에 경험할 수 있는 흡연과 음주의 유혹과 권유 및 강요 상황 발생 시 대처 능력을 기르는 데 주안점을 둔다.","n":["장애 정도가 심한 학생의 교육적 요구를 고려하여 흡연 전과 후의 신체 모형 구분하기, 음주 전과 후의 신체 모형 구분하기 등으로 성취기준을 재구성하여 적용할 수 있다."],"p":454,"b":3},{"c":"[9보건02-03]","k":"기본","sk":"","s":"보건","g":"중학교 1~3학년","d":"건강한 선택","t":"약물 오⋅남용의 의미를 알고 의약품을 안전하게 사용한다.","m":"약물 오⋅남용은 신체적, 정신적, 정서적으로 건강한 상태를 위협할 수 있음을 인식하고 의약품을 올바르게 사용하기 위해 설정하였다. 의약품의 안전한 사용, 약물 오⋅남용의 의미, 약물 오⋅남용의 사례 등의 내용을 다룬다. 특히 일상에서 흔하게 오⋅남용될 수 있는 약물의 종류를 알고 약물을 안전하게 선택하는 방법을 익히는 데 주안점을 둔다.","n":[],"p":454,"b":3},{"c":"[9보건02-04]","k":"기본","sk":"","s":"보건","g":"중학교 1~3학년","d":"건강한 선택","t":"스마트폰⋅인터넷 과의존이 건강에 미치는 영향을 알고 올바르게 사용한다.","m":"스마트폰⋅인터넷 과의존이 건강에 미치는 영향을 인식하고 올바른 사용 습관을 형성하기 위해 설정하였다. 스마트폰⋅인터넷 사용 습관 점검하기, 스마트폰⋅인터넷 과의존과 건강의 관계, 올바른 사용 습관 형성을 위한 목표 설정하기 등의 내용을 다룬다. 스마트폰⋅인터넷 과의존을 극복할 수 있는 방법을 탐색하고 가정, 지역사회 유관 기관과 연계하여 생활 속에서 올바른 사용 습관을 실천하는 데 주안점을 둔다.","n":["장애 정도가 심한 학생의 교육적 요구를 고려하여 스마트폰⋅인터넷 사용 시 바른 자세 유지하기, 스마트폰⋅인터넷 대체 활동 선택하기 등으로 성취기준을 재구성하여 적용할 수 있다."],"p":454,"b":3},{"c":"[9보건03-01]","k":"기본","sk":"","s":"보건","g":"중학교 1~3학년","d":"건강한 성","t":"청소년기 남녀의 신체 변화를 알고 건강하게 관리한다.","m":"청소년기에 발생하는 신체 변화가 자연스러운 과정임을 알고, 올바른 생식기 관리를 통해 건강한 생활을 유지하기 위해 설정하였다. 남녀의 생리학적 변화, 생식기관 건강 관리, 성 욕구 조절 등의 내용을 다룬다. 자신의 신체 변화를 이해하고 수용하며 성 충동 및 욕구를 조절하여 성 건강을 유지하는 데 주안점을 둔다.","n":["장애 정도가 심한 학생의 교육적 요구에 따라 자신의 신체 모습과 비슷한 신체 모형이나 그림 찾아 선택하기, 시각적 단서를 통해 청소년기 신체와 심리 변화 구분하기 등으로 성취기준을 재구성하여 적용할 수 있다."],"p":456,"b":3},{"c":"[9보건03-02]","k":"기본","sk":"","s":"보건","g":"중학교 1~3학년","d":"건강한 성","t":"청소년기 남녀의 심리 변화를 알고 자신의 변화에 긍정적인 태도를 지닌다.","m":"청소년기 심리 변화에 영향을 주는 신체 변화와 호르몬 등에 대해 이해하고 적절하게 대처하기 위해 설정하였다. 청소년기의 심리적 특징, 심리 변화에 대처하는 방법, 적절한 의사 표현 방법 등의 내용을 다룬다. 청소년기의 심리 변화는 성장 과정에서 발생하는 현상임을 알고 자신과 타인의 변화를 긍정적으로 인식하는 데 주안점을 둔다.","n":[],"p":456,"b":3},{"c":"[9보건03-03]","k":"기본","sk":"","s":"보건","g":"중학교 1~3학년","d":"건강한 성","t":"성폭력에 대해 인식하고 위험으로부터 안전하게 대처한다.","m":"성희롱, 성추행, 성폭행, 디지털 성폭력 등의 위험을 인식하고 예방하며 성폭력 발생 시 즉각적으로 대처하기 위해 설정하였다. 성폭력의 종류, 성폭력 예방 교육, 성적 위험 상황 발생 시 그 상황에서 벗어나거나 도움을 요청하는 방법, 성폭력 발생 시 신고 절차, 디지털 성폭력의 유형 등의 내용을 다룬다. 실생활에서 자신과 타인을 성폭력 상황으로부터 보호하기 위한 방법을 실천하는 데 주안점을 둔다.","n":[],"p":456,"b":3},{"c":"[9보건03-04]","k":"기본","sk":"","s":"보건","g":"중학교 1~3학년","d":"건강한 성","t":"성 인권의 의미를 알고, 타인과 건강한 사회적 관계를 맺는다.","m":"성 인권의 의미를 알고, 나와 타인의 성적 권리 및 성적 의사 표현을 존중하는 태도를 기르기 위해 설정하였다. 성적 주체, 성 인지 감수성, 대인 간 경계 존중, 성적 권리, 성적 자기 결정 상황에서 의사를 적절하게 표현하는 방법, 상대방의 성적 표현에 대한 올바른 대처 등의 내용을 다룬다. 자신과 타인이 누려야 할 성적 권리를 존중하는 태도를 생활화하여 건강한 사회적 관계를 맺는 데 주안점을 둔다.","n":["장애 정도가 심한 학생의 교육적 요구에 따라 보편적 학습설계 기반의 다양한 보조 자료와 학습 과정을 적용하여 자신의 몸에서 지켜야 할 경계 설정하기, 의사소통 도구를 활용하여 동의 및 거부 의사를 명확하게 표현하기 등으로 성취기준을 재구성하여 적용할 수 있다."],"p":456,"b":3},{"c":"[9보건04-01]","k":"기본","sk":"","s":"보건","g":"중학교 1~3학년","d":"생활 속 안전","t":"가정폭력과 학교폭력의 유형과 위험을 알고 예방하며 적절히 대처한다.","m":"신변 안전을 위협하는 가정 및 학교폭력 상황을 인지하고 적절히 대처하는 능력을 기르기 위해 설정하였다. 가정폭력의 유형과 위험성, 가정폭력 예방법, 가정폭력 발생 시 대처법, 학교폭력의 유형과 위험성, 학교폭력 예방법, 학교폭력 발생 시 대처법 등을 다룬다. 폭력이 발생했을 때, 위험한 상황을 인지하고 도움을 받을 수 있는 대상이나 기관을 익혀 자신과 타인의 안전을 지킬 수 있는 능력을 기르는 데 주안점을 둔다.","n":["장애 정도가 심한 학생의 교육적 요구에 따라 폭력 상황 찾기, 가정 및 학교폭력상황에서 도움 요청하기 등으로 성취기준을 재구성하여 적용할 수 있다."],"p":457,"b":3},{"c":"[9보건04-02]","k":"기본","sk":"","s":"보건","g":"중학교 1~3학년","d":"생활 속 안전","t":"안전사고의 위험 요인을 알고 사고 예방을 위한 안전 수칙을 실천한다.","m":"일상생활에서 발생할 수 있는 사고로부터 자신과 타인을 보호하는 방법을 습득하기 위해 설정하였다. 가정 안전, 학교 안전, 지역사회 안전 등 다양한 장소와 상황에서 발생할 수 있는 사고의 위험 요인과 사고를 예방하기 위한 안전 수칙 등을 다룬다. 특히 많은 사람이 모이는 장소에 가는 경우 참여 규모와 밀집도 등 다양한 사고의 위험 요인을 이해하고, 예방을 위한 안전 수칙과 대응 능력을 길러 안전 행동 습관을 형성하는 데 주안점을 둔다.","n":[],"p":457,"b":3},{"c":"[9보건04-03]","k":"기본","sk":"","s":"보건","g":"중학교 1~3학년","d":"생활 속 안전","t":"교통사고의 위험 요인을 알고 사고 예방을 위한 안전 수칙을 실천한다.","m":"도로나 교통상황에서 벌어지는 다양한 정보를 통합하여 해석하는 능력과 경험의 부재로 인해 발생할 수 있는 사고로부터 자신과 타인을 보호하는 능력을 기르기 위해 설정하였다. 도로 안전, 교통수단 이용 안전, 신호등 및 교통안전 표지 등을 다룬다. 도로 및 교통사고의 위험 요인과 안전 수칙을 습득하여 자신과 타인의 생명을 지키고 사회적 질서를 준수하는 태도를 기르는 데 주안점을 둔다.","n":["장애 정도가 심한 학생의 특성을 고려해 도로 및 교통 환경에서 위험 요소를 직접 찾아보기, 교통안전 영상 시청 후 교통 표지판의 종류와 의미 연결하기, 실제 환경에서 교통질서 준수하기, 실물이나 사진 등의 구체물을 통해 안전 수칙 알아보기 등으로 성취기준을 재구성하여 적용할 수 있다."],"p":457,"b":3},{"c":"[9보건04-04]","k":"기본","sk":"","s":"보건","g":"중학교 1~3학년","d":"생활 속 안전","t":"일상생활 속 응급 상황의 발생 유형을 알고 응급처치 방법을 적용한다.","m":"일상생활 중 안전사고는 언제라도 발생할 수 있음을 알고 안전사고 발생 시 올바르게 대처할 수 있는 능력을 키우기 위해 설정하였다. 응급 사고 유형, 응급 상황 시 도움 요청 방법, 스스로 할 수 있는 생활 응급처치 등을 다룬다. 일상생활에서 발생할 수 있는 응급 상황을 인식하고 주변 사람에게 도움을 요청하는 것과 심폐소생술과 같은 응급처치를 수행할 수 있는 능력을 기르는 데 주안점을 둔다.","n":["장애 정도가 심한 학생의 교육적 요구에 따라 사진이나 그림에서 안전사고가 발생할 수 있는 장면 고르기, 구급상자의 약품을 사용하여 응급처치 시연하기 등으로 성취기준을 재구성하여 적용할 수 있다."],"p":457,"b":3},{"c":"[12보건01-01]","k":"기본","sk":"","s":"보건","g":"고등학교 1~3학년","d":"생활 속 건강 관리","t":"건강한 생활 관리와 질병의 관계를 인식하고 건강 관리 계획을 수립하여 실천한다.","m":"생활 습관과 질병의 관련성을 이해하고 신체 기관별 건강 문제에 대한 예방과 관리 방법의 생활화를 위해 설정하였다. 청소년기 자주 발생하는 질병 및 생활 습관의 문제로 발생하는 질병의 종류와 원인, 예방과 관리 방법 등의 내용을 다룬다. 건강을 유지⋅증진하는 데 필요한 건강한 생활 습관을 형성하고 질병 예방을 위한 건강 실천 계획을 수립하여 건강 관리 역량을 기르는 데 주안점을 둔다.","n":["장애 정도가 심한 학생의 경우 자신의 생활 습관에 해당하는 모습 선택하기 등을 통해 생활 습관을 점검하고 생활 습관과 건강의 관련성을 인식하도록 성취기준을 재구성하여 적용할 수 있다."],"p":459,"b":3},{"c":"[12보건01-02]","k":"기본","sk":"","s":"보건","g":"고등학교 1~3학년","d":"생활 속 건강 관리","t":"주요 감염병의 종류와 증상을 이해하여 감염병을 예방하고 관리한다.","m":"감염병(신종 감염병 포함)의 발생 원인을 이해하고 예방과 관리를 위한 생활 수칙을 실천하여 개인적, 사회적 건강 관리 역량을 기르기 위해 설정하였다. 감염병 발생 원인과 감염 경로, 주요 감염병의 종류와 증상, 감염병 예방과 관리를 위한 생활 수칙 등의 내용을 다룬다. 감염병의 예방과 관리는 개인과 공동체의 협력적 관계 구축과 적극적인 참여를 통해 이룰 수 있음을 이해하는 데 주안점을 둔다.","n":[],"p":459,"b":3},{"c":"[12보건01-03]","k":"기본","sk":"","s":"보건","g":"고등학교 1~3학년","d":"생활 속 건강 관리","t":"의료 기관의 종류와 이용 방법을 알고 증상에 맞는 의료 기관을 선택하여 이용한다.","m":"건강 문제가 발생했을 때 증상에 맞게 적절한 의료 기관을 선택하여 건강 문제를 해결할 수 있는 역량을 기르기 위해 설정하였다. 의료 기관의 종류, 증상에 따른 의료 기관 선택, 의료 기관의 이용 방법과 절차 등의 내용을 다룬다. 의료 기관 이용 시 필요한 정보와 기술을 습득하고 다양한 의료 기관에서 일반화하는 데 주안점을 둔다.","n":[],"p":459,"b":3},{"c":"[12보건01-04]","k":"기본","sk":"","s":"보건","g":"고등학교 1~3학년","d":"생활 속 건강 관리","t":"정신 건강 문제의 특성을 이해하고 예방과 관리 방법을 적용한다.","m":"청소년기에 경험할 수 있는 정신 건강 문제와 특성을 인식하고 부정적인 감정을 건강하게 수용하여 조절하기 위한 능력을 기르기 위해 설정하였다. 스트레스, 우울, 분노, 충동의 특성과 관리 방법 등의 내용을 다룬다. 정신 건강 문제 발생 시 생활 주변에서 도움받을 수 있는 자원을 탐색하고 예방과 관리 방법을 이에 적용함으로써 정신 건강을 증진하는 데 주안점을 둔다.","n":["장애 정도가 심한 학생의 경우 자신의 건강 증상을 표현할 수 있도록 보완대체의사소통 기기를 활용하여 각 신체 기관과 증상 표현하기 등으로 성취기준을 재구성하여 적용할 수 있다."],"p":459,"b":3},{"c":"[12보건02-01]","k":"기본","sk":"","s":"보건","g":"고등학교 1~3학년","d":"건강한 선택","t":"건강한 생활 문화를 구분하고 건강 정보와 자원을 적절히 활용한다.","m":"다양한 건강 매체와 인공지능, 디지털 기기 등을 통해 수집한 정보를 활용하여건강 문제를 해결할 수 있는 능력을 기르고, 건강 문화의 올바른 가치와 태도를 수용하여 건강한 생활을 실천하기 위해 설정하였다. 건강 정보의 이해와 건강 자원의 활용, 건강 관리를위한 의사 결정, 건강 증진 문화와 건강 위험 문화, 건강 문화 개선 활동 등의 내용을 다룬다.신뢰할 수 있는 건강 정보 매체를 찾고 건강에 유익한 정보와 자원을 조사하여 활용하며, 건강한 생활 문화를 영위할 수 있는 역량을 기르는 데 주안점을 둔다.","n":[],"p":461,"b":3},{"c":"[12보건02-02]","k":"기본","sk":"","s":"보건","g":"고등학교 1~3학년","d":"건강한 선택","t":"흡연과 음주의 개인적, 사회적 문제를 인식하고 올바르게 대처한다.","m":"청소년기 흡연과 음주로 인해 발생하는 신체적, 정신적, 사회적 문제의 심각성을 인식하고 건강한 선택을 실천하기 위해 설정하였다. 흡연의 문제점, 흡연으로 인한 질병, 음주의 문제점, 음주로 인한 질병, 흡연 및 음주의 예방과 대처 방법 등의 내용을 다룬다. 청소년기 흡연과 음주는 성장을 저해하고 질병을 유발하여 성인기 건강에 부정적인 영향을 끼친다는 사실을 인식하고 예방하는 데 주안점을 둔다.","n":["장애 정도가 심한 학생의 교육적 요구를 고려하여 담배 연기, 술이 인체에 미치는 영향을 관찰하기, 흡연과 음주의 권유와 강요 상황에서 거절하는 방법 선택하기 등으로 성취기준을 재구성하여 적용할 수 있다."],"p":461,"b":3},{"c":"[12보건02-03]","k":"기본","sk":"","s":"보건","g":"고등학교 1~3학년","d":"건강한 선택","t":"약물 중독이 건강에 미치는 영향을 이해하고 올바르게 대처한다.","m":"약물 중독이 개인적, 사회적 건강에 미치는 영향을 인식하여 일상생활에서 접할 수 있는 약물에 대해 주의를 기울여 사용할 수 있는 역량을 기르기 위해 설정하였다. 중독성 약물의 종류와 특징, 약물 중독의 원인, 약물로 인한 신체적, 정신적, 사회적 문제점, 약물 중독 예방과 대처 방법 등의 내용을 다룬다. 중독의 본질을 인지하고 심각한 마약류 약물 외에도 카페인 등과 같은 중독 물질의 위험성과 올바른 사용법을 익히는 데 주안점을 둔다.","n":[],"p":461,"b":3},{"c":"[12보건02-04]","k":"기본","sk":"","s":"보건","g":"고등학교 1~3학년","d":"건강한 선택","t":"스마트폰⋅인터넷 중독이 개인적, 사회적 건강에 미치는 영향을 이해하고 예방과 대처 방법을 실천한다.","m":"스마트폰⋅인터넷 중독이 야기하는 강박적 사고, 내성, 금단, 지속적 사용 욕구, 다른 활동에 대한 흥미 감소 등의 신체적, 정신적 문제를 인식하고 예방과 대처할 수 있는 능력을 기르기 위해 설정하였다. 스마트폰⋅인터넷 중독의 유형, 증상, 건강에 미치는 영향, 예방과 대처 방법 등의 내용을 다룬다. 청소년기 스마트폰⋅인터넷 중독은 주의력 결핍, 우울증, 자존감 저하 등의 원인으로 발생할 수 있으며, 근본적인 원인을 발견하고 극복할 수 있는 대안 활동을 실천함으로써 신체적, 정신적으로 건강한 상태를 유지하는 데 주안점을 둔다.","n":["장애 정도가 심한 학생의 교육적 요구를 고려하여 스마트폰⋅인터넷 중독으로 인한 문제점 찾기, 스마트폰⋅인터넷 대체 활동 선택하여 실천하기 등으로 성취기준을 재구성하여 적용할 수 있다."],"p":461,"b":3},{"c":"[12보건03-01]","k":"기본","sk":"","s":"보건","g":"고등학교 1~3학년","d":"건강한 성","t":"임신, 출산, 피임의 과정을 이해하고, 건강한 관리 방법을 조사한다.","m":"임신, 출산의 과정과 피임의 중요성을 이해하며 올바른 신체 관리 방법을 알고 태아의 성장 과정에 관심을 기울일 수 있도록 설정하였다. 생명의 소중함, 임신과 출산을 위한 건강 관리, 임신 중 몸의 변화, 태아의 성장 과정, 출산 전·후 신체 관리, 피임이 필요한 상황, 남녀의 피임법 등의 내용을 다룬다. 준비된 임신과 출산의 중요성과 과정을 이해하여 건강한 성 가치관을 정립하는 데 주안점을 둔다.","n":["장애 정도가 심한 학생의 교육적 요구에 따라 임산부 경험 교육 용품인 임신 체험 재킷과 같은 교구, 모형 등을 활용하여 임신 초기･중기･말기의 신체 변화를 구분하는 것으로 성취기준을 재구성하여 적용할 수 있다. 디지털 자료 및 가상현실(VR), 증강현실(AR), 메타버스 등 디지털 플랫폼을 활용하여 임신과 출산의 과정을 학습하는 것으로 성취기준을 재구성할 수 있다."],"p":462,"b":3},{"c":"[12보건03-02]","k":"기본","sk":"","s":"보건","g":"고등학교 1~3학년","d":"건강한 성","t":"생명을 존중하는 태도를 바탕으로 바람직한 부모 역할을 찾는다.","m":"자녀의 건강한 성장을 위한 바람직한 부모의 역할이 무엇인지 살펴보고, 올바른 생명 윤리 의식을 기르기 위해 설정하였다. 부모의 의무와 책임, 자녀 성장에 따른 부모 역할 등의 내용을 다룬다. 임신을 준비하는 시기부터 부모의 역할이 수행되어야 함을 알고, 생명 존중과 생명 윤리를 바탕으로 부모가 될 준비를 하는 데 주안점을 둔다.","n":[],"p":462,"b":3},{"c":"[12보건03-03]","k":"기본","sk":"","s":"보건","g":"고등학교 1~3학년","d":"건강한 성","t":"성 상품화와 성폭력의 유형을 알고, 위험으로부터 안전하게 대처한다.","m":"성 상품화와 성폭력의 유형을 알고 각각의 위험을 예방하며 위험 상황에 적절하게 대처하기 위해 설정하였다. 성매매, 성적 물품 판매, 성적 착취, 강간, 강제 추행, 디지털 성범죄, 불법 촬영 및 유포, 불법 촬영물을 이용한 협박이나 강요, 성적 위험 상황에 대한 예방법 및 대처법 등의 내용을 다룬다. 성폭력 및 성매매 상황을 인식하여 자신과 타인을 성적 위험으로부터 보호하고, 성적 위험 상황 발생 시 적절하게 대처하며 2차 피해와 가해로부터 안전하기 위한 방법을 익히는 데 주안점을 둔다.","n":["장애 정도가 심한 학생의 교육적 요구에 따라 성범죄 피해 발생 시 직접적으로 도움받을 수 있는 지원망을 안내하고 성폭력 상황에서 바로 적용할 수 있는 구체적인 도움 요청 방법 연습하기 등으로 성취기준을 재구성하여 적용할 수 있다."],"p":462,"b":3},{"c":"[12보건03-04]","k":"기본","sk":"","s":"보건","g":"고등학교 1~3학년","d":"건강한 성","t":"성 인권을 이해하고, 성적 의사 결정 상황에서 바르게 표현한다.","m":"성 인권에 대한 이해를 바탕으로 성적 자기 결정권과 성 인지 감수성을 향상하기 위해 설정하였다. 성 차이와 차별, 성 역할 고정 관념과 편견, 성차별적 행동과 언어, 자신의 성적 허용 범위 설정하기, 성적 자기 결정권 주장하기, 타인의 성적 자기 결정권 존중하기 등의 내용을 다룬다. 성적 의사 결정 상황에서 자신의 의사를 정확히 표현하고 타인의 의사를 수용하며 성 인권을 존중하는 태도를 기르는 데 주안점을 둔다.","n":[],"p":462,"b":3},{"c":"[12보건04-01]","k":"기본","sk":"","s":"보건","g":"고등학교 1~3학년","d":"생활 속 안전","t":"학교폭력과 사이버 폭력의 위험을 알고 예방하며 폭력 상황에 적절히 대처한다.","m":"학교폭력과 사이버 폭력의 위험과 유형을 알고 학교폭력과 사이버 폭력의 예방 및 위험 상황에서 자신과 타인을 보호하는 능력을 기르기 위해 설정하였다. 학교폭력의 원인 및 유형, 폭력 상황에서의 가해자, 피해자, 방관자의 의미, 사이버 폭력의 의미와 유형, 학교폭력 및 사이버 폭력의 예방법과 올바른 대처 방법 등을 다룬다. 학교폭력 및 사이버 폭력이 발생하지 않도록 예방의 중요성을 알고 실천하는 데 주안점을 둔다.","n":["장애 정도가 심한 학생의 교육적 요구에 따라 학교폭력, 사이버 폭력 상황 구분하기, 올바른 대처 방법 고르기, 도움받을 수 있는 곳이나 사람 찾기 등으로 성취기준을 재구성하여 적용할 수 있다."],"p":464,"b":3},{"c":"[12보건04-02]","k":"기본","sk":"","s":"보건","g":"고등학교 1~3학년","d":"생활 속 안전","t":"사회 재난의 위험을 알고 재난 발생 시 올바르게 대응한다.","m":"인명과 재산에 막대한 피해를 주는 사회 재난에 올바르게 대응하는 능력을 기르기 위해 설정하였다. 화재의 원인과 예방법, 화재 발생 시 대응 및 행동 요령, 화재 신고 요령, 소화기 사용법, 폭발 및 붕괴사고 발생 시 행동 요령 등 여러 유형의 사회 재난으로 인해 발생하는 피해와 올바른 대응 방안 등을 다룬다. 사회 재난 발생 시 안전하고 신속하게 대피하며 올바르게 대응하는 행동 요령을 기르는 데 주안점을 둔다. 특히 많은 사람이 모이는 장소에 가는 경우 참여 규모와 밀집도 등 다양한 사고의 위험 요인을 이해하고, 예방을 위한 안전 수칙과 대응 능력을 길러 안전 행동 습관을 형성하는 데 주안점을 둔다.","n":[],"p":464,"b":3},{"c":"[12보건04-03]","k":"기본","sk":"","s":"보건","g":"고등학교 1~3학년","d":"생활 속 안전","t":"자연 재난의 위험을 알고 재난 발생 시 올바르게 대응한다.","m":"자연 재난은 그 발생을 통제할 수 없고 피해가 크며 광범위하므로 자연 재난 발생 시 대응하는 능력을 길러 피해를 최소화하기 위해 설정하였다. 황사·미세먼지, 지진, 태풍, 폭우, 폭설, 폭염 등과 같이 여러 유형의 자연 재난으로 인해 발생하는 피해와 대응 방안 등을 다룬다. 자연 재난으로 인한 인적, 물적 피해를 최소화할 수 있는 예방책과 자연 재난 발생 시 올바르게 대응하는 능력을 기르는 데 주안점을 둔다.","n":["장애 정도가 심한 학생의 특성을 고려해 다양한 자연 재난 상황 찾기, 재난 상황에서 대응 방법 고르기 또는 표현하기 등으로 성취기준을 재구성하여 적용할 수 있다."],"p":464,"b":3},{"c":"[12보건04-04]","k":"기본","sk":"","s":"보건","g":"고등학교 1~3학년","d":"생활 속 안전","t":"환경오염으로 발생하는 문제점과 건강과의 관계를 알고 적절히 대응한다.","m":"환경오염으로 발생하는 문제와 건강과의 연관성을 알아보고 환경오염으로부터 안전하고 건강한 생활을 영위하기 위한 능력을 기르기 위해 설정하였다. 환경오염으로 발생하는 위험 요소, 환경오염이 일상생활에 미치는 영향, 환경오염과 건강과의 관계 등을 다룬다. 환경오염과 건강과의 관계를 이해하고 환경오염으로 인한 문제의 해결을 위한 적극적이고 긍정적인 태도 및 예방 방법을 적용하는 데 주안점을 둔다.","n":["장애 정도가 심한 학생의 특성을 고려해 환경오염과 관련된 사례 찾기, 환경오염으로 발생할 수 있는 문제점 또는 질병 연결하기 등으로 성취기준을 재구성하여 적용할 수 있다."],"p":464,"b":3},{"c":"[2국01-01]","k":"공통","sk":"","s":"국어(청각장애)","g":"초등학교 1~2학년","d":"듣기⋅말하기","t":"중요한 내용이나 일이 일어난 순서를 고려하며 듣고 말한다.","m":"","n":[],"p":17,"b":2},{"c":"[2국01-02]","k":"공통","sk":"","s":"국어(청각장애)","g":"초등학교 1~2학년","d":"듣기⋅말하기","t":"바르고 고운 말로 서로의 감정을 나누며 듣고 말한다.","m":"이 성취기준은 대화를 나눌 때 자신의 감정을 적절하게 표현함으로써 타인과의 관계를 형성하고 유지하며 발전시키는 능력을 기르기 위해 설정하였다. 기쁨, 슬픔, 사랑, 미움 등 다양한 감정과 관련된 표현 알기, 감정을 표현하는 과정에서 바르고 고운 말을 사용하기, 상대의 감정을 이해하고 수용하기 등을 학습한다.","n":[],"p":17,"b":2},{"c":"[2국01-03]","k":"공통","sk":"","s":"국어(청각장애)","g":"초등학교 1~2학년","d":"듣기⋅말하기","t":"상대의 말을 집중하여 듣고 말차례를 지키며 대화한다.","m":"이 성취기준은 구어 의사소통의 상호 교섭성을 인식하는 출발로서, 대화 상황에서 상대의 말에 집중하여 그 내용을 이해하고 순서를 교대하며 구어 의사소통에 참여하는기본 능력을 기르기 위해 설정하였다. 다음 말할 사람을 선택하여 부르거나, 고갯짓, 시선, 억양 등의 말차례 교환 신호를 활용하여 다음 사람이 말차례를 알아차릴 수 있도록 하기, 말차례 교환 신호를 확인하여 자신의 말차례 지키기 등을 학습한다.","n":[],"p":17,"b":2},{"c":"[2국01-04]","k":"공통","sk":"","s":"국어(청각장애)","g":"초등학교 1~2학년","d":"듣기⋅말하기","t":"자신의 경험이나 생각을 바른 자세로 발표한다.","m":"이 성취기준은 교실에서 자신의 경험이나 생각을 바른 자세로 표현하고 학습에 참여할 수 있는 기본 능력을 기르기 위해 설정하였다. 자신의 경험이나 생각을 동료 학습자들 앞에서 간단히 말하기, 자신의 경험이나 배경지식을 바탕으로 말하기, 수업 시간에 바른 자세로 서서 말하기, 듣는 사람을 바라보며 말하기, 적절한 크기의 소리로 말하기 등을 학습한다.","n":[],"p":17,"b":2},{"c":"[2국01-05]","k":"공통","sk":"","s":"국어(청각장애)","g":"초등학교 1~2학년","d":"듣기⋅말하기","t":"듣기와 말하기에 관심과 흥미를 가진다.","m":"이 성취기준은 삶에서 듣기⋅말하기의 즐거움을 느끼고 듣기⋅말하기의 중요성을 인식하도록 하기 위해 설정하였다. 듣기⋅말하기가 다양한 생각과 감정을 나누며 의사소통하기 위한 기본적인 도구임을 인식하기, 듣기⋅말하기의 역할과 중요성을 직접 경험해 보기, 다양한 놀이를 통해 듣기⋅말하기에 흥미 가지기 등을 학습한다.","n":[],"p":17,"b":2},{"c":"[2국01-06]","k":"공통","sk":"","s":"국어(청각장애)","g":"초등학교 1~2학년","d":"듣기⋅말하기","t":"표현하는 사람의 표정과 동작에 집중하여 수어로 대화한다.","m":"이 성취기준은 청각장애 학생이 수어로 표현된 듣기⋅말하기의 내용을 이해하고수어 대화에 참여할 수 있게 하기 위해 설정하였다. 청각장애 학생이 수어를 통한 듣기⋅말하기 활동에 관심과 흥미를 보이게 하여 수어로 하는 대화에 즐겁게 참여하도록 하는 데 중점을 둔다.","n":[],"p":17,"b":2},{"c":"[2국01-07]","k":"공통","sk":"","s":"국어(청각장애)","g":"초등학교 1~2학년","d":"듣기⋅말하기","t":"말⋅수어로 표현한 질문에 간단한 말⋅수어로 답한다.","m":"이 성취기준은 청각장애 학생이 자신의 주 의사소통 양식에 따라 듣기⋅말하기의 내용을 파악하고 대화 상황에서 적절한 언어적 반응을 하도록 돕기 위해 설정하였다. 각 학생의 개별적인 의사소통 양식에 맞추어 개별화된 질문을 제공하여 청각장애 학생에게 적절한 대답을 이끌어내는 데 중점을 둔다.","n":[],"p":17,"b":2},{"c":"[2국02-01]","k":"공통","sk":"","s":"국어(청각장애)","g":"초등학교 1~2학년","d":"읽기","t":"글자, 단어, 문장, 짧은 글을 정확하게 소리 내어 읽는다.","m":"","n":[],"p":19,"b":2},{"c":"[2국02-02]","k":"공통","sk":"","s":"국어(청각장애)","g":"초등학교 1~2학년","d":"읽기","t":"의미가 잘 드러나도록 문장과 짧은 글을 알맞게 띄어 읽는다.","m":"이 성취기준은 글을 의미 단위에 알맞게 띄어 읽으며 글의 의미를 파악하는 능력을 기르기 위해 설정하였다. 글을 읽으면서 의미 단위를 인식하고 이에 맞게 띄어 읽는 것은 글의 의미를 정확하게 파악하고 읽기 유창성을 높이는 데 중요한 요소이다. 글의 의미를 이해하기 위해 의미 단위에 따른 어구나 어절 단위 등으로 띄어 읽기, 주어부와 서술어부 등을 단위로 하여 띄어 읽기, 문장 부호에 따라 문장 단위를 인식하면서 띄어 읽기, 쉬는 지점, 쉼의 길이에 유의하며 띄어 읽기 등을 학습한다.","n":[],"p":19,"b":2},{"c":"[2국02-03]","k":"공통","sk":"","s":"국어(청각장애)","g":"초등학교 1~2학년","d":"읽기","t":"글을 읽고 중심 내용을 확인한다.","m":"","n":[],"p":19,"b":2},{"c":"[2국02-04]","k":"공통","sk":"","s":"국어(청각장애)","g":"초등학교 1~2학년","d":"읽기","t":"인물의 마음이나 생각을 짐작하고 이를 자신과 비교하며 글을 읽는다.","m":"이 성취기준은 글에 등장하는 인물의 마음과 생각을 상상하는 능력과 타인에 대한 공감 능력을 기르기 위해 설정하였다. 인물의 마음이나 생각을 짐작하는 것은 글의 내용에 대한 이해와 더불어 실제 주변 인물에 대한 이해를 높이는 데 도움이 된다. 인물의 처지나 상황을 파악하기, 자신의 경험에 비추어 인물의 마음이나 생각 짐작하기, 감정을 드러내는 다양한 어휘를 활용하여 인물의 마음이나 생각을 표현하기, 인물의 마음이나 생각과 관련된 자신의 경험이나 생각을 떠올리며 비교하기 등을 학습한다.","n":[],"p":19,"b":2},{"c":"[2국02-05]","k":"공통","sk":"","s":"국어(청각장애)","g":"초등학교 1~2학년","d":"읽기","t":"읽기에 흥미를 갖고 즐겨 읽는 태도를 지닌다.","m":"","n":[],"p":19,"b":2},{"c":"[2국02-06]","k":"공통","sk":"","s":"국어(청각장애)","g":"초등학교 1~2학년","d":"읽기","t":"다양한 수어 영상 자료에서 지문자나 수어로 표현된 단어를 읽고 의미를 파악한다.","m":"이 성취기준은 청각장애 학생이 한글의 자음자와 모음자를 수어의 지문자로 익히고 나아가 수어 읽기 능력을 향상할 수 있도록 설정하였다. 정확한 수형의 지문자로 친숙한단어들을 지속적으로 제공해 주어 학생이 지문자와 수어 단어를 정확히 읽어 내는 능력을 기르는 데 중점을 둔다.","n":[],"p":19,"b":2},{"c":"[2국03-01]","k":"공통","sk":"","s":"국어(청각장애)","g":"초등학교 1~2학년","d":"쓰기","t":"글자와 단어를 바르게 쓴다.","m":"","n":[],"p":21,"b":2},{"c":"[2국03-02]","k":"공통","sk":"","s":"국어(청각장애)","g":"초등학교 1~2학년","d":"쓰기","t":"쓰기에 흥미를 가지며 자신의 생각이나 느낌을 문장으로 표현한다.","m":"이 성취기준은 쓰기에 흥미를 갖고 자신의 생각이나 느낌을 문장으로 표현하는 능력을 기르기 위해 설정하였다. 쓰기에 대한 긍정적인 인식을 갖고 문장 쓰기를 수행하는 것은 필자로 성장하기 위한 출발점에 해당한다. 자신의 생각이나 느낌을 문장으로 구성하는 방법, 꾸며 주는 말을 넣어 자신의 생각이나 느낌을 표현하는 방법 등을 학습한다. 이를 통해 학습자가 자신이 쓰고 싶은 화제나 주제를 찾아 다양한 문장으로 표현하는 즐거움을 경험하도록 한다.","n":[],"p":21,"b":2},{"c":"[2국03-03]","k":"공통","sk":"","s":"국어(청각장애)","g":"초등학교 1~2학년","d":"쓰기","t":"주변 소재에 대해 소개하는 글을 쓴다.","m":"","n":[],"p":21,"b":2},{"c":"[2국03-04]","k":"공통","sk":"","s":"국어(청각장애)","g":"초등학교 1~2학년","d":"쓰기","t":"겪은 일을 표현하는 글을 자유롭게 쓰고, 쓴 글을 함께 읽고 생각이나 느낌을 나눈다.","m":"이 성취기준은 자신이 겪은 일을 내용이나 형식에 제한 없이 자유롭게 표현하고, 그 과정과 결과를 독자와 공유하는 데에 필요한 능력과 태도를 기르기 위해 설정하였다. 자신이 겪은 일 중 글로 쓰고 싶은 경험 떠올리기, 경험에 대한 자신의 생각이나 느낌 떠올리기, 자유롭게 표현하기, 쓴 글을 함께 읽고 반응하기 등을 학습한다.","n":[],"p":21,"b":2},{"c":"[2국03-05]","k":"공통","sk":"","s":"국어(청각장애)","g":"초등학교 1~2학년","d":"쓰기","t":"수어 사용에 흥미를 가지고 글자나 단어를 지문자로 바르게 표현한다.","m":"이 성취기준은 청각장애 학생이 자발적으로 지문자를 사용하여 자신의 생각을 자유롭게 표현할 수 있도록 돕기 위해 설정하였다. 청각장애 학생이 스스로 다양한 단어와 문장을 지문자를 활용해 자유자재로 표현하도록 하는 데 중점을 둔다.","n":[],"p":21,"b":2},{"c":"[2국04-01]","k":"공통","sk":"","s":"국어(청각장애)","g":"초등학교 1~2학년","d":"문법","t":"한글 자모의 이름과 소릿값을 알고 정확하게 발음하고 쓴다.","m":"","n":[],"p":22,"b":2},{"c":"[2국04-02]","k":"공통","sk":"","s":"국어(청각장애)","g":"초등학교 1~2학년","d":"문법","t":"소리와 표기가 다를 수 있음을 알고 단어를 바르게 읽고 쓴다.","m":"","n":[],"p":22,"b":2},{"c":"[2국04-03]","k":"공통","sk":"","s":"국어(청각장애)","g":"초등학교 1~2학년","d":"문법","t":"문장과 문장 부호를 알맞게 쓰고 한글에 호기심을 가진다.","m":"이 성취기준은 문장으로 의사소통을 하기 위해 필요한 기초적인 문식성을 기르고, 글자, 단어, 문장을 주의 깊게 관찰하고 탐구하는 자세를 기르기 위해 설정하였다. 자신의 생각을 문장으로 쓰는 것은 의사소통 능력의 핵심으로서, 특히 한글 학습 초기에는 음성 언어와는 다른 문자 언어의 특성을 이해하는 것이 중요하다. 문장 부호의 이름과 쓰임, 표현 의도에 따라 평서문⋅의문문⋅감탄문 등 다양한 종류의 문장 쓰기와 그에 따른 문장 부호 사용하기를 다루되, 문장 부호 사용의 필요성을 깨닫고 문장을 비롯하여 문장을 이루는 글자, 단어에도 호기심을 갖도록 한다.","n":[],"p":22,"b":2},{"c":"[2국04-04]","k":"공통","sk":"","s":"국어(청각장애)","g":"초등학교 1~2학년","d":"문법","t":"한글 자모의 지문자를 알고 바르게 쓰며 수어에 호기심을 가진다.","m":"이 성취기준은 한글 자모의 지문자를 이해하고 수어에 호기심을 갖게 하기 위해 설정하였다. 한글 자모에 대응하는 지문자가 있다는 것을 알고, 음성 및 문자 언어와 다른 언어가 있다는 것을 이해하는 것이 중요하다. 다양한 손동작을 활용해 자신의 생각을 전달하고, 상대방의 의도를 파악하는 과정을 이해함으로써 수어의 필요성을 느끼고, 수어 사용에 호기심을 갖도록 하는 데 중점을 둔다.","n":[],"p":22,"b":2},{"c":"[2국05-01]","k":"공통","sk":"","s":"국어(청각장애)","g":"초등학교 1~2학년","d":"문학","t":"말놀이, 낭송 등을 통해 말의 재미와 즐거움을 느낀다.","m":"이 성취기준은 흥미로운 말놀이와 분위기를 살린 낭송을 통해 언어 활동의 재미와 즐거움을 느끼며 언어적 감수성을 기르기 위해 설정하였다. 일상에서 쉽게 접할 수 있는 작품은 물론 일상적 대화 등을 통해 언어의 놀이적 성격을 인지하도록 하고, 의성어와 의태어, 규칙적으로 반복되는 소리, 언어유희, 재치 있는 문답, 수수께끼, 끝말잇기 등에서 말놀이의 재미와 가치를 느끼게 한다. 또한 작품의 느낌과 분위기를 살려 낭송해 보면서 소리 크기나 말의 속도, 어조 등을 달리함에 따라 다양한 느낌을 전달할 수 있음을 알고 문학을 즐겨 향유하도록 한다.","n":[],"p":23,"b":2},{"c":"[2국05-02]","k":"공통","sk":"","s":"국어(청각장애)","g":"초등학교 1~2학년","d":"문학","t":"작품을 듣거나 읽으면서 느끼거나 생각한 점을 말한다.","m":"이 성취기준은 학습자들이 작품에 대해 느끼거나 생각한 바를 다른 이들과 나누는 과정에서 문학에 대해 더욱 흥미를 느끼고, 주체적으로 작품을 수용하는 능력을 기르기 위해 설정하였다. 학습자의 발달과 정서적 측면을 고려하여 시, 노래, 이야기 등 다양한 갈래의 작품을 제시하고, 학습자가 이들 작품을 대상으로 자신의 생각이나 느낌을 표현할 수 있도록 한다. 이 과정에서 학습자로 하여금 작품에 대한 다른 학습자들의 말을 경청하게 하고, 사람마다 작품을 다르게 받아들일 수 있다는 점을 이해하게 한다.","n":[],"p":23,"b":2},{"c":"[2국05-03]","k":"공통","sk":"","s":"국어(청각장애)","g":"초등학교 1~2학년","d":"문학","t":"작품 속 인물의 모습, 행동, 마음을 상상하여 시, 노래, 이야기, 그림 등으로 표현한다.","m":"","n":[],"p":23,"b":2},{"c":"[2국05-04]","k":"공통","sk":"","s":"국어(청각장애)","g":"초등학교 1~2학년","d":"문학","t":"시나 노래, 이야기에 흥미를 가진다.","m":"","n":[],"p":23,"b":2},{"c":"[2국05-05]","k":"공통","sk":"","s":"국어(청각장애)","g":"초등학교 1~2학년","d":"문학","t":"노래, 수어 동시, 수어 이야기 등에 대한 느낀 점을 표현한다.","m":"이 성취기준은 학습자들이 작품에 대해 느낀 점을 다양한 의사소통 표현 수단을활용하여 주체적으로 표현하는 능력을 기르도록 설정하였다. 청각장애 학생은 노래, 동시, 이야기 등을 통하여 문학 작품에 관심을 기울이고 이를 주도적으로 표현할 때 학습자가 선호하는 의사소통 양식에 따라 자신이 작품을 통해 느끼는 감정을 적극적으로 표현하도록 한다.","n":[],"p":23,"b":2},{"c":"[2국06-01]","k":"공통","sk":"","s":"국어(청각장애)","g":"초등학교 1~2학년","d":"매체","t":"일상의 다양한 매체와 매체 자료에 흥미와 관심을 가진다.","m":"이 성취기준은 매체와 관련된 일상 경험을 나눔으로써 매체와 매체 자료에 대한 흥미와 관심을 갖고 매체의 가치와 필요성을 자연스럽게 인식하도록 하기 위해 설정하였다. 매체란 소통을 매개하는 도구, 기술, 환경으로, 책, TV, 스마트폰, 컴퓨터, 태블릿,인터넷 등이 이에 속하며, 매체 자료에는 그림책, 만화, 뉴스, 광고, 웹툰, 애니메이션, 영화 등이 있다. 이 성취기준에서는 학습자가 친숙한 매체와 매체 자료를 토대로 일상의 경험을 매체와 연결 지어 이야기하여 매체와 매체 자료의 개념과 쓰임을 이해하고 다양한 매체와 매체 자료에 흥미와 관심을 갖도록 한다.","n":[],"p":25,"b":2},{"c":"[2국06-02]","k":"공통","sk":"","s":"국어(청각장애)","g":"초등학교 1~2학년","d":"매체","t":"일상의 경험과 생각을 글과 그림으로 표현한다.","m":"이 성취기준은 글과 그림으로 자신의 생각과 느낌을 표현하는 즐거움을 경험하도록 하기 위해 설정하였다. 글, 그림(또는 사진, 이모티콘 등)을 활용하여 자신, 친구, 가족, 학교, 교실 등 친숙한 주제에 대해 표현하거나 그림일기를 작성해 보는 활동을 통해 자신의 경험과 생각을 다양한 방식으로 표현해 보는 데 중점을 둔다.","n":[],"p":25,"b":2},{"c":"[2국06-03]","k":"공통","sk":"","s":"국어(청각장애)","g":"초등학교 1~2학년","d":"매체","t":"수어 및 자막 지원 매체와 매체 자료에 관심을 가진다.","m":"이 성취기준은 수어 및 자막 지원 매체와 매체 자료에 흥미와 관심을 갖고 수어및 자막 지원 매체의 가치와 필요성을 자연스럽게 인식하기 위해 설정하였다. 수어 및 자막 지원이 되는 스마트폰, 태블릿, 컴퓨터, 텔레비전 등의 쓰임을 이해하고 다양한 매체와 매체 자료에 흥미와 관심을 갖도록 한다.","n":[],"p":25,"b":2},{"c":"[4국01-01]","k":"공통","sk":"","s":"국어(청각장애)","g":"초등학교 3~4학년","d":"듣기⋅말하기","t":"중요한 내용과 주제를 파악하며 듣고 들은 내용을 요약한다.","m":"","n":[],"p":26,"b":2},{"c":"[4국01-02]","k":"공통","sk":"","s":"국어(청각장애)","g":"초등학교 3~4학년","d":"듣기⋅말하기","t":"원인과 결과의 관계를 고려하여 내용을 예측하며 듣고 말한다.","m":"","n":[],"p":26,"b":2},{"c":"[4국01-03]","k":"공통","sk":"","s":"국어(청각장애)","g":"초등학교 3~4학년","d":"듣기⋅말하기","t":"상황에 적절한 준언어⋅비언어적 표현을 활용하여 듣고 말한다.","m":"이 성취기준은 구어 의사소통 상황에서 억양, 어조, 속도 등의 준언어적 표현 요소와표정, 시선, 몸동작, 자세 등의 비언어적 표현 요소를 활용하여 의미를 효과적으로 전달하고 이해할 수 있는 능력을 기르기 위해 설정하였다. 다양한 상황에 알맞은 준언어⋅비언어적 표현의 중요성 이해하기, 준언어⋅비언어적 표현의 의미와 효과 파악하기, 준언어⋅비언어적 표현의 적절성 점검하기, 상황에 적절한 준언어⋅비언어적 표현 활용하기 등을 학습한다.","n":[],"p":26,"b":2},{"c":"[4국01-04]","k":"공통","sk":"","s":"국어(청각장애)","g":"초등학교 3~4학년","d":"듣기⋅말하기","t":"상황과 상대의 입장을 이해하고 예의를 지키며 대화한다.","m":"","n":[],"p":26,"b":2},{"c":"[4국01-05]","k":"공통","sk":"","s":"국어(청각장애)","g":"초등학교 3~4학년","d":"듣기⋅말하기","t":"목적과 주제에 알맞게 자료를 정리하여 자신감 있게 발표한다.","m":"이 성취기준은 교과 학습 상황을 비롯하여 다양한 상황에서 필요한 기초적인 발표 능력을 기르기 위해 설정하였다. 주어진 자료에서 발표 목적과 주제에 알맞은 내용 중심으로 발표 내용 정리하기, 준비한 내용이 명확하게 전달되는지를 점검하며 발표 연습하기, 준언어⋅비언어적 표현을 효과적으로 사용하는지 점검하며 발표 연습하기, 연습 과정에서 부족했던 부분을 조정하여 자신감을 가지고 발표하기 등을 학습한다.","n":[],"p":26,"b":2},{"c":"[4국01-06]","k":"공통","sk":"","s":"국어(청각장애)","g":"초등학교 3~4학년","d":"듣기⋅말하기","t":"주제에 적절한 의견과 이유를 제시하고 서로의 생각을 교환하며 토의한다.","m":"이 성취기준은 문제를 합리적으로 해결하기 위한 기초 능력으로서 토의 능력을 기르기 위해 설정하였다. 주제에 적절한 의견을 이유와 함께 제시하기, 상대의 의견을 구체적으로 파악하거나 의견과 이유의 적절성을 점검하기 위해 서로 묻고 답하기, 다른 사람의 생각 존중하기 등을 학습한다.","n":[],"p":26,"b":2},{"c":"[4국01-07]","k":"공통","sk":"","s":"국어(청각장애)","g":"초등학교 3~4학년","d":"듣기⋅말하기","t":"말⋅수어로 듣거나 본 내용에서 주제나 의견을 찾아내어 대화를 나눈다.","m":"듣기 자료만으로는 내용 이해가 어려운 청각장애 학생들에게 자막이 있는 영상 자료나 수어 영상 자료를 제공하여 듣기 자료의 내용을 확실히 이해한 후 말하기 활동에 참여할 수 있도록 하고자 이 성취기준을 설정하였다. 듣기 자료에 대한 확실한 파악이 이루어진 후에는 학생이 자신의 주 의사소통 양식에 따라 구어나 수어로 주제나 의견 등에 대한 말하기 활동에 충분히 참여할 수 있다.","n":[],"p":26,"b":2},{"c":"[4국02-01]","k":"공통","sk":"","s":"국어(청각장애)","g":"초등학교 3~4학년","d":"읽기","t":"글의 의미를 파악하며 유창하게 글을 읽는다.","m":"이 성취기준은 글의 의미에 따라 효과적인 표현 방법을 사용하여 유창하게 글을읽는 능력을 기르기 위해 설정하였다. 글의 유형에 따라 글의 분위기, 장면, 인물의 특성 등을 파악하고 이를 고려하되, 글 읽기, 음색, 어조, 속도, 억양 등의 표현 요소를 활용하여 글을 읽으면서 글의 의미를 효과적으로 표현하기 등을 학습한다.","n":[],"p":28,"b":2},{"c":"[4국02-02]","k":"공통","sk":"","s":"국어(청각장애)","g":"초등학교 3~4학년","d":"읽기","t":"문단과 글에서 중심 생각을 파악하고 내용을 간추린다.","m":"","n":[],"p":28,"b":2},{"c":"[4국02-03]","k":"공통","sk":"","s":"국어(청각장애)","g":"초등학교 3~4학년","d":"읽기","t":"
