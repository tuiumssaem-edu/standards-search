 안전 규칙, 안전한 작업, 직장에서 안전 등을 다룬다. 시각이 불편하여 작업 상황에서 발생할 수 있는 안전사고를 예방하고, 안전 규칙을 실천하도록 한다.","n":[],"p":568,"b":2},{"c":"[12직자04-01]","k":"선택","sk":"전문 교과(직업·생활)","s":"직업과 자립","g":"고등학교 1~3학년","d":"직업의 이해","t":"도시 농업 정보를 수집하고, 관련 직무를 탐색하고 경험한다.","m":"도시 농업 직종의 정보를 수집하고 관련된 직무를 탐색해 도시 농업 직업을 이해하도록 설정하였다. 재배와 사육 관련 직업 탐색, 하는 일 알아보기, 현장 체험을 다룬다. 시각중복장애 학생이 자신의 직업적 흥미와 적성을 기반으로 재배⋅사육 직무를 탐색하고 경험해 보도록 한다.","n":[],"p":570,"b":2},{"c":"[12직자04-02]","k":"선택","sk":"전문 교과(직업·생활)","s":"직업과 자립","g":"고등학교 1~3학년","d":"직업의 이해","t":"제조업 정보를 수집하고, 관련 직무를 탐색하고 경험한다.","m":"제조업 직종의 정보를 수집하고 관련 직무를 탐색해 제조업 직업을 이해하게 하고자 설정하였다. 임가공, 식품 제조, 인쇄물 제조 등에 관한 정보 수집과 탐색을 주요 내용으로 다룬다. 시각중복장애 학생이 제조 생산과 관련한 직무를 탐색하고 경험해 봄으로써 자신의 직업적 흥미와 적성을 확인하고 표현하도록 한다.","n":[],"p":570,"b":2},{"c":"[12직자04-03]","k":"선택","sk":"전문 교과(직업·생활)","s":"직업과 자립","g":"고등학교 1~3학년","d":"직업의 이해","t":"서비스업 정보를 수집하고, 관련 직무를 탐색하고 경험한다.","m":"서비스업 직종의 정보를 수집하고 관련 직무를 탐색하며 서비스업 직업을 이해하게 하고자 설정하였다. 청소, 세탁, 사무, 사서, 환경미화 등에 관한 정보 수집과 탐색등을 다룬다. 시각중복장애 학생이 서비스업과 관련한 직무를 탐색하고 경험해 봄으로써 자신의 직업적 흥미와 적성을 확인하고 표현하는 데 중점을 둔다.","n":[],"p":570,"b":2},{"c":"[12직자04-04]","k":"선택","sk":"전문 교과(직업·생활)","s":"직업과 자립","g":"고등학교 1~3학년","d":"직업의 이해","t":"도시 농업과 관련한 기초적인 기능을 익히고, 자신의 적성과 흥미에 맞는 직무를 파악한다.","m":"도시 농업 직종의 기초적인 기능을 익히고 수행함으로써 도시 농업에 종사하는직업인으로 적합한지 알아보게 하고자 설정하였다. 채소 기르기, 과일 기르기, 토경 재배, 수경 재배, 분재, 곤충 사육 등의 내용을 다룬다. 시각중복장애 학생이 도시 농업 관련 직무를 수행해 봄으로써 강점을 보이는 직무와 도전 가능한 직무를 확인하고 흥미와 자신감을 향상하도록 한다.","n":[],"p":570,"b":2},{"c":"[12직자04-05]","k":"선택","sk":"전문 교과(직업·생활)","s":"직업과 자립","g":"고등학교 1~3학년","d":"직업의 이해","t":"제조업과 관련한 기초적인 기능을 익히고, 자신의 적성과 흥미에 맞는 직무를 파악한다.","m":"제조업 직종의 기초적인 기능을 익히고 수행함으로써 제조업에 종사하는 직업인으로 적합한지 알아보게 하고자 설정하였다. 임가공, 식품 제조, 인쇄물 제조 등의 내용을 다룬다. 시각중복장애 학생이 제조업 관련 직무를 수행해 봄으로써 강점을 보이는 직무와 도전 가능한 직무를 확인하고 흥미와 자신감을 높이도록 한다.","n":[],"p":570,"b":2},{"c":"[12직자04-06]","k":"선택","sk":"전문 교과(직업·생활)","s":"직업과 자립","g":"고등학교 1~3학년","d":"직업의 이해","t":"서비스업과 관련한 기초적인 기능을 익히고, 자신의 적성과 흥미에 맞는 직무를 파악한다.","m":"서비스업 직종의 기초적인 기능을 익히고 수행함으로써 서비스업에 종사하는직업인으로 적합한지 알아보게 하고자 설정하였다. 청소, 세탁, 사무, 사서, 환경미화 등의 내용을 다룬다. 시각중복장애 학생이 서비스업 관련 직무를 수행해 봄으로써 강점을 보이는 직무와 도전 가능한 직무에 관심을 갖도록 한다.","n":[],"p":570,"b":2},{"c":"[12직자04-07]","k":"선택","sk":"전문 교과(직업·생활)","s":"직업과 자립","g":"고등학교 1~3학년","d":"직업의 이해","t":"다양한 작업 실습을 경험하며 직업생활을 준비하는 데 필요한 기초 직업 능력의 핵심역량을 기른다.","m":"다양한 직업 실습을 해 보며 직업생활을 준비하는 데 필요한 기초 직업 능력을 기르도록 하고자 설정하였다. 직업 정보를 수집하고 탐색하기, 다양한 직업에 필요한 기초 기능 익히기 등의 활동에서 발생하는 문제 해결, 자기 관리, 의사소통하기 등의 내용을 다룬다. 다양한 환경에서 직업 실습을 경험해 봄으로써 직업 능력, 자기 관리 능력, 의사소통 능력, 문제 해결 능력과 같은 기초 직업 역량을 기르도록 한다.","n":[],"p":570,"b":2},{"c":"[12직자05-01]","k":"선택","sk":"전문 교과(직업·생활)","s":"직업과 자립","g":"고등학교 1~3학년","d":"직업의 실제","t":"직업생활에 필요한 자기 관리 기술을 익혀 수행한다.","m":"안정된 직업생활 유지에 필요한 자기 관리 기술을 익히게 하고자 설정하였다. 건강과 안전, 금전 관리, 작업 태도 등을 다룬다. 학생의 장애 특성과 일상생활 기술 능력을 고려하여 직업을 준비하는 데 필요한 자기 관리 기술을 향상하는 데 중점을 둔다.","n":[],"p":572,"b":2},{"c":"[12직자05-02]","k":"선택","sk":"전문 교과(직업·생활)","s":"직업과 자립","g":"고등학교 1~3학년","d":"직업의 실제","t":"작업 현장을 이해하고, 현장 실습 전 사전 준비 사항을 점검한다.","m":"현장 실습을 이해하고 이에 필요한 사전 준비 사항을 알고, 점검하여 안전하게 작업을 수행하게 하고자 설정하였다. 현장 실습에서 지켜야 할 작업 순서와 유의해야 할 안전 규칙, 안전한 현장 실습 환경 확인과 같이 시각중복장애 학생이 스스로 안전을 지키고, 사고를 예방하는 방법 등을 다룬다. 모의 상황과 실제 사업체와 연계한 현장 실습을 경험해 봄으로써 현장 실습에서 지켜야 할 작업 규칙을 준수하고 안전한 작업 태도를 기르는 데 중점을 둔다.","n":[],"p":572,"b":2},{"c":"[12직자05-03]","k":"선택","sk":"전문 교과(직업·생활)","s":"직업과 자립","g":"고등학교 1~3학년","d":"직업의 실제","t":"실습생으로서 역할과 책임을 알고 필요한 태도를 갖추어 현장 실습을 수행한다.","m":"현장 실습생으로서 필요한 소양을 갖추어 자립적으로 현장 실습을 수행할 수있는 능력을 기르게 하고자 설정하였다. 현장 실습의 자세와 태도, 현장 실습생의 역할과 책임, 현장 실습 참여 등을 다룬다. 모의 상황과 실제 사업체와 연계한 현장 실습을 해 보며 근로자로서 자신의 역할과 책임을 이해하고, 자신의 권리를 요구하고 역할과 책임을 실천하는 태도를 기르도록 한다.","n":[],"p":572,"b":2},{"c":"[12직자05-04]","k":"선택","sk":"전문 교과(직업·생활)","s":"직업과 자립","g":"고등학교 1~3학년","d":"직업의 실제","t":"일과 여가의 의미를 이해하고 지역사회를 활용하여 여가 활동을 즐긴다.","m":"시각중복장애 학생이 일과 여가를 이해하고, 지역사회를 활용하여 건강하고 안정된 직업생활을 유지하기 위해 설정하였다. 개인 여가 활동, 단체 여가 활동, 실내 여가 활동, 실외 여가 활동의 종류와 활용하는 방법 등을 다룬다. 지역사회를 활용한 다양한 여가 활동을 경험해 봄으로써 일과 여가를 이해하고, 건강하고 안정된 직업생활을 유지하고 실천하는 데 주안점을 둔다.","n":[],"p":572,"b":2},{"c":"[12사적01-01]","k":"선택","sk":"전문 교과(직업·생활)","s":"사회적응","g":"고등학교 1~3학년","d":"생활 적응","t":"깨끗한 용모와 단정한 옷차림을 계획하고 스스로 관리한다.","m":"자신의 모습을 단장하고 관리하는 것은 대인 관계를 형성하거나 일상의 생활에서 적응과 직업생활에서 적응에 필수이다. 용모와 옷차림을 스스로 계획하고 단장하는 등 생활에 적응에 필요한 내용을 다룬다. 성인으로서 삶을 영위하기 위한 기본적인 신변 자립과 자기 관리 기술을 익히면서 자립생활로 나아가게 하는 데 중점을 둔다.","n":[],"p":582,"b":2},{"c":"[12사적01-02]","k":"선택","sk":"전문 교과(직업·생활)","s":"사회적응","g":"고등학교 1~3학년","d":"생활 적응","t":"가정생활에 필요한 기술을 익혀 가정을 관리하는 능력을 기른다.","m":"주거 공간은 개인이나 가족의 삶이 이루어지는 중심 장소이므로 누구에게나 가정생활에 필요한 기술과 능력이 필요하다. 식품 조리, 청소, 세탁과 같은 기본적인 가정생활 기술을 익히고, 생활 가전 기기를 안전하게 운용하고 관리하는 방법을 다룬다. 가정생활에 필요한 기본적인 기술을 익히고 가정에서 실제로 적용하게 하는 데 중점을 둔다.","n":[],"p":582,"b":2},{"c":"[12사적01-03]","k":"선택","sk":"전문 교과(직업·생활)","s":"사회적응","g":"고등학교 1~3학년","d":"생활 적응","t":"가정생활에서 일어날 수 있는 위기 상황을 알고 대처한다.","m":"안정된 가정생활을 유지하려면 삶의 위기에 대응하는 능력이 기본적으로 필요하다. 가정에서 일어나는 다양한 위기 상황을 이해하고 대처하는 방법을 다룬다. 실제 가정생활에서 발생할 수 있는 다양한 위기 상황에 유연하게 대처하는 자세를 기르는 데 중점을 둔다.","n":[],"p":582,"b":2},{"c":"[12사적01-04]","k":"선택","sk":"전문 교과(직업·생활)","s":"사회적응","g":"고등학교 1~3학년","d":"생활 적응","t":"응급 상황에 대처하고 규칙적인 운동과 체중 관리로 건강을 유지한다.","m":"살아가면서 발생할 수 있는 다양한 응급 상황에 대처하고 규칙적인 운동이나체중 관리로 건강을 관리하고 유지하는 능력을 기르는 데 목적을 둔다. 일상생활에서 발생할 수 있는 응급 상황 대처 요령과 기능을 익히며, 규칙적인 운동과 체중 관리, 올바른 약물 복용 방법 등을 배운다. 건강한 생활을 영위하도록 생활 습관 형성과 질병 예방에 지속적인 관심을 갖도록 한다.","n":[],"p":582,"b":2},{"c":"[12사적01-05]","k":"선택","sk":"전문 교과(직업·생활)","s":"사회적응","g":"고등학교 1~3학년","d":"생활 적응","t":"지역사회의 다양한 자원을 활용하여 여가생활을 즐긴다.","m":"지역사회 내에서 다양한 일상생활과 여가생활을 함으로써 사회 참여와 삶의 질을 높일 수 있다. 지역사회 내 이동 능력 향상을 위한 교통수단 이용, 생활과 밀접하게 관련된 공공 기관 이용, 일상생활 전반의 편의 시설 이용, 여가 활동을 위한 시간과 방법 계획, 여가 시설이나 프로그램 자원 활용 등을 다룬다. 지역사회 기반, 현장 중심의 교육과 활동을 실시해 실제 수행 가능성 제고에 중점을 둔다.","n":[],"p":582,"b":2},{"c":"[12사적01-06]","k":"선택","sk":"전문 교과(직업·생활)","s":"사회적응","g":"고등학교 1~3학년","d":"생활 적응","t":"능동적으로 자기 삶을 관리하고 주도적인 생활을 영위한다.","m":"민주시민으로서 가정과 지역사회에서 개인과 구성원의 역할을 알고 실천하는능력이 필수이다. 한 개인으로서 자신이 삶의 주체가 되어 가정에서 자립생활을 추구하며, 사회의 구성원으로서 역할과 책임을 수행하는 시민의 삶 등을 다룬다. 능동적으로 자기 삶을 관리하고 주체적인 삶을 영위하는 방법을 익히도록 한다.","n":[],"p":582,"b":2},{"c":"[12사적02-01]","k":"선택","sk":"전문 교과(직업·생활)","s":"사회적응","g":"고등학교 1~3학년","d":"직업 적응","t":"일의 개인적⋅사회적 가치를 인식하고 일하고자 하는 의지를 갖는다.","m":"직업생활에 적응을 하려면 직업이 우리에게 주는 가치를 인식하는 것이 중요하다. 삶 전반에 영향을 미치는 직업의의 경제적, 심리적, 사회적 가치 등을 인식하고 일할 의지를 갖도록 한다. 취업한 주변인의 사례에서 동기를 찾고 의지를 갖게 한다.","n":[],"p":583,"b":2},{"c":"[12사적02-02]","k":"선택","sk":"전문 교과(직업·생활)","s":"사회적응","g":"고등학교 1~3학년","d":"직업 적응","t":"자신의 능력과 강점을 알고, 직업적 흥미, 적성, 기술 등을 파악하여 진로를 개발한다.","m":"진로를 선택하고 개발하려면 자신이 좋아하고 잘하는 것, 강점이 무엇인지 파악해야 한다. 직업 흥미, 적성, 능력 등을 탐색하고 직업을 선택하고 개발하는 절차를 다룬다. 심리 검사를 실시하거나 다양한 직종을 탐색 또는 체험해 보며 장차 하고자 하는 직업과 관련된 자신의 특성을 파악하여 진로를 선택하고 개발하도록 한다.","n":[],"p":583,"b":2},{"c":"[12사적02-03]","k":"선택","sk":"전문 교과(직업·생활)","s":"사회적응","g":"고등학교 1~3학년","d":"직업 적응","t":"다양한 직군에서 필요한 지식과 정보, 직무 능력을 바탕으로 직업을 이해한다.","m":"진로를 선택하기에 앞서 직업 세계와 관련한 지식과 정보를 파악해야 한다. 다양한 직군(예: 농수산업, 제조업, 서비스업, 지식⋅정보 통신 산업)을 이해하고, 이러한 직군에서 사용하는 도구의 명칭을 알고 기능을 익힌다. 다양한 직업 세계의 지식과 정보를 바탕으로 자신에게 적합한 직종을 선택하고 준비하는 능력을 기른다.","n":[],"p":583,"b":2},{"c":"[12사적02-04]","k":"선택","sk":"전문 교과(직업·생활)","s":"사회적응","g":"고등학교 1~3학년","d":"직업 적응","t":"과제를 정확하고 신속하게 수행한다.","m":"직장에서 정확하고 신속하게 과제를 수행하는 것은 정해진 시간 동안 질 좋은 제품과 서비스를 생산하는 데 중요하다. 과제를 정확히 수행하려면 주어진 과제와 수행방법을 이해하고 과제 수행 후 점검해야 한다. 신속하게 과제를 수행하도록 정해진 시간을 파악하고 집중하여 과제를 수행할 능력을 기르도록 한다.","n":[],"p":583,"b":2},{"c":"[12사적02-05]","k":"선택","sk":"전문 교과(직업·생활)","s":"사회적응","g":"고등학교 1~3학년","d":"직업 적응","t":"직장생활 유지에 필요한 규칙과 예절, 공감과 존중 등의 태도를 익힌다.","m":"여러 사람이 일하는 직장에서 규칙과 예절을 지키는 것은 안정적이고 즐거운직장생활을 유지하는 데 꼭 필요하다. 직장에서 복장, 시간, 작업 규칙 등을 지키기 위해 다양한 노력을 기울이도록 한다. 아울러 직장에서 상사나 동료에게 알맞은 호칭이나 언어를 사용하며, 적절히 상호 작용을 하여 소중한 직업인으로 생활하도록 한다.","n":[],"p":583,"b":2},{"c":"[12사적02-06]","k":"선택","sk":"전문 교과(직업·생활)","s":"사회적응","g":"고등학교 1~3학년","d":"직업 적응","t":"작업장 내 안전 수칙을 준수하여 안전사고를 예방한다.","m":"작업장에는 다양한 위험 요소가 있으므로 이를 파악하고 예방하는 능력이 필요하다. 작업장에서 지켜야 할 안전 수칙, 사고 예방법, 사고 발생 시 대처법 등을 다룬다. 안전한 직업생활을 유지하는 것이 중요함을 인식하고 안전 수칙을 지키는 습관을 갖도록 한다.","n":[],"p":583,"b":2},{"c":"[12사적03-01]","k":"선택","sk":"전문 교과(직업·생활)","s":"사회적응","g":"고등학교 1~3학년","d":"생애 학습 적응","t":"지속적인 배움의 필요성을 알고 배움의 기술을 익힌다.","m":"인간은 학습을 하면서 성장하고 질 높은 삶을 준비하므로 계속해서 학습에 관심을 가져야 한다. 학습에 필요한 도구를 준비하고, 일정 시간 수업 자세를 유지하면서 집중하며, 지시를 따르고 질문에 답하는 내용을 다룬다. 학습을 효율적으로 수행하도록 적절한 기법이나 전략을 습득하고 활용하는 능력을 기르도록 한다.","n":[],"p":585,"b":2},{"c":"[12사적03-02]","k":"선택","sk":"전문 교과(직업·생활)","s":"사회적응","g":"고등학교 1~3학년","d":"생애 학습 적응","t":"일상생활에서 요구되는 기능적 학업 기술을 익힌다.","m":"지역사회 환경이 요구하는 다양한 활동에 참여하려면 실생활에서 필요한 기능적 읽기, 쓰기, 셈하기 능력 등을 길러야 한다. 다양한 기능적 학업 기술을 습득하고 활용해 봄으로써 학생이 지역사회에서 잘 자립하여 생활하도록 한다.","n":[],"p":585,"b":2},{"c":"[12사적03-03]","k":"선택","sk":"전문 교과(직업·생활)","s":"사회적응","g":"고등학교 1~3학년","d":"생애 학습 적응","t":"평생교육 기관의 정보를 수집하여 제공하는 서비스를 이용한다.","m":"성인으로 살아가는 과정에서 자신이 필요로 하거나 관심 있는 분야에 필요한 능력을 함양하려면 평생교육 기관을 이용하면 된다. 지역사회 내 평생교육 기관을 찾아 강좌 정보 파악하기, 등록하기 등을 다룬다. 자신에게 적합한 평생교육 기관을 탐방하고, 수강에 필요한 내용을 준비하도록 한다.","n":[],"p":585,"b":2},{"c":"[12사적03-04]","k":"선택","sk":"전문 교과(직업·생활)","s":"사회적응","g":"고등학교 1~3학년","d":"생애 학습 적응","t":"대학 교육 기관의 정보를 수집하여 제공하는 서비스를 이용한다.","m":"고등 교육을 희망하는 경우 대학에 입학할 준비를 해야 한다. 희망하는 대학의 정보 찾기, 입학 절차 파악하기, 대학 강좌에 참여하고 제공하는 서비스 활용하기 등을 다룬다. 관심 있는 대학을 탐방하고, 입학에 필요한 내용을 준비하는 능력을 기르도록 한다.","n":[],"p":585,"b":2},{"c":"[12사적03-05]","k":"선택","sk":"전문 교과(직업·생활)","s":"사회적응","g":"고등학교 1~3학년","d":"생애 학습 적응","t":"지속적인 배움을 생활과 직업에서의 적응으로 연계한다.","m":"평생교육이나 대학 교육에서 습득한 지식과 정보와 능력은 자신의 생활과 직업 적응에 활용할 수 있어야 한다. 평생교육 기관이나 대학에서 교육받은 내용을 생활과 일에 연계하는 방법을 다룬다. 단순히 배움에 그치는 것이 아니라 배움의 결과가 삶의 질 향상에 긍정적인 영향을 미치도록 한다.","n":[],"p":585,"b":2},{"c":"[12사적04-01]","k":"선택","sk":"전문 교과(직업·생활)","s":"사회적응","g":"고등학교 1~3학년","d":"사회적 관계 적응","t":"타인의 생각과 감정을 이해한다.","m":"의사소통 과정에서 상대방에게 귀를 기울여 듣고 상대방의 생각과 감정을 이해하는 능력이 중요하다. 다른 사람의 말을 주의 깊게 듣기, 상대방을 존중하며 생각과 감정 이해하기 등을 다룬다. 실제 생활에서 다른 사람의 언어적⋅비언어적⋅사회적 단서를 파악하고 생각과 감정을 이해하는 데 주안점을 둔다.","n":[],"p":586,"b":2},{"c":"[12사적04-02]","k":"선택","sk":"전문 교과(직업·생활)","s":"사회적응","g":"고등학교 1~3학년","d":"사회적 관계 적응","t":"상황, 장소, 대상에 따른 자신의 생각과 감정을 표현한다.","m":"사회적 상호 작용을 하려면 자신의 생각과 감정을 적절히 표현해야 한다. 기본적인 자기 이해를 바탕으로 대상이나 장소, 상황에 따라 자신의 생각과 감정, 느낌을 적절하게 표현하는 방법 등을 다룬다. 실제 생활에서 자신의 생각과 감정을 파악하고 언어, 표정, 행동 등으로 표현하는 능력을 기르도록 한다.","n":[],"p":586,"b":2},{"c":"[12사적04-03]","k":"선택","sk":"전문 교과(직업·생활)","s":"사회적응","g":"고등학교 1~3학년","d":"사회적 관계 적응","t":"타인을 존중하고 배려하는 마음을 갖고 주변인과 더불어 살아간다.","m":"타인을 존중하고 배려하며 예절을 지키는 것은 바른 마음가짐과 몸가짐을 나타내는 행동이며 대인 관계를 형성하고 유지하는 데 필수 요소이다. 타인을 존중하고 배려하는 자세와 태도, 주변인과 원만한 대인 관계를 형성하는 내용을 다룬다. 다른 사람들 사이에서 자신의 역할을 파악하고, 존중과 배려 속에서 더불어 살아가도록 한다.","n":[],"p":586,"b":2},{"c":"[12사적04-04]","k":"선택","sk":"전문 교과(직업·생활)","s":"사회적응","g":"고등학교 1~3학년","d":"사회적 관계 적응","t":"자신의 강점을 발전시키고 약점을 보완할 방법을 찾아 실천한다.","m":"자신을 이해하고 성장하려면 강점과 약점을 파악하고 보완하려고 노력해야 한다. 자신의 강점과 약점 파악하기, 강점을 더욱 발전시키기, 약점을 보완하기 등에 대한 내용을 다룬다. 자신의 강점을 중심으로 미래를 설계하고 약점을 보완하려는 태도를 가지도록 한다.","n":[],"p":586,"b":2},{"c":"[12사적04-05]","k":"선택","sk":"전문 교과(직업·생활)","s":"사회적응","g":"고등학교 1~3학년","d":"사회적 관계 적응","t":"자기 삶과 관련된 전반적인 요소를 주체적으로 선택한다.","m":"자기 삶을 살아가고 성인으로서 권리를 누리고 책임을 다하려면 자기주도적으로 계획을 세우고 주체적으로 선택하는 능력이 중요하다. 자신의 진로 선택하기, 주거 유형 선택하기 등 미래 자기 삶을 계획하고 주체적으로 선택하는 방법 등을 다룬다. 미래를 위해 준비할 사항을 조사하고 미래의 삶을 계획하며, 주체적으로 삶의 방향을 선택하도록 한다.","n":[],"p":586,"b":2},{"c":"[12시자01-01]","k":"선택","sk":"전문 교과(직업·생활)","s":"시각장애인 자립생활","g":"고등학교 1~3학년","d":"보행","t":"목적지로 가는 이동 경로와 정보를 수집하여 보행 계획을 세운다.","m":"이 성취기준은 낯선 지역에서 목적지까지 보행 계획을 세워 이동하는 능력을기르게 하고자 설정하였다. 이동 경로의 정보 수집 방법, 랜드마크와 단서 설정, 보행 계획 수립 과정 및 유의점 등을 다룬다. 보행 계획의 수립 방법과 과정을 모범 사례로 이해하고, 낯선 환경에서 목적지를 찾아가는 데 필요한 보행 정보를 수집하고 효율적인 이동 경로를 계획하도록 한다.","n":[],"p":603,"b":2},{"c":"[12시자01-02]","k":"선택","sk":"전문 교과(직업·생활)","s":"시각장애인 자립생활","g":"고등학교 1~3학년","d":"보행","t":"지역사회 이동에 시각장애인 편의시설과 보행자 앱을 활용한다.","m":"이 성취기준은 지역사회 이동 시 편의시설과 길 안내 앱을 사용하는 능력을기르게 하고자 설정하였다. 점자 표지판, 촉지도, 음향 유도 신호기, 보행자 길 안내 앱 등을 다룬다. 교내에서 보행자 앱의 종류와 기능을 살펴보고, 지역사회 환경에서 시각장애인 편의시설과 보행자 앱을 사용하여 주변 정보를 확인하고 목적지를 찾아가도록 한다.","n":[],"p":603,"b":2},{"c":"[12시자01-03]","k":"선택","sk":"전문 교과(직업·생활)","s":"시각장애인 자립생활","g":"고등학교 1~3학년","d":"보행","t":"보행 장소와 상황에 따라 안내 보행 중에 흰지팡이를 병행하여 사용한다.","m":"이 성취기준은 안내 보행 장소와 상황에 따라 흰지팡이를 함께 사용하는 능력을 기르게 하고자 설정하였다. 보도, 문, 계단, 승강기(에스컬레이터) 등과 같은 보행 장소에서 안내 보행과 흰지팡이 기술의 병행 사용 방법 및 유의점 등을 다룬다. 안내 보행과 흰지팡이 기술을 함께 사용해야 하는 장소와 상황을 사례를 통해 이해하고, 다양한 보행 장소와 상황에서 안내 보행 중에 흰지팡이 기술을 적절히 병행하여 사용하도록 한다.","n":[],"p":603,"b":2},{"c":"[12시자01-04]","k":"선택","sk":"전문 교과(직업·생활)","s":"시각장애인 자립생활","g":"고등학교 1~3학년","d":"보행","t":"안내 보행 기술을 사용하여 지역사회 시설을 방문하고, 시설 환경을 이해한다.","m":"이 성취기준은 지역사회의 다양한 시설들을 안내 보행으로 방문하여 독립 보행을 위한 시설 이용 능력을 기르게 하고자 설정하였다. 관공서, 도서관, 버스 터미널, 지하상가, 체육 시설, 쇼핑센터의 구조와 특징, 시설 이용 방법, 안전한 이동 방법과 유의점 등을 다룬다. 우선 지역사회의 다양한 시설을 직접 방문하여 안내 보행으로 이용하고, 향후 독립 보행으로 이용해야 할 때 이전 보행 정보를 활용하도록 한다.","n":[],"p":603,"b":2},{"c":"[12시자01-05]","k":"선택","sk":"전문 교과(직업·생활)","s":"시각장애인 자립생활","g":"고등학교 1~3학년","d":"보행","t":"장애인 이동 지원 제도와 서비스 기관을 조사하고, 원거리 이동에 활용한다.","m":"이 성취기준은 지역사회를 이동할 때 장애인 이동 지원 서비스를 이용하는 능력을 기르게 하고자 설정하였다. 장애인 이동 지원 제도와 기관, 지원 서비스 등록과 제출 서류, 차량 예약 및 이용 절차 등을 다룬다. 거주 지역의 장애인 이동 지원 기관을 조사하고, 원거리 목적지까지 갈 때 장애인 이동 지원 서비스를 직접 예약하여 이용하도록 한다.","n":[],"p":603,"b":2},{"c":"[12시자01-06]","k":"선택","sk":"전문 교과(직업·생활)","s":"시각장애인 자립생활","g":"고등학교 1~3학년","d":"보행","t":"안내견 보행의 장단점을 알고, 안내견 보행에 관심을 갖는다.","m":"이 성취기준은 자신이 안내견 보행에 적합한 자질과 조건을 갖추고 있는지 알아보기 위해 설정하였다. 안내견 분양 신청 방법, 안내견주의 역할과 책임, 안내견 학교 견학 등을 다룬다. 안내견 학교를 방문하여 안내견 보행을 소개받고 안내견 보행을 체험하는 과정에서 안내견 보행에 관심을 갖도록 한다.","n":[],"p":603,"b":2},{"c":"[12시자01-07]","k":"선택","sk":"전문 교과(직업·생활)","s":"시각장애인 자립생활","g":"고등학교 1~3학년","d":"보행","t":"상업 지역의 구조를 탐색하고, 상업 지역을 안전하게 이동한다.","m":"이 성취기준은 상업 지역에서 안전하고 효율적으로 이동하는 능력을 기르게하고자 설정하였다. 사람이 붐비는 곳, 소음이 많은 곳, 신호등이 없는 건널목, 차도와 인도가 구분되어 있지 않은 곳, 사운드 마스크와 사운드 섀도, 상업 지역에서 관공서나 대중 이용 시설 찾기 등을 다룬다. 다양한 상업 지역을 방문하여 상업 지역의 특징을 탐색하고 분석하며, 상업 지역의 여러 장소에 따라 적합한 보행 기술을 사용하여 안전하게 이동하도록 한다.","n":[],"p":603,"b":2},{"c":"[12시자01-08]","k":"선택","sk":"전문 교과(직업·생활)","s":"시각장애인 자립생활","g":"고등학교 1~3학년","d":"보행","t":"대중교통의 종류와 이용 방법을 조사하고, 원거리 이동에 이용한다.","m":"이 성취기준은 원거리 이동 시 다양한 대중교통 수단을 이용하는 능력을 기르게 하고자 설정하였다. 택시, 마을버스, 시내버스, 고속버스, 지하철, 기차, 선박, 항공기이용 기술과 유의점, 원거리 목적지 찾아가기 등을 다룬다. 온라인예약시스템을 사용해 대중교통 수단을 예약하고, 지역 내 및 지역 간 이동을 할 때 적절한 대중교통 수단을 선정하고 이용하도록 한다.","n":[],"p":603,"b":2},{"c":"[12시자02-01]","k":"선택","sk":"전문 교과(직업·생활)","s":"시각장애인 자립생활","g":"고등학교 1~3학년","d":"일상생활","t":"연령과 상황에 맞게 화장하고, 안전하고 청결하게 제모한다.","m":"이 성취기준은 연령과 상황에 맞게 화장하고, 제모하여 신체를 청결하고 아름답게 관리하는 능력을 기르게 하고자 설정하였다. 화장품의 종류와 용도, 화장 도구와 기능, 기초 화장, 색조 화장, 제모 도구와 기능, 신체 부위에 따른 제모 방법 등을 다룬다. 잔존 감각을 사용하여 적절한 화장품과 화장법을 선택하여 화장하고, 신체 부위에 적합한 제모 용품과 도구를 사용하여 제모하도록 한다.","n":[],"p":605,"b":2},{"c":"[12시자02-02]","k":"선택","sk":"전문 교과(직업·생활)","s":"시각장애인 자립생활","g":"고등학교 1~3학년","d":"일상생활","t":"생활 안전 및 재난 상황을 인식하고 적절한 방법으로 대처한다.","m":"이 성취기준은 생활 안전사고와 재난 상황에 대처하는 능력을 기르게 하고자 설정하였다. 감전, 화재 같은 생활 안전, 태풍, 지진, 홍수 같은 재난 사고, 일반적인 사고 및 재난 대처 방법, 시각장애인의 대처 요령 등을 다룬다. 다양한 안전사고 및 재난 상황에서 잔존 감각과 적절한 방법을 사용하여 대처하거나 대피하도록 한다.","n":[],"p":605,"b":2},{"c":"[12시자02-03]","k":"선택","sk":"전문 교과(직업·생활)","s":"시각장애인 자립생활","g":"고등학교 1~3학년","d":"일상생활","t":"세탁기기와 세제의 사용법을 알고, 세탁기기를 안전하게 사용한다.","m":"이 성취기준은 가정에서 세탁기기를 안전하게 사용하는 능력을 기르게 하고자 설정하였다. 세탁기기의 종류와 용도, 세탁기기의 구조와 기능, 세탁기기의 사용법과유의점, 세제 종류와 투여 방법, 세탁물 분류 방법 등을 다룬다. 의복의 종류와 옷감 소재에 따라 적절한 세제를 선택하고, 잔존 시각과 촉각 및 점자 표시를 사용하여 세탁기기를 효율적으로 조작하도록 한다.","n":[],"p":605,"b":2},{"c":"[12시자02-04]","k":"선택","sk":"전문 교과(직업·생활)","s":"시각장애인 자립생활","g":"고등학교 1~3학년","d":"일상생활","t":"세탁소의 종류와 세탁 서비스를 조사하고, 세탁소를 이용한다.","m":"이 성취기준은 의복의 세탁과 수선을 위해 세탁소를 이용하는 능력을 기르게 하고자 설정하였다. 세탁소의 종류와 기능, 세탁소의 취급 세탁물과 서비스, 코인 세탁소(셀프 빨래방) 이용 방법, 의복 손상 유형과 수선 방법 등을 다룬다. 일반 세탁소, 코인 세탁소, 운동화 빨래방 같은 세탁소의 유형과 차이를 이해하고, 세탁물의 종류와 상황에 따라 적합한 세탁소를 선택하여 이용하도록 한다.","n":[],"p":605,"b":2},{"c":"[12시자02-05]","k":"선택","sk":"전문 교과(직업·생활)","s":"시각장애인 자립생활","g":"고등학교 1~3학년","d":"일상생활","t":"음식의 종류에 따른 식재료와 요리법을 조사하고, 가정식을 요리한다.","m":"이 성취기준은 가정에서 다양한 음식을 조리하는 능력을 기르게 하고자 설정하였다. 가정식의 종류와 조리법, 식재료 종류와 손질 방법, 조리 도구 사용법과 유의점, 설거지 및 식기 관리, 주방 위생 관리 등을 다룬다. 음식의 종류에 따라 필요한 조리 기구와적절한 조리법을 사용하여 가정식 요리를 준비하고, 주방을 위생적으로 관리하도록 한다.","n":[],"p":605,"b":2},{"c":"[12시자02-06]","k":"선택","sk":"전문 교과(직업·생활)","s":"시각장애인 자립생활","g":"고등학교 1~3학년","d":"일상생활","t":"균형 잡힌 식단을 계획하고, 필요한 식재료를 구입한다.","m":"이 성취기준은 스스로 장을 보는 능력을 기르게 하고자 설정하였다. 마트의 구조와 판매 상품, 무인 셀프 계산기 사용법, 온라인 마켓에서 장보기 등을 다룬다. 다양한 식재료를 구입할 수 있는 장소와 구입 방법을 조사하고, 마트에서 장을 보고 무인 셀프 계산기를 사용하거나 온라인 마켓에서 식재료를 구입하도록 한다.","n":[],"p":605,"b":2},{"c":"[12시자02-07]","k":"선택","sk":"전문 교과(직업·생활)","s":"시각장애인 자립생활","g":"고등학교 1~3학년","d":"일상생활","t":"금융 기관과 행정 복지 센터의 서비스를 조사하고, 지역 생활에 이용한다.","m":"이 성취기준은 지역 생활을 위해 금융 기관과 행정 복지 센터를 이용하는 능력을 기르게 하고자 설정하였다. 예금과 적금, 현금 자동 인출기, 신용 카드, 온라인 금융 결제 서비스, 행정 복지 센터의 민원 서비스 유형, 장애인 복지 서비스 유형, 민원 서비스 신청 및 이용 절차, 무인 민원 발급기 사용법 등을 다룬다. 금융 기관과 행정 복지 센터를 방문하여 서비스의 유형과 신청 절차를 살펴보고, 가정생활과 사회생활에 금융 서비스와 장애인 복지 서비스를 이용하도록 한다.","n":[],"p":605,"b":2},{"c":"[12시자02-08]","k":"선택","sk":"전문 교과(직업·생활)","s":"시각장애인 자립생활","g":"고등학교 1~3학년","d":"일상생활","t":"장애인 활동 지원사 제도를 조사하고, 활동 지원 서비스를 이용한다.","m":"이 성취기준은 일상생활에서 장애인 활동 지원사 서비스를 이용하는 능력을 기르게 하고자 설정하였다. 활동 지원사 지원 제도, 활동 지원사 중개 기관, 서비스 신청 절차 및 이용 수칙 등을 다룬다. 우리 지역의 장애인 활동 지원사 지원 정책을 살펴보고, 활동 지원사 서비스를 중개하는 지역 기관을 조사하여 이동 지원, 가사 활동, 신체 활동 등의 서비스를 이용하도록 한다.","n":[],"p":605,"b":2},{"c":"[12시자03-01]","k":"선택","sk":"전문 교과(직업·생활)","s":"시각장애인 자립생활","g":"고등학교 1~3학년","d":"대인 관계","t":"친교 활동 유형과 방법을 조사하고, 친교 활동에 적극적으로 참여한다.","m":"이 성취기준은 다양한 친교 활동에 참여하는 능력을 기르게 하고자 설정하였다. 오프라인 공간에서 친교 활동, 온라인 공간에서 친교 활동, 친교 활동에 따른 유의 사항과 배려 등을 다룬다. 연령에 따른 다양한 친교 활동과 방법을 조사하고, 관심 분야가 비슷한 친구들과 대면 모임과 온라인 커뮤니티에서 적극적인 친교 활동을 하도록 한다.","n":[],"p":607,"b":2},{"c":"[12시자03-02]","k":"선택","sk":"전문 교과(직업·생활)","s":"시각장애인 자립생활","g":"고등학교 1~3학년","d":"대인 관계","t":"사회적 관례의 유형과 목적을 알고, 주변 사람의 경조사에 참여한다.","m":"이 성취기준은 우리나라의 사회적 관례의 유형을 알고 적절히 참여하는 능력을 기르게 하고자 설정하였다. 결혼식, 장례식 등의 각종 경조사와 제례 등을 다룬다. 사회적 관례의 유형과 목적을 조사하고, 사회적 관례에 따라 적절하게 주변 사람을 축하하고 위로하는 자세와 태도를 갖도록 한다.","n":[],"p":607,"b":2},{"c":"[12시자03-03]","k":"선택","sk":"전문 교과(직업·생활)","s":"시각장애인 자립생활","g":"고등학교 1~3학년","d":"대인 관계","t":"감정 인지와 조절 방법을 알고, 적절히 감정을 조절하며 표현한다.","m":"이 성취기준은 상대방을 존중하며 자신의 감정을 표현하는 능력을 기르기 위해 설정하였다. 다른 사람의 감정 이해, 적절한 언어로 감정 표현, 상황과 상대에 따른 감정 표현 방법, 감정 조절 기술 등을 다룬다. 적절한 감정 표현과 부적절한 감정 표현이 상대에게 주는 느낌을 인식하고, 다른 사람의 감정을 인지하고 자신의 감정을 조절하여 의사를 표현하도록 한다.","n":[],"p":607,"b":2},{"c":"[12시자03-04]","k":"선택","sk":"전문 교과(직업·생활)","s":"시각장애인 자립생활","g":"고등학교 1~3학년","d":"대인 관계","t":"다른 사람의 차별 행위를 인지하고, 자신의 권리를 옹호한다.","m":"이 성취기준은 자신의 권리를 알고 옹호하는 능력을 기르게 하고자 설정하였다. 장애인 차별 및 권리 관련 법령의 이해, 차별의 판단 기준, 차별에 대한 대처 및 권리 옹호 등을 다룬다. 시각장애인이 사회에서 경험하는 다양한 차별 사례를 조사하고, 장애인에 대한 차별 여부를 바르게 판단하여 자신의 권리를 적극적으로 옹호하며 적절히 대처하도록 한다.","n":[],"p":607,"b":2},{"c":"[12시자03-05]","k":"선택","sk":"전문 교과(직업·생활)","s":"시각장애인 자립생활","g":"고등학교 1~3학년","d":"대인 관계","t":"자기주장의 바른 표현 방법을 탐구하고, 자신의 견해를 논리적으로 주장한다.","m":"이 성취기준은 타인을 존중하며 자신의 견해를 논리적으로 전달하는 능력을 기르게 하고자 설정하였다. 자기주장의 개념과 목적, 올바른 자기주장 절차와 방법, 타인과의 의견 조율 절차와 방법 등을 다룬다. 자신의 주장을 적절히 표현하는 사례와 그렇지 않은 사례를 살펴보고, 타인의 입장을 존중하며 자신의 주장을 논리적으로 전달하도록 한다.","n":[],"p":607,"b":2},{"c":"[12시자03-06]","k":"선택","sk":"전문 교과(직업·생활)","s":"시각장애인 자립생활","g":"고등학교 1~3학년","d":"대인 관계","t":"건전한 이성 교제를 위한 표현과 방법을 조사하고, 이성을 존중하며 교제한다.","m":"이 성취기준은 이성과 상호 존중하며 교제하는 자세와 태도를 기르게 하고자 설정하였다. 시각장애 친구와의 이성 교제, 비장애 친구와의 이성 교제, 건전한 이성 교제 활동 유형, 데이트 폭력과 대처 방법 등을 다룬다. 이성 교제의 적절한 사례와 적절하지 않은 사례를 살펴보고, 이성을 존중하고 배려하며 교제하는 방법을 배워 실천하도록 한다.","n":[],"p":607,"b":2},{"c":"[12시자04-01]","k":"선택","sk":"전문 교과(직업·생활)","s":"시각장애인 자립생활","g":"고등학교 1~3학년","d":"감각 활용","t":"지역사회 활동 유형에 적합한 저시력 기구와 시각 기술을 선택하여 사용한다.","m":"이 성취기준은 지역사회 생활에서 잔존 시각과 저시력 기구를 능동적으로 사용하는 능력을 기르게 하고자 설정하였다. 지역사회 활동의 유형, 활동에 따른 저시력 기구의 선택과 사용, 활동 유형에 따른 시각 기술의 선택과 사용 등을 다룬다. 낮은 시력으로 어려움을 겪는 지역사회 활동들을 조사하고, 활동 유형에 따라 적합한 저시력 기구와 시각 기술을 선택하여 사용하도록 한다.","n":[],"p":609,"b":2},{"c":"[12시자04-02]","k":"선택","sk":"전문 교과(직업·생활)","s":"시각장애인 자립생활","g":"고등학교 1~3학년","d":"감각 활용","t":"시각을 효율적으로 사용하기 위한 환경 수정 방법을 탐색하고, 환경 수정을 요청한다.","m":"이 성취기준은 적절한 시각 환경을 조성하여 시각과 관련된 문제 상황을 해결하는 능력을 기르게 하고자 설정하였다. 자신의 기능 시각 이해, 대비⋅조명⋅눈부심 같은 환경 조성 방법, 확대 자료와 저시력 기구의 사용 요구 등을 다룬다. 학교와 지역사회 시설을 이용할 때 자신에게 필요한 시각 환경 수정이나 배려를 확인하고 요청하도록 한다.","n":[],"p":609,"b":2},{"c":"[12시자04-03]","k":"선택","sk":"전문 교과(직업·생활)","s":"시각장애인 자립생활","g":"고등학교 1~3학년","d":"감각 활용","t":"비평적 듣기 기술을 알고, 화자의 관점을 논리적으로 분석하며 듣는다.","m":"이 성취기준은 다른 사람의 관점을 파악하며 논리적으로 내용을 분석하는 능력을 기르게 하고자 설정하였다. 다양한 토론 주제 선정, 비평적 듣기 기술과 전략, 화자의 관점과 근거, 화자와 자신의 관점 비교 등을 다룬다. 다양한 토론 주제에 관해 상대방의 주장을 듣고 화자의 관점과 근거를 분석한 후, 자신의 견해와 근거를 논리적으로 전달하도록 한다.","n":[],"p":609,"b":2},{"c":"[12시자04-04]","k":"선택","sk":"전문 교과(직업·생활)","s":"시각장애인 자립생활","g":"고등학교 1~3학년","d":"감각 활용","t":"청각을 효율적으로 사용하기 위한 환경 수정 방법을 탐색하고, 환경 수정을 요청한다.","m":"이 성취기준은 적절한 청각 환경을 조성하여 청각 관련 문제 상황을 해결하는 능력을 기르게 하고자 설정하였다. 화자와의 거리와 자리 배치, 주변 소음의 차단, 음성 정보 서비스, 주변 상황 설명 요청 등을 다룬다. 학교와 지역사회 시설을 이용할 때 자신에게 필요한 청각 환경 수정이나 배려를 확인하고 요청하도록 한다.","n":[],"p":609,"b":2},{"c":"[12시자04-05]","k":"선택","sk":"전문 교과(직업·생활)","s":"시각장애인 자립생활","g":"고등학교 1~3학년","d":"감각 활용","t":"지역사회 활동에 따라 필요한 양각 자료와 촉각 기술을 선택하여 사용한다.","m":"이 성취기준은 지역사회 생활에서 촉각을 능동적으로 사용하는 능력을 기르게 하고자 설정하였다. 점자 및 양각 관광지도, 지하철 노선도, 박람회와 전시회 자료 등을 다룬다. 지역사회 활동에 필요한 점자 및 양각 자료 유형과 신청 기관을 조사하고, 활동 유형에 따라 적합한 양각 자료와 촉각 탐색 기술을 선택하여 사용하도록 한다.","n":[],"p":609,"b":2},{"c":"[12시자04-06]","k":"선택","sk":"전문 교과(직업·생활)","s":"시각장애인 자립생활","g":"고등학교 1~3학년","d":"감각 활용","t":"촉각을 효율적으로 사용하기 위한 환경 수정 방법을 탐색하고, 환경 수정을 요청한다.","m":"이 성취기준은 적절한 촉각 환경을 조성하고 촉각 관련 문제 상황을 해결하는 능력을 기르게 하고자 설정하였다. 보도의 장애물 제거, 점자 안내판 설치, 점자 및 양각 자료 요청, 수행 시간 연장 등을 다룬다. 학교와 지역사회 시설을 이용할 때 자신에게 필요한 촉각 환경 수정이나 배려를 확인하고 요청하도록 한다.","n":[],"p":609,"b":2},{"c":"[12시자05-01]","k":"선택","sk":"전문 교과(직업·생활)","s":"시각장애인 자립생활","g":"고등학교 1~3학년","d":"보조공학","t":"점자정보단말기를 컴퓨터, 스마트 기기, 점자 프린터와 연결하여 사용한다.","m":"이 성취기준은 점자정보단말기를 컴퓨터 및 스마트 기기, 점자 프린터와 연결하여 사용하는 능력을 기르게 하고자 설정하였다. 연결 방법, 점자정보단말기로 컴퓨터 및 스마트 기기 제어, 점자정보단말기를 활용한 화면 읽기 프로그램의 음성 출력 정보 확인, 점자 인쇄를 위한 점자정보단말기 설정 등을 다룬다. 점자정보단말기와 다른 기기를 연결하여 사용하는 방법을 익혀 학습과 일상생활에서 활용하도록 한다.","n":[],"p":610,"b":2},{"c":"[12시자05-02]","k":"선택","sk":"전문 교과(직업·생활)","s":"시각장애인 자립생활","g":"고등학교 1~3학년","d":"보조공학","t":"점자정보단말기를 활용해 스토어에서 앱을 설치하고 사용한다.","m":"이 성취기준은 점자정보단말기로 스토어에서 앱을 설치하여 사용하는 능력을 기르게 하고자 설정하였다. 스토어에서 앱을 내려받을 수 있는 점자정보단말기의 종류, 점자정보단말기를 활용한 스토어 앱 검색 및 내려받기, 내려받은 앱 사용법 등을 다룬다. 점자정보단말기로 스토어에서 앱을 검색하고 설치하는 방법을 익혀 필요한 앱을 설치하여 사용하도록 한다.","n":[],"p":610,"b":2},{"c":"[12시자05-03]","k":"선택","sk":"전문 교과(직업·생활)","s":"시각장애인 자립생활","g":"고등학교 1~3학년","d":"보조공학","t":"촉각 패드와 촉각 워치를 스마트 기기와 연결하여 사용한다.","m":"이 성취기준은 스마트 촉각 패드와 촉각 워치를 사용하는 능력을 기르게 하고자 설정하였다. 스마트 촉각 패드 및 스마트 촉각 워치의 구조 파악, 스마트 기기와 스마트 촉각 워치 및 촉각 패드 연결 방법, 촉각 패드 및 촉각 워치를 활용한 스마트 기기 정보 확인 및 제어 등을 다룬다. 촉각 패드 및 촉각 워치로 스마트 기기의 정보를 확인하고 제어하는 방법을 익혀 학습과 일상생활에서 활용하도록 한다.","n":[],"p":610,"b":2},{"c":"[12시자05-04]","k":"선택","sk":"전문 교과(직업·생활)","s":"시각장애인 자립생활","g":"고등학교 1~3학년","d":"보조공학","t":"화면 읽기 프로그램을 활용해 스마트 기기의 웹 브라우저를 효과적으로 사용한다.","m":"이 성취기준은 화면 읽기 프로그램을 활용해 스마트 기기의 웹 브라우저를 사용하는 능력을 기르게 하고자 설정하였다. 웹 브라우저 화면구조, 웹 브라우저에서 사용되는 제스처 및 키보드 단축키, 제스처 및 키보드 단축키를 사용한 웹 페이지 탐색 등을 다룬다. 화면 읽기 프로그램을 활용해 스마트 기기로 웹상의 정보를 효과적으로 탐색하고 사용하도록 한다.","n":[],"p":610,"b":2},{"c":"[12시자05-05]","k":"선택","sk":"전문 교과(직업·생활)","s":"시각장애인 자립생활","g":"고등학교 1~3학년","d":"보조공학","t":"화면 읽기 프로그램을 활용해 스토어에서 앱을 설치하고 사용한다.","m":"이 성취기준은 화면 읽기 프로그램을 활용해 스토어에서 앱을 설치하여 사용하는 능력을 기르게 하고자 설정하였다. 스마트 기기의 종류에 따른 스토어의 특징, 화면 읽기 프로그램을 이용한 스토어 화면 구조 탐색, 앱 검색 및 내려받기, 내려받은 앱 사용법 등을 다룬다. 화면 읽기 프로그램을 활용해 스토어에서 앱을 검색하고 설치하는 방법을 배워 필요한 앱을 설치하여 사용하도록 한다.","n":[],"p":610,"b":2},{"c":"[12시자05-06]","k":"선택","sk":"전문 교과(직업·생활)","s":"시각장애인 자립생활","g":"고등학교 1~3학년","d":"보조공학","t":"화면 확대 프로그램을 사용하여 스마트 기기의 웹 브라우저를 효과적으로 사용한다.","m":"이 성취기준은 화면 확대 프로그램을 활용해 스마트 기기의 웹 브라우저를 사용하는 능력을 기르게 하고자 설정하였다. 웹 브라우저의 구조, 확대 및 축소 관련 제스처, 웹 사이트에서 제공하는 화면 확대 관련 접근성 기능, 확대 및 축소, 색상 반전을 통한 웹 페이지 탐색 방법 등을 다룬다. 화면 확대 프로그램을 활용해 스마트 기기로 웹의 정보를 효과적으로 탐색하고 사용하도록 한다.","n":[],"p":610,"b":2},{"c":"[12시자05-07]","k":"선택","sk":"전문 교과(직업·생활)","s":"시각장애인 자립생활","g":"고등학교 1~3학년","d":"보조공학","t":"화면 확대 프로그램을 활용해 스토어에서 앱을 설치하고 사용한다.","m":"이 성취기준은 화면 확대 프로그램을 활용해 스토어에서 앱을 검색하여 사용하는 능력을 기르게 하고자 설정하였다. 스마트 기기의 종류에 따른 스토어의 특징, 화면 확대 프로그램을 이용한 스토어 화면 구조 탐색, 앱 검색 및 내려받기, 내려받은 앱 사용법 등을 다룬다. 화면 확대 프로그램을 활용해 스토어에서 앱을 검색하고 설치하는 방법을 배워 필요한 앱을 설치하여 사용하도록 한다.","n":[],"p":610,"b":2},{"c":"[12시자06-01]","k":"선택","sk":"전문 교과(직업·생활)","s":"시각장애인 자립생활","g":"고등학교 1~3학년","d":"여가 활용","t":"국내외 여행지와 장애인 편의 지원 정보를 조사하고, 여행을 계획하여 실천한다.","m":"이 성취기준은 여행지의 정보를 조사하고 여행 계획을 세워 여행을 즐기는 능력을 기르게 하고자 설정하였다. 도서, 인터넷 등을 활용한 국내외 여행 정보의 수집 방법, 관광, 교통, 식당, 숙박 시설, 장애인 편의 서비스 정보 수집 방법, 여행 계획 수립 시 고려 사항, 여행 상품 예약과 취소 방법 등을 다룬다. 평소 가 보고 싶었던 여행지의 정보를 조사하고, 여행 계획을 수립하여 실천하도록 한다.","n":[],"p":612,"b":2},{"c":"[12시자06-02]","k":"선택","sk":"전문 교과(직업·생활)","s":"시각장애인 자립생활","g":"고등학교 1~3학년","d":"여가 활용","t":"지역과 온라인 기반의 동호회 정보를 조사하고, 동호회 활동에 참여한다.","m":"이 성취기준은 관심 분야가 같은 사람들의 모임 활동에 참여하여 다른 사람들과 교류하는 능력을 기르게 하고자 설정하였다. 동호회의 유형과 특징, 동호회 선택 기준, 동호회 가입 방법, 동호회 활동 시 유의점 등을 다룬다. 지역 및 온라인 동호회 유형과 활동들을 조사하여 자신에게 맞는 동호회를 선택하고, 동호회 활동에 참여하며 즐기도록 한다.","n":[],"p":612,"b":2},{"c":"[12시자06-03]","k":"선택","sk":"전문 교과(직업·생활)","s":"시각장애인 자립생활","g":"고등학교 1~3학년","d":"여가 활용","t":"가정 운동(홈트레이닝) 운동의 종류와 특징을 조사하고, 자신에게 맞는 운동을 수행한다.","m":"이 성취기준은 자신에게 적합한 가정 운동(홈트레이닝)을 선택하여 건강을 관리하는 능력을 기르게 하고자 설정하였다. 가정 운동의 유형, 기구의 사용, 안전한 운동 방법, 시각장애를 고려한 활동 수정 방법 등을 다룬다. 잔존 감각을 사용하여 다양한 가정 운동을 체험하며, 자신에게 맞는 가정 운동을 선택하여 꾸준히 실천하도록 한다.","n":[],"p":612,"b":2},{"c":"[12시자06-04]","k":"선택","sk":"전문 교과(직업·생활)","s":"시각장애인 자립생활","g":"고등학교 1~3학년","d":"여가 활용","t":"시각장애인을 위한 생활 스포츠 종목을 조사하고, 스포츠 활동에 참여한다.","m":"이 성취기준은 시각장애인이 즐길 수 있는 생활 스포츠 활동에 참여하는 능력을 기르게 하고자 설정하였다. 볼링, 마라톤, 탁구, 골프 같은 시각장애인 스포츠 종목, 지역사회 체육 시설 이용 등을 다룬다. 시각장애인이 선호하는 생활 스포츠 유형을 조사하고, 자신에게 적합한 종목에 참여하며 시각장애인 및 비장애인과 교류하고 건강을 관리하도록 한다.","n":[],"p":612,"b":2},{"c":"[12시자06-05]","k":"선택","sk":"전문 교과(직업·생활)","s":"시각장애인 자립생활","g":"고등학교 1~3학년","d":"여가 활용","t":"문화예술 공연 및 행사 정보를 조사하고, 온라인으로 예약하여 관람한다.","m":"이 성취기준은 평소 관심 있는 문화예술 공연 및 행사를 예약하고 관람하는 능력을 기르게 하고자 설정하였다. 영화, 연극, 뮤지컬, 음악회, 전시회, 지역 축제 등에 대한 정보 탐색, 온라인 예매 및 취소 방법, 장애인 편의 서비스 활용 방법 등을 다룬다. 자신이 관람하고 싶은 문화예술 공연 및 행사 정보를 조사하여 온라인에서 직접 예약하고, 장애인 편의 서비스를 활용해 편리하게 관람하도록 한다.","n":[],"p":612,"b":2},{"c":"[12시자06-06]","k":"선택","sk":"전문 교과(직업·생활)","s":"시각장애인 자립생활","g":"고등학교 1~3학년","d":"여가 활용","t":"콘텐츠 공유 플랫폼의 종류와 특징을 탐색하고, 저작권법을 준수하여 창작물을 등록한다.","m":"이 성취기준은 공유 플랫폼에 개인 창작물을 안전하게 등록하고 공유하는 능력을 기르게 하고자 설정하였다. 텍스트, 사진, 음원, 영상 등의 콘텐츠를 공유할 수 있는 플랫폼의 종류와 이용 방법, 저작권법 준수, 개인정보 보호 등을 다룬다. 자신이 원하는 온라인 공유 플랫폼에 저작권법을 준수하여 개인 창작물을 등록하고 타인과 공유하고 즐기도록 한다.","n":[],"p":612,"b":2},{"c":"[12시자07-01]","k":"선택","sk":"전문 교과(직업·생활)","s":"시각장애인 자립생활","g":"고등학교 1~3학년","d":"진로 준비","t":"자신에게 적합한 진로 목표를 설정하고, 진로 계획을 수립한다.","m":"이 성취기준은 자신의 진로를 주도적으로 결정하고 계획하는 능력을 기르게 하고자 설정하였다. 진로 의사 결정 절차, 진로 계획의 구성 요소, 진로 계획 작성 방법 등을 다룬다. 자신의 적성과 강약점, 시각장애 정도, 직업 전망 등을 종합적으로 분석하여 진로를 결정하고, 합리적인 진로 계획 수립 절차에 따라 진로 계획을 세워 실천하도록 한다.","n":[],"p":614,"b":2},{"c":"[12시자07-02]","k":"선택","sk":"전문 교과(직업·생활)","s":"시각장애인 자립생활","g":"고등학교 1~3학년","d":"진로 준비","t":"자신의 진로 분야에서 본받을 만한 사람을 찾아 멘토링 활동을 계획하고 실천한다.","m":"이 성취기준은 자신의 진로 분야 멘토를 통해 진로를 체계적으로 준비하는 능력을 기르게 하고자 설정하였다. 진로 멘토링의 개념, 멘토 선정 기준과 조건, 멘토링 활동 방법, 멘토링 활동 계획 수립 등을 다룬다. 자신이 결정한 진로 및 직업 분야에서 직업생활을 하고 있는 시각장애인이나 비장애인 멘토와 교류하고, 진로 준비에 대한 상담과 조언을 받으며 자신의 진로를 효율적으로 준비하도록 한다.","n":[],"p":614,"b":2},{"c":"[12시자07-03]","k":"선택","sk":"전문 교과(직업·생활)","s":"시각장애인 자립생활","g":"고등학교 1~3학년","d":"진로 준비","t":"시각장애인의 취업과 직업생활을 지원하는 제도와 서비스를 알고 이용한다.","m":"이 성취기준은 ‘장애인고용촉진 및 직업재활법’ 등에 따른 시각장애인 직업재활 제도와 서비스를 이용하는 능력을 기르게 하고자 설정하였다. 시각장애인 직업 평가, 직업 전 적응 훈련, 직업 훈련, 취업 알선, 근로 지원인 제도 등을 다룬다. 시각장애인과 관련된 직업재활 지원 제도와 서비스를 조사하고 분석하는 과정에서 취업 및 직업생활에서 직면할 수 있는 어려움에 대한 해결 방안을 모색하도록 한다.","n":[],"p":614,"b":2},{"c":"[12시자07-04]","k":"선택","sk":"전문 교과(직업·생활)","s":"시각장애인 자립생활","g":"고등학교 1~3학년","d":"진로 준비","t":"자신의 희망 진로 분야의 사업체를 방문하여 직업 및 창업 정보를 조사한다.","m":"이 성취기준은 사업체를 견학하며 자신의 관심 직업이나 창업 분야를 더욱 심층적으로 이해하기 위해 설정하였다. 지역 소재 사업체, 시각장애인 고용 사업체, 시각장애인 창업 사업체, 보호작업장, 사업체 견학 준비 및 유의점 등을 다룬다. 자신의 진로와 관련된 지역 사업체를 방문하여 수행 직무를 탐색하고, 사업체 관계자와 인터뷰해 보면서 직업 및 창업 분야의 선택과 준비에 필요한 정보를 수집하고 활용하도록 한다.","n":[],"p":614,"b":2},{"c":"[12시자07-05]","k":"선택","sk":"전문 교과(직업·생활)","s":"시각장애인 자립생활","g":"고등학교 1~3학년","d":"진로 준비","t":"자신의 희망 전공 분야가 있는 대학 및 직업 훈련 기관을 방문하여 전공 정보를 조사한다.","m":"이 성취기준은 대학 및 직업 훈련 기관을 견학하며 자신의 희망 전공을 보다 심층적으로 이해하고 명료화하고자 설정하였다. 대학 진학 정보 자료 유형, 대학 웹사이트 검색, 대학 및 고등학교 연계 진로 프로그램, 직업 훈련 기관의 입학 기준과 절차, 훈련 직종 및 취업 분야 등을 다룬다. 지역 대학 및 직업 훈련 기관을 방문하여 개설된 전공 분야와 진출 직업에 대해 정보를 조사하고 분석해 보면서 전공 선택과 진학 준비에 활용하도록 한다.","n":[],"p":614,"b":2},{"c":"[12시자07-06]","k":"선택","sk":"전문 교과(직업·생활)","s":"시각장애인 자립생활","g":"고등학교 1~3학년","d":"진로 준비","t":"구직 등록을 하고 구인 정보를 검색하여 구직 활동을 한다.","m":"이 성취기준은 취업을 위해 구직 활동을 하는 능력을 기르게 하고자 설정하였다. 구직 활동의 개념, 구직 등록 및 상담, 채용 정보 조사 방법, 채용 응시 서류의 유형과 작성 방법, 면접과 긍정적 자기표현 방법 등을 다룬다. 지역에 있는 직업재활 기관을 방문하여 구직 등록을 하고, 시각장애인 일자리 정보를 획득하는 다양한 경로와 방법을 조사하는 과정에서 구직 활동을 준비하고 실천하도록 한다.","n":[],"p":614,"b":2},{"c":"[12시자07-07]","k":"선택","sk":"전문 교과(직업·생활)","s":"시각장애인 자립생활","g":"고등학교 1~3학년","d":"진로 준비","t":"시각장애로 인한 직무 수행 장벽을 조사하고, 문제 해결 방법을 모색한다.","m":"이 성취기준은 시각장애로 인한 직업생활의 다양한 장벽에 능동적으로 대처하는 능력을 기르게 하고자 설정하였다. 일반적인 직무 장벽, 직업(군)별 직무 장벽, 시각장애인 직업 편의 지원 유형, 문제 해결 절차와 방법 등을 다룬다. 시각장애인이 직장에서 직무 수행 과정에서 겪을 수 있는 다양한 어려움과 문제 해결 사례들을 조사하고 토론하는 과정에서 직업생활에서 겪을 수 있는 어려움과 대처 방법에 관한 이해를 높이도록 한다.","n":[],"p":614,"b":2},{"c":"[12시자07-08]","k":"선택","sk":"전문 교과(직업·생활)","s":"시각장애인 자립생활","g":"고등학교 1~3학년","d":"진로 준비","t":"대학 생활에 필요한 생활 및 학습 기술을 배우고 활용한다.","m":"이 성취기준은 시각장애로 겪을 수 있는 대학 생활의 다양한 장벽에 능동적으로 대처하는 능력을 기르게 하고자 설정하였다. 일반적인 대학 생활의 장벽, 전공별 학습 장벽, 시각장애인 대학 생활 편의 지원 유형, 시각장애인 관련 기관의 대학생 지원 서비스 유형 등을 다룬다. 시각장애인이 대학 생활에서 겪을 수 있는 다양한 어려움과 문제 해결 사례들을 조사하고, 대학 생활에 필요한 대처 기술을 익히도록 한다.","n":[],"p":614,"b":2},{"c":"[12농문01-01]","k":"선택","sk":"전문 교과(직업·생활)","s":"농인의 생활과 문화","g":"고등학교 1~3학년","d":"일상생활","t":"결혼, 임신, 출산, 양육 등에 필요한 지식과 정보를 습득하여 행복한 미래 가정을 설계하고, 가정생활에 대한 올바른 가치관을 갖는다.","m":"이 성취기준은 농인 부모에게서 태어난 자녀를 양육하는 데 필요한 지식과 정보를 지역사회의 여러 기관 및 다른 부모와의 교류 등의 여러 방법을 통해 습득하는 데 목적이 있다.","n":[],"p":626,"b":2},{"c":"[12농문01-02]","k":"선택","sk":"전문 교과(직업·생활)","s":"농인의 생활과 문화","g":"고등학교 1~3학년","d":"일상생활","t":"농사회 및 지역사회의 여가활동에 적극적으로 참여하여, 일상생활에서 바람직한 대인 관계 태도를 형성한다.","m":"","n":[],"p":626,"b":2},{"c":"[12농문01-03]","k":"선택","sk":"전문 교과(직업·생활)","s":"농인의 생활과 문화","g":"고등학교 1~3학년","d":"일상생활","t":"직장생활에서 농인의 바람직한 대인관계 사례를 살펴보고, 올바른 직장생활을 이해한다.","m":"","n":[],"p":626,"b":2},{"c":"[12농문01-04]","k":"선택","sk":"전문 교과(직업·생활)","s":"농인의 생활과 문화","g":"고등학교 1~3학년","d":"일상생활","t":"삶의 질을 높여주는 바람직한 경제활동의 가치를 알고, 농인의 경제활동을 체험한다.","m":"","n":[],"p":626,"b":2},{"c":"[12농문02-01]","k":"선택","sk":"전문 교과(직업·생활)","s":"농인의 생활과 문화","g":"고등학교 1~3학년","d":"역사","t":"세계 속의 농인의 모습을 살펴보며, 세계 농교육의 시대별 특성을 이해한다.","m":"","n":[],"p":627,"b":2},{"c":"[12농문02-02]","k":"선택","sk":"전문 교과(직업·생활)","s":"농인의 생활과 문화","g":"고등학교 1~3학년","d":"역사","t":"세계 각국 농교육의 변천을 이해하고 세계 속의 농인으로서 가치관을 함양한다.","m":"이 성취기준은 프랑스, 독일, 미국 등 세계 속의 농교육의 큰 흐름을 이해하고, 역사 속의 농교육의 특성을 알아보며, 농인으로서의 자부심을 가지게 하는 데 목적이 있다.","n":[],"p":627,"b":2},{"c":"[12농문03-01]","k":"선택","sk":"전문 교과(직업·생활)","s":"농인의 생활과 문화","g":"고등학교 1~3학년","d":"정체성","t":"농사회⋅문화와 청사회⋅문화의 편리함과 불편함을 이해하고, 각 사회에서 직면하는 문제를 합리적으로 대하는 태도를 갖는다.","m":"이 성취기준은 사회생활에서 겪는 어려움을 문화적 관점에서 이해하고 다양한 예시를 통해 적절하게 해결하는 방법을 알고 일상생활에서 해결하는 역량을 기르기 위해 설정한 것이다.","n":[],"p":627,"b":2},{"c":"[12농문03-02]","k":"선택","sk":"전문 교과(직업·생활)","s":"농인의 생활과 문화","g":"고등학교 1~3학년","d":"정체성","t":"이중문화 정체성을 내면화하여, 농인과 청인이 함께 어울려 살아가는 삶의 중요성을 이해하고, 원만한 관계를 유지하는 방법을 찾아 실천한다.","m":"이 성취기준은 수어와 같은 시각적 언어를 기반으로 한 농인의 정체성을 확립함과 동시에 문자 언어, 청사회, 청문화를 수용하여 함께 어울려 살아가는 삶의 중요성을 이해하는 데 목적이 있다.","n":[],"p":627,"b":2},{"c":"[12농문04-01]","k":"선택","sk":"전문 교과(직업·생활)","s":"농인의 생활과 문화","g":"고등학교 1~3학년","d":"의사소통","t":"수어, 구어, 필담 등 다양한 의사소통 양식을 이해하고 상황에 맞는 효과적인 의사소통방법을 활용한다.","m":"이 성취기준은 의사소통 양식 중 수어와 구어, 필담의 특성을 이해하고, 다양한 상황에서 적절한 의사소통 양식을 선택하여 활용하며, 상대방과 의사소통을 원활하게 하는 데 목적이 있다.","n":[],"p":628,"b":2},{"c":"[12농문04-02]","k":"선택","sk":"전문 교과(직업·생활)","s":"농인의 생활과 문화","g":"고등학교 1~3학년","d":"의사소통","t":"의사소통과 대인 관계의 상관성을 이해하고, 효과적인 의사소통을 통해 원만한 대인 관계 능력을 기른다.","m":"","n":[],"p":628,"b":2},{"c":"[12농문04-03]","k":"선택","sk":"전문 교과(직업·생활)","s":"농인의 생활과 문화","g":"고등학교 1~3학년","d":"의사소통","t":"통역사의 역할을 이해하고, 에티켓을 익혀 통역사와 올바른 관계를 맺는다.","m":"","n":[],"p":628,"b":2},{"c":"[12농문05-01]","k":"선택","sk":"전문 교과(직업·생활)","s":"농인의 생활과 문화","g":"고등학교 1~3학년","d":"예술","t":"농문학의 특징을 이해하고, 창작활동을 통해 자신의 감성을 표현한다.","m":"이 성취기준은 다양한 표현기법을 활용하여 자신의 생각이 담긴 농예술 작품을 창작하고, 창작물을 타인과 공유하고 소통하는데 주안점을 두었다. 다양한 농예술 표현방식 알기, 농예술 작품 창작활동 하기, 창작 작품 전시(공연)을 통해 다른 사람과 공유하고소통하기 등의 내용을 다룬다. 이를 통해 자신의 창작 작품을 소중히 여기고, 다른 사람과 느낌을 공유하는 데 관심을 갖도록 한다.","n":[],"p":628,"b":2},{"c":"[12농문05-02]","k":"선택","sk":"전문 교과(직업·생활)","s":"농인의 생활과 문화","g":"고등학교 1~3학년","d":"예술","t":"농예술의 특징을 이해하고, 그림과 공연활동 등을 통해 자신의 감성을 표현한다.","m":"","n":[],"p":628,"b":2},{"c":"[12농문05-03]","k":"선택","sk":"전문 교과(직업·생활)","s":"농인의 생활과 문화","g":"고등학교 1~3학년","d":"예술","t":"농문학의 여러 갈래의 작품을 다양하게 수용하고 감상하는 태도를 기른다.","m":"","n":[],"p":628,"b":2},{"c":"[12농문05-04]","k":"선택","sk":"전문 교과(직업·생활)","s":"농인의 생활과 문화","g":"고등학교 1~3학년","d":"예술","t":"농예술 작품을 이해하고, 표현된 농인의 삶과 생각, 감성 등을 이해하고 감상한다.","m":"","n":[],"p":628,"b":2},{"c":"[12농문06-01]","k":"선택","sk":"전문 교과(직업·생활)","s":"농인의 생활과 문화","g":"고등학교 1~3학년","d":"보조공학","t":"청각 활용 보조공학 기기의 청취환경에 대해서 이해하고 최적의 청취환경을 구성한다.","m":"","n":[],"p":629,"b":2},{"c":"[12농문06-02]","k":"선택","sk":"전문 교과(직업·생활)","s":"농인의 생활과 문화","g":"고등학교 1~3학년","d":"보조공학","t":"시각 활용 보조공학 기기 및 정보 접근 기기 활용을 통해 정보 접근성과 학습 활동에 미치는 영향과 필요성을 인식한다.","m":"이 성취기준은 시각 활용 보조공학 기기를 통신용 시각 활용 보조공학 기기에한정하지 않고, 다양한 시각적 정보를 활용하는 기술과 기기 및 관련 서비스를 포함한다는 것을 이해하고 다양한 활용법을 익혀 활용하며 그 중요성과 필요성을 인식하는데 목적이 있다.","n":[],"p":629,"b":2},{"c":"[12농문06-03]","k":"선택","sk":"전문 교과(직업·생활)","s":"농인의 생활과 문화","g":"고등학교 1~3학년","d":"보조공학","t":"청각 활용 보조공학 기기를 통해서 잔존청력을 활용한 정보 접근의 중요성을 알고, 실생활에 사용한다.","m":"","n":[],"p":629,"b":2},{"c":"[12농문07-01]","k":"선택","sk":"전문 교과(직업·생활)","s":"농인의 생활과 문화","g":"고등학교 1~3학년","d":"복지","t":"장애인에게 의료지원이 필요한 이유를 알고 장애인을 위한 의료지원을 검색한다.","m":"","n":[],"p":630,"b":2},{"c":"[12농문07-02]","k":"선택","sk":"전문 교과(직업·생활)","s":"농인의 생활과 문화","g":"고등학교 1~3학년","d":"복지","t":"장애인의 노동권에 대해 알아보고, 유관 기관에서 제공하는 직업 지원에 관한 정보 및 프로그램을 탐색하고 이용한다.","m":"성취기준은 장애인의 인간다운 삶을 지원하고 촉진하기 위해 설정하였다. 인간의 삶에서 교육과 직업은 자립생활에 필수적이다. 다양한 현장 체험학습을 통해 기관에서 제공하는 직업 관련 프로그램을 직접 찾아보고, 직업 지원 체험하며 졸업 후 전환에 대한 준비를 할 수 있는 능력을 기른다.","n":[],"p":630,"b":2},{"c":"[12농문07-03]","k":"선택","sk":"전문 교과(직업·생활)","s":"농인의 생활과 문화","g":"고등학교 1~3학년","d":"복지","t":"장애인을 위한 연금 제도를 찾아보고 필요성과 가치를 인식한다.","m":"생애주기별로 적절한 맞춤 복지서비스가 있음을 이해하고 자신에게 적합한 서비스를 선택하고 활용할 수 있는 기본적인 능력을 가질 수 있도록 한다.","n":[],"p":630,"b":2},{"c":"[12해부01-01]","k":"선택","sk":"전문 교과(이료)","s":"해부·생리","g":"고등학교 1~3학년","d":"해부생리학의 기초","t":"해부학의 정의를 알고 기초 용어를 익힌다.","m":"이 성취기준은 해부학을 이해하고 해부학 기초 용어를 학습하여 인체를 부위와 특징에 따라 구분할 수 있도록 설정하였다. 해부학의 정의, 해부학 기초 용어 등의 내용을 다룬다. 해부학의 정의를 바탕으로 해부학 기초 용어를 인체에 적용함으로써 각 기관의위치와 방향 및 특징 등을 파악하는 데 중점을 둔다.","n":[],"p":644,"b":2},{"c":"[12해부01-02]","k":"선택","sk":"전문 교과(이료)","s":"해부·생리","g":"고등학교 1~3학년","d":"해부생리학의 기초","t":"해부학적 자세를 알고 인체에 적용한다.","m":"이 성취기준은 해부학적 자세를 인체에 적용하는 능력을 기름으로써 인체를 해부학적으로 이해하고 정의할 수 있도록 설정하였다. 해부학의 정의, 해부학적 자세 적용하기의 내용을 다룬다. 해부학적 자세를 알고 인체에 적용하여 각 기관 및 인체 부위를 설명하고 탐색하는 태도를 기르는 데 중점을 둔다.","n":[],"p":644,"b":2},{"c":"[12해부01-03]","k":"선택","sk":"전문 교과(이료)","s":"해부·생리","g":"고등학교 1~3학년","d":"해부생리학의 기초","t":"해부학적 기초 용어를 인체에 적용하고 해부학적 관점을 형성한다.","m":"이 성취기준은 해부학 기초를 다지기 위하여 해부학 기초 용어를 인체에 적용할 수 있도록 설정하였다. 해부학 기초 용어 적용하기, 인체의 소중함 인식 등의 내용을다룬다. 인체에 대한 해부학적 관점을 형성하고 새롭게 관찰 및 탐색하여 이료 학습의 기초를 다지는 태도를 기르는 데 중점을 둔다.","n":[],"p":644,"b":2},{"c":"[12해부01-04]","k":"선택","sk":"전문 교과(이료)","s":"해부·생리","g":"고등학교 1~3학년","d":"해부생리학의 기초","t":"생리학의 정의를 알고 항상성의 작용 기전을 이해한다.","m":"이 성취기준은 인체가 생명 유지를 위하여 작동하는 메커니즘과 정상적인 생명 활동에 대해 이해할 수 있도록 설정하였다. 생리학의 정의, 항상성, 항상성의 작용 기전 탐구하기 등의 내용을 다룬다. 생리학의 정의를 알고 항상성의 작용 기전을 탐구하여 일반적인 생명 현상의 원리를 파악하는 데 중점을 둔다.","n":[],"p":645,"b":2},{"c":"[12해부01-05]","k":"선택","sk":"전문 교과(이료)","s":"해부·생리","g":"고등학교 1~3학년","d":"해부생리학의 기초","t":"물질대사와 물질 이동의 개념을 파악하고 생명 현상의 원리를 이해한다.","m":"이 성취기준은 정상적인 생리 현상 기전을 학습함으로써 다양한 자극으로부터 인체를 보호하고 생명을 유지하게 하는 기전을 이해할 수 있도록 설정하였다. 물질대사와 물질의 이동, 생명 현상 기전 조사하기 등의 내용을 다룬다. 물질대사 및 물질 이동에 대한 기전을 알고 생명 현상과의 관련성을 파악하여 인체의 생명 유지 및 활동의 원리를 탐색하는 데 중점을 둔다.","n":[],"p":645,"b":2},{"c":"[12해부01-06]","k":"선택","sk":"전문 교과(이료)","s":"해부·생리","g":"고등학교 1~3학년","d":"해부생리학의 기초","t":"인체를 생리학적 관점으로 인식하고 적용한다.","m":"이 성취기준은 인체의 생명 현상과 생명 유지와의 관련성을 파악하고 비정상적인 생명 현상에 대해 분별하는 태도를 기르며 생리적 작용의 중요성을 인식할 수 있도록 설정하였다. 생명 현상 기전 조사하기, 인체에 대한 생리학적 관점 형성 등의 내용을 다룬다. 생활 속에서 다양하게 나타나는 생명 현상의 기전을 탐구하며 인체를 생리학적 관점으로 이해하고 탐색하는 태도를 기르는 데 중점을 둔다.","n":[],"p":645,"b":2},{"c":"[12해부01-07]","k":"선택","sk":"전문 교과(이료)","s":"해부·생리","g":"고등학교 1~3학년","d":"해부생리학의 기초","t":"세포, 조직, 기관, 기관계통의 구조와 기능을 이해한다.","m":"이 성취기준은 인체를 단위별로 구분하는 기준을 파악하고 각각의 구성 단위마다 구조를 이루어 유기적으로 협력하는 기능에 대해 이해할 수 있도록 설정하였다. 세포,조직, 기관과 기관계통, 인체 구성 요소별 구조와 기능 탐구하기 등의 내용을 다룬다. 인체를 구성하는 세포, 조직, 기관, 기관계통의 종류 및 특징, 각각의 주요 기능 등을 파악하는 데 중점을 둔다.","n":[],"p":646,"b":2},{"c":"[12해부01-08]","k":"선택","sk":"전문 교과(이료)","s":"해부·생리","g":"고등학교 1~3학년","d":"해부생리학의 기초","t":"세포, 조직, 기관, 기관계통 간에 이루어지는 유기적이고 협력적인 관계를 이해하며 생명 존중의 태도를 기른다.","m":"이 성취기준은 인체 각각의 단위가 고유한 기능을 유지함과 동시에 통합적 기능을 수행하여 신비로운 생명 현상을 유지하는 기전에 관하여 탐구하는 태도를 기를 수 있도록 설정하였다. 인체 구성 요소의 유기성 조사하기, 인체 구성에 대한 관심과 생명 존중 등의 내용을 다룬다. 인체의 최소 구성 단위인 세포에서 점점 큰 단위로 발전하여 하나의 인체를 구성하는 인체 구성의 조직적이고 유기적인 관계를 탐구함으로써 생명체로서의 인체에 대한 존중감을 갖는 데 중점을 둔다.","n":[],"p":646,"b":2},{"c":"[12해부01-09]","k":"선택","sk":"전문 교과(이료)","s":"해부·생리","g":"고등학교 1~3학년","d":"해부생리학의 기초","t":"인체를 체간과 체지로 구분하여 설명한다.","m":"이 성취기준은 이료 학습을 위하여 인체를 해부학적으로 구분해야 할 필요성을 인식하고 구체적으로 체간과 체지를 구성하는 하위 범주들을 파악할 수 있도록 설정하였다. 체간, 체지, 체간과 체지 구분하기 등의 내용을 다룬다. 인체를 체간과 체지 두 부분으로 크게 구분하고 인체에 적용하여 체표에 정의된 해부학적 명칭을 설명할 수 있도록 하는 데 중점을 둔다.","n":[],"p":647,"b":2},{"c":"[12해부01-10]","k":"선택","sk":"전문 교과(이료)","s":"해부·생리","g":"고등학교 1~3학년","d":"해부생리학의 기초","t":"인체의 부위별 세부 명칭을 익히고 체표에 적용한다.","m":"이 성취기준은 체간과 체지를 구성하는 하위 범주와 각 부의 명칭들이 함의하고 있는 해부학적 의미를 파악할 수 있도록 설정하였다. 체간, 체지, 인체의 세부 명칭 탐색하기, 인체의 소중함 인식 등의 내용을 다룬다. 인체 각 부의 명칭을 익히고 특징을 파악함으로써 체표에 적용하는 자세를 기르는 데 중점을 둔다.","n":[],"p":647,"b":2},{"c":"[12해부02-01]","k":"선택","sk":"전문 교과(이료)","s":"해부·생리","g":"고등학교 1~3학년","d":"골격계통","t":"골격계통의 구성을 이해하고 뼈의 기능과 형태적 특징을 안다.","m":"이 성취기준은 인체를 이루는 여러 기관계통 중 한 부분을 차지하는 골격계통의 의의를 알고 그 구성과 특징을 파악하여 운동 기관으로서의 골격계통을 전체적으로 이해할 수 있도록 설정하였다. 골격계통의 구성 탐색하기, 뼈와 관절의 기능과 형태적 특징 탐색하기 등의 내용을 다룬다. 골격계통의 기본적인 개념을 이해하고 수동적 운동 기관으로서의 특징을 파악하는 데 중점을 둔다.","n":[],"p":648,"b":2},{"c":"[12해부02-02]","k":"선택","sk":"전문 교과(이료)","s":"해부·생리","g":"고등학교 1~3학년","d":"골격계통","t":"주요 관절의 종류와 특징을 알고 형태 및 운동 방향에 따라 관절을 구분한다.","m":"이 성취기준은 자세를 유지하고 일상생활을 영위하는 데 작용하는 뼈와 관절의 종류와 기능, 운동 양식 등을 전반적으로 파악할 수 있도록 설정하였다. 관절, 뼈와 관절의 기능과 형태적 특징 탐색하기 등의 내용을 다룬다. 각 부에 위치한 뼈와 관절을 기능과 형태에 따라 분류하고 수동적 운동 원리에 따라 작용하는 역학적 관계를 파악하는 데 중점을 둔다.","n":[],"p":648,"b":2},{"c":"[12해부02-03]","k":"선택","sk":"전문 교과(이료)","s":"해부·생리","g":"고등학교 1~3학년","d":"골격계통","t":"연속되는 동작과 자세의 변화에 의해 이루어지는 일상생활 속에서의 운동 원리를 이해하고 바른 운동 습관을 기른다.","m":"이 성취기준은 골격계통에 대한 종합적 원리를 파악함으로써 비정상적인 자세와 운동에 기인하는 근골격계 질환에 대해 이해할 수 있도록 설정하였다. 뼈와 관절의 기능과 형태적 특징 탐색하기, 인체의 종합적 운동 원리와 바른 운동 습관 등의 내용을 다룬다. 일상생활 속에서 이루어지는 종합적 운동 양식을 파악함으로써 해부학적 원리에 맞는 바른 운동 습관을 기르는 데 중점을 둔다.","n":[],"p":648,"b":2},{"c":"[12해부02-04]","k":"선택","sk":"전문 교과(이료)","s":"해부·생리","g":"고등학교 1~3학년","d":"골격계통","t":"체간골의 구조와 특징을 파악하고 관절의 운동을 이해한다.","m":"이 성취기준은 체간을 이루는 뼈의 종류와 특징을 알고 관절의 형태에 따른 골격의 역학적 관계와 원리를 탐구할 수 있도록 설정하였다. 두개골⋅척주⋅흉곽, 부위별 뼈와 관절 인체에 적용하기 등의 내용을 다룬다. 체간을 이루는 뼈와 관절의 구조, 운동 범위 및 운동 양식을 파악하여 특정 동작에 작용하는 골격의 해부학적 원리를 탐구하는 데 중점을 둔다.","n":[],"p":649,"b":2},{"c":"[12해부02-05]","k":"선택","sk":"전문 교과(이료)","s":"해부·생리","g":"고등학교 1~3학년","d":"골격계통","t":"체지골의 구조와 특징을 파악하고 관절의 운동을 이해한다.","m":"이 성취기준은 체지를 이루는 뼈의 종류와 특징을 알고 관절의 형태에 따른 골격의 역학적 관계와 원리를 탐구할 수 있도록 설정하였다. 상지골⋅하지골, 관절의 특징과 운동 원리 탐색하기 등의 내용을 다룬다. 체지를 이루는 뼈와 관절의 구조, 운동 범위 및 운동 양식을 파악하여 특정 동작에 작용하는 골격의 해부학적 원리를 탐구하는 데 중점을 둔다.","n":[],"p":649,"b":2},{"c":"[12해부02-06]","k":"선택","sk":"전문 교과(이료)","s":"해부·생리","g":"고등학교 1~3학년","d":"골격계통","t":"부위별 뼈와 관절에 대한 특징을 인체에 적용하고 해부학적으로 바른 자세와 체형을 유지하는 습관을 기른다.","m":"이 성취기준은 부위별 뼈와 관절에 대한 지식을 바탕으로 정상적인 골격의 운동 양식을 파악하며 건강한 골격을 형성하고 유지하기 위한 생활 습관을 기를 수 있도록 설정하였다. 부위별 뼈와 관절 인체에 적용하기, 인체 운동 양식에 대한 관심과 바른 체형 유지 등의 내용을 다룬다. 인체 각 부를 이루는 뼈와 관절의 구조와 특징에 따라 일상생활 속에서 다양하게 연출되는 운동 기전을 탐색하고 인체에 적용하여 바른 체형을 만드는 태도를 기르는 데 중점을 둔다.","n":[],"p":649,"b":2},{"c":"[12해부03-01]","k":"선택","sk":"전문 교과(이료)","s":"해부·생리","g":"고등학교 1~3학년","d":"근육계통","t":"근육의 기능과 특징을 알고 기준에 따라 분류한다.","m":"이 성취기준은 인체의 여러 기관계통 중 한 부분을 차지하는 근육계통의 의의를 알고 그 구성과 특징을 파악하여 능동적 운동 기관으로서의 근육계통을 전체적으로 이해할 수 있도록 설정하였다. 근육의 종류와 특징, 근육의 기능과 특징 탐색하기 등의 내용을 다룬다. 근육의 특징과 기능을 파악하여 근육을 공통 요소에 따라 분류하고 체계적으로 이해하는 능력을 기르는 데 중점을 둔다.","n":[],"p":650,"b":2},{"c":"[12해부03-02]","k":"선택","sk":"전문 교과(이료)","s":"해부·생리","g":"고등학교 1~3학년","d":"근육계통","t":"근육의 수축과 대사 과정을 이해하고 생리적 작용 기전을 탐구한다.","m":"이 성취기준은 생명 활동으로서의 근육의 대사와 특징, 운동의 생리적 작용을 이해할 수 있도록 설정하였다. 자극과 운동 대사, 근육의 작용 기전 탐색하기 등의 내용을 다룬다. 근수축 기전에 따른 근육의 작용과 능동적 운동을 위한 운동 대사에 대한 생리적 과정을 탐구하는 데 중점을 둔다.","n":[],"p":650,"b":2},{"c":"[12해부03-03]","k":"선택","sk":"전문 교과(이료)","s":"해부·생리","g":"고등학교 1~3학년","d":"근육계통","t":"일상생활 속에서 능동적으로 운동하는 근육의 메커니즘을 알고 건강을 유지하기 위하여바른 생활 습관을 기른다.","m":"이 성취기준은 건강한 생활을 영위하기 위한 근육계통의 해부⋅생리학적 조건들을 이해하고 근육의 항상성이 무너지면서 근골격계 질환이 발생하게 되는 메커니즘을 탐색할 수 있도록 설정하였다. 근육의 작용 기전 탐색하기, 능동적 운동 기관으로서의 근육계통에 대한 관심과 바른 습관의 중요성 등의 내용을 다룬다. 근육의 대사 및 수축 과정을 이해하고 근육을 형태와 기능에 따라 분류함으로써 능동적 운동 기관으로서의 근육계통에 대해 관심을 갖고 건강 유지를 위하여 바른 생활 습관을 기르는 데 중점을 둔다.","n":[],"p":650,"b":2},{"c":"[12해부03-04]","k":"선택","sk":"전문 교과(이료)","s":"해부·생리","g":"고등학교 1~3학년","d":"근육계통","t":"체간근육의 부착 부위를 알고 작용을 이해한다.","m":"이 성취기준은 전신의 근육을 체간과 체지 근육으로 나누고 머리와 몸통을 이루는 체간부 근육의 형태와 특징 및 기능을 파악할 수 있도록 설정하였다. 체간근육, 근육의 부착 부위에 따른 작용 탐색하기 등의 내용을 다룬다. 체간에 분포한 근육의 부착 부위에 따라 작용하는 근육의 운동 기전을 파악하는 데 중점을 둔다.","n":[],"p":651,"b":2},{"c":"[12해부03-05]","k":"선택","sk":"전문 교과(이료)","s":"해부·생리","g":"고등학교 1~3학년","d":"근육계통","t":"체지근육의 부착 부위를 알고 작용을 이해한다.","m":"이 성취기준은 전신의 근육을 체간과 체지 근육으로 나누고 팔과 다리를 이루는 체지부 근육의 형태와 특징 및 기능을 파악할 수 있도록 설정하였다. 체지근육, 근육의 부착 부위에 따른 작용 탐색하기 등의 내용을 다룬다. 체지에 분포한 근육의 부착 부위에 따라 작용하는 근육의 운동 기전을 탐색하는 데 중점을 둔다.","n":[],"p":651,"b":2},{"c":"[12해부03-06]","k":"선택","sk":"전문 교과(이료)","s":"해부·생리","g":"고등학교 1~3학년","d":"근육계통","t":"자세와 동작에 따라 다르게 작용하는 근육의 특징을 이해하고 건강한 생활을 위하여 꾸준히 운동하는 습관을 기른다.","m":"이 성취기준은 부위별 근육의 형태와 특징, 작용 등에 대한 해부학적 지식을 통하여 근육의 성질과 운동 원리를 종합적으로 파악하고 정상적인 근육 작용과 건강과의 관련성을 탐색할 수 있도록 설정하였다. 수축과 운동 간의 역학 관계 탐색하기, 운동과 건강한 생활 등의 내용을 다룬다. 근육의 수축과 이완 원리에 따라 부위별 근육이 복합적으로 작용하는 기전을 탐색하고 지속적인 운동을 통하여 건강을 유지하는 습관을 기르는 데 중점을 둔다.","n":[],"p":651,"b":2},{"c":"[12해부04-01]","k":"선택","sk":"전문 교과(이료)","s":"해부·생리","g":"고등학교 1~3학년","d":"순환계통","t":"혈액의 성분을 알고 생리적 작용을 이해한다.","m":"이 성취기준은 순환에 있어 혈액의 중요성을 인식하고 구성 성분과 작용을 파악할 수 있도록 설정하였다. 혈액, 혈액의 성분과 작용 조사하기 등의 내용을 다룬다. 혈액을 구성하는 세포 성분 및 혈장의 생리적 작용을 파악하고, 혈액 순환이 생명 현상에 미치는 영향을 이해하는 데 중점을 둔다.","n":[],"p":652,"b":2},{"c":"[12해부04-02]","k":"선택","sk":"전문 교과(이료)","s":"해부·생리","g":"고등학교 1~3학년","d":"순환계통","t":"심장과 혈관의 특징을 이해하고 전신의 혈액 순환로를 파악한다.","m":"이 성취기준은 순환의 원동력이 되는 심장의 특징과 전신 순환로를 구성하는 혈관의 분포를 파악할 수 있도록 설정하였다. 심장과 혈관, 인체 주요 혈관의 위치 탐색하기 등의 내용을 다룬다. 혈액 순환을 위한 심장의 역할과 각 혈관의 특징을 이해하고 모형 관찰을 통해 전신의 주요 혈액 순환로를 파악하는 데 중점을 둔다.","n":[],"p":652,"b":2},{"c":"[12해부04-03]","k":"선택","sk":"전문 교과(이료)","s":"해부·생리","g":"고등학교 1~3학년","d":"순환계통","t":"혈액의 순환 생리를 알고 순환 기능의 조절 과정을 이해한다.","m":"이 성취기준은 심혈관계통의 생리 작용 및 순환이 건강에 미치는 영향을 이해할 수 있도록 설정하였다. 순환 생리, 혈압 및 맥박 측정하기, 건강 체크 실천 등의 내용을 다룬다. 순환 생리의 전반적인 개념을 알고 혈압과 맥박을 바르게 측정하는 방법을 익힘으로써 건강한 심혈관계통을 유지할 수 있는 생활 태도를 형성하는 데 중점을 둔다.","n":[],"p":652,"b":2},{"c":"[12해부04-04]","k":"선택","sk":"전문 교과(이료)","s":"해부·생리","g":"고등학교 1~3학년","d":"순환계통","t":"림프의 성분을 알고 생리적 작용을 이해한다.","m":"이 성취기준은 림프 순환에 있어 림프의 중요성을 인식하고 그 성분과 작용을 파악할 수 있도록 설정하였다. 림프, 림프의 성분과 작용 조사하기, 림프 순환을 위한 건강 수칙 습관화 등의 내용을 다룬다. 림프를 구성하는 성분 및 생리적 작용을 파악함으로써 림프 순환이 건강에 미치는 영향을 이해하고 적절한 생활 습관을 형성하는 데 중점을 둔다.","n":[],"p":653,"b":2},{"c":"[12해부04-05]","k":"선택","sk":"전문 교과(이료)","s":"해부·생리","g":"고등학교 1~3학년","d":"순환계통","t":"림프관 및 림프절의 특징을 알고 주요 림프절의 위치를 파악한다.","m":"이 성취기준은 림프 순환에 있어 림프관 및 림프절의 역할을 인식하고 전신 주요 림프절의 위치를 파악할 수 있도록 설정하였다. 림프관과 림프절, 인체 주요 림프절의 위치 탐색하기, 림프 순환을 위한 건강 수칙 습관화 등의 내용을 다룬다. 림프관의 종류와 특징, 림프절의 기능을 이해하고 모형 관찰을 통해 전신의 주요 림프절의 위치를 파악하는 데 중점을 둔다.","n":[],"p":653,"b":2},{"c":"[12해부04-06]","k":"선택","sk":"전문 교과(이료)","s":"해부·생리","g":"고등학교 1~3학년","d":"순환계통","t":"비장 및 흉선의 구조를 알고 기능을 이해한다.","m":"이 성취기준은 인체의 방어 기전과 비장 및 흉선과의 관계를 인식하고 그 구조적 특징과 기능을 파악할 수 있도록 설정하였다. 비장과 흉선, 비장 및 흉선 구조 관찰하기 등의 내용을 다룬다. 비장 및 흉선의 기능을 이해하고 모형 관찰을 통해 비장 및 흉선의 구조적 특징을 파악하는 데 중점을 둔다.","n":[],"p":653,"b":2},{"c":"[12해부05-01]","k":"선택","sk":"전문 교과(이료)","s":"해부·생리","g":"고등학교 1~3학년","d":"신경계통","t":"신경계통의 정의와 분류를 알고 구성 조직을 파악한다.","m":"이 성취기준은 신경계통의 기본 의의를 파악함으로써 인체에서 신경계통의 중요성을 인식할 수 있도록 설정하였다. 신경계통의 구성, 신경조직의 구조 관찰하기, 생명에 대한 존중 등의 내용을 다룬다. 신경계통의 정의 및 분류 체계를 알고 모형 관찰을 통해 신경조직을 구성하는 신경세포 및 신경교세포의 구조를 파악하는 데 중점을 둔다.","n":[],"p":654,"b":2},{"c":"[12해부05-02]","k":"선택","sk":"전문 교과(이료)","s":"해부·생리","g":"고등학교 1~3학년","d":"신경계통","t":"신경의 생리적 작용을 이해하고 신경계통의 중요성을 인식한다.","m":"이 성취기준은 생명 및 항상성 유지를 위해 신경계통이 수행하는 다양한 생리 현상을 파악할 수 있도록 설정하였다. 신경 생리, 신경의 생리 현상 탐구하기, 생명에 대한 존중 등의 내용을 다룬다. 신경의 생리 현상에 해당하는 흥분성과 전도성, 역치와 불응기, 변성과 재생 등을 파악함으로써 생명 및 항상성을 유지하기 위한 신경계통의 중요성을 인식하고 생명 존중에 대한 태도를 형성하는 데 중점을 둔다.","n":[],"p":654,"b":2},{"c":"[12해부05-03]","k":"선택","sk":"전문 교과(이료)","s":"해부·생리","g":"고등학교 1~3학년","d":"신경계통","t":"뇌와 척수의 구조를 파악하고 기능을 이해한다.","m":"이 성취기준은 중추신경을 뇌와 척수로 구분하고 그 구조 및 기능을 비교하여 파악할 수 있도록 설정하였다. 뇌와 척수, 뇌 및 척수의 구조 관찰하기, 중추신경계통의 중요성 인식 등의 내용을 다룬다. 뇌와 척수의 구조적 특징을 비교하고 관련 기능을 파악하여 중추신경계통의 중요성을 인식하는 데 중점을 둔다.","n":[],"p":655,"b":2},{"c":"[12해부05-04]","k":"선택","sk":"전문 교과(이료)","s":"해부·생리","g":"고등학교 1~3학년","d":"신경계통","t":"뇌척수막의 구조를 파악하고 기능을 이해한다.","m":"이 성취기준은 뇌와 척수에 대하여 뇌척수막이 가지는 의의를 이해할 수 있도록 설정하였다. 뇌척수막, 뇌척수막의 구조 관찰하기, 중추신경계통의 중요성 인식 등의 내용을 다룬다. 뇌척수막과 뇌척수액의 기능을 이해하고 모형 관찰을 통해 뇌척수막의 구조적 특징이 뇌와 척수에 미치는 영향을 파악하는 데 중점을 둔다.","n":[],"p":655,"b":2},{"c":"[12해부05-05]","k":"선택","sk":"전문 교과(이료)","s":"해부·생리","g":"고등학교 1~3학년","d":"신경계통","t":"반사의 정의와 특성을 알고 반사로를 파악한다.","m":"이 성취기준은 다양한 반사 현상이 인체에 미치는 영향과 그 중요성을 인식할 수 있도록 설정하였다. 반사 현상과 반사로, 반사의 종류와 특징 조사하기, 중추신경계통의 중요성 인식 등의 내용을 다룬다. 반사의 정의와 특성 및 반사로를 파악하고 인체에서 발생하는 다양한 반사 현상을 이해하는 데 중점을 둔다.","n":[],"p":655,"b":2},{"c":"[12해부05-06]","k":"선택","sk":"전문 교과(이료)","s":"해부·생리","g":"고등학교 1~3학년","d":"신경계통","t":"뇌척수신경의 종류와 분포 영역을 파악하고 기능을 이해한다.","m":"이 성취기준은 말초신경계통을 뇌신경 및 척수신경으로 구분하고 각 신경의 종류와 기능을 파악할 수 있도록 설정하였다. 뇌척수신경, 말초신경의 분포 영역 탐색하기, 말초신경계통의 중요성 인식 등의 내용을 다룬다. 뇌신경 및 척수신경의 종류와 기능을 알고 모형 관찰을 통해 말초신경계통의 분포 영역을 파악하는 데 중점을 둔다.","n":[],"p":656,"b":2},{"c":"[12해부05-07]","k":"선택","sk":"전문 교과(이료)","s":"해부·생리","g":"고등학교 1~3학년","d":"신경계통","t":"자율신경의 종류와 특징 및 분포 영역을 파악하고 기능을 이해한다.","m":"이 성취기준은 말초신경계통을 기능적으로 체성신경 및 자율신경으로 구분할 수 있음을 이해하고 자율신경의 종류와 특징을 파악할 수 있도록 설정하였다. 자율신경, 말초신경의 분포 영역 탐색하기, 교감신경과 부교감신경의 특징 비교하기, 말초신경계통의 중요성 인식 등의 내용을 다룬다. 자율신경의 종류, 작용 및 분포 영역을 알고 환경 변화에 따른 자율신경의 조절 작용을 이해함으로써 자율신경과 항상성 유지와의 관계를 인식하는 데 중점을 둔다.","n":[],"p":656,"b":2},{"c":"[12해부06-01]","k":"선택","sk":"전문 교과(이료)","s":"해부·생리","g":"고등학교 1~3학년","d":"내분비계통","t":"내분비선과 호르몬의 정의를 알고 특징을 이해한다.","m":"이 성취기준은 내분비선과 호르몬의 특징 및 관계를 이해함으로써 생명 유지에 관여하는 내분비선의 역할을 파악할 수 있도록 설정하였다. 내분비선과 호르몬의 관계, 내분비선과 외분비선 구별하기, 내분비선의 중요성 인식 등의 내용을 다룬다. 내분비선과 외분비선을 구분하고 내분비선과 호르몬의 정의 및 특징을 파악함으로써 호르몬이 인체에 미치는 영향을 이해하는 데 중점을 둔다.","n":[],"p":657,"b":2},{"c":"[12해부06-02]","k":"선택","sk":"전문 교과(이료)","s":"해부·생리","g":"고등학교 1~3학년","d":"내분비계통","t":"호르몬의 특이성을 파악하고 분비 조절 과정을 이해한다.","m":"이 성취기준은 실질적인 사례를 통하여 호르몬의 분비 조절 기전을 이해할 수 있도록 설정하였다. 호르몬의 분비와 조절, 호르몬의 분비와 조절 작용 탐구하기, 내분비선의 중요성 인식 등의 내용을 다룬다. 호르몬의 특이성을 알고 호르몬의 분비와 조절 과정을 파악함으로써 생명 현상에 있어 내분비선의 중요성을 인식하는 데 중점을 둔다.","n":[],"p":657,"b":2},{"c":"[12해부06-03]","k":"선택","sk":"전문 교과(이료)","s":"해부·생리","g":"고등학교 1~3학년","d":"내분비계통","t":"내분비선의 종류를 알고 구조를 파악한다.","m":"이 성취기준은 각 내분비선의 위치와 구조를 비교하고 기능에 있어 상호 연관성을 이해할 수 있도록 설정하였다. 내분비선의 종류와 구조, 내분비선의 구조 관찰하기 등의 내용을 다룬다. 내분비선의 종류와 위치를 알고 모형 관찰을 통해 각 내분비선의 구조적 특징을 파악하는 데 중점을 둔다.","n":[],"p":658,"b":2},{"c":"[12해부06-04]","k":"선택","sk":"전문 교과(이료)","s":"해부·생리","g":"고등학교 1~3학년","d":"내분비계통","t":"내분비선에서 분비되는 호르몬의 종류를 알고 작용을 이해한다.","m":"이 성취기준은 각 내분비선에서 분비되는 호르몬의 작용을 알고 호르몬 분비 이상으로 발생하는 특징을 파악할 수 있도록 설정하였다. 호르몬의 종류와 작용, 호르몬의 분비 이상 조사하기, 생명 존중 및 질병 예방에 대한 태도 등의 내용을 다룬다. 내분비선에서 분비되는 각종 호르몬의 종류와 작용을 파악하고 이러한 호르몬의 분비 이상으로 발생하는 질병과의 관계를 이해하는 데 중점을 둔다.","n":[],"p":658,"b":2},{"c":"[12해부07-01]","k":"선택","sk":"전문 교과(이료)","s":"해부·생리","g":"고등학교 1~3학년","d":"소화계통","t":"소화관과 소화선의 기본 구조를 알고 기능을 이해한다.","m":"이 성취기준은 소화계통을 구성하는 기관을 소화선과 소화관으로 나누어 구조와 기능을 파악할 수 있도록 설정하였다. 소화선, 소화관, 소화관과 소화선 구별하기 등의 내용을 다룬다. 소화기관을 소화관과 소화선으로 분류하고 기본 구조를 파악하여 구조적 특징에 따라 서로 다른 기능을 수행한다는 점을 이해하는 데 중점을 둔다.","n":[],"p":659,"b":2},{"c":"[12해부07-02]","k":"선택","sk":"전문 교과(이료)","s":"해부·생리","g":"고등학교 1~3학년","d":"소화계통","t":"소화기관의 위치를 알고 구조와 기능을 파악한다.","m":"이 성취기준은 소화계통을 구성하는 소화기관의 구조와 기능을 기관별로 파악할 수 있도록 설정하였다. 소화관(입, 식도, 위, 소장, 대장 등), 소화선(간, 췌장 등), 소화기관의 위치 찾기, 소화 작용과 소화기관의 중요성 인식 등의 내용을 다룬다. 소화기관을 구성하는 각 기관의 위치와 구조 및 기능을 파악하고, 음식물이 지나가는 과정을 이해함으로써 소화 작용과 소화기관의 중요성을 인식하여 건강한 생활을 영위하는 태도를 기르는 데 중점을 둔다.","n":[],"p":659,"b":2},{"c":"[12해부07-03]","k":"선택","sk":"전문 교과(이료)","s":"해부·생리","g":"고등학교 1~3학년","d":"소화계통","t":"소화 효소의 정의를 알고 특징을 이해한다.","m":"이 성취기준은 효소의 개념을 이해하여 소화 작용에서 수행하는 역할을 파악할 수 있도록 설정하였다. 소화 효소의 개요, 소화 효소의 기능 등의 내용을 다룬다. 소화 효소의 개념과 특징을 이해하고 화학적 소화에서 소화 효소의 역할과 중요성을 인식하는 데 중점을 둔다.","n":[],"p":660,"b":2},{"c":"[12해부07-04]","k":"선택","sk":"전문 교과(이료)","s":"해부·생리","g":"고등학교 1~3학년","d":"소화계통","t":"영양소별 소화와 흡수 과정을 알고 화학적 소화 과정을 파악한다.","m":"이 성취기준은 화학적 소화 과정을 영양소별로 파악하여 건강한 식사 습관을 형성할 수 있도록 설정하였다. 소화관의 흡수 작용, 영양소별 화학적 소화 과정 구별하기, 소화관별 흡수 과정 구별하기, 바람직한 식사 습관 형성 등의 내용을 다룬다. 소화관에서 기계적 소화 과정을 마친 물질이 화학적 소화 과정을 거쳐 흡수되고 불필요한 물질이 배설되는 과정을 종합적으로 파악하여 바람직한 식사 습관을 형성하는 데 중점을 둔다.","n":[],"p":660,"b":2},{"c":"[12해부08-01]","k":"선택","sk":"전문 교과(이료)","s":"해부·생리","g":"고등학교 1~3학년","d":"호흡계통","t":"호흡의 정의를 알고 호흡의 중요성을 인식한다.","m":"이 성취기준은 인체가 생명 유지를 위해 산소를 흡수하고 이산화탄소를 배출하는 이유와 중요성을 이해할 수 있도록 설정하였다. 호흡, 호흡과 호흡기관의 중요성 인식 등의 내용을 다룬다. 호흡의 정의를 이해하고 생명 유지를 위해 호흡의 중요성을 인식하여 건강한 생활을 영위하기 위한 태도를 기르는 데 중점을 둔다.","n":[],"p":660,"b":2},{"c":"[12해부08-02]","k":"선택","sk":"전문 교과(이료)","s":"해부·생리","g":"고등학교 1~3학년","d":"호흡계통","t":"기도의 종류를 알고 기도를 구성하는 기관의 위치와 구조 및 기능을 파악한다.","m":"이 성취기준은 공기의 이동 통로인 기도의 구조와 기능을 기관별로 파악할 수 있도록 설정하였다. 기도(코, 인두, 후두, 기관, 기관지 등), 기도의 위치 찾기, 공기의 이동 경로 찾기 등의 내용을 다룬다. 기도를 코, 후두, 기관, 기관지로 분류하고 위치와 구조를 파악하여 정상적인 환기를 위한 기도의 기능을 이해하는 데 중점을 둔다.","n":[],"p":660,"b":2},{"c":"[12해부08-03]","k":"선택","sk":"전문 교과(이료)","s":"해부·생리","g":"고등학교 1~3학년","d":"호흡계통","t":"폐의 위치와 구조를 알고 기능을 파악한다.","m":"이 성취기준은 환기가 이루어지는 폐의 구조와 기능을 파악할 수 있도록 설정하였다. 폐, 폐의 위치 찾기 등의 내용을 다룬다. 폐의 위치와 구조를 파악하고 정상적인 환기 과정을 위한 폐의 기능을 이해하는 데 중점을 둔다.","n":[],"p":660,"b":2},{"c":"[12해부08-04]","k":"선택","sk":"전문 교과(이료)","s":"해부·생리","g":"고등학교 1~3학년","d":"호흡계통","t":"호흡 운동의 정의를 알고 흡기 및 호기 운동 기전을 이해한다.","m":"이 성취기준은 호흡 운동의 과정을 근육 운동과 연관 지어 기전을 이해할 수 있도록 설정하였다. 호흡 운동, 호흡 운동과 근육의 작용 관찰하기 등의 내용을 다룬다. 호흡 운동을 흡기 운동과 호기 운동으로 나누어 과정을 이해하고, 호흡 운동을 할 때 나타나는 신체 변화를 관찰함으로써 근육과의 연관성을 파악하는 데 중점을 둔다.","n":[],"p":661,"b":2},{"c":"[12해부08-05]","k":"선택","sk":"전문 교과(이료)","s":"해부·생리","g":"고등학교 1~3학년","d":"호흡계통","t":"환기 과정을 알고 각 단계의 특징을 이해한다.","m":"이 성취기준은 폐포와 조직 내에서의 기체 교환 과정을 단계적으로 이해할 수있도록 설정하였다. 기체 교환 과정, 단계별 기체 교환 과정 조사하기 등의 내용을 다룬다. 폐포와 조직에서 이루어지는 기체 교환 과정의 기전과 차이를 구체적으로 파악하는 데 중점을 둔다.","n":[],"p":661,"b":2},{"c":"[12해부08-06]","k":"선택","sk":"전문 교과(이료)","s":"해부·생리","g":"고등학교 1~3학년","d":"호흡계통","t":"호흡의 생리적 조절 기전을 이해하고 항상성 유지를 위한 유기적 협조 관계를 파악한다.","m":"이 성취기준은 신체 활동 변화에 따라 호흡이 조절되는 항상성 기전을 이해할 수 있도록 설정하였다. 호흡 조절, 신체 활동과 호흡의 관계 관찰하기, 호흡과 순환 및 근육 운동과의 관계 인식 등의 내용을 다룬다. 신체 활동 상태에 따른 호흡 조절 기전을 이해하고, 신경계통 및 순환계통과의 기능 협조 과정을 파악하는 데 중점을 둔다.","n":[],"p":661,"b":2},{"c":"[12해부09-01]","k":"선택","sk":"전문 교과(이료)","s":"해부·생리","g":"고등학교 1~3학년","d":"비뇨계통","t":"신장의 위치와 구조를 알고 소변이 여과되는 과정을 이해한다.","m":"이 성취기준은 비뇨기관 중 소변의 여과에 있어 핵심적 기능을 수행하는 신장의 구조와 기능을 파악할 수 있도록 설정하였다. 신장, 신장의 위치 찾기, 비뇨기관의 중요성 인식 등의 내용을 다룬다. 신장의 위치와 구조를 파악하여 물질대사로 발생한 노폐물이 여과되는 과정을 이해함으로써 건강한 생활을 위한 비뇨기관의 중요성을 인식하는 데 중점을 둔다.","n":[],"p":662,"b":2},{"c":"[12해부09-02]","k":"선택","sk":"전문 교과(이료)","s":"해부·생리","g":"고등학교 1~3학년","d":"비뇨계통","t":"방광의 위치와 구조를 알고 기능을 이해한다.","m":"이 성취기준은 여과된 소변을 일시 저장했다가 배출하는 방광의 구조와 기능을 파악할 수 있도록 설정하였다. 방광, 방광의 위치 찾기 등의 내용을 다룬다. 방광의 위치와 구조를 파악하여 소변이 저장되고 배출되는 과정을 이해하는 데 중점을 둔다.","n":[],"p":662,"b":2},{"c":"[12해부09-03]","k":"선택","sk":"전문 교과(이료)","s":"해부·생리","g":"고등학교 1~3학년","d":"비뇨계통","t":"요관 및 요도의 위치와 구조를 알고 기능을 이해한다.","m":"이 성취기준은 신장에서 여과된 소변이 요관과 요도를 거쳐 배출되는 과정을 이해할 수 있도록 설정하였다. 요관과 요도, 요관과 요도의 위치 찾기 등의 내용을 다룬다. 모형 관찰을 통해 요관과 요도의 위치와 구조를 파악하여 정상적으로 소변을 배출하기 위한 요로의 역할을 이해하는 데 중점을 둔다.","n":[],"p":662,"b":2},{"c":"[12해부09-04]","k":"선택","sk":"전문 교과(이료)","s":"해부·생리","g":"고등학교 1~3학년","d":"비뇨계통","t":"소변의 성분을 알고 생산 과정을 파악한다.","m":"이 성취기준은 혈액 속의 노폐물이 소변의 성분이 되고 소변이 생성되는 과정을 단계적으로 파악할 수 있도록 설정하였다. 소변, 소변의 생성 과정 탐구하기 등의 내용을 다룬다. 물질대사에서 발생한 노폐물이 신장에서 걸러져 소변이 생성되는 과정을 사구체 여과, 신세관 재흡수, 신세관 분비의 기능적 특징을 중심으로 파악하는 데 중점을 둔다.","n":[],"p":663,"b":2},{"c":"[12해부09-05]","k":"선택","sk":"전문 교과(이료)","s":"해부·생리","g":"고등학교 1~3학년","d":"비뇨계통","t":"소변의 배설 과정을 이해하고 배뇨와 관련한 신경계통의 역할을 파악한다.","m":"이 성취기준은 정상적인 배뇨 기전을 이해하기 위해 배뇨중추의 역할을 파악할 수 있도록 설정하였다. 배뇨, 배뇨 경로 찾기, 배뇨의 중요성 인식 등의 내용을 다룬다. 소변이 정상적으로 배출되기 위한 신경계통의 역할을 통해 생리적 배뇨 기전을 이해하는 데 중점을 둔다.","n":[],"p":663,"b":2},{"c":"[12해부10-01]","k":"선택","sk":"전문 교과(이료)","s":"해부·생리","g":"고등학교 1~3학년","d":"생식계통","t":"남성 생식선과 부속생식선의 위치 및 구조를 알고 기능을 이해한다.","m":"이 성취기준은 남성 생식기관을 생식선과 생식관으로 구분하고 정자와 정액을 생산하는 생식선과 부속생식선의 구조와 기능을 파악할 수 있도록 설정하였다. 생식선과 부속생식선, 남성 생식선의 위치 찾기, 남성과 여성의 성차 인식 등의 내용을 다룬다. 남성 생식선과 부속생식선의 위치와 구조를 알고 기능을 파악함으로써 남성과 여성이 갖는 성차를 인식하는 데 중점을 둔다.","n":[],"p":664,"b":2},{"c":"[12해부10-02]","k":"선택","sk":"전문 교과(이료)","s":"해부·생리","g":"고등학교 1~3학년","d":"생식계통","t":"남성 생식관의 위치와 구조를 알고 정자의 배출 경로를 파악한다.","m":"이 성취기준은 남성 생식관과 외생식기관의 위치와 구조를 이해하여 정자의 배출 경로를 파악할 수 있도록 설정하였다. 생식관, 외생식기관, 남성 생식관의 위치 찾기, 정자의 배출 경로 조사하기 등의 내용을 다룬다. 생식관과 외생식기관의 위치와 특징을 이해하고 정자의 배출 경로를 파악하는 데 중점을 둔다.","n":[],"p":664,"b":2},{"c":"[12해부10-03]","k":"선택","sk":"전문 교과(이료)","s":"해부·생리","g":"고등학교 1~3학년","d":"생식계통","t":"여성 생식기관의 위치와 구조를 알고 기능을 이해한다.","m":"이 성취기준은 여성 생식기관의 구조와 기능을 파악하여 특징을 이해할 수 있도록 설정하였다. 난소, 난관, 자궁, 질, 외생식기관, 여성 생식기관의 위치 찾기 등의 내용을 다룬다. 여성 생식기관의 위치와 구조를 알고 생식 기능에 있어 남성과 여성의 차이를 인식하는 데 중점을 둔다.","n":[],"p":665,"b":2},{"c":"[12해부10-04]","k":"선택","sk":"전문 교과(이료)","s":"해부·생리","g":"고등학교 1~3학년","d":"생식계통","t":"배란과 월경의 정의를 이해하고 배란 과정을 파악한다.","m":"이 성취기준은 여성 생식기관의 생리적 기능을 배란과 월경 주기를 통해 종합적으로 이해할 수 있도록 설정하였다. 배란 과정, 월경 주기, 월경 주기와 임신 조사하기, 생명의 소중함과 존엄성 추구 등의 내용을 다룬다. 배란 과정을 월경 주기와 연관 지어 이해하고 임신과의 연관성을 통해 생명을 소중히 여기는 태도를 기르는 데 중점을 둔다.","n":[],"p":665,"b":2},{"c":"[12해부11-01]","k":"선택","sk":"전문 교과(이료)","s":"해부·생리","g":"고등학교 1~3학년","d":"감각기관","t":"감각의 정의를 알고 특성을 이해한다.","m":"이 성취기준은 감각의 정의를 알고 환경 변화에 적응하는 감각의 중요성을 인식할 수 있도록 설정하였다. 감각의 정의, 감각의 정의와 특성 조사하기, 환경 변화에 대한 감각의 중요성 인식 등의 내용을 다룬다. 감각의 정의 및 특성을 알고 환경 변화에 대처하는 감각의 중요성을 인식하는 데 중점을 둔다.","n":[],"p":666,"b":2},{"c":"[12해부11-02]","k":"선택","sk":"전문 교과(이료)","s":"해부·생리","g":"고등학교 1~3학년","d":"감각기관","t":"감각수용기의 종류를 알고 감각 생리 현상을 이해한다.","m":"이 성취기준은 감각수용기의 종류를 구분하고 감각의 생리 작용을 이해할 수 있도록 설정하였다. 감각수용기, 감각 생리, 감각수용기 비교하기, 감각의 생리 작용에 관한 사례 찾기 등의 내용을 다룬다. 감각수용기의 종류와 특성을 파악하고 감각수용기의 일반적인 생리 현상을 이해하는 데 중점을 둔다.","n":[],"p":666,"b":2},{"c":"[12해부11-03]","k":"선택","sk":"전문 교과(이료)","s":"해부·생리","g":"고등학교 1~3학년","d":"감각기관","t":"외피의 구조를 알고 기능을 이해한다.","m":"이 성취기준은 외피를 피부 및 피부 부속기관으로 구분하고 각각의 특징 및 기능을 파악할 수 있도록 설정하였다. 외피, 외피의 구조 관찰하기, 일반감각의 중요성 인식 등의 내용을 다룬다. 외피의 기능을 알고 모형 관찰을 통해 외피의 구조적 특징을 파악함으로써 인체에서 외피의 중요성을 인식하는 데 중점을 둔다.","n":[],"p":667,"b":2},{"c":"[12해부11-04]","k":"선택","sk":"전문 교과(이료)","s":"해부·생리","g":"고등학교 1~3학년","d":"감각기관","t":"체성감각의 종류를 알고 특징을 이해한다.","m":"이 성취기준은 체성감각을 피부감각 및 고유감각으로 구분하고 각각의 특징을 파악할 수 있도록 설정하였다. 체성감각, 체성감각과 내장감각의 특징 비교, 일반감각의 중요성 인식 등의 내용을 다룬다. 체성감각 수용기의 종류와 특징을 이해하고 외피와의 연관성을 파악함으로써 인체에서 체성감각의 중요성을 인식하는 데 중점을 둔다.","n":[],"p":667,"b":2},{"c":"[12해부11-05]","k":"선택","sk":"전문 교과(이료)","s":"해부·생리","g":"고등학교 1~3학년","d":"감각기관","t":"내장감각의 종류를 알고 특징을 이해한다.","m":"이 성취기준은 내장감각을 내장통각 및 장기감각으로 구분하고 각각의 특징을 파악할 수 있도록 설정하였다. 내장감각, 체성감각과 내장감각의 특징 비교, 일반감각의 중요성 인식 등의 내용을 다룬다. 내장감각의 종류와 특징을 이해하고 항상성 유지와의 연관성을 파악함으로써 인체에서 내장감각의 중요성을 인식하는 데 중점을 둔다.","n":[],"p":667,"b":2},{"c":"[12해부11-06]","k":"선택","sk":"전문 교과(이료)","s":"해부·생리","g":"고등학교 1~3학년","d":"감각기관","t":"특수감각기관의 종류를 알고 각 기관의 위치 및 구조를 파악한다.","m":"이 성취기준은 특수감각을 시각, 평형⋅청각, 후각, 미각으로 구분하고 각 감각기관의 특징을 이해할 수 있도록 설정하였다. 시각, 평형⋅청각, 후각, 미각, 특수감각기관의 구조 관찰하기, 특수감각의 중요성 인식 등의 내용을 다룬다. 특수감각기관의 종류를 알고 모형 관찰을 통해 각 특수감각기관의 구조적 특징을 이해하는 데 중점을 둔다.","n":[],"p":667,"b":2},{"c":"[12해부11-07]","k":"선택","sk":"전문 교과(이료)","s":"해부·생리","g":"고등학교 1~3학년","d":"감각기관","t":"특수감각기관의 생리적 작용을 이해하고 중요성을 인식한다.","m":"이 성취기준은 특수감각기관의 생리적 작용을 이해하고 각 감각기관이 환경 변화를 인식하는 방식을 파악할 수 있도록 설정하였다. 시각, 평형⋅청각, 후각, 미각, 특수감각의 생리적 작용 탐구하기, 특수감각의 중요성 인식 등의 내용을 다룬다. 특수감각기관의 생리적 현상을 알고 특수감각기관의 문제 발생 시 나타나는 현상을 파악함으로써 특수감각의 중요성을 인식하는 데 중점을 둔다.","n":[],"p":667,"b":2},{"c":"[12병리01-01]","k":"선택","sk":"전문 교과(이료)","s":"병리","g":"고등학교 1~3학년","d":"병리학의 기초","t":"병리학의 정의를 알고 분류 체계를 이해한다.","m":"이 성취기준은 병리학의 개념과 분류 체계를 파악할 수 있도록 설정하였다. 병리학의 정의, 병리학의 분류 등의 내용을 다룬다. 병리학의 역할을 이해하여 임상에서 효과적으로 활용할 수 있는 능력을 기르는 데 중점을 둔다.","n":[],"p":678,"b":2},{"c":"[12병리01-02]","k":"선택","sk":"전문 교과(이료)","s":"병리","g":"고등학교 1~3학년","d":"병리학의 기초","t":"병리학의 연구 대상을 알고 연구 분야를 파악한다.","m":"이 성취기준은 병리학의 연구 분야를 파악할 수 있도록 설정하였다. 병리학의 연구 대상 탐구하기의 내용을 다룬다. 기초 의학과 임상의학과의 연관성을 이해하고 병리학의 중요성을 인지하는 데 중점을 둔다.","n":[],"p":678,"b":2},{"c":"[12병리01-03]","k":"선택","sk":"전문 교과(이료)","s":"병리","g":"고등학교 1~3학년","d":"병리학의 기초","t":"질병과 증상의 정의를 알고 기준에 따라 분류한다.","m":"이 성취기준은 질병과 증상의 개념을 파악할 수 있도록 설정하였다. 질병과 증상의 내용을 다룬다. 질병과 증상의 종류를 분류하여 임상에 활용할 수 있는 능력을 기르는 데 중점을 둔다.","n":[],"p":678,"b":2},{"c":"[12병리01-04]","k":"선택","sk":"전문 교과(이료)","s":"병리","g":"고등학교 1~3학년","d":"병리학의 기초","t":"내인과 외인의 정의를 알고 종류별로 분류한다.","m":"이 성취기준은 질병의 원인을 파악할 수 있도록 설정하였다. 병인, 내인과 외인 비교하기 등의 내용을 다룬다. 질병을 일으키는 원인을 파악하여 질병의 진행 과정을 탐구할 수 있는 능력을 기르는 데 중점을 둔다.","n":[],"p":678,"b":2},{"c":"[12병리02-01]","k":"선택","sk":"전문 교과(이료)","s":"병리","g":"고등학교 1~3학년","d":"세포 손상과 세포 적응","t":"세포 손상의 정의를 알고 원인을 파악한다.","m":"이 성취기준은 세포 손상의 개념과 원인을 파악할 수 있도록 설정하였다. 세포 손상의 특징, 세포 손상의 원인 구분하기 등의 내용을 다룬다. 이를 바탕으로 질병 발생의 기초적 지식을 익히는 데 중점을 둔다.","n":[],"p":679,"b":2},{"c":"[12병리02-02]","k":"선택","sk":"전문 교과(이료)","s":"병리","g":"고등학교 1~3학년","d":"세포 손상과 세포 적응","t":"세포 손상의 기전을 이해하고 가역 세포 손상과 비가역 세포 손상의 개념을 파악한다.","m":"이 성취기준은 세포 손상의 기전을 파악할 수 있도록 설정하였다. 세포 반응의 기전, 세포 손상의 기전 탐구하기 등의 내용을 다룬다. 유해 자극이 세포에 가해질 때 세포의 반응 기전을 학습하며 이를 통하여 가역 세포 손상과 비가역 세포 손상의 병리학적 특성을 파악함으로써 질병의 진행 과정을 이해하는 데 중점을 둔다.","n":[],"p":679,"b":2},{"c":"[12병리02-03]","k":"선택","sk":"전문 교과(이료)","s":"병리","g":"고등학교 1~3학년","d":"세포 손상과 세포 적응","t":"세포 손상의 종류를 알고 특징을 이해한다.","m":"이 성취기준은 세포 손상의 특징을 파악할 수 있도록 설정하였다. 세포 손상의 이해, 세포 손상의 특징 탐구하기 등의 내용을 다룬다. 세포 손상의 개념과 종류 및 그 특징을 학습함으로써 인체의 기본단위인 세포 손상과 질병과의 연관성을 이해하는 데 중점을 둔다.","n":[],"p":680,"b":2},{"c":"[12병리02-04]","k":"선택","sk":"전문 교과(이료)","s":"병리","g":"고등학교 1~3학년","d":"세포 손상과 세포 적응","t":"괴사와 세포자멸사의 정의를 알고 공통점과 차이점을 비교한다.","m":"이 성취기준은 괴사와 세포자멸사의 개념을 파악할 수 있도록 설정하였다. 세포 손상의 이해, 괴사와 세포자멸사 비교하기 등의 내용을 다룬다. 괴사와 세포자멸사의 기본 개념을 이해하고 괴사의 종류와 특성을 학습함으로써 괴사로 인한 질병의 특징을 이해하는 데 중점을 둔다.","n":[],"p":680,"b":2},{"c":"[12병리02-05]","k":"선택","sk":"전문 교과(이료)","s":"병리","g":"고등학교 1~3학년","d":"세포 손상과 세포 적응","t":"세포 내 물질 축적의 종류를 알고 특징을 파악한다.","m":"이 성취기준은 세포 내 물질 축적의 특징을 파악할 수 있도록 설정하였다. 세포 손상의 이해, 세포 내 물질 축적 탐구하기 등의 내용을 다룬다. 세포 내 물질 축적으로 인한 여러 조직과 기관의 구조적⋅기능적 변화를 이해하는 데 중점을 둔다.","n":[],"p":680,"b":2},{"c":"[12병리02-06]","k":"선택","sk":"전문 교과(이료)","s":"병리","g":"고등학교 1~3학년","d":"세포 손상과 세포 적응","t":"세포 적응의 종류를 알고 특징을 파악한다.","m":"이 성취기준은 세포 적응의 특징을 파악할 수 있도록 설정하였다. 세포 적응의 이해, 세포 적응의 사례 조사하기 등의 내용을 다룬다. 세포 적응에 해당하는 위축, 비대, 증식, 화생, 형성이상의 특징을 학습함으로써 세포에 자극이 가해져서 나타나는 세포의 변화를 이해하는 데 중점을 둔다.","n":[],"p":681,"b":2},{"c":"[12병리02-07]","k":"선택","sk":"전문 교과(이료)","s":"병리","g":"고등학교 1~3학년","d":"세포 손상과 세포 적응","t":"비대와 증식의 정의를 알고 공통점과 차이점을 비교한다.","m":"이 성취기준은 비대와 증식의 개념을 파악할 수 있도록 설정하였다. 세포 적응의 이해, 비대와 증식 비교하기 등의 내용을 다룬다. 비대와 증식으로 인한 여러 조직과 기관의 구조적⋅기능적 변화를 이해하는 데 중점을 둔다.","n":[],"p":681,"b":2},{"c":"[12병리02-08]","k":"선택","sk":"전문 교과(이료)","s":"병리","g":"고등학교 1~3학년","d":"세포 손상과 세포 적응","t":"화생과 형성이상의 정의를 알고 특징을 파악한다.","m":"이 성취기준은 화생과 형성이상의 개념을 파악할 수 있도록 설정하였다. 세포 적응의 이해, 화생과 형성이상 비교하기 등의 내용을 다룬다. 화생과 형성이상의 공통점과 차이점을 학습함으로써 화생과 형성이상이 지니는 조직의 형태적 변화의 차이점을 파악하는 데 중점을 둔다.","n":[],"p":681,"b":2},{"c":"[12병리03-01]","k":"선택","sk":"전문 교과(이료)","s":"병리","g":"고등학교 1~3학년","d":"염증과 치유","t":"염증의 정의를 알고 염증의 원인을 이해한다.","m":"이 성취기준은 염증의 개념과 원인을 파악할 수 있도록 설정하였다. 염증의 이해, 염증의 병리적 가치 내면화 등의 내용을 다룬다. 염증이 생체자극에 대한 방어반응이라는 것을 이해하는 데 중점을 둔다.","n":[],"p":682,"b":2},{"c":"[12병리03-02]","k":"선택","sk":"전문 교과(이료)","s":"병리","g":"고등학교 1~3학년","d":"염증과 치유","t":"국소 증상과 전신 증상의 특징을 이해하고 비교한다.","m":"이 성취기준은 염증의 국소 증상과 전신 증상을 파악할 수 있도록 설정하였다. 염증의 이해, 염증의 국소 증상과 전신 증상 비교하기 등의 내용을 다룬다. 염증 증상과 각종 질병이 발생할 때 나타나는 증상과의 연관성을 이해하는 데 중점을 둔다.","n":[],"p":682,"b":2},{"c":"[12병리03-03]","k":"선택","sk":"전문 교과(이료)","s":"병리","g":"고등학교 1~3학년","d":"염증과 치유","t":"염증에 관여하는 세포와 체액 인자의 종류를 알고 특징을 이해한다.","m":"이 성취기준은 염증에 관여하는 세포와 체액 인자를 파악할 수 있도록 설정하였다. 염증과 관련된 세포와 체액 인자, 염증 관련 체액 인자 구분하기 등의 내용을 다룬다. 염증에 관여하는 세포와 체액 인자의 종류와 기능을 이해함으로써 염증으로 인한 세포 내 물질 변화의 기전을 이해하는 데 중점을 둔다.","n":[],"p":682,"b":2},{"c":"[12병리03-04]","k":"선택","sk":"전문 교과(이료)","s":"병리","g":"고등학교 1~3학년","d":"염증과 치유","t":"급성염증의 정의를 알고 염증의 변화와 생체반응을 파악한다.","m":"이 성취기준은 급성염증의 개념을 파악할 수 있도록 설정하였다. 급성염증, 급성염증과 만성염증 비교하기 등의 내용을 다룬다. 급성염증의 개념을 이해하고 염증의 변화와 생체의 반응을 학습함으로써 염증으로 인한 국소 조직의 변화를 파악하는 데 중점을 둔다.","n":[],"p":682,"b":2},{"c":"[12병리03-05]","k":"선택","sk":"전문 교과(이료)","s":"병리","g":"고등학교 1~3학년","d":"염증과 치유","t":"만성염증의 정의를 알고 조직학적 변화를 파악한다.","m":"이 성취기준은 만성염증의 개념을 파악할 수 있도록 설정하였다. 만성염증, 급성염증과 만성염증 비교하기 등의 내용을 다룬다. 만성염증의 개념과 조직학적 변화를 이해하여 다양한 질병으로 인한 조직과 기관의 변화 양상을 파악하는 데 중점을 둔다.","n":[],"p":682,"b":2},{"c":"[12병리03-06]","k":"선택","sk":"전문 교과(이료)","s":"병리","g":"고등학교 1~3학년","d":"염증과 치유","t":"염증의 형태학적 양상에 따른 종류를 알고 특징을 파악한다.","m":"이 성취기준은 염증의 형태학적 양상을 파악할 수 있도록 설정하였다. 염증의 형태학적 양상, 종류, 특징 등의 내용을 다룬다. 염증으로 인한 각종 조직과 기관의 형태적⋅기능적 변화를 파악하는 데 중점을 둔다.","n":[],"p":682,"b":2},{"c":"[12병리03-07]","k":"선택","sk":"전문 교과(이료)","s":"병리","g":"고등학교 1~3학년","d":"염증과 치유","t":"재생의 정의와 종류를 알고 재생에 영향을 미치는 인자를 파악한다.","m":"이 성취기준은 재생의 개념을 파악할 수 있도록 설정하였다. 재생과 치유의 이해를 다룬다. 재생의 개념과 그 종류를 이해하기 위하여 생리적 재생에 해당하는 예를 제시함으로써 학습의 이해도를 높이는 데 중점을 둔다.","n":[],"p":683,"b":2},{"c":"[12병리03-08]","k":"선택","sk":"전문 교과(이료)","s":"병리","g":"고등학교 1~3학년","d":"염증과 치유","t":"재생 능력에 따라 세포를 분류하고 그 기전을 이해한다.","m":"이 성취기준은 재생의 기전을 파악할 수 있도록 설정하였다. 재생 능력에 따른 세포의 분류, 재생의 기전 탐구하기 등의 내용을 다룬다. 기관의 기능과 기관을 이루고 있는 조직의 세포를 이해하고 각각의 조직세포가 지니는 재생 능력을 파악하여 인체가 가지고 있는 재생 능력을 이해하는 데 중점을 둔다.","n":[],"p":683,"b":2},{"c":"[12병리03-09]","k":"선택","sk":"전문 교과(이료)","s":"병리","g":"고등학교 1~3학년","d":"염증과 치유","t":"창상 치유의 정의와 과정을 알고 창상 치유의 지연 인자를 파악한다.","m":"이 성취기준은 창상 치유의 과정을 파악할 수 있도록 설정하였다. 창상 치유의 과정, 치유 지연 인자 구분하기 등의 내용을 다룬다. 창상 치유를 지연시키는 전신 인자의 중요성을 이해하는 데 중점을 둔다.","n":[],"p":683,"b":2},{"c":"[12병리03-10]","k":"선택","sk":"전문 교과(이료)","s":"병리","g":"고등학교 1~3학년","d":"염증과 치유","t":"이물질의 처리 과정을 이해하고 종류를 구분한다.","m":"이 성취기준은 이물질의 처리 과정을 파악할 수 있도록 설정하였다. 이물질의 처리 내용을 다룬다. 괴사한 조직이나 외상 후 파괴된 조직이 원래 상태로 회복되는 기전을 이해하는 데 중점을 둔다.","n":[],"p":683,"b":2},{"c":"[12병리04-01]","k":"선택","sk":"전문 교과(이료)","s":"병리","g":"고등학교 1~3학년","d":"순환장애","t":"혈액 순환장애의 종류를 알고 특징을 파악한다.","m":"이 성취기준은 혈액 순환장애의 특징을 파악할 수 있도록 설정하였다. 혈액 순환장애의 이해, 경색증과 건강 습관 실천 의지 등의 내용을 다룬다. 혈액 순환장애에 의한 조직이나 장기의 기능적⋅구조적 변화를 이해하는 데 중점을 둔다.","n":[],"p":684,"b":2},{"c":"[12병리04-02]","k":"선택","sk":"전문 교과(이료)","s":"병리","g":"고등학교 1~3학년","d":"순환장애","t":"혈전의 형성 기전을 이해하고 색전증과 경색증의 특징을 파악한다.","m":"이 성취기준은 혈전증의 특징을 파악할 수 있도록 설정하였다. 혈전의 형성 기전 탐구하기, 색전증과 경색증 비교하기 등의 내용을 다룬다. 혈전증의 개념과 혈전의 형성 기전 및 혈전증의 특징을 학습함으로써 혈전으로 인한 심혈관계 질환의 특징과 원리를 이해하는 데 중점을 둔다.","n":[],"p":684,"b":2},{"c":"[12병리04-03]","k":"선택","sk":"전문 교과(이료)","s":"병리","g":"고등학교 1~3학년","d":"순환장애","t":"부종의 정의를 알고 원인과 특징을 이해한다.","m":"이 성취기준은 부종의 원인과 특징을 파악할 수 있도록 설정하였다. 체액 순환장애의 이해, 부종 탐구하기 등의 내용을 다룬다. 폐부종과 뇌부종의 기전을 습득하여 임상 적용의 기초 지식으로 활용하는 데 중점을 둔다.","n":[],"p":685,"b":2},{"c":"[12병리04-04]","k":"선택","sk":"전문 교과(이료)","s":"병리","g":"고등학교 1~3학년","d":"순환장애","t":"탈수증의 정의를 알고 임상적 증상을 파악한다.","m":"이 성취기준은 탈수증의 증상을 파악할 수 있도록 설정하였다. 체액 순환장애의 이해, 탈수증 탐구하기 등의 내용을 다룬다. 수분 결핍 탈수와 염분 결핍 탈수의 증상을 비교함으로써 수분과 염분의 생리적 기능을 이해하는 데 중점을 둔다.","n":[],"p":685,"b":2},{"c":"[12병리05-01]","k":"선택","sk":"전문 교과(이료)","s":"병리","g":"고등학교 1~3학년","d":"면역","t":"면역의 정의를 알고 기전을 이해한다.","m":"이 성취기준은 면역의 기전을 파악할 수 있도록 설정하였다. 면역, 면역과 건강 습관 실천 의지 등의 내용을 다룬다. 면역의 개념을 파악하고 기전을 학습함으로써 방어기전으로서의 항원항체반응의 병리적 의미를 이해하는 데 중점을 둔다.","n":[],"p":686,"b":2},{"c":"[12병리05-02]","k":"선택","sk":"전문 교과(이료)","s":"병리","g":"고등학교 1~3학년","d":"면역","t":"선천면역과 후천면역의 특징을 알고 비교한다.","m":"이 성취기준은 선천면역과 후천면역의 특징을 파악할 수 있도록 설정하였다. 면역, 선천면역과 후천면역 비교하기 등의 내용을 다룬다. 면역능력과 같은 내적 요인들이 생체 저항력을 관장하고 있는 기전을 이해하는 데 중점을 둔다.","n":[],"p":686,"b":2},{"c":"[12병리05-03]","k":"선택","sk":"전문 교과(이료)","s":"병리","g":"고등학교 1~3학년","d":"면역","t":"면역에 관여하는 세포의 종류를 알고 작용을 파악한다.","m":"이 성취기준은 면역 세포의 작용을 파악할 수 있도록 설정하였다. 면역 세포, 면역 세포 기전 탐구하기 등의 내용을 다룬다. 면역에 관여하는 세포의 종류와 그 작용을 학습함으로써 면역 관련 기관의 구조와 기능을 이해하는 데 중점을 둔다.","n":[],"p":686,"b":2},{"c":"[12병리05-04]","k":"선택","sk":"전문 교과(이료)","s":"병리","g":"고등학교 1~3학년","d":"면역","t":"면역결핍의 원인을 알고 면역결핍증을 분류한다.","m":"이 성취기준은 면역결핍의 원인을 파악할 수 있도록 설정하였다. 면역결핍, 면역 결핍증 탐구하기 등의 내용을 다룬다. 당뇨병이나 악성종양 환자의 면역결핍을 학습함으로써 감염성 질환에 대처하는 능력을 기르는 데 중점을 둔다.","n":[],"p":687,"b":2},{"c":"[12병리05-05]","k":"선택","sk":"전문 교과(이료)","s":"병리","g":"고등학교 1~3학년","d":"면역","t":"이식거부반응의 기전을 이해하고 이식과 면역 반응의 관계를 파악한다.","m":"이 성취기준은 이식거부반응의 기전을 파악할 수 있도록 설정하였다. 이식거부반응, 이식과 면역 반응의 관계 탐구하기 등의 내용을 다룬다. 조직적합항원의 기능을 학습함으로써 면역체계의 기전을 이해하는 데 중점을 둔다.","n":[],"p":687,"b":2},{"c":"[12병리05-06]","k":"선택","sk":"전문 교과(이료)","s":"병리","g":"고등학교 1~3학년","d":"면역","t":"과민반응의 기전을 이해하고 주요 질환의 특징을 파악한다.","m":"이 성취기준은 과민반응의 기전을 파악할 수 있도록 설정하였다. 과민반응 질환 탐구하기, 과민반응의 예방 행동 수칙 습관화 등의 내용을 다룬다. 과민반응의 개념과 과민반응 질환의 특징을 학습함으로써 과민반응으로 인한 면역손상의 기전을 이해하는 데 중점을 둔다.","n":[],"p":687,"b":2},{"c":"[12병리05-07]","k":"선택","sk":"전문 교과(이료)","s":"병리","g":"고등학교 1~3학년","d":"면역","t":"자가면역질환의 기전을 이해하고 주요 질환의 특징을 파악한다.","m":"이 성취기준은 자가면역질환의 기전을 파악할 수 있도록 설정하였다. 자가면역질환, 자가면역질환 기전 탐구하기 등의 내용을 다룬다. 자가면역질환이 유전적인 요인이나 면역적⋅환경적 요인에 의하여 발생함을 이해하는 데 중점을 둔다.","n":[],"p":687,"b":2},{"c":"[12병리06-01]","k":"선택","sk":"전문 교과(이료)","s":"병리","g":"고등학교 1~3학년","d":"감염","t":"기생의 정의를 알고 감염성과 병독성의 관계를 파악한다.","m":"이 성취기준은 감염성과 병독성의 관계를 파악할 수 있도록 설정하였다. 숙주와 미생물, 감염과 건강 관리 실천 의지 등의 내용을 다룬다. 기생의 개념, 감염성과 병독성의 관계를 파악함으로써 새로운 감염질환의 발생에 어떤 요인이 작용하고 있는지를 이해하는 데 중점을 둔다.","n":[],"p":688,"b":2},{"c":"[12병리06-02]","k":"선택","sk":"전문 교과(이료)","s":"병리","g":"고등학교 1~3학년","d":"감염","t":"감염 방식을 이해하고 감염병의 진행 과정을 파악한다.","m":"이 성취기준은 감염병의 진행 과정을 파악할 수 있도록 설정하였다. 감염 방식, 감염병의 진행 과정 탐구하기 등의 내용을 다룬다. 감염의 방식과 감염병의 진행 과정을 파악함으로써 일상생활에서 자주 걸리거나 접할 수 있는 감염병의 증상을 설명하고, 감염병의 진행 과정을 단계별로 구분하여 이해하는 데 중점을 둔다.","n":[],"p":688,"b":2},{"c":"[12병리06-03]","k":"선택","sk":"전문 교과(이료)","s":"병리","g":"고등학교 1~3학년","d":"감염","t":"병원체의 종류를 알고 특징을 파악한다.","m":"이 성취기준은 병원체의 특징을 파악할 수 있도록 설정하였다. 병원체, 병원체 구분하기 등의 내용을 다룬다. 병원체의 종류와 그 특징을 학습함으로써 바이러스에 의한 감염성 질환의 증상을 이해하는 데 중점을 둔다.","n":[],"p":688,"b":2},{"c":"[12병리06-04]","k":"선택","sk":"전문 교과(이료)","s":"병리","g":"고등학교 1~3학년","d":"감염","t":"기관을 통한 감염의 종류를 알고 특징을 파악한다.","m":"이 성취기준은 기관을 통한 감염의 특징을 파악할 수 있도록 설정하였다. 감염의 종류, 방역 행동 수칙 습관화 등의 내용을 다룬다. 병원체가 피부, 위장관, 호흡기관, 비뇨기관 등을 통하여 인체 내부로 들어오는 과정을 일상생활과 관련지어 이해하는 데 중점을 둔다.","n":[],"p":689,"b":2},{"c":"[12병리06-05]","k":"선택","sk":"전문 교과(이료)","s":"병리","g":"고등학교 1~3학년","d":"감염","t":"성 전파 감염과 의료 관련 감염의 특징을 파악하고 전파 경로를 조사한다.","m":"이 성취기준은 성 전파 감염과 의료 관련 감염의 특징을 파악할 수 있도록 설정하였다. 감염의 종류, 성 전파 감염과 의료 관련 감염 경로 조사하기 등의 내용을 다룬다. 감염증은 치료에서 직접적인 대상 질환인 경우가 많고, 또 그 이외의 질환에서도 이차적으로 염증이나 감염증이 나타나는 경우가 자주 있으므로 염증과 감염증의 원인, 경과, 결과 등에 대한 지식을 습득하는 데 중점을 둔다.","n":[],"p":689,"b":2},{"c":"[12병리07-01]","k":"선택","sk":"전문 교과(이료)","s":"병리","g":"고등학교 1~3학년","d":"종양","t":"종양의 정의를 알고 특징을 파악한다.","m":"이 성취기준은 종양의 특징을 파악할 수 있도록 설정하였다. 종양의 이해, 종양의 병리적 가치 내면화 등의 내용을 다룬다. 종양이 간, 갑상선, 부신, 연골 또는 지방과 같이 특수하게 분화된 세포에서 발생하는 원리를 이해하는 데 중점을 둔다.","n":[],"p":689,"b":2},{"c":"[12병리07-02]","k":"선택","sk":"전문 교과(이료)","s":"병리","g":"고등학교 1~3학년","d":"종양","t":"종양을 분류하고 종양의 명명법을 적용한다.","m":"이 성취기준은 종양의 명명법을 파악할 수 있도록 설정하였다. 종양의 이해, 종양의 명명법 적용하기 등의 내용을 다룬다. 종양을 악성도와 발생 기원 조직에 따라 분류하여 적용하는 데 중점을 둔다.","n":[],"p":689,"b":2},{"c":"[12병리07-03]","k":"선택","sk":"전문 교과(이료)","s":"병리","g":"고등학교 1~3학년","d":"종양","t":"종양의 원인과 구조를 파악하고 발생 기전을 이해한다.","m":"이 성취기준은 종양의 발생 기전을 파악할 수 있도록 설정하였다. 종양의 원인, 종양의 구조, 종양의 발생 기전 탐구하기 등의 내용을 다룬다. 종양의 조직학적 특징을 실질과 기질로 나누어 이해하는 데 중점을 둔다.","n":[],"p":690,"b":2},{"c":"[12병리07-04]","k":"선택","sk":"전문 교과(이료)","s":"병리","g":"고등학교 1~3학년","d":"종양","t":"양성종양과 악성종양의 특징을 이해하고 차이점을 비교한다.","m":"이 성취기준은 양성종양과 악성종양의 특징을 파악할 수 있도록 설정하였다. 종양의 구조, 양성종양과 악성종양 비교하기 등의 내용을 다룬다. 악성종양의 전자현미경적 특징을 이해하는 데 중점을 둔다.","n":[],"p":690,"b":2},{"c":"[12병리07-05]","k":"선택","sk":"전문 교과(이료)","s":"병리","g":"고등학교 1~3학년","d":"종양","t":"종양의 전이 경로를 알고 특징을 파악한다.","m":"이 성취기준은 종양 전이의 특징을 파악할 수 있도록 설정하였다. 종양의 전이 경로, 종양 예방 건강 습관 실천 의지 등의 내용을 다룬다. 종양 전이의 다양성에 따른 위험성을 이해하고 조기 발견과 예방의 중요성을 인식하는 데 중점을 둔다.","n":[],"p":691,"b":2},{"c":"[12병리07-06]","k":"선택","sk":"전문 교과(이료)","s":"병리","g":"고등학교 1~3학년","d":"종양","t":"종양의 진행 과정을 알고 등급과 병기를 분류한다.","m":"이 성취기준은 종양의 진행 과정을 파악할 수 있도록 설정하였다. 종양의 진행 과정, 종양의 등급과 병기 분류하기 등의 내용을 다룬다. 종양의 등급과 병기를 학습함으로써 종양의 등급이 종양 치료에서 중요함을 이해하는 데 중점을 둔다.","n":[],"p":691,"b":2},{"c":"[12병리07-07]","k":"선택","sk":"전문 교과(이료)","s":"병리","g":"고등학교 1~3학년","d":"종양","t":"종양이 인체에 미치는 영향을 알고 국소적 영향과 전신적 영향으로 구분한다.","m":"이 성취기준은 종양이 인체에 미치는 영향을 파악할 수 있도록 설정하였다. 종양이 인체에 미치는 영향 탐구하기, 종양의 인체 영향 내면화 등의 내용을 다룬다. 종양이 인체에 미치는 국소적 영향과 전신적 영향을 이해함으로써 종양 증상에 따른 대처법을 파악하는 데 중점을 둔다.","n":[],"p":691,"b":2},{"c":"[12병리08-01]","k":"선택","sk":"전문 교과(이료)","s":"병리","g":"고등학교 1~3학년","d":"유전","t":"염색체의 구조를 파악하고 기능을 이해한다.","m":"이 성취기준은 염색체의 구조와 기능을 파악할 수 있도록 설정하였다. 염색체의 구조와 기능, 유전병의 병리적 가치 내면화 등의 내용을 다룬다. 염색체의 구조와 기능을 학습함으로써 세포분열 과정에서 염색체의 변화 과정을 이해하는 데 중점을 둔다.","n":[],"p":692,"b":2},{"c":"[12병리08-02]","k":"선택","sk":"전문 교과(이료)","s":"병리","g":"고등학교 1~3학년","d":"유전","t":"유전자의 구조를 파악하고 유전의 기전을 이해한다.","m":"이 성취기준은 유전의 기전을 파악할 수 있도록 설정하였다. 유전자의 구조 탐구하기, 유전의 기전 탐구하기 등의 내용을 다룬다. 유전자의 구조와 유전의 기전을 파악함으로써 유전의 기전에 의해 형태와 기능 면에서 인체에 표현되는 다양한 성질인 유전형질을 이해하는 데 중점을 둔다.","n":[],"p":692,"b":2},{"c":"[12병리08-03]","k":"선택","sk":"전문 교과(이료)","s":"병리","g":"고등학교 1~3학년","d":"유전","t":"염색체 이상의 원리를 이해하고 관련 질병을 파악한다.","m":"이 성취기준은 염색체 이상의 원리를 파악할 수 있도록 설정하였다. 염색체 이상의 원리, 염색체 이상 질병의 종류 등의 내용을 다룬다. 염색체 이상의 원리와 관련 질병을 파악함으로써 염색체 수의 이상과 구조의 이상을 이해하는 데 중점을 둔다.","n":[],"p":692,"b":2},{"c":"[12병리08-04]","k":"선택","sk":"전문 교과(이료)","s":"병리","g":"고등학교 1~3학년","d":"유전","t":"단일유전의 원리를 이해하고 관련 질병을 파악한다.","m":"이 성취기준은 단일유전의 원리를 파악할 수 있도록 설정하였다. 단일유전의 원리와 관련 질병 탐구하기, 유전병과 건강 습관 실천 의지 등의 내용을 다룬다. 단일유전의 원리와 관련 질병을 파악함으로써 멘델 유전병을 중심으로 멘델의 법칙을 이해하는 데 중점을 둔다.","n":[],"p":692,"b":2},{"c":"[12병리08-05]","k":"선택","sk":"전문 교과(이료)","s":"병리","g":"고등학교 1~3학년","d":"유전","t":"다인유전의 원리를 이해하고 관련 질병을 파악한다.","m":"이 성취기준은 다인유전의 원리를 파악할 수 있도록 설정하였다. 다인유전의 원리와 관련 질병 탐구하기, 유전병과 건강 습관 실천 의지 등의 내용을 다룬다. 다인유전의 원리와 관련 질병을 파악함으로써 환경의 영향과 둘 이상의 변이유전자가 복합적으로 작용하여 발생함을 이해하는 데 중점을 둔다.","n":[],"p":692,"b":2},{"c":"[12이보01-01]","k":"선택","sk":"전문 교과(이료)","s":"이료보건","g":"고등학교 1~3학년","d":"보건의 기초","t":"건강과 질병의 개념을 이해하고 질병의 자연사 단계 및 예방 활동을 파악한다.","m":"이 성취기준은 국민의 기본적인 권리인 건강의 개념을 이해하고 질병의 발생 및 회복 단계와 예방 활동을 통해 보건의 목적이 질병 치료가 아닌 예방 활동에 있음을 파악하도록 설정하였다. 건강과 질병의 개념, 질병의 자연사 단계 분석하기, 질병의 예방 활동 적용하기 등의 내용을 다룬다. 건강의 변천 개념 및 건강과 질병의 상호 관계, 질병의 자연사 단계와 1차, 2차, 3차 질병 예방 활동을 파악하는 데 중점을 둔다.","n":[],"p":702,"b":2},{"c":"[12이보01-02]","k":"선택","sk":"전문 교과(이료)","s":"이료보건","g":"고등학교 1~3학년","d":"보건의 기초","t":"건강 증진의 요인 및 건강 검진 제도를 이해하고 건강한 생활 습관을 형성한다.","m":"이 성취기준은 건강 수준을 높이기 위한 건강 증진 사업의 결정 요인을 이해하고 건강 유지에 중요한 역할을 하는 건강 검진 제도를 파악하도록 설정하였다. 건강 증진, 건강 검진 제도 조사하기, 건강한 생활 습관 형성 등의 내용을 다룬다. 건강 증진의 개념과 결정 요인, 건강 검진 제도의 종류 및 주요 검사 항목을 파악하여 제도 시행의 중요성 및 건강한 생활 습관을 형성시키는 데 중점을 둔다.","n":[],"p":702,"b":2},{"c":"[12이보01-03]","k":"선택","sk":"전문 교과(이료)","s":"이료보건","g":"고등학교 1~3학년","d":"보건의 기초","t":"보건의 정의와 목적을 이해하고 일상생활과 보건의 연관성을 인식한다.","m":"이 성취기준은 질병을 예방하고 건강을 증진하기 위해 보건의 정의와 목적에 대해 이해하고 이를 통해 보건의 영역을 다각도로 파악하도록 설정하였다. 보건의 정의와 목적, 일상생활과 보건의 연관성 인식 등의 내용을 다룬다. 보건의 정의와 보건사업의 목적을 이해하여 실생활과 밀접한 관련성을 갖는 보건학의 중요성을 인식하는 데 중점을 둔다.","n":[],"p":703,"b":2},{"c":"[12이보01-04]","k":"선택","sk":"전문 교과(이료)","s":"이료보건","g":"고등학교 1~3학년","d":"보건의 기초","t":"공중보건의 발전과정을 파악하고 보건 행정기관의 기능을 익힌다.","m":"이 성취기준은 시대별 주요 특징을 이해하고 현대 우리나라 보건 행정 조직을 파악하도록 설정하였다. 보건의 역사, 공중보건 변천 과정 탐색하기, 보건 행정기관 기능 찾아보기 등의 내용을 다룬다. 보건의 시대적 변천 방향과 특징, 현대 우리나라의 보건 행정기관의 운영 및 역할을 파악하는 데 중점을 둔다.","n":[],"p":703,"b":2},{"c":"[12이보01-05]","k":"선택","sk":"전문 교과(이료)","s":"이료보건","g":"고등학교 1~3학년","d":"보건의 기초","t":"보건 분야의 개념과 문제점을 알고 예방 및 관리 방안을 익힌다.","m":"이 성취기준은 사회 변화로 생긴 불안전한 식품 유통, 가정 해체, 산업 재해, 스트레스와 불안 등 사회 문제 해결을 위한 보건학적 대책을 파악하도록 설정하였다. 보건 분야, 보건 분야 예방⋅관리 대책 조사하기 등의 내용을 다룬다. 식품, 정신, 모성과 태아 및 직업병의 문제점과 이에 관련된 질병의 종류를 알고 보건학의 종류별 예방 대책과 관리 방법을 제시하는 데 중점을 둔다.","n":[],"p":703,"b":2},{"c":"[12이보02-01]","k":"선택","sk":"전문 교과(이료)","s":"이료보건","g":"고등학교 1~3학년","d":"환경 오염과 보건","t":"환경 오염의 종류별 발생 원인을 이해하고 실생활에서 환경 오염 예방법을 실천한다.","m":"이 성취기준은 환경 오염을 발생시키는 다양한 원인 물질의 특성을 이해함으로써 실생활에서 실천할 수 있는 예방 방법을 찾아보도록 설정하였다. 환경 오염의 종류와원인, 환경 오염 피해 사례 찾아보기, 환경 오염의 예방법 실천 등의 내용을 다룬다. 대기, 수질, 토양, 소음 등의 환경 오염의 원인 물질의 특성과 피해 사례 및 예방 대책을 파악하는 데 중점을 둔다.","n":[],"p":704,"b":2},{"c":"[12이보02-02]","k":"선택","sk":"전문 교과(이료)","s":"이료보건","g":"고등학교 1~3학년","d":"환경 오염과 보건","t":"환경 오염의 종류별 측정 기준을 이해하고 인체에 미치는 영향을 파악한다.","m":"이 성취기준은 대기 오염, 수질 오염, 소음 등의 측정 기준을 이해함으로써 기준치 이상 노출 시 인체에 나타나는 변화를 파악하도록 설정하였다. 환경 오염의 측정 기준, 환경 오염 피해 사례 찾아보기, 환경 오염이 인체에 미치는 영향 조사하기 등의 내용을 다룬다. 대기, 수질, 토양, 소음 등의 환경 오염의 측정 기준과 인체에 미치는 영향 및 피해 사례를 통해 대응 방법을 파악하는 데 중점을 둔다.","n":[],"p":704,"b":2},{"c":"[12이보02-03]","k":"선택","sk":"전문 교과(이료)","s":"이료보건","g":"고등학교 1~3학년","d":"환경 오염과 보건","t":"환경 보건의 개념과 환경 보호를 위한 국제적인 협의 과정을 이해하고 환경 보호 활동을실천한다.","m":"이 성취기준은 환경을 보호하기 위한 국제적 노력과 개인이 실천 가능한 방안을 파악하도록 설정하였다. 환경 보건의 개념, 환경 보호 국제 협의 찾아보기, 환경 보호 실천 행동 습관화 등의 내용을 다룬다. 환경 보건 개념의 변천 과정과 환경 보호를 위한 국제적인 협의 과정을 탐색하며 환경 보호를 위한 방법을 파악하는 데 중점을 둔다.","n":[],"p":705,"b":2},{"c":"[12이보02-04]","k":"선택","sk":"전문 교과(이료)","s":"이료보건","g":"고등학교 1~3학년","d":"환경 오염과 보건","t":"환경 인자의 종류별 특성과 보건학적 조건을 이해하고 환경 인자와 건강과의 관계를파악한다.","m":"이 성취기준은 다양한 환경 인자 중에서 우리의 생활과 밀접한 관계가 있는물, 주택과 의복, 기후 등의 특성과 올바른 보건학적 조건을 파악하도록 설정하였다. 환경 인자의 종류, 환경 인자의 보건학적 조건 분석하기, 환경 인자와 건강 관계 탐색하기 등의 내용을 다룬다. 기후, 먹는 물, 의복과 주거 등의 환경 인자의 특성과 보건학적 조건, 환경 인자로 인해 발생하는 건강 변화 상태를 파악하는 데 중점을 둔다.","n":[],"p":705,"b":2},{"c":"[12이보02-05]","k":"선택","sk":"전문 교과(이료)","s":"이료보건","g":"고등학교 1~3학년","d":"환경 오염과 보건","t":"소독의 정의와 종류를 이해하고 효과적인 소독 방법을 익힌다.","m":"이 성취기준은 미생물의 활동을 억제하거나 사멸하기 위한 소독의 종류 및 방법을 파악하여 실생활에 응용하도록 설정하였다. 소독의 정의와 종류, 소독법 익히기 등의 내용을 다룬다. 소독의 개념과 소독 시 주의 사항, 소독법의 종류별 특성을 파악하며 실생활에서 많이 활용되는 소독 방법을 익히는 데 중점을 둔다.","n":[],"p":705,"b":2},{"c":"[12이보03-01]","k":"선택","sk":"전문 교과(이료)","s":"이료보건","g":"고등학교 1~3학년","d":"보건 법규","t":"의료법, 장애인복지법 및 사회서비스 이용 및 이용권 관리에 관한 법률의 개념을 이해하고, 이료 관련 보건 법규 조항을 조사한다.","m":"이 성취기준은 이료 관련 보건 법규를 탐구하기 위해 의료법, 장애인복지법, 사회서비스 이용 및 이용권 관리에 관한 법률, 기타 이료 관련 보건 법규의 개념을 파악하도록 설정하였다. 의료법의 개념과 조항 조사하기, 장애인복지법의 개념과 조항 조사하기, 사회서비스 이용 및 이용권 관리에 관한 법률의 개념과 조항 조사하기 등의 내용을 다루고, 기타 이료 관련 보건 법규에서는 안마업 개설 절차, 안마 바우처 제도 등 이료업에서 실제 필요한 법규 및 행정 절차 내용을 구체적으로 다룬다. 이료 관련 보건 법규들의 개념과 조항들을 조사하여 각 이료 관련 법규들의 특징을 비교하고 분석하는 데 중점을 둔다.","n":[],"p":706,"b":2},{"c":"[12이보03-02]","k":"선택","sk":"전문 교과(이료)","s":"이료보건","g":"고등학교 1~3학년","d":"보건 법규","t":"이료 관련 보건 법규 적용 사례들을 조사하여 이료 관련 보건 법규들의 문제점과 개선방안을 설명한다.","m":"이 성취기준은 이료 관련 보건 법규의 문제점을 탐구하기 위해 의료법, 장애인복지법, 사회서비스 이용 및 이용권 관리에 관한 법률, 기타 이료 관련 보건 법규의 적용 사례들을 파악하도록 설정하였다. 의료법의 적용 사례 조사하기, 장애인복지법의 적용 사례 조사하기, 사회서비스 이용 및 이용권 관리에 관한 법률 적용 사례 조사하기 등의 내용을 다룬다. 이료 관련 보건 법규들의 적용 사례들을 조사하여 각 이료 관련 보건 법규들의 문제점을 파악하고 개선 방안을 도출하는 데 중점을 둔다.","n":[],"p":706,"b":2},{"c":"[12이보03-03]","k":"선택","sk":"전문 교과(이료)","s":"이료보건","g":"고등학교 1~3학년","d":"보건 법규","t":"공중위생관리법, 국민건강보험법, 국민건강증진법, 환경보건법의 개념을 이해하고, 생활관련 보건 법규 조항을 조사한다.","m":"이 성취기준은 생활 관련 보건 법규를 탐구하기 위해 공중위생관리법, 국민건강보험법, 국민건강증진법, 환경보건법 및 기타 생활 관련 보건 법규의 개념을 파악하도록 설정하였다. 공중위생관리법의 개념과 조항 조사하기, 국민건강보험법의 개념과 조항 조사하기, 국민건강증진법의 개념과 조항 조사하기, 환경보건법의 개념과 조항 조사하기 등의 내용을 다룬다. 생활 관련 보건 법규들의 개념과 조항들을 조사하여 각 법규의 특징을 비교하고 분석하는 데 중점을 둔다.","n":[],"p":707,"b":2},{"c":"[12이보03-04]","k":"선택","sk":"전문 교과(이료)","s":"이료보건","g":"고등학교 1~3학년","d":"보건 법규","t":"생활 관련 보건 법규 적용 사례들을 조사하여 생활 관련 보건 법규 준수 활동을 실천한다.","m":"이 성취기준은 생활 관련 보건 법규의 문제점을 탐구하기 위해 공중위생관리법, 국민건강보험법, 국민건강증진법, 환경보건법 및 기타 생활 관련 보건 법규의 적용 사례들을 파악하도록 설정하였다. 공중위생관리법의 적용 사례 조사하기, 국민건강보험법의 적용 사례 조사하기, 국민건강증진법의 적용 사례 조사하기, 환경보건법의 적용 사례 조사하기 등의 내용을 다룬다. 생활 관련 보건 법규들의 적용 사례들을 조사하여 각 생활 관련 보건 법규들을 준수하고 실천하는 태도를 기르는 데 중점을 둔다.","n":[],"p":707,"b":2},{"c":"[12이보04-01]","k":"선택","sk":"전문 교과(이료)","s":"이료보건","g":"고등학교 1~3학년","d":"역학","t":"역학의 개념과 역할을 이해하고 감염병 대처를 위한 역학의 역할을 조사한다.","m":"이 성취기준은 역학의 기초를 탐구하기 위해 역학의 개념과 역할을 이해하여 감염병 대처를 위한 역학의 역할을 파악하도록 설정하였다. 역학의 개념 및 목적, 역학의 역할과 특징 등의 내용을 다룬다. 역학의 중요성을 인식하기 위해 역학의 개념과 역할을 이해하여 감염병 발생 시에 적합한 대처를 위한 역학의 역할을 파악하는 데 중점을 둔다.","n":[],"p":708,"b":2},{"c":"[12이보04-02]","k":"선택","sk":"전문 교과(이료)","s":"이료보건","g":"고등학교 1~3학년","d":"역학","t":"역학적 이론과 연구 방법을 알고 질병 발생 원인과 감염병 대처 방법을 조사한다.","m":"이 성취기준은 질병 발생에 대한 역학적 이론과 연구 방법을 조사하고, 질병 발생의 원인을 규명하는데 역학 이론과 연구 방법의 중요성을 탐색하도록 설정하였다. 역학 이론의 종류와 특징, 역학 연구 방법의 종류와 특징, 질병 발생 원인 조사하기 등의 내용을 다룬다. 역학 이론과 연구 방법의 종류와 특징을 파악하여 질병 발생 원인을 규명하는 데 중점을 둔다.","n":[],"p":708,"b":2},{"c":"[12이보04-03]","k":"선택","sk":"전문 교과(이료)","s":"이료보건","g":"고등학교 1~3학년","d":"역학","t":"역학 조사 기관의 종류와 기능을 이해하고 지역사회 역학 조사 기관의 정보를 조사한다.","m":"이 성취기준은 지역사회 역학 조사 기관의 종류와 기능을 조사하여 질병 감염 대처와 관련하여 역학 조사 기관의 중요성을 파악하도록 설정하였다. 지역사회 역학 조사 기관의 위치 조사하기, 질병 감염 발생 시 역학 조사 기관의 기능 조사하기 등의 내용을 다룬다. 지역사회 역학 조사 기관의 위치와 종류, 기능들을 조사하여 실생활에서 감염병에 대처하기 위한 능력들을 함양하는 데 중점을 둔다.","n":[],"p":708,"b":2},{"c":"[12이보04-04]","k":"선택","sk":"전문 교과(이료)","s":"이료보건","g":"고등학교 1~3학년","d":"역학","t":"역학 조사 내용을 이해하고 감염병 대처 관련 역학 조사 적용 사례를 조사한다.","m":"이 성취기준은 역학 조사 내용 및 적용을 알아보기 위해 역학 조사 기관이 수행하는 역학 조사 내용을 조사하고, 감염병 대처를 위해 실제 역학 조사가 적용된 사례들을 조사하도록 설정하였다. 역학 조사 기관의 조사 내용 조사하기, 감염병 대처를 위한 역학 조사 적용 방법 및 실제 적용 사례 조사하기 등의 내용을 다룬다. 감염병 대처를 위한 역학 조사 기관의 실제 적용 사례를 조사하여 질병 대처를 위한 역학적 탐구 자세를 형성하는 데 중점을 둔다.","n":[],"p":708,"b":2},{"c":"[12이보05-01]","k":"선택","sk":"전문 교과(이료)","s":"이료보건","g":"고등학교 1~3학년","d":"질병 관리","t":"감염병의 개념 및 특징을 알고, 감염병의 종류별 특징을 조사한다.","m":"이 성취기준은 감염병의 개념 및 특징을 이해하고, 감염병의 종류별 특징을 비교하여 파악하도록 설정하였다. 감염병의 개념과 특징, 감염병의 종류별 특징 조사하기, 감염병의 관리 방법 알아보기 등의 내용을 다룬다. 감염병의 개념과 특징을 파악하여 감염병 발생 시에 적합한 관리 방법을 비교하여 적용하는 능력을 기르는 데 중점을 둔다.","n":[],"p":709,"b":2},{"c":"[12이보05-02]","k":"선택","sk":"전문 교과(이료)","s":"이료보건","g":"고등학교 1~3학년","d":"질병 관리","t":"감염병 예방 대책 수립을 위한 세부 계획을 조사하고, 감염병 예방을 위한 개인위생 관리 행동 수칙을 준수한다.","m":"이 성취기준은 감염병 예방 대책 수립을 위한 세부 계획을 알아보고, 감염병 예방을 위한 개인위생 관리 행동 수칙을 파악하도록 설정하였다. 감염병 예방 대책 수립 과정, 세부 계획 수립 절차, 실생활 개인위생 관리 행동 요령 등의 내용을 다룬다. 감염병 발생 시에 적합한 대처를 위한 체계적인 세부 계
