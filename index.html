<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>성취기준 찾기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@600;700&display=swap">
<style>
/* 레이아웃: 한 줄 검색창 위에, 아래로 결과 카드가 세로로 이어지는 색인 카드 형태 */
:root{
  --bg:#c3d1de; --surface:#ffffff; --ink:#111417; --muted:#5f6b75; --line:#e6e9ec;
  --accent:#111417; --accent-ink:#ffffff; --accent-soft:#f1f3f5; --mark:#fff200;
  --k-basic:#1d6b74; --k-basic-bg:#e3f0f1;
  --k-common:#3d4f9a; --k-common-bg:#e8ebf8;
  --k-elective:#9a4d1a; --k-elective-bg:#f8ebe0;
  --k-daily:#2f7a3b; --k-daily-bg:#e5f2e6;
  --warn:#8a5a00; --warn-bg:#fff4d6;
  --font-body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --font-display:"Noto Serif KR","Batang",serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1b2530; --surface:#242f3b; --ink:#f1f4f6; --muted:#9fb0bd; --line:#34414e;
    --accent:#f1f4f6; --accent-ink:#111417; --accent-soft:#2e3b48; --mark:#f5e100;
    --k-basic:#7fcad3; --k-basic-bg:#1e3438;
    --k-common:#a4b0f0; --k-common-bg:#252b4a;
    --k-elective:#efb98a; --k-elective-bg:#42291a;
    --k-daily:#8fd29a; --k-daily-bg:#1f3a24;
    --warn:#f0cf80; --warn-bg:#3b3010;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1b2530; --surface:#242f3b; --ink:#f1f4f6; --muted:#9fb0bd; --line:#34414e;
  --accent:#f1f4f6; --accent-ink:#111417; --accent-soft:#2e3b48; --mark:#f5e100;
  --k-basic:#7fcad3; --k-basic-bg:#1e3438;
  --k-common:#a4b0f0; --k-common-bg:#252b4a;
  --k-elective:#efb98a; --k-elective-bg:#42291a;
  --k-daily:#8fd29a; --k-daily-bg:#1f3a24;
  --warn:#f0cf80; --warn-bg:#3b3010;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.65;
  padding-block:0 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:920px;margin:0 auto}
header.top{padding-block:28px 14px}
h1{font-family:var(--font-display);font-size:1.7rem;line-height:1.3;margin:0 0 4px;letter-spacing:-.01em;text-wrap:balance}
.sub{margin:0;color:var(--muted);font-size:.9rem}
.searchbox{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.searchbox input[type=search]{flex:1 1 260px;min-width:0;font:inherit;font-size:1.05rem;padding:12px 14px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.searchbox input[type=search]:focus-visible,button:focus-visible,select:focus-visible,summary:focus-visible,input[type=checkbox]:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{font:inherit;font-weight:700;border:1.5px solid var(--accent);background:var(--accent);color:var(--accent-ink);padding:11px 20px;border-radius:8px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.small{padding:6px 12px;font-size:.85rem;font-weight:500}
.btn[disabled]{opacity:.55;cursor:default}
.examples{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center;font-size:.85rem;color:var(--muted)}
.examples button{font:inherit;font-size:.85rem;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:3px 10px;border-radius:999px;cursor:pointer}
.examples button:hover{border-color:var(--accent);color:var(--accent)}
.filters{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin-top:16px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{font:inherit;font-size:.88rem;border:0;background:transparent;color:var(--ink);padding:6px 12px;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.filters label{font-size:.85rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.filters select{font:inherit;font-size:.88rem;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);max-width:100%}
.bar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;margin:18px 0 8px}
.bar .count{font-weight:700}
.bar .count small{font-weight:400;color:var(--muted)}
.notice{margin:8px 0;padding:10px 14px;border-radius:8px;background:var(--warn-bg);color:var(--warn);font-size:.88rem}
.notice[hidden]{display:none}
.group{margin:14px 0}
.group>summary{cursor:pointer;font-weight:700;padding:8px 0;list-style:none;display:flex;gap:8px;align-items:center}
.group>summary::-webkit-details-marker{display:none}
.group>summary::before{content:"▸";color:var(--muted);transition:transform .15s}
.group[open]>summary::before{transform:rotate(90deg)}
.list{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0}
.card.picked{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.head{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:.82rem;color:var(--muted)}
.code{font-weight:700;color:var(--ink);font-size:.95rem;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.chip{font-size:.74rem;font-weight:700;padding:1px 8px;border-radius:999px}
.chip[data-k="기본"]{background:var(--k-basic-bg);color:var(--k-basic)}
.chip[data-k="공통"]{background:var(--k-common-bg);color:var(--k-common)}
.chip[data-k="선택"]{background:var(--k-elective-bg);color:var(--k-elective)}
.chip[data-k="일상"]{background:var(--k-daily-bg);color:var(--k-daily)}
.gh{font-size:1.05rem;margin:6px 0 8px;display:flex;gap:8px;align-items:center}.gh small{font-weight:400;color:var(--muted);font-size:.82rem}
.unit{margin:4px 0 2px;padding:6px 12px;border-radius:12px;background:var(--surface);font-size:.88rem}.unit b{margin-right:6px}
.rel{margin-left:auto;font-size:.8rem;letter-spacing:1px;color:var(--accent)}
.stmt{margin:6px 0 4px;font-size:1.02rem;line-height:1.65;word-break:keep-all;overflow-wrap:anywhere}
mark{background:var(--mark);color:#111417;border-radius:2px;padding:0 1px}
.ai{margin:6px 0;padding:6px 10px;border-radius:6px;background:var(--accent-soft);color:var(--ink);font-size:.86rem}
.ai b{color:var(--accent)}
.more{margin-top:6px;font-size:.88rem}
.more summary{cursor:pointer;color:var(--accent);font-weight:500}
.more .body{margin-top:6px;color:var(--ink);font-size:.9rem}
.more h4{margin:10px 0 2px;font-size:.82rem;color:var(--muted);font-weight:700}
.more ul{margin:0;padding-left:1.1em}
.more p{margin:0;word-break:keep-all;overflow-wrap:anywhere}
.foot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-top:10px;font-size:.8rem;color:var(--muted)}
.pick{font:inherit;font-size:.85rem;border:1px solid var(--accent);background:transparent;color:var(--accent);border-radius:8px;padding:4px 12px;cursor:pointer}
.pick[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.daily-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center}
.daily-row .area{font-size:.8rem;color:var(--muted)}
.empty{padding:28px 16px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:10px}
.loadmore{display:flex;justify-content:center;margin:14px 0}
footer{margin-top:36px;padding-top:16px;border-top:1px solid var(--line);font-size:.82rem;color:var(--muted)}
footer p{margin:0 0 6px}
footer ul{margin:4px 0 8px;padding-left:1.2em}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;box-shadow:0 2px 10px rgba(0,0,0,.25);border-radius:999px;padding:11px 18px}
.sheet{position:fixed;left:max(8px,env(safe-area-inset-left,0px));right:max(8px,env(safe-area-inset-right,0px));bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:30;max-width:760px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 6px 28px rgba(0,0,0,.3);padding:14px 16px;max-height:78vh;display:flex;flex-direction:column;gap:10px}
.sheet[hidden]{display:none}
.sheet h2{margin:0;font-size:1rem}
.sheet textarea{width:100%;min-height:200px;flex:1;font:inherit;font-size:.88rem;line-height:1.55;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);resize:vertical}
.sheet .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sheet .msg{font-size:.82rem;color:var(--muted)}
@media (max-width:520px){h1{font-size:1.4rem}.rel{margin-left:0}}
/* 카드뉴스 느낌: 푸른 회색 바탕 위에 큰 흰 카드, 굵은 글씨, 노란 형광펜, 검은 알약 버튼 */
body{padding-block:20px 96px;font-family:var(--font-body)}
.wrap{background:var(--surface);border-radius:32px;padding:8px 32px 32px}
header.top{padding-block:24px 12px}
header.top::before{content:"2022 개정 특수교육 교육과정";display:block;font-size:.85rem;font-weight:500;letter-spacing:.02em;color:var(--ink);margin-bottom:28px}
h1{font-family:var(--font-body);font-weight:700;font-size:2.6rem;line-height:1.25;letter-spacing:-.03em;margin:0 0 14px;display:inline-block;background:linear-gradient(transparent 45%,var(--mark) 45%);padding:0 4px}
.sub{font-size:.95rem}
.searchbox input[type=search]{border:0;background:var(--accent-soft);border-radius:999px;padding:14px 22px}
.btn{border-radius:999px;border-width:0;padding:12px 26px;font-weight:500}
#go{padding-right:12px;display:inline-flex;align-items:center;gap:12px}
#go::after{content:"+";display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--accent-ink);color:var(--accent);font-size:1.25rem;font-weight:700;line-height:1}
.btn.ghost{background:var(--accent-soft);color:var(--ink)}
.examples button{border:0;background:var(--accent-soft);padding:5px 14px}
.examples button:hover{background:var(--mark);color:#111417}
.filters{border:0;background:var(--accent-soft);border-radius:22px;padding:14px 18px}
.seg{border:0;background:var(--surface);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;border-radius:999px;padding:6px 14px}
.filters select{border:0;border-radius:999px;background:var(--surface);padding:7px 12px}
.card{border:0;background:var(--accent-soft);border-radius:22px;padding:18px 22px}
.card.picked{box-shadow:0 0 0 2px var(--ink) inset}
.stmt{font-size:1.08rem;font-weight:500}
.gh{font-size:1.35rem;font-weight:700;letter-spacing:-.02em}
.chip{border-radius:999px}
.pick{border:0;background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 16px}
.pick[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
.empty{border:0;background:var(--accent-soft);border-radius:22px}
.notice{border-radius:16px}
.group>summary{font-size:1.2rem;letter-spacing:-.02em}
footer{border-top:0}
.fab{border-radius:999px}
.sheet{border-radius:24px}
.sheet textarea{border:0;background:var(--accent-soft);border-radius:16px}
@media (max-width:520px){.wrap{border-radius:24px;padding:4px 18px 24px}h1{font-size:2rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <h1>성취기준 찾기</h1>
    <p class="sub">활동을 입력하면 2022 개정 특수교육 교육과정에서 관련된 성취기준을 찾아 드립니다. 기본 교육과정(일상생활 활동 포함), 별책 2의 공통·선택 중심 교육과정이 들어 있습니다.</p>
    <form class="searchbox" id="form" role="search">
      <input id="q" type="search" placeholder="예) 독도 노래 만들기, 버스 타고 시장 가기" autocomplete="off" aria-label="활동 입력">
      <button class="btn" type="submit" id="go">검색</button>
    </form>
    <div class="examples" id="examples"><span>예시</span></div>
    <div class="filters" id="filters">
      <div class="seg" role="group" aria-label="교육과정 구분" id="segK"></div>
      <label>학년군 <select id="selG"></select></label>
      <label>교과 <select id="selS"></select></label>
      <label><input type="checkbox" id="chkDaily" checked> 일상생활 활동 포함</label>
    </div>
  </header>

  <main>
    <div class="bar" id="bar" hidden>
      <div class="count" id="count"></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
      </div>
    </div>
    <div class="notice" id="notice" hidden role="status"></div>
    <div id="results"></div>
    <div class="loadmore"><button class="btn ghost" id="btnMore" type="button" hidden>더 보기</button></div>
  </main>

  <footer>
    <p>검색 결과는 입력한 단어와 성취기준 문장·해설을 비교해 고른 후보입니다. 지도안에 쓰기 전에 원문과 대조해 확인해 주세요.</p>
    <p id="meta"></p>
  </footer>
</div>

<button class="btn fab" id="fab" type="button" hidden>담은 목록 <span id="fabN">0</span></button>
<section class="sheet" id="sheet" hidden aria-label="담은 성취기준">
  <h2>담은 성취기준 <span id="sheetN"></span></h2>
  <textarea id="sheetText" readonly aria-label="복사할 내용"></textarea>
  <div class="row">
    <button class="btn small" id="btnCopy" type="button">복사</button>
    <button class="btn ghost small" id="btnClear" type="button">목록 비우기</button>
    <button class="btn ghost small" id="btnClose" type="button">닫기</button>
    <span class="msg" id="sheetMsg" role="status"></span>
  </div>
</section>

<script>
const DATA = {"meta":{"source":"교육부 고시 제2022-34호(2022. 12. 22.) 2022 개정 특수교육 교육과정","volumes":{"3":"별책 3 기본 교육과정","2":"별책 2 유치원·공통·선택 중심 교육과정"},"counts":{"기본":688,"공통":771,"선택":840,"일상생활활동":75},"unit_note":"미래엔 특수교육 기본 교육과정 진로와 직업(고등학교 ①·②) 교사용 지도서 단원 구성표 기준"},"standards":[{"c":"[2바생01-01]","k":"기본","sk":"","s":"바른 생활","g":"초등학교 1~2학년","d":"","t":"생활에 필요한 자조 기술을 바르게 익힌다.","m":"이 성취기준은 학생이 능동적이고 자기주도적이며 독립적인 삶을 살아가는 데 필요한 기본 기술을 익히도록 설정하였다. 씻기, 옷 입기, 건강한 식습관 갖추기, 식사 기술 익히기, 화장실 이용하기, 이동하기, 도움 요청하기, 휴식하기 등 건강하고 주체적인 삶을 살아가는 데 필요한 기술을 포함한다. 자조 기술의 학습은 수업 시간뿐만 아니라 일상생활에서 반복하여 경험할 수 있도록 학교뿐만 아니라 가정 및 지역사회와 연계하여 지도하고, 개별적 활동보다 일상생활의 통합된 활동 안에서 자조 기술을 사용할 수 있도록 일상을 구조화하여 지도한다.","n":["장애 정도가 심한 학생이 자조 기술을 학습할 때 신체적 움직임의 제한으로 일상생활에 필요한 생활 기술을 사용할 수 없다면 이를 대체할 수 있는 보조기기나 의사소통 보조 기구를 활용한다. 단, 대체 도구의 사용을 결정하기 전에 학생의 잔존 기능을 확인하고 이를 최대한 활용하여 학생이 가능한 한 스스로 학습 활동에 참여할 수 있게 한다.‘자조 기술’과 ‘과정·기능’, ‘가치·태도’의 범주 요소와 조합하여 학생에게 적합한 성취기준으로 개발하여 사용할 수 있다. 예를 들어, 자조 기술을 일관성 있게 실천한다, 자조 기술을 익히는 활동에 바르게 참여한다, 자조 기술을 능동적으로 실천한다 등으로 성취기준을 재구성하여 활용할 수 있다."],"p":9,"b":3},{"c":"[2바생01-02]","k":"기본","sk":"","s":"바른 생활","g":"초등학교 1~2학년","d":"","t":"나를 항상 존중한다.","m":"이 성취기준은 학생이 자신을 존중하고 소중히 대하는 방법을 익히고 실천할 수 있도록 설정하였다. 자신의 감정을 적절하게 표현하기, 일상생활에서 자신의 장점을 적극적으로 표현하기, 자기 몸을 건강하게 관리하기, 자해 행동이나 공격 행동으로 자신의 감정을 표현하지 않기 등 자신과 주변 사람을 존중하고 소중히 여기는 태도를 익히도록 한다. 자기 존중 태도를 지도할 때는 자신에게 위협 행동을 하지 않는 동안 차별적이고 점진적으로 보상하고, 자신을 존중하면 안전하고 편안하게 생활할 수 있음을 인식시킨다.","n":["장애 정도가 심한 학생이 자신의 몸을 건강하게 관리하며, 자신의 신체를 위협하거나 다른 사람에게 공격적인 행동을 하지 않도록 행동 지원 계획과 연계하여 지도한다. 또한 가정, 학교 및 지역사회에서 일반화할 수 있도록 주변 사람과 물리적 환경을 구조화하여 반복적으로 실천하도록 한다.‘자기 존중’과 ‘과정·기능’, ‘가치·태도’ 범주의 요소를 조합하여 학생에게 적합한 성취기준으로 개발하여 사용할 수 있다. 예를 들어, 자기 존중 방법을 바르게 익힌다, 생활 속에서 나를 존중하는 방법을 일관성 있게 실천한다, 자기 존중을 능동적으로 실천한다 등과 같이 성취기준을 재구성하여 활용할 수 있다."],"p":9,"b":3},{"c":"[2바생01-03]","k":"기본","sk":"","s":"바른 생활","g":"초등학교 1~2학년","d":"","t":"나의 선호나 필요에 따라 능동적으로 선택한다.","m":"이 성취기준은 학생이 자신의 흥미, 선호, 필요, 중요성에 따라 다양한 대상이나 상황에서 스스로 선택할 수 있도록 설정하였다. 상황이나 대상에 따라 필요한 것 선택하기, 내가 좋아하는 것과 싫어하는 것 구별하기, 좋은 느낌과 싫은 느낌 구별하기, 싫어하거나 해가 되는 것 거절하기, 신변안전을 위한 선택하기 등 학생이 살아가는 데 필요한 다양한 선택 경험을 제공하고 선택할 수 있게 한다. 선택 기술을 지도하기 위해서는 일상생활에서 선호나 필요에 따른 선택 기회를 충분히 제공하고, 학생이 능동적이고 독립적으로 선택할 수 있도록 환경을 구조화한다.","n":["학생이 자신의 선호나 필요에 따라 선택하기를 할 때 시각적 정보의 제한으로 어려움이 있을 경우 몸짓이나 소리 등 다양한 언어 매체를 통하여 시각 정보 경험을 보완할 수 있도록 한다. 언어 및 움직임을 함께 제공하여 사물을 단계적으로 직접 체험하고 선호에 따라 선택할 수 있도록 환경을 구조화한다.‘자기선택’과 ‘과정·기능’, ‘가치·태도’의 범주 요소와 조합하여 학생에게 적합한 성취기준으로 개발하여 사용할 수 있다. 예를 들어, 자기 선택을 일관성 있게 실천한다, 자기 선택 활동에 능동적으로 참여한다 등으로 성취기준을 재구성하여 활용할 수 있다."],"p":9,"b":3},{"c":"[2바생01-04]","k":"기본","sk":"","s":"바른 생활","g":"초등학교 1~2학년","d":"","t":"일상생활에서 나의 안전을 항상 실천한다.","m":"이 성취기준은 학생이 일상생활에서 자신을 보호하고 안전하게 생활하는 데 필요한 기술을 익히고 실천하도록 설정하였다. 위험한 장소, 물건, 상황, 사람에 적절하게 대처하기, 먹을 수 있는 음식 구별하기, 도구를 안전하게 사용하기, 안전하게 이동하기, 미세먼지에 대처하기, 전염병 예방하기, 위험한 상황에서 도움 요청하기, 몸이 아프거나 불편할 때 도움 요청하기 등 안전한 생활에 필요한 기술을 포함한다. 안전 교육은 일상생활 전반에 걸쳐 학생의 직접 참여와 반복 연습을 통해 지도하며, 일과 속에서 예측 가능한 위험 요소를 사전에 인지하고 예방하는데 주안점을 둔다.","n":["시각장애나 청각장애를 중복장애로 지닌 학생의 경우 주변 상황이나 환경을 파악하는 데 제한이 있을 수 있으므로, 시각중복장애 학생의 경우 촉감, 소리나 냄새, 청각중복장애 학생의 경우 그림이나 사진, 제스처나 표정, 진동이나 움직임 등 대안적 단서를 활용하여 주변을 탐색하고 위험 요소를 파악할 수 있도록 지도한다. 위험 요소와 안전한 요소를 구별하는 것보다 일상생활에서 안전하게 생활하고 위험에 대처하는 방식을 환경과 상황별로 반복해서 지도하여 학생이 안전한 습관을 형성하도록 한다. 또한 위험 상황에서 도움을 요청할 때 구어 사용이 어려운 경우 몸짓이나 표정, 보완대체의사소통 기기 등을 사용하여 도움을 요청하는 방법을 지도한다.‘나의 안전’과 ‘과정·기능’, ‘가치·태도’의 요소를 조합하여 다양한 성취기준을 개발하여 사용할 수 있다. 예를 들어, ‘나의 안전을 지키는 활동에 능동적으로 참여한다, 일관성 있게 나의 안전을 실천한다, 일상생활에서 나의 안전을 바르게 실천한다’ 등과 같이 성취기준을 재구성하여 활용할 수 있다."],"p":9,"b":3},{"c":"[2바생01-05]","k":"기본","sk":"","s":"바른 생활","g":"초등학교 1~2학년","d":"","t":"나의 역할과 책임을 일관성 있게 실천한다.","m":"이 성취기준은 학생이 학교, 집, 지역사회 등의 생활 공간에서 맡은 역할이나 책임에 부합하는 행동을 일관성 있게 수행할 수 있도록 설정하였다. 1인 1역이나 교실 청소 등 학교에서 맡은 역할, 자기 방이나 식탁 정리하기 등 가정에서 맡은 역할, 마을 가꾸기나 마을 자치 활동 등 지역사회 활동에서 맡은 다양한 역할과 책임을 경험하도록 한다. 경험을 제공할 때는 학생이 다양한 역할과 책임에 관한 경험을 반복해서 충분하게 익힐 수 있도록 하고, 학교 일상을 구조화하고 가정, 지역사회와 연계하여 다양한 장면에서 역할과 책임을 경험하도록 한다.","n":["학생의 생태학적 환경에서 요구되는 역할이나 책임과 장애로 인한 특성을 함께 고려하여 학습의 출발점을 정한다. 주변 사람과의 관계에서 학생에게 공통으로 기대되는 역할이나 책임을 바탕으로 학생의 요구와 장애 특성 등을 종합적으로 고려하여 우선 필요한 역할과 책임을 선정하고, 현재 수준과 기대 수준 간의 불일치 분석을 바탕으로 지도의 우선순위를 정한다. 학생이 일관성 있게 실천할 수 있도록 상황별로 개인이 해야 하는 역할과 책임을 연합하여 반복 연습하게 하며, 행동에 따른 유관 강화를 통해 습관화를 촉진한다. 또한 수행 과정에서 학생이 최대한 많은 성공의 경험과 성취감을 느낄 수 있게 한다.‘나의 역할과 책임’과 ‘과정·기능’, ‘가치·태도’ 범주의 요소를 조합하여 학생에게 적합한 성취기준으로 개발하여 사용할 수 있다. 예를 들어, ‘나의 역할과 책임을 바르게 익힌다, 나의 역할과 책임을 능동적으로 실천한다, 나의 역할과 책임을 항상 실천한다’ 등과 같이 성취기준을 재구성하여 활용할 수 있다."],"p":9,"b":3},{"c":"[2바생01-06]","k":"기본","sk":"","s":"바른 생활","g":"초등학교 1~2학년","d":"","t":"함께 살아가는 데 필요한 규칙과 규범을 바르게 실천한다.","m":"이 성취기준은 학생이 일상생활에서 다른 사람과 관계를 맺고 유지할 수 있도록 규칙이나 규범을 바르게 익히고 다양한 상황에서 일관성 있게 실천하도록 설정하였다. 학교나 지역사회에서 지켜야 할 공공질서 또는 공중위생 규칙 지키기, 사회적 관계를 맺고 유지하는 데 필요한 규범 익히기, 다른 사람과 함께 안전하게 생활하기 위한 규칙과 규범 실천하기 등을 포함한다. 규칙과 규범을 지도할 때는 학교 일상을 가정이나 지역사회와 연계하여 환경을 구성하여 학생이 실제 맥락이나 유사한 환경에서 반복해서 경험할 수 있도록 한다.","n":["규칙과 규범에 대한 이해가 어려운 학생들에게는 생태학적 목록을 활용하여 우선 필요한 규칙과 규범을 정하고, 이를 실제 또는 실제와 유사한 구체적 상황에서 필요한 규칙이나 규범을 연합하여 반복적으로 경험할 수 있도록 한다. 시각중복장애나 청각중복장애 학생의 경우 교통이나 안전을 비롯한 공공질서나 공중위생 규칙 중에서 감각적 정보가 요구될 때는 촉각이나 시각, 청각적 정보를 활용해 주변을 파악하여 규칙과 규범을 지키도록 지도한다.‘규칙과 규범’과 ‘과정·기능’, ‘가치·태도’ 범주의 요소를 조합하여 학생에게 적합한 성취기준으로 개발하여 사용할 수 있다. 예를 들어, ‘공동체 생활에 필요한 규칙과 규범을 능동적으로 실천한다, 함께 살아가는 데 필요한 규칙과 규범을 항상 실천한다, 규칙과 규범을 지키는 활동에 협동하여 참여한다’ 등과 같이 성취기준을 재구성하여 활용할 수 있다."],"p":9,"b":3},{"c":"[2바생01-07]","k":"기본","sk":"","s":"바른 생활","g":"초등학교 1~2학년","d":"","t":"서로를 존중하며 예절을 지킨다.","m":"이 성취기준은 학생이 공동체 구성원으로서 서로를 존중하고 예절을 지키며 관계를 맺고 유지하며 살아가도록 설정하였다. 가정, 학교, 이웃에서 만나는 사람들과의 인사 예절, 언어 예절, 식사 예절, 인터넷 예절 등의 기본예절과 타인에 대한 이해와 배려, 나눔 등의 인성을 포함하며, 이에 관련된 언어 또는 비언어적 표현, 자세, 거리 유지 등의 기술을 수반한다. 서로를 존중하는 태도와 예절을 지도할 때는 일상생활에서 반복적으로 경험할 수 있도록 학교 일상을 구조화하고, 학교, 집, 지역사회와 연계하여 실천할 수 있게 한다.","n":["생태학적 목록을 활용하여 학생의 일상생활에서 우선 필요한 인사나 예절을 선정하고 실제 또는 유사 상황에서 반복해서 경험할 수 있도록 한다. 시각중복장애 학생의 경우 몸으로 표현 방식을 익힐 수 있도록 촉각적 모델링, 신체적 안내법 등을 사용할 수 있고, 청각중복장애 학생에게는 시각적 단서 등을 활용하여 모델링의 기회를 제공할 수 있다. 또한 구어 사용이 어려운 학생에게는 보완대체의사소통 기기의 사용법을 함께 익혀 상황에 맞는 인사와 예절을 표현하도록 지도한다.‘예절’과 ‘과정·기능’, ‘가치·태도’ 범주의 요소를 조합하여 학생에게 적합한 성취기준으로 개발하여 사용할 수 있다. 예를 들어, ‘예절을 바르게 익힌다, 예절을 바르게 실천한다, 예절을 항상 실천한다’ 등과 같이 다양한 방식으로 성취기준을 재구성하여 활용할 수 있다."],"p":9,"b":3},{"c":"[2바생01-08]","k":"기본","sk":"","s":"바른 생활","g":"초등학교 1~2학년","d":"","t":"다양한 사람들과 함께하는 활동에 협동하며 참여한다.","m":"이 성취기준은 학생이 주변 사람들과 협동하는 다양한 활동을 통해 함께 하는 경험을 제공하도록 설정하였다. 학급 활동, 학교 행사, 친구와의 놀이, 가정에서의 다양한 활동, 이웃과 지역사회의 활동이나 행사 등 주변 사람들과 함께하는 활동에 참여하는 경험을 늘린다. 협동 경험을 제공할 때는 다른 학급과의 협력 수업이나 주변 사람과 무리를 지어 함께 하는 활동으로 수업을 재구성하거나 특별한 행사, 지역사회의 활동에 직접 참여할 수 있게 하게 한다.","n":["다양한 사람들과의 관계를 맺고 유지하는 데 제한이 있는 학생이 다른 사람과 적극적으로 관계를 맺고 다양한 사회적 활동에 자연스럽게 참여할 수 있도록 최대한 많은 기회를 제공한다. 다른 사람과 함께 하는 활동에서 환경 자극의 강도와 종류는 점진적으로 늘리고, 학생이 외부 자극에 두려움이 있을 때는 체계적 둔감법을 사용하여 두려움을 점차 줄일 수 있게 한다. 또한 학생이 다양한 사람의 활동을 관찰하고 모방할 수 있게 기회를 충분히 제공하고, 감각적 제한으로 인해 모방이 어려울 때는 신체적 지원을 제공하거나 대안적 단서를 제공한다.‘다양한 사람들과 함께하는 활동’과 ‘과정·기능’, ‘가치·태도’의 범주 요소와 조합하여 학생에게 적합한 성취기준으로 개발하여 사용할 수 있다. 예를 들어, ‘다양한 사람들과 함께하는 활동에 서로 존중하며 참여한다, 다양한 사람들과 함께하는 활동에 능동적으로 참여한다, 다양한 사람들과 함께하는 활동에 바르게 참여한다’ 등으로 성취기준을 재구성하여 활용할 수 있다."],"p":9,"b":3},{"c":"[2바생01-09]","k":"기본","sk":"","s":"바른 생활","g":"초등학교 1~2학년","d":"","t":"환경 보전 활동에 능동적으로 참여한다.","m":"이 성취기준은 학생이 자연환경을 깨끗하고 쾌적하게 유지할 수 있게 환경 보전 활동에 능동적으로 참여하고 습관화할 수 있도록 설정하였다. 쓰레기 줍기나 쓰레기 버리지 않기 등 주변을 깨끗하게 하기, 에너지 절약하기, 자연을 훼손하지 않고 보호하기 등의 다양한 환경 보전 활동을 포함한다. 학생에게 환경 보전 활동과 그렇지 않은 활동을 변별하게 하기보다는 일상적 생활 공간에서 환경을 보호하고 유지하는 활동을 반복해서 경험할 수 있게 하여 환경 보전 활동에 익숙해지고 습관화할 수 있게 한다.","n":["환경 보전 활동을 지도할 때는 적절하게 환경을 보전하는 방법을 습관화할 수 있도록 특정 상황에서 구체적 환경 보전 방법을 반복하여 지도한다. 또한 학생이 자연스럽게 환경 보전 활동에 참여할 수 있도록 수업을 구조화하거나 학교, 가정, 지역사회와 연계하여 지도한다. 시각중복장애 학생의 경우 시각적으로 정보를 파악할 수 없을 때 흔들어 소리를 듣고, 냄새를 맡고, 만져보고 느끼는 다양한 대안적 방식으로 환경 보전 활동에 참여하도록 지도하며, 필요한 경우 잔존 감각을 활용하여 다룰 수 있는 교수·학습 자료를 제공한다.‘환경 보전’과 ‘과정·기능’, ‘가치·태도’ 범주의 요소를 조합하여 학생에게 적합한 성취기준으로 개발하여 사용할 수 있다. 예를 들어, ‘환경 보전을 바르게 실천한다, 환경 보전 활동에 일관성 있게 참여한다, 환경 보전 활동에 협동하며 참여한다, 항상 환경 보전을 실천한다’ 등으로 성취기준을 재구성하여 활용할 수 있다."],"p":9,"b":3},{"c":"[2바생01-10]","k":"기본","sk":"","s":"바른 생활","g":"초등학교 1~2학년","d":"","t":"주변의 생명체를 소중히 여긴다.","m":"이 성취기준은 학생이 주변에서 쉽게 접할 수 있는 동식물을 포함한 모든 생명체를 소중히 여기고 대하는 태도를 형성하도록 설정하였다. 주변의 동식물을 아끼고 소중히 대하기, 식물 가꾸기 등의 경험과 함께 위험한 동물로부터 자기 보호하기, 위험한 식물을 만지거나 먹지 않기 등 동식물과 관련하여 안전하게 생활하는 방법도 함께 지도한다. 동식물을 소중히 여기고 대하는 태도를 지도할 때는 자기 주변의 익숙한 동식물부터 시작하여 다른 동식물로 확대하며, 일상생활에서 일관성 있게 동식물을 소중히 여길 수 있도록 상황별로 반복해서 지도한다.","n":["장애 정도가 심한 학생이 동식물을 포함한 생명체와 생명의 소중함을 직관적으로 느낄 수 있도록 주변의 친숙한 동식물과의 긍정적 경험을 구조화하여 제공한다. 일상생활에서 생명체를 존중하는 습관을 갖도록 다양한 상황에서 생명체를 소중히 여기고 다루는 방식을 모방하는 기회를 충분히 제공한다. 또한 학생이 특정 생명체에 두려움을 느끼거나 거부감을 강하게 표현할 때는 다른 대상으로 대체하여 지도한다.‘생명 존중’과 ‘과정·기능’, ‘가치·태도’ 범주의 요소를 조합하여 학생에게 적합한 성취기준으로 개발하여 사용할 수 있다. 예를 들어, ‘생명 존중을 바르게 실천한다, 생명 존중을 일관성 있게 실천한다, 생명 존중을 능동적으로 실천한다’ 등으로 성취기준을 재구성하여 활용할 수 있다."],"p":9,"b":3},{"c":"[2슬생01-01]","k":"기본","sk":"","s":"슬기로운 생활","g":"초등학교 1~2학년","d":"","t":"나를 다양하게 탐색한다.","m":"이 성취기준은 학생이 자신의 특성, 선호, 흥미 등을 탐색하여 주변과 자신의 존재를 구별하고 이해할 수 있도록 설정하였다. 나의 신상 알기, 나의 몸 살펴보기, 나와 친구의 모습 비교하기, 관심이 있거나 좋아하는 것 찾기, 성장 과정 살펴보기 등을 통해 자신에 대해 관심을 가질 수 있는 경험을 제공한다. 신상은 초등학교 1~2학년 학생의 발달 수준을 고려하여 이름, 학교명, 학년반, 성별, 나이 등 나에 대한 기본적인 정보를 다룬다. 나에 대한 이해와 관련된 수업은 친구나 가족 등 자기와 밀접한 사회적 관계를 지닌 사람의 모습이나 선호, 성장 과정 등을 비교하면서 나를 인식할 수 있도록 한다.","n":["나를 탐색하는 방법을 지도할 때는 자신 및 타인에게 관심을 갖고 탐색하는 방식을 교사가 시범을 보이고 모방할 수 있게 하여 학생이 올바른 신체상을 형성할 수 있도록 한다. 시각중복장애 학생의 경우 시각 외의 다양한 감각으로 탐색할 수 있게 하고, 다른 친구와 나의 차이점을 이해할 수 있도록 대체 교수·학습 자료를 제공하거나 촉각적 경험과 언어적 설명으로 보완한다. 또한 신상과 관련된 수업은 나에 대한 정보를 다루므로 개인 정보 보호 및 관리에 유의한다.‘나에 대한 이해’와 ‘과정·기능’, ‘가치·태도’ 범주의 요소를 조합하여 학생에게 적합한 성취기준으로 개발하여 사용할 수 있다. 예를 들어, ‘나에게 관심을 갖고 탐색한다, 나를 적극적으로 탐색한다, 나를 다양한 방법으로 알아본다’ 등과 같이 성취기준을 재구성하여 활용할 수 있다."],"p":28,"b":3},{"c":"[2슬생01-02]","k":"기본","sk":"","s":"슬기로운 생활","g":"초등학교 1~2학년","d":"","t":"나의 하루를 적극적으로 알아본다.","m":"이 성취기준은 학생이 하루 동안 하는 일을 탐색하면서 규칙적인 일상에 익숙해지고, 매일 반복적으로 하는 일 외에 특별한 행사에도 관심을 가지도록 설정하였다. 나의 일과를 알기, 집·학교·마을에서 하는 일 찾기, 가족·친구·이웃과 함께하는 일 알아보기, 특별한 날의 모습 살펴보기, 특별한 날에 경험한 일 발표하기 등을 통해 나의 하루에 관심을 갖고 알아볼 수 있도록 한다. 가족·친구·이웃과 함께하는 일은 일상적인 일 외에도 여행, 예방접종, 바자회, 김장 등 가끔 하는 일을 포함하고, 특별한 날은 가족의 생일, 결혼식, 명절, 기념일, 운동회, 현장 체험 학습 등을 다루며, 나의 하루와 관련된 수업은 학교 일과를 구조화하고, 창의적 체험활동 등과 연계하여 학교생활 전반에 걸쳐 일상생활을 자연스럽게 경험할 수 있도록 한다. 또한 특별한 날과 관련된 가족 행사나 지역사회 활동 등에 관한 자료를 미리 준비하여 실제 생활과의 관련성을 높인다.","n":["하루 동안 하는 일에 관한 지도를 할 때는 학생에게 그림이나 상징을 활용한 시간표와 일상생활 활동판과 같은 시각적 지원 자료나 청각적 단서를 제공하여 규칙적이고 반복적으로 하는 일에 대한 이해를 도울 수 있다.‘나의 하루’와 ‘과정·기능’, ‘가치·태도’ 범주의 요소를 조합하여 학생에게 적합한 성취기준으로 개발하여 사용할 수 있다. 예를 들어, ‘나의 하루에 관심을 갖고 탐색한다, 내가 하루 동안 하는 일을 적극적으로 익힌다, 나의 하루를 다양하게 알아본다’ 등과 같이 성취기준을 재구성하여 활용할 수 있다."],"p":28,"b":3},{"c":"[2슬생01-03]","k":"기본","sk":"","s":"슬기로운 생활","g":"초등학교 1~2학년","d":"","t":"학교의 모습과 생활을 다양하게 탐색한다.","m":"이 성취기준은 학생이 학교에서 경험하는 장소와 시설, 만나는 사람과 하는 일을 다양하게 탐색하여 학교생활에 익숙해질 수 있도록 설정하였다. 학교의 여러 장소와 시설을 살펴보고 이용하기, 학교에서 만나는 사람과 학교에서 하는 일을 살펴보기 등을 통해 학교의 모습과 나의 학교생활에 관심을 가지고 알아볼 수 있게 한다. 학교의 모습과 생활에 대한 수업은 학생이 학교의 장소와 시설, 만나는 사람에 관심을 가지거나 익숙해지는 데 시간이 걸릴 수 있으므로 탐색 시간을 충분하게 제공하고 반복해서 경험할 수 있게 한다.","n":["장애 정도가 심한 학생을 지도할 때는 학생이 낯선 환경에 대한 거부감이나 두려움을 줄일 수 있도록 여러 장소나 사람들과 관련된 다양한 감각적 정보를 사전에 제공하고, 학교의 장소와 시설을 학교생활의 맥락 속에서 자연스럽게 반복 경험할 수 있도록 한다.‘학교의 모습과 생활’은 ‘과정·기능’, ‘가치·태도’ 범주의 요소를 조합하여 학생에게 적합한 성취기준으로 개발하여 사용할 수 있다. 예를 들어, ‘학교생활을 적극적으로 알아본다, 학교생활을 다양하게 탐색한다. 학교의 장소와 시설을 쓰임새에 맞게 이용한다’ 등과 같이 성취기준을 재구성하여 활용할 수 있다."],"p":28,"b":3},{"c":"[2슬생01-04]","k":"기본","sk":"","s":"슬기로운 생활","g":"초등학교 1~2학년","d":"","t":"여러 사람이 함께 쓰는 장소와 시설을 쓰임새에 맞게 이용한다.","m":"이 성취기준은 지역사회의 여러 장소와 시설을 살펴보고 바르게 이용하는 경험을 제공하도록 설정하였다. 여러 사람이 함께 쓰는 장소와 시설을 살펴보기, 여러 사람이 함께 쓰는 장소와 시설을 이용하는 모습을 살펴보기, 장소와 시설에서 일하는 사람 알아보기, 여러 사람이 함께 쓰는 장소와 시설을 경험하기 등을 통해 다양한 장소와 시설을 쓰임새에 맞게 이용하도록 한다. 학생이 자주 이용하는 병원, 공원, 마트, 놀이터, 엘리베이터 등의 장소 및 시설과 우체국, 소방서 등 생활의 편의와 안전에 도움을 주는 기관 등을 포함한다. 여러 사람이 함께 쓰는 장소와 시설을 교실 상황에서 다양하게 구현하는 데는 제약이 있으므로 현장 체험 학습 등과 연계하여 운영할 수 있다.","n":["학생이 지역사회의 장소나 시설을 직접 이용하는 학습을 위해서 사전에 공간에 대한 접근성과 편의성을 고려하여 체험 계획을 수립하고, 가상현실(VR)이나 증강현실(AR) 등 매체를 활용한 간접 경험 방식으로 실재감과 몰입감을 높인다. 또한 감각적 또는 신체적 제한으로 장소나 시설에 접근하기 어려울 때는 학생의 접근이 쉽도록 보조기구를 활용하거나 주변의 물리적 환경을 재구조화한다.‘여러 사람이 함께 쓰는 장소와 시설’은 ‘과정·기능’, ‘가치·태도’의 범주 요소를 조합하여 학생에게 적합한 성취기준으로 개발하여 사용할 수 있다. 예를 들어, ‘여러 사람이 함께 쓰는 장소와 시설에 관심을 갖고 이용한다, 여러 사람이 함께 쓰는 장소와 시설을 적극적으로 탐색한다,여러 사람이 함께 쓰는 장소와 시설을 다양하게 탐색한다’ 등과 같이 성취기준을 재구성하여 활용할 수 있다."],"p":28,"b":3},{"c":"[2슬생01-05]","k":"기본","sk":"","s":"슬기로운 생활","g":"초등학교 1~2학년","d":"","t":"생활 도구를 쓰임새에 맞게 사용한다.","m":"이 성취기준은 생활에 필요한 도구를 생활 장면에 알맞게 사용하는 경험을 제공하도록 설정하였다. 생활 도구에 관심을 갖고 탐색하기, 생활 장면에서 필요한 도구 찾기, 생활 도구의 사용 방법 익히기 등을 통해 다양한 생활 도구를 쓰임새에 맞게 사용할 수 있게 한다. 생활 도구는 학습, 청소, 식사, 위생에 필요한 도구 외에도 개인의 요구를 고려한 생활 도구를 포함할 수 있다. 생활 도구와 관련된 수업은 학생이 도구 사용의 편리함과 필요성을 느낄 수 있도록 다양한 생활 장면에서 생활 도구를 사용하는 경험을 제공한다.","n":["학생의 생태학적 환경에서 학생이 자주 사용하게 될 생활 도구를 파악하고 일상생활에서 도구를 사용하는 경험을 제공한다. 또한 자연스러운 맥락에서 교사가 직접 교수하거나 친구가 사용하는 것을 학생이 관찰 및 모방하게 하고, 교사의 안내와 지도하에 사용하게 하여 안전사고를 예방한다. ‘생활 도구’와 ‘과정·기능’, ‘가치·태도’의 범주 요소를 조합하여 학생에게 적합한 성취기준으로 개발하여 사용할 수 있다. 예를 들어, ‘생활 도구를 다양하게 탐색한다, 생활 도구에 관심을 갖고 알아본다, 생활 도구를 다양하게 사용한다’ 등과 같이 성취기준을 재구성하여 활용할 수 있다."],"p":28,"b":3},{"c":"[2슬생01-06]","k":"기본","sk":"","s":"슬기로운 생활","g":"초등학교 1~2학년","d":"","t":"안전을 지키는 방법을 적극적으로 익힌다.","m":"이 성취기준은 학생이 마을의 시설과 사물을 안전하게 사용하고, 위험한 상황에 대처하여 안전한 삶을 살아가도록 설정하였다. 안전한 상황과 위험한 상황의 모습 살펴보기, 다양한 장소와 시설을 안전하게 이용하기, 화재를 예방하기 위해 지켜야 할 일을 익히기, 화재 및 자연재해 발생 시 지켜야 할 행동 요령 익히기 등을 통해 위험으로부터 자신을 보호하고 안전사고에 대비할 수 있도록 한다. 안전을 지키는 방법과 관련된 수업은 범교과 학습 주제와 연계하여 생활 속 안전 수칙을 반복 연습하고, 위험한 상황을 학생들이 실제와 가깝게 받아들일 수 있도록 매체를 적절하게 활용한다.","n":["장애 정도가 심한 학생의 경우 위험한 상황에서 탈출하거나 대피할 수 있는 수단이 제한적이며, 이동에 어려움이 있을 수 있으므로 장애 유형을 고려한 차별화된 재난 대피계획을 수립한다. 또한 장애 특성에 따라 위험한 상황을 정확하게 인지하기 어려울 수 있어 상황을 간략하고 명료하게 전달하고, 지시와 안내에 따라 신속하게 행동할 수 있도록 반복 연습한다. ‘안전을 지키는 방법’과 ‘과정·기능’, ‘가치·태도’ 범주의 요소를 조합하여 학생에게 적합한 성취기준으로 개발하여 사용할 수 있다. 예를 들어, ‘안전을 지키는 방법을 다양하게 익힌다, 안전을 지키는 방법을 적극적으로 알아본다, 안전을 지키는 방법을 적극적으로 탐색한다’ 등과 같이 성취기준을 재구성하여 활용할 수 있다."],"p":28,"b":3},{"c":"[2슬생01-07]","k":"기본","sk":"","s":"슬기로운 생활","g":"초등학교 1~2학년","d":"","t":"여러 가지 매체에 관심을 갖고 사용한다.","m":"이 성취기준은 학생이 여러 가지 매체를 활용하여 주변 세계와 다양한 방법으로 소통하는 경험을 제공하도록 설정하였다. 텔레비전, 컴퓨터, 인터넷, 스마트 기기 등 여러 가지 매체에 관심을 가지고 사용하여 필요한 정보를 수집하고, 직·간접적인 체험으로 변화하는 사회에 적응하는 데 필요한 능력을 기르도록 한다. 매체를 사용하는 수업은 단순히 기능을 익히는 것보다 다양한 활동 속에서 매체를 경험하는 것에 주안점을 둔다. 또한 이 성취기준은 다른 성취기준 및 범교과 학습 주제와 연계하여 학생의 관심과 흥미를 유발하고, 활동에 쉽게 접근하도록 도우며 활동을 다각화할 수 있다.","n":["감각적 또는 신체적 제한으로 인해 매체를 사용하기 어려운 학생을 위해서 화면 읽기 프로그램, 화면 확대 프로그램, 의사소통 판, 터치스크린, 대체 입력 장치와 같은 기기를 함께 제공하여 매체 활용에 대한 접근성을 높인다.‘여러 가지 매체’와 ‘과정·기능’, ‘가치·태도’의 범주 요소를 조합하여 학생에게 적합한 성취기준으로 개발하여 사용할 수 있다. 예를 들어, ‘여러 가지 매체를 다양하게 사용한다, 여러 가지 매체를 쓰임새에 맞게 사용한다, 여러 가지 매체를 자유롭게 탐색한다, 여러 가지 매체를 적극적으로 사용한다’ 등과 같이 성취기준을 재구성하여 활용할 수 있다."],"p":28,"b":3},{"c":"[2슬생01-08]","k":"기본","sk":"","s":"슬기로운 생활","g":"초등학교 1~2학년","d":"","t":"자연물을 자유롭게 탐색한다.","m":"이 성취기준은 학생이 주변 환경에 관심을 가질 수 있는 매개체로써 자연물을 활용하고, 다양한 감각으로 자연을 탐색하는 경험을 제공하도록 설정하였다. 자연물에 관심 갖기, 자연물을 모으고 무리 짓기, 자연물을 감각으로 느끼기 등의 다양한 탐색 활동으로 자연과 교감하고 감각을 활용하는 능력을 기르도록 한다. 자연물과 관련된 수업은 야외 활동이나 현장 체험 학습 등과 연계하여 학생이 주변 환경에 있는 자연물을 수집하여 자유롭게 탐색하게 하되 필요에 따라 교사가 탐색의 대상이나 범위를 제시할 수 있다.","n":["시각중복장애 학생을 지도할 때는 자연물에 대한 언어적 정보를 다양하게 제공하거나 촉각, 청각 등의 감각을 활용하여 자연물을 탐색할 수 있도록 한다. 청각중복장애 학생의 경우 자연에 대한 청각적 정보를 진동이나 이미지 등으로 대체하여 경험하게 할 수 있다.‘자연물’과 ‘과정·기능’, ‘가치·태도’의 범주 요소를 조합하여 학생에게 적합한 성취기준으로 개발하여 사용할 수 있다. 예를 들어, ‘자연물을 다양한 방법으로 알아본다, 자연물을 적극적으로 알아본다, 자연물을 적극적으로 탐색한다’ 등과 같이 성취기준을 재구성하여 활용할 수 있다."],"p":28,"b":3},{"c":"[2슬생01-09]","k":"기본","sk":"","s":"슬기로운 생활","g":"초등학교 1~2학년","d":"","t":"날씨와 계절에 따른 생활 모습에 관심을 갖고 탐색한다.","m":"이 성취기준은 학생이 날씨와 계절의 변화를 자연스럽게 느끼고 자연 현상에 따른 생활 모습에 관심을 가지도록 설정하였다. 날씨와 계절의 변화를 감각으로 느껴보기, 계절에 따른 자연의 모습 살펴보기, 날씨와 계절의 변화에 따른 생활 모습 살펴보기, 날씨와 계절에 따른 생활용품 사용하기 등을 통해 자연의 변화를 느끼고 대처할 수 있는 능력을 기르도록 한다. 날씨와 계절에 관련된 수업은 교사가 인위적으로 수업 환경을 구조화하기 어려우므로 미리 계획하고 준비하여 가능한 실제적인 환경에서 운영할 수 있도록 하며, 필요한 경우 날씨에 맞춰 수업 시간을 조정하여 운영할 수 있다.","n":["지체중복장애 학생이나 시각중복장애 학생의 경우 잔존 감각을 활용하여 날씨와 계절의 변화를 실제 환경에서 자유롭게 탐색할 수 있도록 미끄럼 방지 매트, 모서리 보호대와 같은 안전용품과 지원 인력을 사전에 확보하여 환경을 구성한다. 또한 감각적 제한으로 생활 모습을 관찰하거나 경험하기 어려울 때는 촉각적 또는 시각적 자료 등 대체 자료를 제공한다.‘날씨와 계절’과 ‘과정·기능’, ‘가치·태도’의 범주 요소를 조합하여 학생에게 적합한 성취기준으로 개발하여 사용할 수 있다. 예를 들어, ‘날씨와 계절에 따른 생활 모습을 다양하게 탐색한다, 날씨와 계절에 따라 하는 일을 다양하게 익힌다, 날씨와 계절의 모습을 자유롭게 탐색한다, 날씨와 계절에 따른 생활 모습을 적극적으로 알아본다’ 등과 같이 성취기준을 재구성하여 활용할 수 있다."],"p":28,"b":3},{"c":"[2슬생01-10]","k":"기본","sk":"","s":"슬기로운 생활","g":"초등학교 1~2학년","d":"","t":"동식물에 관심을 갖고 다양하게 알아본다.","m":"이 성취기준은 학생이 주변의 동식물에 관심을 갖고 살펴보거나 기르는 경험을 통해 동식물과 더불어 살아가는 법을 배울 수 있도록 설정하였다. 주변의 동식물을 살펴보기, 내가 좋아하거나 기르는 동식물 소개하기, 식물 가꾸기 등을 통해 다른 생명체에 관심을 갖고 살펴보며 교감할 수 있도록 한다. 동식물과 관련된 수업은 학교 주변의 동식물을 관찰하기, 식물을 가꾸는 활동에 참여하기, 가정에서 기르는 동식물과 연계하기, 매체나 모형 활용하기 등 다양한 방법으로 학생이 동식물을 접할 수 있게 한다.","n":["장애 정도가 심한 학생을 지도할 때는 동식물을 바르게 대하는 방법을 시범 보이고 학생이 이를 모방할 수 있게 한다. 또한 학생이 동식물을 탐색하는 활동에 대한 두려움을 줄이고 친숙해질 수 있도록 실물, 그림, 사진 등의 자료를 활용하여 교실 환경을 구성한다.‘동식물’과 ‘과정·기능’, ‘가치·태도’의 범주 요소를 조합하여 학생에게 적합한 성취기준으로 개발하여 사용할 수 있다. 예를 들어, ‘동식물에 관심을 갖고 다양하게 탐색한다, 동식물을 적극적으로 알아본다, 동식물에 관심을 갖고 자유롭게 탐색한다’ 등과 같이 성취기준을 재구성하여 활용할 수 있다."],"p":28,"b":3},{"c":"[2슬생01-11]","k":"기본","sk":"","s":"슬기로운 생활","g":"초등학교 1~2학년","d":"","t":"우리나라의 문화에 관심을 갖고 알아본다.","m":"이 성취기준은 우리나라에 관심을 갖고 문화를 경험하여 학생이 자신의 주변 세계를 우리나라로 확장하는 계기가 될 수 있도록 설정하였다. 우리나라의 상징 살펴보기, 우리나라의 다양한 문화를 살펴보고 경험하기, 내가 관심 있는 우리나라의 문화 찾기, 우리나라의 다양한 문화 소개하기 등을 통해 우리나라의 문화에 친숙해질 수 있도록 한다. 우리나라의 문화와 관련된 수업에서는 학생의 흥미와 관심을 끌어낼 수 있는 게임, 캐릭터, 음악, 인물 등을 포함하여 문화의 다양한 영역을 다룰 수 있으며 필요에 따라 실제적 체험이나 다양한 매체를 활용할 수 있다.","n":["우리나라의 문화를 알아보는 과정에서 무용, 놀이, 운동 등 체험이 필요한 경우에는 학생의 장애 특성을 반영하여 참여 방법이나 규칙을 적합화하여 제공한다. 청각중복장애 학생을 위해 소리를 진동으로 대체하거나 시각중복장애 학생을 위해 신체적 지원이나 촉각적 자료를 제공할 수 있다. 지체중복장애 학생에게는 신체적 제한을 대체할 수 있는 활동으로 수정하여 제공한다.‘우리나라의 문화’와 ‘과정·기능’, ‘가치·태도’의 범주 요소를 조합하여 학생에게 적합한 성취기준으로 개발하여 사용할 수 있다. 예를 들어, ‘우리나라의 문화를 자유롭게 탐색한다, 우리나라의 문화를 적극적으로 탐색한다, 우리나라의 문화를 적극적으로 알아본다’ 등과 같이 성취기준을 재구성하여 활용할 수 있다."],"p":28,"b":3},{"c":"[2즐생01-01]","k":"기본","sk":"","s":"즐거운 생활","g":"초등학교 1~2학년","d":"","t":"신체감각을 다양하게 느낀다.","m":"이 성취기준은 학생이 주변에서 주어지는 다양한 자극을 오감을 통해 자연스럽고 다양한 방식으로 받아들이면서 신체감각을 발달시킬 수 있도록 설정하였다. 주변에서 모양, 빛깔, 형태 등을 살펴보기, 다양한 소리, 소리의 높낮이 ‧ 강약 ‧ 장단 등을 들어보기, 자연이나 생활 속의 냄새, 향기 맡아보기, 다양한 맛보기, 다양한 질감 느끼기, 평형감각 경험하기 등 다양한 감각을 느껴볼 수 있게 한다. 학습 활동 전반에 걸쳐 학생이 다양한 신체감각을 일상적으로 느낄 수 있도록 환경과 수업을 구조화하고, 활동 안에서 여러 감각을 다양하고 통합적인 방식으로 느낄 수 있도록 한다.","n":["장애 정도가 심한 학생이 다양한 감각을 경험하고 익숙해질 수 있도록 주변에서 경험할 수 있는 감각을 인위적으로 제공하여 익숙해지도록 한다. 시각이나 청각, 촉각 등 특정 감각에 결함이 있는 경우 이를 대체할 수 있는 대안적 방법이나 보조도구를 제공하여 학생이 관련 감각을 충분히 느낄 수 있도록 한다.‘신체감각’에 ‘과정·기능’, ‘가치·태도’의 범주의 요소를 조합하여 학생에게 적합한 성취기준으로 개발하여 사용할 수 있다. 예를 들어, ‘신체감각 놀이에 재미있게 참여한다, 신체감각을 자유롭게 느낀다, 신체감각을 재미있게 즐긴다’ 등과 같이 성취기준을 재구성하여 사용할 수 있다."],"p":47,"b":3},{"c":"[2즐생01-02]","k":"기본","sk":"","s":"즐거운 생활","g":"초등학교 1~2학년","d":"","t":"주변의 아름다움을 자유롭게 감상한다.","m":"이 성취기준은 학생 주변의 다양한 사물과 풍경, 사람, 현상 등을 자유롭게 감상하며 일상생활에서 아름다움을 느끼고 즐길 수 있도록 설정하였다. 주변 인물의 아름다운 모습 찾고 느끼기, 동식물의 아름다운 모습 찾고 느끼기, 주변 환경에서 편안함을 느끼는 것 찾기, 아름다운 소리 듣고 느끼기, 자연환경의 변화에서 아름다움 찾고 느끼기 등을 포함한다. 학생에게 다양한 감상 방법을 제시하고 학생이 자신이 선호하는 방식으로 아름다움을 감상할 수 있도록 충분한 기회와 시간을 제공하며, 학생만의 독특한 감상 방식을 찾아 발전시키거나 대안적 방식을 제공할 수 있다.","n":["주변의 아름다움을 지도할 때는 교사가 구체물이나 구체적인 예를 제시하여 아름답다고 생각하는 이유를 이야기하면서 아름다움을 감상하는 다양한 방식을 시범 보이고 학생이 이를 모방할 수 있게 한다. 예를 들어, 시각중복장애 학생의 경우 교사가 학생과 함께 시각 외에 다른 감각을 활용하여 대상을 직접 다루어보면서 다양하게 감상해 보고 학생이 모방할 수 있도록 한다.‘주변의 아름다움’과 ‘과정·기능’, ‘가치·태도’ 범주의 요소를 조합하여 학생에게 적합한 성취기준으로 개발하여 사용할 수 있다. 예를 들어, ‘주변의 아름다움을 표현하는 놀이에 즐겁게 참여한다, 주변의 아름다움을 다양하게 느낀다, 주변의 아름다움을 재미있는 방식으로 즐긴다’ 등과 같이 성취기준을 재구성하여 사용할 수 있다."],"p":47,"b":3},{"c":"[2즐생01-03]","k":"기본","sk":"","s":"즐거운 생활","g":"초등학교 1~2학년","d":"","t":"주변의 아름다움을 창의적으로 표현한다.","m":"이 성취기준은 학생이 주변의 모습에서 느끼는 아름다움을 자신만의 방식으로 표현할 수 있도록 설정하였다. 그리기, 사진찍기, 소리내기, 노래 부르기, 꾸미기, 표정과 몸짓으로 표현하기, 흉내 내기 등 다양한 방식으로 자신이 느끼는 아름다움을 표현할 수 있게 한다. 학생만의 특별한 표현 방식을 비롯하여 기존의 방식이 아닌 새롭고 특이한 방식을 허용하며, 이를 위해 다양한 재료, 도구, 양식 등을 제공하고 활용 방법을 시범 보여 학생이 자신만의 방식으로 표현할 수 있도록 한다.","n":["다양한 방법과 재료 및 도구를 활용한 창의적 표현에 익숙하지 않은 학생을 위해서 다양한 재료나 도구, 방법에 따른 표현 방식을 교사가 시범을 보이고 학생이 익숙해질 수 있도록 충분한 경험의 기회를 제공한다. 학생의 표현 방식이 위협적이거나 공격적이지 않다면 학생의 다양한 표현 방식을 허용하고, 학생이 표현한 방식을 확장하는 방법을 교사가 시범을 보인 다음 학생이 모방하여 직접 해볼 수 있도록 한다.‘주변의 아름다움’, ‘표현하기’와 ‘가치·태도’ 범주의 요소를 조합하여 학생에게 적합한 성취기준으로 개발하여 사용할 수 있다. 예를 들어, ‘주변의 아름다움을 자유롭게 표현한다, 주변의 아름다움을 다양하게 표현한다, 주변의 아름다움을 재미있게 표현한다’ 등과 같이 성취기준을 재구성하여 사용할 수 있다."],"p":47,"b":3},{"c":"[2즐생01-04]","k":"기본","sk":"","s":"즐거운 생활","g":"초등학교 1~2학년","d":"","t":"관심 있거나 좋아하는 것으로 재미있게 논다.","m":"이 성취기준은 학생이 주변에서 관심이 있거나 선호하는 것을 활용하여 다양한 방식으로 놀 수 있도록 설정하였다. 관심 있거나 좋아하는 장소에서 놀기, 관심 있거나 좋아하는 사람들과 놀기, 자신이 좋아하는 동물과 함께 놀기, 자기가 좋아하는 식물을 활용하여 놀기, 관심 있거나 좋아하는 자연물로 놀기, 관심 있거나 좋아하는 도구나 매체로 놀기 등 다양한 것을 활용한 다양한 방식의 놀이 기회를 제공한다. 학생의 관심과 선호를 유도하고 넓힐 수 있도록 의도적으로 환경을 구성하고, 학생의 관심과 선호를 포괄할 수 있도록 다양한 소재와 선택의 기회를 제공한다.","n":["학생이 자발적으로 관심을 표현하거나 좋아하는 것을 선택하지 못할 때는 다양한 재료와 도구를 제공하여 학생이 선택할 수 있는 범위와 기회를 넓혀주고, 교사가 재료와 도구를 활용하여 재미있게 노는 것을 자연스럽게 시범 보여 학생이 주어진 재료와 도구에 관심을 가지고 직접 활용해 볼 수 있도록 한다.‘관심과 선호’에 ‘과정·기능’, ‘가치·태도’ 범주의 요소를 조합하여 학생에게 적합한 성취기준으로 개발하여 사용한다. 예를 들어, ‘관심 있거나 좋아하는 놀잇감을 가지고 친구와 재미있게 놀이한다, 친구들이 관심 있거나 좋아하는 놀이에 적극적으로 참여한다, 가족과 함께 관심 있거나 좋아하는 놀이 활동에 적극적으로 참여한다’ 등과 같이 성취기준을 재구성하여 사용할 수 있다."],"p":47,"b":3},{"c":"[2즐생01-05]","k":"기본","sk":"","s":"즐거운 생활","g":"초등학교 1~2학년","d":"","t":"감정과 정서를 건강하게 표현한다.","m":"이 성취기준은 학생이 자신의 감정이나 정서를 수용가능한 방식으로 표현하여 정서적 안녕을 갖고, 다른 사람과 긍정적으로 상호 작용할 수 있도록 설정하였다. 다양한 감정과 정서 표현하기, 감정과 정서를 다양한 방식으로 표현하기, 감정과 정서를 안전하고 편안하게 표현하기, 상황에 따른 감정과 정서를 적절하게 표현하기, 위기 상황에 따른 감정 표현하기 등의 내용을 포함한다. 학생의 감정과 정서가 자유롭게 표출될 수 있도록 자연스럽고 수용적인 환경을 구성하고, 학생이 적절하고 안전하게 자신의 감정과 정서를 표현할 수 있도록 한다.","n":["자신이나 다른 사람에게 수용 가능한 방식으로 감정과 정서를 표현하지 못하는 학생들의 경우 상황에 따른 바람직한 감정과 정서 표현 방식을 실제 또는 실제와 유사한 맥락에서 교사가 반복해서 시범을 보이고 학생이 모방할 수 있게 한다. 또는 영향력 있는 주변 사람이나 친구들에게 건강한 표현 방식을 지도하여 학생이 자연스럽게 모방할 수 있게 한다.‘감정 및 정서’에 ‘과정·기능’, ‘가치·태도’ 범주의 요소를 조합하여 학생에게 적합한 성취기준으로 개발하여 사용한다. 예를 들어, ‘감정과 정서를 다양하게 느낀다, 감정과 정서를 자유롭게 표현한다, 감정과 정서를 다양하게 표현한다’ 등과 같이 성취기준을 재구성하여 사용할 수 있다."],"p":47,"b":3},{"c":"[2즐생01-06]","k":"기본","sk":"","s":"즐거운 생활","g":"초등학교 1~2학년","d":"","t":"신체활동을 적극적으로 즐긴다.","m":"이 성취기준은 학생이 신체활동에서 재미를 느껴 일상생활에서 다양한 신체활동에 자발적으로 참여하고 즐겨 건강한 몸과 마음을 유지할 수 있도록 설정하였다. 다양한 신체 부위 움직이기, 동작 따라 하기, 신체로 표현하기, 도구를 활용해 신체활동 하기, 실내‧외 놀이시설 이용하기, 계절에 따른 신체활동 하기 등을 포함한다. 신체활동을 제공할 때는 학생의 장애 특성이나 흥미를 고려하여 참여를 쉽게 하고 동기를 높이며, 반복적 경험을 통해 신체활동에 익숙해지도록 하여 일상생활에서 지속적이고 자발적으로 신체활동에 참여할 수 있게 한다.","n":["학생이 신체활동에 충분히 참여할 수 없는 경우에는 활동을 수정하거나 환경을 조정하여 참여 기회를 제공하고, 신체활동이 특정 기능의 기계적이고 반복적인 숙련에 치우치지 않고, 자연스러운 생활의 맥락에서 통합적 활동으로 제공되도록 한다.‘신체활동’에 ‘과정·기능’, ‘가치·태도’ 범주의 요소를 조합하여 학생에게 적합한 성취기준으로 개발하여 사용한다. ‘신체활동을 재미있게 즐긴다, 신체활동에 다양하게 참여한다, 신체활동에 적극적으로 참여한다’ 등과 같이 성취기준을 재구성하여 사용할 수 있다."],"p":47,"b":3},{"c":"[2즐생01-07]","k":"기본","sk":"","s":"즐거운 생활","g":"초등학교 1~2학년","d":"","t":"신체활동에 안전하게 참여한다.","m":"이 성취기준은 학생이 신체활동에 안전하게 참여하는 방법을 익히고, 실천하면서 건강한 생활을 할 수 있도록 설정하였다. 신체 움직임이나 체력운동, 신체 놀이에서 자기 신체 조절하기, 다른 사람과의 거리 조절하고 유지하기, 운동장이나 체육관 같은 안전한 장소에서 운동하기, 실‧내외 놀이 기구나 운동기구 안전하게 사용하기, 신체활동 전 준비운동 하기, 보호장구 착용하기 등의 내용을 포함한다. 자신과 다른 사람을 보호하기 위한 안전을 강조하되 신체활동에 대한 두려움을 가지지 않도록 유의하며, 안전하게 참여하면서도 신체활동에 재미를 느낄 수 있도록 한다.","n":["장애의 정도가 심하거나 중복 등으로 인해 신체의 움직임이나 감각에 제한이 있는 경우에는 신체활동을 하면서 위험에 노출되지 않도록 주변 환경을 구조화하고, 신체활동 방식이나 범위 및 난이도 등을 조정하거나 수정한다. 필요에 따라서는 특정 신체활동의 내용을 대체하는 다른 활동을 제공한다.‘신체활동’, '안전한 태도와 방식'과 ‘과정·기능’ 범주의 요소를 조합하여 학생에게 적합한 성취기준으로 개발하여 사용할 수 있다. 예를 들어, ‘신체활동을 안전하게 느낀다, 신체활동을 안전하게 즐긴다’ 등과 같이 성취기준을 재구성하여 사용할 수 있다."],"p":47,"b":3},{"c":"[2즐생01-08]","k":"기본","sk":"","s":"즐거운 생활","g":"초등학교 1~2학년","d":"","t":"문화예술을 다양하게 즐긴다.","m":"이 성취기준은 학생이 각종 공연이나 음악, 미술 활동 등에 직접 참여하거나 관람하는 경험을 제공하여 자신이 좋아하는 문화예술 활동을 찾고 생활 속에서 즐길 수 있도록 설정하였다. 학생의 흥미와 관심, 선호 방식을 고려하여 다양한 음악적 표현하기, 다양한 매체를 활용해 음악 감상하기, 다양한 재료로 미술 작품 만들기, 미술 작품 전시하기, 미술 작품 감상하기, 발표회 참여하기, 영화나 인형극, 뮤지컬 등 공연 관람하기 등의 활동을 포함한다. 타 교과 및 창의적 체험활동 또는 가정 및 지역사회와 연계하여 다양한 문화예술 공연, 축제, 전시회 등에 직접 참여하는 기회를 늘리고, 직접 참여가 어려울 때는 동영상이나 가상현실(VR) 체험 등 다양한 매체를 활용하여 경험할 수 있도록 한다.","n":["학생들이 특정 장소나 감각 등에 민감하게 반응하는 경우에는 공연장이나 영화관의 소음이나 음향효과에 놀라지 않도록 사전에 설명하거나 자리 배치를 조정하고, 암전 상황에 대비하여 학생을 안정시키는 방안을 모색한다. 또한 문화예술 활동에 사용되는 다양한 재료나 도구에 대한 학생의 사용 경험이나 거부감 등을 사전에 확인하고 재료나 도구를 교체하거나 사전에 충분히 익숙해질 수 있도록 기회를 제공한다.‘문화예술’과 ‘과정·기능’, ‘가치·태도’ 범주의 요소를 조합하여 학생에게 적합한 성취기준으로 개발하여 사용한다. 예를 들어, ‘문화예술에 재미있게 참여한다, 문화예술을 창의적으로 표현한다, 문화예술을 자유롭게 감상한다’ 등과 같이 성취기준을 재구성하여 사용할 수 있다."],"p":47,"b":3},{"c":"[2즐생01-09]","k":"기본","sk":"","s":"즐거운 생활","g":"초등학교 1~2학년","d":"","t":"다양한 놀이에 재미있게 참여한다.","m":"이 성취기준은 학생이 놀이 방식을 익히고 놀이에 대한 재미를 느끼며, 놀이를 통해 다른 사람과 소통할 수 있도록 설정하였다. 놀이는 혼자 하는 놀이와 함께하는 놀이를 포함하며, 도구를 사용하는 놀이, 맨손으로 하는 놀이, 실내·외 놀이 등 다양한 방식의 놀이 경험을 제공한다. 놀이를 지도할 때는 학생들이 놀이 규칙이 어려워 놀이에 참여하지 못하거나 흥미를 잃지 않도록 규칙을 수정하거나 규칙에 구애받지 않고 즐길 수 있도록 대안적 놀이를 제공한다. 또한 놀이를 익혀 자발적으로 놀이를 즐길 수 있게 하고, 놀이를 통해 일상생활에서 친구나 가족들과 소통할 수 있게 있게 한다.","n":["놀이 방법을 몰라 놀이에 익숙하지 않은 학생의 경우 놀이 방법과 규칙을 단순화하거나 놀이 환경을 재구성하여 학생이 흥미를 갖고 놀이에 쉽게 참여할 수 있도록 한다. 또한 교사가 놀이 상대자로 함께 참여하여 다양한 방식으로 재미있게 노는 방법을 자연스럽게 시범 보이고 학생이 모방할 수 있게 한다.‘놀이’에 ‘과정·기능’, ‘가치·태도’의 범주의 요소를 조합하여 학생에게 적합한 성취기준으로 개발하여 사용할 수 있다. 예를 들어, ‘다양한 놀이에 안전하게 참여한다, 다양한 놀이를 자유롭게 즐긴다’ 등과 같이 성취기준을 재구성하여 사용할 수 있다."],"p":47,"b":3},{"c":"[2국어01-01]","k":"기본","sk":"","s":"국어","g":"초등학교 1~2학년","d":"듣기･말하기","t":"여러 가지 소리의 의미를 이해하고 구별한다.","m":"이 성취기준은 주변 환경에서 나는 소리를 관심 있게 듣고, 들리는 소리의 의미를 이해하여 적절하게 반응하는 의사소통 기초 능력을 기르기 위해 설정하였다. 익숙한 사람의 말소리, 자연이나 생활 주변의 다양한 소리에 재미를 느끼고 소리를 구별하며 들은 소리에 적절하게 행동하며 의사소통하는 내용을 다룬다. 소리에 관심을 가지고 소리가 나타내는 상징적 의미를 연결하여 들으며, 소리에 적절하게 반응하는 데 주안점을 둔다.","n":[],"p":66,"b":3},{"c":"[2국어01-02]","k":"기본","sk":"","s":"국어","g":"초등학교 1~2학년","d":"듣기･말하기","t":"표정과 몸짓의 의미를 이해하고, 표정과 몸짓으로 감정이나 요구를 표현한다.","m":"이 성취기준은 표정과 몸짓이 나타내는 의미를 이해하여 상대방의 의도를 파악하고, 표정과 몸짓으로 의사를 표현하는 능력을 기르기 위해 설정하였다. 주변 사람의 표정이나 몸짓을 주의 깊게 살펴보기, 표정이나 몸짓이 나타내는 긍정･부정이나 칭찬, 인사, 지시 등의 의미를 이해하여 반응하기, 표정이나 몸짓으로 상대방의 주의 끌기, 반응하기, 선택하기, 인사하기, 감정이나 요구 표현하기 등의 내용을 다룬다. 표정이나 몸짓에는 의사소통 기능이 있음을 이해하고, 상대방의 표정과 몸짓을 살펴 상대방이 표현하는 의미를 이해하며, 표정과 몸짓으로 자기 의사를 표현하는 능력을 기르는 데 주안점을 둔다.","n":["시각장애를 지닌 중도중복장애 학생의 경우 표정과 몸짓을 보고 의미를 파악하거나 모방하는 것이 어려우므로, 언어적･신체적 촉진 방법을 활용하여 지도한다. 손과 팔, 고갯짓으로 긍정과 부정 의사 표현하기, 인사하기, 사과하기, 감사하는 마음 표현하기 등과 같은 단순한 표현에서 시작하여 점점 더 복잡한 요구나 감정 등을 표현할 수 있도록 지도한다."],"p":66,"b":3},{"c":"[2국어01-03]","k":"기본","sk":"","s":"국어","g":"초등학교 1~2학년","d":"듣기･말하기","t":"다양한 방법으로 의사소통을 시도한다.","m":"이 성취기준은 표정과 몸짓 이외에 말소리, 기호와 상징 사용과 같은 다양한 방법으로 의사소통을 시도하고, 자기 의사를 표현하는 능력을 기르기 위해 설정하였다. 원하는 물건이나 행동, 자신의 감정, 대답이나 요구하는 말, 수용과 거부하는 말 등을 말소리, 표정, 몸짓, 상징 사용 등 다양한 방법으로 표현해 보는 내용을 다룬다. 자신에게 맞는 의사소통 방법을 찾기 위해 표정과 몸짓을 포함하여 다양한 방법으로 의사소통해 보는 것이 중요하다.","n":[],"p":66,"b":3},{"c":"[2국어01-04]","k":"기본","sk":"","s":"국어","g":"초등학교 1~2학년","d":"듣기･말하기","t":"의사소통에 자발적이고 적극적으로 참여한다.","m":"이 성취기준은 대화의 기본인 상대방과 상호 작용하는 태도를 길러 자발적이고 적극적으로 다른 사람과의 의사소통에 참여하는 데 중점을 두어 설정하였다. 상대방의 대화 시도에 관심을 보이고, 말소리, 표정, 몸짓, 상징으로 반응하고, 대화를 시작하기 위해 상대방의 주의 끌기, 인사하기, 요구하기 등 자발적으로 의사소통을 시도하는 내용을 다룬다. 의사소통 수단이나 방법과 상관없이 상대방의 말에 적극적으로 반응하거나 자발적으로 대화에 참여하고자 하는 태도를 갖추는 것이 중요하다.","n":[],"p":66,"b":3},{"c":"[2국어02-01]","k":"기본","sk":"","s":"국어","g":"초등학교 1~2학년","d":"읽기","t":"점, 선, 면으로 구성된 여러 가지 형태를 탐색한다.","m":"이 성취기준은 글자의 기초가 되는 형태를 지각하는 능력을 기르기 위해 설정하였다. 직선, 곡선, 규칙이 있는 형태와 불규칙한 형태, 대칭적인 형태와 비대칭적 형태를 글자의 모양과 연결하여 탐색하고 인식하는 내용을 다룬다. 다양한 형태를 살펴보고 글자 모양과 유사한 여러 모양을 인식하고 지각하는 능력을 기르게 한다.","n":[],"p":68,"b":3},{"c":"[2국어02-02]","k":"기본","sk":"","s":"국어","g":"초등학교 1~2학년","d":"읽기","t":"글자의 기초가 되는 여러 가지 모양을 변별한다.","m":"이 성취기준은 여러 가지 모양 중에서 글자의 기초가 되는 형태의 그림이나 모양을 찾고 변별하는 능력을 기르기 위해 설정하였다. 같은 사물, 그림, 모양, 상징 찾기, 구분하기 활동 등의 내용을 다룬다. 이와 같은 활동을 하여 글자의 기초가 되는 형태에 대한 변별 능력을 기르게 한다.","n":[],"p":68,"b":3},{"c":"[2국어02-03]","k":"기본","sk":"","s":"국어","g":"초등학교 1~2학년","d":"읽기","t":"일상생활에서 자주 볼 수 있는 실물, 그림, 상징, 기호에 관심을 가진다.","m":"이 성취기준은 일상생활에서 자주 볼 수 있는 실물, 그림, 상징, 기호의 의미에 관한 관심을 기르기 위해 설정하였다. 의미 파악과 의사소통을 위해 똑같거나 유사한 실물, 그림, 상징, 기호를 살펴보고 의미를 파악하는 내용을 다룬다. 읽기 자료로서의 실물, 그림, 상징 등과 친숙해지고 탐색하는 능력을 기르게 한다.","n":[],"p":68,"b":3},{"c":"[2국어02-04]","k":"기본","sk":"","s":"국어","g":"초등학교 1~2학년","d":"읽기","t":"실물, 그림, 상징이 소리로 표현되는 것을 알고, 읽는 활동에 관심을 가진다.","m":"이 성취기준은 일상에서 자주 접하는 실물, 그림, 상징, 기호에는 소릿값과 의미가 있다는 것을 알고, 읽기 활동에 참여하는 능력을 기르기 위해 설정하였다. 자신과 주변의 정보를 파악하기 위하여 그림, 상징, 기호에 관심 갖기, 일상생활에서 자주 접하는 간판이나 표지판의 그림, 상징, 기호에 관심 갖기, 실물, 그림, 상징, 기호에 나타나는 의미 파악하여 읽기 등의 내용을 다룬다. 일상생활에서 자주 접하는 그림, 상징, 기호를 찾아보도록 유도하고, 여러 가지 그림이나 주변 단서를 이용해 따라 읽어 보게 함으로써 읽기에 흥미를 갖게 한다.","n":[],"p":68,"b":3},{"c":"[2국어03-01]","k":"기본","sk":"","s":"국어","g":"초등학교 1~2학년","d":"쓰기","t":"끼적이기에 재미를 느끼며 자유롭게 끼적인다.","m":"이 성취기준은 자유롭게 끼적이는 활동의 재미를 경험하여, 쓰기 기초 능력을 기르기 위해 설정하였다. 떠오르는 생각과 느낌을 마음껏 끼적이기, 여러 가지 도구를 사용해서 끼적이기, 재미있는 활동을 찾아 자유롭게 끼적이기 등의 내용을 다룬다. 자유롭게 끼적이는 경험에서 시작하여 점차 제시한 도구와 자료를 활용하여 끼적이고, 끼적이는 활동을 즐거워하는 단계로 나아갈 수 있게 한다.","n":[],"p":69,"b":3},{"c":"[2국어03-02]","k":"기본","sk":"","s":"국어","g":"초등학교 1~2학년","d":"쓰기","t":"글자의 기초가 되는 선과 모양을 알고 다양한 방법으로 표현한다.","m":"이 성취기준은 글자의 기초가 되는 선과 모양을 인식하고 표현하는 능력을 기르기 위해 설정하였다. 글자의 형태 탐색하기, 글자의 기초가 되는 여러 가지 선과 모양 그리기 등의 내용을 다룬다. 글자의 기초가 되는 형태를 인식하고 표현하기 위해서 일상생활에서 자주 사용하는 사물과 친숙한 놀이 자료를 활용하여 표현하는 것에 관심을 가지고, 점차 형태를 갖춰 선과 모양을 그리게 한다.","n":["글자 쓰기 이전 단계에서 글자의 기초가 되는 선과 모양의 형태를 인식하고 표현하는 능력을 기르기 위해 설정하였다. , ―, /, ＼과 같은 여러 가지 선과, ○, △, □와 같은 여러 가지 모양을 인식하고 표현하는 내용을 다룬다. 자연물, 생활용품, 종이, 스마트 기기 등 다양한 자료와 수단을 활용하여 학생이 재미를 느끼며 활동에 참여하는 데 중점을 두어 지도한다."],"p":69,"b":3},{"c":"[4국어01-01]","k":"기본","sk":"","s":"국어","g":"초등학교 3~4학년","d":"듣기･말하기","t":"일상생활이나 자신과 관련된 단어를 사용하여 의사를 표현한다.","m":"이 성취기준은 학생과 관련 있는 친숙한 단어를 사용하여 필요한 상황에서 적절하게 의사를 표현하는 능력을 기르기 위해 설정하였다. 학생이 자주 사용하는 물건, 좋아하는 사물, 동물, 식물, 탈것 등의 이름과 주변 사람들의 호칭 등을 사용하여 필요에 따라 명명, 대답, 요구, 정보 제공 등을 표현하는 내용을 다룬다. 학생의 듣기･말하기 능력에 따라 말소리나 표정, 몸짓, 상징 등으로 표현하게 한다.","n":[],"p":70,"b":3},{"c":"[4국어01-02]","k":"기본","sk":"","s":"국어","g":"초등학교 3~4학년","d":"듣기･말하기","t":"요청하는 말을 듣고 이해하여 행동으로 나타낸다.","m":"이 성취기준은 학교, 가정, 지역사회에서 자주 들을 수 있는 요청하는 말을 듣고 이해하고 행동하는 능력을 기르기 위해 설정하였다. 일상생활에서 자주 사용하는 사물의 이름, 주변 사람의 호칭, 장소, 동작, 활동 등을 나타내는 말을 듣고 해당하는 사물이나 그림 등과 연결하기, 간단한 동작이나 행동을 나타내는 말을 듣고 행동으로 나타내기, 일상생활에 관련된 지시 따르기 등의 내용을 다룬다. 일상생활이나 학교생활 중 꼭 필요한 행동이나 활동을 중심으로 상황과 맥락에 맞게 요청하는 말을 듣고 행동으로 나타내게 한다.","n":[],"p":70,"b":3},{"c":"[4국어01-03]","k":"기본","sk":"","s":"국어","g":"초등학교 3~4학년","d":"듣기･말하기","t":"자신과 관련된 간단한 질문에 대답한다.","m":"이 성취기준은 질문을 듣고 학생의 말하기 능력에 따라 자발적으로 대답하며 의사소통하는 능력을 기르는 데 중점을 두어 설정하였다. 질문을 듣고 말이나 표정, 몸짓, 상징으로 ‘예’, ‘아니요’로 대답하기, ‘무엇’, ‘누구’, ‘어디’와 관련된 질문에 맞게 자신의 신상에 관한 내용, 좋아하는 것, 겪은 일, 원하는 것 표현하기 등의 내용을 다룬다. 자신과 관련된 질문을 듣고 자기 경험을 떠올려 말, 표정, 몸짓 중 자신이 표현할 방법을 선택하거나, 여러 가지 표현 수단을 결합하여 상대방이 알아들을 수 있도록 적극적으로 대답하게 한다.","n":[],"p":70,"b":3},{"c":"[4국어01-04]","k":"기본","sk":"","s":"국어","g":"초등학교 3~4학년","d":"듣기･말하기","t":"바른 자세로 대화에 참여한다.","m":"이 성취기준은 대화할 때의 바른 자세와 예절을 익혀 대화에 참여하는 태도를 기르기 위해 설정하였다. 상대방의 표정과 동작에 주의를 기울이며 듣기, 상대방의 말을 끝까지 집중해서 듣기, 공감하는 반응 보이기, 바른 태도로 듣고 말하기 등의 내용을 다룬다. 상대방에게 주의를 기울이며 적극적으로 대화에 참여함으로써 상대방의 말을 듣고 이해하는 능력을 기르며, 동시에 상대방을 배려하며 듣는 태도와 예절을 익히는 데 주안점을 둔다.","n":["음성 언어 표현이나 동작 수행이 어려운 중도중복장애 학생에게는 대화 상대방 방향으로 시선이나 고개, 몸을 움직이기, 상대방에게 미소 짓기, 단순한 음성이나 몸짓으로 반응하기 등으로 성취기준을 재구성하여 적용할 수 있다."],"p":71,"b":3},{"c":"[4국어02-01]","k":"기본","sk":"","s":"국어","g":"초등학교 3~4학년","d":"읽기","t":"바른 자세로 친숙한 단어를 소리 내어 읽는다.","m":"이 성취기준은 일상에서 볼 수 있는 글자에 흥미를 가지고 친숙한 단어를 소리 내어 읽음으로써 일견 단어 읽기 능력을 기르기 위해 설정하였다. 책이나 보완대체의사소통 기기를 바르게 잡고 읽기, 의자에 앉아서 바르게 읽기 등의 내용을 다룬다. 상징이나 글자는 왼쪽에서 오른쪽으로, 위에서 아래로 읽어야 하는 등의 국어 읽기의 방법을 학습하게 한다.","n":["그림책과 환경 인쇄물의 글자, 그림 상징 등을 살펴보고, 바른 읽기 자세와 방법을 익힐 기회를 제공한다. 학생의 신체 특성과 읽기 수단을 고려하여 보완대체의사소통 상징의 크기, 위치, 종류 등을 적절하게 제공함으로써 학생의 신체 특성과 읽기 수단에 맞는 자세를 찾도록 지도한다. 스스로 안정적인 자세를 취하거나 책장을 넘기는 활동이 어려운 학생은 화면 읽기 프로그램이나 화면 넘기기 기능이 있는 프로그램을 활용하여 읽기 활동에 참여하게 한다."],"p":72,"b":3},{"c":"[4국어02-02]","k":"기본","sk":"","s":"국어","g":"초등학교 3~4학년","d":"읽기","t":"그림책이나 환경 인쇄물 등에서 단어, 상징의 의미를 파악한다.","m":"이 성취기준은 상징이나 친숙한 단어의 뜻을 파악하고, 의미를 아는 상징과 단어를 확장하는 능력을 기르기 위해 설정하였다. 그림책에서 같은 글자 찾기, 신문, 광고지 등의 환경 인쇄물에서 환경 인쇄물에서 글자를 찾으며 의미 알기, 여러 가지 구체물을 활용하여 글자 모양을 만들고 읽기 등의 내용을 다룬다. 소리 내어 읽는 활동을 함으로써 상징이나 친숙한 단어의 소리와 시각 정보를 정확히 파악하게 한다.","n":["중도중복장애 학생은 그림책이나 환경 인쇄물의 단어나 상징의 의미를 파악하기보다는 일상생활에서 자주 사용하는 실물과 상징의 의미를 파악하거나, 학생이 사용하는 보완대체의사소통 기기에서 사용하는 상징의 의미를 파악하게 한다."],"p":72,"b":3},{"c":"[4국어02-03]","k":"기본","sk":"","s":"국어","g":"초등학교 3~4학년","d":"읽기","t":"상징, 글자, 그림 단서를 활용하여 인물과 장면을 파악한다.","m":"이 성취기준은 상징, 글자, 그림 단서를 활용하여 인물과 장면의 내용을 파악하고, 제시된 그림 속의 상징이나 장면의 의미를 이해하는 능력을 기르기 위해 설정하였다. 그림, 동화책이나 이야기의 장면을 보고 인물이나 장면 알기, 내용 추측하기, 연관된 단어 읽기, 흉내 내는 말 읽기 등의 내용을 다룬다. 다양한 매체에서 제시되는 인물과 장면의 정보를 확인하고 이해하게 한다.","n":[],"p":72,"b":3},{"c":"[4국어02-04]","k":"기본","sk":"","s":"국어","g":"초등학교 3~4학년","d":"읽기","t":"그림책, 환경 인쇄물, 책 등 다양한 읽을거리에 관심을 가진다.","m":"이 성취기준은 그림책, 환경 인쇄물, 다양한 매체 자료 등을 활용하여 글자와 읽을거리에 흥미를 느끼고 읽는 능력을 기르기 위해 설정하였다. 매체는 사람들 간의 소통 수단이며 정보 기록 및 전달의 매개체로서 책, 텔레비전, 스마트폰, 컴퓨터, 태블릿, 인터넷 등이 이에 속하며, 매체 자료에는 그림책, 만화, 뉴스, 광고, 웹툰, 애니메이션, 영화 등이 있다. 학생이 흥미를 느끼는 주제의 글과 책에 주의를 기울이고, 여러 가지 종류의 매체와 매체 자료에 관심을 가질 수 있도록 하며, 학생이 좋아하는 책이나 매체 자료를 선택하고, 교사가 읽기 활동 기회를 제공하여 자연스럽게 읽기 생활에 관심을 가질 수 있도록 하는 내용을 다룬다. 책 속에서 상징과 글자에 주목하여 그림과 글자를 구별하고, 의미를 파악하는 읽기 활동에 관심을 갖게 한다.","n":["상징, 글자, 그림 단서 등을 활용한 그림책 읽기에 어려움이 있는 중도중복장애 학생은 시각, 청각, 촉각, 미각, 후각 등의 여러 감각을 활용하여 외부의 정보를 파악하고 이야기를 이해하는 다감각적･다감성적 스토리텔링 읽기를 한다."],"p":72,"b":3},{"c":"[4국어03-01]","k":"기본","sk":"","s":"국어","g":"초등학교 3~4학년","d":"쓰기","t":"다양한 방법으로 글자 모양을 만든다.","m":"이 성취기준은 다양한 방법으로 글자 모양을 만들어 보면서 글자의 기본 형태를 인식하는 능력을 기르기 위해 설정하였다. 생활용품으로 글자의 형태 만들기, 그림이나 꾸미기를 통해 글자 모양 완성하기, 내 주변의 글자를 찾아 다양한 재료로 같은 글자 만들기 등의 내용을 다룬다. 글자가 일정한 모양과 체계화된 형식을 가지고 있다는 것을 자연스럽게 학습하고, 글자 모양을 다양하게 표현함으로써 쓰기 활동에 관심을 갖게 한다.","n":[],"p":74,"b":3},{"c":"[4국어03-02]","k":"기본","sk":"","s":"국어","g":"초등학교 3~4학년","d":"쓰기","t":"쓰기 도구를 바르게 잡고 글자 모양을 따라 쓴다.","m":"이 성취기준은 쓰기 도구를 바르게 잡고 글자 모양을 따라 쓸 수 있는 능력을 기르기 위해 설정하였다. 여러 가지 쓰기 도구 알기, 쓰기 도구 바르게 잡기, 그림글자 그리기, 글자 모양 따라 쓰기 등의 내용을 다룬다. 처음에는 매직펜이나 칠판 펜과 같이 몸통이 굵고, 큰 글씨를 쓰기에 적절한 쓰기 도구를 사용하고, 점차 색연필, 연필처럼 몸통이 가늘고 작은 글씨를 쓰는 데 적절한 쓰기 도구를 사용하도록 지도한다.","n":["쓰기 도구를 바르게 잡는 것은 학생의 건강과 집중, 학습 활동 참여, 교실에서의 안전을 위해 필요하다. 따라서 정형화된 자세를 강조하기보다는 안정감 있는 잡기 자세를 찾아 익히게 한다. 또한 글자 따라 쓰기를 할 때 글자 획순의 규칙을 강조하기보다 의사전달을 목적으로 하는 기능적인 쓰기 활동이 이루어질 수 있도록 지도한다."],"p":74,"b":3},{"c":"[4국어03-03]","k":"기본","sk":"","s":"국어","g":"초등학교 3~4학년","d":"쓰기","t":"나와 관련 있는 친숙한 글자를 보고 쓰면서 쓰기 활동에 관심을 가진다.","m":"이 성취기준은 나와 관련 있는 친숙한 글자를 보고 쓰면서 글자와 사물을 자연스럽게 연결 지으며 쓰기 활동에 관심을 갖도록 설정하였다. 자기 이름 쓰기, 가족과 친구 이름 쓰기, 자기 물건에 이름 쓰기, 학교와 집에서 자주 사용하는 친숙한 글자 쓰기 등의 내용을 다룬다. 일상생활에서 자주 사용하는 친숙한 글자를 쓰면서 나와 내 주변의 관계 맺기를 시도하고 점차 쓰기 활동을 확장해 나가도록 지도한다.","n":[],"p":74,"b":3},{"c":"[6국어01-01]","k":"기본","sk":"","s":"국어","g":"초등학교 5~6학년","d":"듣기･말하기","t":"단어와 문장을 듣고 뜻을 파악한다.","m":"이 성취기준은 단어와 문장을 듣고 이해하여 적절하게 반응하는 의사소통 능력을 향상하기 위해 설정하였다. 사물이나 사람의 특징을 나타내는 말을 듣고 실물, 그림, 사진 등에서 지시 대상 찾기, 문장 속 단어의 뜻을 파악하여 문장의 의미 파악하기, 요구나 지시, 설명, 감탄 등을 나타내는 다양한 문장을 듣고 내용에 맞는 그림을 찾거나 행동으로 나타내기 등의 내용을 다룬다. 문학 작품이나 동영상, 노래 등을 활용하여 친숙한 어휘에서 점차 새로운 어휘로 확장하여 익힐 수 있도록 하며, 대화나 안내 방송 등을 듣고 일상생활에서 자주 들을 수 있는 문장 유형을 익히게 한다.","n":[],"p":76,"b":3},{"c":"[6국어01-02]","k":"기본","sk":"","s":"국어","g":"초등학교 5~6학년","d":"듣기･말하기","t":"모습과 행동을 단어나 문장으로 표현한다.","m":"이 성취기준은 사람이나 사물의 모습, 상황 등을 묘사하여 전달함으로써 정보를 공유하며 능동적으로 의사소통하는 능력을 기르기 위해 설정하였다. 사람 또는 사물을 소개하거나 특징 묘사하기, 사진이나 짧은 영상을 보고 동작이나 활동 내용 설명하기, 그림이나 사진의 중요한 부분 말하기 등의 내용을 다룬다. 다양한 매체를 활용하여 학생의 경험과 관련된 친숙한 사진이나 영상, 학생이 흥미 있어 하는 문학 작품 등을 보고, 관련 내용으로 친구와 대화를 나누거나 발표하며 표현하는 능력을 기르게 한다.","n":["음성 언어 표현이 어려운 중도중복장애 학생에게는 친구의 설명을 듣고 해당 그림이나 실물을 가리키기, 모습이나 행동에 관련된 질문에 따라 해당하는 그림 카드를 선택하거나 동작으로 나타내기, 모습이나 움직임을 동작으로 설명하기 등으로 성취기준을 재구성하여 적용할 수 있다."],"p":76,"b":3},{"c":"[6국어01-03]","k":"기본","sk":"","s":"국어","g":"초등학교 5~6학년","d":"듣기･말하기","t":"시간이나 장소를 나타내는 말을 사용하여 경험한 일을 상대방에게 전달한다.","m":"이 성취기준은 경험한 일을 여러 단어와 다양한 문장으로 표현하는 능력을 기르기 위해 설정하였다. 시간이나 장소를 나타내는 말과 과거를 나타내는 표현을 익혀 가정,학교, 지역사회에서 겪은 일 말하기, 과거에 경험한 일 중 기억에 남는 일 말하기 등의 내용을다룬다. 학생의 경험을 기록한 사진이나 영상, 그림일기를 보고, 경험을 회상하여 정리하고 정리한 내용을 상대방에게 효율적으로 전달하게 한다.","n":["시각장애를 지닌 중도중복장애 학생에게는 학생의 일상을 촬영한 영상이나 녹음한 소리를 활용하여 경험을 회상하고, 질문에 따라 있었던 일이나 그때의 기분을 말, 표정, 몸짓, 그림, 기호, 상징, 보완대체의사소통 기기로 대답하게 한다."],"p":76,"b":3},{"c":"[6국어01-04]","k":"기본","sk":"","s":"국어","g":"초등학교 5~6학년","d":"듣기･말하기","t":"묻는 말의 의미를 이해하여 적절한 질문과 대답을 한다.","m":"이 성취기준은 여러 가지 묻는 말을 익혀 상대방에게 질문하거나 질문에 적절하게 대답하며 필요한 정보를 제공하는 의사소통 능력을 기르기 위해 설정하였다. 질문에 따라 선택지 중 한 가지를 선택하여 대답하기, 질문에 맞게 자신이 원하는 것, 선호하는 것, 희망 사항 말하기, 질문에 따라 경험한 일 말하기, 자신이 필요한 것을 얻기 위해 상대방에게 허락 구하기, 궁금한 것 질문하기 등의 내용을 다룬다. ‘누구’, ‘무엇’, ‘어디’, ‘언제’ 등을 묻는 단순한 질문에서 시작하여 점차 ‘어떻게’, ‘왜’와 같이 복잡한 대답을 요구하는 질문을 주고받으며 대화하게 한다.","n":[],"p":76,"b":3},{"c":"[6국어01-05]","k":"기본","sk":"","s":"국어","g":"초등학교 5~6학년","d":"듣기･말하기","t":"바르고 고운 말을 사용하여 대화한다.","m":"이 성취기준은 상대방을 배려하며 바르고 고운 말을 사용하는 태도를 기르기 위해 설정하였다. 공손하게 말하기, 감정을 조절하며 말하기, 상황에 맞는 말하기, 상대방이 기분 좋은 말하기 등의 내용을 다룬다. 자신의 감정에 맞는 적절한 어휘를 선택하여 표현하고, 다양한 상황에서 상대방의 입장이 되어 보고 상대방의 감정을 상하지 않도록 주의하며 대화하게 한다.","n":[],"p":76,"b":3},{"c":"[6국어02-01]","k":"기본","sk":"","s":"국어","g":"초등학교 5~6학년","d":"읽기","t":"글자의 구성 요소와 짜임을 익혀 단어를 소리 내어 읽는다.","m":"이 성취기준은 한글 자모로 구성된 글자의 구성 요소와 짜임을 통해 글자를 만들고 글자를 소리에 대응하여 읽을 수 있는 능력을 기르기 위해 설정하였다. 글자의 구성 요소인 한글 자모 알기, 자음과 모음의 결합 방식을 익혀 글자 만들기, 글자를 소리 내어 읽기, 글자를 연결하여 단어 읽기 등의 내용을 다룬다. 글자의 구성 요소와 원리를 이해하고 글자와 단어를 소리 내어 읽는 데 도움이 되는 한글의 기본 음절표를 익히게 한다.","n":["중도중복장애 학생이 입 모양을 살필 수 있도록 입 모양을 크고 정확하게 보여주며 반복해서 따라 읽거나 관찰하게 한다. 음성출력 보완대체의사소통 기기를 사용할 때는 모음의 발음, 자모음을 결합한 발음을 정확하게 듣고 글자의 구성 요소 찾기 등의 활동을 지도한다. 보조공학 기기를 사용하여 글자에 대응되는 소리를 듣고 자연스럽게 글자의 구성 요소와 글자의 짜임을 이해하도록 지도한다."],"p":78,"b":3},{"c":"[6국어02-02]","k":"기본","sk":"","s":"국어","g":"초등학교 5~6학년","d":"읽기","t":"여러 가지 매체 자료에서 단어의 의미를 파악한다.","m":"이 성취기준은 학생이 일상생활에서 사용하는 단어의 의미를 파악하여 주변에서 접하는 사람이나 대상, 환경과 적절하게 소통하는 능력을 기르기 위해 설정하였다. 일상생활과 관련 있는 실물･사진･그림을 보고 의미 파악하기, 그림에 맞는 단어 찾기, 일상생활에서 볼 수 있는 안내판, 광고지의 글과 영상 매체 자료에서 자주 볼 수 있는 단어의 의미 알기 등의 내용을 다룬다. 영상 매체를 활용할 때는 수동적으로 시청하는 학습에 치우치지 않고, 매체 자료에 있는 글 또는 단어를 능동적으로 읽고 의미를 이해하게 한다.","n":["중도중복장애 학생은 일상생활에서 자주 볼 수 있는 상징과 글자의 기호를 탐색하여 필요한 정보의 기초적인 의미를 이해하게 한다. 이름과 자기 얼굴 사진 연결 짓기, 가족의 호칭과 사진 연결 짓기, 가족에서부터 가까운 지역사회 대상을 지칭하는 단어와 상징 연결 짓기 등을 활동한다. 그림과 함께 보완대체의사소통 상징을 활용하여 단어의 의미를 파악하는 데 능동적으로 참여하게 한다."],"p":78,"b":3},{"c":"[6국어02-03]","k":"기본","sk":"","s":"국어","g":"초등학교 5~6학년","d":"읽기","t":"그림을 단서로 문장의 내용을 이해한다.","m":"이 성취기준은 문장의 내용을 이해하기 위해 다양한 매체 자료에서 그림 단서를 활용하여 의미를 파악하는 능력을 기르기 위해 설정하였다. 다양한 매체 자료에서 그림을 보고 내용 이해하기, 단어와 그림을 보고 문장의 전후 내용 이해하기 등의 내용을 다룬다. 매체 자료의 내용과 문장의 이해를 위해 그림 단서를 충분히 제공하여 학생이 해당 내용의 뜻을 바르게 파악하게 한다.","n":[],"p":78,"b":3},{"c":"[6국어02-04]","k":"기본","sk":"","s":"국어","g":"초등학교 5~6학년","d":"읽기","t":"일상생활에서 접하는 동시, 노랫말, 이야기 등에 재미를 느끼며 읽는다.","m":"이 성취기준은 학생이 친숙하게 자주 접하는 동시･노랫말･이야기 읽기에 재미를 느끼고, 일상생활의 여러 경험을 담은 글에 흥미를 갖는 문학적 감수성을 기르기 위해 설정하였다. 동시･노랫말･이야기에서 재미있는 말이나 반복되는 말 찾기, 다양한 말놀이, 소리･모양･모습 흉내 내는 말 알아보기 등의 내용을 다룬다. 다양한 자료에서 운율감을 느끼고 말놀이의 재미를 경험하게 한다.","n":[],"p":78,"b":3},{"c":"[6국어02-05]","k":"기본","sk":"","s":"국어","g":"초등학교 5~6학년","d":"읽기","t":"다양한 매체 자료와 글에 흥미를 느끼고, 올바른 읽기 습관을 기른다.","m":"이 성취기준은 다양한 형식의 매체 자료의 글에 흥미를 느끼면서 읽을거리에 친밀감, 호기심을 갖고 올바른 읽기 태도를 함양하기 위해 설정하였다. 글을 읽을 때 바른 자세로 읽기, 장소에 알맞게 소리 내어 읽기, 좋아하는 매체 자료 선택하여 읽기, 다양한 글 자료에 관심 표현하기, 도서관이나 서점 방문하여 책 고르기, 시간을 정해서 책 읽기, 그림책의 전체 내용 읽기 등의 내용을 다룬다. 학생에게 친근한 주제와 교육 목적에 맞는 매체 자료를 선택하고 학생이 올바른 시청 태도를 갖도록 지도한다.","n":[],"p":78,"b":3},{"c":"[6국어03-01]","k":"기본","sk":"","s":"국어","g":"초등학교 5~6학년","d":"쓰기","t":"글자의 짜임을 알고 획순에 따라 한글 자모를 쓴다.","m":"이 성취기준은 글자의 기초가 되는 자음과 모음을 조합하여 바른 순서와 모양으로 글자를 쓰는 기초 능력을 기르기 위해 설정하였다. 자음과 모음을 조합하여 글자 만들기, 글자에서 자음과 모음 찾아 쓰기, 글자의 모양과 획순을 알고 순서에 맞게 쓰기 등의 내용을 다룬다. 글자를 이루는 자음과 모음의 결합 방식을 이해하며 한글 자모를 쓰게 하되, 획순을 지나치게 강조하지 않는다.","n":[],"p":80,"b":3},{"c":"[6국어03-02]","k":"기본","sk":"","s":"국어","g":"초등학교 5~6학년","d":"쓰기","t":"단어가 가진 의미를 알고 일상생활에서 자주 사용하는 단어를 쓴다.","m":"이 성취기준은 글자와 단어에 의미가 있다는 것을 알고 일상생활에서 자주 사용하는 단어를 쓰는 능력을 기르기 위해 설정하였다. 음식이나 동물의 이름 알기, 장소를 나타내는 단어의 의미 알기, 단어와 그림 연결하기, 그림 보고 어울리는 단어 쓰기 등의 내용을 다룬다. 그림이나 사진과 같은 시각적 매체 자료를 활용하여 단어의 의미를 알고, 자주 사용하는 짧은 단어 쓰기부터 시작하여 점차 음절의 수가 길거나 자주 사용하지 않는 단어를 쓰게 한다.","n":[],"p":80,"b":3},{"c":"[6국어03-03]","k":"기본","sk":"","s":"국어","g":"초등학교 5~6학년","d":"쓰기","t":"쓰기에 흥미를 느끼고 바른 자세와 태도로 글자를 쓴다.","m":"이 성취기준은 쓰기 활동 자체에 흥미를 느끼고 바른 자세와 태도로 글자를 쓰는 능력을 기르기 위해 설정하였다. 관심 있는 주제와 관련 있는 단어 쓰기, 좋아하는 대상의 명칭이나 특징 쓰기, 바른 자세와 태도로 글자 쓰기 등의 내용을 다룬다. 좋아하는 내용을 자발적으로 쓰면서 쓰기에 흥미를 느끼고, 바른 자세로 쓰는 것을 반복적으로 연습하여 올바른 쓰기 태도를 함양하게 한다.","n":[],"p":80,"b":3},{"c":"[9국어01-01]","k":"기본","sk":"","s":"국어","g":"중학교 1~3학년","d":"듣기･말하기","t":"상대방의 이야기를 듣고 주요 내용을 파악한다.","m":"이 성취기준은 일상적인 대화 장면에서 상대방의 이야기를 듣고 주요 내용을 파악하여 적절히 활용하는 능력을 기르기 위해 설정하였다. 타인이 전달하는 내용을 듣고 말의 의도나 목적 파악하기, 지시에 따라 행동하기, 순서가 있는 지시 수행하기, 주요 단어나 내용 다시 말하기, 상대방이 하는 말과 관련된 대답이나 질문하기 등의 내용을 다룬다. 가정, 학교, 지역사회에서 접할 수 있는 대화 상황에서 상대방의 말을 주의 깊게 듣고 말의 내용을 정확히 파악하여 적절하게 반응하게 한다.","n":[],"p":81,"b":3},{"c":"[9국어01-02]","k":"기본","sk":"","s":"국어","g":"중학교 1~3학년","d":"듣기･말하기","t":"사건이나 사실을 분명하게 전달한다.","m":"이 성취기준은 사건이나 사실을 상대방이 이해할 수 있도록 정확하게 전달하는 능력을 기르기 위해 설정하였다. 육하원칙의 요소를 고려해 말하기, 가정 및 학교에서의 일과나 일이 일어난 순서에 맞게 말하기, 대상이나 장소를 중심으로 순서대로 말하기, 보거나 들은 내용 전달하기 등의 내용을 다룬다. 상대방에게 사건이나 사실을 간결하고 정확하게 전달하게 한다.","n":[],"p":81,"b":3},{"c":"[9국어01-03]","k":"기본","sk":"","s":"국어","g":"중학교 1~3학년","d":"듣기･말하기","t":"준언어적, 비언어적 표현 요소를 활용하여 자신의 감정이나 느낌을 표현한다.","m":"이 성취기준은 음성 언어와 준언어적, 비언어적 표현을 함께 사용하여 자신의 감정이나 느낌을 효과적으로 표현하는 능력을 기르기 위해 설정하였다. 상황에 맞는 느낌이나 감정 이해하기, 음성 언어와 준언어적, 비언어적 표현을 함께 사용하여 느낌이나 감정 표현하기 준언어적, 비언어적 표현의 의미와 효과 이해하기 등을 다룬다. 일상적인 경험과 대화 상황, 노래나 문학 작품 감상과 같은 다양한 장면에서 자신의 느낌이나 감정을 말이나 어조, 표정, 자세 등의 준언어적, 비언어적 표현 요소를 사용해 표현할 수 있게 한다.","n":["중도중복장애 학생의 듣기･말하기 수준에 따라 상대방에게 관심을 갖고 말하는 사람 바라보기, 기분을 그림이나 낱말로 표현하기, 표정에 어울리는 감정을 그림이나 낱말로 표현하기, 듣기 좋은 말투 선택하기, 보완대체의사소통 기기로 기분이나 감정 표현하기 등으로 성취기준을 재구성하여 적용할 수 있다."],"p":81,"b":3},{"c":"[9국어01-04]","k":"기본","sk":"","s":"국어","g":"중학교 1~3학년","d":"듣기･말하기","t":"대화 예절을 지키며 상대방의 말에 적절한 질문과 대답으로 대화를 이어 간다.","m":"이 성취기준은 대화 예절을 지키며 상대방의 말에 적절한 질문과 대답으로 대화를 이어 가는 의사소통 능력을 기르기 위해 설정하였다. 상대방이 한 말에 관심을 보이며 듣기, 상대방의 질문에 따라 자신이 원하는 것, 선호하는 것, 희망 사항, 경험한 일 대답하기, 들은 내용과 관련 있거나 궁금한 것 질문하기, 상대방이 관심 있는 주제로 대화를 시작하거나 이어 가기 등의 내용을 다룬다. 상대방과 대화를 이어갈 수 있도록 대화 상대자를 존중하는 마음을 가지고 대화 차례를 지키며 대화하게 한다.","n":[],"p":81,"b":3},{"c":"[9국어01-05]","k":"기본","sk":"","s":"국어","g":"중학교 1~3학년","d":"듣기･말하기","t":"인사말과 높임 표현을 사용하여 상황과 상대방에 따라 적절하게 말한다.","m":"이 성취기준은 대화 상황과 상대방에게 맞게 적절한 인사말과 높임 표현을 사용하여 대화하는 능력을 기르기 위해 설정하였다. 인사, 감사, 사과, 부탁, 위로, 격려, 자기소개, 거절 등이 필요한 상황에서 적절한 인사말 하기, 가족, 친구, 교사, 이웃과 같이 일상생활에서 자주 접하는 대화 상대에게 맞는 높임 표현 사용하기 등의 내용을 다룬다.","n":["중도중복장애 학생의 듣기･말하기 수준에 적합한 의사소통 수단과 방법을 활용하여 반복되는 일과나 일상생활 장면에서 상대방에게 먼저 인사하기, 필요한 물건이나 행동 요청하기, 다른 사람의 호칭 부르기, ‘예’나 ‘아니요’, ‘좋아요’나 ‘싫어요’로 대답하기, 학교와 가정에서 자주 쓰는 단어를 사용하여 대답하기, 표현하고자 하는 것을 바라보거나 선택하기 등으로 성취기준을 재구성하여 적용할 수 있다."],"p":81,"b":3},{"c":"[9국어02-01]","k":"기본","sk":"","s":"국어","g":"중학교 1~3학년","d":"읽기","t":"단어의 의미 관계를 이해하고 의미 관계에 알맞게 띄어 읽는다.","m":"이 성취기준은 어휘의 의미 관계를 통해 어휘의 확장된 의미를 이해함으로써 문장을 어절, 의미에 알맞게 띄어 읽고, 내용을 바르게 해석하는 능력을 기르기 위해 설정하였다. 어절 단위로 띄어 읽기, 단일어･복합어･동형어 알기, 단어의 함축적 의미 알기, 어휘의 유의어 및 반의어 알기, 어휘의 상하 관계 및 포함어 알기 등의 내용을 다룬다. 띄어 읽을 때는 어절과 어절 사이, 문장 부호 뒤, 주어부와 서술어부 사이에서 의미 단위로 띄어 읽도록 지도한다.","n":[],"p":83,"b":3},{"c":"[9국어02-02]","k":"기본","sk":"","s":"국어","g":"중학교 1~3학년","d":"읽기","t":"문장의 의미를 파악하여 주요 내용을 확인한다.","m":"이 성취기준은 문장의 의미를 이해하여 필요한 자료나 정보를 수집하고, 문장의 주요 대상이나 내용을 파악하여 효과적으로 활용하는 능력을 기르기 위해 설정하였다. 문장에서 핵심적인 대상이나 어휘 찾기, 다양한 유형의 문장에서 대상과 상황, 방법과 같은 주요 내용 파악하기 등의 내용을 다룬다. 문장 유형을 학습하는 활동으로 그치지 않고, 문장의 유형에 따라 의미가 달라진다는 것을 알도록 다양한 유형의 문장을 제시한다.","n":[],"p":83,"b":3},{"c":"[9국어02-03]","k":"기본","sk":"","s":"국어","g":"중학교 1~3학년","d":"읽기","t":"문장을 읽고 인물의 생각이나 마음을 이해한다.","m":"이 성취기준은 여러 개의 문장으로 이루어진 짧은 글을 읽고 등장인물의 마음이나 생각을 이해하는 능력을 기르기 위해 설정하였다. 짧은 글에서 인물의 처지와 상황 짐작하기, 인물의 마음이나 생각을 나타내는 표현 찾기, 자기 경험과 연관 지어 생각하기 등의 내용을 다룬다. 다양한 매체 자료와 기호와 상징을 사용하는 보완대체의사소통 기기를 사용하여 인물의 처지나 마음을 표현할 때 ‘행복하다, 자랑스럽다, 신나다, 힘들다, 슬프다, 후회하다, 두렵다, 서운하다’ 등과 같은 감정을 표현하는 다양한 어휘를 제시한다.","n":[],"p":83,"b":3},{"c":"[9국어02-04]","k":"기본","sk":"","s":"국어","g":"중학교 1~3학년","d":"읽기","t":"다양한 읽을거리를 스스로 찾아 즐겨 읽는 태도를 기른다.","m":"이 성취기준은 여러 장르의 읽을거리를 자발적으로 선택하여 읽음으로써 내용을 이해하고 공감하는 능력을 기르기 위해 설정하였다. 시, 시나리오, 희곡, 이야기 글, 영화, 드라마, 만화, 책 등을 읽거나 보고 난 후 마음에 드는 내용과 표현 찾기, 재미나 감동을 주는 부분 찾아 바꾸어 보기, 스스로 좋아하는 작품을 선택하여 읽고 좋아하는 이유나 느낌 나타내기, 인상적인 부분 찾기 등의 내용을 다룬다. 학생들의 경험이 담긴 여러 장르의 문학 작품을 읽게 하여 읽을거리에 흥미를 느껴 자발적으로 읽게 한다.","n":[],"p":83,"b":3},{"c":"[9국어02-05]","k":"기본","sk":"","s":"국어","g":"중학교 1~3학년","d":"읽기","t":"글을 읽고 글에 대한 느낌과 경험을 다른 사람과 나눈다.","m":"이 성취기준은 일상생활에서 쉽게 볼 수 있는 글과 매체 자료를 읽은 경험과 느낌을 다른 사람에게 전하고 공유하는 능력을 기르기 위해 설정하였다. 매체 광고나 안내문에서 본 단어와 문장, 영상 자막, 매체 자료 등과 같은 글을 읽은 경험과 느낌 주고받기, 서로의 감상 비교하기, 재미있게 읽은 글이나 매체 자료 소개하기 등의 내용을 다룬다. 읽기를 통해 글쓴이의 생각을 이해하고, 서로의 읽기 경험을 표현하고 공유하도록 지도한다.","n":["중도중복장애 학생에게는 성취기준을 재구성하여 글이나 이야기에 대한 느낌을 표정이나 몸짓으로 표현하기, 표정 그림이나 카드로 표현하기, 생각이나 느낌을 상징으로 표현하기, 감정의 종류와 정도를 다양한 색이나 그래프로 표현하기 등의 활동을 적용할 수 있다."],"p":83,"b":3},{"c":"[9국어03-01]","k":"기본","sk":"","s":"국어","g":"중학교 1~3학년","d":"쓰기","t":"사물의 이름, 존재, 상태, 동작을 나타내는 단어를 바르게 쓴다.","m":"이 성취기준은 소리와 표기 사이의 관계를 이해하여 사물을 나타내는 단어를 표기에 맞게 쓰는 능력을 기르기 위해 설정하였다. 사물의 이름, 존재, 상태, 동작을 나타내는 단어를 비롯한 여러 단어를 점선 따라 쓰기, 보고 쓰기, 스스로 쓰기, 받아쓰기 등 다양한 방법으로 써 보고, 바른 표기법을 학습하는 내용을 다룬다. 소리와 표기가 일치하는 단어부터 소리와 표기가 일치하지 않는 단어로 점차 학습의 범위를 확장하여 바르게 쓰게 한다.","n":[],"p":85,"b":3},{"c":"[9국어03-02]","k":"기본","sk":"","s":"국어","g":"중학교 1~3학년","d":"쓰기","t":"기록의 필요성을 알고 일상생활에 필요한 내용과 정보를 메모한다.","m":"이 성취기준은 메모의 필요성을 알고 메모하는 습관을 기르기 위해 설정하였다. 메모가 필요한 상황을 살펴보고, 준비물 쓰기, 구매할 물건 목록 적기, 일정 정리하기와 같은 내용을 다룬다. 필요한 정보를 메모하고 활용하는 습관을 가지게 한다.","n":["쓰기 도구의 사용이 어렵거나 글로 기록하기 어려운 중도중복장애 학생은 디지털 기기를 사용하여 녹음하거나 사진을 찍는 등 다양한 방법으로 기록하는 것으로 성취기준을 재구성하여 지도할 수 있다."],"p":85,"b":3},{"c":"[9국어03-03]","k":"기본","sk":"","s":"국어","g":"중학교 1~3학년","d":"쓰기","t":"문장의 기본 구조를 알고 문장을 쓴다.","m":"이 성취기준은 문장의 구성 능력을 기르기 위해 설정하였다. 주요 문장 성분의 이해를 바탕으로 주어에 맞게 서술어 쓰기, 어순에 맞게 문장 쓰기 등의 내용을 다룬다. 그림이나 사진 등으로 제시한 구체적인 상황이나 장면을 보고, 주어, 서술어, 목적어 등을 다양하게 변경하여 문장을 완성하게 한다.","n":["중도중복장애 학생의 학습 수행 능력과 교육적 요구를 반영하여 그림 카드･단어 카드를 이용한 문장 만들기, 완성된 문장을 모방하여 문장 만들기 등의 활동을 반복하여 문장의 기본 구조를 익히도록 성취기준을 재구성하여 적용할 수 있다."],"p":85,"b":3},{"c":"[9국어03-04]","k":"기본","sk":"","s":"국어","g":"중학교 1~3학년","d":"쓰기","t":"쓰기에 자신감을 가지고 단어나 문장으로 쓰려는 태도를 기른다.","m":"이 성취기준은 다양한 쓰기 활동을 통해 쓰기에 자신감을 가지고 단어나 문장을 쓰는 태도를 기르기 위해 설정하였다. 쓰기 특성과 단계에 따라 기초적 쓰기, 단어 쓰기, 문장 쓰기 활동을 하며, 일상생활과 밀접한 내용을 주제로 정해서 꾸준히 쓰기 활동을 하게 한다.","n":[],"p":85,"b":3},{"c":"[12국어01-01]","k":"기본","sk":"","s":"국어","g":"고등학교 1~3학년","d":"듣기･말하기","t":"정보를 전달하는 말을 듣고 자신에게 필요한 내용을 파악한다.","m":"이 성취기준은 정보를 전달하는 말을 듣고 이해하여 자신에게 필요한 정보를 파악하고 활용하는 능력을 기르기 위해 설정하였다. 가정, 학교, 지역사회의 일상생활에서 설명하는 말이나 안내하는 말을 듣고 필요한 정보 파악하기, 육하원칙의 요소에 따라 내용 파악하기, 순서나 과정에 따라 행동하기 등의 내용을 다룬다. 상황별로 요구되는 정보가 무엇인지 확인하고, 필요한 정보를 기록하거나 기억하여 일상생활에 활용하도록 하며, 정보를 파악하지 못했을 경우 상대방에게 다시 말해 달라고 요청하게 한다.","n":[],"p":87,"b":3},{"c":"[12국어01-02]","k":"기본","sk":"","s":"국어","g":"고등학교 1~3학년","d":"듣기･말하기","t":"상대방의 말에 적절히 반응하며 공감하는 대화를 한다.","m":"이 성취기준은 상대방의 말을 경청하고, 상대방의 처지와 감정을 이해하여 공감하는 대화 능력을 기르기 위해 설정하였다. 상대방의 말에 고개를 끄덕이거나 눈 마주치기와 같이 반응하며 듣기, 표정이나 행동을 통해 정서와 처지를 이해하기, 말하는 사람의 처지가 되어 생각하기, 공감하는 말 하기, 상대방의 반응 살펴보기 등의 내용을 다룬다. 상대방의 의도와 감정을 파악하고, 공감하는 대화를 할 때 음성 언어 표현과 준언어적, 비언어적 표현을 함께 사용하게 한다.","n":[],"p":87,"b":3},{"c":"[12국어01-03]","k":"기본","sk":"","s":"국어","g":"고등학교 1~3학년","d":"듣기･말하기","t":"생각을 주고받으며 대화를 나눈다.","m":"이 성취기준은 자기 생각을 다른 사람과 공유하며 능동적으로 의사소통하고,상호 존중하는 대화 능력을 기르기 위해 설정하였다. 일상적인 대화나 경험, 시나 이야기 글 감상, 공동 의사 결정을 위한 토의나 회의 장면에서 자신의 느낌, 의견 등의 생각을 적절히 표현하고, 다른 사람의 생각을 듣고 이해하는 내용 등을 다룬다. 자신과 상대방의 생각이 서로 다를 수 있음을 이해하고 상대방의 말을 경청하며 존중하는 태도로 대화하게 한다.","n":[],"p":87,"b":3},{"c":"[12국어01-04]","k":"기본","sk":"","s":"국어","g":"고등학교 1~3학년","d":"듣기･말하기","t":"대화 목적에 따라 적절한 내용과 태도로 말한다.","m":"이 성취기준은 자신의 언어 능력과 표현 방식에 따라 상황과 목적에 맞게 자신을 표현하는 능력을 기르기 위해 설정하였다. 일상적인 대화뿐만 아니라 자기소개, 면접, 지역사회 기관 이용, 직장 생활 등의 말하기 상황에서 정보 전달과 습득, 요청, 설득, 친교 및 정서 표현과 같은 말하기의 목적에 따라 적합한 내용을 구성해 적절한 자세로 대화하기 등의 내용을 다룬다. 현재나 가까운 미래에 경험할 수 있는 상황을 중심으로 대화 상황과 상대방을 고려하며 자신의 의도를 분명하게 표현할 수 있게 한다.","n":["중도중복장애 학생에게는 가정, 학교, 지역사회, 직장에서 자주 접할 수 있는 대화 상황 이해하기, 상대방에게 자신과 관련된 정보 전달하기, 원하는 물건이나 행동 요청하기, 허락 구하기, 인사하기, 칭찬하기, 고마운 마음 표현하기 등으로 성취기준을 재구성하여 적용할 수 있다."],"p":87,"b":3},{"c":"[12국어01-05]","k":"기본","sk":"","s":"국어","g":"고등학교 1~3학년","d":"듣기･말하기","t":"다양한 매체와 매체 자료를 활용하여 의사소통한다.","m":"이 성취기준은 매체를 활용하여 정보를 접하고, 다양한 방법으로 의사소통하는 능력을 기르기 위해 설정하였다. 컴퓨터, 인공지능 스피커 등을 활용하여 필요한 정보를 얻거나 콘텐츠 시청하기, 스마트폰으로 영상 통화와 음성 통화하기, 정보통신 기기 등으로 원격수업과 온라인 모임에 참여하기 등을 다룬다. 디지털 매체의 터치스크린, 음성검색 기능 등을 사용하여 시청각 정보를 찾아 접하고, 대화 예절을 지키며 매체를 활용한 의사소통에 참여하게 한다.","n":["중도중복장애 학생에게는 컴퓨터, 태블릿 등으로 기기의 기본 조작 방법 익히기, 매체를 이용해 좋아하는 주제의 영상 찾아 시청하기, 좋아하는 음악이나 소리 책 감상하기, 나에게 적합한 애플리케이션을 활용하여 의사 표현하기, 영상 통화나 온라인 모임에서 인사 나누기 등으로 성취기준을 재구성하여 적용할 수 있다."],"p":87,"b":3},{"c":"[12국어02-01]","k":"기본","sk":"","s":"국어","g":"고등학교 1~3학년","d":"읽기","t":"글의 느낌과 분위기를 살려 유창하게 읽는다.","m":"이 성취기준은 글의 내용에 대한 이해를 바탕으로 글의 분위기나 장면, 인물의 특성 등을 고려하여 효과적으로 소리 내어 읽는 능력을 기르기 위해 설정하였다. 정확한 발음과 적절한 속도로 읽기, 말의 재미를 느끼며 읽기, 음색, 어조, 속도, 억양 등 준언어적 요소들을 활용하여 글의 분위기나 장면, 인물의 특성이 잘 드러나도록 읽기 등의 내용을 다룬다. 글의 내용을 충분히 이해한 후, 이를 바탕으로 소리 내어 읽는 활동을 통해 유창성을 기르고 읽기의 재미를 느끼게 한다.","n":[],"p":89,"b":3},{"c":"[12국어02-02]","k":"기본","sk":"","s":"국어","g":"고등학교 1~3학년","d":"읽기","t":"글의 중심 내용을 파악하고 대강의 내용을 간추린다.","m":"이 성취기준은 글을 읽고 내용을 파악하기 위한 구체적인 전략을 학습함으로써 글 전체의 내용을 효과적으로 이해하고 간추리는 능력을 기르기 위해 설정하였다. 글의 종류에 따라 대강의 내용을 간추리는 방법이 다름을 알고 적절한 전략을 활용하게 한다. 이야기 글의 경우에는 인물, 사건, 배경 파악하기, 시간의 흐름이나 사건이 일어난 순서에 따라 내용 간추리기 등의 내용을 다룬다. 그리고 설명하는 글의 경우에는 글에 반복하여 나타나는 핵심어 찾기, 문단의 중심 문장과 뒷받침 문장 파악하기, 각 문단의 중심 내용 파악하기, 대강의 내용 간추리기 등의 내용을 다룬다. 글의 중심 내용을 파악함으로써 전체적인 내용을 보다 효과적으로 이해하게 한다.","n":["문단 수준의 글을 읽고 내용을 파악하는 데 어려움이 있는 학생이나 중도중복장애 학생에게는 글의 내용이나 이야기의 장면을 표현한 삽화나 그림 등의 자료를 활용하여 이야기 글에서 중요한 인물이나 장면 찾기, 일이 일어난 순서대로 그림 나열하기, 설명하는 대상 찾기, 설명하는 내용에 해당하는 그림 가리키기 등을 통해 글의 내용과 그림을 관련지을 수 있도록 지도한다."],"p":89,"b":3},{"c":"[12국어02-03]","k":"기본","sk":"","s":"국어","g":"고등학교 1~3학년","d":"읽기","t":"글쓴이와 등장인물의 생각을 파악하고 경험과 관련짓는다.","m":"이 성취기준은 글이나 매체 자료에 나타난 등장인물이나 글쓴이의 생각과 의도를 파악하고, 경험과 관련지어 이해할 수 있는 능력을 기르기 위해 설정하였다. 이야기 글과 시, 일기, 편지, 수필, 기행문과 같은 생활문에서 느낌이나 감정을 나타내는 단어와 표현 알아보기, 글쓴이의 생각 파악하기, 등장인물의 감정 파악하기, 경험과 관련지어 읽기, 공감하며 읽기 등의 내용을 다룬다. 글쓴이나 등장인물의 마음을 짐작하여 글을 읽고 이를 자신의 배경지식이나 경험과 관련지어 능동적으로 읽는 태도를 갖게 한다.","n":[],"p":89,"b":3},{"c":"[12국어02-04]","k":"기본","sk":"","s":"국어","g":"고등학교 1~3학년","d":"읽기","t":"글과 매체 자료의 유형에 따라 다양한 읽기 방법을 적용하여 읽는다.","m":"이 성취기준은 글과 매체 자료의 유형에 따라 읽기 방법을 달리 적용해야 함을 알고, 적절한 읽기 방법을 선택하여 읽는 능력을 기르기 위해 설정하였다. 읽기 목적 확인하기, 목적에 맞는 매체 자료와 읽기 자료 선택하기, 인터넷, 사전, 신문 등에서 필요한 정보 찾기 등의 활동을 하며, 적어 두고 읽기, 필요한 정보를 찾아 읽기, 재미나 감동을 느끼며 읽기 등의 내용을 다룬다. 인터넷 게시물의 경우 문자뿐만 아니라 그림, 표, 그래프, 사진, 동영상, 댓글 등의 요소가 내용을 이해하는 데 중요한 역할을 하며, 애니메이션이나 영화와 같은 영상 매체 자료도 인물의 표정이나 몸짓, 배경이나 음악 등의 요소가 중요한 역할을 한다. 그러므로 다양한 유형의 글과 매체 자료를 접할 때, 이러한 요소들을 활용하여 적절한 읽기 방법을 적용하여 읽게 한다.","n":[],"p":89,"b":3},{"c":"[12국어02-05]","k":"기본","sk":"","s":"국어","g":"고등학교 1~3학년","d":"읽기","t":"일상생활에서 다양한 글과 책, 매체 자료를 즐겨 읽는다.","m":"이 성취기준은 일상생활에서 쉽게 접할 수 있는 다양한 글, 책, 매체 자료를 읽고, 필요한 정보를 얻으며 활용하는 능력을 기르기 위해 설정하였다. 간단한 메모나 알림장, 안내문, 광고 전단, 생활 정보지, 책, 매체 자료 등 다양한 읽을거리를 읽고, 내용 파악하여 정리하기, 글의 의미 파악하기, 읽은 후 얻은 지식과 정보 활용하기 등의 내용을 다룬다. 일상생활의 다양한 읽을거리를 통해 필요한 정보를 얻고, 자발적으로 읽는 습관을 가지도록 짧은 글 읽기에서 시작하여 다양한 책과 매체 자료로 읽을거리를 확장하여 지도한다.","n":[],"p":89,"b":3},{"c":"[12국어03-01]","k":"기본","sk":"","s":"국어","g":"고등학교 1~3학년","d":"쓰기","t":"문장 부호의 이름과 쓰임을 알고 문장에 사용한다.","m":"이 성취기준은 문장 부호의 이름과 쓰임을 알아 문장을 바르고 효과적으로 표현하는 능력을 기르기 위해 설정하였다. 문장 부호 중 가장 기본이 되는 마침표, 물음표, 느낌표, 쉼표, 따옴표의 이름과 쓰임을 학습하고, 어법과 내용에 어울리는 문장 부호를 사용하는 내용을 다룬다. 문장의 종류에 알맞은 문장 부호를 사용하여 전하고자 하는 문장의 의미를 정확하게 나타내게 한다.","n":["중도중복장애 학생에게는 문장 부호의 이름과 쓰임을 알고 문장에 사용하는 성취기준을 문장 부호에 따라 문장의 의미가 달라지는 것을 경험하는 것으로 재구성하여 설정할 수 있다."],"p":91,"b":3},{"c":"[12국어03-02]","k":"기본","sk":"","s":"국어","g":"고등학교 1~3학년","d":"쓰기","t":"주제와 내용이 자연스럽게 연결되는 짧은 글을 쓴다.","m":"이 성취기준은 문단과 문단 구성의 특징을 알고 하나의 중심 내용을 담은 문단을 구성하며, 자기 생각을 짧은 글로 표현할 수 있는 능력을 기르기 위해 설정하였다. 중심 문장 찾기, 뒷받침 문장 찾기, 중심 문장과 뒷받침 문장으로 짧은 글쓰기 등과 같은 내용을 다룬다. 중심 문장과 뒷받침 문장으로 전하고자 하는 생각을 표현하게 한다.","n":[],"p":91,"b":3},{"c":"[12국어03-03]","k":"기본","sk":"","s":"국어","g":"고등학교 1~3학년","d":"쓰기","t":"쓰기 매체를 활용하여 일상생활과 관련된 내용을 쓴다.","m":"이 성취기준은 다양한 쓰기 매체를 활용하여 자기 생각이나 느낌을 표현하는 능력을 기르기 위해 설정하였다. 쓰기 매체의 특성을 이해하고 의사소통에 적절하게 활용하는 내용을 다룬다. 특히 쓰기 매체를 활용한 표현 방법과 활용 방법을 익혀 맥락에 맞게 의사소통하게 한다.","n":[],"p":91,"b":3},{"c":"[12국어03-04]","k":"기본","sk":"","s":"국어","g":"고등학교 1~3학년","d":"쓰기","t":"쓰기로 소통하는 즐거움을 느끼고, 언어 예절을 지켜 글 쓰는 태도를 기른다.","m":"이 성취기준은 쓰기 활동으로 의사소통하는 즐거움을 느끼고, 언어 예절을 지켜 글을 쓰는 태도를 기르기 위해 설정하였다. 일상생활에서 사용하는 바른 언어, 언어 예절, 쓰기 윤리 등의 내용을 다룬다. 특히 디지털 매체를 활용한 쓰기 활동에서 언어 예절을 지켜 소통하는 자세와 태도를 함양하게 한다.","n":[],"p":91,"b":3},{"c":"[4사회01-01]","k":"기본","sk":"","s":"사회","g":"초등학교 3~4학년","d":"나의 삶","t":"나의 여러 모습을 살펴보고 나를 좋아하는 마음을 가진다.","m":"이 성취기준은 자기 모습을 살펴보면서 나를 이해하고 존중하는 힘을 기를 수 있도록 설정하였다. 이를 위해 거울 속 나의 모습(예: 생김새, 차림새) 살펴보기, 가정, 학교, 지역사회에서 내가 하는 일 찾기, 내가 좋아하는 것 나열하기, 나에 대하여 여러 가지 방법으로 표현하기, 나를 아끼는 마음을 담아 소중한 나의 사진첩 만들기 등의 내용을 다룬다. 나를 구체적으로 인식할 수 있는 활동을 통해 자신에 대하여 이해하는 과정을 거치면서 나를 긍정적이고 소중히 여기는 마음을 기른다.","n":["나에 대하여 감각적으로 확인할 수 있는 것을 중심으로 자신을 구체적으로 인식하며, 자신에 대하여 표현할 때는 개개인의 다양한 특성을 고려하여 말 또는 글로 표현하기, 그림 또는 사진으로 표현하기, 보완대체의사소통 기기를 활용하여 표현하기 등 여러 가지 표현 양식을 활용한다. 보조기기를 활용하는 경우 이 또한 자신의 특징으로 자연스럽게 인식할 수 있도록 하며 장애가 있는 모습이 개인의 특성으로 존중될 수 있도록 유의한다."],"p":105,"b":3},{"c":"[4사회02-01]","k":"기본","sk":"","s":"사회","g":"초등학교 3~4학년","d":"관계의 삶","t":"우리 가족의 화목한 모습을 살펴보며 우리 가족을 소중히 여기는 마음을 가진다.","m":"이 성취기준은 우리 가족의 모습을 관찰하며 그 소중함을 느끼도록 설정하였다. 가족사진을 보며 화목한 우리 가족의 모습 관찰하기, 가족 구성원을 부르는 호칭 바르게 사용하기, 나와 가족 구성원 간 관계 파악하기, 우리 가족의 반려동물 소개하기, 역할 놀이를 통해 가족 간에 사랑하며 살아가는 모습 묘사하기, 소중한 가족에게 고마운 마음을 담아 표현하기 등의 내용을 다룬다. 이를 통해 가족 간의 사랑이 구성원들의 긍정적 관계 경험에서 비롯된다는 사실을 알게 되며, 나와 우리 가족뿐만 아니라 친구의 가족에 대해서도 관심을 가지고 이해하는 계기가 된다.","n":["오늘날 다양한 가족의 형태(예: 혈연관계, 비혈연 관계, 확대 가족, 핵가족, 한 부모 가족, 조손 가족, 다문화 가족)를 고려하여 특정 가족 형태에 대한 편견을 갖지 않도록 유의한다."],"p":106,"b":3},{"c":"[4사회02-02]","k":"기본","sk":"","s":"사회","g":"초등학교 3~4학년","d":"관계의 삶","t":"가족 간에 서로 존중하는 모습을 보며 가족에게 예의 바르게 행동한다.","m":"이 성취기준은 바람직한 인간관계를 맺으며 함께 살아가기 위해 사람들 사이에 지켜야 할 약속이자 중요한 덕목인 예절을 가족 안에서 먼저 실천할 수 있도록 하는 데 목적이 있다. 가족 구성원 간에 서로 존중하는 말투와 몸가짐(예: 옷차림, 자세) 살펴보기, 언어 예절, 인사 예절과 같이 가족 구성원 간에 지켜야 하는 예절 실천하기 등에 관한 내용을 다루는 과정에서 부모님에 대한 효, 부모님의 자식에 대한 사랑, 형제자매 간의 우애를 자연스럽게 느낀다. 가족 구성원 간에 예의 바른 모습을 관찰하고 실천하는 일련의 활동을 통하여 가정에서 지켜야 하는 생활 예절의 구체적 내용을 알게 되며 이는 확장된 사회적 관계의 바탕이 된다.","n":[],"p":106,"b":3},{"c":"[4사회02-03]","k":"기본","sk":"","s":"사회","g":"초등학교 3~4학년","d":"관계의 삶","t":"학교에서 친구를 아끼고 사이좋게 생활한다.","m":"이 성취기준은 친구와의 관계에서 언어, 감정, 행동 등의 양식을 배우며 사회적인 자아를 형성하고 친구 사이에 가져야 할 바른 태도를 갖추기 위해 설정하였다. 친구의 모습 관찰하기, 친구와 대화하며 서로에 대해 알아가기, 다양한 상황에서 친구에게 적절한 말과 행동 사용하기, 친구와 함께 놀이하며 즐거운 마음 표현하기 등에 관한 내용을 다룬다. 친구와 사이좋게 지내는 모습을 살피고 경험하며 친구의 소중함을 느끼는 과정에서 사회적 관계의 확장과 유지를 위한 구체적인 방법과 이를 상황맥락에 따라 적절히 적용하는 것의 중요성을 인식하게 된다. 친구들과의 상호 작용 경험을 통해 대인 관계 능력을 함양하는 데 중점을 둔다.","n":[],"p":106,"b":3},{"c":"[4사회03-01]","k":"기본","sk":"","s":"사회","g":"초등학교 3~4학년","d":"시민의 삶","t":"우리 동네의 모습을 살펴보고 이웃들이 살아가는 모습에 관심을 가진다.","m":"이 성취기준은 주된 생활공간인 집, 학교, 동네를 중심으로 자신과 연관 있는 환경에 대한 이해와 관심을 이끄는 것에 중점을 둔다. 우리 집 또는 학교의 위치와 모습 살펴보기, 우리 동네의 자연환경과 인문환경 살펴보기, 동네 사람들이 이용하는 장소와 시설물 확인하기, 디지털 영상 지도를 활용하여 우리 동네의 여러 가지 모습 살펴보기 등에 관한 내용을 다룬다. 또한 우리 동네의 좋은 점 발표하기, 내가 살고 싶은 우리 동네 상상하기 등의 내용을 통해 학생으로서 친화적인 환경에 대한 관점을 제시한다. 우리 동네와 그 속에서 살아가는 사람들의 모습(예: 직업, 여가, 일상생활 모습)에 관심을 가지도록 함으로써 우리 동네의 지리적 특성에 대한 정보를 얻고 주변 환경과 인간 생활과의 관계를 이해하는 바탕을 다진다.","n":["디지털 영상 지도의 다양한 기능을 활용하여 공간에 대한 이해를 쉽게 하는 웹 기반 지리 학습이 이루어지도록 한다. 또한 시각중복장애 학생의 경우 환경이나 지도에 대한 시각적 관찰이 어려울 수 있으므로 환경에 관한 자기 경험과 학습 내용을 연결하여 이해하도록 구성한다. 학생의 특성을 고려하여 이를 보완할 수 있도록 다양한 감각적 경험과 자료(예: 확대 자료, 촉각 자료, 음성 자료, 점자 자료)를 함께 제공하고 정보 접근성을 향상할 수 있는 보조공학 기기를 지원한다."],"p":108,"b":3},{"c":"[4사회03-02]","k":"기본","sk":"","s":"사회","g":"초등학교 3~4학년","d":"시민의 삶","t":"우리 이웃 사람들의 다양한 경제활동을 살펴보고 이웃들의 경제활동에 관심을 가진다.","m":"이 성취기준은 나의 생활과 이웃의 일 혹은 직업과의 연관성을 살펴보고 주변 사람들의 경제활동에 관심을 가지기 위해 설정하였다. 가족 및 이웃이 하는 일과 직업에 대한 자료 수집하기, 이웃 사람들이 일하는 곳을 살펴보며 구매할 수 있는 재화와 서비스 연결하기, 가게 놀이를 통해 물건 구매 경험하기 등의 내용을 다룬다. 가족 또는 이웃이 하는 다양한 경제생활 모습에 관심을 가지고 그 모습을 관찰하는 과정을 통하여 나와 나를 둘러싼 사회(예: 환경, 인물) 간의 연관성과 상호 작용을 이해함으로써 주체적인 경제생활의 기초를 마련한다.","n":["가족 또는 이웃의 경제활동 모습을 통해 지역사회의 자연환경과 인문환경의 지리적 특성을 살펴보며 지리와 경제의 관계성을 이해할 수 있는 기초를 마련하도록 [4사회03-01]과 연계한다."],"p":108,"b":3},{"c":"[4사회03-03]","k":"기본","sk":"","s":"사회","g":"초등학교 3~4학년","d":"시민의 삶","t":"나와 우리 가족 구성원이 변화해온 모습을 살펴보며 가족의 변화 모습에 관심을 가진다.","m":"이 성취기준은 나와 우리 가족의 현재를 바탕으로 과거를 연결하여 시간의 흐름에 따른 사람과 생활의 변화를 살펴보며 역사를 도입한다. 성장앨범을 보며 나의 변화 모습 살펴보기, 가족이 살아온 모습을 담은 우리 가족 이야기 만들기, 나 또는 친구 가족의 변화 모습에 관심을 가지고 가족사진 전시 관람하기 등에 관한 내용을 다룬다. 나와 우리 가족의 과거와 현재에 관심을 가지고 살펴보는 여러 가지 활동을 통해 학생의 경험을 바탕으로 역사라는 추상적인 개념에 대한 기초적 이해를 형성한다.","n":[],"p":108,"b":3},{"c":"[4사회03-04]","k":"기본","sk":"","s":"사회","g":"초등학교 3~4학년","d":"시민의 삶","t":"가족, 친구와 여러 가지 문화 활동에 즐겁게 참여한다.","m":"이 성취기준은 가족, 친구와 다양한 문화적 경험을 함께하고 즐거움을 나누는 것에 중점을 둔다. 가족 또는 친구와 함께한 일 발표하기, 즐거운 문화 활동 추천하고 함께 즐기기, 문화 활동의 종류 조사하기, 우리 동네의 문화 시설 찾아보기 등의 내용을 다룬다. 그 과정에서 다양한 문화 활동의 종류와 타인과 함께 즐기는 올바른 태도를 익히며 함께하는 문화생활이 삶을 풍요롭게 한다는 사실을 알게 된다. 함께하는 문화 활동 교육의 취지를 가정과 공유하고 다양한 형태와 수준의 문화 활동을 독려하여 행복한 삶을 위한 방안으로 문화 활동의 중요성을 체감한다.","n":[],"p":108,"b":3},{"c":"[4사회03-05]","k":"기본","sk":"","s":"사회","g":"초등학교 3~4학년","d":"시민의 삶","t":"학교생활에서 지켜야 하는 규칙을 살펴보고 이를 지킨다.","m":"이 성취기준은 학교에서 지켜야 하는 규칙을 생활 장면에서 살펴보고 이를 지키는 태도를 기르기 위해 설정하였다. 규칙은 학교와 학급에서의 안전, 질서(예: 시간표, 교칙)와 더불어 교사, 또래, 기타 성인 등을 포함하는 사람들과의 관계에서 지켜야 하는 배려, 존중 등의 예의를 포함한다. 규칙을 지켰을 때와 지키지 않았을 때 일어날 수 있는 일 예상하기, 규칙을 지키는 바른 행동 고르기, 규칙을 지키는 나의 모습 기록하고 스스로 칭찬하기 등의 내용을 다룬다. 학교라는 친숙한 공간에서 다른 사람들과 함께 어울려 살아가기 위한 규칙을 알고 이를 지키는 태도가 필요함을 이해하는데 주안점을 둔다.","n":["일상생활 속에서 지켜야 할 질서와 규칙을 알고 실천하는 것은 나뿐만 아니라 타인의 안전과 행복을 위한 것이다. 모의 상황에서 학급 구성원과의 역할 놀이를 통해 구조화된 경험을 제공하고, 꾸준한 실천과 자기 평가를 통해 생활 속의 질서와 규칙을 내면화하여 안전하고 행복한 시민의 삶을 영위하기 위한 공감, 존중, 배려의 마음과 태도를 갖출 수 있는 기반을 마련한다. 이를 위해 학교 및 학급 차원의 행동지원과 연계할 수 있다."],"p":108,"b":3},{"c":"[4사회03-06]","k":"기본","sk":"","s":"사회","g":"초등학교 3~4학년","d":"시민의 삶","t":"우리나라를 상징하는 것들을 살펴보고 나라 사랑하는 마음을 기른다.","m":"이 성취기준은 민주사회의 구성원이 갖추어야 하는 기본적인 자질로 나라를 사랑하는 마음을 통해 공동체 의식과 시민성을 함양하기 위해 설정하였다. 우리나라의 상징(예: 우리나라의 이름, 태극기, 애국가, 무궁화) 확인하기, 우리나라 자랑거리(예: 한글, 한옥, 고유문화)의 아름다움을 나만의 방법으로 표현하기 등에 관한 내용을 다룬다. 우리나라의 다양한 유·무형 상징의 특징들을 살펴보고 표현하는 활동을 통해 자연스럽게 나라를 사랑하는 마음을 기른다.","n":["우리나라를 상징하는 것을 조사하는 여러 가지 방법(예: 인터넷, 도서, 잡지, 방송)과 다양한 보조공학 기기 및 테크놀로지(예: 가상현실(VR), 증강현실(AR))를 활용할 수 있도록 한다."],"p":108,"b":3},{"c":"[6사회01-01]","k":"기본","sk":"","s":"사회","g":"초등학교 5~6학년","d":"나의 삶","t":"나의 특징을 다양한 방법으로 표현하고 나를 소중히 여긴다.","m":"이 성취기준은 나의 여러 가지 모습과 특징을 이해하고 다양한 방법으로 표현하는 과정을 통해 자신을 소중히 여기며 긍정적 자아 개념을 형성하기 위해 설정하였다. 자신의 성격, 취미, 재능, 흥미, 선호하는 것(예: 음식, 연예인, 운동팀)을 확인하고 발표하는 등의 내용을 다룬다. 평상시 자신이 아끼고 좋아하는 물건이나 활동, 잘하는 일 등을 그림, 사진 등으로 표현하고 말할 수 있게 하며 가족이나 친구 등 나와 가까운 주변 사람들이 알고 있는 나의 모습을 다양한 방식으로 확인한다. 이를 통해 자연스럽게 자신을 소중히 여기게 된다.","n":["사람은 저마다 서로 다른 특징을 가지고 있으며 그것이 개성으로 존중될 수 있음을 알고 개개인의 특징은 반드시 남과 서로 비교 우위에 둘 수 없음을 확인하도록 한다. 또한 장애로 인한 부정적인 특성보다는 자신에 관한 긍정적인 점을 강조한다."],"p":111,"b":3},{"c":"[6사회01-02]","k":"기본","sk":"","s":"사회","g":"초등학교 5~6학년","d":"나의 삶","t":"일상생활에서 활동이나 물건을 선택하고 나의 선택을 중요하게 여기는 태도를 기른다.","m":"이 성취기준은 자연스러운 생활 장면에서 다양한 상황과 맥락의 선택 기회를 제공하고 자기 결정적 생활 태도를 자연스럽게 익히며 실천할 수 있도록 하여 자기주도적 삶을 위한 기반을 마련하기 위해 설정하였다. 의식주와 여가 등 다양한 일상생활 장면에서 활동이나 물건을 선택할 기회 조사하기, 좋아하거나 필요한 물건이나 활동 선택하기 등의 내용을 다룬다. 일상생활에서 가능한 많은 선택 기회를 제공하고 신뢰하는 사람의 도움을 받아 선택지에 대한 조언을 구하거나 자신의 선택에 따른 결과를 확인하고 책임감을 느끼도록 한다.","n":["학생마다 학교, 가정, 지역사회 등을 포함한 자연스러운 맥락을 활용하여 다양한 장면에서 스스로 선택할 기회를 제공하며, 자신의 선택에 따라 결과가 달라질 수 있다는것을 인식할 수 있도록 한다. 또한 이러한 경험이 학교 이외의 장소에서도 확장될 수 있도록가정과 연계하여 지도한다."],"p":111,"b":3},{"c":"[6사회02-01]","k":"기본","sk":"","s":"사회","g":"초등학교 5~6학년","d":"관계의 삶","t":"가족과 이웃들이 사이좋게 지내는 모습을 살펴보며 가족과 이웃을 소중히 여긴다.","m":"이 성취기준은 가족 또는 이웃들과 사이좋게 지내는 경험을 통해 자신을 포함한 가족과 이웃을 모두 소중히 여기는 마음을 가지기 위해 설정하였다. 소중한 우리 가족 발표하기, 가족과 함께 다양한 경험하기, 우리 동네 다양한 이웃 조사하기, 이웃이 서로 사이좋게 지내는 모습 관찰하기 등을 주요한 학습 내용으로 다룬다. 함께 사는 가족뿐만 아니라 방계가족이나 가족처럼 지내는 이웃, 가족과 같은 반려동물 등 다양한 상황과 맥락에서 함께 지내는 모습을 자주 접할 수 있게 하여 서로를 이해하고 친근감을 가질 수 있도록 하는데 주안점을 둔다.","n":["에서 학교, 가정, 지역사회에서 만나는 사람들 간에 때로는 갈등이나 다툼 등을 경험할 수 있음을 인식하고 이에 대한 대처와 해결하는 과정을 [6사회02-03], [6사회02-04]와 연계하여 지도한다."],"p":112,"b":3},{"c":"[6사회02-02]","k":"기본","sk":"","s":"사회","g":"초등학교 5~6학년","d":"관계의 삶","t":"친구와 사이좋게 지내며 친구와의 우정을 소중히 여긴다.","m":"이 성취기준은 친구와 우정을 나누기 위해 생활 속에서 할 수 있는 다양한 활동을 살펴보고 사람과의 관계를 경험하면서 우정을 소중히 여기는 태도를 기르기 위해 설정하였다. 다양한 곳에서 만나는 친구 조사하기, 친구에 따라 서로 다른 대화법 및 행동 양식 적용하기, 자신의 감정을 조절하고 친구 사이의 믿음을 쌓는 경험하기, 아름다운 우정에 관한 이야기 듣기 등의 내용을 다룬다. 친구처럼 지내는 다양한 사람들을 포함하여 다양한 장면에서 만나는 친구들에 대한 우정, 사랑, 믿음과 관련된 이야기를 듣고 친구와 사이좋게 지내기 위한 구체적인 방법을 익히도록 한다.","n":["에서 학교, 가정, 지역사회에서 만나는 사람들 간에 때로는 갈등이나 다툼 등을 경험할 수 있음을 인식하고 이에 대한 대처와 해결하는 과정을 [6사회02-03], [6사회02-04]와 연계하여 지도한다."],"p":112,"b":3},{"c":"[6사회02-03]","k":"기본","sk":"","s":"사회","g":"초등학교 5~6학년","d":"관계의 삶","t":"학교에서 만나는 사람들에게 예의 바른 행동을 한다.","m":"이 성취기준은 사회 공동체에서 타인을 존중하고 바람직한 인간관계를 맺기 위한 중요한 덕목으로서 예절을 알고 학교에서 만나는 다양한 사람들(예: 또래, 선생님, 학부모, 그 밖에 함께 하는 사람들)에게 예의 바른 행동을 하도록 하는 데 목적이 있다. 이를 위해 다양한 사람들의 성실한 모습 조사하기, 학교에서 서로 존중하는 태도 실천하기, 교실에서 서로 배려하는 모습 관찰하기 등의 내용을 다룬다. 되도록 다양한 유형의 사람들과 폭넓은 관계를 경험하되 특정 관계에 편향되지 않도록 한다.","n":[],"p":112,"b":3},{"c":"[6사회02-04]","k":"기본","sk":"","s":"사회","g":"초등학교 5~6학년","d":"관계의 삶","t":"이웃에서 만나는 사람들에게 예의 바른 행동을 한다.","m":"이 성취기준은 이웃 사람들이 서로 예의 바른 행동을 실천하고 교류하는 모습을 관찰하며 이를 생활 속에서 실천하여 타인과 사회적 관계를 형성하는 기초를 함양하기 위해 선정하였다. 이웃과 생활 속에서 지켜야 하는 행동 조사하기, 상황에 맞는 인사 실천하기, 상황에 따른 예의 바른 태도 관찰하기 등의 내용을 다룬다. 이웃의 소중함을 느낄 수 있는 다양한 사례를 중심으로 이웃을 대할 때 지켜야 하는 예절을 알고 실천할 수 있도록 한다.","n":[],"p":112,"b":3},{"c":"[6사회03-01]","k":"기본","sk":"","s":"사회","g":"초등학교 5~6학년","d":"시민의 삶","t":"우리 지역의 자연환경과 인문환경에 따라 사람들이 살아가는 모습을 살펴보며 우리 지역의 모습에 관심을 가진다.","m":"이 성취기준은 환경과 인간 생활과의 관계를 이해하기 위하여 자신이 속한 지역의 환경적 특성과 사람들이 살아가는 모습에 관심을 가지도록 하는 데 목적이 있다. 이를 위해 우리 지역의 위치 설명하기, 우리 지역의 자연환경과 인문환경 조사하기, 우리 지역의 자연환경과 인문환경을 이용하며 살아가는 모습 관찰하기 등의 내용을 다룬다. 필요에 따라 우리 지역의 범위를 확장하여 내가 속한 지역과 관계가 깊은 다른 지역의 자연 및 인문환경의 특성도 함께 관찰하도록 한다.","n":["우리 지역이 상황이나 필요에 따라 내가 속한 지역뿐만 아니라 다른 지역으로 유연하게 확장되거나 반대로 축소될 수 있음을 사전에 고려한다. 또한 지역의 특징을 이해하기 위해 우리 지역과 다른 지역을 비교하여 지역 간 차이점이나 상호 의존 관계를 파악할 수 있도록 한다. 다만 다양한 지역을 살펴보는 과정이 지역 간 우열, 다른 지역에 대한 편견을 갖지 않도록 한다."],"p":114,"b":3},{"c":"[6사회03-02]","k":"기본","sk":"","s":"사회","g":"초등학교 5~6학년","d":"시민의 삶","t":"우리 지역의 사람들이 다양한 경제활동에 참여하는 것을 살펴보며 우리 지역의 경제활동에관심을 가진다.","m":"이 성취기준은 가족 또는 이웃에서 지역의 경제생활로 범위를 확대하여 사람들이 속한 지리적 공간과 경제활동이 상호 의존적으로 관계되어 있음을 살펴볼 수 있도록 설정하였다. 다양한 경제활동 관찰하기, 우리 지역 특산품 조사하기, 지역사회 상점에서 물건 사기, 지역 특성에 따른 직업 조사하기, 우리 지역의 경제생활 경험하기, 화폐 활용하기 등의 내용을 다룬다. 내가 사는 지역의 다양한 삶의 공간에서 이루어지는 실제적인 사례나 경험을 제공하여 지역의 경제활동 모습에 관심을 가지도록 한다.","n":[],"p":114,"b":3},{"c":"[6사회03-03]","k":"기본","sk":"","s":"사회","g":"초등학교 5~6학년","d":"시민의 삶","t":"우리 지역의 문화 유적을 살펴보며 옛사람들의 생활 모습에 관심을 가진다.","m":"이 성취기준은 내가 사는 지역의 문화 유적을 중심으로 우리 생활 속의 전통문화를 살펴보고 역사에 대한 개념과 문화적 소양을 갖추는 데 중점을 둔다. 옛사람들의 의식주 모습 살펴보기, 신분에 따른 생활 문화 체험하기, 계절에 따른 명절 조사하기 등의 내용을 중심으로 옛사람들의 생활 문화를 오늘날 우리들의 모습과 비교하며 역사·문화적 소양을 기르도록 한다.","n":["학생들이 지역의 문화 유적지나 박물관 등을 직접 방문하거나 디지털 매체나 테크놀로지를 활용하여 간접 체험하도록 한다. 문화 유적지뿐만 아니라 지금까지 남아있는 전통적 생활양식이나 유물을 포함하고, 특정 시대적 배경을 강조하기보다는 현재 생활 속에서 경험하는 것들을 옛날과 비교해보는 활동을 중심으로 한다."],"p":114,"b":3},{"c":"[6사회03-04]","k":"기본","sk":"","s":"사회","g":"초등학교 5~6학년","d":"시민의 삶","t":"가족, 친구와 여러 지역의 문화 활동에 관심을 가지고 참여한다.","m":"이 성취기준은 가족을 중심으로 역사와 문화에 관한 관심과 흥미를 갖고 우리 지역의 다양한 문화 활동을 경험하는 것에 목적을 둔다. 이를 위해 우리 문화의 소중함을 알 수 있는 사례 탐색하기, 우리 지역의 대표적인 문화유산 관찰하기, 박물관 관람하기, 역사 문화 현장 탐방하기 등의 내용을 다룬다. 지역 문화 유적지와 문화유산을 포함하여 다양한 전통 및 현대 문화 시설과 프로그램을 직간접적으로 체험하여 내가 사는 지역의 문화를 시작으로 우리 문화에 대한 자긍심과 지역 문화 활동 참여의 즐거움을 느끼는 데 중점을 둔다.","n":[],"p":114,"b":3},{"c":"[6사회03-05]","k":"기본","sk":"","s":"사회","g":"초등학교 5~6학년","d":"시민의 삶","t":"사람들이 지키는 생활 규범에 관심을 갖고 나의 일상 속에서 지킨다.","m":"이 성취기준은 사람들이 함께 살아가는 데 필요한 생활 속 규범을 알고 지키는 태도를 함양하는 데 목적이 있다. 생활 속 관습 조사하기, 공중도덕 실천하기, 생활 속의 법(예: 교통안전, 학교폭력 대처) 지키기 등의 내용을 다룬다. 다양한 사례를 중심으로 사람들 사이의 다툼이나 갈등을 예방하고 공정하게 해결할 수 있는 사회 가치 규범이 있다는 것을 탐색하고 법의 필요성에 대한 인식을 갖추는 데 중점을 둔다.","n":[],"p":114,"b":3},{"c":"[6사회03-06]","k":"기본","sk":"","s":"사회","g":"초등학교 5~6학년","d":"시민의 삶","t":"독도의 여러 모습을 살펴보고 우리나라 영토를 아끼는 마음을 가진다.","m":"이 성취기준은 우리나라 독도의 아름다운 모습을 살펴보고 나라 사랑의 마음을 기초로 우리 영토의 소중함을 인식하기 위해 설정하였다. 이를 위해 독도의 다양한 명칭 발표하기, 독도의 위치 관찰하기, 독도의 동·식물 정보 수집하기, 독도의 해양자원 조사하기 등의 내용을 중심으로 살펴본다. 독도를 중심으로 영토의 개념을 형성하고 영토 보존의 중요성을 이해하도록 한다.","n":["독도의 상징성과 중요성을 바탕으로 우리나라를 아끼는 태도를 지니도록 한다. 독도와 관련된 다양한 교수·학습 자료 및 매체를 활용하여 사람들이 독도와 우리나라를 사랑하는 모습을 보며 수업 활동으로 이어지게 한다."],"p":114,"b":3},{"c":"[9사회01-01]","k":"기본","sk":"","s":"사회","g":"중학교 1~3학년","d":"나의 삶","t":"나의 특성을 파악하고 자신을 존중하는 태도를 기른다.","m":"이 성취기준은 자신을 객관적으로 파악하고 이해함으로써 올바른 정체성을 확립하여 자아 존중을 실천하기 위해 설정하였다. 나의 성격, 강점과 약점 살펴보기, 나의 개성과 취향 발표하기, 다른 사람이 생각하는 나의 모습과 내가 생각하는 나의 모습 비교하기, 나를 존중하는 방법 실천하기 등의 내용을 다룬다. 자신의 특성을 분석하여 자신을 바르게 인식하고, 긍정적 자아 개념과 정체성을 형성하도록 한다.","n":[],"p":116,"b":3},{"c":"[9사회01-02]","k":"기본","sk":"","s":"사회","g":"중학교 1~3학년","d":"나의 삶","t":"일상에서 여러 가지를 선택하고 결정하여 자기 결정력을 기른다.","m":"이 성취기준은 자신과 관련 있는 여러 가지 것들에 대하여 자율적으로 판단하고 결정하는 자기 결정 태도와 능력을 기르는 데 목적이 있다. 스스로 선택하고 결정하는 것의 중요성 알아보기, 여러 가지를 비교하고 선택하는 이유 확인하기, 다양한 상황에서 의사 표현하기, 가정, 학교(예: 개별화교육지원팀 협의회) 등의 일상에서 나의 의견에 따라 결정하기 등의 내용을 다룬다. 다른 사람에게 의존하지 않고 스스로 결정하려는 태도를 보이며 상황에 알맞은 판단 능력을 길러 자신의 선택에 대한 자신감을 높일 수 있는 경험을 제공한다.","n":["가정과 연계하고, 지역사회 모의수업을 통한 반복 학습과 더불어 지역사회 참조 수업을 통해 더 자연스러운 상황에서 학습하도록 하며 지역사회 중심 교수를 활용하여 가정, 학교, 지역사회 등 실제적 환경에서의 선택과 결정에 대한 일반화가 이루어지도록 한다. 활동이나 물건의 선택과 결정에서 나아가 자기 생각과 의견을 포함한 다양한 수준의 의사 결정을 경험하도록 하며 주변 사람들의 조언을 구해 결정하고 의사 표현 방식 등의 도움을 받는 ‘지원적 의사 결정’을 함께 지도한다. 또한 자신의 자율적인 선택에 따라 결정한 것에는 책임도 함께 따른다는 것을 구체적인 사례 및 역할 놀이 등으로 경험할 수 있도록 하고 의사 표현을 위하여 관련 교과(예: 국어과)와 연계한다."],"p":116,"b":3},{"c":"[9사회02-01]","k":"기본","sk":"","s":"사회","g":"중학교 1~3학년","d":"관계의 삶","t":"일상에서 자신에게 주어진 역할을 성실한 태도로 실천한다.","m":"이 성취기준은 가정과 학교 등 자신이 속한 사회의 한 구성원으로서 자신이 맡은 역할을 알고 성실한 태도로 실천하는 능력을 기르기 위해 설정하였다. 가족 구성원과 학교 구성원의 역할 목록 만들기, 역할에 책임을 다하는 행동과 그렇지 않은 행동 구분하기, 가정과 학교, 지역사회에서 나의 역할 실천하기 등의 내용을 다룬다. 역할에 따른 성실한 태도가 어떤 것인지 알고 이를 일상에서 실천하도록 하는 데 중점을 둔다.","n":["인권교육의 측면에서 가족 구성원의 역할, 학교 구성원의 역할 등 일상에서의 성역할에 대한 고정 관념에 유의하고 상황이나 여건에 따라 남성과 여성의 역할이 변화될 수 있음을 이해하여 생활 속에서 실천하도록 한다. 장애 정도가 심한 학생의 경우 일상에서 의존적 역할에 한정되지 않도록 한다. [9사회01-01]과 연계하여 긍정적 자아 개념 및 자기 효능감으로 이어지도록 한다."],"p":117,"b":3},{"c":"[9사회02-02]","k":"기본","sk":"","s":"사회","g":"중학교 1~3학년","d":"관계의 삶","t":"주변 사람을 소중히 여기는 마음을 가지고 존중하며 친절하게 대한다.","m":"이 성취기준은 생활 속에서 주변 사람을 친절하게 대하고 존중하는 태도를 보이며 이를 지속해서 실천하려는 의지를 기르기 위해 설정하였다. 대상과 상황에 알맞은 친절한 태도 확인하기, 친절한 말씨와 행동 실천하기, 사회적으로 다른 사람의 권리를 존중한 사람의 사례 조사하기, 가정과 학교, 그리고 지역사회에서 만나는 사람을 존중하고 배려하기 등의 내용을 다룬다. 다른 사람도 나와 동등하게 소중한 존재임을 알고, 일상에서 올바른 마음가짐으로 친절과 양보를 실천하도록 하는 데 중점을 둔다.","n":["일상에서 쉽게 접할 수 있는 사례를 통해 다른 사람이 나에게 친절하게 대했을 때 나의 감정을 살펴보며 다른 사람에게 친절하게 대하는 행동의 중요성을 익힌다. 다른 사람에 대한 존중을 반려동물 및 반려식물에 대한 생명 존중으로 확장하여 사람뿐만 아니라 동물과 식물 등 모든 생명에 대한 존중으로 일반화를 유도한다."],"p":117,"b":3},{"c":"[9사회02-03]","k":"기본","sk":"","s":"사회","g":"중학교 1~3학년","d":"관계의 삶","t":"주변 사람들의 사회적 상호 작용 모습을 조사하고 사회적 관계를 형성하려는 마음을 가진다.","m":"이 성취기준은 주변 사람들의 다양한 사회적 상호 작용 모습을 살펴보고 사회적 관계의 중요성을 바탕으로 사회적 관계 형성에 관심을 두도록 하는 데 목적이 있다. 사례를 통해 가족의 소중함 살펴보기, 여러 사회적 장면(예: 가정, 학교, 지역사회)에서 사람들이 상호 작용하는 모습 조사하기, 사회적 상호 작용 상황에 알맞은 말과 행동 익히기, 다양한 도구(예: 스마트폰, 컴퓨터)를 사용하여 사회적 상호 작용하기 등의 내용을 다룬다. 다양한 사회적 관계의 필요성을 이해하고 사회적 관계 형성에 대한 의지를 갖도록 하는 데 주안점을 둔다.","n":["주변 사람들의 모습을 통해 다양한 유형의 사회적 관계가 있음을 인식하게 하고 학교 이외의 다양한 공간에서 관계를 형성할 때 유의해야 할 사항을 확인하도록 한다. 또한 온오프라인 등 다양한 방법을 통해 사회적 관계를 형성할 때 유의해야 할 사항을 가정과 연계하여 지도한다."],"p":117,"b":3},{"c":"[9사회02-04]","k":"기본","sk":"","s":"사회","g":"중학교 1~3학년","d":"관계의 삶","t":"사회적 상황에서 타인의 행동과 감정을 분석하고 공감한다
