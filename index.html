하고 술식을 익힌다.","m":"이 성취기준은 마사지 응용 수기별 술식의 특징을 비교하고 다양한 마사지 응용 수기의 시술 부위 및 대상을 구분하여 수기요법 실습 현장에서 적용할 수 있도록 설정하였다. 스포츠 마사지, 발 마사지, 경락⋅미용 마사지, 림프 마사지, 타이 마사지, 스웨디시 마사지 등의 술식 특징 비교하기와 각종 수기의 실제를 다룬다. 전신의 술식 상황에서 마사지의 응용 수기를 능동적으로 임상에 적용하고 자발적으로 수기의 중요성을 인식하며 비판적으로 수용할 수 있는 기능과 태도 형성에 중점을 둔다.","n":[],"p":728,"b":2},{"c":"[12안마04-05]","k":"선택","sk":"전문 교과(이료)","s":"안마·마사지·지압","g":"고등학교 1~3학년","d":"안마⋅마사지⋅지압의 응용 수기","t":"지압 응용 수기의 종류와 개념 및 원리를 파악한다.","m":"이 성취기준은 척주와 골반 등 다양한 부위별 질환의 통증 개선을 위한 지압 응용 수기의 수기별 특징을 다각적으로 파악할 수 있도록 설정하였다. 지압 응용 수기의 종류와 교정요법, 경락 지압 및 활법의 개념과 원리 내용을 다룬다. 각종 지압의 응용 수기 종류에 따른 임상 적용 사례를 익힘으로써 효과적인 술식이 이루어지도록 하는 데 중점을 둔다.","n":[],"p":728,"b":2},{"c":"[12안마04-06]","k":"선택","sk":"전문 교과(이료)","s":"안마·마사지·지압","g":"고등학교 1~3학년","d":"안마⋅마사지⋅지압의 응용 수기","t":"지압의 응용 수기별 특징을 비교하고 술식을 익힌다.","m":"이 성취기준은 지압 응용 수기별 술식의 특징을 비교하고 다양한 지압 응용 수기의 시술 부위 및 대상을 구분하여 수기요법 실습 현장에서 적용할 수 있도록 설정하였다. 교정요법, 경락 지압, 활법의 술식 비교하기와 각 응용 수기의 실제를 다룬다. 전신의 술식 상황에서 지압의 응용 수기를 능동적으로 임상에 적용하고 자발적으로 수기의 중요성을 인식하며 습관화하도록 기능과 태도에 중점을 둔다.","n":[],"p":728,"b":2},{"c":"[12안마04-07]","k":"선택","sk":"전문 교과(이료)","s":"안마·마사지·지압","g":"고등학교 1~3학년","d":"안마⋅마사지⋅지압의 응용 수기","t":"도구를 이용한 응용 수기의 종류와 개념 및 원리를 파악한다.","m":"이 성취기준은 도구를 이용한 응용 수기의 융합 및 적용이 필요함을 이해하고 도구를 이용한 응용 수기별 특징을 다각적으로 파악할 수 있도록 설정하였다. 도구를 이용한 응용 수기의 종류와 괄사 요법, 스톤테라피, 도구를 이용한 근육 이완 요법 등의 개념과 원리 내용을 다룬다. 각종 도구를 이용한 응용 수기별 임상 적용 사례를 익힘으로써 효과적인 술식이 이루어지도록 하는 데 중점을 둔다.","n":[],"p":729,"b":2},{"c":"[12안마04-08]","k":"선택","sk":"전문 교과(이료)","s":"안마·마사지·지압","g":"고등학교 1~3학년","d":"안마⋅마사지⋅지압의 응용 수기","t":"도구를 이용한 응용 수기의 술식 특징을 비교하고 각 수기를 익힌다.","m":"이 성취기준은 도구를 이용한 응용 수기별 술식의 특징을 비교하고 다양한 도구를 이용한 응용 수기의 시술 부위 및 대상을 구분하여 수기요법 실습 현장에서 적용할 수 있도록 설정하였다. 전신의 술식 상황에서 도구를 이용한 응용 수기를 능동적으로 임상에 적용하여 자발적으로 수기의 중요성을 인식하고 습관화하며 비판적으로 수용할 수 있는 기능과 태도에 중점을 둔다.","n":[],"p":729,"b":2},{"c":"[12전치01-01]","k":"선택","sk":"전문 교과(이료)","s":"전기치료","g":"고등학교 1~3학년","d":"전기치료의 기초","t":"전기치료의 정의를 알고 활용 분야를 파악한다.","m":"이 성취기준은 전기치료의 기본 개념을 이해하기 위한 전기치료의 정의와 활용 분야를 학습할 수 있도록 설정하였다. 전기치료의 정의, 전기치료의 활용 분야 등의 내용을 다룬다. 전기치료의 기본 개념을 알고 활용 분야를 학습하여 전기치료가 수기 보조술로 활용될 때 치료 효과를 높일 수 있음을 이해하는 데 중점을 둔다.","n":[],"p":737,"b":2},{"c":"[12전치01-02]","k":"선택","sk":"전문 교과(이료)","s":"전기치료","g":"고등학교 1~3학년","d":"전기치료의 기초","t":"전기치료의 역사를 알고 전기치료 발전에 공헌한 인물들의 업적을 탐색한다.","m":"이 성취기준은 전기치료의 발전 과정을 파악하기 위한 전기치료의 역사를 이해할 수 있도록 설정하였다. 전기치료의 역사와 전기치료 발전에 공헌한 주요 인물들의 업적 등의 내용을 다룬다. 전기치료의 발전 과정 탐색을 통해 이료술의 적응증에 적합한 치료기를 선택하여 응용할 수 있는 능력을 기르는 데 중점을 둔다.","n":[],"p":737,"b":2},{"c":"[12전치01-03]","k":"선택","sk":"전문 교과(이료)","s":"전기치료","g":"고등학교 1~3학년","d":"전기치료의 기초","t":"물질의 전자 이론을 탐구하고 전류 흐름의 특성을 이해한다.","m":"이 성취기준은 전기의 특성을 이해하기 위한 물질의 전자 이론, 전류의 효과를 학습할 수 있도록 설정하였다. 전기 물리 현상에 관한 개념, 전기치료의 기반이 되는 전기 물리 현상과 전류의 효과 등의 내용을 다룬다. 전기 물리의 기본 개념을 이해하여 전기치료 활용을 위한 전기 물리 현상 이해의 중요성을 인식하는 데 중점을 둔다.","n":[],"p":738,"b":2},{"c":"[12전치01-04]","k":"선택","sk":"전문 교과(이료)","s":"전기치료","g":"고등학교 1~3학년","d":"전기치료의 기초","t":"전기 인자의 단위와 기호를 알고 전기치료에 적용하는 기술을 익힌다.","m":"이 성취기준은 전류 흐름과 관련 있는 기본 지식을 익히기 위한 전기의 인자와 단위를 파악할 수 있도록 설정하였다. 전하, 전류, 저항, 전력 등의 내용을 다룬다. 전기치료에서 활용되는 전기 인자와 전기 단위 및 기호를 학습하고 치료기 자극 조건 설정에 응용하는 능력을 기르는 데 중점을 둔다.","n":[],"p":738,"b":2},{"c":"[12전치01-05]","k":"선택","sk":"전문 교과(이료)","s":"전기치료","g":"고등학교 1~3학년","d":"전기치료의 기초","t":"전류 흐름과 관련 있는 법칙을 알고 전기치료에 적용하는 기술을 익힌다.","m":"이 성취기준은 전기치료와 관련 있는 전류의 법칙을 알고 치료에 적용할 수 있도록 설정하였다. 옴의 법칙, 줄의 법칙 등의 내용을 다룬다. 전류의 법칙을 이해하고 전기치료 중 자극 조건을 설정할 때 응용하는 방법을 학습하는 데 중점을 둔다.","n":[],"p":738,"b":2},{"c":"[12전치01-06]","k":"선택","sk":"전문 교과(이료)","s":"전기치료","g":"고등학교 1~3학년","d":"전기치료의 기초","t":"흥분 조직의 세포막 전위를 익히고 흥분 전달 과정을 이해한다.","m":"이 성취기준은 흥분성 조직인 신경과 근육의 전류 자극 특성을 이해하고 전류 자극 조건 적용에 응용할 수 있도록 설정하였다. 흥분성 조직의 세포막전위, 흥분의 전도와 시냅스 전달 과정 등의 내용을 다룬다. 전기 생리 현상에 관한 개념을 이해하고, 흥분 전달 과정과 전류가 인체 각 조직에 미치는 영향과 전류의 특성을 익혀 전기치료 활용을 위한 전기 생리의 현상의 중요성을 인식하는 데 주안점을 둔다.","n":[],"p":738,"b":2},{"c":"[12전치01-07]","k":"선택","sk":"전문 교과(이료)","s":"전기치료","g":"고등학교 1~3학년","d":"전기치료의 기초","t":"근육 수축 기전을 알고 근육 수축을 위한 흥분 전달 과정을 탐색한다.","m":"이 성취기준은 전류 자극에 의한 근육의 생리적 반응을 파악할 수 있도록 설정하였다. 운동신경의 흥분 전달 과정, 흥분-수축 연결, 근수축기전 등의 내용을 다룬다. 근육의 수축 기전을 익히고, 근육을 수축시키기 위한 흥분의 전달 과정을 학습하는데 주안점을 둔다.","n":[],"p":738,"b":2},{"c":"[12전치01-08]","k":"선택","sk":"전문 교과(이료)","s":"전기치료","g":"고등학교 1~3학년","d":"전기치료의 기초","t":"전류 자극의 3대 조건을 익히고 흥분 조직의 전기 자극 특성을 파악한다.","m":"이 성취기준은 전류로 신경과 근육을 자극할 때 필요한 전류 자극 조건을 파악할 수 있도록 설정하였다. 전류 자극의 3대 조건, 전류 자극에 대한 신경과 근육의 순응 현상 등의 내용을 다룬다. 인체의 흥분성 조직인 신경과 근육을 자극하기 위한 전류 조건을 알고, 효과적으로 흥분성 조직을 자극할 수 있는 기술을 익히는 데 주안점을 둔다.","n":[],"p":738,"b":2},{"c":"[12전치01-09]","k":"선택","sk":"전문 교과(이료)","s":"전기치료","g":"고등학교 1~3학년","d":"전기치료의 기초","t":"의용전류의 정의를 알고 분류 체계를 탐색한다.","m":"이 성취기준은 인체 전기 자극의 기본 전류인 의용전류의 개념과 분류 체계를 이해할 수 있도록 설정하였다. 의용전류의 정의, 의용전류의 분류 체계 등의 내용을 다룬다. 의용전류의 정의와 의용전류의 분류 체계를 이해하고, 각각의 전류가 인체에 미치는 영향을 익히도록 하는 데 중점을 둔다.","n":[],"p":739,"b":2},{"c":"[12전치01-10]","k":"선택","sk":"전문 교과(이료)","s":"전기치료","g":"고등학교 1~3학년","d":"전기치료의 기초","t":"의용전류의 종류별 특성을 알고 치료 효과를 익힌다.","m":"이 성취기준은 의용전류별 특성과 치료 효과를 이해하여 전기치료 중 자극 조건 설정에 활용할 수 있도록 설정하였다. 의용전류의 종류와 특성, 의용전류의 활용 분야 등의 내용을 다룬다. 의용전류가 활용되는 전기치료 분야를 알고 의용전류의 종류별 치료 효과를 학습하고 의용전류의 안전한 사용 의지를 높이는 데 주안점을 둔다.","n":[],"p":739,"b":2},{"c":"[12전치01-11]","k":"선택","sk":"전문 교과(이료)","s":"전기치료","g":"고등학교 1~3학년","d":"전기치료의 기초","t":"전기치료기의 기본 장치의 종류를 알고 사용 방법을 익힌다.","m":"이 성취기준은 전기치료기의 표준적인 외부 장치의 기능과 특성 및 조절 방법을 익히고 전기치료에 주로 활용되는 전극의 형태와 특징을 이해할 수 있도록 설정하였다. 전원 공급 회로, 발진 회로, 출력 증폭 회로, 외부 조절 장치, 전극 등의 내용을 다룬다. 기본 장치의 이름과 특징, 전기치료 중에 주로 활용되는 전극의 형태와 배치 방법을 익히는 데 주안점을 둔다.","n":[],"p":740,"b":2},{"c":"[12전치01-12]","k":"선택","sk":"전문 교과(이료)","s":"전기치료","g":"고등학교 1~3학년","d":"전기치료의 기초","t":"전기치료 중에 발생할 수 있는 위험 사항을 알고 주의 사항을 파악한다.","m":"이 성취기준은 전기치료의 위험에 대한 대처 능력을 기를 수 있도록 설정하였다. 전기치료의 위험, 전기치료기 사용상 주의 사항, 전기 쇼크 및 화상의 예방법 등의 내용을 다룬다. 전기치료 중에 발생할 수 있는 위험 요소와 전기치료의 주의 사항을 알고 각종 사고를 예방하기 위한 조치 방법을 학습하는 데 주안점을 둔다.","n":[],"p":740,"b":2},{"c":"[12전치02-01]","k":"선택","sk":"전문 교과(이료)","s":"전기치료","g":"고등학교 1~3학년","d":"전기자극치료","t":"전기자극치료의 정의를 알고 저주파와 중주파를 비교한다.","m":"이 성취기준은 전기자극치료를 이해하기 위한 정의, 특성, 종류 등을 학습할 수 있도록 설정하였다. 전기자극치료의 정의, 전기자극치료의 치료에 관한 개념을 이해하여 광선 및 열에너지를 사용하기 위한 이론적 지식을 갖추도록 하고 광선치료 활용의 중요성을 인식하는 데 중점을 둔다.","n":[],"p":749,"b":2},{"c":"[12전치04-02]","k":"선택","sk":"전문 교과(이료)","s":"전기치료","g":"고등학교 1~3학년","d":"광선치료와 온열치료","t":"열의 생리적⋅물리적 효과를 알고 치료 효과를 익힌다.","m":"이 성취기준은 열의 개념과 열이 인체에 미치는 영향과 치료 효과를 학습할 수 있도록 설정하였다. 열의 개요 및 효과, 열의 물리적 효과, 열의 생리적 효과 등의 내용을 다룬다. 열의 특성 및 치료적 효과를 이해하여 질환에 따른 광선 및 온열 도구를 사용하는 데 중점을 둔다.","n":[],"p":749,"b":2},{"c":"[12전치04-03]","k":"선택","sk":"전문 교과(이료)","s":"전기치료","g":"고등학교 1~3학년","d":"광선치료와 온열치료","t":"광선치료 종류별(적외선, 자외선, 레이저) 정의와 분류 방법을 알고 치료 효과를 익힌다.","m":"이 성취기준은 적외선, 자외선, 레이저를 인체에 적용하기 위한 치료의 기본적인 내용을 효과적으로 파악할 수 있도록 설정하였다. 광선치료(적외선, 자외선, 레이저)의 정의, 분류, 치료 효과 등의 내용을 다룬다. 광선치료 종류별 개념과 특성을 이해하는 데 중점을 둔다.","n":[],"p":749,"b":2},{"c":"[12전치04-04]","k":"선택","sk":"전문 교과(이료)","s":"전기치료","g":"고등학교 1~3학년","d":"광선치료와 온열치료","t":"광선치료 종류별(적외선, 자외선, 레이저) 치료 기구의 종류를 알고 적용 기술을 익힌다.","m":"이 성취기준은 적외선, 자외선, 레이저 치료가 인체에 미치는 영향을 학습하고, 광선치료(적외선, 자외선, 레이저)의 적용 기술을 익힐 수 있도록 설정하였다. 광선치료의 기구와 광선치료의 적용 기술 등의 내용을 다룬다. 질환에 따른 치료기 모드를 선택하여 사용할 수 있도록 하고 치료기를 잘 다룰 수 있도록 적용 기술을 익히는 데 주안점을 둔다.","n":[],"p":749,"b":2},{"c":"[12전치04-05]","k":"선택","sk":"전문 교과(이료)","s":"전기치료","g":"고등학교 1~3학년","d":"광선치료와 온열치료","t":"광선치료 종류별(적외선, 자외선, 레이저) 적응증과 금기증을 알고 주의 사항을 파악한다.","m":"이 성취기준은 적외선, 자외선, 레이저 치료의 적응증과 금기증 그리고 치료 중 주의 사항을 익힐 수 있도록 설정하였다. 광선치료(적외선, 자외선, 레이저)의 적응증과 금기증, 광선치료의 주의 사항 등의 내용을 다룬다. 광선치료 적용 중 치료기로부터 발생한 열이 인체에 미치는 영향을 알고, 치료 시 예기치 못한 위험성에 대처하는 능력을 기르며, 안전한 치료를 위한 책임 의식을 높이는 데 주안점을 둔다.","n":[],"p":749,"b":2},{"c":"[12전치04-06]","k":"선택","sk":"전문 교과(이료)","s":"전기치료","g":"고등학교 1~3학년","d":"광선치료와 온열치료","t":"온열치료의 정의를 알고 생리적 작용과 치료 효과를 탐색한다.","m":"이 성취기준은 인체의 전신 또는 국소 부위에 온열을 적용하여 치료 효과를얻는 기술을 익힐 수 있도록 설정하였다. 온열치료의 정의, 특성, 생리적 작용, 치료 효과 등의 내용을 다룬다. 온열치료 및 온열자극의 생리적 작용에 관한 개념을 이해하여 온열치료를 사용하기 위한 이론적 지식을 갖추도록 하는 데 중점을 둔다.","n":[],"p":750,"b":2},{"c":"[12전치04-07]","k":"선택","sk":"전문 교과(이료)","s":"전기치료","g":"고등학교 1~3학년","d":"광선치료와 온열치료","t":"온열치료의 종류를 알고 적용 기술을 익힌다.","m":"이 성취기준은 온열치료 종류별 치료기의 적용 기술을 익힐 수 있도록 설정하였다. 온열치료가 인체에 미치는 영향을 학습하고 이료 시술 중 주로 활용되는 온습포, 습포, 고온습포, 파라핀욕 등의 적용 기술과 관련된 내용을 다룬다. 온열치료가 인체에 미치는 생리적 특성을 이해하여 질환에 따라 적합한 온열을 적용할 수 있도록 하는 데 중점을둔다.","n":[],"p":750,"b":2},{"c":"[12전치04-08]","k":"선택","sk":"전문 교과(이료)","s":"전기치료","g":"고등학교 1~3학년","d":"광선치료와 온열치료","t":"온열치료의 적응증과 금기증을 알고 주의 사항을 파악한다.","m":"이 성취기준은 온열치료의 적응증과 금기증, 치료 중 주의 사항을 익힐 수 있도록 설정하였다. 온열치료의 적응증과 금기증, 온열치료의 주의 사항 등의 내용을 다룬다. 온열자극이 인체 조직에 미치는 영향을 알고, 온열 적용 중 적절한 치료 온도를 설정하는 방법과 더불어 적절한 치료 자세 및 치료 위치를 알고 치료 중 예기치 못한 위험성에 대처하는 전문성을 기르도록 하는 데 중점을 둔다.","n":[],"p":750,"b":2},{"c":"[12한방01-01]","k":"선택","sk":"전문 교과(이료)","s":"한방","g":"고등학교 1~3학년","d":"한방의 기초","t":"한방의 정의를 이해하고 한방의 성립 및 발전 과정을 탐구한다.","m":"이 성취기준은 한방의 정의를 이해하고 발전 과정을 탐구하여 서양 의학과 구분되는 한방의 치료법과 특성을 파악할 수 있도록 설정하였다. 한방의 정의와 기원, 한방의 성립과 발전 과정 탐구하기, 한방과 서양 의학 발전 과정 비교하기 등의 내용을 다룬다. 한방의 정의와 기원을 이해하고 한방의 역사와 변천 과정을 탐구하여 이료 분야에서 중요하게 활용되는 한방의 특성을 파악하는 데 중점을 둔다.","n":[],"p":761,"b":2},{"c":"[12한방01-02]","k":"선택","sk":"전문 교과(이료)","s":"한방","g":"고등학교 1~3학년","d":"한방의 기초","t":"한방적 세계관과 인체관을 수용하고 한방의 특성을 이료술에 활용한다.","m":"이 성취기준은 한방적 세계관과 인체관을 바탕으로 질병을 변증하고 치료법을 탐구하여 이료 분야에 활용할 수 있도록 설정하였다. 황제내경 및 동의보감, 질병 변증에 의한 치료법 탐구하기, 한방적 세계관과 인체관 수용 등의 내용을 다룬다. 고전 문헌을 이해하고, 통일된 유기체인 인체와 자연과의 조화와 균형을 중시하는 한방적 세계관과 인체관을 수용하여 음양, 표리, 허실, 한열 등의 강약에 따라 건강이나 질병 등을 인식하는 한방적 원리를 적용한 질병 변증 및 치료법을 이료술에 활용하는 능력을 기르는 데 중점을 둔다.","n":[],"p":761,"b":2},{"c":"[12한방01-03]","k":"선택","sk":"전문 교과(이료)","s":"한방","g":"고등학교 1~3학년","d":"한방의 기초","t":"음양오행의 개념을 이해하고 특징을 탐구한다.","m":"이 성취기준은 자연계의 기본 구성 물질인 음양오행의 개념을 이해하고, 인체의 생리적 기능과 병리 현상이 자연의 변화와 법칙에 상응하는 음양오행의 특징을 탐구할 수 있도록 설정하였다. 자연계에서 사물과 현상의 상반되는 속성인 음양과 인간의 생존에 필수인 목⋅화⋅토⋅금⋅수(木⋅火⋅土⋅金⋅水)의 물질로 상생과 상극 원리에 의해 인체에 영향을 주는 오행을 이해하고, 임상과 관련된 음양오행의 특징을 탐구하여 한방적 원리를 파악하는 데 중점을 둔다.","n":[],"p":762,"b":2},{"c":"[12한방01-04]","k":"선택","sk":"전문 교과(이료)","s":"한방","g":"고등학교 1~3학년","d":"한방의 기초","t":"자연과 조화를 이루는 자세를 갖고 음양오행의 원리를 이료술에 활용한다.","m":"이 성취기준은 음양오행의 원리를 통해 인체의 생리적 기능과 병리 현상을 파악하고, 자연과의 조화를 중시하는 한방적 원리를 이료 분야에 적용하는 능력을 기를 수 있도록 설정하였다. 음양오행의 원리 이료술에 활용하기, 자연과 인간의 조화, 한방적 원리를 적용한 건강한 삶의 추구 등의 내용을 다룬다. 질병을 예방하고 건강한 삶을 추구하는 이료인이 되기 위해 질병을 한방적 관점에서 이해하고 자연과 인간의 조화를 추구하는 자세를 갖추며, 음양오행의 원리와 상호 작용의 특성을 파악하여 이료술에 활용하는 능력을 기르는 데 중점을 둔다.","n":[],"p":762,"b":2},{"c":"[12한방01-05]","k":"선택","sk":"전문 교과(이료)","s":"한방","g":"고등학교 1~3학년","d":"한방의 기초","t":"기⋅혈⋅진액의 개념을 이해하고 질병에 미치는 영향을 파악한다.","m":"이 성취기준은 기⋅혈⋅진액이 인체를 구성하고 생명에 관여하는 기본 물질임을 이해하고, 기⋅혈⋅진액의 상호 작용 및 생리적 기능과 병리 현상 등을 탐구하여 질병에 미치는 영향을 파악할 수 있도록 설정하였다. 기⋅혈⋅진액의 개념 및 종류, 정⋅기⋅신의 개념, 기⋅혈⋅진액의 상호관계 탐구하기, 기⋅혈⋅진액이 질병 예방과 치료에 미치는 영향 파악하기 등의 내용을 다룬다. 기⋅혈⋅진액의 개념을 이해하고 생리적 기능 및 병리 현상을 탐구하여 이료 분야에서 질병 예방과 치료에 적용할 수 있는 기⋅혈⋅진액의 원리를 파악하는 데 중점을 둔다.","n":[],"p":763,"b":2},{"c":"[12한방01-06]","k":"선택","sk":"전문 교과(이료)","s":"한방","g":"고등학교 1~3학년","d":"한방의 기초","t":"기⋅혈⋅진액의 작용 원리를 이료술에 활용하고 질병 예방 및 건강한 삶을 실천한다.","m":"이 성취기준은 인체가 통일된 유기체임을 이해하고, 질병에 영향을 미치는 기⋅혈⋅진액의 작용 원리를 파악하여 이료술에 활용하는 능력을 기르도록 설정하였다. 기⋅혈⋅진액의 작용 원리 이료술에 활용하기, 질병 예방 및 건강한 삶 실천 등의 내용을 다룬다. 정과 기는 협력하여 인체의 기본적인 물질을 이루고 있으며, 기와 신의 상호 작용은 생리의 가장 복잡한 기능을 담당함을 이해하고, 자연과의 조화 및 질병 예방을 중시하는 한방적 인체관을 바탕으로 기⋅혈⋅진액의 원리를 이료술에 활용하여 건강한 삶을 실천하는 능력을 기르는 데 중점을 둔다.","n":[],"p":763,"b":2},{"c":"[12한방02-01]","k":"선택","sk":"전문 교과(이료)","s":"한방","g":"고등학교 1~3학년","d":"장상","t":"오장육부의 개념 및 형태를 이해하고 장부의 기능과 상호관계를 파악한다.","m":"이 성취기준은 음의 장기로 물질을 저장하는 기능을 하는 오장과 양의 장기로 물질을 수송하는 기능을 하며 인체를 구성하는 육부를 이해하고 그 특성을 파악할 수 있도록 설정하였다. 오장육부의 개념 및 형태, 오장육부의 기능과 상호관계 파악하기, 서양 의학 장부와의 차이점 비교하기 등의 내용을 다룬다. 간, 심장, 비장, 폐, 신장 등 오장과 담, 소장, 위, 대장, 방광, 삼초 등 육부의 형태를 이해하고, 각 장부의 상호관계를 파악하여 인체가 하나의 종합적인 유기체임을 인식하는 데 중점을 둔다.","n":[],"p":764,"b":2},{"c":"[12한방02-02]","k":"선택","sk":"전문 교과(이료)","s":"한방","g":"고등학교 1~3학년","d":"장상","t":"오장육부의 특성을 이료술에 활용하고 생명 존중 및 건강 증진을 추구한다.","m":"이 성취기준은 음식물의 소화, 흡수, 배설 기능을 담당하는 오장육부에서 기혈이 정상적으로 순행할 수 있도록 협력하며 상호 작용함을 이해하고, 장부의 생리적 기능과 병리 현상을 임상에 적용할 수 있도록 설정하였다. 오장육부의 생리적 기능과 병리 현상 특성 이료술에 활용하기, 생명 존중 의식 함양, 질병 예방 및 건강 증진 추구 등의 내용을 다룬다. 오장육부의 상호관계 및 특징을 탐구하고 질병의 예방과 치료에 이료술을 활용하여 건강 증진을 추구하는 이료인으로서의 능력을 기르는 데 중점을 둔다.","n":[],"p":764,"b":2},{"c":"[12한방02-03]","k":"선택","sk":"전문 교과(이료)","s":"한방","g":"고등학교 1~3학년","d":"장상","t":"기항의 부의 개념 및 형태를 이해하고 장부의 기능과 상호관계를 파악한다.","m":"이 성취기준은 뇌, 수, 골, 맥, 자궁 등을 포함하는 기항의 부가 오장육부와는 다른 특성을 가진 인체 기관임을 이해하고, 기항의 부의 개념과 특성을 파악할 수 있도록 설정하였다. 기항의 부의 개념 및 형태, 기항의 부와 오장육부와의 차이점 비교하기, 기항의 부의 기능과 상호관계 파악하기 등의 내용을 다룬다. 형태적으로 부와 유사하고, 기능적으로 장과 유사하면서 고유한 특성을 가지는 기항의 부의 기능 및 상호관계 등을 한방적 원리를 통해 파악하는 데 중점을 둔다.","n":[],"p":765,"b":2},{"c":"[12한방02-04]","k":"선택","sk":"전문 교과(이료)","s":"한방","g":"고등학교 1~3학년","d":"장상","t":"서양 의학적 지식을 비판적으로 수용하고 기항의 부의 특성을 이료술에 활용한다.","m":"이 성취기준은 기항의 부의 생리적 기능과 병리 현상을 파악하여 질병을 변증하고 임상에 적용할 수 있는 능력을 기를 수 있도록 설정하였다. 기항의 부의 생리적 기능과 병리 현상 특성 이료술에 활용하기, 서양 의학적 지식의 비판적 수용 등의 내용을 다룬다. 한방적 인체관을 바탕으로 기항의 부의 생리적 기능과 병리 현상을 탐구하고 서양 의학적 지식을 비판적으로 수용하여 효과적으로 질병을 변증하고 이료술에 활용하는 능력을 기르는 데 중점을 둔다.","n":[],"p":765,"b":2},{"c":"[12한방02-05]","k":"선택","sk":"전문 교과(이료)","s":"한방","g":"고등학교 1~3학년","d":"장상","t":"장과 부 사이의 관계를 이해하고 장부의 형상이 정신에 미치는 영향을 파악한다.","m":"이 성취기준은 한방적 원리를 통해 장부 사이의 상호관계를 이해하고 정신적⋅육체적 건강과의 관련성을 파악할 수 있도록 설정하였다. 장과 장⋅장과 부 사이의 관계, 장부의 형상이 정신에 미치는 영향 파악하기, 한방과 서양 의학의 장과 부 사이의 관계 비교하기 등의 내용을 다룬다. 장과 부 사이의 음양, 표리관계 등 인체에서의 상호관계를 파악하여 장부의 형상에 따른 병리 현상과 육체적⋅정신적 건강의 관계를 파악하는 데 중점을 둔다.","n":[],"p":765,"b":2},{"c":"[12한방02-06]","k":"선택","sk":"전문 교과(이료)","s":"한방","g":"고등학교 1~3학년","d":"장상","t":"장과 부 사이의 생리적 기능과 병리 현상을 이료술에 활용하고 질병 예방을 실천한다.","m":"이 성취기준은 인체의 각 장부와 조직 기관은 고유의 기능을 가지면서도 전체의 한 부분으로서 유기적으로 상호 작용함을 이해하고, 한방적 원리에 따라 장과 부 사이의 특성을 파악하여 이료술에 활용하는 능력을 기르도록 설정하였다. 장과 부 사이의 상호 작용 원리 이료술에 활용하기, 자연의 순리에 따르는 질병 변증 및 예방 등의 내용을 다룬다. 자연계의 일부로서 통합적 유기체인 인체의 장과 부 사이의 상호 작용을 파악하여 이료술에 활용하고 질병 예방을 실천하는 능력을 기르는 데 중점을 둔다.","n":[],"p":765,"b":2},{"c":"[12한방03-01]","k":"선택","sk":"전문 교과(이료)","s":"한방","g":"고등학교 1~3학년","d":"경락과 경혈","t":"경락과 경혈의 개념을 이해하고 인체에서의 작용을 탐구한다.","m":"이 성취기준은 침구, 안마, 뜸 등 이료술에서 중요하게 활용되는 경락과 경혈의 개념과 종류를 이해하고 인체에서의 작용을 탐구하여 경락과 경혈을 통해 병리 현상을 이해하고 질병을 치료할 수 있는 능력을 기를 수 있도록 설정하였다. 경락과 경혈의 개념과 종류, 경락과 경혈의 종류와 작용 탐구하기, 경혈의 유래 및 관련 한자 조사하기 등의 내용을 다룬다. 경맥, 낙맥, 경근, 피부의 네 부분으로 구성된 경락과 경맥에 소속된 혈을 총칭하는 경혈 및 경외기혈 등 경락과 경혈의 개념과 종류에 대해 이해하고 경혈의 유래와 관련된 한자를 조사하며 경락과 경혈의 인체 내 작용의 특성을 파악하는 능력을 기르는 데 중점을 둔다.","n":[],"p":766,"b":2},{"c":"[12한방03-02]","k":"선택","sk":"전문 교과(이료)","s":"한방","g":"고등학교 1~3학년","d":"경락과 경혈","t":"창의적인 취혈법의 개발 의지를 바탕으로 정확한 취혈법을 이료술에 활용한다.","m":"이 성취기준은 경락과 경혈을 임상에서 효과적으로 활용하기 위해 경혈의 위치를 정하는 취혈법을 이해하고 창의적 취혈법의 개발 의지를 바탕으로 정확한 취혈법을 이료술에 활용할 수 있는 능력을 기를 수 있도록 설정하였다. 취혈법의 이해, 정확한 취혈법 이료술에 활용하기, 골도법과 지촌법 탐구 및 취혈에 적용하기, 창의적 취혈법 개발 의지, 경락과 경혈을 활용한 건강 증진 등의 내용을 다룬다. 통일된 인체의 유기적 기능과 경혈의 작용을 탐구하고 경혈의 위치를 정확히 파악하는 한편 정확한 취혈법을 이료술에 활용하고 질병 예방 및 건강 증진에 기여하는 이료인으로서의 능력을 기르는 데 중점을 둔다.","n":[],"p":766,"b":2},{"c":"[12한방03-03]","k":"선택","sk":"전문 교과(이료)","s":"한방","g":"고등학교 1~3학년","d":"경락과 경혈","t":"12정경맥, 기경8맥, 경외기혈의 종류 및 특성을 이해하고 취혈한다.","m":"이 성취기준은 기혈이 순행하는 12정경맥과 기경8맥 및 경외기혈의 종류를 이해하고 취혈하는 능력을 기를 수 있도록 설정하였다. 12정경맥과 기경8맥, 경외기혈의 종류 및 특성, 취혈법 조사하기 등의 내용을 다룬다. 경혈의 위치를 탐구하고 순행 경로를 이해하며 질병의 진단 및 치료에 적용할 수 있는 능력을 기르는 데 중점을 둔다.","n":[],"p":767,"b":2},{"c":"[12한방03-04]","k":"선택","sk":"전문 교과(이료)","s":"한방","g":"고등학교 1~3학년","d":"경락과 경혈","t":"경맥과 경혈 활용에 과학적 기법을 도입하는 자세를 가지고 경맥과 경혈의 특성을 임상에 활용한다.","m":"이 성취기준은 통일된 유기체인 인체에 정확한 취혈법을 적용하고 질병 변증 및 예방을 실천하는 이료인으로서의 자세와 능력을 기를 수 있도록 설정하였다. 경맥과 경혈의 특성 질병의 진단과 치료에 적용하기, 경맥과 경혈에 과학적 기법을 도입하는 자세 등의 내용을 다룬다. 정확한 취혈법의 적용을 통한 질병 변증 및 예방을 위해 경맥과 경혈의 위치 및 특성을 파악하고 주치증을 임상에 활용하는 능력을 기르는 데 중점을 둔다.","n":[],"p":767,"b":2},{"c":"[12한방03-05]","k":"선택","sk":"전문 교과(이료)","s":"한방","g":"고등학교 1~3학년","d":"경락과 경혈","t":"특수혈의 정의와 특징을 이해하고 임상에 적용되는 특수혈을 조사한다.","m":"이 성취기준은 경혈 중에서 특수한 치료 효과가 있는 특수혈의 정의와 특징을 이해하고 임상에 적용되는 특수혈을 파악하는 능력을 기를 수 있도록 설정하였다. 특수혈의 정의와 종류, 임상에서 활용되는 특수혈 조사하기 등의 내용을 다룬다. 특수혈의 정의와 종류를 이해하고 오수혈, 원혈과 하합혈, 극혈과 낙혈, 배수혈과 복모혈, 사관혈과 사총혈, 팔회혈과 팔맥교회혈 등 임상에 사용되는 특수혈의 특징을 조사하는 데 중점을 둔다.","n":[],"p":768,"b":2},{"c":"[12한방03-06]","k":"선택","sk":"전문 교과(이료)","s":"한방","g":"고등학교 1~3학년","d":"경락과 경혈","t":"특수혈을 임상에 활용하고 유용한 취혈법을 모색하는 태도를 가진다.","m":"이 성취기준은 치료 효과가 있는 특수혈의 작용을 파악하여 임상에 활용하고유용한 취혈법을 모색하는 이료인으로서의 능력을 기를 수 있도록 설정하였다. 특수혈의 작용 파악 및 임상에 활용하기, 유용한 취혈법을 모색하는 태도 등의 내용을 다룬다. 특수혈의 특징과 치료 효과를 파악하고 임상에서 효능이 있는 취혈법을 모색하는 태도를 가지고 효과적인 취혈법을 개발하여 이료술에 활용하는 능력을 기르는 데 중점을 둔다.","n":[],"p":768,"b":2},{"c":"[12한방04-01]","k":"선택","sk":"전문 교과(이료)","s":"한방","g":"고등학교 1~3학년","d":"한방 병리","t":"병인의 종류 및 특성을 이해하고 질병의 원인을 파악한다.","m":"이 성취기준은 질병의 원인이 되는 병인의 종류 및 특성을 이해하고, 실생활에서 질병의 원인을 파악할 수 있도록 설정하였다. 내인⋅외인⋅불내외인의 종류 및 특성, 서양 의학과 질병의 원인 비교하기, 실생활에서 질병의 원인 파악하기 등의 내용을 다룬다. 한방적 관점에서 서양 의학과의 비교를 통해 질병의 원인을 파악하는 데 중점을 둔다.","n":[],"p":769,"b":2},{"c":"[12한방04-02]","k":"선택","sk":"전문 교과(이료)","s":"한방","g":"고등학교 1~3학년","d":"한방 병리","t":"병인의 특성에 따른 이료술을 활용하고 자연과 조화를 이루는 삶을 추구한다.","m":"이 성취기준은 한방적 세계관과 인체관을 바탕으로 병인의 특성에 따른 이료술을 활용하는 능력을 기를 수 있도록 설정하였다. 병인의 특성에 따른 이료술 활용하기, 자연과 조화를 이루는 건강한 삶의 추구 등의 내용을 다룬다. 통일된 유기체인 인체의 질병을 한방적 관점에서 인식하고 병인의 특성에 맞는 이료술을 활용하며 실생활에서 질병 예방을 실천하는 데 중점을 둔다.","n":[],"p":769,"b":2},{"c":"[12한방04-03]","k":"선택","sk":"전문 교과(이료)","s":"한방","g":"고등학교 1~3학년","d":"한방 병리","t":"병기의 종류 및 특성을 이해하고 병증의 사례를 조사한다.","m":"이 성취기준은 질병 치료의 중요한 근거가 되는 병기의 종류 및 특성을 이해하고 병증의 사례를 조사하여 한방적 관점에서 질병을 파악할 수 있도록 설정하였다. 병기의 종류와 특성, 병증 탐구 및 사례 조사하기 등의 내용을 다룬다. 병기의 종류 및 특성을 이해하고 병증의 사례를 조사하여 통일된 유기체인 인체에서 병리 변화의 특성을 파악하는 데 중점을 둔다.","n":[],"p":770,"b":2},{"c":"[12한방04-04]","k":"선택","sk":"전문 교과(이료)","s":"한방","g":"고등학교 1~3학년","d":"한방 병리","t":"병기의 특성을 이료술에 활용하고 한방적 세계관과 질병관을 통해 건강 증진을 추구한다.","m":"이 성취기준은 병기의 특성을 이료술에 활용하고 자연의 법칙을 따르는 한방적 세계관과 질병관을 통해 건강을 추구하는 능력을 기를 수 있도록 설정하였다. 병기의 특성 이료술에 활용하기, 한방적 세계관과 질병관을 통해 건강 증진 추구 등의 내용을 다룬다. 병기의 특징을 이해하고 한방적 관점에서 질병의 원인과 변화를 이해하고 예방하는 자세를 바탕으로 병기의 특성을 이료술에 활용하여 건강 증진을 추구하는 능력을 기르는 데 중점을 둔다.","n":[],"p":770,"b":2},{"c":"[12한방05-01]","k":"선택","sk":"전문 교과(이료)","s":"한방","g":"고등학교 1~3학년","d":"한방 진단","t":"망진의 정의와 종류를 이해하고 전신망진과 국소망진의 방법을 조사한다.","m":"이 성취기준은 정확한 진단에는 여러 진단법을 융합, 분석하는 과정이 필요함을 이해하고, 그중 망진을 통해 질병을 다각적으로 파악할 수 있도록 설정하였다. 망진의 정의와 종류, 전신망진 및 국소망진 방법 조사하기 등의 내용을 다룬다. 전신망진과 국소망진의 실제 사례를 통해 망진의 특성과 망진법을 파악하는 능력을 기르는 데 중점을 둔다.","n":[],"p":771,"b":2},{"c":"[12한방05-02]","k":"선택","sk":"전문 교과(이료)","s":"한방","g":"고등학교 1~3학년","d":"한방 진단","t":"망진의 적용 범위를 이해하고 건강 관리 및 질병 예방을 실천한다.","m":"이 성취기준은 정확한 진단과 질병 변증 및 예방을 위해 서양 의학의 진단법과 망진을 비교하고 효과적인 망진법을 이료술에 활용할 수 있도록 설정하였다. 망진법과 서양 의학 진단법과 비교하기, 이료술에 망진 활용하기, 건강 관리 및 질병 예방 등의 내용을 다룬다. 서양 의학 진단법 중 시진과의 비교를 통해 효과적인 망진법을 파악하여 망진을 이료술에 활용하는 능력을 기르는 데 중점을 둔다.","n":[],"p":771,"b":2},{"c":"[12한방05-03]","k":"선택","sk":"전문 교과(이료)","s":"한방","g":"고등학교 1~3학년","d":"한방 진단","t":"문진(聞診)의 정의와 종류를 이해하고 청각 및 후각에 의한 문진 사례를 조사한다.","m":"이 성취기준은 질병의 정확한 진단에 필요한 한방 진단법 중 청각 및 후각적인 정보를 응용한 문진(聞診)을 통해 질병을 파악할 수 있도록 설정하였다. 문진의 종류와 정의, 청각 및 후각에 의한 문진 사례 조사하기 등의 내용을 다룬다. 문진의 정의와 종류를 이해하고, 문진의 실제 사례를 조사하여 문진의 특성과 정확한 진단을 위한 문진법을 파악하는 능력을 기르는 데 중점을 둔다.","n":[],"p":772,"b":2},{"c":"[12한방05-04]","k":"선택","sk":"전문 교과(이료)","s":"한방","g":"고등학교 1~3학년","d":"한방 진단","t":"청각과 후각을 이용한 진단법을 성찰하고 문진(聞診)을 이료술에 활용한다.","m":"이 성취기준은 후각적인 정보를 진단에 응용하는 문진은 서양 의학의 진단과 구별되는 특징을 가진 한방적 진단법임을 이해하고, 정확한 진단을 위해 문진을 임상에 적용하는 능력을 기르도록 설정하였다. 문진법과 서양 의학 진단법 비교하기, 이료술에 문진 활용하기, 청각과 후각을 활용한 진단법의 성찰 등의 내용을 다룬다. 서양 의학 진단법 중 청진과의 비교를 통해 청각과 후각에 의한 문진법을 성찰하고, 문진을 이료술에 활용할 수 있는 능력을 기르는 데 중점을 둔다.","n":[],"p":772,"b":2},{"c":"[12한방05-05]","k":"선택","sk":"전문 교과(이료)","s":"한방","g":"고등학교 1~3학년","d":"한방 진단","t":"문진(問診)의 정의와 종류를 이해하고 자각증상 및 타각증상에 의한 문진 사례를 조사한다.","m":"이 성취기준은 질병의 정확한 진단에 필요한 한방 진단법 중 피술자와 시술자 간의 대화를 응용한 문진을 통해 질병을 파악할 수 있도록 설정하였다. 문진의 종류와 정의, 자각증상과 타각증상에 의한 문진 방법 사례 조사하기 등의 내용을 다룬다. 문진의 정의와 종류를 이해하고, 실제 사례를 조사하여 문진의 특성과 정확한 진단을 위한 문진법을 파악하는 능력을 기르는 데 중점을 둔다.","n":[],"p":772,"b":2},{"c":"[12한방05-06]","k":"선택","sk":"전문 교과(이료)","s":"한방","g":"고등학교 1~3학년","d":"한방 진단","t":"피술자와 시술자 간의 공감을 형성하고 문진(問診)을 이료술에 활용한다.","m":"이 성취기준은 정확한 진단과 질병 변증 및 예방을 위해 서양 의학의 진단법과 문진을 비교하고 효과적인 문진 방법을 이료술에 활용할 수 있도록 설정하였다. 서양 의학 진단법과 문진법 비교하기, 이료술에 문진 활용하기, 피술자와 시술자 간의 공감 형성 등의 내용을 다룬다. 서양 의학 진단법 중 문진과의 비교를 통해 피술자와 공감을 형성하며 질병을 정확하게 진단할 수 있는 한방 진단법을 파악하고, 문진(問診)을 이료술에 활용할 수 있는 능력을 기르는 데 중점을 둔다.","n":[],"p":772,"b":2},{"c":"[12한방05-07]","k":"선택","sk":"전문 교과(이료)","s":"한방","g":"고등학교 1~3학년","d":"한방 진단","t":"절진의 정의와 종류를 이해하고 맥진 및 안진에 의한 절진 사례를 조사한다.","m":"이 성취기준은 질병의 정확한 진단에 필요한 한방 진단법 중 피술자의 맥상을 살피는 맥진과 피부와 근육 및 경락의 순행 경로를 살피는 안진 등 절진을 통해 질병을 파악할 수 있도록 설정하였다. 절진의 종류와 정의, 맥진과 안진 등 절진 방법 사례 조사하기 등의 내용을 다룬다. 절진의 정의와 종류를 이해하고, 실제 사례를 조사하여 절진의 특성과 정확한 진단을 위한 절진 진단법을 파악하는 능력을 기르는 데 중점을 둔다.","n":[],"p":773,"b":2},{"c":"[12한방05-08]","k":"선택","sk":"전문 교과(이료)","s":"한방","g":"고등학교 1~3학년","d":"한방 진단","t":"신체 접촉 시 예절을 준수하고 절진을 이료술에 활용한다.","m":"이 성취기준은 피술자의 경락과 경맥, 복부와 배부 등을 촉진하여 진단에 응용하는 절진은 서양 의학의 진단과 구별되는 특징을 가진 한방적 진단법임을 이해하고, 정확한 진단을 위해 절진을 임상에 적용하는 능력을 기르도록 설정하였다. 서양 의학 진단법과 절진법 비교하기, 이료술에 절진 활용하기 등의 내용을 다룬다. 서양 의학 진단법 중 촉진과의 비교를 통해 경락과 경맥을 사용하여 질병을 정확하게 진단할 수 있는 한방 진단법을 파악하고, 시각장애인에게 유용한 진단법 개발 및 절진을 이료술에 활용할 수 있는 능력을 기르는 데 중점을 둔다.","n":[],"p":773,"b":2},{"c":"[12한방06-01]","k":"선택","sk":"전문 교과(이료)","s":"한방","g":"고등학교 1~3학년","d":"임상","t":"질병 예방의 개념과 치료 원칙을 이해하고 이료술에 활용한다.","m":"이 성취기준은 한방에서 질병이 발생하기 전에 예방하는 것이 중요함을 이해하고 한방적 원리에 의한 치료 원칙을 이료술에 활용할 수 있는 능력을 기를 수 있도록 설정하였다. 질병 예방의 개념, 치료 원칙, 질병 예방 및 치료 원리 이료술에 활용하기 등의 내용을 다룬다. 질병 예방의 개념 및 치료 원칙을 이해하고 이를 이료술에 활용하는 능력을 기르는 데 중점을 둔다.","n":[],"p":774,"b":2},{"c":"[12한방06-02]","k":"선택","sk":"전문 교과(이료)","s":"한방","g":"고등학교 1~3학년","d":"임상","t":"일상생활에서 질병 예방 사례를 조사하고 한방적 관점에서 질병 예방법을 실천한다.","m":"이 성취기준은 섭생과 양생 등을 통해 일상생활에서 질병 예방을 실천할 수 있는 방법을 파악하여 한방적 세계관과 인체관을 바탕으로 건강 증진을 추구할 수 있도록 설정하였다. 일상생활에서의 질병 예방법 조사하기, 한방적 인체관에 의한 질병 예방과 치료 원칙 실천, 한방적 세계관 및 인체관에 바탕을 둔 섭생과 양생 실천, 생활 습관 개선 등의 내용을 다룬다. 질병을 예방법의 실제 사례를 조사하고 실천하며, 인체를 종합적인 관점에서 판단하여 임상에 적용하는 능력을 기르는 데 중점을 둔다.","n":[],"p":774,"b":2},{"c":"[12한방06-03]","k":"선택","sk":"전문 교과(이료)","s":"한방","g":"고등학교 1~3학년","d":"임상","t":"치료법의 원리를 이해하고 한방적 인체관에 의한 치료법을 실천한다.","m":"이 성취기준은 인체를 통일된 유기체로 인식하고 자연과의 조화를 추구하는 한방 치료법의 원리 및 특성을 파악할 수 있도록 설정하였다. 치료법의 원리, 본치법과 표치법의 종류 및 특성 이해하기, 한방적 인체관에 의한 치료법 실천 등의 내용을 다룬다. 한방적 세계관과 인체관을 바탕으로 오행 및 경락 치료 등의 본치법과 통증치료 등 표치법의 특성을 파악하고 한방적 치료법을 실천하는 능력을 기르는 데 중점을 둔다.","n":[],"p":775,"b":2},{"c":"[12한방06-04]","k":"선택","sk":"전문 교과(이료)","s":"한방","g":"고등학교 1~3학년","d":"임상","t":"치료법의 원리를 이료술에 활용하고 정신적⋅육체적 건강의 조화를 추구한다.","m":"이 성취기준은 질병을 변증하고 본치법과 표치법의 특성을 이료술에 활용하여 자연과의 조화와 균형을 이루는 삶을 실천하는 이료인으로서의 능력을 기를 수 있도록 설정하였다. 보사의 종류와 방법 탐구 및 이료술에 활용하기, 정신적⋅육체적 건강의 조화 추구 등의 내용을 다룬다. 한방적 인체관을 바탕으로 치료법의 원리를 파악하고 정신적⋅육체적 건강의 균형을 추구하며 임상에 활용하는 능력을 기르는 데 중점을 둔다.","n":[],"p":775,"b":2},{"c":"[12침구01-01]","k":"선택","sk":"전문 교과(이료)","s":"침구","g":"고등학교 1~3학년","d":"침술의 기초","t":"침의 정의를 알고 기초 용어를 익힌다.","m":"이 성취기준은 침술의 개요를 파악하고 침의 기본 용어를 습득할 수 있도록 설정하였다. 침술의 개요, 침술의 기초 용어 익히기 등의 내용을 다룬다. 침술의 정의를 알고 침술의 기초 개념을 학습하는 데 중점을 둔다.","n":[],"p":784,"b":2},{"c":"[12침구01-02]","k":"선택","sk":"전문 교과(이료)","s":"침구","g":"고등학교 1~3학년","d":"침술의 기초","t":"침술의 유래를 알고 우리나라 침술 제도 변천사를 파악한다.","m":"이 성취기준은 침술의 유래와 발전 과정, 침술 관련 제도의 변천사 등을 학습할 수 있도록 설정하였다. 침술 제도의 변천사 조사하기, 이료 업무 범위와 침술 관계 인식 등의 내용을 다룬다. 침술의 유래와 발전 과정을 알고 우리나라의 침술 제도 변천사를 통해 안마사의 업무 범위와 이료술로서 침 시술의 의의를 인식하는 데 중점을 둔다.","n":[],"p":784,"b":2},{"c":"[12침구01-03]","k":"선택","sk":"전문 교과(이료)","s":"침구","g":"고등학교 1~3학년","d":"침술의 기초","t":"침과 침관의 종류를 알고 용도를 파악한다.","m":"이 성취기준은 침의 재료와 종류를 구분하고 침관의 용도별 종류를 습득할 수 있도록 설정하였다. 침과 침관, 침 종류 구분하기, 침과 침관의 용도 습득하기 등의 내용을 다룬다. 침과 침관의 형태적 종류를 구분하고 종류별 용도와 편의성을 파악하는 데 중점을 둔다.","n":[],"p":784,"b":2},{"c":"[12침구01-04]","k":"선택","sk":"전문 교과(이료)","s":"침구","g":"고등학교 1~3학년","d":"침술의 기초","t":"자침법의 종류를 구분하고 기본 술식을 익힌다.","m":"이 성취기준은 임상 장면에서 자침할 수 있도록 자침의 종류를 파악하고, 자침 종류별 술식을 습득할 수 있도록 설정하였다. 자침법, 자침법의 술식 익히기, 종류별 자침법 시술 적용 등의 내용을 다룬다. 자침법의 종류를 구분하고 그에 따른 술식을 익히는 데 중점을 둔다.","n":[],"p":785,"b":2},{"c":"[12침구01-05]","k":"선택","sk":"전문 교과(이료)","s":"침구","g":"고등학교 1~3학년","d":"침술의 기초","t":"소독법의 구체적 방법을 파악하고 자침 시 소독법을 실천한다.","m":"이 성취기준은 자침 과정의 위생적 절차를 확인하고 필수적 소독을 실천할 수 있도록 설정하였다. 소독법, 소독법 익히기, 위생적 시술 환경 조성 등의 내용을 다룬다. 소독의 절차를 준수하고 위생적인 침 시술 환경의 중요성을 인식하는 데 중점을 둔다.","n":[],"p":785,"b":2},{"c":"[12침구01-06]","k":"선택","sk":"전문 교과(이료)","s":"침구","g":"고등학교 1~3학년","d":"침술의 기초","t":"득기와 행기의 개념을 이해하고 기본 침 조작 방법을 익힌다.","m":"이 성취기준은 임상에서 중시하는 득기와 행기의 개념을 습득하고 시술에 적용할 수 있도록 설정하였다. 득기와 행기, 자침 과정의 침감 토의하기 등의 내용을 다룬다. 득기와 행기의 개념을 이해하고 자침 과정의 침감에 대한 토의를 통하여 득기와 행기를 위한 침 조작 방법을 익히는 데 중점을 둔다.","n":[],"p":786,"b":2},{"c":"[12침구01-07]","k":"선택","sk":"전문 교과(이료)","s":"침구","g":"고등학교 1~3학년","d":"침술의 기초","t":"운침법의 종류를 구분하고 종류별 시술 방법을 습득한다.","m":"이 성취기준은 자침 과정에서 적절한 자극을 가하고 그에 따른 효과의 연관성을 이해할 수 있도록 설정하였다. 운침법의 종류 구분하기, 운침법 술식 익히기, 운침의 중요성 인식 등의 내용을 다룬다. 운침법의 종류와 특징을 알고 종류별 시술 방법을 구체적으로 익혀 운침의 효과와 적용 사례를 종합적으로 이해하는 데 중점을 둔다.","n":[],"p":786,"b":2},{"c":"[12침구01-08]","k":"선택","sk":"전문 교과(이료)","s":"침구","g":"고등학교 1~3학년","d":"침술의 기초","t":"침술의 적응증을 알고 부적응증과 구분한다.","m":"이 성취기준은 침의 효과가 높은 대상 병증과 부작용이 예상되는 병증을 구분할 수 있도록 설정하였다. 적응증, 부적응증, 금기사항, 침술의 적응증 조사하기 등의 내용을 다룬다. 침술의 적응증과 부적응증을 숙지하여 효과적으로 시술할 수 있는 지식을 갖추는 데 중점을 둔다.","n":[],"p":787,"b":2},{"c":"[12침구01-09]","k":"선택","sk":"전문 교과(이료)","s":"침구","g":"고등학교 1~3학년","d":"침술의 기초","t":"자침 시 주의 사항을 알고 임상에 적용한다.","m":"이 성취기준은 자침 과정에서 우발적으로 발생할 수 있는 부작용이나 응급 상황에 대한 대처 요령을 숙지할 수 있도록 설정하였다. 자침 시 주의 사항, 자침 시 부작용 예방 등의 내용을 다룬다. 자침 시 나타날 수 있는 발침 곤란, 만침, 혼침, 피부 과민증, 출혈 등에 대처할 수 있는 지식과 기술을 습득하여 부작용을 예방하는 능력을 갖추는 데 중점을 둔다.","n":[],"p":787,"b":2},{"c":"[12침구02-01]","k":"선택","sk":"전문 교과(이료)","s":"침구","g":"고등학교 1~3학년","d":"구술의 기초","t":"구술의 유래를 알고 뜸의 재료와 용도를 이해한다.","m":"이 성취기준은 뜸의 재료와 발전 과정을 이해하고 용도에 따라 시구할 수 있도록 설정하였다. 뜸의 재료, 구술의 유래 탐구하기 등의 내용을 다룬다. 구술의 정의와 유래를 알고 뜸쑥의 성분과 품질, 좋은 쑥의 조건 등을 이해하며 시구에 사용되는 도구의 쓰임새를 익히는 데 중점을 둔다.","n":[],"p":787,"b":2},{"c":"[12침구02-02]","k":"선택","sk":"전문 교과(이료)","s":"침구","g":"고등학교 1~3학년","d":"구술의 기초","t":"구술의 작용을 알고 뜸 시술의 중요성을 인식한다.","m":"이 성취기준은 구술의 작용과 그에 따른 병증에 대한 효과를 연관하여 임상에 활용할 수 있도록 설정하였다. 구술 작용, 구술 작용 습득하기, 구술을 중시하는 가치관 등의 내용을 다룬다. 구술의 작용 기전을 알고 시술에 적용하여 구술의 중요성을 인식하는 데 중점을 둔다.","n":[],"p":787,"b":2},{"c":"[12침구02-03]","k":"선택","sk":"전문 교과(이료)","s":"침구","g":"고등학교 1~3학년","d":"구술의 기초","t":"구술의 적응증과 금기증을 알고 뜸 시술에 적용한다.","m":"이 성취기준은 뜸의 효과가 높은 대상 병증과 부작용이 예상되는 병증을 구분할 수 있도록 설정하였다. 적응증과 금기증, 구술의 주의 사항 조사하기 등의 내용을 다룬다. 구술의 적응증을 알고 바르게 시술하여 피술자의 건강을 관리하고, 금기증을 숙지하여 부작용을 예방하는 데 중점을 둔다.","n":[],"p":787,"b":2},{"c":"[12침구02-04]","k":"선택","sk":"전문 교과(이료)","s":"침구","g":"고등학교 1~3학년","d":"구술의 기초","t":"구술을 방법별로 분류하고 시술 방법을 익힌다.","m":"이 성취기준은 최근 다양한 방법으로 형태적 변화가 생긴 뜸을 자극 전달 방법에 따라 구분하고 그에 따른 시술 방법을 익힐 수 있도록 설정하였다. 구법, 구법의 시술 방법 적용하기 등의 내용을 다룬다. 구법을 분류하고 직접구와 간접구로 나누어 적용 방법을 익히는 데 중점을 둔다.","n":[],"p":788,"b":2},{"c":"[12침구02-05]","k":"선택","sk":"전문 교과(이료)","s":"침구","g":"고등학교 1~3학년","d":"구술의 기초","t":"시구의 일반적인 원칙을 알고 시구에 적용한다.","m":"이 성취기준은 시구 과정에서 기대되는 효과를 높이기 위한 시구 원칙을 제시하고 방법과 절차를 지킬 수 있도록 설정하였다. 시구 원칙, 시구의 일반 원칙 탐색하기 등의 내용을 다룬다. 시구에서 적용되는 일반 원칙을 탐색하는 데 중점을 둔다.","n":[],"p":788,"b":2},{"c":"[12침구02-06]","k":"선택","sk":"전문 교과(이료)","s":"침구","g":"고등학교 1~3학년","d":"구술의 기초","t":"시구 시 주의 사항을 알고 뜸 시술에 실천한다.","m":"이 성취기준은 시구 과정에서 발생할 수 있는 화상 등의 부작용을 방지하기 위한 주의 사항을 숙지하고 대처 요령을 익힐 수 있도록 설정하였다. 시구의 주의 사항을 숙지하여 시술에 적용하고 실천하는 데 중점을 둔다.","n":[],"p":788,"b":2},{"c":"[12침구02-07]","k":"선택","sk":"전문 교과(이료)","s":"침구","g":"고등학교 1~3학년","d":"구술의 기초","t":"보양뜸의 주요혈을 알고 이론적 배경을 탐색한다.","m":"이 성취기준은 인체의 양기를 북돋아 주는 뜸의 작용과 기전을 알고, 효과가 높은 명구혈을 중심으로 시구할 수 있도록 설정하였다. 보양뜸의 주요혈과 배경 탐색하기 등의 내용을 다룬다. 보양뜸의 개념을 이해하고, 보양뜸에서 사용하는 주요혈과 그 경혈이 선택된 이론적 배경을 탐색하는 데 중점을 둔다.","n":[],"p":789,"b":2},{"c":"[12침구02-08]","k":"선택","sk":"전문 교과(이료)","s":"침구","g":"고등학교 1~3학년","d":"구술의 기초","t":"보양뜸의 효능과 의학적 특성을 알고 뜸 시술에 적용한다.","m":"이 성취기준은 허증이나 양증에 효과가 높은 보양뜸을 임상 장면에서 효율적으로 적용할 수 있도록 설정하였다. 보양뜸의 효능과 의학적 특성 탐구하기, 건강한 삶을 위한 보양뜸 실천 습관화 등의 내용을 다룬다. 보양뜸의 활용 범위와 의학적 특성을 파악하고 뜸 시술에 적용하여 건강한 생활 습관을 기르는 데 중점을 둔다.","n":[],"p":789,"b":2},{"c":"[12침구03-01]","k":"선택","sk":"전문 교과(이료)","s":"침구","g":"고등학교 1~3학년","d":"침구의 작용 기전","t":"자극의 정의를 알고 종류별 특성을 이해한다.","m":"이 성취기준은 일반적 자극의 정의를 파악하고 인체에 유의미한 자극의 종류와 특징을 분류할 수 있도록 설정하였다. 자극, 자극의 종류 조사하기 등의 내용을 다룬다. 인체에 유효한 자극에 대해 이해하고 다양한 자극의 종류를 조사하여 특성을 이해하는 데 중점을 둔다.","n":[],"p":790,"b":2},{"c":"[12침구03-02]","k":"선택","sk":"전문 교과(이료)","s":"침구","g":"고등학교 1~3학년","d":"침구의 작용 기전","t":"수용기별 특성을 알고 반응 기전을 파악한다.","m":"이 성취기준은 인체에서 발달한 감각수용기의 종류와 특징을 구분하고, 수용기의 생리 기전을 파악할 수 있도록 설정하였다. 감각수용기, 침구 자극에 따른 수용기의 반응 정리, 자극에 대한 반응의 중요성 인식 등의 내용을 다룬다. 침구 자극 시 예상되는 인체 반응과 효과에 대한 지식을 습득하는 데 중점을 둔다.","n":[],"p":790,"b":2},{"c":"[12침구03-03]","k":"선택","sk":"전문 교과(이료)","s":"침구","g":"고등학교 1~3학년","d":"침구의 작용 기전","t":"경락 현상을 알고 이와 관련한 침 자극 작용을 이해한다.","m":"이 성취기준은 동양에서 발달한 경락 이론을 이해하고 침 자극을 통한 경락의 기혈 조정 작용을 파악할 수 있도록 설정하였다. 침 자극, 침 자극의 작용에 따른 술식적용하기, 침 자극과 건강 등의 내용을 다룬다. 침 자극에 따른 경락의 작용 기전을 생리학적 관점에서 이해하는 데 중점을 둔다.","n":[],"p":790,"b":2},{"c":"[12침구03-04]","k":"선택","sk":"전문 교과(이료)","s":"침구","g":"고등학교 1~3학년","d":"침구의 작용 기전","t":"구 자극의 화학적 효과를 이해하고 온열적 작용을 파악한다.","m":"이 성취기준은 뜸의 온열적 자극 효과와 쑥의 효능 등이 인체의 생리 및 병리기전에 미치는 영향을 학습할 수 있도록 설정하였다. 구 자극, 구 자극 작용에 따른 술식 정리하기, 구 자극과 건강 등의 내용을 다룬다. 구술의 온열적 작용 기전을 파악하는 데 중점을 둔다.","n":[],"p":790,"b":2},{"c":"[12침구03-05]","k":"선택","sk":"전문 교과(이료)","s":"침구","g":"고등학교 1~3학년","d":"침구의 작용 기전","t":"상피 조직의 반응 기전을 숙지하고 침구 자극이 인체에 미치는 영향을 습득한다.","m":"이 성취기준은 상피 조직의 특성을 파악하고 침과 뜸의 자극과 상피 조직에 연관성을 적용할 수 있도록 설정하였다. 상피 조직, 침구 자극의 효과 정리하기, 침구 자극과 생체 반응의 연관성 토의하기 등의 내용을 다룬다. 침구 자극에 따른 상피 조직의 반응 기전을 이해하는 데 중점을 둔다.","n":[],"p":791,"b":2},{"c":"[12침구03-06]","k":"선택","sk":"전문 교과(이료)","s":"침구","g":"고등학교 1~3학년","d":"침구의 작용 기전","t":"심부 조직의 신경학적 특성을 이해하고 관련한 침구 자극 효과를 파악한다.","m":"이 성취기준은 심부 조직의 특성을 파악하고 침과 뜸의 자극과 심부 조직에 연관성을 적용할 수 있도록 설정하였다. 심부 조직, 침구 자극의 효과 정리하기, 침구 자극과 생체 반응의 연관성 토의하기, 생체 반응의 중요성 인식 등의 내용을 다룬다. 침구 자극에 따른 심부 조직의 효과를 파악하는 데 중점을 둔다.","n":[],"p":791,"b":2},{"c":"[12침구03-07]","k":"선택","sk":"전문 교과(이료)","s":"침구","g":"고등학교 1~3학년","d":"침구의 작용 기전","t":"항상성의 개념을 파악하고 침구 치료의 조화와 균형 이론을 비교한다.","m":"이 성취기준은 인체의 생리 기전 가운데 서양의 항상성이란 개념과 동양의 조화와 균형이란 개념을 비교할 수 있도록 설정하였다. 서양의 항상성과 동양의 조화 개념 비교하기, 항상성 기전에 따른 침구의 조절 효과 인식 등의 내용을 다룬다. 동양의 조화 원리와 항상성을 비교하여 공통점과 차이점을 파악하는 데 중점을 둔다.","n":[],"p":792,"b":2},{"c":"[12침구03-08]","k":"선택","sk":"전문 교과(이료)","s":"침구","g":"고등학교 1~3학년","d":"침구의 작용 기전","t":"진통학설의 기본 원리를 알고 침구 치료 이론의 신경학적 근거를 파악한다.","m":"이 성취기준은 인체의 신경학적 원리에 침구 자극의 특징을 적용하여 진통 기전을 파악할 수 있도록 설정하였다. 진통학설, 진통학설에 따른 신경 반응 토의하기 등의 내용을 다룬다. 침 자극에 따른 진통학설의 효과를 습득하는 데 중점을 둔다.","n":[],"p":792,"b":2},{"c":"[12침구03-09]","k":"선택","sk":"전문 교과(이료)","s":"침구","g":"고등학교 1~3학년","d":"침구의 작용 기전","t":"압자율신경반사의 개념을 알고 해부생리학적 반응 기전을 적용한다.","m":"이 성취기준은 해부생리적 신경반사 기전을 통한 자극요법의 효능을 파악할 수 있도록 설정하였다. 압자율신경반사, 압자율신경반사를 이료 술식에 적용하기 등의 내용을 다룬다. 수기 및 보조적 자극요법을 통한 이료술 적용에 따른 압자율신경반사의 효과를 습득하는 데 중점을 둔다.","n":[],"p":792,"b":2},{"c":"[12침구04-01]","k":"선택","sk":"전문 교과(이료)","s":"침구","g":"고등학교 1~3학년","d":"음양과 오행의 적용","t":"음양의 상호관계를 인체에 적용하고 실생활에 활용한다.","m":"이 성취기준은 음양의 상호 관계를 인체에 적용하여 이해하고, 실생활에서도 음양의 대립과 상호보완을 통한 이분법적 분류법을 적용할 수 있도록 설정하였다. 음양의 적용, 음양의 상호 작용 탐구하기, 음양의 상대성 인식 등의 내용을 다룬다. 음양의 상호 관계를 이해하여 인체에 적용하고, 실생활에 활용할 수 있는 지식을 습득하는 데 중점을 둔다.","n":[],"p":793,"b":2},{"c":"[12침구04-02]","k":"선택","sk":"전문 교과(이료)","s":"침구","g":"고등학교 1~3학년","d":"음양과 오행의 적용","t":"음양의 상대성을 인체에 대응시키고 침술에 음양 원리를 적용한다.","m":"이 성취기준은 인체의 전면과 후면, 상부와 하부, 남자와 여자, 양경맥과 음경맥 등을 구분하여 음양의 원리를 적용할 수 있도록 설정하였다. 음양 이론을 이용하여 침술 적용하기, 음양과 침 시술 연계 등의 내용을 다룬다. 경맥과 위치에 따라 경혈을 음과 양으로 구분하고 음양 원리를 침술에 적용하는 데 중점을 둔다.","n":[],"p":793,"b":2},{"c":"[12침구04-03]","k":"선택","sk":"전문 교과(이료)","s":"침구","g":"고등학교 1~3학년","d":"음양과 오행의 적용","t":"오행혈의 개념을 알고 시술 원리를 익힌다.","m":"","n":[],"p":793,"b":2},{"c":"[12침구04-04]","k":"선택","sk":"전문 교과(이료)","s":"침구","g":"고등학교 1~3학년","d":"음양과 오행의 적용","t":"오수혈의 개념을 알고 시술 원리를 익힌다.","m":"","n":[],"p":793,"b":2},{"c":"[12침구04-05]","k":"선택","sk":"전문 교과(이료)","s":"침구","g":"고등학교 1~3학년","d":"음양과 오행의 적용","t":"정격과 승격의 조합 원리를 이해하고 경락별로 적용한다.","m":"이 성취기준은 인체의 오행적 상황에 정격과 승격을 위한 오행혈의 보사 조합 이론을 습득할 수 있도록 설정하였다. 난경의 오행 관계, 정격과 승격 원리 탐구하기 등의 내용을 다룬다. 난경과 사암도인침구요결의 치료 원리를 이해하여 정격과 승격의 조합 원리를 파악하고 경락별 보사법에 적용하는 데 중점을 둔다.","n":[],"p":794,"b":2},{"c":"[12침구04-06]","k":"선택","sk":"전문 교과(이료)","s":"침구","g":"고등학교 1~3학년","d":"음양과 오행의 적용","t":"열격과 한격의 시술 원리를 이해하고 경락별로 적용한다.","m":"이 성취기준은 인체의 오행적 해석에 따른 열격과 한격을 위한 오행혈의 보사 조합의 이론을 습득할 수 있도록 설정하였다. 병증과 오행, 열격과 한격 원리 탐구하기,병증 분석의 중요성 등의 내용을 다룬다. 사암도인침구요결의 치료 원리를 이해하여 열격과 한격의 조합 원리를 파악하고 경락별 처방법에 적용하는 데 중점을 둔다.","n":[],"p":794,"b":2},{"c":"[12침구04-07]","k":"선택","sk":"전문 교과(이료)","s":"침구","g":"고등학교 1~3학년","d":"음양과 오행의 적용","t":"오행 원리를 이용하여 각종 병증을 분석하고 오행적 시술법을 적용한다.","m":"이 성취기준은 인체 구성의 오행적 요소를 기초로 하여 병리적 태과, 불급 상황에 따른 오행적 시술 원리를 적용하는 방법을 파악할 수 있도록 설정하였다. 병증과 오행, 병증 분석하기, 병증 분석의 중요성 인식 등의 내용을 다룬다. 오행의 원리를 이용하여 병증을 분석하고 오행혈의 관계와 특성을 시술에 적용하는 데 중점을 둔다.","n":[],"p":794,"b":2},{"c":"[12침구05-01]","k":"선택","sk":"전문 교과(이료)","s":"침구","g":"고등학교 1~3학년","d":"각종 침법","t":"체질침법의 원리를 알고 시술법을 습득한다.","m":"이 성취기준은 체질에 따른 특성을 분류하고 그에 따른 적절한 시술처방을 적용할 수 있도록 설정하였다. 체질침법의 원리를 알고 다양한 체질 감별 방법을 익힘으로써 체질에 따른 병증별 처방 구성 원리, 체질별 특징 및 시술 방법 등을 습득하는 데 중점을 둔다.","n":[],"p":795,"b":2},{"c":"[12침구05-02]","k":"선택","sk":"전문 교과(이료)","s":"침구","g":"고등학교 1~3학년","d":"각종 침법","t":"촉진을 활용한 오행침법의 원리를 알고 시술에 활용한다.","m":"이 성취기준은 촉진을 활용한 오행침법, 촉진을 활용한 오행침법 적용하기 등의 내용을 다룬다. 촉진을 활용한 오행침법의 원리 및 맥과 증의 진단법을 알고 6장 6부와 증상의 허실을 파악하여 시술에 활용하는 데 중점을 둔다.","n":[],"p":795,"b":2},{"c":"[12침구05-03]","k":"선택","sk":"전문 교과(이료)","s":"침구","g":"고등학교 1~3학년","d":"각종 침법","t":"문진을 활용한 오행침법의 원리를 알고 시술에 적용한다.","m":"이 성취기준은 목, 화, 토, 금, 수의 오행적 속성을 인체에 대입한 오행 원리를 인체의 각 기관, 장부, 주체 등은 물론 병증에까지 적용하여 시술 원리를 파악할 수 있도록 설정하였다. 오행혈의 시술 원리 익히기, 오행혈의 중요성 인식 등의 내용을 다룬다. 오행혈의 특징을 알고 관계와 속성을 이용하여 병증에 적용하는 데 중점을 둔다. 이 성취기준은 문진을 활용한 오행침법, 문진을 활용한 오행침법 적용하기, 오행침법을 통한 건강한 삶의 추구 등의 내용을 다룬다. 세밀한 질문을 통해 장부의 주요 증상을 전반적으로 파악하고 장부의 허실을 명확하게 구분하며 오행침을 적용하여 건강한 삶을 추구하는 데 중점을 둔다.","n":[],"p":795,"b":2},{"c":"[12침구05-04]","k":"선택","sk":"전문 교과(이료)","s":"침구","g":"고등학교 1~3학년","d":"각종 침법","t":"기혈 침법의 특징을 알고 상통 원리를 이해한다.","m":"이 성취기준은 정, 형, 수, 경, 합의 오수혈 원리를 인체에 대입하여 시술 원리를 파악할 수 있도록 설정하였다. 오수혈의 시술 원리 익히기, 오수혈의 중요성 인식 등의 내용을 다룬다. 오수혈의 구성 요소를 구분하고 특성을 이용하여 병증에 적용하는 데 중점을 둔다. 이 성취기준은 시술 효과를 높일 수 있는 기혈의 특성을 파악하고 상통원리 등을 습득할 수 있도록 설정하였다. 기혈 침법의 특징, 기혈 침법의 원리 탐색하기 등의 내용을 다룬다. 기혈 침법의 특징과 평보평사법을 알고 대응과 상통 원리를 익힘으로써 대응이론, 경락상통, 경혈대응, 장부별통, 오체대응 방법 등을 이해하는 데 중점을 둔다.","n":[],"p":796,"b":2},{"c":"[12침구05-05]","k":"선택","sk":"전문 교과(이료)","s":"침구","g":"고등학교 1~3학년","d":"각종 침법","t":"처방 구성 원리를 알고 시술법을 익힌다.","m":"이 성취기준은 기혈 침법의 응용과 대응을 통해 병증의 해석 및 시술 방침을 정할 수 있도록 설정하였다. 기혈 침법의 시술 원리, 기혈 침법의 처방 구성 원리 탐구하기 등의 내용을 다룬다. 기혈 침법의 전식론, 태극 이론, 취혈 원칙을 알고 상대평형점을 찾는 원리를 파악하여 시술법을 익히는 데 중점을 둔다.","n":[],"p":796,"b":2},{"c":"[12침구05-06]","k":"선택","sk":"전문 교과(이료)","s":"침구","g":"고등학교 1~3학년","d":"각종 침법","t":"기혈 침법의 유용한 처방을 알고 주치증을 파악한다.","m":"이 성취기준은 기혈 침법에서 유용하게 쓰이는 주요혈의 취혈 및 주치증을 적용할 수 있도록 설정하였다. 기혈 침법의 주요혈, 기혈 침법의 주요혈 조사하기, 기혈 침법을 중시하는 가치관 등의 내용을 다룬다. 기혈 침법의 취혈법을 알고 주요혈의 혈위와 주치증을 조사하여 기혈 침법의 활용 능력을 기르는 데 중점을 둔다.","n":[],"p":796,"b":2},{"c":"[12침구05-07]","k":"선택","sk":"전문 교과(이료)","s":"침구","g":"고등학교 1~3학년","d":"각종 침법","t":"두침법의 원리를 알고 시술법을 탐색한다.","m":"이 성취기준은 두부의 대응점과 효과의 연관성을 파악하고 대응점을 자극하여 전신을 대상으로 시술할 수 있도록 설정하였다. 두침법, 두침법 탐색하기 등의 내용을 다룬다. 두침법의 이론적 배경을 알고 두침 자극구와 주치증을 이용한 자침법을 탐색하는 데 중점을 둔다.","n":[],"p":797,"b":2},{"c":"[12침구05-08]","k":"선택","sk":"전문 교과(이료)","s":"침구","g":"고등학교 1~3학년","d":"각종 침법","t":"이침법의 원리를 알고 시술법을 탐구한다.","m":"이 성취기준은 이부의 대응점과 효과의 연관성을 파악하고 대응점을 자극하여 전신을 대상으로 시술할 수 있도록 설정하였다. 이침법, 이침법 탐구하기 등의 내용을 다룬다. 이침법의 정의와 특징을 알고 부위별 명칭을 바탕으로 이혈과 주치증을 이용한 자침법을 탐구하는 데 중점을 둔다.","n":[],"p":797,"b":2},{"c":"[12침구05-09]","k":"선택","sk":"전문 교과(이료)","s":"침구","g":"고등학교 1~3학년","d":"각종 침법","t":"수지침법의 상응요법, 복진법, 음양맥진법을 알고 시술에 적용한다.","m":"이 성취기준은 수부의 대응점과 효과의 연관성을 파악하고 대응점을 자극하여 전신을 대상으로 시술할 수 있도록 설정하였다. 수지침법, 수지침법 적용하기, 침술의 활용 능력 신장 등의 내용을 다룬다. 수지침법의 개념과 원리를 알고 상응요법, 복진법 및 음양맥진법을 시술에 적용하여 침술의 활용 능력을 기르는 데 중점을 둔다.","n":[],"p":797,"b":2},{"c":"[12이임01-01]","k":"선택","sk":"전문 교과(이료)","s":"이료임상","g":"고등학교 1~3학년","d":"이료임상 기초","t":"치료법의 정의를 알고 기준에 따라 분류한다.","m":"이 성취기준은 치료법을 정의하기 위해 명확한 기준이 필요함을 이해하고 치료법을 기준에 따라 정의할 수 있도록 설정하였다. 치료법의 이해, 치료법 구분하기 등의 내용을 다룬다. 치료법의 정의와 분류를 파악하고 질환과 증상에 따라 치료법을 적절하게 분류하는 능력을 기르는 데 중점을 둔다.","n":[],"p":808,"b":2},{"c":"[12이임01-02]","k":"선택","sk":"전문 교과(이료)","s":"이료임상","g":"고등학교 1~3학년","d":"이료임상 기초","t":"치료법을 구분하고 질환별로 탐구한다.","m":"이 성취기준은 치료법을 구분하고 파악하기 위해 다양한 질병과의 관계와 적용 과정을 이해하고 질병과 치료의 과정은 예시를 통해 탐구함으로써 치료법을 파악할 수 있도록 설정하였다. 치료법 구분하기, 질환별 치료법 탐구하기 등의 내용을 다룬다. 사례를 통해 치료법을 구분하고 탐구하는 능력을 기르는 데 중점을 둔다.","n":[],"p":808,"b":2},{"c":"[12이임01-03]","k":"선택","sk":"전문 교과(이료)","s":"이료임상","g":"고등학교 1~3학년","d":"이료임상 기초","t":"이료술의 정의를 알고 분류한다.","m":"이 성취기준은 신체에 물리적 자극을 가하여 병증의 회복과 건강을 증진시키는 요법으로서 이료술을 정의하고 분류함으로써 이료술을 이해할 수 있도록 설정하였다. 이료술의 이해, 이료술의 치료법 탐구하기 등의 내용을 다룬다. 이료술의 정의와 종류를 파악하여 이료술을 올바르게 인식하고 분류하는 능력을 기르는 데 중점을 둔다.","n":[],"p":809,"b":2},{"c":"[12이임01-04]","k":"선택","sk":"전문 교과(이료)","s":"이료임상","g":"고등학교 1~3학년","d":"이료임상 기초","t":"수기요법과 자극요법을 비교하고 치료법을 탐구한다.","m":"이 성취기준은 이료술의 수기요법과 자극요법을 이해하고 치료법과 효과 등을 비교하여 치료법의 특성을 파악할 수 있도록 설정하였다. 수기요법과 자극요법 비교하기, 이료술의 치료법 탐구하기 등의 내용을 다룬다. 수기요법과 자극요법을 비교하여 그 성격에 맞게 치료법을 탐구하고 임상에 적용하는 능력을 기르는 데 중점을 둔다.","n":[],"p":809,"b":2},{"c":"[12이임02-01]","k":"선택","sk":"전문 교과(이료)","s":"이료임상","g":"고등학교 1~3학년","d":"운동계통 질환","t":"관절질환의 정의와 종류를 파악하고 원인, 증상, 요법을 이해한다.","m":"이 성취기준은 관절질환의 원인과 증상을 파악하고 동서 의학의 관점에서 치료 가능한 요법을 탐색하여 적용할 수 있도록 설정하였다. 관절질환의 개요, 관절질환의 원인, 증상, 요법 등의 내용을 다룬다. 관절질환의 정의와 종류를 파악하고 원인, 증상, 요법을 이해하여 관절질환 치료에 필요한 정보를 습득하고 임상에 적용하는 능력을 기르는 데 중점을 둔다.","n":[],"p":810,"b":2},{"c":"[12이임02-02]","k":"선택","sk":"전문 교과(이료)","s":"이료임상","g":"고등학교 1~3학년","d":"운동계통 질환","t":"관절질환의 진단법을 알고 치료법을 익힌다.","m":"이 성취기준은 동양 의학의 음양, 오행, 경락과 경혈과 서양 의학의 병증의 관점으로 관절질환을 진단하고 적합한 치료법을 선택하여 치료할 수 있도록 설정하였다. 관절질환 진단하기, 관절질환 치료법 익히기 등의 내용을 다룬다. 관절질환을 타 질환과 감별하고 동서 의학적 단서와 정보를 통해 진단하는 능력을 기르며 적합한 수기요법과 자극요법을 선택하여 치료법을 익히는 데 중점을 둔다.","n":[],"p":810,"b":2},{"c":"[12이임02-03]","k":"선택","sk":"전문 교과(이료)","s":"이료임상","g":"고등학교 1~3학년","d":"운동계통 질환","t":"관절질환의 예후를 인식하고 임상에 적용한다.","m":"이 성취기준은 관절질환의 예후를 파악하여 임상에 활용하고 가정에서 관절질환의 예방법을 익혀 실천할 수 있도록 설정하였다. 관절질환 치료법 임상에 적용하기, 관절질환 예후 인식과 예방법 등의 내용을 다룬다. 일상생활에서 관절질환을 조기에 발견하고 적절한 치료 시기 등을 파악하여 잠재적인 문제나 질환, 그로 인한 후유증 등을 피하거나 최소화하는 방법을 탐색하는 데 중점을 둔다.","n":[],"p":810,"b":2},{"c":"[12이임02-04]","k":"선택","sk":"전문 교과(이료)","s":"이료임상","g":"고등학교 1~3학년","d":"운동계통 질환","t":"근육질환의 정의와 종류를 파악하고 원인, 증상, 요법을 이해한다.","m":"이 성취기준은 근육질환의 원인, 증상을 파악하고 동서 의학의 관점에서 치료 가능한 요법을 탐색하여 적용할 수 있도록 설정하였다. 근육질환의 개요, 원인, 증상, 요법 등의 내용을 다룬다. 근육질환의 정의와 종류를 파악하고 원인, 증상, 요법을 이해하여 근육질환 치료에 필요한 정보를 습득하고 임상에 적용하는 능력을 기르는 데 중점을 둔다.","n":[],"p":811,"b":2},{"c":"[12이임02 ","g":"고등학교 1~3학년","d":"노화와 이료","t":"노화의 정의를 파악하고 노인의학의 특징을 이해한다.","m":"이 성취기준은 광의적 노화와 의학적 노화의 정의를 파악하여 효과적으로 대처하고 노화와 노인병을 다루는 노인의학의 특성과 중요성을 이해할 수 있도록 설정하였다. 노화의 이해, 노인의학 분야 조사하기 등의 내용을 다룬다. 노화의 정의와 원인에 따라 특징을 이해하고 노인의학에 대한 개념을 파악하는 데 중점을 둔다.","n":[],"p":827,"b":2},{"c":"[12이임08-02]","k":"선택","sk":"전문 교과(이료)","s":"이료임상","g":"고등학교 1~3학년","d":"노화와 이료","t":"노년기의 생리 현상을 탐구하고 건강과 비교한다.","m":"이 성취기준은 노화가 진행됨에 따라 일어나는 신체의 불균형, 퇴행성 변화 등의 생리 현상을 파악하고 건강의 정의를 이해하여 노화와 비교함으로써 대처할 수 있도록 설정하였다. 노년기의 생리 현상 탐구하기, 노화와 건강 등의 내용을 다룬다. 노인의 계통별 질환을 비교하고 노화를 예방하여 건강을 유지하는 방법을 모색하는 데 중점을 둔다.","n":[],"p":827,"b":2},{"c":"[12이임08-03]","k":"선택","sk":"전문 교과(이료)","s":"이료임상","g":"고등학교 1~3학년","d":"노화와 이료","t":"노인 건강 관리를 이해하고 이료술의 역할을 탐색한다.","m":"이 성취기준은 노화에 따른 생리 현상에 대처하고 예방하는 관리 능력을 기르고 노인 건강 관리에 필요한 이료술을 탐색하여 활용할 수 있도록 설정하였다. 노인 건강 관리의 이해, 노인 건강 관리를 위한 이료술의 역할 탐색하기 등의 내용을 다룬다. 건강과 노화의 개념, 특성을 파악하고 이료술의 목적, 효과 등을 적용하여 효율적인 이료술을 선택할 수 있는 능력을 기르는 데 중점을 둔다.","n":[],"p":827,"b":2},{"c":"[12이임08-04]","k":"선택","sk":"전문 교과(이료)","s":"이료임상","g":"고등학교 1~3학년","d":"노화와 이료","t":"노인병의 특성을 이해하고 진단⋅치료법을 익힌다.","m":"이 성취기준은 노인병의 특성을 파악하여 여러 단서를 통해 진단하고 적절한 치료법을 선택하여 적용할 수 있도록 설정하였다. 노인병, 노인병 진단⋅치료법 익히기 등의 내용을 다룬다. 노인병의 특성을 파악하여 노인병 치료에 필요한 정보를 습득하고 진단과 치료법을 임상에 적용할 수 있는 능력을 기르는 데 중점을 둔다.","n":[],"p":827,"b":2},{"c":"[12진단01-01]","k":"선택","sk":"전문 교과(이료)","s":"진단","g":"고등학교 1~3학년","d":"진단의 기초","t":"진단의 정의를 이해하고 종류를 구분한다.","m":"이 성취기준은 진단의 정의와 의미를 이해하고 각종 병증을 진단하기 위하여 사용되는 다양한 진단법 종류를 파악하여 진단 과정에서 적용하도록 설정하였다. 진단의 정의와 종류에 따른 임상 적용 사례를 익힘으로써 효과적인 진단이 이루어지도록 하는 데 중점을 둔다.","n":[],"p":838,"b":2},{"c":"[12진단01-02]","k":"선택","sk":"전문 교과(이료)","s":"진단","g":"고등학교 1~3학년","d":"진단의 기초","t":"진단의 목적을 알고 주의 사항을 파악한다.","m":"이 성취기준은 진단을 시행하는 이유와 취지를 이해하고 안전하고 효과적인 진단이 이루어지기 위한 주의 사항을 숙지하도록 설정하였다. 진단의 목적, 진단 과정의 주의 사항 조사하기 등의 요소를 다룬다. 진단의 필요성을 확인하고 임상 과정에서 효과적인 진단이 시행되도록 하는 데 중점을 둔다.","n":[],"p":838,"b":2},{"c":"[12진단01-03]","k":"선택","sk":"전문 교과(이료)","s":"진단","g":"고등학교 1~3학년","d":"진단의 기초","t":"진단의 시행 절차를 확인하고 이료인으로서 바른 몸가짐을 실천한다.","m":"이 성취기준은 진단 시행 절차를 이해하고 신속하고 정확한 방법에 의해 순서대로 진단이 이루어지도록 설정하였다. 진단의 절차 조사하기, 이료인으로서의 바른 몸가짐 실천 등의 요소를 다룬다. 진단 과정에서 발생할 수 있는 다양한 문제 상황에 대처하고 신속하고 정확한 진단이 이루어지도록 하는 데 중점을 둔다.","n":[],"p":838,"b":2},{"c":"[12진단01-04]","k":"선택","sk":"전문 교과(이료)","s":"진단","g":"고등학교 1~3학년","d":"진단의 기초","t":"시술기록부의 주요 내용을 이해하고 시술기록부를 작성한다.","m":"이 성취기준은 진단을 통해 얻은 정보는 시술의 지속성과 일관성 유지를 위하여 기록되며 이러한 시술기록부 작성을 통해 주요 시술 내용이 체계적으로 관리되도록 설정하였다. 시술기록부의 정의와 목적, 시술기록부 작성하기 등의 요소를 다룬다. 시술기록부의 개념과 특성을 이해하고 시술기록부를 작성할 때 고려해야 할 사항을 인식하여 직접 시술기록부를 작성하는 데 중점을 둔다.","n":[],"p":839,"b":2},{"c":"[12진단01-05]","k":"선택","sk":"전문 교과(이료)","s":"진단","g":"고등학교 1~3학년","d":"진단의 기초","t":"시술기록부 작성을 습관화하고 시술 자료를 임상에 활용한다.","m":"이 성취기준은 기록된 시술 자료는 임상에 활용되고 누적된 시술 자료를 통해 효과적인 진단이 가능하다는 점을 인식하여 시술기록부 작성을 습관화하도록 설정하였다. 시술기록부 활용하기, 시술기록부 작성 습관화 등의 요소를 다룬다. 시술기록의 특성을 이해하고 시술 자료를 임상에 활용하는 방법을 파악하여 시술기록부 작성을 습관화하는 데 중점을 둔다.","n":[],"p":839,"b":2},{"c":"[12진단02-01]","k":"선택","sk":"전문 교과(이료)","s":"진단","g":"고등학교 1~3학년","d":"문진","t":"문진의 정의를 이해하고 한계를 파악한다.","m":"이 성취기준은 문답을 통해 빠르고 정확한 진단이 가능하다는 것을 인식하여 문진의 의미와 한계를 파악하도록 설정하였다. 문진의 정의, 문진의 한계 조사하기 등의 요소를 다룬다. 문진의 정의와 특성을 이해하고 문진의 의미와 목적을 인식하여 문진이 갖는 한계를 극복하기 위한 방법을 찾아 문진의 단점을 보완하도록 한다.","n":[],"p":840,"b":2},{"c":"[12진단02-02]","k":"선택","sk":"전문 교과(이료)","s":"진단","g":"고등학교 1~3학년","d":"문진","t":"문진의 주의 사항을 확인하고 타인과의 협력적 소통 능력을 기른다.","m":"이 성취기준은 문진을 효과적으로 수행하려면 주의 사항을 숙지하고 피술자와 원활한 의사소통이 이루어질 수 있는 능력을 갖추도록 설정하였다. 문진의 주의 사항 조사하기, 타인과의 협력적 소통 등의 요소를 다룬다. 문진의 주의 사항을 숙지하고 의사소통의 중요성을 인식하여 정확하고 효율적인 문진이 시행되도록 하는 데 중점을 둔다.","n":[],"p":840,"b":2},{"c":"[12진단02-03]","k":"선택","sk":"전문 교과(이료)","s":"진단","g":"고등학교 1~3학년","d":"문진","t":"문진 시행 과정을 이해하고 피술자의 개인 정보를 보호한다.","m":"이 성취기준은 일정한 절차에 의해 이루어지는 문진 과정에서 취득한 개인 정보를 안전하게 관리하고 보호하는 것을 익히도록 설정하였다. 문진 적용하기, 개인 정보 보호 등의 요소를 다룬다. 문진 절차를 파악하여 지키도록 하고 취득한 개인 정보를 유의하여보호하는 데 중점을 둔다.","n":[],"p":841,"b":2},{"c":"[12진단02-04]","k":"선택","sk":"전문 교과(이료)","s":"진단","g":"고등학교 1~3학년","d":"문진","t":"문진 사항을 이해하고 임상에 적용한다.","m":"이 성취기준은 문진 시 다루어야 할 문진 사항을 이해하여 임상에서 적용하도록 설정하였다. 주소, 현 병력, 과거력, 가족력, 문진 적용하기 등의 요소를 다룬다. 문진 사항에 관한 개념과 특성을 이해하고 임상 적용 능력을 기르는 데 중점을 둔다.","n":[],"p":841,"b":2},{"c":"[12진단03-01]","k":"선택","sk":"전문 교과(이료)","s":"진단","g":"고등학교 1~3학년","d":"촉진과 압진","t":"촉진과 압진의 정의를 이해하고 한계를 파악한다.","m":"이 성취기준은 촉진과 압진의 의미를 이해하여 촉진과 압진 시행 과정에서 나타나는 한계를 파악하도록 설정하였다. 촉진과 압진의 정의, 촉진과 압진의 한계 조사하기등의 요소를 다룬다. 촉진과 압진의 개념과 특성을 이해하고 촉진과 압진의 의미와 한계를 확인하는 데 중점을 둔다.","n":[],"p":841,"b":2},{"c":"[12진단03-02]","k":"선택","sk":"전문 교과(이료)","s":"진단","g":"고등학교 1~3학년","d":"촉진과 압진","t":"촉진과 압진의 주의 사항을 확인하고 위생관리에 대한 인식을 기른다.","m":"이 성취기준은 촉진과 압진의 시행 절차를 이해하고 손과 환부를 위생적으로관리하도록 설정하였다. 촉진과 압진의 주의 사항 조사하기, 손과 환부의 위생관리 습관화 등의 요소를 다룬다. 촉진과 압진의 주의 사항을 이해하고 촉진과 압진을 시행할 때 지켜야 할 위생관리에 대한 인식을 높이는 데 중점을 둔다.","n":[],"p":841,"b":2},{"c":"[12진단03-03]","k":"선택","sk":"전문 교과(이료)","s":"진단","g":"고등학교 1~3학년","d":"촉진과 압진","t":"맥진의 정의를 이해하고 동⋅서양 협진의 필요성을 인식한다.","m":"이 성취기준은 맥진은 심장의 박동이 체표에서 나타나는 것으로 맥진의 의미를 이해하고 동⋅서양 맥진의 특징과 상호 보완성을 인식하도록 설정하였다. 맥진의 정의, 동서 의학 협진 추구 등의 요소를 다룬다. 맥진의 정의와 특징을 이해하고 진단에서 맥진이 갖는 성격과 동⋅서양 맥진의 특징을 비교하는 데 중점을 둔다.","n":[],"p":842,"b":2},{"c":"[12진단03-04]","k":"선택","sk":"전문 교과(이료)","s":"진단","g":"고등학교 1~3학년","d":"촉진과 압진","t":"맥진의 성상을 알고 임상에 적용한다.","m":"이 성취기준은 맥진의 종류에 따른 성상을 이해하여 각종 병증을 진단하는 데 활용하도록 설정하였다. 맥진의 종류, 맥진 적용하기 등의 요소를 다룬다. 동⋅서양 맥진의 성상과 종류에 따른 특성을 비교하고 임상 적용 가능성을 탐색하는 데 중점을 둔다.","n":[],"p":842,"b":2},{"c":"[12진단03-05]","k":"선택","sk":"전문 교과(이료)","s":"진단","g":"고등학교 1~3학년","d":"촉진과 압진","t":"흉⋅복부 촉진 사항을 이해하고 신체 접촉에 유의한다.","m":"이 성취기준은 흉부와 복부 촉진 사항을 이해하고 신체 접촉에 유의하여 진단에 임하도록 설정하였다. 흉⋅복부 촉진의 정의와 종류, 신체 접촉에 따른 유의 사항 내면화 등의 요소를 다룬다. 흉⋅복부 촉진의 개념과 특성을 이해하고 촉진 방법의 임상 적용 가능성을 탐색하는 데 중점을 둔다.","n":[],"p":843,"b":2},{"c":"[12진단03-06]","k":"선택","sk":"전문 교과(이료)","s":"진단","g":"고등학교 1~3학년","d":"촉진과 압진","t":"흉⋅복부 압진점을 확인하고 임상에 적용한다.","m":"이 성취기준은 흉⋅복부 압진점을 확인하고 압진점에서 나타나는 압통과 연관된 병증을 진단하도록 설정하였다. 흉⋅복부 압진점의 정의와 종류, 내장의 압진점 조사하기 등의 요소를 다룬다. 흉강과 복강 내 압진점을 파악하여 진단에 적용하는 데 중점을 둔다.","n":[],"p":843,"b":2},{"c":"[12진단03-07]","k":"선택","sk":"전문 교과(이료)","s":"진단","g":"고등학교 1~3학년","d":"촉진과 압진","t":"촉진할 기타 신체 부위 위치를 확인하고 신체 접촉에 유의한다.","m":"이 성취기준은 근골격 계통과 림프절, 갑상선, 타액선 등의 다양한 신체 촉진부위를 찾고 촉진 시 신체 접촉에 유의하여 진단에 임하도록 설정하였다. 기타 부위 촉진, 신체 접촉에 따른 유의 사항 내면화 등의 요소를 다룬다. 신체 촉진 부위를 선별하고 촉진을 시행할 때 피술자와의 신체 접촉 주의에 중점을 둔다.","n":[],"p":843,"b":2},{"c":"[12진단03-08]","k":"선택","sk":"전문 교과(이료)","s":"진단","g":"고등학교 1~3학년","d":"촉진과 압진","t":"기타 부위 촉진 사항을 파악하고 임상에 적용한다.","m":"이 성취기준은 근골격 계통과 림프절, 갑상선, 타액선 등 체표에서 촉진 가능한 부위를 찾아 진단에 활용하도록 설정하였다. 기타 부위 촉진, 기타 부위 촉진 적용하기 등의 요소를 다룬다. 부위별 촉진의 성격을 이해하여 촉진을 통해 얻을 수 있는 정보를 진단에 활용하는 데 중점을 둔다.","n":[],"p":843,"b":2},{"c":"[12진단04-01]","k":"선택","sk":"전문 교과(이료)","s":"진단","g":"고등학교 1~3학년","d":"시진","t":"시진의 정의를 이해하고 한계를 파악한다.","m":"이 성취기준은 관찰을 통해 신체 표면에 나타난 병증에 대한 정보를 얻어 진단에 활용한다는 것을 이해하고 시진의 특성과 한계를 파악하도록 설정하였다. 시진의 정의, 시진의 한계 조사하기 등의 요소를 다룬다. 시진의 정의와 특성을 이해하고 시진의 의미와 목적을 인식하여 시진이 갖는 한계를 극복하기 위한 방법을 찾아 시진의 단점을 보완하도록 한다.","n":[],"p":844,"b":2},{"c":"[12진단04-02]","k":"선택","sk":"전문 교과(이료)","s":"진단","g":"고등학교 1~3학년","d":"시진","t":"시진의 주의 사항을 확인하고 비장애인과의 협력적 소통 태도를 기른다.","m":"이 성취기준은 시진 과정에서 지켜야 할 주의 사항을 이해하고 비장애인의 도움을 받아 협력적 시진이 이루어지는 과정을 파악하여 원활한 시진이 시행되도록 설정하였다. 시진의 주의 사항 조사하기, 비장애인과의 협력적 소통 등의 요소를 다룬다. 시진의 주의 사항에 관한 특성을 파악하고 시진 수행 과정에서 지켜야 할 준수 사항을 익히는 데 중점을 둔다.","n":[],"p":844,"b":2},{"c":"[12진단04-03]","k":"선택","sk":"전문 교과(이료)","s":"진단","g":"고등학교 1~3학년","d":"시진","t":"체질 시진 사항을 파악하고 임상에 적용한다.","m":"이 성취기준은 전신 시진에서 체질에 따른 신체 이상을 관찰하고 체질 유형별특성을 감별하여 진단에 활용하도록 설정하였다. 체질, 전신 시진 조사하기 등의 요소를 다룬다. 이상 체질의 종류와 특징 및 차이점을 비교하고 분석하여 임상에 활용하는 데 중점을 둔다.","n":[],"p":845,"b":2},{"c":"[12진단04-04]","k":"선택","sk":"전문 교과(이료)","s":"진단","g":"고등학교 1~3학년","d":"시진","t":"보행과 체위 시진 사항을 확인하고 임상에 적용한다.","m":"이 성취기준은 전신 시진에서 보행과 체위에 따른 신체 이상을 관찰하고 보행과 체위 유형별 특성을 감별하여 진단에 활용하도록 설정하였다. 보행과 체위, 전신 시진 조사하기 등의 요소를 다룬다. 병적 보행과 체위에 대한 외형과 특징을 파악하여 질환별, 병증별 이상 여부를 식별하는 데 중점을 둔다.","n":[],"p":845,"b":2},{"c":"[12진단04-05]","k":"선택","sk":"전문 교과(이료)","s":"진단","g":"고등학교 1~3학년","d":"시진","t":"피부와 영양 시진 사항을 파악하고 임상에 적용한다.","m":"이 성취기준은 전신 시진에서 피부와 영양에 따른 신체 이상을 관찰하고 피부와 영양 유형별 특성을 감별하여 진단에 활용하도록 설정하였다. 피부와 영양, 전신 시진 조사하기 등의 요소를 다룬다. 피부와 영양 상태에 따른 신체 변화 양상을 진단에 적용하는 데 중점을 둔다.","n":[],"p":845,"b":2},{"c":"[12진단04-06]","k":"선택","sk":"전문 교과(이료)","s":"진단","g":"고등학교 1~3학년","d":"시진","t":"체간 시진 사항을 파악하고 임상에 적용한다.","m":"이 성취기준은 국소 시진에서 체간에 대한 신체 이상을 관찰하고 체간 부위별 특성을 파악하여 진단에 활용하도록 설정하였다. 체간, 국소 시진 조사하기 등의 요소를다룬다. 국소 시진 대상이 되는 두부, 경부, 흉부, 복부, 둔부 등의 특성을 이해하고 체간 시진의 임상 적용 가능성을 탐색하는 데 중점을 둔다.","n":[],"p":846,"b":2},{"c":"[12진단04-07]","k":"선택","sk":"전문 교과(이료)","s":"진단","g":"고등학교 1~3학년","d":"시진","t":"체지 시진 사항을 확인하고 임상에 적용한다.","m":"이 성취기준은 국소 시진에서 체지에 대한 신체 이상을 관찰하고 체지 부위별 특성을 파악하여 진단에 활용하도록 설정하였다. 체지, 국소 시진 조사하기 등의 요소를 다룬다. 국소 시진 대상이 되는 상지와 하지에 관한 특성을 이해하고 체지 시진의 임상 적용 가능성을 높이는 데 중점을 둔다.","n":[],"p":846,"b":2},{"c":"[12진단05-01]","k":"선택","sk":"전문 교과(이료)","s":"진단","g":"고등학교 1~3학년","d":"측진","t":"측진의 정의를 이해하고 한계를 파악한다.","m":"이 성취기준은 신체에 대한 구체적인 수치를 확인하고 측진의 특성과 한계를파악하도록 설정하였다. 측진의 정의, 측진의 한계 조사하기 등의 요소를 다룬다. 측진의 정의와 특성을 이해하고 측진의 의미와 목적을 인식하여 측진이 갖는 한계를 극복하기 위한 방법을 찾아 측진의 단점을 보완하는 데 중점을 둔다.","n":[],"p":846,"b":2},{"c":"[12진단05-02]","k":"선택","sk":"전문 교과(이료)","s":"진단","g":"고등학교 1~3학년","d":"측진","t":"측진 기구의 활용성을 확인하고 종류를 구분한다.","m":"이 성취기준은 다양한 측진 기구 사용을 통해 신체 이상을 파악하고 측진 정보를 종합하여 임상에 적용하도록 설정하였다. 측진 기구 종류 구분하기, 측진 기구의 활용성 내면화 등의 요소를 다룬다. 측진 기구의 종류를 파악하고 측진 목적과 신체 부위에 따라 사용하는 측진 기구 사용법을 확인하는 데 중점을 둔다.","n":[],"p":846,"b":2},{"c":"[12진단05-03]","k":"선택","sk":"전문 교과(이료)","s":"진단","g":"고등학교 1~3학년","d":"측진","t":"체온을 측정하고 체온 변화의 임상적 의미를 파악한다.","m":"이 성취기준은 체온 변화에 따른 임상적 의미를 이해하여 진단에 활용하도록설정하였다. 체온, 측진 적용하기 등의 요소를 다룬다. 체온의 개념과 특성을 이해하고 체온 변화의 임상적 의미를 인식하여 진단에 활용하는 데 중점을 둔다.","n":[],"p":847,"b":2},{"c":"[12진단05-04]","k":"선택","sk":"전문 교과(이료)","s":"진단","g":"고등학교 1~3학년","d":"측진","t":"혈압을 측정하고 혈압 변화의 임상적 의미를 파악한다.","m":"이 성취기준은 혈압 변화에 따른 임상적 의미를 이해하여 진단에 활용하도록설정하였다. 혈압, 측진 적용하기 등의 요소를 다룬다. 혈압의 개념과 특성을 이해하고 혈압 변화의 임상적 의미를 인식하여 진단에 활용하는 데 중점을 둔다.","n":[],"p":847,"b":2},{"c":"[12진단05-05]","k":"선택","sk":"전문 교과(이료)","s":"진단","g":"고등학교 1~3학년","d":"측진","t":"호흡을 측정하고 호흡 변화의 임상적 의미를 파악한다.","m":"이 성취기준은 호흡 변화에 따른 임상적 의미를 이해하여 진단에 활용하도록설정하였다. 호흡, 측진 적용하기 등의 요소를 다룬다. 호흡의 개념과 특성을 이해하고 호흡 변화의 임상적 의미를 인식하여 진단에 활용하는 데 중점을 둔다.","n":[],"p":847,"b":2},{"c":"[12진단06-01]","k":"선택","sk":"전문 교과(이료)","s":"진단","g":"고등학교 1~3학년","d":"이학적 도수검사","t":"이학적 도수검사의 정의를 이해하고 건강한 자세를 유지하도록 실천한다.","m":"이 성취기준은 이학적 도수검사를 통해 신체 각 부위의 병증을 진단하고 건강 관리를 위한 올바른 자세 유지의 필요성을 인식하도록 설정하였다. 이학적 도수검사의 정의, 건강한 자세의 실천 등의 요소를 다룬다. 이학적 도수검사의 정의와 목적을 이해하고 올바른 자세 유지 실천의 중요성을 인식하는 데 중점을 둔다.","n":[],"p":848,"b":2},{"c":"[12진단06-02]","k":"선택","sk":"전문 교과(이료)","s":"진단","g":"고등학교 1~3학년","d":"이학적 도수검사","t":"이학적 도수검사의 주의 사항을 확인하고 주요 절차를 익힌다.","m":"이 성취기준은 이학적 도수검사를 시행할 때 주의 사항을 숙지하여 안전하고효과적인 검사가 수행되도록 설정하였다. 이학적 도수검사 절차, 이학적 도수검사의 주의 사항 조사하기 등의 요소를 다룬다. 이학적 도수검사의 절차를 파악하고 수행 과정에서의 유의점을 고려하는 데 중점을 둔다.","n":[],"p":848,"b":2},{"c":"[12진단06-03]","k":"선택","sk":"전문 교과(이료)","s":"진단","g":"고등학교 1~3학년","d":"이학적 도수검사","t":"질환별 이학적 도수검사의 적응 질환을 확인하고 자세별 신체 반응을 파악한다.","m":"이 성취기준은 경견완증후군, 흉곽출구증후군, 견관절주위염, 요통과 좌골신경통, 상지와 하지 통증 등의 질환별 이학적 도수검사 적응 질환을 이해하여 신체 반응을 파악하도록 설정하였다. 이학적 도수검사의 특성, 자세별 신체 반응의 내면화 등의 요소를 다룬다. 경견완증후군, 흉곽출구증후군, 견관절주위염, 요통과 좌골신경통, 상지와 하지 통증 등의 질환별 이학적 도수검사 적응 질환과 신체 반응을 이해하고 임상 적용 가능성을 탐색하는 데 중점을 둔다.","n":[],"p":849,"b":2},{"c":"[12진단06-04]","k":"선택","sk":"전문 교과(이료)","s":"진단","g":"고등학교 1~3학년","d":"이학적 도수검사","t":"질환별 이학적 도수검사의 시행 방법을 이해하고 임상에 적용한다.","m":"이 성취기준은 경견완증후군, 흉곽출구증후군, 견관절주위염, 요통과 좌골신경통, 상지와 하지 통증 등의 이학적 도수검사 수행 방법을 숙지하여 임상에 적용하도록 설정하였다. 이학적 도수검사의 절차, 질환별 이학적 도수검사 적용하기 등의 요소를 다룬다. 경견완증후군, 흉곽출구증후군, 견관절주위염, 요통과 좌골신경통, 상지와 하지 통증 등의 질환별 이학적 도수검사 수행 방법을 파악하고 효과적인 검사가 수행되도록 임상 적용 가능성을 높이는 데 중점을 둔다.","n":[],"p":849,"b":2},{"c":"[12진단07-01]","k":"선택","sk":"전문 교과(이료)","s":"진단","g":"고등학교 1~3학년","d":"통증유발점검사","t":"통증유발점검사의 정의를 이해하고 통증의 양상을 파악한다.","m":"이 성취기준은 통증유발점검사의 목적과 의미를 이해하고 통증의 양상과 특징을 파악하여 임상에 적용하도록 설정하였다. 통증유발점검사의 정의, 통증유발점의 특징 지각 등의 요소를 다룬다. 통증유발점검사의 개념과 특성을 이해하고 통증의 양상에 기초한 임상 적용 가능성에 중점을 둔다.","n":[],"p":850,"b":2},{"c":"[12진단07-02]","k":"선택","sk":"전문 교과(이료)","s":"진단","g":"고등학교 function expandSyn(words,qNorm){
  const out=[];const seen=new Set(words);
  const consider=(k)=>{const v=SYN[k];if(!v)return;for(const s of v){for(const t of s.match(WORD_RE)||[]){const st=stem(t);if(st.length>=2&&!seen.has(st)){seen.add(st);out.push(st);}}}};
  const flat=qNorm.replace(/\s+/g,'');
  for(const k of Object.keys(SYN)){ if(k.length>=2 && (flat.includes(k))) consider(k); else if(k.length===1 && words.includes(k)) consider(k); }
  for(const w of words){ if(SYN[w]) consider(w); }
  return out;
}
const FW_BASE=[3,2.5,2,1];
const FWT=new Float64Array(16);
for(let m=0;m<16;m++){let mx=0,c=0;for(let b=0;b<4;b++)if(m&(1<<b)){mx=Math.max(mx,FW_BASE[b]);c++;}FWT[m]=c?mx+0.1*(c-1):0;}

function buildIndex(docs){
  const post=new Map();const N=docs.length;
  docs.forEach((fs,di)=>{
    const m=new Map();
    fs.forEach((t,fi)=>{if(!t)return;for(const w of (t.match(WORD_RE)||[])){for(let i=0;i<w.length-1;i++){const b=w.substr(i,2);m.set(b,(m.get(b)||0)|(1<<fi));}}});
    for(const [b,mask] of m){let a=post.get(b);if(!a){a=[];post.set(b,a);}a.push(di,mask);}
  });
  return {post,N,docs};
}
const STOP=new Set(['타고','가기','가서','오기','가고','하기','해서','해보','위해','통해','관련','대한','활동','이용','사용']);
function parseQuery(q){
  const words=[];const seen=new Set();const singles=[];
  for(const raw of (q.match(WORD_RE)||[])){
    const w=stem(raw);
    if(STOP.has(w)||STOP.has(raw))continue;
    if(w.length>=2){if(!seen.has(w)){seen.add(w);words.push(w);}}else singles.push(w);
  }
  return {words,singles,syn:expandSyn(words.concat(singles),q)};
}
function search(index,q){
  const pq=parseQuery(q);
  const {post,N,docs}=index;
  const all=pq.words.map(w=>({w,syn:false})).concat(pq.syn.map(w=>({w,syn:true})));
  if(!all.length){
    if(!pq.singles.length)return {hits:[],pq};
    const hits=[];
    docs.forEach((fs,i)=>{let s=0;for(const ch of pq.singles){for(let f=0;f<4;f++)if(fs[f]&&fs[f].includes(ch))s+=FW_BASE[f];}if(s>0)hits.push({i,score:s});});
    hits.sort((a,b)=>b.score-a.score);return {hits,pq};
  }
  const nW=all.length;
  const acc=new Map();
  const wIdf=new Array(nW).fill(0);
  all.forEach((o,wi)=>{
    const bs=new Set();for(let i=0;i<o.w.length-1;i++)bs.add(o.w.substr(i,2));
    const rows=[];
    for(const b of bs){const p=post.get(b);if(!p)continue;const idf=Math.log(1+N/(p.length/2));wIdf[wi]+=idf;rows.push([p,idf]);}
    for(const [p,idf] of rows){
      for(let k=0;k<p.length;k+=2){
        const d=p[k];let a=acc.get(d);if(!a){a=new Float64Array(nW);acc.set(d,a);}
        a[wi]+=idf*FWT[p[k+1]];
      }
    }
  });
  const nReal=pq.words.length;
  let hits=[];
  for(const [d,a] of acc){
    let score=0,cov=0;
    for(let wi=0;wi<nW;wi++){
      if(!wIdf[wi]||!a[wi])continue;
      const s=Math.pow(Math.min(1,a[wi]/(wIdf[wi]*3)),0.8);
      const syn=all[wi].syn;
      score+=wIdf[wi]*s*(syn?0.45:1);
      if(!syn&&s>=0.2)cov++;
    }
    const cf=nReal?cov/nReal:1;
    hits.push({i:d,score:score*(0.35+0.65*cf),cov:cf});
  }
  hits.sort((a,b)=>b.score-a.score);
  let maxReal=0;for(let wi=0;wi<nW;wi++)if(!all[wi].syn)maxReal=Math.max(maxReal,wIdf[wi]);
  const lim=Math.min(hits.length,1500);
  for(let h=0;h<lim;h++){
    const fs=docs[hits[h].i];let bonus=0;let exR=false,exS=false;
    for(let wi=0;wi<nW;wi++){
      const o=all[wi];const mul=o.syn?0.45:1;
      if(!o.syn&&wIdf[wi]>=maxReal*0.5&&((fs[0]&&fs[0].includes(o.w))||(fs[1]&&fs[1].includes(o.w))||(fs[2]&&fs[2].includes(o.w))))exR=true;
      if(!o.syn&&wIdf[wi]>=maxReal*0.5&&((fs[0]&&fs[0].includes(o.w))||(fs[1]&&fs[1].includes(o.w))))exS=true;
      if(fs[0]&&fs[0].includes(o.w))bonus+=0.7*wIdf[wi]*mul;
      else if(fs[1]&&fs[1].includes(o.w))bonus+=0.5*wIdf[wi]*mul;
      else if(fs[2]&&fs[2].includes(o.w))bonus+=0.35*wIdf[wi]*mul;
      else if(fs[3]&&fs[3].includes(o.w))bonus+=0.2*wIdf[wi]*mul;
    }
    hits[h].exact=bonus>0;hits[h].exactReal=exR;hits[h].exactStmt=exS;
    hits[h].score+=bonus*(0.35+0.65*hits[h].cov);
  }
  hits=hits.slice(0,lim);
  hits.sort((a,b)=>b.score-a.score);
  return {hits,pq};
}
function makeStdDocs(D){const um={};(D.units||[]).forEach(u=>u.c.forEach(c=>{(um[c]=um[c]||[]).push(u.t);}));
  return D.standards.map(x=>[x.t,(x.s+' '+x.d+' '+(x.s==='진로와 직업'&&x.g.startsWith('고등')?(um[x.c]||[]).join(' '):'')).trim(),x.m,(x.n||[]).join(' ')]);}
function makeDailyDocs(D){return D.daily.map(x=>[x.t,x.a+' '+x.e,'','']);}

function hl(text,words){
  if(!text)return '';
  const mask=new Uint8Array(text.length);
  for(const w of words){if(w.length<2)continue;let p=0;while((p=text.indexOf(w,p))>=0){mask.fill(1,p,p+w.length);p+=w.length;}}
  let out='',on=false;
  for(let i=0;i<text.length;i++){
    if(mask[i]&&!on){out+='<mark>';on=true;}
    if(!mask[i]&&on){out+='</mark>';on=false;}
    out+=esc(text[i]);
  }
  return on?out+'</mark>':out;
}
function levelDots(l){return l>=3?'●●●':l===2?'●●○':'●○○';}
function levelTitle(l){return l>=3?'관련도 높음':l===2?'관련도 보통':'관련도 낮음';}

function runSearch(){
  const q=st.q;
  const a=search(stdIndex,q),b=search(dailyIndex,q);
  st.pq=a.pq;st.rawStd=a.hits;st.rawDai=b.hits;
}
const GENERIC=new Set(['표현','제작','의사소통','관계','생활','정보','기기','신체','환경','예절','대인','학교생활','음악','체육','여가']);
function applyFilters(){
  const rtop=st.rawStd[0]?st.rawStd[0].score:0;
  const hasStmt=st.rawStd.some(h=>h.exactStmt);
  let std=st.rawStd.filter(h=>!hasStmt||h.exactStmt||STD[h.i].k==='기본'||h.score>=rtop*0.8).filter(h=>{const x=STD[h.i];return (h.exactReal||(h.exact&&h.score>=rtop*0.6))&&(!st.k||x.k===st.k)&&(!st.g||x.g===st.g)&&(!st.s||x.s===st.s);});
  let dai=(st.daily&&(!st.k||st.k==='기본')&&!st.g&&!st.s)?st.rawDai.filter(h=>h.exact&&(st.pq?st.pq.words.concat(st.pq.syn.filter(w=>!GENERIC.has(w))):[]).some(w=>DAILY[h.i].t.includes(w))):[];
  // 관련도 기준: 같은 목록 안 최고점 대비
  const cut=(arr,top)=>arr.filter(h=>h.score>=top*0.5);
  const top=Math.max(std[0]?std[0].score:0,dai[0]?dai[0].score:0);
  std=cut(std,std[0]?std[0].score:0).slice(0,150);
  dai=dai.filter(h=>h.score>=(dai[0]?dai[0].score:0)*0.4).slice(0,30);
  const lv=(s,t)=>{const r=s/(t||1);return r>=0.66?3:r>=0.4?2:1;};
  const tstd=std[0]?std[0].score:1;
  std.forEach(h=>h.level=lv(h.score,tstd));
  dai.forEach(h=>h.level=lv(h.score,top||1));
  st.std=std;st.dai=dai;
}
function stdCard(h,words){

  if(!st.q){res.innerHTML='<div class="empty">위 검색창에 활동을 입력해 주세요.</div>';$('btnMore').hidden=true;return;}
  $('count').innerHTML=`성취기준 ${st.std.length}건${st.dai.length?` · 일상생활 활동 ${st.dai.length}건`:''} <small>(관련도 높은 교과 순 · 학년 순)</small>`;
  if(!std.length&&!dai.length){
    res.innerHTML='<div class="empty">관련된 성취기준을 찾지 못했습니다.<br>활동을 다른 말로 바꾸거나, 핵심 단어만 넣어 보시고 필터를 풀어 보세요.</div>';
    $('btnMore').hidden=true;return;
  }
  const eff=h=>h.score;
  const groups=new Map();
  for(const h of std){const x=STD[h.i];const key=x.k+'|'+x.s;let g=groups.get(key);if(!g){g={k:x.k,s:x.s,items:[],best:0};groups.set(key,g);}g.items.push(h);g.best=Math.max(g.best,eff(h));}
  const list=[...groups.values()].sort((a,b)=>b.best-a.best);
  for(const g of list)g.items.sort((a,b)=>GRADE_ORDER.indexOf(STD[a.i].g)-GRADE_ORDER.indexOf(STD[b.i].g)||a.i-b.i);
  let html='',n=0,shownGroups=0;
  for(const g of list){
    if(n>=st.shown)break;
    html+=`<section class="group"><h2 class="gh">${esc(g.s)} <span class="chip" data-k="${g.k}">${g.k==='선택'?'선택 중심':g.k}</span> <small>${g.items.length}건</small></h2><div class="list">${g.items.map(h=>stdCard(h,hlw)).join('')}</div></section>`;
    n+=g.items.length;shownGroups++;
  }
  if(dai.length){
    html+=`<details class="group" open><summary>일상생활 활동 <span class="chip" data-k="일상">${dai.length}건</span></summary><div class="list">${dai.map(h=>dailyCard(h,hlw)).join('')}</div></details>`;
  }
  res.innerHTML=html;
  const left=std.length-n;
  $('btnMore').hidden=left<=0;$('btnMore').textContent=`교과 더 보기 (${list.length-shownGroups}개 교과, ${left}건)`;
}
function run(reset=true){
  if(reset&&st.basket.size){st.basket.clear();saveBasket();updateBasket();}
  st.q=$('q').value.trim();st.shown=40;setNotice('');
  if(st.q)runSearch();else{st.std=[];st.dai=[];}
  applyFilters();render();
}
function refilter(){st.shown=40;if(st.q)applyFilters();render();}

$('form').addEventListener('submit',e=>{e.preventDefault();run();});
segK.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;st.k=b.dataset.v;
  segK.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b?'true':'false'));
  fillG();fillS();st.s='';$('selS').value='';refilter();
});
$('selG').addEventListener('change',e=>{st.g=e.target.value;fillS();refilter();});
$('selS').addEventListener('change',e=>{st.s=e.target.value;refilter();});
$('chkDaily').addEventListener('change',e=>{st.daily=e.target.checked;refilter();});
$('btnMore').addEventListener('click',()=>{st.shown+=40;render();});
$('results').addEventListener('click',e=>{
  const b=e.target.closest('[data-act=pick]');if(!b)return;
  const id=b.closest('[data-id]').dataset.id;
  if(st.basket.has(id))st.basket.delete(id);else st.basket.add(id);
  saveBasket();
  const card=b.closest('.card');const on=st.basket.has(id);
  card.classList.toggle('picked',on);b.setAttribute('aria-pressed',on);b.textContent=on?'담음':'담기';
  updateBasket();
});

// 담은 목록
function basketText(){
  const ids=[...st.basket];
  const stdIds=ids.filter(i=>i[0]==='s').map(i=>+i.slice(1)).sort((a,b)=>a-b);
  const dIds=ids.filter(i=>i[0]==='d').map(i=>+i.slice(1)).sort((a,b)=>a-b);
  let t='';
  for(const i of stdIds){const x=STD[i];t+=`${x.c} ${x.t}
`;const us=unitsOf(x);if(us.length)t+=`   교과서 단원: ${us.map(unitText).join(' / ')}
`;}
  for(const i of dIds){const x=DAILY[i];t+=`[일상생활 활동] ${x.a} › ${x.e}: ${x.t}
`;}
  if(t)t+='\n출처: 교육부 고시 제2022-34호(2022. 12. 22.) 2022 개정 특수교육 교육과정\n';
  return t;
}
function updateBasket(){
  const n=st.basket.size;$('fabN').textContent=n;$('fab').hidden=n===0&&$('sheet').hidden;
  if(!$('sheet').hidden){$('sheetN').textContent=`(${n}건)`;$('sheetText').value=basketText();}
}
$('fab').addEventListener('click',()=>{$('sheet').hidden=false;$('fab').hidden=true;$('sheetMsg').textContent='';updateBasket();});
$('btnClose').addEventListener('click',()=>{$('sheet').hidden=true;updateBasket();});
$('btnClear').addEventListener('click',()=>{st.basket.clear();saveBasket();$('sheet').hidden=true;updateBasket();render();});
$('btnCopy').addEventListener('click',async()=>{
  const ta=$('sheetText');
  try{await navigator.clipboard.writeText(ta.value);$('sheetMsg').textContent='복사했습니다.';}
  catch(e){ta.focus();ta.select();$('sheetMsg').textContent='자동 복사가 되지 않았습니다. 선택된 글을 Ctrl+C로 복사해 주세요.';}
});

function setNotice(t){const n=$('notice');n.textContent=t;n.hidden=!t;}
const c=DATA.meta.counts;
$('meta').textContent=`수록: 기본 교육과정 ${c['기본']}건, 공통 교육과정 ${c['공통']}건, 선택 중심 교육과정 ${c['선택']}건, 일상생활 활동 ${c['일상생활활동']}건.`;
$('q').value='시장에서 물건 사기';
run(false);updateBasket();
})();
</script>
