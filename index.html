용하여 점자를 쓰도록 한다.","n":[],"p":290,"b":2},{"c":"[6점자03-07]","k":"공통","sk":"","s":"점자","g":"초등학교 5~6학년","d":"기능적 점자","t":"낱말의 의미를 이해하고 점자로 쓴다.","m":"이 성취기준은 생활에서 자주 사용하는 낱말을 점자로 쓰고 낱말의 의미를 이해하는 능력을 기르게 하고자 설정하였다. 바른 자세로 쓰기, 낱말의 점형을 모방하여 쓰기, 듣고 쓰기, 기억하여 쓰기, 낱말을 쓰고 의미 표현하기 등을 다룬다. 점자로 읽을 수 있는 낱말들을 점자 도구를 사용하여 쓰고, 낱말의 의미를 알고 표현하도록 한다.","n":[],"p":290,"b":2},{"c":"[6점자03-08]","k":"공통","sk":"","s":"점자","g":"초등학교 5~6학년","d":"기능적 점자","t":"친숙한 낱말들로 구성된 간단한 어구와 문장을 점자로 읽고 쓴다.","m":"이 성취기준은 학습한 낱말들로 이루어진 어구와 문장을 읽고 쓰는 능력을 기르게 하고자 설정하였다. 사물, 활동, 사람의 이름, 숫자 같은 친숙한 낱말들로 이루어진 어구 읽기와 쓰기, 간단한 문장 읽기와 쓰기 등을 다룬다. 학습한 낱말들로 이루어진 어구와 문장을 반복하여 점자로 읽고 쓰는 과정에서 간단한 어구와 문장의 의미를 알고 사용하도록 한다.","n":[],"p":290,"b":2},{"c":"[6점자03-09]","k":"공통","sk":"","s":"점자","g":"초등학교 5~6학년","d":"기능적 점자","t":"일과 활동에 친숙한 낱말과 문장을 능동적으로 사용한다.","m":"이 성취기준은 가정과 학교에서 친숙한 낱말과 문장을 일과 활동에 사용하는 능력을 기르게 하고자 설정하였다. 가정용품과 개인 소지품에 점자 라벨지 사용하기, 교내 점자 안내판 사용하기, 학급 용품과 학습 자료에 점자 라벨지 사용하기, 간단한 점자 메모 읽기, 자신의 요구를 점자 낱말로 표현하기, 일과 활동의 경험을 점자 어구나 문장으로 표현하기 등을 다룬다. 가정과 학교의 일과 활동 중에 친숙한 낱말과 문장을 점자로 읽고 쓰는 과정에서 생활에 필요한 낱말과 문장을 능동적으로 사용하도록 한다.","n":[],"p":290,"b":2},{"c":"[6점자04-01]","k":"공통","sk":"","s":"점자","g":"초등학교 5~6학년","d":"수학 점자","t":"자연수의 점자 기호와 규정을 알고, 점자로 읽고 쓴다.","m":"이 성취기준은 자연수를 점자로 읽고 쓰는 능력을 기르게 하고자 설정하였다. 수표, 숫자, 반점 등 자연수를 표현하는 데 필요한 점자 기호와 규정을 다룬다. 다양한 예문으로 자연수를 표현하는 점자 규정을 이해하고, 수학의 ‘수와 연산’ 관련 단원을 학습하도록 한다.","n":[],"p":293,"b":2},{"c":"[6점자04-02]","k":"공통","sk":"","s":"점자","g":"초등학교 5~6학년","d":"수학 점자","t":"분수와 소수의 점자 기호와 규정을 알고, 점자로 읽고 쓴다.","m":"이 성취기준은 분수와 소수를 점자로 읽고 쓰는 능력을 기르게 하고자 설정하였다. 분수표, 분수의 구성, 대분수, 소수점, 소수의 구성 등의 점자 기호와 규정을 다룬다. 다양한 예문으로 분수와 수소의 점자 규정을 이해하고, 수학의 ‘수와 연산’ 관련 영역을 학습하도록 한다.","n":[],"p":293,"b":2},{"c":"[6점자04-03]","k":"공통","sk":"","s":"점자","g":"초등학교 5~6학년","d":"수학 점자","t":"사칙연산의 점자 기호와 규정을 알고, 점자로 읽고 쓴다.","m":"이 성취기준은 사칙연산이 포함된 식을 점자로 읽고 쓰는 능력을 기르게 하고자 설정하였다. 덧셈, 뺄셈, 곱셈, 나눗셈 등의 점자 기호와 규정을 다룬다. 다양한 예문으로 사칙연산의 점자 규정을 이해하고, 수학의 ‘수와 연산’ 관련 단원을 학습하도록 한다.","n":[],"p":293,"b":2},{"c":"[6점자04-04]","k":"공통","sk":"","s":"점자","g":"초등학교 5~6학년","d":"수학 점자","t":"관계 기호의 점자 표현과 규정을 알고, 점자로 읽고 쓴다.","m":"이 성취기준은 등식과 부등식을 점자로 읽고 쓰는 능력을 기르게 하고자 설정하였다. 등호, 부등호 등의 점자 기호와 규정을 다룬다. 다양한 예문으로 등식과 부등식의 점자 규정을 이해하고, 수학의 ‘수와 연산’ 관련 단원을 학습하도록 한다.","n":[],"p":293,"b":2},{"c":"[6점자04-05]","k":"공통","sk":"","s":"점자","g":"초등학교 5~6학년","d":"수학 점자","t":"괄호의 점자 기호와 규정을 알고, 점자로 읽고 쓴다.","m":"이 성취기준은 괄호가 포함된 식을 점자로 읽고 쓰는 능력을 기르게 하고자 설정하였다. 소괄호, 중괄호, 대괄호, 묶음 괄호 등의 점자 규정을 다룬다. 다양한 예문을 통해괄호가 포함된 식의 점자 규정을 이해하고, 수학의 ‘수와 연산’ 관련 단원을 학습하도록 한다.","n":[],"p":293,"b":2},{"c":"[6점자04-06]","k":"공통","sk":"","s":"점자","g":"초등학교 5~6학년","d":"수학 점자","t":"미지수의 사용과 관련된 점자 기호와 규정을 알고, 점자로 읽고 쓴다.","m":"이 성취기준은 미지수가 포함된 식을 점자로 읽고 쓰는 능력을 기르게 하고자 설정하였다. ○, □, △ 등 미지수를 대신하는 기호의 점자 기호와 점자 규정을 다룬다. 다양한 예문으로 미지수로 사용하는 ○, □, △ 등이 포함된 식의 점자 규정을 이해하고, 수학의 ‘변화와 관계’ 관련 단원을 학습하도록 한다.","n":[],"p":293,"b":2},{"c":"[6점자04-07]","k":"공통","sk":"","s":"점자","g":"초등학교 5~6학년","d":"수학 점자","t":"비와 관련된 점자 기호와 규정을 알고, 점자로 읽고 쓴다.","m":"이 성취기준은 비와 비례식을 점자로 읽고 쓰는 능력을 기르게 하고자 설정하였다. 비, 비례식 등의 점자 기호와 규정을 다룬다. 다양한 예문으로 비와 비례식의 점자 규정을 이해하고, 수학의 ‘변화와 관계’ 관련 단원을 학습하도록 한다.","n":[],"p":293,"b":2},{"c":"[6점자04-08]","k":"공통","sk":"","s":"점자","g":"초등학교 5~6학년","d":"수학 점자","t":"각종 단위의 점자 기호와 규정을 알고, 점자로 읽고 쓴다.","m":"이 성취기준은 각종 단위를 점자로 읽고 쓰는 능력을 기르게 하고자 설정하였다. 시간, 길이, 각도, 무게, 들이, 넓이, 부피 등 단위의 점자 기호와 규정을 다룬다. 다양한 예문으로 각종 단위의 점자 규정을 이해하고, 수학의 ‘도형과 측정’ 관련 단원을 학습하도록 한다.","n":[],"p":293,"b":2},{"c":"[6점자05-01]","k":"공통","sk":"","s":"점자","g":"초등학교 5~6학년","d":"과학 점자","t":"측정 단위의 점자 기호와 규정을 알고, 점자로 읽고 쓴다.","m":"이 성취기준은 과학의 여러 가지 측정 단위를 점자로 읽고 쓰는 능력을 기르게 하고자 설정하였다. 길이, 무게, 부피, 온도, 넓이 등의 점자 기호와 규정을 다룬다. 다양한 예문으로 측정 단위의 점자 규정을 이해하고, 과학의 측정 단위와 관련된 단원을 학습하도록 한다.","n":[],"p":294,"b":2},{"c":"[6점자06-01]","k":"공통","sk":"","s":"점자","g":"초등학교 5~6학년","d":"음악 점자","t":"정간보와 율명의 점자 기호와 규정을 알고, 점자로 읽고 쓴다.","m":"이 성취기준은 정간보와 율명을 점자로 읽고 쓰는 능력을 기르게 하고자 설정하였다. 정간보와 기호, 12율명과 기호, 음역 표기법, 시가 기재법 등의 점자 기호와 규정을 다룬다. 다양한 예문으로 정간보와 율명의 점자 규정을 이해하고, 음악의 정간보와 율명과 관련된 단원을 학습하도록 한다.","n":[],"p":295,"b":2},{"c":"[6점자06-02]","k":"공통","sk":"","s":"점자","g":"초등학교 5~6학년","d":"음악 점자","t":"장단의 점자 기호와 규정을 알고, 점자로 읽고 쓴다.","m":"이 성취기준은 장단을 나타내는 기호를 점자로 읽고 쓰는 능력을 기르게 하고자 설정하였다. 장구 장단 기호, 다양한 장단, 말붙임새와 서양 음악식 장단 기보법, 장단과 함께 표기된 선율과 가사의 구성과 순서 등의 점자 기호와 규정을 다룬다. 다양한 예문으로 장단의 점자 규정을 이해하고, 음악의 장단 표현과 관련된 단원을 학습하도록 한다.","n":[],"p":295,"b":2},{"c":"[6점자06-03]","k":"공통","sk":"","s":"점자","g":"초등학교 5~6학년","d":"음악 점자","t":"음표와 쉼표, 박자와 조성의 점자 기호와 규정을 알고, 점자로 읽고 쓴다.","m":"이 성취기준은 음표와 쉼표, 박자와 조성을 점자로 읽고 쓰는 능력을 기르게 하고자 설정하였다. 음표, 쉼표, 음자리표, 길표, 임시표, 조표, 박자, 이음줄, 붙임줄 등의 점자 기호와 규정을 다룬다. 다양한 예문으로 음표와 쉼표, 박자와 조성을 표현하는 점자 규정을 이해하고, 음표와 쉼표, 박자와 조성과 관련된 단원을 학습하도록 한다.","n":[],"p":295,"b":2},{"c":"[6점자06-04]","k":"공통","sk":"","s":"점자","g":"초등학교 5~6학년","d":"음악 점자","t":"셈여림, 빠르기, 반복 기호의 점자 기호와 규정을 알고, 점자로 읽고 쓴다.","m":"이 성취기준은 음악의 강약, 빠르기, 반복 기호를 점자로 읽고 쓰는 능력을 기르게 하고자 설정하였다. 악상 기호, 주법에 관한 기호, 빠르기를 변화시키는 기호, 도돌이표, 연주 순서 기호 등의 점자 기호와 규정을 다룬다. 다양한 예문으로 셈여림, 빠르기, 반복 기호의 점자 규정을 이해하고, 음악의 셈여림, 빠르기, 반복 기호와 관련된 단원을 학습하도록 한다.","n":[],"p":295,"b":2},{"c":"[6점자06-05]","k":"공통","sk":"","s":"점자","g":"초등학교 5~6학년","d":"음악 점자","t":"리듬 기호의 점자 기호와 규정을 알고, 점자로 읽고 쓴다.","m":"이 성취기준은 음악의 리듬 기호를 점자로 읽고 쓰는 능력을 기르게 하고자 설정하였다. 박자에 따른 주요 리듬꼴, 기보법, 강약 기호, 신체 리듬 기호, 리듬 기호가 들어 있는 곡의 구성과 순서 등의 점자 기호와 규정을 다룬다. 다양한 예문으로 리듬 기호의 점자 규정을 이해하고, 음악의 리듬 표현과 관련된 단원을 학습하도록 한다.","n":[],"p":295,"b":2},{"c":"[6점자06-06]","k":"공통","sk":"","s":"점자","g":"초등학교 5~6학년","d":"음악 점자","t":"독창을 위한 성악곡 기호의 점자 기호와 규정을 알고, 점자로 읽고 쓴다.","m":"이 성취기준은 독창을 위한 성악곡 기호를 점자로 읽고 쓰는 능력을 기르게 하고자 설정하였다. 성악곡의 구성과 순서, 선율과 가사의 전치 기호, 가사 반복 기호, 음절 기호, 숨표 기호, 성악곡의 연주 형태 등의 점자 기호와 규정을 다룬다. 다양한 예문으로 독창을 위한 성악곡 기호의 점자 규정을 이해하고, 음악의 독창과 관련된 단원을 학습하도록 한다.","n":[],"p":295,"b":2},{"c":"[6점자06-07]","k":"공통","sk":"","s":"점자","g":"초등학교 5~6학년","d":"음악 점자","t":"관악기 기호의 점자 기호와 규정을 알고, 점자로 읽고 쓴다.","m":"이 성취기준은 관악기 기호를 점자로 읽고 쓰는 능력을 기르게 하고자 설정하였다. 관악기의 손 기호, 손가락 번호 기호, 개폐 기호, 리코더와 오카리나를 중심으로 한 운지법, 관악기 악보의 구성과 순서 등의 점자 기호와 규정을 다룬다. 다양한 예문으로 관악기 기호의 점자 규정을 이해하고, 음악의 관악기 기호와 관련된 단원을 학습하도록 한다.","n":[],"p":295,"b":2},{"c":"[6점자07-01]","k":"공통","sk":"","s":"점자","g":"초등학교 5~6학년","d":"영어 점자","t":"알파벳 대소문자의 점자 기호와 규정을 알고, 점자로 읽고 쓴다.","m":"이 성취기준은 알파벳 대문자와 소문자를 점자로 읽고 쓰는 능력을 기르게 하고자 설정하였다. 알파벳 소문자(az), 대문자(AZ), 대문자표 등의 점자 기호와 규정을 다룬다. 간단한 단어, 어구, 문장으로 알파벳 점자의 규정을 이해하고, 알파벳을 사용하는 단어, 어구, 문장을 점자로 정확하고 유창하게 읽고 쓰도록 한다.","n":[],"p":297,"b":2},{"c":"[6점자07-02]","k":"공통","sk":"","s":"점자","g":"초등학교 5~6학년","d":"영어 점자","t":"1급 점자표의 점자 기호와 규정을 알고, 점자로 읽고 쓴다.","m":"이 성취기준은 1급 점자표를 점자로 읽고 쓰는 능력을 기르게 하고자 설정하였다. 점형 한 개가 글자, 숫자나 기호, 단어 또는 두 개 이상의 글자 등 여러 가지 의미를나타내는 것을 구분하는 1급 점자 기호표, 1급 점자 단어표, 1급 점자 구절표, 1급 점자 종료표 등의 점자 기호와 규정을 다룬다. 간단한 단어, 어구, 문장으로 1급 점자표의 규정을 이해하고, 1급 점자표를 사용하는 단어, 어구, 문장을 점자로 정확하고 유창하게 읽고 쓰도록 한다.","n":[],"p":297,"b":2},{"c":"[6점자07-03]","k":"공통","sk":"","s":"점자","g":"초등학교 5~6학년","d":"영어 점자","t":"기본 문장 부호의 점자 기호와 규정을 알고, 점자로 읽고 쓴다.","m":"이 성취기준은 기본 문장 부호를 점자로 읽고 쓰는 능력을 기르게 하고자 설정하였다. 마침표, 쉼표, 물음표, 느낌표, 아포스트로피, 줄임표 등의 점자 기호와 규정을 다룬다. 간단한 단어, 어구, 문장으로 문장 부호의 점자 규정을 이해하고, 문장 부호를 사용하는 어구와 문장을 점자로 정확하고 유창하게 읽고 쓰도록 한다.","n":[],"p":297,"b":2},{"c":"[9점자01-01]","k":"공통","sk":"","s":"점자","g":"중학교 1~3학년","d":"수학 점자","t":"정수와 절댓값의 점자 기호와 규정을 알고, 점자로 읽고 쓴다.","m":"이 성취기준은 정수를 점자로 읽고 쓰는 능력을 기르게 하고자 설정하였다. 음의 부호, 양의 부호, 절댓값 등의 점자 기호와 규정을 다룬다. 다양한 예문으로 정수의 점자 규정을 이해하고, 수학의 ‘수와 연산’ 관련 단원을 학습하도록 한다.","n":[],"p":298,"b":2},{"c":"[9점자01-02]","k":"공통","sk":"","s":"점자","g":"중학교 1~3학년","d":"수학 점자","t":"거듭제곱의 점자 기호와 규정을 알고, 점자로 읽고 쓴다.","m":"이 성취기준은 거듭제곱이 포함된 식을 점자로 읽고 쓰는 능력을 기르게 하고자 설정하였다. 위 첨자 기호, 지수의 구성 등의 점자 기호와 규정을 다룬다. 다양한 예문으로 거듭제곱의 점자 규정을 이해하고, 수학의 ‘수와 연산’ 관련 단원을 학습하도록 한다.","n":[],"p":298,"b":2},{"c":"[9점자01-03]","k":"공통","sk":"","s":"점자","g":"중학교 1~3학년","d":"수학 점자","t":"무한소수와 순환소수를 표현하는 점자 기호와 규정을 알고, 점자로 읽고 쓴다.","m":"이 성취기준은 무한소수와 순환소수를 점자로 읽고 쓰는 능력을 기르게 하고자설정하였다. 순환마디, 줄임표 등의 점자 규정을 다룬다. 다양한 예문을 통해 무한소수와 순환소수의 점자 규정을 이해하고, 수학의 ‘수와 연산’ 관련 단원을 학습하도록 한다.","n":[],"p":298,"b":2},{"c":"[9점자01-04]","k":"공통","sk":"","s":"점자","g":"중학교 1~3학년","d":"수학 점자","t":"제곱근을 표현하는 점자 기호와 규정을 알고, 점자로 읽고 쓴다.","m":"이 성취기준은 제곱근이 포함된 식을 점자로 읽고 쓰는 능력을 기르게 하고자설정하였다. 근호, 제곱근의 표현 등의 점자 기호와 규정을 다룬다. 다양한 예문으로 제곱근이 포함된 식의 점자 규정을 이해하고, 수학의 ‘수와 연산’ 관련 단원을 학습하도록 한다.","n":[],"p":298,"b":2},{"c":"[9점자01-05]","k":"공통","sk":"","s":"점자","g":"중학교 1~3학년","d":"수학 점자","t":"문자를 사용하여 식을 표현하는 점자 기호와 규정을 알고, 점자로 읽고 쓴다.","m":"이 성취기준은 문자가 포함된 식을 점자로 읽고 쓰는 능력을 기르게 하고자 설정하였다. 로마자 대소문자, 그리스 알파벳 대소문자, 순서쌍, 문자가 포함된 식의 표현 등의 점자 기호와 규정을 다룬다. 다양한 예문으로 로마자의 점자 규정을 이해하고, 수학의 ‘변화와 관계’ 관련 단원을 학습하도록 한다.","n":[],"p":298,"b":2},{"c":"[9점자01-06]","k":"공통","sk":"","s":"점자","g":"중학교 1~3학년","d":"수학 점자","t":"연립방정식을 표현하는 점자 기호와 규정을 알고, 점자로 읽고 쓴다.","m":"이 성취기준은 연립방정식을 점자로 읽고 쓰는 능력을 기르게 하고자 설정하였다. 연립 기호, 연립방정식과 연립부등식의 표현 등의 점자 기호와 규정을 다룬다. 다양한 예문으로 연립방정식의 점자 규정을 이해하고, 수학의 ‘변화와 관계’ 관련 단원을 학습하도록 한다.","n":[],"p":298,"b":2},{"c":"[9점자01-07]","k":"공통","sk":"","s":"점자","g":"중학교 1~3학년","d":"수학 점자","t":"도형과 도형의 관계를 표현하는 점자 기호와 규정을 알고, 점자로 읽고 쓴다.","m":"이 성취기준은 도형의 표현과 이를 포함한 식을 점자로 읽고 쓰는 능력을 기르게 하고자 설정하였다. 점, 선분, 직선, 반직선, 면, 각, 삼각형, 사각형, 오각형, 육각형, 사다리꼴, 평행사변형, 합동, 평행, 수직, 닮음 등의 점자 기호와 규정을 다룬다. 다양한 예문으로 도형의 점자 규정을 이해하고, 수학의 ‘도형과 측정’ 관련 단원을 학습하도록 한다.","n":[],"p":298,"b":2},{"c":"[9점자01-08]","k":"공통","sk":"","s":"점자","g":"중학교 1~3학년","d":"수학 점자","t":"삼각비의 점자 기호와 규정을 알고, 점자로 읽고 쓴다.","m":"이 성취기준은 삼각비가 포함된 식을 점자로 읽고 쓰는 능력을 기르게 하고자 설정하였다. sin, cos, tan 등의 점자 기호와 규정을 다룬다. 다양한 예문으로 삼각비의 점자 규정을 이해하고, 수학의 ‘도형과 측정’ 관련 단원을 학습하도록 한다.","n":[],"p":298,"b":2},{"c":"[9점자02-01]","k":"공통","sk":"","s":"점자","g":"중학교 1~3학년","d":"과학 점자","t":"로마자 단위와 비로마자 단위의 점자 기호와 규정을 알고, 점자로 읽고 쓴다.","m":"이 성취기준은 과학의 여러 가지 단위를 점자로 읽고 쓰는 능력을 기르게 하고자 설정하였다. 로마자, 빗금, 위 첨자, 속력, 밀도, 비열, 퍼센트, 퍼밀, 도, 분, 초 등의 점자 기호와 규정을 다룬다. 다양한 예문으로 로마자 단위와 비로마자 단위의 점자 규정을 이해하고, 과학의 측정 단위와 관련된 단원을 학습하도록 한다.","n":[],"p":300,"b":2},{"c":"[9점자02-02]","k":"공통","sk":"","s":"점자","g":"중학교 1~3학년","d":"과학 점자","t":"과학식의 구두점의 점자 기호와 규정을 알고, 점자로 읽고 쓴다.","m":"이 성취기준은 운동과 에너지, 물질, 생명, 지구와 우주 등의 구두점을 점자로 읽고 쓰는 능력을 기르게 하고자 설정하였다. 위 첨자, 아래 첨자, 화살표, 괄호 등의 점자 기호와 규정을 다룬다. 다양한 예문으로 과학에서 사용하는 구두점의 점자 규정을 이해하고, 과학의 구두점과 관련된 단원을 학습하도록 한다.","n":[],"p":300,"b":2},{"c":"[9점자02-03]","k":"공통","sk":"","s":"점자","g":"중학교 1~3학년","d":"과학 점자","t":"수식의 점자 기호와 규정을 알고, 점자로 읽고 쓴다.","m":"이 성취기준은 운동과 에너지, 물질, 생명, 지구와 우주 등의 구두점을 점자로 읽고 쓰는 능력을 기르게 하고자 설정하였다. 위 첨자, 아래 첨자, 화살표, 괄호 등의 점자 기호와 규정을 다룬다. 다양한 예문으로 과학에서 사용하는 구두점의 점자 규정을 이해하고, 과학의 구두점과 관련된 단원을 학습하도록 한다.","n":[],"p":300,"b":2},{"c":"[9점자02-04]","k":"공통","sk":"","s":"점자","g":"중학교 1~3학년","d":"과학 점자","t":"전기 회로도를 표현하는 점자 기호와 규정을 알고, 점자로 읽고 쓴다.","m":"이 성취기준은 전기 회로도를 점자로 표현하고 이해하는 능력을 기르게 하고자 설정하였다. 전지, 전구, 스위치, 저항, 전류계, 전압계 등 전기 기구 기호와 선 등의 점자 기호와 규정을 다룬다. 다양한 예문으로 전기 회로도를 표현하는 점자 규정을 이해하고, 과학의 전기와 관련된 단원을 학습하도록 한다.","n":[],"p":300,"b":2},{"c":"[9점자02-05]","k":"공통","sk":"","s":"점자","g":"중학교 1~3학년","d":"과학 점자","t":"유전 형질과 가계도를 표현하는 점자 기호와 규정을 알고, 점자로 읽고 쓴다.","m":"이 성취기준은 유전 형질과 가계도를 점자로 표현하고 이해하는 능력을 기르게 하고자 설정하였다. 유전 형질, 가계도, 범례와 기호가 포함된 가계도 등의 점자 기호와 규정을 다룬다. 다양한 예문으로 유전 형질과 가계도를 점자로 표현하는 점자 규정을 이해하고, 과학의 유전과 관련된 단원을 학습하도록 한다.","n":[],"p":300,"b":2},{"c":"[9점자02-06]","k":"공통","sk":"","s":"점자","g":"중학교 1~3학년","d":"과학 점자","t":"원소를 표현하는 점자 기호와 규정을 알고, 점자로 읽고 쓴다.","m":"이 성취기준은 원소와 관련된 표현을 점자로 읽고 쓰는 능력을 기르게 하고자설정하였다. 원소 기호, 원자 번호, 질량수의 점자 기호와 규정을 다룬다. 다양한 예문으로 원소를 표현하는 점자 규정을 이해하고, 과학의 물질과 관련된 단원을 학습하도록 한다.","n":[],"p":300,"b":2},{"c":"[9점자02-07]","k":"공통","sk":"","s":"점자","g":"중학교 1~3학년","d":"과학 점자","t":"이온 및 전자를 표현하는 점자 기호와 규정을 알고, 점자로 읽고 쓴다.","m":"이 성취기준은 이온과 전자를 점자로 읽고 쓰는 능력을 기르게 하고자 설정하였다. 전하의 종류, 전자 수 등의 점자 기호와 표기 규정을 다룬다. 다양한 예문으로 이온과 전자를 표현하는 점자 규정을 이해하고, 과학의 이온과 관련된 단원을 학습하도록 한다.","n":[],"p":300,"b":2},{"c":"[9점자02-08]","k":"공통","sk":"","s":"점자","g":"중학교 1~3학년","d":"과학 점자","t":"분자식을 표현하는 점자 기호와 규정을 알고, 점자로 읽고 쓴다.","m":"이 성취기준은 화학의 분자식을 점자로 읽고 쓰는 능력을 기르게 하고자 설정하였다. 원소 기호, 소괄호, 대괄호, 아래 첨자, 대문자 구절표, 대문자 종료표 등의 점자 기호와 규정을 다룬다. 다양한 예문으로 분자식을 표현하는 점자 규정을 이해하고, 화학의 분자식과 관련된 단원을 학습하도록 한다.","n":[],"p":300,"b":2},{"c":"[9점자02-09]","k":"공통","sk":"","s":"점자","g":"중학교 1~3학년","d":"과학 점자","t":"화학 반응식을 표현하는 점자 기호와 규정을 알고 점자로 읽고 쓴다.","m":"이 성취기준은 화학 반응식의 반응물과 생성물을 점자로 읽고 쓰는 능력을 기르게 하고자 설정하였다. 분자식, 계수, 이온, 화살표, 침전 기호, 발생 기호 등의 점자 기호와 표기 규정을 다룬다. 다양한 예문으로 화학 반응식를 표현하는 점자 규정을 이해하고, 화학의 반응식과 관련된 단원을 학습할 수 있도록 한다.","n":[],"p":300,"b":2},{"c":"[9점자03-01]","k":"공통","sk":"","s":"점자","g":"중학교 1~3학년","d":"음악 점자","t":"시김새의 점자 기호와 규정을 알고, 점자로 읽고 쓴다.","m":"이 성취기준은 시김새를 나타내는 기호를 점자로 읽고 쓰는 능력을 기르게 하고자 설정하였다. 시김새 종류와 시김새 표기법, 오선보에 기보된 한국 음악 성악곡 표기법의 구성 순서, 오선보에서의 시김새 표기 등의 점자 기호와 규정을 다룬다. 다양한 예문으로 시김새의 점자 규정을 이해하고, 음악의 시김새 표현과 관련된 단원을 학습하도록 한다.","n":[],"p":302,"b":2},{"c":"[9점자03-02]","k":"공통","sk":"","s":"점자","g":"중학교 1~3학년","d":"음악 점자","t":"관악기 기호의 점자 기호와 규정을 알고, 점자로 읽고 쓴다.","m":"이 성취기준은 관악기 기호를 점자로 읽고 쓰는 능력을 기르게 하고자 설정하였다. 관악기 공통 기호와 공통 장식음, 손 기호, 손가락 번호 기호, 개폐 기호, 숨표, 쉼표,단소와 소금을 중심으로 한 운지법 등의 점자 기호와 규정을 다룬다. 다양한 예문으로 관악기 기호의 점자 규정을 이해하고, 음악의 관악기 기호와 관련된 단원을 학습하도록 한다.","n":[],"p":302,"b":2},{"c":"[9점자03-03]","k":"공통","sk":"","s":"점자","g":"중학교 1~3학년","d":"음악 점자","t":"선율의 점자 기호와 규정을 알고, 점자로 읽고 쓴다.","m":"이 성취기준은 선율 기호를 점자로 읽고 쓰는 능력을 기르게 하고자 설정하였다. 선율을 나타내는 집합 음표와 잇단음표, 꾸밈표, 반복되는 기호를 생략하여 표기하는 방법, 선율의 반복 기호인 다카포, 달세뇨 등의 점자 기호와 규정을 다룬다. 다양한 예문으로 선율의 점자 규정을 이해하고, 음악의 선율 표현과 관련된 단원을 학습하도록 한다.","n":[],"p":302,"b":2},{"c":"[9점자03-04]","k":"공통","sk":"","s":"점자","g":"중학교 1~3학년","d":"음악 점자","t":"음정과 성부의 점자 기호와 규정을 알고, 점자로 읽고 쓴다.","m":"이 성취기준은 음정과 성부 기호를 점자로 읽고 쓰는 능력을 기르게 하고자 설정하였다. 음정 간격과 음정 기호, 성부의 마디 전체와 일부에 적용되는 성부 나눔 표, 마디 속 나눔 표 등의 점자 기호와 규정을 다룬다. 다양한 예문으로 음정과 성부의 점자 규정을 이해하고, 음악의 음정과 성부 표현과 관련된 단원을 학습하도록 한다.","n":[],"p":302,"b":2},{"c":"[9점자03-05]","k":"공통","sk":"","s":"점자","g":"중학교 1~3학년","d":"음악 점자","t":"코드 기호의 점자 기호와 규정을 알고, 점자로 읽고 쓴다.","m":"이 성취기준은 음악의 코드 기호를 점자로 읽고 쓰는 능력을 기르게 하고자 설정하였다. 코드 전치 기호, 다양한 화음 종류와 기호, 분수 화음과 괄호 기호, 코드가 포함된 악보의 구성과 순서, 기둥표를 이용한 코드 기호 박자 표기법 등의 점자 기호와 규정을 다룬다. 다양한 예문으로 코드 기호의 점자 규정을 이해하고, 음악의 코드 기호와 관련된 단원을 학습하도록 한다.","n":[],"p":302,"b":2},{"c":"[9점자03-06]","k":"공통","sk":"","s":"점자","g":"중학교 1~3학년","d":"음악 점자","t":"합창곡을 위한 성악곡 기호의 점자 기호와 규정을 알고, 점자로 읽고 쓴다.","m":"이 성취기준은 합창을 위한 성악곡 기호를 점자로 읽고 쓰는 능력을 기르게 하고자 설정하였다. 합창곡의 구성과 순서, 합창 성부 기호, 파트보와 총보, 코드 기호, 선율과 가사, 전치 기호, 가사 반복 기호, 음절 기호, 숨표 기호 등의 점자 기호와 규정을 다룬다. 다양한 예문으로 성악곡 기호의 점자 규정을 이해하고, 음악의 합창곡과 관련된 단원을 학습하도록 한다.","n":[],"p":302,"b":2},{"c":"[9점자03-07]","k":"공통","sk":"","s":"점자","g":"중학교 1~3학년","d":"음악 점자","t":"현악기 기호의 점자 기호와 규정을 알고, 점자로 읽고 쓴다.","m":"이 성취기준은 현악기 중 발현악기인 우쿨렐레와 기타의 기호를 점자로 읽고 쓰는 능력을 기르게 하고자 설정하였다. 현 기호, 프렛(fret) 기호, 손가락 번호 기호, 스트로크 기호, 개방현, 코드 다이어그램 기보법, 코드 운지법, 리듬 기보 등의 점자 기호와 규정을 다룬다. 다양한 예문으로 현악기 기호의 점자 규정을 이해하고, 음악의 현악기 기호와 관련된 단원을 학습하도록 한다.","n":[],"p":302,"b":2},{"c":"[9점자04-01]","k":"공통","sk":"","s":"점자","g":"중학교 1~3학년","d":"영어 점자","t":"숫자와 단위의 점자 기호와 규정을 알고, 점자로 읽고 쓴다.","m":"이 성취기준은 숫자와 단위를 점자로 읽고 쓰는 능력을 기르게 하고자 설정하였다. 시각⋅연도⋅길이⋅분수⋅소수점 등의 숫자, 더하기⋅빼기⋅곱하기⋅나누기 등의 연산 기호, 달러⋅센트⋅유로 등의 단위의 점자 기호와 규정을 다룬다. 다양한 예문으로 숫자와 단위 기호의 점자 규정을 이해하고, 점자로 정확하고 유창하게 읽고 쓰도록 한다.","n":[],"p":304,"b":2},{"c":"[9점자04-02]","k":"공통","sk":"","s":"점자","g":"중학교 1~3학년","d":"영어 점자","t":"문장 부호와 글자체 기호의 점자 기호와 규정을 알고, 점자로 읽고 쓴다.","m":"이 성취기준은 문장 부호와 글자체 기호를 점자로 읽고 쓰는 능력을 기르게 하고자 설정하였다. 줄표⋅큰따옴표⋅작은따옴표⋅소괄호⋅중괄호⋅대괄호 같은 문장 부호, 이탤릭체 기호표⋅단어표⋅구절표⋅종료표⋅굵은 글자체 기호표⋅단어표⋅구절표⋅종료표 같은 글자체 기호 등의 점자 기호와 규정을 다룬다. 다양한 예문으로 문장 부호의 글자체 기호의 점자 규정을 이해하고, 문장 부호와 글자체 기호를 사용하는 어구와 문장을 점자로 정확하고 유창하게 읽고 쓰도록 한다.","n":[],"p":304,"b":2},{"c":"[9점자04-03]","k":"공통","sk":"","s":"점자","g":"중학교 1~3학년","d":"영어 점자","t":"발음 기호의 점자 기호와 규정을 알고, 점자로 읽고 발음한다.","m":"이 성취기준은 알파벳 발음 기호를 점자로 읽고 발음하는 능력을 기르게 하고자 설정하였다. 알파벳 자음자와 모음자의 발음 기호, 알파벳에 없는 발음 기호, 악센트 기호 등의 점자 기호와 규정을 다룬다. 다양한 예문으로 발음 기호의 점자 규정을 이해하고, 발음 기호를 정확하고 유창하게 읽고 발음하도록 한다.","n":[],"p":304,"b":2},{"c":"[9점자04-04]","k":"공통","sk":"","s":"점자","g":"중학교 1~3학년","d":"영어 점자","t":"알파벳 단어 약자의 기호와 규정을 알고, 점자로 읽고 쓴다.","m":"이 성취기준은 알파벳 단어 약자를 읽고 쓰는 능력을 기르게 하고자 설정하였다. 알파벳 글자 하나로 단어 하나를 나타내는 ‘a, i, o’를 제외한 알파벳 단어 약자 23개의 점자 기호와 규정을 다룬다. 다양한 예문으로 알파벳 단어 약자의 규정을 이해하고 알파벳 단어 약자를 사용하는 단어와 문장을 정확하고 유창하게 읽고 쓰도록 한다.","n":[],"p":304,"b":2},{"c":"[9점자04-05]","k":"공통","sk":"","s":"점자","g":"중학교 1~3학년","d":"영어 점자","t":"온칸 점형 약자의 기호와 규정을 알고, 점자로 읽고 쓴다.","m":"이 성취기준은 온칸 점형 약자를 읽고 쓰는 능력을 기르게 하고자 설정하였다. 점칸의 상단과 하단 그리고 경우에 따라 중단을 포함하는 점들로 이루어진 온칸 약자, 온칸 단어 약자, 온칸 묶음 약자 등의 점자 기호와 규정을 다룬다. 다양한 예문으로 온칸 점형 약자의 규정을 이해하고, 온칸 점형 약자를 사용하는 단어와 문장을 정확하고 유창하게 읽고 쓰도록 한다.","n":[],"p":304,"b":2},{"c":"[9점자04-06]","k":"공통","sk":"","s":"점자","g":"중학교 1~3학년","d":"영어 점자","t":"하위 약자의 기호와 규정을 알고, 점자로 읽고 쓴다.","m":"이 성취기준은 하위 약자를 읽고 쓰는 능력을 기르게 하고자 설정하였다. 점칸의 상단을 제외한 중단과 하단의 점들로 이루어진 하위 단어 약자와 하위 묶음 약자 등의 점자 기호와 규정을 다룬다. 다양한 예문으로 하위 약자의 규정을 이해하고, 하위 약자를 사용하는 단어와 문장을 정확하고 유창하게 읽고 쓰도록 한다.","n":[],"p":304,"b":2},{"c":"[9점자04-07]","k":"공통","sk":"","s":"점자","g":"중학교 1~3학년","d":"영어 점자","t":"어두 약자의 기호와 규정을 알고, 점자로 읽고 쓴다.","m":"이 성취기준은 어두 약자를 읽고 쓰는 능력을 기르게 하고자 설정하였다. 단어의 첫 글자나 처음 두세 개의 글자(어두)를 사용하는 5점 어두 약자, 4-5점 어두 약자, 4-5-6점 어두 약자 등의 점자 기호와 규정을 다룬다. 다양한 예문으로 어두 약자의 규정을 이해하고, 어두 약자를 사용한 단어와 문장을 정확하고 유창하게 읽고 쓰도록 한다.","n":[],"p":304,"b":2},{"c":"[9점자04-08]","k":"공통","sk":"","s":"점자","g":"중학교 1~3학년","d":"영어 점자","t":"어미 묶음 약자의 기호와 규정을 알고, 점자로 읽고 쓴다.","m":"이 성취기준은 어미 묶음 약자를 읽고 쓰는 능력을 기르게 하고자 설정하였다. 단어의 마지막 글자를 사용하는 4-6점 어미 묵음 약자, 5-6점 어미 묶음 약자 등의 점자 기호와 규정을 다룬다. 다양한 예문으로 어미 묶음 약자의 규정을 이해하고, 어미 묶음 약자를 사용하는 단어와 문장을 정확하고 유창하게 읽고 쓰도록 한다.","n":[],"p":304,"b":2},{"c":"[9점자04-09]","k":"공통","sk":"","s":"점자","g":"중학교 1~3학년","d":"영어 점자","t":"축어의 점자 기호와 규정을 알고, 점자로 읽고 쓴다.","m":"이 성취기준은 축어를 읽고 쓰는 능력을 기르게 하고자 설정하였다. 글자 또는약자 두 개 이상을 조합하여 단어를 나타내는 75개 축어의 점자 기호와 규정을 다룬다. 다양한 예문으로 축어의 점자 규정을 이해하고, 축어를 사용하는 문장을 정확하고 유창하게 읽고 쓰도록 한다.","n":[],"p":304,"b":2},{"c":"[9점자04-10]","k":"공통","sk":"","s":"점자","g":"중학교 1~3학년","d":"영어 점자","t":"약어와 두문자어의 점자 기호와 규정을 알고, 점자로 읽고 쓴다.","m":"이 성취기준은 약어와 두문자어를 읽고 쓰는 능력을 기르게 하고자 설정하였다. 한 단어 또는 여러 개의 단어를 두서너 개의 철자로 줄여서 쓰는 약어와 두문자어의 점자 기호와 규정을 다룬다. 다양한 예문으로 약어와 두문자어의 규정을 이해하고, 약어와 두문자어를 사용하는 문장을 정확하고 유창하게 읽고 쓰도록 한다.","n":[],"p":304,"b":2},{"c":"[9점자05-01]","k":"공통","sk":"","s":"점자","g":"중학교 1~3학년","d":"일본어 점자","t":"청음의 점자 기호와 규정을 알고, 점자로 읽고 쓴다.","m":"이 성취기준은 가나의 청음을 점자로 읽고 쓰는 능력을 기르게 하고자 설정하였다. 청음의 모음자 ‘あ, い, う, え, お’행과 자음자 ‘か, さ, た, な, は, ま, や, ら, わ’행 등의 점자 기호와 규정을 다룬다. 다양한 예문으로 청음의 점자 규정을 이해하고, 점자로 정확하고 유창하게 읽고 쓰도록 한다.","n":[],"p":306,"b":2},{"c":"[9점자05-02]","k":"공통","sk":"","s":"점자","g":"중학교 1~3학년","d":"일본어 점자","t":"탁음의 점자 기호와 규정을 알고, 점자로 읽고 쓴다.","m":"이 성취기준은 가나의 탁음을 점자로 읽고 쓰는 능력을 기르게 하고자 설정하였다. 청음(か, さ, た, は)의 4개 행에 탁점을 붙이는 탁음, 청음 は행에 반탁점을 붙이는 반탁음 등의 점자 기호와 규정을 다룬다. 다양한 예문으로 탁음과 반탁음의 점자 규정을 이해하고, 점자로 정확하고 유창하게 읽고 쓰도록 한다.","n":[],"p":306,"b":2},{"c":"[9점자05-03]","k":"공통","sk":"","s":"점자","g":"중학교 1~3학년","d":"일본어 점자","t":"요음의 점자 기호와 규정을 알고, 점자로 읽고 쓴다.","m":"이 성취기준은 가나의 요음을 점자로 읽고 쓰는 능력을 기르게 하고자 설정하였다. 청음 ‘か, さ, た, な, は, ま, ら’행에 や행을 조합한 요음, 탁음 ‘が, ざ, だ, ば’행에 요음점을 붙이는 요탁음, 반탁음 ぱ행에 요음점을 붙이는 요반탁음 등의 점자 기호와 규정을 다룬다. 다양한 예문으로 요음의 점자 규정을 이해하고, 점자로 정확하고 유창하게 읽고 쓰도록 한다.","n":[],"p":306,"b":2},{"c":"[9점자05-04]","k":"공통","sk":"","s":"점자","g":"중학교 1~3학년","d":"일본어 점자","t":"가나 점자의 규정에 따라 단어와 문장을 점자로 읽고 쓴다.","m":"이 성취기준은 청음, 탁음, 요음이 포함된 단어와 문장을 점자로 읽고 쓰는 능력을 기르게 하고자 설정하였다. 일본어 교과서에 나오는 기본적인 단어, 어구, 문장 등을 다룬다. 청음, 탁음, 요음을 사용하는 단어와 문장을 점자 규정에 따라 정확하고 유창하게 읽고 쓰도록 한다.","n":[],"p":306,"b":2},{"c":"[9점자05-05]","k":"공통","sk":"","s":"점자","g":"중학교 1~3학년","d":"일본어 점자","t":"장음의 점자 기호와 규정을 알고, 점자로 읽고 쓴다.","m":"이 성취기준은 장음을 점자로 읽고 쓰는 능력을 기르게 하고자 설정하였다. 일본어 ‘あ, い, え’단의 장음표, ‘う, お’단의 장음표 등의 점자 기호와 규정을 다룬다. 다양한예문으로 장음의 점자 규정을 이해하고, 장음을 사용하는 단어와 문장을 점자로 정확하고 유창하게 읽고 쓰도록 한다.","n":[],"p":306,"b":2},{"c":"[9점자05-06]","k":"공통","sk":"","s":"점자","g":"중학교 1~3학년","d":"일본어 점자","t":"촉음과 ん발음의 점자 기호와 규정을 알고, 점자로 읽고 쓴다.","m":"이 성취기준은 촉음과 ん발음을 점자로 읽고 쓰는 능력을 기르게 하고자 설정하였다. 일본어 ‘か, さ, た, ぱ’행의 촉음 받침자, 촉음점 등과 ん발음 뒤에 오는 4가지 형태의 ん발음 받침자, ん발음점 등의 점자 기호와 규정을 다룬다. 다양한 예문으로 촉음과 ん발음의 점자 규정을 이해하고, 단어와 문장을 정확하고 유창하게 읽고 쓰도록 한다.","n":[],"p":306,"b":2},{"c":"[9점자05-07]","k":"공통","sk":"","s":"점자","g":"중학교 1~3학년","d":"일본어 점자","t":"로마자의 점자 기호와 규정을 알고, 점자로 읽고 쓴다.","m":"이 성취기준은 일본어의 로마자 표기를 점자로 읽고 쓰는 능력을 기르게 하고자 설정하였다. 일본어를 읽고 쓰는 데 필요한 로마자 모음자와 자음자의 표기, 요음자 표기, 특수음 등의 점자 기호와 규정을 다룬다. 다양한 예문으로 로마자 표기의 점자 규정을 이해하고, 점자로 정확하게 읽고 쓰도록 한다.","n":[],"p":306,"b":2},{"c":"[9점자05-08]","k":"공통","sk":"","s":"점자","g":"중학교 1~3학년","d":"일본어 점자","t":"문장 부호의 점자 기호와 규정을 알고, 점자로 읽고 쓴다.","m":"이 성취기준은 문장 부호를 점자로 읽고 쓰는 능력을 기르게 하고자 설정하였다. 일본어의 마침표, 물음표, 느낌표 등의 점자 기호와 규정을 다룬다. 다양한 예문으로 문장 부호의 점자 규정을 이해하고, 문장 부호를 사용하는 문장을 정확하고 유창하게 읽고 쓰도록 한다.","n":[],"p":306,"b":2},{"c":"[9점자05-09]","k":"공통","sk":"","s":"점자","g":"중학교 1~3학년","d":"일본어 점자","t":"숫자와 기타 부호의 점자 기호와 규정을 알고, 점자로 읽고 쓴다.","m":"이 성취기준은 숫자와 단위, 기타 부호를 점자로 읽고 쓰는 능력을 기르게 하고자 설정하였다. 숫자, 단위, 문장 속의 일본어표, 대소문자 영문표 등의 점자 기호와 규정을 다룬다. 다양한 예문으로 숫자와 단위 및 기타 부호의 점자 규정을 이해하고, 숫자와 단위 및 기타 부호를 사용하는 문장을 정확하고 유창하게 읽고 쓰도록 한다.","n":[],"p":306,"b":2},{"c":"[12점자01-01]","k":"공통","sk":"","s":"점자","g":"고등학교 1~3학년","d":"한글 점자","t":"옛 글자의 자음자와 기본 받침의 점자 기호와 규정을 알고, 점자로 읽고 쓴다.","m":"이 성취기준은 옛 글자의 자음자와 기본 받침을 점자로 읽고 쓰는 능력을 기르게 하고자 설정하였다. 옛 글자 표, ‘ㅿ(반치음), ㆁ(옛이응), ㆆ(여린히읗)’, ㅹ(순경음 쌍비읍)과 (반설경음 리을) 등의 옛 자음자의 점자 기호와 규정을 다룬다. 다양한 예문을 점자로 읽고 쓰는 과정에서 옛 자음자를 점자로 정확하고 유창하게 읽고 쓰도록 한다.","n":[],"p":309,"b":2},{"c":"[12점자01-02]","k":"공통","sk":"","s":"점자","g":"고등학교 1~3학년","d":"한글 점자","t":"옛 글자의 모음자의 점자 기호와 규정을 알고, 점자로 읽고 쓴다.","m":"","n":[],"p":309,"b":2},{"c":"[12점자01-03]","k":"공통","sk":"","s":"점자","g":"고등학교 1~3학년","d":"한글 점자","t":"옛 글자의 방점 점자의 점자 기호와 규정을 알고, 점자로 읽고 쓴다.","m":"이 성취기준은 옛 글자의 방점을 점자로 읽고 쓰는 능력을 기르게 하고자 설정하였다. 음의 높낮이를 나타내는 방점 중 거성, 상성 등의 점자 기호와 규정을 다룬다. 다양한 예문을 점자로 읽고 쓰는 과정에서 방점이 들어간 글자를 점자로 정확하고 유창하게 읽고 쓰도록 한다.","n":[],"p":309,"b":2},{"c":"[12점자02-01]","k":"공통","sk":"","s":"점자","g":"고등학교 1~3학년","d":"수학 점자","t":"복소수와 관련된 점자 기호와 규정을 알고, 점자로 읽고 쓴다.","m":"이 성취기준은 복소수가 포함된 식을 점자로 읽고 쓰는 능력을 기르게 하고자 설정하였다. 켤레 복소수, 허근(ω) 등의 점자 기호와 규정을 다룬다. 다양한 예문으로 복소수의 점자 규정을 이해하고, 공통수학1과 기본수학1의 다항식과 관련된 단원을 학습하도록 한다.","n":[],"p":310,"b":2},{"c":"[12점자02-02]","k":"공통","sk":"","s":"점자","g":"고등학교 1~3학년","d":"수학 점자","t":"순열과 조합의 점자 기호와 규정을 알고, 점자로 읽고 쓴다.","m":"이 성취기준은 순열과 조합이 포함된 식을 점자로 읽고 쓰는 능력을 기르게 하고자 설정하였다. 계승, 순열, 조합 등의 점자 기호와 규정을 다룬다. 다양한 예문으로 순열과 조합의 점자 규정을 이해하고, 공통수학1과 기본수학1의 ‘경우의 수’와 관련된 단원을학습하도록 한다.","n":[],"p":310,"b":2},{"c":"[12점자02-03]","k":"공통","sk":"","s":"점자","g":"고등학교 1~3학년","d":"수학 점자","t":"행렬과 관련된 점자 기호와 규정을 알고, 점자로 읽고 쓴다.","m":"이 성취기준은 행렬을 점자로 읽고 쓰는 능력을 기르게 하고자 설정하였다. 아래 첨자, 행렬 괄호, 개행 기호, 역행렬 등의 점자 기호와 규정을 다룬다. 다양한 예문으로 행렬의 점자 규정을 이해하고, 공통수학1과 기본수학1의 ‘행렬’과 관련된 단원을 학습하도록 한다.","n":[],"p":310,"b":2},{"c":"[12점자02-04]","k":"공통","sk":"","s":"점자","g":"고등학교 1~3학년","d":"수학 점자","t":"집합과 명제의 점자 기호와 규정을 알고, 점자로 읽고 쓴다.","m":"이 성취기준은 집합과 명제를 점자로 읽고 쓰는 능력을 기르게 하고자 설정하였다. 집합의 표현, 원소 관련 기호, 집합의 포함관계 기호, 원소의 개수 기호, 집합의 연산 기호, 부정(~), →, ⇒, ⇔ 등의 점자 기호와 규정을 다룬다. 다양한 예문으로 집합과 명제의 점자 규정을 이해하고, 공통수학2와 기본수학2의 ‘집합과 명제’ 관련 단원을 학습하도록 한다.","n":[],"p":310,"b":2},{"c":"[12점자02-05]","k":"공통","sk":"","s":"점자","g":"고등학교 1~3학년","d":"수학 점자","t":"함수와 관련된 점자 기호와 규정을 알고, 점자로 읽고 쓴다.","m":"이 성취기준은 함수와 그래프를 점자로 읽고 쓰는 능력을 기르게 하고자 설정하였다. 대응의 표현, 함수의 표현, 합성함수, 역함수 등의 점자 기호와 규정을 다룬다. 다양한 예문으로 함수와 그래프의 점자 규정을 이해하고, 공통수학2와 기본수학2의 ‘함수와그래프’ 관련 단원을 학습하도록 한다.","n":[],"p":310,"b":2},{"c":"[12점자02-06]","k":"공통","sk":"","s":"점자","g":"고등학교 1~3학년","d":"수학 점자","t":"지수와 로그를 표현하는 점자 기호와 규정을 알고, 점자로 읽고 쓴다.","m":"이 성취기준은 지수와 로그가 포함된 식을 점자로 읽고 쓰는 능력을 기르게 하고자 설정하였다. 거듭제곱근, 지수의 확장, 로그의 표현 등의 점자 기호와 규정을 다룬다. 다양한 예문으로 지수와 로그의 점자 규정을 이해하고, 대수의 ‘지수함수와 로그함수’ 관련 단원을 학습하도록 한다.","n":[],"p":310,"b":2},{"c":"[12점자02-07]","k":"공통","sk":"","s":"점자","g":"고등학교 1~3학년","d":"수학 점자","t":"삼각함수를 표현하는 점자 기호와 규정을 알고, 점자로 읽고 쓴다.","m":"이 성취기준은 삼각함수를 점자로 읽고 쓰는 능력을 기르게 하고자 설정하였다. 호도법, sin, cos, tan등의 점자 기호와 규정을 다룬다. 다양한 예문으로 삼각함수의 점자 규정을 이해하고, 대수의 ‘삼각함수’와 관련된 단원을 학습하도록 한다.","n":[],"p":310,"b":2},{"c":"[12점자02-08]","k":"공통","sk":"","s":"점자","g":"고등학교 1~3학년","d":"수학 점자","t":"수열과 관련된 점자 기호와 규정을 알고, 점자로 읽고 쓴다.","m":"이 성취기준은 수열을 점자로 읽고 쓰는 능력을 기르게 하고자 설정하였다. 항, 수열, 총합(Σ) 등의 점자 규정을 다룬다. 다양한 예문을 통해 수열의 점자 규정을 이해하고, 대수의 ‘수열’과 관련된 단원을 학습하도록 한다.","n":[],"p":310,"b":2},{"c":"[12점자02-09]","k":"공통","sk":"","s":"점자","g":"고등학교 1~3학년","d":"수학 점자","t":"극한과 관련된 점자 기호와 규정을 알고, 점자로 읽고 쓴다.","m":"이 성취기준은 극한을 점자로 읽고 쓰는 능력을 기르게 하고자 설정하였다. 무한대, 구간, 극한 등의 점자 기호와 규정을 다룬다. 다양한 예문으로 극한의 점자 규정을 이해하고, 미적분Ⅰ의 ‘함수의 극한과 연속’ 관련 단원을 학습하도록 한다.","n":[],"p":310,"b":2},{"c":"[12점자02-10]","k":"공통","sk":"","s":"점자","g":"고등학교 1~3학년","d":"수학 점자","t":"미분과 관련된 점자 기호와 규정을 알고, 점자로 읽고 쓴다.","m":"이 성취기준은 미분이 포함된 식을 점자로 읽고 쓰는 능력을 기르게 하고자 설정하였다. 미분계수의 표현, 도함수, 증가, 감소 등의 점자 규정을 다룬다. 다양한 예문을 통해 미분의 점자 규정을 이해하고, 미적분Ⅰ의 ‘미분’과 관련된 단원을 학습하도록 한다.","n":[],"p":310,"b":2},{"c":"[12점자02-11]","k":"공통","sk":"","s":"점자","g":"고등학교 1~3학년","d":"수학 점자","t":"적분과 관련된 점자 기호와 규정을 알고, 점자로 읽고 쓴다.","m":"이 성취기준은 적분이 포함된 식을 점자로 읽고 쓰는 능력을 기르게 하고자 설정하였다. 부정적분, 정적분 등의 점자 기호와 규정을 다룬다. 다양한 예문으로 적분의 점자 규정을 이해하고, 미적분Ⅰ의 ‘적분’과 관련된 단원을 학습하도록 한다.","n":[],"p":310,"b":2},{"c":"[12점자02-12]","k":"공통","sk":"","s":"점자","g":"고등학교 1~3학년","d":"수학 점자","t":"중복순열과 중복조합의 점자 기호와 규정을 알고, 점자로 읽고 쓴다.","m":"이 성취기준은 중복순열과 중복조합을 점자로 읽고 쓰는 능력을 기르게 하고자 설정하였다. 중복순열, 중복조합 등의 점자 기호와 규정을 다룬다. 다양한 예문으로 중복순열과 중복조합의 점자 규정을 이해하고, 확률과 통계의 ‘경우의 수’와 관련된 단원을 학습하도록 한다.","n":[],"p":310,"b":2},{"c":"[12점자02-13]","k":"공통","sk":"","s":"점자","g":"고등학교 1~3학년","d":"수학 점자","t":"확률과 관련된 점자 기호와 규정을 알고, 점자로 읽고 쓴다.","m":"이 성취기준은 확률과 관련된 식을 점자로 읽고 쓰는 능력을 기르게 하고자 설정하였다. 확률, 조건부확률 등의 점자 기호와 규정을 다룬다. 다양한 예문으로 확률의 점자 규정을 이해하고, 확률과 통계의 ‘확률’과 관련된 단원을 학습하도록 한다.","n":[],"p":310,"b":2},{"c":"[12점자02-14]","k":"공통","sk":"","s":"점자","g":"고등학교 1~3학년","d":"수학 점자","t":"통계와 관련된 점자 기호와 규정을 알고, 점자로 읽고 쓴다.","m":"이 성취기준은 통계와 관련된 식을 점자로 읽고 쓰는 능력을 기르게 하고자 설정하였다. 확률변수, 평균, 분산, 표준편차, 이항분포, 정규분포 등의 점자 기호와 규정을 다룬다. 다양한 예문으로 통계의 점자 규정을 이해하고, 확률과 통계의 ‘통계’와 관련된 단원을 학습하도록 한다.","n":[],"p":310,"b":2},{"c":"[12점자03-01]","k":"공통","sk":"","s":"점자","g":"고등학교 1~3학년","d":"과학 점자","t":"수식의 점자 기호와 규정을 알고, 점자로 읽고 쓴다.","m":"이 성취기준은 통합과학, 물리학, 지구과학 등의 수식을 점자로 읽고 쓰는 능력을 기르게 하고자 설정하였다. 문자, 분수, 괄호, 묶음 괄호, 연산 기호, 관계 기호, 수식연결 기호, 그리스 문자 등의 점자 기호와 표기 규정을 다룬다. 다양한 예문으로 수식의 점자 규정을 이해하고, 과학의 수식과 관련된 단원을 학습 할 수 있도록 한다.","n":[],"p":312,"b":2},{"c":"[12점자03-02]","k":"공통","sk":"","s":"점자","g":"고등학교 1~3학년","d":"과학 점자","t":"유전자를 표현하는 점자 기호와 규정을 알고, 점자로 읽고 쓴다.","m":"이 성취기준은 유전자를 점자로 읽고 쓰는 능력을 기르게 하고자 설정하였다. DNA 염기 서열, DNA 복제 등의 점자 기호와 표기 규정을 다룬다. 다양한 예문으로 유전자를 표현하는 점자 규정을 이해하고, 과학의 유전과 관련된 단원을 학습하도록 한다.","n":[],"p":312,"b":2},{"c":"[12점자03-03]","k":"공통","sk":"","s":"점자","g":"고등학교 1~3학년","d":"과학 점자","t":"공유 결합 화합물을 표현하는 점자 기호와 규정을 알고, 점자로 읽고 쓴다.","m":"이 성취기준은 화학의 공유 결합의 구조식을 점자로 읽고 쓰는 능력을 기르게 하고자 설정하였다. 쇄식 화합물과 고리 화합물의 기호 표기 형식과 공간 배치 표기 형식의 여러 가지 결합선, 방향 표시, 환핵, 대문자 구절표, 대문자 종료표 등의 점자 기호와 규정을 다룬다. 다양한 예문으로 공유 결합 화합물을 표현하는 점자 규정을 이해하고, 화학의 공유 결합과 관련된 단원을 학습하도록 한다.","n":[],"p":312,"b":2},{"c":"[12점자03-04]","k":"공통","sk":"","s":"점자","g":"고등학교 1~3학년","d":"과학 점자","t":"전자 점식을 표현하는 점자 기호와 규정을 알고, 점자로 읽고 쓴다.","m":"이 성취기준은 화학의 전자 점식을 점자로 읽고 쓰는 능력을 기르게 하고자 설정하였다. 전자 점식의 기호 표기 형식과 공간 배치 표기 형식의 원소 기호, 전자, 방향 표시, 대문자 구절표, 대문자 종료표의 점자 기호와 규정을 다룬다. 다양한 예문으로 전자 점식을 표현하는 점자 규정을 이해하고, 화학의 전자 점식과 관련된 단원을 학습하도록 한다.","n":[],"p":312,"b":2},{"c":"[12점자03-05]","k":"공통","sk":"","s":"점자","g":"고등학교 1~3학년","d":"과학 점자","t":"화학 반응식을 표현하는 점자 기호와 규정을 알고, 점자로 읽고 쓴다.","m":"이 성취기준은 반응 조건, 물질의 상태 등을 포함한 복잡한 화학 반응식을 점자로 읽고 쓰는 능력을 기르게 하고자 설정하였다. 분자식, 계수, 이온, 화살표, 물질의 침전 기호, 기체의 발생 기호, 반응 조건, 괄호 속 로마자, 한글 설명, 대문자 구절표, 대문자 종료표 등의 점자 기호와 규정을 다룬다. 다양한 예문으로 화학 반응식을 표현하는 점자 규정을 이해하고, 화학의 반응식과 관련된 단원을 학습하도록 한다.","n":[],"p":312,"b":2},{"c":"[2수어01-01]","k":"공통","sk":"","s":"수어","g":"초등학교 1~2학년","d":"수어 이해⋅표현","t":"사물의 일반적 특징을 묘사하는 방법을 익혀 수어로 표현하는 즐거움을 느낀다.","m":"이 성취기준은 시각 자료를 활용하여 다양한 사물을 제시하고 그 사물의 일반적인 특성을 파악하여 표현해 봄으로써 수어로 표현하는 즐거움을 얻게 하고자 설정하였다.","n":["이 성취기준 적용 시 수어는 그림처럼 표현된다는 것을 인지하여 사물의 일반적 특징을 파악하고 수어로 표현해 봄으로써 수어의 도상성을 이해하도록 지도한다. 우리주변에서 발견할 수 있는 다양한 사물을 수어로 표현해 보는 즐거움을 느끼도록 지도한다."],"p":328,"b":2},{"c":"[2수어01-02]","k":"공통","sk":"","s":"수어","g":"초등학교 1~2학년","d":"수어 이해⋅표현","t":"지문자 표현을 익혀 자신이 선호하는 물건을 지문자로 표현한다.","m":"이 성취기준은 지문자를 익힌 후 한글 단어를 지문자로 표현하는 능력을 기르고 학습자가 선호하는 물건이 그려진 그림 카드를 보고 이를 지문자로 바꾸어 보는 연습을하며 지문자 활용 능력을 기르게 하고자 설정하였다.","n":["이 성취기준 적용 시 학습자가 한글 자모음과 지문자 자모음을 대응하여 반복 연습하도록 지도한다. 지문자를 숙지한 후에는 다양한 그림과 글자 카드를 활용하여 그림과 글자에 맞는 지문자로 표현하는 능력을 기르도록 지도한다. 이때 다양한 교재와 교구, 시각 자료 등을 활용하여 반복 학습에 따른 지루함을 느끼지 않도록 지도한다."],"p":328,"b":2},{"c":"[2수어01-03]","k":"공통","sk":"","s":"수어","g":"초등학교 1~2학년","d":"수어 이해⋅표현","t":"지숫자 표현을 익혀 친숙한 주제의 이야기에 지숫자를 포함하여 표현한다.","m":"이 성취기준은 지숫자 1∼10의 표현을 익히고 숫자가 포함되어 있는 친숙한 주제의 동화, 만화 등을 선정해서 내용을 이해하고, 물건의 수 세기, 나이, 생일, 주소 등의 지숫자를 포함하여 수어로 줄거리를 표현해 보는 능력을 기르게 하고자 설정하였다.","n":["이 성취기준 적용 시 지숫자로 숫자 표현하는 방법을 교사의 시연을 바탕으로 반복 연습하도록 지도한다. 친숙한 주제의 동화나 만화, 동요에 나오는 숫자를 지숫자로 바꾸어 표현해 봄으로써 지숫자 사용에 흥미를 갖도록 지도한다."],"p":328,"b":2},{"c":"[2수어01-04]","k":"공통","sk":"","s":"수어","g":"초등학교 1~2학년","d":"수어 이해⋅표현","t":"공간을 사용하여 주체와 객체를 구분하여 수어로 인사를 주고받으며 시각을 통한 의사소통의 특성을 인지한다.","m":"이 성취기준은 공간을 활용한 주체와 객체를 구분하여 다양한 인사법을 주고받으면서 시각을 이용한 의사소통의 특성을 인지하게 하고자 설정하였다.","n":["이 성취기준 적용 시 교사는 학습자가 ‘수어 공간’의 의미를 이해하도록 설명한다. 수어를 가슴 높이에서 하고 주체와 객체에 따른 인사 주고받기를 하며 시각 언어로서 수어의 특성인 공간성과 동시성, 가역성을 인식하도록 지도한다."],"p":328,"b":2},{"c":"[2수어01-05]","k":"공통","sk":"","s":"수어","g":"초등학교 1~2학년","d":"수어 이해⋅표현","t":"긍정과 부정, 강약, 감정에 따른 비수지를 이해하여 비수지로 의사소통한다.","m":"이 성취기준은 비수지에 대해 알고 이해하여 긍정과 부정, 강약에 따른 비수지표현을 익혀서 일상생활에서 비수지를 활용해 의사소통하는 능력을 기르게 하고자 설정하였다.","n":["이 성취기준 적용 시 교사가 다양한 비수지 표현을 보여 주고 학습자가 따라 해 봄으로써 다양한 비수지를 활용해서 자신의 의사를 표현할 수 있다는 것을 알도록 지도한다. 긍정과 부정의 비수지를 익혀 비수지를 활용해 의사소통하는 방법을 익히도록 하고, 다양한 감정과 감정의 강도를 표정으로 나타내는 연습을 한다. 비수지를 활용하여 감정의 변화를 전달할 수 있음을 지도한다."],"p":328,"b":2},{"c":"[2수어02-01]","k":"공통","sk":"","s":"수어","g":"초등학교 1~2학년","d":"교과 수어","t":"일상생활에서 자주 사용하는 생활안전과 교통안전을 이해하고 수어로 설명한다.","m":"이 성취기준은 청각장애 학생이 등하굣길에 발생할 수 있는 생활⋅안전사고를 예방하기 위해 도로에서 흔히 볼 수 있는 표지판을 읽고 수어로 설명하여 안전한 학교생활을 시작하게 하고자 설정하였다.","n":["이 성취기준 적용 시 7대 안전 교육 표준안의 생활안전과 교통안전의 성취기준을 참고하여 지도한다. 학습자 수준에 맞게 실물, 사진, 그림, 동영상 등의 자료를 활용하여 일상생활에 일반화하도록 지도한다."],"p":329,"b":2},{"c":"[2수어02-02]","k":"공통","sk":"","s":"수어","g":"초등학교 1~2학년","d":"교과 수어","t":"감염병 예방 방법을 일상생활 맥락에서 수어로 의미를 전달하고 표현한다.","m":"이 성취기준은 일상생활에서 발생할 수 있는 대표적인 감염병을 알고 이를 예방하기 위해 일상생활에서 실천하는 방법을 수어로 전달하고 표현할 수 있게 하고자 설정하였다.","n":["이 성취기준 적용 시 일상생활에서 흔히 발생하는 감염병인 계절성 독감, 수족구병, 수두 등을 수어로 이해하고 예방법을 수어로 설명하도록 지도한다."],"p":329,"b":2},{"c":"[2수어02-03]","k":"공통","sk":"","s":"수어","g":"초등학교 1~2학년","d":"교과 수어","t":"재난 대응 방법을 일상 대화에서 이해하고 수어로 전달한다.","m":"이 성취기준은 일상생활에서 발생할 수 있는 화재와 자연 재난 등의 사례를 알고 예방법을 일상 대화에서 수어로 표현할 수 있게 하고자 설정하였다.","n":["이 성취기준 적용 시 7대 안전 교육 표준안의 재난 안전 부분 중 초등 1~2학년 화재와 자연 재난의 성취기준을 참고하여 지도한다. 학습자의 수준에서 이해할 수 있는 구체적인 사례와 영상 등을 활용하여 일상생활에 일반화하도록 지도한다."],"p":329,"b":2},{"c":"[2수어02-04]","k":"공통","sk":"","s":"수어","g":"초등학교 1~2학년","d":"교과 수어","t":"생활 주변의 동물과 여러 가지 악기, 색깔에 호기심을 가지고 수어로 표현한다.","m":"이 성취기준은 우리 생활 주변의 다양한 동물(강아지, 고양이 등)을 수어로 표현하고, 학습자가 쉽게 접할 수 있는 악기(피아노, 북, 탬버린 등)와 색깔(빨강, 노랑, 파랑, 초록, 검정 등)도 호기심을 가지고 수어로 표현할 수 있게 하고자 설정하였다.","n":["이 성취기준 적용 시 우리 생활 주변에서 접할 수 있는 다양한 동물(강아지, 고양이 등), 악기, 색깔을 표현활동 놀이와 사진, 영상 등을 활용하여 수어로 표현함으로써 수어에 대한 호기심과 흥미를 느끼도록 지도한다."],"p":329,"b":2},{"c":"[2수어02-05]","k":"공통","sk":"","s":"수어","g":"초등학교 1~2학년","d":"교과 수어","t":"일상생활에서 경험하는 문화의 다양성을 수어로 표현하고 이웃과 주변 시설을 수어로 설명한다.","m":"이 성취기준은 청각장애 학생이 경험할 수 있는 우리 주변의 여러 나라 문화를 수어로 이해하고 표현하며 일상생활에서 흔히 접하는 이웃과 주변 시설을 수어로 설명할 수 있게 하고자 설정하였다.","n":["이 성취기준 적용 시 청각장애 학생들이 일상생활에서 경험하는 다양한 문화, 가정과 학교를 중심으로 흔히 접할 수 있는 주변 시설 체험은 물론 실물을 활용하여 수어로 표현하도록 지도한다."],"p":329,"b":2},{"c":"[2수어02-06]","k":"공통","sk":"","s":"수어","g":"초등학교 1~2학년","d":"교과 수어","t":"지숫자에 흥미와 호기심을 가지고 네 자릿수 이하의 수와 시간을 수어로 표현한다.","m":"이 성취기준은 수학에서 가장 기초가 되는 네 자릿수 이하의 수와 시간을 지숫자로 표현하는 활동에 호기심과 흥미를 느낄 수 있게 하고자 설정하였다.","n":["이 성취기준 적용 시 수학에서 가장 기초가 되는 네 자릿수 이하의 수를 지숫자로 익히도록 반복하여 연습하고, 시계를 보고 시간을 수어로 표현하는 데 호기심과 흥미를 느끼도록 지도한다."],"p":329,"b":2},{"c":"[2수어02-07]","k":"공통","sk":"","s":"수어","g":"초등학교 1~2학년","d":"교과 수어","t":"사계절을 수어로 표현하고 식물과 동물의 성장을 일상 대화에서 수어로 설명한다.","m":"이 성취기준은 우리나라의 뚜렷한 사계절과 관계된 여러 가지 단어를 익히고 일상생활에서 흔히 접하는 동물과 식물의 성장 과정을 수어로 설명할 수 있게 하고자 설정하였다.","n":["이 성취기준 적용 시 사계절과 관계된 여러 가지 단어를 사진이나 영상을 활용하여 수어로 익히고 자유롭게 표현하며 일상생활에서 흔히 접하는 강아지, 고양이, 닭(병아리) 등의 동물과 식물의 성장 과정을 수어로 설명하도록 지도한다."],"p":329,"b":2},{"c":"[2수어03-01]","k":"공통","sk":"","s":"수어","g":"초등학교 1~2학년","d":"수어 문법","t":"수어소(수형, 수위, 수동, 수향, 비수지)가 달라짐에 따라 다른 의미가 있다는 것을 이해한다.","m":"이 성취기준은 학습자가 수어를 하며 시각적으로 인지하게 되는 음소인 수어소(수형, 수위, 수동, 수향, 비수지)를 인식함으로써 언어의 최소 단위인 수어소를 변별하게 하고자 설정하였다. 타인과 의사소통을 정확히 하려면 수어소를 정확하게 나타내는 것이 중요하다는 것을 이해하는 활동에 중점을 둔다.","n":["이 성취기준 적용 시 교사의 시연, 수어 영상 동화, 수어 그림, 사진 등 다양한 수어 표현을 보고 수어가 비수지와 수지(수형, 수위, 수동, 수향) 요소로 이루어짐을 알도록 지도한다. 이때 청각장애 학생이 발견할 수 있는 수어소 변별 유형은 다를 수 있음을 고려하며 지도한다."],"p":331,"b":2},{"c":"[2수어03-02]","k":"공통","sk":"","s":"수어","g":"초등학교 1~2학년","d":"수어 문법","t":"긍정과 부정을 나타내는 비수지 표현의 차이를 인식하고 다양한 사람의 비수지 표현에 관심을 가진다.","m":"이 성취기준은 학습자가 긍정을 표현할 때의 비수지와 부정을 표현할 때의 비수지가 있음을 인식하게 하고자 설정하였다. 비수지는 얼굴 표정, 머리의 방향, 몸의 방향, 몸의 움직임, 시선 등 손 이외에 수어를 구성하는 요소이다. 다양한 사람의 비수지를 주의 깊게 관찰하여 긍정 표현과 부정 표현을 구분하는 데에 중점을 둔다.","n":["이 성취기준 적용 시 비수지의 긍정과 부정 표현을 보여 주는 다양한 수어 동영상 자료를 제시하여 긍정에 대한 비수지(예: 웃는 표정과 고개가 상하로 움직이는 동작)와 부정에 대한 비수지(예: 약간 얼굴을 찡그리는 표정과 얼굴을 좌우로 움직이는 동작)를 활용해 의사소통해 보도록 지도한다."],"p":331,"b":2},{"c":"[2수어03-03]","k":"공통","sk":"","s":"수어","g":"초등학교 1~2학년","d":"수어 문법","t":"단어의 개념을 알고 문장 구성 방법을 이해하며 대화 상황에 따라 의미 변화가 있다는 것에 관심을 가진다.","m":"이 성취기준은 수어 어휘가 대화에서 개념적 의미, 사용되는 맥락이나 상황에 따른 연상적 의미, 사용자 의도에 따라 달라지는 주제적 의미를 가질 수 있다는 것을 알게 하고자 설정하였다. 수어 어휘의 의미를 폭넓게 이해하고 수어를 통한 의사소통에 관심을 갖는 데에 중점을 둔다.","n":["이 성취기준 적용 시 수어 어휘 개념의 기본 의미를 알게 하며 상황에 따라 의미 변화가 있음을 다양한 예시를 들어 알도록 지도한다."],"p":331,"b":2},{"c":"[2수어03-04]","k":"공통","sk":"","s":"수어","g":"초등학교 1~2학년","d":"수어 문법","t":"단문과 복문을 구성하며 의사소통하는 즐거움을 느낀다.","m":"이 성취기준은 일상생활에서 많이 사용하는 기본적인 단문과 복문을 구성하고, 일상생활에서 수어 문장으로 의사소통하는 즐거움을 느끼게 하고자 설정하였다.","n":["이 성취기준 적용 시 수어 문장은 단문과 복문이 있으며, 단문은 서술 기능을 한 번 수행하는 문장을 의미한다. 수어 단문에서는 국어의 어순(주어+목적어+서술어)과 같은 경우도 있고 다른 경우도 있다는 것을 예문을 활용해 알도록 지도한다. 수어 복문은 서술 기능을 두 번 이상 수행하는 문장을 의미하며, 학습자가 주변에서 경험할 수 있는 다양한 예시 담화문을 활용해 지도한다."],"p":331,"b":2},{"c":"[2수어03-05]","k":"공통","sk":"","s":"수어","g":"초등학교 1~2학년","d":"수어 문법","t":"대화 속에서 화행적 특성을 발견하고 상황에 맞는 수지와 비수지 표현을 한다.","m":"이 성취기준은 수어의 화행적 특성을 알고 일상적인 대화에서 상황에 적절한 수지와 비수지를 사용하는 능력을 기르게 하고자 설정하였다. 화행은 언어의 상황적 맥락 안에서 화자의 의도적 의미와 관련된 행위로 수어에서도 상황에 따라 다르게 나타남을 이해해야 의사소통이 효과적으로 이루어짐을 알도록 지도한다.","n":["이 성취기준 적용 시 다양한 의사소통 사례를 보여 주며 실제 대화 상황에 맞는 수어 표현 방법을 지도하되, 이때 수지와 비수지를 함께 자연스럽게 조화를 이루어 표현할 수도 있고 비수지 단독으로도 표현할 수도 있음을 알도록 지도한다."],"p":331,"b":2},{"c":"[4수어01-01]","k":"공통","sk":"","s":"수어","g":"초등학교 3~4학년","d":"수어 이해⋅표현","t":"수어 단어에서 수어소의 정확한 표현을 익혀 하루 일과를 수어로 표현하고 능동적으로 대화에 참여한다.","m":"이 성취기준은 수어소(수형, 수위, 수동, 수향, 비수지)를 바르게 사용하여 수어단어의 정확한 표현을 익히는 데 초점을 둔다. 하루 일과를 단어 수준에서 수어로 표현해 보도록 하여 능동적으로 대화에 참여하는 능력을 기르게 하고자 설정하였다.","n":["이 성취기준 적용 시 하나의 수어소가 달라짐에 따라 의미가 다른 수어가 될 수 있다는 것을 인지하도록 하며, 정확한 단어를 사용하여 하루 일과를 수어로 표현해 보도록지도한다. 이때 상대방의 수어 표현과 자신의 표현 방법을 비교하고 수정해 가면서 능동적으로 수어 대화에 참여하는 능력을 기르도록 지도한다."],"p":333,"b":2},{"c":"[4수어01-02]","k":"공통","sk":"","s":"수어","g":"초등학교 3~4학년","d":"수어 이해⋅표현","t":"수어 단어 수준에서 수지(수형, 수위, 수동, 수향)에 따른 수어 의미의 변화를 활용하여 수어로 사건의 순서와 비교를 표현한다.","m":"이 성취기준은 수어 단어 수준에서 흔히 보이는 기본 문법적 기능을 익혀 수지(수형, 수위, 수동, 수향)에 따라 수어 표현이 어떻게 변화하는지를 파악하게 한다. 수어 공간에서 일치 동사의 이동 경로와 방향의 변화를 이해하여 수어를 보고 사건의 순서를 알고 공간을 활용하여 비교한 것을 표현하는 능력을 기르게 하고자 설정하였다.","n":["이 성취기준 적용 시 단문에서 흔히 보이는 공간과 방향을 활용한 문법적 기능을 익혀 주체와 객체 표현하기, 현재⋅과거⋅미래시제 표현하기, 사람과 사물 비교하기 등을 익히도록 하여 수어 표현이 자연스럽게 이루어지도록 지도한다."],"p":333,"b":2},{"c":"[4수어01-03]","k":"공통","sk":"","s":"수어","g":"초등학교 3~4학년","d":"수어 이해⋅표현","t":"감정 변화에 따른 단어 수준의 비수지 변화를 이해하고 대화에서 이를 활용하여 표현한다.","m":"이 성취기준은 감정을 표현하는 비수지를 익히고, 비수지를 활용하여 단어 수준으로 표현하는 데 중점을 둔다. 감정 변화에 따라 비수지가 어떻게 변하는지를 이해하고스스로 비수지를 활용하여 대화하는 능력을 기르게 하고자 설정하였다.","n":["이 성취기준 적용 시 비수지만으로도 단어를 표현할 수 있음을 인지하도록 한다. 감정을 나타내는 비수지를 익혀 대화 속에서 감정 변화에 따라 비수지가 어떻게 변화되는지를 알고 스스로 익숙하게 표현해 보도록 지도한다."],"p":333,"b":2},{"c":"[4수어01-04]","k":"공통","sk":"","s":"수어","g":"초등학교 3~4학년","d":"수어 이해⋅표현","t":"친숙한 주제로 시사 표현 방법을 익혀 자신의 취향과 생각을 수어 단문으로 표현함으로써 의사소통의 가치를 안다.","m":"이 성취기준은 일상생활에서 쉽게 접할 수 있는 시사와 관련된 사실을 핵심 단어를 중심으로 간략하게 수어로 표현하는 방법을 익히는 데 목적이 있다. 자신의 생각과 취향을 수어 단어를 활용하여 단문으로 표현해 보도록 하여 수어로 의사소통하는 가치를 깨닫게 하고자 설정하였다.","n":["이 성취기준 적용 시 청각장애 학생의 눈높이와 관심 수준에 맞는 주제를 선정하는 것이 중요하며 시사 내용을 선정한 후에는 청각장애 학생들에게 글의 핵심이 무엇인지 파악하게 한다. 파악한 내용을 단어 위주로 표현해 보게 함으로써 수어로 의사소통하는 것이 얼마나 가치 있는 일인지 스스로 깨닫도록 지도한다."],"p":333,"b":2},{"c":"[4수어01-05]","k":"공통","sk":"","s":"수어","g":"초등학교 3~4학년","d":"수어 이해⋅표현","t":"사람이나 사물의 움직임을 나타내는 수어 단문을 이해하여 자신의 생각을 수어로 표현함으로써 능동적으로 대화에 참여한다.","m":"이 성취기준은 일대일 의사소통 상황에서 사람이나 사물의 움직임을 수어로 표현하는 방법을 익히고, 자신의 생각을 단문으로 표현하는 능력을 길러 능동적으로 대화에 참여하게 하고자 설정하였다.","n":["이 성취기준 적용 시 수어로 사람이나 사물의 움직임을 나타낼 때는 분류사를 활용한다는 것을 인식시킨다. 단문 형식의 수어 문장을 제시하여 사람이나 사물의 움직임을 어떻게 표현하는지 알고, 상대방의 수어를 보고 자신의 생각을 표현해 보도록 함으로써 능동적으로 대화에 참여하는 능력을 기르도록 지도한다."],"p":333,"b":2},{"c":"[4수어02-01]","k":"공통","sk":"","s":"수어","g":"초등학교 3~4학년","d":"교과 수어","t":"교통수단을 안전하게 이용하는 방법을 일상생활 맥락에서 이해하고 수어로 설명한다.","m":"이 성취기준은 일상생활에서 자주 사용하는 교통수단(자전거, 버스, 지하철, 택시 등)의 안전한 이용법을 일상 대화에서 수어로 표현하고 설명할 수 있게 하고자 설정하였다.","n":["이 성취기준 적용 시 학습자가 일상생활에서 자주 사용하는 교통수단인 자전거, 버스, 지하철, 택시 등의 수어를 익히고 그 교통수단의 안전한 이용법을 이해하고 일상 대화에서 수어로 설명하도록 지도한다."],"p":335,"b":2},{"c":"[4수어02-02]","k":"공통","sk":"","s":"수어","g":"초등학교 3~4학년","d":"교과 수어","t":"생존 수영법을 일상 대화에서 적절하게 이해하고 수어로 설명한다.","m":"이 성취기준은 해당 학년에서 반드시 익혀야 할 생존 수영법을 수어로 이해하고 일상 대화에서 일반적 의미로 설명하여 자신과 타인의 생명을 지킬 수 있게 하고자 설정하였다.","n":["이 성취기준 적용 시 생존 수영법을 배워야 하는 이유를 정확히 알려 주고 구명조끼 착용법, 생존을 위한 다양한 수영법, 생활용품을 활용한 구조법 등을 실습과 병행하여 수어로 설명하여 자신과 타인의 생명을 지키도록 지도한다."],"p":335,"b":2},{"c":"[4수어02-03]","k":"공통","sk":"","s":"수어","g":"초등학교 3~4학년","d":"교과 수어","t":"다양한 매체를 활용하여 음악의 요소를 수어로 표현하고 설명한다.","m":"이 성취기준은 다양한 매체(책, TV, 스마트폰, 컴퓨터, 태블릿, 인터넷 등)를 활용하여 음악의 요소를 활동과 연계해 수어로 표현하고 자유롭게 설명할 수 있게 하고자 설정하였다.","n":["이 성취기준 적용 시 책, TV, 스마트폰, 컴퓨터, 태블릿, 인터넷 등의 다양한 매체를 활용하여 음높이, 음계, 조, 멜로디, 화음 등을 시각적 활동과 연계하여 익히고 표현하여 수어로 자유롭게 음악의 요소를 설명하도록 지도한다."],"p":335,"b":2},{"c":"[4수어02-04]","k":"공통","sk":"","s":"수어","g":"초등학교 3~4학년","d":"교과 수어","t":"다양한 매체를 활용하여 우리나라의 지리와 지형적 환경을 이해하고 표현하며 일상 대화에서 수어로 효율적으로 설명한다.","m":"이 성취기준은 디지털 영상 지도 등을 활용하여 우리나라의 지리와 지형적 환경을 이해하고 수어로 표현하며 일상 대화에서 효율적으로 설명할 수 있게 하고자 설정하였다.","n":["이 성취기준 적용 시 우리나라의 지리와 지형적 환경에 대한 이해도를 높이고자 디지털 영상 지도, 실물 지도 등을 활용하여 지도의 기본 요소(방위표, 기호와 범례, 축적, 등고선) 등에 대한 기초적 이해를 바탕으로 지도를 정확히 읽고 이를 일상 대화에서 수어로 설명하도록 지도한다."],"p":335,"b":2},{"c":"[4수어02-05]","k":"공통","sk":"","s":"수어","g":"초등학교 3~4학년","d":"교과 수어","t":"수의 체계와 사칙연산 습득의 필요성을 이해하고 수어로 자유롭게 표현한다.","m":"이 성취기준은 수학에서 기초가 되는 사칙연산을 수의 체계(자연수, 정수, 분수, 소수 등)로 확장하여 수어로 자유롭게 표현하고 문제를 해결할 수 있게 하고자 설정하였다.","n":["이 성취기준 적용 시 수학에서 기초가 되는 사칙연산을 학습자에게 친근한 물건 구입하기 등 실생활 상황을 이용하거나, 보드게임 등을 활용한 놀이 활동을 하며 수어로 자연스럽게 문제를 만들고 해결하도록 지도한다. 사칙연산의 문제는 수의 체계(자연수, 정수, 분수, 소수 등)를 확장하여 수어로 자유롭게 표현하고 문제를 해결하도록 지도한다."],"p":335,"b":2},{"c":"[4수어02-06]","k":"공통","sk":"","s":"수어","g":"초등학교 3~4학년","d":"교과 수어","t":"일상생활의 맥락에서 활용되는 여러 가지 도형과 시간, 길이, 들이, 무게, 각도의 기본 단위 개념을 수어로 효율적으로 표현한다.","m":"이 성취기준은 해당 학년에서 익혀야 하는 여러 가지 평면 도형의 구성 요소 등을 수어로 표현하고 일상생활의 맥락에서 활용되는 시간, 길이, 들이, 무게, 각도의 기본 단위 개념을 수어로 효율성 있게 표현할 수 있게 하고자 설정하였다.","n":["이 성취기준 적용 시 도형의 기초가 되는 직선, 선분, 반직선, 직각, 예각, 둔각을 수어로 구분하여 표현할 수 있게 지도한다. 일상생활에서 자주 사용하는 시간(분, 초 단위까지), 길이(mm, cm, m, km), 들이(ml, l), 무게(g, kg), 각도(1°) 등을 실생활 문제 상황에서 수어로 효율성 있게 표현하도록 지도한다."],"p":335,"b":2},{"c":"[4수어02-07]","k":"공통","sk":"","s":"수어","g":"초등학교 3~4학년","d":"교과 수어","t":"일상 대화에서 의미를 전달하고자 물질의 상태에 대해 다양한 매체를 활용하여 익히고 수어로 표현한다.","m":"이 성취기준은 과학적 지식인 물질의 상태를 나타내는 개념을 익히고 수어로 일상생활에서 그 의미를 전달할 수 있게 하고자 설정하였다.","n":["이 성취기준 적용 시 과학적 기초 지식인 물질의 상태를 나타내는 고체, 액체,기체의 개념을 실물과 영상을 활용하여 익히고 실험 과정과 관찰 결과를 수어로 일상생활에서 의미를 전달하도록 지도한다."],"p":335,"b":2},{"c":"[4수어03-01]","k":"공통","sk":"","s":"수어","g":"초등학교 3~4학년","d":"수어 문법","t":"수어 단어 표현에서 수어소(수형, 수위, 수동, 수향, 비수지)가 같은 표현을 찾아 분류한다.","m":"이 성취기준은 여러 가지 수어 단어 가운데 교사가 특정 수어소(수형, 수위, 수동, 수향, 비수지)를 공유하는 수어 단어를 제시하면 학습자가 같은 수어소가 있는 수어 단어를 찾아보게 하고자 설정하였다. 이때 수어 문법의 음운적 기능을 정확히 익히는 데에 중점을 둔다.","n":["이 성취기준 적용 시 수어 단어에는 비수지와 수지(수형, 수위, 수동, 수향)가있음을 인지하도록 하며, 수어소가 같은 것, 유사한 것(변이), 다른 것을 각각 구분할 수 있도록 지도한다."],"p":337,"b":2},{"c":"[4수어03-02]","k":"공통","sk":"","s":"수어","g":"초등학교 3~4학년","d":"수어 문법","t":"수어 문장 속에서 굴절 표현과 복수 표현에 따른 의미 변화를 이해하며 의사소통 상황에 맞게 적용한다.","m":"이 성취기준은 단어의 문법적 기능과 역할의 양상을 표현하는 굴절 표현, 둘 이상의 사물이나 현상을 표현하는 다양한 복수 표현을 문법 구조에 맞게 표현할 수 있게 하고자 설정하였다.","n":["이 성취기준 적용 시 수어에서 굴절 현상을 이해하며, 복수 표현은 지숫자 결합, 수어 반복, 반원 수동에 의한 복수 표현, 의미에 해당하는 복수 표현 등 다양한 표현이 있다는 것을 알고, 단어를 복수로 표현해 보도록 지도한다."],"p":337,"b":2},{"c":"[4수어03-03]","k":"공통","sk":"","s":"수어","g":"초등학교 3~4학년","d":"수어 문법","t":"수어 높임법을 나타내는 수지와 비수지 표현을 알고 수어 공동체 속에서 상황에 맞게 표현한다.","m":"이 성취기준은 수어 높임의 표현 방법을 알고 높임을 나타내는 어휘와 비수지를 상황에 맞게 적절히 사용하는 능력을 기르게 하고자 설정하였다.","n":["이 성취기준 적용 시 수어 높임법 표현은 국어의 높임법 표현과 달리 수어 어휘와 비수지를 정확하게 알고 사용하는 것이 중요하다는 것을 알고 높임말과 낮춤말을 서로 대응하며 표현해 보도록 지도한다."],"p":337,"b":2},{"c":"[4수어03-04]","k":"공통","sk":"","s":"수어","g":"초등학교 3~4학년","d":"수어 문법","t":"수어 어휘를 기준에 따라 상의어/하의어, 유의어/반의어, 다의어로 분류해 보고 의미 관계를 탐색한다.","m":"이 성취기준은 서로 관련되는 상의어/하의어, 유의어/반의어, 다의어 어휘 목록에 따라 수어 어휘의 의미 관계를 이해하여 분류해 보고 일상생활에서 어휘를 적재적소에 활용하도록 설정하였다.","n":["이 성취기준 적용 시 수어의 유형을 정확히 알고 있어야 가능하므로 상의어/하의어, 유의어/반의어, 다의어에 대한 개념을 충분히 이해하도록 지도한다."],"p":337,"b":2},{"c":"[4수어03-05]","k":"공통","sk":"","s":"수어","g":"초등학교 3~4학년","d":"수어 문법","t":"수어 문장의 기본 구조를 알고 활용된 단어는 문맥과 상황에 따라 의미 변화가 있음을 이해한다.","m":"이 성취기준은 수어 문장의 구조를 알고, 문장 안에서 사용된 어휘의 의미가 문맥과 상황에 따라 변화하여 사용되는 원인과 어떻게 변화되는지를 이해하게 하고자 설정하였다.","n":["이 성취기준 적용 시 수어 어휘의 의미가 상황과 문맥에 따라 다양하게 변화할 수 있다는 것을 알도록 다양한 예문을 활용하여 지도한다."],"p":337,"b":2},{"c":"[6수어01-01]","k":"공통","sk":"","s":"수어","g":"초등학교 5~6학년","d":"수어 이해⋅표현","t":"수어 문장의 정확한 표현과 쓰임을 익혀 수어로 제시되는 중문의 내용을 이해하고 핵심내용을 구체적으로 표현한다.","m":"이 성취기준은 문장 수준의 수어 표현을 익혀 중문으로 표현되는 수어를 보고 문장에서 수어가 어떻게 제시되는지를 익혀 내용을 이해하고 핵심 내용이 무엇인지를 파악하여 그 내용을 수어로 구체적으로 표현하게 하고자 설정하였다.","n":["이 성취기준 적용 시 다양한 학습 자료를 제시하여 중문으로 이루어진 다양한문장의 내용을 이해하고 핵심을 파악하여 수어로 구체적으로 표현해 보도록 지도한다."],"p":338,"b":2},{"c":"[6수어01-02]","k":"공통","sk":"","s":"수어","g":"초등학교 5~6학년","d":"수어 이해⋅표현","t":"수어 문장에서 문법적 요소를 이해하고 공간을 분리하여 두 가지 특징적 사물을 비교 설명한다.","m":"이 성취기준은 중문 안에 포함되어 있는 문법적 요소를 이해하여 특정한 사물에만 있는 특징을 바탕으로 표현되는 수어 표현을 익히고 공간을 분리하여 두 대상을 비교하는 방법을 수어로 설명하게 하고자 설정하였다.","n":["이 성취기준 적용 시 중문으로 이루어진 문장에서 왼쪽과 오른쪽의 공간을 분리하여 두 대상을 비교하는 수어 표현법과 자신의 몸과 가까운 공간과 먼 공간을 사용하여 비교하는 수어 표현법을 설명하도록 지도한다."],"p":338,"b":2},{"c":"[6수어01-03]","k":"공통","sk":"","s":"수어","g":"초등학교 5~6학년","d":"수어 이해⋅표현","t":"수어 문장의 정확한 표현과 쓰임을 익혀 시사 뉴스의 핵심 내용과 문장 수준의 비수지를활용하여 자신의 의견을 표현한다.","m":"이 성취기준은 문장 수준의 비수지 표현을 익혀 친숙한 주제로 시사 뉴스에 자주 나오는 수어를 이해하고 자신의 의견을 수어로 정확히 표현해 보게 하고자 설정하였다.","n":["이 성취기준 적용 시 청각장애 학생들의 흥미와 눈높이에 맞춘 친숙한 주제로시사 뉴스를 선택하도록 하며, 비수지로 내용을 파악하고, 비수지를 활용하여 평서문, 의문문, 조건문 등을 표현하고 시사 뉴스에 대한 자신의 의견을 정확히 표현하도록 지도한다."],"p":338,"b":2},{"c":"[6수어01-04]","k":"공통","sk":"","s":"수어","g":"초등학교 5~6학년","d":"수어 이해⋅표현","t":"다수의 인물이나 사물이 표현되는 수어를 보고 특징을 분석하고 상대방 이야기에 공감을나타내며 다양성을 존중하는 능력을 기른다.","m":"이 성취기준은 수어 문장 안에서 다수의 인물이나 사물이 어떻게 표현되는지를 보고 익혀서 특징을 분석하며, 상대방의 수어 이야기를 보고 공감을 표현하는 방법을 익히도록 하고 이를 표현하여 상대방 의견에 공감하고 다양성을 존중하는 것이 중요하다는 것을 깨닫게 하고자 설정하였다.","n":["이 성취기준 적용 시 다양한 자료를 활용하여 문장 안에서 공간을 활용하여 다수의 인물이나 사물을 수어로 표현하는 방법을 익히고, 표현의 특징을 분석한다. 일대일 대화 상황에서 상대방 이야기를 집중하고 공감 표현 방법을 익히면서 다양성을 인정하고 존중하는 마음을 기르도록 지도한다."],"p":338,"b":2},{"c":"[6수어01-05]","k":"공통","sk":"","s":"수어","g":"초등학교 5~6학년","d":"수어 이해⋅표현","t":"수어로 이야기의 핵심 내용을 구체적으로 표현하고 수어 표현과 다양한 양식의 의사소통방법과의 차이점을 파악한다.","m":"이 성취기준은 다양한 의사소통 방법을 찾아 보고 수어로 그 내용을 구체적으로 표현해 봄으로써 수어 외에 다양한 양식의 의사소통 방법이 있음을 알고 수어와의 차이점을 파악하게 하고자 설정하였다.","n":["이 성취기준 적용 시 다양한 의사소통 방법인 수어, 필담, 점자 등에 관한 내용을 선정하여 제시함으로써 다양한 의사소통 방법을 이해하고 수어와의 차이점을 파악하도록 지도한다."],"p":338,"b":2},{"c":"[6수어02-01]","k":"공통","sk":"","s":"수어","g":"초등학교 5~6학년","d":"교과 수어","t":"기사를 활용하여 아동 학대와 성폭력의 유형을 알고 예방법을 수어로 표현한다.","m":"이 성취기준은 청각장애 학생이 신문이나 인터넷 기사 등을 활용하여 일상생활에서 흔히 접할 수 있는 아동 학대와 성폭력의 유형을 알고 그 예방법을 수어로 자유롭게 표현할 수 있게 하고자 설정하였다.","n":["이 성취기준 적용 시 7대 안전 교육 표준안의 폭력 예방과 신변 안전 교육의 초등 5~6학년 성취기준을 참고하고 신문, 방송, 인터넷 기사 등을 활용하여 일상생활에서 흔히 접할 수 있는 아동 학대와 성폭력의 예방법을 찾아보고 수어로 자유롭게 표현하도록 지도한다."],"p":340,"b":2},{"c":"[6수어02-02]","k":"공통","sk":"","s":"수어","g":"초등학교 5~6학년","d":"교과 수어","t":"일상생활에서 자주 사용하는 통신기기와 컴퓨터 통신망의 건전한 사용 방법을 수어로 토론한다.","m":"이 성취기준은 일상생활에서 자주 사용하는 통신기기와 컴퓨터 통신망 등을 건강하게 사용하는 방법들을 수어로 토론할 수 있게 하고자 설정하였다.","n":["이 성취기준 적용 시 인터넷 및 사회 관계망 서비스(SNS), 단체 대화방 등에서 발생하는 사이버 폭력의 유형을 찾아서 수어로 설명하고 스마트폰과 컴퓨터 등을 통한 인터넷 통신망의 건전한 사용법을 수어로 토론하도록 지도한다."],"p":340,"b":2},{"c":"[6수어02-03]","k":"공통","sk":"","s":"수어","g":"초등학교 5~6학년","d":"교과 수어","t":"수어의 심미적 표현력을 높이기 위해 다양한 문화권의 예술 활동을 비교하고 수어로 설명한다.","m":"이 성취기준은 일상생활에서 만날 수 있는 다양한 문화권(다문화의 이해)의 예술 활동 등을 수어로 비교하고 설명할 수 있게 하고자 설정하였다.","n":["이 성취기준 적용 시 학습자가 일상생활에서 경험할 수 있는 다양한 문화권의예술 활동을 사진, 영상 등을 활용하여 작품과 관련된 정보나 이야기, 예술가에 대한 일화 등을 알고 수어로 비교하고 설명하도록 지도한다."],"p":340,"b":2},{"c":"[6수어02-04]","k":"공통","sk":"","s":"수어","g":"초등학교 5~6학년","d":"교과 수어","t":"일상생활에서 접할 수 있는 다양한 장르의 음악을 감상하고 수어로 자유롭게 표현한다.","m":"이 성취기준은 일상생활에서 접할 수 있는 다양한 장르의 음악(국악, 가요, 트로트 등)을 감상하고 그 느낌이나 내용을 수어 노래로 익히고 자유롭게 표현할 수 있게 하고자 설정하였다.","n":["이 성취기준 적용 시 일상생활에서 접할 수 있는 다양한 장르의 음악(국악, 대중가요 등)을 수어 노래로 익혀 수어에 흥미를 느끼고 즐기도록 지도한다. 다만 음악의 느낌을 수어로 표현하는 것에 국한하지 말고 수어를 포함하여 몸짓, 표정 등으로 다양하게 표현하도록 지도한다."],"p":340,"b":2},{"c":"[6수어02-05]","k":"공통","sk":"","s":"수어","g":"초등학교 5~6학년","d":"교과 수어","t":"민주적 의사 결정 과정을 일상 대화의 의미 전달 개념으로 표현하고 수어로 자유롭게 토론한다.","m":"이 성취기준은 인권 존중과 정의로운 사회 구현을 위한 민주적 의사 결정 원리를 일상생활에서 쉽게 경험할 수 있는 사례를 수어로 표현하고 토론할 수 있게 하고자 설정하였다.","n":["이 성취기준 적용 시 자신과 타인의 인권을 존중하고 정의로운 사회를 구현하기 위한 민주적 의사 결정 원리(다수결, 대화와 타협, 소수 의견 존중 등)를 학급 임원 선거나 학생인권 조례, 지방 선거 홍보자료 등과 같이 일상생활에서 쉽게 경험할 수 있는 사례를 중심으로 하여 수어로 자유롭게 토론하도록 지도한다."],"p":340,"b":2},{"c":"[6수어02-06]","k":"공통","sk":"","s":"수어","g":"초등학교 5~6학년","d":"교과 수어","t":"일상생활의 맥락에서 활용되는 수와 연산, 여러 가지 입체 도형을 수어로 표현하고 그래프가 의미하는 내용을 수어로 설명한다.","m":"이 성취기준은 자연수의 혼합 계산, 약수와 배수 등의 개념과 여러 가지 입체 도형의 개념과 성질을 수어로 자유롭게 표현하고 생활 주변에서 경험할 수 있는 자료들을 수집, 분류, 정리, 해석하고 그래프가 나타내는 의미를 수어로 설명할 수 있게 하고자 설정하였다.","n":["이 성취기준 적용 시 수어로 자연수의 혼합 계산, 약수와 배수 등의 개념을 익히고 여러 가지 입체 도형(직육면체와 정육면체, 각기둥과 각뿔, 원기둥과 원뿔 등)의 개념과 성질을 쌓기 나무, 입체 도형 모형 등과 같은 실물을 활용하여 수어로 자유롭게 표현하며 생활 주변에서 경험할 수 있는 자료들을 활용하여 수집, 분류, 정리, 해석하고 막대그래프, 띠그래프, 원그래프 등의 그래프가 나타내는 의미를 수어로 이해하고 설명하도록 지도한다."],"p":340,"b":2},{"c":"[6수어02-07]","k":"공통","sk":"","s":"수어","g":"초등학교 5~6학년","d":"교과 수어","t":"수어 응용 능력을 향상시키기 위해 일상생활 맥락에서 활용되는 열과 에너지를 수어로 설명한다.","m":"이 성취기준은 일상생활에 밀접한 영향을 미치는 온도, 전도, 대류 열의 이동과 단열 등을 수어로 익히고 수어로 자유롭게 설명할 수 있게 하고자 설정하였다.","n":["이 성취기준 적용 시 일상생활에 밀접한 영향을 미치는 온도, 전도, 대류 열의 이동과 단열 등을 실험을 하며 시각적으로 이해하고 이를 수어로 자유롭게 설명할 수 있도록 지도한다."],"p":340,"b":2},{"c":"[6수어03-01]","k":"공통","sk":"","s":"수어","g":"초등학교 5~6학년","d":"수어 문법","t":"다양한 수어 표현 속에서 수어소(수형, 수위, 수동, 수향, 비수지)가 다른 수어 표현을 찾아내며 수어를 정확하게 익힌다.","m":"이 성취기준은 교사가 특정 수어소(수형, 수위, 수동, 수향, 비수지)를 공유하는수어 단어를 제시하면 학습자는 다른 수어소가 있는 수어 단어를 찾아 표현하게 하고자 설정하였다.","n":["이 성취기준 적용 시 특정 수어 단어에는 수어소(수형, 수위, 수동, 수향, 비수지)가 모두 다른 표현과 최소 한 가지 이상 다른 표현이 있음을 이해하도록 지도한다."],"p":342,"b":2},{"c":"[6수어03-02]","k":"공통","sk":"","s":"수어","g":"초등학교 5~6학년","d":"수어 문법","t":"수어의 품사를 표현하는 방법을 알고 여러 가지 담화 상황에서 알맞은 수어를 표현한다.","m":"이 성취기준은 수어의 명사와 동사 표현에 대한 문법적 특성을 국어와 비교하여 이해하고, 동사의 유형을 단순 동사, 일치 동사, 공간 동사 등으로 구분하여 그 특성을이해하게 하고자 설정하였다.","n":["이 성취기준 적용 시 수어는 명사와 동사의 구분이 명확하지 않아도 의미가 전달되는 것을 알고, 공간 동사를 나타내는 수어 단어를 여러 가지 담화 상황에서 정확하게 표현하도록 지도한다."],"p":342,"b":2},{"c":"[6수어03-03]","k":"공통","sk":"","s":"수어","g":"초등학교 5~6학년","d":"수어 문법","t":"서술문, 의문문, 명령문, 청유문 등 의향을 나타내는 수어 표현법을 알고 다양한 의사소통 상황에서 수어로 표현한다.","m":"이 성취기준은 수어 서술문, 의문문, 명령문, 청유문의 의향 표현 특성을 비교하며 이해하게 하도록 설정하였다. 의향이란 언어 내용의 전달 과정에서 수어 독자에 대하여 수어 화자가 가지는 태도를 실현하는 문법 범주로서 다양한 예문으로 이해하게 하고자 설정하였다.","n":["이 성취기준 적용 시 의향 표현에는 비수지에 의미 전달이 크게 좌우되며 수지(수형, 수위, 수동, 수향)의 강약과 속도를 조절하면서 표현하도록 지도한다."],"p":342,"b":2},{"c":"[6수어03-04]","k":"공통","sk":"","s":"수어","g":"초등학교 5~6학년","d":"수어 문법","t":"문장 성분과 호응에 맞는 접속 표현을 익히고 의사소통 시 활용한다.","m":"이 성취기준은 기본문과 접속문 표현 방법을 알고, 국어와 달리 주어 2개와 서술어 2개가 반복되어 표현될 수 있다는 것을 이해하게 하고자 설정하였다.","n":["이 성취기준 적용 시 한 개 이상의 문장을 이어 주는 접속 표현을 할 때 단문을 두 개로 표현하는 방법과 수어 접속문을 활용하는 방법이 있으므로 문맥을 정확하게 파악한 후 적용하도록 지도한다."],"p":342,"b":2},{"c":"[6수어03-05]","k":"공통","sk":"","s":"수어","g":"초등학교 5~6학년","d":"수어 문법","t":"직접 화행 표현의 예를 알아보고 일상생활에서 적절한 문장 종류를 선택한다.","m":"이 성취기준은 문장의 형식과 전달하고자 하는 의미가 일치하는 직접 화행 표현 방법을 익히고 수어 표현과 동일한 의미의 국어 문장을 비교해 보게 하고자 설정하였다. 나아가 일상생활 속 대화 상황에서 적절한 문장 종류를 선택하여 표현하는 능력을 기르게 하고자 설정하였다.","n":["이 성취기준 적용 시 직접 화행 표현인 단언, 의문, 요청, 명령, 충고의 문장에서 비수지와 역할 전환의 요소가 무엇인지 파악하고 여러 상황의 역할극에서 적절하게 표현하도록 지도한다."],"p":342,"b":2},{"c":"[9수어01-01]","k":"공통","sk":"","s":"수어","g":"중학교 1~3학년","d":"수어 이해⋅표현","t":"수어 표현의 원리와 내용을 이해하여 친숙한 주제로 시사 뉴스의 핵심을 파악하고 줄거리를 구체적으로 표현한다.","m":"이 성취기준은 수어 표현의 원리와 내용을 이해하여 수어로 제시되는 시사 뉴스의 내용을 이해하고 핵심 내용을 추출하여 줄거리를 구체적으로 표현해 보게 하고자 설정하였다.","n":["이 성취기준 적용 시 중학교 수준에서 청각장애 학생들의 관심과 흥미를 유발할 수 있는 시사 뉴스의 주제를 선정하여 이야기를 들려주고 스스로 내용의 핵심을 파악하며 파악된 내용을 구체적으로 표현해 보도록 지도한다. 이때 청각장애 학생들의 관심이 높은 주제를 선정하여 핵심 내용이 더욱 정확하게 드러나도록 지도한다."],"p":344,"b":2},{"c":"[9수어01-02]","k":"공통","sk":"","s":"수어","g":"중학교 1~3학년","d":"수어 이해⋅표현","t":"수어 문법적 요소의 정확한 표현을 익혀 공간과 등장인물을 표현한 수어를 이해하고 세가지 대상을 비교하는 방법을 활용하여 수어로 표현한다.","m":"이 성취기준은 수어 문법적 요소의 정확한 표현을 익혀 공간을 활용하여 등장인물을 수어로 어떻게 표현하는지 다양한 시각 자료를 활용해 이해하도록 지도한다. 공간을 활용하여 세 가지 대상을 비교하는 다양한 방법을 익혀 수어로 표현해 보게 하고자 설정하였다.","n":["이 성취기준 적용 시 사람을 나타내는 수형의 움직임을 인식하고 수형이 수위와 수동의 변화에 따라 다양한 의미를 표현할 수 있음을 이해하도록 하여 공간을 구분한다.구분된 공간 내에서 세 가지 대상을 비교하는 다양한 방법을 시각 자료를 활용하여 구체적으로 지도한다."],"p":344,"b":2},{"c":"[9수어01-03]","k":"공통","sk":"","s":"수어","g":"중학교 1~3학년","d":"수어 이해⋅표현","t":"이야기 중 핵심이 되는 내용을 파악하여 구체적으로 표현하고 이해한 내용을 타인과 공유하여 수어로 구성되는 세계와 자아를 인식한다.","m":"이 성취기준은 다자간 의사소통 상황에서 친구들이 이야기한 내용을 이해하고 핵심을 파악하여 이를 구체적으로 표현해 보며 파악한 내용을 타인과 공유함으로써 수어로 이루어진 세계를 인식하고 자아를 찾게 하고자 설정하였다.","n":["이 성취기준 적용 시 교사는 다양한 주제로 의사소통할 수 있는 상황을 많이 만들어 주고, 학습자는 다른 사람의 이야기에 집중하여 이야기의 핵심을 파악하고, 이를 구체적으로 표현하여 자신의 생각을 타인과 공유함으로써 수어로 이루어진 세계를 이해하고 자신의 자아와 정체성을 자연스럽게 찾아가는 과정을 밟도록 지도한다."],"p":344,"b":2},{"c":"[9수어01-04]","k":"공통","sk":"","s":"수어","g":"중학교 1~3학년","d":"수어 이해⋅표현","t":"수어 표현의 원리와 내용을 이해하여 수어사전에 등록되지 않은 다양한 사물의 일반적 특징을 표현한 수어를 이해한다.","m":"이 성취기준은 수어 표현의 원리와 내용을 이해하여 수지(수형, 수위, 수동, 수향)를 활용해 수어가 어떻게 표현되는지를 익혀 사전에 등록되지 않은 다양한 사물에 대해서 사물이 가지고 있는 특징을 파악하여 수어로 표현해 보게 하고자 설정하였다.","n":["이 성취기준 적용 시 다양한 시각 자료를 활용하여 수어는 그림처럼 표현될 수 있다는 것을 알도록 하며, 수어사전에 등록되지 않은 다양한 사물의 특징을 몸으로 표현하는 방법을 시연해 보고 몸짓 표현을 수어로 바꾸어 보게 한다. 다양하게 연습해 다양한 사물의 일반적 특징을 표현한 수어를 이해하는 데까지 접근하도록 지도한다."],"p":344,"b":2},{"c":"[9수어01-05]","k":"공통","sk":"","s":"수어","g":"중학교 1~3학년","d":"수어 이해⋅표현","t":"단어와 문장 수준의 비수지 표현을 익혀 수어로 제시되는 복문 내용의 줄거리를 표현하며 자신의 수어 화법을 성찰한다.","m":"이 성취기준은 단어와 문장 수준의 비수지 표현을 익혀 수어로 제시되는 복문의 내용을 이해하여 자연스럽게 단어와 문장 수준의 비수지를 활용해 줄거리를 표현하면서 자신의 수어 화법을 성찰해 보는 기회를 갖게 하고자 설정하였다.","n":["이 성취기준 적용 시 지금까지 배운 단어 수준과 문장 수준의 비수지를 좀 더 확장하도록 지도하여 수어로 제시되는 복문의 내용을 이해하고, 단어와 문장 수준의 비수지가 자연스럽게 표현되도록 한다. 자신의 수어와 다른 사람의 수어 표현을 비교해 보면서 자신의 수어 화법을 성찰하고 발전시켜 보는 기회를 갖도록 지도한다."],"p":344,"b":2},{"c":"[9수어02-01]","k":"공통","sk":"","s":"수어","g":"중학교 1~3학년","d":"교과 수어","t":"학교 폭력과 성폭력의 유형을 사회 문화적 맥락으로 이해하고 유형별 신고와 대처 방법을 수어로 정확하게 설명한다.","m":"이 성취기준은 학교나 일상생활에서 발생할 수 있는 학교 폭력과 성폭력의 유형을 이해하고 위험성을 인식하여 신고와 대처 방법을 수어로 정확하게 설명할 수 있게 하고자 설정하였다.","n":["이 성취기준 적용 시 학교나 일상생활에서 발생할 수 있는 학교 폭력과 성폭력의 유형을 영상과 구체적인 사례를 보며 이해하고 위험성을 인식하여 신고와 대처 방법을 수어로 정확하게 설명하도록 지도한다."],"p":345,"b":2},{"c":"[9수어02-02]","k":"공통","sk":"","s":"수어","g":"중학교 1~3학년","d":"교과 수어","t":"약물⋅사이버 중독 예방법을 다양한 매체 자료를 활용하여 수어로 자유롭게 설명한다.","m":"이 성취기준은 일상생활에서 접할 수 있는 그림책, 만화, 뉴스, 광고, 웹툰, 애니메이션, 영화, 짧은 영상 등의 매체 자료를 활용하여 중독성 물질(술, 담배 등)과 인터넷 게임이나 스마트폰 중독에 대한 위험성과 피해를 알고 수어로 자유롭게 설명할 수 있게 하고자 설정하였다.","n":["이 성취기준 적용 시 그림책, 만화, 뉴스, 광고, 웹툰, 애니메이션, 영화, 짧은 영상 등 다양한 매체 자료를 활용하여 구체적인 사례를 중심으로 청각장애 학생들이 경험할 수 있는 중독성 물질인 술, 담배 등과 인터넷 게임, 스마트폰 중독의 위험성과 피해를 수어로 자유롭게 설명하도록 지도한다."],"p":345,"b":2},{"c":"[9수어02-03]","k":"공통","sk":"","s":"수어","g":"중학교 1~3학년","d":"교과 수어","t":"문학 작품을 수어 연극으로 각색하고 공연하여 적극적이고 주체적인 의사소통 태도를 기른다.","m":"이 성취기준은 중학교 1~3학년 교육과정에 나오는 문학 작품을 수어 연극으로 각색하여 공연해 보고 자기주도적 의사소통 수단으로써 수어 사용에 대한 자신감을 가지고 적극적이고 주체적인 의사소통 태도를 기르게 하고자 설정하였다.","n":["이 성취기준 적용 시 중학교 1~3학년 교육과정에 나오는 문학 작품을 청각장애 학생의 삶과 관련지어 각색하여 수어 연극으로 공연해 봄으로써 수어 표현력을 높이고,자기주도적 의사소통 수단인 수어를 자신감을 가지고 활용하도록 지도한다."],"p":345,"b":2},{"c":"[9수어02-04]","k":"공통","sk":"","s":"수어","g":"중학교 1~3학년","d":"교과 수어","t":"정치⋅외교⋅국가관에 대해 수어를 사용하여 주체적인 의사소통 방법으로 발표하고 적극적으로 토론한다.","m":"이 성취기준은 다양한 문화권에서 경험하는 정치⋅외교⋅국가관에 대해 주체적인 의사소통 방법으로 발표하고 토론하게 하고자 설정하였다.","n":["이 성취기준 적용 시 다양한 문화권에서 경험하는 정치⋅외교⋅국가관에 대해모둠별로 신문 또는 인터넷에서 최신 자료를 수집하여 국제사회의 다양한 경쟁과 갈등을 유형별로 분류하여 발표하고 토론하도록 지도한다."],"p":345,"b":2},{"c":"[9수어02-05]","k":"공통","sk":"","s":"수어","g":"중학교 1~3학년","d":"교과 수어","t":"일상생활에서 활용 가능한 문자와 식, 함수와 그래프, 기하를 설명하고 확률과 통계의 해석을 수어로 이해하고 설명한다.","m":"이 성취기준은 문자와 식으로 구성된 사칙연산과 소인수분해, 다항식을 수어로 이해하고 표현하며, 일상생활에서 발견하여 응용할 수 있는 함수의 대응과 종속 관계를 그래프로 변환하여 시각적으로 쉽게 수어로 설명하고, 실생활 문제를 해결하는 기하와 확률, 통계의 해석을 수어로 이해하고 설명할 수 있게 하고자 설정하였다.","n":["이 성취기준 적용 시 기본적인 수학적 용어를 수어로 그 개념을 익혀 이해하고 표현하도록 지도한다. 수에 대한 사칙연산과 소인수분해, 다항식을 수어로 이해하고 일상생활에서 활용되는 변화하는 양 사이의 관계를 나타내는 함수의 대응과 종속의 의미를 포함하여 그래프를 시각적으로 표현하도록 지도한다. 다양한 분야의 실생활 문제를 해결하는 기하를 수어로 설명하도록 지도한다. 수학적 용어와 관련한 수어 어휘가 없을 경우 청각장애 학생들과 충분히 토론하여 이해하고 설명하도록 지도하고 일상생활에서 사건이 일어날 가능성을 수치화한 확률과 통계를 수어로 이해하고 해석하도록 지도한다."],"p":346,"b":2},{"c":"[9수어02-06]","k":"공통","sk":"","s":"수어","g":"중학교 1~3학년","d":"교과 수어","t":"일상생활에서 활용되는 힘과 운동을 수어로 자유롭게 설명하여 수어에 대한 자기주도성을확신한다.","m":"이 성취기준은 물질세계에 존재하는 여러 가지 힘 중에서 중력, 탄성력, 마찰력, 부력을 이해하고 힘이 작용하여 나타나는 원리를 과학적으로 해석하고 수어로 자유롭게 설명할 수 있게 하고자 설정하였다.","n":["이 성취기준은 물질세계에 존재하는 여러 가지 힘 중에서 중력, 탄성력, 마찰력, 부력을 실험을 바탕으로 시각적으로 이해하고 힘이 작용하여 나타나는 그 원리를 영상 자료와 실험으로 과학적으로 해석하고 수어로 자유롭게 설명하도록 지도한다."],"p":346,"b":2},{"c":"[9수어02-07]","k":"공통","sk":"","s":"수어","g":"중학교 1~3학년","d":"교과 수어","t":"우리 몸의 조절 능력을 이해하고 수어로 자유롭게 설명한다.","m":"이 성취기준은 사람의 대사 과정과 몸의 조절 능력을 이해하고 수어로 자유롭게 설명할 수 있게 하고자 설정하였다.","n":["이 성취기준은 사람의 대사 과정과 몸의 조절 능력을 구체물과 영상 등을 활용하여 이해하고 수어로 자유롭게 설명하도록 지도한다."],"p":346,"b":2},{"c":"[9수어03-01]","k":"공통","sk":"","s":"수어","g":"중학교 1~3학년","d":"수어 문법","t":"수어 어휘와 문장을 표현할 때, 순차적으로 [정지-움직임-정지] 순서로 이루어지는 것과 양손을 동시에 [정지-움직임-정지] 순서로 이루어지는 동시성이 있음을 이해한다.","m":"이 성취기준은 수어 형태소의 순차성과 동시성을 인식하게 하고자 설정하였다. 움직임-정지(M-H, Movement-Hold model) 모델은 수어의 움직임 분절과 정지 분절이 연속적으로 결합되며, 각 분절 안에서 수어소는 동시적으로 표현됨을 설명하고 있다. 수어 표현에서 [정지-움직임-정지] 분절을 구분하며 수어 형태소의 순차성과 동시성을 이해하는 데 중점을 둔다.","n":["이 성취기준 적용 시 수어 표현의 공간적, 시간적 움직임 형상에 따라 [정지-움직임-정지] 구간을 혼란스러워할 수 있으므로 분절표에 따라 구분하고 비교하도록 지도한다."],"p":348,"b":2},{"c":"[9수어03-02]","k":"공통","sk":"","s":"수어","g":"중학교 1~3학년","d":"수어 문법","t":"수어는 순차적 합성어와 동시적 합성어로 이루어지며, 지역적 특성에 따라 지역 수어가 생성됨을 알고 존중하는 태도를 기른다.","m":"이 성취기준은 수어의 단어 형성에는 순차적인 합성어와 동시적인 합성어가 있음을 알고, 수어는 지역 문화의 공동체에서 자연 발생적으로 형성되는 언어이기 때문에 지역마다 다른 표현이 있음을 알게 하도록 설정하였다.","n":["이 성취기준 적용 시 순차적/동시적 합성어가 섞인 어휘 목록표를 따라 수어를익히며 학습자들이 순차적 합성어와 동시적 합성어의 특성을 비교하며 설명하도록 한다. 지역적 특성을 설명하고 그에 따라 지역 수어가 생성되거나 변이형으로 나타남을 알도록 지도한다."],"p":348,"b":2},{"c":"[9수어03-03]","k":"공통","sk":"","s":"수어","g":"중학교 1~3학년","d":"수어 문법","t":"수어 담화 속에서 현재, 과거, 미래를 표현하는 수어를 활용하여 나타내 보고 경험한 일과 앞으로 일어날 수 있는 일을 표현한다.","m":"이 성취기준은 미래, 현재, 과거를 나타내는 시제를 표현할 수 있게 하도록 설정하였다. 수어에서 시제는 발화자의 몸을 중심으로 하는 시간 축(time line)을 이용한 지시 운동으로 나타내는데 수어 화자의 몸을 중심으로 미래를 표현할 때는 몸을 앞으로 기울이고, 현재를 나타낼 때는 바르게 서며, 과거를 표현할 때는 어깨 뒤로 수어 표현을 한다.","n":["이 성취기준 적용 시 시제는 현재, 과거, 미래를 나타내는 시간 축(time line)을 이용한 지시 운동 방법 외에 시간 경과 표현(우세 손에서 비 우세 손으로 이동)이나 시간의 흐름을 상하(위에서 아래로 이동)로 표현하는 수어도 있음을 설명한다. 따라서 시제를 표현할 때 다양한 시간적 상황에서 그 쓰임이 맞는지 확인하며 지도한다."],"p":348,"b":2},{"c":"[9수어03-04]","k":"공통","sk":"","s":"수어","g":"중학교 1~3학년","d":"수어 문법","t":"여러 가지 문장 구조(평서문, 의문문, 청유문, 명령문, 감탄문)를 이해하고 주동 표현, 피동⋅인용 표현을 활용하여 자신의 의견을 발표한다.","m":"이 성취기준은 수어 문장 특성을 알고, 어순에 따라 문장의 의미가 달라지는 것을 이해하며, 피동 인용 표현을 활용하고 여러 가지 문장의 형식(평서문, 의문문, 청유문, 명령문, 감탄문, 주동문, 피동문, 인용문 등)을 대화 상황에서 적절하게 표현할 수 있게 하고자 설정하였다.","n":["이 성취기준 적용 시 여러 가지 문장 형식에서 비수지와 어순 등이 어떻게 다르게 사용되는지를 명확하게 인지하고자 교사는 다양한 담화 상황을 학습자에게 제시하며 발표해 보도록 하고 이에 대한 피드백을 제공하면서 지도한다."],"p":348,"b":2},{"c":"[9수어03-05]","k":"공통","sk":"","s":"수어","g":"중학교 1~3학년","d":"수어 문법","t":"토론 활동에서 나타나는 간접 화행을 이해하고 화자와 청자의 언어적 표현을 수용하는 태도를 기른다.","m":"이 성취기준은 대화 상황에서 간접 화행으로 이루어지는 타인의 발화를 이해하고 자신의 의도를 전달할 수 있게 하고자 설정하였다. 간접 화행이란 언어 표현의 의미와 화자가 전달하려는 의미가 일치하지 않는 언어 행위를 말한다. 주제 토론으로 상대방에게 자신의 의사를 전달할 때 간접적인 방식으로 의견을 내거나 청자 입장이 되어 그 의도를 파악해 보며 원활한 의사소통 능력을 기르도록 지도한다.","n":["이 성취기준 적용 시 교사는 학생들의 흥미를 유발할 수 있는 토론 주제를 선정하고, 간접 화법을 통한 메시지 전달이 화자와 청자 간에 잘 이루어지는지 스스로 점검하도록 지도한다."],"p":348,"b":2},{"c":"[12수어01-01]","k":"공통","sk":"","s":"수어","g":"고등학교 1~3학년","d":"수어 이해⋅표현","t":"수어의 언어적 특성을 이해하여 수어사전에 등록되지 않은 다양한 사물의 고유한 특징을표현한 수어를 이해한다.","m":"이 성취기준은 농인 공동체의 제1언어인 수어의 일반적인 언어적 특성과 시각 언어로서 수어가 가지는 고유한 특성을 이해하고, 수어사전에 등록되지 않은 다양한 사물의 고유한 특성들을 파악하여 수어로 어떻게 표현하는지를 익히게 하고자 설정하였다.","n":["이 성취기준 적용 시 교사는 농인 공동체 안에서 수어가 가지는 언어적 의미를 설명해 주어 수어 사용자의 정체성 확립에 도움을 준다. 수어가 언어로서 가지는 일반적인 특성과 시각 언어로서 독특한 특성을 설명하도록 하여 수어의 언어적 특성을 이해하게한다. 수어사전에는 등록되어 있지 않지만 다양한 사물의 고유한 특성들이 어떻게 수어로 표현되는지 설명하여 수어로 표현되는 사물들을 이해하도록 지도한다."],"p":350,"b":2},{"c":"[12수어01-02]","k":"공통","sk":"","s":"수어","g":"고등학교 1~3학년","d":"수어 이해⋅표현","t":"수어 표현의 정확성을 익혀 수어가 가지는 힘을 인식하고 수어 사용자로서 책임감을 느낀다.","m":"이 성취기준은 수어의 구성요소인 수지(수형, 수위, 수동, 수향)를 정확히 사용하여 수어 표현 시 자신의 의사를 더욱 명확하게 표현해 보도록 하여 수어가 가지는 언어적 힘을 인식하고 수어 사용자로서 책임감을 느끼게 하고자 설정하였다.","n":["이 성취기준 적용 시 학습자는 수어의 구성요소인 수지(수형, 수위, 수동, 수향) 중 하나라도 다르게 사용하면 전혀 의미가 다른 수어가 됨을 배운다. 수어로 의사소통하여 수어 자체가 가지고 있는 힘을 느껴 보도록 함으로써 바르게 수어를 사용해야 하는 책임감을 느끼도록 지도한다."],"p":350,"b":2},{"c":"[12수어01-03]","k":"공통","sk":"","s":"수어","g":"고등학교 1~3학년","d":"수어 이해⋅표현","t":"수어 관용 표현이 포함된 다양한 이야기의 핵심을 이해하고 기승전결로 이야기를 구성하여 자신의 생각을 발표하고 토론한다.","m":"이 성취기준은 청각장애 고등학생들이 익숙하게 사용하는 수어 관용 표현이 포함된 이야기의 핵심을 이해하고 기승전결로 이야기를 구성하여 발표하고 상대방의 주장을 보고 자신의 생각을 담아 토론해 보게 하고자 설정하였다.","n":["이 성취기준 적용 시 학습자의 눈높이에 맞춘 친숙한 주제를 선정해 기승전결의 이야기로 구성하여 발표하게 한다. 수어 관용 표현을 자연스럽게 구사해 가며 발표한 내용에 대해서 자신의 생각을 담아 토론해 보는 기회를 갖도록 지도한다."],"p":350,"b":2},{"c":"[12수어01-04]","k":"공통","sk":"","s":"수어","g":"고등학교 1~3학년","d":"수어 이해⋅표현","t":"수어 표현의 정확성을 익혀 다양한 주제에 대한 찬성과 반대 이유를 육하원칙에 따라 표현하며 자신의 주장을 나타낸다.","m":"이 성취기준은 수어의 정확한 표현 방법을 익혀 다양한 주제의 수어 이야기를 보고 결과를 유추해 보고, 찬성과 반대의 견해를 표현할 때는 타당한 근거를 가지고 자신의 주장을 표현해 보게 하고자 설정하였다.","n":["이 성취기준 적용 시 다자간 의사소통 상황에서 다른 사람의 이야기를 주의 깊게 보고 그 내용을 찬성하거나 반대하는 이유를 육하원칙에 따라 근거를 들어가며 정확한 수어로 표현해 보도록 지도한다."],"p":350,"b":2},{"c":"[12수어01-05]","k":"공통","sk":"","s":"수어","g":"고등학교 1~3학년","d":"수어 이해⋅표현","t":"시사 뉴스에 대해 좋고 나쁨 등 가치 부여 표현을 이해하여 사회적 소통에 적극적으로참여한다.","m":"이 성취기준은 다자간 의사소통에서 관심을 가지는 시사 뉴스에서 옳고 나쁨 등 자신의 가치를 부여하여 표현하고 다른 사람의 의견을 비판하거나 수용하는 판단력을 키워 사회적 소통에 적극적으로 참여하게 하고자 설정하였다.","n":["이 성취기준 적용 시 생활과 밀접한 주제의 시사 내용을 개인의 감정과 의견을 반영하여 표현하는 기술을 익히게 하여 사회적 소통에 적극적으로 참여하는 긍정적 의사소통 방법을 익히도록 지도한다."],"p":350,"b":2},{"c":"[12수어02-01]","k":"공통","sk":"","s":"수어","g":"고등학교 1~3학년","d":"교과 수어","t":"다양한 종류의 폭력이나 사회 문제 예방법을 신문 기사를 보며 구체적으로 이해하고 자신의 신변을 보호하는 적극적인 방법을 수어로 설명한다.","m":"이 성취기준은 학교폭력, 성폭력, 가정 폭력, 전화 금융 사기 등 다양한 종류의 폭력이나 사회 문제의 예방법을 신문 기사나 인터넷 기사 등을 보며 구체적으로 이해하여 자신과 타인의 소중함을 인식하고, 자신과 타인의 신체와 재산을 보호하는 적극적인 방법을 수어로 설명할 수 있게 하고자 설정하였다.","n":["이 성취기준 적용 시 학교 폭력, 성폭력, 가정 폭력, 전화 금융 사기 등 다양한 종류의 폭력이나 사회 문제를 신문 기사나 인터넷 기사, 동영상 자료 등을 보며 구체적으로 이해하도록 지도한다. 자신과 타인의 소중함을 인식하여 자신의 신체를 적극적으로 보호하고, 전화 금융 사기 등의 금융 범죄로부터 자신의 재산을 스스로 지키는 방법을 수어로 설명하도록 지도한다."],"p":351,"b":2},{"c":"[12수어02-02]","k":"공통","sk":"","s":"수어","g":"고등학교 1~3학년","d":"교과 수어","t":"수어를 자유롭게 사용해 재난과 직업 안전을 설명하여 진로에 활용하고, 여러 가지 상황에 대한 응급 처치 방법을 설명한다.","m":"이 성취기준은 화재와 자연재해, 산업 재해 등의 구체적인 원인과 대피, 대응요령을 수어로 정확하게 설명하고 일상생활에서 발생 가능한 여러 가지 상황에 대한 응급 처치와 심폐 소생술, 자동 심장 충격기 사용법을 설명할 수 있게 하고자 설정하였다.","n":["이 성취기준 적용 시 화재와 자연재해, 산업 재해 등의 구체적인 원인과 대피, 대응 요령을 수어로 정확하게 설명하도록 지도한다. 일상생활에서 발생 가능한 여러 가지 응급 상황에 대한 응급 처치와 심폐 소생술, 자동 심장 충격기 사용법을 실습해 익히고 정확하게 설명하도록 지도한다."],"p":351,"b":2},{"c":"[12수어02-03]","k":"공통","sk":"","s":"수어","g":"고등학교 1~3학년","d":"교과 수어","t":"문화예술 활동을 간 문화적 맥락으로 설명하고 사회 참여 방법으로 수어를 적극적으로활용하여 토론한다.","m":"이 성취기준은 청각장애 학생이 지역사회의 축제, 교내외 행사와 축제 등의 문화예술 활동에 수어를 적극적으로 활용하여 수어 노래, 수어 콩트, 수어 연극 등으로 참여하고 다양한 문화적 맥락으로 수어를 사용하여 의사소통하고 토론하게 하고자 설정하였다.","n":["이 성취기준 적용 시 지역사회의 축제, 교내외 행사와 축제 등에 적극적으로 참여하는 기회를 청각장애 학생에게 제공한다. 이러한 문화예술 활동을 다양한 문화적 맥락으로 설명하고, 자신의 생각을 명확하게 표현함으로써 타인과 적극적인 의사소통으로 사회에 참여하여 토론하도록 지도한다."],"p":351,"b":2},{"c":"[12수어02-04]","k":"공통","sk":"","s":"수어","g":"고등학교 1~3학년","d":"교과 수어","t":"시각적 문화의 가치와 역할을 간 문화적 맥락에서 수어로 연설하며 의사소통 수준을 향상한다.","m":"이 성취기준은 시각적(미술) 문화의 역사, 정치, 경제, 사회 등 간 문화적 맥락에 따른 다양성과 작품의 가치⋅판단을 수어로 연설하여 의사소통 수준을 향상하게 하고자 설정하였다.","n":["이 성취기준 적용 시 영상이나 사진 등을 활용하여 시각적(미술) 문화에 대해시대별 지역, 양식, 민족, 종교 등을 고려하여 간 문화적 맥락에서 그 시대의 정치, 경제, 사회적 특성의 다양함을 이해하고 작품의 가치⋅판단을 수어로 연설하여 의사소통 수준을 향상하도록 지도한다."],"p":351,"b":2},{"c":"[12수어02-05]","k":"공통","sk":"","s":"수어","g":"고등학교 1~3학년","d":"교과 수어","t":"시사 문제에 대한 논리적 의미 전달의 개념으로 사회 변화에 따른 인류 사회의 갈등 해결 방법을 수어로 자유롭게 토론한다.","m":"이 성취기준은 정의로운 사회를 구현하고자 다양한 시사 문제에 관심을 가지고 논리적 의미 전달의 개념으로 접근하여 사회 변화에 따른 인류 사회의 다양한 갈등과 해결 방법을 자유롭게 토론할 수 있게 하고자 설정하였다.","n":["이 성취기준 적용 시 정의로운 사회를 구현하기 위해 다양한 시사 문제(저출산, 고령화 현상, 다문화적 변화 등)에 관심을 가지고 이러한 변화의 원인과 이로써 발생할 수 있는 문제점을 수어로 표현하여 그 논리적 의미를 전달하도록 지도한다. 사회 변화에 따른 인류 사회의 다양한 갈등과 해결 방법을 수어로 자유롭게 토론하도록 지도한다."],"p":351,"b":2},{"c":"[12수어02-06]","k":"공통","sk":"","s":"수어","g":"고등학교 1~3학년","d":"교과 수어","t":"일상생활에서 많이 활용되는 수와 연산 문제, 함수와 기하 문제를 수어로 설명하여 문제를 해결한다.","m":"이 성취기준은 일상생활에서 활용되는 집합과 명제, 이차 함수의 최댓값과 최솟값, 좌표 평면에 나타낸 점, 선, 원의 대수적 표현 등의 문제를 수어로 설명하고 해결하여 논리적이고 창의적인 사고력을 높이게 하고자 설정하였다.","n":["이 성취기준 적용 시 학습자의 현재 학습 수준을 고려하여 적용하도록 한다. 집합의 연산법칙은 벤 다이어그램으로 확인하는 정도로 간단히 다룰 수 있다. 명제 또한 구체적인 상황을 이용하여 충분조건, 필요조건, 필요충분조건을 구체적인 예를 보며 의미를 이해하고 수어로 표현하도록 지도한다. 이차 함수의 최댓값과 최솟값, 좌표 평면에 나타낸 점, 선, 원의 대수적 표현 등의 문제도 일상생활에서 쉽게 접하는 구체적인 상황과 연계하여 수어로 설명할 수 있는 정도로 간단히 다루어 지도할 수 있다. 여기에서는 학습자가 문제 해결 과정을 수어로 설명하려고 노력하며, 논리적이고 창의적인 사고력을 향상하도록 지도한다."],"p":352,"b":2},{"c":"[12수어02-07]","k":"공통","sk":"","s":"수어","g":"고등학교 1~3학년","d":"교과 수어","t":"일상생활 맥락에서 활용되는 지구⋅생명의 시스템을 이해하고 수어로 설명한다.","m":"이 성취기준은 지구 시스템으로 중력을 설명하고 중력이 지구 시스템과 생명 시스템에서 상호작용하는 방법을 설명하고자 설정하였다.","n":["이 성취기준 적용 시 지구 시스템의 에너지 흐름과 생명 시스템의 기본 단위인 세포를 이해하도록 탐구 실험, 발표, 토론, 조사 학습을 적극적으로 활용하여 지도한다. 지구 시스템으로 중력을 설명하고 중력이 지구 시스템과 생명 시스템에서 상호작용하는 방법을 수어로 자유롭게 설명하도록 지도한다."],"p":352,"b":2},{"c":"[12수어03-01]","k":"공통","sk":"","s":"수어","g":"고등학교 1~3학년","d":"수어 문법","t":"수어소(수형, 수위, 수동, 수향, 비수지)에 최소 대립쌍을 이루는 수어 단어를 찾아보며수어소가 변하는 움직임에 민감성을 가진다.","m":"이 성취기준은 최소 대립쌍의 의미를 알고 최소 대립쌍을 이루는 수어 단어쌍을 학습해 수어소의 차이를 민감하게 인지하며 변별하게 하고자 설정하였다. 음성언어에서 최소 대립쌍이란 동일한 수의 분절음을 포함하지만 같은 위치에서 하나의 음성적 차이가 의미 차이를 유발하는 쌍을 의미한다. 수어에도 최소 대립쌍은 단어의 형태와 의미의 차이를 가리는 변별적 기능을 담당한다.","n":["이 성취기준 적용 시 교사는 각 수어소(수형, 수위, 수동, 수향, 비수지)에 최소 대립쌍을 이루는 수어 단어 표현을 학습자가 정확하게 표현하는지 고려하여 지도한다."],"p":354,"b":2},{"c":"[12수어03-02]","k":"공통","sk":"","s":"수어","g":"고등학교 1~3학년","d":"수어 문법","t":"수어에서 사용하는 차용어 사례를 살펴보고 다양한 외래어를 표현하며 다문화 상황에 적응하는 언어 능력을 기른다.","m":"이 성취기준은 정보화⋅세계화에 따라 차용어와 외래어를 표현하는 능력을 기르게 하고자 설정하였다. 차용어란 체계가 다른 언어 체계(주로 외국어)의 어휘에서 빌려온 단어로서 학생들이 경험해 보았을 만한 여러 유형의 차용어를 선정하여 차용된 사례를 설명하고 나아가 새로 접하는 외래어를 활용하도록 지도한다.","n":["이 성취기준 적용 시 한국 수어에는 한글 지문자, 한자, 미국 지문자, 외국 수어 등이 다양하게 차용되고 있다는 것을 설명하고, 차용이 발생하는 원인을 충분히 이해하도록 지도한다. 차용어를 활용하는 것은 새로운 시대적 상황에서 맞이하게 되는 새로운 단어를 수어로 표현하는 데 필요한 과정으로 이미 표준화된 외국 수어와 다를 수 있으며 의사소통을 좀 더 수월하게 하려는 것임을 알도록 지도한다."],"p":354,"b":2},{"c":"[12수어03-03]","k":"공통","sk":"","s":"수어","g":"고등학교 1~3학년","d":"수어 문법","t":"담화에서 비수지, 부정 수어, 부정 접미사에 의한 부정 표현을 탐색해 보고 특성을 비교한다.","m":"이 성취기준은 어떤 상황에서 수어 화자가 부정하는 뜻을 표현하는 능력을 기르게 하고자 설정하였다. 부정을 나타내는 비수지, 부정 수어, 부정 접미사에 의한 부정 표현을 익히는 데에 중점을 둔다.","n":["이 성취기준 적용 시 부정 표현 방법의 특징을 설명하고, 실제 담화 속에서 적절한 부정 표현을 하도록 지도한다."],"p":354,"b":2},{"c":"[12수어03-04]","k":"공통","sk":"","s":"수어","g":"고등학교 1~3학년","d":"수어 문법","t":"여러 가지 관용어, 관용구, 속담을 익히고 수어의 다양한 변화를 이해한다.","m":"이 성취기준은 일상적인 수어 표현과 함께 원래의 뜻과는 다른 새로운 뜻으로 굳어져 쓰이는 관용 표현과 속담, 격언 등을 표현할 수 있게 하고자 설정하였다. 원래 의미와 어떻게 다른지 이야기해 봄으로써 수어의 다양한 변화와 긍정적인 기능을 아는 데에중점을 둔다.","n":["이 성취기준 적용 시 여러 가지 관용 표현을 국어의 관용 표현이 아닌 한국 수어의 관용 표현 관점에서 적용하도록 하며, 사용자의 의도를 효과적으로 전달하고, 수용자의 주목을 집중시키는 기능을 한다는 것을 알도록 지도한다."],"p":354,"b":2},{"c":"[12수어03-05]","k":"공통","sk":"","s":"수어","g":"고등학교 1~3학년","d":"수어 문법","t":"고정 함축과 대화 함축 의미가 나타나는 사례를 비교해 보고 한국 수어의 발전 방안을 모색한다.","m":"이 성취기준은 의사소통 상황에서 고정 함축과 대화 함축에 따라 새로운 의미가 발생할 수 있음을 이해하고 이를 적절히 활용하여 의사소통하게 하고자 설정하였다.","n":["이 성취기준 적용 시 고정 함축과 대화 함축의 차이를 이해하도록 다양한 예문을 활용하여 지도한다. 이때 발생된 새로운 의미가 무엇인지를 자유롭게 이야기해 보도록 한다."],"p":354,"b":2},{"c":"[10공국1-01-01]","k":"선택","sk":"공통 과목","s":"공통국어(청각장애)1·2","g":"고등학교 1학년(선택 중심 공통과목)","d":"듣기⋅말하기","t":"대화의 원리를 고려하여 대화하고 자신의 듣기⋅말하기 과정과 공동체의 담화 관습을성찰한다.","m":"이 성취기준은 대화의 원리를 기반으로 언행적 목적과 관계적 목적을 두루 달성할 수 있는 대화 능력을 기르고, 공동체 담화 관습을 비판적으로 성찰하고 개선하기 위한 계기를 마련하기 위해 설정하였다. 협력의 원리, 공손성의 원리, 체면 유지의 원리 등 대표적인 대화의 원리를 바탕으로 대화하기, 자신의 듣기⋅말하기 과정과 전략 점검하기, 담화 공동체의 과거와 현재의 담화 관습 조사하기, 담화 관습에 대해 비판적으로 인식하기, 오늘날의 시대 상황을 고려하여 담화 관습을 보다 바람직한 방향으로 개선하기 위한 방안 모색하기 등을 학습한다.","n":[],"p":368,"b":2},{"c":"[10공국1-01-02]","k":"선택","sk":"공통 과목","s":"공통국어(청각장애)1·2","g":"고등학교 1학년(선택 중심 공통과목)","d":"듣기⋅말하기","t":"논제의 필수 쟁점별로 논증을 구성하고 논증이 타당한지 평가하며 토론한다.","m":"","n":[],"p":368,"b":2},{"c":"[10공국1-01-03]","k":"선택","sk":"공통 과목","s":"공통국어(청각장애)1·2","g":"고등학교 1학년(선택 중심 공통과목)","d":"듣기⋅말하기","t":"말⋅수어 등의 표현 전략을 효과적으로 사용하여 대화의 원리에 맞게 듣고 말한다.","m":"이 성취기준은 대화란 화자와 청자 사이에서 벌어지는 가장 일상적인 의사소통임을 이해하고, 대화의 상황⋅대상⋅목적에 맞게 말할 수 있는 능력을 기르기 위해서 설정하였다. 자신에게 적합한 말⋅수어 등 의사소통의 표현전략을 적절히 사용하여 일차적으로 어떤 정보나 정서를 주고받는 대화에서 점차 새로운 의미를 함께 형성해 나갈 수 있는 상호 교섭적 활동이 이루어지도록 하며, 적극적이고 능동적인 대화를 위해 필요한 공손의 원리, 협력의 원리, 순서 교대의 원리 등 대화의 원리를 학습한다.","n":[],"p":368,"b":2},{"c":"[10공국1-02-01]","k":"선택","sk":"공통 과목","s":"공통국어(청각장애)1·2","g":"고등학교 1학년(선택 중심 공통과목)","d":"읽기","t":"다양한 글이나 자료를 읽으며 논증의 타당성을 평가하고 자신의 관점을 바탕으로 논증을 재구성한다.","m":"이 성취기준은 글과 자료에 사용된 논증 방법을 파악하고 논증의 타당성을평가한 후, 자신의 관점에 기반하여 논증을 비판적으로 재구성하며 읽는 능력을 기르기 위해 설정하였다. 논증이란 주장이 정당함을 입증하기 위해 이유와 근거를 제시하는 방식을 의미하기도 하고 주장과 이를 뒷받침하는 이유와 근거 간의 관계를 의미하기도 한다. 글에 나타난 논증의 요소와 방법 파악하기, 필자의 주장과 이를 뒷받침하는 이유와 근거, 반론에 대한 반박 등 논증 요소의 타당성 평가하기, 논증 방법의 설득 효과 평가하기, 평가의 결과를 토대로 자신의 관점을 세워 필자의 논증을 재구성하기 등을 학습한다.","n":[],"p":370,"b":2},{"c":"[10공국1-02-02]","k":"선택","sk":"공통 과목","s":"공통국어(청각장애)1·2","g":"고등학교 1학년(선택 중심 공통과목)","d":"읽기","t":"자신의 진로나 관심 분야와 관련한 다양한 글과 자료를 찾아 주제 통합적으로 읽고읽은 결과를 공유한다.","m":"이 성취기준은 자신의 진로나 관심 분야에 대한 다양한 글이나 자료를 선택적으로 읽으며 읽기 목적에 알맞게 정보를 통합하고 재구성하며 읽는 능력을 기르기 위해 설정하였다. 진로와 직업에 관련된 도서 목록이나 도서 정보를 탐색한 후 자신의 진로나관심 분야를 고려하여 다양한 글이나 책, 매체 자료를 찾아 읽기, 진로나 관심 분야가 유사한 학습자 간에 모둠을 구성하고 도서나 자료 목록 작성하기, 관심 분야에 관한 도서나 자료를 읽으며 자신의 진로 의사 결정 및 개발에 필요한 유의미한 정보를 선별하기, 유의미한 정보들을 통합하여 진로 분야에 대한 정보를 모둠원 간에 공유하기, 읽기 목적을 고려하여 포트폴리오 제작하기, 독서 토론이나 발표 등을 통해 읽은 결과 공유하기 등을 학습한다.","n":[],"p":370,"b":2},{"c":"[10공국1-02-03]","k":"선택","sk":"공통 과목","s":"공통국어(청각장애)1·2","g":"고등학교 1학년(선택 중심 공통과목)","d":"읽기","t":"다양한 시각적 영상 자료와 수어 담화 등을 보고 내용을 이해하고 추론하며 읽는다.","m":"이 성취기준은 읽기란 배경지식을 바탕으로 의미를 이해하고 구성하는 능동적인 활동임을 이해하고, 일상생활 속에 다양하게 존재하는 여러 가지 읽기 자료에서 글에 드러나지 않은 정보를 예측하고, 글쓴이의 의도와 목적, 숨겨진 주제, 생략된 내용을 파악하는 등 능동적인 읽기 능력을 신장하기 위하여 설정하였다. 청각장애 학습자에게는 다양한 시각적 영상 자료와 수어 담화 등도 유용한 읽기 기재이므로 이를 눈으로 보고 자신의 경험과 배경지식을 활용하여 추론하며 읽음으로써 장면 상상하기, 예측한 내용 확인하기, 의도 짐작하기, 공감하거나 비판하기 등 읽기의 과정과 원리를 학습한다.","n":[],"p":370,"b":2},{"c":"[10공국1-03-01]","k":"선택","sk":"공통 과목","s":"공통국어(청각장애)1·2","g":"고등학교 1학년(선택 중심 공통과목)","d":"쓰기","t":"내용 전개의 일반적 원리를 고려하여 사회적 쟁점에 대한 자신의 견해를 정교하게 표현하는 글을 쓴다.","m":"","n":[],"p":372,"b":2},{"c":"[10공국1-03-02]","k":"선택","sk":"공통 과목","s":"공통국어(청각장애)1·2","g":"고등학교 1학년(선택 중심 공통과목)","d":"쓰기","t":"다양한 언어 공동체의 특성을 고려하며 필자의 개성이 드러나는 글을 쓴다.","m":"이 성취기준은 언어 공동체 구성원으로서 필자의 개성이 드러나는 글을 쓰는 경험을 통해 의사소통 문화의 발전을 도모하는 태도를 기르기 위해 설정하였다. 지역, 세대, 성, 문화 등 다양한 언어 공동체가 언어 사용을 통해 삶을 공유한다는 점에서 언어 사용자에게는 바람직한 언어문화를 가꾸어야 할 책무가 있음을 이해하고 실천해야 한다. 또한 언어 공동체의 특성이 고정된 것이 아니라 구성원의 참여를 통해 새로운 의사소통 문화를 만들어 갈 수 있으므로 필자의 개성이 드러나는 글이 언어 공동체의 확장 및 발전에 기여할 수 있음을 이해해야 한다. 언어 공동체의 특성 및 다양성에 대해 인식하기, 글을 쓰는 경험을 통해 자아의 성장과 언어 공동체의 발전에 기여하기, 일상의 경험에 가치를 부여하는 글 쓰기, 필자의 고유한 목소리가 드러나는 개성 있는 글 쓰기 등을 학습한다.","n":[],"p":372,"b":2},{"c":"[10공국1-03-03]","k":"선택","sk":"공통 과목","s":"공통국어(청각장애)1·2","g":"고등학교 1학년(선택 중심 공통과목)","d":"쓰기","t":"자신의 생각, 느낌, 감정 등의 표현을 어법과 문법에 맞게 글로 쓴다.","m":"이 성취기준은 문장력과 수어를 동시에 발달시키기 위해 설정하였다. 수어를 주로 사용하는 경우 문장 구성 시 문법적 오류가 빈번하게 발생하므로 문장을 쓸 때는읽는 사람이 쉽게 이해할 수 있도록 그 내용을 명확하고 논리적이며 어법에 맞게 정확히 쓸 수 있도록 하고, 수어의 내용을 문법과 어법에 맞는 문장으로 옮기는 연습이 필요하다. 문장은 느낌이나 생각이 완성되는 최소의 단위이며 글쓰기의 출발점이 되므로 학습자는 정확한 문장력 신장을 위해서 시제에 맞게 기술하기, 용언의 어미 변화, 주어⋅목적어⋅부사어와 서술어의 호응, 다양한 조사 활용하기 등을 학습한다.","n":[],"p":372,"b":2},{"c":"[10공국1-04-01]","k":"선택","sk":"공통 과목","s":"공통국어(청각장애)1·2","g":"고등학교 1학년(선택 중심 공통과목)","d":"문법","t":"언어 공동체가 다변화함에 따라 다양해진 언어 실천 양상을 분석하고 언어 주체로서책임감을 가지며 국어생활을 한다.","m":"이 성취기준은 점차 복잡해지는 언어 공동체의 다양한 언어 실천 양상을 이해하고 책임감 있는 국어생활을 할 수 있는 능력을 기르기 위해 설정하였다. 사회가 다원화됨에 따라 새롭게 등장하는 언어 실천의 양상을 다루되, 특히 다문화 사회에 진입함에 따른 언어 공동체의 다변화 문제, 남북한 언어 실천의 이질화 문제와 통일 시대를 대비한 동질성 회복 방안 등을 중점적으로 다루어, 의사소통 상황에서 발생할 수 있는 갈등과 차별을 예상하고 이에 대응하며, 언어 주체로서 책임감을 가지고 언어 실천에 참여하는 태도를 기르도록 한다.","n":[],"p":373,"b":2},{"c":"[10공국1-04-02]","k":"선택","sk":"공통 과목","s":"공통국어(청각장애)1·2","g":"고등학교 1학년(선택 중심 공통과목)","d":"문법","t":"음운 변동을 탐구하여 발음과 표기에 올바르게 적용한다.","m":"","n":[],"p":373,"b":2},{"c":"[10공국1-04-03]","k":"선택","sk":"공통 과목","s":"공통국어(청각장애)1·2","g":"고등학교 1학년(선택 중심 공통과목)","d":"문법","t":"다양한 분야의 글과 담화에 나타난 문법 요소 및 어휘의 표현 효과를 평가하고 적절한 표현을 생성한다.","m":"이 성취기준은 다양한 분야의 글과 담화에서 문법 요소와 어휘를 통해 실현되는 언어 주체의 태도와 인식을 파악하고 표현 효과를 평가하여, 문법 요소와 어휘를 적절히 사용할 수 있는 능력을 기르기 위해 설정하였다. 참여자 간의 관계나 장면의 격식성 등 상황 맥락에 따라 달리 쓰인 높임 표현의 효과, 시간의 경과가 드러나거나 시간에 대한 인식이 중요한 기능을 하는 글이나 담화에 쓰인 시간 표현의 효과, 신문 기사, 뉴스 보도, 학술문, 토론, 강연 등 특정 글이나 담화 종류에서 두드러지게 쓰이는 피동 표현과 인용 표현의 효과 등을 언어 주체의 태도 및 인식과 관련하여 종합적으로 탐구하고, 글이나 담화 맥락에 적절한 표현을 생성하도록 한다. 또한, 화제에 대한 필자의 태도나 입장이 드러나는 어휘, 학술적인 글이나 담화에 사용되는 사고 도구어와 전문어 등을 대상으로 하여, 글이나 담화의 맥락이나 종류, 분야에 따른 어휘 선택과 효과를 다루고 이러한 어휘를 활용하여 글이나 담화에 적절한 표현을 생성하도록 한다.","n":[],"p":373,"b":2},{"c":"[10공국1-04-04]","k":"선택","sk":"공통 과목","s":"공통국어(청각장애)1·2","g":"고등학교 1학년(선택 중심 공통과목)","d":"문법","t":"수어의 언어적 특성을 이해하고, 수어의 언어 규칙을 탐구한다.","m":"이 성취기준은 수어의 언어적 특성을 이해하고, 수어의 언어 규칙을 탐구하고 익힐 수 있게 설정하였다. 수어는 문자 언어처럼 시각적 언어 기호로 작용하지만 음성 언어처럼 즉시성과 대면성이 있다. 수어의 이러한 언어적 특성을 문자 및 음성 언어와 비교를 통해 분석⋅탐구하게 하여 수어 언어 규칙을 탐색하고 이해할 수 있게 한다.","n":[],"p":373,"b":2},{"c":"[10공국1-05-01]","k":"선택","sk":"공통 과목","s":"공통국어(청각장애)1·2","g":"고등학교 1학년(선택 중심 공통과목)","d":"문학","t":"문학 소통의 특성을 고려하며 문학 소통에 참여한다.","m":"이 성취기준은 문학 소통의 특성을 이해하고 그 효과를 생각하며 능동적으로 문학을 향유하는 능력을 기르기 위해 설정하였다. 문학은 일상적 언어 활동과는 달리 한 작품을 둘러싸고 작가 맥락, 독자 맥락, 사회⋅문화적 맥락, 문학사적 맥락 등이 다층적으로 작용하는 특성이 있다. 또한 실용적 목적보다는 허구와 상상을 통해 아름다움이나 재미를 추구하는 경향이 강하며, 작가와 독자의 소통에 작품의 아름다움과 가치를 평가하는 비평의 담론이 더하여져서 더욱 풍부한 소통의 장이 펼쳐진다. 이러한 문학 소통의 특성을 이해하고, 능동적인 감상자의 역할은 물론 전문적이지는 않더라도 작품을 쓰거나 비평하는 활동을 시도하면서 문학 소통에 주체적으로 참여하도록 한다.","n":[],"p":375,"b":2},{"c":"[10공국1-05-02]","k":"선택","sk":"공통 과목","s":"공통국어(청각장애)1·2","g":"고등학교 1학년(선택 중심 공통과목)","d":"문학","t":"갈래에 따른 형상화 방법의 특성을 고려하며 작품을 수용한다.","m":"","n":[],"p":375,"b":2},{"c":"[10공국1-05-03]","k":"선택","sk":"공통 과목","s":"공통국어(청각장애)1·2","g":"고등학교 1학년(선택 중심 공통과목)","d":"문학","t":"작품 구성 요소의 유기적 관계와 맥락에 유의하여 작품을 수용하고 생산한다.","m":"이 성취기준은 문학 작품 내적으로는 구성 요소들이 유기적 관계를 형성하고 있고, 외적으로는 다양한 맥락들과 연관되어 있음을 이해하며 작품을 수용하고 생산하는 능력을 기르기 위해 설정하였다. 문학을 수용하고 생산할 때는 문학 작품의 각 구성 요소들이 유기적 관계를 맺음으로써 개별 요소의 합을 넘어서는 고유한 가치와 개성을 가지게 된다는 점에 유의할 필요가 있다. 또 문학 작품은 시간이 흐름에 따라 새로운 독자와 새로운 시대를 만나게 되고 다른 작품들과의 관계도 새롭게 형성되기 때문에 이전과는 다른 각도에서 조명되며 새로운 의미와 가치를 가지게 된다는 점도 중요하게 인식할 필요가 있다. 이러한 점들에 유의하면서 작품 구성 요소들의 관계, 그리고 작품을 둘러싼 맥락을 다각도로 살피며 작품을 수용하고 생산할 수 있게 한다.","n":[],"p":375,"b":2},{"c":"[10공국1-05-04]","k":"선택","sk":"공통 과목","s":"공통국어(청각장애)1·2","g":"고등학교 1학년(선택 중심 공통과목)","d":"문학","t":"작품에 대한 비평을 말⋅글⋅수어 등의 적절한 의사소통 양식으로 표현한다.","m":"이 성취기준은 문학 소통의 특성을 이해하고 문학 작품에 대한 비평을 자신이 선호하는 의사소통 방법으로 표현하는 능력을 기르기 위해 설정하였다. 문학 작품의 비평 대상은 문학의 수용 생산을 돕는 글, 수어 영상 도서 또는 수어 창작물을 포함한 다양한 문학작품에서 이루어지며, 자신이 선호하는 의사소통 방법으로 비평하도록 함으로써 문학 소통에 적극적으로 참여하도록 한다.","n":[],"p":375,"b":2},{"c":"[10공국1-06-01]","k":"선택","sk":"공통 과목","s":"공통국어(청각장애)1·2","g":"고등학교 1학년(선택 중심 공통과목)","d":"매체","t":"사회적 의제를 다룬 매체 자료를 비판적으로 분석한다.","m":"이 성취기준은 사회적 의제를 다룬 매체 자료를 주체적으로 분석하고 수용할 수 있는 역량을 기르기 위해 설정하였다. 현대 사회의 사회적 의제를 다룬 영화, 뉴스, 개인 방송 등 다양한 유형의 매체 자료를 사회⋅문화적 맥락을 고려하여 비판적으로 분석하여 매체 자료가 전달하는 주제를 주체적으로 수용할 수 있도록 한다.","n":[],"p":377,"b":2},{"c":"[10공국1-06-02]","k":"선택","sk":"공통 과목","s":"공통국어(청각장애)1·2","g":"고등학교 1학년(선택 중심 공통과목)","d":"매체","t":"소통 맥락과 매체 특성을 고려하여 다양한 목적의 매체 자료를 제작한다.","m":"이 성취기준은 매체 소통의 맥락과 특성을 이해하고, 적절한 매체를 선정하여 매체 자료를 제작하는 역량을 기르기 위해 설정하였다. 매체 소통의 영향력을 이해하고 소통 목적에 맞는 매체를 선정하여 지역 문화 소개하기, 캠페인 참여하기 등 사회⋅문화적 특성을 반영한 다양한 매체 자료를 책임감 있게 제작함으로써 사회적 소통에 능동적으로 참여한다.","n":[],"p":377,"b":2},{"c":"[10공국1-06-03]","k":"선택","sk":"공통 과목","s":"공통국어(청각장애)1·2","g":"고등학교 1학년(선택 중심 공통과목)","d":"매체","t":"다양한 청각장애 지원 매체를 살펴보고, 편의성을 높일 수 있는 매체를 제작한다.","m":"이 성취기준은 다양한 청각장애 지원 매체를 사용자 측면에서 살펴보고, 사용자의 편의성을 높일 수 있는 청각장애 지원 매체를 제작하는 능력을 기르기 위해 설정하였다. 학생들이 사용하는 다양한 청각장애 지원 매체 및 일반 매체의 편의성을 분석하여 청각장애인의 편의성을 높이기 위해 매체들이 유지⋅발전할 점과 보완해야 할 점을 논리적으로 제시한다. 또한 실제 생활 속에서 청각장애인의 편의성을 높일 수 있는 매체를 현실성을 고려해 제안하거나 제작할 수 있게 한다.","n":[],"p":377,"b":2},{"c":"[10공국2-01-01]","k":"선택","sk":"공통 과목","s":"공통국어(청각장애)1·2","g":"고등학교 1학년(선택 중심 공통과목)","d":"듣기⋅말하기","t":"청중의 관심과 요구에 맞게 내용을 구성하여 발표하고 청중의 질문에 효과적으로 답변한다.","m":"이 성취기준은 청중과 상호 작용하는 발표 능력을 기르기 위해 설정하였다. 예상 청중의 관심사, 배경지식, 주제에 대한 태도, 지적 수준 등을 분석하기, 청중 분석 결과를 바탕으로 청중에게 적합한 내용을 선정하기, 발표 내용을 청중이 이해하기 쉽도록 요점을 중심으로 체계적으로 조직하기, 청중의 관심을 유지하기 위한 다양한 전략을 활용하여 발표하기, 청중과 질의응답할 수 있는 시간을 확보하기 위해 발표 시간 조절하기, 청중의 질문에 효과적으로 답변하며 청중과 소통하기 등을 학습한다.","n":[],"p":382,"b":2},{"c":"[10공국2-01-02]","k":"선택","sk":"공통 과목","s":"공통국어(청각장애)1·2","g":"고등학교 1학년(선택 중심 공통과목)","d":"듣기⋅말하기","t":"쟁점과 이해관계를 고려하여 문제를 해결할 수 있는 대안을 탐색하며 협상한다.","m":"이 성취기준은 협상에 대한 이해와 실행을 통해 개인 또는 집단의 갈등을 조정하여 문제를 해결하는 능력을 기르기 위해 설정하였다. 협상의 중요성과 협상이 필요한 상황 이해하기, 협상의 진행 절차 이해하기, 일련의 절차에 따라 협상 의제로 부각된 쟁점을 중심으로 의견 조정하기, 표면적으로 드러난 입장의 이면에 숨겨진 근원적인 동기를 고려하여 대안 마련하기, 상대의 의견을 존중하며 표현하기 등을 학습한다.","n":[],"p":382,"b":2},{"c":"[10공국2-01-03]","k":"선택","sk":"공통 과목","s":"공통국어(청각장애)1·2","g":"고등학교 1학년(선택 중심 공통과목)","d":"듣기⋅말하기","t":"사회적 소통 과정에서 말의 영향력을 고려하여 책임감 있게 듣고 말한다.","m":"","n":[],"p":382,"b":2},{"c":"[10공국2-01-04]","k":"선택","sk":"공통 과목","s":"공통국어(청각장애)1·2","g":"고등학교 1학년(선택 중심 공통과목)","d":"듣기⋅말하기","t":"말⋅수어 등의 표현전략을 사용하여 상대방과 소통하고, 담화의 의미를 공유한다.","m":"이 성취기준은 자신에게 적합한 말⋅수어 등의 표현전략을 사용하여 의사소통의 세 가지 요소인 공감하기와 효과적인 자기표현, 상호 존중하기를 학습함으로써 활발한 의사전달과 상호 교류가 충분히 이루어질 수 있는 담화 활동을 하도록 하기 귀해 설정하였다. 담화의 궁극적인 목적이 정보 교류와 친교에 있음을 인식하고 말하는 이와 듣는 이가 일정한 상황 속에서 주고받는 담화의 공유를 위해서 말하는 이의 의도, 듣는 이의 처지, 맥락, 전달하고자 하는 내용 등을 고려하는 것을 학습한다.","n":[],"p":382,"b":2},{"c":"[10공국2-02-01]","k":"선택","sk":"공통 과목","s":"공통국어(청각장애)1·2","g":"고등학교 1학년(선택 중심 공통과목)","d":"읽기","t":"복합양식으로 구성된 글이나 자료에 내재된 필자의 관점이나 의도, 표현 방법을 평가하며 읽는다.","m":"","n":[],"p":384,"b":2},{"c":"[10공국2-02-02]","k":"선택","sk":"공통 과목","s":"공통국어(청각장애)1·2","g":"고등학교 1학년(선택 중심 공통과목)","d":"읽기","t":"동일한 화제의 글이나 자료라도 서로 다른 관점과 형식으로 표현됨을 이해하며 읽기목적을 고려하여 글이나 자료를 주제 통합적으로 읽는다.","m":"이 성취기준은 동일한 화제에 대하여 다양한 관점과 형식으로 작성된 글이나 자료를 읽으며 읽기 목적에 따라 글이나 자료를 비판적으로 재구성할 수 있는 주제 통합적 읽기 능력을 기르기 위해 설정하였다. 읽기 상황이나 과제와 관련하여 읽기 목적을 구체화하기, 글이나 자료를 비교 분석하기, 읽기 목적을 고려하여 유의미한 정보 선별하기, 정보 간의 상충되거나 모순되는 점을 확인하고 평가하기, 읽기 목적을 고려하며 화제에 대한 자신의 견해를 재구성하기 등을 학습한다.","n":[],"p":384,"b":2},{"c":"[10공국2-02-03]","k":"선택","sk":"공통 과목","s":"공통국어(청각장애)1·2","g":"고등학교 1학년(선택 중심 공통과목)","d":"읽기","t":"의미 있는 사회적 독서 활동에 참여함으로써 타인과 교류하고 다양한 지식이나 정보,삶에 대한 가치관 등을 이해하는 태도를 지닌다.","m":"","n":[],"p":384,"b":2},{"c":"[10공국2-02-04]","k":"선택","sk":"공통 과목","s":"공통국어(청각장애)1·2","g":"고등학교 1학년(선택 중심 공통과목)","d":"읽기","t":"다양한 시각적 영상자료와 수어 영상 도서 등을 읽고 내용을 이해하고 감상하면서 읽기의 즐거움을 느낀다.","m":"이 성취기준은 감성적 읽기를 통해 읽기의 즐거움을 제공하고자 설정하였으며, 주로 문학 작품을 읽고 공감하고 감동하면서 작품 속에 형상화된 인물들의 삶을 살펴보거나, 세계에 대한 이해와 안목을 높임으로써 읽기의 즐거움을 느끼는 데 목적이 있다. 청각장애 학생은 책뿐만 아니라 다양한 시각적 영상자료와 수어 영상 도서를 통해 문학 작품을 접할 수 있으므로 작품을 보고 자신의 삶과 연관 지어 다양하게 상상하기, 작품에 대한 자신의 생각과 느낌을 자유롭게 말 또는 수어로 표현하기, 다른 사람의 감상을 경청하기 등 문학 작품을 올바르게 감상하는 태도를 학습한다.","n":[],"p":384,"b":2},{"c":"[10공국2-03-01]","k":"선택","sk":"공통 과목","s":"공통국어(청각장애)1·2","g":"고등학교 1학년(선택 중심 공통과목)","d":"쓰기","t":"언어 공동체가 공유하는 작문 관습의 특성을 이해하고 쓰기 과정과 전략을 점검하며 책임감 있게 글을 쓴다.","m":"","n":[],"p":386,"b":2},{"c":"[10공국2-03-02]","k":"선택","sk":"공통 과목","s":"공통국어(청각장애)1·2","g":"고등학교 1학년(선택 중심 공통과목)","d":"쓰기","t":"논증 요소에 따른 분석을 바탕으로 효과적으로 내용을 조직하여 논증하는 글을 쓴다.","m":"이 성취기준은 논증 요소를 중심으로 글을 쓸 수 있는 능력을 기르기 위해설정하였다. 논증의 요소는 주장과 그 주장을 지지하는 객관적 자료인 근거, 근거를 바탕으로 주장을 가능하게 하는 주관적 요인인 이유, 예상되는 반론과 이에 대한 반박 등을 포함한다. 논증 요소와 이들 요소 간의 관계, 연역과 귀납 등의 논증 방법을 활용하여 효과적으로 내용 조직하기 등을 학습한다.","n":[],"p":386,"b":2},{"c":"[10공국2-03-03]","k":"선택","sk":"공통 과목","s":"공통국어(청각장애)1·2","g":"고등학교 1학년(선택 중심 공통과목)","d":"쓰기","t":"신뢰할 수 있는 정보를 종합하여 복합양식 자료가 포함된 공동 보고서를 쓴다.","m":"이 성취기준은 수집한 정보의 가치를 판단하고 정보를 종합하여 공동으로 글을 쓰는 능력을 기르기 위해 설정하였다. 특정 주제에 대하여 관심 있는 학생들이 함께 모여서 연구를 수행하고 보고서를 작성하기 위한 공동 보고서 주제 찾기, 주제에 따른 목차 구성하기, 정보의 신뢰성 판단하기, 수집한 자료를 보고서의 형식에 맞게 조직하기, 복합양식 자료를 효과적으로 활용하기, 협력적 태도로 공동 보고서 작성하기 등을 학습한다.","n":[],"p":386,"b":2},{"c":"[10공국2-03-04]","k":"선택","sk":"공통 과목","s":"공통국어(청각장애)1·2","g":"고등학교 1학년(선택 중심 공통과목)","d":"쓰기","t":"타당한 근거와 객관적인 자료를 제시하여 자신의 의견과 주장을 설득력 있게 표현하는 글을 쓴다.","m":"이 성취기준은 자신의 주장이나 의견, 생각 등을 논리에 맞게 전개하여 독자를 설득하는 글쓰기 능력을 기르기 위해서 설정하였다. 청각장애 학생은 수어로 청자를 설득하고 자신의 주장을 논리적으로 전개한 경우라도 자신이 설득력 있게 전달한 것을 문장으로 전환하는 데 약점이 있다. 문제에 대한 해결책과 이를 뒷받침하는 타당한 근거가 부재할 경우 독자를 설득하기란 불가능함을 알고, 설득력 있는 글을 쓰기 전에 먼저 충분한 근거와 자료를 수집하고, 개요를 작성하고, 서론-본론-결론에 따른 자신의 의견과 주장을 뒷받침하는 근거를 적절히 기술하는 방법을 학습한다.","n":[],"p":386,"b":2},{"c":"[10공국2-04-01]","k":"선택","sk":"공통 과목","s":"공통국어(청각장애)1·2","g":"고등학교 1학년(선택 중심 공통과목)","d":"문법","t":"과거 및 현재의 국어생활에 나타나는 국어의 변화를 이해하고 국어문화 발전에 참여한다.","m":"","n":[],"p":388,"b":2},{"c":"[10공국2-04-02]","k":"선택","sk":"공통 과목","s":"공통국어(청각장애)1·2","g":"고등학교 1학년(선택 중심 공통과목)","d":"문법","t":"한글 맞춤법의 원리를 적용하여 국어생활을 성찰하고 문제를 해결한다.","m":"이 성취기준은 한글 맞춤법의 원리를 적용하여 자신의 국어생활을 성찰하고 실생활에서 발생하는 국어 문제를 해결하는 능력을 길러 교양 있는 표기 생활을 영위하도록 하기 위해 설정하였다. 중학교 1~3학년 ‘국어(청각장애)’의 한글맞춤법 관련 성취기준에서 한글 맞춤법의 총칙을 중심으로 기본 원리에 대해 학습한 것을 바탕으로, 실제 국어생활에서 자주 혼동되는 표기나 띄어쓰기와 관련된 한글 맞춤법의 조항을 찾아 문제를 해결하도록 하는 데 중점을 둔다. 또한 ‘공통국어(청각장애)1’의 음운 변동 관련 성취기준에서 학습한 지식과 연계된 조항을 다루어 한글 맞춤법에 대한 이해를 심화할 수 있다.","n":[],"p":388,"b":2},{"c":"[10공국2-04-03]","k":"선택","sk":"공통 과목","s":"공통국어(청각장애)1·2","g":"고등학교 1학년(선택 중심 공통과목)","d":"문법","t":"다양한 수어 표현을 탐구하여 비교하고, 자신의 언어생활을 성찰한다.","m":"이 성취기준은 다양한 수어 표현을 이해하고 자신의 음성 언어, 문자 언어, 수어 등을 활용한 언어생활을 성찰하는 능력을 기르기 위해 설정하였다. 하나의 대상물을 나타내기 위해 다양한 수어 표현을 사용하고 있음을 알고, 여러 가지 수어 표현이 생긴 까닭을 탐구한다. 또한 자신의 언어생활을 점검하고 성찰하는 태도를 기른다.","n":[],"p":388,"b":2},{"c":"[10공국2-05-01]","k":"선택","sk":"공통 과목","s":"공통국어(청각장애)1·2","g":"고등학교 1학년(선택 중심 공통과목)","d":"문학","t":"한국 문학사의 흐름을 고려하여 작품을 수용한다.","m":"이 성취기준은 개별 작품을 한국 문학사의 흐름 속에서 파악하고 그 가치를 이해하는 능력을 기르기 위해 설정하였다. 한국 문학사가 전개되는 과정에 나타나는 특성, 갈래나 작품 형식의 변화, 향유층의 다양화 등을 고려하며 작품을 수용하게 되면, 개별작품의 가치와 의미를 더 입체적으로 파악할 수 있게 된다. 한 작품이 다른 여러 작품들과 관계 맺는 양상은 물론 그 관계들로 형성되는 문학사적 맥락 속에서 개별 작품이 가지는 가치와 의의 등을 생각하면서 작품을 수용하도록 한다.","n":[],"p":389,"b":2},{"c":"[10공국2-05-02]","k":"선택","sk":"공통 과목","s":"공통국어(청각장애)1·2","g":"고등학교 1학년(선택 중심 공통과목)","d":"문학","t":"주체적인 관점에서 작품을 해석하고 평가하며 문학을 생활화하는 태도를 지닌다.","m":"이 성취기준은 작품을 주체적인 관점에서 해석하고 작품에 대해 능동적으로 평가할 수 있는 안목을 기르기 위해 설정하였다. 다른 사람의 생각을 존중하고 해석의 다양성에 대한 이해를 높이는 한편 자신의 해석과 평가를 설득력 있게 표현하도록 함으로써 문학을 생활화하는 태도를 지닐 수 있도록 한다.","n":[],"p":389,"b":2},{"c":"[10공국2-05-03]","k":"선택","sk":"공통 과목","s":"공통국어(청각장애)1·2","g":"고등학교 1학년(선택 중심 공통과목)","d":"문학","t":"작가 관점에서 글⋅수어 작품을 맥락에 유의하여 창작한다.","m":"이 성취기준은 청각장애 학생이 문학 작품을 자신이 선호하는 의사소통 방법으로 창작하도록 설정하였다. 문학 작품 창작은 작가의 관점에서 자신의 작품을 대하는 독자와 사회공동체의 가치관 등에 유의하여 표현하며, 문학 생산의 주체자로서 창작의 즐거움을 지닐 수 있도록 한다. 또한 농인의 언어와 문화에 관심을 지니도록 하며 이중 언어⋅이중 문화 접근의 관점에서 수어와 농인 문화가 지니는 가치를 존중하고 문학 창작에 활용할 것을 권장한다.","n":[],"p":389,"b":2},{"c":"[10공국2-06-01]","k":"선택","sk":"공통 과목","s":"공통국어(청각장애)1·2","g":"고등학교 1학년(선택 중심 공통과목)","d":"매체","t":"매체 비평 자료를 비판적으로 수용하고 자신의 관점을 담아 매체 비평 자료를 제작한다.","m":"이 성취기준은 전문성 있는 기존의 매체 비평 자료에 대한 이해를 바탕으로 매체 자료를 비판적으로 수용하는 방법을 익히고, 더 나아가 주체적으로 매체 비평 자료를 생산할 수 있는 능력을 기르기 위해 설정하였다. 매체 자료에 대해 학습자 스스로 비평하는 활동을 수행한 후 복수의 매체 비평 자료를 참조하여 자신이 비평한 내용과 어떤 공통점 및 차이점이 있는지, 참조한 비평 자료에서는 어떤 특징이 두드러지는지 등을 분석해 본다. 이러한 경험을 토대로 다양한 매체 자료에 대해 주체적으로 비평하는 활동에 참여할 수 있도록 한다.","n":[],"p":391,"b":2},{"c":"[10공국2-06-02]","k":"선택","sk":"공통 과목","s":"공통국어(청각장애)1·2","g":"고등학교 1학년(선택 중심 공통과목)","d":"매체","t":"매체의 변화가 소통 문화에 끼치는 영향을 탐구한다.","m":"이 성취기준은 매체의 변천을 역사적 관점에서 이해하고 매체를 기반으로 한 소통 문화를 탐구할 수 있는 역량을 기르기 위해 설정하였다. 매체의 변화는 매체를 기반으로 한 소통 문화의 변화에 영향을 끼치고 있다. 무선 인터넷의 보급과 스마트폰의 활용, 개인 방송 등 매체 변화로 인해 생겨난 소통 문화의 특성, 패러디 문화의 양상, 매체 기반의 소통에서 나타나는 언어의 특징과 유행, 사회 관계망 서비스(SNS)에서 이루어지는 소통 특성 등에 대한 깊이 있는 탐구를 통해 우리의 매체 소통 문화를 이해하고 성찰하는 기회를 갖도록 한다.","n":[],"p":391,"b":2},{"c":"[10공국2-06-03]","k":"선택","sk":"공통 과목","s":"공통국어(청각장애)1·2","g":"고등학교 1학년(선택 중심 공통과목)","d":"매체","t":"청각장애 관련 다양한 매체 비평 자료를 비판적으로 수용하고, 관점을 담은 비평 텍스트를 생산한다.","m":"이 성취기준은 청각장애를 주제로 다룬 다양한 매체 비평 자료를 비판적으로 수용하고, 자신의 관점이 포함된 비평 텍스트를 생산하는 능력을 기르기 위해 설정하였다. 비평 텍스트를 수용하고 생산하는 과정에서 자신만의 관점을 정립할 수 있게 하고 자료를 바탕으로 논리적으로 자신의 생각을 표현하는 능력을 기른다.","n":[],"p":391,"b":2},{"c":"[12직준01-01]","k":"선택","sk":"전문 교과(직업·생활)","s":"직업준비","g":"고등학교 1~3학년","d":"자아 인식","t":"나의 기본 정보와 특성을 파악한다.","m":"자아 인식은 자아 정체감을 형성하는 데 기본이 되는 능력이다. 이러한 능력을 발전시키려면 단계적인 자기 이해 교육이 필요한데, 초등학교는 자신의 특성을 발견하고 인식하는 과정, 중학교는 적성을 파악하고 탐색하는 과정, 고등학교는 개인별 진로 특성을 점검하고 보완하는 과정에서 신장될 수 있다. 이 성취기준은 진로 탐색, 진로 계획의 기초가 될 학습으로 이력서에 작성할 자신의 기본 정보 외에 타인과 대화, 질문, 표준화된 검사 등을 활용하여
